ans": 2}, {"id": "m3l10t2", "type": "sc", "sc": "<code dir=\"ltr\">NotificationService<\/code> يعيد عند الفشل أحيانًا <code dir=\"ltr\">False<\/code> وأحيانًا <code dir=\"ltr\">None<\/code> وأحيانًا يرفع <code dir=\"ltr\">Exception<\/code>، وأسماء دواله <code dir=\"ltr\">sendMail<\/code> و <code dir=\"ltr\">push_sms<\/code> و <code dir=\"ltr\">DoNotify<\/code>.", "q": "<p>أي مبدأ مُنتهَك؟<\/p>", "exp": "<p>غياب الاتساق في معالجة الأخطاء وفي التسمية يجعل سلوك النظام غير متوقع.<\/p>", "opts": ["Liskov Substitution", "Composition over Inheritance", "Conceptual Integrity", "CAP theorem"], "ans": 2}, {"id": "m3l10t3", "type": "mc", "q": "<p>ما العلاقة الصحيحة بين Encapsulation و Information Hiding؟<\/p>", "exp": "<p>يمكن وجود encapsulation شكلي يكشف القرارات الداخلية عبر getters، فلا يتحقق information hiding.<\/p>", "opts": ["الـ encapsulation آلية للتجميع والتحكم في الوصول، والـ information hiding مبدأ لإخفاء القرارات؛ والأولى تساعد على الثانية ولا تضمنها", "الـ information hiding تعني تشفير البيانات", "هما مصطلحان لمعنى واحد تمامًا", "الـ encapsulation تعني الوراثة"], "ans": 0}, {"id": "m3l10t4", "type": "tf", "q": "<p>الـ Sequence Diagram يتابع object واحدًا عبر كل حياته، والـ State Diagram يتابع عملية واحدة عبر عدة objects.<\/p>", "exp": "<p>العكس تمامًا: الـ sequence لعملية واحدة عبر عدة objects، والـ state لـ object واحد عبر حياته.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m3l10t5", "type": "sc", "sc": "<code dir=\"ltr\">class Car(Engine)<\/code> كُتبت «لإعادة استعمال <code dir=\"ltr\">start()<\/code>».", "q": "<p>ما التصحيح؟<\/p>", "exp": "<p>السيارة ليست نوعًا من المحرّكات، بل تملك محرّكًا. الوراثة لإعادة استعمال الكود دون is-a خطأ.<\/p>", "opts": ["نسخ <code dir=\"ltr\">start()<\/code> في <code dir=\"ltr\">Car<\/code>", "<code dir=\"ltr\">class Engine(Car)<\/code>", "إبقاء الوراثة وإضافة تعليق", "<code dir=\"ltr\">Car<\/code> يحتوي <code dir=\"ltr\">Engine<\/code> ويفوّض إليه: composition"], "ans": 3}, {"id": "m3l10t6", "type": "sa", "q": "<p>ما اسم المبدأ الذي يطلب أن يصلح الـ subclass بديلًا عن أبيه؟ (الاختصار أو الاسم الكامل بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Liskov Substitution Principle (LSP)<\/b>.<\/p>", "kw": ["LSP", "liskov"]}]}]}, {"t": "التكامل والتنفيذ: تطوير تطبيق قائم", "g": "اجمع كل ما سبق وطبّقه على <b>تطبيق Python موجود<\/b>: افهمه، حلّل المتطلبات الجديدة، حدّث التصميم، ثم عدّل الكود دون كسر ما يعمل.", "lessons": [{"t": "فهم Codebase قائم", "intro": "<p>في الواقع نادرًا ما تبدأ من مشروع فارغ. معظم عمل المطوّر صيانة وتوسيع تطبيقات موجودة. في هذه الوحدة نعمل على تطبيق ملاحظات صغير بلغة Python (الـ roadmap الأصلي يستعمل تطبيق Java/Android، وحوّلناه إلى Python مع الحفاظ على المهارات نفسها).<\/p>", "items": [{"t": "لماذا نبدأ بالفهم لا بالكتابة؟", "html": "<p>المطوّرون يقضون وقتًا في <b>قراءة<\/b> الكود أكثر بكثير مما يقضون في كتابته. والتعديل دون فهم هو أسرع طريق لكسر شيء يعمل.<\/p>\n<p>ما الذي يجب فهمه قبل أي تعديل؟<\/p>\n<ul><li>بنية المشروع (project structure).<\/li><li>الـ classes الموجودة.<\/li><li>العلاقات بين الـ classes.<\/li><li>السلوك الحالي للتطبيق.<\/li><li>قرارات التصميم القائمة.<\/li><li>كيف تتفاعل المكوّنات.<\/li><li>أي الأجزاء يجب تعديلها.<\/li><\/ul>\n<p>هذه العملية تسمّى <b>reverse engineering<\/b>: الانتقال من الكود إلى النموذج (عكس الوحدتين 2 و 3 حيث انتقلنا من النموذج إلى الكود). وأدواتك هي نفسها: class diagram للبنية، و sequence diagram للسلوك، و state diagram لدورات الحياة.<\/p>\n<p>قاعدة تسمّى <b>Chesterton's Fence<\/b>: إذا وجدت سياجًا في طريق ولا تعرف سبب وجوده، فلا تهدمه حتى تعرف. الكود الغريب قد يكون حلًّا لمشكلة لا تعرفها بعد.<\/p>", "q": {"id": "m4l1c1", "type": "mc", "q": "<p>ما المقصود بـ reverse engineering في هذا السياق؟<\/p>", "exp": "<p>ننتقل من الكود إلى النموذج لنفهم البنية والسلوك قبل التعديل.<\/p>", "opts": ["ترجمة الكود إلى لغة أخرى", "استخراج نموذج التصميم (مثل class diagram) من كود موجود", "حذف الكود القديم", "إعادة كتابة التطبيق من الصفر"], "ans": 1}}, {"t": "بنية المشروع ونقاط الدخول", "html": "<p>هذا هو التطبيق الذي سنعمل عليه في كل الوحدة (ملف واحد <code dir=\"ltr\">notes_app.py<\/code>). اقرأه بتمعّن:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> datetime <span class=\"kw\">import<\/span> datetime\n\n<span class=\"kw\">class<\/span> Note:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, title: str, body: str):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> title.strip():\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Title is required\"<\/span>)\n        <span class=\"kw\">self<\/span>.title = title\n        <span class=\"kw\">self<\/span>.body = body\n        <span class=\"kw\">self<\/span>.created_at = datetime.now()\n\n<span class=\"kw\">class<\/span> User:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str):\n        <span class=\"kw\">self<\/span>.name = name\n        <span class=\"kw\">self<\/span>._notes: list[Note] = []\n\n    <span class=\"kw\">def<\/span> add_note(<span class=\"kw\">self<\/span>, title: str, body: str) -&gt; Note:\n        note = Note(title, body)\n        <span class=\"kw\">self<\/span>._notes.append(note)\n        <span class=\"kw\">return<\/span> note\n\n    <span class=\"kw\">def<\/span> delete_note(<span class=\"kw\">self<\/span>, title: str) -&gt; bool:\n        <span class=\"kw\">for<\/span> note <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._notes:\n            <span class=\"kw\">if<\/span> note.title == title:\n                <span class=\"kw\">self<\/span>._notes.remove(note)\n                <span class=\"kw\">return<\/span> <span class=\"kw\">True<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">False<\/span>\n\n    <span class=\"kw\">def<\/span> notes(<span class=\"kw\">self<\/span>) -&gt; list[Note]:\n        <span class=\"kw\">return<\/span> list(<span class=\"kw\">self<\/span>._notes)\n\n<span class=\"kw\">class<\/span> NotesCLI:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, user: User):\n        <span class=\"kw\">self<\/span>._user = user\n\n    <span class=\"kw\">def<\/span> run_command(<span class=\"kw\">self<\/span>, command: str, *args: str) -&gt; str:\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"add\"<\/span>:\n            note = <span class=\"kw\">self<\/span>._user.add_note(args[<span class=\"nu\">0<\/span>], args[<span class=\"nu\">1<\/span>])\n            <span class=\"kw\">return<\/span> f<span class=\"st\">\"Added: {note.title}\"<\/span>\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"list\"<\/span>:\n            <span class=\"kw\">return<\/span> <span class=\"st\">\"\\n\"<\/span>.join(n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._user.notes()) <span class=\"kw\">or<\/span> <span class=\"st\">\"(no notes)\"<\/span>\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"delete\"<\/span>:\n            <span class=\"kw\">return<\/span> <span class=\"st\">\"Deleted\"<\/span> <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>._user.delete_note(args[<span class=\"nu\">0<\/span>]) <span class=\"kw\">else<\/span> <span class=\"st\">\"Not found\"<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"st\">\"Unknown command\"<\/span><\/code><\/pre><\/div>\n<p>كيف تبدأ قراءة أي مشروع؟<\/p>\n<ol><li><b>الخريطة<\/b>: ما الملفات والـ packages؟ اقرأ الـ README والاختبارات إن وُجدت، فالاختبارات توثيق قابل للتشغيل.<\/li><li><b>نقطة الدخول (entry point)<\/b>: من أين يبدأ التنفيذ؟ هنا <code dir=\"ltr\">NotesCLI.run_command<\/code>. في Django تكون <code dir=\"ltr\">urls.py<\/code> ثم الـ views.<\/li><li><b>اتبع الخيط<\/b>: من نقطة الدخول إلى الداخل، ولا تقرأ الملفات أبجديًا.<\/li><\/ol>", "q": {"id": "m4l1c2", "type": "mc", "q": "<p>ما نقطة الدخول التي يتعامل معها المستخدم في <code dir=\"ltr\">notes_app.py<\/code>؟<\/p>", "exp": "<p>الـ CLI هو الـ boundary: يستقبل أمر المستخدم ثم يستدعي <code dir=\"ltr\">User<\/code>، ومنه نتتبّع بقية الكود.<\/p>", "opts": ["<code dir=\"ltr\">NotesCLI.run_command<\/code>", "<code dir=\"ltr\">datetime.now<\/code>", "<code dir=\"ltr\">Note.__init__<\/code>", "<code dir=\"ltr\">User.notes<\/code>"], "ans": 0}}, {"t": "استخراج الـ Classes والعلاقات", "html": "<p>نطبّق جدول «من الكود إلى العلاقة» (القسم 2.6) على <code dir=\"ltr\">notes_app.py<\/code>:<\/p>\n<div class=\"tw\"><table><thead><tr><th>ما نراه في الكود<\/th><th>الاستنتاج<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">self._notes: list[Note] = []<\/code> داخل <code dir=\"ltr\">User<\/code><\/td><td><code dir=\"ltr\">User<\/code> يعرف صفرًا أو أكثر من <code dir=\"ltr\">Note<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">Note(title, body)<\/code> يُنشأ <b>داخل<\/b> <code dir=\"ltr\">add_note<\/code> ولا يُشارك<\/td><td>composition: <code dir=\"ltr\">User 1 ◆── 0..* Note<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">self._user = user<\/code> مُمرَّر إلى <code dir=\"ltr\">NotesCLI<\/code><\/td><td>association: <code dir=\"ltr\">NotesCLI ──&gt; 1 User<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">Note<\/code> لا يشير إلى <code dir=\"ltr\">User<\/code><\/td><td>الـ navigability من <code dir=\"ltr\">User<\/code> إلى <code dir=\"ltr\">Note<\/code> فقط<\/td><\/tr><\/tbody><\/table><\/div>\n<p>الـ class diagram المستخرج:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>NotesCLI ────────&gt; 1 User 1 ◆──────── 0..* Note\n\nNote:  + title: str, + body: str, + created_at: datetime\nUser:  + name: str, - notes: list[Note]\n       + add_note(title, body): Note, + delete_note(title): bool, + notes(): list[Note]\nNotesCLI: + run_command(command, *args): str<\/code><\/pre><\/div>\n<p>وتصنيف الوحدة 1: <code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">User<\/code> هما entities، و <code dir=\"ltr\">NotesCLI<\/code> هو boundary. لا يوجد control object مستقل: <code dir=\"ltr\">User<\/code> ينسّق عملياته بنفسه، وهذا مقبول لتطبيق بهذا الحجم.<\/p>", "q": {"id": "m4l1c3", "type": "mc", "q": "<p>لماذا صنّفنا العلاقة بين <code dir=\"ltr\">User<\/code> و <code dir=\"ltr\">Note<\/code> composition وليست aggregation؟<\/p>", "exp": "<p>الإنشاء داخل الكل والملكية الحصرية علامتا الـ composition في الكود.<\/p>", "opts": ["لأن <code dir=\"ltr\">User<\/code> ينشئ الـ <code dir=\"ltr\">Note<\/code> داخله ويملكه حصريًا، فلا يعيش خارج قائمته", "لأن عدد الملاحظات ثابت", "لأن <code dir=\"ltr\">Note<\/code> يرث من <code dir=\"ltr\">User<\/code>", "لأن <code dir=\"ltr\">Note<\/code> يُمرَّر جاهزًا من الخارج"], "ans": 0}}, {"t": "تتبّع السلوك وقراءة قرارات التصميم", "html": "<p><b>السلوك الحالي<\/b>: نتتبّع أمر <code dir=\"ltr\">add<\/code> ونكتبه كـ sequence diagram نصي:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Person -&gt; NotesCLI : run_command(\"add\", title, body)\nNotesCLI -&gt; User : add_note(title, body)\nUser -&gt; Note : create(title, body)\nalt [title is blank]\n    Note --&gt; User : ValueError\nelse\n    Note --&gt; User : note\n    User --&gt; NotesCLI : note\n    NotesCLI --&gt; Person : \"Added: &lt;title&gt;\"\nend<\/code><\/pre><\/div>\n<p><b>قرارات التصميم القائمة<\/b> (نستنتجها من الكود ونسجّلها):<\/p>\n<ol><li>قاعدة «العنوان مطلوب» في <code dir=\"ltr\">Note.__init__<\/code>: الـ entity تحمي نفسها. قرار جيد.<\/li><li><code dir=\"ltr\">notes()<\/code> تعيد <b>نسخة<\/b> من القائمة (<code dir=\"ltr\">list(self._notes)<\/code>): حماية للحالة الداخلية. جيد.<\/li><li>الحذف <b>بالعنوان<\/b>: يفترض ضمنيًا أن العناوين فريدة، ولا شيء يفرض ذلك. نقطة ضعف.<\/li><li>attributes الـ <code dir=\"ltr\">Note<\/code> عامة وقابلة للتعديل المباشر، فيمكن كتابة <code dir=\"ltr\">note.title = \"\"<\/code> وتجاوز القاعدة. نقطة ضعف.<\/li><li>لا تخزين دائم: كل شيء في الذاكرة.<\/li><\/ol>\n<p>لاحظ: نسجّل نقاط الضعف، لكننا <b>لا نصلحها الآن<\/b> ما لم تتطلب المهمة ذلك. إصلاح كل شيء دفعة واحدة يوسّع التغيير ويرفع المخاطرة.<\/p>", "q": {"id": "m4l1c4", "type": "sc", "sc": "أثناء قراءة الكود وجدت أن <code dir=\"ltr\">delete_note<\/code> تحذف <b>أول<\/b> ملاحظة تطابق العنوان فقط، حتى لو تكرّر العنوان. المهمة المطلوبة منك هي إضافة البحث.", "q": "<p>ما التصرف الأنسب؟<\/p>", "exp": "<p>قد يعتمد على هذا السلوك كود آخر أو مستخدمون. تغييره قرار مستقل يُناقش ويُختبر وحده، لا أثر جانبي لمهمة أخرى.<\/p>", "opts": ["حذف <code dir=\"ltr\">delete_note<\/code> من التطبيق", "تجاهلها كأنك لم ترها", "إعادة كتابة <code dir=\"ltr\">delete_note<\/code> فورًا بطريقتك", "توثيق الملاحظة وإبلاغ الفريق، دون تغيير سلوك الحذف ضمن هذه المهمة"], "ans": 3}}, {"t": "تحديد الأجزاء التي يجب تعديلها", "html": "<p>قبل التعديل نحدّد <b>أين<\/b> سيقع، و<b>ما<\/b> الذي قد يتأثر. هذا يسمّى <b>impact analysis<\/b> (تحليل الأثر).<\/p>\n<p>الطريقة:<\/p>\n<ol><li>من يستعمل الجزء الذي سأغيّره؟ ابحث عن كل استدعاء (في المحرّر «Find usages» أو <code dir=\"ltr\">grep<\/code>).<\/li><li>اتبع الأسهم <b>الداخلة<\/b> إلى الـ class في الـ class diagram: كل سهم داخل طرف قد يتأثر.<\/li><li>صنّف الأجزاء:<\/li><\/ol>\n<div class=\"tw\"><table><thead><tr><th>التصنيف<\/th><th>المعنى<\/th><th>في تطبيقنا عند إضافة تصنيفات للملاحظات<\/th><\/tr><\/thead><tbody><tr><td>يتغيّر<\/td><td>كوده سيُعدَّل<\/td><td><code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">User.add_note<\/code><\/td><\/tr><tr><td>يتأثر<\/td><td>لا يُعدَّل لكنه يستعمل ما تغيّر، فيُعاد اختباره<\/td><td><code dir=\"ltr\">NotesCLI<\/code><\/td><\/tr><tr><td>معزول<\/td><td>لا علاقة له بالتغيير<\/td><td><code dir=\"ltr\">User.delete_note<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>هنا يظهر عائد التصميم الجيد: في نظام منخفض الاقتران يكون عمود «يتغيّر» قصيرًا. في نظام متشابك يدخل فيه نصف المشروع.<\/p>\n<p>ومن التحليل نعرف <b>ماذا نختبر<\/b> بعد التعديل: كل ما في الصفّين الأول والثاني.<\/p>", "q": {"id": "m4l1c5", "type": "mc", "q": "<p>ما الهدف من impact analysis قبل التعديل؟<\/p>", "exp": "<p>التحليل يحدّد نطاق التغيير ومخاطره قبل لمس الكود.<\/p>", "opts": ["معرفة الأجزاء التي ستتغيّر والأجزاء التي قد تتأثر، لتحديد حجم العمل وما يجب اختباره", "زيادة عدد الملفات", "تأخير بدء العمل", "اختيار لغة برمجة جديدة"], "ans": 0}}], "test": [{"id": "m4l1t1", "type": "mc", "q": "<p>ما الترتيب السليم للتعامل مع codebase جديد عليك؟<\/p>", "exp": "<p>نبدأ بالصورة العامة، ثم نتتبّع مسارًا حقيقيًا من نقطة الدخول، ونثبّت الفهم في مخطط.<\/p>", "opts": ["حذف ما لا تفهمه", "خريطة المشروع ثم نقطة الدخول ثم تتبّع عملية كاملة ثم رسم النموذج", "قراءة الملفات بالترتيب الأبجدي", "التعديل أولًا ثم القراءة عند ظهور خطأ"], "ans": 1}, {"id": "m4l1t2", "type": "sc", "sc": "في كود قائم: <code dir=\"ltr\">class Cart: def __init__(self, customer): self.customer = customer; self.lines = []<\/code> و <code dir=\"ltr\">def add(self, product, qty): self.lines.append(CartLine(product, qty))<\/code>.", "q": "<p>ما العلاقات المستخرجة؟<\/p>", "exp": "<p>العميل مُمرَّر من الخارج (association)، وسطور السلة تُنشأ داخلها (composition)، والسطر يعرف منتجًا موجودًا مسبقًا (association).<\/p>", "opts": ["<code dir=\"ltr\">Cart<\/code> يرث من <code dir=\"ltr\">Customer<\/code>", "<code dir=\"ltr\">Cart ──&gt; Customer<\/code> هي association، و <code dir=\"ltr\">Cart ◆── CartLine<\/code> هي composition، و <code dir=\"ltr\">CartLine ──&gt; Product<\/code> هي association", "<code dir=\"ltr\">CartLine ◆── Cart<\/code>", "لا توجد أي علاقات"], "ans": 1}, {"id": "m4l1t3", "type": "tf", "q": "<p>عند العثور على كود غريب في مشروع قائم، الأفضل حذفه فورًا لتنظيف المشروع.<\/p>", "exp": "<p>قاعدة Chesterton's Fence: افهم سبب وجوده أولًا. قد يعالج حالة لا تعرفها.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m4l1t4", "type": "sa", "q": "<p>ما اسم عملية تحديد الأجزاء التي ستتغيّر أو تتأثر قبل تنفيذ التعديل؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Impact analysis<\/b>.<\/p>", "kw": ["impact"]}]}, {"t": "فهم المتطلبات المحدَّثة", "intro": "<p>فهمنا التطبيق كما هو. الآن وصلت متطلبات جديدة. قبل الكود نفهم <b>ماذا تعني للتصميم الحالي<\/b>.<\/p>", "items": [{"t": "قراءة المتطلبات الجديدة", "html": "<p>التطبيق يدعم حاليًا تدوين ملاحظات بسيطًا. المتطلبات الجديدة:<\/p>\n<ul><li><b>Categorizing notes<\/b>: تصنيف الملاحظات.<\/li><li><b>Searching notes<\/b>: البحث في الملاحظات.<\/li><li><b>Sharing notes<\/b>: مشاركة الملاحظات.<\/li><li><b>Adding reminders<\/b>: إضافة تذكيرات.<\/li><\/ul>\n<p>هذه عناوين غامضة. نطبّق أدوات الوحدة 1: نحوّلها إلى User Stories مع acceptance criteria:<\/p>\n<div class=\"note\">As a user, I want to assign a category to a note so that I can find related notes together.<\/div>\n<ol><li>الملاحظة لها تصنيف واحد على الأكثر، ويمكن أن تبقى بلا تصنيف.<\/li><li>يمكن عرض ملاحظات تصنيف معيّن.<\/li><li>الملاحظات القديمة (بلا تصنيف) تبقى تعمل كما كانت.<\/li><\/ol>\n<p>المعيار الثالث خاص بتطوير نظام قائم: <b>ما كان يعمل يجب أن يبقى يعمل<\/b>.<\/p>\n<p>ولا ننسى أسئلة التوضيح. «المشاركة» مثلًا: هل تعني تصدير نص الملاحظة، أم منح مستخدم آخر حق قراءتها؟ الفرق بين التفسيرين ساعة عمل مقابل أسبوع. نفترض هنا المعنى الأبسط: توليد نص قابل للإرسال.<\/p>", "q": {"id": "m4l2c1", "type": "mc", "q": "<p>لماذا نحوّل «Sharing notes» إلى user story مع acceptance criteria قبل التصميم؟<\/p>", "exp": "<p>الغموض في المتطلب يتحوّل إلى تصميم خاطئ. التوضيح الآن أرخص من إعادة البناء لاحقًا.<\/p>", "opts": ["لتأخير بدء العمل", "لأن القواعد تفرض كتابة stories دائمًا دون سبب", "لأن Python تتطلب ذلك", "لأن العنوان غامض ويحتمل تفسيرات تختلف جذريًا في التصميم والتكلفة"], "ans": 3}}, {"t": "أسئلة تحليل الأثر على التصميم", "html": "<p>لكل متطلب جديد نطرح الأسئلة الخمسة التالية:<\/p>\n<ol><li><b>Do we need new classes?<\/b> هل نحتاج classes جديدة؟<\/li><li><b>Should existing classes change?<\/b> هل تتغيّر classes موجودة؟<\/li><li><b>Are new responsibilities required?<\/b> هل ظهرت مسؤوليات جديدة؟ ولمن؟<\/li><li><b>Do current relationships need modification?<\/b> هل تتغيّر العلاقات الحالية؟<\/li><li><b>Will new features affect existing functionality?<\/b> هل تتأثر الوظائف القائمة؟<\/li><\/ol>\n<p>تطبيقها على متطلباتنا:<\/p>\n<div class=\"tw\"><table><thead><tr><th>المتطلب<\/th><th>Classes جديدة؟<\/th><th>تغيير في الموجود؟<\/th><th>علاقات جديدة<\/th><\/tr><\/thead><tbody><tr><td>Categories<\/td><td><code dir=\"ltr\">Category<\/code><\/td><td><code dir=\"ltr\">Note<\/code> يعرف تصنيفه<\/td><td><code dir=\"ltr\">Note * ──&gt; 0..1 Category<\/code><\/td><\/tr><tr><td>Search<\/td><td>لا<\/td><td>مسؤولية جديدة: <code dir=\"ltr\">Note.matches(query)<\/code> و <code dir=\"ltr\">User.search(query)<\/code><\/td><td>لا<\/td><\/tr><tr><td>Sharing<\/td><td>لا<\/td><td>مسؤولية جديدة: <code dir=\"ltr\">Note.share_text()<\/code><\/td><td>لا<\/td><\/tr><tr><td>Reminders<\/td><td><code dir=\"ltr\">Reminder<\/code><\/td><td><code dir=\"ltr\">Note<\/code> يملك تذكيرًا اختياريًا<\/td><td><code dir=\"ltr\">Note 1 ◆── 0..1 Reminder<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>لاحظ توزيع المسؤوليات بمبدأ Information Expert: من يعرف نص الملاحظة ليحكم هل يطابق كلمة البحث؟ الـ <code dir=\"ltr\">Note<\/code> نفسها. لهذا <code dir=\"ltr\">matches<\/code> فيها، والـ <code dir=\"ltr\">User<\/code> يجمع النتائج فقط.<\/p>", "q": {"id": "m4l2c2", "type": "sc", "sc": "متطلب جديد: «يمكن وسم الملاحظة بعدة tags، والـ tag الواحد يظهر على ملاحظات كثيرة».", "q": "<p>ما أثره على التصميم؟<\/p>", "exp": "<p>مفهوم جديد له هويته، وعلاقة many-to-many. <code dir=\"ltr\">Note<\/code> يتغيّر ليعرف وسومه.<\/p>", "opts": ["class جديد <code dir=\"ltr\">Tag<\/code> وعلاقة <code dir=\"ltr\">Note * ── * Tag<\/code>، مع تعديل <code dir=\"ltr\">Note<\/code> ليحتفظ بقائمة tags", "حذف <code dir=\"ltr\">Category<\/code> واستعمال الاسم نفسه", "لا أثر، يكفي تعليق في الكود", "<code dir=\"ltr\">Tag<\/code> يرث من <code dir=\"ltr\">Note<\/code>"], "ans": 0}}, {"t": "التغيير أم التوسعة؟", "html": "<p>أمامك دائمًا طريقان لتلبية متطلب جديد:<\/p>\n<ul><li><b>Modification<\/b>: تعديل كود موجود.<\/li><li><b>Extension<\/b>: إضافة كود جديد بجانب الموجود دون لمسه.<\/li><\/ul>\n<p>التوسعة <b>أأمن<\/b>: الكود الذي لم يُلمس لا ينكسر. والتصميم الجيد هو الذي يجعل المتطلبات الجديدة تتحقق بالإضافة غالبًا. هذا يسمّى <b>Open/Closed Principle<\/b>: مفتوح للتوسعة، مغلق أمام التعديل (سنعود إليه في الوحدة 5).<\/p>\n<p>في تطبيقنا:<\/p>\n<ul><li><code dir=\"ltr\">Category<\/code> و <code dir=\"ltr\">Reminder<\/code>: <b>إضافة<\/b> classes جديدة. مخاطرة منخفضة.<\/li><li><code dir=\"ltr\">Note.matches<\/code> و <code dir=\"ltr\">Note.share_text<\/code>: <b>إضافة<\/b> methods إلى class موجود دون تغيير القديمة. مخاطرة منخفضة.<\/li><li>تغيير توقيع <code dir=\"ltr\">add_note<\/code> ليستقبل التصنيف: <b>تعديل<\/b>. مخاطرة أعلى، لأن كل من يستدعيها قد ينكسر.<\/li><\/ul>\n<p>كيف نقلّل مخاطرة التعديل؟ بجعله <b>متوافقًا مع القديم<\/b>: parameter جديد اختياري بقيمة افتراضية.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> add_note(<span class=\"kw\">self<\/span>, title: str, body: str, category: <span class=\"st\">\"Category | None\"<\/span> = <span class=\"kw\">None<\/span>) -&gt; Note:<\/code><\/pre><\/div>\n<p>كل الاستدعاءات القديمة <code dir=\"ltr\">add_note(title, body)<\/code> تبقى صحيحة.<\/p>", "q": {"id": "m4l2c3", "type": "tf", "q": "<p>إضافة parameter اختياري بقيمة افتراضية إلى method موجودة يحافظ على عمل الاستدعاءات القديمة.<\/p>", "exp": "<p>المستدعون القدامى لا يمرّرون الـ parameter الجديد فيأخذ قيمته الافتراضية، ويبقى سلوكهم كما كان.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}], "test": [{"id": "m4l2t1", "type": "mc", "q": "<p>ما الأسئلة التي تُطرح عند وصول متطلبات جديدة لنظام قائم؟<\/p>", "exp": "<p>هذه أسئلة تحليل أثر المتطلب على التصميم.<\/p>", "opts": ["كم عدد الأسطر التي سنكتبها؟", "ما أحدث framework؟", "هل نعيد كتابة النظام بلغة أخرى؟", "هل نحتاج classes جديدة؟ هل تتغيّر الموجودة؟ هل تتغيّر العلاقات؟ هل تتأثر الوظائف القائمة؟"], "ans": 3}, {"id": "m4l2t2", "type": "sc", "sc": "متطلب «إضافة تذكيرات» في تطبيق الملاحظات. اقترح زميل وضع <code dir=\"ltr\">reminder_date<\/code> و <code dir=\"ltr\">reminder_sent<\/code> و <code dir=\"ltr\">check_reminder()<\/code> و <code dir=\"ltr\">send_reminder_email()<\/code> كلها داخل <code dir=\"ltr\">Note<\/code>.", "q": "<p>ما رأيك؟<\/p>", "exp": "<p>التذكير مفهوم له بياناته وسلوكه. وإرسال البريد شأن آخر تمامًا لا يخص الملاحظة.<\/p>", "opts": ["اقتراح ممتاز لأنه يقلّل عدد الـ classes", "يجب وضعها في <code dir=\"ltr\">User<\/code>", "يضعف تماسك <code dir=\"ltr\">Note<\/code>؛ الأفضل class مستقل <code dir=\"ltr\">Reminder<\/code> تملكه الملاحظة، وإرسال البريد عبر خدمة إشعار", "يجب وضعها في <code dir=\"ltr\">NotesCLI<\/code>"], "ans": 2}, {"id": "m4l2t3", "type": "tf", "q": "<p>معيار القبول «الوظائف القائمة تبقى تعمل كما كانت» مهم خصوصًا عند تطوير نظام موجود.<\/p>", "exp": "<p>الحفاظ على السلوك القائم شرط نجاح أساسي في أي تعديل على نظام يعمل.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}]}, {"t": "تحديث الـ UML Class Diagram", "intro": "<p>قبل لمس الكود نحدّث النموذج. تغيير صندوق وسهم أرخص من تغيير classes.<\/p>", "items": [{"t": "إضافة الـ Classes الجديدة", "html": "<p>النموذج <b>قبل<\/b>: <code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">User<\/code> (مع <code dir=\"ltr\">NotesCLI<\/code>).<\/p>\n<p>النموذج <b>بعد<\/b> إضافة التصنيفات والتذكيرات: <code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">User<\/code> و <code dir=\"ltr\">Category<\/code> و <code dir=\"ltr\">Reminder<\/code>.<\/p>\n<figure class=\"fig\" dir=\"ltr\"><svg viewBox=\"0 0 810 290\" width=\"810\" role=\"img\" aria-label=\"Notes app class diagram after new requirements\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"30\" width=\"150\" height=\"56\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"95.0\" y=\"49\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >User<\/text><line x1=\"20\" y1=\"58\" x2=\"170\" y2=\"58\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"28\" y=\"76\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- name: str<\/text><rect x=\"300\" y=\"20\" width=\"200\" height=\"120\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"400.0\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Note<\/text><line x1=\"300\" y1=\"48\" x2=\"500\" y2=\"48\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"308\" y=\"66\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- title: str<\/text><text x=\"308\" y=\"84\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- body: str<\/text><line x1=\"300\" y1=\"94\" x2=\"500\" y2=\"94\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"308\" y=\"112\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ matches(q): bool<\/text><text x=\"308\" y=\"130\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ share_text(): str<\/text><rect x=\"640\" y=\"30\" width=\"150\" height=\"56\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"715.0\" y=\"49\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Category<\/text><line x1=\"640\" y1=\"58\" x2=\"790\" y2=\"58\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"648\" y=\"76\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- name: str<\/text><rect x=\"310\" y=\"200\" width=\"180\" height=\"84\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"400.0\" y=\"219\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Reminder<\/text><line x1=\"310\" y1=\"228\" x2=\"490\" y2=\"228\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"318\" y=\"246\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- due_at: datetime<\/text><line x1=\"310\" y1=\"256\" x2=\"490\" y2=\"256\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"318\" y=\"274\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ is_due(now): bool<\/text><line x1=\"188\" y1=\"60\" x2=\"300\" y2=\"60\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(170,60) rotate(180)\"><polygon points=\"0,0 -9,-5.5 -18,0 -9,5.5\" style=\"stroke:var(--ink);fill:var(--ink)\"/><\/g><text x=\"192\" y=\"52\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >1<\/text><text x=\"282\" y=\"52\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >*<\/text><line x1=\"500\" y1=\"60\" x2=\"640\" y2=\"60\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(640,60) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"506\" y=\"52\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >*<\/text><text x=\"596\" y=\"52\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >0..1<\/text><line x1=\"400\" y1=\"158\" x2=\"400\" y2=\"200\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(400,140) rotate(-90)\"><polygon points=\"0,0 -9,-5.5 -18,0 -9,5.5\" style=\"stroke:var(--ink);fill:var(--ink)\"/><\/g><text x=\"408\" y=\"174\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >1<\/text><text x=\"408\" y=\"194\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >0..1<\/text><\/svg><\/figure>\n<p>كيف قررنا أن <code dir=\"ltr\">Category<\/code> class وليست مجرد نص <code dir=\"ltr\">category: str<\/code> داخل <code dir=\"ltr\">Note<\/code>؟ سألنا: هل لها هوية وسلوك خاصان؟<\/p>\n<ul><li>إذا كانت مجرد وسم نصي لا يُعاد تسميته ولا يُعرض وحده: attribute يكفي (YAGNI).<\/li><li>إذا احتجنا إعادة تسمية التصنيف مرة واحدة فتتغيّر كل ملاحظاته، أو عرض قائمة التصنيفات: class.<\/li><\/ul>\n<p>متطلبنا يطلب «عرض ملاحظات تصنيف معيّن»، ومن المتوقع إدارة التصنيفات، فاخترنا class.<\/p>\n<p>أما <code dir=\"ltr\">Reminder<\/code> فهو class لأن له بيانات (موعد) وسلوكًا (<code dir=\"ltr\">is_due<\/code>) لا يخصّان الملاحظة.<\/p>", "q": {"id": "m4l3c1", "type": "mc", "q": "<p>متى يكفي تمثيل مفهوم جديد كـ attribute بسيط بدل class مستقل؟<\/p>", "exp": "<p>الـ class يُستحق بوجود هوية أو سلوك أو مشاركة. غير ذلك attribute يكفي.<\/p>", "opts": ["حين يكون اسمه قصيرًا", "دائمًا، لتقليل عدد الـ classes", "أبدًا، فكل مفهوم يجب أن يكون class", "حين يكون قيمة بسيطة بلا هوية ولا سلوك خاص ولا يُشارك أو يُدار وحده"], "ans": 3}}, {"t": "تحديد المسؤوليات والعلاقات", "html": "<p>نعود إلى بطاقات CRC للـ classes الجديدة والمعدَّلة:<\/p>\n<div class=\"tw\"><table><thead><tr><th>Class<\/th><th>Responsibilities<\/th><th>Collaborators<\/th><\/tr><\/thead><tbody><tr><td>Category<\/td><td>Know its name<\/td><td>(لا أحد)<\/td><\/tr><tr><td>Reminder<\/td><td>Know due time; tell if it is due<\/td><td>(لا أحد)<\/td><\/tr><tr><td>Note (معدَّل)<\/td><td>Know title, body, category; match a search query; produce share text; own its reminder<\/td><td>Category, Reminder<\/td><\/tr><tr><td>User (معدَّل)<\/td><td>Own notes; search notes; list notes by category<\/td><td>Note, Category<\/td><\/tr><\/tbody><\/table><\/div>\n<p>والعلاقات مع تبرير كل اختيار:<\/p>\n<div class=\"tw\"><table><thead><tr><th>العلاقة<\/th><th>النوع والـ multiplicity<\/th><th>السبب<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">Note ──&gt; Category<\/code><\/td><td>association، <code dir=\"ltr\">* ──&gt; 0..1<\/code><\/td><td>التصنيف يعيش مستقلًا وتشترك فيه ملاحظات كثيرة. والملاحظة قد تكون بلا تصنيف<\/td><\/tr><tr><td><code dir=\"ltr\">Note ◆── Reminder<\/code><\/td><td>composition، <code dir=\"ltr\">1 ◆── 0..1<\/code><\/td><td>التذكير لا معنى له دون ملاحظته ويُحذف معها<\/td><\/tr><tr><td><code dir=\"ltr\">User ◆── Note<\/code><\/td><td>composition، <code dir=\"ltr\">1 ◆── *<\/code><\/td><td>لم تتغيّر<\/td><\/tr><\/tbody><\/table><\/div>\n<p>قرار navigability: <code dir=\"ltr\">Note<\/code> يعرف <code dir=\"ltr\">Category<\/code>، وليس العكس. لعرض ملاحظات تصنيف نسأل <code dir=\"ltr\">User<\/code> أن يصفّي ملاحظاته. هكذا نتجنّب علاقة باتجاهين يجب إبقاء طرفيها متّسقين.<\/p>", "q": {"id": "m4l3c2", "type": "mc", "q": "<p>لماذا العلاقة بين <code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">Reminder<\/code> هي composition بينما العلاقة بين <code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">Category<\/code> هي association؟<\/p>", "exp": "<p>معيار التمييز هو الملكية الحصرية وارتباط العمر.<\/p>", "opts": ["التذكير ملك حصري للملاحظة ويفنى معها، أما التصنيف فمستقل وتشترك فيه ملاحظات كثيرة", "لأن <code dir=\"ltr\">Reminder<\/code> اسمه أطول", "لأن <code dir=\"ltr\">Category<\/code> يرث من <code dir=\"ltr\">Note<\/code>", "لا فرق، الاختيار عشوائي"], "ans": 0}}, {"t": "فحص النموذج الجديد مقابل المبادئ", "html": "<p>قبل الانتقال إلى الكود نتحقق أن التصميم الجديد يحافظ على المبادئ:<\/p>\n<ul><li><b>Abstraction<\/b>: هل كل class جديد يمثّل مفهومًا واضحًا بخصائص تهمّ السياق فقط؟ <code dir=\"ltr\">Reminder<\/code> يحمل الموعد ولا يحمل تفاصيل الإرسال. نعم.<\/li><li><b>Encapsulation<\/b>: هل <code dir=\"ltr\">Note<\/code> تحمي حالتها؟ التذكير يُضبط عبر method (<code dir=\"ltr\">set_reminder<\/code>) تتحقق من الموعد، وليس بإسناد مباشر. نعم.<\/li><li><b>Separation of Concerns<\/b>: هل تسرّب شأن غريب؟ البحث منطق مجال في <code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">User<\/code>. تنسيق العرض يبقى في <code dir=\"ltr\">NotesCLI<\/code>. نعم.<\/li><li><b>Cohesion<\/b>: هل صار <code dir=\"ltr\">Note<\/code> مثقلًا؟ يعرف بياناته، ويطابق بحثًا، وينتج نص مشاركة، ويملك تذكيرًا. كلها حول الملاحظة نفسها. مقبول، ويُراقَب.<\/li><li><b>Coupling<\/b>: هل ظهرت اعتمادات جديدة؟ <code dir=\"ltr\">Note<\/code> صار يعرف <code dir=\"ltr\">Category<\/code> و <code dir=\"ltr\">Reminder<\/code>. اعتمادان بسيطان في اتجاه واحد. مقبول.<\/li><li><b>اتساق النماذج<\/b>: كل operation جديدة في المخطط تقابلها رسالة في سيناريو ما (search، share، set reminder).<\/li><\/ul>\n<p>هذا الفحص يأخذ دقائق، ويمنع أن يتحوّل التعديل إلى بداية تدهور التصميم. هذا التدهور التدريجي يسمّى <b>software rot<\/b> أو design erosion.<\/p>", "q": {"id": "m4l3c3", "type": "sc", "sc": "في النموذج المحدَّث وضع زميلك <code dir=\"ltr\">send_email()<\/code> و <code dir=\"ltr\">format_for_terminal()<\/code> داخل <code dir=\"ltr\">Reminder<\/code>.", "q": "<p>أي مبدأين يخالفهما ذلك؟<\/p>", "exp": "<p>الإرسال والتنسيق للعرض شأنان غريبان عن التذكير. مكانهما خدمة إشعار وطبقة العرض.<\/p>", "opts": ["لا يخالف أي مبدأ", "Multiplicity و Navigability", "Generalization و Polymorphism", "Separation of Concerns و Cohesion"], "ans": 3}}], "test": [{"id": "m4l3t1", "type": "mc", "q": "<p>ما الفائدة من تحديث الـ class diagram قبل تعديل الكود؟<\/p>", "exp": "<p>النموذج مكان رخيص للتجربة والنقاش واكتشاف الأخطاء.<\/p>", "opts": ["يغني عن الاختبار", "اكتشاف مشاكل التصميم والتعديل وهو رخيص، والاتفاق على التغيير قبل تنفيذه", "يجعل الكود أسرع", "لا فائدة، هو إجراء شكلي"], "ans": 1}, {"id": "m4l3t2", "type": "sc", "sc": "متطلب: «كل ملاحظة يجب أن تنتمي إلى تصنيف واحد بالضبط».", "q": "<p>كيف تتغيّر العلاقة <code dir=\"ltr\">Note * ──&gt; 0..1 Category<\/code>، وما أثر ذلك على الملاحظات القديمة؟<\/p>", "exp": "<p><code dir=\"ltr\">0..1<\/code> تصير <code dir=\"ltr\">1<\/code> أي إجباريًا. والبيانات القائمة التي تخالف القاعدة الجديدة تحتاج ترحيلًا (migration).<\/p>", "opts": ["تُحذف الملاحظات القديمة", "تصير وراثة", "تبقى كما هي", "تصير <code dir=\"ltr\">* ──&gt; 1<\/code>، ويجب إسناد تصنيف افتراضي (مثل General) للملاحظات الموجودة بلا تصنيف"], "ans": 3}, {"id": "m4l3t3", "type": "tf", "q": "<p>في النموذج المحدَّث، <code dir=\"ltr\">Category<\/code> يحتفظ بقائمة ملاحظاته و <code dir=\"ltr\">Note<\/code> يحتفظ بتصنيفه (علاقة باتجاهين) هو الخيار الأبسط دائمًا.<\/p>", "exp": "<p>العلاقة باتجاهين تتطلب تحديث الطرفين معًا في كل تغيير، وهذا مصدر أخطاء. اتجاه واحد يكفي غالبًا.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}]}, {"t": "ترجمة التصميم إلى كود", "intro": "<p>النموذج جاهز ومفحوص. ننفّذه مع الحفاظ على الوظائف القائمة.<\/p>", "items": [{"t": "شبكة الأمان أولًا ثم إنشاء الـ Classes الجديدة", "html": "<p>قبل أي تعديل نثبّت السلوك الحالي باختبارات تسمّى <b>characterization tests<\/b>: اختبارات تسجّل ما يفعله الكود <b>الآن<\/b>، لنعرف فورًا إن كسرنا شيئًا.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># test_notes_app.py  (يُشغَّل بالأمر: pytest)<\/span>\n<span class=\"kw\">import<\/span> pytest\n<span class=\"kw\">from<\/span> notes_app <span class=\"kw\">import<\/span> User, NotesCLI\n\n<span class=\"kw\">def<\/span> test_add_and_list():\n    cli = NotesCLI(User(<span class=\"st\">\"Sara\"<\/span>))\n    <span class=\"kw\">assert<\/span> cli.run_command(<span class=\"st\">\"add\"<\/span>, <span class=\"st\">\"Shopping\"<\/span>, <span class=\"st\">\"milk\"<\/span>) == <span class=\"st\">\"Added: Shopping\"<\/span>\n    <span class=\"kw\">assert<\/span> cli.run_command(<span class=\"st\">\"list\"<\/span>) == <span class=\"st\">\"Shopping\"<\/span>\n\n<span class=\"kw\">def<\/span> test_delete():\n    user = User(<span class=\"st\">\"Sara\"<\/span>)\n    user.add_note(<span class=\"st\">\"A\"<\/span>, <span class=\"st\">\"x\"<\/span>)\n    <span class=\"kw\">assert<\/span> user.delete_note(<span class=\"st\">\"A\"<\/span>) <span class=\"kw\">is<\/span> <span class=\"kw\">True<\/span>\n    <span class=\"kw\">assert<\/span> user.delete_note(<span class=\"st\">\"A\"<\/span>) <span class=\"kw\">is<\/span> <span class=\"kw\">False<\/span>\n\n<span class=\"kw\">def<\/span> test_blank_title_rejected():\n    <span class=\"kw\">with<\/span> pytest.raises(ValueError):\n        User(<span class=\"st\">\"Sara\"<\/span>).add_note(<span class=\"st\">\"  \"<\/span>, <span class=\"st\">\"x\"<\/span>)<\/code><\/pre><\/div>\n<p>ثم نبدأ بالأسهل والأأمن: <b>إنشاء<\/b> الـ classes الجديدة، فهي لا تمسّ الموجود.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> datetime <span class=\"kw\">import<\/span> datetime\n\n<span class=\"kw\">class<\/span> Category:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> name.strip():\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Category name is required\"<\/span>)\n        <span class=\"kw\">self<\/span>.name = name\n\n<span class=\"kw\">class<\/span> Reminder:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, due_at: datetime):\n        <span class=\"kw\">self<\/span>._due_at = due_at\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> due_at(<span class=\"kw\">self<\/span>) -&gt; datetime:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._due_at\n\n    <span class=\"kw\">def<\/span> is_due(<span class=\"kw\">self<\/span>, now: datetime) -&gt; bool:\n        <span class=\"kw\">return<\/span> now &gt;= <span class=\"kw\">self<\/span>._due_at<\/code><\/pre><\/div>\n<p>لاحظ أن <code dir=\"ltr\">is_due<\/code> تستقبل <code dir=\"ltr\">now<\/code> كـ parameter بدل استدعاء <code dir=\"ltr\">datetime.now()<\/code> بداخلها: هذا يجعلها قابلة للاختبار بأي وقت نريده (loose coupling مع ساعة النظام).<\/p>", "q": {"id": "m4l4c1", "type": "mc", "q": "<p>ما وظيفة الـ characterization tests؟<\/p>", "exp": "<p>هي شبكة أمان: إذا فشل أحدها بعد التعديل فقد غيّرنا سلوكًا قائمًا.<\/p>", "opts": ["توليد الـ class diagram آليًا", "تثبيت السلوك الحالي للكود قبل تعديله، لاكتشاف أي كسر غير مقصود", "قياس سرعة البرنامج", "اختبار الميزات الجديدة فقط"], "ans": 1}}, {"t": "تعديل الـ Classes الموجودة وتحديث الـ Methods والعلاقات", "html": "<p>الآن نعدّل <code dir=\"ltr\">Note<\/code> و <code dir=\"ltr\">User<\/code> بأقل قدر، وبطريقة متوافقة مع القديم:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Note:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, title: str, body: str, category: <span class=\"st\">\"Category | None\"<\/span> = <span class=\"kw\">None<\/span>):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> title.strip():\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Title is required\"<\/span>)\n        <span class=\"kw\">self<\/span>.title = title\n        <span class=\"kw\">self<\/span>.body = body\n        <span class=\"kw\">self<\/span>.created_at = datetime.now()\n        <span class=\"kw\">self<\/span>.category = category                  <span class=\"cm\"># جديد: Note ──&gt; 0..1 Category<\/span>\n        <span class=\"kw\">self<\/span>._reminder: <span class=\"st\">\"Reminder | None\"<\/span> = <span class=\"kw\">None<\/span>  <span class=\"cm\"># جديد: Note ◆── 0..1 Reminder<\/span>\n\n    <span class=\"kw\">def<\/span> matches(<span class=\"kw\">self<\/span>, query: str) -&gt; bool:        <span class=\"cm\"># جديد: Search<\/span>\n        q = query.lower()\n        <span class=\"kw\">return<\/span> q <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>.title.lower() <span class=\"kw\">or<\/span> q <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>.body.lower()\n\n    <span class=\"kw\">def<\/span> share_text(<span class=\"kw\">self<\/span>) -&gt; str:                  <span class=\"cm\"># جديد: Sharing<\/span>\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"{self.title}\\n{'-' * len(self.title)}\\n{self.body}\"<\/span>\n\n    <span class=\"kw\">def<\/span> set_reminder(<span class=\"kw\">self<\/span>, due_at: datetime) -&gt; <span class=\"kw\">None<\/span>:     <span class=\"cm\"># جديد: Reminders<\/span>\n        <span class=\"kw\">self<\/span>._reminder = Reminder(due_at)         <span class=\"cm\"># composition: الملاحظة تنشئ تذكيرها<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> reminder(<span class=\"kw\">self<\/span>) -&gt; <span class=\"st\">\"Reminder | None\"<\/span>:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._reminder\n\n<span class=\"kw\">class<\/span> User:\n    <span class=\"cm\"># ... __init__ و delete_note و notes كما هي دون تغيير ...<\/span>\n\n    <span class=\"kw\">def<\/span> add_note(<span class=\"kw\">self<\/span>, title: str, body: str, category: <span class=\"st\">\"Category | None\"<\/span> = <span class=\"kw\">None<\/span>) -&gt; Note:\n        note = Note(title, body, category)\n        <span class=\"kw\">self<\/span>._notes.append(note)\n        <span class=\"kw\">return<\/span> note\n\n    <span class=\"kw\">def<\/span> search(<span class=\"kw\">self<\/span>, query: str) -&gt; list[Note]:           <span class=\"cm\"># جديد<\/span>\n        <span class=\"kw\">return<\/span> [n <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._notes <span class=\"kw\">if<\/span> n.matches(query)]\n\n    <span class=\"kw\">def<\/span> notes_in(<span class=\"kw\">self<\/span>, category: Category) -&gt; list[Note]: <span class=\"cm\"># جديد<\/span>\n        <span class=\"kw\">return<\/span> [n <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._notes <span class=\"kw\">if<\/span> n.category <span class=\"kw\">is<\/span> category]<\/code><\/pre><\/div>\n<p>ما الذي تغيّر في الموجود؟ توقيعان فقط، وكلاهما بـ parameter اختياري. كل استدعاء قديم <code dir=\"ltr\">add_note(\"A\", \"x\")<\/code> يعمل كما كان. والباقي إضافات.<\/p>", "q": {"id": "m4l4c2", "type": "mc", "q": "<p>استدعاء قديم في الكود: <code dir=\"ltr\">user.add_note(\"Trip\", \"pack bags\")<\/code>. ماذا يحدث له بعد التعديل؟<\/p>", "exp": "<p>الـ parameter الجديد اختياري بقيمة افتراضية <code dir=\"ltr\">None<\/code>، فالاستدعاءات القديمة لا تتأثر.<\/p>", "opts": ["يرفع <code dir=\"ltr\">TypeError<\/code> لنقص parameter", "ينشئ تصنيفًا جديدًا تلقائيًا", "يحذف الملاحظات القديمة", "يعمل كما كان، و <code dir=\"ltr\">category<\/code> تأخذ <code dir=\"ltr\">None<\/code>"], "ans": 3}}, {"t": "دمج الوظائف الجديدة والتأكد من مطابقة التصميم", "html": "<p>ندمج الميزات في نقطة الدخول <code dir=\"ltr\">NotesCLI<\/code> <b>بالإضافة<\/b> دون تعديل الأوامر القديمة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> NotesCLI:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, user: User):\n        <span class=\"kw\">self<\/span>._user = user\n\n    <span class=\"kw\">def<\/span> run_command(<span class=\"kw\">self<\/span>, command: str, *args: str) -&gt; str:\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"add\"<\/span>:\n            note = <span class=\"kw\">self<\/span>._user.add_note(args[<span class=\"nu\">0<\/span>], args[<span class=\"nu\">1<\/span>])\n            <span class=\"kw\">return<\/span> f<span class=\"st\">\"Added: {note.title}\"<\/span>\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"list\"<\/span>:\n            <span class=\"kw\">return<\/span> <span class=\"st\">\"\\n\"<\/span>.join(n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._user.notes()) <span class=\"kw\">or<\/span> <span class=\"st\">\"(no notes)\"<\/span>\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"delete\"<\/span>:\n            <span class=\"kw\">return<\/span> <span class=\"st\">\"Deleted\"<\/span> <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>._user.delete_note(args[<span class=\"nu\">0<\/span>]) <span class=\"kw\">else<\/span> <span class=\"st\">\"Not found\"<\/span>\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"search\"<\/span>:                                   <span class=\"cm\"># جديد<\/span>\n            found = <span class=\"kw\">self<\/span>._user.search(args[<span class=\"nu\">0<\/span>])\n            <span class=\"kw\">return<\/span> <span class=\"st\">\"\\n\"<\/span>.join(n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> found) <span class=\"kw\">or<\/span> <span class=\"st\">\"(no matches)\"<\/span>\n        <span class=\"kw\">if<\/span> command == <span class=\"st\">\"share\"<\/span>:                                    <span class=\"cm\"># جديد<\/span>\n            found = <span class=\"kw\">self<\/span>._user.search(args[<span class=\"nu\">0<\/span>])\n            <span class=\"kw\">return<\/span> found[<span class=\"nu\">0<\/span>].share_text() <span class=\"kw\">if<\/span> found <span class=\"kw\">else<\/span> <span class=\"st\">\"Not found\"<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"st\">\"Unknown command\"<\/span><\/code><\/pre><\/div>\n<p>ثم <b>نراجع الكود مقابل النموذج<\/b> عنصرًا عنصرًا:<\/p>\n<div class=\"tw\"><table><thead><tr><th>في النموذج<\/th><th>في الكود<\/th><th>مطابق؟<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">Note * ──&gt; 0..1 Category<\/code><\/td><td><code dir=\"ltr\">self.category = category<\/code> يقبل <code dir=\"ltr\">None<\/code><\/td><td>نعم<\/td><\/tr><tr><td><code dir=\"ltr\">Note 1 ◆── 0..1 Reminder<\/code><\/td><td><code dir=\"ltr\">self._reminder<\/code>، يُنشأ داخل <code dir=\"ltr\">set_reminder<\/code><\/td><td>نعم<\/td><\/tr><tr><td><code dir=\"ltr\">+ matches(q): bool<\/code><\/td><td><code dir=\"ltr\">def matches(self, query) -&gt; bool<\/code><\/td><td>نعم<\/td><\/tr><tr><td><code dir=\"ltr\">Category<\/code> لا يعرف <code dir=\"ltr\">Note<\/code><\/td><td>لا مرجع في <code dir=\"ltr\">Category<\/code><\/td><td>نعم<\/td><\/tr><\/tbody><\/table><\/div>\n<p>إذا اضطررت أثناء التنفيذ إلى الخروج عن النموذج فهذا مشروع، بشرط: <b>حدّث النموذج<\/b>. نموذج لا يطابق الكود أسوأ من عدم وجود نموذج، لأنه يضلّل من يقرؤه.<\/p>", "q": {"id": "m4l4c3", "type": "tf", "q": "<p>إذا اختلف الكود عن الـ class diagram أثناء التنفيذ، يُترك المخطط كما هو لأنه «وثيقة تصميم أصلية».<\/p>", "exp": "<p>المخطط الذي لا يطابق الكود يضلّل. إمّا أن يعود الكود إلى التصميم أو يُحدَّث المخطط.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "اختبار التطبيق المعدَّل", "html": "<p>الاختبار بعد التعديل يجيب عن سؤالين:<\/p>\n<p><b>1) هل ما كان يعمل ما زال يعمل؟<\/b> نشغّل الـ characterization tests القديمة <b>دون تغيير حرف فيها<\/b>. يجب أن تنجح كلها.<\/p>\n<p><b>2) هل الجديد يعمل كما طُلب؟<\/b> نكتب اختبارًا لكل acceptance criterion:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> datetime <span class=\"kw\">import<\/span> datetime, timedelta\n<span class=\"kw\">from<\/span> notes_app <span class=\"kw\">import<\/span> User, Category\n\n<span class=\"kw\">def<\/span> test_search_matches_title_and_body_case_insensitive():\n    user = User(<span class=\"st\">\"Sara\"<\/span>)\n    user.add_note(<span class=\"st\">\"Shopping\"<\/span>, <span class=\"st\">\"milk and bread\"<\/span>)\n    user.add_note(<span class=\"st\">\"Work\"<\/span>, <span class=\"st\">\"send report\"<\/span>)\n    <span class=\"kw\">assert<\/span> [n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> user.search(<span class=\"st\">\"MILK\"<\/span>)] == [<span class=\"st\">\"Shopping\"<\/span>]\n    <span class=\"kw\">assert<\/span> user.search(<span class=\"st\">\"xyz\"<\/span>) == []\n\n<span class=\"kw\">def<\/span> test_notes_in_category_and_uncategorized_notes_still_work():\n    user, work = User(<span class=\"st\">\"Sara\"<\/span>), Category(<span class=\"st\">\"Work\"<\/span>)\n    user.add_note(<span class=\"st\">\"Report\"<\/span>, <span class=\"st\">\"q3\"<\/span>, work)\n    user.add_note(<span class=\"st\">\"Old note\"<\/span>, <span class=\"st\">\"no category\"<\/span>)           <span class=\"cm\"># الأسلوب القديم<\/span>\n    <span class=\"kw\">assert<\/span> [n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> user.notes_in(work)] == [<span class=\"st\">\"Report\"<\/span>]\n    <span class=\"kw\">assert<\/span> len(user.notes()) == <span class=\"nu\">2<\/span>\n\n<span class=\"kw\">def<\/span> test_reminder_due():\n    note = User(<span class=\"st\">\"Sara\"<\/span>).add_note(<span class=\"st\">\"Call\"<\/span>, <span class=\"st\">\"dentist\"<\/span>)\n    <span class=\"kw\">assert<\/span> note.reminder <span class=\"kw\">is<\/span> <span class=\"kw\">None<\/span>\n    now = datetime(<span class=\"nu\">2026<\/span>, <span class=\"nu\">1<\/span>, <span class=\"nu\">1<\/span>, <span class=\"nu\">9<\/span>, <span class=\"nu\">0<\/span>)\n    note.set_reminder(now + timedelta(hours=<span class=\"nu\">1<\/span>))\n    <span class=\"kw\">assert<\/span> note.reminder.is_due(now) <span class=\"kw\">is<\/span> <span class=\"kw\">False<\/span>\n    <span class=\"kw\">assert<\/span> note.reminder.is_due(now + timedelta(hours=<span class=\"nu\">2<\/span>)) <span class=\"kw\">is<\/span> <span class=\"kw\">True<\/span><\/code><\/pre><\/div>\n<p>لاحظ: اختبار الحالات <b>السلبية<\/b> (بحث بلا نتائج، ملاحظة بلا تذكير)، واختبار التوافق مع الأسلوب القديم، والتحكم في الزمن عبر تمرير <code dir=\"ltr\">now<\/code>.<\/p>\n<p>إذا فشل اختبار قديم فأمامك تفسيران فقط: كسرتَ سلوكًا قائمًا (أصلح الكود)، أو المتطلب الجديد يغيّر ذلك السلوك <b>عمدًا<\/b> (حدّث الاختبار بقرار واعٍ وموثّق).<\/p>", "q": {"id": "m4l4c4", "type": "sc", "sc": "بعد تعديلك فشل الاختبار القديم <code dir=\"ltr\">test_add_and_list<\/code> لأن <code dir=\"ltr\">list<\/code> صارت تطبع العنوان مع اسم التصنيف بين قوسين. المتطلبات الجديدة لا تذكر تغيير شكل <code dir=\"ltr\">list<\/code>.", "q": "<p>ما التصرف؟<\/p>", "exp": "<p>لم يُطلب تغيير هذا السلوك، وقد يعتمد عليه مستخدمون أو سكربتات. الاختبار أدّى وظيفته وكشف كسرًا غير مقصود.<\/p>", "opts": ["أتجاهل الفشل لأن الميزة الجديدة تعمل", "هذا regression: أُعيد سلوك <code dir=\"ltr\">list<\/code> القديم، وأعرض التصنيف في أمر جديد إن لزم", "أحذف الاختبار القديم", "أعدّل الاختبار القديم لينجح"], "ans": 1}}], "test": [{"id": "m4l4t1", "type": "mc", "q": "<p>ما الترتيب الأأمن لتنفيذ تعديل على تطبيق قائم؟<\/p>", "exp": "<p>نبدأ بشبكة الأمان، ثم الأقل مخاطرة (الإضافة)، ثم التعديل المحدود، ونتحقق في النهاية.<\/p>", "opts": ["الدمج في نقطة الدخول قبل كتابة الـ classes", "اختبارات تثبّت السلوك الحالي، ثم classes جديدة، ثم تعديل الموجود بأقل قدر، ثم الدمج، ثم تشغيل كل الاختبارات", "تعديل كل شيء دفعة واحدة ثم التجربة يدويًا", "حذف الاختبارات القديمة أولًا"], "ans": 1}, {"id": "m4l4t2", "type": "tf", "q": "<p>دالة تستقبل الوقت كـ parameter أسهل في الاختبار من دالة تستدعي <code dir=\"ltr\">datetime.now()<\/code> بداخلها.<\/p>", "exp": "<p>تمرير الوقت يجعل الدالة مستقلة عن ساعة النظام، فنختبرها بأي لحظة نريدها.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m4l4t3", "type": "sc", "sc": "في النموذج: <code dir=\"ltr\">Note 1 ◆── 0..1 Reminder<\/code>. في الكود: <code dir=\"ltr\">def set_reminder(self, reminder: Reminder): self._reminder = reminder<\/code> والـ <code dir=\"ltr\">Reminder<\/code> نفسه يُسند في مكان آخر إلى ملاحظتين.", "q": "<p>هل الكود مطابق؟<\/p>", "exp": "<p>الـ composition تعني ملكية حصرية. الأسلم أن تنشئ الملاحظة تذكيرها بنفسها من الموعد.<\/p>", "opts": ["نعم مطابق", "لا، لأن <code dir=\"ltr\">Reminder<\/code> يجب أن يرث من <code dir=\"ltr\">Note<\/code>", "لا يمكن الحكم", "لا: التذكير يُنشأ في الخارج ويُشارك بين ملاحظتين، وهذا يناقض الـ composition"], "ans": 3}]}, {"t": "Software Evolution", "intro": "<p>ما فعلناه في الأقسام السابقة له اسم: تطوّر البرمجيات. البرنامج الناجح لا «ينتهي»، بل يتغيّر ما دام مستعملًا.<\/p>", "items": [{"t": "ما هو الـ Software Evolution؟ والـ Feature Extension", "html": "<p><b>Software evolution<\/b> معناه تعديل البرنامج عبر الزمن مع تغيّر المتطلبات.<\/p>\n<p>لماذا تتغيّر المتطلبات؟ المستخدمون يكتشفون حاجات جديدة بعد الاستعمال، والسوق والقوانين تتغيّر، والتقنيات المحيطة تتقادم، والأخطاء تظهر.<\/p>\n<p>حقيقة يغفل عنها المبتدئون: معظم تكلفة البرنامج عبر حياته تقع <b>بعد<\/b> الإصدار الأول، في الصيانة والتطوير. لهذا كانت الـ maintainability محور هذه الدورة: أنت لا تصمّم ليعمل البرنامج اليوم فقط، بل ليكون <b>تغييره غدًا رخيصًا<\/b>.<\/p>\n<p>أنواع التغيير: إضافة ميزات، وإصلاح أخطاء، والتكيّف مع بيئة جديدة (نسخة Python أحدث)، وتحسين البنية الداخلية.<\/p>\n<p><b>Feature extension<\/b>: إضافة قدرة جديدة إلى نظام قائم، كما فعلنا مع التصنيفات والبحث والمشاركة والتذكيرات. والطريقة المثلى أن تتم بالإضافة لا بتعديل ما يعمل.<\/p>", "q": {"id": "m4l5c1", "type": "tf", "q": "<p>معظم تكلفة البرنامج الناجح عبر حياته تقع في الصيانة والتطوير بعد الإصدار الأول.<\/p>", "exp": "<p>نعم، ولهذا تهمّ قابلية الصيانة (maintainability) منذ اليوم الأول.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "Code Modification و Refactoring", "html": "<p><b>Code modification<\/b>: أي تغيير في الكود القائم. وينقسم بحسب أثره على السلوك:<\/p>\n<ul><li>تغيير <b>السلوك<\/b>: ميزة جديدة أو إصلاح خطأ.<\/li><li>تغيير <b>البنية دون السلوك<\/b>: هذا هو الـ refactoring.<\/li><\/ul>\n<p><b>Refactoring<\/b>: تحسين البنية الداخلية للكود <b>دون تغيير سلوكه الخارجي<\/b>. المدخلات والمخرجات نفسها، لكن الكود أوضح وأسهل تعديلًا.<\/p>\n<p>مثال: أوامر <code dir=\"ltr\">NotesCLI<\/code> سلسلة <code dir=\"ltr\">if<\/code> تطول مع كل أمر جديد. نعيد هيكلتها إلى جدول توزيع:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> NotesCLI:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, user: User):\n        <span class=\"kw\">self<\/span>._user = user\n        <span class=\"kw\">self<\/span>._commands = {                      <span class=\"cm\"># اسم الأمر -&gt; الدالة التي تنفّذه<\/span>\n            <span class=\"st\">\"add\"<\/span>: <span class=\"kw\">self<\/span>._add,\n            <span class=\"st\">\"list\"<\/span>: <span class=\"kw\">self<\/span>._list,\n            <span class=\"st\">\"delete\"<\/span>: <span class=\"kw\">self<\/span>._delete,\n        }\n\n    <span class=\"kw\">def<\/span> run_command(<span class=\"kw\">self<\/span>, command: str, *args: str) -&gt; str:\n        handler = <span class=\"kw\">self<\/span>._commands.get(command)\n        <span class=\"kw\">return<\/span> handler(*args) <span class=\"kw\">if<\/span> handler <span class=\"kw\">else<\/span> <span class=\"st\">\"Unknown command\"<\/span>\n\n    <span class=\"kw\">def<\/span> _add(<span class=\"kw\">self<\/span>, title: str, body: str) -&gt; str:\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"Added: {self._user.add_note(title, body).title}\"<\/span>\n\n    <span class=\"kw\">def<\/span> _list(<span class=\"kw\">self<\/span>) -&gt; str:\n        <span class=\"kw\">return<\/span> <span class=\"st\">\"\\n\"<\/span>.join(n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._user.notes()) <span class=\"kw\">or<\/span> <span class=\"st\">\"(no notes)\"<\/span>\n\n    <span class=\"kw\">def<\/span> _delete(<span class=\"kw\">self<\/span>, title: str) -&gt; str:\n        <span class=\"kw\">return<\/span> <span class=\"st\">\"Deleted\"<\/span> <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>._user.delete_note(title) <span class=\"kw\">else<\/span> <span class=\"st\">\"Not found\"<\/span><\/code><\/pre><\/div>\n<p>السلوك لم يتغيّر (الاختبارات القديمة تنجح كما هي)، وإضافة أمر جديد صارت سطرًا في القاموس و method واحدة.<\/p>\n<p>قواعد الـ refactoring الآمن:<\/p>\n<ul><li><b>لا refactoring دون اختبارات<\/b>: كيف تعرف أن السلوك لم يتغيّر؟<\/li><li><b>خطوات صغيرة<\/b>، وتشغيل الاختبارات بعد كل خطوة.<\/li><li><b>لا تخلط<\/b> refactoring مع إضافة ميزة في التعديل نفسه. قاعدة Kent Beck: اجعل التغيير سهلًا أولًا، ثم نفّذ التغيير السهل.<\/li><\/ul>", "q": {"id": "m4l5c2", "type": "mc", "q": "<p>ما الذي يميّز الـ refactoring عن بقية أنواع تعديل الكود؟<\/p>", "exp": "<p>إذا تغيّر السلوك الظاهر فالعملية ليست refactoring، بل ميزة أو إصلاح.<\/p>", "opts": ["يحذف الاختبارات", "يغيّر البنية الداخلية دون تغيير السلوك الخارجي", "يصلح أخطاء في النتائج", "يضيف ميزات جديدة للمستخدم"], "ans": 1}}, {"t": "Regression Testing", "html": "<p><b>Regression<\/b>: خلل يظهر في وظيفة <b>كانت تعمل<\/b>، بسبب تغيير حديث في مكان آخر.<\/p>\n<p><b>Regression testing<\/b>: إعادة تشغيل الاختبارات الموجودة بعد كل تغيير، للتأكد من أن ما كان يعمل ما زال يعمل.<\/p>\n<p>لماذا تحدث الـ regressions؟ بسبب الاقتران: تغيير في جزء ينتقل أثره إلى جزء آخر لم تتوقّعه (الـ ripple effect). كلما كان التصميم أقل اقترانًا قلّت الـ regressions.<\/p>\n<p>كيف نطبّقه عمليًا؟<\/p>\n<ul><li>مجموعة اختبارات آلية (test suite) تُشغَّل بأمر واحد: <code dir=\"ltr\">pytest<\/code>.<\/li><li>تُشغَّل <b>كلها<\/b> بعد كل تغيير، لا اختبارات الجزء المعدَّل فقط. الـ regression تظهر بالتعريف حيث لا تتوقّع.<\/li><li>تشغيل آلي عند كل commit عبر CI (Continuous Integration)، فلا يعتمد الأمر على تذكّر أحد.<\/li><li><b>كل خطأ يُصلَح يُضاف له اختبار<\/b> يعيد إنتاجه أولًا، فلا يعود الخطأ نفسه مرة ثانية.<\/li><\/ul>\n<p>الـ characterization tests التي كتبناها في القسم السابق أدّت بالضبط دور اختبارات الـ regression.<\/p>", "q": {"id": "m4l5c3", "type": "sc", "sc": "أضفتَ ميزة التذكيرات، واختبارات التذكيرات كلها ناجحة.", "q": "<p>هل يكفي ذلك لتسليم العمل؟<\/p>", "exp": "<p>نجاح الجديد لا يثبت سلامة القديم. الـ regression testing يتحقق من أن التغيير لم يكسر شيئًا آخر.<\/p>", "opts": ["لا: يجب تشغيل كل مجموعة الاختبارات للتأكد من أن الوظائف القديمة لم تنكسر", "لا حاجة للاختبارات أصلًا", "نعم، يكفي نجاح اختبارات الميزة الجديدة", "نعم، إذا كان الكود قصيرًا"], "ans": 0}}, {"t": "Backward Compatibility", "html": "<p><b>Backward compatibility<\/b> (التوافق مع السابق): أن يبقى ما كان يعتمد على النسخة القديمة يعمل مع النسخة الجديدة دون تعديل.<\/p>\n<p>من يعتمد على «القديم»؟<\/p>\n<ul><li><b>الكود المستدعي<\/b>: توقيعات الـ methods العامة.<\/li><li><b>البيانات المحفوظة<\/b>: ملفات أو قاعدة بيانات بالشكل القديم.<\/li><li><b>مستهلكو الـ API<\/b>: تطبيق جوال قديم لا تستطيع إجباره على التحديث.<\/li><\/ul>\n<p>تقنيات الحفاظ عليه:<\/p>\n<ul><li>parameters جديدة <b>اختيارية<\/b> بقيم افتراضية (كما فعلنا في <code dir=\"ltr\">add_note<\/code>).<\/li><li><b>إضافة<\/b> حقول إلى الـ responses، دون حذف أو إعادة تسمية الموجود.<\/li><li>للبيانات: قراءة الشكل القديم مع تعويض الحقول الناقصة.<\/li><li><b>Deprecation<\/b>: إبقاء القديم مع تحذير، ثم حذفه بعد مهلة معلنة:<\/li><\/ul>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">import<\/span> warnings\n\n<span class=\"kw\">def<\/span> notes(<span class=\"kw\">self<\/span>) -&gt; list[Note]:\n    <span class=\"kw\">return<\/span> list(<span class=\"kw\">self<\/span>._notes)\n\n<span class=\"kw\">def<\/span> get_all(<span class=\"kw\">self<\/span>) -&gt; list[Note]:            <span class=\"cm\"># الاسم القديم<\/span>\n    warnings.warn(<span class=\"st\">\"get_all() is deprecated, use notes()\"<\/span>, DeprecationWarning, stacklevel=<span class=\"nu\">2<\/span>)\n    <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>.notes()<\/code><\/pre><\/div>\n<p>الـ roadmap يقول «where necessary»، وهذا قيد مهم: التوافق له تكلفة (كود قديم يُحمَل معك). في كود داخلي تملك كل من يستدعيه، غيّر الجميع دفعة واحدة. التوافق ضروري حين يوجد مستعملون <b>لا تتحكم فيهم<\/b>.<\/p>\n<p>تغيير يكسر التوافق يسمّى <b>breaking change<\/b>، ويُعلَن عنه برفع رقم النسخة الرئيسي (major) في الـ semantic versioning: من 1.4.0 إلى 2.0.0.<\/p>", "q": {"id": "m4l5c4", "type": "mc", "q": "<p>أي تغيير في API هو breaking change؟<\/p>", "exp": "<p>العملاء القدامى يقرؤون <code dir=\"ltr\">title<\/code>. إعادة التسمية تكسرهم، أما الإضافة فلا تؤثّر فيمن لا يستعملها.<\/p>", "opts": ["إضافة حقل جديد اختياري <code dir=\"ltr\">category<\/code> إلى الـ response", "إعادة تسمية الحقل <code dir=\"ltr\">title<\/code> إلى <code dir=\"ltr\">name<\/code> في الـ response", "إضافة endpoint جديد", "تحسين سرعة endpoint موجود"], "ans": 1}}, {"t": "إدارة أثر تغييرات التصميم", "html": "<p>كيف نبقي التغيير تحت السيطرة؟<\/p>\n<p><b>قبل التغيير<\/b>:<\/p>\n<ul><li>impact analysis: ماذا يتغيّر وماذا يتأثر؟<\/li><li>تحديث النموذج أولًا، وتوثيق القرار (ADR) إن كان معماريًا.<\/li><li>شبكة أمان من الاختبارات.<\/li><\/ul>\n<p><b>أثناء التغيير<\/b>:<\/p>\n<ul><li><b>خطوات صغيرة<\/b>: commits صغيرة، لكل منها غرض واحد. إذا انكسر شيء تعرف أي خطوة كسرته.<\/li><li><b>تغيير واحد في المرة<\/b>: لا تخلط refactoring مع ميزة مع إصلاح.<\/li><li>الإضافة قبل التعديل، والتعديل المتوافق قبل الكاسر.<\/li><\/ul>\n<p><b>بعد التغيير<\/b>:<\/p>\n<ul><li>تشغيل كل الاختبارات.<\/li><li>مراجعة الكود مقابل النموذج، وتحديث الوثائق.<\/li><li>code review: عين ثانية تسأل «ماذا يمكن أن يكسر هذا؟».<\/li><\/ul>\n<p>وعلى المدى الطويل يتراكم أثر التغييرات: كل اختصار يضاف إلى الـ technical debt، والتصميم يتآكل إن لم يُصَن. العلاج عادة مستمرة لا حملة موسمية، وتسمّى <b>قاعدة الكشّافة (Boy Scout Rule)<\/b>: اترك الكود أنظف قليلًا مما وجدته.<\/p>\n<p>وهنا تكتمل الدائرة: كل مبادئ الوحدتين 2 و 3 (encapsulation و low coupling و high cohesion و information hiding) غايتها واحدة: أن يبقى <b>أثر التغيير محليًا<\/b>.<\/p>", "q": {"id": "m4l5c5", "type": "mc", "q": "<p>لماذا يُنصح بألّا يُخلط refactoring مع إضافة ميزة في commit واحد؟<\/p>", "exp": "<p>فصل التغييرات يجعل كل خطوة قابلة للفهم والاختبار والتراجع عنها وحدها.<\/p>", "opts": ["لأن Git لا يسمح بذلك", "لأن الـ refactoring ممنوع", "لأنه إذا انكسر شيء يصعب معرفة السبب، وتصعب مراجعة التغيير", "لتكثير عدد الـ commits فقط"], "ans": 2}}], "test": [{"id": "m4l5t1", "type": "mc", "q": "<p>ما الفرق بين regression و refactoring؟<\/p>", "exp": "<p>الأول نتيجة غير مرغوبة لتغيير، والثاني نشاط مقصود لتحسين الكود.<\/p>", "opts": ["هما مترادفان", "الـ regression خلل في وظيفة كانت تعمل، والـ refactoring تحسين للبنية دون تغيير السلوك", "الـ refactoring يضيف ميزات والـ regression يحذفها", "الـ regression نوع من الاختبارات والـ refactoring نوع من الأخطاء"], "ans": 1}, {"id": "m4l5t2", "type": "sc", "sc": "تريد إعادة تسمية method عامة <code dir=\"ltr\">get_all()<\/code> إلى <code dir=\"ltr\">notes()<\/code> في مكتبة يستعملها عملاء خارجيون.", "q": "<p>ما الطريقة الأسلم؟<\/p>", "exp": "<p>الـ deprecation يعطي المستعملين مهلة للانتقال قبل الـ breaking change.<\/p>", "opts": ["إضافة <code dir=\"ltr\">notes()<\/code> وإبقاء <code dir=\"ltr\">get_all()<\/code> مع DeprecationWarning، ثم حذفها في إصدار رئيسي لاحق", "إبقاء الاسمين إلى الأبد دون تحذير", "حذف الـ method نهائيًا", "إعادة التسمية فورًا دون إعلان"], "ans": 0}, {"id": "m4l5t3", "type": "tf", "q": "<p>يمكن إجراء refactoring آمن دون وجود أي اختبارات.<\/p>", "exp": "<p>دون اختبارات لا دليل على أن السلوك لم يتغيّر. الاختبارات شرط الـ refactoring الآمن.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m4l5t4", "type": "sa", "q": "<p>ما اسم إعادة تشغيل الاختبارات الموجودة بعد كل تغيير للتأكد من أن القديم لم ينكسر؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Regression testing<\/b>.<\/p>", "kw": ["regression"]}]}, {"t": "ورشة الوحدة 4 (Capstone 1.4) واختبارها", "intro": "<p>هذه الورشة تجمع العمل كله: تتسلّم متطلبات محدَّثة، فتعدّل النموذج ثم الكود مع الحفاظ على القائم. بعدها اختبار الوحدة. أما القسم السادس من الوحدة في الـ roadmap (Final Exam) فتجده في صفحة «الامتحان النهائي» بعد المشروع.<\/p>", "items": [{"t": "Capstone 1.4: أضف «الأرشفة» و«التثبيت» إلى تطبيق الملاحظات", "task": {"id": "m4l6w1", "t": "Capstone 1.4: أضف «الأرشفة» و«التثبيت» إلى تطبيق الملاحظات", "html": "<p>انطلق من <code dir=\"ltr\">notes_app.py<\/code> بعد إضافات الوحدة. المتطلبات الجديدة:<\/p>\n<ul><li><b>Archive<\/b>: يمكن أرشفة ملاحظة. المؤرشفة لا تظهر في <code dir=\"ltr\">list<\/code> ولا في <code dir=\"ltr\">search<\/code>، ويمكن استرجاعها.<\/li><li><b>Pin<\/b>: يمكن تثبيت ملاحظة فتظهر أولًا في <code dir=\"ltr\">list<\/code>. الملاحظة المؤرشفة لا تُثبَّت.<\/li><\/ul>\n<p>المطلوب:<\/p>\n<ol><li>حوّل المتطلبين إلى user stories مع acceptance criteria.<\/li><li>impact analysis: ما الذي يتغيّر، وما الذي يتأثر؟<\/li><li>حدّث الـ class diagram (نصيًا)، وارسم state diagram للملاحظة.<\/li><li>اكتب كود التعديل بـ Python بحيث تبقى الوظائف القائمة تعمل.<\/li><li>اكتب اختبارات: للجديد، وللتأكد من سلامة القديم.<\/li><\/ol>", "hints": ["للملاحظة الآن دورة حياة: Active ثم Archived والعودة. هل <code dir=\"ltr\">pinned<\/code> حالة ثالثة أم صفة داخل Active؟ فكّر في أبسط نموذج يمنع «مؤرشفة ومثبّتة».", "لا تغيّر توقيع <code dir=\"ltr\">notes()<\/code>: أضف parameter اختياريًا أو method جديدة للمؤرشفات، حتى لا تنكسر الاستدعاءات القديمة.", "في الاختبارات: جرّب تثبيت ملاحظة مؤرشفة (يجب أن يُرفض)، وتأكد أن <code dir=\"ltr\">list<\/code> لملاحظات غير مثبّتة يعطي الترتيب القديم نفسه."], "checks": [], "sol": "<h4>1) Stories<\/h4>\n<div class=\"note\">As a user, I want to archive a note so that my list stays focused without losing the note.<\/div>\n<ul><li>المؤرشفة لا تظهر في <code dir=\"ltr\">list<\/code> ولا <code dir=\"ltr\">search<\/code>.<\/li><li>يمكن استرجاعها فتعود للظهور.<\/li><li>ملاحظة لم تُؤرشف تتصرف كما كانت تمامًا.<\/li><\/ul>\n<div class=\"note\">As a user, I want to pin a note so that important notes appear first.<\/div>\n<ul><li>المثبّتة تظهر قبل غيرها، والترتيب داخل كل مجموعة كما كان.<\/li><li>تثبيت ملاحظة مؤرشفة مرفوض، والأرشفة تلغي التثبيت.<\/li><\/ul>\n<h4>2) Impact analysis<\/h4>\n<ul><li><b>يتغيّر<\/b>: <code dir=\"ltr\">Note<\/code> (حالة جديدة وعمليات)، <code dir=\"ltr\">User.notes<\/code> و <code dir=\"ltr\">User.search<\/code> (تصفية وترتيب)، <code dir=\"ltr\">NotesCLI<\/code> (أوامر جديدة).<\/li><li><b>يتأثر ويُعاد اختباره<\/b>: أمر <code dir=\"ltr\">list<\/code> و <code dir=\"ltr\">share<\/code>.<\/li><li><b>معزول<\/b>: <code dir=\"ltr\">Category<\/code> و <code dir=\"ltr\">Reminder<\/code>.<\/li><\/ul>\n<h4>3) النموذج<\/h4>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Note:  - status: NoteStatus      + archive(), + restore(), + pin(), + unpin()\n       + is_archived: bool {read-only}, + is_pinned: bool {read-only}\n«enumeration» NoteStatus: ACTIVE, PINNED, ARCHIVED\n\n[*] --&gt; Active\nActive --pin--&gt; Pinned\nPinned --unpin--&gt; Active\nActive --archive--&gt; Archived\nPinned --archive--&gt; Archived\nArchived --restore--&gt; Active<\/code><\/pre><\/div>\n<p>حالة واحدة بثلاث قيم بدل قيمتَي boolean: التركيبة «مؤرشفة ومثبّتة» صارت غير قابلة للتمثيل أصلًا.<\/p>\n<h4>4) الكود<\/h4>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> enum <span class=\"kw\">import<\/span> Enum\n\n<span class=\"kw\">class<\/span> NoteStatus(Enum):\n    ACTIVE = <span class=\"st\">\"active\"<\/span>\n    PINNED = <span class=\"st\">\"pinned\"<\/span>\n    ARCHIVED = <span class=\"st\">\"archived\"<\/span>\n\n<span class=\"kw\">class<\/span> InvalidTransition(Exception):\n    <span class=\"kw\">pass<\/span>\n\n<span class=\"kw\">class<\/span> Note:\n    _TRANSITIONS = {\n        (NoteStatus.ACTIVE, <span class=\"st\">\"pin\"<\/span>): NoteStatus.PINNED,\n        (NoteStatus.PINNED, <span class=\"st\">\"unpin\"<\/span>): NoteStatus.ACTIVE,\n        (NoteStatus.ACTIVE, <span class=\"st\">\"archive\"<\/span>): NoteStatus.ARCHIVED,\n        (NoteStatus.PINNED, <span class=\"st\">\"archive\"<\/span>): NoteStatus.ARCHIVED,\n        (NoteStatus.ARCHIVED, <span class=\"st\">\"restore\"<\/span>): NoteStatus.ACTIVE,\n    }\n\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, title, body, category=<span class=\"kw\">None<\/span>):\n        <span class=\"cm\"># ... كما كان ...<\/span>\n        <span class=\"kw\">self<\/span>._status = NoteStatus.ACTIVE\n\n    <span class=\"kw\">def<\/span> _fire(<span class=\"kw\">self<\/span>, event: str) -&gt; <span class=\"kw\">None<\/span>:\n        key = (<span class=\"kw\">self<\/span>._status, event)\n        <span class=\"kw\">if<\/span> key <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._TRANSITIONS:\n            <span class=\"kw\">raise<\/span> InvalidTransition(f<span class=\"st\">\"Cannot {event} a note that is {self._status.value}\"<\/span>)\n        <span class=\"kw\">self<\/span>._status = <span class=\"kw\">self<\/span>._TRANSITIONS[key]\n\n    <span class=\"kw\">def<\/span> pin(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>: <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"pin\"<\/span>)\n    <span class=\"kw\">def<\/span> unpin(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>: <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"unpin\"<\/span>)\n    <span class=\"kw\">def<\/span> archive(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>: <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"archive\"<\/span>)\n    <span class=\"kw\">def<\/span> restore(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>: <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"restore\"<\/span>)\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> is_archived(<span class=\"kw\">self<\/span>) -&gt; bool: <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._status <span class=\"kw\">is<\/span> NoteStatus.ARCHIVED\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> is_pinned(<span class=\"kw\">self<\/span>) -&gt; bool: <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._status <span class=\"kw\">is<\/span> NoteStatus.PINNED\n\n<span class=\"kw\">class<\/span> User:\n    <span class=\"kw\">def<\/span> notes(<span class=\"kw\">self<\/span>, include_archived: bool = <span class=\"kw\">False<\/span>) -&gt; list[Note]:\n        visible = [n <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._notes <span class=\"kw\">if<\/span> include_archived <span class=\"kw\">or<\/span> <span class=\"kw\">not<\/span> n.is_archived]\n        <span class=\"kw\">return<\/span> sorted(visible, key=<span class=\"kw\">lambda<\/span> n: <span class=\"kw\">not<\/span> n.is_pinned)   <span class=\"cm\"># sorted مستقرة: الترتيب القديم محفوظ<\/span>\n\n    <span class=\"kw\">def<\/span> search(<span class=\"kw\">self<\/span>, query: str) -&gt; list[Note]:\n        <span class=\"kw\">return<\/span> [n <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>.notes() <span class=\"kw\">if<\/span> n.matches(query)]<\/code><\/pre><\/div>\n<h4>5) الاختبارات<\/h4>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> test_old_behaviour_unchanged():\n    user = User(<span class=\"st\">\"Sara\"<\/span>)\n    user.add_note(<span class=\"st\">\"A\"<\/span>, <span class=\"st\">\"x\"<\/span>); user.add_note(<span class=\"st\">\"B\"<\/span>, <span class=\"st\">\"y\"<\/span>)\n    <span class=\"kw\">assert<\/span> [n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> user.notes()] == [<span class=\"st\">\"A\"<\/span>, <span class=\"st\">\"B\"<\/span>]\n\n<span class=\"kw\">def<\/span> test_archive_hides_and_restore_shows():\n    user = User(<span class=\"st\">\"Sara\"<\/span>); note = user.add_note(<span class=\"st\">\"A\"<\/span>, <span class=\"st\">\"x\"<\/span>)\n    note.archive()\n    <span class=\"kw\">assert<\/span> user.notes() == [] <span class=\"kw\">and<\/span> user.search(<span class=\"st\">\"A\"<\/span>) == []\n    <span class=\"kw\">assert<\/span> len(user.notes(include_archived=<span class=\"kw\">True<\/span>)) == <span class=\"nu\">1<\/span>\n    note.restore()\n    <span class=\"kw\">assert<\/span> [n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> user.notes()] == [<span class=\"st\">\"A\"<\/span>]\n\n<span class=\"kw\">def<\/span> test_pinned_first_and_archived_cannot_be_pinned():\n    user = User(<span class=\"st\">\"Sara\"<\/span>)\n    a = user.add_note(<span class=\"st\">\"A\"<\/span>, <span class=\"st\">\"x\"<\/span>); b = user.add_note(<span class=\"st\">\"B\"<\/span>, <span class=\"st\">\"y\"<\/span>)\n    b.pin()\n    <span class=\"kw\">assert<\/span> [n.title <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> user.notes()] == [<span class=\"st\">\"B\"<\/span>, <span class=\"st\">\"A\"<\/span>]\n    a.archive()\n    <span class=\"kw\">with<\/span> pytest.raises(InvalidTransition):\n        a.pin()<\/code><\/pre><\/div>\n<p><b>نقاط التقييم<\/b>: <code dir=\"ltr\">notes()<\/code> القديمة تعمل دون parameters؛ الحالة مغلّفة (encapsulated) ولا تُعدَّل إلا عبر العمليات؛ الممنوع يُرفض باستثناء لا بصمت؛ والنموذج والكود متطابقان سهمًا بسهم.<\/p>"}}], "test": [{"id": "m4l6t1", "type": "mc", "q": "<p>ما الذي يميّز عمل الوحدة 4 عن الوحدات السابقة؟<\/p>", "exp": "<p>الوحدة تحاكي الواقع: معظم العمل تطوير لأنظمة موجودة.<\/p>", "opts": ["العمل على تطبيق قائم: فهمه ثم تطويره مع الحفاظ على وظائفه", "كتابة تطبيق جديد من الصفر", "رسم واجهات المستخدم", "إعداد قواعد البيانات"], "ans": 0}, {"id": "m4l6t2", "type": "sc", "sc": "وصلك متطلب «تصدير الملاحظات إلى PDF». فتحتَ <code dir=\"ltr\">notes_app.py<\/code> وبدأت الكتابة داخل <code dir=\"ltr\">Note<\/code> مباشرة.", "q": "<p>ما الخطوات التي تجاوزتها؟<\/p>", "exp": "<p>القفز إلى الكود يهمل كل ما يحمي من التصميم الخاطئ ومن كسر القائم. والتصدير إلى PDF على الأرجح ليس من مسؤولية <code dir=\"ltr\">Note<\/code> أصلًا.<\/p>", "opts": ["تغيير لغة البرمجة", "لم تتجاوز شيئًا", "اختيار لون الـ PDF", "فهم الكود القائم، توضيح المتطلب، impact analysis، تحديث النموذج، وشبكة الأمان من الاختبارات"], "ans": 3}, {"id": "m4l6t3", "type": "mc", "q": "<p>أي تعديل هو الأقل مخاطرة على الوظائف القائمة؟<\/p>", "exp": "<p>الإضافة لا تمسّ ما يعمل. بقية الخيارات تعديلات قد تكسر المستدعين.<\/p>", "opts": ["إضافة class جديد و methods جديدة دون المساس بالموجود", "إعادة تسمية attribute عام", "تغيير نوع القيمة المعادة من method قائمة", "تغيير توقيع method عامة يستعملها الجميع"], "ans": 0}, {"id": "m4l6t4", "type": "tf", "q": "<p>نجاح كل الاختبارات القديمة دون تعديلها بعد إضافة ميزة دليل جيد على عدم وجود regression في ما تغطّيه.<\/p>", "exp": "<p>هذا دور اختبارات الـ regression، مع التنبيه إلى أنها تحمي فقط ما تغطّيه.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m4l6t5", "type": "sa", "q": "<p>ما اسم الاختبارات التي تُكتب لتثبيت السلوك الحالي لكود قائم قبل تعديله؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Characterization tests<\/b>.<\/p>", "kw": ["characterization", "characterisation"]}]}]}, {"t": "ما بعد المنهج: مفاهيم مكمّلة", "g": "مفاهيم وثيقة الصلة بالمنهج تستحق الدراسة معه. هذه الوحدة تعريف مركّز بكل واحد منها، وليست بديلًا عن دراسته بعمق.", "lessons": [{"t": "SOLID Principles", "intro": "<p>خمسة مبادئ لتصميم برمجيات object-oriented قابلة للصيانة. ستلاحظ أنها صياغة مركّزة لأفكار رأيتها في الوحدتين 2 و 3.<\/p>", "items": [{"t": "S: Single Responsibility Principle", "html": "<p><b>SRP<\/b>: الـ class يجب أن يكون له <b>سبب واحد للتغيير<\/b>، أي أن يخدم جهة واحدة من أصحاب المصلحة.<\/p>\n<p>هذه هي الـ high cohesion بصياغة أخرى. <code dir=\"ltr\">ApplicationManager<\/code> من القسم 3.2 يتغيّر إذا تغيّر قالب البريد، أو حساب الفاتورة، أو شكل التقرير: ثلاثة أسباب، فيجب أن يكون ثلاثة classes.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># قبل: سببان للتغيير (قواعد الحساب، وصيغة الحفظ)<\/span>\n<span class=\"kw\">class<\/span> Invoice:\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>): ...\n    <span class=\"kw\">def<\/span> save_to_csv(<span class=\"kw\">self<\/span>, path): ...\n\n<span class=\"cm\"># بعد<\/span>\n<span class=\"kw\">class<\/span> Invoice:\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>): ...\n\n<span class=\"kw\">class<\/span> InvoiceCsvExporter:\n    <span class=\"kw\">def<\/span> save(<span class=\"kw\">self<\/span>, invoice: Invoice, path: str): ...<\/code><\/pre><\/div>\n<p>اختبار عملي: «من سيطلب تغيير هذا الـ class؟». إن كان الجواب المحاسب <b>و<\/b> مسؤول الأنظمة فهو يخدم سيّدين.<\/p>", "q": {"id": "m5l1c1", "type": "mc", "q": "<p>class فيه <code dir=\"ltr\">calculate_salary()<\/code> و <code dir=\"ltr\">generate_pdf()<\/code> و <code dir=\"ltr\">send_email()<\/code>. كم سببًا للتغيير، وماذا يقول SRP؟<\/p>", "exp": "<p>قواعد الرواتب وشكل الـ PDF وطريقة الإرسال تتغيّر كلٌّ لأسبابه ولأصحابه.<\/p>", "opts": ["سبب واحد؛ لا حاجة للتغيير", "سببان؛ يُدمج مع class آخر", "لا يمكن العدّ", "ثلاثة أسباب؛ يُقسَّم إلى ثلاث مسؤوليات مستقلة"], "ans": 3}}, {"t": "O: Open/Closed Principle", "html": "<p><b>OCP<\/b>: الكيانات البرمجية يجب أن تكون <b>مفتوحة للتوسعة، مغلقة أمام التعديل<\/b>. أي: تضيف سلوكًا جديدًا بكتابة كود جديد، لا بتعديل كود يعمل ومُختبَر.<\/p>\n<p>الأداة: abstraction مع polymorphism.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> typing <span class=\"kw\">import<\/span> Protocol\n\n<span class=\"kw\">class<\/span> DiscountPolicy(Protocol):\n    <span class=\"kw\">def<\/span> apply(<span class=\"kw\">self<\/span>, amount: float) -&gt; float: ...\n\n<span class=\"kw\">class<\/span> NoDiscount:\n    <span class=\"kw\">def<\/span> apply(<span class=\"kw\">self<\/span>, amount: float) -&gt; float: <span class=\"kw\">return<\/span> amount\n\n<span class=\"kw\">class<\/span> SeasonalDiscount:\n    <span class=\"kw\">def<\/span> apply(<span class=\"kw\">self<\/span>, amount: float) -&gt; float: <span class=\"kw\">return<\/span> amount * <span class=\"nu\">0.9<\/span>\n\n<span class=\"kw\">def<\/span> final_price(amount: float, policy: DiscountPolicy) -&gt; float:\n    <span class=\"kw\">return<\/span> policy.apply(amount)             <span class=\"cm\"># لا تتغيّر مهما أضفنا من سياسات<\/span><\/code><\/pre><\/div>\n<p>خصم جديد لكبار العملاء؟ class جديد <code dir=\"ltr\">VipDiscount<\/code> ولا تُلمس <code dir=\"ltr\">final_price<\/code>. البديل المخالف: سلسلة <code dir=\"ltr\">if discount_type == \"seasonal\" ... elif ...<\/code> تُفتح وتُعدَّل مع كل نوع.<\/p>\n<p>تنبيه: لا تطبّقه استباقيًا على كل شيء (YAGNI). أضف نقطة التوسعة حين يظهر التنوّع <b>فعلًا<\/b> للمرة الثانية.<\/p>", "q": {"id": "m5l1c2", "type": "tf", "q": "<p>حسب OCP، الطريقة المفضّلة لإضافة نوع خصم جديد هي إضافة فرع <code dir=\"ltr\">elif<\/code> إلى الدالة القائمة.<\/p>", "exp": "<p>OCP يفضّل إضافة class جديد يحقق الـ abstraction، دون تعديل الكود القائم المختبَر.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "L: Liskov Substitution Principle", "html": "<p><b>LSP<\/b>: الـ objects من الـ subclass يجب أن تصلح <b>بديلًا<\/b> عن objects الـ superclass دون أن يختلّ البرنامج.<\/p>\n<p>درسناه في القسم 3.6 مع المربع والمستطيل والبطريق. الخلاصة: الـ subclass يجب أن يحترم <b>عقد<\/b> الأب:<\/p>\n<ul><li>لا يطلب <b>أكثر<\/b> مما يطلبه الأب (لا يشدّد شروط المدخلات).<\/li><li>لا يعد بـ <b>أقل<\/b> مما يعد به الأب (لا يضعف ضمانات المخرجات).<\/li><li>لا يرفع استثناءات لا يتوقعها مستعملو الأب.<\/li><\/ul>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Storage:\n    <span class=\"kw\">def<\/span> save(<span class=\"kw\">self<\/span>, key: str, data: bytes) -&gt; <span class=\"kw\">None<\/span>: ...\n\n<span class=\"kw\">class<\/span> ReadOnlyStorage(Storage):\n    <span class=\"kw\">def<\/span> save(<span class=\"kw\">self<
