ة مباشرة متجاوزًا شرط اكتمال المبلغ", "اكتشفتُ خطأ ترتيب الرسائل (استعمال الحجز قبل جلبه من الـ repository)", "اكتشفتُ الانتقال من Cancelled إلى Confirmed المخالف للمتطلبات", "اكتشفتُ غياب انتقالات الإلغاء التي يطلبها المتطلب", "اكتشفتُ الحالة غير الموصولة Archived أو الـ attribute العام في Trip", "صنّفتُ كل خطأ بنوعه واقترحتُ تصحيحًا محدّدًا"], "sol": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>الموضع<\/th><th>الخطأ<\/th><th>النوع<\/th><th>التصحيح<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>A<\/td><td><code dir=\"ltr\">BookingService ──▷ Booking<\/code>: الخدمة ليست نوعًا من الحجز<\/td><td>علاقة خاطئة<\/td><td>dependency: <code dir=\"ltr\">BookingService - - -&gt; Booking<\/code><\/td><\/tr><tr><td>2<\/td><td>A<\/td><td><code dir=\"ltr\">Trip: + reserved<\/code> عام، فأي class يغيّر عدد المقاعد<\/td><td>علاقة أو visibility خاطئة<\/td><td><code dir=\"ltr\">- reserved<\/code> مع <code dir=\"ltr\">reserve_seats()<\/code> و <code dir=\"ltr\">release_seats()<\/code><\/td><\/tr><tr><td>3<\/td><td>B مقابل D<\/td><td><code dir=\"ltr\">set_status(\"confirmed\")<\/code> يؤكّد دون التحقق من اكتمال المبلغ<\/td><td>تناقض مع المتطلبات<\/td><td><code dir=\"ltr\">Booking.add_payment(amount)<\/code> والحجز يؤكّد نفسه عند اكتمال المبلغ<\/td><\/tr><tr><td>4<\/td><td>B مقابل A<\/td><td><code dir=\"ltr\">set_status<\/code> و <code dir=\"ltr\">SmsGateway<\/code> و <code dir=\"ltr\">BookingAPI<\/code> غير موجودة في الـ class diagram، و <code dir=\"ltr\">BookingService<\/code> غائب عن التفاعل<\/td><td>تناقض بين مخططين<\/td><td>الرسائل تمرّ عبر <code dir=\"ltr\">BookingService<\/code>، والإشعار عبر <code dir=\"ltr\">Notifier<\/code><\/td><\/tr><tr><td>5<\/td><td>B<\/td><td>الحجز يُستعمل قبل جلبه: <code dir=\"ltr\">get(id)<\/code> آخر رسالة<\/td><td>تفاعل خاطئ الترتيب<\/td><td><code dir=\"ltr\">get(id)<\/code> أولًا، ثم الدفع، ثم الإشعار<\/td><\/tr><tr><td>6<\/td><td>B<\/td><td>الإشعار يُرسل دائمًا، حتى لدفعة جزئية<\/td><td>تفاعل ناقص (شرط مفقود)<\/td><td><code dir=\"ltr\">alt [status is CONFIRMED]<\/code> حول الإرسال<\/td><\/tr><tr><td>7<\/td><td>C مقابل D<\/td><td><code dir=\"ltr\">Cancelled --fully_paid--&gt; Confirmed<\/code><\/td><td>انتقال غير صالح<\/td><td>حذف الانتقال: Cancelled حالة نهائية<\/td><\/tr><tr><td>8<\/td><td>C مقابل D<\/td><td>لا يوجد أي انتقال <code dir=\"ltr\">cancel<\/code> مع أن المتطلب يطلبه<\/td><td>تناقض مع المتطلبات (نقص)<\/td><td><code dir=\"ltr\">Pending --cancel--&gt; Cancelled<\/code> و <code dir=\"ltr\">Confirmed --cancel--&gt; Cancelled<\/code><\/td><\/tr><tr><td>9<\/td><td>C<\/td><td><code dir=\"ltr\">Archived<\/code> لا يدخلها ولا يخرج منها سهم، ولا متطلب يذكرها<\/td><td>حالة غير موصولة<\/td><td>حذفها<\/td><\/tr><tr><td>10<\/td><td>B<\/td><td>الاعتماد على <code dir=\"ltr\">SmsGateway<\/code> المحدّد<\/td><td>tight coupling<\/td><td>الاعتماد على <code dir=\"ltr\">Notifier<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>الدرس<\/b>: كل مخطط قد يبدو معقولًا وحده. الأخطاء 3 و 4 و 7 و 8 لا تظهر إلا بالمقارنة بين المخططات وبينها وبين المتطلبات.<\/p>\n<p><b>ما يُنتظر أن يكون تغيّر في تفكيرك<\/b> (قارن بفقرتك): تبدأ من المشكلة والمسؤوليات لا من الملفات؛ تسأل عند كل قرار «ما الثمن؟» و«ماذا لو تغيّر هذا؟»؛ وترى الكود كنموذج يجب أن يبقى متّسقًا مع المتطلبات وسهل التغيير.<\/p>"}], "t": "المشروع العملي النهائي: نظام حجوزات TravelDesk", "intro": "<p>ستصمّم وتبني <b>نواة نظام حجوزات لوكالة سفر صغيرة<\/b> بلغة Python، مرورًا بكل مراحل المنهج: المتطلبات، ثم النمذجة المفاهيمية، ثم الـ class diagram، ثم التنفيذ، ثم السلوك (state و sequence)، ثم تطوير النظام بمتطلب جديد، ثم مراجعة النماذج.<\/p>\n<h4>وصف صاحب الوكالة (المادة الخام)<\/h4>\n<div class=\"note\">«نبيع رحلات منظّمة. لكل رحلة وجهة وتاريخ انطلاق وسعر للفرد وعدد مقاعد محدود. الموظف يسجّل العميل ويحجز له عددًا من المقاعد. لا يوجد دفع إلكتروني: العميل يدفع نقدًا أو بتحويل، وأحيانًا على دفعات، والموظف يسجّل كل دفعة. الحجز يصير مؤكَّدًا حين يكتمل المبلغ، وعندها نُعلِم العميل (برسالة SMS الآن، وربما بالبريد لاحقًا). يمكن إلغاء الحجز قبل الانطلاق فتعود مقاعده للرحلة. بعد انتهاء الرحلة يُعتبر الحجز مكتملًا. أنا كمدير أريد رؤية حجوزات كل رحلة بحسب حالتها. عندنا ثلاثة موظفين وخادم واحد صغير.»<\/div>\n<h4>قواعد العمل على المشروع<\/h4>\n<ul><li>نفّذ المهام <b>بالترتيب<\/b>: كل مهمة تبني على سابقتها.<\/li><li>اكتب محاولتك كاملة في المربع (أو في محرّرك ثم الصقها). <b>الحل لا يُفتح قبل المحاولة<\/b>.<\/li><li>التلميحات اختيارية ومتدرّجة: افتح الأول فقط إن علقت.<\/li><li>بعد فتح الحل قيّم نفسك في <b>نقطة التحقق<\/b> بصدق: علّم فقط ما أنجزته قبل رؤية الحل. هذه العلامات تدخل في تقييمك النهائي.<\/li><li>الحل النموذجي واحد من حلول صحيحة ممكنة. المهم أن تستطيع <b>تبرير<\/b> اختياراتك.<\/li><\/ul>"}, "exam": [{"id": "x1", "type": "mc", "q": "<p>ما الذي تصفه الـ Software Architecture؟<\/p>", "exp": "<p>المعمارية هي التنظيم عالي المستوى وأسبابه، وليست قائمة تقنيات.<\/p>", "opts": ["قائمة التقنيات والمكتبات المستعملة فقط", "أسماء المتغيّرات داخل الدوال", "المكوّنات الكبرى للنظام ومسؤولياتها وطرق تواصلها والقرارات المهمة التي تشكّله", "ألوان واجهة المستخدم"], "ans": 2}, {"id": "x2", "type": "mc", "q": "<p>«يجب أن تعمل 95% من عمليات البحث خلال ثانيتين» هو:<\/p>", "exp": "<p>يصف صفة جودة (الأداء) بصيغة يمكن اختبارها.<\/p>", "opts": ["Non-functional requirement قابل للقياس", "Technical constraint على لغة البرمجة", "User Story", "Functional requirement"], "ans": 0}, {"id": "x3", "type": "sc", "sc": "«As a manager, I want to export reservations».", "q": "<p>ما الذي ينقص هذه الـ User Story؟<\/p>", "exp": "<p>الصيغة الكاملة: من، وماذا، ولماذا. جزء الفائدة يوضّح الهدف الحقيقي.<\/p>", "opts": ["نوع قاعدة البيانات", "جزء الفائدة: so that", "لا ينقصها شيء", "اسم الـ class"], "ans": 1}, {"id": "x4", "type": "mc", "q": "<p>في بطاقة CRC، أين تضع مسؤولية «Calculate the total» لطلب؟<\/p>", "exp": "<p>Information Expert: المسؤولية عند من يملك المعلومات.<\/p>", "opts": ["عند <code dir=\"ltr\">Database<\/code>", "عند <code dir=\"ltr\">OrderForm<\/code>", "عند <code dir=\"ltr\">Order<\/code> لأنه يملك العناصر اللازمة للحساب", "عند <code dir=\"ltr\">Customer<\/code>"], "ans": 2}, {"id": "x5", "type": "mc", "q": "<p><code dir=\"ltr\">ReportController<\/code> ينسّق توليد التقرير، و <code dir=\"ltr\">ReportPage<\/code> تعرضه، و <code dir=\"ltr\">Reservation<\/code> تحمل البيانات. ما تصنيف <code dir=\"ltr\">ReportPage<\/code>؟<\/p>", "exp": "<p>الـ boundary يتولّى التواصل مع المستخدم أو الأنظمة الخارجية.<\/p>", "opts": ["Entity", "Abstract", "Boundary", "Control"], "ans": 2}, {"id": "x6", "type": "tf", "q": "<p>الـ abstraction تعني إظهار كل تفاصيل التنفيذ للمستخدم حتى يفهم كيف يعمل الـ object.<\/p>", "exp": "<p>العكس: إظهار الضروري وإخفاء تفاصيل التنفيذ.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "x7", "type": "mc", "q": "<p>ما ناتج هذا الكود؟<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Account:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._balance = <span class=\"nu\">0<\/span>\n    <span class=\"kw\">def<\/span> deposit(<span class=\"kw\">self<\/span>, amount):\n        <span class=\"kw\">if<\/span> amount &lt;= <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"invalid\"<\/span>)\n        <span class=\"kw\">self<\/span>._balance += amount\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> balance(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._balance\na = Account()\na.deposit(<span class=\"nu\">50<\/span>)\n<span class=\"kw\">try<\/span>:\n    a.deposit(-<span class=\"nu\">20<\/span>)\n<span class=\"kw\">except<\/span> ValueError:\n    <span class=\"kw\">pass<\/span>\nprint(a.balance)<\/code><\/pre><\/div>", "exp": "<p>الإيداع الثاني يُرفض قبل أي تعديل، والاستثناء يُلتقط. الـ encapsulation حمت الـ invariant.<\/p>", "opts": ["يتوقف البرنامج بخطأ", "50", "30", "0"], "ans": const norm=s=>String(s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^a-z0-9؀-ۿ]+/g,'');
function answer(id,sel){
  const q=Q[id]; let ok;
  if(q.type==='sa'){const n=norm(sel), raw=String(sel).replace(/\s+/g,'').toLowerCase();
    ok=q.kw.some(k=>/[^a-z0-9\u0600-\u06FF\s]/i.test(k)&&norm(k).length<3 ? raw===k.replace(/\s+/g,'').toLowerCase() : n.indexOf(norm(k))>=0);
  } else ok=sel===q.ans;
  if(!(id in S.f)) S.f[id]=ok;

}

function pn(id){

function scoreLine(ids,label){

  const f=firstScore(ids), p=Math.round(100*f.ok/f.total);

}

function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function pageExam(){
  let h='<div class="crumb">القسم 4.6 من المنهج</div><h2>الامتحان النهائي</h2>'+D.examIntro+
    '<p><span class="timer" id="timer">'+(S.exam?'…':'30:00')+'</span> '+(S.exam?'':'<button class="btn" data-act="startexam">ابدأ المؤقّت (30 دقيقة)</button>')+'</p>';
  h+=D.exam.map((q,i)=>qHTML(q,i+1)).join('')+scoreLine(D.exam.map(q=>q.id),'نتيجة الامتحان');
  return h+pn('exam');
}
function pageEval(){
  const allQ=[]; D.modules.forEach(m=>m.lessons.forEach(l=>allQ.push.apply(allQ,l.qs)));
  const c=firstScore(allQ), x=firstScore(D.exam.map(q=>q.id));
  let ck=0,ckT=0; D.project.tasks.forEach(t=>{ckT+=t.checks.length; const s=S.t[t.id]; if(s&&s.c) ck+=s.c.filter(Boolean).length;});
  const pT=D.project.tasks.filter(t=>tDone(t.id)).length;
  const pc=c.n?c.ok/c.n:0, px=x.n?x.ok/x.n:0, pp=ckT?ck/ckT:0;
  const cover=doneCount()/TOTAL;
  let h='<div class="crumb">خلاصة أدائك</div><h2>التقييم النهائي لفهمك العملي</h2><p class="lead">يُحسب التقييم من إجاباتك الأولى في الاختبارات (لا من إعادة المحاولة)، ومن نقاط التحقق في المشروع، ومن الامتحان النهائي.</p>';
  h+='<div class="tw"><table><thead><tr><th>المحور</th><th>النتيجة</th><th>الوزن</th></tr></thead><tbody>'+
    '<tr><td>اختبارات المفاهيم والأقسام</td><td>'+c.ok+' صحيحة من '+c.n+' مُجابة (من أصل '+c.total+')</td><td>35%</td></tr>'+
    '<tr><td>المشروع العملي (نقاط التحقق)</td><td>'+ck+' / '+ckT+' — أنجزت '+pT+' من '+D.project.tasks.length+' مهام</td><td>40%</td></tr>'+
    '<tr><td>الامتحان النهائي</td><td>'+x.ok+' صحيحة من '+x.n+' مُجابة (من أصل '+x.total+')</td><td>25%</td></tr></tbody></table></div>';
  if(cover<0.9||pT<D.project.tasks.length||x.n<x.total){
    h+='<div class="verdict">التقييم غير مكتمل بعد: أنجزت '+Math.round(cover*100)+'% من أنشطة الدورة. أكمل كل الأقسام والمشروع والامتحان لتحصل على حكم نهائي موثوق.</div>';
  }
  const total=Math.round(100*(0.35*pc+0.40*pp+0.25*px));
  const lv=total>=85?'متمكّن: تستطيع تصميم نظام صغير إلى متوسط وتبرير قراراتك وتطويره باستقلالية.':total>=70?'كفء: الأساس متين، وتحتاج إلى ممارسة أكثر في المحاور الأضعف أدناه.':total>=50?'في طور التكوّن: فهمت الأفكار العامة لكن التطبيق المستقل ما زال يحتاج إلى تدريب.':'مبتدئ: أعد دراسة الأقسام الضعيفة ثم كرّر المشروع دون النظر إلى الحلول.';
  h+='<div class="verdict">الدرجة المركّبة الحالية: '+total+'% — '+lv+'</div><h3>أداؤك حسب القسم</h3><div class="tw"><table><thead><tr><th>القسم</th><th>الإجابات الأولى الصحيحة</th><th>التوصية</th></tr></thead><tbody>';
  D.modules.forEach(m=>m.lessons.forEach(l=>{
    const f=firstScore(l.qs); if(!l.qs.length) return;
    const p=f.n?Math.round(100*f.ok/f.n):null;
    h+='<tr><td><a href="#'+l.id+'">'+(l.mi+1)+'.'+(l.li+1)+' '+esc(l.t)+'</a></td><td>'+(p===null?'لم يبدأ':f.ok+'/'+f.n+' ('+p+'%)')+'</td><td>'+(p===null?'ابدأ هذا القسم':f.n<f.total?'أكمل القسم':p>=80?'متقن':p>=60?'مراجعة سريعة':'أعد دراسته')+'</td></tr>';
  }));
  h+='</tbody></table></div><h3>ماذا بعد؟</h3><ul><li>كرّر المشروع النهائي على نظام من اختيارك (مثل نظام إدارة ورشة أو مطعم) دون فتح التلميحات.</li><li>خذ مشروع Django قديمًا لك وارسم له Class Diagram و Sequence Diagram ثم ابحث فيه عن tight coupling و low cohesion.</li><li>انتقل إلى مواضيع الوحدة 5 بعمق: SOLID ثم Design Patterns ثم Clean Architecture.</li></ul>';
  return h+pn('eval');
}

/* ---------- shell ---------- */
function navHTML(){
  const item=r=>'<a href="#'+r.id+'" data-r="'+r.id+'"><span class="dot"></span><span>'+esc(r.t)+'</span></a>';
  let h=item(routes[0]);
  D.modules.forEach((m,mi)=>{
    h+='<div class="mod '+(S.shut[mi]?'shut':'')+'" data-m="'+mi+'"><button class="mh" data-act="mod"><span>الوحدة '+(mi+1)+': '+esc(m.t)+'</span><span class="cnt"></span></button><div class="ml">'+
      m.lessons.map(l=>item({id:l.id,t:(mi+1)+'.'+(l.li+1)+' '+l.t})).join('')+'</div></div>';
  });
  return h+'<div class="mh" style="cursor:default">التطبيق والتقييم</div>'+routes.slice(-3).map(item).join('');
}
let cur='home', tick=null;
function refresh(){
  const d=doneCount(), p=Math.round(100*d/TOTAL);
  $('#bar').style.width=p+'%'; $('#pct').textContent=p+'%';
  $$('#nav a').forEach(a=>{const r=routes.find(x=>x.id===a.dataset.r); a.classList.toggle('done',routeDone(r)); a.classList.toggle('cur',r.id===cur);});
  $$('#nav .mod').forEach(el=>{const m=D.modules[+el.dataset.m]; $('.cnt',el).textContent=m.lessons.filter(lesDone).length+'/'+m.lessons.length;});
  const r=routes.find(x=>x.id===cur);
  if(r.l){
    $$('#main .card').forEach(c=>{const it=r.l.items[+c.dataset.card]; c.classList.toggle('done',it.q?!!S.a[it.q.id]:tDone(it.task.id));});
    const sc=$('#main [data-score]'); if(sc) sc.outerHTML=scoreLine(r.l.test.map(q=>q.id),'نتيجة اختبار القسم');
  }else if(cur==='project'){
    $$('#main .card').forEach(c=>c.classList.toggle('done',tDone(D.project.tasks[+c.dataset.card].id)));
  }else if(cur==='exam'){
    const sc=$('#main [data-score]'); if(sc) sc.outerHTML=scoreLine(D.exam.map(q=>q.id),'نتيجة الامتحان');
  }
}
function timerTick(){
  const el=$('#timer'); if(!el||!S.exam) return;
  const left=S.exam+30*60*1000-Date.now();
  el.textContent=left>0?fmt(left):'انتهى الوقت';
}
function go(){
  let id=location.hash.slice(1)||'home';
  let r=routes.find(x=>x.id===id); if(!r){r=routes[0];id='home';}
  cur=id; if(id!=='home'){S.last=id; save();}
  $('#main').innerHTML=r.l?pageLesson(r.l):id==='project'?pageProject():id==='exam'?pageExam():id==='eval'?pageEval():pageHome();
  document.body.classList.remove('nav-open');
  refresh(); window.scrollTo(0,0);
  clearInterval(tick); if(id==='exam'){timerTick(); tick=setInterval(timerTick,1000);}
  const c=$('#nav a.cur'); if(c&&c.scrollIntoView) c.scrollIntoView({block:'nearest'});
}
function cardKey(card){return cur+'.'+card.dataset.card;}
function setOpen(card,v){card.classList.toggle('open',v); S.open[cardKey(card)]=v; const b=$('.card-h',card); if(b) b.setAttribute('aria-expanded',v);}

/* ---------- events ---------- */
$('#main').addEventListener('click',function(e){
  const opt=e.target.closest('.opt');
  if(opt&&!opt.disabled){const qel=opt.closest('.q'); answer(qel.dataset.q,+opt.dataset.o); rerenderQ(qel); return;}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, qel=b.closest('.q'), card=b.closest('.card');
  if(act==='check'){const v=$('input',qel).value.trim(); if(!v){$('input',qel).focus();return;} answer(qel.dataset.q,v); rerenderQ(qel);}
  else if(act==='retry'){delete S.a[qel.dataset.q]; save(); rerenderQ(qel);}
  else if(act==='selfok'){S.a[qel.dataset.q].ok=true; save(); rerenderQ(qel);}
  else if(act==='toggle'){setOpen(card,!card.classList.contains('open')); save();}
  else if(act==='openall'||act==='shutall'){$$('#main .card').forEach(c=>setOpen(c,act==='openall')); save();}
  else if(act==='nextcard'){
    const nx=card.nextElementSibling; setOpen(card,false);
    if(nx&&nx.classList.contains('card')){setOpen(nx,true); nx.scrollIntoView({block:'start'}); window.scrollBy(0,-60);}
    else if(nx){nx.scrollIntoView({block:'start'}); window.scrollBy(0,-60);}
    save();
  }
  else if(act==='reveal'){const tel=b.closest('.task'), id=tel.dataset.t; S.t[id]=S.t[id]||{}; S.t[id].rev=true; S.t[id].c=T[id].checks.map(()=>false); save(); tel.outerHTML=tHTML(T[id]); refresh();}
  else if(act==='startexam'){S.exam=Date.now(); save(); b.remove(); timerTick();}
  else if(act==='copy'){
    const code=$('code',b.closest('.code')).textContent;
    const done=()=>{b.textContent='تم النسخ ✓'; setTimeout(()=>b.textContent='نسخ',1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done,fallback); else fallback();
    function fallback(){const ta=document.createElement('textarea'); ta.value=code; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(_){} ta.remove();}
  }
});
function rerenderQ(qel){
  const id=qel.dataset.q, q=Q[id], lab=qel.querySelector('.q-top span:nth-child(2)').textContent, m=lab.match(/\d+/);
  qel.outerHTML=qHTML(q,m?+m[0]:0); refresh();
}
$('#main').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.matches('.sa input')){const b=$('[data-act=check]',e.target.closest('.q')); if(b) b.click();}
});
$('#main').addEventListener('input',function(e){
  if(e.target.tagName==='TEXTAREA'){
    const tel=e.target.closest('.task'), id=tel.dataset.t; S.t[id]=S.t[id]||{}; S.t[id].txt=e.target.value; save();
    const b=$('[data-act=reveal]',tel); if(b) b.disabled=e.target.value.trim().length<MIN;
  }
});
$('#main').addEventListener('change',function(e){
  if(e.target.matches('.checks input')){const id=e.target.closest('.task').dataset.t; S.t[id].c[+e.target.dataset.c]=e.target.checked; save();}
});
$('#nav').addEventListener('click',function(e){
  const b=e.target.closest('[data-act=mod]'); if(!b) return;
  const el=b.parentNode; el.classList.toggle('shut'); S.shut[el.dataset.m]=el.classList.contains('shut'); save();
});
$('#menu').addEventListener('click',()=>document.body.classList.toggle('nav-open'));
function applyTheme(){const t=S.theme||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'); document.documentElement.dataset.theme=t;}
$('#theme').addEventListener('click',()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'; save(); applyTheme();});
let armed=0;
$('#reset').addEventListener('click',function(){
  if(Date.now()-armed<5000){
    const th=S.theme; S=blank(); S.theme=th; try{localStorage.removeItem(KEY);}catch(e){} save();
    this.textContent='إعادة ضبط التقدّم'; armed=0; $('#nav').innerHTML=navHTML();
    if(location.hash&&location.hash!=='#home') location.hash='#home'; else go();
  }else{armed=Date.now(); this.textContent='اضغط مجددًا لتأكيد المسح'; setTimeout(()=>{if(armed){armed=0; this.textContent='إعادة ضبط التقدّم';}},5000);}
});
window.addEventListener('hashchange',go);
applyTheme(); $('#nav').innerHTML=navHTML(); go();
})();
</script>
</body>
</html>
