ود، أو تغيّره في النظام كله بقرار موثّق.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}], "test": [{"id": "m3l5t1", "type": "mc", "q": "<p>أي مما يلي <b>لا<\/b> يُعدّ من وسائل الحفاظ على الـ conceptual integrity؟<\/p>", "exp": "<p>حرية الأسلوب لكل مطوّر هي بالضبط ما يهدم الاتساق.<\/p>", "opts": ["linter و formatter يعملان تلقائيًا", "إرشادات تطوير مشتركة مكتوبة", "توثيق القرارات المعمارية", "أن يختار كل مطوّر الأسلوب الذي يفضّله في ملفاته"], "ans": 3}, {"id": "m3l5t2", "type": "sc", "sc": "API فيها: <code dir=\"ltr\">GET /reservations/<\/code> تعيد قائمة، و <code dir=\"ltr\">GET /getCustomerList<\/code> تعيد <code dir=\"ltr\">{\"data\": [...]}<\/code>، وعند الخطأ تعيد الأولى <code dir=\"ltr\">{\"detail\": \"...\"}<\/code> والثانية نصًّا عاديًا.", "q": "<p>ما الذي ينقصها؟<\/p>", "exp": "<p>مستهلك الـ API مضطر إلى معالجة كل endpoint بطريقة خاصة. الاتساق يجعل التعامل متوقعًا.<\/p>", "opts": ["endpoints أكثر", "قاعدة بيانات أخرى", "سرعة أعلى", "Consistent API design: شكل موحّد للمسارات والـ responses والأخطاء"], "ans": 3}, {"id": "m3l5t3", "type": "sa", "q": "<p>ما اسم وثيقة أسلوب كتابة كود Python المرجعية؟ (مثل: PEP متبوعة برقم)<\/p>", "exp": "<p>الإجابة: <b>PEP 8<\/b>.<\/p>", "kw": ["PEP 8", "PEP8"]}]}, {"t": "Inheritance Pitfalls", "intro": "<p>الوراثة أداة قوية، لكن هرم وراثة سيئًا يجعل البرنامج صعب الصيانة. هذه أربع مشاكل شائعة وعلاجها.<\/p>", "items": [{"t": "المشكلة 1: الوراثة غير الصحيحة", "html": "<p>افترض أنك كتبت <code dir=\"ltr\">class Customer(Account)<\/code>.<\/p>\n<p>قد يكون ذلك مناسبًا في نظام يكون فيه العميل فعلًا <b>نوعًا من<\/b> الحسابات. لكنه ليس صحيحًا تلقائيًا لمجرد أن للعميل «معلومات حساب». يجب أن تنمذج <b>العلاقة الفعلية<\/b>: هل العميل <b>هو<\/b> حساب، أم <b>يملك<\/b> حسابًا؟ في معظم الأنظمة: يملك حسابًا أو عدة حسابات (has-a).<\/p>\n<p>المثال الكلاسيكي لوراثة تبدو منطقية وتفشل، المربع والمستطيل:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Rectangle:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, width: float, height: float):\n        <span class=\"kw\">self<\/span>.width = width\n        <span class=\"kw\">self<\/span>.height = height\n\n    <span class=\"kw\">def<\/span> area(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>.width * <span class=\"kw\">self<\/span>.height\n\n<span class=\"kw\">class<\/span> Square(Rectangle):\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, side: float):\n        super().__init__(side, side)\n\n<span class=\"kw\">def<\/span> stretch(shape: Rectangle) -&gt; float:\n    shape.width = <span class=\"nu\">10<\/span>            <span class=\"cm\"># كود يتوقع مستطيلًا: يغيّر العرض فقط<\/span>\n    <span class=\"kw\">return<\/span> shape.area()\n\nprint(stretch(Rectangle(<span class=\"nu\">2<\/span>, <span class=\"nu\">3<\/span>)))   <span class=\"cm\"># 30  كما هو متوقع<\/span>\nprint(stretch(Square(<span class=\"nu\">3<\/span>)))         <span class=\"cm\"># 30  لكن الشكل لم يعد مربعًا: 10 × 3<\/span><\/code><\/pre><\/div>\n<p>رياضيًا المربع مستطيل، لكن <b>سلوكيًا<\/b> لا يصلح بديلًا عنه. هذا خرق لـ <b>Liskov Substitution Principle (LSP)<\/b>: يجب أن يصلح الـ subclass في كل مكان يُنتظر فيه الأب دون مفاجآت.<\/p>", "q": {"id": "m3l6c1", "type": "mc", "q": "<p>ما المعيار الذي يحدّده Liskov Substitution Principle لصحة الوراثة؟<\/p>", "exp": "<p>الاشتراك في الحقول أو توفير الكود لا يكفي. المعيار هو الاستبدال السلوكي.<\/p>", "opts": ["أن يشترك الـ class-ان في بعض الـ attributes", "أن يكون اسم الـ subclass أطول", "أن يوفّر الـ subclass أسطرًا من الكود", "أن يصلح الـ subclass بديلًا عن الـ superclass في كل موضع دون كسر توقّعات الكود"], "ans": 3}}, {"t": "المشكلة 2: هرم الوراثة العميق", "html": "<p>تأمّل السلسلة: <code dir=\"ltr\">A → B → C → D → E<\/code>.<\/p>\n<p>لتفهم سلوك <code dir=\"ltr\">E<\/code> يجب أن تقرأ خمسة classes، لأن أي method قد تكون معرّفة في أي مستوى أو معدّلة (override) في مستوى آخر. وتغيير في مستوى عالٍ مثل <code dir=\"ltr\">A<\/code> قد يؤثّر دون توقّع في كل ما تحته.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Entity:              ...\n<span class=\"kw\">class<\/span> Person(Entity):      ...\n<span class=\"kw\">class<\/span> Employee(Person):    ...\n<span class=\"kw\">class<\/span> Manager(Employee):   ...\n<span class=\"kw\">class<\/span> RegionalManager(Manager): ...     <span class=\"cm\"># أين عُرّفت full_name()؟ ومن عدّلها؟<\/span><\/code><\/pre><\/div>\n<p>يسمّى السؤال الأخير مشكلة <b>yo-yo<\/b>: تصعد وتنزل في الهرم لتتبّع استدعاء واحد.<\/p>\n<p>مقياس بسيط: <b>Depth of Inheritance Tree (DIT)<\/b>، أي عدد المستويات من الـ class إلى الجذر. <code dir=\"ltr\">RegionalManager<\/code> هنا عمقه 4.<\/p>\n<p>إرشادات:<\/p>\n<ul><li>فضّل الأهرام <b>المسطّحة<\/b>: مستوى أو مستويان في كود التطبيق.<\/li><li>إذا تجاوز العمق ثلاثة فاسأل: هل كل مستوى يمثّل is-a حقيقية، أم كنا نرث «لنستعير بعض الكود»؟<\/li><li>في Python تعرض الخاصية <code dir=\"ltr\">RegionalManager.__mro__<\/code> ترتيب البحث عن الـ methods (Method Resolution Order).<\/li><\/ul>", "q": {"id": "m3l6c2", "type": "tf", "q": "<p>كلما زاد عمق هرم الوراثة صار فهم سلوك الـ class الأخير أصعب.<\/p>", "exp": "<p>نعم: كل مستوى إضافي مكان آخر قد يُعرَّف أو يُعدَّل فيه السلوك، فيصعب التتبّع ويتّسع أثر أي تغيير في الأعلى.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "المشكلة 3: Fragile Base Class", "html": "<p><b>Fragile base class problem<\/b>: تغيير يبدو بريئًا في الـ parent class يكسر، دون قصد، subclasses تعتمد على سلوكه القائم.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Collection:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._items = []\n\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, item) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._items.append(item)\n\n    <span class=\"kw\">def<\/span> add_all(<span class=\"kw\">self<\/span>, items) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">for<\/span> item <span class=\"kw\">in<\/span> items:\n            <span class=\"kw\">self<\/span>.add(item)                 <span class=\"cm\"># (*) تعتمد على add<\/span>\n\n<span class=\"kw\">class<\/span> CountingCollection(Collection):\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        super().__init__()\n        <span class=\"kw\">self<\/span>.count = <span class=\"nu\">0<\/span>\n\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, item) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>.count += <span class=\"nu\">1<\/span>\n        super().add(item)\n\nc = CountingCollection()\nc.add_all([<span class=\"st\">\"a\"<\/span>, <span class=\"st\">\"b\"<\/span>, <span class=\"st\">\"c\"<\/span>])\nprint(c.count)        <span class=\"cm\"># 3<\/span><\/code><\/pre><\/div>\n<p>الآن يحسّن صاحب <code dir=\"ltr\">Collection<\/code> الأداء فيغيّر السطر (*) إلى <code dir=\"ltr\">self._items.extend(items)<\/code>. الـ <code dir=\"ltr\">Collection<\/code> ما زال يعمل تمامًا. لكن <code dir=\"ltr\">c.count<\/code> صار <b>0<\/b> بعد <code dir=\"ltr\">add_all<\/code>، لأن <code dir=\"ltr\">add<\/code> لم تعد تُستدعى.<\/p>\n<p>السبب: الـ subclass اعتمد على <b>تفصيل تنفيذي<\/b> في الأب (أن <code dir=\"ltr\">add_all<\/code> تستدعي <code dir=\"ltr\">add<\/code>)، والوراثة تكشف هذه التفاصيل وتكسر الـ encapsulation بين الأب والابن. ولهذا يوصف الاقتران الذي تصنعه الوراثة بأنه <b>أقوى أنواع الـ coupling<\/b>.<\/p>", "q": {"id": "m3l6c3", "type": "mc", "q": "<p>في المثال، لماذا صار <code dir=\"ltr\">count<\/code> صفرًا بعد تعديل <code dir=\"ltr\">add_all<\/code> في الأب؟<\/p>", "exp": "<p>الابن بنى سلوكه على تفصيل داخلي للأب. حين تغيّر التفصيل انكسر الابن بصمت، وهذه هي هشاشة الـ base class.<\/p>", "opts": ["لأن <code dir=\"ltr\">super().__init__()<\/code> لم يُستدعَ", "لأن Python لا تدعم <code dir=\"ltr\">extend<\/code>", "لأن الـ subclass كان يعتمد على أن <code dir=\"ltr\">add_all<\/code> تستدعي <code dir=\"ltr\">add<\/code>، وهو تفصيل تنفيذي تغيّر", "لأن القائمة فارغة"], "ans": 2}}, {"t": "المشكلة 4: Inheritance بدل Composition", "html": "<p>أحيانًا يحتاج الـ class أن <b>يستعمل<\/b> object آخر، لا أن <b>يرث<\/b> منه.<\/p>\n<p>مثال: <code dir=\"ltr\">Order<\/code> يحتاج معالجة الدفع. خطأ: <code dir=\"ltr\">class Order(PaymentProcessor)<\/code>. الطلب ليس نوعًا من معالجات الدفع. الصحيح أن <b>يحتوي<\/b> <code dir=\"ltr\">Order<\/code> على <code dir=\"ltr\">PaymentProcessor<\/code>:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> PaymentProcessor:\n    <span class=\"kw\">def<\/span> process(<span class=\"kw\">self<\/span>, amount: float) -&gt; bool:\n        print(f<span class=\"st\">\"Charging {amount}\"<\/span>)\n        <span class=\"kw\">return<\/span> <span class=\"kw\">True<\/span>\n\n<span class=\"kw\">class<\/span> Order:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, total: float, processor: PaymentProcessor):\n        <span class=\"kw\">self<\/span>._total = total\n        <span class=\"kw\">self<\/span>._processor = processor          <span class=\"cm\"># has-a: composition<\/span>\n\n    <span class=\"kw\">def<\/span> checkout(<span class=\"kw\">self<\/span>) -&gt; bool:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._processor.process(<span class=\"kw\">self<\/span>._total)    <span class=\"cm\"># delegation<\/span><\/code><\/pre><\/div>\n<p><code dir=\"ltr\">Order<\/code> <b>يفوّض<\/b> (delegates) العمل إلى الـ object الذي يملكه. هذا يقودنا إلى القاعدة المشهورة:<\/p>\n<p><b>Favor Composition over Inheritance.<\/b><\/p>\n<p>مزايا الـ composition:<\/p>\n<ul><li><b>اقتران أضعف<\/b>: <code dir=\"ltr\">Order<\/code> يرى الواجهة العامة للـ processor فقط، لا أحشاءه.<\/li><li><b>مرونة وقت التشغيل<\/b>: يمكن تمرير processor مختلف لكل طلب، بينما الوراثة تُحدَّد عند كتابة الكود.<\/li><li><b>لا واجهة زائدة<\/b>: <code dir=\"ltr\">Order<\/code> لا يرث methods لا معنى لها عنده.<\/li><li><b>اختبار أسهل<\/b>: مرّر processor وهميًا.<\/li><\/ul>", "q": {"id": "m3l6c4", "type": "sc", "sc": "تحتاج <code dir=\"ltr\">Report<\/code> أن يطبع نفسه باستعمال <code dir=\"ltr\">Printer<\/code>.", "q": "<p>أي تصميم أصحّ؟<\/p>", "exp": "<p>التقرير ليس نوعًا من الطابعات. هو يستعمل طابعة، فالـ composition مع التفويض هو المناسب.<\/p>", "opts": ["<code dir=\"ltr\">Report<\/code> يحتفظ بمرجع إلى <code dir=\"ltr\">Printer<\/code> ويفوّض إليه: has-a", "نسخ كود الطباعة داخل <code dir=\"ltr\">Report<\/code>", "<code dir=\"ltr\">class Printer(Report)<\/code>", "<code dir=\"ltr\">class Report(Printer)<\/code> ليرث <code dir=\"ltr\">print()<\/code>"], "ans": 0}}, {"t": "«Favor Composition over Inheritance»: إرشاد لا قاعدة مطلقة", "html": "<p>القاعدة تقول <b>favor<\/b> (فضِّل) ولا تقول «امنع». الوراثة تبقى الخيار الصحيح حين تتحقق شروطها.<\/p>\n<div class=\"tw\"><table><thead><tr><th>استعمل Inheritance حين<\/th><th>استعمل Composition حين<\/th><\/tr><\/thead><tbody><tr><td>توجد علاقة is-a حقيقية وثابتة<\/td><td>العلاقة has-a أو uses<\/td><\/tr><tr><td>ينجح اختبار الاستبدال (LSP)<\/td><td>تريد جزءًا من السلوك فقط<\/td><\/tr><tr><td>تريد polymorphism على نوع مشترك<\/td><td>السلوك يتبدّل وقت التشغيل<\/td><\/tr><tr><td>الهرم مسطّح ومستقر<\/td><td>تجتمع عدة أبعاد مستقلة للتنوّع<\/td><\/tr><\/tbody><\/table><\/div>\n<p>السطر الأخير مهم. لدينا موظفون: بدوام كامل أو جزئي، ويُدفع لهم براتب أو بالساعة. بالوراثة نحتاج class لكل تركيبة، وكل بُعد جديد يضاعف العدد: <span class=\"math\" dir=\"ltr\">2 × 2 = 4<\/span>، ثم مع ثلاثة أنواع عقود <span class=\"math\" dir=\"ltr\">2 × 2 × 3 = 12<\/span>. هذا يسمّى <b>class explosion<\/b>. بالـ composition:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Employee:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str, pay_policy, schedule):\n        <span class=\"kw\">self<\/span>.name = name\n        <span class=\"kw\">self<\/span>._pay_policy = pay_policy      <span class=\"cm\"># SalaryPay أو HourlyPay<\/span>\n        <span class=\"kw\">self<\/span>._schedule = schedule          <span class=\"cm\"># FullTime أو PartTime<\/span>\n\n    <span class=\"kw\">def<\/span> monthly_pay(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._pay_policy.calculate(<span class=\"kw\">self<\/span>._schedule.hours())<\/code><\/pre><\/div>\n<p>عدد الـ classes صار مجموعًا لا جداءً: <span class=\"math\" dir=\"ltr\">2 + 2 + 3 = 7<\/span> بدل 12.<\/p>\n<p>الخلاصة: اسأل أولًا «هل أستطيع حلّها بـ composition؟». وإن كانت is-a حقيقية ومستقرة فالوراثة حل نظيف ومشروع.<\/p>", "q": {"id": "m3l6c5", "type": "mc", "q": "<p>ثلاثة أبعاد مستقلة للتنوّع، في كل منها 3 خيارات. كم class يلزم بالوراثة لتغطية كل التركيبات، وكم بالـ composition؟<\/p>", "exp": "<p>بالوراثة الجداء <span class=\"math\" dir=\"ltr\">3 × 3 × 3 = 27<\/span>، وبالـ composition المجموع <span class=\"math\" dir=\"ltr\">3 + 3 + 3 = 9<\/span>.<\/p>", "opts": ["27 بالوراثة و 9 بالـ composition", "3 بالوراثة و 9 بالـ composition", "9 بالوراثة و 27 بالـ composition", "9 في الحالتين"], "ans": 0}}], "test": [{"id": "m3l6t1", "type": "sc", "sc": "<code dir=\"ltr\">class Penguin(Bird)<\/code> و <code dir=\"ltr\">Bird<\/code> فيها <code dir=\"ltr\">fly()<\/code>. اضطر المطوّر إلى جعل <code dir=\"ltr\">Penguin.fly()<\/code> ترفع استثناء.", "q": "<p>ما المشكلة؟<\/p>", "exp": "<p>الابن يكسر وعدًا قطعه الأب. الأفضل ألّا تكون <code dir=\"ltr\">fly<\/code> في <code dir=\"ltr\">Bird<\/code> أصلًا، بل في قدرة مستقلة مثل <code dir=\"ltr\">Flyer<\/code>.<\/p>", "opts": ["المشكلة في اسم الـ method فقط", "لا مشكلة، الاستثناء حل نظيف", "يجب أن يرث <code dir=\"ltr\">Bird<\/code> من <code dir=\"ltr\">Penguin<\/code>", "خرق LSP: <code dir=\"ltr\">Penguin<\/code> لا يصلح بديلًا عن <code dir=\"ltr\">Bird<\/code> في كود يستدعي <code dir=\"ltr\">fly()<\/code>"], "ans": 3}, {"id": "m3l6t2", "type": "mc", "q": "<p>ما المقصود بـ fragile base class problem؟<\/p>", "exp": "<p>الوراثة تربط الابن بتفاصيل تنفيذ الأب، فأي تغيير فيها قد ينكسر به الابن.<\/p>", "opts": ["الأب لا يحتوي أي method", "استعمال composition بدل الوراثة", "الابن أكبر حجمًا من الأب", "تعديل في الأب يكسر الأبناء المعتمدين على سلوكه الداخلي دون قصد"], "ans": 3}, {"id": "m3l6t3", "type": "tf", "q": "<p>قاعدة «Favor Composition over Inheritance» تعني أن استعمال الوراثة خطأ دائمًا.<\/p>", "exp": "<p>هي إرشاد. الوراثة مناسبة عند وجود is-a حقيقية مستقرة ونجاح اختبار الاستبدال.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m3l6t4", "type": "sa", "q": "<p>ما المصطلح الإنجليزي لأن يُحيل object تنفيذ عمل إلى object آخر يملكه بدل أن يرثه؟<\/p>", "exp": "<p>الإجابة: <b>Delegation<\/b> (التفويض)، وهو قلب الـ composition.<\/p>", "kw": ["delegat"]}]}, {"t": "UML Sequence Diagrams", "intro": "<p>ننتقل إلى السلوك. الـ class diagram يخبرك أن <code dir=\"ltr\">OrderService<\/code> و <code dir=\"ltr\">InventoryService<\/code> موجودان. الـ sequence diagram يشرح <b>كيف يتفاعلان<\/b> حين يُنشأ طلب.<\/p>", "items": [{"t": "ما هو الـ Sequence Diagram؟", "html": "<p><b>Sequence Diagram<\/b> يصف كيف تتواصل الـ objects أثناء تنفيذ <b>عملية واحدة محدّدة<\/b> (scenario)، مع التركيز على <b>ترتيب الرسائل عبر الزمن<\/b>.<\/p>\n<p>محوراه:<\/p>\n<ul><li><b>أفقيًا<\/b>: المشاركون في العملية، كلٌّ في عمود.<\/li><li><b>رأسيًا<\/b>: الزمن، يجري من <b>الأعلى إلى الأسفل<\/b>. الرسالة الأعلى تحدث أولًا.<\/li><\/ul>\n<figure class=\"fig\" dir=\"ltr\"><svg viewBox=\"0 0 840 450\" width=\"840\" role=\"img\" aria-label=\"Sequence diagram: creating an order\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"62\" cy=\"12\" r=\"7\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><line x1=\"62\" y1=\"19\" x2=\"62\" y2=\"34\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><line x1=\"52\" y1=\"25\" x2=\"72\" y2=\"25\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><line x1=\"62\" y1=\"34\" x2=\"54\" y2=\"44\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><line x1=\"62\" y1=\"34\" x2=\"70\" y2=\"44\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><text x=\"62\" y=\"60\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Customer<\/text><line x1=\"62\" y1=\"62\" x2=\"62\" y2=\"444\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><rect x=\"138\" y=\"14\" width=\"132\" height=\"30\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"204\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Frontend<\/text><line x1=\"204\" y1=\"44\" x2=\"204\" y2=\"444\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><rect x=\"280\" y=\"14\" width=\"132\" height=\"30\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"346\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >OrderAPI<\/text><line x1=\"346\" y1=\"44\" x2=\"346\" y2=\"444\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><rect x=\"422\" y=\"14\" width=\"132\" height=\"30\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"488\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >OrderService<\/text><line x1=\"488\" y1=\"44\" x2=\"488\" y2=\"444\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><rect x=\"564\" y=\"14\" width=\"132\" height=\"30\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"630\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >InventoryService<\/text><line x1=\"630\" y1=\"44\" x2=\"630\" y2=\"444\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><rect x=\"706\" y=\"14\" width=\"132\" height=\"30\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"772\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Database<\/text><line x1=\"772\" y1=\"44\" x2=\"772\" y2=\"444\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><rect x=\"199\" y=\"98\" width=\"10\" height=\"300\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><rect x=\"341\" y=\"132\" width=\"10\" height=\"232\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><rect x=\"483\" y=\"166\" width=\"10\" height=\"164\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><rect x=\"625\" y=\"200\" width=\"10\" height=\"48.39999999999999\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><rect x=\"767\" y=\"268\" width=\"10\" height=\"48.39999999999999\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><line x1=\"67\" y1=\"98\" x2=\"199\" y2=\"98\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(199,98) rotate(0)\"><polygon points=\"0,0 -10,-5 -10,5\" style=\"fill:var(--ink);stroke:var(--ink)\"/><\/g><text x=\"133.0\" y=\"92\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >1: click \"Create Order\"<\/text><line x1=\"209\" y1=\"132\" x2=\"341\" y2=\"132\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(341,132) rotate(0)\"><polygon points=\"0,0 -10,-5 -10,5\" style=\"fill:var(--ink);stroke:var(--ink)\"/><\/g><text x=\"275.0\" y=\"126\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >2: POST /orders<\/text><line x1=\"351\" y1=\"166\" x2=\"483\" y2=\"166\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(483,166) rotate(0)\"><polygon points=\"0,0 -10,-5 -10,5\" style=\"fill:var(--ink);stroke:var(--ink)\"/><\/g><text x=\"417.0\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >3: create_order(data)<\/text><line x1=\"493\" y1=\"200\" x2=\"625\" y2=\"200\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(625,200) rotate(0)\"><polygon points=\"0,0 -10,-5 -10,5\" style=\"fill:var(--ink);stroke:var(--ink)\"/><\/g><text x=\"559.0\" y=\"194\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >4: check_stock(items)<\/text><line x1=\"625\" y1=\"234\" x2=\"493\" y2=\"234\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><g transform=\"translate(493,234) rotate(180)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"559.0\" y=\"228\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >5: available<\/text><line x1=\"493\" y1=\"268\" x2=\"767\" y2=\"268\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(767,268) rotate(0)\"><polygon points=\"0,0 -10,-5 -10,5\" style=\"fill:var(--ink);stroke:var(--ink)\"/><\/g><text x=\"630.0\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >6: save(order)<\/text><line x1=\"767\" y1=\"302\" x2=\"493\" y2=\"302\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><g transform=\"translate(493,302) rotate(180)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"630.0\" y=\"296\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >7: order_id<\/text><line x1=\"483\" y1=\"336\" x2=\"351\" y2=\"336\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><g transform=\"translate(351,336) rotate(180)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"417.0\" y=\"330\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >8: order<\/text><line x1=\"341\" y1=\"370\" x2=\"209\" y2=\"370\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><g transform=\"translate(209,370) rotate(180)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"275.0\" y=\"364\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >9: 201 Created<\/text><line x1=\"199\" y1=\"404\" x2=\"67\" y2=\"404\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><g transform=\"translate(67,404) rotate(180)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"133.0\" y=\"398\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >10: show confirmation<\/text><\/svg><\/figure>\n<p>هذا المخطط يكمل مثال الـ roadmap (إنشاء طلب) بعد تصحيحه: أضفنا رسائل الرجوع الناقصة، حتى يعود كل استدعاء إلى من استدعاه قبل أن يصل الردّ إلى الـ Frontend.<\/p>\n<p>متى نرسمه؟ لعملية مهمة أو معقّدة أو متنازع على فهمها. لا نرسم مخططًا لكل method. مخطط واحد لكل use case رئيسي يكفي غالبًا.<\/p>", "q": {"id": "m3l7c1", "type": "mc", "q": "<p>في الـ Sequence Diagram، ماذا يمثّل الاتجاه الرأسي من الأعلى إلى الأسفل؟<\/p>", "exp": "<p>الزمن يجري إلى الأسفل، ولهذا يُقرأ المخطط من أعلى إلى أسفل رسالةً رسالة.<\/p>", "opts": ["عدد الـ attributes", "مرور الزمن: ما في الأعلى يحدث قبل ما في الأسفل", "أهمية الـ class", "هرم الوراثة"], "ans": 1}}, {"t": "الـ Actors والـ Participants والـ Lifelines", "html": "<ul><li><b>Actor<\/b>: طرف <b>خارج<\/b> النظام يبدأ التفاعل. شخص (Customer) أو نظام آخر. يُرسم على هيئة رجل من خطوط (stick figure).<\/li><li><b>Participant<\/b>: object أو مكوّن <b>داخل<\/b> النظام يشارك في العملية. يُرسم مستطيلًا فيه اسمه، بالصيغة <code dir=\"ltr\">name: Class<\/code> أو اسم الـ class فقط.<\/li><li><b>Lifeline<\/b>: الخط <b>الرأسي المتقطّع<\/b> النازل من كل مشارك. يمثّل وجود ذلك المشارك عبر زمن العملية. الرسائل تخرج من lifeline وتدخل في أخرى.<\/li><\/ul>\n<p>ملاحظات:<\/p>\n<ul><li>رتّب المشاركين من اليسار إلى اليمين بحسب ترتيب دخولهم في العملية. هكذا تتجه معظم الأسهم يمينًا ويسهل تتبّعها.<\/li><li>المشاركون في الـ sequence diagram هم <b>instances<\/b> (objects)، وليسوا classes. مشارك اسمه <code dir=\"ltr\">order: Order<\/code> هو object محدّد من الـ class <code dir=\"ltr\">Order<\/code>.<\/li><li>كل مشارك هنا يجب أن يقابله class في الـ class diagram، وإلا فالنموذجان غير متّسقين.<\/li><\/ul>", "q": {"id": "m3l7c2", "type": "mc", "q": "<p>ما الفرق بين actor و participant؟<\/p>", "exp": "<p>الـ actor خارج حدود النظام (مستخدم أو نظام آخر)، والـ participants هي الـ objects الداخلية.<\/p>", "opts": ["لا فرق بينهما", "الـ actor طرف خارجي يبدأ التفاعل مع النظام، والـ participant object داخل النظام يشارك في العملية", "الـ participant دائمًا إنسان", "الـ actor دائمًا قاعدة بيانات"], "ans": 1}}, {"t": "الرسائل: Synchronous و Asynchronous و Return", "html": "<p><b>Message<\/b> هي استدعاء أو إشارة من مشارك إلى آخر. تُرسم سهمًا أفقيًا فوقه اسمها. الأنواع الثلاثة:<\/p>\n<div class=\"tw\"><table><thead><tr><th>النوع<\/th><th>الرسم<\/th><th>المعنى<\/th><\/tr><\/thead><tbody><tr><td><b>Synchronous<\/b><\/td><td>خط متصل برأس <b>مملوء<\/b><\/td><td>المرسل <b>ينتظر<\/b> حتى ينتهي المستقبِل. هذا استدعاء method عادي<\/td><\/tr><tr><td><b>Asynchronous<\/b><\/td><td>خط متصل برأس <b>مفتوح<\/b><\/td><td>المرسل <b>لا ينتظر<\/b> ويكمل عمله: إضافة مهمة إلى queue أو إرسال event<\/td><\/tr><tr><td><b>Return<\/b><\/td><td>خط <b>متقطّع<\/b> برأس مفتوح<\/td><td>رجوع النتيجة إلى المرسل<\/td><\/tr><\/tbody><\/table><\/div>\n<p>في Python:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>available = inventory.check_stock(items)     <span class=\"cm\"># synchronous: السطر التالي ينتظر النتيجة<\/span>\nemail_queue.put((<span class=\"st\">\"order_confirmed\"<\/span>, order_id))   <span class=\"cm\"># asynchronous: نضع المهمة ونمضي<\/span><\/code><\/pre><\/div>\n<p>متى نختار async؟ حين لا يحتاج المرسل النتيجة ليكمل. إرسال بريد التأكيد لا يجب أن يؤخّر الردّ على العميل. أما التحقق من المخزون فيجب انتظاره، لأن القرار التالي مبني عليه.<\/p>\n<p>رسائل الـ return يمكن حذفها حين تكون بديهية، لكن ارسمها إذا كانت القيمة المعادة مهمة للفهم (مثل <code dir=\"ltr\">available<\/code> أو <code dir=\"ltr\">order_id<\/code>).<\/p>", "q": {"id": "m3l7c3", "type": "sc", "sc": "بعد حفظ الطلب، يضع <code dir=\"ltr\">OrderService<\/code> مهمة «أرسل بريد التأكيد» في queue ويعيد النتيجة للعميل فورًا دون انتظار الإرسال.", "q": "<p>كيف تُرسم رسالة البريد؟<\/p>", "exp": "<p>المرسل لا ينتظر اكتمال العمل، وهذا تعريف الرسالة غير المتزامنة.<\/p>", "opts": ["رسالة asynchronous: خط متصل برأس سهم مفتوح", "لا تُرسم إطلاقًا", "رسالة return: خط متقطّع", "رسالة synchronous: خط متصل برأس مملوء"], "ans": 0}}, {"t": "الـ Activation Bars وترتيب الرسائل", "html": "<p><b>Activation bar<\/b> (وتسمّى execution specification): مستطيل رفيع على الـ lifeline يبيّن الفترة التي يكون فيها المشارك <b>نشطًا<\/b>، أي ينفّذ method أو ينتظر ردّ استدعاء أجراه.<\/p>\n<p>كيف يُقرأ؟ يبدأ الشريط عند وصول الرسالة وينتهي عند إرسال الـ return. في المخطط السابق، شريط <code dir=\"ltr\">OrderService<\/code> يمتد من <code dir=\"ltr\">create_order<\/code> إلى رجوع <code dir=\"ltr\">order<\/code>، وخلاله يستدعي المخزون ثم قاعدة البيانات. فالأشرطة تُظهر <b>التداخل<\/b>: من ينتظر من.<\/p>\n<p><b>Message ordering<\/b>: القاعدة الأساسية أن الترتيب من الأعلى إلى الأسفل هو الترتيب الزمني. ويمكن ترقيم الرسائل (1، 2، 3) للإشارة إليها في النقاش.<\/p>\n<p>الترتيب ليس تفصيلًا شكليًا، بل قد يكون قاعدة عمل. في مثالنا يجب أن تأتي <code dir=\"ltr\">check_stock<\/code> <b>قبل<\/b> <code dir=\"ltr\">save(order)<\/code>. لو عكسناهما لحفظنا طلبًا لبضاعة غير موجودة. كثير من الأخطاء التي يكشفها المخطط هي أخطاء ترتيب.<\/p>\n<p><b>Self-message<\/b>: سهم يخرج من الـ lifeline ويعود إليها، حين يستدعي object إحدى methods نفسه (مثل <code dir=\"ltr\">validate()<\/code> داخلية).<\/p>", "q": {"id": "m3l7c4", "type": "tf", "q": "<p>الـ activation bar على lifeline يبيّن الفترة التي ينفّذ فيها المشارك عملًا أو ينتظر ردًّا على استدعاء أجراه.<\/p>", "exp": "<p>يبدأ عند استقبال الرسالة وينتهي عند الرجوع، ويُظهر تداخل الاستدعاءات.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "الـ Combined Fragments: alt و opt و loop", "html": "<p>المخطط البسيط يصف مسارًا واحدًا. للتعبير عن <b>السلوك الشرطي<\/b> والتكرار نستعمل <b>combined fragments<\/b>: إطار مستطيل يحيط بمجموعة رسائل، وفي زاويته كلمة تحدّد نوعه، ومعه شرط بين قوسين مربعين يسمّى <b>guard<\/b>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Fragment<\/th><th>المعنى<\/th><th>المقابل في Python<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">alt<\/code><\/td><td>بدائل: يُنفَّذ قسم واحد حسب الشرط<\/td><td><code dir=\"ltr\">if / else<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">opt<\/code><\/td><td>اختياري: يُنفَّذ فقط إذا تحقق الشرط<\/td><td><code dir=\"ltr\">if<\/code> بلا <code dir=\"ltr\">else<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">loop<\/code><\/td><td>تكرار ما دام الشرط صحيحًا<\/td><td><code dir=\"ltr\">for<\/code> أو <code dir=\"ltr\">while<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>مثال نصي لمثالنا مع حالة نقص المخزون:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>OrderService -&gt; InventoryService : check_stock(items)\nInventoryService --&gt; OrderService : available\n\nalt [available]\n    OrderService -&gt; Database : save(order)\n    Database --&gt; OrderService : order_id\n    OrderService --&gt; OrderAPI : order\nelse [not available]\n    OrderService --&gt; OrderAPI : OutOfStockError\nend\n\nopt [customer.wants_sms]\n    OrderService -&gt;&gt; SmsQueue : enqueue(confirmation)\nend<\/code><\/pre><\/div>\n<p>والكود المقابل:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> create_order(<span class=\"kw\">self<\/span>, data):\n    <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> <span class=\"kw\">self<\/span>._inventory.check_stock(data.items):      <span class=\"cm\"># alt<\/span>\n        <span class=\"kw\">raise<\/span> OutOfStockError()\n    order_id = <span class=\"kw\">self<\/span>._db.save(Order(data))\n    <span class=\"kw\">if<\/span> data.customer.wants_sms:                          <span class=\"cm\"># opt<\/span>\n        <span class=\"kw\">self<\/span>._sms_queue.put(order_id)\n    <span class=\"kw\">return<\/span> order_id<\/code><\/pre><\/div>\n<p>نصيحة: لا تحشر كل الاحتمالات في مخطط واحد. مسار النجاح مع أهم بديل أو اثنين يكفي.<\/p>", "q": {"id": "m3l7c5", "type": "mc", "q": "<p>أي combined fragment يقابل <code dir=\"ltr\">if ... else ...<\/code>؟<\/p>", "exp": "<p><code dir=\"ltr\">alt<\/code> يعبّر عن بدائل متنافية، يُنفَّذ منها واحد بحسب الـ guard. <code dir=\"ltr\">opt<\/code> يقابل <code dir=\"ltr\">if<\/code> دون <code dir=\"ltr\">else<\/code>.<\/p>", "opts": ["<code dir=\"ltr\">ref<\/code>", "<code dir=\"ltr\">loop<\/code>", "<code dir=\"ltr\">alt<\/code>", "<code dir=\"ltr\">opt<\/code>"], "ans": 2}}, {"t": "قراءة مخطط وتحويله إلى كود", "html": "<p>لنحوّل مخطط إنشاء الطلب إلى Python. القاعدة: <b>كل سهم داخل إلى مشارك هو method فيه<\/b>، وما يخرج من شريط الـ activation هو جسم تلك الـ method.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> InventoryService:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, stock: dict):\n        <span class=\"kw\">self<\/span>._stock = stock\n\n    <span class=\"kw\">def<\/span> check_stock(<span class=\"kw\">self<\/span>, items: dict) -&gt; bool:                    <span class=\"cm\"># رسالة 4<\/span>\n        <span class=\"kw\">return<\/span> all(<span class=\"kw\">self<\/span>._stock.get(name, <span class=\"nu\">0<\/span>) &gt;= qty <span class=\"kw\">for<\/span> name, qty <span class=\"kw\">in<\/span> items.items())\n\n<span class=\"kw\">class<\/span> Database:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._orders = []\n\n    <span class=\"kw\">def<\/span> save(<span class=\"kw\">self<\/span>, order: dict) -&gt; int:                            <span class=\"cm\"># رسالة 6<\/span>\n        <span class=\"kw\">self<\/span>._orders.append(order)\n        <span class=\"kw\">return<\/span> len(<span class=\"kw\">self<\/span>._orders)                                   <span class=\"cm\"># رسالة 7: order_id<\/span>\n\n<span class=\"kw\">class<\/span> OrderService:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, inventory: InventoryService, db: Database):\n        <span class=\"kw\">self<\/span>._inventory = inventory\n        <span class=\"kw\">self<\/span>._db = db\n\n    <span class=\"kw\">def<\/span> create_order(<span class=\"kw\">self<\/span>, data: dict) -&gt; dict:                    <span class=\"cm\"># رسالة 3<\/span>\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> <span class=\"kw\">self<\/span>._inventory.check_stock(data[<span class=\"st\">\"items\"<\/span>]):         <span class=\"cm\"># 4 و 5<\/span>\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Out of stock\"<\/span>)\n        order_id = <span class=\"kw\">self<\/span>._db.save(data)                             <span class=\"cm\"># 6 و 7<\/span>\n        <span class=\"kw\">return<\/span> {<span class=\"st\">\"id\"<\/span>: order_id, **data}                            <span class=\"cm\"># رسالة 8<\/span>\n\nservice = OrderService(InventoryService({<span class=\"st\">\"tea\"<\/span>: <span class=\"nu\">5<\/span>}), Database())\nprint(service.create_order({<span class=\"st\">\"items\"<\/span>: {<span class=\"st\">\"tea\"<\/span>: <span class=\"nu\">2<\/span>}}))     <span class=\"cm\"># {'id': 1, 'items': {'tea': 2}}<\/span><\/code><\/pre><\/div>\n<p>لاحظ ثلاث مطابقات بين النموذجين:<\/p>\n<ul><li>كل participant له class.<\/li><li><code dir=\"ltr\">OrderService<\/code> يرسل رسائل إلى <code dir=\"ltr\">InventoryService<\/code> و <code dir=\"ltr\">Database<\/code>، إذن يجب أن توجد بينها <b>association أو dependency<\/b> في الـ class diagram.<\/li><li>كل رسالة تقابل <b>operation<\/b> عامة في صندوق الـ class المستقبِل.<\/li><\/ul>", "q": {"id": "m3l7c6", "type": "mc", "q": "<p>رسالة في sequence diagram: <code dir=\"ltr\">OrderService -&gt; InventoryService : check_stock(items)<\/code>. ماذا يجب أن يوجد في الـ class diagram ليكون النموذجان متّسقين؟<\/p>", "exp": "<p>الرسالة استدعاء لعملية يملكها المستقبِل، والمرسل يحتاج علاقة (association أو dependency) ليصل إليه.<\/p>", "opts": ["لا شيء، المخططان مستقلان", "operation عامة <code dir=\"ltr\">check_stock<\/code> في <code dir=\"ltr\">InventoryService<\/code>، وعلاقة من <code dir=\"ltr\">OrderService<\/code> إليه", "وراثة <code dir=\"ltr\">OrderService<\/code> من <code dir=\"ltr\">InventoryService<\/code>", "attribute اسمه <code dir=\"ltr\">check_stock<\/code> في <code dir=\"ltr\">OrderService<\/code>"], "ans": 1}}], "test": [{"id": "m3l7t1", "type": "mc", "q": "<p>ما الذي يوضّحه الـ Sequence Diagram ولا يوضّحه الـ Class Diagram؟<\/p>", "exp": "<p>الـ class diagram بنيوي ثابت، والـ sequence diagram سلوكي يبيّن التفاعل عبر الزمن.<\/p>", "opts": ["علاقات الوراثة", "أنواع الـ attributes", "الـ visibility", "ترتيب الرسائل بين الـ objects أثناء تنفيذ عملية"], "ans": 3}, {"id": "m3l7t2", "type": "sc", "sc": "في مخطط: <code dir=\"ltr\">OrderService -&gt; Database : save(order)<\/code> تأتي <b>قبل<\/b> <code dir=\"ltr\">OrderService -&gt; InventoryService : check_stock(items)<\/code>.", "q": "<p>ما الخلل؟<\/p>", "exp": "<p>الترتيب قاعدة عمل: التحقق يسبق الحفظ.<\/p>", "opts": ["يجب حذف التحقق من المخزون", "خطأ في ترتيب الرسائل: قد يُحفظ طلب لبضاعة غير متوفّرة", "لا خلل، الترتيب لا يهم", "يجب أن تكون الرسالتان asynchronous"], "ans": 1}, {"id": "m3l7t3", "type": "tf", "q": "<p>الخط المتقطّع برأس مفتوح في الـ sequence diagram يمثّل return message.<\/p>", "exp": "<p>رسالة الرجوع تُرسم متقطّعة، وتحمل القيمة المعادة إن كانت مهمة.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m3l7t4", "type": "sa", "q": "<p>ما اسم الخط الرأسي المتقطّع النازل من كل مشارك في الـ sequence diagram؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Lifeline<\/b>.<\/p>", "kw": ["lifeline"]}]}, {"t": "UML State Diagrams", "intro": "<p>الـ sequence diagram يتابع <b>عملية واحدة<\/b> عبر عدة objects. الـ state diagram يتابع <b>object واحدًا<\/b> عبر كل العمليات التي تمرّ عليه في حياته.<\/p>", "items": [{"t": "الـ States", "html": "<p><b>State Diagram<\/b> (ويسمّى State Machine Diagram) يصف الحالات المختلفة التي يمكن أن يكون فيها object، وكيف ينتقل بينها.<\/p>\n<p><b>State<\/b> (حالة): وضع يكون فيه الـ object لفترة من الزمن، و<b>يحدّد كيف يتصرّف<\/b> وما المسموح له. تُرسم مستطيلًا بزوايا مستديرة.<\/p>\n<p>مثال الحجز (Reservation): <code dir=\"ltr\">Created<\/code> ثم <code dir=\"ltr\">Confirmed<\/code> ثم <code dir=\"ltr\">Completed<\/code>، مع إمكان الانتقال إلى <code dir=\"ltr\">Cancelled<\/code>.<\/p>\n<figure class=\"fig\" dir=\"ltr\"><svg viewBox=\"0 0 820 230\" width=\"820\" role=\"img\" aria-label=\"State diagram of a Reservation\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"34\" cy=\"62\" r=\"8\" style=\"fill:var(--ink)\"/><line x1=\"42\" y1=\"62\" x2=\"90\" y2=\"62\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(90,62) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><rect x=\"90\" y=\"40\" width=\"124\" height=\"44\" rx=\"14\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"152.0\" y=\"67\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Created<\/text><rect x=\"350\" y=\"40\" width=\"124\" height=\"44\" rx=\"14\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"412.0\" y=\"67\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Confirmed<\/text><rect x=\"620\" y=\"40\" width=\"124\" height=\"44\" rx=\"14\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"682.0\" y=\"67\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Completed<\/text><rect x=\"350\" y=\"170\" width=\"124\" height=\"44\" rx=\"14\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"412.0\" y=\"197\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Cancelled<\/text><line x1=\"214\" y1=\"62\" x2=\"350\" y2=\"62\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(350,62) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"282\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >payment_confirmed<\/text><text x=\"282\" y=\"52\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >[amount paid]<\/text><line x1=\"474\" y1=\"62\" x2=\"620\" y2=\"62\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(620,62) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"547\" y=\"52\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >complete<\/text><line x1=\"152\" y1=\"84\" x2=\"350\" y2=\"186\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(350,186) rotate(27)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"196\" y=\"150\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >cancel<\/text><line x1=\"412\" y1=\"84\" x2=\"412\" y2=\"170\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(412,170) rotate(90)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"420\" y=\"132\" text-anchor=\"start\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >cancel / refund()<\/text><line x1=\"744\" y1=\"62\" x2=\"778\" y2=\"62\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(778,62) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><circle cx=\"790\" cy=\"62\" r=\"11\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><circle cx=\"790\" cy=\"62\" r=\"6\" style=\"fill:var(--ink)\"/><line x1=\"474\" y1=\"192\" x2=\"548\" y2=\"192\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(548,192) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><circle cx=\"560\" cy=\"192\" r=\"11\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><circle cx=\"560\" cy=\"192\" r=\"6\" style=\"fill:var(--ink)\"/><\/svg><\/figure>\n<p>كيف تعرف أن لـ class حالات تستحق مخططًا؟<\/p>\n<ul><li>فيه attribute اسمه <code dir=\"ltr\">status<\/code> أو <code dir=\"ltr\">state<\/code> أو عدة booleans مثل <code dir=\"ltr\">is_paid<\/code> و <code dir=\"ltr\">is_cancelled<\/code>.<\/li><li>عمليات مسموحة في أوقات وممنوعة في أخرى («لا يُلغى طلب بعد شحنه»).<\/li><\/ul>\n<p>الحالة ليست أي قيمة attribute. اسم العميل ليس حالة. الحالة هي ما <b>يغيّر السلوك المسموح<\/b>.<\/p>\n<div class=\"note\">عدة booleans خطر: <code dir=\"ltr\">is_paid<\/code> و <code dir=\"ltr\">is_cancelled<\/code> و <code dir=\"ltr\">is_completed<\/code> تعطي <span class=\"math\" dir=\"ltr\">2<sup>3<\/sup> = 8<\/span> تركيبات، معظمها بلا معنى (ملغى ومكتمل معًا؟). حالة واحدة صريحة بأربع قيم أوضح وأأمن.<\/div>", "q": {"id": "m3l8c1", "type": "mc", "q": "<p>أي class هو الأنسب لرسم state diagram له؟<\/p>", "exp": "<p>الطلب يمرّ بدورة حياة، وما يُسمح به يتغيّر مع كل حالة. البقية بلا حالات تغيّر سلوكها.<\/p>", "opts": ["<code dir=\"ltr\">Order<\/code> بحالات: Pending و Paid و Shipped و Delivered و Cancelled", "<code dir=\"ltr\">PriceCalculator<\/code> الذي يحسب المجموع", "<code dir=\"ltr\">MathUtils<\/code>", "<code dir=\"ltr\">Address<\/code> الذي يحمل الشارع والمدينة"], "ans": 0}}, {"t": "الـ Events والـ Transitions", "html": "<p><b>Transition<\/b> (انتقال): تحوّل الـ object من حالة إلى أخرى. يُرسم سهمًا من الحالة المصدر إلى الحالة الهدف.<\/p>\n<p><b>Event<\/b> (حدث): ما <b>يُطلق<\/b> الانتقال. يُكتب فوق السهم. قد يكون:<\/p>\n<ul><li>استدعاء عملية: <code dir=\"ltr\">cancel<\/code>.<\/li><li>شيئًا يحدث في الخارج: <code dir=\"ltr\">payment_confirmed<\/code>.<\/li><li>مرور زمن: <code dir=\"ltr\">after 24 hours<\/code>.<\/li><\/ul>\n<p>قراءة سهم في مخططنا: «حين يكون الحجز في <code dir=\"ltr\">Created<\/code> ويقع الحدث <code dir=\"ltr\">payment_confirmed<\/code> ينتقل إلى <code dir=\"ltr\">Confirmed<\/code>».<\/p>\n<p>يمكن وصف الآلة رياضيًا بدالة انتقال:<\/p>\n<div class=\"mathb\" dir=\"ltr\">δ:<i>S<\/i> × <i>E<\/i> → <i>S<\/i><\/div>\n<p>أي: (الحالة الحالية، الحدث) تعطي الحالة التالية. <span class=\"math\" dir=\"ltr\"><i>S<\/i><\/span> مجموعة الحالات و <span class=\"math\" dir=\"ltr\"><i>E<\/i><\/span> مجموعة الأحداث.<\/p>\n<p>أهم قاعدة في القراءة: <b>ما ليس مرسومًا فهو ممنوع<\/b>. لا يوجد سهم من <code dir=\"ltr\">Cancelled<\/code> إلى <code dir=\"ltr\">Confirmed<\/code>، إذن الحجز الملغى لا يُؤكَّد. المخطط يحدّد الانتقالات الممنوعة بقدر ما يحدّد المسموحة.<\/p>", "q": {"id": "m3l8c2", "type": "mc", "q": "<p>حسب مخطط الحجز، ماذا يحدث إذا وقع الحدث <code dir=\"ltr\">complete<\/code> والحجز في حالة <code dir=\"ltr\">Created<\/code>؟<\/p>", "exp": "<p>لا سهم يخرج من <code dir=\"ltr\">Created<\/code> بالحدث <code dir=\"ltr\">complete<\/code>. ما ليس مرسومًا ممنوع، ويجب أن يرفضه الكود.<\/p>", "opts": ["ينتقل إلى <code dir=\"ltr\">Completed<\/code>", "لا يوجد transition لهذا الحدث من هذه الحالة، فالعملية غير مسموحة", "ينتقل إلى <code dir=\"ltr\">Confirmed<\/code>", "ينتقل إلى <code dir=\"ltr\">Cancelled<\/code>"], "ans": 1}}, {"t": "الـ Guards والـ Actions", "html": "<p>الصيغة الكاملة لما يُكتب على سهم الانتقال:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>event [guard] / action<\/code><\/pre><\/div>\n<ul><li><b>Guard<\/b>: شرط بين قوسين مربعين يجب أن يكون صحيحًا <b>لحظة وقوع الحدث<\/b> ليتم الانتقال. إن لم يتحقق يبقى الـ object في حالته.<\/li><li><b>Action<\/b>: عمل يُنفَّذ <b>أثناء<\/b> الانتقال، بعد الشرطة المائلة.<\/li><\/ul>\n<p>من مخططنا:<\/p>\n<ul><li><code dir=\"ltr\">payment_confirmed [amount paid]<\/code>: يتأكّد الحجز عند تسجيل الدفع، <b>بشرط<\/b> أن يكون المبلغ مدفوعًا كاملًا.<\/li><li><code dir=\"ltr\">cancel / refund()<\/code>: عند إلغاء حجز مؤكَّد يُنفَّذ الاسترداد.<\/li><\/ul>\n<p>الـ guard يسمح للحدث نفسه أن يقود إلى أماكن مختلفة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Confirmed --cancel [more than 48h before check-in] / refund_full()--&gt; Cancelled\nConfirmed --cancel [48h or less before check-in] / refund_half()--&gt; Cancelled<\/code><\/pre><\/div>\n<p>شرط سلامة: الـ guards الخارجة من الحالة نفسها للحدث نفسه يجب أن تكون <b>متنافية<\/b> (لا يتحقق اثنان معًا)، ويُستحسن أن تغطي كل الاحتمالات.<\/p>\n<p>توجد أيضًا actions داخل الحالة: <code dir=\"ltr\">entry / ...<\/code> عند الدخول و <code dir=\"ltr\">exit / ...<\/code> عند الخروج.<\/p>", "q": {"id": "m3l8c3", "type": "mc", "q": "<p>ما معنى <code dir=\"ltr\">ship [is_paid] / notify_customer()<\/code> على سهم من <code dir=\"ltr\">Pending<\/code> إلى <code dir=\"ltr\">Shipped<\/code>؟<\/p>", "exp": "<p>الصيغة <code dir=\"ltr\">event [guard] / action<\/code>: الحدث يطلق، والـ guard يسمح أو يمنع، والـ action ينفَّذ أثناء الانتقال.<\/p>", "opts": ["الحدث هو <code dir=\"ltr\">is_paid<\/code> والشرط هو <code dir=\"ltr\">ship<\/code>", "عند الحدث <code dir=\"ltr\">ship<\/code>، وبشرط أن <code dir=\"ltr\">is_paid<\/code> صحيح، يتم الانتقال ويُنفَّذ <code dir=\"ltr\">notify_customer()<\/code>", "يُنفَّذ <code dir=\"ltr\">notify_customer()<\/code> أولًا ثم يُفحص الدفع", "الانتقال يتم دائمًا مهما كان <code dir=\"ltr\">is_paid<\/code>"], "ans": 1}}, {"t": "الـ Initial والـ Final States", "html": "<ul><li><b>Initial state<\/b>: <b>دائرة سوداء مملوءة<\/b> يخرج منها سهم إلى أول حالة حقيقية. تجيب: «في أي حالة يولد الـ object؟». لكل مخطط نقطة بداية واحدة. في مثالنا يولد الحجز في <code dir=\"ltr\">Created<\/code>.<\/li><li><b>Final state<\/b>: <b>دائرة مملوءة داخل دائرة<\/b>. تعني انتهاء دورة حياة الـ object: لا انتقالات بعدها. قد توجد أكثر من نهاية.<\/li><\/ul>\n<p>الحالات التي لا يخرج منها أي انتقال (<code dir=\"ltr\">Completed<\/code> و <code dir=\"ltr\">Cancelled<\/code>) تسمّى <b>terminal states<\/b>.<\/p>\n<p>مراجعة سلامة لأي مخطط حالات:<\/p>\n<ol><li>هل توجد نقطة بداية واحدة؟<\/li><li>هل كل حالة <b>يمكن الوصول إليها<\/b> من البداية؟ حالة بلا أسهم داخلة حالة ميتة.<\/li><li>هل لكل حالة غير نهائية مخرج؟ حالة يدخلها الـ object ولا يخرج منها أبدًا دون قصد تسمّى <b>deadlock<\/b>.<\/li><li>هل الأسماء حالات فعلًا (صفات مثل Confirmed) وليست أفعالًا (مثل Confirm)؟ الأفعال للأحداث.<\/li><\/ol>\n<p>في Python تقابل نقطة البداية القيمة التي تُسند في <code dir=\"ltr\">__init__<\/code>:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">self<\/span>._status = Status.CREATED<\/code><\/pre><\/div>", "q": {"id": "m3l8c4", "type": "tf", "q": "<p>يمكن أن يحتوي الـ state diagram على أكثر من final state واحدة.<\/p>", "exp": "<p>قد ينتهي الـ object بأكثر من نهاية (مثل Completed أو Cancelled)، لكن البداية واحدة.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "الـ State-dependent Behavior في Python", "html": "<p><b>State-dependent behavior<\/b>: استجابة الـ object للعملية نفسها تختلف باختلاف حالته. التنفيذ الأنظف: <code dir=\"ltr\">Enum<\/code> للحالات مع <b>جدول انتقالات<\/b> يطابق المخطط سهمًا بسهم.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> enum <span class=\"kw\">import<\/span> Enum\n\n<span class=\"kw\">class<\/span> Status(Enum):\n    CREATED = <span class=\"st\">\"created\"<\/span>\n    CONFIRMED = <span class=\"st\">\"confirmed\"<\/span>\n    COMPLETED = <span class=\"st\">\"completed\"<\/span>\n    CANCELLED = <span class=\"st\">\"cancelled\"<\/span>\n\n<span class=\"kw\">class<\/span> InvalidTransition(Exception):\n    <span class=\"kw\">pass<\/span>\n\n<span class=\"kw\">class<\/span> Reservation:\n    _TRANSITIONS = {                                   <span class=\"cm\"># (state, event) -&gt; next state<\/span>\n        (Status.CREATED, <span class=\"st\">\"payment_confirmed\"<\/span>): Status.CONFIRMED,\n        (Status.CREATED, <span class=\"st\">\"cancel\"<\/span>): Status.CANCELLED,\n        (Status.CONFIRMED, <span class=\"st\">\"complete\"<\/span>): Status.COMPLETED,\n        (Status.CONFIRMED, <span class=\"st\">\"cancel\"<\/span>): Status.CANCELLED,\n    }\n\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, price: float):\n        <span class=\"kw\">self<\/span>._price = price\n        <span class=\"kw\">self<\/span>._paid = <span class=\"nu\">0.0<\/span>\n        <span class=\"kw\">self<\/span>._status = Status.CREATED                  <span class=\"cm\"># initial state<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> status(<span class=\"kw\">self<\/span>) -&gt; Status:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._status\n\n    <span class=\"kw\">def<\/span> _fire(<span class=\"kw\">self<\/span>, event: str) -&gt; <span class=\"kw\">None<\/span>:\n        key = (<span class=\"kw\">self<\/span>._status, event)\n        <span class=\"kw\">if<\/span> key <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._TRANSITIONS:\n            <span class=\"kw\">raise<\/span> InvalidTransition(f<span class=\"st\">\"Cannot {event} when {self._status.value}\"<\/span>)\n        <span class=\"kw\">self<\/span>._status = <span class=\"kw\">self<\/span>._TRANSITIONS[key]\n\n    <span class=\"kw\">def<\/span> pay(<span class=\"kw\">self<\/span>, amount: float) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._paid += amount\n        <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>._paid &gt;= <span class=\"kw\">self<\/span>._price:                  <span class=\"cm\"># guard: [amount paid]<\/span>\n            <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"payment_confirmed\"<\/span>)\n\n    <span class=\"kw\">def<\/span> complete(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"complete\"<\/span>)\n\n    <span class=\"kw\">def<\/span> cancel(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"cancel\"<\/span>)<\/code><\/pre><\/div>\n<p>القاموس <code dir=\"ltr\">_TRANSITIONS<\/code> هو الدالة <span class=\"math\" dir=\"ltr\">δ<\/span> نفسها مكتوبة كجدول. أربعة أسهم في المخطط تقابلها أربعة مداخل، فمراجعة الكود مقابل المخطط تصبح عدًّا ومطابقة.<\/p>", "q": {"id": "m3l8c5", "type": "mc", "q": "<p>حسب الكود أعلاه: حجز سعره 100، نُفّذ <code dir=\"ltr\">r.pay(100)<\/code> ثم <code dir=\"ltr\">r.cancel()<\/code> ثم <code dir=\"ltr\">r.complete()<\/code>. ما النتيجة؟<\/p>", "exp": "<p><code dir=\"ltr\">pay(100)<\/code> تنقل إلى CONFIRMED، و <code dir=\"ltr\">cancel()<\/code> إلى CANCELLED. المفتاح <code dir=\"ltr\">(CANCELLED, \"complete\")<\/code> غير موجود في الجدول فيُرفع الاستثناء.<\/p>", "opts": ["يرفع <code dir=\"ltr\">pay<\/code> استثناء منذ البداية", "تصبح الحالة <code dir=\"ltr\">COMPLETED<\/code>", "تبقى الحالة <code dir=\"ltr\">CONFIRMED<\/code>", "الاستدعاء الأخير يرفع <code dir=\"ltr\">InvalidTransition<\/code> لأن الحالة صارت <code dir=\"ltr\">CANCELLED<\/code>"], "ans": 3}}, {"t": "لماذا يهمّ النمذجة الصريحة للحالات؟", "html": "<p>بدون نمذجة صريحة قد يسمح المطوّرون، دون قصد، بعمليات غير صالحة:<\/p>\n<ul><li>إكمال حجز سبق إلغاؤه.<\/li><li>إلغاء حجز مكتمل.<\/li><li>تأكيد حجز دون استيفاء الشروط المطلوبة.<\/li><\/ul>\n<p>كيف يحدث ذلك في الكود؟ هكذا:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>reservation.status = <span class=\"st\">\"completed\"<\/span>      <span class=\"cm\"># في أي مكان، دون أي فحص<\/span><\/code><\/pre><\/div>\n<p>أو بفحوص مبعثرة تُنسى في موضع واحد من عشرة.<\/p>\n<p>طريقة عملية لاكتشاف الثغرات <b>أثناء التصميم<\/b>: ارسم <b>جدول الحالات × الأحداث<\/b> واملأ كل خانة. الخانة الفارغة تعني أنك لم تفكّر في تلك الحالة.<\/p>\n<div class=\"tw\"><table><thead><tr><th>State<\/th><th>payment_confirmed<\/th><th>complete<\/th><th>cancel<\/th><\/tr><\/thead><tbody><tr><td>Created<\/td><td>Confirmed<\/td><td>ممنوع<\/td><td>Cancelled<\/td><\/tr><tr><td>Confirmed<\/td><td>ممنوع<\/td><td>Completed<\/td><td>Cancelled<\/td><\/tr><tr><td>Completed<\/td><td>ممنوع<\/td><td>ممنوع<\/td><td>ممنوع<\/td><\/tr><tr><td>Cancelled<\/td><td>ممنوع<\/td><td>ممنوع<\/td><td>ممنوع<\/td><\/tr><\/tbody><\/table><\/div>\n<p>4 حالات في 3 أحداث تعطي <span class=\"math\" dir=\"ltr\">4 × 3 = 12<\/span> خانة: 4 مسموحة و 8 ممنوعة. كل «ممنوع» قاعدة عمل صريحة، ويتحوّل لاحقًا إلى اختبار يتأكد من رفض العملية.<\/p>\n<p>الـ state diagram يساعد على اكتشاف هذه المشاكل في مرحلة التصميم، حيث التصحيح أرخص.<\/p>", "q": {"id": "m3l8c6", "type": "sc", "sc": "آلة حالات فيها 5 حالات و 4 أحداث. كتب الفريق اختبارات للانتقالات السبعة المرسومة فقط.", "q": "<p>ما الذي أغفلوه؟<\/p>", "exp": "<p>الأخطاء الخطيرة تأتي من انتقالات ممنوعة يسمح بها الكود سهوًا. يجب اختبار الرفض أيضًا.<\/p>", "opts": ["اختبار الخانات الممنوعة (<span class=\"math\" dir=\"ltr\">5 × 4 − 7 = 13<\/span> خانة) للتأكد من أن النظام يرفضها", "إعادة اختبار الانتقالات السبعة مرتين", "اختبار ألوان المخطط", "لا شيء، الانتقالات المرسومة تكفي"], "ans": 0}}], "test": [{"id": "m3l8t1", "type": "mc", "q": "<p>ما الصيغة الصحيحة لما يُكتب على سهم الانتقال؟<\/p>", "exp": "<p>الحدث يطلق الانتقال، والـ guard شرطه، والـ action ما يُنفَّذ أثناءه.<\/p>", "opts": ["<code dir=\"ltr\">state -&gt; state<\/code>", "<code dir=\"ltr\">action [event] / guard<\/code>", "<code dir=\"ltr\">event [guard] / action<\/code>", "<code dir=\"ltr\">guard / event [action]<\/code>"], "ans": 2}, {"id": "m3l8t2", "type": "sc", "sc": "مخطط حالات لمهمة: <code dir=\"ltr\">Todo -&gt; InProgress -&gt; Done<\/code>، وتوجد حالة <code dir=\"ltr\">Blocked<\/code> لا يدخل إليها أي سهم.", "q": "<p>ما الخلل؟<\/p>", "exp": "<p>كل حالة يجب أن يمكن الوصول إليها من البداية، وإلا فهي ميتة أو ينقص المخطط انتقال.<\/p>", "opts": ["<code dir=\"ltr\">Blocked<\/code> حالة لا يمكن الوصول إليها: ينقصها انتقال داخل، أو يجب حذفها", "يجب جعلها الحالة الابتدائية", "يجب حذف <code dir=\"ltr\">Done<\/code>", "لا خلل"], "ans": 0}, {"id": "m3l8t3", "type": "tf", "q": "<p>الـ State Diagram يصف تفاعل عدة objects مع بعضها في عملية واحدة.<\/p>", "exp": "<p>هذا وصف الـ Sequence Diagram. الـ State Diagram يتابع object واحدًا عبر حياته.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m3l8t4", "type": "mc", "q": "<p>لماذا يُفضَّل <code dir=\"ltr\">Enum<\/code> واحد للحالة على ثلاثة attributes من نوع boolean؟<\/p>", "exp": "<p>ثلاثة booleans تعطي <span class=\"math\" dir=\"ltr\">2<sup>3<\/sup> = 8<\/span> تركيبات معظمها بلا معنى. الـ Enum يجعل الحالات غير الصالحة غير قابلة للتمثيل.<\/p>", "opts": ["لأن الـ Enum يحذف الحاجة إلى الاختبارات", "لأن الـ booleans تسمح بتركيبات متناقضة، والـ Enum يحصر الحالات الممكنة بوضوح", "لأن Python تمنع الـ booleans داخل الـ classes", "لأن الـ Enum أسرع بألف مرة"], "ans": 1}, {"id": "m3l8t5", "type": "sa", "q": "<p>ما اسم الشرط الذي يُكتب بين قوسين مربعين على الـ transition؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Guard<\/b>.<\/p>", "kw": ["guard"]}]}, {"t": "Model Checking", "intro": "<p>رسمنا ثلاثة أنواع من المخططات. السؤال الآن: هل هي <b>صحيحة<\/b>؟ وهل <b>يتفق<\/b> بعضها مع بعض ومع المتطلبات؟<\/p>", "items": [{"t": "المعنى الدقيق لـ Model Checking", "html": "<p><b>Model checking<\/b> بمعناه الدقيق: التحقق من أن <b>نموذجًا رسميًا<\/b> (formal model) لنظام <b>يحقق خصائص محدّدة<\/b>، ويجريه <b>برنامج<\/b> يستكشف <b>كل<\/b> الحالات الممكنة آليًا.<\/p>\n<p>المدخلات:<\/p>\n<ul><li><b>النموذج<\/b>: غالبًا آلة حالات (مثل state diagram لكن بصيغة رياضية دقيقة).<\/li><li><b>الخصائص (properties)<\/b>: عبارات يجب أن تصحّ، وهي نوعان:<\/li><li><b>Safety<\/b>: «شيء سيّئ لا يحدث أبدًا». مثال: لا يصل حجز ملغى إلى <code dir=\"ltr\">Confirmed<\/code> أبدًا.<\/li><li><b>Liveness<\/b>: «شيء جيد يحدث في النهاية». مثال: كل حجز يصل في النهاية إلى حالة نهائية.<\/li><\/ul>\n<p>المخرج: إمّا «الخاصية محقّقة»، وإمّا <b>counterexample<\/b>: سلسلة خطوات محدّدة تقود إلى خرق الخاصية.<\/p>\n<p>أدوات معروفة: TLA+ و SPIN و Alloy. تُستعمل في الأنظمة الحرجة: بروتوكولات الأنظمة الموزّعة وأنظمة الطيران.<\/p>\n<p>الفرق عن الاختبار (testing): الاختبار يجرّب <b>بعض<\/b> المسارات، والـ model checking يغطّي <b>كل<\/b> مسارات النموذج. لكنه يتحقق من النموذج لا من الكود، والنموذج قد يختلف عن الكود.<\/p>", "q": {"id": "m3l9c1", "type": "mc", "q": "<p>ماذا يُخرج الـ model checker حين لا تتحقق الخاصية؟<\/p>", "exp": "<p>المثال المضاد أثمن مخرجاته: يريك بالضبط كيف يصل النظام إلى الوضع الخاطئ.<\/p>", "opts": ["لا شيء", "كودًا مصحَّحًا تلقائيًا", "counterexample: سلسلة خطوات تؤدي إلى خرق الخاصية", "رسمًا جديدًا للـ class diagram"], "ans": 2}}, {"t": "Model Checking في سياق هذه الدورة: مراجعة النماذج", "html": "<p>في هذا المنهج يُستعمل المصطلح بمعنى أخفّ وعملي: <b>فحص النماذج يدويًا<\/b> (model review أو consistency checking). تفحص مخططاتك بحثًا عن:<\/p>\n<ul><li><b>Incorrect relationships<\/b>: وراثة حيث يجب association، أو multiplicity خاطئة.<\/li><li><b>Missing interactions<\/b>: متطلب لا يغطّيه أي تفاعل، أو رسالة إلى مشارك لا يملك تلك العملية.<\/li><li><b>Invalid state transitions<\/b>: انتقال يخالف قواعد العمل، أو حالة لا يُوصل إليها.<\/li><li><b>Inconsistent UML diagrams<\/b>: مخططان يقولان شيئين مختلفين عن النظام نفسه.<\/li><li><b>Contradictions between requirements and models<\/b>: النموذج يسمح بما تمنعه المتطلبات، أو العكس.<\/li><\/ul>\n<p>قائمة فحص سريعة:<\/p>\n<ol><li>كل participant في sequence diagram له class في الـ class diagram؟<\/li><li>كل رسالة تقابلها operation عامة عند المستقبِل؟<\/li><li>بين كل مرسل ومستقبِل علاقة في الـ class diagram؟<\/li><li>كل event في الـ state diagram تطلقه رسالة ما في sequence diagram؟<\/li><li>كل متطلب وكل acceptance criterion له أثر في نموذج واحد على الأقل؟<\/li><\/ol>\n<p>الفكرة مشتركة بين المعنيين: التحقق من النموذج <b>قبل<\/b> بناء الكود عليه.<\/p>", "q": {"id": "m3l9c2", "type": "tf", "q": "<p>مراجعة النماذج بالمعنى المستعمل في هذه الدورة تتطلب حتمًا أدوات رسمية مثل TLA+.<\/p>", "exp": "<p>هنا نقصد الفحص اليدوي المنهجي للمخططات بقائمة تحقق. الأدوات الرسمية تخص الـ model checking بمعناه الدقيق.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "مثال: تناقض بين State Diagram و Sequence Diagram", "html": "<p>الـ <b>State Diagram<\/b> يقول: الحجز الملغى لا يمكن أن يصير مؤكَّدًا (لا سهم من <code dir=\"ltr\">Cancelled<\/code> إلى <code dir=\"ltr\">Confirmed<\/code>).<\/p>\n<p>لكن الـ <b>Sequence Diagram<\/b> لعملية الدفع يُظهر:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>PaymentAPI -&gt; PaymentService : register_payment(reservation_id, amount)\nPaymentService -&gt; Reservation : set_status(\"confirmed\")<\/code><\/pre><\/div>\n<p>عملية الدفع تؤكّد <b>أي<\/b> حجز مهما كانت حالته الحالية. هذا تناقض محتمل.<\/p>\n<p>سيناريو يثبته (counterexample بلغة الـ model checking):<\/p>\n<ol><li>العميل ينشئ حجزًا: <code dir=\"ltr\">Created<\/code>.<\/li><li>العميل يلغيه: <code dir=\"ltr\">Cancelled<\/code>.<\/li><li>دفعة متأخرة تصل من البنك، فيُستدعى <code dir=\"ltr\">set_status(\"confirmed\")<\/code>.<\/li><li>النتيجة: حجز ملغى صار مؤكَّدًا، والغرفة ربما حُجزت لشخص آخر.<\/li><\/ol>\n<p>لاحظ أن كل مخطط <b>يبدو سليمًا وحده<\/b>. الخلل يظهر فقط عند <b>مقارنتهما<\/b>. ولو لم نكتشفه الآن لظهر في الإنتاج على هيئة غرفة محجوزة مرتين.<\/p>", "q": {"id": "m3l9c3", "type": "mc", "q": "<p>أين يكمن التناقض في هذا المثال؟<\/p>", "exp": "<p>المخططان يصفان النظام نفسه بقاعدتين متعارضتين، ولا يُكتشف ذلك إلا بمقارنتهما.<\/p>", "opts": ["الـ state diagram فيه حالات كثيرة", "اسم <code dir=\"ltr\">PaymentService<\/code> غير مناسب", "الـ sequence diagram يسمح بتأكيد حجز في أي حالة، والـ state diagram يمنع تأكيد الحجز الملغى", "الـ class diagram ينقصه attribute"], "ans": 2}}, {"t": "التصحيح والربط بالمتطلبات", "html": "<p>كيف نصحّح التناقض؟ <b>المتطلبات هي الحَكَم<\/b>. نسأل صاحب العمل: «ماذا يجب أن يحدث إذا وصلت دفعة لحجز ملغى؟». الجواب: «تُرفض وتُستردّ». إذن الـ state diagram صحيح والـ sequence diagram خاطئ.<\/p>\n<p>التصحيح في النموذج:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>PaymentService -&gt; Reservation : pay(amount)\nalt [status is Created]\n    Reservation --&gt; PaymentService : confirmed\nelse [any other status]\n    Reservation --&gt; PaymentService : InvalidTransition\n    PaymentService -&gt; RefundService : refund(amount)\nend<\/code><\/pre><\/div>\n<p>والتصحيح في التصميم: <code dir=\"ltr\">PaymentService<\/code> لم يعد يغيّر الحالة بنفسه (<code dir=\"ltr\">set_status<\/code>). صار يطلب من الحجز <code dir=\"ltr\">pay<\/code>، والحجز يحرس حالته. هذا الـ encapsulation من الوحدة 2.<\/p>\n<p><b>Traceability<\/b>: جدول يربط كل متطلب بمكانه في النماذج، ويكشف الثغرات في الاتجاهين.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Requirement<\/th><th>Class Diagram<\/th><th>Sequence Diagram<\/th><th>State Diagram<\/th><\/tr><\/thead><tbody><tr><td>حجز غرفة<\/td><td><code dir=\"ltr\">Reservation<\/code>، <code dir=\"ltr\">Room<\/code><\/td><td>Create reservation<\/td><td>initial → Created<\/td><\/tr><tr><td>لا تأكيد لحجز ملغى<\/td><td><code dir=\"ltr\">Reservation.pay()<\/code><\/td><td>alt في Register payment<\/td><td>لا سهم Cancelled → Confirmed<\/td><\/tr><tr><td>تقرير شهري<\/td><td>؟<\/td><td>؟<\/td><td>(لا ينطبق)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>علامة الاستفهام في الصف الأخير: متطلب بلا تصميم. والعكس خلل أيضًا: عنصر في النموذج لا يخدم أي متطلب.<\/p>", "q": {"id": "m3l9c4", "type": "sc", "sc": "اكتشفتَ أن الـ class diagram يقول <code dir=\"ltr\">Order 1 ── 1..* OrderItem<\/code>، بينما sequence diagram إنشاء الطلب يحفظ الطلب قبل إضافة أي عنصر.", "q": "<p>كيف تحسم أي النموذجين هو الخاطئ؟<\/p>", "exp": "<p>المتطلبات مرجع الحكم. إن كانت تمنع الطلب الفارغ فالـ sequence diagram هو الخاطئ، وإن كانت تسمح به فالـ multiplicity يجب أن تصير <code dir=\"ltr\">0..*<\/code>.<\/p>", "opts": ["بحذف المخططين", "بالرجوع إلى المتطلبات: هل يُسمح بطلب فارغ؟ ثم تصحيح النموذج المخالف", "بترك التناقض ليحسمه من يكتب الكود", "باختيار المخطط الأجمل رسمًا"], "ans": 1}}], "test": [{"id": "m3l9t1", "type": "mc", "q": "<p>أي مما يلي مثال على تناقض بين نموذجين؟<\/p>", "exp": "<p>رسالة بلا operation مقابلة تعني أن أحد النموذجين ناقص أو خاطئ.<\/p>", "opts": ["class diagram فيه خمسة classes", "sequence diagram فيه ست رسائل", "state diagram مرسوم بالأبيض والأسود", "sequence diagram يرسل <code dir=\"ltr\">refund()<\/code> إلى <code dir=\"ltr\">Payment<\/code>، و <code dir=\"ltr\">Payment<\/code> في الـ class diagram بلا عملية بهذا الاسم"], "ans": 3}, {"id": "m3l9t2", "type": "tf", "q": "<p>خاصية «الحجز الملغى لا يصير مؤكَّدًا أبدًا» مثال على safety property.<\/p>", "exp": "<p>خصائص الـ safety تقول إن شيئًا سيئًا لا يحدث أبدًا.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m3l9t3", "type": "sc", "sc": "في جدول traceability: المتطلب «إرسال تذكير قبل الموعد بيوم» لا يقابله شيء في أي مخطط.", "q": "<p>ما التصرف؟<\/p>", "exp": "<p>متطلب بلا أثر في النماذج لن يُنفَّذ، أو سيُنفَّذ ارتجالًا. تُسدّ الثغرة الآن أو تُؤجَّل بقرار معلن.<\/p>", "opts": ["نتجاهله، سيظهر وقت كتابة الكود", "نحذف المتطلب دون إخبار أحد", "نعيد تسمية أحد الـ classes", "النموذج ناقص: نضيف الـ classes والتفاعلات اللازمة، أو نؤجّل المتطلب بقرار صريح"], "ans": 3}, {"id": "m3l9t4", "type": "sa", "q": "<p>ما المصطلح الإنجليزي للمسار الذي يخرجه الـ model checker ليثبت خرق خاصية؟<\/p>", "exp": "<p>الإجابة: <b>Counterexample<\/b> (مثال مضاد).<\/p>", "kw": ["counterexample", "counter example", "counter-example"]}]}, {"t": "ورشة الوحدة 3 واختبارها", "intro": "<p>حلّل كودًا قائمًا، وارسم له مخططات سلوكية، وتحقق من اتساقها. هذه الورش تقابل Practical work للوحدة و Capstone Assignments 1.2 و 1.3: بناء Sequence و State Diagrams انطلاقًا من <b>كود موجود<\/b>، وهذا يتطلب فهم تنفيذ قائم وإعادة بناء سلوكه.<\/p>", "items": [{"t": "ورشة: شخّص الـ Coupling والـ Cohesion ومشاكل الوراثة", "task": {"id": "m3l10w1", "t": "ورشة: شخّص الـ Coupling والـ Cohesion ومشاكل الوراثة", "html": "<p>اقرأ الكود ثم اكتب:<\/p>\n<ol><li>كل مواضع الـ tight coupling.<\/li><li>مشاكل الـ cohesion والمسؤوليات التي يجب فصلها.<\/li><li>أي وراثة غير ضرورية.<\/li><li>هيكل التصميم المحسَّن (أسماء classes ومسؤولياتها، بلا تفاصيل).<\/li><\/ol>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Database:\n    <span class=\"kw\">def<\/span> insert(<span class=\"kw\">self<\/span>, table, row): print(<span class=\"st\">\"insert\"<\/span>, table, row)\n\n<span class=\"kw\">class<\/span> TicketManager(Database):\n    <span class=\"kw\">def<\/span> book(<span class=\"kw\">self<\/span>, user_email, seats, card):\n        price = seats * <span class=\"nu\">25<\/span> * <span class=\"nu\">1.19<\/span>\n        <span class=\"kw\">import<\/span> smtplib\n        <span class=\"kw\">if<\/span> len(card) != <span class=\"nu\">16<\/span>:\n            <span class=\"kw\">return<\/span> <span class=\"st\">\"bad card\"<\/span>\n        <span class=\"kw\">self<\/span>.insert(<span class=\"st\">\"tickets\"<\/span>, {<span class=\"st\">\"email\"<\/span>: user_email, <span class=\"st\">\"seats\"<\/span>: seats, <span class=\"st\">\"price\"<\/span>: price})\n        server = smtplib.SMTP(<span class=\"st\">\"mail.cinema.local\"<\/span>)\n        server.sendmail(<span class=\"st\">\"noreply@cinema.local\"<\/span>, user_email, f<span class=\"st\">\"Booked {seats} seats\"<\/span>)\n        html = f<span class=\"st\">\"&lt;h1&gt;Thanks&lt;/h1&gt;&lt;p&gt;Total: {price}&lt;/p&gt;\"<\/span>\n        <span class=\"kw\">return<\/span> html<\/code><\/pre><\/div>", "hints": ["ابحث عن كل ما يُنشأ أو يُسمّى بعينه داخل <code dir=\"ltr\">book<\/code>: خادم بريد محدّد، أرقام ثابتة.", "عُدّ الشؤون (concerns) داخل <code dir=\"ltr\">book<\/code>: تسعير، تحقق، تخزين، بريد، عرض.", "هل <code dir=\"ltr\">TicketManager<\/code> «نوع من» <code dir=\"ltr\">Database<\/code>؟ ما البديل؟"], "checks": [], "sol": "<h4>1) Tight coupling<\/h4>\n<ul><li><code dir=\"ltr\">smtplib.SMTP(\"mail.cinema.local\")<\/code> يُنشأ داخل الـ method: اقتران بمزوّد وعنوان محدّدين، واختبار مستحيل دون خادم بريد.<\/li><li>الوراثة من <code dir=\"ltr\">Database<\/code>: أقوى اقتران ممكن بتنفيذ التخزين.<\/li><li>أرقام ثابتة (السعر 25 والضريبة 1.19) مدفونة في المنطق.<\/li><\/ul>\n<h4>2) Cohesion و SoC<\/h4>\n<p><code dir=\"ltr\">book<\/code> تخلط خمسة شؤون: التسعير، التحقق من البطاقة، التخزين، البريد، بناء HTML. والتحقق يأتي بعد حساب السعر، ونتيجة الفشل نص (<code dir=\"ltr\">\"bad card\"<\/code>) بدل استثناء.<\/p>\n<h4>3) الوراثة<\/h4>\n<p><code dir=\"ltr\">TicketManager(Database)<\/code> تفشل في اختبار is-a: مدير التذاكر ليس قاعدة بيانات، ويرث <code dir=\"ltr\">insert<\/code> فيستطيع أي أحد استدعاءها عليه. البديل composition: يحتفظ بـ repository.<\/p>\n<h4>4) التصميم المحسَّن<\/h4>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> PricingPolicy:            <span class=\"cm\"># التسعير<\/span>\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>, seats: int) -&gt; float: ...\n\n<span class=\"kw\">class<\/span> TicketRepository(Protocol):   <span class=\"cm\"># التخزين (abstraction)<\/span>\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, ticket: Ticket) -&gt; <span class=\"kw\">None<\/span>: ...\n\n<span class=\"kw\">class<\/span> Notifier(Protocol):       <span class=\"cm\"># الإشعار (abstraction)<\/span>\n    <span class=\"kw\">def<\/span> send(<span class=\"kw\">self<\/span>, to: str, message: str) -&gt; <span class=\"kw\">None<\/span>: ...\n\n<span class=\"kw\">class<\/span> BookingService:           <span class=\"cm\"># تنسيق الـ use case فقط<\/span>\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, pricing: PricingPolicy, repo: TicketRepository, notifier: Notifier): ...\n    <span class=\"kw\">def<\/span> book(<span class=\"kw\">self<\/span>, email: str, seats: int, card: Card) -&gt; Ticket: ...<\/code><\/pre><\/div>\n<p>والعرض (HTML) ينتقل إلى الـ view. الآن: loose coupling عبر الحقن، وكل class بشأن واحد، ولا وراثة.<\/p>"}}, {"t": "Capstone 1.2: ارسم Sequence Diagram من كود موجود", "task": {"id": "m3l10w2", "t": "Capstone 1.2: ارسم Sequence Diagram من كود موجود", "html": "<p>اكتب <b>نصيًا<\/b> sequence diagram لـ <code dir=\"ltr\">LibraryService.borrow<\/code> بالصيغة <code dir=\"ltr\">Sender -&gt; Receiver : message<\/code> و <code dir=\"ltr\">Receiver --&gt; Sender : return<\/code>، واستعمل <code dir=\"ltr\">alt<\/code> حيث يلزم. اذكر المشاركين أولًا.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> LibraryService:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, members, catalog, loans, notifier):\n        <span class=\"kw\">self<\/span>._members, <span class=\"kw\">self<\/span>._catalog = members, catalog\n        <span class=\"kw\">self<\/span>._loans, <span class=\"kw\">self<\/span>._notifier = loans, notifier\n\n    <span class=\"kw\">def<\/span> borrow(<span class=\"kw\">self<\/span>, member_id, isbn):\n        member = <span class=\"kw\">self<\/span>._members.find(member_id)\n        <span class=\"kw\">if<\/span> member.has_overdue():\n            <span class=\"kw\">raise<\/span> BorrowError(<span class=\"st\">\"member has overdue loans\"<\/span>)\n        book = <span class=\"kw\">self<\/span>._catalog.find(isbn)\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> book.is_available():\n            <span class=\"kw\">raise<\/span> BorrowError(<span class=\"st\">\"book not available\"<\/span>)\n        book.mark_borrowed()\n        loan = <span class=\"kw\">self<\/span>._loans.create(member, book)\n        <span class=\"kw\">self<\/span>._notifier.send(member.email, f<span class=\"st\">\"Due on {loan.due_date}\"<\/span>)\n        <span class=\"kw\">return<\/span> loan<\/code><\/pre><\/div>", "hints": ["المشاركون: كل object تُستدعى عليه method. لا تنسَ <code dir=\"ltr\">member<\/code> و <code dir=\"ltr\">book<\/code> نفسيهما.", "كل <code dir=\"ltr\">if<\/code> يرفع استثناء يصير <code dir=\"ltr\">alt<\/code> بفرعين: فرع الخطأ وفرع المتابعة.", "رتّب المشاركين من اليسار إلى اليمين بحسب أول ظهور لهم."], "checks": [], "sol": "<p><b>Participants<\/b>: Librarian (actor), LibraryService, MemberRepository, Member, Catalog, Book, LoanRepository, Notifier.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Librarian -&gt; LibraryService : borrow(member_id, isbn)\nLibraryService -&gt; MemberRepository : find(member_id)\nMemberRepository --&gt; LibraryService : member\nLibraryService -&gt; Member : has_overdue()\nMember --&gt; LibraryService : overdue\n\nalt [overdue]\n    LibraryService --&gt; Librarian : BorrowError(\"member has overdue loans\")\nelse [not overdue]\n    LibraryService -&gt; Catalog : find(isbn)\n    Catalog --&gt; LibraryService : book\n    LibraryService -&gt; Book : is_available()\n    Book --&gt; LibraryService : available\n    alt [not available]\n        LibraryService --&gt; Librarian : BorrowError(\"book not available\")\n    else [available]\n        LibraryService -&gt; Book : mark_borrowed()\n        LibraryService -&gt; LoanRepository : create(member, book)\n        LoanRepository --&gt; LibraryService : loan\n        LibraryService -&gt; Notifier : send(email, due date)\n        LibraryService --&gt; Librarian : loan\n    end\nend<\/code><\/pre><\/div>\n<p><b>ملاحظات تصميمية يكشفها المخطط<\/b>:<\/p>\n<ul><li>الترتيب سليم: التحققان يسبقان أي تغيير في الحالة.<\/li><li><code dir=\"ltr\">Notifier.send<\/code> synchronous هنا: فشل البريد سيُفشل الإعارة بعد أن سُجّلت. الأفضل جعلها asynchronous.<\/li><li><code dir=\"ltr\">LibraryService<\/code> يعتمد على أربعة collaborators محقونة: coupling مضبوط عبر الـ constructor.<\/li><\/ul>"}}, {"t": "Capstone 1.3: ارسم State Diagram من كود موجود ثم تحقق منه", "task": {"id": "m3l10w3", "t": "Capstone 1.3: ارسم State Diagram من كود موجود ثم تحقق منه", "html": "<ol><li>استخرج من الكود: الحالات، والحالة الابتدائية، وكل transition بالصيغة <code dir=\"ltr\">State --event [guard] / action--&gt; State<\/code>.<\/li><li>املأ جدول الحالات × الأحداث.<\/li><li>المتطلب يقول: «لا يمكن إعادة فتح تذكرة مغلقة». هل الكود متّسق معه؟<\/li><\/ol>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Ticket:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>.status = <span class=\"st\">\"open\"<\/span>\n        <span class=\"kw\">self<\/span>.assignee = <span class=\"kw\">None<\/span>\n\n    <span class=\"kw\">def<\/span> assign(<span class=\"kw\">self<\/span>, agent):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>.status == <span class=\"st\">\"open\"<\/span>:\n            <span class=\"kw\">self<\/span>.assignee = agent\n            <span class=\"kw\">self<\/span>.status = <span class=\"st\">\"in_progress\"<\/span>\n\n    <span class=\"kw\">def<\/span> resolve(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>.status == <span class=\"st\">\"in_progress\"<\/span>:\n            <span class=\"kw\">self<\/span>.status = <span class=\"st\">\"resolved\"<\/span>\n\n    <span class=\"kw\">def<\/span> close(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>.status <span class=\"kw\">in<\/span> (<span class=\"st\">\"resolved\"<\/span>, <span class=\"st\">\"open\"<\/span>):\n            <span class=\"kw\">self<\/span>.status = <span class=\"st\">\"closed\"<\/span>\n\n    <span class=\"kw\">def<\/span> reopen(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>.status != <span class=\"st\">\"open\"<\/span>:\n            <span class=\"kw\">self<\/span>.status = <span class=\"st\">\"open\"<\/span>\n            <span class=\"kw\">self<\/span>.assignee = <span class=\"kw\">None<\/span><\/code><\/pre><\/div>", "hints": ["الحالات هي القيم التي يأخذها <code dir=\"ltr\">status<\/code>. الأحداث هي الـ methods.", "انتبه إلى <code dir=\"ltr\">reopen<\/code>: من أي حالات تعمل؟", "ماذا يحدث عند استدعاء عملية غير مسموحة؟ هل يُبلَّغ المستدعي؟"], "checks": [], "sol": "<p><b>States<\/b>: Open (initial), InProgress, Resolved, Closed.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>[*] --&gt; Open\nOpen --assign(agent) / set assignee--&gt; InProgress\nOpen --close--&gt; Closed\nInProgress --resolve--&gt; Resolved\nResolved --close--&gt; Closed\nInProgress --reopen / clear assignee--&gt; Open\nResolved --reopen / clear assignee--&gt; Open\nClosed --reopen / clear assignee--&gt; Open        &lt;-- !!<\/code><\/pre><\/div>\n<div class=\"tw\"><table><thead><tr><th>State<\/th><th>assign<\/th><th>resolve<\/th><th>close<\/th><th>reopen<\/th><\/tr><\/thead><tbody><tr><td>Open<\/td><td>InProgress<\/td><td>ممنوع<\/td><td>Closed<\/td><td>ممنوع<\/td><\/tr><tr><td>InProgress<\/td><td>ممنوع<\/td><td>Resolved<\/td><td>ممنوع<\/td><td>Open<\/td><\/tr><tr><td>Resolved<\/td><td>ممنوع<\/td><td>ممنوع<\/td><td>Closed<\/td><td>Open<\/td><\/tr><tr><td>Closed<\/td><td>ممنوع<\/td><td>ممنوع<\/td><td>ممنوع<\/td><td><b>Open<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>الفحص (model review)<\/b>:<\/p>\n<ol><li><b>تناقض مع المتطلب<\/b>: <code dir=\"ltr\">reopen<\/code> تعمل من <code dir=\"ltr\">Closed<\/code> لأن الشرط <code dir=\"ltr\">status != \"open\"<\/code> يشملها. المتطلب يمنع ذلك. التصحيح: <code dir=\"ltr\">if self.status in (\"in_progress\", \"resolved\")<\/code>.<\/li><li><b>لا توجد حالة نهائية فعلية<\/b>: <code dir=\"ltr\">Closed<\/code> يخرج منها انتقال. بعد التصحيح تصير terminal.<\/li><li><b>فشل صامت<\/b>: العمليات الممنوعة لا تفعل شيئًا ولا تبلّغ أحدًا. الأفضل رفع <code dir=\"ltr\">InvalidTransition<\/code>.<\/li><li><b>Encapsulation<\/b>: <code dir=\"ltr\">status<\/code> عام، فأي كود يكتب <code dir=\"ltr\">ticket.status = \"closed\"<\/code>. يجب أن يصير <code dir=\"ltr\">_status<\/code> مع property للقراءة.<\/li><li>الأفضل <code dir=\"ltr\">Enum<\/code> مع جدول انتقالات كما في القسم 3.8.<\/li><\/ol>"}}], "test": [{"id": "m3l10t1", "type": "mc", "q": "<p>أي ثنائي يصف هدف التصميم الجيد؟<\/p>", "exp": "<p>اعتماد قليل بين الأجزاء وترابط قوي داخلها.<\/p>", "opts": ["High coupling و low cohesion", "Deep inheritance و public attributes", "Low coupling و high cohesion", "God classes و global variables"], "
