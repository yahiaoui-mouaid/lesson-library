ع لتنفيذ interface.<\/p>", "opts": ["لا فرق في الرسم", "الأولى بسهم مفتوح والثانية بلا سهم", "كلاهما بمثلث فارغ، لكن خط الأولى متصل وخط الثانية متقطّع", "الأولى بمعيّن والثانية بمثلث"], "ans": 2}, {"id": "m2l5t5", "type": "sa", "q": "<p>طالب مسجّل في مادة واحدة على الأقل ولا حدّ أعلى. ما الـ multiplicity التي تُكتب عند طرف المادة؟<\/p>", "exp": "<p>الإجابة: <b><code dir=\"ltr\">1..*<\/code><\/b> أي واحد أو أكثر.<\/p>", "kw": ["1..*"]}]}, {"t": "Mapping UML to Python", "intro": "<p>هذا القسم يربط التصميم البصري بالتنفيذ الفعلي: كيف يتحوّل كل عنصر في الـ class diagram إلى كود Python؟ (الـ roadmap الأصلي كان يشرح التحويل إلى Java، وحوّلناه إلى Python كما طلبت.)<\/p>", "items": [{"t": "الـ Class والـ Attributes والـ Operations", "html": "<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Class: Customer\nAttributes:\n- id: int\n- name: str\nMethods:\n+ update_name(name: str): None<\/code><\/pre><\/div>\n<p>يتحوّل إلى:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Customer:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, id: int, name: str):\n        <span class=\"kw\">self<\/span>._id = id\n        <span class=\"kw\">self<\/span>._name = name\n\n    <span class=\"kw\">def<\/span> update_name(<span class=\"kw\">self<\/span>, name: str) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._name = name<\/code><\/pre><\/div>\n<p>قواعد التحويل:<\/p>\n<ul><li><b>Class<\/b> يصبح <code dir=\"ltr\">class<\/code>.<\/li><li><b>Attribute<\/b> يصبح instance attribute يُعرَّف داخل <code dir=\"ltr\">__init__<\/code> (في Java يسمّى field).<\/li><li><b>Operation<\/b> تصبح method، وأول parameters فيها دائمًا <code dir=\"ltr\">self<\/code>.<\/li><li><b>الأنواع<\/b> تصبح <b>type hints<\/b>: <code dir=\"ltr\">name: str<\/code> و <code dir=\"ltr\">-&gt; None<\/code>. Python لا تفرضها وقت التشغيل، لكنها توثّق التصميم وتفحصها أدوات مثل mypy.<\/li><\/ul>\n<p>للـ classes التي تحمل بيانات أساسًا، <code dir=\"ltr\">@dataclass<\/code> تولّد <code dir=\"ltr\">__init__<\/code> تلقائيًا:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> dataclasses <span class=\"kw\">import<\/span> dataclass\n\n<span class=\"dc\">@dataclass<\/span>\n<span class=\"kw\">class<\/span> Customer:\n    id: int\n    name: str<\/code><\/pre><\/div>", "q": {"id": "m2l6c1", "type": "mc", "q": "<p>أين تُعرَّف الـ attributes الواردة في صندوق UML عند تحويله إلى class في Python؟<\/p>", "exp": "<p>الـ instance attributes تُنشأ في <code dir=\"ltr\">__init__<\/code> حتى يملكها كل object فور إنشائه.<\/p>", "opts": ["داخل كل method على حدة", "في ملف إعدادات منفصل", "خارج الـ class كمتغيّرات global", "داخل <code dir=\"ltr\">__init__<\/code> على شكل <code dir=\"ltr\">self.name = ...<\/code>"], "ans": 3}}, {"t": "تحويل الـ Visibility", "html": "<div class=\"tw\"><table><thead><tr><th>UML<\/th><th>Java<\/th><th>Python<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">+ name<\/code><\/td><td><code dir=\"ltr\">public<\/code><\/td><td><code dir=\"ltr\">self.name<\/code><\/td><\/tr><tr><td><code dir=\"ltr\"># name<\/code><\/td><td><code dir=\"ltr\">protected<\/code><\/td><td><code dir=\"ltr\">self._name<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">- name<\/code><\/td><td><code dir=\"ltr\">private<\/code><\/td><td><code dir=\"ltr\">self.__name<\/code> (mangling) أو <code dir=\"ltr\">self._name<\/code> بالاصطلاح الشائع<\/td><\/tr><tr><td><code dir=\"ltr\">- balance<\/code> مع <code dir=\"ltr\">+ get_balance()<\/code><\/td><td>getter<\/td><td><code dir=\"ltr\">@property<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> BankAccount:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, owner: str):\n        <span class=\"kw\">self<\/span>.owner = owner           <span class=\"cm\"># + owner: str<\/span>\n        <span class=\"kw\">self<\/span>._balance = <span class=\"nu\">0.0<\/span>          <span class=\"cm\"># - balance: float<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> balance(<span class=\"kw\">self<\/span>) -&gt; float:      <span class=\"cm\"># قراءة فقط: لا يوجد setter<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._balance<\/code><\/pre><\/div>\n<p>قرار عملي: معظم فرق Python تترجم <code dir=\"ltr\">-<\/code> و <code dir=\"ltr\">#<\/code> كليهما إلى شرطة واحدة <code dir=\"ltr\">_<\/code>، وتستعمل الشرطتين <code dir=\"ltr\">__<\/code> فقط حين يُخشى تعارض الأسماء مع subclasses.<\/p>\n<p>المهم أن يتحقق <b>قصد<\/b> المخطط: ما رُسم <code dir=\"ltr\">-<\/code> لا يُلمس من الخارج، ولو لم تمنعه اللغة.<\/p>", "q": {"id": "m2l6c2", "type": "tf", "q": "<p>الـ attribute المرسوم <code dir=\"ltr\">- balance<\/code> في UML يُترجم في Python غالبًا إلى <code dir=\"ltr\">self._balance<\/code> مع property للقراءة عند الحاجة.<\/p>", "exp": "<p>هذا الاصطلاح الأشيع. يحقق قصد الـ private، ويوفّر قراءة مضبوطة عبر <code dir=\"ltr\">@property<\/code>.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "الـ Abstract Class والـ Interface", "html": "<div class=\"tw\"><table><thead><tr><th>UML Concept<\/th><th>Java Equivalent<\/th><th>Python Equivalent<\/th><\/tr><\/thead><tbody><tr><td>Class<\/td><td><code dir=\"ltr\">class<\/code><\/td><td><code dir=\"ltr\">class<\/code><\/td><\/tr><tr><td>Attribute<\/td><td>Field<\/td><td>instance attribute<\/td><\/tr><tr><td>Operation<\/td><td>Method<\/td><td>method<\/td><\/tr><tr><td>Public visibility<\/td><td><code dir=\"ltr\">public<\/code><\/td><td>بلا بادئة<\/td><\/tr><tr><td>Private visibility<\/td><td><code dir=\"ltr\">private<\/code><\/td><td>بادئة <code dir=\"ltr\">_<\/code> أو <code dir=\"ltr\">__<\/code><\/td><\/tr><tr><td>Abstract class<\/td><td><code dir=\"ltr\">abstract class<\/code><\/td><td><code dir=\"ltr\">class X(ABC)<\/code> مع <code dir=\"ltr\">@abstractmethod<\/code><\/td><\/tr><tr><td>Interface<\/td><td><code dir=\"ltr\">interface<\/code><\/td><td><code dir=\"ltr\">class X(Protocol)<\/code> أو ABC كل methods فيه مجرّدة<\/td><\/tr><tr><td>Generalization<\/td><td><code dir=\"ltr\">extends<\/code><\/td><td><code dir=\"ltr\">class Child(Parent)<\/code><\/td><\/tr><tr><td>Interface realization<\/td><td><code dir=\"ltr\">implements<\/code><\/td><td><code dir=\"ltr\">class Impl(TheABC)<\/code> أو مطابقة الـ Protocol بنيويًا<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> abc <span class=\"kw\">import<\/span> ABC, abstractmethod\n<span class=\"kw\">from<\/span> typing <span class=\"kw\">import<\/span> Protocol\n\n<span class=\"kw\">class<\/span> Shape(ABC):                          <span class=\"cm\"># «abstract» Shape<\/span>\n    <span class=\"dc\">@abstractmethod<\/span>\n    <span class=\"kw\">def<\/span> area(<span class=\"kw\">self<\/span>) -&gt; float: ...\n\n<span class=\"kw\">class<\/span> Drawable(Protocol):                  <span class=\"cm\"># «interface» Drawable<\/span>\n    <span class=\"kw\">def<\/span> draw(<span class=\"kw\">self<\/span>) -&gt; str: ...<\/code><\/pre><\/div>\n<p>نقطة تميّز Python: الوراثة وتنفيذ الـ interface يُكتبان بالصيغة <b>نفسها<\/b> (اسم بين قوسين)، بينما Java تفرّق بـ <code dir=\"ltr\">extends<\/code> و <code dir=\"ltr\">implements<\/code>. و Python تسمح بـ <b>multiple inheritance<\/b>، فيمكن كتابة <code dir=\"ltr\">class Circle(Shape, Serializable)<\/code>.<\/p>", "q": {"id": "m2l6c3", "type": "mc", "q": "<p>ما المقابل في Python لـ <code dir=\"ltr\">interface<\/code> في Java إذا أردنا عقدًا لا يتطلب وراثة؟<\/p>", "exp": "<p>الـ <code dir=\"ltr\">Protocol<\/code> يعرّف عقدًا من methods، ويحققه أي class يملكها دون أن يرث منه.<\/p>", "opts": ["<code dir=\"ltr\">typing.Protocol<\/code>", "<code dir=\"ltr\">dict<\/code>", "<code dir=\"ltr\">lambda<\/code>", "<code dir=\"ltr\">@staticmethod<\/code>"], "ans": 0}}, {"t": "الـ Generalization والـ Realization", "html": "<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>«abstract» Shape  ◁────── Circle          (generalization)\n«interface» Drawable ◁- - - Circle        (realization)<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">import<\/span> math\n\n<span class=\"kw\">class<\/span> Circle(Shape):                       <span class=\"cm\"># Circle is-a Shape<\/span>\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, radius: float):\n        <span class=\"kw\">self<\/span>._radius = radius\n\n    <span class=\"kw\">def<\/span> area(<span class=\"kw\">self<\/span>) -&gt; float:               <span class=\"cm\"># تنفيذ الـ abstract method<\/span>\n        <span class=\"kw\">return<\/span> math.pi * <span class=\"kw\">self<\/span>._radius ** <span class=\"nu\">2<\/span>\n\n    <span class=\"kw\">def<\/span> draw(<span class=\"kw\">self<\/span>) -&gt; str:                 <span class=\"cm\"># يحقق Drawable دون وراثة (Protocol)<\/span>\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"Circle(r={self._radius})\"<\/span>\n\n<span class=\"kw\">def<\/span> render(item: Drawable) -&gt; <span class=\"kw\">None<\/span>:\n    print(item.draw())\n\nrender(Circle(<span class=\"nu\">2<\/span>))                          <span class=\"cm\"># Circle(r=2)<\/span><\/code><\/pre><\/div>\n<p>مساحة الدائرة التي تحسبها <code dir=\"ltr\">area<\/code> هي <span class=\"math\" dir=\"ltr\"><i>A<\/i> = π<i>r<\/i><sup>2<\/sup><\/span>.<\/p>\n<p>قواعد:<\/p>\n<ul><li>المثلث مع خط متصل: ضع الأب بين قوسَي الـ class.<\/li><li>المثلث مع خط متقطّع: نفّذ كل عمليات الـ interface. مع ABC ترث منه، ومع Protocol يكفي التطابق.<\/li><li>إذا ورثت من ABC ولم تنفّذ كل الـ abstract methods فسيُرفع <code dir=\"ltr\">TypeError<\/code> عند إنشاء الـ object. هكذا تفرض Python العقد.<\/li><\/ul>", "q": {"id": "m2l6c4", "type": "mc", "q": "<p>ماذا يحدث إذا حذفنا method اسمها <code dir=\"ltr\">area<\/code> من <code dir=\"ltr\">Circle<\/code> ثم نفّذنا <code dir=\"ltr\">Circle(2)<\/code>؟<\/p>", "exp": "<p>الـ subclass الذي لا ينفّذ كل الـ abstract methods يبقى مجرّدًا هو أيضًا، فلا يُنشأ منه object.<\/p>", "opts": ["يُرفع <code dir=\"ltr\">TypeError<\/code> لأن <code dir=\"ltr\">Circle<\/code> لم ينفّذ الـ abstract method الموروثة", "يُحذف <code dir=\"ltr\">Shape<\/code> تلقائيًا", "يعمل الكود وتعيد <code dir=\"ltr\">area()<\/code> القيمة صفرًا", "يُرفع الخطأ فقط عند استدعاء <code dir=\"ltr\">area()<\/code> لاحقًا"], "ans": 0}}, {"t": "الـ Association والـ Multiplicity في الكود", "html": "<p>الـ multiplicity تحدّد <b>شكل الـ attribute<\/b>:<\/p>\n<div class=\"tw\"><table><thead><tr><th>Multiplicity عند الطرف الآخر<\/th><th>الترجمة في Python<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">1<\/code><\/td><td>مرجع إجباري: <code dir=\"ltr\">self.customer: Customer<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">0..1<\/code><\/td><td>مرجع اختياري: <code dir=\"ltr\">self.payment: Payment or None<\/code> (يُكتب <code dir=\"ltr\">Optional[Payment]<\/code> أو <code dir=\"ltr\">Payment<\/code> مع <code dir=\"ltr\">None<\/code>)<\/td><\/tr><tr><td><code dir=\"ltr\">0..*<\/code><\/td><td>قائمة قد تكون فارغة: <code dir=\"ltr\">self.reservations: list[Reservation] = []<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">1..*<\/code><\/td><td>قائمة مع <b>تحقق<\/b> أنها غير فارغة<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Customer:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str):\n        <span class=\"kw\">self<\/span>.name = name\n        <span class=\"kw\">self<\/span>.reservations: list[<span class=\"st\">\"Reservation\"<\/span>] = []      <span class=\"cm\"># 0..*<\/span>\n\n<span class=\"kw\">class<\/span> Reservation:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, customer: Customer, room: <span class=\"st\">\"Room\"<\/span>):\n        <span class=\"kw\">self<\/span>.customer = customer                         <span class=\"cm\"># 1  (إجباري في الـ constructor)<\/span>\n        <span class=\"kw\">self<\/span>.room = room                                 <span class=\"cm\"># 1<\/span>\n        <span class=\"kw\">self<\/span>.payment: <span class=\"st\">\"Payment | None\"<\/span> = <span class=\"kw\">None<\/span>            <span class=\"cm\"># 0..1<\/span>\n        customer.reservations.append(<span class=\"kw\">self<\/span>)               <span class=\"cm\"># حافظ على الطرفين متسقين<\/span><\/code><\/pre><\/div>\n<p>ملاحظتان:<\/p>\n<ul><li>الطرف <code dir=\"ltr\">1<\/code> يُفرض بجعله parameter إجباريًا في <code dir=\"ltr\">__init__<\/code>.<\/li><li>العلاقة ذات الاتجاهين (كلٌّ يعرف الآخر) تتطلب تحديث الطرفين معًا، وهذا مصدر أخطاء. إن لم تحتج الاتجاهين فاكتفِ باتجاه واحد (navigability).<\/li><\/ul>", "q": {"id": "m2l6c5", "type": "mc", "q": "<p>علاقة <code dir=\"ltr\">Reservation ——— 0..1 Payment<\/code>. كيف يُمثَّل طرف <code dir=\"ltr\">Payment<\/code> داخل <code dir=\"ltr\">Reservation<\/code>؟<\/p>", "exp": "<p><code dir=\"ltr\">0..1<\/code> تعني اختياريًا: قد يوجد payment وقد لا يوجد، فنمثّله بمرجع يقبل <code dir=\"ltr\">None<\/code>.<\/p>", "opts": ["parameter إجباري في <code dir=\"ltr\">__init__<\/code>", "attribute قيمته <code dir=\"ltr\">Payment<\/code> أو <code dir=\"ltr\">None<\/code>", "وراثة من <code dir=\"ltr\">Payment<\/code>", "قائمة يجب أن تحتوي عنصرًا واحدًا على الأقل"], "ans": 1}}, {"t": "الـ Composition مقابل الـ Aggregation في الكود", "html": "<p>الفرق في الكود هو: <b>من ينشئ الجزء؟ ومن يملكه؟<\/b><\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># Composition: Hotel ◆── Room   (الكل ينشئ أجزاءه ويملكها حصريًا)<\/span>\n<span class=\"kw\">class<\/span> Hotel:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str, room_numbers: list[int]):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> room_numbers:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"A hotel needs at least one room\"<\/span>)     <span class=\"cm\"># 1..*<\/span>\n        <span class=\"kw\">self<\/span>.name = name\n        <span class=\"kw\">self<\/span>._rooms = [Room(n) <span class=\"kw\">for<\/span> n <span class=\"kw\">in<\/span> room_numbers]               <span class=\"cm\"># تُنشأ في الداخل<\/span>\n\n    <span class=\"kw\">def<\/span> room_numbers(<span class=\"kw\">self<\/span>) -&gt; list[int]:\n        <span class=\"kw\">return<\/span> [r.number <span class=\"kw\">for<\/span> r <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._rooms]      <span class=\"cm\"># لا نسلّم الـ objects نفسها للخارج<\/span>\n\n<span class=\"cm\"># Aggregation: Department ◇── Employee   (الأجزاء تُسلَّم من الخارج)<\/span>\n<span class=\"kw\">class<\/span> Department:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str):\n        <span class=\"kw\">self<\/span>.name = name\n        <span class=\"kw\">self<\/span>._employees: list[Employee] = []\n\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, employee: Employee) -&gt; <span class=\"kw\">None<\/span>:      <span class=\"cm\"># يُنشأ في الخارج ويُمرَّر<\/span>\n        <span class=\"kw\">self<\/span>._employees.append(employee)<\/code><\/pre><\/div>\n<p>علامات الـ composition في الكود:<\/p>\n<ul><li>الـ constructor أو method في الكل هي التي تستدعي <code dir=\"ltr\">Room(...)<\/code>.<\/li><li>الأجزاء مخزّنة في attribute داخلي ولا تُسلَّم مراجعها للخارج.<\/li><\/ul>\n<p>علامات الـ aggregation: الأجزاء تأتي كـ parameters، ويمكن أن يحتفظ بها غير هذا الكل.<\/p>", "q": {"id": "m2l6c6", "type": "sc", "sc": "في الكود: <code dir=\"ltr\">class Car: def __init__(self): self._engine = Engine()<\/code> ولا توجد أي طريقة للحصول على المحرّك أو تبديله من الخارج.", "q": "<p>أي علاقة UML يعبّر عنها هذا الكود؟<\/p>", "exp": "<p>السيارة تنشئ محرّكها وتملكه حصريًا، وعمره مرتبط بعمرها.<\/p>", "opts": ["Aggregation: <code dir=\"ltr\">Car ◇── Engine<\/code>", "Dependency فقط", "Generalization: <code dir=\"ltr\">Engine ──▷ Car<\/code>", "Composition: <code dir=\"ltr\">Car ◆── Engine<\/code>"], "ans": 3}}, {"t": "الـ Dependency في الكود", "html": "<p>الـ dependency تظهر حين يُستعمل class دون تخزينه كـ attribute:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> PDFGenerator:\n    <span class=\"kw\">def<\/span> render(<span class=\"kw\">self<\/span>, text: str) -&gt; bytes:\n        <span class=\"kw\">return<\/span> text.encode()\n\n<span class=\"kw\">class<\/span> ReportService:\n    <span class=\"kw\">def<\/span> export(<span class=\"kw\">self<\/span>, text: str, generator: PDFGenerator) -&gt; bytes:   <span class=\"cm\"># (1) parameter<\/span>\n        <span class=\"kw\">return<\/span> generator.render(text)\n\n    <span class=\"kw\">def<\/span> quick_export(<span class=\"kw\">self<\/span>, text: str) -&gt; bytes:\n        generator = PDFGenerator()                                    <span class=\"cm\"># (2) local variable<\/span>\n        <span class=\"kw\">return<\/span> generator.render(text)<\/code><\/pre><\/div>\n<p>كلاهما dependency: <code dir=\"ltr\">ReportService - - -&gt; PDFGenerator<\/code>.<\/p>\n<p>ملخّص التحويل من الكود إلى العلاقة:<\/p>\n<div class=\"tw\"><table><thead><tr><th>ما تراه في الكود<\/th><th>العلاقة في UML<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">class A(B)<\/code><\/td><td>Generalization أو Realization<\/td><\/tr><tr><td><code dir=\"ltr\">self.b = b<\/code> (مُمرَّر من الخارج)<\/td><td>Association أو Aggregation<\/td><\/tr><tr><td><code dir=\"ltr\">self.b = B()<\/code> (يُنشأ في الداخل ولا يُشارك)<\/td><td>Composition<\/td><\/tr><tr><td><code dir=\"ltr\">B<\/code> كـ parameter أو local variable فقط<\/td><td>Dependency<\/td><\/tr><\/tbody><\/table><\/div>\n<p>بهذا الجدول تستطيع الاتجاهين: من المخطط إلى الكود (forward engineering)، ومن الكود إلى المخطط (reverse engineering)، وهذا ما سنحتاجه في الوحدة 4.<\/p>", "q": {"id": "m2l6c7", "type": "mc", "q": "<p>رأيت في كود: <code dir=\"ltr\">class Invoice: def __init__(self, customer): self.customer = customer<\/code>. أي علاقة ترسمها بين <code dir=\"ltr\">Invoice<\/code> و <code dir=\"ltr\">Customer<\/code>؟<\/p>", "exp": "<p>مرجع مخزّن لـ object مُمرَّر من الخارج ويعيش مستقلًا: association، مع navigability من <code dir=\"ltr\">Invoice<\/code> إلى <code dir=\"ltr\">Customer<\/code>.<\/p>", "opts": ["لا علاقة", "Generalization", "Composition لأن العميل داخل الفاتورة", "Association (الفاتورة تعرف عميلًا أُنشئ خارجها)"], "ans": 3}}], "test": [{"id": "m2l6t1", "type": "mc", "q": "<p>ترجم إلى Python: <code dir=\"ltr\">«abstract» Employee<\/code> فيها <code dir=\"ltr\">+ pay(): float {abstract}<\/code>، و <code dir=\"ltr\">Manager ──▷ Employee<\/code>.<\/p>", "exp": "<p>الـ abstract class يرث <code dir=\"ltr\">ABC<\/code> ويعلن الـ method مجرّدة، والـ subclass يضع الأب بين القوسين وينفّذها.<\/p>", "opts": ["<code dir=\"ltr\">class Employee(ABC)<\/code> مع <code dir=\"ltr\">@abstractmethod def pay<\/code>، ثم <code dir=\"ltr\">class Manager(Employee)<\/code> تنفّذ <code dir=\"ltr\">pay<\/code>", "<code dir=\"ltr\">class Manager: employee = Employee()<\/code>", "<code dir=\"ltr\">class Employee(Manager)<\/code>", "<code dir=\"ltr\">def Employee(): pass<\/code>"], "ans": 0}, {"id": "m2l6t2", "type": "sc", "sc": "مخطط: <code dir=\"ltr\">Playlist ◇── 0..* Song<\/code>. كتب مطوّر: <code dir=\"ltr\">class Playlist: def __init__(self): self._songs = [Song(\"a\"), Song(\"b\")]<\/code> ولا يوجد <code dir=\"ltr\">add(song)<\/code>.", "q": "<p>هل الكود مطابق للمخطط؟<\/p>", "exp": "<p>الـ aggregation مع <code dir=\"ltr\">0..*<\/code> تتطلب قائمة تبدأ فارغة و method تستقبل أغاني أُنشئت خارج القائمة.<\/p>", "opts": ["لا، لأن Python لا تدعم القوائم", "لا، لأن <code dir=\"ltr\">Playlist<\/code> يجب أن يرث من <code dir=\"ltr\">Song<\/code>", "لا: الكود يعبّر عن composition بعدد ثابت، والمخطط يطلب aggregation لأغانٍ تأتي من الخارج بعدد متغيّر", "نعم مطابق تمامًا"], "ans": 2}, {"id": "m2l6t3", "type": "tf", "q": "<p>في Python، وراثة class وتنفيذ interface مبنية على ABC يُكتبان بالصيغة نفسها: اسم الأب بين قوسين.<\/p>", "exp": "<p>لا توجد كلمتان مختلفتان مثل <code dir=\"ltr\">extends<\/code> و <code dir=\"ltr\">implements<\/code> في Java.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m2l6t4", "type": "sa", "q": "<p><code dir=\"ltr\">B<\/code> يظهر فقط كـ parameter في method من <code dir=\"ltr\">A<\/code> ولا يُخزَّن. ما اسم علاقة UML بينهما؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Dependency<\/b>، وتُرسم سهمًا متقطّعًا من <code dir=\"ltr\">A<\/code> إلى <code dir=\"ltr\">B<\/code>.<\/p>", "kw": ["dependency"]}]}, {"t": "ورشة الوحدة 2 واختبارها", "intro": "<p>طبّق المبادئ الأربعة والـ class diagram على نظام الحجوزات من الوحدة 1، ثم راجع مخططًا فيه أخطاء (Capstone Assignment 1.1).<\/p>", "items": [{"t": "ورشة عملية: من بطاقات CRC إلى Class Diagram إلى Python", "task": {"id": "m2l7w1", "t": "ورشة عملية: من بطاقات CRC إلى Class Diagram إلى Python", "html": "<p>خذ نظام بيت الضيافة من ورشة الوحدة 1.<\/p>\n<ol><li>نقّح بطاقات CRC إن لزم.<\/li><li>حدّد الـ classes و attributes كل واحد (مع الـ visibility والأنواع).<\/li><li>حدّد الـ methods من المسؤوليات.<\/li><li>اكتب الـ class diagram <b>نصيًا<\/b>: سطر لكل علاقة مع نوعها والـ multiplicity. مثال: <code dir=\"ltr\">Guest 1 ── 0..* Reservation (association)<\/code>.<\/li><li>أضف حيث يناسب: association و composition و inheritance و dependency.<\/li><li>ترجم <code dir=\"ltr\">Room<\/code> و <code dir=\"ltr\">Reservation<\/code> إلى Python.<\/li><li>راجع: هل الكود يمثّل المخطط بأمانة؟<\/li><\/ol>", "hints": ["ابدأ بالعلاقات: من يعرف من؟ <code dir=\"ltr\">Reservation<\/code> يعرف <code dir=\"ltr\">Guest<\/code> و <code dir=\"ltr\">Room<\/code>. هل <code dir=\"ltr\">Payment<\/code> يعيش دون حجزه؟", "للوراثة: هل يوجد نوعان من شيء واحد؟ مثل <code dir=\"ltr\">StandardRoom<\/code> و <code dir=\"ltr\">Suite<\/code> بسعر يُحسب بشكل مختلف.", "في الكود: الطرف <code dir=\"ltr\">1<\/code> يصبح parameter إجباريًا في <code dir=\"ltr\">__init__<\/code>، و <code dir=\"ltr\">0..1<\/code> يصبح attribute يبدأ بـ <code dir=\"ltr\">None<\/code>."], "checks": [], "sol": "<h4>Classes<\/h4>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Guest          - name: str,  - phone: str\nRoom «abstract» # number: int, # base_price: float      + nightly_price(): float {abstract}\nStandardRoom   + nightly_price(): float\nSuite          + nightly_price(): float\nReservation    - check_in: date, - check_out: date, - status: str\n               + nights(): int, + total_price(): float, + confirm(), + cancel()\nPayment        - amount: float, - paid_on: date\nReservationService  + create(guest, room, check_in, check_out): Reservation<\/code><\/pre><\/div>\n<h4>Relationships<\/h4>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Guest 1 ────── 0..* Reservation          (association)\nReservation 0..* ─────&gt; 1 Room           (association, navigable to Room)\nReservation 1 ◆────── 0..1 Payment       (composition)\nStandardRoom ──▷ Room,  Suite ──▷ Room   (generalization)\nReservationService - - -&gt; Reservation, Room, Guest   (dependency)<\/code><\/pre><\/div>\n<h4>Python<\/h4>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> abc <span class=\"kw\">import<\/span> ABC, abstractmethod\n<span class=\"kw\">from<\/span> datetime <span class=\"kw\">import<\/span> date\n\n<span class=\"kw\">class<\/span> Room(ABC):\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, number: int, base_price: float):\n        <span class=\"kw\">self<\/span>._number = number\n        <span class=\"kw\">self<\/span>._base_price = base_price\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> number(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._number\n\n    <span class=\"dc\">@abstractmethod<\/span>\n    <span class=\"kw\">def<\/span> nightly_price(<span class=\"kw\">self<\/span>) -&gt; float: ...\n\n<span class=\"kw\">class<\/span> StandardRoom(Room):\n    <span class=\"kw\">def<\/span> nightly_price(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._base_price\n\n<span class=\"kw\">class<\/span> Suite(Room):\n    <span class=\"kw\">def<\/span> nightly_price(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._base_price * <span class=\"nu\">1.5<\/span>\n\n<span class=\"kw\">class<\/span> Reservation:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, guest: <span class=\"st\">\"Guest\"<\/span>, room: Room, check_in: date, check_out: date):\n        <span class=\"kw\">if<\/span> check_out &lt;= check_in:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"check_out must be after check_in\"<\/span>)\n        <span class=\"kw\">self<\/span>._guest = guest              <span class=\"cm\"># 1<\/span>\n        <span class=\"kw\">self<\/span>._room = room                <span class=\"cm\"># 1<\/span>\n        <span class=\"kw\">self<\/span>._check_in = check_in\n        <span class=\"kw\">self<\/span>._check_out = check_out\n        <span class=\"kw\">self<\/span>._status = <span class=\"st\">\"created\"<\/span>\n        <span class=\"kw\">self<\/span>._payment = <span class=\"kw\">None<\/span>             <span class=\"cm\"># 0..1 (composition)<\/span>\n\n    <span class=\"kw\">def<\/span> nights(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> (<span class=\"kw\">self<\/span>._check_out - <span class=\"kw\">self<\/span>._check_in).days\n\n    <span class=\"kw\">def<\/span> total_price(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>.nights() * <span class=\"kw\">self<\/span>._room.nightly_price()<\/code><\/pre><\/div>\n<h4>المراجعة<\/h4>\n<ul><li>الـ attributes كلها داخلية، والتواريخ تُتحقق عند الإنشاء (encapsulation).<\/li><li><code dir=\"ltr\">total_price<\/code> لا تسأل عن نوع الغرفة: polymorphism.<\/li><li>الطرف <code dir=\"ltr\">1<\/code> مفروض في الـ constructor، و <code dir=\"ltr\">0..1<\/code> يبدأ بـ <code dir=\"ltr\">None<\/code>.<\/li><\/ul>"}}, {"t": "Capstone 1.1: راجع هذا الـ Class Diagram واكتشف أخطاءه", "task": {"id": "m2l7w2", "t": "Capstone 1.1: راجع هذا الـ Class Diagram واكتشف أخطاءه", "html": "<p>زميلك رسم هذا المخطط لنظام مكتبة. فيه <b>خمسة أخطاء<\/b> على الأقل. اكتب كل خطأ وتصحيحه مع السبب.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Member ──▷ Book                        (Member inherits Book)\nLibrary 1 ◇────── 1..* Shelf           (aggregation)\nLoan 0..* ────── 0..* Member           (each loan may have many members)\nBook:    + isbn: str, + title: str, + available: bool\nLoan:    - due_date: date\n         + send_email_reminder(), + generate_pdf_report(), + calculate_fine()\nBook 1 ◆────── 0..* Author<\/code><\/pre><\/div>", "hints": ["جرّب جملة is-a على كل وراثة. هل العضو «نوع من» الكتاب؟", "اقرأ كل multiplicity بتثبيت object واحد: إعارة واحدة تخص كم عضوًا؟", "انظر إلى visibility الـ attributes، وإلى تماسك مسؤوليات <code dir=\"ltr\">Loan<\/code>، وإلى عمر <code dir=\"ltr\">Author<\/code> بالنسبة للكتاب."], "checks": [], "sol": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>الخطأ<\/th><th>التصحيح<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><code dir=\"ltr\">Member ──▷ Book<\/code>: العضو ليس نوعًا من الكتاب (فشل is-a)<\/td><td>حذف الوراثة. العلاقة تمرّ عبر <code dir=\"ltr\">Loan<\/code>: العضو يستعير كتبًا<\/td><\/tr><tr><td>2<\/td><td><code dir=\"ltr\">Loan 0..* ── 0..* Member<\/code>: الإعارة الواحدة تخص عضوًا واحدًا<\/td><td><code dir=\"ltr\">Member 1 ── 0..* Loan<\/code>، وكذلك <code dir=\"ltr\">Loan 0..* ──&gt; 1 Book<\/code> وهي علاقة ناقصة أصلًا في المخطط<\/td><\/tr><tr><td>3<\/td><td>attributes الـ <code dir=\"ltr\">Book<\/code> كلها <code dir=\"ltr\">+<\/code> (public)، فأي class يغيّر <code dir=\"ltr\">available<\/code><\/td><td>جعلها <code dir=\"ltr\">-<\/code> مع عمليات مثل <code dir=\"ltr\">+ mark_borrowed()<\/code> و <code dir=\"ltr\">+ mark_returned()<\/code><\/td><\/tr><tr><td>4<\/td><td><code dir=\"ltr\">Loan<\/code> تحمل مسؤوليات غير مترابطة: بريد و PDF وغرامة<\/td><td>تبقى <code dir=\"ltr\">calculate_fine()<\/code> في <code dir=\"ltr\">Loan<\/code>. الإرسال إلى <code dir=\"ltr\">NotificationService<\/code> والتقارير إلى <code dir=\"ltr\">ReportService<\/code><\/td><\/tr><tr><td>5<\/td><td><code dir=\"ltr\">Book ◆── Author<\/code>: المؤلف لا يفنى بحذف كتاب، وقد يؤلف عدة كتب<\/td><td>association: <code dir=\"ltr\">Book 0..* ── 1..* Author<\/code><\/td><\/tr><tr><td>6<\/td><td><code dir=\"ltr\">Library ◇── Shelf<\/code>: الرفوف جزء ثابت من المكتبة ولا تُنقل<\/td><td>الأقرب composition: <code dir=\"ltr\">Library 1 ◆── 1..* Shelf<\/code> (يقبل النقاش حسب المجال)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>الدرس: اقرأ كل علاقة كجملة كاملة واسأل «هل هذا صحيح في الواقع؟». معظم الأخطاء تنكشف بهذه الطريقة وحدها.<\/p>"}}], "test": [{"id": "m2l7t1", "type": "mc", "q": "<p>ما المبادئ الأربعة للـ Object-Oriented Design التي درسناها في هذه الوحدة؟<\/p>", "exp": "<p>هذه هي المبادئ الأربعة، وكل واحد منها ينعكس في رموز الـ class diagram.<\/p>", "opts": ["Abstraction و Encapsulation و Decomposition و Generalization", "Class و Object و Method و Attribute", "Compilation و Execution و Debugging و Deployment", "Coupling و Cohesion و Testing و Refactoring"], "ans": 0}, {"id": "m2l7t2", "type": "sc", "sc": "<code dir=\"ltr\">class Reservation<\/code> فيها <code dir=\"ltr\">self.status = \"created\"<\/code> وهو public، وأربعة ملفات تكتب <code dir=\"ltr\">reservation.status = \"confirmed\"<\/code> مباشرة.", "q": "<p>أي مبدأ مُهمَل؟<\/p>", "exp": "<p>الحالة الداخلية تُعدَّل من الخارج دون تحكم. العلاج: <code dir=\"ltr\">_status<\/code> مع method مثل <code dir=\"ltr\">confirm()<\/code> تتحقق من الشروط.<\/p>", "opts": ["Encapsulation", "Polymorphism", "Decomposition", "Generalization"], "ans": 0}, {"id": "m2l7t3", "type": "mc", "q": "<p><code dir=\"ltr\">Engine<\/code> و <code dir=\"ltr\">Wheel<\/code> أجزاء من <code dir=\"ltr\">Car<\/code> تُنشأ معها ولا تُشارك. ما الرمز الصحيح؟<\/p>", "exp": "<p>Composition: معيّن مملوء عند الكل.<\/p>", "opts": ["سهم متقطّع من <code dir=\"ltr\">Car<\/code>", "معيّن مملوء عند <code dir=\"ltr\">Car<\/code>", "معيّن فارغ عند <code dir=\"ltr\">Engine<\/code>", "مثلث فارغ عند <code dir=\"ltr\">Car<\/code>"], "ans": 1}, {"id": "m2l7t4", "type": "tf", "q": "<p>الـ Class Diagram يوضّح ترتيب استدعاء الـ methods أثناء تنفيذ عملية.<\/p>", "exp": "<p>هو مخطط بنيوي ثابت. الترتيب الزمني يوضّحه الـ Sequence Diagram في الوحدة 3.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m2l7t5", "type": "sa", "q": "<p>ما الاسم الإنجليزي للخاصية التي تجعل <code dir=\"ltr\">vehicle.wheels()<\/code> تعطي نتيجة مختلفة حسب النوع الفعلي للـ object؟<\/p>", "exp": "<p>الإجابة: <b>Polymorphism<\/b>.<\/p>", "kw": ["polymorphism"]}]}]}, {"t": "المبادئ المتقدمة والمخططات السلوكية", "g": "افهم كيف تبني بنية قابلة للصيانة، ونمذج ما يحدث داخل النظام <b>أثناء عمله<\/b>: كيف تتواصل الـ objects وكيف تتغيّر حالاتها.", "lessons": [{"t": "Coupling", "intro": "<p>الوحدة 2 ركّزت على البنية الثابتة: أي classes توجد وكيف ترتبط. هذه الوحدة تضيف شيئين: مبادئ <b>جودة<\/b> هذه البنية (الأقسام 1 إلى 6)، ثم <b>السلوك الديناميكي<\/b> (الأقسام 7 إلى 9). نبدأ بأهم مقياسين لجودة أي تصميم: Coupling و Cohesion.<\/p>", "items": [{"t": "ما هو الـ Coupling؟", "html": "<p><b>Coupling<\/b> (الاقتران) يقيس <b>مدى اعتماد<\/b> module أو class على غيره.<\/p>\n<p>السؤال العملي: «إذا غيّرتُ B، هل أُضطر إلى تغيير A؟». كلما كان الجواب «نعم» في حالات أكثر كان الـ coupling أقوى.<\/p>\n<p>تشبيه: قابس الكهرباء. المصباح لا يعرف شيئًا عن محطة التوليد، يعرف فقط شكل المقبس. تستطيع تغيير المحطة كلها والمصباح يعمل. هذا loose coupling. لو كان المصباح ملحومًا بأسلاك الجدار لاحتجت كهربائيًا لتبديله. هذا tight coupling.<\/p>\n<p>مثال: <code dir=\"ltr\">OrderService<\/code> يعتمد مباشرة على: مزوّد دفع محدّد، وخدمة بريد محدّدة، وتنفيذ قاعدة بيانات محدّد، وتنفيذ مخزون محدّد. تغيير أي واحدة من هذه التقنيات قد يفرض تعديل <code dir=\"ltr\">OrderService<\/code> نفسه.<\/p>\n<p>الـ coupling لا يمكن أن يكون صفرًا (classes لا تتعاون لا تبني نظامًا). الهدف: <b>أقل<\/b> اقتران ممكن و<b>أضعف<\/b> أنواعه.<\/p>", "q": {"id": "m3l1c1", "type": "mc", "q": "<p>ما السؤال الذي يقيس الـ coupling بين A و B؟<\/p>", "exp": "<p>الاقتران هو درجة انتقال أثر التغيير من جزء إلى آخر.<\/p>", "opts": ["هل A أسرع من B؟", "كم سطرًا في A؟", "هل A و B في الملف نفسه؟", "إذا تغيّر B، هل يجب أن يتغيّر A؟"], "ans": 3}}, {"t": "Tight Coupling", "html": "<p><b>Tight coupling<\/b>: class يعتمد مباشرة على <b>تفاصيل تنفيذ<\/b> class آخر.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> StripeGateway:\n    <span class=\"kw\">def<\/span> charge_card(<span class=\"kw\">self<\/span>, card_number: str, cents: int) -&gt; bool:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">True<\/span>\n\n<span class=\"kw\">class<\/span> SmtpMailer:\n    <span class=\"kw\">def<\/span> send_mail(<span class=\"kw\">self<\/span>, host: str, to: str, body: str) -&gt; <span class=\"kw\">None<\/span>:\n        print(f<span class=\"st\">\"[{host}] mail to {to}: {body}\"<\/span>)\n\n<span class=\"kw\">class<\/span> OrderService:\n    <span class=\"kw\">def<\/span> place_order(<span class=\"kw\">self<\/span>, email: str, card: str, total: float) -&gt; bool:\n        gateway = StripeGateway()                          <span class=\"cm\"># (1) ينشئ نوعًا محدّدًا بنفسه<\/span>\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> gateway.charge_card(card, int(total * <span class=\"nu\">100<\/span>)):   <span class=\"cm\"># (2) يعرف أن Stripe تريد cents<\/span>\n            <span class=\"kw\">return<\/span> <span class=\"kw\">False<\/span>\n        SmtpMailer().send_mail(<span class=\"st\">\"smtp.example.com\"<\/span>, email, <span class=\"st\">\"Order placed\"<\/span>)   <span class=\"cm\"># (3) يعرف الـ host<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">True<\/span><\/code><\/pre><\/div>\n<p>علامات الاقتران الشديد:<\/p>\n<ol><li>إنشاء الأنواع المحدّدة <b>داخل<\/b> الـ method.<\/li><li>معرفة تفاصيل داخلية (التحويل إلى cents، عنوان الخادم).<\/li><li>استحالة اختبار <code dir=\"ltr\">place_order<\/code> دون دفع حقيقي وبريد حقيقي.<\/li><\/ol>\n<p>العواقب: استبدال Stripe بـ PayPal يتطلب تعديل <code dir=\"ltr\">OrderService<\/code>. وكل class آخر كتب الشيء نفسه سيُعدَّل أيضًا. هذا يسمّى <b>ripple effect<\/b>: تغيير صغير ينتشر كالموج في النظام.<\/p>", "q": {"id": "m3l1c2", "type": "tf", "q": "<p>في الكود أعلاه، يصعب اختبار <code dir=\"ltr\">place_order<\/code> دون الاتصال بخدمة الدفع الحقيقية.<\/p>", "exp": "<p>الـ method تنشئ <code dir=\"ltr\">StripeGateway<\/code> بنفسها، فلا سبيل لاستبداله ببديل وهمي من الخارج. صعوبة الاختبار علامة مميّزة للـ tight coupling.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "Loose Coupling", "html": "<p><b>Loose coupling<\/b>: الـ classes تتواصل عبر <b>interfaces أو abstractions<\/b> واضحة، فيقلّ اعتمادها على تنفيذ محدّد.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> typing <span class=\"kw\">import<\/span> Protocol\n\n<span class=\"kw\">class<\/span> PaymentGateway(Protocol):\n    <span class=\"kw\">def<\/span> charge(<span class=\"kw\">self<\/span>, card: str, amount: float) -&gt; bool: ...\n\n<span class=\"kw\">class<\/span> Mailer(Protocol):\n    <span class=\"kw\">def<\/span> send(<span class=\"kw\">self<\/span>, to: str, body: str) -&gt; <span class=\"kw\">None<\/span>: ...\n\n<span class=\"kw\">class<\/span> OrderService:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, gateway: PaymentGateway, mailer: Mailer):\n        <span class=\"kw\">self<\/span>._gateway = gateway          <span class=\"cm\"># يعرف «ماذا» فقط<\/span>\n        <span class=\"kw\">self<\/span>._mailer = mailer\n\n    <span class=\"kw\">def<\/span> place_order(<span class=\"kw\">self<\/span>, email: str, card: str, total: float) -&gt; bool:\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> <span class=\"kw\">self<\/span>._gateway.charge(card, total):\n            <span class=\"kw\">return<\/span> <span class=\"kw\">False<\/span>\n        <span class=\"kw\">self<\/span>._mailer.send(email, <span class=\"st\">\"Order placed\"<\/span>)\n        <span class=\"kw\">return<\/span> <span class=\"kw\">True<\/span><\/code><\/pre><\/div>\n<p>الآن <code dir=\"ltr\">OrderService<\/code> لا يذكر Stripe ولا SMTP. تفاصيل cents والـ host انتقلت إلى الـ classes التي تنفّذ الواجهتين. والاختبار صار بسيطًا:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> FakeGateway:\n    <span class=\"kw\">def<\/span> charge(<span class=\"kw\">self<\/span>, card, amount): <span class=\"kw\">return<\/span> <span class=\"kw\">True<\/span>\n\n<span class=\"kw\">class<\/span> FakeMailer:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>): <span class=\"kw\">self<\/span>.sent = []\n    <span class=\"kw\">def<\/span> send(<span class=\"kw\">self<\/span>, to, body): <span class=\"kw\">self<\/span>.sent.append(to)\n\nmailer = FakeMailer()\nservice = OrderService(FakeGateway(), mailer)\n<span class=\"kw\">assert<\/span> service.place_order(<span class=\"st\">\"a@b.com\"<\/span>, <span class=\"st\">\"4242\"<\/span>, <span class=\"nu\">30.0<\/span>) <span class=\"kw\">is<\/span> <span class=\"kw\">True<\/span>\n<span class=\"kw\">assert<\/span> mailer.sent == [<span class=\"st\">\"a@b.com\"<\/span>]<\/code><\/pre><\/div>\n<p>تبديل مزوّد الدفع الآن يعني كتابة class جديد وتمريره، دون لمس <code dir=\"ltr\">OrderService<\/code>.<\/p>", "q": {"id": "m3l1c3", "type": "mc", "q": "<p>بعد إعادة التصميم، ماذا يلزم لاستبدال Stripe بـ PayPal؟<\/p>", "exp": "<p><code dir=\"ltr\">OrderService<\/code> يعتمد على العقد <code dir=\"ltr\">PaymentGateway<\/code> فقط. أي تنفيذ يحقق العقد يصلح.<\/p>", "opts": ["لا يمكن الاستبدال", "كتابة class جديد فيه <code dir=\"ltr\">charge(card, amount)<\/code> وتمريره إلى <code dir=\"ltr\">OrderService<\/code>", "إعادة كتابة <code dir=\"ltr\">place_order<\/code>", "تعديل الـ Protocol وكل من يستعمله"], "ans": 1}}, {"t": "Dependency Inversion و Dependency Injection", "html": "<p>ما فعلناه في المثال السابق له اسمان مرتبطان:<\/p>\n<p><b>Dependency Inversion Principle (DIP)<\/b>: الـ modules عالية المستوى (منطق العمل مثل <code dir=\"ltr\">OrderService<\/code>) يجب ألّا تعتمد على modules منخفضة المستوى (تفاصيل مثل Stripe)، بل <b>كلاهما يعتمد على abstraction<\/b>.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>قبل:   OrderService ───────&gt; StripeGateway\nبعد:   OrderService ───────&gt; «interface» PaymentGateway &lt;- - - - StripeGateway<\/code><\/pre><\/div>\n<p>لاحظ الـ «inversion»: سهم <code dir=\"ltr\">StripeGateway<\/code> صار يشير <b>نحو<\/b> الـ abstraction التي يملكها منطق العمل. التفاصيل صارت تتبع السياسة وليس العكس.<\/p>\n<p><b>Dependency Injection (DI)<\/b>: التقنية التي تحقق ذلك. الـ object <b>لا ينشئ<\/b> ما يعتمد عليه، بل <b>يُعطى<\/b> له من الخارج، غالبًا عبر الـ constructor:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>service = OrderService(StripeGateway(), SmtpMailer())     <span class=\"cm\"># الإنتاج<\/span>\nservice = OrderService(FakeGateway(), FakeMailer())       <span class=\"cm\"># الاختبار<\/span><\/code><\/pre><\/div>\n<p>الجزء الوحيد الذي يعرف الأنواع المحدّدة هو نقطة التجميع عند بدء التطبيق، وتسمّى <b>composition root<\/b>.<\/p>\n<p>الـ DI لا تحتاج framework: تمرير parameter إلى <code dir=\"ltr\">__init__<\/code> هو DI كاملة.<\/p>", "q": {"id": "m3l1c4", "type": "sa", "q": "<p>ما اسم التقنية التي يُعطى فيها الـ object ما يعتمد عليه من الخارج بدل أن ينشئه بنفسه؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Dependency Injection (DI)<\/b>. وهي الوسيلة العملية لتحقيق Dependency Inversion.<\/p>", "kw": ["injection", "DI"]}}, {"t": "إدارة الـ Dependencies والحدّ من انتشار التغيير", "html": "<p>كيف «ترى» الاقتران في مشروعك؟ في Python أبسط مؤشّر هو أسطر <code dir=\"ltr\">import<\/code>: كل import سهم dependency.<\/p>\n<p>مقياس مفيد لكل module هو <b>Instability<\/b>:<\/p>\n<div class=\"mathb\" dir=\"ltr\"><i>I<\/i> = <span class=\"fr\"><span><i>C<\/i><sub><i>e<\/i><\/sub><\/span><span class=\"dn\"><i>C<\/i><sub><i>a<\/i><\/sub> + <i>C<\/i><sub><i>e<\/i><\/sub><\/span><\/span><\/div>\n<ul><li><span class=\"math\" dir=\"ltr\"><i>C<\/i><sub><i>e<\/i><\/sub><\/span> (efferent coupling): عدد الـ modules التي <b>يعتمد عليها<\/b> هذا الـ module (أسهم خارجة).<\/li><li><span class=\"math\" dir=\"ltr\"><i>C<\/i><sub><i>a<\/i><\/sub><\/span> (afferent coupling): عدد الـ modules التي <b>تعتمد عليه<\/b> (أسهم داخلة).<\/li><\/ul>\n<p><span class=\"math\" dir=\"ltr\"><i>I<\/i><\/span> قريبة من 0: كثيرون يعتمدون عليه وهو لا يعتمد على أحد. تغييره خطير، فيجب أن يكون مستقرًا ومجرّدًا. <span class=\"math\" dir=\"ltr\"><i>I<\/i><\/span> قريبة من 1: يعتمد على كثيرين ولا يعتمد عليه أحد. تغييره سهل.<\/p>\n<p>قواعد عملية:<\/p>\n<ul><li>اجعل الاعتمادات تتجه <b>نحو الأكثر استقرارًا<\/b> (منطق المجال والـ abstractions)، لا نحو التفاصيل المتقلّبة.<\/li><li>تجنّب <b>circular dependencies<\/b> (A يستورد B و B يستورد A): الجزآن يصيران عمليًا جزءًا واحدًا.<\/li><li><b>Law of Demeter<\/b>: لا تكتب <code dir=\"ltr\">order.customer.address.city.name<\/code>. كل نقطة إضافية اقتران ببنية داخلية لا تخصّك. اطلب ما تريد من جارك المباشر.<\/li><\/ul>\n<p>الهدف النهائي: ألّا يكسر التغيير في جزء أجزاءً لا علاقة لها به.<\/p>", "q": {"id": "m3l1c5", "type": "mc", "q": "<p>module يعتمد على modules اثنين (<span class=\"math\" dir=\"ltr\"><i>C<\/i><sub><i>e<\/i><\/sub> = 2<\/span>)، ويعتمد عليه ستة (<span class=\"math\" dir=\"ltr\"><i>C<\/i><sub><i>a<\/i><\/sub> = 6<\/span>). ما قيمة <span class=\"math\" dir=\"ltr\"><i>I<\/i><\/span>؟<\/p>", "exp": "<p><span class=\"math\" dir=\"ltr\"><i>I<\/i> = <span class=\"fr\"><span>2<\/span><span class=\"dn\">6 + 2<\/span><\/span> = 0.25<\/span>. قيمة منخفضة: module يعتمد عليه كثيرون، فتغييره يجب أن يكون حذرًا.<\/p>", "opts": ["0.25", "3", "0.33", "0.75"], "ans": 0}}], "test": [{"id": "m3l1t1", "type": "sc", "sc": "<code dir=\"ltr\">InvoiceService<\/code> يحتوي السطر <code dir=\"ltr\">db = PostgresConnection(\"10.0.0.5\")<\/code> داخل كل method.", "q": "<p>ما المشكلة وما العلاج؟<\/p>", "exp": "<p>الخدمة تنشئ تفصيلًا محدّدًا بنفسها. حقن abstraction يسمح بتبديل قاعدة البيانات وباختبار الخدمة دون قاعدة حقيقية.<\/p>", "opts": ["Tight coupling بتنفيذ محدّد؛ العلاج: الاعتماد على abstraction مثل <code dir=\"ltr\">InvoiceRepository<\/code> تُحقن عبر الـ constructor", "العلاج جعل <code dir=\"ltr\">InvoiceService<\/code> يرث من <code dir=\"ltr\">PostgresConnection<\/code>", "لا مشكلة، هذا أسرع", "العلاج نسخ السطر في ملف إعدادات فقط"], "ans": 0}, {"id": "m3l1t2", "type": "tf", "q": "<p>الهدف هو الوصول إلى coupling يساوي صفرًا بين كل الـ classes.<\/p>", "exp": "<p>الـ classes يجب أن تتعاون لتبني نظامًا. الهدف اقتران قليل وضعيف، عبر واجهات واضحة.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m3l1t3", "type": "mc", "q": "<p>أي سطر يخالف Law of Demeter؟<\/p>", "exp": "<p>سلسلة النقاط تربط الكود بالبنية الداخلية لأربعة objects. الأفضل سؤال <code dir=\"ltr\">reservation<\/code> مباشرة عمّا نحتاجه.<\/p>", "opts": ["<code dir=\"ltr\">reservation.customer.account.balance.amount<\/code>", "<code dir=\"ltr\">reservation.total_price()<\/code>", "<code dir=\"ltr\">customer.name<\/code>", "<code dir=\"ltr\">order.add_item(product, 2)<\/code>"], "ans": 0}, {"id": "m3l1t4", "type": "sa", "q": "<p>ما المصطلح الإنجليزي لانتشار أثر تعديل صغير إلى أجزاء كثيرة من النظام بسبب الاقتران الشديد؟<\/p>", "exp": "<p>الإجابة: <b>Ripple effect<\/b>.<\/p>", "kw": ["ripple"]}]}, {"t": "Cohesion", "intro": "<p>الوجه الآخر للعملة: الـ coupling ينظر إلى العلاقات <b>بين<\/b> الـ modules، والـ cohesion ينظر إلى <b>داخل<\/b> الـ module الواحد.<\/p>", "items": [{"t": "ما هو الـ Cohesion؟", "html": "<p><b>Cohesion<\/b> (التماسك) يصف <b>مدى ترابط المسؤوليات<\/b> داخل module أو class واحد: هل كل ما فيه يخدم غرضًا واحدًا؟<\/p>\n<p>تشبيه: علبة عدّة النجّار فيها مطرقة ومنشار ومسامير، وكلها تخدم النجارة: تماسك عالٍ. درج المطبخ الذي فيه بطاريات ومفكّ وشريط لاصق وفاتورة قديمة: تماسك ضعيف.<\/p>\n<p>اختبارات سريعة للـ class:<\/p>\n<ul><li>هل تستطيع وصف غرضه في <b>جملة واحدة دون «و»<\/b>؟<\/li><li>هل معظم الـ methods تستعمل معظم الـ attributes؟ إذا انقسمت إلى مجموعتين لا تتقاطعان فأنت أمام class-ين ملتصقين.<\/li><li>هل يوجد <b>سبب واحد<\/b> لتغييره؟ (سنسمّي هذا Single Responsibility في الوحدة 5).<\/li><\/ul>", "q": {"id": "m3l2c1", "type": "mc", "q": "<p>أي class يُظهر تماسكًا عاليًا؟<\/p>", "exp": "<p>كل عمليات <code dir=\"ltr\">PriceCalculator<\/code> تخدم غرضًا واحدًا هو حساب السعر.<\/p>", "opts": ["<code dir=\"ltr\">Helper<\/code> فيه: <code dir=\"ltr\">send_email()<\/code> و <code dir=\"ltr\">resize_image()<\/code> و <code dir=\"ltr\">parse_date()<\/code>", "<code dir=\"ltr\">Misc<\/code> فيه كل ما لم نجد له مكانًا", "<code dir=\"ltr\">Manager<\/code> فيه: <code dir=\"ltr\">login()<\/code> و <code dir=\"ltr\">print_invoice()<\/code> و <code dir=\"ltr\">backup_database()<\/code>", "<code dir=\"ltr\">PriceCalculator<\/code> فيه: <code dir=\"ltr\">subtotal()<\/code> و <code dir=\"ltr\">tax()<\/code> و <code dir=\"ltr\">discount()<\/code> و <code dir=\"ltr\">total()<\/code>"], "ans": 3}}, {"t": "Poor Cohesion", "html": "<p>class اسمه <code dir=\"ltr\">ApplicationManager<\/code> يتولّى: إرسال البريد، إنشاء الفواتير، إدارة العملاء، معالجة الحجوزات، توليد التقارير. هذه مسؤوليات لا رابط حقيقيًّا بينها.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> ApplicationManager:\n    <span class=\"kw\">def<\/span> send_email(<span class=\"kw\">self<\/span>, to, body): ...\n    <span class=\"kw\">def<\/span> create_invoice(<span class=\"kw\">self<\/span>, reservation): ...\n    <span class=\"kw\">def<\/span> add_customer(<span class=\"kw\">self<\/span>, name): ...\n    <span class=\"kw\">def<\/span> process_reservation(<span class=\"kw\">self<\/span>, data): ...\n    <span class=\"kw\">def<\/span> generate_report(<span class=\"kw\">self<\/span>, month): ...<\/code><\/pre><\/div>\n<p>المشاكل:<\/p>\n<ul><li><b>صعب الفهم<\/b>: لا تعرف ما الـ class إلا بقراءته كله.<\/li><li><b>أسباب تغيير كثيرة<\/b>: تغيير قالب البريد وتغيير حساب الضريبة يعدّلان الملف نفسه.<\/li><li><b>يجذب الاقتران<\/b>: كل جزء في النظام يحتاج شيئًا منه، فيرتبط به الجميع.<\/li><li><b>إعادة استخدام مستحيلة<\/b>: تريد الفواتير فقط؟ ستجرّ معها البريد والتقارير.<\/li><\/ul>\n<p>لاحظ: هذا هو الـ God class الذي كشفته بطاقات CRC في الوحدة 1، ونسمّيه الآن باسمه الهندسي: low cohesion.<\/p>", "q": {"id": "m3l2c2", "type": "tf", "q": "<p>التماسك الضعيف في class يزيد غالبًا الاقتران في النظام، لأن أجزاء كثيرة ستعتمد عليه.<\/p>", "exp": "<p>class يفعل كل شيء يحتاجه الجميع، فيصير مركزًا يرتبط به كل النظام. التماسك والاقتران مترابطان.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "High Cohesion", "html": "<p>العلاج: classes منفصلة، كلٌّ بمسؤولية مركّزة: <code dir=\"ltr\">EmailService<\/code> و <code dir=\"ltr\">InvoiceService<\/code> و <code dir=\"ltr\">CustomerService<\/code> و <code dir=\"ltr\">ReservationService<\/code> و <code dir=\"ltr\">ReportService<\/code>.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> InvoiceService:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, tax_rate: float):\n        <span class=\"kw\">self<\/span>._tax_rate = tax_rate\n\n    <span class=\"kw\">def<\/span> subtotal(<span class=\"kw\">self<\/span>, reservation) -&gt; float:\n        <span class=\"kw\">return<\/span> reservation.nights() * reservation.nightly_price()\n\n    <span class=\"kw\">def<\/span> tax(<span class=\"kw\">self<\/span>, reservation) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>.subtotal(reservation) * <span class=\"kw\">self<\/span>._tax_rate\n\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>, reservation) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>.subtotal(reservation) + <span class=\"kw\">self<\/span>.tax(reservation)<\/code><\/pre><\/div>\n<p>كل method هنا تتعلّق بالفواتير، وكلها تستعمل <code dir=\"ltr\">_tax_rate<\/code> مباشرة أو عبر أخرى. إذا تغيّرت قواعد الضريبة فهذا <b>الملف الوحيد<\/b> الذي يُفتح. المعادلة التي ينفّذها:<\/p>\n<div class=\"mathb\" dir=\"ltr\"><span class=\"tx\">total<\/span> = <span class=\"tx\">subtotal<\/span> × (1 + <i>r<\/i>)<\/div>\n<p>حيث <span class=\"math\" dir=\"ltr\"><i>r<\/i><\/span> نسبة الضريبة.<\/p>\n<p>تحذير من المبالغة: التماسك العالي لا يعني class لكل method. تفتيت النظام إلى مئات الـ classes الصغيرة جدًا يزيد الاقتران بينها ويجعل تتبّع المنطق صعبًا. الهدف أن يجتمع <b>ما ينتمي معًا<\/b>.<\/p>", "q": {"id": "m3l2c3", "type": "mc", "q": "<p>حجز من 3 ليالٍ بسعر 100 لليلة، ونسبة الضريبة <span class=\"math\" dir=\"ltr\"><i>r<\/i> = 0.1<\/span>. ما ناتج <code dir=\"ltr\">total<\/code> حسب <span class=\"math\" dir=\"ltr\"><span class=\"tx\">total<\/span> = <span class=\"tx\">subtotal<\/span> × (1 + <i>r<\/i>)<\/span>؟<\/p>", "exp": "<p>subtotal يساوي <span class=\"math\" dir=\"ltr\">3 × 100 = 300<\/span>، ثم <span class=\"math\" dir=\"ltr\">300 × 1.1 = 330<\/span>.<\/p>", "opts": ["310", "300", "303", "330"], "ans": 3}}, {"t": "Coupling مع Cohesion", "html": "<div class=\"tw\"><table><thead><tr><th>Concept<\/th><th>What you want<\/th><\/tr><\/thead><tbody><tr><td>Coupling<\/td><td>Low<\/td><\/tr><tr><td>Cohesion<\/td><td>High<\/td><\/tr><\/tbody><\/table><\/div>\n<p>هذه القاعدة الذهبية للتصميم القابل للصيانة: <b>Low coupling, high cohesion<\/b>. والاثنان مترابطان: حين تجمع ما ينتمي معًا (cohesion عالٍ) تقلّ حاجة الأجزاء إلى بعضها (coupling منخفض).<\/p>\n<p>صورة ذهنية: مدينة من أحياء. داخل الحي كل شيء قريب ومترابط (cohesion). وبين الأحياء طرق رئيسية قليلة وواضحة (coupling منخفض). المدينة السيئة: كل بيت متصل بكل بيت بممرّات خاصة.<\/p>\n<p>كيف تستعملهما في المراجعة؟<\/p>\n<ul><li>تعديل ميزة واحدة يتطلب فتح ملفات كثيرة: cohesion ضعيف (الميزة مبعثرة) أو coupling عالٍ.<\/li><li>class يُعدَّل لأسباب لا علاقة بينها: cohesion ضعيف.<\/li><li>لا تستطيع اختبار class دون تجهيز نصف النظام: coupling عالٍ.<\/li><\/ul>", "q": {"id": "m3l2c4", "type": "sc", "sc": "لإضافة حقل «رقم الجواز» للعميل اضطر الفريق إلى تعديل 11 ملفًا في modules مختلفة.", "q": "<p>ماذا يدل ذلك؟<\/p>", "exp": "<p>تغيير واحد يجب أن يمسّ مكانًا واحدًا أو أماكن قليلة. انتشاره يدل على أن المسؤولية ليست مجموعة في مكانها.<\/p>", "opts": ["يجب إضافة ملف ثاني عشر", "لغة Python غير مناسبة", "التصميم ممتاز لأن التغيير شمل كل شيء", "معرفة «العميل» مبعثرة: cohesion ضعيف و coupling عالٍ ببنية بيانات العميل"], "ans": 3}}], "test": [{"id": "m3l2t1", "type": "mc", "q": "<p>أكمل القاعدة الذهبية:<\/p>", "exp": "<p>اعتماد قليل بين الأجزاء، وترابط قوي داخل كل جزء.<\/p>", "opts": ["Low coupling, high cohesion", "High coupling, low cohesion", "High coupling, high cohesion", "Low coupling, low cohesion"], "ans": 0}, {"id": "m3l2t2", "type": "sc", "sc": "<code dir=\"ltr\">ReservationService<\/code> فيه: <code dir=\"ltr\">create()<\/code> و <code dir=\"ltr\">cancel()<\/code> و <code dir=\"ltr\">confirm()<\/code> و <code dir=\"ltr\">export_to_excel()<\/code> و <code dir=\"ltr\">send_sms()<\/code>.", "q": "<p>ما التحسين؟<\/p>", "exp": "<p>التصدير والرسائل مسؤوليتان مختلفتان عن دورة حياة الحجز. فصلهما يرفع التماسك.<\/p>", "opts": ["لا حاجة لأي تحسين", "نقل <code dir=\"ltr\">export_to_excel<\/code> إلى خدمة تصدير و <code dir=\"ltr\">send_sms<\/code> إلى خدمة إشعارات، وإبقاء عمليات الحجز الثلاث", "دمجه مع <code dir=\"ltr\">CustomerService<\/code> في class واحد", "إضافة <code dir=\"ltr\">backup_database()<\/code> أيضًا"], "ans": 1}, {"id": "m3l2t3", "type": "tf", "q": "<p>تقسيم كل class إلى classes صغيرة جدًا، method واحدة في كل منها، يضمن أفضل تصميم.<\/p>", "exp": "<p>التفتيت المفرط يرفع الاقتران ويشتّت المنطق. المطلوب أن يجتمع ما ينتمي معًا.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m3l2t4", "type": "sa", "q": "<p>ما المصطلح الإنجليزي لمدى ترابط المسؤوليات داخل الـ class الواحد؟<\/p>", "exp": "<p>الإجابة: <b>Cohesion<\/b>.<\/p>", "kw": ["cohesion"]}]}, {"t": "Separation of Concerns", "intro": "<p>مبدأ عام يجمع ما سبق: كل جزء من النظام يهتم بشأن واحد.<\/p>", "items": [{"t": "ما هو الـ Separation of Concerns؟", "html": "<p><b>Separation of Concerns (SoC)<\/b> معناه فصل المسؤوليات المختلفة حتى يعالج كل جزء من النظام <b>concern<\/b> واحدًا متميّزًا.<\/p>\n<p><b>Concern<\/b> هو «شأن» أو جانب من جوانب البرنامج: عرض البيانات، التحقق من المدخلات، قواعد العمل، التخزين، الصلاحيات، التسجيل (logging).<\/p>\n<p>تشبيه: المطعم. النادل يأخذ الطلب، والطاهي يطبخ، والمحاسب يقبض. لو فعل شخص واحد كل شيء لتعطّل المطعم عند أول زحام، ولما استطعت تغيير الطاهي دون تغيير المحاسب.<\/p>\n<p>الفائدة: تستطيع فهم أو تغيير شأن واحد دون أن تحمل في ذهنك بقية الشؤون. تغيير شكل الصفحة لا يهدّد حساب الضريبة.<\/p>\n<p>علاقته بما سبق: الـ SoC هو المبدأ، و high cohesion و low coupling هما <b>نتيجته<\/b> حين يُطبَّق جيدًا.<\/p>", "q": {"id": "m3l3c1", "type": "mc", "q": "<p>أي وضع يخالف الـ SoC؟<\/p>", "exp": "<p>أربعة شؤون مختلفة في دالة واحدة. تغيير أي منها يهدّد البقية.<\/p>", "opts": ["class يدير الاتصال بقاعدة البيانات فقط", "دالة واحدة تتحقق من المدخلات، وتحسب السعر، وتكتب في قاعدة البيانات، وتبني صفحة HTML", "دالة تحسب الضريبة فقط", "module خاص بالصلاحيات"], "ans": 1}}, {"t": "مثال Django: Views و Serializers و Models و Services و Permissions", "html": "<p>في تطبيق Django (مع Django REST Framework) يمكن فصل الشؤون هكذا:<\/p>\n<div class=\"tw\"><table><thead><tr><th>الجزء<\/th><th>الشأن (concern)<\/th><\/tr><\/thead><tbody><tr><td>Views<\/td><td>استقبال الـ HTTP requests وإعادة الـ responses<\/td><\/tr><tr><td>Serializers<\/td><td>التحقق من البيانات وتحويلها (validation و transformation)<\/td><\/tr><tr><td>Models<\/td><td>تمثيل كيانات قاعدة البيانات والبيانات المرتبطة بها<\/td><\/tr><tr><td>Services<\/td><td>تنفيذ عمليات العمل (business operations)<\/td><\/tr><tr><td>Permissions<\/td><td>التحكم في الوصول إلى الموارد<\/td><\/tr><\/tbody><\/table><\/div>\n<p>بهذا نتجنّب وضع كل شيء في view واحد أو model ضخم.<\/p>\n<p>كيف تعرف أين يوضع سطر كود؟ اسأل: «أي شأن يخدم؟»<\/p>\n<ul><li>«هل الـ JSON فيه الحقول المطلوبة؟» في الـ Serializer.<\/li><li>«هل هذا المستخدم مدير؟» في الـ Permission.<\/li><li>«هل الغرفة متاحة في هذه التواريخ؟ وإن كانت، أنشئ الحجز وسجّل العملية» في الـ Service.<\/li><li>«حوّل النتيجة إلى response برمز 201» في الـ View.<\/li><\/ul>", "q": {"id": "m3l3c2", "type": "sc", "sc": "في مشروع Django REST، أين يوضع منطق «لا يُنشأ حجز إذا كانت الغرفة محجوزة في التواريخ نفسها»؟", "q": "<p>اختر الأنسب.<\/p>", "exp": "<p>هذه قاعدة عمل. وضعها في service يجعلها قابلة للاستعمال من أي view أو مهمة مجدولة، وقابلة للاختبار دون HTTP.<\/p>", "opts": ["في ملف <code dir=\"ltr\">urls.py<\/code>", "في service (أو في طبقة المجال) تستدعيها الـ view", "في الـ view مباشرة بين قراءة الـ request وبناء الـ response", "في قالب HTML"], "ans": 1}}, {"t": "الـ SoC على كل المستويات", "html": "<p>الـ SoC مبدأ <b>عام<\/b>، يتكرّر على كل مستوى من النظام:<\/p>\n<ul><li><b>Classes<\/b>: كل class بمسؤولية واحدة.<\/li><li><b>Modules<\/b>: كل package حول مفهوم واحد (customers و reservations و billing).<\/li><li><b>Layers<\/b> (طبقات): presentation ثم business logic ثم data access. كل طبقة تتحدّث مع التي تحتها فقط.<\/li><li><b>Services<\/b>: خدمة للمصادقة وخدمة للإشعارات.<\/li><li><b>Frontend و backend<\/b>: الواجهة تهتم بالعرض والتفاعل، والـ backend يهتم بالقواعد والبيانات، وبينهما API.<\/li><\/ul>\n<p>هناك أيضًا <b>cross-cutting concerns<\/b>: شؤون تعبر كل الأجزاء، مثل logging و authentication ومعالجة الأخطاء. هذه لا تُنسخ في كل دالة، بل تُعزل في مكان واحد يُطبَّق على الجميع، مثل middleware في Django أو decorators في Python:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">import<\/span> functools\n\n<span class=\"kw\">def<\/span> logged(func):\n    <span class=\"dc\">@functools.wraps<\/span>(func)\n    <span class=\"kw\">def<\/span> wrapper(*args, **kwargs):\n        print(f<span class=\"st\">\"calling {func.__name__}\"<\/span>)\n        <span class=\"kw\">return<\/span> func(*args, **kwargs)\n    <span class=\"kw\">return<\/span> wrapper\n\n<span class=\"dc\">@logged<\/span>\n<span class=\"kw\">def<\/span> cancel_reservation(reservation_id: int) -&gt; str:\n    <span class=\"kw\">return<\/span> f<span class=\"st\">\"Reservation {reservation_id} cancelled\"<\/span><\/code><\/pre><\/div>\n<p>الدالة <code dir=\"ltr\">cancel_reservation<\/code> تهتم بالإلغاء فقط، وشأن التسجيل معزول في الـ decorator.<\/p>", "q": {"id": "m3l3c3", "type": "tf", "q": "<p>الـ Separation of Concerns ينطبق على مستوى الـ classes فقط، ولا علاقة له بالطبقات أو بفصل الـ frontend عن الـ backend.<\/p>", "exp": "<p>مبدأ عام يُطبَّق على classes و modules و layers و services وعلى الفصل بين frontend و backend.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "من دالة تفعل كل شيء إلى شؤون مفصولة", "html": "<p><b>قبل<\/b>: دالة واحدة تخلط أربعة شؤون.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> create_reservation_view(request_data: dict, db: list) -&gt; dict:\n    <span class=\"kw\">if<\/span> <span class=\"st\">\"guest\"<\/span> <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> request_data <span class=\"kw\">or<\/span> request_data.get(<span class=\"st\">\"nights\"<\/span>, <span class=\"nu\">0<\/span>) &lt;= <span class=\"nu\">0<\/span>:   <span class=\"cm\"># validation<\/span>\n        <span class=\"kw\">return<\/span> {<span class=\"st\">\"status\"<\/span>: <span class=\"nu\">400<\/span>, <span class=\"st\">\"error\"<\/span>: <span class=\"st\">\"invalid data\"<\/span>}\n    total = request_data[<span class=\"st\">\"nights\"<\/span>] * <span class=\"nu\">100<\/span> * <span class=\"nu\">1.1<\/span>                               <span class=\"cm\"># business rule<\/span>\n    db.append({<span class=\"st\">\"guest\"<\/span>: request_data[<span class=\"st\">\"guest\"<\/span>], <span class=\"st\">\"total\"<\/span>: total})              <span class=\"cm\"># persistence<\/span>\n    <span class=\"kw\">return<\/span> {<span class=\"st\">\"status\"<\/span>: <span class=\"nu\">201<\/span>, <span class=\"st\">\"total\"<\/span>: total}                                   <span class=\"cm\"># presentation<\/span><\/code><\/pre><\/div>\n<p><b>بعد<\/b>: كل شأن في مكانه.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> validate(data: dict) -&gt; <span class=\"kw\">None<\/span>:                       <span class=\"cm\"># validation<\/span>\n    <span class=\"kw\">if<\/span> <span class=\"st\">\"guest\"<\/span> <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> data <span class=\"kw\">or<\/span> data.get(<span class=\"st\">\"nights\"<\/span>, <span class=\"nu\">0<\/span>) &lt;= <span class=\"nu\">0<\/span>:\n        <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"invalid data\"<\/span>)\n\n<span class=\"kw\">def<\/span> reservation_total(nights: int, price: float = <span class=\"nu\">100<\/span>, tax: float = <span class=\"nu\">0.1<\/span>) -&gt; float:   <span class=\"cm\"># business<\/span>\n    <span class=\"kw\">return<\/span> nights * price * (<span class=\"nu\">1<\/span> + tax)\n\n<span class=\"kw\">class<\/span> ReservationRepository:                            <span class=\"cm\"># persistence<\/span>\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>): <span class=\"kw\">self<\/span>._rows = []\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, guest: str, total: float) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._rows.append({<span class=\"st\">\"guest\"<\/span>: guest, <span class=\"st\">\"total\"<\/span>: total})\n\n<span class=\"kw\">def<\/span> create_reservation_view(data: dict, repo: ReservationRepository) -&gt; dict:   <span class=\"cm\"># presentation<\/span>\n    <span class=\"kw\">try<\/span>:\n        validate(data)\n    <span class=\"kw\">except<\/span> ValueError <span class=\"kw\">as<\/span> error:\n        <span class=\"kw\">return<\/span> {<span class=\"st\">\"status\"<\/span>: <span class=\"nu\">400<\/span>, <span class=\"st\">\"error\"<\/span>: str(error)}\n    total = reservation_total(data[<span class=\"st\">\"nights\"<\/span>])\n    repo.add(data[<span class=\"st\">\"guest\"<\/span>], total)\n    <span class=\"kw\">return<\/span> {<span class=\"st\">\"status\"<\/span>: <span class=\"nu\">201<\/span>, <span class=\"st\">\"total\"<\/span>: total}<\/code><\/pre><\/div>\n<p>الكود صار أطول قليلًا، لكن: <code dir=\"ltr\">reservation_total<\/code> تُختبر بسطر واحد، وتغيير التخزين إلى قاعدة بيانات حقيقية يمسّ الـ repository فقط، وقاعدة السعر لها مكان واحد.<\/p>", "q": {"id": "m3l3c4", "type": "mc", "q": "<p>بعد الفصل، أي جزء يُعدَّل إذا تغيّرت نسبة الضريبة من 10% إلى 15%؟<\/p>", "exp": "<p>حساب السعر شأن معزول في دالة واحدة. هذه ثمرة الـ SoC: التغيير محلي.<\/p>", "opts": ["<code dir=\"ltr\">reservation_total<\/code> فقط", "<code dir=\"ltr\">ReservationRepository<\/code>", "كل الدوال الأربع", "<code dir=\"ltr\">validate<\/code>"], "ans": 0}}], "test": [{"id": "m3l3t1", "type": "mc", "q": "<p>ما الـ concern الذي يخص الـ Serializer في Django REST Framework؟<\/p>", "exp": "<p>الـ serializer مسؤول عن validation و transformation. الصلاحيات للـ permissions، والتنسيق للـ services.<\/p>", "opts": ["التحقق من البيانات وتحويلها بين JSON و objects", "تحديد من يملك صلاحية الوصول", "تنسيق عمليات العمل متعددة الخطوات", "توجيه الـ URLs"], "ans": 0}, {"id": "m3l3t2", "type": "sc", "sc": "فريق ينسخ في بداية كل دالة عشرة أسطر متطابقة تتحقق من تسجيل دخول المستخدم.", "q": "<p>ما الحل وفق الـ SoC؟<\/p>", "exp": "<p>المصادقة شأن يعبر كل الدوال. عزله في مكان واحد يمنع التكرار ونسيان تطبيقه.<\/p>", "opts": ["عزل هذا الـ cross-cutting concern في decorator أو middleware يُطبَّق على الجميع", "ترك النسخ كما هو لأنه واضح", "نقل الأسطر إلى نهاية كل دالة", "حذف التحقق من تسجيل الدخول"], "ans": 0}, {"id": "m3l3t3", "type": "tf", "q": "<p>فصل الشؤون يجعل اختبار قواعد العمل ممكنًا دون تشغيل خادم ويب أو قاعدة بيانات.<\/p>", "exp": "<p>حين تكون القاعدة في دالة أو service لا تعرف HTTP ولا التخزين، تُختبر مباشرة باستدعاء عادي.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}]}, {"t": "Information Hiding", "intro": "<p>مبدأ قريب من الـ encapsulation لكنه أوسع: ماذا يجب ألّا يعرف الآخرون؟<\/p>", "items": [{"t": "ما هو الـ Information Hiding؟", "html": "<p><b>Information hiding<\/b> معناه إخفاء <b>قرارات التصميم الداخلية<\/b> لمكوّن، بحيث لا تعتمد المكوّنات الأخرى إلا على المعلومات التي تحتاجها فعلًا.<\/p>\n<p>مثال <code dir=\"ltr\">EmailService<\/code>. بقية التطبيق لا يجب أن تعرف:<\/p>\n<ul><li>أي مزوّد بريد نستعمل.<\/li><li>كيف تُهيَّأ اتصالات SMTP.<\/li><li>كيف تُحمَّل قوالب الرسائل.<\/li><li>كيف تُنفَّذ إعادة المحاولة (retries).<\/li><\/ul>\n<p>يكفيها عملية واضحة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>email_service.send_welcome_email(customer)<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> EmailService:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, sender, max_retries: int = <span class=\"nu\">3<\/span>):\n        <span class=\"kw\">self<\/span>._sender = sender              <span class=\"cm\"># مخفي: أي مزوّد<\/span>\n        <span class=\"kw\">self<\/span>._max_retries = max_retries    <span class=\"cm\"># مخفي: سياسة إعادة المحاولة<\/span>\n\n    <span class=\"kw\">def<\/span> send_welcome_email(<span class=\"kw\">self<\/span>, customer) -&gt; bool:\n        body = <span class=\"kw\">self<\/span>._render(<span class=\"st\">\"welcome\"<\/span>, customer)        <span class=\"cm\"># مخفي: القوالب<\/span>\n        <span class=\"kw\">for<\/span> _ <span class=\"kw\">in<\/span> range(<span class=\"kw\">self<\/span>._max_retries):\n            <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>._sender.send(customer.email, body):\n                <span class=\"kw\">return<\/span> <span class=\"kw\">True<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">False<\/span>\n\n    <span class=\"kw\">def<\/span> _render(<span class=\"kw\">self<\/span>, template: str, customer) -&gt; str:\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"Welcome, {customer.name}!\"<\/span><\/code><\/pre><\/div>\n<p>التنفيذ يتغيّر (مزوّد جديد، قوالب HTML، خمس محاولات) دون إجبار أي class آخر على التغيير.<\/p>", "q": {"id": "m3l4c1", "type": "mc", "q": "<p>أي معلومة يجب أن <b>تبقى مخفية<\/b> داخل <code dir=\"ltr\">EmailService<\/code>؟<\/p>", "exp": "<p>سياسة الـ retries قرار داخلي قابل للتغيير. الخيارات الأخرى هي الواجهة العامة التي يحتاجها المستعمِلون.<\/p>", "opts": ["أن هناك عملية اسمها <code dir=\"ltr\">send_welcome_email<\/code>", "عدد محاولات إعادة الإرسال وطريقة تنفيذها", "أن العملية تستقبل <code dir=\"ltr\">customer<\/code>", "أن العملية تعيد نجاحًا أو فشلًا"], "ans": 1}}, {"t": "إخفاء القرارات المرشّحة للتغيير", "html": "<p>السؤال العملي: <b>ماذا<\/b> أخفي؟ القاعدة (من David Parnas، 1972): كل module يخفي <b>قرارًا تصميميًا مرشّحًا للتغيير<\/b>. اسأل «ما الذي قد يتغيّر مستقبلًا؟» واجعل كل جواب سرًّا داخل module واحد.<\/p>\n<p>قرارات تستحق الإخفاء:<\/p>\n<ul><li><b>صيغة التخزين<\/b>: dictionary أم قاعدة بيانات أم ملف.<\/li><li><b>المزوّد الخارجي<\/b>: Stripe أم PayPal.<\/li><li><b>الخوارزمية<\/b>: كيف يُحسب الخصم.<\/li><li><b>صيغة البيانات<\/b>: JSON أم CSV.<\/li><\/ul>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> ReservationRepository:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._by_id = {}                 <span class=\"cm\"># السرّ: التخزين في dictionary<\/span>\n\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, reservation) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._by_id[reservation.id] = reservation\n\n    <span class=\"kw\">def<\/span> find(<span class=\"kw\">self<\/span>, reservation_id: int):\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._by_id.get(reservation_id)<\/code><\/pre><\/div>\n<p>خطأ يسمّى <b>leaky abstraction<\/b> (تجريد مُسرِّب): أن تتسرّب التفاصيل إلى الواجهة، مثل method تعيد الـ dictionary الداخلي نفسه، أو parameter اسمه <code dir=\"ltr\">sql_where_clause<\/code>. عندها يبني الآخرون كودهم على التفصيل، ويصير تغييره مستحيلًا.<\/p>", "q": {"id": "m3l4c2", "type": "sc", "sc": "<code dir=\"ltr\">ReservationRepository<\/code> فيه method: <code dir=\"ltr\">def raw_rows(self): return self._by_id<\/code> وتستعملها خمسة modules. قرر الفريق الانتقال إلى PostgreSQL.", "q": "<p>ما المشكلة؟<\/p>", "exp": "<p>هذه leaky abstraction. كان يجب إظهار عمليات (find و add و list) لا البنية الداخلية نفسها.<\/p>", "opts": ["الـ method سرّبت بنية التخزين الداخلية، فالـ modules الخمسة مرتبطة بالـ dictionary وستنكسر", "PostgreSQL لا تعمل مع Python", "المشكلة أن الـ dictionary بطيء", "لا مشكلة، يكفي تغيير اسم الـ method"], "ans": 0}}, {"t": "Information Hiding مقابل Encapsulation", "html": "<p>المفهومان مرتبطان وليسا متطابقين:<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>Encapsulation<\/th><th>Information Hiding<\/th><\/tr><\/thead><tbody><tr><td>ما هو؟<\/td><td><b>آلية<\/b>: تجميع البيانات والسلوك والتحكم في الوصول إلى الحالة الداخلية<\/td><td><b>مبدأ تصميمي<\/b>: إخفاء قرارات التنفيذ وحماية المكوّنات من معرفة لا تلزمها<\/td><\/tr><tr><td>المستوى<\/td><td>الـ class غالبًا<\/td><td>أي مستوى: class أو module أو خدمة أو API<\/td><\/tr><tr><td>السؤال<\/td><td>«كيف أمنع العبث بالبيانات؟»<\/td><td>«ما القرارات التي يجب ألّا يعتمد عليها أحد؟»<\/td><\/tr><\/tbody><\/table><\/div>\n<p>الـ encapsulation <b>أداة<\/b> تساعد على تحقيق الـ information hiding، لكنها لا تضمنه:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Order:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._items_dict = {}\n\n    <span class=\"kw\">def<\/span> get_items_dict(<span class=\"kw\">self<\/span>) -&gt; dict:       <span class=\"cm\"># encapsulated شكليًا...<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._items_dict             <span class=\"cm\"># ...لكنها تكشف قرار «التخزين في dict»<\/span><\/code><\/pre><\/div>\n<p>هنا يوجد encapsulation شكلي (attribute داخلي و getter) دون information hiding: الجميع يعرف أن العناصر في dictionary ويعتمد على ذلك.<\/p>\n<p>والعكس ممكن: module فيه دوال فقط بلا classes يستطيع إخفاء قرار (مثل صيغة ملف) خلف دالتين <code dir=\"ltr\">load()<\/code> و <code dir=\"ltr\">save()<\/code>.<\/p>", "q": {"id": "m3l4c3", "type": "tf", "q": "<p>كل class يستعمل attributes خاصة مع getters و setters يحقق تلقائيًا الـ information hiding.<\/p>", "exp": "<p>الـ getters قد تكشف القرار الداخلي نفسه (مثل إعادة البنية الداخلية). الـ information hiding يتعلّق بما تكشفه الواجهة من قرارات، لا بوجود الشرطة السفلية.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}], "test": [{"id": "m3l4t1", "type": "mc", "q": "<p>ما القاعدة التي تحدّد ماذا يُخفى داخل module؟<\/p>", "exp": "<p>كل قرار قابل للتغيير يصير سرًّا في module واحد، فيبقى أثر تغييره محليًا.<\/p>", "opts": ["أخفِ كل شيء دون استثناء", "أخفِ أسماء كل الـ methods", "لا تُخفِ شيئًا لتسهيل الاستعمال", "أخفِ القرارات التصميمية المرشّحة للتغيير"], "ans": 3}, {"id": "m3l4t2", "type": "sc", "sc": "<code dir=\"ltr\">PaymentService.pay(order)<\/code> تعيد object خامًا من مكتبة Stripe، ويقرأ منه عشرون موضعًا الحقل <code dir=\"ltr\">stripe_charge_id<\/code>.", "q": "<p>ما التقييم؟<\/p>", "exp": "<p>حين تظهر تفاصيل المزوّد في الواجهة يعتمد عليها الجميع، فيصير تبديله مكلفًا.<\/p>", "opts": ["يجب أن يرث <code dir=\"ltr\">PaymentService<\/code> من Stripe", "المشكلة فقط في عدد المواضع", "ممتاز، كلما زادت التفاصيل كان أفضل", "الواجهة سرّبت قرار «نستعمل Stripe»؛ الأفضل إعادة نوع خاص بنا مثل <code dir=\"ltr\">PaymentResult<\/code>"], "ans": 3}, {"id": "m3l4t3", "type": "tf", "q": "<p>الـ Information Hiding يمكن تطبيقه على مستوى module أو API كامل وليس فقط داخل class.<\/p>", "exp": "<p>هو مبدأ عام: أي مكوّن يخفي قراراته الداخلية خلف واجهة مستقرة.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}]}, {"t": "Conceptual Integrity", "intro": "<p>حتى لو كان كل جزء جيدًا وحده، النظام قد يكون فوضى إذا كان كل جزء مصمّمًا بفلسفة مختلفة.<\/p>", "items": [{"t": "ما هي الـ Conceptual Integrity؟", "html": "<p><b>Conceptual Integrity<\/b> (التكامل المفاهيمي) معناها الحفاظ على <b>فلسفة تصميم واحدة متّسقة<\/b> في كل النظام، كأن عقلًا واحدًا صمّمه.<\/p>\n<p>نظام يفتقدها يبدو هكذا:<\/p>\n<ul><li>ثلاث طرق مختلفة للمصادقة (authentication).<\/li><li>عدة اصطلاحات تسمية متضاربة.<\/li><li>أساليب تحقق (validation) مختلفة لعمليات متشابهة.<\/li><li>عدة أنماط معمارية متنافسة دون سبب واضح.<\/li><\/ul>\n<p>لماذا يضرّ ذلك؟ لأن المطوّر لا يستطيع <b>التوقّع<\/b>. في نظام متّسق تتعلّم طريقة واحدة وتطبّقها في كل مكان. في نظام متضارب تتعلّم كل زاوية من جديد.<\/p>\n<p>تشبيه: مدينة كل أحيائها تستعمل إشارات المرور نفسها. تخيّل لو كان الأحمر يعني «قف» في حي و«انطلق» في آخر.<\/p>\n<p>التكامل المفاهيمي لا يعني «أفضل حل في كل موضع»، بل <b>حل واحد جيد يُطبَّق بثبات<\/b>. الاتساق أثمن من تحسين محلي صغير.<\/p>", "q": {"id": "m3l5c1", "type": "mc", "q": "<p>ما المقصود بالـ conceptual integrity؟<\/p>", "exp": "<p>الاتساق في فلسفة التصميم هو الهدف، ويمكن أن يحققه فريق كبير إذا اتفق على مبادئ مشتركة.<\/p>", "opts": ["أن يُكتب النظام بيد مطوّر واحد فقط", "أن يستعمل النظام أحدث التقنيات", "أن يتبع النظام كله أفكارًا وأساليب تصميم متّسقة", "أن يخلو الكود من التعليقات"], "ans": 2}}, {"t": "اتساق الـ Naming Conventions والأنماط المعمارية", "html": "<p><b>Naming conventions<\/b>: اتفاق واحد على التسمية. في Python المرجع هو <b>PEP 8<\/b>:<\/p>\n<ul><li><code dir=\"ltr\">snake_case<\/code> للدوال والمتغيّرات: <code dir=\"ltr\">create_reservation<\/code>.<\/li><li><code dir=\"ltr\">PascalCase<\/code> للـ classes: <code dir=\"ltr\">ReservationService<\/code>.<\/li><li><code dir=\"ltr\">UPPER_CASE<\/code> للثوابت: <code dir=\"ltr\">MAX_NIGHTS<\/code>.<\/li><\/ul>\n<p>والأهم من الشكل هو <b>اتساق المفردات<\/b>: إذا سمّيت جلب البيانات <code dir=\"ltr\">get_<\/code> فلا تستعمل في مكان آخر <code dir=\"ltr\">fetch_<\/code> و <code dir=\"ltr\">load_<\/code> و <code dir=\"ltr\">retrieve_<\/code> للمعنى نفسه. وإذا كان المفهوم <code dir=\"ltr\">Customer<\/code> فلا يصير <code dir=\"ltr\">Client<\/code> في module آخر و <code dir=\"ltr\">User<\/code> في ثالث.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># غير متّسق                          # متّسق<\/span>\nget_customer(id)                     <span class=\"cm\"># get_customer(id)<\/span>\nfetchReservation(id)                 <span class=\"cm\"># get_reservation(id)<\/span>\nload_room_by_id(id)                  <span class=\"cm\"># get_room(id)<\/span><\/code><\/pre><\/div>\n<p><b>Consistent architectural patterns<\/b>: المشكلة نفسها على مستوى أعلى. إذا كان منطق العمل في services في خمسة modules، فلا يوضع في الـ views في السادس. من يفتح module جديدًا يجب أن يجد كل شيء حيث يتوقعه.<\/p>", "q": {"id": "m3l5c2", "type": "sc", "sc": "في مشروع: <code dir=\"ltr\">get_customer<\/code> و <code dir=\"ltr\">fetchBooking<\/code> و <code dir=\"ltr\">LoadRoom<\/code> و <code dir=\"ltr\">retrieve_invoice_data<\/code>.", "q": "<p>ما المشكلة؟<\/p>", "exp": "<p>أربع صيغ وأربعة أفعال للمعنى نفسه. القارئ لا يستطيع توقّع اسم الدالة التالية.<\/p>", "opts": ["لا مشكلة ما دام الكود يعمل", "يجب أن تكون كل الأسماء بالعربية", "الأسماء طويلة", "غياب اصطلاح تسمية موحّد، في الشكل وفي المفردات"], "ans": 3}}, {"t": "اتساق معالجة الأخطاء وتصميم الـ API", "html": "<p><b>Standardized error handling<\/b>: طريقة واحدة للتعبير عن الفشل. نظام فيه دالة تعيد <code dir=\"ltr\">None<\/code> عند الفشل، وأخرى تعيد <code dir=\"ltr\">False<\/code>، وثالثة ترفع استثناء، ورابعة تعيد <code dir=\"ltr\">{\"error\": ...}<\/code> يجبر كل مستعمِل على معرفة عادة كل دالة.<\/p>\n<p>الحل: هرم استثناءات خاص بالتطبيق، يُستعمل في كل مكان:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> AppError(Exception):\n    <span class=\"st\">\"\"\"Base class for all application errors.\"\"\"<\/span>\n\n<span class=\"kw\">class<\/span> NotFoundError(AppError): ...\n<span class=\"kw\">class<\/span> ValidationError(AppError): ...\n<span class=\"kw\">class<\/span> PermissionDeniedError(AppError): ...\n\n<span class=\"kw\">def<\/span> get_reservation(repo, reservation_id: int):\n    reservation = repo.find(reservation_id)\n    <span class=\"kw\">if<\/span> reservation <span class=\"kw\">is<\/span> <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">raise<\/span> NotFoundError(f<span class=\"st\">\"Reservation {reservation_id} not found\"<\/span>)\n    <span class=\"kw\">return<\/span> reservation<\/code><\/pre><\/div>\n<p>ثم يحوَّل كل نوع في <b>مكان واحد<\/b> إلى رمز HTTP: <code dir=\"ltr\">NotFoundError<\/code> إلى 404 و <code dir=\"ltr\">ValidationError<\/code> إلى 400.<\/p>\n<p><b>Consistent API design<\/b>: الاتساق في ما يراه مستهلكو الـ API:<\/p>\n<ul><li>شكل واحد للمسارات: <code dir=\"ltr\">/reservations/<\/code> و <code dir=\"ltr\">/customers/<\/code>، وليس <code dir=\"ltr\">/getAllReservations<\/code> بجانب <code dir=\"ltr\">/customer_list<\/code>.<\/li><li>شكل واحد للأخطاء: <code dir=\"ltr\">{\"error\": {\"code\": ..., \"message\": ...}}<\/code> في كل endpoint.<\/li><li>أسلوب واحد للـ pagination والتصفية والتواريخ.<\/li><\/ul>", "q": {"id": "m3l5c3", "type": "mc", "q": "<p>ما فائدة هرم استثناءات موحّد مثل <code dir=\"ltr\">AppError<\/code> وأبنائه؟<\/p>", "exp": "<p>الاتساق في الأخطاء يجعل كل دالة متوقعة السلوك، ويسمح بتحويل الأخطاء إلى responses في نقطة واحدة.<\/p>", "opts": ["جعل البرنامج لا يفشل أبدًا", "تسريع تنفيذ الكود", "الاستغناء عن الاختبارات", "التعبير عن الفشل بطريقة واحدة ومعالجته في مكان مركزي"], "ans": 3}}, {"t": "الإرشادات المشتركة والتوثيق المعماري", "html": "<p>الاتساق لا يحدث صدفة، خصوصًا مع فريق يتغيّر. يُحفظ بأربع وسائل:<\/p>\n<ol><li><b>Shared development guidelines<\/b>: وثيقة قصيرة (مثل <code dir=\"ltr\">CONTRIBUTING.md<\/code>) تجيب: أين يوضع منطق العمل؟ كيف نسمّي؟ كيف نعالج الأخطاء؟ كيف نكتب الاختبارات؟<\/li><li><b>Architectural documentation<\/b>: الـ ADRs التي تعلّمتها في الوحدة 1. تسجّل <b>لماذا<\/b> اختير النمط، فلا يكسره مطوّر جديد عن جهل.<\/li><li><b>الأتمتة<\/b>: كل ما يمكن فحصه آليًا لا يُترك للذاكرة. formatter مثل <code dir=\"ltr\">black<\/code>، و linter مثل <code dir=\"ltr\">ruff<\/code> أو <code dir=\"ltr\">flake8<\/code>، يفرضان الأسلوب تلقائيًا.<\/li><li><b>Code review<\/b>: المراجِع يسأل «هل يشبه هذا بقية النظام؟» وليس فقط «هل يعمل؟».<\/li><\/ol>\n<p>قاعدة عملية عند تعديل نظام قائم: <b>اتبع الأسلوب الموجود<\/b> حتى لو لم يعجبك. وإذا أردت أسلوبًا أفضل فغيّره في <b>كل<\/b> النظام بقرار موثّق، ولا تضف أسلوبًا رابعًا بجانب الثلاثة.<\/p>", "q": {"id": "m3l5c4", "type": "tf", "q": "<p>إذا وجدتَ في مشروع قائم أسلوبًا لا يعجبك، فالأفضل كتابة الجزء الجديد بأسلوبك الخاص المختلف.<\/p>", "exp": "<p>إضافة أسلوب جديد بجانب القديم تكسر التكامل المفاهيمي. إمّا أن تتبع الموج
