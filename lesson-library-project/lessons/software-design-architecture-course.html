\/span>, key: str, data: bytes) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">raise<\/span> NotImplementedError(<span class=\"st\">\"read only\"<\/span>)      <span class=\"cm\"># خرق: كود يتوقع Storage سينهار<\/span><\/code><\/pre><\/div>\n<p>علامات الخرق: method موروثة ترفع <code dir=\"ltr\">NotImplementedError<\/code>، أو كود يفحص النوع (<code dir=\"ltr\">isinstance<\/code>) قبل استعمال الـ object.<\/p>", "q": {"id": "m5l1c3", "type": "mc", "q": "<p>أي علامة تدل على خرق LSP؟<\/p>", "exp": "<p>رفض عملية وعد بها الأب يكسر كل كود يعتمد على ذلك الوعد.<\/p>", "opts": ["subclass لها اسم مختلف عن الأب", "subclass تستدعي <code dir=\"ltr\">super().__init__()<\/code>", "subclass تعيد تعريف method موروثة لترفع <code dir=\"ltr\">NotImplementedError<\/code>", "subclass تضيف method جديدة"], "ans": 2}}, {"t": "I: Interface Segregation Principle", "html": "<p><b>ISP<\/b>: لا يُجبَر مستعمِل على الاعتماد على methods لا يحتاجها. عدة interfaces <b>صغيرة مركّزة<\/b> أفضل من interface واحدة ضخمة.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># مخالف: interface «سمينة»<\/span>\n<span class=\"kw\">class<\/span> Machine(Protocol):\n    <span class=\"kw\">def<\/span> print(<span class=\"kw\">self<\/span>, doc): ...\n    <span class=\"kw\">def<\/span> scan(<span class=\"kw\">self<\/span>, doc): ...\n    <span class=\"kw\">def<\/span> fax(<span class=\"kw\">self<\/span>, doc): ...\n<span class=\"cm\"># طابعة بسيطة ستُجبَر على تنفيذ scan و fax برفع استثناءات (وهذا يخرق LSP أيضًا)<\/span>\n\n<span class=\"cm\"># موافق: interfaces صغيرة بحسب الدور<\/span>\n<span class=\"kw\">class<\/span> Printer(Protocol):\n    <span class=\"kw\">def<\/span> print(<span class=\"kw\">self<\/span>, doc): ...\n\n<span class=\"kw\">class<\/span> Scanner(Protocol):\n    <span class=\"kw\">def<\/span> scan(<span class=\"kw\">self<\/span>, doc): ...\n\n<span class=\"kw\">def<\/span> print_report(device: Printer, report): device.print(report)<\/code><\/pre><\/div>\n<p><code dir=\"ltr\">print_report<\/code> تعتمد على <code dir=\"ltr\">Printer<\/code> فقط، فلا تتأثر بأي تغيير في المسح أو الفاكس. والجهاز متعدد الوظائف يحقق الواجهتين معًا.<\/p>\n<p>في Python يتحقق هذا طبيعيًا مع الـ Protocol: عرّف الـ protocol <b>بحسب ما يحتاجه المستعمِل<\/b>، لا بحسب كل ما يستطيعه المنفِّذ.<\/p>", "q": {"id": "m5l1c4", "type": "mc", "q": "<p>ما الذي ينصح به ISP؟<\/p>", "exp": "<p>حتى لا يعتمد أحد على عمليات لا يحتاجها، ولا يُجبَر منفّذ على تنفيذ ما لا معنى له عنده.<\/p>", "opts": ["جعل كل الـ methods خاصة", "الاستغناء عن الـ interfaces", "interface واحدة تجمع كل العمليات الممكنة", "عدة interfaces صغيرة مركّزة بدل interface واحدة كبيرة"], "ans": 3}}, {"t": "D: Dependency Inversion Principle", "html": "<p><b>DIP<\/b>: الـ modules عالية المستوى لا تعتمد على modules منخفضة المستوى؛ كلاهما يعتمد على abstractions. والـ abstractions لا تعتمد على التفاصيل، بل التفاصيل تعتمد على الـ abstractions.<\/p>\n<p>درسناه في القسم 3.1 مع <code dir=\"ltr\">OrderService<\/code> و <code dir=\"ltr\">PaymentGateway<\/code>. الصورة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>قبل:   ReservationService ───────&gt; PostgresReservationTable\nبعد:   ReservationService ───────&gt; «interface» ReservationRepository\n                                              △\n                                              ┆\n                                   PostgresReservationRepository<\/code><\/pre><\/div>\n<p>منطق العمل (السياسة) هو أثمن ما في النظام وأبقاه، والتفاصيل (قاعدة بيانات، مزوّد بريد، framework) أكثر تقلّبًا. الـ DIP يجعل المتقلّب يعتمد على الثابت، لا العكس.<\/p>\n<p>كيف تجتمع الخمسة؟ SRP و ISP يقولان: اجعل الأشياء <b>صغيرة ومركّزة<\/b>. OCP و LSP و DIP يقولون: اربطها عبر <b>abstractions يوثق بها<\/b>.<\/p>", "q": {"id": "m5l1c5", "type": "sa", "q": "<p>في مبدأ DIP، على ماذا يجب أن يعتمد الـ module عالي المستوى والـ module منخفض المستوى كلاهما؟ (كلمة إنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Abstractions<\/b>. منطق العمل والتفاصيل يلتقيان عند واجهة مجرّدة.<\/p>", "kw": ["abstraction", "interface"]}}], "test": [{"id": "m5l1t1", "type": "mc", "q": "<p>طابق: «class له سبب واحد للتغيير».<\/p>", "exp": "<p>هذا تعريف SRP، وهو قريب من high cohesion.<\/p>", "opts": ["Interface Segregation Principle", "Open/Closed Principle", "Single Responsibility Principle", "Dependency Inversion Principle"], "ans": 2}, {"id": "m5l1t2", "type": "sc", "sc": "دالة <code dir=\"ltr\">export(report, fmt)<\/code> فيها <code dir=\"ltr\">if fmt == \"pdf\" ... elif fmt == \"csv\" ... elif fmt == \"xlsx\"<\/code>، وتُعدَّل مع كل صيغة جديدة.", "q": "<p>أي مبدأ يُخالَف، وما العلاج؟<\/p>", "exp": "<p>كل صيغة جديدة تفرض تعديل كود قائم. بالـ polymorphism تُضاف الصيغة كـ class جديد.<\/p>", "opts": ["لا مخالفة", "LSP؛ العلاج: حذف الدالة", "OCP؛ العلاج: interface مثل <code dir=\"ltr\">Exporter<\/code> وكل صيغة class ينفّذها", "ISP؛ العلاج: دمج كل الصيغ"], "ans": 2}, {"id": "m5l1t3", "type": "tf", "q": "<p>مبادئ SOLID يجب تطبيقها كلها بأقصى درجة في كل class مهما كان حجم المشروع.<\/p>", "exp": "<p>هي إرشادات تُوزَن بالسياق. الإفراط فيها over-engineering يعقّد مشروعًا صغيرًا بلا فائدة.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}]}, {"t": "Design Patterns و Dependency Injection", "intro": "<p>حلول مجرَّبة لمشاكل تصميم متكرّرة، وطريقة لإدارة الاعتمادات.<\/p>", "items": [{"t": "ما هي الـ Design Patterns؟", "html": "<p><b>Design pattern<\/b>: حل قابل لإعادة الاستعمال لمشكلة تصميم <b>متكرّرة<\/b> في سياق معيّن. ليس كودًا جاهزًا تنسخه، بل <b>قالب فكرة<\/b> تكيّفه مع حالتك.<\/p>\n<p>قيمتها:<\/p>\n<ul><li><b>حلول مجرَّبة<\/b>: لا تعيد اختراع العجلة.<\/li><li><b>مفردات مشتركة<\/b>: حين تقول «نستعمل Strategy هنا» يفهم الفريق التصميم كله بكلمة.<\/li><\/ul>\n<p>التصنيف الكلاسيكي (كتاب «Gang of Four»، وفيه 23 نمطًا) في ثلاث فئات:<\/p>\n<div class=\"tw\"><table><thead><tr><th>الفئة<\/th><th>تهتم بـ<\/th><th>أمثلة<\/th><\/tr><\/thead><tbody><tr><td><b>Creational<\/b><\/td><td>إنشاء الـ objects<\/td><td>Factory Method، Builder، Singleton<\/td><\/tr><tr><td><b>Structural<\/b><\/td><td>تركيب الـ classes والـ objects<\/td><td>Adapter، Facade، Decorator، Composite<\/td><\/tr><tr><td><b>Behavioral<\/b><\/td><td>توزيع المسؤوليات والتواصل<\/td><td>Strategy، Observer، State، Command<\/td><\/tr><\/tbody><\/table><\/div>\n<p>تحذيران:<\/p>\n<ul><li>لا تبحث عن مشكلة لتطبّق عليها نمطًا تعلّمته للتو. النمط دواء لمرض محدّد.<\/li><li>كثير من الأنماط يتبسّط في Python، لأن الدوال objects من الدرجة الأولى: Strategy قد تكون مجرد دالة تُمرَّر.<\/li><\/ul>", "q": {"id": "m5l2c1", "type": "mc", "q": "<p>ما الوصف الأدق للـ design pattern؟<\/p>", "exp": "<p>النمط فكرة تصميمية معروفة الاسم، وليس كودًا جاهزًا ولا إلزامًا.<\/p>", "opts": ["قاعدة إلزامية في كل مشروع", "نوع من قواعد البيانات", "مكتبة تُثبَّت بـ pip", "قالب حل مجرَّب لمشكلة تصميم متكرّرة يُكيَّف بحسب السياق"], "ans": 3}}, {"t": "مثال: Strategy", "html": "<p><b>Strategy<\/b>: عرّف عائلة خوارزميات، ضع كلًّا منها في object مستقل، واجعلها قابلة للتبديل، حتى تتغيّر الخوارزمية دون تغيير من يستعملها.<\/p>\n<p>المشكلة: سياسة تسعير الحجز تختلف (عادي، موسم ذروة، عميل دائم) وقد تتغيّر وقت التشغيل.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> typing <span class=\"kw\">import<\/span> Protocol\n\n<span class=\"kw\">class<\/span> PricingStrategy(Protocol):\n    <span class=\"kw\">def<\/span> price(<span class=\"kw\">self<\/span>, nights: int, base: float) -&gt; float: ...\n\n<span class=\"kw\">class<\/span> RegularPricing:\n    <span class=\"kw\">def<\/span> price(<span class=\"kw\">self<\/span>, nights: int, base: float) -&gt; float:\n        <span class=\"kw\">return<\/span> nights * base\n\n<span class=\"kw\">class<\/span> PeakSeasonPricing:\n    <span class=\"kw\">def<\/span> price(<span class=\"kw\">self<\/span>, nights: int, base: float) -&gt; float:\n        <span class=\"kw\">return<\/span> nights * base * <span class=\"nu\">1.3<\/span>\n\n<span class=\"kw\">class<\/span> Reservation:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, nights: int, base: float, pricing: PricingStrategy):\n        <span class=\"kw\">self<\/span>._nights, <span class=\"kw\">self<\/span>._base, <span class=\"kw\">self<\/span>._pricing = nights, base, pricing\n\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._pricing.price(<span class=\"kw\">self<\/span>._nights, <span class=\"kw\">self<\/span>._base)     <span class=\"cm\"># delegation<\/span>\n\nprint(Reservation(<span class=\"nu\">3<\/span>, <span class=\"nu\">100<\/span>, RegularPricing()).total())      <span class=\"cm\"># 300<\/span>\nprint(Reservation(<span class=\"nu\">3<\/span>, <span class=\"nu\">100<\/span>, PeakSeasonPricing()).total())   <span class=\"cm\"># 390.0<\/span><\/code><\/pre><\/div>\n<p>لاحظ أن Strategy هو مجموع ما تعلّمته: composition بدل الوراثة، و polymorphism، و OCP (سياسة جديدة تعني class جديدًا)، و DI.<\/p>", "q": {"id": "m5l2c2", "type": "mc", "q": "<p>حجز من 3 ليالٍ بسعر أساسي 100 مع <code dir=\"ltr\">PeakSeasonPricing<\/code>. ما الناتج؟<\/p>", "exp": "<p><span class=\"math\" dir=\"ltr\">3 × 100 × 1.3 = 390<\/span>.<\/p>", "opts": ["390", "300", "130", "430"], "ans": 0}}, {"t": "أمثلة أخرى: Observer و Factory و Adapter", "html": "<p><b>Observer<\/b>: object (الـ subject) يُبلِّغ قائمة مشتركين تلقائيًا عند وقوع حدث، دون أن يعرف من هم. يفصل «وقوع الحدث» عن «ردود الفعل عليه».<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Reservation:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._listeners = []\n\n    <span class=\"kw\">def<\/span> subscribe(<span class=\"kw\">self<\/span>, listener) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._listeners.append(listener)\n\n    <span class=\"kw\">def<\/span> confirm(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">for<\/span> listener <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._listeners:       <span class=\"cm\"># لا يعرف من هم ولا ماذا يفعلون<\/span>\n            listener(<span class=\"st\">\"confirmed\"<\/span>)\n\nseen = []\nr = Reservation()\nr.subscribe(seen.append)\nr.subscribe(<span class=\"kw\">lambda<\/span> event: print(<span class=\"st\">\"send email:\"<\/span>, event))\nr.confirm()<\/code><\/pre><\/div>\n<p>إضافة ردّ فعل جديد (رسالة SMS، تحديث إحصاءات) لا تمسّ <code dir=\"ltr\">Reservation<\/code>. إشارات Django (signals) تطبيق لهذا النمط.<\/p>\n<p><b>Factory<\/b>: يعزل قرار «أي class أنشئ؟» في مكان واحد، فلا يعرف المستعمِل الأنواع المحدّدة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> make_notifier(channel: str):\n    <span class=\"kw\">return<\/span> {<span class=\"st\">\"email\"<\/span>: EmailNotifier, <span class=\"st\">\"sms\"<\/span>: SmsNotifier}[channel]()<\/code><\/pre><\/div>\n<p><b>Adapter<\/b>: يغلّف class له واجهة غير مناسبة ليُظهر الواجهة التي يتوقعها نظامك. مثال: <code dir=\"ltr\">StripeAdapter<\/code> يحقق واجهتك <code dir=\"ltr\">PaymentGateway<\/code> ويترجم الاستدعاءات إلى مكتبة Stripe. هذا ما يطبّق الـ information hiding على المزوّدين الخارجيين.<\/p>", "q": {"id": "m5l2c3", "type": "sc", "sc": "عند تأكيد الحجز يجب: إرسال بريد، وتحديث لوحة الإحصاءات، وإخطار المحاسبة. وستُضاف ردود فعل أخرى لاحقًا.", "q": "<p>أي نمط يمنع تعديل <code dir=\"ltr\">Reservation.confirm<\/code> مع كل إضافة؟<\/p>", "exp": "<p>الحجز يعلن الحدث فقط، والمهتمون يشتركون. إضافة مشترك جديد لا تمسّ الحجز.<\/p>", "opts": ["Singleton", "Observer", "Builder", "Adapter"], "ans": 1}}, {"t": "Dependency Injection", "html": "<p><b>Dependency Injection (DI)<\/b> تساعد على إدارة الاعتمادات بين المكوّنات: الـ object يتلقّى ما يعتمد عليه من الخارج بدل أن ينشئه بنفسه (القسم 3.1).<\/p>\n<p>أشكالها:<\/p>\n<ul><li><b>Constructor injection<\/b> (الأشيع والأفضل): عبر <code dir=\"ltr\">__init__<\/code>. الاعتمادات واضحة، والـ object صالح فور إنشائه.<\/li><li><b>Method injection<\/b>: تمرير الاعتماد لـ method واحدة تحتاجه، مثل <code dir=\"ltr\">is_due(now)<\/code>.<\/li><\/ul>\n<p>كل الـ objects تُنشأ وتُربط في مكان واحد عند بدء التطبيق، يسمّى <b>composition root<\/b>:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> build_app() -&gt; ReservationService:\n    repo = SqliteReservationRepository(<span class=\"st\">\"agency.db\"<\/span>)\n    notifier = EmailNotifier(<span class=\"st\">\"smtp.example.com\"<\/span>)\n    <span class=\"kw\">return<\/span> ReservationService(repo, notifier)       <span class=\"cm\"># المكان الوحيد الذي يعرف الأنواع المحدّدة<\/span><\/code><\/pre><\/div>\n<p>الفوائد: loose coupling، واختبار سهل بتمرير بدائل وهمية، وتبديل التنفيذ من مكان واحد.<\/p>\n<p>مفاهيم قريبة لا تخلط بينها:<\/p>\n<ul><li><b>DIP<\/b>: المبدأ (اعتمد على abstractions).<\/li><li><b>DI<\/b>: التقنية (مرِّر الاعتمادات).<\/li><li><b>DI container<\/b>: مكتبة تؤتمت الربط. في Python الربط اليدوي كافٍ لمعظم المشاريع، و FastAPI مثلًا يوفّر <code dir=\"ltr\">Depends<\/code>.<\/li><\/ul>", "q": {"id": "m5l2c4", "type": "mc", "q": "<p>ما شكل الـ DI الأشيع والمفضّل؟<\/p>", "exp": "<p>الحقن عبر الـ constructor يجعل الاعتمادات معلنة، والـ object مكتملًا من لحظة إنشائه.<\/p>", "opts": ["الوراثة من الاعتماد", "إنشاء الاعتمادات داخل كل method", "متغيّرات global", "Constructor injection: تمرير الاعتمادات عبر <code dir=\"ltr\">__init__<\/code>"], "ans": 3}}], "test": [{"id": "m5l2t1", "type": "mc", "q": "<p>إلى أي فئة ينتمي Strategy؟<\/p>", "exp": "<p>يهتم بتوزيع السلوك (الخوارزمية) وتبديله.<\/p>", "opts": ["Structural", "لا ينتمي إلى أي فئة", "Behavioral", "Creational"], "ans": 2}, {"id": "m5l2t2", "type": "sc", "sc": "تستعمل مكتبة خارجية لإرسال SMS واجهتها <code dir=\"ltr\">push_message(number, text, sender_id, ttl)<\/code>، ونظامك يتوقع <code dir=\"ltr\">Notifier.send(to, message)<\/code>.", "q": "<p>أي نمط يناسب؟<\/p>", "exp": "<p>class وسيط يحقق <code dir=\"ltr\">Notifier<\/code> ويترجم الاستدعاء إلى واجهة المكتبة، فيبقى نظامك معزولًا عنها.<\/p>", "opts": ["Adapter", "State", "Singleton", "Observer"], "ans": 0}, {"id": "m5l2t3", "type": "tf", "q": "<p>كلما استعملت أنماط تصميم أكثر في المشروع كان التصميم أفضل.<\/p>", "exp": "<p>النمط علاج لمشكلة محدّدة. استعماله دون حاجة يضيف تعقيدًا بلا عائد.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}]}, {"t": "معماريات ومجالات أوسع", "intro": "<p>نظرة سريعة إلى المواضيع التي تبني على هذا المنهج، ثم كيف يُطبَّق كل ما تعلّمته على ميزة حقيقية.<\/p>", "items": [{"t": "Layered Architecture", "html": "<p><b>Layered architecture<\/b> تنظّم البرنامج في <b>طبقات<\/b>، لكل طبقة مسؤولية، مثل:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Presentation layer      (views, templates, API endpoints)\n        │\n        ▼\nBusiness logic layer    (services, domain entities)\n        │\n        ▼\nData access layer       (repositories, ORM, database)<\/code><\/pre><\/div>\n<p>القاعدة: كل طبقة تعتمد على التي <b>تحتها فقط<\/b>، ولا تعتمد طبقة سفلى على عليا. الـ presentation لا تتحدّث مع قاعدة البيانات مباشرة.<\/p>\n<p>هي الـ Separation of Concerns مطبّقًا على مستوى النظام. وربطها بالوحدة 1: الـ boundary objects في طبقة العرض، والـ control والـ entity objects في طبقة المنطق.<\/p>\n<p>المزايا: بسيطة ومألوفة، وتسمح بتبديل طبقة (واجهة ويب بتطبيق جوال).<\/p>\n<p>العيوب: منطق العمل يعتمد على طبقة البيانات (السهم يتجه نحو التفاصيل). وقد تتحوّل إلى طبقات تمرّر الاستدعاء فقط دون إضافة قيمة.<\/p>", "q": {"id": "m5l3c1", "type": "mc", "q": "<p>في الـ layered architecture التقليدية، أي اعتماد مخالف للقاعدة؟<\/p>", "exp": "<p>الاعتماد يتجه من الأعلى إلى الأسفل فقط. طبقة سفلى تعرف العليا تكسر الفصل.<\/p>", "opts": ["view تستدعي service", "طبقة business logic تستدعي data access", "طبقة data access تستورد من طبقة presentation", "طبقة presentation تستدعي business logic"], "ans": 2}}, {"t": "Clean Architecture", "html": "<p><b>Clean Architecture<\/b> تنظّم الاعتمادات لحماية منطق العمل من التقنيات الخارجية. تُرسم دوائر متداخلة:<\/p>\n<ul><li>في المركز: <b>Entities<\/b> (قواعد المجال).<\/li><li>حولها: <b>Use cases<\/b> (عمليات التطبيق).<\/li><li>في الخارج: <b>التفاصيل<\/b>: الويب، قاعدة البيانات، الـ frameworks، الخدمات الخارجية.<\/li><\/ul>\n<p><b>The Dependency Rule<\/b>: الاعتمادات في الكود تتجه <b>نحو الداخل فقط<\/b>. المركز لا يعرف شيئًا عن الخارج.<\/p>\n<p>كيف تحفظ الـ use case بياناتها دون أن تعرف قاعدة البيانات؟ بالـ DIP: الـ use case تعرّف interface (<code dir=\"ltr\">ReservationRepository<\/code>)، والطبقة الخارجية تنفّذها. فالفرق عن الـ layered التقليدية أن طبقة البيانات هي التي تعتمد على المنطق، لا العكس.<\/p>\n<p>النتائج: منطق العمل يُختبر دون قاعدة بيانات ولا ويب، وتبديل framework أو قاعدة بيانات يمسّ الحلقة الخارجية فقط.<\/p>\n<p>الثمن: classes وواجهات أكثر. مناسبة لأنظمة منطقها معقّد وطويلة العمر، ومبالغة لتطبيق CRUD صغير. أسماء قريبة: Hexagonal Architecture (Ports and Adapters) و Onion Architecture.<\/p>", "q": {"id": "m5l3c2", "type": "tf", "q": "<p>في Clean Architecture، كيانات المجال (entities) تستورد من مكتبة قاعدة البيانات لتحفظ نفسها.<\/p>", "exp": "<p>الـ Dependency Rule تمنع اعتماد المركز على الخارج. الحفظ يتم عبر interface يعرّفها الداخل وينفّذها الخارج.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "Domain-Driven Design (DDD)", "html": "<p><b>DDD<\/b> منهج لنمذجة مجالات العمل <b>المعقّدة<\/b>، يجعل الكود مرآة للمجال كما يفهمه خبراؤه.<\/p>\n<p>أهم أفكاره:<\/p>\n<ul><li><b>Ubiquitous language<\/b>: لغة واحدة يتكلّمها المطوّرون وخبراء المجال، وتظهر كما هي في أسماء الـ classes والـ methods. إذا قال موظف الوكالة «تأكيد الحجز» فالكود فيه <code dir=\"ltr\">reservation.confirm()<\/code> وليس <code dir=\"ltr\">update_status(2)<\/code>.<\/li><li><b>Bounded context<\/b>: حدّ يكون للمصطلح داخله معنى واحد. «Customer» عند المبيعات (عميل محتمل) غير «Customer» عند المحاسبة (حساب مدين). كل سياق له نموذجه. وهذا أفضل دليل لرسم حدود الـ decomposition.<\/li><li><b>Entity<\/b>: object له هوية ثابتة مهما تغيّرت بياناته (الحجز رقم 512).<\/li><li><b>Value object<\/b>: يُعرَّف بقيمته فقط وغير قابل للتغيير (مبلغ بعملة، مدى تواريخ).<\/li><li><b>Aggregate<\/b>: مجموعة objects تُعامل كوحدة لها جذر واحد يحرس قواعدها (الطلب وعناصره). هذا هو الـ composition مع الـ encapsulation على مستوى أكبر.<\/li><\/ul>\n<p>بطاقات CRC واستخراج المفاهيم من لغة المجال في الوحدة 1 هي أولى خطوات هذا المنهج.<\/p>", "q": {"id": "m5l3c3", "type": "mc", "q": "<p>ما المقصود بـ ubiquitous language في DDD؟<\/p>", "exp": "<p>توحيد المصطلحات يمنع سوء الفهم، ويجعل الكود مقروءًا لمن يعرف المجال.<\/p>", "opts": ["لغة موحّدة بين المطوّرين وخبراء المجال تظهر كما هي في الكود", "ترجمة الكود إلى عدة لغات بشرية", "استعمال الإنجليزية فقط في التعليقات", "لغة برمجة جديدة"], "ans": 0}}, {"t": "API Design", "html": "<p><b>API design<\/b> يحدّد كيف تتواصل مكوّنات البرمجيات المختلفة: frontend مع backend، أو خدمة مع خدمة، أو مكتبة مع مستعمليها.<\/p>\n<p>الـ API هو <b>الواجهة العامة<\/b> لنظامك، فكل مبادئ المنهج تنطبق عليه:<\/p>\n<ul><li><b>Abstraction<\/b>: يعرض «ماذا» يمكن فعله، لا كيف يُخزَّن.<\/li><li><b>Information hiding<\/b>: لا تسرّب بنية جداولك أو أسماء أعمدتك الداخلية.<\/li><li><b>Conceptual integrity<\/b>: تسمية وشكل أخطاء و pagination موحّدة.<\/li><li><b>Backward compatibility<\/b>: مستهلكون لا تتحكم فيهم، فكل تغيير كاسر مكلف.<\/li><\/ul>\n<p>في REST مثلًا:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>GET    /reservations/          قائمة الحجوزات\nPOST   /reservations/          إنشاء حجز            -&gt; 201 Created\nGET    /reservations/42/       حجز محدّد            -&gt; 200 أو 404\nPOST   /reservations/42/cancel/  تنفيذ عملية مجال   -&gt; 200 أو 409 عند انتقال غير مسموح<\/code><\/pre><\/div>\n<p>لاحظ <code dir=\"ltr\">cancel<\/code>: عملية مجال صريحة، بدل <code dir=\"ltr\">PATCH {\"status\": \"cancelled\"}<\/code> الذي يسمح للعميل بوضع أي حالة ويتجاوز آلة الحالات. هذا هو الـ encapsulation على مستوى الـ API.<\/p>", "q": {"id": "m5l3c4", "type": "sc", "sc": "API يعرض <code dir=\"ltr\">PATCH /reservations/42/<\/code> مع <code dir=\"ltr\">{\"status\": \"...\"}<\/code>، ويقبل أي قيمة للحالة.", "q": "<p>ما المشكلة التصميمية؟<\/p>", "exp": "<p>كشف الحالة للتعديل الحر يهدم الـ encapsulation، كما لو كتبنا <code dir=\"ltr\">reservation.status = \"x\"<\/code> من أي مكان.<\/p>", "opts": ["لا مشكلة، المرونة أفضل دائمًا", "يتجاوز قواعد انتقال الحالات؛ الأفضل عمليات صريحة مثل <code dir=\"ltr\">confirm<\/code> و <code dir=\"ltr\">cancel<\/code> يتحقق منها الخادم", "يجب استعمال GET بدل PATCH", "المشكلة في رقم الحجز"], "ans": 1}}, {"t": "Database Modeling", "html": "<p><b>Database modeling<\/b> يساعد على ترجمة كيانات المجال وعلاقاتها إلى بنى قاعدة بيانات: جداول وأعمدة ومفاتيح وقيود.<\/p>\n<p>الـ class diagram هو نقطة البداية، والـ multiplicity تحدّد شكل الجداول:<\/p>\n<div class=\"tw\"><table><thead><tr><th>في الـ class diagram<\/th><th>في قاعدة بيانات علائقية<\/th><\/tr><\/thead><tbody><tr><td>Class (entity)<\/td><td>جدول<\/td><\/tr><tr><td>Attribute<\/td><td>عمود<\/td><\/tr><tr><td><code dir=\"ltr\">1 ── *<\/code><\/td><td>foreign key في جدول طرف «الكثير»<\/td><\/tr><tr><td><code dir=\"ltr\">* ── *<\/code><\/td><td>جدول وسيط (join table)<\/td><\/tr><tr><td><code dir=\"ltr\">0..1<\/code><\/td><td>عمود foreign key يقبل NULL<\/td><\/tr><tr><td>Composition<\/td><td>foreign key مع <code dir=\"ltr\">ON DELETE CASCADE<\/code><\/td><\/tr><tr><td>Inheritance<\/td><td>جدول واحد بعمود نوع، أو جدول لكل class<\/td><\/tr><\/tbody><\/table><\/div>\n<p>في Django:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Reservation(models.Model):\n    customer = models.ForeignKey(Customer, on_delete=models.PROTECT)   <span class=\"cm\"># * ──&gt; 1<\/span>\n    room = models.ForeignKey(Room, on_delete=models.PROTECT)\n\n<span class=\"kw\">class<\/span> Payment(models.Model):\n    reservation = models.OneToOneField(Reservation, on_delete=models.CASCADE)   <span class=\"cm\"># composition<\/span><\/code><\/pre><\/div>\n<p>تنبيه: نموذج الـ objects ونموذج البيانات <b>متقاربان لا متطابقان<\/b>. الأول يُصمَّم حول السلوك، والثاني حول التخزين والاستعلام وسلامة البيانات. من المفاهيم الخاصة بالثاني: normalization و indexes و transactions.<\/p>", "q": {"id": "m5l3c5", "type": "mc", "q": "<p>كيف تُمثَّل علاقة <code dir=\"ltr\">Student * ── * Course<\/code> في قاعدة بيانات علائقية؟<\/p>", "exp": "<p>علاقة many-to-many تحتاج جدولًا ثالثًا، كل صف فيه يربط طالبًا بمادة.<\/p>", "opts": ["بجدول واحد يدمج الاثنين", "لا يمكن تمثيلها", "بجدول وسيط يحمل foreign key لكل من الطالب والمادة", "بعمود واحد في جدول الطالب"], "ans": 2}}, {"t": "System Design", "html": "<p><b>System design<\/b> يتناول معمارية وسلوك الأنظمة <b>الأكبر<\/b>، وفيها البنية التحتية والمكوّنات الموزّعة. هو المستوى الذي فوق تصميم الـ classes: كيف تُرتَّب <b>الخوادم والخدمات<\/b> لا الـ objects.<\/p>\n<p>مواضيعه:<\/p>\n<ul><li><b>Load balancing<\/b>: توزيع الطلبات على عدة خوادم.<\/li><li><b>Caching<\/b>: حفظ النتائج المتكرّرة لتسريع الرد.<\/li><li><b>Database replication و sharding<\/b>: نسخ وتقسيم البيانات.<\/li><li><b>Message queues<\/b>: تواصل غير متزامن بين الخدمات.<\/li><li><b>Monolith مقابل microservices<\/b>.<\/li><li><b>CAP theorem<\/b> والاتساق في الأنظمة الموزّعة.<\/li><\/ul>\n<p>كل ما تعلّمته يتكرّر هنا بمقياس أكبر: الخدمة مثل الـ class (لها واجهة ومسؤولية وحالة مخفية)، و low coupling و high cohesion يحكمان حدود الخدمات، والـ sequence diagram يرسم تواصل الخدمات، والـ trade-offs والـ quality attributes من الوحدة 1 هي لغة النقاش الأساسية.<\/p>\n<p>تذكير من الوحدة 1: هذه الأدوات حلول لمشاكل <b>حجم<\/b> حقيقية. معظم المشاريع تبدأ وتعيش طويلًا كـ modular monolith على خادم واحد.<\/p>", "q": {"id": "m5l3c6", "type": "tf", "q": "<p>مبدأ low coupling و high cohesion ينطبق على حدود الخدمات في system design كما ينطبق على الـ classes.<\/p>", "exp": "<p>المبدأ نفسه يتكرّر على كل مستوى: خدمة مركّزة المسؤولية، قليلة الاعتماد على غيرها.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "تطبيق المنهج كله على ميزة حقيقية", "html": "<p>تطبيق ويب مبني بـ Django و React و PostgreSQL. المطلوب: <b>ميزة تحليل مستندات بالذكاء الاصطناعي<\/b>. كيف تقاربها بما تعلّمت؟<\/p>\n<p><b>1. Requirements Analysis (الوحدة 1)<\/b>: ماذا يحتاج المستخدمون؟ أي مستندات تُرفع (النوع والحجم)؟ ماذا تعيد الميزة؟ و non-functional: زمن التحليل المقبول، وخصوصية المستندات.<\/p>\n<p><b>2. Conceptual Modeling (الوحدة 1)<\/b>: الـ objects: <code dir=\"ltr\">Document<\/code> و <code dir=\"ltr\">Analysis<\/code> و <code dir=\"ltr\">User<\/code> و <code dir=\"ltr\">AIService<\/code>. ومسؤولياتها ببطاقات CRC.<\/p>\n<p><b>3. Structural Design (الوحدة 2)<\/b>: الـ class diagram: <code dir=\"ltr\">User 1 ── * Document<\/code> و <code dir=\"ltr\">Document 1 ◆── * Analysis<\/code>. و <code dir=\"ltr\">AIService<\/code> هو interface حتى لا يرتبط النظام بمزوّد واحد.<\/p>\n<p><b>4. Behavioral Design (الوحدة 3)<\/b>: sequence diagram للرفع والتحليل (التحليل طويل، إذن رسالة asynchronous عبر queue). و state diagram لدورة حياة التحليل:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>[*] --&gt; Pending --start--&gt; Processing --success--&gt; Completed --&gt; [*]\nProcessing --failure [retries left]--&gt; Pending\nProcessing --failure [no retries left]--&gt; Failed --&gt; [*]<\/code><\/pre><\/div>\n<p><b>5. Implementation (الوحدة 4)<\/b>: تعديل التطبيق القائم: اختبارات للقائم، ثم إضافة الـ classes الجديدة، ثم الدمج، ثم التحقق من مطابقة التنفيذ للتصميم.<\/p>\n<p>هذا التسلسل هو الثمرة النهائية للمنهج: لم تعد «تكتب ملفات»، بل تفهم المشكلة، وتحدّد المكوّنات ومسؤولياتها، وتنمذج علاقاتها وسلوكها، ثم تترجم ذلك إلى كود قابل للصيانة.<\/p>", "q": {"id": "m5l3c7", "type": "mc", "q": "<p>في ميزة تحليل المستندات، لماذا نجعل <code dir=\"ltr\">AIService<\/code> interface بدل الاعتماد المباشر على مزوّد محدّد؟<\/p>", "exp": "<p>المزوّد الخارجي تفصيل مرشّح للتغيير. إخفاؤه خلف abstraction يحمي النظام من أثر تبديله.<\/p>", "opts": ["لتحقيق loose coupling: يمكن تبديل المزوّد أو استعمال بديل وهمي في الاختبارات دون تعديل بقية النظام", "لأن الـ interfaces أسرع في التنفيذ", "لتكثير عدد الملفات", "لأن Django يفرض ذلك"], "ans": 0}}], "test": [{"id": "m5l3t1", "type": "mc", "q": "<p>ما الفرق الجوهري بين Layered Architecture التقليدية و Clean Architecture؟<\/p>", "exp": "<p>اتجاه الاعتماد هو الفارق: Clean Architecture تقلبه بالـ DIP ليبقى المركز مستقلًّا عن التفاصيل.<\/p>", "opts": ["لا فرق بينهما", "في Clean Architecture تعتمد طبقة البيانات على منطق العمل عبر interfaces، لا العكس", "Clean Architecture بلا طبقات إطلاقًا", "الـ Layered تمنع استعمال قواعد البيانات"], "ans": 1}, {"id": "m5l3t2", "type": "sc", "sc": "مصطلح «Booking» يعني عند فريق المبيعات «طلب مبدئي»، وعند فريق العمليات «حجز مؤكَّد مدفوع». الفريقان يتشاجران على حقول class واحد اسمه <code dir=\"ltr\">Booking<\/code>.", "q": "<p>أي مفهوم من DDD يحلّ هذا؟<\/p>", "exp": "<p>المصطلح الواحد له معنيان في سياقين. فصل السياقين يعطي كلًّا نموذجه النظيف.<\/p>", "opts": ["Load balancing", "Singleton", "Name mangling", "Bounded context: نموذج لكل سياق بمعناه الخاص"], "ans": 3}, {"id": "m5l3t3", "type": "tf", "q": "<p>الـ class diagram لا علاقة له بتصميم جداول قاعدة البيانات.<\/p>", "exp": "<p>هو نقطة البداية: الـ entities تصير جداول، والـ multiplicity تحدّد المفاتيح والجداول الوسيطة.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m5l3t4", "type": "sa", "q": "<p>ما اسم القاعدة في Clean Architecture التي تقول إن اعتمادات الكود تتجه نحو الداخل فقط؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>The Dependency Rule<\/b>.<\/p>", "kw": ["dependency rule"]}]}]}], "home": "<h4>كيف تستخدم هذه الدورة؟<\/h4>\n<ol><li>ادرس الأقسام بالترتيب: كل قسم مبني على ما قبله.<\/li><li>كل قسم مقسّم إلى <b>مفاهيم صغيرة<\/b> قابلة للطي. اقرأ الشرح ثم أجب عن سؤال «اختبر فهمك» قبل الانتقال.<\/li><li>الإجابة والشرح لا يظهران إلا <b>بعد محاولتك<\/b>. تُحتسب نتيجتك من المحاولة الأولى، ويمكنك إعادة المحاولة للتعلّم.<\/li><li>في نهاية كل قسم اختبار أشمل، وفي نهاية كل وحدة ورشة عملية واختبار للوحدة.<\/li><li>أنهِ الدورة بالمشروع العملي ثم الامتحان النهائي، ثم افتح صفحة التقييم النهائي.<\/li><\/ol>\n<div class=\"note\">تقدّمك يُحفظ تلقائيًا في هذا المتصفح (localStorage) ويبقى بعد تحديث الصفحة. زر «إعادة ضبط التقدّم» في الأعلى يمسح كل شيء.<\/div>\n<h4>مراجعة الـ roadmap: ما الذي صحّحته وحسّنته ولماذا؟<\/h4>\n<p>أبقيت الأهداف التعليمية والوحدات الأربع وترتيبها كما هي، وأجريت التعديلات التالية:<\/p>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>الملاحظة على الـ roadmap الأصلي<\/th><th>التصحيح في هذه الدورة<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>كل الأمثلة والـ mapping بلغة Java، والوحدة 4 مبنية على تطبيق Java/Android<\/td><td>حُوِّل كل شيء إلى <b>Python<\/b> كما طلبت: القسم 2.6 صار «Mapping UML to Python»، وتطبيق الوحدة 4 صار تطبيق ملاحظات Python صغيرًا<\/td><\/tr><tr><td>2<\/td><td>يفترض وجود <code dir=\"ltr\">private<\/code> / <code dir=\"ltr\">public<\/code> حقيقية و <code dir=\"ltr\">interface<\/code> و <code dir=\"ltr\">implements<\/code><\/td><td>Python لا تفرض access modifiers ولا تملك كلمة <code dir=\"ltr\">interface<\/code>. أضفت شرح الاصطلاحات <code dir=\"ltr\">_name<\/code> و <code dir=\"ltr\">__name<\/code> (name mangling) و <code dir=\"ltr\">@property<\/code> و <code dir=\"ltr\">abc.ABC<\/code> و <code dir=\"ltr\">typing.Protocol<\/code> و duck typing<\/td><\/tr><tr><td>3<\/td><td>مصطلح <b>Model Checking<\/b> مستخدم بمعنى «مراجعة المخططات»<\/td><td>المعنى الدقيق هو تحقق آلي شامل من نموذج رسمي (مثل TLA+ و SPIN). شرحت المعنيين وفرّقت بينهما، وسمّيت ما نفعله يدويًا model review / consistency checking<\/td><\/tr><tr><td>4<\/td><td>في Multiplicity وردت <code dir=\"ltr\">*<\/code> و <code dir=\"ltr\">0..*<\/code> كعنصرين مختلفين<\/td><td>هما متطابقتان تمامًا. وُضّح ذلك، وأضفت مفهوم navigability<\/td><\/tr><tr><td>5<\/td><td><b>Realization<\/b> (تنفيذ interface) غائبة عن قائمة العلاقات مع أنها تظهر في جدول الـ mapping<\/td><td>أُضيفت كعلاقة مستقلة مع رمزها<\/td><\/tr><tr><td>6<\/td><td>مثال الـ Sequence Diagram ناقص: لا توجد return messages، والخطوة الأخيرة تقفز من <code dir=\"ltr\">Order API<\/code> إلى <code dir=\"ltr\">Frontend<\/code> دون رجوع النتيجة من <code dir=\"ltr\">OrderService<\/code><\/td><td>أُكمل التسلسل بكل رسائل الرجوع، وأضفت حالة نقص المخزون باستخدام <code dir=\"ltr\">alt<\/code><\/td><\/tr><tr><td>7<\/td><td>Trade-off «Consistency vs Availability» مذكور دون سياقه<\/td><td>هذا الـ trade-off يظهر فقط عند حدوث network partition في نظام موزّع (CAP theorem). أضفت السياق<\/td><\/tr><tr><td>8<\/td><td>Non-functional requirements بصياغات غير قابلة للقياس («acceptable time»)<\/td><td>أضفت قاعدة أن كل non-functional requirement يجب أن يكون <b>قابلًا للقياس والاختبار<\/b><\/td><\/tr><tr><td>9<\/td><td>الانتقال من User Stories إلى classes غير مشروح (كيف نجد الـ candidate classes؟)<\/td><td>أضفت تقنية تحليل الأسماء والأفعال (noun/verb analysis) وطريقة role-play لبطاقات CRC<\/td><\/tr><tr><td>10<\/td><td>Dependency Inversion مذكور عرضًا في Coupling، و Liskov Substitution غائب عن مشاكل الوراثة<\/td><td>شُرحا في موضعهما لأن فهم loose coupling والوراثة الصحيحة لا يكتمل بدونهما<\/td><\/tr><tr><td>11<\/td><td>الوحدة 4 تعدّل الكود دون ذكر شبكة أمان<\/td><td>أضفت كتابة characterization tests قبل التعديل، مع <code dir=\"ltr\">pytest<\/code>، وربطتها بـ regression testing<\/td><\/tr><tr><td>12<\/td><td>«Important concepts beyond the course» قائمة عناوين فقط<\/td><td>حُوّلت إلى <b>وحدة خامسة<\/b> مختصرة تشرح كل عنوان (SOLID، Design Patterns، DI، Layered، Clean Architecture، DDD، API Design، Database Modeling، System Design)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>كل عنوان وعنوان فرعي في الـ roadmap مغطّى بالترتيب نفسه. الـ Capstone Assignments (1.1 إلى 1.4) والـ Practical work لكل وحدة تحوّلت إلى ورش عملية داخل الدورة.<\/p>", "project": {"tasks": [{"id": "p1", "t": "المهمة 1: تحليل المتطلبات والمفاضلات", "html": "<p><b>الهدف<\/b>: تحويل وصف صاحب الوكالة إلى متطلبات منظّمة وقرار معماري مبرَّر.<\/p>\n<p><b>المطلوب<\/b>:<\/p>\n<ol><li>حدّد الـ stakeholders.<\/li><li>اكتب 6 User Stories على الأقل بالصيغة الكاملة، واكتب acceptance criteria لواحدة منها (تتضمن حالة سلبية).<\/li><li>اكتب 5 functional requirements و 3 non-functional requirements <b>قابلة للقياس<\/b>.<\/li><li>اكتب سؤالَي توضيح كنت ستطرحهما على صاحب الوكالة.<\/li><li>اكتب قرارًا معماريًا واحدًا بصيغة ADR مختصرة: monolith أم microservices؟ مع الـ trade-off.<\/li><\/ol>", "hints": ["الـ stakeholders ليسوا المستخدمين فقط: من يدفع؟ من يشغّل الخادم؟ من سيصون الكود؟", "ابحث في الوصف عن الأفعال: يسجّل، يحجز، يسجّل دفعة، يلغي، يرى. كل فعل مرشّح لـ story.", "للـ ADR استعمل القالب: Context، Decision، Rejected، Consequences. تذكّر: ثلاثة موظفين وخادم واحد."], "checks": ["حدّدتُ ثلاثة stakeholders على الأقل، بينهم من ليس مستخدمًا مباشرًا", "كل story عندي فيها الأجزاء الثلاثة: من، وماذا، ولماذا", "الـ acceptance criteria تتضمن حالة سلبية واحدة على الأقل", "كل non-functional requirement عندي فيه رقم أو شرط يمكن اختباره", "قراري المعماري مبرَّر بسياق المشروع ويذكر الثمن المقبول"], "sol": "<p><b>Stakeholders<\/b>: صاحب الوكالة (المدير)، موظفو الحجز، العملاء (يتأثرون ولا يستعملون النظام مباشرة)، المطوّر الذي سيصون النظام، من يدير الخادم.<\/p>\n<p><b>User Stories<\/b>:<\/p>\n<ul><li>As an employee, I want to register a customer so that I can book trips for them.<\/li><li>As an employee, I want to book seats on a trip for a customer so that the seats are held for them.<\/li><li>As an employee, I want to record a payment for a booking so that the remaining balance is always known.<\/li><li>As an employee, I want to cancel a booking before departure so that its seats return to the trip.<\/li><li>As a customer, I want to be notified when my booking is confirmed so that I know my place is guaranteed.<\/li><li>As a manager, I want to see the bookings of each trip by status so that I can follow sales and occupancy.<\/li><\/ul>\n<p><b>Acceptance criteria<\/b> لـ «book seats»:<\/p>\n<ol><li>Given رحلة فيها 4 مقاعد متاحة، When يحجز الموظف 3، Then يُنشأ حجز بحالة Pending ويبقى مقعد واحد.<\/li><li>Given رحلة فيها مقعدان متاحان، When يحجز الموظف 3، Then يُرفض الحجز ولا يتغيّر عدد المقاعد.<\/li><li>عدد المقاعد المطلوب يجب أن يكون 1 على الأقل.<\/li><\/ol>\n<p><b>Functional<\/b>: تسجيل عميل؛ حجز مقاعد مع منع تجاوز السعة؛ تسجيل دفعات وتأكيد الحجز آليًا عند اكتمال المبلغ؛ إلغاء الحجز قبل الانطلاق وإرجاع المقاعد؛ عرض حجوزات رحلة بحسب الحالة.<\/p>\n<p><b>Non-functional<\/b>:<\/p>\n<ul><li>95% من عمليات الحجز والبحث تستجيب خلال ثانية واحدة مع 5 مستخدمين متزامنين.<\/li><li>لا يصل إلى بيانات العملاء إلا موظف مسجّل الدخول، وكل تعديل على حجز يُسجَّل معه اسم الموظف والوقت.<\/li><li>لا يمكن في أي حال أن يتجاوز مجموع المقاعد المحجوزة سعة الرحلة (حتى مع طلبين متزامنين).<\/li><\/ul>\n<p><b>أسئلة توضيح<\/b>: هل يُستردّ المبلغ عند الإلغاء، كله أم بعضه؟ ماذا يحدث لحجز لم يكتمل دفعه حتى موعد الانطلاق؟<\/p>\n<p><b>ADR-001: تطبيق واحد (modular monolith)<\/b><\/p>\n<ul><li>Context: ثلاثة موظفين، خادم واحد صغير، مطوّر واحد.<\/li><li>Decision: تطبيق واحد مقسّم داخليًا إلى modules: customers و trips و bookings و notifications.<\/li><li>Rejected: microservices (تعقيد تشغيلي لا يبرّره الحجم: over-engineering).<\/li><li>Consequences: نشر وصيانة بسيطان. نقبل أن التوسّع الأفقي لجزء منفرد أصعب، مع إبقاء الحدود نظيفة ليمكن الفصل لاحقًا.<\/li><\/ul>"}, {"id": "p2", "t": "المهمة 2: النمذجة المفاهيمية وبطاقات CRC", "html": "<p><b>الهدف<\/b>: استخراج الـ objects وتوزيع المسؤوليات قبل أي تفصيل تقني.<\/p>\n<p><b>المطلوب<\/b>:<\/p>\n<ol><li>استخرج الـ candidate objects من الوصف بـ noun/verb analysis، واذكر ما استبعدته ولماذا.<\/li><li>صنّفها: Entity أو Boundary أو Control.<\/li><li>اكتب بطاقة CRC لكل class مهم (5 على الأقل).<\/li><li>نفّذ role-play مكتوبًا لسيناريو «تسجيل دفعة تُكمل المبلغ»، واذكر ما كشفه.<\/li><\/ol>", "hints": ["أسماء في الوصف: رحلة، وجهة، سعر، مقاعد، عميل، موظف، دفعة، حجز، رسالة. أيّها له سلوك وهوية، وأيّها مجرد قيمة؟", "من يعرف عدد المقاعد المتاحة؟ من يعرف المبلغ المتبقي؟ ضع المسؤولية عند صاحب المعلومة (Information Expert).", "في الـ role-play: من يستقبل الطلب؟ من يجد الحجز؟ من يقرّر أن المبلغ اكتمل؟ من يُعلِم العميل؟"], "checks": ["استبعدتُ بعض الأسماء وبرّرتُ ذلك (مثل: الوجهة والسعر attributes وليست classes)", "صنّفتُ الـ objects إلى Entity و Boundary و Control تصنيفًا صحيحًا", "المسؤوليات مكتوبة بصيغة «ماذا» وليست خوارزميات", "«حساب المتبقي» عند الحجز، و«معرفة المقاعد المتاحة» عند الرحلة", "لا يوجد عندي class واحد يجمع الحجز والدفع والإشعار والتقارير"], "sol": "<p><b>المرشّحون<\/b>: Trip، Customer، Booking، Payment، Employee، Notification.<\/p>\n<p><b>المستبعَد<\/b>: الوجهة والتاريخ والسعر وعدد المقاعد (attributes في Trip). «الخادم» (خارج المجال). Employee نؤجّله: يلزمنا فقط كاسم في سجل التعديلات الآن (YAGNI).<\/p>\n<p><b>التصنيف<\/b>: Entity: Trip و Customer و Booking و Payment. Control: BookingService و ReportService. Boundary: BookingForm أو API endpoint، و Notifier (حدّ مع خدمة الرسائل الخارجية).<\/p>\n<div class=\"tw\"><table><thead><tr><th>Class<\/th><th>Responsibilities<\/th><th>Collaborators<\/th><\/tr><\/thead><tbody><tr><td>Customer<\/td><td>Know name and phone<\/td><td>(لا أحد)<\/td><\/tr><tr><td>Trip<\/td><td>Know destination, departure, price, capacity; know seats left; reserve and release seats<\/td><td>(لا أحد)<\/td><\/tr><tr><td>Booking<\/td><td>Know customer, trip, seats, status; calculate total, paid, balance; accept payments; confirm, cancel, complete itself<\/td><td>Customer, Trip, Payment<\/td><\/tr><tr><td>Payment<\/td><td>Know amount and date<\/td><td>(لا أحد)<\/td><\/tr><tr><td>BookingService<\/td><td>Coordinate create booking, record payment, cancel; trigger notification<\/td><td>Booking, Trip, Customer, BookingRepository, Notifier<\/td><\/tr><tr><td>Notifier<\/td><td>Deliver a message to a customer<\/td><td>(خدمة خارجية)<\/td><\/tr><tr><td>ReportService<\/td><td>List bookings of a trip by status<\/td><td>BookingRepository, Booking<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Role-play: دفعة تُكمل المبلغ<\/b><\/p>\n<ol><li>الموظف يسلّم الطلب إلى BookingService.<\/li><li>BookingService يطلب الحجز من BookingRepository.<\/li><li>BookingService يطلب من Booking تسجيل الدفعة.<\/li><li>Booking ينشئ Payment، ويحسب المتبقي، ويجده صفرًا، فيؤكّد <b>نفسه<\/b>.<\/li><li>BookingService يرى أن الحالة صارت Confirmed فيطلب من Notifier إعلام العميل.<\/li><\/ol>\n<p><b>ما كشفه التمثيل<\/b>: نحتاج BookingRepository (من يجد الحجز؟) ولم يكن في القائمة الأولى. وقرار التأكيد عند Booking لا عند الخدمة، لأنه صاحب معلومة المبلغ. والخدمة تنسّق فقط.<\/p>"}, {"id": "p3", "t": "المهمة 3: الـ Class Diagram", "html": "<p><b>الهدف<\/b>: تحويل البطاقات إلى بنية دقيقة.<\/p>\n<p><b>المطلوب<\/b> (نصيًا):<\/p>\n<ol><li>لكل class: الـ attributes مع visibility والنوع، والـ operations مع التوقيع.<\/li><li>كل العلاقات بنوعها (association أو aggregation أو composition أو generalization أو realization أو dependency) والـ multiplicity والـ navigability.<\/li><li>برّر في سطر: لماذا composition أو association في علاقتين على الأقل؟<\/li><li>أين وضعتَ abstraction، ولماذا؟<\/li><\/ol>", "hints": ["Booking يعرف Customer واحدًا و Trip واحدة. هل يحتاج Trip أن يعرف حجوزاته؟", "Payment: هل يعيش دون حجزه؟ هل يُشارك بين حجزين؟", "الإشعار «SMS الآن وربما بريد لاحقًا»: هذه إشارة صريحة إلى interface."], "checks": ["كل الـ attributes عندي private أو protected، والحالة تُقرأ فقط من الخارج", "العلاقة Booking إلى Payment هي composition مع multiplicity صحيحة", "العلاقتان Booking إلى Customer و Booking إلى Trip هما association مع multiplicity تساوي 1 عند Customer و Trip", "Notifier عندي interface تنفّذها SmsNotifier بعلاقة realization", "BookingService يعتمد على abstractions (repository و notifier) وليس على تنفيذ محدّد"], "sol": "<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Customer        - name: str, - phone: str\nTrip            - destination: str, - departure: date, - price_per_seat: float\n                - capacity: int, - reserved: int\n                + seats_left: int {read-only}\n                + reserve_seats(count: int): None, + release_seats(count: int): None\nPayment         - amount: float, - paid_on: date\nBooking         - seats: int, - status: BookingStatus\n                + total_price(): float, + amount_paid(): float, + balance_due(): float\n                + add_payment(amount: float, paid_on: date): None\n                + cancel(): None, + complete(): None\n«enumeration» BookingStatus   PENDING, CONFIRMED, COMPLETED, CANCELLED\n«interface» Notifier            + send(to: str, message: str): None\n«interface» BookingRepository   + add(booking): int, + get(booking_id: int): Booking\nBookingService  + create_booking(customer, trip, seats): int\n                + record_payment(booking_id, amount, paid_on): BookingStatus\n                + cancel_booking(booking_id): None<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Booking 0..* ────────&gt; 1 Customer          association\nBooking 0..* ────────&gt; 1 Trip              association\nBooking 1 ◆────────── 0..* Payment         composition\nBookingService ──────&gt; 1 BookingRepository association (injected)\nBookingService ──────&gt; 1 Notifier          association (injected)\nBookingService - - - &gt; Booking, Trip, Customer   dependency\nSmsNotifier - - - -▷ Notifier              realization\nInMemoryBookingRepository - - - -▷ BookingRepository   realization<\/code><\/pre><\/div>\n<p><b>التبرير<\/b>:<\/p>\n<ul><li><code dir=\"ltr\">Booking ◆── Payment<\/code>: الدفعة تُنشأ داخل الحجز، ولا تُشارك، ولا معنى لها دونه.<\/li><li><code dir=\"ltr\">Booking ──&gt; Customer<\/code> و <code dir=\"ltr\">Booking ──&gt; Trip<\/code>: العميل والرحلة يعيشان مستقلّين ويشترك فيهما حجوزات كثيرة.<\/li><li>الـ navigability من Booking فقط: Trip لا يحتفظ بقائمة حجوزاته، ويكفيه عدّاد <code dir=\"ltr\">reserved<\/code>. هكذا نتجنّب علاقة باتجاهين.<\/li><li>الـ abstraction في <code dir=\"ltr\">Notifier<\/code> (المزوّد سيتغيّر) و <code dir=\"ltr\">BookingRepository<\/code> (التخزين تفصيل)، وكلاهما يحقق loose coupling.<\/li><li>لا وراثة: لا توجد علاقة is-a في المجال حتى الآن، فلا نختلقها.<\/li><\/ul>"}, {"id": "p4", "t": "المهمة 4: تنفيذ الـ Entities بـ Python", "html": "<p><b>الهدف<\/b>: ترجمة المخطط إلى كود يحمي نفسه.<\/p>\n<p><b>المطلوب<\/b>: اكتب <code dir=\"ltr\">Customer<\/code> و <code dir=\"ltr\">Trip<\/code> و <code dir=\"ltr\">Payment<\/code> و <code dir=\"ltr\">Booking<\/code> (دون الحالات، فهي في المهمة التالية):<\/p>\n<ul><li>attributes داخلية، مع properties للقراءة حيث يلزم.<\/li><li><code dir=\"ltr\">Trip<\/code> يمنع حجز أكثر من المقاعد المتاحة.<\/li><li><code dir=\"ltr\">Booking<\/code> يحجز المقاعد عند إنشائه، ويحسب <code dir=\"ltr\">total_price<\/code> و <code dir=\"ltr\">amount_paid<\/code> و <code dir=\"ltr\">balance_due<\/code>، ويرفض دفعة تتجاوز المتبقي.<\/li><li>اكتب 4 assertions على الأقل تثبت أن الـ invariants محميّة.<\/li><\/ul>", "hints": ["ابدأ بـ Trip: الـ invariant هو أن reserved بين صفر و capacity. من يملك حق تغيير reserved؟", "Booking لا يكتب في حقول Trip مباشرة، بل يستدعي trip.reserve_seats(seats). تذكّر Tell, Don't Ask.", "الطرف 1 في العلاقة يصير parameter إجباريًا في الـ constructor، والـ composition تعني أن Booking ينشئ الـ Payment بنفسه."], "checks": ["لا يوجد في كودي أي attribute عام يمكن عبره كسر قاعدة عمل", "التحقق من المدخلات يبدأ في الـ constructor (لا يُنشأ object غير صالح)", "Booking يطلب من Trip حجز المقاعد ولا يعدّل عدّادها مباشرة", "Payment يُنشأ داخل Booking (composition) ولا يُمرَّر من الخارج", "كتبتُ assertions أو اختبارات تتحقق من حالة سلبية واحدة على الأقل"], "sol": "<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> datetime <span class=\"kw\">import<\/span> date\n\n<span class=\"kw\">class<\/span> Customer:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str, phone: str):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> name.strip():\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Customer name is required\"<\/span>)\n        <span class=\"kw\">self<\/span>._name = name\n        <span class=\"kw\">self<\/span>._phone = phone\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> name(<span class=\"kw\">self<\/span>) -&gt; str:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._name\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> phone(<span class=\"kw\">self<\/span>) -&gt; str:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._phone\n\n\n<span class=\"kw\">class<\/span> Trip:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, destination: str, departure: date, price_per_seat: float, capacity: int):\n        <span class=\"kw\">if<\/span> price_per_seat &lt;= <span class=\"nu\">0<\/span> <span class=\"kw\">or<\/span> capacity &lt;= <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Price and capacity must be positive\"<\/span>)\n        <span class=\"kw\">self<\/span>._destination = destination\n        <span class=\"kw\">self<\/span>._departure = departure\n        <span class=\"kw\">self<\/span>._price_per_seat = price_per_seat\n        <span class=\"kw\">self<\/span>._capacity = capacity\n        <span class=\"kw\">self<\/span>._reserved = <span class=\"nu\">0<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> destination(<span class=\"kw\">self<\/span>) -&gt; str:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._destination\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> departure(<span class=\"kw\">self<\/span>) -&gt; date:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._departure\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> price_per_seat(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._price_per_seat\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> seats_left(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._capacity - <span class=\"kw\">self<\/span>._reserved\n\n    <span class=\"kw\">def<\/span> reserve_seats(<span class=\"kw\">self<\/span>, count: int) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">if<\/span> count &lt;= <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Seat count must be positive\"<\/span>)\n        <span class=\"kw\">if<\/span> count &gt; <span class=\"kw\">self<\/span>.seats_left:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Not enough seats left\"<\/span>)\n        <span class=\"kw\">self<\/span>._reserved += count\n\n    <span class=\"kw\">def<\/span> release_seats(<span class=\"kw\">self<\/span>, count: int) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">if<\/span> count &lt;= <span class=\"nu\">0<\/span> <span class=\"kw\">or<\/span> count &gt; <span class=\"kw\">self<\/span>._reserved:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Invalid seat count\"<\/span>)\n        <span class=\"kw\">self<\/span>._reserved -= count\n\n\n<span class=\"kw\">class<\/span> Payment:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, amount: float, paid_on: date):\n        <span class=\"kw\">if<\/span> amount &lt;= <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Payment must be positive\"<\/span>)\n        <span class=\"kw\">self<\/span>.amount = amount\n        <span class=\"kw\">self<\/span>.paid_on = paid_on\n\n\n<span class=\"kw\">class<\/span> Booking:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, customer: Customer, trip: Trip, seats: int):\n        trip.reserve_seats(seats)                <span class=\"cm\"># Trip تحرس مقاعدها بنفسها<\/span>\n        <span class=\"kw\">self<\/span>._customer = customer                <span class=\"cm\"># 1<\/span>\n        <span class=\"kw\">self<\/span>._trip = trip                        <span class=\"cm\"># 1<\/span>\n        <span class=\"kw\">self<\/span>._seats = seats\n        <span class=\"kw\">self<\/span>._payments: list[Payment] = []       <span class=\"cm\"># 0..*  composition<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> customer(<span class=\"kw\">self<\/span>) -&gt; Customer:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._customer\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> trip(<span class=\"kw\">self<\/span>) -&gt; Trip:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._trip\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> seats(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._seats\n\n    <span class=\"kw\">def<\/span> total_price(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._seats * <span class=\"kw\">self<\/span>._trip.price_per_seat\n\n    <span class=\"kw\">def<\/span> amount_paid(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> sum(p.amount <span class=\"kw\">for<\/span> p <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._payments)\n\n    <span class=\"kw\">def<\/span> balance_due(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>.total_price() - <span class=\"kw\">self<\/span>.amount_paid()\n\n    <span class=\"kw\">def<\/span> add_payment(<span class=\"kw\">self<\/span>, amount: float, paid_on: date) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">if<\/span> amount &gt; <span class=\"kw\">self<\/span>.balance_due():\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Payment exceeds balance due\"<\/span>)\n        <span class=\"kw\">self<\/span>._payments.append(Payment(amount, paid_on))   <span class=\"cm\"># Booking ينشئ أجزاءه<\/span><\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>trip = Trip(<span class=\"st\">\"Istanbul\"<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">5<\/span>, <span class=\"nu\">1<\/span>), <span class=\"nu\">500.0<\/span>, <span class=\"nu\">3<\/span>)\nbooking = Booking(Customer(<span class=\"st\">\"Sara\"<\/span>, <span class=\"st\">\"0550\"<\/span>), trip, <span class=\"nu\">2<\/span>)\n<span class=\"kw\">assert<\/span> trip.seats_left == <span class=\"nu\">1<\/span>\n<span class=\"kw\">assert<\/span> booking.total_price() == <span class=\"nu\">1000.0<\/span>\nbooking.add_payment(<span class=\"nu\">400.0<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">1<\/span>, <span class=\"nu\">5<\/span>))\n<span class=\"kw\">assert<\/span> booking.balance_due() == <span class=\"nu\">600.0<\/span>\n\n<span class=\"kw\">for<\/span> bad_action <span class=\"kw\">in<\/span> (<span class=\"kw\">lambda<\/span>: Booking(Customer(<span class=\"st\">\"Omar\"<\/span>, <span class=\"st\">\"0660\"<\/span>), trip, <span class=\"nu\">2<\/span>),     <span class=\"cm\"># مقاعد غير كافية<\/span>\n                   <span class=\"kw\">lambda<\/span>: booking.add_payment(<span class=\"nu\">700.0<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">1<\/span>, <span class=\"nu\">6<\/span>)),   <span class=\"cm\"># دفعة أكبر من المتبقي<\/span>\n                   <span class=\"kw\">lambda<\/span>: Customer(<span class=\"st\">\"  \"<\/span>, <span class=\"st\">\"0\"<\/span>)):                           <span class=\"cm\"># اسم فارغ<\/span>\n    <span class=\"kw\">try<\/span>:\n        bad_action()\n        <span class=\"kw\">raise<\/span> AssertionError(<span class=\"st\">\"should have been rejected\"<\/span>)\n    <span class=\"kw\">except<\/span> ValueError:\n        <span class=\"kw\">pass<\/span>\n<span class=\"kw\">assert<\/span> trip.seats_left == <span class=\"nu\">1<\/span>          <span class=\"cm\"># الحجز المرفوض لم يغيّر شيئًا<\/span><\/code><\/pre><\/div>\n<p>المعادلات التي ينفّذها الكود: <span class=\"math\" dir=\"ltr\"><span class=\"tx\">total<\/span> = <span class=\"tx\">seats<\/span> × <span class=\"tx\">price<\/span><\/span> و <span class=\"math\" dir=\"ltr\"><span class=\"tx\">balance<\/span> = <span class=\"tx\">total<\/span> − ∑<sub><i>i<\/i> = 1<\/sub><sup><i>n<\/i><\/sup><i>a<\/i><sub><i>i<\/i><\/sub><\/span> حيث <span class=\"math\" dir=\"ltr\"><i>a<\/i><sub><i>i<\/i><\/sub><\/span> مبلغ الدفعة رقم <span class=\"math\" dir=\"ltr\"><i>i<\/i><\/span>.<\/p>\n<div class=\"note\">في نظام حقيقي تُمثَّل المبالغ المالية بـ <code dir=\"ltr\">decimal.Decimal<\/code> وليس <code dir=\"ltr\">float<\/code>، لتجنّب أخطاء التقريب.<\/div>"}, {"id": "p5", "t": "المهمة 5: دورة حياة الحجز (State Diagram ثم كود)", "html": "<p><b>الهدف<\/b>: نمذجة السلوك المعتمد على الحالة وتنفيذه دون ثغرات.<\/p>\n<p><b>المطلوب<\/b>:<\/p>\n<ol><li>اكتب الـ state diagram للحجز نصيًا: الحالات، البداية، وكل transition بالصيغة <code dir=\"ltr\">State --event [guard] / action--&gt; State<\/code>.<\/li><li>املأ جدول الحالات × الأحداث، وعُدّ الخانات الممنوعة.<\/li><li>نفّذه في <code dir=\"ltr\">Booking<\/code> بـ <code dir=\"ltr\">Enum<\/code> وجدول انتقالات: التأكيد يحدث <b>آليًا<\/b> عند اكتمال المبلغ، والإلغاء يعيد المقاعد، والعمليات الممنوعة ترفع استثناء.<\/li><li>اكتب اختبارًا لانتقالين مسموحين ولثلاثة ممنوعة.<\/li><\/ol>", "hints": ["الحالات من وصف صاحب الوكالة: معلّق (لم يكتمل الدفع)، مؤكَّد، مكتمل، ملغى. والأحداث: اكتمال الدفع، إلغاء، إكمال.", "الـ guard في التأكيد: المتبقي يساوي صفرًا. والـ action في الإلغاء: إعادة المقاعد إلى الرحلة.", "لا تنسَ: هل تُقبل دفعة على حجز ملغى أو مكتمل؟ هذه خانة في الجدول يجب أن يرفضها الكود."], "checks": ["مخططي فيه حالة ابتدائية واحدة، وكل حالة يمكن الوصول إليها", "كتبتُ الـ guard على انتقال التأكيد والـ action على انتقال الإلغاء", "الحالة عندي Enum واحد وليست عدة booleans", "العمليات الممنوعة ترفع استثناء ولا تفشل بصمت", "الإلغاء يعيد المقاعد إلى الرحلة، وتسجيل دفعة على حجز غير معلّق مرفوض", "اختبرتُ انتقالات ممنوعة وليس المسموحة فقط"], "sol": "<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>[*] --&gt; Pending\nPending   --payment [balance_due == 0]--&gt; Confirmed\nPending   --payment [balance_due &gt; 0]--&gt; Pending\nPending   --cancel / release seats--&gt; Cancelled\nConfirmed --cancel / release seats--&gt; Cancelled\nConfirmed --complete--&gt; Completed\nCompleted --&gt; [*]\nCancelled --&gt; [*]<\/code><\/pre><\/div>\n<div class=\"tw\"><table><thead><tr><th>State<\/th><th>payment<\/th><th>cancel<\/th><th>complete<\/th><\/tr><\/thead><tbody><tr><td>Pending<\/td><td>Pending أو Confirmed<\/td><td>Cancelled<\/td><td>ممنوع<\/td><\/tr><tr><td>Confirmed<\/td><td>ممنوع<\/td><td>Cancelled<\/td><td>Completed<\/td><\/tr><tr><td>Completed<\/td><td>ممنوع<\/td><td>ممنوع<\/td><td>ممنوع<\/td><\/tr><tr><td>Cancelled<\/td><td>ممنوع<\/td><td>ممنوع<\/td><td>ممنوع<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"math\" dir=\"ltr\">4 × 3 = 12<\/span> خانة، منها 8 ممنوعة.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> enum <span class=\"kw\">import<\/span> Enum\n\n<span class=\"kw\">class<\/span> BookingStatus(Enum):\n    PENDING = <span class=\"st\">\"pending\"<\/span>\n    CONFIRMED = <span class=\"st\">\"confirmed\"<\/span>\n    COMPLETED = <span class=\"st\">\"completed\"<\/span>\n    CANCELLED = <span class=\"st\">\"cancelled\"<\/span>\n\n<span class=\"kw\">class<\/span> InvalidTransition(Exception):\n    <span class=\"kw\">pass<\/span>\n\n<span class=\"kw\">class<\/span> Booking:\n    _TRANSITIONS = {\n        (BookingStatus.PENDING, <span class=\"st\">\"fully_paid\"<\/span>): BookingStatus.CONFIRMED,\n        (BookingStatus.PENDING, <span class=\"st\">\"cancel\"<\/span>): BookingStatus.CANCELLED,\n        (BookingStatus.CONFIRMED, <span class=\"st\">\"cancel\"<\/span>): BookingStatus.CANCELLED,\n        (BookingStatus.CONFIRMED, <span class=\"st\">\"complete\"<\/span>): BookingStatus.COMPLETED,\n    }\n\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, customer: Customer, trip: Trip, seats: int):\n        trip.reserve_seats(seats)\n        <span class=\"kw\">self<\/span>._customer = customer\n        <span class=\"kw\">self<\/span>._trip = trip\n        <span class=\"kw\">self<\/span>._seats = seats\n        <span class=\"kw\">self<\/span>._payments: list[Payment] = []\n        <span class=\"kw\">self<\/span>._status = BookingStatus.PENDING          <span class=\"cm\"># initial state<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> customer(<span class=\"kw\">self<\/span>) -&gt; Customer:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._customer\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> trip(<span class=\"kw\">self<\/span>) -&gt; Trip:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._trip\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> status(<span class=\"kw\">self<\/span>) -&gt; BookingStatus:               <span class=\"cm\"># read-only<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._status\n\n    <span class=\"kw\">def<\/span> _fire(<span class=\"kw\">self<\/span>, event: str) -&gt; <span class=\"kw\">None<\/span>:\n        key = (<span class=\"kw\">self<\/span>._status, event)\n        <span class=\"kw\">if<\/span> key <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._TRANSITIONS:\n            <span class=\"kw\">raise<\/span> InvalidTransition(f<span class=\"st\">\"Cannot {event} a {self._status.value} booking\"<\/span>)\n        <span class=\"kw\">self<\/span>._status = <span class=\"kw\">self<\/span>._TRANSITIONS[key]\n\n    <span class=\"kw\">def<\/span> total_price(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._seats * <span class=\"kw\">self<\/span>._trip.price_per_seat\n\n    <span class=\"kw\">def<\/span> amount_paid(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> sum(p.amount <span class=\"kw\">for<\/span> p <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._payments)\n\n    <span class=\"kw\">def<\/span> balance_due(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>.total_price() - <span class=\"kw\">self<\/span>.amount_paid()\n\n    <span class=\"kw\">def<\/span> add_payment(<span class=\"kw\">self<\/span>, amount: float, paid_on: date) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">if<\/span> <span class=\"kw\">self<\/span>._status <span class=\"kw\">is<\/span> <span class=\"kw\">not<\/span> BookingStatus.PENDING:\n            <span class=\"kw\">raise<\/span> InvalidTransition(f<span class=\"st\">\"Cannot pay a {self._status.value} booking\"<\/span>)\n        <span class=\"kw\">if<\/span> amount &gt; <span class=\"kw\">self<\/span>.balance_due():\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Payment exceeds balance due\"<\/span>)\n        <span class=\"kw\">self<\/span>._payments.append(Payment(amount, paid_on))\n        <span class=\"kw\">if<\/span> round(<span class=\"kw\">self<\/span>.balance_due(), <span class=\"nu\">2<\/span>) == <span class=\"nu\">0<\/span>:          <span class=\"cm\"># guard<\/span>\n            <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"fully_paid\"<\/span>)\n\n    <span class=\"kw\">def<\/span> cancel(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"cancel\"<\/span>)\n        <span class=\"kw\">self<\/span>._trip.release_seats(<span class=\"kw\">self<\/span>._seats)          <span class=\"cm\"># action<\/span>\n\n    <span class=\"kw\">def<\/span> complete(<span class=\"kw\">self<\/span>) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._fire(<span class=\"st\">\"complete\"<\/span>)<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>trip = Trip(<span class=\"st\">\"Rome\"<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">6<\/span>, <span class=\"nu\">1<\/span>), <span class=\"nu\">300.0<\/span>, <span class=\"nu\">5<\/span>)\nb = Booking(Customer(<span class=\"st\">\"Lina\"<\/span>, <span class=\"st\">\"0770\"<\/span>), trip, <span class=\"nu\">2<\/span>)\nb.add_payment(<span class=\"nu\">200.0<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">2<\/span>, <span class=\"nu\">1<\/span>))\n<span class=\"kw\">assert<\/span> b.status <span class=\"kw\">is<\/span> BookingStatus.PENDING\nb.add_payment(<span class=\"nu\">400.0<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">2<\/span>, <span class=\"nu\">9<\/span>))\n<span class=\"kw\">assert<\/span> b.status <span class=\"kw\">is<\/span> BookingStatus.CONFIRMED                 <span class=\"cm\"># تأكيد آلي<\/span>\nb.cancel()\n<span class=\"kw\">assert<\/span> b.status <span class=\"kw\">is<\/span> BookingStatus.CANCELLED <span class=\"kw\">and<\/span> trip.seats_left == <span class=\"nu\">5<\/span>\n\n<span class=\"kw\">for<\/span> forbidden <span class=\"kw\">in<\/span> (b.complete, b.cancel, <span class=\"kw\">lambda<\/span>: b.add_payment(<span class=\"nu\">1.0<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">2<\/span>, <span class=\"nu\">10<\/span>))):\n    <span class=\"kw\">try<\/span>:\n        forbidden()\n        <span class=\"kw\">raise<\/span> AssertionError(<span class=\"st\">\"should have been rejected\"<\/span>)\n    <span class=\"kw\">except<\/span> InvalidTransition:\n        <span class=\"kw\">pass<\/span><\/code><\/pre><\/div>\n<p>لاحظ: <code dir=\"ltr\">_fire(\"cancel\")<\/code> تُستدعى <b>قبل<\/b> إعادة المقاعد. لو كان الإلغاء ممنوعًا لرُفع الاستثناء دون أي أثر جانبي.<\/p>"}, {"id": "p6", "t": "المهمة 6: الخدمة والتفاعل (Sequence Diagram و Loose Coupling)", "html": "<p><b>الهدف<\/b>: تنسيق الـ use cases بخدمة منخفضة الاقتران، ونمذجة التفاعل.<\/p>\n<p><b>المطلوب<\/b>:<\/p>\n<ol><li>اكتب نصيًا sequence diagram لـ «تسجيل دفعة»، يتضمن <code dir=\"ltr\">alt<\/code> لحالتَي اكتمال المبلغ وعدم اكتماله.<\/li><li>عرّف <code dir=\"ltr\">Notifier<\/code> و <code dir=\"ltr\">BookingRepository<\/code> كـ <code dir=\"ltr\">Protocol<\/code>.<\/li><li>اكتب <code dir=\"ltr\">BookingService<\/code> يستقبلهما عبر الـ constructor (DI) وفيه: <code dir=\"ltr\">create_booking<\/code> و <code dir=\"ltr\">record_payment<\/code> و <code dir=\"ltr\">cancel_booking<\/code>.<\/li><li>اكتب <code dir=\"ltr\">InMemoryBookingRepository<\/code> و <code dir=\"ltr\">FakeNotifier<\/code>، واختبر: الإشعار يُرسل <b>مرة واحدة<\/b> وعند التأكيد فقط.<\/li><\/ol>", "hints": ["المشاركون: Employee (actor)، BookingService، BookingRepository، Booking، Notifier. من يقرّر التأكيد؟ الحجز نفسه، لا الخدمة.", "الخدمة لا تذكر SMS ولا dictionary في أي سطر. تعرف فقط send و add و get.", "FakeNotifier يسجّل ما أُرسل في قائمة، ثم تتحقق من طولها في الاختبار."], "checks": ["في مخططي تُجلب الحجز من الـ repository قبل أي عملية عليه", "قرار التأكيد عند Booking، والخدمة تقرأ الحالة الناتجة فقط", "BookingService لا ينشئ أي اعتماد بنفسه: كلها تُحقن عبر الـ constructor", "استطعتُ اختبار الخدمة دون أي خدمة رسائل أو قاعدة بيانات حقيقية", "اختباري يثبت أن الإشعار لا يُرسل عند دفعة جزئية"], "sol": "<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Employee -&gt; BookingService : record_payment(booking_id, amount, paid_on)\nBookingService -&gt; BookingRepository : get(booking_id)\nBookingRepository --&gt; BookingService : booking\nBookingService -&gt; Booking : add_payment(amount, paid_on)\nBooking -&gt; Booking : check status and balance; create Payment\nBooking --&gt; BookingService : (done)\nBookingService -&gt; Booking : status\nBooking --&gt; BookingService : status\n\nalt [status is CONFIRMED]\n    BookingService -&gt; Notifier : send(phone, \"Booking confirmed\")\nelse [status is PENDING]\n    (no notification)\nend\nBookingService --&gt; Employee : status<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> typing <span class=\"kw\">import<\/span> Protocol\n\n<span class=\"kw\">class<\/span> BookingRepository(Protocol):\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, booking: Booking) -&gt; int: ...\n    <span class=\"kw\">def<\/span> get(<span class=\"kw\">self<\/span>, booking_id: int) -&gt; Booking: ...\n\n<span class=\"kw\">class<\/span> Notifier(Protocol):\n    <span class=\"kw\">def<\/span> send(<span class=\"kw\">self<\/span>, to: str, message: str) -&gt; <span class=\"kw\">None<\/span>: ...\n\n<span class=\"kw\">class<\/span> BookingService:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, repository: BookingRepository, notifier: Notifier):\n        <span class=\"kw\">self<\/span>._repository = repository\n        <span class=\"kw\">self<\/span>._notifier = notifier\n\n    <span class=\"kw\">def<\/span> create_booking(<span class=\"kw\">self<\/span>, customer: Customer, trip: Trip, seats: int) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._repository.add(Booking(customer, trip, seats))\n\n    <span class=\"kw\">def<\/span> record_payment(<span class=\"kw\">self<\/span>, booking_id: int, amount: float, paid_on: date) -&gt; BookingStatus:\n        booking = <span class=\"kw\">self<\/span>._repository.get(booking_id)\n        booking.add_payment(amount, paid_on)\n        <span class=\"kw\">if<\/span> booking.status <span class=\"kw\">is<\/span> BookingStatus.CONFIRMED:\n            <span class=\"kw\">self<\/span>._notifier.send(booking.customer.phone, f<span class=\"st\">\"Booking {booking_id} confirmed\"<\/span>)\n        <span class=\"kw\">return<\/span> booking.status\n\n    <span class=\"kw\">def<\/span> cancel_booking(<span class=\"kw\">self<\/span>, booking_id: int) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._repository.get(booking_id).cancel()\n\n\n<span class=\"kw\">class<\/span> InMemoryBookingRepository:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._bookings: dict[int, Booking] = {}\n\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, booking: Booking) -&gt; int:\n        booking_id = len(<span class=\"kw\">self<\/span>._bookings) + <span class=\"nu\">1<\/span>\n        <span class=\"kw\">self<\/span>._bookings[booking_id] = booking\n        <span class=\"kw\">return<\/span> booking_id\n\n    <span class=\"kw\">def<\/span> get(<span class=\"kw\">self<\/span>, booking_id: int) -&gt; Booking:\n        <span class=\"kw\">if<\/span> booking_id <span class=\"kw\">not<\/span> <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._bookings:\n            <span class=\"kw\">raise<\/span> KeyError(f<span class=\"st\">\"Booking {booking_id} not found\"<\/span>)\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._bookings[booking_id]\n\n\n<span class=\"kw\">class<\/span> FakeNotifier:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>.sent: list[tuple[str, str]] = []\n\n    <span class=\"kw\">def<\/span> send(<span class=\"kw\">self<\/span>, to: str, message: str) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>.sent.append((to, message))<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>trip = Trip(<span class=\"st\">\"Istanbul\"<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">5<\/span>, <span class=\"nu\">1<\/span>), <span class=\"nu\">500.0<\/span>, <span class=\"nu\">10<\/span>)\nnotifier = FakeNotifier()\nservice = BookingService(InMemoryBookingRepository(), notifier)\n\nbooking_id = service.create_booking(Customer(<span class=\"st\">\"Sara\"<\/span>, <span class=\"st\">\"0550\"<\/span>), trip, <span class=\"nu\">2<\/span>)\n<span class=\"kw\">assert<\/span> trip.seats_left == <span class=\"nu\">8<\/span>\n<span class=\"kw\">assert<\/span> service.record_payment(booking_id, <span class=\"nu\">400.0<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">1<\/span>, <span class=\"nu\">5<\/span>)) <span class=\"kw\">is<\/span> BookingStatus.PENDING\n<span class=\"kw\">assert<\/span> notifier.sent == []                                   <span class=\"cm\"># دفعة جزئية: لا إشعار<\/span>\n<span class=\"kw\">assert<\/span> service.record_payment(booking_id, <span class=\"nu\">600.0<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">1<\/span>, <span class=\"nu\">20<\/span>)) <span class=\"kw\">is<\/span> BookingStatus.CONFIRMED\n<span class=\"kw\">assert<\/span> notifier.sent == [(<span class=\"st\">\"0550\"<\/span>, <span class=\"st\">\"Booking 1 confirmed\"<\/span>)]    <span class=\"cm\"># مرة واحدة<\/span>\nservice.cancel_booking(booking_id)\n<span class=\"kw\">assert<\/span> trip.seats_left == <span class=\"nu\">10<\/span><\/code><\/pre><\/div>\n<p><b>مطابقة النماذج<\/b>: كل participant له class، وكل رسالة تقابلها operation عامة، والخدمة مرتبطة في الـ class diagram بالـ repository والـ notifier. الإنتاج يبدّل <code dir=\"ltr\">FakeNotifier<\/code> بـ <code dir=\"ltr\">SmsNotifier<\/code> في الـ composition root فقط.<\/p>"}, {"id": "p7", "t": "المهمة 7: تطوير النظام بمتطلب جديد (Software Evolution)", "html": "<p><b>الهدف<\/b>: إضافة متطلب إلى نظام يعمل دون كسره.<\/p>\n<p><b>المتطلب الجديد من صاحب الوكالة<\/b>: «الحجوزات الجماعية من 5 مقاعد فأكثر تأخذ خصم 10%. وأتوقع عروضًا موسمية أخرى لاحقًا. الحجوزات التي تُنشأ بالطريقة الحالية يجب أن تبقى كما هي».<\/p>\n<p><b>المطلوب<\/b>:<\/p>\n<ol><li>impact analysis: ما الذي يتغيّر، وما الذي يتأثر، وما المعزول؟<\/li><li>حدّث الـ class diagram (العناصر الجديدة والعلاقات فقط).<\/li><li>اكتب الكود: يجب أن يعمل كل كود قديم ينشئ <code dir=\"ltr\">Booking(customer, trip, seats)<\/code> دون تعديل.<\/li><li>اكتب اختبار regression للسلوك القديم، واختبارين للجديد (عند الحدّ: 4 مقاعد و 5 مقاعد).<\/li><li>اذكر مبدأين أو نمطين من الدورة طبّقتهما.<\/li><\/ol>", "hints": ["«أتوقع عروضًا أخرى لاحقًا»: التنوّع في خوارزمية التسعير. أي نمط يجعل الخوارزمية قابلة للتبديل؟", "للحفاظ على التوافق: parameter اختياري في constructor الـ Booking بقيمة افتراضية تعطي السلوك القديم.", "اختبر عند الحدود: 4 مقاعد دون خصم، و 5 مقاعد مع خصم. وتأكد أن Booking دون سياسة يعطي السعر القديم بالضبط."], "checks": ["حلّلتُ الأثر قبل الكتابة وحدّدتُ ما يتغيّر وما يتأثر", "أضفتُ السعر كسياسة قابلة للتبديل، لا كشرط if داخل total_price", "الاستدعاء القديم Booking(customer, trip, seats) يعمل دون تعديل", "كتبتُ اختبار regression يثبت أن السعر القديم لم يتغيّر", "اختبرتُ قيمتَي الحدّ (4 و 5 مقاعد)", "عرض موسمي جديد سيُضاف عندي كـ class جديد دون تعديل Booking"], "sol": "<p><b>Impact analysis<\/b>:<\/p>\n<ul><li>يتغيّر: <code dir=\"ltr\">Booking<\/code> (الـ constructor و <code dir=\"ltr\">total_price<\/code>).<\/li><li>جديد: <code dir=\"ltr\">PricingPolicy<\/code> و <code dir=\"ltr\">StandardPricing<\/code> و <code dir=\"ltr\">GroupDiscountPricing<\/code>.<\/li><li>يتأثر ويُعاد اختباره: <code dir=\"ltr\">balance_due<\/code> و <code dir=\"ltr\">add_payment<\/code> والتأكيد الآلي (كلها مبنية على <code dir=\"ltr\">total_price<\/code>)، و <code dir=\"ltr\">BookingService.create_booking<\/code> إن أردنا تمرير السياسة.<\/li><li>معزول: <code dir=\"ltr\">Trip<\/code> و <code dir=\"ltr\">Customer<\/code> و <code dir=\"ltr\">Payment<\/code> والـ repository والـ notifier.<\/li><\/ul>\n<p><b>النموذج<\/b>:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>«interface» PricingPolicy     + total(seats: int, price_per_seat: float): float\nStandardPricing - - -▷ PricingPolicy\nGroupDiscountPricing - - -▷ PricingPolicy      - min_seats: int, - rate: float\nBooking ──────&gt; 1 PricingPolicy<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> PricingPolicy(Protocol):\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>, seats: int, price_per_seat: float) -&gt; float: ...\n\n<span class=\"kw\">class<\/span> StandardPricing:\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>, seats: int, price_per_seat: float) -&gt; float:\n        <span class=\"kw\">return<\/span> seats * price_per_seat\n\n<span class=\"kw\">class<\/span> GroupDiscountPricing:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, min_seats: int = <span class=\"nu\">5<\/span>, rate: float = <span class=\"nu\">0.10<\/span>):\n        <span class=\"kw\">self<\/span>._min_seats = min_seats\n        <span class=\"kw\">self<\/span>._rate = rate\n\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>, seats: int, price_per_seat: float) -&gt; float:\n        full = seats * price_per_seat\n        <span class=\"kw\">return<\/span> full * (<span class=\"nu\">1<\/span> - <span class=\"kw\">self<\/span>._rate) <span class=\"kw\">if<\/span> seats &gt;= <span class=\"kw\">self<\/span>._min_seats <span class=\"kw\">else<\/span> full<\/code><\/pre><\/div>\n<p>التعديل في <code dir=\"ltr\">Booking<\/code> (سطران متغيّران وسطر جديد، والباقي كما هو):<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>def __init__(self, customer, trip, seats, pricing: \"PricingPolicy | None\" = None):\n    ...\n    self._pricing = pricing or StandardPricing()\n\ndef total_price(self) -&gt; float:\n    return self._pricing.total(self._seats, self._trip.price_per_seat)<\/code><\/pre><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">def<\/span> test_regression_old_bookings_keep_old_price():\n    trip = Trip(<span class=\"st\">\"Rome\"<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">6<\/span>, <span class=\"nu\">1<\/span>), <span class=\"nu\">100.0<\/span>, <span class=\"nu\">20<\/span>)\n    <span class=\"kw\">assert<\/span> Booking(Customer(<span class=\"st\">\"A\"<\/span>, <span class=\"st\">\"1\"<\/span>), trip, <span class=\"nu\">6<\/span>).total_price() == <span class=\"nu\">600.0<\/span>     <span class=\"cm\"># دون سياسة: لا خصم<\/span>\n\n<span class=\"kw\">def<\/span> test_group_discount_boundaries():\n    trip = Trip(<span class=\"st\">\"Rome\"<\/span>, date(<span class=\"nu\">2027<\/span>, <span class=\"nu\">6<\/span>, <span class=\"nu\">1<\/span>), <span class=\"nu\">100.0<\/span>, <span class=\"nu\">20<\/span>)\n    policy = GroupDiscountPricing()\n    <span class=\"kw\">assert<\/span> Booking(Customer(<span class=\"st\">\"A\"<\/span>, <span class=\"st\">\"1\"<\/span>), trip, <span class=\"nu\">4<\/span>, policy).total_price() == <span class=\"nu\">400.0<\/span>\n    <span class=\"kw\">assert<\/span> Booking(Customer(<span class=\"st\">\"B\"<\/span>, <span class=\"st\">\"2\"<\/span>), trip, <span class=\"nu\">5<\/span>, policy).total_price() == <span class=\"nu\">450.0<\/span><\/code><\/pre><\/div>\n<p>السعر مع الخصم: <span class=\"math\" dir=\"ltr\"><span class=\"tx\">total<\/span> = <i>n<\/i> × <i>p<\/i> × (1 − <i>r<\/i>)<\/span> عندما <span class=\"math\" dir=\"ltr\"><i>n<\/i> ≥ 5<\/span>. مع <span class=\"math\" dir=\"ltr\"><i>n<\/i> = 5<\/span> و <span class=\"math\" dir=\"ltr\"><i>p<\/i> = 100<\/span> و <span class=\"math\" dir=\"ltr\"><i>r<\/i> = 0.1<\/span> الناتج 450.<\/p>\n<p><b>المبادئ المطبّقة<\/b>: Strategy pattern؛ Open/Closed (عرض جديد يعني class جديدًا)؛ composition بدل الوراثة (لم ننشئ <code dir=\"ltr\">GroupBooking(Booking)<\/code>)؛ backward compatibility عبر parameter اختياري؛ regression testing.<\/p>\n<div class=\"note\">ملاحظة تصميمية: الحجوزات القديمة لا تأخذ الخصم لأن صاحب الوكالة طلب بقاءها كما هي. اختيار السياسة لكل حجز جديد يتم في نقطة واحدة (الخدمة أو الـ composition root).<\/div>"}, {"id": "p8", "t": "المهمة 8: مراجعة النماذج (Model Review) والتقييم الذاتي", "html": "<p><b>الهدف<\/b>: اكتشاف التناقضات بين المخططات والمتطلبات، كما يفعل مراجع تصميم.<\/p>\n<p>زميل جديد قدّم هذه النماذج لـ TravelDesk. فيها <b>ستة أخطاء على الأقل<\/b>. اكتب كل خطأ، ونوعه (علاقة خاطئة، تفاعل ناقص، انتقال غير صالح، تناقض بين مخططين، تناقض مع المتطلبات)، وتصحيحه.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>(A) Class diagram\nCustomer 1 ────── 0..* Booking\nBooking 0..* ────&gt; 1 Trip\nBooking 1 ◆────── 0..* Payment\nBookingService ────▷ Booking\nTrip:  + reserved: int\n\n(B) Sequence diagram: record payment\nEmployee -&gt; BookingAPI : record_payment(id, amount)\nBookingAPI -&gt; Booking : set_status(\"confirmed\")\nBookingAPI -&gt; SmsGateway : send(phone, \"confirmed\")\nBookingAPI -&gt; BookingRepository : get(id)\n\n(C) State diagram of Booking\n[*] --&gt; Pending\nPending --fully_paid--&gt; Confirmed\nConfirmed --complete--&gt; Completed\nCancelled --fully_paid--&gt; Confirmed\nArchived\n\n(D) Requirements\n- الحجز يتأكد فقط عند اكتمال المبلغ.\n- يمكن إلغاء الحجز المعلّق أو المؤكَّد قبل الانطلاق.\n- الحجز الملغى لا يُعاد تفعيله.<\/code><\/pre><\/div>\n<p>بعد ذلك اكتب فقرة قصيرة: ما أهم ثلاثة أشياء تغيّرت في طريقة تفكيرك في بناء البرمجيات بعد هذه الدورة؟<\/p>", "hints": ["افحص كل مخطط وحده أولًا: وراثة تفشل في is-a؟ attribute عام؟ حالة بلا أسهم؟", "ثم قارن كل زوج: كل رسالة في (B) هل لها operation في (A)؟ وهل ترتيب الرسائل منطقي؟", "ثم قارن بالمتطلبات (D): هل يسمح نموذج بما يمنعه متطلب؟ هل يغيب عن النماذج شيء يطلبه متطلب؟"], "checks": ["اكتشفتُ الوراثة الخاطئة بين BookingService و Booking", "اكتشفتُ أن الـ sequence diagram يغيّر الحال
