<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Design &amp; Architecture — دورة تفاعلية كاملة</title>
<style>
:root{--bg:#f5f2ea;--surface:#fffdf8;--box:#fbf7ec;--ink:#1c2630;--mut:#5d6873;--line:#ddd6c6;--acc:#0f6b63;--acc-s:#dcefeb;
--ok:#19753c;--ok-s:#e3f3e7;--bad:#b3261e;--bad-s:#fbe6e3;--warn:#99570a;--warn-s:#fbefd7;--code:#f1ecdf;--kw:#8b2f8b;--st:#1f6f3b;--cm:#7b8591;--nu:#a6470b;--dc:#0b5cab}
[data-theme=dark]{--bg:#11161b;--surface:#1a2129;--box:#222b35;--ink:#e4e8ec;--mut:#9aa6b2;--line:#313c48;--acc:#3ecfbf;--acc-s:#16352f;
--ok:#5fd08a;--ok-s:#163222;--bad:#ff8a80;--bad-s:#3b1c1a;--warn:#f1b765;--warn-s:#3a2b12;--code:#141a20;--kw:#d794e0;--st:#8fd6a4;--cm:#7f8b97;--nu:#f0a868;--dc:#7db8f5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.9 "Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
code,pre{font-family:Consolas,"Cascadia Code",Menlo,"DejaVu Sans Mono",monospace}
code{background:var(--code);padding:.08em .38em;border-radius:5px;font-size:.88em;unicode-bidi:isolate;display:inline-block;line-height:1.5}
a{color:var(--acc)}
/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:1rem;margin:0;white-space:nowrap}
.top .bar{flex:1;height:9px;background:var(--line);border-radius:9px;overflow:hidden;min-width:60px}
.top .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.top .pct{font-size:.85rem;color:var(--mut);min-width:3.2em;text-align:center}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 10px;font-size:.9rem}
.icon:hover{border-color:var(--acc)}
#menu{display:none}
.wrap{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 50px)}
nav{background:var(--surface);border-inline-end:1px solid var(--line);padding:12px 10px 60px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto;font-size:.92rem}
nav a,nav .mh{display:flex;gap:8px;align-items:center;width:100%;text-align:start;padding:5px 10px;border-radius:8px;text-decoration:none;color:var(--ink);border:0;background:none;line-height:1.6}
nav a:hover,nav .mh:hover{background:var(--acc-s)}
nav a.cur{background:var(--acc);color:var(--surface)}
nav .mh{font-weight:700;margin-top:8px}
nav .mh::before{content:"▾";color:var(--mut);transition:transform .15s}
nav .mod.shut .mh::before{transform:rotate(90deg)}
nav .mod.shut .ml{display:none}
nav .ml a{padding-inline-start:26px}
nav .dot{flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--mut);font-size:11px;line-height:14px;text-align:center}
nav a.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
nav a.done .dot::after{content:"✓"}
nav .cnt{margin-inline-start:auto;font-size:.75rem;color:var(--mut);font-weight:400}
main{padding:26px clamp(14px,4vw,54px) 90px;max-width:980px;width:100%;margin:0 auto}
main h2{font-size:1.65rem;line-height:1.5;margin:.2em 0 .4em}
main h3{font-size:1.2rem;margin:1.6em 0 .5em}
main h4{font-size:1.02rem;margin:1.1em 0 .3em}
.crumb{color:var(--mut);font-size:.88rem}
.lead{color:var(--mut)}
p{margin:.55em 0}
ul,ol{padding-inline-start:1.4em;margin:.5em 0}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;border:0;background:none;text-align:start;font-weight:700;font-size:1.02rem}
.card-h .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc-s);color:var(--acc);font-size:.85rem;display:grid;place-items:center}
.card.done .card-h .num{background:var(--ok);color:#fff}
.card-h .chev{margin-inline-start:auto;color:var(--mut);transition:transform .15s}
.card.open .card-h .chev{transform:rotate(-90deg)}
.card-b{display:none;padding:2px 20px 18px;border-top:1px solid var(--line)}
.card.open .card-b{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--surface);border-radius:9px;padding:5px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--acc);text-decoration:underline;padding:0;font-size:.9rem}
.muted{color:var(--mut);font-size:.88rem}
/* content */
.note{border-inline-start:4px solid var(--warn);background:var(--warn-s);padding:8px 14px;border-radius:8px;margin:.8em 0}
.code{margin:.8em 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code);text-align:left}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:2px 12px;font:12px Consolas,monospace;color:var(--mut);border-bottom:1px solid var(--line)}
.copy{border:0;background:none;color:var(--acc);font:13px "Segoe UI",Tahoma,sans-serif}
pre{margin:0;padding:12px 14px;overflow:auto;font-size:.84rem;line-height:1.65;tab-size:4}
pre code{background:none;padding:0;display:block;font-size:inherit;line-height:inherit}
.kw{color:var(--kw);font-weight:600}.st{color:var(--st)}.cm{color:var(--cm);font-style:italic}.nu{color:var(--nu)}.dc{color:var(--dc)}
.tw{overflow:auto;margin:.8em 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--surface)}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
th{background:var(--acc-s)}
.fig{margin:1em 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:auto;text-align:center}
.fig svg{max-width:none}
/* math */
.math,.mathb{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-size:1.08em;unicode-bidi:isolate;white-space:nowrap}
.math{display:inline-block;line-height:1.3;vertical-align:middle;padding:0 .12em}
.mathb{display:block;text-align:center;margin:.9em 0;font-size:1.3em;overflow:auto;padding:4px 0}
.math i,.mathb i{font-style:italic}
.tx{font-style:normal;font-family:"Segoe UI",Tahoma,sans-serif;font-size:.86em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.25}
.fr>span{padding:0 .3em}
.fr .dn{border-top:1.3px solid currentColor}
sup,sub{font-size:.72em;line-height:0}
/* quiz */
.q{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0;background:var(--box)}
.q.ok{border-color:var(--ok)}.q.bad{border-color:var(--bad)}
.q-top{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--mut)}
.badge{background:var(--acc-s);color:var(--acc);padding:0 10px;border-radius:20px;font-weight:700}
.scn{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:6px 12px;margin-top:8px}
.q-t{font-weight:600;margin:6px 0}
.q-t p{margin:.2em 0}
.opts{display:grid;gap:7px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 14px;line-height:1.7}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--ok-s)}
.opt.wrong{border-color:var(--bad);background:var(--bad-s)}
.opt:disabled{cursor:default;color:var(--ink)}
.sa{display:flex;gap:8px;flex-wrap:wrap}
.sa input{flex:1;min-width:200px;font:inherit;padding:5px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.fb{margin-top:10px;padding:8px 14px;border-radius:9px;font-size:.95rem}
.fb.ok{background:var(--ok-s)}.fb.bad{background:var(--bad-s)}
.fb>b{display:block}.fb.ok>b{color:var(--ok)}.fb.bad>b{color:var(--bad)}
.fb-act{display:flex;gap:16px;margin-top:4px}
.test{border:2px solid var(--acc);border-radius:14px;padding:6px 20px 16px;margin:28px 0;background:var(--surface)}
.score{font-weight:700;padding:8px 14px;border-radius:9px;background:var(--acc-s);margin-top:10px}
/* tasks */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 20px 18px;margin:14px 0}
.task textarea{width:100%;font:15px/1.7 Consolas,Menlo,monospace;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);resize:vertical;margin:6px 0 10px}
details.hint{border:1px solid var(--warn);background:var(--warn-s);border-radius:9px;padding:4px 14px;margin:7px 0}
details.hint summary{cursor:pointer;font-weight:700;color:var(--warn)}
.sol{border:1.5px solid var(--ok);border-radius:10px;padding:4px 16px 10px;margin-top:12px}
.sol>h4{color:var(--ok)}
.checks{border:1.5px dashed var(--acc);border-radius:10px;padding:4px 16px 12px;margin-top:12px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.checks input{margin-top:.6em;width:17px;height:17px;accent-color:var(--acc)}
/* misc */
.hero{background:var(--acc);color:var(--surface);border-radius:16px;padding:22px 26px;margin-bottom:18px}
.hero h2{margin:0 0 4px}.hero p{margin:0;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink);display:block}
.tile:hover{border-color:var(--acc)}
.tile b{display:block}.tile small{color:var(--mut)}
.mini{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--acc)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.pn a{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;text-decoration:none;color:var(--ink)}
.pn a:hover{border-color:var(--acc)}
.pn small{display:block;color:var(--mut)}
.pn .nx{text-align:end}
.timer{font:700 1.3rem Consolas,monospace;padding:2px 14px;border-radius:9px;background:var(--acc-s);color:var(--acc);display:inline-block;direction:ltr}
.verdict{font-size:1.15rem;font-weight:700;padding:14px 18px;border-radius:12px;background:var(--acc-s);margin:14px 0}
@media (max-width:860px){
  #menu{display:inline-block}
  .wrap{display:block}
  nav{position:fixed;inset:50px 0 0 auto;width:min(320px,88vw);z-index:15;transform:translateX(105%);transition:transform .2s;box-shadow:0 0 30px #0005}
  body.nav-open nav{transform:none}
  .top h1{display:none}
  body{font-size:16px}
}
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="menu" aria-label="القائمة">☰</button>
  <h1>Software Design &amp; Architecture</h1>
  <div class="bar" title="نسبة التقدّم"><i id="bar"></i></div>
  <span class="pct" id="pct">0%</span>
  <button class="icon" id="theme" title="الوضع الليلي/النهاري">◐</button>
  <button class="icon" id="reset">إعادة ضبط التقدّم</button>
</header>
<div class="wrap">
  <nav id="nav" aria-label="فهرس الدورة"></nav>
  <main id="main"></main>
</div>
<script>
(function(){
"use strict";
const D={"modules": [{"t": "أسس التصميم والنمذجة المفاهيمية", "g": "تعلّم كيف تفكّر في البرنامج <b>قبل<\/b> كتابة الكود: افهم المشكلة، حدّد مكوّنات النظام، وقرّر مسؤولية كل مكوّن.", "lessons": [{"t": "دور Software Architecture", "intro": "<p>قبل أن نتعلّم أي تقنية، نحتاج أن نفهم ما هي «المعمارية» أصلًا، ومن يصنعها، وما الذي يؤثّر فيها. هذا القسم يبني المفردات التي سنستخدمها في كل الدورة.<\/p>", "items": [{"t": "ما هي Software Architecture؟", "html": "<p><b>Software Architecture<\/b> هي التنظيم عالي المستوى (high-level) للنظام البرمجي. تجيب عن أربعة أسئلة:<\/p>\n<ul><li>ما <b>المكوّنات<\/b> الكبرى (components) في النظام؟<\/li><li>ما <b>مسؤولية<\/b> كل مكوّن؟<\/li><li>كيف <b>تتواصل<\/b> المكوّنات فيما بينها؟<\/li><li>ما <b>القرارات المهمة<\/b> التي تشكّل النظام، ولماذا اتُّخذت؟<\/li><\/ul>\n<p>تشبيه: المعمارية مثل مخطط المبنى. المخطط لا يحدّد لون الستائر، لكنه يحدّد عدد الطوابق ومكان الأعمدة والسلالم. تغيير الستائر سهل، أما تغيير مكان عمود بعد البناء فمكلف جدًا.<\/p>\n<p>مثال: منصة لوكالات السفر يمكن تقسيمها مفاهيميًا إلى: Customer management، Reservation management، Employee management، Document management، Reporting and analytics، Authentication and authorization. المعمارية تقرّر كيف تُنظَّم هذه الأجزاء وكيف تتفاعل.<\/p>", "q": {"id": "m1l1c1", "type": "mc", "q": "<p>أي مما يلي يُعدّ جزءًا من Software Architecture؟<\/p>", "exp": "<p>المعمارية تهتم بالبنية الكبرى: المكوّنات، مسؤولياتها، وطرق تواصلها. أسماء المتغيّرات والألوان تفاصيل تنفيذية يسهل تغييرها لاحقًا.<\/p>", "opts": ["تقسيم النظام إلى مكوّنات كبرى وتحديد كيف تتواصل", "لون زر «حفظ» في الواجهة", "اختيار اسم متغيّر داخل دالة", "عدد الأسطر في ملف معيّن"], "ans": 0}}, {"t": "المعمارية ليست اختيار تقنيات", "html": "<p>خطأ شائع: «معمارية مشروعي هي Django و React و PostgreSQL و Docker». هذه <b>تقنيات<\/b> (technology stack) وليست معمارية.<\/p>\n<p>المعمارية هي الإجابة عن: <b>كيف<\/b> يُنظَّم النظام كله، و<b>لماذا<\/b> بهذا الشكل؟ يمكن بناء المعمارية نفسها بتقنيات مختلفة، ويمكن بناء معماريتين مختلفتين تمامًا بالتقنيات نفسها.<\/p>\n<p>مثال: «منطق الحجز معزول في طبقة services لا تعرف شيئًا عن HTTP، حتى نستطيع استعماله من الـ API ومن مهام مجدولة» هذا قرار معماري. أما «نستخدم Django» فهو اختيار أداة لتنفيذ ذلك القرار.<\/p>\n<div class=\"note\">الفرق بين Architecture و Design: الـ architecture تخصّ البنية الكبرى للنظام كله، والـ design (التصميم التفصيلي) يخصّ داخل كل مكوّن: classes و interfaces وتفاعلاتها.<\/div>", "q": {"id": "m1l1c2", "type": "tf", "q": "<p>العبارة «معمارية نظامنا هي React و Django و PostgreSQL» وصف كافٍ للمعمارية.<\/p>", "exp": "<p>هذه قائمة تقنيات فقط. الوصف المعماري يجب أن يذكر المكوّنات ومسؤولياتها وكيف تتواصل ولماذا نُظّمت بهذا الشكل.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "الأدوار: Architect و Designer و Developer و Engineer", "html": "<div class=\"tw\"><table><thead><tr><th>Role<\/th><th>المسؤولية الأساسية<\/th><\/tr><\/thead><tbody><tr><td>Software Architect<\/td><td>يحدّد البنية العامة للنظام والقرارات التقنية الكبرى<\/td><\/tr><tr><td>Software Designer<\/td><td>يضع التصميم التفصيلي للمكوّنات: classes و interfaces والتفاعلات<\/td><\/tr><tr><td>Software Developer<\/td><td>ينفّذ الكود ويختبره ويصونه<\/td><\/tr><tr><td>Software Engineer<\/td><td>يطبّق مبادئ الهندسة على كامل دورة حياة البرنامج (software development lifecycle)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>تشبيه البناء: الـ architect يرسم مخطط المبنى، الـ designer يصمّم تفاصيل كل شقة، الـ developer يبني فعليًا.<\/p>\n<p>في الشركات الحقيقية تتداخل هذه الأدوار كثيرًا، خصوصًا في الفرق الصغيرة: قد تكون أنت الـ architect والـ designer والـ developer في مشروع واحد. المهم أن تعرف <b>أي قبّعة<\/b> ترتدي في كل لحظة.<\/p>", "q": {"id": "m1l1c3", "type": "sc", "sc": "في شركة ناشئة، ليلى تقرّر أن النظام سيُقسم إلى ثلاث خدمات تتواصل عبر REST API، ثم يحدّد يوسف الـ classes والـ methods داخل خدمة الحجوزات.", "q": "<p>أي دور يمارسه كل منهما؟<\/p>", "exp": "<p>تقسيم النظام كله وطريقة تواصل أجزائه قرار معماري (Architect). تحديد classes و methods داخل مكوّن واحد تصميم تفصيلي (Designer).<\/p>", "opts": ["ليلى Designer ويوسف Architect", "ليلى تمارس دور الـ Architect ويوسف دور الـ Designer", "ليلى Developer ويوسف Architect", "كلاهما يمارس دور الـ Developer فقط"], "ans": 1}}, {"t": "Architectural Decisions", "html": "<p><b>Architectural decision<\/b> هو قرار يؤثّر بشكل كبير في بنية النظام، ويكون التراجع عنه لاحقًا <b>مكلفًا<\/b>.<\/p>\n<p>أمثلة:<\/p>\n<ul><li>هل النظام تطبيق واحد (monolith) أم عدة خدمات؟<\/li><li>هل كل وكالة سفر لها قاعدة بيانات مستقلة أم الكل في قاعدة واحدة؟<\/li><li>هل التواصل بين الأجزاء مباشر (synchronous) أم عبر رسائل (asynchronous)؟<\/li><\/ul>\n<p>اختبار بسيط: اسأل «لو غيّرنا هذا القرار بعد سنة، كم ملفًا سنعدّل؟». إن كان الجواب «معظم النظام» فهو قرار معماري. إن كان «ملفًا أو اثنين» فهو قرار تصميمي أو تنفيذي عادي.<\/p>", "q": {"id": "m1l1c4", "type": "mc", "q": "<p>أي قرار مما يلي هو الأقرب إلى architectural decision؟<\/p>", "exp": "<p>فصل قواعد البيانات يؤثّر في كل النظام (الاتصال، التقارير، النسخ الاحتياطي) والتراجع عنه مكلف. البقية قرارات محلية يسهل تغييرها.<\/p>", "opts": ["استخدام حلقة <code dir=\"ltr\">for<\/code> بدل list comprehension", "تسمية دالة <code dir=\"ltr\">get_total<\/code> بدل <code dir=\"ltr\">calc_total<\/code>", "تخزين بيانات كل وكالة في قاعدة بيانات منفصلة بدل قاعدة مشتركة", "إضافة تعليق يشرح دالة"], "ans": 2}}, {"t": "Technical Constraints", "html": "<p><b>Technical constraints<\/b> هي قيود لا تختارها أنت، بل تُفرض عليك وتحدّ من خياراتك. مصادرها:<\/p>\n<ul><li><b>التقنية<\/b>: «يجب أن يعمل النظام مع قاعدة بيانات Oracle الموجودة».<\/li><li><b>الميزانية<\/b>: «لا نملك إلا خادمًا واحدًا صغيرًا».<\/li><li><b>البنية التحتية (infrastructure)<\/b>: «الإنترنت عند العملاء ضعيف ومتقطّع».<\/li><li><b>المتطلبات<\/b>: «القانون يفرض حفظ البيانات داخل البلد».<\/li><li><b>الفريق والوقت<\/b>: «الفريق يعرف Python فقط، والتسليم بعد شهرين».<\/li><\/ul>\n<p>الفرق بين constraint و decision: القيد معطًى ثابت، والقرار اختيار منك <b>داخل<\/b> حدود القيود. المعماري الجيد يجمع القيود أولًا ثم يقرّر.<\/p>", "q": {"id": "m1l1c5", "type": "tf", "q": "<p>«الفريق لا يعرف إلا Python والتسليم بعد شهرين» يُعدّ technical constraint يؤثّر في القرارات المعمارية.<\/p>", "exp": "<p>خبرة الفريق والوقت المتاح قيود حقيقية. تصميم يتطلب تقنية لا يتقنها أحد قد يكون «أفضل» نظريًا لكنه سيفشل عمليًا.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "Stakeholders", "html": "<p><b>Stakeholders<\/b> هم كل الأشخاص أو الجهات التي تتأثر بالنظام أو تؤثّر فيه، وليس المستخدمين فقط:<\/p>\n<ul><li><b>Customers / Users<\/b>: يريدون نظامًا سهلًا وسريعًا.<\/li><li><b>Managers<\/b>: يريدون تقارير وتكلفة منخفضة وتسليمًا في الموعد.<\/li><li><b>Developers<\/b>: يريدون كودًا مفهومًا يسهل تعديله.<\/li><li><b>Administrators<\/b>: يريدون نظامًا يسهل تشغيله ومراقبته.<\/li><\/ul>\n<p>لماذا يهم؟ لأن كل stakeholder يهتم بـ <b>quality attribute<\/b> مختلفة، وهذه الاهتمامات قد تتعارض. المعماري يوازن بينها. نسيان stakeholder واحد (مثل مسؤول النظام) يؤدي إلى نظام يعمل لكن لا يمكن تشغيله أو صيانته.<\/p>", "q": {"id": "m1l1c6", "type": "mc", "q": "<p>مَن مِن التالي يُعدّ stakeholder لنظام حجوزات وكالة سفر؟<\/p>", "exp": "<p>الـ stakeholder هو كل من يتأثر بالنظام أو يؤثّر فيه: من يستخدمه، ومن يدفع ثمنه، ومن يبنيه ويصونه ويشغّله.<\/p>", "opts": ["المطوّرون فقط لأنهم يبنون النظام", "جميع من ذُكروا: العميل، وموظف الحجوزات، والمطوّر الذي سيصون النظام", "مدير الوكالة فقط لأنه يدفع", "العميل الذي يحجز فقط"], "ans": 1}}, {"t": "Architectural Documentation", "html": "<p><b>Architectural documentation<\/b> هو تسجيل القرارات المهمة و<b>سبب<\/b> اتخاذها. الكود يخبرك «ماذا» فعلنا، لكنه لا يخبرك «لماذا» ولا «ما البدائل التي رُفضت».<\/p>\n<p>أبسط شكل عملي هو <b>ADR<\/b> (Architecture Decision Record): ملف قصير لكل قرار:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>ADR-003: قاعدة بيانات واحدة مشتركة لكل الوكالات\nContext:   عدد الوكالات المتوقع أقل من 50، والفريق من مطوّرَين فقط.\nDecision:  قاعدة واحدة مع عمود agency_id في كل جدول.\nRejected:  قاعدة لكل وكالة (تعقيد تشغيلي أكبر من حاجتنا الآن).\nConsequences: تقارير أسهل، لكن يجب الانتباه لعزل البيانات في كل query.<\/code><\/pre><\/div>\n<p>بعد سنة، حين يسأل مطوّر جديد «لماذا لم تفصلوا القواعد؟» يجد الجواب مكتوبًا، فلا يعيد النقاش ولا يهدم قرارًا له سبب وجيه.<\/p>", "q": {"id": "m1l1c7", "type": "sa", "q": "<p>ما اسم الوثيقة القصيرة التي تسجّل قرارًا معماريًا واحدًا مع سياقه والبدائل المرفوضة؟ (اكتب الاختصار أو الاسم الكامل بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>ADR<\/b> أي Architecture Decision Record. تسجّل السياق والقرار والبدائل والعواقب.<\/p>", "kw": ["ADR", "architecture decision record"]}}], "test": [{"id": "m1l1t1", "type": "sc", "sc": "تبني منصة لوكالات السفر. المدير يطلب تقارير فورية، والمطوّرون يطلبون كودًا بسيطًا، والميزانية تكفي لخادم واحد.", "q": "<p>ما أول خطوة معمارية سليمة؟<\/p>", "exp": "<p>المعمارية تبدأ بفهم من يتأثر بالنظام وما القيود، ثم قرارات مبرَّرة وموثّقة. اختيار التقنية يأتي بعد ذلك.<\/p>", "opts": ["جمع اهتمامات الـ stakeholders والقيود، ثم اتخاذ القرارات الكبرى وتوثيق أسبابها", "بناء microservices لأنها الأكثر شهرة", "اختيار أحدث framework ثم البدء في الكتابة فورًا", "تأجيل كل التفكير إلى ما بعد كتابة الكود"], "ans": 0}, {"id": "m1l1t2", "type": "tf", "q": "<p>الـ technical constraint هو قرار يتخذه المعماري بحرية كاملة.<\/p>", "exp": "<p>القيد مفروض من الخارج (ميزانية، تقنية موجودة، قانون). القرار هو ما تختاره أنت داخل هذه الحدود.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m1l1t3", "type": "mc", "q": "<p>ما الفرق الأدق بين Software Architect و Software Designer؟<\/p>", "exp": "<p>الفرق في مستوى التفاصيل: النظام ككل مقابل داخل المكوّن. وقد يؤدي الشخص نفسه الدورين في الفرق الصغيرة.<\/p>", "opts": ["الأول يكتب الكود والثاني يختبره", "الأول يحدّد البنية العامة والقرارات الكبرى، والثاني يضع التصميم التفصيلي داخل المكوّنات", "لا فرق بينهما إطلاقًا في أي سياق", "الأول يعمل على الواجهات والثاني على قواعد البيانات"], "ans": 1}, {"id": "m1l1t4", "type": "sa", "q": "<p>ما المصطلح الإنجليزي الذي يصف كل شخص أو جهة تتأثر بالنظام أو تؤثّر فيه؟<\/p>", "exp": "<p>الإجابة: <b>Stakeholders<\/b>، ويشملون العملاء والمطوّرين والمديرين ومسؤولي التشغيل.<\/p>", "kw": ["stakeholder"]}]}, {"t": "مراحل التصميم: Design Phases", "intro": "<p>كيف تتحوّل فكرة غامضة إلى كود يعمل؟ عبر مراحل، كل مرحلة تجيب عن سؤال مختلف. الخلط بين هذه الأسئلة هو سبب معظم التصاميم السيئة.<\/p>", "items": [{"t": "نظرة عامة على المراحل الخمس", "html": "<ol><li><b>Requirements Analysis<\/b>: ماذا يجب أن يفعل النظام؟<\/li><li><b>Conceptual Design<\/b>: ما المفاهيم والـ objects الموجودة في المشكلة؟<\/li><li><b>Technical Design<\/b>: كيف سينفّذ البرنامج هذه المفاهيم؟<\/li><li><b>Implementation<\/b>: كتابة الكود الفعلي.<\/li><li><b>Testing &amp; Refinement<\/b>: التحقق من السلوك وتحسين التصميم.<\/li><\/ol>\n<p>ملاحظة مهمة: هذه المراحل ليست خطًا مستقيمًا تمرّ به مرة واحدة. عمليًا هي <b>تكرارية (iterative)<\/b>: أثناء الـ implementation قد تكتشف أن متطلبًا كان غامضًا فتعود إلى المرحلة 1، أو أن class يحمل مسؤوليات كثيرة فتعود إلى المرحلة 2.<\/p>\n<p>كلما اكتشفت الخطأ في مرحلة أبكر كان إصلاحه أرخص: تعديل بطاقة ورقية يأخذ ثواني، وتعديل نظام يعمل عند العملاء قد يأخذ أسابيع.<\/p>", "q": {"id": "m1l2c1", "type": "tf", "q": "<p>يمكن الرجوع إلى Requirements Analysis أثناء الـ implementation إذا اكتُشف غموض في أحد المتطلبات.<\/p>", "exp": "<p>المراحل تكرارية. الرجوع إلى مرحلة سابقة عند اكتشاف غموض أو خطأ أمر طبيعي وصحي.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "Requirements Analysis: ماذا؟", "html": "<p>في هذه المرحلة نفهم <b>ما يحتاجه المستخدمون<\/b> وما يجب أن ينجزه النظام، دون أي حديث عن الكود أو قواعد البيانات.<\/p>\n<p>مثال متطلب: «يجب أن يستطيع العميل حجز غرفة في فندق».<\/p>\n<p>لاحظ ما <b>لا<\/b> يقوله المتطلب: لا يذكر classes ولا جداول ولا API. يصف حاجة من وجهة نظر المستخدم فقط.<\/p>\n<p>الخطأ الشائع هنا هو القفز إلى الحل: «نحتاج جدول <code dir=\"ltr\">reservations<\/code> فيه عمود <code dir=\"ltr\">room_id<\/code>». هذا ليس متطلبًا بل تصميم تقني مبكر، وقد يقيّدك قبل أن تفهم المشكلة.<\/p>", "q": {"id": "m1l2c2", "type": "mc", "q": "<p>أي عبارة تنتمي إلى Requirements Analysis؟<\/p>", "exp": "<p>المتطلب يصف ما يحتاجه المستخدم بلغة المشكلة. الخيارات الأخرى تنتمي إلى Technical Design أو Implementation أو Testing.<\/p>", "opts": ["«نستخدم Enum لتمثيل حالة الحجز»", "«نكتب unit test للدالة <code dir=\"ltr\">cancel<\/code>»", "«يجب أن يستطيع الموظف إلغاء حجز قبل موعده بـ 24 ساعة»", "«نضيف method اسمها <code dir=\"ltr\">cancel()<\/code> إلى class <code dir=\"ltr\">Reservation<\/code>»"], "ans": 2}}, {"t": "Conceptual Design: ما المفاهيم؟", "html": "<p>هنا نحدّد <b>المفاهيم (concepts)<\/b> والـ objects الرئيسية في المشكلة، ومسؤولياتها والعلاقات بينها، بلغة أهل المجال وليس بلغة البرمجة.<\/p>\n<p>من المتطلب «العميل يحجز غرفة في فندق» نستخرج:<\/p>\n<ul><li>Customer<\/li><li>Hotel<\/li><li>Room<\/li><li>Reservation<\/li><\/ul>\n<p>ونسأل: من مسؤول عن ماذا؟ من يعرف إن كانت الغرفة متاحة؟ ما علاقة الحجز بالعميل وبالغرفة؟<\/p>\n<p>التصميم المفاهيمي <b>مستقل عن التقنية<\/b>: هذه المفاهيم نفسها صالحة سواء نفّذت النظام بـ Python أو Java أو حتى على الورق. أداة هذه المرحلة هي بطاقات CRC (سندرسها في القسم 1.5).<\/p>", "q": {"id": "m1l2c3", "type": "mc", "q": "<p>ما ناتج مرحلة Conceptual Design؟<\/p>", "exp": "<p>التصميم المفاهيمي يحدّد المفاهيم والمسؤوليات والعلاقات دون تفاصيل تقنية.<\/p>", "opts": ["قائمة المفاهيم الأساسية مثل Customer و Room و Reservation مع مسؤولياتها وعلاقاتها", "مخطط جداول قاعدة البيانات مع أنواع الأعمدة", "نتائج الاختبارات", "كود Python جاهز للتشغيل"], "ans": 0}}, {"t": "Technical Design: كيف؟", "html": "<p>الآن نحوّل المفاهيم إلى <b>تصميم قابل للتنفيذ<\/b>: classes و interfaces و methods وعلاقات محدّدة ومعمارية.<\/p>\n<p>للمثال نفسه:<\/p>\n<ul><li><code dir=\"ltr\">Customer<\/code> class، <code dir=\"ltr\">Hotel<\/code> class، <code dir=\"ltr\">Room<\/code> class، <code dir=\"ltr\">Reservation<\/code> class.<\/li><li>method لإنشاء الحجز: <code dir=\"ltr\">Hotel.reserve(customer, room, dates)<\/code>.<\/li><li>علاقة: كل <code dir=\"ltr\">Reservation<\/code> يشير إلى <code dir=\"ltr\">Customer<\/code> واحد و <code dir=\"ltr\">Room<\/code> واحدة.<\/li><\/ul>\n<p>هنا تظهر القرارات التقنية: ما أنواع البيانات (types)؟ أيّ method عامة وأيّها داخلية؟ أين يوضع التحقق من توفّر الغرفة؟ أداة هذه المرحلة هي مخططات UML (الوحدتان 2 و 3).<\/p>\n<div class=\"tw\"><table><thead><tr><th>المرحلة<\/th><th>السؤال<\/th><\/tr><\/thead><tbody><tr><td>Requirements Analysis<\/td><td>ماذا يجب أن يفعل البرنامج؟<\/td><\/tr><tr><td>Conceptual Design<\/td><td>ما المفاهيم والـ objects في المشكلة؟<\/td><\/tr><tr><td>Technical Design<\/td><td>كيف سينفّذ البرنامج هذه المفاهيم؟<\/td><\/tr><tr><td>Implementation<\/td><td>كيف نكتب الكود الفعلي؟<\/td><\/tr><\/tbody><\/table><\/div>", "q": {"id": "m1l2c4", "type": "sc", "sc": "كتب زميلك: «<code dir=\"ltr\">Reservation<\/code> تملك attribute اسمه <code dir=\"ltr\">status<\/code> من نوع Enum، و method اسمها <code dir=\"ltr\">confirm()<\/code> ترفع استثناء إذا لم يكن الحجز في حالة Created».", "q": "<p>إلى أي مرحلة ينتمي هذا الوصف؟<\/p>", "exp": "<p>ذكر attributes بأنواعها و methods وسلوكها التقني هو Technical Design. التصميم المفاهيمي كان سيكتفي بـ «الحجز له حالة ويمكن تأكيده».<\/p>", "opts": ["Requirements Analysis", "Testing &amp; Refinement", "Conceptual Design", "Technical Design"], "ans": 3}}, {"t": "Implementation ثم Testing & Refinement", "html": "<p><b>Implementation<\/b> هي ترجمة التصميم إلى كود. إذا كان التصميم جيدًا تصبح الكتابة شبه مباشرة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Room:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, number: int):\n        <span class=\"kw\">self<\/span>.number = number\n        <span class=\"kw\">self<\/span>.reserved = <span class=\"kw\">False<\/span>\n\n<span class=\"kw\">class<\/span> Reservation:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, customer_name: str, room: Room):\n        <span class=\"kw\">if<\/span> room.reserved:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Room is already reserved\"<\/span>)\n        room.reserved = <span class=\"kw\">True<\/span>\n        <span class=\"kw\">self<\/span>.customer_name = customer_name\n        <span class=\"kw\">self<\/span>.room = room\n\nroom = Room(<span class=\"nu\">101<\/span>)\nr1 = Reservation(<span class=\"st\">\"Sara\"<\/span>, room)      <span class=\"cm\"># ينجح<\/span>\n<span class=\"cm\"># Reservation(\"Omar\", room)         # يرفع ValueError<\/span><\/code><\/pre><\/div>\n<p><b>Testing &amp; Refinement<\/b>: نتحقق أن السلوك مطابق للمتطلبات، ونحسّن التصميم. مثلًا سنلاحظ أن <code dir=\"ltr\">Reservation<\/code> تغيّر <code dir=\"ltr\">room.reserved<\/code> مباشرة، وهذا تدخّل في بيانات class آخر. سنتعلّم إصلاحه في Encapsulation (القسم 2.2).<\/p>\n<p>التصميم لا ينتهي عند كتابة الكود: الاختبار والاستخدام يكشفان نقاط ضعف تعيدنا إلى تحسين التصميم.<\/p>", "q": {"id": "m1l2c5", "type": "mc", "q": "<p>في الكود أعلاه، ماذا يحدث عند تنفيذ <code dir=\"ltr\">Reservation(\"Omar\", room)<\/code> بعد أن حجزت Sara الغرفة نفسها؟<\/p>", "exp": "<p>الـ constructor يتحقق من <code dir=\"ltr\">room.reserved<\/code> أولًا. بعد الحجز الأول صارت <code dir=\"ltr\">True<\/code> فيُرفع الاستثناء، وهذا تنفيذ لقاعدة «لا تُحجز الغرفة مرتين».<\/p>", "opts": ["لا يحدث شيء ويُعاد <code dir=\"ltr\">None<\/code>", "تُلغى حجز Sara تلقائيًا", "يُنشأ حجز ثانٍ للغرفة نفسها", "يُرفع <code dir=\"ltr\">ValueError<\/code> لأن <code dir=\"ltr\">room.reserved<\/code> أصبحت <code dir=\"ltr\">True<\/code>"], "ans": 3}}], "test": [{"id": "m1l2t1", "type": "mc", "q": "<p>رتّب المراحل من الأولى إلى الأخيرة:<\/p>", "exp": "<p>نبدأ بفهم «ماذا»، ثم «ما المفاهيم»، ثم «كيف تقنيًا»، ثم الكتابة، ثم التحقق والتحسين. مع إمكانية الرجوع في أي وقت.<\/p>", "opts": ["Requirements Analysis ثم Conceptual Design ثم Technical Design ثم Implementation ثم Testing &amp; Refinement", "Conceptual Design ثم Requirements Analysis ثم Implementation ثم Technical Design ثم Testing", "Technical Design ثم Conceptual Design ثم Requirements Analysis ثم Implementation ثم Testing", "Implementation ثم Requirements Analysis ثم Testing ثم Conceptual Design ثم Technical Design"], "ans": 0}, {"id": "m1l2t2", "type": "sc", "sc": "صاحب مطعم يقول: «أريد أن يرى النادل الطلبات الجاهزة». المطوّر يردّ فورًا: «سأنشئ جدول <code dir=\"ltr\">orders<\/code> وأضيف WebSocket».", "q": "<p>ما الخطأ في ردّ المطوّر؟<\/p>", "exp": "<p>لم يسأل بعد: ما معنى «جاهز»؟ من يحدّد ذلك؟ هل يرى النادل طلبات طاولاته فقط؟ القفز إلى الحل التقني قبل فهم المشكلة يبني الشيء الخطأ.<\/p>", "opts": ["كان عليه أن يبدأ بالاختبارات", "قفز إلى Technical Design قبل تحليل المتطلب وتحديد المفاهيم", "لا خطأ، السرعة أهم شيء", "كان عليه اختيار قاعدة بيانات مختلفة"], "ans": 1}, {"id": "m1l2t3", "type": "tf", "q": "<p>التصميم المفاهيمي (Conceptual Design) يبقى صالحًا كما هو إذا قررنا استخدام Java بدل Python.<\/p>", "exp": "<p>المفاهيم مثل Customer و Reservation تنتمي إلى المشكلة لا إلى اللغة. الذي يتغيّر هو الـ Technical Design والـ Implementation.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m1l2t4", "type": "sa", "q": "<p>في أي مرحلة نستخدم بطاقات CRC لتحديد الـ objects ومسؤولياتها؟ (اكتب اسم المرحلة بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Conceptual Design<\/b>. بطاقات CRC أداة مفاهيمية تسبق تحديد التفاصيل التقنية.<\/p>", "kw": ["conceptual"]}]}, {"t": "المفاضلات في التصميم: Trade-offs", "intro": "<p>لا يوجد تصميم «مثالي» في كل شيء. تحسين صفة في النظام يكلّف غالبًا صفة أخرى. المصمّم الجيد لا يبحث عن الكمال، بل يختار <b>بوعي<\/b> ويبرّر اختياره.<\/p>", "items": [{"t": "ما هو الـ Trade-off؟", "html": "<p><b>Trade-off<\/b> معناه مفاضلة: تكسب شيئًا وتدفع ثمنه من شيء آخر.<\/p>\n<p>تخيّل تطبيق ويب يدير آلاف الحجوزات. تريد: أداءً عاليًا، وأمانًا قويًا، وتكلفة بنية تحتية منخفضة، وصيانة بسيطة، وقابلية توسّع عالية، وتطويرًا سريعًا. هذه الأهداف <b>تتعارض<\/b>: الأمان الأقوى يضيف خطوات، والأداء الأعلى قد يحتاج خوادم أكثر، والتطوير الأسرع قد يضرّ بالجودة.<\/p>\n<p>تشبيه: عند شراء سيارة لا تجد سيارة هي الأسرع والأرخص والأوسع والأقل استهلاكًا معًا. تختار حسب حاجتك.<\/p>\n<p>القاعدة: لا تسأل «ما أفضل تصميم؟» بل «ما أفضل تصميم <b>لهذا السياق<\/b> وهذه الأولويات؟».<\/p>", "q": {"id": "m1l3c1", "type": "tf", "q": "<p>يمكن دائمًا تصميم نظام يحقق أعلى أداء وأقوى أمان وأقل تكلفة وأسرع تطوير في الوقت نفسه.<\/p>", "exp": "<p>هذه الأهداف تتعارض. التصميم هو فن اختيار ما تضحّي به بوعي حسب أولويات المشروع.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "Performance vs Maintainability", "html": "<p>الكود المحسَّن جدًا للأداء قد يصبح أصعب في الفهم والتعديل.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># واضح وسهل الصيانة<\/span>\n<span class=\"kw\">def<\/span> total_price(items):\n    <span class=\"kw\">return<\/span> sum(item.price * item.quantity <span class=\"kw\">for<\/span> item <span class=\"kw\">in<\/span> items)\n\n<span class=\"cm\"># أسرع عند الاستدعاء المتكرر، لكنه أعقد: يجب تحديث الـ cache عند كل تغيير<\/span>\n<span class=\"kw\">class<\/span> Order:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._items = []\n        <span class=\"kw\">self<\/span>._cached_total = <span class=\"nu\">0<\/span>\n\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, item):\n        <span class=\"kw\">self<\/span>._items.append(item)\n        <span class=\"kw\">self<\/span>._cached_total += item.price * item.quantity   <span class=\"cm\"># لا تنسَ هذا السطر أبدًا!<\/span><\/code><\/pre><\/div>\n<p>النسخة الثانية أسرع، لكن كل method تعدّل <code dir=\"ltr\">_items<\/code> يجب أن تحدّث <code dir=\"ltr\">_cached_total<\/code>، ونسيان ذلك مرة واحدة يُنتج خطأ صامتًا.<\/p>\n<p>القاعدة العملية: اكتب الكود الواضح أولًا. حسّن الأداء فقط حيث <b>قِست<\/b> وجود مشكلة فعلية.<\/p>", "q": {"id": "m1l3c2", "type": "mc", "q": "<p>متى يكون التضحية بوضوح الكود من أجل الأداء قرارًا مبرَّرًا؟<\/p>", "exp": "<p>التحسين له ثمن في الصيانة، فلا ندفعه إلا عند وجود مشكلة مُقاسة في مكان محدّد.<\/p>", "opts": ["دائمًا، لأن الأداء أهم من كل شيء", "أبدًا، الأداء غير مهم", "عندما يثبت القياس أن هذا الجزء تحديدًا يسبّب بطئًا مؤثرًا على المستخدمين", "عندما يبدو الكود المعقّد أكثر احترافية"], "ans": 2}}, {"t": "Security vs Convenience و Development Speed vs Code Quality", "html": "<p><b>Security vs Convenience<\/b>: كل خطوة أمان إضافية تجعل الاستخدام أقل راحة. المصادقة الثنائية (two-factor authentication) تحمي الحساب لكنها تضيف خطوة عند كل دخول. الحل ليس «أقصى أمان دائمًا» بل أمان يناسب حساسية البيانات: تطبيق بنكي يختلف عن تطبيق قائمة مهام.<\/p>\n<p><b>Development Speed vs Code Quality<\/b>: التنفيذ السريع «كيفما اتفق» يوفّر وقتًا اليوم ويخلق مشاكل صيانة غدًا. هذا يسمّى <b>technical debt<\/b> (دَين تقني): مثل القرض، تحصل على شيء الآن وتدفع فوائده لاحقًا في كل تعديل.<\/p>\n<p>الدَّين التقني ليس خطأ دائمًا: لتجربة فكرة أمام عميل (prototype) قد يكون الاستعجال قرارًا صحيحًا. الخطأ هو أخذ الدَّين <b>دون وعي<\/b> ودون خطة لسداده.<\/p>", "q": {"id": "m1l3c3", "type": "sa", "q": "<p>ما المصطلح الإنجليزي الذي يصف تكلفة الصيانة المستقبلية الناتجة عن حلول سريعة ضعيفة الجودة؟<\/p>", "exp": "<p>الإجابة: <b>Technical debt<\/b>. توفّر وقتًا الآن وتدفع «فوائد» في كل تعديل لاحق.<\/p>", "kw": ["technical debt", "tech debt"]}}, {"t": "Scalability vs Complexity", "html": "<p>التصميم لتحمّل حركة هائلة (massive traffic) يُدخل تعقيدًا كبيرًا: خدمات متعددة، message queues، caching، توزيع البيانات. إذا كان تطبيقك يخدم 200 مستخدم فهذا التعقيد <b>تكلفة بلا فائدة<\/b>.<\/p>\n<p>هذا خطأ شائع يسمّى <b>over-engineering<\/b>: بناء حلّ لمشكلة لا تملكها. ومبدأ <b>YAGNI<\/b> (You Aren't Gonna Need It) يقول: لا تبنِ شيئًا لأنك «قد» تحتاجه يومًا.<\/p>\n<p>لكن الطرف الآخر خطأ أيضًا: تصميم يستحيل توسيعه لاحقًا. الحل الوسط: ابنِ بسيطًا، لكن اجعل الحدود بين الأجزاء واضحة (سنتعلّم ذلك في Decomposition و Coupling) حتى يمكن التوسّع عند الحاجة الفعلية.<\/p>", "q": {"id": "m1l3c4", "type": "sc", "sc": "صديقك يبني نظامًا لورشة نجارة واحدة فيها 5 موظفين، ويريد تقسيمه إلى 8 microservices مع Kubernetes «ليكون جاهزًا لملايين المستخدمين».", "q": "<p>ما تقييمك؟<\/p>", "exp": "<p>حجم المشكلة (5 موظفين) لا يبرّر هذا التعقيد. تطبيق واحد منظّم جيدًا يكفي، ويمكن تقسيمه لاحقًا إذا ظهرت حاجة حقيقية.<\/p>", "opts": ["لا يمكن الحكم دون معرفة لغة البرمجة", "قرار ممتاز لأن microservices دائمًا أفضل", "هذا over-engineering: تعقيد كبير لا يبرّره حجم المشكلة الحالي", "يجب أن يزيد العدد إلى 20 خدمة"], "ans": 2}}, {"t": "Consistency vs Availability", "html": "<p>هذا الـ trade-off يخصّ <b>الأنظمة الموزّعة (distributed systems)<\/b>: أنظمة تعمل على عدة خوادم تتبادل البيانات عبر الشبكة.<\/p>\n<ul><li><b>Consistency<\/b>: كل الخوادم ترى البيانات نفسها في اللحظة نفسها.<\/li><li><b>Availability<\/b>: النظام يردّ على كل طلب حتى لو تعطّلت بعض أجزائه.<\/li><\/ul>\n<p>متى يتعارضان؟ عند انقطاع الاتصال بين الخوادم (<b>network partition<\/b>). عندها أمامك خياران فقط:<\/p>\n<ul><li>ترفض الطلبات حتى يعود الاتصال: تحافظ على consistency وتخسر availability.<\/li><li>تقبل الطلبات محليًا: تحافظ على availability، وقد تختلف البيانات مؤقتًا بين الخوادم.<\/li><\/ul>\n<p>هذه خلاصة <b>CAP theorem<\/b>. مثال: نظام حجز آخر مقعد في طائرة يفضّل consistency (لا نبيع المقعد مرتين). عدّاد «الإعجابات» يفضّل availability (لا بأس أن يتأخر الرقم ثوانيَ).<\/p>\n<div class=\"note\">في نظام يعمل على خادم واحد وقاعدة بيانات واحدة لا يظهر هذا الـ trade-off أصلًا.<\/div>", "q": {"id": "m1l3c5", "type": "mc", "q": "<p>انقطع الاتصال بين فرعَي خوادم لنظام بيع تذاكر، وبقي مقعد واحد. أي تصرّف يدل على تفضيل Consistency؟<\/p>", "exp": "<p>تفضيل consistency يعني عدم قبول عملية قد تجعل البيانات متناقضة، ولو كان الثمن عدم الرد على بعض الطلبات مؤقتًا.<\/p>", "opts": ["السماح لكل فرع ببيع المقعد ثم حل التعارض لاحقًا", "تجاهل الانقطاع ومتابعة العمل كأن شيئًا لم يحدث", "حذف المقعد من النظام", "رفض عمليات البيع مؤقتًا حتى يعود الاتصال لتجنّب بيع المقعد مرتين"], "ans": 3}}, {"t": "Quality Attributes: Performance و Scalability", "html": "<p><b>Quality attributes<\/b> هي صفات تصف <b>جودة<\/b> النظام، وليس وظائفه.<\/p>\n<p><b>Performance<\/b>: سرعة استجابة النظام. تُقاس مثلًا بزمن الاستجابة (response time). ولأن المتوسط يخفي الحالات السيئة نستخدم المئين (percentile): عبارة <span class=\"math\" dir=\"ltr\"><i>p<\/i><sub>95<\/sub> ≤ 800 <span class=\"tx\">ms<\/span><\/span> تعني أن 95% من الطلبات تُجاب في 800 ميلي ثانية أو أقل.<\/p>\n<p><b>Scalability<\/b>: قدرة النظام على تحمّل حِمل متزايد (مستخدمون أكثر، بيانات أكثر) دون انهيار الأداء.<\/p>\n<ul><li><b>Vertical scaling<\/b>: خادم أقوى.<\/li><li><b>Horizontal scaling<\/b>: خوادم أكثر.<\/li><\/ul>\n<p>الفرق بينهما: Performance تسأل «كم هو سريع <b>الآن<\/b>؟»، و Scalability تسأل «هل يبقى مقبولًا <b>عندما يتضاعف<\/b> الحِمل عشر مرات؟». نظام قد يكون سريعًا جدًا مع 10 مستخدمين وينهار مع 1000.<\/p>", "q": {"id": "m1l3c6", "type": "mc", "q": "<p>نظام يستجيب في 100 ms مع 50 مستخدمًا، وفي 9 ثوانٍ مع 5000 مستخدم. ما المشكلة الأساسية؟<\/p>", "exp": "<p>الأداء جيد عند الحِمل الصغير لكنه ينهار عند زيادته، وهذا تعريف ضعف الـ scalability.<\/p>", "opts": ["Scalability ضعيفة: الأداء لا يصمد أمام زيادة الحِمل", "لا توجد مشكلة", "Usability ضعيفة", "Security ضعيفة"], "ans": 0}}, {"t": "Quality Attributes: Reliability و Availability و Maintainability و Security و Usability", "html": "<ul><li><b>Reliability<\/b>: هل يعمل النظام <b>بشكل صحيح<\/b> باستمرار؟ (لا يضيّع حجزًا ولا يحسب مبلغًا خطأ).<\/li><li><b>Availability<\/b>: كم من الوقت يبقى النظام <b>متاحًا<\/b> للاستخدام؟ تُحسب هكذا:<\/li><\/ul>\n<div class=\"mathb\" dir=\"ltr\"><i>A<\/i> = <span class=\"fr\"><span><span class=\"tx\">MTBF<\/span><\/span><span class=\"dn\"><span class=\"tx\">MTBF<\/span> + <span class=\"tx\">MTTR<\/span><\/span><\/span><\/div>\n<p>حيث MTBF متوسط الزمن بين الأعطال و MTTR متوسط زمن الإصلاح. توافر 99.9% يعني توقفًا مسموحًا قدره <span class=\"math\" dir=\"ltr\">365 × 24 × 0.001 ≈ 8.76<\/span> ساعة في السنة.<\/p>\n<ul><li><b>Maintainability<\/b>: ما مدى سهولة تعديل النظام على المطوّرين؟ (هذا محور الدورة كلها).<\/li><li><b>Security<\/b>: ما مدى حماية الموارد والبيانات من الوصول غير المصرّح به؟<\/li><li><b>Usability<\/b>: ما مدى سهولة تعامل المستخدم مع النظام؟<\/li><\/ul>\n<p>فرق دقيق: نظام قد يكون <b>available<\/b> (يردّ دائمًا) لكنه غير <b>reliable<\/b> (يردّ بنتائج خاطئة أحيانًا).<\/p>", "q": {"id": "m1l3c7", "type": "mc", "q": "<p>خدمة تعطّلت في المتوسط كل 99 ساعة، ويستغرق إصلاحها ساعة واحدة. ما قيمة الـ availability حسب <span class=\"math\" dir=\"ltr\"><i>A<\/i> = <span class=\"fr\"><span><span class=\"tx\">MTBF<\/span><\/span><span class=\"dn\"><span class=\"tx\">MTBF<\/span> + <span class=\"tx\">MTTR<\/span><\/span><\/span><\/span>؟<\/p>", "exp": "<p><span class=\"math\" dir=\"ltr\"><i>A<\/i> = <span class=\"fr\"><span>99<\/span><span class=\"dn\">99 + 1<\/span><\/span> = 0.99<\/span> أي 99%.<\/p>", "opts": ["99.9%", "90%", "99%", "100%"], "ans": 2}}, {"t": "تبرير قرارات التصميم", "html": "<p>النتيجة المطلوبة من هذا القسم: أن <b>تبرّر<\/b> قراراتك بدل اختيار تقنية أو معمارية لأنها رائجة.<\/p>\n<p>قالب بسيط للتبرير:<\/p>\n<div class=\"note\">«اخترنا <b>X<\/b> بدل <b>Y<\/b> لأن أولويتنا هي <b>الصفة A<\/b>، ونقبل في المقابل <b>التكلفة B<\/b>، ما دام <b>الشرط C<\/b> صحيحًا».<\/div>\n<p>مثال: «اخترنا تطبيق Django واحدًا بدل microservices لأن أولويتنا سرعة التطوير وسهولة الصيانة لفريق من شخصين، ونقبل أن التوسّع الأفقي للأجزاء منفردة سيكون أصعب، ما دام عدد الوكالات أقل من 100».<\/p>\n<p>تبريرات ضعيفة يجب أن تتجنّبها: «لأن الشركات الكبرى تستخدمه»، «لأنه الأحدث»، «لأنني قرأت أنه best practice». هذه ليست أسبابًا مرتبطة بسياق مشروعك.<\/p>", "q": {"id": "m1l3c8", "type": "mc", "q": "<p>أي تبرير هو الأقوى لاختيار قاعدة بيانات؟<\/p>", "exp": "<p>التبرير القوي يربط القرار بحاجة محدّدة في المشروع ويذكر الثمن المقبول. الشهرة والحداثة ليستا سببين.<\/p>", "opts": ["«اخترنا أحدث قاعدة بيانات ظهرت هذا العام»", "«اخترنا PostgreSQL لأن بياناتنا علائقية ونحتاج transactions تضمن عدم الحجز المزدوج، ونقبل تعقيد إعداد أكبر من SQLite»", "«اخترنا ما استخدمه صديقي في مشروعه»", "«اخترنا MongoDB لأنها مشهورة جدًا»"], "ans": 1}}], "test": [{"id": "m1l3t1", "type": "sc", "sc": "تطبيق داخلي لعيادة صغيرة: 6 مستخدمين، بيانات مرضى حساسة، ومطوّر واحد يصونه.", "q": "<p>ما ترتيب الأولويات الأنسب؟<\/p>", "exp": "<p>البيانات الحساسة تجعل الأمان أولوية، ومطوّر واحد يجعل سهولة الصيانة حيوية. ستة مستخدمين لا يبرّرون استثمارًا في scalability.<\/p>", "opts": ["Scalability لملايين المستخدمين أولًا", "لا حاجة للتفكير في الأولويات", "Performance القصوى على حساب كل شيء", "Security و Maintainability أولًا، أما Scalability العالية فليست أولوية"], "ans": 3}, {"id": "m1l3t2", "type": "tf", "q": "<p>الـ Consistency vs Availability trade-off يظهر في أي برنامج، حتى لو كان يعمل على خادم واحد.<\/p>", "exp": "<p>يظهر في الأنظمة الموزّعة عند انقطاع الشبكة بين أجزائها (network partition)، حسب CAP theorem.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m1l3t3", "type": "mc", "q": "<p>ماذا تعني العبارة <span class=\"math\" dir=\"ltr\"><i>p<\/i><sub>95<\/sub> ≤ 500 <span class=\"tx\">ms<\/span><\/span>؟<\/p>", "exp": "<p>الـ percentile 95 يعني أن 95% من القياسات عند هذه القيمة أو أقل، وهو أدق من المتوسط لأنه يكشف الحالات البطيئة.<\/p>", "opts": ["95 طلبًا فقط مسموح في الثانية", "أسرع طلب يأخذ 500 ms", "متوسط زمن الاستجابة 500 ms", "95% من الطلبات تُجاب خلال 500 ms أو أقل"], "ans": 3}, {"id": "m1l3t4", "type": "sa", "q": "<p>ما اسم المبدأ (اختصار من أربعة أحرف) الذي ينصح بعدم بناء شيء لمجرد أنك قد تحتاجه مستقبلًا؟<\/p>", "exp": "<p>الإجابة: <b>YAGNI<\/b> أي You Aren't Gonna Need It، وهو علاج الـ over-engineering.<\/p>", "kw": ["YAGNI"]}]}, {"t": "المتطلبات والنمذجة المفاهيمية", "intro": "<p>هذا القسم يعلّمك تحويل وصف غامض مثل «أريد نظام حجوزات» إلى متطلبات منظّمة، ثم استخراج الـ objects الأولى منها.<\/p>", "items": [{"t": "Functional Requirements", "html": "<p><b>Functional requirements<\/b> تصف <b>ما يجب أن يفعله<\/b> النظام: وظائف وسلوك يمكن ملاحظته.<\/p>\n<p>أمثلة:<\/p>\n<ul><li>Users can create accounts.<\/li><li>Administrators can add products.<\/li><li>Customers can create orders.<\/li><li>Managers can generate reports.<\/li><li>Employees can update reservation statuses.<\/li><\/ul>\n<p>لاحظ البنية: <b>فاعل<\/b> (من؟) + <b>فعل<\/b> (ماذا يفعل؟) + <b>مفعول<\/b> (على ماذا؟). اختبار سريع: إذا استطعت تحويل العبارة إلى زر أو شاشة أو عملية في النظام فهي غالبًا functional requirement.<\/p>", "q": {"id": "m1l4c1", "type": "mc", "q": "<p>أي عبارة هي functional requirement؟<\/p>", "exp": "<p>تغيير حالة الحجز وظيفة يؤديها النظام. البقية صفات جودة، أي non-functional.<\/p>", "opts": ["«يستطيع الموظف تغيير حالة الحجز إلى Confirmed»", "«يجب أن تُحمَّل الصفحة في أقل من ثانيتين»", "«يجب أن يعمل النظام 99.9% من الوقت»", "«يجب أن يكون الكود سهل الصيانة»"], "ans": 0}}, {"t": "Non-functional Requirements", "html": "<p><b>Non-functional requirements<\/b> تصف <b>صفات<\/b> النظام وقيوده: <b>كيف<\/b> يؤدي وظائفه، وليس ما هي. وهي مرتبطة مباشرة بالـ quality attributes التي درسناها.<\/p>\n<p>أمثلة:<\/p>\n<ul><li>كلمات المرور تُخزَّن بشكل آمن (Security).<\/li><li>النظام يدعم عدة مستخدمين في الوقت نفسه (Scalability).<\/li><li>الموظفون المصرَّح لهم فقط يصلون إلى بيانات العملاء الحساسة (Security).<\/li><\/ul>\n<p><b>قاعدة مهمة<\/b>: يجب أن يكون المتطلب <b>قابلًا للقياس والاختبار<\/b>. عبارة «يستجيب النظام في زمن مقبول» غامضة: مقبول لمن؟ الصياغة الصحيحة:<\/p>\n<div class=\"note\">«95% من عمليات البحث عن الحجوزات تُعرض نتائجها خلال ثانيتين عند وجود 100 مستخدم متزامن».<\/div>\n<p>الآن يمكن اختبار المتطلب والحكم: تحقق أم لا.<\/p>", "q": {"id": "m1l4c2", "type": "mc", "q": "<p>أي صياغة هي الأفضل لـ non-functional requirement؟<\/p>", "exp": "<p>الصياغة الجيدة محدّدة ويمكن التحقق منها. «آمن جدًا» و«سريع» لا يمكن اختبارهما. والخيار الأخير functional.<\/p>", "opts": ["«النظام سريع وسهل»", "«تُخزَّن كلمات المرور بعد hashing بخوارزمية bcrypt، ولا تظهر أبدًا في الـ logs»", "«يستطيع المدير حذف موظف»", "«يجب أن يكون النظام آمنًا جدًا»"], "ans": 1}}, {"t": "User Stories", "html": "<p><b>User Story<\/b> تصف ميزة من وجهة نظر من يستخدم النظام، بالصيغة:<\/p>\n<div class=\"note\">As a <b>[type of user]<\/b>, I want <b>[some functionality]<\/b>, so that <b>[some benefit]<\/b>.<\/div>\n<p>مثال:<\/p>\n<div class=\"note\">As a manager, I want to view all reservations so that I can monitor the agency's activities.<\/div>\n<p>الأجزاء الثلاثة ضرورية:<\/p>\n<ul><li><b>من؟<\/b> يحدّد الصلاحيات والواجهة المناسبة.<\/li><li><b>ماذا؟<\/b> الوظيفة المطلوبة.<\/li><li><b>لماذا؟<\/b> الفائدة. هذا الجزء الأهم ويُهمَل كثيرًا: معرفة الهدف قد تكشف حلًّا أبسط. إذا كان الهدف «مراقبة النشاط» فربما يكفي ملخّص يومي بدل قائمة كاملة.<\/li><\/ul>\n<p>الـ User Story ليست مواصفات كاملة، بل <b>تذكير بمحادثة<\/b> يجب أن تحدث بين المطوّر وصاحب الحاجة.<\/p>", "q": {"id": "m1l4c3", "type": "mc", "q": "<p>أي صيغة هي User Story مكتملة؟<\/p>", "exp": "<p>المكتملة تذكر من (employee) وماذا (cancel) ولماذا (تصبح الغرفة متاحة). الخيار الأخير ينقصه الهدف، والبقية ليست بصيغة story.<\/p>", "opts": ["«As an employee, I want to cancel a reservation so that the room becomes available for other customers»", "«As an employee, I want a cancel button»", "«نظام إلغاء الحجوزات»", "«إضافة زر Cancel في صفحة الحجز»"], "ans": 0}}, {"t": "Acceptance Criteria", "html": "<p><b>Acceptance criteria<\/b> هي الشروط التي تحدّد هل نُفّذت الميزة <b>بشكل صحيح<\/b> أم لا. بدونها تبقى الـ story مفتوحة على التأويل ولا يعرف أحد متى «انتهت».<\/p>\n<p>للـ story «المدير يعرض كل الحجوزات»:<\/p>\n<ol><li>المدير يرى كل الحجوزات.<\/li><li>المدير يستطيع تصفية الحجوزات حسب التاريخ.<\/li><li>المدير يستطيع تصفية الحجوزات حسب الحالة.<\/li><li>المستخدمون غير المصرَّح لهم لا يصلون إلى صفحة إدارة الحجوزات.<\/li><\/ol>\n<p>لاحظ المعيار الرابع: المعايير الجيدة تغطي أيضًا <b>الحالات السلبية<\/b> (ما الذي يجب ألّا يحدث).<\/p>\n<p>صيغة شائعة لكتابتها <b>Given / When / Then<\/b>:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Given  مستخدم ليس مديرًا\nWhen   يحاول فتح صفحة إدارة الحجوزات\nThen   يُرفض الطلب وتظهر رسالة «غير مصرَّح»<\/code><\/pre><\/div>\n<p>كل معيار يتحوّل لاحقًا إلى اختبار (test) شبه مباشر.<\/p>", "q": {"id": "m1l4c4", "type": "tf", "q": "<p>الـ acceptance criteria الجيدة تصف أيضًا ما يجب أن يُمنع، وليس الحالات الناجحة فقط.<\/p>", "exp": "<p>المعايير الجيدة تشمل الحالات السلبية أيضًا، مثل منع غير المصرَّح لهم. إهمالها يترك ثغرات.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "من الـ User Stories إلى الـ Candidate Objects", "html": "<p>كيف نجد الـ objects؟ بتقنية بسيطة: <b>تحليل الأسماء والأفعال (noun/verb analysis)<\/b>.<\/p>\n<ul><li><b>الأسماء (nouns)<\/b> في المتطلبات مرشّحة لتكون <b>classes<\/b> أو attributes.<\/li><li><b>الأفعال (verbs)<\/b> مرشّحة لتكون <b>responsibilities<\/b> (ثم methods).<\/li><\/ul>\n<p>مثال: «As a <b>customer<\/b>, I want to <b>reserve<\/b> a <b>room<\/b> in a <b>hotel<\/b> for specific <b>dates<\/b>».<\/p>\n<ul><li>أسماء: customer, room, hotel, dates، ومن الفعل reserve يظهر مفهوم خفي: <b>reservation<\/b>.<\/li><li>أفعال: reserve.<\/li><\/ul>\n<p>ثم نصفّي القائمة:<\/p>\n<ul><li>هل له بيانات وسلوك خاصان به؟ إذن class (مثل <code dir=\"ltr\">Room<\/code>).<\/li><li>مجرد قيمة بسيطة؟ إذن attribute (مثل <code dir=\"ltr\">dates<\/code> داخل <code dir=\"ltr\">Reservation<\/code>).<\/li><li>خارج النظام أو مكرَّر؟ يُحذف.<\/li><\/ul>\n<p>هذه القائمة <b>مرشّحين<\/b> (candidates) فقط، وليست نهائية. ستتغيّر أثناء العمل ببطاقات CRC.<\/p>", "q": {"id": "m1l4c5", "type": "mc", "q": "<p>في العبارة «The manager generates a monthly report of reservations»، ما المرشّحون ليكونوا classes؟<\/p>", "exp": "<p>الأسماء manager و report و reservation مرشّحة لتكون classes. الفعل generates مرشّح لمسؤولية، و monthly غالبًا attribute للتقرير.<\/p>", "opts": ["Manager و Report و Reservation", "generates فقط", "لا يوجد أي مرشّح", "monthly فقط"], "ans": 0}}, {"t": "Entity Objects", "html": "<p>الـ objects في النظام ليست نوعًا واحدًا. تصنيف شائع يقسمها إلى ثلاث فئات: Entity و Boundary و Control.<\/p>\n<p><b>Entity objects<\/b> تمثّل <b>مفاهيم المجال المهمة<\/b> (business concepts) التي يدور حولها النظام: <code dir=\"ltr\">Customer<\/code>، <code dir=\"ltr\">Product<\/code>، <code dir=\"ltr\">Order<\/code>، <code dir=\"ltr\">Reservation<\/code>.<\/p>\n<p>خصائصها:<\/p>\n<ul><li>تحمل <b>البيانات<\/b> المهمة و<b>قواعد العمل<\/b> المرتبطة بها (مثل: لا يُؤكَّد حجز ملغى).<\/li><li>غالبًا <b>تُحفظ<\/b> في قاعدة البيانات وتعيش طويلًا.<\/li><li>لا تعرف شيئًا عن الواجهة أو HTTP.<\/li><\/ul>\n<p>اختبار: لو شرحت النظام لصاحب الوكالة دون أي مصطلح تقني، فالكلمات التي ستستخدمها (عميل، حجز، غرفة) هي الـ entities.<\/p>", "q": {"id": "m1l4c6", "type": "mc", "q": "<p>أي مما يلي هو Entity object في نظام متجر إلكتروني؟<\/p>", "exp": "<p><code dir=\"ltr\">Product<\/code> مفهوم من مجال العمل يحمل بيانات وقواعد. الصفحات والنماذج boundary، والـ controller هو control.<\/p>", "opts": ["<code dir=\"ltr\">LoginForm<\/code>", "<code dir=\"ltr\">CheckoutPage<\/code>", "<code dir=\"ltr\">OrderController<\/code>", "<code dir=\"ltr\">Product<\/code>"], "ans": 3}}, {"t": "Boundary Objects", "html": "<p><b>Boundary objects<\/b> تتولّى <b>التواصل بين النظام والعالم الخارجي<\/b> (external actors): مستخدمون أو أنظمة أخرى.<\/p>\n<p>أمثلة:<\/p>\n<ul><li>واجهة المستخدم: <code dir=\"ltr\">OrderForm<\/code>، <code dir=\"ltr\">ReservationPage<\/code>.<\/li><li>API endpoints يستدعيها الـ frontend أو تطبيق آخر.<\/li><li>adapter يتحدث مع خدمة خارجية مثل خدمة بريد.<\/li><\/ul>\n<p>مسؤوليتها: استقبال المدخلات، تحويلها إلى شكل يفهمه النظام، وعرض النتائج. و<b>لا<\/b> تحتوي قواعد العمل.<\/p>\n<p>لماذا نفصلها؟ لأن الواجهات تتغيّر كثيرًا (تصميم جديد، تطبيق جوال، API جديد). إذا كانت قواعد العمل داخل الواجهة فكل تغيير شكلي يهدّد المنطق، وستكرّر القواعد في كل واجهة.<\/p>\n<p>في Django مثلًا: الـ views والـ serializers والـ templates هي boundary objects.<\/p>", "q": {"id": "m1l4c7", "type": "tf", "q": "<p>من المناسب وضع قاعدة «لا يُسمح بالحجز في تاريخ ماضٍ» داخل الـ <code dir=\"ltr\">ReservationForm<\/code> فقط، لأنها أول ما يراه المستخدم.<\/p>", "exp": "<p>القاعدة من منطق العمل ويجب أن تعيش في entity أو control. إن وُضعت في الواجهة فقط، فأي واجهة أخرى (API أو تطبيق جوال) ستتجاوزها.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "Control Objects", "html": "<p><b>Control objects<\/b> <b>تنسّق<\/b> تنفيذ عملية (use case) كاملة: تستقبل الطلب من الـ boundary، وتستدعي الـ entities بالترتيب الصحيح، وتعيد النتيجة.<\/p>\n<p>مثال إنشاء طلب: <code dir=\"ltr\">Customer<\/code> (entity) و <code dir=\"ltr\">OrderForm<\/code> (boundary) و <code dir=\"ltr\">OrderController<\/code> (control).<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Order:                                   <span class=\"cm\"># Entity: بيانات وقواعد العمل<\/span>\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, customer_name, items):\n        <span class=\"kw\">if<\/span> <span class=\"kw\">not<\/span> items:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Order must contain at least one item\"<\/span>)\n        <span class=\"kw\">self<\/span>.customer_name = customer_name\n        <span class=\"kw\">self<\/span>.items = items\n\n<span class=\"kw\">class<\/span> OrderController:                         <span class=\"cm\"># Control: تنسيق الـ use case<\/span>\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, repository):\n        <span class=\"kw\">self<\/span>.repository = repository\n\n    <span class=\"kw\">def<\/span> create_order(<span class=\"kw\">self<\/span>, customer_name, items):\n        order = Order(customer_name, items)    <span class=\"cm\"># 1) إنشاء الـ entity<\/span>\n        <span class=\"kw\">self<\/span>.repository.save(order)            <span class=\"cm\"># 2) حفظها<\/span>\n        <span class=\"kw\">return<\/span> order\n\n<span class=\"kw\">class<\/span> OrderForm:                               <span class=\"cm\"># Boundary: التعامل مع المستخدم<\/span>\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, controller):\n        <span class=\"kw\">self<\/span>.controller = controller\n\n    <span class=\"kw\">def<\/span> submit(<span class=\"kw\">self<\/span>, raw_name, raw_items):\n        order = <span class=\"kw\">self<\/span>.controller.create_order(raw_name.strip(), raw_items)\n        print(f<span class=\"st\">\"Order created for {order.customer_name}\"<\/span>)<\/code><\/pre><\/div>\n<p>هذا الفصل يمنع وضع كل منطق التطبيق داخل class واحد أو component واحد ضخم.<\/p>", "q": {"id": "m1l4c8", "type": "mc", "q": "<p>في المثال أعلاه، أين توجد قاعدة «الطلب يجب أن يحتوي عنصرًا واحدًا على الأقل»؟<\/p>", "exp": "<p>القاعدة في constructor الـ <code dir=\"ltr\">Order<\/code>، فتُطبَّق مهما كانت الواجهة التي أنشأت الطلب. الـ controller ينسّق فقط، والـ form يتعامل مع المستخدم.<\/p>", "opts": ["غير موجودة في الكود", "في الـ boundary <code dir=\"ltr\">OrderForm<\/code>", "في الـ control <code dir=\"ltr\">OrderController<\/code>", "في الـ entity <code dir=\"ltr\">Order<\/code>"], "ans": 3}}], "test": [{"id": "m1l4t1", "type": "mc", "q": "<p>صنّف: «يجب أن يدعم النظام 200 مستخدم متزامن دون أن يتجاوز زمن الاستجابة ثانيتين».<\/p>", "exp": "<p>يصف صفة أداء وتحمّل قابلة للقياس، وليس وظيفة يؤديها النظام.<\/p>", "opts": ["User Story", "Functional requirement", "Non-functional requirement", "Acceptance criterion لوظيفة تسجيل الدخول"], "ans": 2}, {"id": "m1l4t2", "type": "sc", "sc": "في نظام مكتبة: <code dir=\"ltr\">Book<\/code> و <code dir=\"ltr\">LoanScreen<\/code> و <code dir=\"ltr\">LoanManager<\/code> الذي يتحقق من توفّر الكتاب ثم يسجّل الإعارة.", "q": "<p>ما التصنيف الصحيح بالترتيب؟<\/p>", "exp": "<p><code dir=\"ltr\">Book<\/code> مفهوم من المجال، <code dir=\"ltr\">LoanScreen<\/code> واجهة مع المستخدم، <code dir=\"ltr\">LoanManager<\/code> ينسّق عملية الإعارة.<\/p>", "opts": ["Boundary ثم Control ثم Entity", "Control ثم Entity ثم Boundary", "Entity ثم Boundary ثم Control", "كلها Entity"], "ans": 2}, {"id": "m1l4t3", "type": "tf", "q": "<p>جزء «so that» في الـ User Story اختياري ويمكن حذفه دائمًا دون خسارة.<\/p>", "exp": "<p>جزء الفائدة يوضّح الهدف الحقيقي، وقد يكشف حلًّا أبسط أو يساعد على ترتيب الأولويات.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m1l4t4", "type": "sa", "q": "<p>في تحليل نص المتطلبات، أي نوع من الكلمات (بالإنجليزية) نبحث عنه لنجد الـ candidate classes؟<\/p>", "exp": "<p>الإجابة: <b>Nouns<\/b> (الأسماء). أما الأفعال (verbs) فترشّح المسؤوليات.<\/p>", "kw": ["noun", "الاسماء", "اسم"]}]}, {"t": "بطاقات CRC", "intro": "<p>أهم تقنية عملية في هذه الوحدة. بطاقات CRC تساعدك على اكتشاف الـ classes وتوزيع المسؤوليات بينها <b>قبل<\/b> كتابة أي كود، بأدوات بسيطة: بطاقات ورقية وقلم.<\/p>", "items": [{"t": "ما هي بطاقة CRC؟", "html": "<p>كل بطاقة تمثّل class واحدًا مرشّحًا، وفيها ثلاثة أجزاء:<\/p>\n<ul><li><b>Class<\/b>: ما الـ object أو المكوّن الذي نصمّمه؟<\/li><li><b>Responsibility<\/b>: ماذا يجب أن يفعل أو يعرف؟<\/li><li><b>Collaborator<\/b>: مع أي classes أخرى يحتاج أن يعمل ليؤدي مسؤولياته؟<\/li><\/ul>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>+----------------------------------------------+\n| Class: Order                                 |\n+---------------------------+------------------+\n| Responsibilities          | Collaborators    |\n| - Store order details     | Customer         |\n| - Calculate the total     | OrderItem        |\n+---------------------------+------------------+<\/code><\/pre><\/div>\n<p>لماذا بطاقة صغيرة؟ لأن صغر المساحة <b>مقصود<\/b>: إذا لم تتّسع البطاقة لمسؤوليات الـ class فهو يفعل أكثر مما ينبغي. ولأن البطاقات رخيصة: تمزيق بطاقة وإعادة كتابتها أسهل بكثير من إعادة كتابة كود.<\/p>", "q": {"id": "m1l5c1", "type": "sa", "q": "<p>ماذا يمثّل الحرف R في اختصار CRC؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Responsibility<\/b>. والاختصار كاملًا: Class, Responsibility, Collaborator.<\/p>", "kw": ["responsibilit"]}}, {"t": "كتابة الـ Responsibilities", "html": "<p>المسؤولية نوعان:<\/p>\n<ul><li><b>Knowing<\/b> (ما يعرفه): «يعرف سعره»، «يحتفظ ببيانات العميل».<\/li><li><b>Doing<\/b> (ما يفعله): «يحسب المجموع»، «يتحقق من توفّر المخزون».<\/li><\/ul>\n<p>قواعد لكتابة مسؤوليات جيدة:<\/p>\n<ul><li>ابدأ بفعل: Store، Calculate، Track، Validate.<\/li><li>اكتب <b>ماذا<\/b> وليس <b>كيف<\/b>: «Calculate the total» وليس «loop over items and sum price × quantity».<\/li><li>ضع المسؤولية عند من <b>يملك المعلومات<\/b> اللازمة لها. من يعرف العناصر وكمياتها؟ الـ <code dir=\"ltr\">Order<\/code>. إذن حساب المجموع مسؤوليته. هذا يسمّى مبدأ <b>Information Expert<\/b>.<\/li><\/ul>\n<p>عدد المسؤوليات مؤشّر مهم: من 2 إلى 4 مسؤوليات مترابطة أمر صحي. عشر مسؤوليات غير مترابطة إنذار.<\/p>", "q": {"id": "m1l5c2", "type": "mc", "q": "<p>من الأنسب لحمل مسؤولية «Calculate the order total»؟<\/p>", "exp": "<p>حسب Information Expert: المسؤولية تذهب لمن يملك المعلومات اللازمة. الـ <code dir=\"ltr\">Order<\/code> يعرف كل عناصره، ويتعاون مع كل <code dir=\"ltr\">OrderItem<\/code> ليعرف مجموعه الفرعي.<\/p>", "opts": ["<code dir=\"ltr\">Product<\/code> لأنه يعرف السعر", "<code dir=\"ltr\">Customer<\/code> لأنه من سيدفع", "<code dir=\"ltr\">Order<\/code> لأنه يملك العناصر وكمياتها", "<code dir=\"ltr\">Inventory<\/code> لأنه يتتبّع المخزون"], "ans": 2}}, {"t": "تحديد الـ Collaborators", "html": "<p><b>Collaborator<\/b> هو class آخر يحتاجه هذا الـ class لينجز إحدى مسؤولياته: يطلب منه معلومة أو يطلب منه تنفيذ شيء.<\/p>\n<p>مثال: <code dir=\"ltr\">Order<\/code> مسؤول عن حساب المجموع، لكنه لا يعرف الأسعار بنفسه. يسأل كل <code dir=\"ltr\">OrderItem<\/code> عن مجموعه الفرعي، والـ <code dir=\"ltr\">OrderItem<\/code> بدوره يسأل <code dir=\"ltr\">Product<\/code> عن السعر. إذن:<\/p>\n<ul><li>collaborators الـ <code dir=\"ltr\">Order<\/code>: <code dir=\"ltr\">OrderItem<\/code>.<\/li><li>collaborators الـ <code dir=\"ltr\">OrderItem<\/code>: <code dir=\"ltr\">Product<\/code>.<\/li><\/ul>\n<p>ملاحظات:<\/p>\n<ul><li>التعاون له <b>اتجاه<\/b>: <code dir=\"ltr\">Order<\/code> يحتاج <code dir=\"ltr\">OrderItem<\/code>، وليس بالضرورة العكس.<\/li><li>class له collaborators كثيرون جدًا مرتبط بنصف النظام، وأي تغيير سيصيبه (سنسمّي هذا tight coupling في الوحدة 3).<\/li><li>class بلا collaborators ولا يتعاون معه أحد: هل هو لازم أصلًا؟<\/li><\/ul>", "q": {"id": "m1l5c3", "type": "tf", "q": "<p>إذا كان <code dir=\"ltr\">Order<\/code> يحتاج <code dir=\"ltr\">OrderItem<\/code> لحساب المجموع، فيجب حتمًا أن يكون <code dir=\"ltr\">Order<\/code> مكتوبًا في collaborators بطاقة <code dir=\"ltr\">OrderItem<\/code> أيضًا.<\/p>", "exp": "<p>التعاون له اتجاه. <code dir=\"ltr\">Order<\/code> يستدعي <code dir=\"ltr\">OrderItem<\/code>، لكن <code dir=\"ltr\">OrderItem<\/code> لا يحتاج بالضرورة أن يعرف الـ <code dir=\"ltr\">Order<\/code> ليؤدي مسؤولياته.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "مثال كامل: تطبيق e-commerce", "html": "<div class=\"tw\"><table><thead><tr><th>Class<\/th><th>Responsibilities<\/th><th>Collaborators<\/th><\/tr><\/thead><tbody><tr><td>Customer<\/td><td>Maintain customer information and initiate orders<\/td><td>Order<\/td><\/tr><tr><td>Order<\/td><td>Store order details and calculate the total<\/td><td>Customer, OrderItem<\/td><\/tr><tr><td>OrderItem<\/td><td>Represent a product and its quantity in an order<\/td><td>Product<\/td><\/tr><tr><td>Product<\/td><td>Store product information and price<\/td><td>(لا أحد)<\/td><\/tr><tr><td>Inventory<\/td><td>Track product stock and update quantities<\/td><td>Product, Order<\/td><\/tr><\/tbody><\/table><\/div>\n<p>كيف نقرأ الجدول؟ صف <code dir=\"ltr\">OrderItem<\/code> يقول: هذا class يمثّل منتجًا وكميته داخل طلب، ويحتاج <code dir=\"ltr\">Product<\/code> ليعرف السعر.<\/p>\n<div class=\"note\">تصحيح صغير على الـ roadmap: هناك كُتب <code dir=\"ltr\">OrderItem<\/code> كـ collaborator للـ <code dir=\"ltr\">Product<\/code>. لكن <code dir=\"ltr\">Product<\/code> لا يحتاج <code dir=\"ltr\">OrderItem<\/code> ليؤدي مسؤوليته (تخزين المعلومات والسعر)، فالأدق تركه بلا collaborators. الاتجاه مهم.<\/div>\n<p>المجموع الكلي للطلب يُحسب بالتعاون:<\/p>\n<div class=\"mathb\" dir=\"ltr\"><span class=\"tx\">total<\/span> = ∑<sub><i>i<\/i> = 1<\/sub><sup><i>n<\/i><\/sup><i>p<\/i><sub><i>i<\/i><\/sub> × <i>q<\/i><sub><i>i<\/i><\/sub><\/div>\n<p>حيث <span class=\"math\" dir=\"ltr\"><i>p<\/i><sub><i>i<\/i><\/sub><\/span> سعر المنتج في العنصر رقم <span class=\"math\" dir=\"ltr\"><i>i<\/i><\/span> و <span class=\"math\" dir=\"ltr\"><i>q<\/i><sub><i>i<\/i><\/sub><\/span> كميته و <span class=\"math\" dir=\"ltr\"><i>n<\/i><\/span> عدد العناصر.<\/p>", "q": {"id": "m1l5c4", "type": "mc", "q": "<p>طلب فيه عنصران: الأول سعره 20 وكميته 3، والثاني سعره 50 وكميته 1. ما قيمة <span class=\"math\" dir=\"ltr\">∑<sub><i>i<\/i> = 1<\/sub><sup><i>n<\/i><\/sup><i>p<\/i><sub><i>i<\/i><\/sub> × <i>q<\/i><sub><i>i<\/i><\/sub><\/span>؟<\/p>", "exp": "<p><span class=\"math\" dir=\"ltr\">20 × 3 + 50 × 1 = 60 + 50 = 110<\/span>.<\/p>", "opts": ["70", "110", "73", "210"], "ans": 1}}, {"t": "اكتشاف الـ God Class", "html": "<p>افترض أنك أنشأت class واحدًا اسمه <code dir=\"ltr\">StoreManager<\/code> يتولّى: Customers و Products و Orders و Payments و Inventory و Reports.<\/p>\n<p>هذا يسمّى <b>God class<\/b>: class «يعرف كل شيء ويفعل كل شيء». مشاكله:<\/p>\n<ul><li><b>صعب الفهم<\/b>: آلاف الأسطر في مكان واحد.<\/li><li><b>صعب التعديل<\/b>: تغيير في التقارير قد يكسر الدفع.<\/li><li><b>صعب الاختبار<\/b>: لا يمكن اختبار جزء دون تجهيز كل شيء.<\/li><li><b>تعارض بين المطوّرين<\/b>: الجميع يعدّل الملف نفسه.<\/li><\/ul>\n<p>بطاقات CRC تكشف المشكلة مبكرًا: حين تحاول كتابة بطاقة <code dir=\"ltr\">StoreManager<\/code> لن تتّسع لمسؤولياته، وستجد كلمة «و» تتكرّر: يدير العملاء <b>و<\/b> المنتجات <b>و<\/b> الطلبات...<\/p>\n<p>العلاج: وزّع المسؤوليات على classes مناسبة، كل واحد حول مفهوم واحد.<\/p>\n<div class=\"note\">إشارات تحذير في الأسماء: <code dir=\"ltr\">Manager<\/code>، <code dir=\"ltr\">Handler<\/code>، <code dir=\"ltr\">Utils<\/code>، <code dir=\"ltr\">System<\/code>. ليست خطأ دائمًا، لكنها تستحق سؤال: «ما مسؤوليته بالتحديد؟».<\/div>", "q": {"id": "m1l5c5", "type": "sc", "sc": "بطاقة class اسمه <code dir=\"ltr\">AgencySystem<\/code> فيها: تسجيل العملاء، إنشاء الحجوزات، حساب الرواتب، إرسال البريد، توليد تقارير PDF.", "q": "<p>ما التشخيص والعلاج؟<\/p>", "exp": "<p>خمس مسؤوليات غير مترابطة في class واحد علامة God class. تغيير الاسم لا يحلّ شيئًا، والعلاج توزيع المسؤوليات.<\/p>", "opts": ["يجب إضافة مسؤوليات أخرى ليكتمل", "المشكلة في الاسم فقط، يكفي تغييره إلى <code dir=\"ltr\">Manager<\/code>", "God class: تُوزَّع مسؤولياته على classes مركّزة مثل <code dir=\"ltr\">Customer<\/code> و <code dir=\"ltr\">Reservation<\/code> و <code dir=\"ltr\">Payroll<\/code> و <code dir=\"ltr\">EmailService<\/code> و <code dir=\"ltr\">ReportService<\/code>", "تصميم ممتاز لأن كل شيء في مكان واحد"], "ans": 2}}, {"t": "تجربة السيناريو بالبطاقات (Role-play)", "html": "<p>بعد كتابة البطاقات، كيف نعرف أن التصميم يعمل؟ نختبره بـ <b>role-play<\/b>: نختار سيناريو (مثل User Story) و«نمثّله» بالبطاقات خطوة خطوة.<\/p>\n<p>سيناريو: «العميل يضيف منتجًا إلى طلبه».<\/p>\n<ol><li><code dir=\"ltr\">Customer<\/code> يطلب من <code dir=\"ltr\">Order<\/code> إضافة منتج بكمية 2.<\/li><li><code dir=\"ltr\">Order<\/code> يسأل <code dir=\"ltr\">Inventory<\/code>: هل الكمية متوفّرة؟<\/li><li><code dir=\"ltr\">Inventory<\/code> يتحقق من مخزون الـ <code dir=\"ltr\">Product<\/code> ويجيب.<\/li><li><code dir=\"ltr\">Order<\/code> ينشئ <code dir=\"ltr\">OrderItem<\/code> جديدًا.<\/li><\/ol>\n<p>أثناء التمثيل تظهر الثغرات:<\/p>\n<ul><li>«من يعرف هذه المعلومة؟» لا أحد: ينقصنا class أو مسؤولية.<\/li><li>«هذا الـ class يحتاج التحدّث مع الجميع»: مسؤولياته كثيرة.<\/li><li>بطاقة لم تُستخدم في أي سيناريو: ربما لا لزوم لها.<\/li><\/ul>\n<p>لاحظ: في الخطوة 2 اكتشفنا أن <code dir=\"ltr\">Order<\/code> يحتاج <code dir=\"ltr\">Inventory<\/code> كـ collaborator، ولم يكن ذلك مكتوبًا في بطاقته. نصحّح البطاقة فورًا. هذه قيمة الـ role-play.<\/p>", "q": {"id": "m1l5c6", "type": "mc", "q": "<p>ما الهدف الأساسي من role-play بالبطاقات؟<\/p>", "exp": "<p>التمثيل يكشف الثغرات (مسؤولية بلا صاحب، class مثقل، class بلا فائدة) والتصحيح ما زال رخيصًا.<\/p>", "opts": ["تزيين البطاقات", "حفظ أسماء الـ classes", "اختبار التصميم على سيناريوهات حقيقية لاكتشاف مسؤوليات أو collaborators ناقصة قبل كتابة الكود", "استبدال كتابة المتطلبات"], "ans": 2}}], "test": [{"id": "m1l5t1", "type": "mc", "q": "<p>ما المكوّنات الثلاثة لبطاقة CRC؟<\/p>", "exp": "<p>CRC اختصار Class-Responsibility-Collaborator.<\/p>", "opts": ["Component و Requirement و Constraint", "Class و Return type و Constructor", "Class و Responsibility و Collaborator", "Class و Relation و Code"], "ans": 2}, {"id": "m1l5t2", "type": "sc", "sc": "بطاقة <code dir=\"ltr\">Reservation<\/code>: المسؤوليات «Know its dates and status؛ Confirm itself»، والـ collaborators: <code dir=\"ltr\">Room<\/code>. أثناء role-play لسيناريو التأكيد تبيّن أن التأكيد يتطلب معرفة أن الدفعة سُجّلت.", "q": "<p>ما التصرف الصحيح؟<\/p>", "exp": "<p>الـ role-play كشف collaborator ناقصًا. نحدّث البطاقة الآن والتعديل رخيص.<\/p>", "opts": ["إضافة <code dir=\"ltr\">Payment<\/code> (أو من يعرف حالة الدفع) إلى collaborators وتحديث البطاقات", "تجاهل الأمر وتركه لوقت كتابة الكود", "نقل كل المسؤوليات إلى class واحد كبير", "حذف مسؤولية التأكيد"], "ans": 0}, {"id": "m1l5t3", "type": "tf", "q": "<p>الأفضل كتابة المسؤولية بصيغة تفصيلية تشرح خوارزمية التنفيذ خطوة بخطوة.<\/p>", "exp": "<p>المسؤولية تصف «ماذا» بإيجاز (مثل Calculate the total). تفاصيل «كيف» تأتي في التصميم التقني والتنفيذ.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m1l5t4", "type": "mc", "q": "<p>class اسمه <code dir=\"ltr\">Utils<\/code> على بطاقته 12 مسؤولية غير مترابطة. ما المؤشّر؟<\/p>", "exp": "<p>ضيق البطاقة مقصود. إن لم تتّسع فالـ class يفعل أكثر مما ينبغي.<\/p>", "opts": ["مسؤوليات كثيرة غير مترابطة: يجب تقسيمه إلى classes مركّزة", "تصميم مثالي يوفّر عدد الملفات", "يحتاج فقط إلى بطاقة أكبر", "يجب دمجه مع class آخر ليكبر أكثر"], "ans": 0}]}, {"t": "ورشة الوحدة 1 واختبارها", "intro": "<p>طبّق كل ما تعلّمته في الوحدة على نظام صغير، ثم اختبر نفسك في الوحدة كاملة. اكتب محاولتك أولًا: الحل النموذجي لا يُفتح إلا بعدها.<\/p>", "items": [{"t": "ورشة عملية: تصميم نظام حجوزات صغير", "task": {"id": "m1l6w1", "t": "ورشة عملية: تصميم نظام حجوزات صغير", "html": "<p><b>المطلوب<\/b>: صمّم نظام إدارة حجوزات لبيت ضيافة صغير (10 غرف، موظف استقبال واحد ومدير).<\/p>\n<ol><li>اكتب من 5 إلى 10 User Stories بالصيغة الكاملة.<\/li><li>حدّد 5 functional requirements و 3 non-functional requirements قابلة للقياس.<\/li><li>استخرج الـ objects الرئيسية (استعمل noun/verb analysis) وصنّفها: Entity أو Boundary أو Control.<\/li><li>اكتب بطاقة CRC لكل class مهم.<\/li><li>حدّد من يتعاون مع من.<\/li><li>راجع: هل يوجد class بمسؤوليات كثيرة؟<\/li><\/ol>", "hints": ["ابدأ بتحديد أنواع المستخدمين: guest و receptionist و manager. لكل نوع story أو اثنتان.", "للـ non-functional فكّر في: زمن الاستجابة، من يرى بيانات الضيوف، ماذا يحدث عند انقطاع الكهرباء (النسخ الاحتياطي).", "الـ entities المتوقعة: Guest و Room و Reservation و Payment. اسأل عن كل واحدة: ماذا تعرف؟ ماذا تفعل؟ ممّن تحتاج مساعدة؟"], "checks": [], "sol": "<h4>1) User Stories (عيّنة)<\/h4>\n<ul><li>As a receptionist, I want to create a reservation for a guest so that the room is held for their dates.<\/li><li>As a receptionist, I want to see which rooms are free for given dates so that I can answer phone inquiries quickly.<\/li><li>As a receptionist, I want to cancel a reservation so that the room becomes available again.<\/li><li>As a receptionist, I want to record a payment so that the reservation can be confirmed.<\/li><li>As a manager, I want to view all reservations filtered by date and status so that I can monitor occupancy.<\/li><li>As a manager, I want a monthly revenue report so that I can track the business.<\/li><\/ul>\n<h4>2) Requirements<\/h4>\n<p><b>Functional<\/b>: إنشاء حجز؛ البحث عن الغرف المتاحة بين تاريخين؛ إلغاء حجز؛ تسجيل دفعة؛ عرض الحجوزات مع التصفية.<\/p>\n<p><b>Non-functional<\/b>:<\/p>\n<ul><li>البحث عن الغرف المتاحة يعيد النتيجة خلال ثانية واحدة في 95% من الحالات.<\/li><li>بيانات الضيوف يراها الموظفون المسجّلون فقط، وكلمات المرور مخزّنة بـ hashing.<\/li><li>نسخة احتياطية يومية تلقائية، مع إمكان الاسترجاع خلال ساعة.<\/li><\/ul>\n<h4>3) Objects<\/h4>\n<ul><li><b>Entity<\/b>: <code dir=\"ltr\">Guest<\/code>، <code dir=\"ltr\">Room<\/code>، <code dir=\"ltr\">Reservation<\/code>، <code dir=\"ltr\">Payment<\/code>.<\/li><li><b>Boundary<\/b>: <code dir=\"ltr\">ReservationForm<\/code>، <code dir=\"ltr\">ReservationListPage<\/code>.<\/li><li><b>Control<\/b>: <code dir=\"ltr\">ReservationService<\/code>، <code dir=\"ltr\">ReportService<\/code>.<\/li><\/ul>\n<h4>4 و 5) CRC Cards<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Class<\/th><th>Responsibilities<\/th><th>Collaborators<\/th><\/tr><\/thead><tbody><tr><td>Guest<\/td><td>Know name and contact details<\/td><td>(لا أحد)<\/td><\/tr><tr><td>Room<\/td><td>Know number and nightly price; tell if it is free for given dates<\/td><td>Reservation<\/td><\/tr><tr><td>Reservation<\/td><td>Know guest, room, dates, status; calculate total price; confirm / cancel itself<\/td><td>Guest, Room, Payment<\/td><\/tr><tr><td>Payment<\/td><td>Know amount and date<\/td><td>(لا أحد)<\/td><\/tr><tr><td>ReservationService<\/td><td>Coordinate creating and cancelling reservations; prevent double booking<\/td><td>Room, Reservation, Guest<\/td><\/tr><tr><td>ReportService<\/td><td>Build occupancy and revenue reports<\/td><td>Reservation, Payment<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>6) المراجعة<\/h4>\n<ul><li>لا يوجد class «يفعل كل شيء»: منطق التقارير مفصول عن منطق الحجز.<\/li><li>لو وضعنا كل شيء في <code dir=\"ltr\">HotelManager<\/code> لحصلنا على God class.<\/li><li>السعر الكلي عند <code dir=\"ltr\">Reservation<\/code> لأنه يعرف التواريخ والغرفة (Information Expert): <span class=\"math\" dir=\"ltr\"><span class=\"tx\">total<\/span> = <span class=\"tx\">nights<\/span> × <span class=\"tx\">price<\/span><\/span>.<\/li><\/ul>"}}], "test": [{"id": "m1l6t1", "type": "mc", "q": "<p>ما الهدف الأساسي من الوحدة 1؟<\/p>", "exp": "<p>الوحدة تبني طريقة التفكير: فهم المتطلبات، تحديد الـ objects، وتوزيع المسؤوليات قبل أي كود.<\/p>", "opts": ["رسم واجهات المستخدم", "حفظ syntax لغة Python", "أن تفكّر في المشكلة ومكوّناتها ومسؤولياتها قبل كتابة الكود", "تعلّم إعداد الخوادم"], "ans": 2}, {"id": "m1l6t2", "type": "sc", "sc": "متطلب: «النظام يجب أن يكون متاحًا».", "q": "<p>ما المشكلة وكيف تُصلحها؟<\/p>", "exp": "<p>الـ non-functional requirement يجب أن يكون قابلًا للقياس والاختبار، بأرقام وشروط واضحة.<\/p>", "opts": ["غير قابل للقياس؛ الإصلاح: «availability لا تقل عن 99.5% شهريًا خلال ساعات العمل»", "لا مشكلة فيه", "يجب حذفه لأنه غير مهم", "يجب تحويله إلى User Story عن المدير"], "ans": 0}, {"id": "m1l6t3", "type": "tf", "q": "<p>قرار «نبني microservices لأن Netflix تفعل ذلك» تبرير معماري سليم.<\/p>", "exp": "<p>التبرير يجب أن يرتبط بسياق مشروعك وأولوياته وقيوده، لا بما تفعله شركة ذات ظروف مختلفة تمامًا.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m1l6t4", "type": "mc", "q": "<p>أي تصنيف صحيح؟<\/p>", "exp": "<p>الـ entity مفهوم المجال، والـ boundary نقطة الاتصال بالخارج، والـ control ينسّق العملية.<\/p>", "opts": ["<code dir=\"ltr\">ReservationService<\/code> هو Entity", "<code dir=\"ltr\">Reservation<\/code> هو Entity، و <code dir=\"ltr\">ReservationAPIEndpoint<\/code> هو Boundary، و <code dir=\"ltr\">ReservationService<\/code> هو Control", "<code dir=\"ltr\">ReservationAPIEndpoint<\/code> هو Control", "<code dir=\"ltr\">Reservation<\/code> هو Boundary"], "ans": 1}, {"id": "m1l6t5", "type": "sa", "q": "<p>ما اسم الـ class السيّئ الذي «يعرف كل شيء ويفعل كل شيء»؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>God class<\/b> (ويسمّى أيضًا God object). بطاقات CRC تكشفه مبكرًا.<\/p>", "kw": ["god"]}]}]}, {"t": "المبادئ الأساسية والنمذجة البنيوية بـ UML Class Diagrams", "g": "تعلّم كيف تنظّم البرنامج في classes جيدة التصميم، وافهم المبادئ الأربعة للـ Object-Oriented Design، ومثّل البنية بصريًا بـ UML ثم ترجمها إلى Python.", "lessons": [{"t": "Abstraction", "intro": "<p>الوحدة 1 علّمتك <b>تحديد<\/b> المكوّنات. هذه الوحدة تعلّمك <b>تنظيمها<\/b> بشكل صحيح. نبدأ بأول مبادئ الـ Object-Oriented Design (OOD) الأربعة: Abstraction ثم Encapsulation ثم Decomposition ثم Generalization.<\/p>", "items": [{"t": "ما هي الـ Abstraction؟", "html": "<p><b>Abstraction<\/b> (التجريد) معناها: إظهار المعلومات والعمليات التي يحتاجها المستخدم فقط، وإخفاء تفاصيل التنفيذ غير الضرورية.<\/p>\n<p>تشبيه: حين تقود سيارة تتعامل مع مقود ودوّاستين. لا تحتاج أن تعرف كيف يُحقن الوقود أو كيف يعمل ناقل الحركة. المقود والدوّاسات هي الـ abstraction، والمحرّك هو التفاصيل المخفية.<\/p>\n<p>مثال برمجي: في تطبيق بنكي تريد تحويل مال بين حسابين. لا يهمك أي عمليات تجري في قاعدة البيانات، بل تحتاج عملية واضحة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>account.transfer_money(destination_account, <span class=\"nu\">100<\/span>)<\/code><\/pre><\/div>\n<p>التنفيذ الداخلي يتكفّل بالتفاصيل: التحقق من الرصيد، الخصم، الإيداع، التسجيل.<\/p>\n<p>الفائدة: تقلّ كمية ما يجب أن تفهمه لتستعمل شيئًا. تفكّر في «ماذا يفعل» دون أن تحمل في ذهنك «كيف يفعل».<\/p>", "q": {"id": "m2l1c1", "type": "mc", "q": "<p>أي مثال يوضّح الـ abstraction؟<\/p>", "exp": "<p>الـ abstraction تقدّم عملية بسيطة واضحة وتخفي التعقيد خلفها.<\/p>", "opts": ["جعل كل المتغيّرات global", "نسخ الدالة نفسها في عشرة ملفات", "كتابة كل منطق التطبيق في ملف واحد", "استدعاء <code dir=\"ltr\">email.send(to, subject, body)<\/code> دون معرفة تفاصيل بروتوكول SMTP"], "ans": 3}}, {"t": "تحديد الخصائص الأساسية (Essential Characteristics)", "html": "<p>التجريد يعني اختيار الخصائص <b>المهمة في هذا السياق<\/b> وتجاهل الباقي. الشخص الواحد في الواقع يُجرَّد بشكل مختلف حسب النظام:<\/p>\n<div class=\"tw\"><table><thead><tr><th>النظام<\/th><th>الـ abstraction<\/th><th>الخصائص المهمة<\/th><\/tr><\/thead><tbody><tr><td>وكالة سفر<\/td><td><code dir=\"ltr\">Customer<\/code><\/td><td>الاسم، رقم الجواز، الحجوزات<\/td><\/tr><tr><td>مستشفى<\/td><td><code dir=\"ltr\">Patient<\/code><\/td><td>فصيلة الدم، التاريخ المرضي<\/td><\/tr><tr><td>جامعة<\/td><td><code dir=\"ltr\">Student<\/code><\/td><td>رقم التسجيل، المواد، الدرجات<\/td><\/tr><\/tbody><\/table><\/div>\n<p>لون عيني العميل حقيقة موجودة، لكنه لا يهم وكالة السفر، فلا يدخل في الـ <code dir=\"ltr\">Customer<\/code>.<\/p>\n<p>قاعدتان:<\/p>\n<ul><li><b>السياق يحدّد التجريد<\/b>: اسأل «ما الذي يحتاجه <b>هذا النظام<\/b> من هذا المفهوم؟».<\/li><li>التجريد الجيد <b>يحذف<\/b> بقدر ما <b>يُبقي<\/b>. class فيه 40 attribute «للاحتياط» تجريد ضعيف.<\/li><\/ul>", "q": {"id": "m2l1c2", "type": "sc", "sc": "تصمّم class اسمه <code dir=\"ltr\">Room<\/code> لنظام حجوزات فندق.", "q": "<p>أي مجموعة attributes تمثّل تجريدًا مناسبًا؟<\/p>", "exp": "<p>نظام الحجوزات يحتاج ما يؤثّر في الحجز والتسعير فقط. بقية التفاصيل حقيقية لكنها خارج السياق.<\/p>", "opts": ["كل ما يمكن معرفته عن الغرفة دون استثناء", "لون الجدران، ماركة المصابيح، تاريخ آخر دهان، وزن الباب", "رقم الغرفة، عدد الأسرّة، السعر لليلة", "اسم مهندس البناء ونوع الإسمنت"], "ans": 2}}, {"t": "فصل «ماذا يفعل» عن «كيف يفعل»", "html": "<p>كل abstraction لها وجهان:<\/p>\n<ul><li><b>Interface<\/b> (الواجهة): <b>ماذا<\/b> يستطيع الـ object أن يفعل؟ أي العمليات المتاحة للخارج.<\/li><li><b>Implementation<\/b> (التنفيذ): <b>كيف<\/b> يفعل ذلك داخليًا.<\/li><\/ul>\n<p>مستخدمو الـ class يعتمدون على الـ interface فقط. ما دامت الواجهة ثابتة يمكن تغيير التنفيذ بحرية دون أن يتأثر أحد.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> PriceList:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._prices = {}            <span class=\"cm\"># تفصيل تنفيذي: dictionary<\/span>\n\n    <span class=\"kw\">def<\/span> set_price(<span class=\"kw\">self<\/span>, product: str, price: float) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._prices[product] = price\n\n    <span class=\"kw\">def<\/span> price_of(<span class=\"kw\">self<\/span>, product: str) -&gt; float:\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._prices[product]<\/code><\/pre><\/div>\n<p>إذا قررنا غدًا تخزين الأسعار في قاعدة بيانات بدل dictionary، يتغيّر داخل الـ class فقط. كل كود يستدعي <code dir=\"ltr\">price_of(\"tea\")<\/code> يبقى كما هو.<\/p>\n<div class=\"note\">كلمة interface هنا بمعناها العام: مجموعة العمليات المتاحة. سنرى بعد قليل معناها الأخص كنوع (type) بلا تنفيذ.<\/div>", "q": {"id": "m2l1c3", "type": "tf", "q": "<p>إذا تغيّر التنفيذ الداخلي لـ method وبقي اسمها ومدخلاتها ومخرجاتها كما هي، فلا حاجة إلى تعديل الكود الذي يستدعيها.<\/p>", "exp": "<p>المستدعون يعتمدون على الـ interface (الاسم والمدخلات والمخرجات والسلوك المتوقع)، وليس على التنفيذ. هذه بالضبط فائدة الفصل.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "الـ Abstract Classes في Python", "html": "<p><b>Abstract class<\/b> هو class يعرّف «ماذا» يجب أن تفعله أنواع متعددة ويترك «كيف» (كليًا أو جزئيًا) للـ subclasses. لا يمكن إنشاء object منه مباشرة.<\/p>\n<p>في Python نستخدم module اسمه <code dir=\"ltr\">abc<\/code> (Abstract Base Classes):<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> abc <span class=\"kw\">import<\/span> ABC, abstractmethod\n\n<span class=\"kw\">class<\/span> PaymentMethod(ABC):\n    <span class=\"dc\">@abstractmethod<\/span>\n    <span class=\"kw\">def<\/span> pay(<span class=\"kw\">self<\/span>, amount: float) -&gt; str:\n        <span class=\"st\">\"\"\"Process a payment and return a receipt text.\"\"\"<\/span>\n\n    <span class=\"kw\">def<\/span> describe(<span class=\"kw\">self<\/span>) -&gt; str:              <span class=\"cm\"># method عادية مشتركة<\/span>\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"Payment via {type(self).__name__}\"<\/span>\n\n<span class=\"kw\">cl
