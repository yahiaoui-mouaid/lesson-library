ass<\/span> CashPayment(PaymentMethod):\n    <span class=\"kw\">def<\/span> pay(<span class=\"kw\">self<\/span>, amount: float) -&gt; str:\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"Cash received: {amount}\"<\/span>\n\nprint(CashPayment().pay(<span class=\"nu\">50<\/span>))     <span class=\"cm\"># Cash received: 50<\/span>\n<span class=\"cm\"># PaymentMethod()                # TypeError: Can't instantiate abstract class<\/span><\/code><\/pre><\/div>\n<ul><li><code dir=\"ltr\">ABC<\/code>: يجعل الـ class مجرّدًا.<\/li><li><code dir=\"ltr\">@abstractmethod<\/code>: يعلن method بلا تنفيذ <b>يجب<\/b> على كل subclass أن ينفّذها.<\/li><li>الـ abstract class يمكن أن يحتوي أيضًا methods عادية مشتركة مثل <code dir=\"ltr\">describe<\/code>.<\/li><\/ul>", "q": {"id": "m2l1c4", "type": "mc", "q": "<p>ماذا يحدث عند تنفيذ <code dir=\"ltr\">PaymentMethod()<\/code> في الكود أعلاه؟<\/p>", "exp": "<p>لا يمكن إنشاء instance من class يرث <code dir=\"ltr\">ABC<\/code> وفيه <code dir=\"ltr\">@abstractmethod<\/code> غير منفّذة. هذا يضمن ألّا يوجد object ناقص السلوك.<\/p>", "opts": ["يُنشأ object عادي", "يُرفع <code dir=\"ltr\">TypeError<\/code> لأن الـ class يحتوي abstract method غير منفّذة", "تُستدعى <code dir=\"ltr\">CashPayment<\/code> تلقائيًا", "يُعاد <code dir=\"ltr\">None<\/code>"], "ans": 1}}, {"t": "الـ Interfaces في Python: Protocol و Duck Typing", "html": "<p><b>Interface<\/b> نوع يحدّد <b>عمليات فقط<\/b> دون أي تنفيذ أو بيانات: عقد يقول «من يريد أن يُعامل كـ X يجب أن يوفّر هذه الـ methods».<\/p>\n<p>Python <b>لا تملك كلمة <code dir=\"ltr\">interface<\/code><\/b> كما في Java. لديها ثلاث طرق:<\/p>\n<ol><li><b>Duck typing<\/b>: «إذا كان يمشي كالبطة ويصيح كالبطة فهو بطة». أي object يملك الـ method المطلوبة يصلح، دون إعلان.<\/li><li><b>ABC بكل methods مجرّدة<\/b>: interface صريحة بالوراثة.<\/li><li><b><code dir=\"ltr\">typing.Protocol<\/code><\/b>: interface صريحة <b>بلا وراثة<\/b>، تتحقق منها أدوات فحص الأنواع مثل mypy.<\/li><\/ol>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> typing <span class=\"kw\">import<\/span> Protocol\n\n<span class=\"kw\">class<\/span> Notifier(Protocol):\n    <span class=\"kw\">def<\/span> send(<span class=\"kw\">self<\/span>, to: str, message: str) -&gt; <span class=\"kw\">None<\/span>: ...\n\n<span class=\"kw\">class<\/span> EmailNotifier:                 <span class=\"cm\"># لا يرث من Notifier<\/span>\n    <span class=\"kw\">def<\/span> send(<span class=\"kw\">self<\/span>, to: str, message: str) -&gt; <span class=\"kw\">None<\/span>:\n        print(f<span class=\"st\">\"Email to {to}: {message}\"<\/span>)\n\n<span class=\"kw\">def<\/span> notify_customer(notifier: Notifier, name: str) -&gt; <span class=\"kw\">None<\/span>:\n    notifier.send(name, <span class=\"st\">\"Your reservation is confirmed\"<\/span>)\n\nnotify_customer(EmailNotifier(), <span class=\"st\">\"Sara\"<\/span>)   <span class=\"cm\"># يعمل: له method اسمها send بالتوقيع نفسه<\/span><\/code><\/pre><\/div>\n<p>متى أختار؟ استعمل <code dir=\"ltr\">ABC<\/code> حين يوجد <b>كود مشترك<\/b> ترثه الأنواع. استعمل <code dir=\"ltr\">Protocol<\/code> حين تريد <b>عقدًا<\/b> فقط.<\/p>", "q": {"id": "m2l1c5", "type": "mc", "q": "<p>ما الذي يميّز <code dir=\"ltr\">typing.Protocol<\/code> عن <code dir=\"ltr\">ABC<\/code>؟<\/p>", "exp": "<p>الـ Protocol يعتمد structural typing: المطابقة بالشكل (الـ methods الموجودة) وليس بالوراثة المعلنة.<\/p>", "opts": ["لا فرق بينهما", "الـ Protocol يمنع تعريف أي method", "الـ class يحقق الـ Protocol بمجرد امتلاك الـ methods المطلوبة، دون أن يرث منه", "الـ Protocol يعمل في Java فقط"], "ans": 2}}, {"t": "تمثيل الـ Abstraction في UML", "html": "<p>في UML Class Diagram (سندرسه بالتفصيل في القسم 2.5) تُمثَّل التجريدات هكذا:<\/p>\n<ul><li><b>Abstract class<\/b>: اسمه بخط <b>مائل (italic)<\/b>، أو يُكتب فوقه <code dir=\"ltr\">«abstract»<\/code> أو بجانبه <code dir=\"ltr\">{abstract}<\/code>. والـ abstract methods مائلة أيضًا.<\/li><li><b>Interface<\/b>: صندوق فوق اسمه الكلمة <code dir=\"ltr\">«interface»<\/code>، ويحتوي عمليات فقط دون attributes.<\/li><\/ul>\n<p>الكلمة بين العلامتين <code dir=\"ltr\">« »<\/code> تسمّى <b>stereotype<\/b>: وسم يوضّح نوع العنصر.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>+---------------------+        +----------------------+\n|     «abstract»      |        |     «interface»      |\n|    PaymentMethod    |        |       Notifier       |\n+---------------------+        +----------------------+\n| + pay(amount): str  |        | + send(to, message)  |\n| + describe(): str   |        +----------------------+\n+---------------------+<\/code><\/pre><\/div>\n<p>عند القراءة: إذا رأيت اسمًا مائلًا أو <code dir=\"ltr\">«abstract»<\/code> فاعلم أنه لا يُنشأ منه object مباشرة. وإذا رأيت <code dir=\"ltr\">«interface»<\/code> فهو عقد بلا تنفيذ.<\/p>", "q": {"id": "m2l1c6", "type": "sa", "q": "<p>ما الكلمة التي تُكتب بين العلامتين « » فوق اسم الصندوق في UML لتدل على أنه عقد يحتوي عمليات فقط بلا تنفيذ؟<\/p>", "exp": "<p>الإجابة: <b>«interface»<\/b>. وتسمّى هذه الوسوم stereotypes.<\/p>", "kw": ["interface"]}}], "test": [{"id": "m2l1t1", "type": "sc", "sc": "فريقك يكتب <code dir=\"ltr\">ReportService<\/code> يحتاج إرسال التقرير بالبريد اليوم، وربما عبر WhatsApp لاحقًا.", "q": "<p>ما التصميم الذي يطبّق الـ abstraction؟<\/p>", "exp": "<p>الاعتماد على «ماذا» (send) بدل «كيف» (SMTP أو WhatsApp) يجعل إضافة قناة جديدة لا تمسّ <code dir=\"ltr\">ReportService<\/code>.<\/p>", "opts": ["ينسخ <code dir=\"ltr\">ReportService<\/code> مرتين، نسخة لكل قناة", "يكتب كود SMTP مباشرة داخل <code dir=\"ltr\">ReportService<\/code>", "يعتمد <code dir=\"ltr\">ReportService<\/code> على interface اسمها <code dir=\"ltr\">Notifier<\/code> فيها <code dir=\"ltr\">send<\/code>، ولكل قناة class ينفّذها", "يضع شرط <code dir=\"ltr\">if channel == ...<\/code> في كل مكان يُرسل فيه تقرير"], "ans": 2}, {"id": "m2l1t2", "type": "tf", "q": "<p>الـ abstract class في Python يمكن أن يحتوي methods عادية منفّذة بجانب الـ abstract methods.<\/p>", "exp": "<p>نعم، وهذا فرقه عن الـ interface الصرفة: يمكنه حمل كود مشترك ترثه الـ subclasses.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m2l1t3", "type": "mc", "q": "<p>لماذا لا يحتوي <code dir=\"ltr\">Customer<\/code> في نظام وكالة سفر على attribute لفصيلة الدم؟<\/p>", "exp": "<p>السياق يحدّد التجريد. فصيلة الدم مهمة لمستشفى وليست لوكالة سفر.<\/p>", "opts": ["لأن التجريد يُبقي الخصائص المهمة لسياق النظام فقط", "لأن Python لا تسمح بذلك", "لأن عدد الـ attributes يجب ألّا يتجاوز ثلاثة", "لأن فصيلة الدم ليست معلومة حقيقية"], "ans": 0}, {"id": "m2l1t4", "type": "sa", "q": "<p>ما اسم الـ decorator الذي يعلن في Python أن method يجب تنفيذها في كل subclass؟<\/p>", "exp": "<p>الإجابة: <b><code dir=\"ltr\">@abstractmethod<\/code><\/b> من module <code dir=\"ltr\">abc<\/code>.<\/p>", "kw": ["abstractmethod"]}]}, {"t": "Encapsulation", "intro": "<p>المبدأ الثاني. الـ abstraction تحدّد ماذا يُظهر الـ object، والـ encapsulation تحمي ما بداخله.<\/p>", "items": [{"t": "ما هي الـ Encapsulation؟", "html": "<p><b>Encapsulation<\/b> (التغليف) معناها شيئان معًا:<\/p>\n<ol><li><b>تجميع<\/b> البيانات والعمليات التي تدير تلك البيانات في وحدة واحدة (الـ class).<\/li><li><b>التحكم في الوصول<\/b> إلى الحالة الداخلية (internal state)، أي قيم الـ attributes.<\/li><\/ol>\n<p>تشبيه: آلة الصرّاف (ATM). النقود في الداخل، وأنت لا تمدّ يدك إليها. تطلب عبر واجهة محدّدة، والآلة تتحقق ثم تعطيك.<\/p>\n<p>مثال <code dir=\"ltr\">BankAccount<\/code>: يجب ألّا يستطيع أي كود خارجي تغيير الرصيد مباشرة. بدل ذلك نوفّر عمليات مضبوطة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>account.deposit(<span class=\"nu\">100<\/span>)\naccount.withdraw(<span class=\"nu\">50<\/span>)<\/code><\/pre><\/div>\n<p>الـ class نفسه يتحكم في <b>كيف<\/b> يتغيّر الرصيد، فيستطيع فرض القواعد في مكان واحد.<\/p>", "q": {"id": "m2l2c1", "type": "mc", "q": "<p>ما الوصف الأدق للـ encapsulation؟<\/p>", "exp": "<p>شقّان متلازمان: التجميع (bundling) والتحكم في الوصول (access control).<\/p>", "opts": ["جعل كل شيء public لتسهيل الاستخدام", "وضع كل classes في ملف واحد", "تجميع البيانات مع العمليات التي تديرها، والتحكم في الوصول إلى الحالة الداخلية", "وراثة class من class آخر"], "ans": 2}}, {"t": "Public و Private Attributes في Python", "html": "<p>في UML ولغات مثل Java توجد <b>access modifiers<\/b> صارمة: <code dir=\"ltr\">public<\/code> و <code dir=\"ltr\">private<\/code> و <code dir=\"ltr\">protected<\/code>. Python مختلفة: <b>لا تمنع الوصول فعليًا<\/b>، بل تعتمد على <b>اصطلاحات<\/b> في التسمية:<\/p>\n<div class=\"tw\"><table><thead><tr><th>الكتابة<\/th><th>المعنى<\/th><th>ماذا يحدث فعليًا<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">balance<\/code><\/td><td>public<\/td><td>متاح للجميع<\/td><\/tr><tr><td><code dir=\"ltr\">_balance<\/code><\/td><td>protected / internal بالاصطلاح<\/td><td>يمكن الوصول إليه، لكن الشرطة تقول: «شأن داخلي، لا تلمسه من الخارج»<\/td><\/tr><tr><td><code dir=\"ltr\">__balance<\/code><\/td><td>private<\/td><td>Python تغيّر اسمه داخليًا إلى <code dir=\"ltr\">_BankAccount__balance<\/code> (هذا يسمّى <b>name mangling<\/b>) فيصعب الوصول إليه خطأً<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> BankAccount:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, owner: str):\n        <span class=\"kw\">self<\/span>.owner = owner        <span class=\"cm\"># public<\/span>\n        <span class=\"kw\">self<\/span>._balance = <span class=\"nu\">0<\/span>         <span class=\"cm\"># internal by convention<\/span>\n\nacc = BankAccount(<span class=\"st\">\"Sara\"<\/span>)\nprint(acc.owner)                  <span class=\"cm\"># مقبول<\/span>\nprint(acc._balance)               <span class=\"cm\"># يعمل تقنيًا، لكنه مخالفة للاصطلاح<\/span><\/code><\/pre><\/div>\n<p>فلسفة Python: «كلنا بالغون هنا». الحماية بالاتفاق لا بالقفل. عمليًا أكثر ما يُستخدم هو الشرطة الواحدة <code dir=\"ltr\">_<\/code>.<\/p>", "q": {"id": "m2l2c2", "type": "mc", "q": "<p>ماذا تعني الشرطة السفلية الواحدة في بداية <code dir=\"ltr\">self._balance<\/code>؟<\/p>", "exp": "<p>الشرطة الواحدة اصطلاح فقط. Python لا تمنع الوصول، لكن المبرمجين يحترمون الإشارة.<\/p>", "opts": ["اصطلاح يقول إن هذا attribute داخلي ولا ينبغي استعماله من خارج الـ class", "تجعله ثابتًا لا يتغيّر", "تحذفه عند نهاية الدالة", "تجعل Python الوصول إليه مستحيلًا تمامًا"], "ans": 0}}, {"t": "Public و Private Methods", "html": "<p>الأمر نفسه ينطبق على الـ methods:<\/p>\n<ul><li><b>Public methods<\/b>: واجهة الـ class التي يستعملها الآخرون. يجب أن تكون قليلة وواضحة ومستقرة.<\/li><li><b>Private methods<\/b> (تبدأ بـ <code dir=\"ltr\">_<\/code>): خطوات مساعدة داخلية، يحق لك تغييرها أو حذفها متى شئت.<\/li><\/ul>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> BankAccount:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._balance = <span class=\"nu\">0<\/span>\n        <span class=\"kw\">self<\/span>._history = []\n\n    <span class=\"kw\">def<\/span> deposit(<span class=\"kw\">self<\/span>, amount: float) -&gt; <span class=\"kw\">None<\/span>:        <span class=\"cm\"># public<\/span>\n        <span class=\"kw\">self<\/span>._check_positive(amount)\n        <span class=\"kw\">self<\/span>._balance += amount\n        <span class=\"kw\">self<\/span>._record(<span class=\"st\">\"deposit\"<\/span>, amount)\n\n    <span class=\"kw\">def<\/span> _check_positive(<span class=\"kw\">self<\/span>, amount: float) -&gt; <span class=\"kw\">None<\/span>:    <span class=\"cm\"># private helper<\/span>\n        <span class=\"kw\">if<\/span> amount &lt;= <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Amount must be positive\"<\/span>)\n\n    <span class=\"kw\">def<\/span> _record(<span class=\"kw\">self<\/span>, kind: str, amount: float) -&gt; <span class=\"kw\">None<\/span>:  <span class=\"cm\"># private helper<\/span>\n        <span class=\"kw\">self<\/span>._history.append((kind, amount))<\/code><\/pre><\/div>\n<p>القاعدة: اجعل كل شيء <b>داخليًا افتراضيًا<\/b>، ولا تجعل شيئًا public إلا إذا احتاجه الخارج فعلًا. كل method عامة هي <b>وعد<\/b> يصعب التراجع عنه، لأن غيرك سيعتمد عليها.<\/p>", "q": {"id": "m2l2c3", "type": "tf", "q": "<p>من الأفضل جعل كل الـ methods المساعدة public «للاحتياط»، فقد يحتاجها أحد.<\/p>", "exp": "<p>كل method عامة تصبح جزءًا من الواجهة التي يعتمد عليها الآخرون، فيصعب تغييرها. الأصل أن تبقى المساعدات داخلية.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}, {"t": "Getters و Setters والـ property", "html": "<p><b>Getter<\/b>: method تقرأ قيمة attribute. <b>Setter<\/b>: method تغيّرها. في Java تُكتب <code dir=\"ltr\">getBalance()<\/code> و <code dir=\"ltr\">setBalance()<\/code>.<\/p>\n<p>في Python لا نكتب getters و setters بهذا الشكل. نبدأ بـ attribute عادي، وإذا احتجنا تحكمًا نستخدم <b><code dir=\"ltr\">@property<\/code><\/b>: تبدو من الخارج كـ attribute، وتعمل من الداخل كـ method.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Product:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str, price: float):\n        <span class=\"kw\">self<\/span>.name = name\n        <span class=\"kw\">self<\/span>.price = price            <span class=\"cm\"># يمرّ عبر الـ setter أدناه<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> price(<span class=\"kw\">self<\/span>) -&gt; float:         <span class=\"cm\"># getter<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._price\n\n    <span class=\"dc\">@price.setter<\/span>\n    <span class=\"kw\">def<\/span> price(<span class=\"kw\">self<\/span>, value: float) -&gt; <span class=\"kw\">None<\/span>:   <span class=\"cm\"># setter مع تحقق<\/span>\n        <span class=\"kw\">if<\/span> value &lt; <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Price cannot be negative\"<\/span>)\n        <span class=\"kw\">self<\/span>._price = value\n\np = Product(<span class=\"st\">\"Tea\"<\/span>, <span class=\"nu\">10<\/span>)\np.price = <span class=\"nu\">12<\/span>          <span class=\"cm\"># يستدعي الـ setter<\/span>\nprint(p.price)        <span class=\"cm\"># 12  (يستدعي الـ getter)<\/span>\n<span class=\"cm\"># p.price = -5        # ValueError<\/span><\/code><\/pre><\/div>\n<p>property بلا setter تعطي attribute <b>للقراءة فقط<\/b> (read-only)، وهذا كثيرًا ما تحتاجه.<\/p>\n<div class=\"note\">تحذير: getter و setter لكل attribute دون أي منطق ليس encapsulation حقيقيًا. أنت فقط فتحت البيانات بطريقة أطول.<\/div>", "q": {"id": "m2l2c4", "type": "mc", "q": "<p>في الكود أعلاه، ماذا يحدث عند تنفيذ <code dir=\"ltr\">p.price = -5<\/code>؟<\/p>", "exp": "<p>الإسناد إلى property يستدعي الـ method المزيّنة بـ <code dir=\"ltr\">@price.setter<\/code>، وهي تتحقق من القيمة قبل التخزين.<\/p>", "opts": ["لا يحدث شيء", "يُنشأ attribute جديد اسمه <code dir=\"ltr\">price<\/code> بجانب <code dir=\"ltr\">_price<\/code>", "تُخزَّن القيمة −5 مباشرة", "يُستدعى الـ setter فيرفع <code dir=\"ltr\">ValueError<\/code>"], "ans": 3}}, {"t": "Data Validation وحماية الـ object من الحالات غير الصحيحة", "html": "<p><b>Invariant<\/b> (ثابت) هو شرط يجب أن يبقى صحيحًا طوال حياة الـ object. مثال: «رصيد الحساب لا يكون سالبًا» (إلا إذا سمحت قواعد العمل صراحة بالسحب على المكشوف overdraft).<\/p>\n<p>الـ encapsulation تضمن الـ invariant لأن <b>كل<\/b> تغيير يمرّ عبر methods تتحقق منه:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> BankAccount:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, owner: str):\n        <span class=\"kw\">self<\/span>.owner = owner\n        <span class=\"kw\">self<\/span>._balance = <span class=\"nu\">0.0<\/span>\n\n    <span class=\"dc\">@property<\/span>\n    <span class=\"kw\">def<\/span> balance(<span class=\"kw\">self<\/span>) -&gt; float:          <span class=\"cm\"># read-only<\/span>\n        <span class=\"kw\">return<\/span> <span class=\"kw\">self<\/span>._balance\n\n    <span class=\"kw\">def<\/span> deposit(<span class=\"kw\">self<\/span>, amount: float) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">if<\/span> amount &lt;= <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Deposit must be positive\"<\/span>)\n        <span class=\"kw\">self<\/span>._balance += amount\n\n    <span class=\"kw\">def<\/span> withdraw(<span class=\"kw\">self<\/span>, amount: float) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">if<\/span> amount &lt;= <span class=\"nu\">0<\/span>:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Withdrawal must be positive\"<\/span>)\n        <span class=\"kw\">if<\/span> amount &gt; <span class=\"kw\">self<\/span>._balance:\n            <span class=\"kw\">raise<\/span> ValueError(<span class=\"st\">\"Insufficient funds\"<\/span>)\n        <span class=\"kw\">self<\/span>._balance -= amount<\/code><\/pre><\/div>\n<p>يُكتب الـ invariant رياضيًا: <span class=\"math\" dir=\"ltr\"><span class=\"tx\">balance<\/span> ≥ 0<\/span>. لا توجد طريقة (تحترم الاصطلاح) تجعل الـ object في <b>invalid state<\/b>. والـ validation يبدأ من <code dir=\"ltr\">__init__<\/code>: لا تسمح بإنشاء object غير صالح أصلًا.<\/p>", "q": {"id": "m2l2c5", "type": "mc", "q": "<p>حساب رصيده 100. نُفّذ <code dir=\"ltr\">acc.withdraw(150)<\/code> على الكود أعلاه. ما النتيجة؟<\/p>", "exp": "<p>الشرط <code dir=\"ltr\">amount &gt; self._balance<\/code> صحيح فيُرفع الاستثناء <b>قبل<\/b> أي تعديل، فيبقى الـ invariant محفوظًا.<\/p>", "opts": ["يصبح الرصيد −50", "يُسحب 100 فقط", "يصبح الرصيد 0", "يُرفع <code dir=\"ltr\">ValueError(\"Insufficient funds\")<\/code> ويبقى الرصيد 100"], "ans": 3}}, {"t": "لماذا تهمّ الـ Encapsulation؟", "html": "<p>بدون encapsulation تستطيع أجزاء مختلفة من التطبيق تعديل بيانات الـ object مباشرة:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>account.balance = account.balance - <span class=\"nu\">500<\/span>     <span class=\"cm\"># في ملف<\/span>\naccount.balance -= fee                      <span class=\"cm\"># في ملف آخر، بلا أي تحقق<\/span><\/code><\/pre><\/div>\n<p>النتائج:<\/p>\n<ul><li><b>حالات متناقضة أو غير صالحة<\/b>: رصيد سالب دون أن يعرف أحد من أين جاء.<\/li><li><b>قواعد مكرّرة<\/b>: التحقق «هل الرصيد كافٍ؟» منسوخ في عشرة أماكن، وسيُنسى في الحادي عشر.<\/li><li><b>صعوبة التغيير<\/b>: لتضيف قاعدة جديدة (حد يومي للسحب) يجب أن تجد كل موضع يعدّل الرصيد.<\/li><\/ul>\n<p>مع الـ encapsulation توضع القاعدة في <code dir=\"ltr\">withdraw<\/code> <b>مرة واحدة<\/b>، ويستحيل تجاوزها عبر الواجهة.<\/p>\n<p>تذكّر مثال القسم 1.2 حين غيّرت <code dir=\"ltr\">Reservation<\/code> القيمة <code dir=\"ltr\">room.reserved<\/code> مباشرة. الإصلاح: أن يوفّر <code dir=\"ltr\">Room<\/code> method مثل <code dir=\"ltr\">room.reserve()<\/code> تتحقق وتغيّر حالتها بنفسها. هذا يسمّى أحيانًا <b>Tell, Don't Ask<\/b>: اطلب من الـ object أن يفعل، ولا تسحب بياناته لتفعل أنت عنه.<\/p>", "q": {"id": "m2l2c6", "type": "sc", "sc": "في مشروع، الحقل <code dir=\"ltr\">order.status<\/code> يُعدَّل مباشرة من 14 ملفًا. ظهر طلب في حالة \"shipped\" مع أنه لم يُدفع.", "q": "<p>ما العلاج الجذري؟<\/p>", "exp": "<p>القاعدة يجب أن تعيش في مكان واحد داخل الـ class الذي يملك البيانات، فلا يمكن تجاوزها.<\/p>", "opts": ["حذف حالة shipped من النظام", "جعل الحالة داخلية وتغييرها فقط عبر methods مثل <code dir=\"ltr\">order.ship()<\/code> تتحقق من الشروط", "إضافة التحقق نفسه يدويًا في الملفات الأربعة عشر", "إضافة تعليق يطلب من المطوّرين الانتباه"], "ans": 1}}], "test": [{"id": "m2l2t1", "type": "mc", "q": "<p>أي سطر يخالف اصطلاح الـ encapsulation في Python؟<\/p>", "exp": "<p>التعديل المباشر على attribute يبدأ بـ <code dir=\"ltr\">_<\/code> من الخارج يتجاوز كل قواعد التحقق.<\/p>", "opts": ["<code dir=\"ltr\">account._balance = 1_000_000<\/code> من كود خارج الـ class", "<code dir=\"ltr\">account.withdraw(20)<\/code>", "<code dir=\"ltr\">account.deposit(100)<\/code>", "<code dir=\"ltr\">print(account.balance)<\/code> حيث <code dir=\"ltr\">balance<\/code> هي property للقراءة"], "ans": 0}, {"id": "m2l2t2", "type": "tf", "q": "<p>في Python، كتابة <code dir=\"ltr\">self.__secret<\/code> تجعل الوصول إلى الـ attribute من الخارج مستحيلًا تمامًا.<\/p>", "exp": "<p>الشرطتان تفعّلان name mangling فيصبح الاسم <code dir=\"ltr\">_ClassName__secret<\/code>. يصعب الوصول خطأً، لكنه يبقى ممكنًا لمن يتعمّد.<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m2l2t3", "type": "sc", "sc": "class اسمه <code dir=\"ltr\">Temperature<\/code> يخزّن درجة بالكلفن، ويجب ألّا تقل عن الصفر المطلق.", "q": "<p>أين يوضع هذا التحقق؟<\/p>", "exp": "<p>الـ class مسؤول عن حماية الـ invariant الخاص به، في نقطة الإنشاء وفي كل نقطة تعديل.<\/p>", "opts": ["في كل مكان من التطبيق يستعمل <code dir=\"ltr\">Temperature<\/code>", "داخل الـ class: في <code dir=\"ltr\">__init__<\/code> وفي setter الـ property", "في ملف README", "لا يوضع، ونثق بالمستخدمين"], "ans": 1}, {"id": "m2l2t4", "type": "sa", "q": "<p>ما اسم الـ decorator الذي يجعل method تُقرأ من الخارج كأنها attribute؟<\/p>", "exp": "<p>الإجابة: <b><code dir=\"ltr\">@property<\/code><\/b>. وهو بديل Python الأنيق للـ getters و setters.<\/p>", "kw": ["property"]}]}, {"t": "Decomposition", "intro": "<p>المبدأ الثالث: كيف نتعامل مع نظام أكبر من أن يستوعبه العقل دفعة واحدة؟<\/p>", "items": [{"t": "ما هي الـ Decomposition؟", "html": "<p><b>Decomposition<\/b> (التفكيك) معناها تقسيم نظام كبير ومعقّد إلى أجزاء أصغر يمكن فهم كل منها على حدة.<\/p>\n<p>لماذا؟ لأن الذهن البشري لا يحمل إلا عددًا محدودًا من الأشياء في وقت واحد. «نظام إدارة وكالة سفر» كتلة لا يمكن التفكير فيها. لكن يمكن تفكيكها إلى: Customer Management، Reservation Management، Employee Management، Payment Records، Reports، Authentication.<\/p>\n<p>والتفكيك <b>هرمي<\/b>: كل جزء يُفكَّك بدوره. مثلًا Reservation Management يحتوي: <code dir=\"ltr\">Reservation<\/code> و <code dir=\"ltr\">Customer<\/code> و <code dir=\"ltr\">Hotel<\/code> و <code dir=\"ltr\">Room<\/code> و <code dir=\"ltr\">ReservationService<\/code>.<\/p>\n<p>تشبيه: السيارة تتكوّن من محرّك وهيكل ونظام كهرباء. والمحرّك يتكوّن من مكابس وصمامات. الميكانيكي يعمل على جزء واحد دون أن يفكّ السيارة كلها.<\/p>\n<p>متى نتوقف؟ حين يصبح الجزء صغيرًا بما يكفي ليُفهم ويُختبر وحده.<\/p>", "q": {"id": "m2l3c1", "type": "mc", "q": "<p>ما الفائدة الأساسية للـ decomposition؟<\/p>", "exp": "<p>التفكيك أداة للتحكم في التعقيد: كل جزء يُفهم ويُبنى ويُختبر باستقلال نسبي.<\/p>", "opts": ["الاستغناء عن الاختبارات", "تحويل مشكلة كبيرة لا تُستوعب إلى مشاكل أصغر يمكن فهمها وحلّها واختبارها منفردة", "جعل النظام أسرع تلقائيًا", "تقليل عدد الملفات إلى ملف واحد"], "ans": 1}}, {"t": "تحديد الـ Logical Modules والحدود بينها", "html": "<p><b>Module<\/b> هو مجموعة عناصر مترابطة تخدم غرضًا واحدًا. في Python تتجسّد الفكرة في:<\/p>\n<ul><li><b>module<\/b>: ملف <code dir=\"ltr\">.py<\/code> واحد.<\/li><li><b>package<\/b>: مجلد يحتوي modules.<\/li><\/ul>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>agency/\n    customers/        # كل ما يخص العملاء\n        models.py\n        services.py\n    reservations/     # كل ما يخص الحجوزات\n        models.py\n        services.py\n    reports/\n        services.py<\/code><\/pre><\/div>\n<p>كيف نختار الحدود (boundaries)؟<\/p>\n<ul><li><b>حسب مفاهيم المجال<\/b>: ما يتغيّر معًا يوضع معًا. هذا الأفضل غالبًا.<\/li><li>تجنّب التقسيم حسب النوع التقني فقط (مجلد لكل الـ models ومجلد لكل الـ services) في الأنظمة الكبيرة: تعديل ميزة واحدة يتوزّع عندها على كل المجلدات.<\/li><\/ul>\n<p>اختبار الحدّ الجيد: هل تستطيع وصف الـ module بجملة واحدة دون «و»؟ هل معظم التعديلات تبقى داخل module واحد؟<\/p>", "q": {"id": "m2l3c2", "type": "sc", "sc": "نظام مطعم فيه: الطلبات، المخزون، الموظفون، الفواتير.", "q": "<p>أي تقسيم يعبّر عن حدود منطقية جيدة؟<\/p>", "exp": "<p>الحدود الجيدة تتبع مفاهيم المجال، فيكون لكل module غرض واحد واضح، والتعديلات تبقى محلية.<\/p>", "opts": ["ملف واحد <code dir=\"ltr\">app.py<\/code> فيه كل شيء", "package اسمه <code dir=\"ltr\">misc<\/code> لكل شيء", "packages باسم <code dir=\"ltr\">orders<\/code> و <code dir=\"ltr\">inventory<\/code> و <code dir=\"ltr\">staff<\/code> و <code dir=\"ltr\">billing<\/code>، كلٌّ يضم ما يخص مفهومه", "ملف <code dir=\"ltr\">part1.py<\/code> وملف <code dir=\"ltr\">part2.py<\/code> بتقسيم حسب عدد الأسطر"], "ans": 2}}, {"t": "تقسيم المسؤوليات وعلاقة الكل بالأجزاء", "html": "<p>التفكيك يُنتج علاقة <b>whole-part<\/b>: «كلّ» يتكوّن من «أجزاء». نقاط يجب الانتباه لها:<\/p>\n<ul><li><b>كل مسؤولية لها صاحب واحد<\/b>: لا مسؤولية يتيمة ولا مسؤولية مكرّرة في جزأين.<\/li><li><b>عدد الأجزاء<\/b>: هل هو ثابت (سيارة بأربع عجلات) أم متغيّر (طلب فيه عدد غير محدّد من العناصر)؟<\/li><li><b>عمر الأجزاء (lifetime)<\/b>: هل يعيش الجزء بعد زوال الكل؟ عناصر الطلب تزول مع الطلب. موظفو القسم يبقون إذا أُلغي القسم.<\/li><li><b>المشاركة (sharing)<\/b>: هل ينتمي الجزء إلى أكثر من كلّ؟ الموظف قد يعمل في مشروعين.<\/li><\/ul>\n<p>الإجابات عن هذه الأسئلة ستحدّد لاحقًا نوع العلاقة في UML: <b>Composition<\/b> أم <b>Aggregation<\/b> (القسم 2.5).<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Order:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._items = []                    <span class=\"cm\"># الأجزاء تُنشأ وتعيش داخل الكل<\/span>\n\n    <span class=\"kw\">def<\/span> add_item(<span class=\"kw\">self<\/span>, product_name: str, quantity: int) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._items.append(OrderItem(product_name, quantity))<\/code><\/pre><\/div>", "q": {"id": "m2l3c3", "type": "mc", "q": "<p>أي سؤال يساعدك على التمييز لاحقًا بين Composition و Aggregation؟<\/p>", "exp": "<p>عمر الجزء بالنسبة للكل هو الفارق الجوهري: يفنى معه (composition) أم يعيش مستقلًا (aggregation).<\/p>", "opts": ["هل اسم الـ class يبدأ بحرف كبير؟", "هل يستمر الجزء في الوجود بعد زوال الكل؟", "كم سطرًا في ملف الـ class؟", "ما لون الصندوق في المخطط؟"], "ans": 1}}, {"t": "كيف تتواصل الأجزاء المفكّكة؟", "html": "<p>التفكيك نصف العمل. النصف الآخر: كيف تتحدّث الأجزاء مع بعضها؟ القاعدة: عبر <b>واجهة عامة صغيرة ومحدّدة<\/b>، وليس بالدخول إلى أحشاء الجزء الآخر.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># reservations/services.py<\/span>\n<span class=\"kw\">from<\/span> customers.services <span class=\"kw\">import<\/span> find_customer      <span class=\"cm\"># واجهة عامة<\/span>\n\n<span class=\"kw\">def<\/span> create_reservation(customer_id, room, dates):\n    customer = find_customer(customer_id)          <span class=\"cm\"># نسأل الـ module المختص<\/span>\n    ...<\/code><\/pre><\/div>\n<p>ما <b>لا<\/b> نفعله: أن يقرأ module الحجوزات جداول العملاء مباشرة أو يعدّل attributes داخلية فيها.<\/p>\n<p>لماذا نحرص على قلّة الروابط؟ لأن عدد قنوات التواصل الممكنة بين <span class=\"math\" dir=\"ltr\"><i>n<\/i><\/span> جزءًا، إذا تحدّث كل جزء مع كل جزء، هو:<\/p>\n<div class=\"mathb\" dir=\"ltr\"><span class=\"fr\"><span><i>n<\/i>(<i>n<\/i> − 1)<\/span><span class=\"dn\">2<\/span><\/span><\/div>\n<p>مع 4 أجزاء: 6 قنوات. مع 10 أجزاء: 45 قناة. التفكيك دون ضبط التواصل يستبدل كتلة معقّدة بشبكة متشابكة.<\/p>", "q": {"id": "m2l3c4", "type": "mc", "q": "<p>نظام من 6 modules يتواصل كل واحد منها مع كل الآخرين مباشرة. كم عدد قنوات التواصل حسب <span class=\"math\" dir=\"ltr\"><span class=\"fr\"><span><i>n<\/i>(<i>n<\/i> − 1)<\/span><span class=\"dn\">2<\/span><\/span><\/span>؟<\/p>", "exp": "<p><span class=\"math\" dir=\"ltr\"><span class=\"fr\"><span>6 × 5<\/span><span class=\"dn\">2<\/span><\/span> = 15<\/span>. لهذا نقلّل الروابط ونمرّرها عبر واجهات محدّدة.<\/p>", "opts": ["15", "12", "6", "30"], "ans": 0}}, {"t": "Decomposition ليست Microservices", "html": "<p>خلط شائع: «فكّكت النظام» لا تعني «حوّلته إلى microservices».<\/p>\n<ul><li><b>Decomposition<\/b> مبدأ <b>منطقي<\/b>: تقسيم إلى أجزاء بمسؤوليات وحدود واضحة.<\/li><li><b>Microservices<\/b> أسلوب <b>نشر (deployment)<\/b>: كل جزء يعمل كبرنامج مستقل على الشبكة.<\/li><\/ul>\n<p>يمكنك تفكيك النظام إلى modules واضحة مع إبقاء كل شيء داخل تطبيق Django واحد أو backend واحد يُنشر كقطعة واحدة. هذا يسمّى <b>modular monolith<\/b>، وهو خيار ممتاز لمعظم المشاريع الصغيرة والمتوسطة.<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>Modular monolith<\/th><th>Microservices<\/th><\/tr><\/thead><tbody><tr><td>التواصل بين الأجزاء<\/td><td>استدعاء دالة عادي<\/td><td>عبر الشبكة<\/td><\/tr><tr><td>النشر<\/td><td>قطعة واحدة<\/td><td>كل خدمة وحدها<\/td><\/tr><tr><td>التعقيد التشغيلي<\/td><td>منخفض<\/td><td>مرتفع<\/td><\/tr><\/tbody><\/table><\/div>\n<p>تذكّر trade-off «Scalability vs Complexity». والأهم: من لا يستطيع رسم حدود نظيفة داخل monolith لن ينجح في رسمها بين خدمات، بل سيحصل على فوضى موزّعة.<\/p>", "q": {"id": "m2l3c5", "type": "tf", "q": "<p>لتطبيق مبدأ الـ decomposition يجب نشر كل module كخدمة مستقلة على خادم خاص.<\/p>", "exp": "<p>التفكيك منطقي. يمكن أن تعيش كل الـ modules في تطبيق واحد يُنشر كقطعة واحدة (modular monolith).<\/p>", "opts": ["صح", "خطأ"], "ans": 1}}], "test": [{"id": "m2l3t1", "type": "mc", "q": "<p>ما الوصف الأدق للـ modular monolith؟<\/p>", "exp": "<p>يجمع بساطة النشر مع نظافة الحدود الداخلية.<\/p>", "opts": ["مجموعة خدمات تتواصل عبر الشبكة", "قاعدة بيانات بلا تطبيق", "تطبيق بلا أي تقسيم داخلي", "تطبيق واحد يُنشر كقطعة واحدة، لكنه مقسّم داخليًا إلى modules بحدود واضحة"], "ans": 3}, {"id": "m2l3t2", "type": "sc", "sc": "في مشروع Django، ميزة «الفواتير» موزّعة: منطقها في <code dir=\"ltr\">utils.py<\/code> العام، واستعلاماتها داخل views الحجوزات، وقوالبها مع قوالب العملاء.", "q": "<p>ما المشكلة؟<\/p>", "exp": "<p>ما يتغيّر معًا يجب أن يعيش معًا. تبعثر الميزة يجعل كل تعديل عليها يمسّ أجزاء لا علاقة لها بها.<\/p>", "opts": ["لا مشكلة، التوزيع يزيد الأمان", "المشكلة الوحيدة هي اسم <code dir=\"ltr\">utils.py<\/code>", "حدود الـ modules لا تتبع المفاهيم: كل ما يخص الفواتير يجب أن يُجمع في module واحد", "يجب تحويل الفواتير إلى microservice فورًا"], "ans": 2}, {"id": "m2l3t3", "type": "tf", "q": "<p>التفكيك عملية هرمية: يمكن تفكيك الجزء الناتج إلى أجزاء أصغر.<\/p>", "exp": "<p>نعم، مثل Reservation Management الذي يُفكَّك إلى <code dir=\"ltr\">Reservation<\/code> و <code dir=\"ltr\">Room<\/code> و <code dir=\"ltr\">ReservationService<\/code> وغيرها.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m2l3t4", "type": "sa", "q": "<p>في Python، ما اسم المجلد الذي يضم عدة modules مترابطة؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>package<\/b>. والملف الواحد <code dir=\"ltr\">.py<\/code> يسمّى module.<\/p>", "kw": ["package"]}]}, {"t": "Generalization", "intro": "<p>المبدأ الرابع: كيف نتجنّب تكرار ما هو مشترك بين classes متشابهة، ومتى يكون ذلك صحيحًا؟<\/p>", "items": [{"t": "ما هي الـ Generalization؟ والـ Inheritance", "html": "<p><b>Generalization<\/b> (التعميم) معناها: اكتشاف الخصائص المشتركة بين عدة classes وتمثيلها مرة واحدة في تجريد مشترك.<\/p>\n<p>لدينا <code dir=\"ltr\">Car<\/code> و <code dir=\"ltr\">Motorcycle<\/code> و <code dir=\"ltr\">Truck<\/code>. كلها تملك: brand و model و speed وعملية start. بدل تكرار ذلك ثلاث مرات ننشئ class عامًّا <code dir=\"ltr\">Vehicle<\/code>، وتأخذ الأنواع الخاصة منه ما هو مشترك. الآلية التي تحقق ذلك هي <b>Inheritance<\/b> (الوراثة).<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Vehicle:                         <span class=\"cm\"># superclass / parent / base class<\/span>\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, brand: str, model: str):\n        <span class=\"kw\">self<\/span>.brand = brand\n        <span class=\"kw\">self<\/span>.model = model\n        <span class=\"kw\">self<\/span>.speed = <span class=\"nu\">0<\/span>\n\n    <span class=\"kw\">def<\/span> start(<span class=\"kw\">self<\/span>) -&gt; str:\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"{self.brand} {self.model} started\"<\/span>\n\n<span class=\"kw\">class<\/span> Car(Vehicle):                    <span class=\"cm\"># subclass / child: Car يرث من Vehicle<\/span>\n    <span class=\"kw\">pass<\/span>\n\ncar = Car(<span class=\"st\">\"Toyota\"<\/span>, <span class=\"st\">\"Corolla\"<\/span>)\nprint(car.start())                     <span class=\"cm\"># Toyota Corolla started<\/span><\/code><\/pre><\/div>\n<p><code dir=\"ltr\">Car<\/code> لم يعرّف <code dir=\"ltr\">start<\/code> ولا <code dir=\"ltr\">__init__<\/code>، لكنه <b>ورثهما<\/b>. المصطلحات: <code dir=\"ltr\">Vehicle<\/code> هو الـ <b>superclass<\/b> و <code dir=\"ltr\">Car<\/code> هو الـ <b>subclass<\/b>.<\/p>\n<figure class=\"fig\" dir=\"ltr\"><svg viewBox=\"0 0 640 270\" width=\"640\" role=\"img\" aria-label=\"Vehicle generalization hierarchy\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"195\" y=\"10\" width=\"250\" height=\"134\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"320.0\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >«abstract»<\/text><text x=\"320.0\" y=\"43\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" font-style=\"italic\">Vehicle<\/text><line x1=\"195\" y1=\"52\" x2=\"445\" y2=\"52\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"203\" y=\"70\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" ># brand: str<\/text><text x=\"203\" y=\"88\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" ># model: str<\/text><line x1=\"195\" y1=\"98\" x2=\"445\" y2=\"98\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"203\" y=\"116\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ start(): None<\/text><text x=\"203\" y=\"134\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ wheels(): int  {abstract}<\/text><line x1=\"320\" y1=\"157\" x2=\"320\" y2=\"180\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(320,144) rotate(-90)\"><polygon points=\"0,0 -13,-7.5 -13,7.5\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><\/g><line x1=\"100\" y1=\"180\" x2=\"540\" y2=\"180\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><rect x=\"30\" y=\"205\" width=\"140\" height=\"56\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"100.0\" y=\"224\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Car<\/text><line x1=\"30\" y1=\"233\" x2=\"170\" y2=\"233\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"38\" y=\"251\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ wheels(): int<\/text><line x1=\"100\" y1=\"180\" x2=\"100\" y2=\"205\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><rect x=\"250\" y=\"205\" width=\"140\" height=\"56\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"320.0\" y=\"224\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Motorcycle<\/text><line x1=\"250\" y1=\"233\" x2=\"390\" y2=\"233\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"258\" y=\"251\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ wheels(): int<\/text><line x1=\"320\" y1=\"180\" x2=\"320\" y2=\"205\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><rect x=\"470\" y=\"205\" width=\"140\" height=\"56\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"540.0\" y=\"224\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Truck<\/text><line x1=\"470\" y1=\"233\" x2=\"610\" y2=\"233\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"478\" y=\"251\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ wheels(): int<\/text><line x1=\"540\" y1=\"180\" x2=\"540\" y2=\"205\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><\/svg><\/figure>", "q": {"id": "m2l4c1", "type": "mc", "q": "<p>في الكود أعلاه، من أين حصل <code dir=\"ltr\">Car<\/code> على method اسمها <code dir=\"ltr\">start<\/code>؟<\/p>", "exp": "<p><code dir=\"ltr\">class Car(Vehicle)<\/code> تعني أن <code dir=\"ltr\">Car<\/code> يرث كل attributes و methods الـ <code dir=\"ltr\">Vehicle<\/code>.<\/p>", "opts": ["Python تضيفها تلقائيًا لكل class", "من module خارجي", "لا يملكها، والسطر سيفشل", "ورثها من الـ superclass <code dir=\"ltr\">Vehicle<\/code>"], "ans": 3}}, {"t": "Abstract Classes و Interfaces في التعميم", "html": "<p>عند التعميم نسأل: هل الـ superclass شيء <b>حقيقي<\/b> يُنشأ منه object، أم مجرد <b>فكرة<\/b> جامعة؟<\/p>\n<p>لا توجد في الواقع «مركبة» مجرّدة، بل سيارة أو دراجة أو شاحنة. إذن <code dir=\"ltr\">Vehicle<\/code> الأنسب أن يكون <b>abstract class<\/b>: يحمل المشترك ويفرض على كل نوع تحديد ما يخصّه.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">from<\/span> abc <span class=\"kw\">import<\/span> ABC, abstractmethod\n\n<span class=\"kw\">class<\/span> Vehicle(ABC):\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, brand: str, model: str):\n        <span class=\"kw\">self<\/span>.brand = brand\n        <span class=\"kw\">self<\/span>.model = model\n\n    <span class=\"kw\">def<\/span> start(<span class=\"kw\">self<\/span>) -&gt; str:                    <span class=\"cm\"># مشترك للجميع<\/span>\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"{self.brand} {self.model} started\"<\/span>\n\n    <span class=\"dc\">@abstractmethod<\/span>\n    <span class=\"kw\">def<\/span> wheels(<span class=\"kw\">self<\/span>) -&gt; int:                   <span class=\"cm\"># كل نوع يحدّده بنفسه<\/span>\n        ...\n\n<span class=\"kw\">class<\/span> Car(Vehicle):\n    <span class=\"kw\">def<\/span> wheels(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"nu\">4<\/span>\n\n<span class=\"kw\">class<\/span> Motorcycle(Vehicle):\n    <span class=\"kw\">def<\/span> wheels(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"nu\">2<\/span><\/code><\/pre><\/div>\n<p>أما الـ <b>interface<\/b> فتعمّم <b>قدرة<\/b> لا <b>هوية<\/b>: <code dir=\"ltr\">Printable<\/code> أو <code dir=\"ltr\">Notifier<\/code> أو <code dir=\"ltr\">Comparable<\/code>. أنواع لا قرابة بينها (فاتورة وتقرير وتذكرة) قد تشترك في القدرة على الطباعة دون أن يكون لها أب مشترك.<\/p>\n<p>القاعدة: abstract class لـ «<b>هو نوع من<\/b>»، و interface لـ «<b>يستطيع أن<\/b>».<\/p>", "q": {"id": "m2l4c2", "type": "sc", "sc": "<code dir=\"ltr\">Invoice<\/code> و <code dir=\"ltr\">Ticket<\/code> و <code dir=\"ltr\">Report<\/code> لا يجمعها أصل واحد، لكن كلها يجب أن تُصدَّر إلى PDF.", "q": "<p>ما التعميم الأنسب؟<\/p>", "exp": "<p>المشترك هنا قدرة (يستطيع التصدير) وليس هوية، فالـ interface هي الأداة المناسبة.<\/p>", "opts": ["جعل <code dir=\"ltr\">Ticket<\/code> يرث من <code dir=\"ltr\">Invoice<\/code>", "نسخ دالة التصدير في الـ classes الثلاثة دون أي تجريد", "superclass اسمه <code dir=\"ltr\">Thing<\/code> ترثه كل الـ classes في النظام", "interface (أو Protocol) اسمها <code dir=\"ltr\">PdfExportable<\/code> تحدّد <code dir=\"ltr\">to_pdf()<\/code>"], "ans": 3}}, {"t": "Method Overriding", "html": "<p><b>Overriding<\/b> معناها أن يعيد الـ subclass تعريف method ورثها، ليقدّم سلوكه الخاص، بالاسم نفسه والتوقيع نفسه.<\/p>\n<p>وبـ <code dir=\"ltr\">super()<\/code> يستطيع الـ subclass استدعاء نسخة الأب ثم الإضافة إليها، بدل نسخها:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Vehicle:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, brand: str):\n        <span class=\"kw\">self<\/span>.brand = brand\n\n    <span class=\"kw\">def<\/span> describe(<span class=\"kw\">self<\/span>) -&gt; str:\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"Vehicle: {self.brand}\"<\/span>\n\n<span class=\"kw\">class<\/span> Truck(Vehicle):\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, brand: str, capacity_tons: float):\n        super().__init__(brand)                 <span class=\"cm\"># نفّذ تهيئة الأب أولًا<\/span>\n        <span class=\"kw\">self<\/span>.capacity_tons = capacity_tons\n\n    <span class=\"kw\">def<\/span> describe(<span class=\"kw\">self<\/span>) -&gt; str:                  <span class=\"cm\"># override<\/span>\n        base = super().describe()               <span class=\"cm\"># أعد استعمال منطق الأب<\/span>\n        <span class=\"kw\">return<\/span> f<span class=\"st\">\"{base}, capacity: {self.capacity_tons}t\"<\/span>\n\nprint(Truck(<span class=\"st\">\"Volvo\"<\/span>, <span class=\"nu\">18<\/span>).describe())\n<span class=\"cm\"># Vehicle: Volvo, capacity: 18t<\/span><\/code><\/pre><\/div>\n<p>تنبيهان:<\/p>\n<ul><li>إذا عرّفت <code dir=\"ltr\">__init__<\/code> في الـ subclass ونسيت <code dir=\"ltr\">super().__init__(...)<\/code> فلن تُنشأ attributes الأب.<\/li><li>الـ override يجب أن <b>يحترم وعد<\/b> الـ method الأصلية: إذا كانت <code dir=\"ltr\">describe<\/code> تعيد نصًّا فلا تجعلها تعيد رقمًا.<\/li><\/ul>", "q": {"id": "m2l4c3", "type": "mc", "q": "<p>في <code dir=\"ltr\">Truck.__init__<\/code>، ما وظيفة السطر <code dir=\"ltr\">super().__init__(brand)<\/code>؟<\/p>", "exp": "<p>بدونه لن يُنفَّذ <code dir=\"ltr\">Vehicle.__init__<\/code>، فلن يوجد <code dir=\"ltr\">self.brand<\/code>، وسيفشل <code dir=\"ltr\">describe<\/code> بـ <code dir=\"ltr\">AttributeError<\/code>.<\/p>", "opts": ["يحذف attributes الأب", "يستدعي constructor الـ <code dir=\"ltr\">Vehicle<\/code> لتهيئة <code dir=\"ltr\">self.brand<\/code>", "لا وظيفة له ويمكن حذفه دون أثر", "ينشئ object ثانيًا من نوع <code dir=\"ltr\">Vehicle<\/code>"], "ans": 1}}, {"t": "Polymorphism", "html": "<p><b>Polymorphism<\/b> (تعدّد الأشكال) معناها: الاستدعاء نفسه يُنتج سلوكًا مختلفًا حسب النوع الفعلي للـ object. تكتب كودًا يتعامل مع التجريد العام، فيعمل تلقائيًا مع كل نوع خاص.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"cm\"># Vehicle هنا هو الـ abstract class من المفهوم الثاني: Vehicle(brand, model) مع wheels() مجرّدة<\/span>\n<span class=\"kw\">class<\/span> Car(Vehicle):\n    <span class=\"kw\">def<\/span> wheels(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"nu\">4<\/span>\n\n<span class=\"kw\">class<\/span> Motorcycle(Vehicle):\n    <span class=\"kw\">def<\/span> wheels(<span class=\"kw\">self<\/span>) -&gt; int:\n        <span class=\"kw\">return<\/span> <span class=\"nu\">2<\/span>\n\nfleet = [Car(<span class=\"st\">\"Toyota\"<\/span>, <span class=\"st\">\"Corolla\"<\/span>), Motorcycle(<span class=\"st\">\"Yamaha\"<\/span>, <span class=\"st\">\"R3\"<\/span>)]\n<span class=\"kw\">for<\/span> vehicle <span class=\"kw\">in<\/span> fleet:\n    print(vehicle.start(), <span class=\"st\">\"-\"<\/span>, vehicle.wheels(), <span class=\"st\">\"wheels\"<\/span>)   <span class=\"cm\"># لا يوجد if على النوع<\/span><\/code><\/pre><\/div>\n<p>الحلقة لا تعرف ولا يهمّها هل العنصر سيارة أم دراجة. بدون polymorphism كنا سنكتب:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">if<\/span> isinstance(vehicle, Car): ...\n<span class=\"kw\">elif<\/span> isinstance(vehicle, Motorcycle): ...<\/code><\/pre><\/div>\n<p>وعند إضافة <code dir=\"ltr\">Truck<\/code> نبحث عن <b>كل<\/b> سلسلة <code dir=\"ltr\">if<\/code> من هذا النوع لنعدّلها. مع الـ polymorphism نضيف class جديدًا فقط، والكود القديم لا يُمسّ.<\/p>\n<div class=\"note\">علامة تحذير: سلاسل <code dir=\"ltr\">isinstance<\/code> أو <code dir=\"ltr\">if obj.type == \"...\"<\/code> المتكرّرة تدل غالبًا على polymorphism مفقود.<\/div>", "q": {"id": "m2l4c4", "type": "mc", "q": "<p>أضفنا <code dir=\"ltr\">class Truck(Vehicle)<\/code> تنفّذ <code dir=\"ltr\">wheels()<\/code> وتعيد 6. ماذا يجب تعديله في حلقة <code dir=\"ltr\">for vehicle in fleet<\/code>؟<\/p>", "exp": "<p>هذه قيمة الـ polymorphism: الكود المكتوب على التجريد لا يتغيّر عند إضافة أنواع جديدة.<\/p>", "opts": ["إضافة <code dir=\"ltr\">elif isinstance(vehicle, Truck)<\/code>", "لا شيء: الحلقة تعمل مع أي <code dir=\"ltr\">Vehicle<\/code>", "تعديل <code dir=\"ltr\">Car<\/code> و <code dir=\"ltr\">Motorcycle<\/code>", "إعادة كتابة الحلقة كاملة"], "ans": 1}}, {"t": "Generalization و Specialization", "html": "<p>هما وجهان لعلاقة واحدة، والفرق في <b>اتجاه التفكير<\/b>:<\/p>\n<ul><li><b>Generalization<\/b> (من الأسفل إلى الأعلى): لديك <code dir=\"ltr\">Car<\/code> و <code dir=\"ltr\">Truck<\/code>، تلاحظ المشترك فتستخرج <code dir=\"ltr\">Vehicle<\/code>.<\/li><li><b>Specialization<\/b> (من الأعلى إلى الأسفل): لديك <code dir=\"ltr\">Employee<\/code>، تكتشف أن بعض الموظفين لهم سلوك إضافي فتنشئ <code dir=\"ltr\">Manager(Employee)<\/code>.<\/li><\/ul>\n<p>الـ subclass المتخصّص يمكنه:<\/p>\n<ol><li><b>إضافة<\/b> attributes أو methods جديدة.<\/li><li><b>تعديل<\/b> سلوك موروث (override).<\/li><\/ol>\n<p>ولا يجوز له أن <b>يحذف<\/b> أو يكسر شيئًا موروثًا.<\/p>\n<p>نصيحة عملية: لا تبدأ بهرم وراثة جميل من خيالك. ابدأ بـ classes محدّدة، وحين ترى التكرار <b>فعلًا<\/b> في نوعين أو ثلاثة عمّم. التعميم المبكّر يُنتج superclasses خاطئة يصعب إصلاحها لاحقًا.<\/p>", "q": {"id": "m2l4c5", "type": "tf", "q": "<p>إنشاء <code dir=\"ltr\">Manager(Employee)<\/code> بعد اكتشاف أن للمديرين مسؤوليات إضافية مثال على specialization.<\/p>", "exp": "<p>انطلقنا من العام (<code dir=\"ltr\">Employee<\/code>) نحو نوع أخص (<code dir=\"ltr\">Manager<\/code>) يضيف أو يعدّل سلوكًا.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "متى تكون الوراثة مناسبة؟ اختبار is-a", "html": "<p>الوراثة <b>ليست مجرد وسيلة لإعادة استخدام الكود<\/b>. هي تمثّل علاقة حقيقية بين مفهومين: <b>is-a<\/b> (هو نوع من).<\/p>\n<ul><li>A <code dir=\"ltr\">Car<\/code> <b>is a<\/b> <code dir=\"ltr\">Vehicle<\/code>. صحيح.<\/li><li>A <code dir=\"ltr\">Motorcycle<\/code> <b>is a<\/b> <code dir=\"ltr\">Vehicle<\/code>. صحيح.<\/li><li>An <code dir=\"ltr\">Order<\/code> is a <code dir=\"ltr\">Customer<\/code>؟ خطأ.<\/li><li>A <code dir=\"ltr\">Customer<\/code> is a <code dir=\"ltr\">Product<\/code>؟ خطأ.<\/li><\/ul>\n<p>المفاهيم التي لا تربطها is-a يجب ألّا يرث أحدها من الآخر، حتى لو اشتركت في بعض الحقول. الـ <code dir=\"ltr\">Order<\/code> <b>يملك<\/b> عميلًا (has-a)، وهذه علاقة association وليست وراثة.<\/p>\n<p>اختبار أدق من مجرد الجملة، يسمّى <b>الاستبدال (substitutability)<\/b>: في كل مكان يُنتظر فيه <code dir=\"ltr\">Vehicle<\/code>، هل أستطيع وضع <code dir=\"ltr\">Car<\/code> دون أن ينكسر شيء أو يتفاجأ أحد؟ إن كان نعم فالوراثة سليمة.<\/p>\n<p>استعمل الوراثة حين تتحقق is-a <b>و<\/b> ينجح اختبار الاستبدال <b>و<\/b> يوجد سلوك مشترك فعلي. غير ذلك استعمل composition أو interface (تفاصيل أكثر في القسم 3.6).<\/p>", "q": {"id": "m2l4c6", "type": "mc", "q": "<p>أي علاقة وراثة سليمة؟<\/p>", "exp": "<p>حساب التوفير هو فعلًا نوع من الحسابات البنكية ويصلح مكانه. البقية علاقات has-a أو uses، وليست is-a.<\/p>", "opts": ["<code dir=\"ltr\">Engine(Car)<\/code> لأن المحرّك داخل السيارة", "<code dir=\"ltr\">Order(Customer)<\/code> لأن الطلب يحتاج اسم العميل", "<code dir=\"ltr\">Customer(Database)<\/code> لأن العميل يُحفظ في قاعدة البيانات", "<code dir=\"ltr\">SavingsAccount(BankAccount)<\/code>"], "ans": 3}}], "test": [{"id": "m2l4t1", "type": "sc", "sc": "<code dir=\"ltr\">Dog<\/code> و <code dir=\"ltr\">Cat<\/code> يكرّران: <code dir=\"ltr\">name<\/code> و <code dir=\"ltr\">age<\/code> و <code dir=\"ltr\">eat()<\/code>. ولكلٍّ <code dir=\"ltr\">make_sound()<\/code> مختلفة.", "q": "<p>ما التصميم الأنسب؟<\/p>", "exp": "<p>المشترك يصعد إلى الأب، والمختلف يُعلن abstract لينفّذه كل نوع. و <code dir=\"ltr\">Cat<\/code> ليس نوعًا من <code dir=\"ltr\">Dog<\/code>.<\/p>", "opts": ["<code dir=\"ltr\">Cat<\/code> يرث من <code dir=\"ltr\">Dog<\/code>", "abstract class <code dir=\"ltr\">Animal<\/code> يحمل <code dir=\"ltr\">name<\/code> و <code dir=\"ltr\">age<\/code> و <code dir=\"ltr\">eat()<\/code>، ويعلن <code dir=\"ltr\">make_sound()<\/code> كـ abstract method", "class واحد <code dir=\"ltr\">Pet<\/code> فيه <code dir=\"ltr\">if kind == \"dog\"<\/code> داخل كل method", "إبقاء التكرار كما هو"], "ans": 1}, {"id": "m2l4t2", "type": "tf", "q": "<p>الـ polymorphism يسمح بكتابة كود يتعامل مع <code dir=\"ltr\">Vehicle<\/code> ويعمل مع أي subclass حالية أو مستقبلية.<\/p>", "exp": "<p>هذا تعريفه العملي، وهو ما يجعل إضافة أنواع جديدة لا تتطلب تعديل الكود القديم.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}, {"id": "m2l4t3", "type": "mc", "q": "<p>ما الخطأ في <code dir=\"ltr\">class Stack(list)<\/code> حيث نريد stack فيه <code dir=\"ltr\">push<\/code> و <code dir=\"ltr\">pop<\/code> فقط؟<\/p>", "exp": "<p>الوراثة تجلب <b>كل<\/b> واجهة الأب. الصحيح أن يملك الـ <code dir=\"ltr\">Stack<\/code> قائمة داخلية (has-a) ويُظهر <code dir=\"ltr\">push<\/code> و <code dir=\"ltr\">pop<\/code> فقط.<\/p>", "opts": ["الـ <code dir=\"ltr\">Stack<\/code> سيرث كل عمليات <code dir=\"ltr\">list<\/code> مثل <code dir=\"ltr\">insert<\/code> و <code dir=\"ltr\">sort<\/code>، فتُكسر قاعدة الـ stack: هو ليس list بالمعنى الكامل", "الـ stack يجب أن يرث من <code dir=\"ltr\">dict<\/code>", "لا خطأ إطلاقًا", "Python تمنع الوراثة من <code dir=\"ltr\">list<\/code>"], "ans": 0}, {"id": "m2l4t4", "type": "sa", "q": "<p>ما اسم إعادة تعريف method موروثة داخل الـ subclass بالاسم والتوقيع نفسيهما؟ (بالإنجليزية)<\/p>", "exp": "<p>الإجابة: <b>Method overriding<\/b>.<\/p>", "kw": ["overrid"]}]}, {"t": "UML Class Diagrams", "intro": "<p>الموضوع العملي الأكبر في الوحدة. <b>Unified Modeling Language (UML)<\/b> لغة بصرية موحّدة لوصف بنية البرمجيات وسلوكها، يفهمها المطوّرون أيًّا كانت لغة برمجتهم.<\/p>", "items": [{"t": "ما هو الـ Class Diagram؟", "html": "<p>الـ <b>UML Class Diagram<\/b> يمثّل <b>البنية الثابتة (static structure)<\/b> للنظام: ما الموجود، وكيف يرتبط. لا يُظهر ترتيب الأحداث ولا ما يجري وقت التشغيل (هذا دور مخططات الوحدة 3).<\/p>\n<p>يُظهر: Classes، Attributes، Methods، Relationships، Inheritance، Interfaces، Visibility.<\/p>\n<p>لماذا نرسم بدل أن نكتب الكود مباشرة؟<\/p>\n<ul><li><b>التواصل<\/b>: مخطط واحد يشرح في دقيقة ما يحتاج ساعة قراءة كود.<\/li><li><b>التفكير<\/b>: الأخطاء البنيوية (وراثة خاطئة، class مرتبط بكل شيء) تظهر للعين فورًا.<\/li><li><b>الرخص<\/b>: تعديل سهم أسهل بكثير من إعادة كتابة classes.<\/li><\/ul>\n<p>تشبيه: الـ class diagram مثل خريطة مدينة. تريك الشوارع والمباني وكيف تتصل، ولا تريك حركة المرور.<\/p>\n<div class=\"note\">المخطط وسيلة تواصل وتفكير. ارسم بمستوى التفصيل الذي يخدم الغرض، ولا ترسم كل getter.<\/div>", "q": {"id": "m2l5c1", "type": "mc", "q": "<p>ماذا يُظهر الـ UML Class Diagram؟<\/p>", "exp": "<p>هو مخطط بنيوي ثابت. الترتيب الزمني في Sequence Diagram، والحالات في State Diagram.<\/p>", "opts": ["الـ classes وخصائصها وعملياتها والعلاقات بينها", "الترتيب الزمني للرسائل بين الـ objects", "حالات object واحد وانتقالاته", "زمن تنفيذ كل دالة"], "ans": 0}}, {"t": "بنية الـ Class: الأقسام الثلاثة", "html": "<p>يُرسم الـ class مستطيلًا من ثلاثة أقسام:<\/p>\n<ol><li><b>الاسم<\/b>.<\/li><li><b>Attributes<\/b> بالصيغة: <code dir=\"ltr\">visibility name: type<\/code>.<\/li><li><b>Operations<\/b> (methods) بالصيغة: <code dir=\"ltr\">visibility name(parameters): return_type<\/code>.<\/li><\/ol>\n<figure class=\"fig\" dir=\"ltr\"><svg viewBox=\"0 0 520 158\" width=\"520\" role=\"img\" aria-label=\"UML class box for Customer\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"10\" width=\"300\" height=\"138\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"170.0\" y=\"29\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Customer<\/text><line x1=\"20\" y1=\"38\" x2=\"320\" y2=\"38\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"28\" y=\"56\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- id: int<\/text><text x=\"28\" y=\"74\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- name: str<\/text><text x=\"28\" y=\"92\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >- email: str<\/text><line x1=\"20\" y1=\"102\" x2=\"320\" y2=\"102\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><text x=\"28\" y=\"120\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ update_profile(): None<\/text><text x=\"28\" y=\"138\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >+ create_reservation(): Reservation<\/text><text x=\"335\" y=\"30\" text-anchor=\"start\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >← class name<\/text><text x=\"335\" y=\"62\" text-anchor=\"start\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >← attributes<\/text><text x=\"335\" y=\"126\" text-anchor=\"start\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >← operations (methods)<\/text><\/svg><\/figure>\n<p>قراءة السطر <code dir=\"ltr\">- email: str<\/code>: الـ attribute اسمه <code dir=\"ltr\">email<\/code>، نوعه <code dir=\"ltr\">str<\/code>، وهو private.<\/p>\n<p>قراءة السطر <code dir=\"ltr\">+ create_reservation(): Reservation<\/code>: عملية public، بلا parameters، تعيد object من نوع <code dir=\"ltr\">Reservation<\/code>.<\/p>\n<p>ملاحظات:<\/p>\n<ul><li>القسمان الثاني والثالث اختياريان. في المخططات العامة يكفي الاسم.<\/li><li>استعملنا أسماء Python (<code dir=\"ltr\">snake_case<\/code> و <code dir=\"ltr\">str<\/code> و <code dir=\"ltr\">None<\/code>). الـ UML لا تفرض لغة، والمهم الاتساق.<\/li><li>النوع بعد النقطتين، عكس Java التي تكتبه قبل الاسم.<\/li><\/ul>", "q": {"id": "m2l5c2", "type": "mc", "q": "<p>كيف تقرأ السطر <code dir=\"ltr\">+ total(): float<\/code> في القسم الثالث من صندوق <code dir=\"ltr\">Order<\/code>؟<\/p>", "exp": "<p>القسم الثالث للعمليات. <code dir=\"ltr\">+<\/code> تعني public، والأقواس الفارغة تعني لا parameters، وما بعد النقطتين نوع القيمة المعادة.<\/p>", "opts": ["علاقة بين <code dir=\"ltr\">Order<\/code> و <code dir=\"ltr\">float<\/code>", "attribute private اسمه <code dir=\"ltr\">total<\/code>", "عملية private تستقبل <code dir=\"ltr\">float<\/code>", "عملية public اسمها <code dir=\"ltr\">total<\/code> بلا parameters وتعيد <code dir=\"ltr\">float<\/code>"], "ans": 3}}, {"t": "رموز الـ Visibility", "html": "<div class=\"tw\"><table><thead><tr><th>Symbol<\/th><th>المعنى<\/th><th>المقابل في Python<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">+<\/code><\/td><td>Public: متاح للجميع<\/td><td><code dir=\"ltr\">name<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">-<\/code><\/td><td>Private: داخل الـ class فقط<\/td><td><code dir=\"ltr\">__name<\/code> (أو <code dir=\"ltr\">_name<\/code> بالاصطلاح)<\/td><\/tr><tr><td><code dir=\"ltr\">#<\/code><\/td><td>Protected: الـ class والـ subclasses<\/td><td><code dir=\"ltr\">_name<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">~<\/code><\/td><td>Package: داخل الـ package نفسها<\/td><td>لا مقابل مباشر<\/td><\/tr><\/tbody><\/table><\/div>\n<p>القاعدة التصميمية من الـ encapsulation: الـ attributes غالبًا <code dir=\"ltr\">-<\/code> أو <code dir=\"ltr\">#<\/code>، والعمليات التي تشكّل الواجهة <code dir=\"ltr\">+<\/code>.<\/p>\n<p>إذا رأيت مخططًا كل attributes فيه <code dir=\"ltr\">+<\/code> فهو يخبرك أن الـ encapsulation مهملة: أي class يستطيع العبث ببيانات غيره.<\/p>", "q": {"id": "m2l5c3", "type": "sa", "q": "<p>أي رمز في UML يدل على protected visibility؟ (اكتب الرمز)<\/p>", "exp": "<p>الإجابة: <b><code dir=\"ltr\">#<\/code><\/b>. والباقي: <code dir=\"ltr\">+<\/code> للـ public، <code dir=\"ltr\">-<\/code> للـ private، <code dir=\"ltr\">~<\/code> للـ package.<\/p>", "kw": ["#"]}}, {"t": "Association", "html": "<p><b>Association<\/b> هي العلاقة الأساسية: class <b>يعرف<\/b> class آخر ويتعامل معه بشكل مستمر. تُقرأ «يملك / يستعمل»، وتُرسم <b>خطًّا متصلًا<\/b> بين الصندوقين.<\/p>\n<p>مثال: A customer makes reservations.<\/p>\n<p>إضافات على الخط:<\/p>\n<ul><li><b>اسم العلاقة<\/b>: كلمة توضّح معناها (makes).<\/li><li><b>Navigability<\/b> (اتجاه المعرفة): سهم مفتوح يدل على من يعرف من. <code dir=\"ltr\">Reservation → Customer<\/code> تعني أن الحجز يحتفظ بمرجع إلى العميل، والعميل لا يحتفظ بقائمة حجوزاته. خط بلا أسهم: الاتجاه غير محدّد أو متبادل.<\/li><li><b>Multiplicity<\/b>: كم object في كل طرف (مفهوم قادم).<\/li><\/ul>\n<p>في الكود تظهر الـ association كـ <b>attribute يحمل مرجعًا<\/b> إلى الـ object الآخر:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Reservation:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, customer: Customer):\n        <span class=\"kw\">self<\/span>.customer = customer       <span class=\"cm\"># association: Reservation يعرف Customer<\/span><\/code><\/pre><\/div>\n<p>كل علاقات الـ class diagram التالية حالات خاصة أو أقارب لهذه العلاقة:<\/p>\n<figure class=\"fig\" dir=\"ltr\"><svg viewBox=\"0 0 770 326\" width=\"770\" role=\"img\" aria-label=\"UML relationship notations\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"8\" y=\"36\" text-anchor=\"start\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Association<\/text><rect x=\"140\" y=\"14\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"205\" y=\"36\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Customer<\/text><rect x=\"410\" y=\"14\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"475\" y=\"36\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Reservation<\/text><line x1=\"270\" y1=\"31\" x2=\"410\" y2=\"31\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(410,31) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"762\" y=\"36\" style=\"fill:var(--mut);font:12.5px Tahoma,Arial,sans-serif\" direction=\"rtl\" text-anchor=\"start\">يعرف / يستخدم بشكل دائم<\/text><text x=\"8\" y=\"88\" text-anchor=\"start\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Aggregation<\/text><rect x=\"140\" y=\"66\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"205\" y=\"88\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Department<\/text><rect x=\"410\" y=\"66\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"475\" y=\"88\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Employee<\/text><line x1=\"288\" y1=\"83\" x2=\"410\" y2=\"83\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(270,83) rotate(180)\"><polygon points=\"0,0 -9,-5.5 -18,0 -9,5.5\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><\/g><text x=\"762\" y=\"88\" style=\"fill:var(--mut);font:12.5px Tahoma,Arial,sans-serif\" direction=\"rtl\" text-anchor=\"start\">has-a ضعيفة: الجزء يعيش مستقلًا<\/text><text x=\"8\" y=\"140\" text-anchor=\"start\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Composition<\/text><rect x=\"140\" y=\"118\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"205\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Order<\/text><rect x=\"410\" y=\"118\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"475\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >OrderItem<\/text><line x1=\"288\" y1=\"135\" x2=\"410\" y2=\"135\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(270,135) rotate(180)\"><polygon points=\"0,0 -9,-5.5 -18,0 -9,5.5\" style=\"stroke:var(--ink);fill:var(--ink)\"/><\/g><text x=\"762\" y=\"140\" style=\"fill:var(--mut);font:12.5px Tahoma,Arial,sans-serif\" direction=\"rtl\" text-anchor=\"start\">has-a قوية: الجزء يفنى مع الكل<\/text><text x=\"8\" y=\"192\" text-anchor=\"start\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Generalization<\/text><rect x=\"140\" y=\"170\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"205\" y=\"192\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Car<\/text><rect x=\"410\" y=\"170\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"475\" y=\"192\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Vehicle<\/text><line x1=\"270\" y1=\"187\" x2=\"397\" y2=\"187\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><g transform=\"translate(410,187) rotate(0)\"><polygon points=\"0,0 -13,-7.5 -13,7.5\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><\/g><text x=\"762\" y=\"192\" style=\"fill:var(--mut);font:12.5px Tahoma,Arial,sans-serif\" direction=\"rtl\" text-anchor=\"start\">is-a: وراثة<\/text><text x=\"8\" y=\"244\" text-anchor=\"start\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Realization<\/text><rect x=\"140\" y=\"222\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"205\" y=\"244\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >EmailNotifier<\/text><rect x=\"410\" y=\"222\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"475\" y=\"244\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >Notifier<\/text><line x1=\"270\" y1=\"239\" x2=\"397\" y2=\"239\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><g transform=\"translate(410,239) rotate(0)\"><polygon points=\"0,0 -13,-7.5 -13,7.5\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><\/g><text x=\"762\" y=\"244\" style=\"fill:var(--mut);font:12.5px Tahoma,Arial,sans-serif\" direction=\"rtl\" text-anchor=\"start\">ينفّذ interface<\/text><text x=\"8\" y=\"296\" text-anchor=\"start\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Dependency<\/text><rect x=\"140\" y=\"274\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"205\" y=\"296\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >ReportService<\/text><rect x=\"410\" y=\"274\" width=\"130\" height=\"34\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"475\" y=\"296\" text-anchor=\"middle\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >PDFGenerator<\/text><line x1=\"270\" y1=\"291\" x2=\"410\" y2=\"291\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" stroke-dasharray=\"6 4\"/><g transform=\"translate(410,291) rotate(0)\"><polyline points=\"-10,-6 0,0 -10,6\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\"/><\/g><text x=\"762\" y=\"296\" style=\"fill:var(--mut);font:12.5px Tahoma,Arial,sans-serif\" direction=\"rtl\" text-anchor=\"start\">استخدام مؤقت<\/text><\/svg><\/figure>", "q": {"id": "m2l5c4", "type": "mc", "q": "<p>ما معنى سهم الـ navigability من <code dir=\"ltr\">Reservation<\/code> إلى <code dir=\"ltr\">Customer<\/code>؟<\/p>", "exp": "<p>الـ navigability تحدّد اتجاه المعرفة: من أي object تستطيع الوصول إلى الآخر.<\/p>", "opts": ["الـ <code dir=\"ltr\">Customer<\/code> ينفّذ interface اسمها <code dir=\"ltr\">Reservation<\/code>", "الـ <code dir=\"ltr\">Customer<\/code> يُحذف عند حذف الحجز", "الـ <code dir=\"ltr\">Reservation<\/code> يرث من <code dir=\"ltr\">Customer<\/code>", "الـ <code dir=\"ltr\">Reservation<\/code> يحتفظ بمرجع إلى <code dir=\"ltr\">Customer<\/code> ويستطيع الوصول إليه"], "ans": 3}}, {"t": "Aggregation", "html": "<p><b>Aggregation<\/b> هي association من نوع <b>whole-part ضعيفة<\/b>: كلٌّ يجمع أجزاء، لكن الأجزاء <b>تستطيع الوجود مستقلة<\/b> عنه، وقد تشترك فيها عدة «كلّات».<\/p>\n<p>الرمز: <b>معيّن فارغ<\/b> (hollow diamond) عند طرف <b>الكل<\/b>.<\/p>\n<p>مثال: A department has employees. إذا أُلغي القسم يبقى الموظفون ويُنقلون.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> Employee:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str):\n        <span class=\"kw\">self<\/span>.name = name\n\n<span class=\"kw\">class<\/span> Department:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, name: str):\n        <span class=\"kw\">self<\/span>.name = name\n        <span class=\"kw\">self<\/span>._employees = []\n\n    <span class=\"kw\">def<\/span> add(<span class=\"kw\">self<\/span>, employee: Employee) -&gt; <span class=\"kw\">None<\/span>:    <span class=\"cm\"># الموظف أُنشئ في الخارج ثم سُلِّم<\/span>\n        <span class=\"kw\">self<\/span>._employees.append(employee)\n\nsara = Employee(<span class=\"st\">\"Sara\"<\/span>)\nsales = Department(<span class=\"st\">\"Sales\"<\/span>)\nsales.add(sara)\ndel sales                 <span class=\"cm\"># زال القسم<\/span>\nprint(sara.name)          <span class=\"cm\"># Sara ما زالت موجودة<\/span><\/code><\/pre><\/div>\n<p>العلامة في الكود: الجزء <b>يُنشأ خارج<\/b> الكل ثم <b>يُمرَّر<\/b> إليه.<\/p>\n<div class=\"note\">ملاحظة صريحة: الفرق بين association عادية و aggregation ضعيف في معيار UML نفسه، وكثير من الفرق لا تستعمل المعيّن الفارغ. المهم أن تميّز الـ composition.<\/div>", "q": {"id": "m2l5c5", "type": "tf", "q": "<p>في الـ aggregation، يمكن أن تستمر «الأجزاء» في الوجود بعد زوال «الكل».<\/p>", "exp": "<p>نعم، وهذا ما يميّزها عن الـ composition التي تفنى فيها الأجزاء مع الكل.<\/p>", "opts": ["صح", "خطأ"], "ans": 0}}, {"t": "Composition", "html": "<p><b>Composition<\/b> علاقة <b>whole-part قوية<\/b>: الأجزاء <b>تنتمي إلى كلّ واحد فقط<\/b>، وعمرها مرتبط بعمره. إذا زال الكل زالت.<\/p>\n<p>الرمز: <b>معيّن مملوء<\/b> (filled diamond) عند طرف <b>الكل<\/b>.<\/p>\n<p>مثال: An order contains order items. عنصر الطلب لا معنى له خارج طلبه، ولا يُشارك بين طلبين.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> OrderItem:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>, product_name: str, unit_price: float, quantity: int):\n        <span class=\"kw\">self<\/span>.product_name = product_name\n        <span class=\"kw\">self<\/span>.unit_price = unit_price\n        <span class=\"kw\">self<\/span>.quantity = quantity\n\n<span class=\"kw\">class<\/span> Order:\n    <span class=\"kw\">def<\/span> __init__(<span class=\"kw\">self<\/span>):\n        <span class=\"kw\">self<\/span>._items: list[OrderItem] = []\n\n    <span class=\"kw\">def<\/span> add_item(<span class=\"kw\">self<\/span>, product_name: str, unit_price: float, quantity: int) -&gt; <span class=\"kw\">None<\/span>:\n        <span class=\"kw\">self<\/span>._items.append(OrderItem(product_name, unit_price, quantity))   <span class=\"cm\"># الكل ينشئ الجزء<\/span>\n\n    <span class=\"kw\">def<\/span> total(<span class=\"kw\">self<\/span>) -&gt; float:\n        <span class=\"kw\">return<\/span> sum(i.unit_price * i.quantity <span class=\"kw\">for<\/span> i <span class=\"kw\">in<\/span> <span class=\"kw\">self<\/span>._items)<\/code><\/pre><\/div>\n<p>العلامة في الكود: الكل <b>ينشئ<\/b> أجزاءه بنفسه ولا يسلّمها لأحد.<\/p>\n<p>كما قال الـ roadmap: الحكم يكون «in the intended model»، أي حسب قواعد <b>مجالك<\/b>. هل يمكن نقل غرفة من فندق إلى آخر؟ لا، إذن composition. هل يمكن نقل موظف بين الأقسام؟ نعم، إذن aggregation.<\/p>", "q": {"id": "m2l5c6", "type": "sc", "sc": "<code dir=\"ltr\">Invoice<\/code> تحتوي <code dir=\"ltr\">InvoiceLine<\/code> (سطر في الفاتورة). السطر يُنشأ داخل الفاتورة، ولا يظهر في فاتورة أخرى، ويُحذف بحذفها.", "q": "<p>ما العلاقة وما رمزها؟<\/p>", "exp": "<p>ملكية حصرية وعمر مرتبط بالكل: هذا composition. والمعيّن يوضع دائمًا عند طرف الكل.<\/p>", "opts": ["Composition، معيّن مملوء عند <code dir=\"ltr\">Invoice<\/code>", "Inheritance، مثلث فارغ عند <code dir=\"ltr\">Invoice<\/code>", "Aggregation، معيّن فارغ عند <code dir=\"ltr\">InvoiceLine<\/code>", "Dependency، سهم متقطّع"], "ans": 0}}, {"t": "Inheritance / Generalization و Realization", "html": "<p><b>Generalization<\/b>: class يتخصّص من class آخر (is-a). الرمز: <b>خط متصل ينتهي بمثلث فارغ<\/b> يشير إلى <b>الأب<\/b>.<\/p>\n<p>مثال: <code dir=\"ltr\">Car<\/code> inherits from <code dir=\"ltr\">Vehicle<\/code>. السهم من <code dir=\"ltr\">Car<\/code> نحو <code dir=\"ltr\">Vehicle<\/code>.<\/p>\n<p><b>Realization<\/b>: class <b>ينفّذ<\/b> interface، أي يوفّر تنفيذًا لكل عملياتها. الرمز: <b>خط متقطّع ينتهي بمثلث فارغ<\/b> يشير إلى الـ <b>interface<\/b>.<\/p>\n<p>مثال: <code dir=\"ltr\">EmailNotifier<\/code> realizes <code dir=\"ltr\">Notifier<\/code>.<\/p>\n<p>للتذكّر:<\/p>\n<ul><li>المثلث الفارغ يعني «هو نوع من / يحقق عقد». ورأس المثلث دائمًا عند <b>الأعمّ<\/b>.<\/li><li>خط <b>متصل<\/b>: وراثة من class (ترث تنفيذًا).<\/li><li>خط <b>متقطّع<\/b>: تنفيذ interface (تلتزم بعقد فقط).<\/li><\/ul>\n<p>خطأ شائع جدًا عند المبتدئين: رسم السهم معكوسًا من الأب إلى الابن. تذكّر: الابن هو الذي <b>يعرف<\/b> أباه ويشير إليه، والأب لا يعرف أبناءه.<\/p>", "q": {"id": "m2l5c7", "type": "mc", "q": "<p>إلى أين يشير رأس المثلث الفارغ في علاقة generalization بين <code dir=\"ltr\">Car<\/code> و <code dir=\"ltr\">Vehicle<\/code>؟<\/p>", "exp": "<p>السهم يخرج من الأخص ويشير إلى الأعم.<\/p>", "opts": ["لا يوجد مثلث في هذه العلاقة", "إلى الاثنين", "إلى <code dir=\"ltr\">Car<\/code> (الـ subclass)", "إلى <code dir=\"ltr\">Vehicle<\/code> (الـ superclass)"], "ans": 3}}, {"t": "Dependency", "html": "<p><b>Dependency<\/b> أضعف العلاقات: class <b>يستعمل<\/b> class آخر <b>مؤقتًا<\/b> دون أن يحتفظ به كـ attribute. الرمز: <b>سهم متقطّع برأس مفتوح<\/b> من المستعمِل إلى المستعمَل.<\/p>\n<p>تظهر حين يكون الـ class الآخر:<\/p>\n<ul><li><b>parameter<\/b> لـ method،<\/li><li>أو <b>متغيّرًا محليًا<\/b> يُنشأ داخلها،<\/li><li>أو <b>نوع القيمة المعادة<\/b>.<\/li><\/ul>\n<p>مثال: <code dir=\"ltr\">ReportService<\/code> uses <code dir=\"ltr\">PDFGenerator<\/code> to generate reports.<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>python<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code><span class=\"kw\">class<\/span> ReportService:\n    <span class=\"kw\">def<\/span> monthly_report(<span class=\"kw\">self<\/span>, reservations: list, generator: PDFGenerator) -&gt; bytes:\n        text = f<span class=\"st\">\"Reservations this month: {len(reservations)}\"<\/span>\n        <span class=\"kw\">return<\/span> generator.render(text)      <span class=\"cm\"># استعمال مؤقت داخل الـ method فقط<\/span><\/code><\/pre><\/div>\n<p>الفرق عن الـ association: لو كان <code dir=\"ltr\">self.generator = PDFGenerator()<\/code> مخزّنًا في <code dir=\"ltr\">__init__<\/code> لصارت association.<\/p>\n<p>معنى الـ dependency: «تغيير واجهة <code dir=\"ltr\">PDFGenerator<\/code> <b>قد<\/b> يستلزم تعديل <code dir=\"ltr\">ReportService<\/code>».<\/p>\n<p>ملخّص من الأضعف إلى الأقوى: Dependency ثم Association ثم Aggregation ثم Composition ثم Inheritance.<\/p>", "q": {"id": "m2l5c8", "type": "mc", "q": "<p>method في <code dir=\"ltr\">OrderService<\/code> تستقبل <code dir=\"ltr\">logger: Logger<\/code> كـ parameter وتستعمله ثم تنتهي، دون تخزينه. ما العلاقة بين <code dir=\"ltr\">OrderService<\/code> و <code dir=\"ltr\">Logger<\/code>؟<\/p>", "exp": "<p>استعمال مؤقت عبر parameter دون الاحتفاظ بمرجع دائم هو dependency.<\/p>", "opts": ["Inheritance", "Dependency", "Composition", "Aggregation"], "ans": 1}}, {"t": "Multiplicity", "html": "<p><b>Multiplicity<\/b> تحدّد <b>كم instance<\/b> من class يمكن أن يرتبط بـ instance واحد من الطرف الآخر. تُكتب عند طرفَي الخط.<\/p>\n<div class=\"tw\"><table><thead><tr><th>الرمز<\/th><th>المعنى<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">1<\/code><\/td><td>واحد بالضبط<\/td><\/tr><tr><td><code dir=\"ltr\">0..1<\/code><\/td><td>صفر أو واحد (اختياري)<\/td><\/tr><tr><td><code dir=\"ltr\">*<\/code> أو <code dir=\"ltr\">0..*<\/code><\/td><td>صفر أو أكثر (<b>الرمزان متطابقان تمامًا<\/b>)<\/td><\/tr><tr><td><code dir=\"ltr\">1..*<\/code><\/td><td>واحد أو أكثر<\/td><\/tr><tr><td><code dir=\"ltr\">2..5<\/code><\/td><td>من 2 إلى 5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>مثال: العميل قد يملك عدة حجوزات، والحجز يخص عميلًا واحدًا:<\/p>\n<figure class=\"fig\" dir=\"ltr\"><svg viewBox=\"0 0 620 70\" width=\"620\" role=\"img\" aria-label=\"Customer 1 to 0..* Reservation\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"20\" width=\"170\" height=\"28\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"105.0\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Customer<\/text><rect x=\"430\" y=\"20\" width=\"170\" height=\"28\" rx=\"3\" style=\"stroke:var(--ink);fill:var(--box);stroke-width:1.4\"/><text x=\"515.0\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--ink);font:bold 13.5px Consolas,Menlo,monospace\" >Reservation<\/text><line x1=\"190\" y1=\"34\" x2=\"430\" y2=\"34\" style=\"stroke:var(--ink);fill:none;stroke-width:1.4\" /><text x=\"198\" y=\"26\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >1<\/text><text x=\"392\" y=\"26\" text-anchor=\"start\" style=\"fill:var(--ink);font:13px Consolas,Menlo,monospace\" >0..*<\/text><text x=\"310\" y=\"54\" text-anchor=\"middle\" style=\"fill:var(--mut);font:12px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round\" >makes ▸<\/text><\/svg><\/figure>\n<p><b>طريقة القراءة<\/b> (مصدر خطأ شائع): ثبّت object <b>واحدًا<\/b> من طرف، واقرأ الرقم عند الطرف <b>المقابل<\/b>.<\/p>\n<ul><li>عميل واحد يرتبط بـ <span class=\"math\" dir=\"ltr\">0..*<\/span> حجزًا.<\/li><li>حجز واحد يرتبط بـ <span class=\"math\" dir=\"ltr\">1<\/span> عميل بالضبط.<\/li><\/ul>\n<p>الـ multiplicity ليست زينة، بل <b>قواعد عمل<\/b>: الفرق بين <span class=\"math\" dir=\"ltr\">0..*<\/span> و <span class=\"math\" dir=\"ltr\">1..*<\/span> هو الفرق بين «يمكن وجود طلب فارغ» و«الطلب يجب أن يحتوي عنصرًا واحدًا على الأقل».<\/p>", "q": {"id": "m2l5c9", "type": "mc", "q": "<p><code dir=\"ltr\">Order 1 ——— 1..* OrderItem<\/code>. ما المعنى الصحيح؟<\/p>", "exp": "<p>ثبّت طلبًا واحدًا واقرأ عند العناصر: <span class=\"math\" dir=\"ltr\">1..*<\/span>. ثبّت عنصرًا واحدًا واقرأ عند الطلب: <span class=\"math\" dir=\"ltr\">1<\/span>.<\/p>", "opts": ["الطلب يمكن أن يكون بلا عناصر", "كل طلب يحتوي عنصرًا واحدًا على الأقل، وكل عنصر ينتمي إلى طلب واحد بالضبط", "كل طلب يحتوي عنصرًا واحدًا فقط", "العنصر يمكن أن ينتمي إلى عدة طلبات"], "ans": 1}}, {"t": "قراءة مخطط كامل", "html": "<p>لنقرأ مخططًا صغيرًا مكتوبًا نصيًا:<\/p>\n<div class=\"code\" dir=\"ltr\"><div class=\"code-h\"><span>text<\/span><button class=\"copy\" data-act=\"copy\">نسخ<\/button><\/div><pre><code>Customer  1 ────────── 0..*  Reservation\nReservation  0..* ─────────&gt; 1  Room\nHotel  1 ◆────────── 1..*  Room\nReservation  1 ◆────────── 0..1  Payment\nReservation  - - - - - - -&gt; PriceCalculator\nVipCustomer ────────▷ Customer<\/code><\/pre><\/div>\n<p>القراءة سطرًا بسطر:<\/p>\n<ol><li>العميل له صفر أو أكثر من الحجوزات، والحجز لعميل واحد.<\/li><li>الحجز يعرف غرفة واحدة (navigability نحو <code dir=\"ltr\">Room<\/code>)، والغرفة تظهر في عدة حجوزات عبر الزمن.<\/li><li>الفندق <b>يتكوّن<\/b> من غرفة واحدة على الأقل (composition): الغرف لا توجد دون فندقها.<\/li><li>الحجز <b>يملك<\/b> دفعة واحدة على الأكثر (composition).<\/li><li>الحجز <b>يستعمل<\/b> <code dir=\"ltr\">PriceCalculator<\/code> مؤقتًا (dependency).<\/li><li><code dir=\"ltr\">VipCustomer<\/code> <b>نوع من<\/b> <code dir=\"ltr\">Customer<\/code> (generalization).<\/li><\/ol>\n<p>خطوات قراءة أي مخطط: ابدأ بالـ classes المركزية (الأكثر خطوطًا)، ثم اقرأ كل علاقة كجملة عربية كاملة، ثم اسأل: هل هذه الجملة <b>صحيحة في المجال<\/b>؟<\/p>", "q": {"id": "m2l5c10", "type": "mc", "q": "<p>حسب المخطط أعلاه، هل يمكن وجود <code dir=\"ltr\">Hotel<\/code> بلا أي <code dir=\"ltr\">Room<\/code>؟<\/p>", "exp": "<p><code dir=\"ltr\">1..*<\/code> تعني واحدًا على الأقل. لو أردنا السماح بفندق بلا غرف لكتبنا <code dir=\"ltr\">0..*<\/code>.<\/p>", "opts": ["نعم، لأن <code dir=\"ltr\">*<\/code> تعني صفر أو أكثر", "نعم، لأن العلاقة composition", "لا، لأن الـ multiplicity عند <code dir=\"ltr\">Room<\/code> هي <code dir=\"ltr\">1..*<\/code>", "المخطط لا يحدّد ذلك"], "ans": 2}}], "test": [{"id": "m2l5t1", "type": "mc", "q": "<p>أي ترتيب للعلاقات صحيح من الأضعف ارتباطًا إلى الأقوى؟<\/p>", "exp": "<p>الـ dependency استعمال عابر، والـ association معرفة دائمة، والـ aggregation تجميع، والـ composition ملكية حصرية بعمر مشترك.<\/p>", "opts": ["Dependency ثم Association ثم Aggregation ثم Composition", "Association ثم Dependency ثم Composition ثم Aggregation", "Composition ثم Aggregation ثم Association ثم Dependency", "كلها بالقوة نفسها"], "ans": 0}, {"id": "m2l5t2", "type": "sc", "sc": "مخطط فيه: <code dir=\"ltr\">Library ◇── Book<\/code> و <code dir=\"ltr\">Book ◆── Page<\/code>.", "q": "<p>ما القراءة الصحيحة؟<\/p>", "exp": "<p>المعيّن الفارغ aggregation (الأجزاء مستقلة)، والمملوء composition (الأجزاء تفنى مع الكل).<\/p>", "opts": ["الكتاب يرث من المكتبة", "الصفحات تعيش بعد إتلاف الكتاب", "المكتبة تُحذف إذا حُذف كتاب", "المكتبة تجمع كتبًا تستطيع الوجود خارجها، والكتاب يتكوّن من صفحات لا توجد دونه"], "ans": 3}, {"id": "m2l5t3", "type": "tf", "q": "<p>الرمزان <code dir=\"ltr\">*<\/code> و <code dir=\"ltr\">0..*<\/code> في الـ multiplicity لهما معنيان مختلفان.<\/p>", "exp": "<p>متطابقان: كلاهما «صفر أو أكثر».<\/p>", "opts": ["صح", "خطأ"], "ans": 1}, {"id": "m2l5t4", "type": "mc", "q": "<p>ما الفرق في الرسم بين generalization و realization؟<\/p>", "exp": "<p>المثلث الفارغ مشترك. المتصل للوراثة من class، والمتقطّ
