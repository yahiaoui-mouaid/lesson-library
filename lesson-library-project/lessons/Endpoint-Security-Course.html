 كل Router، وإذا وصل 0 أُسقط الـ Packet. يمنع الدوران اللانهائي<\/td><\/tr><tr><td>Protocol<\/td><td>ما بداخل الـ Packet: 1 = ICMP، 6 = TCP، 17 = UDP<\/td><\/tr><tr><td>Header Checksum<\/td><td>لكشف تلف الـ Header<\/td><\/tr><tr><td>Source / Destination IPv4 Address<\/td><td>عنوانا المصدر والوجهة، 32 بت لكل منهما<\/td><\/tr><tr><td>Options and Padding<\/td><td>خيارات نادرة الاستخدام<\/td><\/tr><\/table><\/div><p>طول الـ Header بالبايت:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>Header Length<\/mtext><mo>=<\/mo><mtext>IHL<\/mtext><mo>×<\/mo><mn>4<\/mn><\/mrow><\/math><\/p><p>فإذا كانت IHL = 5 فالطول 20 بايت.<\/p>", "q": {"k": "mc", "q": "Packet قيمة TTL فيه 1 وصل إلى Router ليس هو الوجهة. ماذا يحدث؟", "e": "كل Router ينقص TTL بواحد. عند الصفر يُسقط الـ Packet، وهذا ما تعتمد عليه أداة traceroute.", "o": ["يمرره مع TTL = 1", "ينقص TTL إلى 0 فيسقطه ويرسل للمصدر رسالة ICMP Time Exceeded", "يعيد TTL إلى 255"], "a": 1}}, {"t": "The IPv6 Packet Header", "b": "<p>الـ Header في IPv6 <b>ثابت الطول: 40 بايت<\/b>، وأبسط من IPv4 فيعالَج أسرع.<\/p><div class=\"tw\"><table><tr><th>الحقل<\/th><th>وظيفته<\/th><\/tr><tr><td>Version<\/td><td>= 6<\/td><\/tr><tr><td>Traffic Class<\/td><td>يقابل DS في IPv4 (الأولوية)<\/td><\/tr><tr><td>Flow Label<\/td><td>يميّز Packets تنتمي لتدفق واحد لتعامَل معاملة واحدة<\/td><\/tr><tr><td>Payload Length<\/td><td>طول ما بعد الـ Header<\/td><\/tr><tr><td>Next Header<\/td><td>نوع ما يليه (TCP، UDP، أو Extension Header)، يقابل Protocol<\/td><\/tr><tr><td>Hop Limit<\/td><td>يقابل TTL<\/td><\/tr><tr><td>Source / Destination IPv6 Address<\/td><td>128 بت لكل منهما<\/td><\/tr><\/table><\/div><p>ما حُذف: Header Checksum (الطبقات الأخرى تتكفل بالتحقق)، وحقول الـ Fragmentation (انتقلت إلى <b>Extension Headers<\/b> اختيارية، والتقسيم يقوم به المرسل فقط وليس الـ Routers).<\/p>", "q": {"k": "mc", "q": "أي حقل في IPv6 يؤدي وظيفة TTL في IPv4؟", "e": "Hop Limit ينقص عند كل Router ويُسقط الـ Packet عند الصفر، تماماً كالـ TTL.", "o": ["Flow Label", "Hop Limit", "Next Header"], "a": 1}}, {"t": "تمرين: قراءة Headers كما في Wireshark", "b": "<p><b>Wireshark<\/b> برنامج مجاني يلتقط الـ Packets ويعرض حقولها (Protocol analyzer). الفيديوهان في الدورة الأصلية يعرضان التقاطاً حقيقياً. اقرأ هذا المخرج كما يظهر فيه:<\/p><pre dir=\"ltr\"><code>Internet Protocol Version 4, Src: 192.168.1.10, Dst: 93.184.216.34\n    0100 .... = Version: 4\n    .... 0101 = Header Length: 20 bytes (5)\n    Total Length: 60\n    Identification: 0x1c46\n    Flags: 0x40, Don&#x27;t fragment\n    Time to Live: 64\n    Protocol: TCP (6)\n    Header Checksum: 0xb1e6 [validation disabled]<\/code><\/pre><p>لاحظ: IHL = 5 أي 20 بايت. العلم Don't fragment مفعّل. الـ TTL = 64 قيمة ابتدائية شائعة في Linux و macOS (و Windows يبدأ عادةً من 128). الحمولة TCP.<\/p><p>إن كان Wireshark مثبتاً عندك: التقط حركة تصفح عادية، واكتب في الفلتر <code dir=\"ltr\">ip<\/code> ثم <code dir=\"ltr\">ipv6<\/code> وقارن الحقول.<\/p>", "q": {"k": "mc", "q": "في المخرج أعلاه، ما البروتوكول المحمول داخل الـ Packet؟", "e": "حقل Protocol قيمته 6، وهي رقم TCP. (1 = ICMP و 17 = UDP).", "o": ["ICMP", "TCP", "UDP"], "a": 1}}], "test": [{"k": "mc", "q": "حلّلت Packet فوجدت IHL = 6. كم بايت طول الـ Header، وماذا يعني ذلك؟", "e": "الطول = 6 × 4 = 24 بايت. الحد الأدنى 20، فالأربعة الزائدة هي Options، وهي نادرة وتستحق نظرة ثانية.", "o": ["6 بايت، وهو تالف", "24 بايت، أي يحتوي على حقل Options", "60 بايت"], "a": 1}, {"k": "tf", "q": "الـ Header في IPv6 يحتوي على حقل Checksum مثل IPv4.", "e": "حُذف الـ Checksum من IPv6 لتبسيط المعالجة؛ تتكفل طبقات أخرى بكشف الأخطاء.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "3.2 IP Vulnerabilities", "kind": "lesson", "cs": [{"t": "IP Vulnerabilities: نظرة عامة", "b": "<p>أشهر الهجمات التي تستغل IP:<\/p><ul><li><b>ICMP attacks<\/b>: استخدام رسائل ICMP (مثل ping) للاستطلاع أو للإغراق.<\/li><li><b>DoS / DDoS<\/b>: منع الخدمة عن مستخدميها.<\/li><li><b>Address spoofing<\/b>: تزوير عنوان المصدر في الـ Packet.<\/li><li><b>Man-in-the-Middle (On-Path)<\/b>: التموضع بين المصدر والوجهة.<\/li><li><b>Session hijacking<\/b>: الاستيلاء على جلسة قائمة بعد الوصول للشبكة الفيزيائية.<\/li><li><b>Amplification and reflection<\/b>: استخدام أجهزة بريئة لتكبير الهجوم.<\/li><\/ul><p>كلها تعود إلى الحقيقة نفسها: IP لا يتحقق من المصدر ولا يشفّر.<\/p>", "q": {"k": "mc", "q": "أي خاصية في IP هي أصل معظم هذه الهجمات؟", "e": "غياب التحقق من المصدر يسمح بالتزوير، ومنه تتفرع هجمات الانعكاس والتضخيم وغيرها.", "o": ["أن العنوان 32 بت", "أنه لا يتحقق من هوية المرسل ولا من صحة عنوان المصدر", "أنه يستخدم TTL"], "a": 1}}, {"t": "ICMP Attacks", "b": "<p><b>ICMP<\/b> (Internet Control Message Protocol) بروتوكول مساعد لـ IP، ينقل رسائل التشخيص والأخطاء. أداة <code dir=\"ltr\">ping<\/code> ترسل <b>Echo Request<\/b> وتنتظر <b>Echo Reply<\/b>.<\/p><p>كيف يسيء المهاجم استخدامه:<\/p><div class=\"tw\"><table><tr><th>رسالة ICMP<\/th><th>الاستغلال<\/th><\/tr><tr><td>Echo Request / Reply<\/td><td>اكتشاف الأجهزة الحية (Ping sweep)، وإغراق الهدف (ICMP flood)<\/td><\/tr><tr><td>Unreachable<\/td><td>استطلاع ومسح الشبكة<\/td><\/tr><tr><td>Mask Reply<\/td><td>معرفة تقسيم الشبكة الداخلية<\/td><\/tr><tr><td>Redirect<\/td><td>خداع جهاز ليرسل حركته عبر جهاز المهاجم (MitM)<\/td><\/tr><tr><td>Router Discovery<\/td><td>حقن مسارات مزيفة في جدول توجيه الهدف<\/td><\/tr><\/table><\/div><p>الدفاع: فلترة ICMP على حدود الشبكة بـ <b>ACL<\/b> صارمة تمنع الاستطلاع من الخارج، مع السماح بما تحتاجه الشبكة داخلياً، وتحليل الحركة بـ IDS/IPS.<\/p>", "q": {"k": "mc", "q": "مهاجم أرسل Echo Request إلى كل عناوين الشبكة <code dir=\"ltr\">10.0.0.1<\/code> حتى <code dir=\"ltr\">10.0.0.254<\/code> وسجّل من ردّ. ما الهدف؟", "e": "هذا مسح لاكتشاف الأهداف، وهو عادةً أول خطوة في الهجوم.", "o": ["تشفير الشبكة", "الاستطلاع: معرفة الأجهزة الحية (Ping sweep)", "تحديث الأجهزة"], "a": 1}}, {"t": "Amplification and Reflection Attacks", "b": "<p>هجوم DoS ذكي يستخدم أجهزة بريئة لمضاعفة قوة المهاجم:<\/p><ul><li><b>Reflection<\/b> (الانعكاس): المهاجم يرسل طلبات إلى خوادم بريئة ويزوّر عنوان المصدر ليكون <b>عنوان الضحية<\/b>. الخوادم ترد على الضحية وليس على المهاجم.<\/li><li><b>Amplification<\/b> (التضخيم): يختار المهاجم طلباً صغيراً ردّه كبير، فيتضاعف الحجم.<\/li><\/ul><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>Amplification Factor<\/mtext><mo>=<\/mo><mfrac><mrow><mtext>Response Size<\/mtext><\/mrow><mrow><mtext>Request Size<\/mtext><\/mrow><\/mfrac><\/mrow><\/math><\/p><p>مثال: طلب حجمه 60 بايت وردّه 3000 بايت، فالمعامل 50. مهاجم يملك 10 Mbps يوجّه نظرياً 500 Mbps إلى الضحية.<\/p><p>المثال الكلاسيكي <b>Smurf attack<\/b>: Echo Requests إلى عنوان البث (Broadcast) بمصدر مزور، فترد كل الأجهزة على الضحية. اليوم يُستخدم DNS و NTP للتضخيم.<\/p>", "q": {"k": "mc", "q": "طلب DNS حجمه 50 بايت يولّد رداً حجمه 2500 بايت. ما معامل التضخيم؟", "e": "المعامل = 2500 ÷ 50 = 50. كل بايت يرسله المهاجم يصل الضحية خمسين.", "o": ["5", "50", "2450"], "a": 1}}, {"t": "Address Spoofing Attacks", "b": "<p><b>IP spoofing<\/b>: إنشاء Packets بعنوان مصدر مزور، لإخفاء هوية المرسل أو لانتحال جهاز موثوق. نوعان:<\/p><ul><li><b>Non-blind spoofing<\/b>: المهاجم يرى الردود المتبادلة بين الهدف والجهاز المنتحَل (هو على مسارهما)، فيعرف أرقام التسلسل ويستطيع اختطاف الجلسة.<\/li><li><b>Blind spoofing<\/b>: لا يرى الردود. يكفي في هجمات DoS التي لا تحتاج رداً.<\/li><\/ul><p><b>MAC spoofing<\/b>: المهاجم داخل الشبكة يغيّر عنوان MAC لجهازه ليطابق جهازاً آخر، فيحدّث الـ Switch جدوله ويرسل له حركة ذلك الجهاز.<\/p><p>الدفاع: فلترة عند الحدود تسقط العناوين المستحيلة (Ingress/Egress filtering)، وخصائص الـ Switch مثل Port Security.<\/p>", "q": {"k": "mc", "q": "مهاجم يشن DDoS بعناوين مصدر مزورة عشوائية ولا تهمه الردود. أي نوع Spoofing هذا؟", "e": "لا يرى الردود ولا يحتاجها؛ غرضه الإغراق فقط. هذا Blind spoofing.", "o": ["Non-blind spoofing", "Blind spoofing", "MAC spoofing"], "a": 1}}], "test": [{"k": "mc", "q": "خوادم NTP عامة ترسل فجأة سيلاً من الردود الكبيرة إلى خادم شركتك، وهو لم يطلب منها شيئاً. ما التفسير؟", "e": "ردود بلا طلبات تعني أن طرفاً ثالثاً زوّر عنوانك. الخوادم العاكسة ضحية أيضاً.", "o": ["خوادم NTP أصيبت بـ Ransomware", "هجوم Reflection/Amplification: المهاجم أرسل لها طلبات بعنوان خادمك كمصدر مزور", "خادمك يحدّث ساعته"], "a": 1}, {"k": "sa", "q": "لماذا يفيد إسقاط الـ Packets ذات عناوين المصدر غير المنطقية عند حدود الشبكة؟", "e": "لأنه يمنع IP spoofing: الـ Packet القادم من الخارج بعنوان داخلي، أو الخارج من شبكتك بعنوان ليس من نطاقها، مزور حتماً. إسقاطه يقطع هجمات الانعكاس والانتحال.", "kw": [["spoof", "تزوير", "انتحال", "مزور"]]}]}, {"t": "3.3 TCP and UDP Vulnerabilities", "kind": "lesson", "cs": [{"t": "TCP Segment Header", "b": "<p><b>TCP<\/b> (Transmission Control Protocol) بروتوكول الطبقة الرابعة الموثوق. الـ Header طوله 20 بايت على الأقل:<\/p><div class=\"tw\"><table><tr><th>الحقل<\/th><th>وظيفته<\/th><\/tr><tr><td>Source / Destination Port<\/td><td>رقما منفذ البرنامجين<\/td><\/tr><tr><td>Sequence Number<\/td><td>رقم أول بايت في هذا الـ Segment (لترتيب البيانات)<\/td><\/tr><tr><td>Acknowledgment Number<\/td><td>رقم البايت التالي المنتظر من الطرف الآخر<\/td><\/tr><tr><td>Header Length<\/td><td>طول الـ Header<\/td><\/tr><tr><td>Control Bits (Flags)<\/td><td>ستة أعلام تتحكم في الاتصال<\/td><\/tr><tr><td>Window Size<\/td><td>كم بايت يستطيع المستقبل قبوله (Flow control)<\/td><\/tr><tr><td>Checksum<\/td><td>كشف الأخطاء<\/td><\/tr><\/table><\/div><p>الأعلام الستة:<\/p><ul><li><b>SYN<\/b>: طلب بدء اتصال ومزامنة أرقام التسلسل.<\/li><li><b>ACK<\/b>: تأكيد استلام.<\/li><li><b>FIN<\/b>: إنهاء مهذب للاتصال.<\/li><li><b>RST<\/b>: قطع فوري للاتصال.<\/li><li><b>PSH<\/b>: سلّم البيانات للتطبيق فوراً.<\/li><li><b>URG<\/b>: بيانات عاجلة.<\/li><\/ul>", "q": {"k": "mc", "q": "أي علم TCP يقطع الاتصال فوراً دون إجراءات إنهاء؟", "e": "RST (Reset) يقطع فوراً. FIN ينهي الاتصال بتبادل مهذب من الطرفين.", "o": ["FIN", "RST", "SYN"], "a": 1}}, {"t": "TCP Services: الاتصال الموثوق", "b": "<p>TCP يقدم ثلاث خدمات:<\/p><ul><li><b>Reliable delivery<\/b>: كل بايت يُؤكَّد استلامه (ACK)، وما لم يُؤكَّد يُعاد إرساله.<\/li><li><b>Flow control<\/b>: المستقبل يعلن حجم نافذته حتى لا يُغرَق.<\/li><li><b>Stateful communication<\/b>: يُنشأ اتصال قبل نقل البيانات عبر <b>Three-way handshake<\/b>:<\/li><\/ul><pre dir=\"ltr\"><code>Client                      Server\n  | ---- SYN (seq=x) -------&gt;  |\n  | &lt;--- SYN-ACK (seq=y,       |\n  |        ack=x+1) ---------  |\n  | ---- ACK (ack=y+1) -----&gt;  |\n  |      connection open       |<\/code><\/pre><p>رقم التأكيد دائماً رقم التسلسل المستلم زائد واحد في المصافحة:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>ACK<\/mtext><mo>=<\/mo><msub><mtext>SEQ<\/mtext><mrow><mtext>received<\/mtext><\/mrow><\/msub><mo>+<\/mo><mn>1<\/mn><\/mrow><\/math><\/p><p>وينتهي الاتصال بأربع خطوات: FIN ثم ACK من كل طرف.<\/p>", "q": {"k": "mc", "q": "ما الترتيب الصحيح للـ Three-way handshake؟", "e": "العميل يطلب (SYN)، الخادم يوافق ويطلب بدوره (SYN-ACK)، العميل يؤكد (ACK).", "o": ["SYN ثم ACK ثم FIN", "SYN ثم SYN-ACK ثم ACK", "ACK ثم SYN ثم SYN-ACK"], "a": 1}}, {"t": "TCP Attacks", "b": "<ul><li><b>TCP SYN flood<\/b>: المهاجم يرسل سيلاً من SYN بعناوين مصدر مزورة. الخادم يرد بـ SYN-ACK ويحجز موارد لكل اتصال «نصف مفتوح» (<b>Half-open<\/b>) وينتظر ACK لن يأتي. يمتلئ جدول الاتصالات فيُرفض المستخدمون الحقيقيون.<\/li><li><b>TCP reset attack<\/b>: المهاجم يرسل Segment مزوراً فيه RST إلى أحد الطرفين أو كليهما فينقطع اتصالهما.<\/li><li><b>TCP session hijacking<\/b>: المهاجم يتوقع أو يرى أرقام التسلسل، فينتحل أحد الطرفين ويرسل بيانات باسمه في جلسة مصادَق عليها. صعب لكنه خطير.<\/li><\/ul><p>الدفاع: <b>SYN cookies<\/b> على الخادم (لا يحجز موارد قبل اكتمال المصافحة)، وتحديد معدل الاتصالات على الـ Firewall، وتشفير الجلسات (TLS).<\/p>", "q": {"k": "mc", "q": "خادم ويب جدول اتصالاته ممتلئ بآلاف الاتصالات في حالة «بانتظار ACK» من عناوين لا ترد. ما الهجوم؟", "e": "اتصالات نصف مفتوحة بكثرة من مصادر لا تكمل المصافحة هي علامة SYN flood.", "o": ["TCP SYN flood", "TCP reset attack", "UDP flood"], "a": 0}}, {"t": "UDP Segment Header and Operation", "b": "<p><b>UDP<\/b> (User Datagram Protocol) بروتوكول الطبقة الرابعة البسيط:<\/p><ul><li><b>Connectionless<\/b>: لا مصافحة.<\/li><li>لا تأكيد ولا إعادة إرسال ولا ترتيب ولا تحكم في التدفق.<\/li><li>الـ Header 8 بايت فقط بأربعة حقول: Source Port، Destination Port، Length، Checksum.<\/li><\/ul><p>لماذا يُستخدم إذن؟ لأنه سريع وخفيف. يناسب ما يتحمل فقدان القليل ولا يتحمل التأخير: DNS، DHCP، SNMP، TFTP، NTP، والصوت والفيديو المباشر.<\/p><div class=\"tw\"><table><tr><th><\/th><th>TCP<\/th><th>UDP<\/th><\/tr><tr><td>اتصال مسبق<\/td><td>نعم<\/td><td>لا<\/td><\/tr><tr><td>موثوقية<\/td><td>نعم<\/td><td>لا<\/td><\/tr><tr><td>حجم الـ Header<\/td><td>20 بايت<\/td><td>8 بايت<\/td><\/tr><tr><td>السرعة<\/td><td>أبطأ<\/td><td>أسرع<\/td><\/tr><\/table><\/div>", "q": {"k": "mc", "q": "لماذا يفضّل بث الصوت المباشر UDP على TCP؟", "e": "إعادة إرسال مقطع صوتي قديم لا تفيد. المهم الوصول في وقته.", "o": ["لأنه مشفر", "لأن التأخير أسوأ من فقدان جزء صغير، و UDP لا يعيد الإرسال ولا ينتظر", "لأنه يضمن الترتيب"], "a": 1}}, {"t": "UDP Attacks", "b": "<p>UDP غير مشفر ولا يتحقق من المصدر. الـ Checksum اختياري في IPv4 ويسهل إعادة حسابه بعد التعديل، فلا يحمي من العبث.<\/p><ul><li><b>UDP flood<\/b>: المهاجم يرسل سيلاً من Datagrams (غالباً بمصدر مزور) إلى منافذ كثيرة على الهدف. لكل منفذ مغلق يرد الهدف برسالة ICMP Port Unreachable، فتُستنزف موارده وعرض النطاق.<\/li><li>ولأن UDP بلا مصافحة فتزوير المصدر فيه سهل جداً، ولذلك هو البروتوكول المفضل لهجمات <b>Reflection/Amplification<\/b> (عبر DNS و NTP).<\/li><\/ul><p>الدفاع: حجب منافذ UDP غير المستخدمة، تحديد معدل الحركة، وتشفير ما فوقه (مثل DNS over TLS أو DTLS).<\/p>", "q": {"k": "tf", "q": "تزوير عنوان المصدر أسهل مع UDP منه مع TCP لأن UDP لا يتطلب مصافحة.", "e": "مع TCP يجب إكمال الـ Handshake ليُقبل الاتصال، وهو صعب بعنوان مزور. UDP يقبل أول Datagram مباشرة.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": [{"k": "mc", "q": "أي تطابق (بروتوكول ← هجوم) صحيح؟", "e": "SYN flood واختطاف الجلسات بأرقام التسلسل خاصان بـ TCP. «موثوق» تعني ضمان التوصيل وليس الأمان.", "o": ["UDP ← SYN flood", "TCP ← Session hijacking بتوقع Sequence Numbers", "TCP ← لا توجد هجمات عليه لأنه موثوق"], "a": 1}, {"k": "mc", "q": "في التقاط شبكة رأيت Segment فيه SYN برقم seq = 1000. ما قيمة ack في رد SYN-ACK السليم؟", "e": "ack = seq المستلم + 1 = 1001، أي «استلمت حتى 1000 وأنتظر 1001».", "o": ["1000", "1001", "0"], "a": 1}]}, {"t": "3.4 ملخص الوحدة 3 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li>IP بروتوكول Connectionless و Best effort ولا يتحقق من المصدر.<\/li><li>IPv4 Header: 20 بايت فأكثر. أهم حقوله TTL و Protocol والعناوين. IPv6 Header: 40 بايت ثابتة، مع Hop Limit و Next Header، وبلا Checksum.<\/li><li>هجمات IP: ICMP (استطلاع وإغراق)، Spoofing (Blind و Non-blind)، Reflection و Amplification.<\/li><li>TCP: موثوق، يبدأ بـ Three-way handshake، أعلامه SYN ACK FIN RST PSH URG. هجماته: SYN flood، Reset، Session hijacking.<\/li><li>UDP: بسيط، 8 بايت، بلا اتصال. هجماته: UDP flood، وهو وسيلة التضخيم المفضلة.<\/li><li>الدفاع: فلترة العناوين المزورة عند الحدود، ACL لـ ICMP، SYN cookies، Rate limiting، والتشفير.<\/li><\/ul>", "q": {"k": "mc", "q": "أي إجراء واحد يضعف هجمات Spoofing و Reflection معاً؟", "e": "منع خروج ودخول Packets بعناوين مزورة يقطع الأساس الذي تقوم عليه هذه الهجمات.", "o": ["فلترة عناوين المصدر غير المنطقية عند حدود الشبكة (Ingress/Egress filtering)", "زيادة قيمة TTL", "استخدام UDP بدل TCP"], "a": 0}}], "test": []}, {"t": "اختبار الوحدة 3", "kind": "exam", "pool": [3], "n": 8}]}, {"n": "4", "t": "الوحدة 4: Attacking What We Do", "secs": [{"t": "4.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>الوحدة السابقة هاجمت «الأساس» (IP، TCP، UDP). هذه تهاجم «ما نفعله» فوق ذلك الأساس: الخدمات اليومية.<\/p><p>ستتعلم:<\/p><ul><li><b>IP Services<\/b>: كيف تعمل ARP و DNS و DHCP وكيف تُستغل.<\/li><li><b>Enterprise Services<\/b>: هجمات الويب (HTTP/HTTPS)، البريد، قواعد البيانات، و Scripts المتصفح.<\/li><li><b>Mitigation<\/b>: كيف تُخفَّف هجمات Malware و Reconnaissance و Access و DoS.<\/li><\/ul><p>بعض ما هنا مرّ اسمه في الوحدة 1. هناك تعرفت عليه، وهنا تفهم آليته التقنية.<\/p>", "q": {"k": "tf", "q": "هذه الوحدة تتناول الخدمات التي تعمل فوق IP مثل DNS و DHCP و HTTP والبريد.", "e": "هي خدمات نستخدمها يومياً دون أن نراها، ولكل منها نقطة ضعف.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": []}, {"t": "4.1 IP Services", "kind": "lesson", "cs": [{"t": "ARP و ARP Vulnerabilities", "b": "<p>داخل الشبكة المحلية يُسلَّم الـ Frame بعنوان MAC، لكن الأجهزة تعرف بعضها بالـ IP. <b>ARP<\/b> (Address Resolution Protocol) يربط الاثنين:<\/p><ul><li>الجهاز يبث <b>ARP Request<\/b> للجميع: «من يملك <code dir=\"ltr\">192.168.1.1<\/code>؟».<\/li><li>صاحب العنوان يرد بـ <b>ARP Reply<\/b> فيه عنوان MAC الخاص به.<\/li><li>السائل يحفظ الزوج (IP ← MAC) في <b>ARP cache<\/b> مؤقتاً.<\/li><\/ul><p>الثغرة: ARP لا يتحقق من أحد. أي جهاز يستطيع إرسال رد لم يطلبه أحد، ويسمى <b>Gratuitous ARP<\/b>، وهو مشروع في الأصل (يُستخدم عند تشغيل الجهاز أو تغيير عنوانه)، والأجهزة الأخرى <b>تصدّقه وتحدّث جداولها<\/b>.<\/p><p>لرؤية الجدول عندك: <code dir=\"ltr\">arp -a<\/code> في Windows و Linux.<\/p>", "q": {"k": "mc", "q": "ما الخلل التصميمي في ARP الذي يستغله المهاجمون؟", "e": "لا مصادقة في ARP، فالرد المزيف يُقبل كالصحيح.", "o": ["أنه يشفّر الردود بمفتاح ضعيف", "أن الأجهزة تقبل أي ARP Reply وتحدّث جدولها دون تحقق من صاحبه", "أنه يعمل فقط مع IPv6"], "a": 1}}, {"t": "ARP Cache Poisoning", "b": "<p><b>ARP cache poisoning<\/b> (ويسمى ARP spoofing): المهاجم داخل الشبكة يرسل ردود ARP مزيفة ليسمّم جداول الأجهزة.<\/p><p>مثال بثلاثة أجهزة: PC، و Router (الـ Gateway)، والمهاجم.<\/p><ul><li>المهاجم يقول للـ PC: «عنوان الـ Router هو الـ MAC خاصتي».<\/li><li>ويقول للـ Router: «عنوان الـ PC هو الـ MAC خاصتي».<\/li><li>النتيجة: كل الحركة بينهما تمر عبر المهاجم. هذا <b>MitM<\/b>.<\/li><\/ul><p>نوعان:<\/p><ul><li><b>Passive<\/b>: يتنصت ويسرق المعلومات.<\/li><li><b>Active<\/b>: يعدّل البيانات المارة أو يحقن بيانات خبيثة.<\/li><\/ul><p>الدفاع: خاصية <b>DAI<\/b> (Dynamic ARP Inspection) على الـ Switch ترفض ردود ARP التي لا تطابق سجلات DHCP، وتشفير الاتصالات فلا يستفيد المتنصت.<\/p>", "q": {"k": "mc", "q": "بعد هجوم، وجدت في <code dir=\"ltr\">arp -a<\/code> أن عنوان الـ Gateway وعنوان حاسوب زميلك لهما الـ MAC نفسه. ماذا يدل ذلك؟", "e": "عنوانا IP مختلفان يشيران لـ MAC واحد، وأحدهما الـ Gateway، علامة كلاسيكية على تسميم ARP.", "o": ["أن الشبكة سريعة", "احتمال ARP cache poisoning: حاسوب الزميل (أو من ينتحله) ينتحل الـ Gateway", "أن DNS معطل"], "a": 1}}, {"t": "DNS Attacks", "b": "<p>تذكير: DNS يحوّل الأسماء إلى عناوين، ويعمل على Port 53 (UDP غالباً). هجماته تقنياً:<\/p><ul><li><b>DNS open resolver attacks<\/b>: خادم DNS «مفتوح» يجيب أي سائل في الإنترنت. يُستغل في:<\/li><li><b>Cache poisoning<\/b>: حقن سجلات مزيفة في ذاكرته.<\/li><li><b>Amplification and reflection<\/b>: تكبير هجمات DDoS (مرّ في الوحدة 3).<\/li><li><b>Resource utilization<\/b>: استنزاف موارد الخادم نفسه حتى يتوقف.<\/li><li><b>DNS stealth attacks<\/b>: تقنيات يخفي بها المهاجم خوادمه:<\/li><li><b>Fast flux<\/b>: تغيير عنوان IP المرتبط باسم النطاق كل دقائق، فيصعب حظره.<\/li><li><b>Double IP flux<\/b>: تغيير العناوين وخوادم الأسماء معاً.<\/li><li><b>DGA<\/b> (Domain Generation Algorithms): Malware يولّد أسماء نطاقات عشوائية كثيرة يومياً ليجد خادم C2 الحالي.<\/li><li><b>Domain shadowing<\/b>: المهاجم يسرق حساب مالك نطاق شرعي وينشئ تحته نطاقات فرعية (Subdomains) خفية يستخدمها في الهجوم.<\/li><\/ul>", "q": {"k": "mc", "q": "جهاز في شبكتك يحاول كل دقيقة الاتصال بنطاقات مثل <code dir=\"ltr\">xkqjz8f2a.com<\/code> و <code dir=\"ltr\">p0wq7tmn1.net<\/code> وأغلبها غير موجود. ما التفسير الأرجح؟", "e": "أسماء عشوائية كثيرة ومحاولات فاشلة متكررة هي بصمة Domain Generation Algorithm.", "o": ["تحديث نظام عادي", "Malware يستخدم DGA للعثور على خادم C2", "Fast flux"], "a": 1}}, {"t": "DNS Tunneling", "b": "<p><b>DNS tunneling<\/b>: تهريب بيانات غير DNS داخل استعلامات وردود DNS. يُستخدم لأن حركة DNS مسموحة في كل شبكة تقريباً ولا تُفحص غالباً.<\/p><p>كيف يعمل، بتبسيط:<\/p><ul><li>المهاجم يملك نطاقاً وخادم أسماء خاصاً به.<\/li><li>الـ Malware في الجهاز المصاب يقسّم البيانات المسروقة إلى قطع صغيرة مرمّزة، ويضع كل قطعة كاسم فرعي في استعلام عن نطاق المهاجم.<\/li><li>الاستعلام يمر عبر DNS المؤسسة حتى يصل خادم المهاجم، الذي يستخرج القطعة. وردوده تحمل الأوامر (C2).<\/li><\/ul><p>علامات الكشف: استعلامات <b>طويلة جداً<\/b> وعشوائية الشكل، عدد كبير من الاستعلامات لنطاق واحد، واستخدام مكثف لسجلات TXT. الدفاع: مراقبة وتحليل حركة DNS (مثل Cisco Umbrella).<\/p>", "q": {"k": "mc", "q": "أي علامة ترجّح وجود DNS tunneling؟", "e": "البيانات المهرّبة تُرمَّز في أسماء فرعية طويلة، فيظهر نمط غير طبيعي حجماً وشكلاً.", "o": ["استعلامات قليلة عن مواقع معروفة", "استعلامات كثيرة جداً بأسماء فرعية طويلة وعشوائية لنطاق واحد غير معروف", "غياب أي حركة DNS"], "a": 1}}, {"t": "DHCP", "b": "<p><b>DHCP<\/b> (Dynamic Host Configuration Protocol) يوزع إعدادات الشبكة على الأجهزة تلقائياً: عنوان IP، قناع الشبكة (Subnet mask)، الـ <b>Default gateway<\/b>، وخادم DNS.<\/p><p>يتم في أربع رسائل، تُحفظ بكلمة <b>DORA<\/b>:<\/p><ul><li><b>Discover<\/b>: العميل يبث «هل من خادم DHCP؟».<\/li><li><b>Offer<\/b>: الخادم يعرض عنواناً.<\/li><li><b>Request<\/b>: العميل يطلب العنوان المعروض.<\/li><li><b>Acknowledge<\/b>: الخادم يؤكد.<\/li><\/ul><p>الخادم على UDP Port 67 والعميل على 68. العنوان يُعطى لمدة محددة (<b>Lease<\/b>).<\/p><p>الثغرة: العميل يبث للجميع ويقبل <b>أول عرض يصله<\/b> دون تحقق من هوية الخادم.<\/p>", "q": {"k": "mc", "q": "ما الرسالة الثالثة في تبادل DHCP؟", "e": "الترتيب DORA: Discover، Offer، Request، Acknowledge.", "o": ["Offer", "Request", "Acknowledge"], "a": 1}}, {"t": "DHCP Attacks", "b": "<ul><li><b>DHCP spoofing<\/b>: المهاجم يشغّل خادم DHCP مزيفاً (<b>Rogue DHCP server<\/b>) على الشبكة. إن سبق ردّه رد الخادم الحقيقي أعطى الضحايا:<\/li><li><b>Wrong default gateway<\/b>: عنوان المهاجم، فتمر الحركة عبره (MitM).<\/li><li><b>Wrong DNS server<\/b>: خادم المهاجم، فيوجه الضحايا لمواقع مزيفة.<\/li><li><b>Wrong IP address<\/b>: عنواناً غير صالح، فينقطع الاتصال (DoS).<\/li><li><b>DHCP starvation<\/b>: المهاجم يرسل آلاف طلبات Discover بعناوين MAC مزيفة حتى يستنفد كل العناوين المتاحة، فلا يجد المستخدمون الحقيقيون عنواناً. وغالباً يليه تشغيل خادم مزيف.<\/li><\/ul><p>الدفاع: خاصية <b>DHCP snooping<\/b> على الـ Switch: تحدد المنافذ الموثوقة التي يُسمح لردود خادم DHCP بالقدوم منها، وتسقط ما عداها.<\/p>", "q": {"k": "mc", "q": "مستخدمون يشكون من أن مواقع معروفة تفتح صفحات غريبة، واكتشفت أن أجهزتهم أخذت خادم DNS غير خادم الشركة. ما السبب المحتمل؟", "e": "DHCP spoofing يمنح الضحايا إعدادات يتحكم بها المهاجم، ومنها خادم DNS.", "o": ["DHCP starvation فقط", "Rogue DHCP server يوزع DNS تابعاً للمهاجم", "TCP reset"], "a": 1}}, {"t": "تمرين: Exploring DNS Traffic", "b": "<p>بديل Lab 4.1.7. نفّذ على جهازك (يحتاج اتصالاً لأن DNS خدمة شبكية):<\/p><pre dir=\"ltr\"><code>nslookup example.com\nnslookup -type=MX example.com\nipconfig /displaydns        (Windows)<\/code><\/pre><p>ما ستراه في Wireshark بالفلتر <code dir=\"ltr\">dns<\/code> لاستعلام عادي:<\/p><pre dir=\"ltr\"><code>Standard query 0x3a1f A example.com\nStandard query response 0x3a1f A example.com A 93.184.216.34<\/code><\/pre><p>اقرأ: الرقم <code dir=\"ltr\">0x3a1f<\/code> هو <b>Transaction ID<\/b> يربط الرد بالسؤال. <code dir=\"ltr\">A<\/code> نوع السجل (اسم إلى IPv4). أنواع أخرى: <code dir=\"ltr\">AAAA<\/code> لـ IPv6، <code dir=\"ltr\">MX<\/code> لخادم البريد، <code dir=\"ltr\">TXT<\/code> لنص حر، <code dir=\"ltr\">CNAME<\/code> لاسم مستعار. الحركة على UDP Port 53.<\/p>", "q": {"k": "mc", "q": "في استعلام DNS، ما وظيفة الـ Transaction ID؟", "e": "العميل يقبل الرد الذي يحمل الـ ID نفسه. ولذلك يحاول مهاجمو Cache poisoning تخمينه.", "o": ["تشفير الاستعلام", "ربط الرد بالاستعلام الذي يخصه", "تحديد سرعة الشبكة"], "a": 1}}], "test": [{"k": "mc", "q": "أي خاصية Switch تدافع ضد أي هجوم؟", "e": "DAI يفحص ردود ARP ويرفض المزيف. DHCP snooping يدافع ضد خوادم DHCP المزيفة.", "o": ["DHCP snooping ضد SYN flood", "Dynamic ARP Inspection ضد ARP cache poisoning", "Port mirroring ضد DNS tunneling"], "a": 1}, {"k": "sa", "q": "لماذا يختار المهاجمون DNS قناةً لتهريب البيانات؟", "e": "لأن حركة DNS (Port 53) مسموحة عبر الـ Firewall في كل شبكة تقريباً وقليلاً ما تُفحص، فتمر البيانات المهرّبة داخل الاستعلامات دون لفت نظر.", "kw": [["مسموح", "allowed", "يُسمح", "لا تُفحص", "لا يفحص", "مفتوح", "53"]]}]}, {"t": "4.2 Enterprise Services", "kind": "lesson", "cs": [{"t": "HTTP و HTTPS", "b": "<p><b>HTTP<\/b> بروتوكول الويب: المتصفح يرسل طلباً (<b>Request<\/b>) مثل <code dir=\"ltr\">GET /index.html<\/code> والخادم يرد (<b>Response<\/b>) برمز حالة:<\/p><div class=\"tw\"><table><tr><th>الرمز<\/th><th>المعنى<\/th><\/tr><tr><td>200<\/td><td>نجح<\/td><\/tr><tr><td>301 / 302<\/td><td>إعادة توجيه دائمة / مؤقتة<\/td><\/tr><tr><td>403<\/td><td>ممنوع<\/td><\/tr><tr><td>404<\/td><td>غير موجود<\/td><\/tr><tr><td>500<\/td><td>خطأ في الخادم<\/td><\/tr><\/table><\/div><p>HTTP يرسل كل شيء <b>نصاً مكشوفاً<\/b> على Port 80: من يتنصت يقرأ كلمات السر.<\/p><p><b>HTTPS<\/b> هو HTTP داخل نفق مشفر بـ <b>TLS<\/b> على Port 443. يقدم تشفيراً، وتحققاً من هوية الخادم عبر <b>Certificate<\/b>، وسلامة للبيانات. اسم SSL القديم ما زال متداولاً، لكن SSL نفسه مهجور وغير آمن؛ المستخدم اليوم TLS 1.2 و TLS 1.3.<\/p><p>نقطة مهمة للمحلل: HTTPS يخفي المحتوى عن المهاجم <b>وعن أدوات الفحص أيضاً<\/b>، فالـ Malware يستخدمه للتخفي.<\/p>", "q": {"k": "tf", "q": "وجود القفل (HTTPS) في المتصفح يعني أن الموقع نفسه آمن وغير احتيالي.", "e": "HTTPS يضمن أن الاتصال مشفر مع الخادم المذكور. موقع تصيد قد يملك شهادة صحيحة تماماً.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Common HTTP Exploits", "b": "<ul><li><b>Malicious iFrames<\/b>: الـ <b>iFrame<\/b> عنصر HTML يعرض صفحة داخل صفحة. المهاجم يخترق موقعاً شرعياً ويزرع فيه iFrame صغيراً غير مرئي (بحجم بكسل واحد) يحمّل صفحة خبيثة في الخلفية، تحاول استغلال ثغرات متصفح الزائر (<b>Exploit kit<\/b>).<\/li><li><b>HTTP 302 cushioning<\/b>: استخدام رمز إعادة التوجيه 302 في سلسلة تحويلات عبر مواقع عدة قبل الوصول للصفحة الخبيثة، لإخفاء الوجهة عن أدوات الفحص.<\/li><li><b>Domain shadowing<\/b>: نطاقات فرعية خفية تحت نطاق شرعي مسروق الحساب (مرّت في DNS)، تُستخدم وجهةً لهذه التحويلات.<\/li><\/ul><p>الدفاع: تحديث المتصفحات والإضافات، Web proxy يفلتر المواقع (مثل Cisco Umbrella أو Secure Web Appliance)، وفحص سمعة النطاقات.<\/p>", "q": {"k": "mc", "q": "لماذا يجعل المهاجم الـ iFrame الخبيث بحجم بكسل واحد؟", "e": "الإخفاء هو الهدف: الزائر يرى موقعاً طبيعياً والهجوم يجري دون علمه.", "o": ["ليسرّع تحميل الصفحة", "ليبقى غير مرئي للزائر بينما يحمّل المحتوى الخبيث في الخلفية", "لأن المتصفح لا يدعم أكبر من ذلك"], "a": 1}}, {"t": "Email Threats", "b": "<p>البريد أكثر قنوات الهجوم استخداماً. تهديداته:<\/p><ul><li><b>Attachment-based attacks<\/b>: محتوى خبيث في مرفق يبدو فاتورة أو مستنداً.<\/li><li><b>Email spoofing<\/b>: تزوير عنوان المرسل ليبدو من جهة موثوقة.<\/li><li><b>Spam email<\/b>: رسائل بالجملة تحمل روابط خبيثة أو خادعة.<\/li><li><b>Open mail relay server<\/b>: خادم <b>SMTP<\/b> سيئ الإعداد يسمح لأي أحد في الإنترنت بإرسال بريد عبره، فيستغله مرسلو الـ Spam.<\/li><li><b>Homoglyphs<\/b>: استخدام حروف تشبه غيرها شكلاً في اسم النطاق، مثل حرف من أبجدية أخرى يطابق <code dir=\"ltr\">a<\/code> اللاتينية، فيبدو العنوان مطابقاً للأصلي.<\/li><\/ul><p>بروتوكولات البريد: <b>SMTP<\/b> للإرسال (25)، و <b>POP3<\/b> (110) و <b>IMAP<\/b> (143) للاستلام. الدفاع: بوابة أمن بريد (Email security appliance)، و SPF/DKIM/DMARC، وتوعية.<\/p>", "q": {"k": "mc", "q": "خادم بريد الشركة ظهر في قوائم الحظر العالمية لأن غرباء يرسلون عبره آلاف الرسائل. ما الخلل؟", "e": "الـ Open relay يقبل ترحيل بريد من أي مصدر، فيستخدمه مرسلو الـ Spam وتتضرر سمعة نطاقك.", "o": ["Homoglyph", "الخادم مضبوط كـ Open mail relay", "DHCP starvation"], "a": 1}}, {"t": "Web-Exposed Databases", "b": "<p>تطبيقات الويب تتصل بقواعد بيانات فيها أثمن ما تملكه المؤسسة. الخطر أن تصل مدخلات المستخدم إلى القاعدة كأوامر.<\/p><ul><li><b>Code injection<\/b>: تطبيق يمرر مدخلات غير مفحوصة إلى مفسر أوامر نظام التشغيل، فينفذ المهاجم أوامر على الخادم بصلاحية التطبيق.<\/li><li><b>SQL injection<\/b>: <b>SQL<\/b> لغة الاستعلام من قواعد البيانات. إن دمج التطبيق ما يكتبه المستخدم داخل نص الاستعلام، استطاع المهاجم تغيير منطق الاستعلام.<\/li><\/ul><p>مثال مفاهيمي: التطبيق يبني الاستعلام «أعطني المستخدم الذي اسمه (المدخل) وكلمة سره (المدخل)». إن كتب المهاجم في الحقل نصاً يُغلق علامة الاقتباس ويضيف شرطاً صحيحاً دائماً، صار الاستعلام «أعطني أي مستخدم» فيدخل دون كلمة سر.<\/p><p>العلاج: <b>Parameterized queries<\/b> (المدخل يُرسل كقيمة منفصلة عن نص الأمر)، Input validation، و Least Privilege لحساب قاعدة البيانات.<\/p>", "q": {"k": "mc", "q": "ما الذي تفعله الـ Parameterized queries لمنع SQL injection؟", "e": "حين يُرسل المدخل كقيمة منفصلة، لا يستطيع تغيير بنية الأمر مهما احتوى.", "o": ["تشفّر قاعدة البيانات كلها", "تفصل مدخلات المستخدم عن نص الاستعلام فتُعامل كبيانات فقط", "تمنع المستخدمين من الكتابة"], "a": 1}}, {"t": "Client-side Scripting و XSS", "b": "<p>الـ <b>Scripts<\/b> برامج صغيرة تعمل في المتصفح (JavaScript غالباً) لتجعل الصفحة تفاعلية. الخطر حين يكون مصدرها المهاجم.<\/p><p><b>XSS<\/b> مرّ في الوحدة 1. نوعاه الرئيسيان:<\/p><ul><li><b>Stored (persistent)<\/b>: الكود الخبيث يُخزَّن على الخادم (في تعليق مثلاً) ويصيب <b>كل<\/b> من يفتح الصفحة.<\/li><li><b>Reflected (non-persistent)<\/b>: الكود موجود في رابط؛ يصيب فقط من ينقر الرابط المصمم له، فيحتاج المهاجم لخداع الضحية بالنقر.<\/li><\/ul><p>ما يفعله المهاجم به: سرقة Cookies الجلسة، انتحال المستخدم، التقاط ضغطات المفاتيح، أو تحويله لموقع خبيث.<\/p><p>الدفاع: على المطورين تنظيف المدخلات وترميز المخرجات، وعلى الشبكة WAF و IPS، وعلى المستخدم تحديث المتصفح وعدم النقر على روابط مشبوهة.<\/p>", "q": {"k": "mc", "q": "مهاجم نشر تعليقاً يحوي Script في منتدى، فصار كل من يفتح الموضوع ضحية. أي نوع XSS؟", "e": "الكود مخزَّن على الخادم ويُقدَّم لكل زائر، فهو Stored XSS وهو الأخطر.", "o": ["Stored", "Reflected", "لا يُعد XSS"], "a": 0}}, {"t": "تمارين: Virtual Machine وقراءة Server Logs", "b": "<p><b>Virtual Machine (VM)<\/b> حاسوب افتراضي يعمل داخل حاسوبك عبر برنامج مثل VirtualBox. يفيد المحلل لأنه بيئة معزولة يجرب فيها دون تعريض جهازه للخطر. (بديل Labs 4.2.6 و 4.2.7: ثبّت VirtualBox وأنشئ VM فيها توزيعة Linux؛ ستحتاجها في الوحدة 8.)<\/p><p>Lab 4.2.8 الأصلي يحلل التقاطاً جاهزاً لهجوم SQL injection ليتعلم المحلل شكل الهجوم في الحركة، ولا يطلب تنفيذه.<\/p><p>قراءة سجل خادم ويب (بديل Lab 4.2.9). هذا سطر من <code dir=\"ltr\">access.log<\/code>:<\/p><pre dir=\"ltr\"><code>203.0.113.7 - - [12/Mar/2026:10:15:32 +0000] &quot;GET /login.php?user=admin&#x27;-- HTTP/1.1&quot; 200 1532 &quot;-&quot; &quot;Mozilla/5.0&quot;<\/code><\/pre><p>الحقول بالترتيب: IP العميل، الوقت، الطلب (Method والمسار والبروتوكول)، رمز الحالة، حجم الرد، الصفحة المحيلة، والمتصفح (User-Agent).<\/p><p>المريب هنا: علامة اقتباس وشرطتان في قيمة <code dir=\"ltr\">user<\/code>، وهو نمط محاولة SQL injection، والخادم ردّ بـ 200.<\/p>", "q": {"k": "mc", "q": "في سطر السجل أعلاه، ما الذي يستدعي التحقيق؟", "e": "رموز SQL في حقل يُفترض أنه اسم مستخدم تدل على محاولة حقن، والرمز 200 يعني أن الخادم قبل الطلب، فيجب فحص هل نجحت.", "o": ["أن الطلب من نوع GET", "وجود رموز SQL (علامة اقتباس وشرطتان) في المدخل مع رد ناجح 200", "أن المتصفح Mozilla"], "a": 1}}], "test": [{"k": "mc", "q": "موقع أخبار شرعي تعرّض زواره لإصابات، ووجد المحلل في كود الصفحة إطاراً مخفياً يحمّل محتوى من نطاق فرعي غريب تابع لنطاق شركة معروفة. أي تقنيتين اجتمعتا؟", "e": "الإطار المخفي هو الـ Malicious iFrame، والنطاق الفرعي الخفي تحت نطاق شرعي هو Domain shadowing.", "o": ["Malicious iFrame و Domain shadowing", "DHCP starvation و ARP poisoning", "Open relay و Homoglyph"], "a": 0}, {"k": "tf", "q": "هجوم SQL injection يستهدف متصفح الزائر، وهجوم XSS يستهدف قاعدة البيانات.", "e": "العكس: SQL injection يستهدف قاعدة البيانات على الخادم، و XSS يُنفَّذ في متصفح الزائر.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "4.3 Mitigating Common Network Attacks", "kind": "lesson", "cs": [{"t": "Defending the Network", "b": "<p>ممارسات أساسية لتأمين أي شبكة:<\/p><ul><li>وضع <b>سياسة أمن مكتوبة<\/b> للمؤسسة.<\/li><li>توعية الموظفين بمخاطر الـ Social Engineering والتحقق من الهويات.<\/li><li>التحكم في الوصول الفيزيائي للأنظمة.<\/li><li>كلمات سر قوية تتغير، و MFA.<\/li><li>تشفير البيانات الحساسة وحمايتها بكلمة سر.<\/li><li>Firewalls و IPS و VPN و Antimalware وفلترة محتوى.<\/li><li>نسخ احتياطي منتظم واختبار استرجاعه.<\/li><li>إغلاق الخدمات والمنافذ غير الضرورية.<\/li><li>تحديثات أسبوعية أو يومية إن أمكن.<\/li><li>اختبارات أمنية دورية.<\/li><\/ul><p>هذه تطبيقات <b>Defense in Depth<\/b>: لا تعتمد على جهاز واحد.<\/p>", "q": {"k": "mc", "q": "أي بند مما سبق يحد من أثر الهجوم بعد وقوعه أكثر من منعه؟", "e": "النسخ الاحتياطي ضابط استرجاع (Recovery)، يعيدك للعمل بعد الحادث. الباقي ضوابط وقائية.", "o": ["إغلاق المنافذ غير الضرورية", "النسخ الاحتياطي المختبَر", "كلمات السر القوية"], "a": 1}}, {"t": "Mitigating Malware", "b": "<p>الـ Malware (Virus، Worm، Trojan) يصل للأجهزة الطرفية. خط الدفاع الأساسي ضده <b>Antimalware / Antivirus<\/b> على كل جهاز وخادم.<\/p><p>ملاحظات مهمة:<\/p><ul><li>برنامج الحماية يعمل على <b>الجهاز<\/b> (Host-based)، ولا يمنع الـ Malware من دخول الشبكة أصلاً.<\/li><li>لذلك يُكمَّل بحماية على محيط الشبكة: بوابة بريد، Web proxy، IPS.<\/li><li>فعاليته مرهونة بتحديث قواعد التواقيع؛ برنامج غير محدّث أعمى عن الجديد.<\/li><li>على المحلل متابعة نشرات التهديدات ليعرف ما ينتشر الآن.<\/li><\/ul>", "q": {"k": "tf", "q": "برنامج Antivirus المثبت على الحواسيب يمنع الـ Malware من دخول الشبكة.", "e": "هو يحمي الجهاز الذي يعمل عليه. منع الدخول إلى الشبكة يحتاج ضوابط على المحيط (IPS، بوابة بريد، Web proxy).", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Mitigating Worms", "b": "<p>الـ Worm ينتشر ذاتياً، فاحتواؤه سباق مع الوقت. الاستجابة أربع مراحل:<\/p><ul><li><b>Containment<\/b> (الاحتواء): حصر الانتشار في الجزء المصاب بتقسيم الشبكة وفلترة الحركة (ACL) على الـ Routers والـ Firewalls.<\/li><li><b>Inoculation<\/b> (التحصين): ترقيع كل الأجهزة <b>غير المصابة<\/b> بالـ Patch الذي يسد الثغرة، فيفقد الـ Worm أهدافه. تجري بالتوازي مع الاحتواء.<\/li><li><b>Quarantine<\/b> (العزل): تحديد الأجهزة المصابة وفصلها أو حجبها عن الشبكة.<\/li><li><b>Treatment<\/b> (العلاج): تنظيف الأجهزة المصابة وترقيعها، وقد يلزم إعادة تثبيت النظام.<\/li><\/ul>", "q": {"k": "mc", "q": "في أي مرحلة تُرقَّع الأجهزة السليمة لتحرم الـ Worm من أهداف جديدة؟", "e": "Inoculation تعني تحصين غير المصابين. Treatment تخص تنظيف المصابين.", "o": ["Containment", "Inoculation", "Treatment"], "a": 1}}, {"t": "Mitigating Reconnaissance Attacks", "b": "<p><b>Reconnaissance attack<\/b> هو استطلاع يسبق الهجوم: Ping sweep، Port scan، التقاط حركة. لا يمكن منعه كلياً لكن يمكن تصعيبه وكشفه:<\/p><ul><li><b>مصادقة قوية<\/b> تجعل المعلومات الملتقطة أقل نفعاً.<\/li><li><b>التشفير<\/b>: الحركة الملتقطة لا تُقرأ.<\/li><li>أدوات <b>Anti-sniffer<\/b> تكشف بطاقات الشبكة التي تتنصت.<\/li><li>شبكة <b>Switched<\/b> بدل Hub، فلا يرى كل جهاز حركة غيره.<\/li><li><b>Firewall و IPS<\/b>: يكشفان المسح ويحجبانه.<\/li><li>إيقاف ICMP Echo و Echo-reply على حافة الشبكة يوقف Ping sweeps من الخارج، مع خسارة بعض قدرة التشخيص.<\/li><\/ul><p>إنذار مسح المنافذ غالباً أول تنبيه يسبق هجوماً، فلا يُهمَل.<\/p>", "q": {"k": "mc", "q": "تنبيه IPS: عنوان خارجي جرّب الاتصال بـ 500 منفذ مختلف على خادمك خلال دقيقة. كيف تصنّفه؟", "e": "فحص منافذ كثيرة بسرعة من مصدر واحد هو مسح استطلاعي، ويستحق المتابعة والحظر.", "o": ["حركة عادية", "Port scan ضمن استطلاع يسبق هجوماً محتملاً", "DHCP starvation"], "a": 1}}, {"t": "Mitigating Access Attacks", "b": "<p><b>Access attack<\/b> يهدف للحصول على وصول غير مصرح به: تخمين كلمات السر، استغلال علاقات الثقة بين الأجهزة، أو انتحال. التخفيف:<\/p><ul><li><b>كلمات سر قوية<\/b>: طويلة ومتنوعة. عدد التركيبات الممكنة لكلمة طولها <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>L<\/mi><\/mrow><\/math> من أبجدية حجمها <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>N<\/mi><\/mrow><\/math> هو:<\/li><\/ul><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>Combinations<\/mtext><mo>=<\/mo><msup><mi>N<\/mi><mrow><mi>L<\/mi><\/mrow><\/msup><\/mrow><\/math><\/p><p>فكلمة من 8 أحرف صغيرة تعطي <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>26<\/mn><mrow><mn>8<\/mn><\/mrow><\/msup><mo>≈<\/mo><mn>2<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mrow><mn>11<\/mn><\/mrow><\/msup><\/mrow><\/math>، ومن 12 رمزاً متنوعاً تعطي <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>94<\/mn><mrow><mn>12<\/mn><\/mrow><\/msup><mo>≈<\/mo><mn>4.8<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mrow><mn>23<\/mn><\/mrow><\/msup><\/mrow><\/math>. الطول أهم من التعقيد.<\/p><ul><li><b>قفل الحساب<\/b> بعد عدد من المحاولات الفاشلة، لإيقاف الـ Brute force.<\/li><li>مبدأ <b>Minimum trust<\/b>: لا يثق نظام بآخر أكثر مما يلزم.<\/li><li><b>التشفير<\/b> للوصول عن بعد (SSH بدل Telnet).<\/li><li><b>MFA<\/b>.<\/li><li>توعية ضد Social Engineering، ومراجعة السجلات لرصد محاولات الدخول الفاشلة.<\/li><\/ul>", "q": {"k": "mc", "q": "في السجل 400 محاولة دخول فاشلة لحساب واحد خلال خمس دقائق. أي ضابط يوقف هذا الهجوم مباشرة؟", "e": "هذا Brute force، وقفل الحساب (Account lockout) يمنع استمرار التخمين. و MFA طبقة إضافية.", "o": ["تكبير الخط", "قفل الحساب بعد عدد محدد من المحاولات الفاشلة", "تعطيل النسخ الاحتياطي"], "a": 1}}, {"t": "Mitigating DoS Attacks", "b": "<p>علامة DoS الأولى غالباً شكاوى من بطء أو تعذر وصول. التخفيف:<\/p><ul><li><b>راقب الاستهلاك<\/b>: برنامج يتابع استخدام الشبكة باستمرار ويعرف المعدل الطبيعي (<b>Baseline<\/b>) فينبّه عند الشذوذ.<\/li><li><b>Antispoofing<\/b>: خصائص على الـ Switches والـ Routers تمنع العناوين المزورة، مثل Port security و DHCP snooping و IP Source Guard و DAI و ACLs.<\/li><li>تحديد معدل الحركة (<b>Rate limiting<\/b>) و SYN cookies.<\/li><li>التعاون مع مزود الإنترنت (ISP) أو خدمة تنظيف DDoS لصد الهجمات الكبيرة قبل وصولها.<\/li><\/ul><div class=\"note\">تمرين (بديل Lab 4.3.7): لمؤسسة صغيرة تعرضت هذا الشهر لـ Phishing و Port scan و Brute force، اكتب جدولاً من ثلاثة أعمدة: التهديد، إجراء التخفيف، والسبب. هذا بالضبط ما ستفعله في المشروع النهائي.<\/div>", "q": {"k": "mc", "q": "لماذا يحتاج كشف DoS إلى معرفة الـ Baseline؟", "e": "دون معرفة الطبيعي لا تستطيع الحكم أن الارتفاع الحالي هجوم وليس ذروة عمل عادية.", "o": ["لأنه يشفّر الحركة", "لأن الشذوذ لا يُعرف إلا بمقارنته بالمعدل الطبيعي للشبكة", "لأنه يزيد عدد العناوين"], "a": 1}}], "test": [{"k": "mc", "q": "Worm جديد ينتشر في الشركة. رتّب الأولويات.", "e": "Containment و Inoculation معاً لوقف الانتشار، ثم Quarantine، ثم Treatment.", "o": ["علاج المصابين أولاً ثم الانتظار", "احتواء الانتشار وتحصين السليمين بالتوازي، ثم عزل المصابين، ثم علاجهم", "إطفاء كل الحواسيب أسبوعاً"], "a": 1}, {"k": "sa", "q": "اذكر ثلاثة إجراءات تخفف Access attacks.", "e": "كلمات سر قوية وطويلة، MFA، قفل الحساب بعد محاولات فاشلة، تشفير الوصول عن بعد (SSH)، مبدأ Minimum trust، ومراجعة سجلات الدخول.", "kw": [["كلم", "password", "mfa", "قفل", "lockout", "تشفير", "ssh", "encrypt"]]}]}, {"t": "4.4 ملخص الوحدة 4 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li><b>ARP<\/b> بلا مصادقة، فيُسمَّم جدوله (MitM). الدفاع: DAI.<\/li><li><b>DNS<\/b>: Open resolvers، Cache poisoning، Fast flux، DGA، Domain shadowing، و Tunneling للتهريب. الدفاع: مراقبة حركة DNS.<\/li><li><b>DHCP<\/b> (DORA): Spoofing و Starvation. الدفاع: DHCP snooping.<\/li><li><b>الويب<\/b>: HTTP مكشوف و HTTPS مشفر بـ TLS. الهجمات: Malicious iFrames، 302 cushioning.<\/li><li><b>البريد<\/b>: مرفقات، Spoofing، Open relay، Homoglyphs.<\/li><li><b>قواعد البيانات<\/b>: SQL injection و Code injection. <b>المتصفح<\/b>: XSS بنوعيه.<\/li><li><b>التخفيف<\/b>: Antimalware للـ Malware، أربع مراحل للـ Worm، تشفير و IPS للاستطلاع، كلمات سر و MFA للوصول، Baseline و Antispoofing للـ DoS.<\/li><\/ul>", "q": {"k": "mc", "q": "أي زوج (خدمة ← ضابط حماية على الـ Switch) صحيح؟", "e": "DHCP snooping يحجب خوادم DHCP المزيفة. DAI لـ ARP، و SYN cookies لـ TCP على الخادم.", "o": ["DHCP ← DHCP snooping", "DNS ← Dynamic ARP Inspection", "ARP ← SYN cookies"], "a": 0}}], "test": []}, {"t": "اختبار الوحدة 4", "kind": "exam", "pool": [4], "n": 10}]}, {"n": "5", "t": "الوحدة 5: Wireless Network Communication", "secs": [{"t": "5.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>الشبكة اللاسلكية تبث بياناتك في الهواء، وكل من في مدى الإشارة يستطيع التقاطها دون أن يلمس كابلاً. لذلك تحتاج فهماً خاصاً.<\/p><p>ستتعلم:<\/p><ul><li><b>كيف تعمل الـ WLAN<\/b>: الفرق عن السلكية، بنية الـ Frame، كيف يتصل الجهاز بالـ Access Point، وأنواع الأجهزة.<\/li><li><b>تهديداتها<\/b>: DoS، Rogue AP، MitM (بالتفصيل التقني بعد التعريف في الوحدة 1).<\/li><li><b>تأمينها<\/b>: من الأساليب الضعيفة (إخفاء SSID) إلى WPA2 و WPA3 والمصادقة المؤسسية.<\/li><\/ul><p><b>WLAN<\/b> (Wireless LAN) هي شبكة محلية لاسلكية، ومعيارها <b>IEEE 802.11<\/b> واسمه التجاري Wi-Fi.<\/p>", "q": {"k": "mc", "q": "ما الفرق الأمني الجوهري بين الشبكة اللاسلكية والسلكية؟", "e": "الوسط المشترك المفتوح (الهواء) يجعل التنصت ممكناً من خارج المبنى، فالتشفير ضرورة.", "o": ["اللاسلكية أسرع دائماً", "الإشارة اللاسلكية تصل كل من في مداها، فلا يلزم وصول فيزيائي لالتقاطها", "السلكية لا تستخدم IP"], "a": 1}}], "test": []}, {"t": "5.1 Wireless Communications", "kind": "lesson", "cs": [{"t": "Wireless versus Wired LANs", "b": "<div class=\"tw\"><table><tr><th>الخاصية<\/th><th>802.11 WLAN<\/th><th>802.3 Ethernet (سلكية)<\/th><\/tr><tr><td>الوسط<\/td><td>موجات راديو (RF)<\/td><td>كابلات<\/td><\/tr><tr><td>الوصول للوسط<\/td><td>CSMA/CA (تجنب التصادم)<\/td><td>CSMA/CD (كشف التصادم) قديماً، واليوم Switches بلا تصادم<\/td><\/tr><tr><td>التوفر<\/td><td>لكل من له بطاقة لاسلكية في المدى<\/td><td>يلزم توصيل كابل<\/td><\/tr><tr><td>التداخل<\/td><td>عرضة للتشويش والتداخل<\/td><td>ضئيل<\/td><\/tr><tr><td>التنظيم<\/td><td>تخضع لقوانين الترددات في كل دولة<\/td><td>معيار IEEE فقط<\/td><\/tr><\/table><\/div><p>فروق أخرى:<\/p><ul><li>الأجهزة اللاسلكية تتصل عبر <b>Access Point<\/b> بدل Switch.<\/li><li>الأجهزة المتنقلة تعمل بالبطارية، فالبروتوكول يراعي توفير الطاقة.<\/li><li>الـ Frame اللاسلكي يحمل معلومات إضافية في الـ Header.<\/li><li>الخصوصية أضعف لأن الإشارة تتجاوز الجدران.<\/li><\/ul>", "q": {"k": "mc", "q": "أي طريقة يستخدمها 802.11 للتعامل مع التصادم؟", "e": "الجهاز اللاسلكي لا يستطيع الإرسال والاستماع معاً بكفاءة، فلا يكشف التصادم؛ يتجنبه مسبقاً (Collision Avoidance).", "o": ["CSMA/CD", "CSMA/CA", "Token passing"], "a": 1}}, {"t": "802.11 Frame Structure", "b": "<p>الـ Frame اللاسلكي أعقد من Ethernet. حقوله:<\/p><ul><li><b>Frame Control<\/b>: نوع الـ Frame ونسخة البروتوكول وأعلام التحكم.<\/li><li><b>Duration<\/b>: الزمن اللازم لإتمام الإرسال، فتنتظر الأجهزة الأخرى.<\/li><li><b>Address 1<\/b>: عنوان MAC للمستقبِل اللاسلكي (الجهاز أو الـ AP).<\/li><li><b>Address 2<\/b>: عنوان MAC للمرسِل اللاسلكي.<\/li><li><b>Address 3<\/b>: عنوان الوجهة أو المصدر النهائي على الشبكة السلكية (مثل الـ Default gateway)، أو الـ BSSID.<\/li><li><b>Sequence Control<\/b>: للترتيب وكشف التكرار.<\/li><li><b>Address 4<\/b>: يُستخدم فقط في الربط اللاسلكي بين نقطتي وصول.<\/li><li><b>Payload<\/b>: البيانات.<\/li><li><b>FCS<\/b> (Frame Check Sequence): كشف الأخطاء.<\/li><\/ul><p>لماذا ثلاثة عناوين؟ لأن الـ Frame يمر بمحطة وسيطة (الـ AP)، فيلزم معرفة المرسل والمستقبل اللاسلكيين والطرف النهائي.<\/p><p>ثلاثة أنواع من الـ Frames: <b>Management<\/b> (مثل Beacon والمصادقة)، <b>Control<\/b> (مثل ACK و RTS/CTS)، و <b>Data<\/b>.<\/p>", "q": {"k": "mc", "q": "ما وظيفة حقل Duration في الـ 802.11 Frame؟", "e": "الأجهزة التي تسمع الـ Frame تقرأ Duration وتمتنع عن الإرسال تلك المدة، تجنباً للتصادم.", "o": ["تشفير البيانات", "إعلام الأجهزة الأخرى بالزمن الذي سيُشغل فيه الوسط فتنتظر", "تحديد عنوان الوجهة"], "a": 1}}, {"t": "CSMA/CA", "b": "<p><b>CSMA/CA<\/b> (Carrier Sense Multiple Access with Collision Avoidance) هي طريقة تنظيم الدور على الهواء. الـ WLAN تعمل <b>Half-duplex<\/b>: جهاز واحد يرسل على القناة في اللحظة الواحدة.<\/p><p>الخطوات:<\/p><ul><li>الجهاز <b>يستمع<\/b> للقناة: هل هي مشغولة؟<\/li><li>إن كانت خالية يرسل <b>RTS<\/b> (Request to Send) إلى الـ AP يطلب حجز القناة.<\/li><li>الـ AP يرد بـ <b>CTS<\/b> (Clear to Send)، والكل يسمعه فينتظر.<\/li><li>الجهاز يرسل بياناته.<\/li><li>المستقبل يرد بـ <b>ACK<\/b>. إن لم يصل ACK يفترض المرسل حدوث تصادم ويعيد المحاولة بعد انتظار عشوائي.<\/li><\/ul><p>تشبيه: اجتماع يرفع فيه كل متكلم يده ولا يبدأ حتى يأذن له المدير.<\/p>", "q": {"k": "tf", "q": "في CSMA/CA، إذا لم يستلم المرسل ACK فإنه يفترض أن الإرسال نجح.", "e": "غياب الـ ACK يعني للمرسل أن الـ Frame لم يصل (تصادم أو تشويش)، فيعيد الإرسال بعد انتظار عشوائي.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Wireless Client and AP Association", "b": "<p>ليتصل جهاز بشبكة لاسلكية يمر بثلاث مراحل مع الـ AP:<\/p><ul><li><b>Discover<\/b>: اكتشاف الـ AP.<\/li><li><b>Authenticate<\/b>: المصادقة معه.<\/li><li><b>Associate<\/b>: الارتباط به.<\/li><\/ul><p>ويجب أن يتفق الطرفان على هذه الإعدادات:<\/p><ul><li><b>SSID<\/b>: اسم الشبكة.<\/li><li><b>Password<\/b>: كلمة السر للمصادقة.<\/li><li><b>Network mode<\/b>: المعيار المستخدم (802.11a/b/g/n/ac/ax). الوضع المختلط يدعم عدة معايير.<\/li><li><b>Security mode<\/b>: WEP أو WPA أو WPA2 أو WPA3. اختر دائماً الأعلى المدعوم.<\/li><li><b>Channel settings<\/b>: نطاق التردد والقناة. الـ AP يختارها آلياً أو تُضبط يدوياً لتفادي التداخل.<\/li><\/ul><p>مصطلح: <b>BSSID<\/b> هو عنوان MAC للـ AP ويميّزه حتى لو تشاركت عدة نقاط الـ SSID نفسه.<\/p>", "q": {"k": "mc", "q": "ما الترتيب الصحيح لاتصال العميل بالـ AP؟", "e": "يكتشف العميل الشبكة أولاً، ثم يثبت هويته، ثم يرتبط ليبدأ تبادل البيانات.", "o": ["Associate ثم Authenticate ثم Discover", "Discover ثم Authenticate ثم Associate", "Authenticate ثم Discover ثم Associate"], "a": 1}}, {"t": "Passive and Active Discover Mode", "b": "<p>كيف يكتشف الجهاز الشبكات المتاحة؟<\/p><ul><li><b>Passive mode<\/b>: الـ AP يعلن عن نفسه دورياً بإرسال <b>Beacon frames<\/b> فيها الـ SSID والمعايير المدعومة وإعدادات الأمن. الجهاز يستمع فقط.<\/li><li><b>Active mode<\/b>: الجهاز يعرف الـ SSID فيبادر بإرسال <b>Probe Request<\/b> على القنوات، والـ AP صاحب الاسم يرد بـ <b>Probe Response<\/b>. يلزم هذا الوضع إن كان الـ AP لا يبث اسمه في الـ Beacons. ويستطيع الجهاز إرسال Probe بلا اسم ليكتشف الشبكات القريبة التي تبث اسمها.<\/li><\/ul><p>نقطة أمنية: الجهاز في الوضع النشط ينادي بأسماء الشبكات التي يعرفها، فيستطيع متنصت أن يعرفها وينتحل إحداها (Evil twin).<\/p>", "q": {"k": "mc", "q": "جهازك يعرض قائمة الشبكات المتاحة دون أن يرسل شيئاً. كيف عرفها؟", "e": "في الوضع السلبي يكتفي الجهاز بالاستماع للـ Beacons الدورية.", "o": ["التقط Beacon frames التي تبثها نقاط الوصول (Passive mode)", "أرسل Probe Request لكل شبكة (Active mode)", "سأل خادم DNS"], "a": 0}}, {"t": "Wireless Devices: AP و LWAP و WLC", "b": "<ul><li><b>Autonomous AP<\/b>: نقطة وصول مستقلة، تُضبط وتُدار كل واحدة على حدة. تناسب المنزل والمكتب الصغير. الـ Router المنزلي يجمع AP و Switch و Router في جهاز.<\/li><li><b>LWAP<\/b> (Lightweight AP، وتسمى Controller-based): نقطة «خفيفة» لا تُضبط منفردة؛ تأخذ إعدادها من متحكم مركزي عبر بروتوكول <b>LWAPP<\/b> أو خلفه <b>CAPWAP<\/b>.<\/li><li><b>WLC<\/b> (Wireless LAN Controller): المتحكم المركزي الذي يدير عشرات أو مئات الـ LWAPs: الإعدادات، القنوات، التحديثات، وسياسات الأمن.<\/li><\/ul><p>الفائدة الأمنية للإدارة المركزية: سياسة واحدة تطبَّق على الكل، والـ WLC يرى الطيف كله فيكشف الـ Rogue APs.<\/p><p>تمرين «Identify the LAN Device»: الـ Switch يربط الأجهزة السلكية داخل الشبكة، الـ Router يربط الشبكات، الـ AP يربط اللاسلكي بالسلكي، والـ WLC يدير الـ APs.<\/p>", "q": {"k": "mc", "q": "جامعة فيها 300 نقطة وصول وتريد تغيير كلمة السر عليها كلها دفعة واحدة. أي بنية تحتاج؟", "e": "الـ WLC يدفع الإعداد لكل النقاط الخفيفة مركزياً. إدارة 300 نقطة مستقلة يدوياً غير عملية وعرضة للخطأ.", "o": ["300 Autonomous AP", "LWAPs يديرها WLC", "Hub مركزي"], "a": 1}}], "test": [{"k": "mc", "q": "مهاجم يلتقط Probe Requests من هاتفك فيعرف أنك تتصل عادةً بشبكة <code dir=\"ltr\">Home_5G<\/code>. ما الهجوم الذي يمهّد له ذلك؟", "e": "معرفة الشبكات المفضلة تسمح بإنشاء نقطة مزيفة بالاسم نفسه يتصل بها الجهاز تلقائياً.", "o": ["Evil twin ينتحل ذلك الـ SSID", "DHCP starvation", "SQL injection"], "a": 0}, {"k": "sa", "q": "ما وظيفة RTS و CTS في CSMA/CA؟", "e": "RTS طلب من الجهاز لحجز القناة، و CTS إذن من الـ AP يسمعه الجميع فيمتنعون عن الإرسال. الغاية تجنب التصادم قبل وقوعه.", "kw": [["حجز", "طلب", "إذن", "request", "clear", "تصادم", "collision"]]}]}, {"t": "5.2 WLAN Threats", "kind": "lesson", "cs": [{"t": "Wireless Security Overview", "b": "<p>الـ WLAN مفتوحة لكل من في المدى ويملك بيانات الاتصال. التهديدات الأربعة الرئيسية:<\/p><ul><li><b>Interception of data<\/b>: التقاط البيانات غير المشفرة بالتنصت.<\/li><li><b>Wireless intruders<\/b>: دخلاء يصلون لموارد الشبكة دون تصريح. تُردع بمصادقة قوية.<\/li><li><b>Denial of Service<\/b>: تعطيل الخدمة عمداً أو عرضاً.<\/li><li><b>Rogue APs<\/b>: نقاط غير مصرح بها يركبها موظف أو مهاجم.<\/li><\/ul><p>المهاجم قد يكون خارج المبنى بهوائي قوي، فحدود الشبكة اللاسلكية ليست جدران المبنى.<\/p>", "q": {"k": "mc", "q": "أي ضابط يعالج تهديد Interception of data مباشرة؟", "e": "التشفير يجعل ما يلتقطه المتنصت غير مقروء. زيادة قوة البث توسّع المدى فتزيد التعرض.", "o": ["التشفير", "إطالة اسم الشبكة", "زيادة قوة البث"], "a": 0}}, {"t": "DoS Attacks على الـ WLAN", "b": "<p>ثلاثة مصادر لتعطل الشبكة اللاسلكية:<\/p><ul><li><b>Improperly configured devices<\/b>: خطأ إعداد يعطل الشبكة، من مدير غافل أو متسلل له صلاحيات.<\/li><li><b>Malicious user interfering<\/b>: مهاجم يعطل الاتصال عمداً، كإرسال Frames إدارية مزيفة تفصل الأجهزة عن الـ AP (<b>Deauthentication attack<\/b>)، أو تشويش RF.<\/li><li><b>Accidental interference<\/b>: تداخل غير مقصود من أجهزة على نطاق <b>2.4 GHz<\/b> مثل أفران الميكروويف والهواتف اللاسلكية.<\/li><\/ul><p>التخفيف: تأمين الأجهزة بكلمات سر قوية ونسخ إعداداتها احتياطياً، مراقبة الشبكة، واستخدام نطاق <b>5 GHz<\/b> الأقل ازدحاماً. وميزة <b>Management Frame Protection<\/b> (معيار 802.11w، إلزامية في WPA3) تمنع تزوير رسائل الفصل.<\/p>", "q": {"k": "mc", "q": "الشبكة اللاسلكية في المطبخ تنقطع كل ظهيرة وقت الغداء فقط. ما السبب الأرجح؟", "e": "الميكروويف يشع على تردد قريب من 2.4 GHz. النقل إلى 5 GHz يحل المشكلة.", "o": ["هجوم APT", "تداخل عرضي من فرن الميكروويف على نطاق 2.4 GHz", "DNS tunneling"], "a": 1}}, {"t": "Rogue Access Points (تقنياً)", "b": "<p>مرّ التعريف في الوحدة 1. نضيف:<\/p><ul><li>الـ Rogue AP قد يكون Router منزلياً رخيصاً، أو حتى <b>حاسوباً شخصياً<\/b> فعّل صاحبه مشاركة الاتصال (Hotspot) فصار جسراً بين الشبكة السلكية المؤمَّنة والهواء.<\/li><li>خطره: يلتقط عناوين MAC والبيانات، ويمنح دخلاء وصولاً للموارد، ويمهّد لـ MitM.<\/li><\/ul><p>الكشف والمنع:<\/p><ul><li>ضبط الـ <b>WLC<\/b> بسياسات Rogue AP: الـ APs المصرح بها تمسح الطيف وتبلّغ عن أي نقطة غريبة.<\/li><li>برامج مراقبة ترصد الطيف الراديوي بحثاً عن نقاط غير مسجلة.<\/li><li>سياسة مكتوبة تمنع الموظفين من تركيب أي جهاز لاسلكي.<\/li><li>تأمين منافذ الـ Switch (802.1X) فلا يعمل جهاز غير مصرح به أصلاً.<\/li><\/ul>", "q": {"k": "tf", "q": "حاسوب موظف موصول بالشبكة السلكية ويشغّل Hotspot يُعد Rogue AP.", "e": "هو يفتح مدخلاً لاسلكياً غير مصرح به إلى الشبكة الداخلية، وهذا تعريف الـ Rogue AP أياً كان الجهاز.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}, {"t": "Man-in-the-Middle Attack: Evil Twin", "b": "<p>أشهر MitM لاسلكي هو <b>Evil twin AP<\/b>:<\/p><ul><li>المهاجم يشغّل AP بالـ <b>SSID نفسه<\/b> لشبكة شرعية، في مكان عام غالباً (مطار، مقهى).<\/li><li>إشارته أقوى، فتفضّلها الأجهزة وترتبط بها.<\/li><li>يمرر حركة الضحايا إلى الـ AP الحقيقي أو الإنترنت، فلا يلاحظون شيئاً، وهو يرى كل ما يمر ويستطيع سرقة كلمات السر والبيانات الشخصية.<\/li><\/ul><p>المنع يبدأ بمعرفة الأجهزة الشرعية على الشبكة: على المستخدمين أن يصادقوا، وتُراقب الشبكة لرصد الأجهزة والحركة غير الطبيعية. وللمستخدم: VPN على الشبكات العامة، والتأكد من HTTPS، وتعطيل الاتصال التلقائي بالشبكات المفتوحة.<\/p>", "q": {"k": "mc", "q": "ما الذي يجعل الضحية لا تلاحظ هجوم الـ Evil twin؟", "e": "الاتصال يعمل والاسم مطابق. الفرق الوحيد أن الحركة تمر عبر جهاز المهاجم.", "o": ["أن الإنترنت ينقطع تماماً", "أن المهاجم يمرر الحركة للإنترنت فيعمل كل شيء طبيعياً", "أن اسم الشبكة مختلف"], "a": 1}}], "test": [{"k": "mc", "q": "موظفون يُفصلون عن الـ Wi-Fi كل بضع ثوانٍ ثم يعاودون الاتصال، والتقاط للحركة يُظهر سيلاً من Frames الفصل لا يرسلها الـ AP الحقيقي. ما الهجوم وما العلاج؟", "e": "Frames الإدارة غير محمية في المعايير القديمة فيمكن تزويرها. حمايتها تمنع هذا الهجوم.", "o": ["Deauthentication attack، والعلاج تفعيل Management Frame Protection (802.11w/WPA3)", "Evil twin، والعلاج تغيير الـ SSID", "تداخل ميكروويف، والعلاج إطفاؤه"], "a": 0}, {"k": "mc", "q": "أي تهديد WLAN يكشفه الـ WLC بمسح الطيف الراديوي؟", "e": "النقاط المصرح بها ترصد أي بث من نقطة غير مسجلة وتبلّغ المتحكم.", "o": ["SQL injection", "Rogue AP", "Whaling"], "a": 1}]}, {"t": "5.3 Secure WLANs", "kind": "lesson", "cs": [{"t": "SSID Cloaking and MAC Address Filtering", "b": "<p>أسلوبان قديمان يُظن أنهما حماية:<\/p><ul><li><b>SSID cloaking<\/b>: تعطيل بث الـ SSID في الـ Beacons، فلا يظهر الاسم في القائمة ويلزم إدخاله يدوياً.<\/li><li><b>MAC address filtering<\/b>: الـ AP يسمح فقط لعناوين MAC مسجلة مسبقاً.<\/li><\/ul><p>لماذا لا يكفيان؟<\/p><ul><li>الـ SSID يظهر مكشوفاً في Frames أخرى حين يتصل أي جهاز شرعي، فيلتقطه المهاجم بسهولة.<\/li><li>عناوين MAC تُرسل مكشوفة، والمهاجم يلتقط عنواناً مسموحاً ثم ينتحله (MAC spoofing).<\/li><\/ul><p>الخلاصة: هما عائق أمام الفضوليين فقط. الحماية الحقيقية هي <b>المصادقة والتشفير<\/b>.<\/p>", "q": {"k": "mc", "q": "لماذا لا يُعد MAC filtering حماية كافية؟", "e": "المهاجم يراقب الحركة، يأخذ عنوان جهاز مسموح، ويضعه على بطاقته.", "o": ["لأنه يبطئ الشبكة", "لأن عناوين MAC تُلتقط مكشوفة ويسهل انتحالها", "لأن الهواتف لا تملك MAC"], "a": 1}}, {"t": "802.11 Original Authentication Methods", "b": "<p>معيار 802.11 الأصلي عرّف طريقتين للمصادقة:<\/p><ul><li><b>Open system authentication<\/b>: أي جهاز يطلب يُقبل، بلا كلمة سر. تُستخدم حيث لا يهم الأمان (مقهى، مطار). مسؤولية الحماية تقع على المستخدم (VPN).<\/li><li><b>Shared key authentication<\/b>: يتشارك الجهاز والـ AP مفتاحاً مسبقاً. كانت في الأصل مع WEP، ثم جاءت بعدها آليات أقوى (WPA، WPA2، WPA3).<\/li><\/ul><p>اليوم «Open» ما زالت شائعة في الشبكات العامة، وأحياناً معها صفحة دخول (<b>Captive portal<\/b>). الصفحة تتحقق من المستخدم لكنها لا تشفّر حركته على الهواء.<\/p>", "q": {"k": "tf", "q": "شبكة Open التي تعرض صفحة تسجيل دخول (Captive portal) تشفّر حركة المستخدم على الهواء.", "e": "الـ Captive portal يتحكم في من يستخدم الإنترنت، لكن الحركة اللاسلكية نفسها تبقى غير مشفرة في الشبكة المفتوحة.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Shared Key Authentication Methods", "b": "<p>تطور معايير المفتاح المشترك:<\/p><div class=\"tw\"><table><tr><th>المعيار<\/th><th>التشفير<\/th><th>الحالة<\/th><\/tr><tr><td><b>WEP<\/b><\/td><td>RC4 بمفتاح ثابت<\/td><td>مكسور، لا يُستخدم أبداً<\/td><\/tr><tr><td><b>WPA<\/b><\/td><td>TKIP: يغيّر المفتاح لكل Packet<\/td><td>مؤقت وقديم، مهجور<\/td><\/tr><tr><td><b>WPA2<\/b><\/td><td>AES (CCMP)<\/td><td>الحد الأدنى المقبول اليوم<\/td><\/tr><tr><td><b>WPA3<\/b><\/td><td>AES مع مصادقة SAE<\/td><td>الأفضل، استخدمه إن توفر<\/td><\/tr><\/table><\/div><p>WPA جاء حلاً سريعاً يعمل على أجهزة WEP القديمة، فاحتفظ بخوارزمية RC4 مع تحسينات. WPA2 غيّر التشفير نفسه إلى AES. أجهزة لا تدعم إلا WEP أو WPA يجب استبدالها.<\/p>", "q": {"k": "mc", "q": "AP قديم يدعم WEP و WPA فقط. ما التوصية؟", "e": "كلا المعيارين مهجور وقابل للكسر. لا إعداد يجعل جهازاً كهذا آمناً.", "o": ["استخدام WEP لأنه الأصل", "استخدام WPA والاكتفاء به", "استبدال الجهاز بآخر يدعم WPA2 على الأقل ويفضل WPA3"], "a": 2}}, {"t": "Authenticating a Home User", "b": "<p>WPA2 و WPA3 يقدمان طريقتين للمصادقة:<\/p><ul><li><b>Personal<\/b>: للمنازل والمكاتب الصغيرة. الكل يستخدم كلمة سر واحدة مشتركة، تسمى <b>PSK<\/b> (Pre-Shared Key). لا يلزم خادم مصادقة.<\/li><li><b>Enterprise<\/b>: للمؤسسات. كل مستخدم يدخل ببياناته الشخصية، ويتحقق منها خادم <b>RADIUS<\/b>. أعقد إعداداً لكنه أأمن بكثير.<\/li><\/ul><p>عيب Personal: كلمة واحدة يعرفها الجميع. إن غادر موظف أو تسربت الكلمة يجب تغييرها على كل الأجهزة، ولا تعرف من فعل ماذا.<\/p><p>للمنزل: WPA2/WPA3-Personal بكلمة سر طويلة (عبارة من عدة كلمات) يكفي.<\/p>", "q": {"k": "mc", "q": "شركة فيها 200 موظف وتريد إلغاء وصول موظف مستقيل للـ Wi-Fi دون تغيير شيء على بقية الأجهزة. ماذا تستخدم؟", "e": "في Enterprise لكل مستخدم حسابه، فيُعطَّل حساب واحد على خادم RADIUS دون مس الآخرين.", "o": ["WPA2-Personal", "WPA2/WPA3-Enterprise", "Open system"], "a": 1}}, {"t": "Encryption Methods", "b": "<p>التشفير يحمي البيانات على الهواء. طريقتان مع WPA و WPA2:<\/p><ul><li><b>TKIP<\/b> (Temporal Key Integrity Protocol): طريقة WPA. تغطي ضعف WEP بتغيير المفتاح لكل Packet وإضافة فحص سلامة <b>MIC<\/b>، لكنها مبنية على RC4 نفسها. مهجورة.<\/li><li><b>AES<\/b> (Advanced Encryption Standard): طريقة WPA2. خوارزمية أقوى بكثير، وتعمل ضمن بروتوكول <b>CCMP<\/b> الذي يكشف أي تعديل في البيانات المشفرة أو في حقول الـ Header. هي المفضلة.<\/li><\/ul><p>في إعدادات الـ AP قد ترى الخيار «WPA2 - TKIP/AES» للتوافق مع أجهزة قديمة. اختر <b>AES فقط<\/b>.<\/p>", "q": {"k": "mc", "q": "أي خيار تشفير تختار على AP يدعم WPA2؟", "e": "AES هو الأقوى. تفعيل TKIP معه يُبقي الباب الأضعف مفتوحاً من أجل أجهزة قديمة.", "o": ["TKIP", "AES (CCMP)", "TKIP و AES معاً لمزيد من الأمان"], "a": 1}}, {"t": "Authentication in the Enterprise", "b": "<p>في وضع Enterprise يلزم خادم <b>AAA<\/b> من نوع <b>RADIUS<\/b>، وتُدخل على الـ AP أو الـ WLC ثلاثة أشياء:<\/p><ul><li><b>RADIUS server IP address<\/b>: عنوان الخادم.<\/li><li><b>UDP port numbers<\/b>: المنفذ 1812 للمصادقة و 1813 للمحاسبة (وقديماً 1645 و 1646).<\/li><li><b>Shared key<\/b>: مفتاح سري بين الـ AP والخادم يثبت به كل منهما هويته للآخر. المستخدم لا يراه ولا يدخله.<\/li><\/ul><p>سير العملية يتبع معيار <b>802.1X<\/b> مع بروتوكول <b>EAP<\/b>: المستخدم يدخل اسمه وكلمة سره، الـ AP يمررهما للخادم ولا يحكم بنفسه، الخادم يرد بالقبول أو الرفض، وعندها فقط يُفتح له الوصول.<\/p><p>الفوائد: حساب لكل مستخدم، سجل بمن اتصل ومتى، وإلغاء فوري لأي حساب.<\/p>", "q": {"k": "mc", "q": "في WPA2-Enterprise، من يتحقق فعلياً من اسم المستخدم وكلمة سره؟", "e": "الـ AP وسيط يمرر بيانات المصادقة عبر 802.1X/EAP، والقرار للخادم.", "o": ["الـ Access Point نفسه", "خادم RADIUS", "جهاز المستخدم"], "a": 1}}, {"t": "WPA3", "b": "<p><b>WPA3<\/b> هو المعيار الحالي، وشهادة Wi-Fi لا تُمنح لجهاز جديد دونه. جديده:<\/p><ul><li><b>WPA3-Personal<\/b>: يستبدل مصافحة PSK بـ <b>SAE<\/b> (Simultaneous Authentication of Equals). المهاجم الذي يلتقط الحركة لا يستطيع تخمين كلمة السر Offline كما في WPA2؛ كل محاولة تخمين تتطلب تفاعلاً مباشراً مع الشبكة.<\/li><li><b>WPA3-Enterprise<\/b>: ما زال 802.1X/EAP، مع خيار حزمة تشفير 192 بت للبيئات الحساسة.<\/li><li><b>Open networks<\/b>: الشبكات المفتوحة تستخدم <b>OWE<\/b> (Opportunistic Wireless Encryption) فتُشفَّر حركة كل مستخدم دون كلمة سر.<\/li><li><b>IoT onboarding<\/b>: بديل لـ <b>WPS<\/b> الضعيف هو <b>DPP<\/b> (Device Provisioning Protocol): إضافة جهاز بلا شاشة بمسح رمز QR.<\/li><li>حماية Frames الإدارة (802.11w) إلزامية.<\/li><\/ul>", "q": {"k": "mc", "q": "ما الميزة الأمنية الرئيسية لـ SAE في WPA3-Personal؟", "e": "في WPA2-PSK يلتقط المهاجم الـ Handshake ثم يخمّن بلا حدود على حاسوبه. SAE يغلق هذا الباب.", "o": ["يجعل الشبكة أسرع", "يمنع تخمين كلمة السر Offline من حركة ملتقطة", "يلغي الحاجة لكلمة سر"], "a": 1}}, {"t": "تمارين: Configure Basic Wireless Security و Troubleshoot", "b": "<p>بديلا Packet Tracer 5.3.10 و 5.3.11. ادخل صفحة إعداد الـ Router المنزلي (غالباً <code dir=\"ltr\">192.168.1.1<\/code>) وراجع هذه القائمة:<\/p><ul><li>غيّر كلمة سر المدير الافتراضية.<\/li><li>Security mode: WPA2-Personal أو WPA3، والتشفير AES.<\/li><li>كلمة سر الشبكة 14 رمزاً فأكثر.<\/li><li>عطّل WPS.<\/li><li>فعّل شبكة ضيوف معزولة.<\/li><li>حدّث الـ Firmware.<\/li><\/ul><p>منهج استكشاف عطل اتصال لاسلكي، من الأسفل للأعلى:<\/p><ul><li>هل البطاقة اللاسلكية مفعّلة والجهاز في المدى؟<\/li><li>هل الـ SSID صحيح (حساس لحالة الأحرف)؟<\/li><li>هل Security mode وكلمة السر متطابقان في الطرفين؟<\/li><li>هل حصل الجهاز على IP من DHCP؟ (عنوان يبدأ بـ <code dir=\"ltr\">169.254<\/code> يعني لا).<\/li><li>هل يصل للـ Gateway بـ <code dir=\"ltr\">ping<\/code>؟ ثم هل يعمل DNS؟<\/li><\/ul>", "q": {"k": "mc", "q": "حاسوب اتصل بالـ Wi-Fi لكن عنوانه <code dir=\"ltr\">169.254.10.7<\/code> ولا يصل للإنترنت. أين المشكلة؟", "e": "عناوين 169.254.x.x يعيّنها الجهاز لنفسه حين لا يرد خادم DHCP. الارتباط اللاسلكي نجح والخلل في DHCP.", "o": ["كلمة سر الـ Wi-Fi خاطئة", "لم يحصل على عنوان من خادم DHCP", "القناة مزدحمة"], "a": 1}}], "test": [{"k": "mc", "q": "رتّب من الأضعف إلى الأقوى.", "e": "هذا هو الترتيب التاريخي والأمني معاً.", "o": ["WPA2 ثم WPA ثم WEP ثم WPA3", "WEP ثم WPA ثم WPA2 ثم WPA3", "WPA ثم WEP ثم WPA3 ثم WPA2"], "a": 1}, {"k": "mc", "q": "مدير شبكة أخفى الـ SSID وفعّل MAC filtering وترك الشبكة بلا تشفير. ما تقييمك؟", "e": "لا مصادقة حقيقية ولا تشفير. كل ما يُرسل يُقرأ، والدخول ممكن بانتحال MAC.", "o": ["آمنة جداً لوجود طبقتين", "غير آمنة: الضابطان يُتجاوزان بسهولة والبيانات مكشوفة على الهواء", "آمنة ما دام الاسم مخفياً"], "a": 1}, {"k": "sa", "q": "لماذا يُعد وضع Enterprise أأمن من Personal في المؤسسات؟", "e": "لأن كل مستخدم يصادق بحسابه الخاص عبر خادم RADIUS (802.1X)، فيمكن إلغاء حساب واحد، ومعرفة من اتصل ومتى، ولا توجد كلمة سر مشتركة تتسرب.", "kw": [["radius", "خادم", "لكل مستخدم", "حساب", "individual", "802.1x", "فردي"]]}]}, {"t": "5.4 ملخص الوحدة 5 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li>الـ WLAN (802.11) تستخدم RF و CSMA/CA (RTS، CTS، ACK) وتعمل Half-duplex.<\/li><li>الـ Frame فيه حتى أربعة عناوين. أنواعه: Management، Control، Data.<\/li><li>الاتصال: Discover (Passive بالـ Beacons أو Active بالـ Probes) ثم Authenticate ثم Associate.<\/li><li>الأجهزة: Autonomous AP، أو LWAP يديرها WLC عبر CAPWAP.<\/li><li>التهديدات: Interception، Intruders، DoS (ومنه Deauthentication والتداخل)، Rogue AP، Evil twin.<\/li><li>SSID cloaking و MAC filtering ليسا حماية.<\/li><li>WEP و WPA/TKIP مهجوران. WPA2-AES الحد الأدنى. WPA3 (SAE، OWE، DPP) الأفضل.<\/li><li>Personal = PSK مشتركة. Enterprise = حساب لكل مستخدم عبر RADIUS و 802.1X.<\/li><\/ul>", "q": {"k": "mc", "q": "أي إعداد هو الأفضل لشبكة شركة متوسطة؟", "e": "مصادقة فردية وتشفير قوي. الخياران الآخران يعتمدان على ضوابط ضعيفة أو مهجورة.", "o": ["Open مع MAC filtering", "WPA2-Personal مع TKIP", "WPA3-Enterprise (أو WPA2-Enterprise مع AES) وخادم RADIUS"], "a": 2}}], "test": []}, {"t": "اختبار الوحدة 5", "kind": "exam", "pool": [5], "n": 10}]}, {"n": "6", "t": "الوحدة 6: Network Security Infrastructure", "secs": [{"t": "6.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>عرفت الهجمات، والآن تتعرف على عتاد الدفاع وخدماته.<\/p><p>ستتعلم:<\/p><ul><li><b>Security Devices<\/b>: الـ Firewall بأنواعه، معماريات الشبكة الآمنة (DMZ)، وأجهزة كشف التسلل ومنعه (IDS و IPS).<\/li><li><b>Security Services<\/b>: خدمات تعطي الشبكة تحكماً ورؤية: ACL، SNMP، NetFlow، Port mirroring، Syslog، NTP، AAA، VPN.<\/li><\/ul><p>هذه الأجهزة والخدمات هي مصدر التنبيهات والسجلات التي يقرؤها محلل الـ SOC يومياً.<\/p>", "q": {"k": "tf", "q": "أجهزة وخدمات هذه الوحدة هي مصدر معظم السجلات والتنبيهات التي يعمل عليها محلل الـ SOC.", "e": "الـ Firewall و IPS و Syslog و NetFlow تنتج البيانات التي يحللها المحلل.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": []}, {"t": "6.1 Security Devices", "kind": "lesson", "cs": [{"t": "Firewalls", "b": "<p><b>Firewall<\/b> نظام (أو مجموعة أنظمة) يفرض سياسة تحكم في الوصول بين شبكتين، كحارس بوابة يفحص كل مارّ ويقرر: يسمح أو يمنع.<\/p><p>خصائص مشتركة لكل Firewall:<\/p><ul><li>مقاوم للهجمات هو نفسه.<\/li><li>هو نقطة العبور الوحيدة بين الشبكة الداخلية والخارجية؛ كل الحركة تمر به.<\/li><li>يفرض سياسة التحكم بالوصول.<\/li><\/ul><p><b>فوائده<\/b>: يحجب الأجهزة والتطبيقات الداخلية عن غير الموثوقين، ينظف حركة البروتوكولات، يحجب البيانات الخبيثة، ويبسّط إدارة الأمن بتركيزها في نقطة.<\/p><p><b>حدوده<\/b>: إعداد خاطئ قد يكون كارثياً (نقطة فشل واحدة)، بعض التطبيقات لا تمر عبره بأمان، يبطئ الشبكة أحياناً، قد يدفع المستخدمين للبحث عن طرق التفاف، والحركة المخفية داخل نفق مشفر تمر كحركة مشروعة.<\/p>", "q": {"k": "mc", "q": "أي عبارة تصف حداً من حدود الـ Firewall؟", "e": "الـ Firewall يحكم على ما يراه. ما يُخفى داخل اتصال مشفر مسموح يبدو له حركة مشروعة.", "o": ["لا يستطيع فرض أي سياسة", "حركة خبيثة داخل نفق مشفر مسموح قد تمر به دون أن يكتشفها", "لا يعمل مع TCP"], "a": 1}}, {"t": "Common Security Architectures", "b": "<p>تصاميم شائعة لوضع الـ Firewall:<\/p><ul><li><b>Private and Public<\/b>: واجهتان. الداخلية (<b>Private / Inside<\/b>) موثوقة والخارجية (<b>Public / Outside<\/b>) غير موثوقة. الحركة من الداخل للخارج مسموحة ويُسمح بردودها، والحركة التي تبدأ من الخارج ممنوعة.<\/li><li><b>DMZ<\/b> (Demilitarized Zone): ثلاث واجهات: داخلية، خارجية، ومنطقة وسطى توضع فيها الخوادم التي يجب أن يصلها العامة (ويب، بريد، DNS). القواعد:<\/li><li>من الداخل إلى الـ DMZ والخارج: مسموح.<\/li><li>من الخارج إلى الـ DMZ: مسموح للخدمات المحددة فقط (مثل HTTPS).<\/li><li>من الـ DMZ إلى الداخل: ممنوع.<\/li><li>من الخارج إلى الداخل: ممنوع.<\/li><li><b>ZPF<\/b> (Zone-Based Policy Firewall): الواجهات تُجمع في مناطق (<b>Zones<\/b>) متشابهة الوظيفة، والسياسات تُكتب بين المناطق. الحركة داخل المنطقة الواحدة حرة، وبين المناطق ممنوعة حتى تسمح بها سياسة صريحة.<\/li><\/ul><p>فائدة الـ DMZ: إن اختُرق خادم الويب بقي المهاجم محصوراً خارج الشبكة الداخلية.<\/p>", "q": {"k": "mc", "q": "أين يوضع خادم الويب العام للشركة؟", "e": "الـ DMZ تتيح الوصول العام للخادم مع عزله عن الشبكة الداخلية، فلا يصير اختراقه جسراً للداخل.", "o": ["في الشبكة الداخلية مع حواسيب الموظفين", "في الـ DMZ", "خارج الـ Firewall تماماً"], "a": 1}}, {"t": "Firewall Type Descriptions", "b": "<ul><li><b>Packet filtering (Stateless) firewall<\/b>: يفحص كل Packet منفرداً بحسب معلومات الطبقتين 3 و4 (العناوين، المنافذ، البروتوكول) ويطابقها مع جدول قواعد. سريع وبسيط، لكنه لا يتذكر سياق الاتصال، فيُخدع بـ Packets مصنوعة بعناية.<\/li><li><b>Stateful firewall<\/b>: الأكثر شيوعاً. يتابع حالة كل اتصال في <b>State table<\/b>، فيسمح بالرد لأنه يعلم أن طلباً خرج قبله، ويرفض «رداً» لم يسبقه طلب.<\/li><li><b>Application gateway (Proxy) firewall<\/b>: يعمل حتى الطبقة 7. العميل يتصل بالـ Proxy، والـ Proxy يتصل بالخادم نيابة عنه، ويفهم محتوى البروتوكول نفسه (HTTP، FTP).<\/li><li><b>NGFW<\/b> (Next-Generation Firewall): Stateful ومعه IPS مدمج، تمييز للتطبيقات والتحكم فيها أياً كان المنفذ، واستفادة من معلومات التهديدات المحدَّثة.<\/li><\/ul><p>أنواع أخرى: <b>Host-based<\/b> (برنامج على الجهاز نفسه)، <b>Transparent<\/b> (يفلتر بين واجهتين مجسَّرتين)، <b>Hybrid<\/b> (يجمع أكثر من نوع).<\/p>", "q": {"k": "mc", "q": "Packet يدّعي أنه رد من خادم ويب لكن لا يوجد أي طلب داخلي سبقه. أي Firewall يرفضه لهذا السبب تحديداً؟", "e": "الـ Stateful يرجع لجدول الحالات فلا يجد اتصالاً قائماً يطابق هذا الرد، فيسقطه.", "o": ["Packet filtering (Stateless)", "Stateful firewall", "Hub"], "a": 1}}, {"t": "Intrusion Detection and Prevention Devices", "b": "<p>الـ Firewall يحكم بالعناوين والمنافذ. لكشف الهجوم داخل الحركة المسموحة نحتاج:<\/p><ul><li><b>IDS<\/b> (Intrusion Detection System): يراقب <b>نسخة<\/b> من الحركة (يعمل <b>Offline<\/b> أو Out-of-band، عبر Port mirroring). يقارنها بالتواقيع، وإن وجد هجوماً <b>ينبّه<\/b> فقط. لا يوقف الـ Packet لأن الأصل وصل لوجهته.<\/li><li><b>IPS<\/b> (Intrusion Prevention System): يوضع <b>Inline<\/b>، أي أن الحركة الفعلية تمر عبره. يفحص ويستطيع <b>إسقاط<\/b> الـ Packet الخبيث قبل وصوله.<\/li><\/ul><p>كلاهما يعتمد على <b>Signatures<\/b>: أنماط تعرّف الحركة الخبيثة (توقيع لكل هجوم معروف)، ويمكنهما أيضاً رصد الشذوذ عن السلوك الطبيعي.<\/p><p>تشبيه: الـ IDS كاميرا مراقبة تنذر، والـ IPS حارس على الباب يمنع.<\/p>", "q": {"k": "mc", "q": "ما الفرق الأساسي في التموضع بين IDS و IPS؟", "e": "كون الـ IPS Inline يمكّنه من المنع، وكون الـ IDS خارج المسار يجعله منبّهاً فقط.", "o": ["لا فرق", "الـ IDS يراقب نسخة من الحركة، والـ IPS تمر عبره الحركة الفعلية", "الـ IPS يعمل على الهواتف فقط"], "a": 1}}, {"t": "Advantages and Disadvantages of IDS and IPS", "b": "<div class=\"tw\"><table><tr><th><\/th><th>IDS<\/th><th>IPS<\/th><\/tr><tr><td>المزايا<\/td><td>لا يؤثر على أداء الشبكة (لا تأخير). إن تعطل لا تتعطل الشبكة<\/td><td>يوقف الـ Packets الخبيثة فعلاً. يستطيع تطبيع الحركة (Stream normalization)<\/td><\/tr><tr><td>العيوب<\/td><td>لا يوقف الـ Packet الأول المهاجم. يحتاج ضبطاً دقيقاً. أضعف أمام تقنيات التهرب<\/td><td>يضيف تأخيراً. إن تعطل أو امتلأ قد يوقف الشبكة. الإنذار الكاذب يحجب حركة مشروعة<\/td><\/tr><\/table><\/div><p>الاختيار بينهما موازنة: IPS يمنع لكن خطأه مكلف (حجب عمل مشروع)، و IDS آمن على الأداء لكنه يخبرك بعد وقوع الأمر. كثير من المؤسسات تستخدم الاثنين: IPS للتواقيع المؤكدة و IDS لمراقبة أوسع.<\/p>", "q": {"k": "mc", "q": "IPS أطلق False Positive على تطبيق المحاسبة. ما الأثر؟", "e": "الـ IPS يتصرف فوراً، فالإنذار الكاذب عنده يعني منع حركة سليمة. لهذا يحتاج ضبطاً دقيقاً.", "o": ["لا شيء، تنبيه فقط", "حجب حركة التطبيق المشروعة وتعطل العمل", "تسريع التطبيق"], "a": 1}}, {"t": "Types of IPS", "b": "<ul><li><b>Host-based IPS (HIPS)<\/b>: برنامج يثبَّت على الجهاز نفسه يراقب نشاطه ويحميه.<\/li><li>مزاياه: حماية مخصصة لنظام التشغيل، يحمي التطبيقات ونظام التشغيل، ويرى الحركة <b>بعد فك تشفيرها<\/b> على الجهاز.<\/li><li>عيوبه: يعتمد على نظام التشغيل، يجب تثبيته على كل جهاز، ولا يرى صورة الشبكة الكاملة.<\/li><li><b>Network-based IPS (NIPS)<\/b>: جهاز مستقل أو خاصية في Router/Firewall، يراقب مقاطع الشبكة عبر <b>Sensors<\/b>.<\/li><li>مزاياه: اقتصادي (جهاز واحد يحمي كثيرين)، مستقل عن أنظمة التشغيل، ويرى أحداث الشبكة كلها.<\/li><li>عيوبه: لا يفحص الحركة المشفرة، ولا يعرف هل نجح الهجوم على الجهاز المستهدف.<\/li><\/ul><p>الاثنان متكاملان.<\/p>", "q": {"k": "mc", "q": "هجوم مخفي داخل اتصال HTTPS. أيهما يراه بعد فك التشفير؟", "e": "التشفير ينتهي عند الجهاز، فيرى الـ HIPS المحتوى الفعلي. الـ NIPS يرى بيانات مشفرة فقط (ما لم يُضف فك تشفير).", "o": ["HIPS على الجهاز المستهدف", "NIPS على حافة الشبكة", "لا أحد منهما إطلاقاً"], "a": 0}}, {"t": "Specialized Security Appliances", "b": "<p>أجهزة متخصصة تكمل الـ Firewall و IPS (بأسماء منتجات Cisco كمثال):<\/p><ul><li><b>Cisco Secure Endpoint<\/b> (اسمه السابق <b>AMP<\/b>: Advanced Malware Protection): يحلل الملفات ويحمي من Malware قبل الهجوم وأثناءه وبعده، ويتتبع الملف بعد دخوله (Retrospection).<\/li><li><b>Secure Web Appliance<\/b> (سابقاً <b>WSA<\/b>): بوابة ويب تفحص حركة التصفح، تحجب المواقع الخطرة، وتتحكم في استخدام التطبيقات.<\/li><li><b>Secure Email<\/b> (سابقاً <b>ESA<\/b>): بوابة بريد تفلتر الـ Spam والتصيد والمرفقات الخبيثة قبل وصولها لصندوق الوارد.<\/li><\/ul><p>كلها تتغذى من معلومات <b>Cisco Talos<\/b> عن التهديدات، فتُحدَّث قواعدها كل بضع دقائق.<\/p>", "q": {"k": "mc", "q": "أي جهاز متخصص يعترض رسائل التصيد قبل وصولها للموظف؟", "e": "بوابة أمن البريد تفحص الرسائل الواردة وتحجب الـ Spam والتصيد والمرفقات الخبيثة.", "o": ["Web security appliance", "Email security appliance", "WLC"], "a": 1}}], "test": [{"k": "mc", "q": "شركة تريد كشف الهجمات دون أي مخاطرة بتأخير الحركة أو حجب عمل مشروع. ماذا تختار؟", "e": "الـ IDS خارج مسار الحركة فلا يؤخرها ولا يحجب شيئاً؛ ثمن ذلك أنه لا يمنع.", "o": ["IDS", "IPS", "Packet filtering firewall وحده"], "a": 0}, {"k": "mc", "q": "خادم الويب في الـ DMZ اختُرق وحاول المهاجم منه الاتصال بقاعدة بيانات في الشبكة الداخلية. ماذا يحدث في تصميم DMZ سليم؟", "e": "هذا بالضبط ما صُممت له الـ DMZ: حصر الخادم المكشوف بعيداً عن الداخل.", "o": ["يُسمح له لأن الـ DMZ جزء من الشركة", "يمنعه الـ Firewall لأن الحركة من الـ DMZ إلى الداخل ممنوعة", "يُحوَّل للإنترنت"], "a": 1}, {"k": "sa", "q": "ما الذي يضيفه الـ NGFW على الـ Stateful firewall التقليدي؟", "e": "يضيف IPS مدمجاً، وتمييز التطبيقات والتحكم فيها بصرف النظر عن المنفذ (Application awareness)، واستخدام معلومات التهديدات المحدَّثة.", "kw": [["ips", "تطبيق", "application", "threat", "تهديد"]]}]}, {"t": "6.2 Security Services", "kind": "lesson", "cs": [{"t": "Traffic Control with ACLs", "b": "<p><b>ACL<\/b> (Access Control List) قائمة مرتبة من أوامر «اسمح» (<b>permit<\/b>) و«امنع» (<b>deny<\/b>) تطبَّق على واجهة Router لتفلتر الحركة بحسب معلومات الـ Header.<\/p><p>كيف تعمل:<\/p><ul><li>الـ Router يقارن كل Packet بالأسطر <b>من الأعلى للأسفل<\/b>.<\/li><li>عند أول تطابق ينفّذ الحكم ويتوقف (<b>First match<\/b>).<\/li><li>في نهاية كل ACL سطر غير مرئي: <b>Implicit deny any<\/b>. ما لم يُسمح به صراحةً ممنوع.<\/li><\/ul><p>نوعان:<\/p><ul><li><b>Standard ACL<\/b>: يفلتر بحسب <b>عنوان المصدر فقط<\/b>.<\/li><li><b>Extended ACL<\/b>: يفلتر بحسب المصدر والوجهة والبروتوكول والمنافذ.<\/li><\/ul><p>مثال (Extended): السماح بالويب المشفر فقط نحو خادم في الـ DMZ:<\/p><pre dir=\"ltr\"><code>access-list 110 permit tcp any host 203.0.113.10 eq 443\naccess-list 110 deny ip any any<\/code><\/pre>", "q": {"k": "mc", "q": "ACL فيها سطر واحد: <code dir=\"ltr\">permit tcp any any eq 443<\/code>. ماذا يحدث لـ Packet نحو المنفذ 22؟", "e": "لم يطابق أي سطر permit، فيسقطه السطر الضمني deny any.", "o": ["يُسمح به", "يُمنع بسبب الـ Implicit deny في آخر القائمة", "يُعاد توجيهه للمنفذ 443"], "a": 1}}, {"t": "ACLs: Important Features", "b": "<p>ما تفعله الـ ACLs:<\/p><ul><li>تحد من الحركة لتحسين الأداء (مثل منع الفيديو).<\/li><li>تتحكم في تدفق الحركة وتحديثات التوجيه.<\/li><li>تقدم مستوى أساسياً من أمن الوصول: شبكة يُسمح لها وأخرى تُمنع.<\/li><li>تفلتر بحسب نوع الحركة (السماح بالبريد ومنع Telnet).<\/li><li>تحدد من يصل لأي خدمة.<\/li><\/ul><p>قواعد كتابة مهمة:<\/p><ul><li><b>الترتيب مهم<\/b>: ضع القواعد الأخصّ قبل الأعمّ؛ قاعدة عامة في الأعلى تحجب ما تحتها.<\/li><li>تطبَّق على واجهة وباتجاه: <b>in<\/b> (الداخل للواجهة) أو <b>out<\/b>.<\/li><li>الـ Extended توضع قريباً من <b>المصدر<\/b> لتُسقط الحركة مبكراً. الـ Standard قريباً من <b>الوجهة<\/b>.<\/li><\/ul><div class=\"note\">تمرين (بديل Packet Tracer 6.2.4): اكتب بالكلمات ACL تسمح لشبكة الموظفين <code dir=\"ltr\">10.1.0.0/16<\/code> بالوصول لخادم <code dir=\"ltr\">10.9.9.9<\/code> على HTTPS فقط، وتمنع شبكة الضيوف <code dir=\"ltr\">10.2.0.0/16<\/code> من أي وصول له. ثم تتبّع بيدك مصير ثلاثة Packets مختلفة.<\/div>", "q": {"k": "mc", "q": "ACL من سطرين بالترتيب: <code dir=\"ltr\">deny ip any any<\/code> ثم <code dir=\"ltr\">permit tcp any any eq 80<\/code>. ما النتيجة؟", "e": "أول تطابق يحسم. السطر الأول يطابق كل Packet فلا يصل الفحص للسطر الثاني. الترتيب مهم.", "o": ["يُسمح بالويب فقط", "يُمنع كل شيء، والسطر الثاني لا يُفحص أبداً", "يُسمح بكل شيء"], "a": 1}}, {"t": "SNMP", "b": "<p><b>SNMP<\/b> (Simple Network Management Protocol) بروتوكول لمراقبة أجهزة الشبكة وإدارتها مركزياً. مكوناته:<\/p><ul><li><b>SNMP Manager<\/b>: برنامج الإدارة المركزي (NMS).<\/li><li><b>SNMP Agent<\/b>: برنامج صغير على كل جهاز مُدار (Router، Switch، خادم).<\/li><li><b>MIB<\/b> (Management Information Base): قاعدة بيانات على الجهاز فيها متغيراته: استهلاك المعالج، حالة الواجهات، عدد الأخطاء.<\/li><\/ul><p>العمليات: الـ Manager يقرأ بـ <b>get<\/b> ويغيّر إعداداً بـ <b>set<\/b>، والـ Agent ينبّه من تلقاء نفسه بـ <b>trap<\/b> حين يقع حدث. يعمل على UDP 161، والـ Traps على 162.<\/p><p>أمنياً: النسختان v1 و v2c تعتمدان على «Community string» ترسل نصاً مكشوفاً، وهي ككلمة سر ضعيفة. استخدم <b>SNMPv3<\/b> الذي يضيف مصادقة وتشفيراً.<\/p>", "q": {"k": "mc", "q": "أي نسخة SNMP تستخدم لتأمين المراقبة؟", "e": "v3 الوحيدة التي تصادق وتشفّر. ما قبلها يرسل الـ Community string مكشوفة.", "o": ["SNMPv1", "SNMPv2c", "SNMPv3"], "a": 2}}, {"t": "NetFlow", "b": "<p><b>NetFlow<\/b> تقنية من Cisco تجمع <b>إحصاءات<\/b> عن الحركة المارة بالـ Router أو الـ Switch. لا تلتقط محتوى الـ Packets؛ تسجل <b>من كلّم من، ومتى، وكم<\/b>.<\/p><p>الـ <b>Flow<\/b> هو سيل Packets يتشارك سبع خصائص:<\/p><ul><li>Source IP و Destination IP.<\/li><li>Source port و Destination port.<\/li><li>Layer 3 protocol type.<\/li><li>Type of Service (ToS).<\/li><li>Input interface.<\/li><\/ul><p>الجهاز يرسل سجلات الـ Flows إلى <b>NetFlow collector<\/b> يخزنها ويحللها.<\/p><p>فائدتها الأمنية: بناء Baseline للحركة الطبيعية، ثم كشف الشذوذ: جهاز يرسل فجأة 20 GB للخارج ليلاً، أو يتصل بآلاف العناوين. تشبيه: فاتورة الهاتف تعرض الأرقام والمدد دون نص المكالمات.<\/p>", "q": {"k": "tf", "q": "تقنية NetFlow تسجل المحتوى الكامل لكل Packet يمر بالجهاز.", "e": "هي تسجل بيانات وصفية عن التدفقات (الأطراف، المنافذ، الحجم، الزمن). التقاط المحتوى الكامل يحتاج أدوات مثل Wireshark.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Port Mirroring", "b": "<p>الـ Switch يرسل كل Frame إلى منفذ وجهته فقط، فلا يرى محلل الحركة الموصول بمنفذ آخر شيئاً.<\/p><p><b>Port mirroring<\/b> خاصية تجعل الـ Switch ينسخ الحركة من منفذ أو أكثر ويرسل النسخة إلى منفذ آخر موصول به جهاز تحليل (IDS، أو Wireshark، أو Collector). تسميها Cisco <b>SPAN<\/b> (Switched Port Analyzer).<\/p><p>الأصل يذهب لوجهته دون تأخير، والنسخة تذهب للتحليل. هكذا يُغذّى الـ IDS.<\/p><p>البديل العتادي هو <b>Network TAP<\/b>: جهاز يوضع على الكابل نفسه وينسخ كل ما يمر.<\/p>", "q": {"k": "mc", "q": "كيف يحصل الـ IDS على الحركة التي يحللها في شبكة Switched؟", "e": "الـ Switch لا يرسل حركة الآخرين لمنفذ الـ IDS تلقائياً؛ يجب نسخها له صراحةً.", "o": ["يخمنها", "عبر Port mirroring (SPAN) أو Network TAP ينسخ له الحركة", "من خادم DHCP"], "a": 1}}, {"t": "Syslog Servers", "b": "<p><b>Syslog<\/b> معيار لإرسال رسائل الأحداث من الأجهزة (Routers، Switches، Firewalls، خوادم) إلى خادم مركزي يجمعها. يعمل على UDP 514.<\/p><p>لماذا مركزي؟<\/p><ul><li>تبحث في مكان واحد بدل الدخول لكل جهاز.<\/li><li>المهاجم الذي يخترق جهازاً ويمسح سجلاته المحلية لا يصل للنسخة المركزية.<\/li><li>ربط أحداث من أجهزة مختلفة (<b>Correlation<\/b>).<\/li><\/ul><p>كل رسالة لها مستوى خطورة (<b>Severity<\/b>) من 0 إلى 7. الأصغر أخطر:<\/p><div class=\"tw\"><table><tr><th>المستوى<\/th><th>الاسم<\/th><\/tr><tr><td>0<\/td><td>Emergency<\/td><\/tr><tr><td>1<\/td><td>Alert<\/td><\/tr><tr><td>2<\/td><td>Critical<\/td><\/tr><tr><td>3<\/td><td>Error<\/td><\/tr><tr><td>4<\/td><td>Warning<\/td><\/tr><tr><td>5<\/td><td>Notification<\/td><\/tr><tr><td>6<\/td><td>Informational<\/td><\/tr><tr><td>7<\/td><td>Debugging<\/td><\/tr><\/table><\/div><p>أنظمة <b>SIEM<\/b> تبني على هذا: تجمع السجلات من كل المصادر وتحللها وتنبّه.<\/p>", "q": {"k": "mc", "q": "أي مستوى Syslog أخطر؟", "e": "الرقم الأصغر أخطر. 0 Emergency هو الأعلى، ثم 1 Alert.", "o": ["6 Informational", "1 Alert", "4 Warning"], "a": 1}}, {"t": "NTP", "b": "<p><b>NTP<\/b> (Network Time Protocol) يزامن ساعات الأجهزة مع مصدر وقت دقيق. يعمل على UDP 123.<\/p><p>لماذا يهم الأمن؟ التحقيق في حادث يعتمد على ترتيب الأحداث من سجلات أجهزة مختلفة. إن اختلفت ساعاتها دقائق، استحال معرفة ما سبق ماذا. وبعض بروتوكولات المصادقة والشهادات ترفض العمل إن انحرف الوقت.<\/p><p>التنظيم هرمي بمستويات تسمى <b>Stratum<\/b>:<\/p><ul><li><b>Stratum 0<\/b>: مصادر الوقت الدقيقة نفسها (ساعات ذرية، GPS).<\/li><li><b>Stratum 1<\/b>: خوادم موصولة مباشرة بها.<\/li><li><b>Stratum 2<\/b> فما بعد: تأخذ وقتها من المستوى الأعلى. كل قفزة تزيد الرقم واحداً.<\/li><\/ul><p>الرقم الأصغر أقرب للمصدر وأدق.<\/p>", "q": {"k": "mc", "q": "لماذا تُعد مزامنة الوقت ضرورية للتحقيق الأمني؟", "e": "دون وقت موحد لا يمكن بناء تسلسل زمني (Timeline) صحيح للحادث.", "o": ["لتوفير الكهرباء", "لترتيب الأحداث بدقة عند ربط سجلات أجهزة مختلفة", "لتسريع الإنترنت"], "a": 1}}, {"t": "AAA Servers", "b": "<p><b>AAA<\/b> ثلاث خدمات تتحكم في الوصول:<\/p><ul><li><b>Authentication<\/b>: من أنت؟ إثبات الهوية (كلمة سر، بطاقة، بصمة).<\/li><li><b>Authorization<\/b>: ماذا يُسمح لك أن تفعل؟<\/li><li><b>Accounting<\/b>: ماذا فعلت؟ تسجيل النشاط والمدة.<\/li><\/ul><p>بروتوكولان لخادم AAA:<\/p><div class=\"tw\"><table><tr><th><\/th><th>TACACS+<\/th><th>RADIUS<\/th><\/tr><tr><td>الفصل<\/td><td>يفصل Authentication عن Authorization<\/td><td>يدمجهما في عملية واحدة<\/td><\/tr><tr><td>النقل<\/td><td>TCP 49<\/td><td>UDP 1812 و 1813<\/td><\/tr><tr><td>التشفير<\/td><td>يشفّر الرسالة كلها<\/td><td>يشفّر كلمة السر فقط<\/td><\/tr><tr><td>الاستخدام الشائع<\/td><td>إدارة أجهزة الشبكة (تحكم دقيق في الأوامر)<\/td><td>وصول المستخدمين للشبكة (Wi-Fi، VPN، 802.1X)<\/td><\/tr><tr><td>المصدر<\/td><td>Cisco أساساً<\/td><td>معيار مفتوح<\/td><\/tr><\/table><\/div>", "q": {"k": "mc", "q": "مدير دخل إلى Router بحسابه ثم مُنع من تنفيذ أمر حذف الإعدادات. أي خدمة من AAA منعته؟", "e": "المصادقة نجحت (عُرف من هو). الـ Authorization هي التي تحدد ما يُسمح له بفعله.", "o": ["Authentication", "Authorization", "Accounting"], "a": 1}}, {"t": "VPN", "b": "<p><b>VPN<\/b> (Virtual Private Network) شبكة خاصة تُبنى فوق شبكة عامة كالإنترنت. «افتراضية» لأنها تنقل البيانات داخل نفق (<b>Tunnel<\/b>) عبر الشبكة العامة، و«خاصة» لأن الحركة مشفرة.<\/p><p>نوعان رئيسيان:<\/p><ul><li><b>Remote-access VPN<\/b>: موظف من منزله أو فندق يتصل بشبكة الشركة عبر برنامج VPN على جهازه.<\/li><li><b>Site-to-site VPN<\/b>: ربط دائم بين موقعين (مقر وفرع) عبر جهازَي VPN، والمستخدمون لا يشعرون به.<\/li><\/ul><p>ما يقدمه: Confidentiality (التشفير)، Integrity (كشف التعديل)، ومصادقة الطرفين. أشهر التقنيات: <b>IPsec<\/b> و <b>SSL/TLS VPN<\/b>. ونفق <b>GRE<\/b> وحده يغلّف ولا يشفّر، فيُجمع مع IPsec.<\/p><p>
