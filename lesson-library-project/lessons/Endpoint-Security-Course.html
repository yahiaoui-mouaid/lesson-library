للمحلل: الـ VPN يخفي الحركة عن المتنصتين وعن أدوات الفحص على المسار أيضاً.<\/p>", "q": {"k": "mc", "q": "شركة تريد ربط فرعها الجديد بالمقر ربطاً دائماً ومشفراً عبر الإنترنت. أي نوع؟", "e": "الربط الدائم بين شبكتين كاملتين هو Site-to-site، ولا يحتاج برنامجاً على أجهزة المستخدمين.", "o": ["Remote-access VPN لكل موظف", "Site-to-site VPN", "Port mirroring"], "a": 1}}], "test": [{"k": "mc", "q": "محلل يريد معرفة أي جهاز داخلي أرسل أكبر كمية بيانات للخارج أمس، دون الحاجة لمحتوى البيانات. أي مصدر أنسب؟", "e": "NetFlow يسجل من كلّم من وبأي حجم، وهو المطلوب تماماً.", "o": ["سجلات NetFlow", "جدول ARP", "إعدادات NTP"], "a": 0}, {"k": "mc", "q": "مهاجم اخترق خادماً ومسح سجلاته المحلية. أي خدمة كانت ستحفظ نسخة لا يصلها؟", "e": "إرسال السجلات فور توليدها إلى خادم مركزي يحفظ الأدلة خارج الجهاز المخترق.", "o": ["DHCP", "خادم Syslog مركزي", "Port mirroring"], "a": 1}, {"k": "sa", "q": "اشرح معنى Implicit deny في الـ ACL وأثره على كتابة القواعد.", "e": "في نهاية كل ACL قاعدة ضمنية تمنع كل ما لم يطابق قاعدة قبلها. الأثر: يجب أن تكتب permit صريحاً لكل حركة تريدها، وإلا مُنعت.", "kw": [["ممنوع", "يمنع", "deny", "منع"], ["صراح", "explicit", "permit", "اسمح", "يُسمح"]]}]}, {"t": "6.3 ملخص الوحدة 6 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li><b>Firewall<\/b>: نقطة عبور تفرض السياسة. الأنواع: Packet filtering، Stateful، Application gateway، NGFW.<\/li><li><b>المعماريات<\/b>: Private/Public، DMZ للخوادم العامة، ZPF بالمناطق.<\/li><li><b>IDS<\/b> ينبّه من نسخة للحركة، و <b>IPS<\/b> يمنع وهو Inline. <b>HIPS<\/b> على الجهاز و <b>NIPS<\/b> على الشبكة.<\/li><li><b>أجهزة متخصصة<\/b>: Secure Endpoint (AMP)، بوابة ويب، بوابة بريد.<\/li><li><b>ACL<\/b>: First match و Implicit deny، Standard و Extended.<\/li><li><b>SNMP<\/b> (استخدم v3)، <b>NetFlow<\/b> (إحصاءات التدفق)، <b>Port mirroring/SPAN<\/b>، <b>Syslog<\/b> (0 أخطر و 7 أخف)، <b>NTP<\/b> (الوقت الموحد).<\/li><li><b>AAA<\/b>: Authentication، Authorization، Accounting عبر TACACS+ أو RADIUS.<\/li><li><b>VPN<\/b>: Remote-access و Site-to-site.<\/li><\/ul>", "q": {"k": "mc", "q": "أي ثلاثي يمنح المحلل «رؤية» لما يجري في الشبكة؟", "e": "السجلات، وإحصاءات التدفق، ونسخ الحركة للتحليل هي مصادر الرؤية الأساسية.", "o": ["DHCP و ARP و DNS", "Syslog و NetFlow و Port mirroring", "WEP و TKIP و WPS"], "a": 1}}], "test": []}, {"t": "اختبار الوحدة 6", "kind": "exam", "pool": [6], "n": 10}]}, {"n": "C1", "t": "Checkpoint Exam: Network Security", "secs": [{"t": "Checkpoint Exam 1 (الوحدات 1 إلى 6)", "kind": "exam", "pool": [0, 1, 2, 3, 4, 5, 6], "n": 25}]}, {"n": "7", "t": "الوحدة 7: The Windows Operating System", "secs": [{"t": "7.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>Windows هو النظام الأكثر انتشاراً على حواسيب الموظفين، ولذلك هو الأكثر استهدافاً. لا تستطيع حماية نظام أو التحقيق فيه دون أن تعرف كيف يعمل من الداخل.<\/p><p>ستتعلم:<\/p><ul><li><b>تاريخه<\/b>: من DOS إلى Windows 11، ولماذا يهم ذلك أمنياً.<\/li><li><b>معماريته<\/b>: الـ Kernel، أنظمة الملفات، الإقلاع، الـ Processes، الـ Registry.<\/li><li><b>إعداده ومراقبته<\/b>: الحسابات، PowerShell، Task Manager، أدوات الشبكة.<\/li><li><b>أمنه<\/b>: <code dir=\"ltr\">netstat<\/code>، Event Viewer، التحديثات، السياسات، Defender، والـ Firewall.<\/li><\/ul><p>الأوامر في هذه الوحدة جرّبها على حاسوبك أو داخل VM.<\/p>", "q": {"k": "tf", "q": "معرفة معمارية نظام التشغيل شرط لاكتشاف النشاط غير الطبيعي فيه.", "e": "لا يُعرف الشاذ إلا بمعرفة الطبيعي: أي Processes تعمل عادةً، وأين تُحفظ الإعدادات، وكيف يقلع النظام.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": []}, {"t": "7.1 Windows History", "kind": "lesson", "cs": [{"t": "Disk Operating System", "b": "<p><b>DOS<\/b> (Disk Operating System) نظام تشغيل بدائي يدير القرص: إنشاء ملفات وقراءتها وحذفها. <b>MS-DOS<\/b> من Microsoft (1981) كان يعمل بواجهة أوامر نصية فقط (<b>CLI<\/b>): تكتب الأمر فينفَّذ.<\/p><p>النسخ الأولى من Windows لم تكن نظاماً كاملاً؛ كانت واجهة رسومية تعمل <b>فوق<\/b> MS-DOS، و DOS هو المتحكم في العتاد.<\/p><p>لماذا يهمنا اليوم؟ كثير من أوامر DOS ما زالت تعمل في نافذة <b>Command Prompt<\/b> (<code dir=\"ltr\">cmd.exe<\/code>):<\/p><div class=\"tw\"><table><tr><th>الأمر<\/th><th>وظيفته<\/th><\/tr><tr><td><code dir=\"ltr\">dir<\/code><\/td><td>عرض محتويات المجلد<\/td><\/tr><tr><td><code dir=\"ltr\">cd<\/code><\/td><td>تغيير المجلد<\/td><\/tr><tr><td><code dir=\"ltr\">copy<\/code> / <code dir=\"ltr\">del<\/code> / <code dir=\"ltr\">ren<\/code><\/td><td>نسخ / حذف / إعادة تسمية<\/td><\/tr><tr><td><code dir=\"ltr\">cls<\/code><\/td><td>مسح الشاشة<\/td><\/tr><tr><td><code dir=\"ltr\">type<\/code><\/td><td>عرض محتوى ملف نصي<\/td><\/tr><\/table><\/div>", "q": {"k": "mc", "q": "ما الأمر الذي يعرض محتويات المجلد الحالي في Command Prompt؟", "e": "<code dir=\"ltr\">dir<\/code> من تراث DOS. الأمر <code dir=\"ltr\">ls<\/code> خاص بـ Linux (ويعمل في PowerShell كاسم مستعار).", "o": ["ls", "dir", "show"], "a": 1}}, {"t": "Windows Versions", "b": "<p>بدءاً من <b>Windows NT<\/b> (1993) صار Windows نظاماً مستقلاً عن DOS، بميزات أمنية أساسية: تعدد المستخدمين، صلاحيات الملفات، ومعمارية 32 ثم 64 بت. كل النسخ الحديثة مبنية على NT.<\/p><div class=\"tw\"><table><tr><th>النسخة<\/th><th>السنة<\/th><th>الوضع اليوم<\/th><\/tr><tr><td>Windows XP<\/td><td>2001<\/td><td>انتهى الدعم 2014<\/td><\/tr><tr><td>Windows 7<\/td><td>2009<\/td><td>انتهى الدعم 2020<\/td><\/tr><tr><td>Windows 8 / 8.1<\/td><td>2012 / 2013<\/td><td>انتهى الدعم 2023<\/td><\/tr><tr><td>Windows 10<\/td><td>2015<\/td><td>انتهى الدعم العادي في أكتوبر 2025<\/td><\/tr><tr><td>Windows 11<\/td><td>2021<\/td><td>النسخة الحالية<\/td><\/tr><tr><td>Windows Server<\/td><td>2016 / 2019 / 2022 / 2025<\/td><td>نسخ الخوادم<\/td><\/tr><\/table><\/div><p>64 بت تعني عنونة ذاكرة أكبر بكثير نظرياً: <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>2<\/mn><mrow><mn>64<\/mn><\/mrow><\/msup><\/mrow><\/math> عنواناً مقابل <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>2<\/mn><mrow><mn>32<\/mn><\/mrow><\/msup><\/mrow><\/math> (أي 4 GB) في 32 بت.<\/p><p>أمنياً: النسخة التي <b>انتهى دعمها<\/b> لا تستقبل تحديثات أمنية، وكل ثغرة تُكتشف فيها تبقى مفتوحة. وجودها على الشبكة خطر يجب توثيقه وعزله.<\/p>", "q": {"k": "mc", "q": "وجدت في جرد الأجهزة حاسوباً يعمل بـ Windows 7 موصولاً بالشبكة الداخلية. ما المشكلة؟", "e": "End-of-Life يعني لا Patches. يجب ترقيته أو عزله في شبكة منفصلة.", "o": ["لا مشكلة ما دام يعمل", "نظام منتهي الدعم لا يستقبل تحديثات أمنية، فثغراته تبقى مفتوحة", "لأنه 64 بت"], "a": 1}}, {"t": "Windows GUI", "b": "<p><b>GUI<\/b> (Graphical User Interface) هي الواجهة الرسومية: نوافذ وأيقونات وقوائم بدل الأوامر النصية. عناصرها الرئيسية:<\/p><ul><li><b>Desktop<\/b>: سطح المكتب، وفيه الأيقونات.<\/li><li><b>Taskbar<\/b>: شريط المهام، وفيه:<\/li><li><b>Start menu<\/b>: للوصول للبرامج والإعدادات والبحث.<\/li><li><b>Quick launch / pinned items<\/b>: برامج مثبتة.<\/li><li><b>Notification area<\/b>: أيقونات الخلفية والساعة.<\/li><li><b>File Explorer<\/b>: متصفح الملفات.<\/li><li><b>Context menu<\/b>: القائمة التي تظهر بالنقر بالزر الأيمن، وتتغير بحسب العنصر.<\/li><\/ul><p>الـ GUI سهّلت الاستخدام، لكن المحلل يحتاج الـ CLI أيضاً: هي أسرع، وقابلة للأتمتة، وتعمل عن بعد حين لا توجد شاشة.<\/p>", "q": {"k": "mc", "q": "لماذا يحتاج محلل الأمن إلى الـ CLI مع وجود GUI؟", "e": "أتمتة المهام وتنفيذها على عشرات الأجهزة عن بعد يتم بالأوامر والـ Scripts.", "o": ["لأن الـ GUI لا تعرض الملفات", "لأنها أسرع وقابلة للأتمتة وتعمل عن بعد", "لأنها أجمل شكلاً"], "a": 1}}, {"t": "Operating System Vulnerabilities", "b": "<p>كل نظام تشغيل فيه ملايين أسطر الكود، ففيه ثغرات حتماً. توصيات أساسية لتأمين Windows:<\/p><ul><li><b>Virus or malware protection<\/b>: Microsoft Defender مفعّل افتراضياً. لا تعطله.<\/li><li><b>Unknown or unmanaged services<\/b>: خدمات تعمل دون علم المدير. عطّل ما لا يلزم.<\/li><li><b>Encryption<\/b>: بيانات غير مشفرة تُقرأ بسهولة إن سُرق الجهاز.<\/li><li><b>Security policy<\/b>: سياسة واضحة تطبَّق على الكل.<\/li><li><b>Firewall<\/b>: مفعّل ومضبوط.<\/li><li><b>File and share permissions<\/b>: لا تعطِ مجموعة «Everyone» صلاحية كاملة.<\/li><li><b>Weak or no password<\/b>: كلمات قوية للجميع.<\/li><li><b>Login as Administrator<\/b>: اعمل بحساب عادي (<b>Standard user<\/b>) واستخدم صلاحية المدير فقط عند الحاجة.<\/li><\/ul><p>البند الأخير تطبيق لـ Least Privilege: إن أُصيب حساب عادي بـ Malware ورث الـ Malware صلاحيات محدودة.<\/p>", "q": {"k": "mc", "q": "لماذا يُنصح بالعمل اليومي بحساب Standard user؟", "e": "البرنامج الخبيث يرث صلاحيات المستخدم الذي شغّله. صلاحيات أقل تعني ضرراً أقل.", "o": ["لأنه أسرع", "لأن أي Malware يصيبه يعمل بصلاحيات محدودة فيقل ضرره", "لأن حساب المدير لا يفتح المتصفح"], "a": 1}}], "test": [{"k": "mc", "q": "أي ممارسة تخالف Least Privilege في Windows؟", "e": "هذه الصلاحية تمنح كل مستخدم وكل برنامج قراءة وتعديل وحذف ما لا يحتاجه.", "o": ["تعطيل الخدمات غير اللازمة", "منح مجموعة Everyone صلاحية Full Control على مجلد الرواتب", "تفعيل الـ Firewall"], "a": 1}, {"k": "tf", "q": "كل نسخ Windows منذ Windows NT تعمل كواجهة فوق MS-DOS.", "e": "العكس: NT أول نسخة مستقلة عن DOS، وكل ما بعدها مبني عليها. النسخ الأقدم هي التي كانت فوق DOS.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "7.2 Windows Architecture and Operations", "kind": "lesson", "cs": [{"t": "Hardware Abstraction Layer", "b": "<p><b>HAL<\/b> (Hardware Abstraction Layer) طبقة برمجية تقف بين العتاد وبقية نظام التشغيل. وظيفتها إخفاء اختلافات العتاد: نظام التشغيل يكلّم الـ HAL بلغة واحدة، والـ HAL يترجم لكل قطعة عتاد بلغتها.<\/p><p>الفائدة: يعمل Windows نفسه على أجهزة من مصانع مختلفة دون إعادة كتابته.<\/p><p>البنية من الأسفل للأعلى:<\/p><ul><li>العتاد (Hardware).<\/li><li>الـ HAL.<\/li><li>الـ <b>Kernel<\/b>: نواة النظام، تدير المعالج والذاكرة والإدخال والإخراج.<\/li><li>خدمات النظام والتطبيقات.<\/li><\/ul><p>الـ Kernel يتحكم في كل شيء، ولذلك هو الهدف الأثمن للـ Rootkits.<\/p>", "q": {"k": "mc", "q": "ما وظيفة الـ HAL؟", "e": "الـ HAL وسيط يوحّد التعامل مع العتاد، فيعمل النظام على أجهزة متنوعة.", "o": ["تشفير القرص", "عزل نظام التشغيل عن تفاصيل العتاد المختلفة", "عرض سطح المكتب"], "a": 1}}, {"t": "User Mode and Kernel Mode", "b": "<p>المعالج في Windows يعمل في وضعين:<\/p><ul><li><b>Kernel mode<\/b>: وصول <b>كامل<\/b> للعتاد والذاكرة كلها. يعمل فيه نظام التشغيل وتعريفات الأجهزة (<b>Drivers<\/b>). خطأ هنا يُسقط النظام كله (الشاشة الزرقاء).<\/li><li><b>User mode<\/b>: وصول <b>محدود<\/b>. تعمل فيه التطبيقات. كل تطبيق له مساحة ذاكرة خاصة لا يرى منها غيره، ولا يلمس العتاد مباشرة؛ يطلب من الـ Kernel عبر واجهات محددة (<b>System calls<\/b>). إن انهار تطبيق لم يتأثر غيره.<\/li><\/ul><p>الانتقال بين الوضعين يتم عند كل طلب خدمة من النظام.<\/p><p>أمنياً: الفصل يمنع برنامجاً عادياً من العبث بالنظام. لذلك يسعى الـ Malware المتقدم للوصول إلى Kernel mode، غالباً عبر Driver خبيث أو فيه ثغرة.<\/p>", "q": {"k": "mc", "q": "متصفح الويب انهار لكن بقية البرامج تعمل. ما الذي حمى النظام؟", "e": "عزل تطبيقات User mode عن بعضها وعن الـ Kernel يحصر أثر الانهيار.", "o": ["الـ Firewall", "أن المتصفح يعمل في User mode بمساحة ذاكرة معزولة", "أن المتصفح يعمل في Kernel mode"], "a": 1}}, {"t": "Windows File Systems", "b": "<p><b>File system<\/b> هو الطريقة التي تُنظَّم بها الملفات على وسيط التخزين.<\/p><ul><li><b>exFAT<\/b>: بسيط، تدعمه أنظمة كثيرة، مناسب لوسائط USB. لا صلاحيات فيه.<\/li><li><b>FAT32<\/b>: أقدم، وحجم الملف الأقصى فيه 4 GB.<\/li><li><b>NTFS<\/b> (New Technology File System): نظام Windows الأساسي. مزاياه: ملفات وأقسام ضخمة، <b>صلاحيات<\/b> على الملفات والمجلدات (ACLs)، تشفير (EFS)، ضغط، وسجل تغييرات (<b>Journaling<\/b>) يسهّل التعافي بعد انقطاع مفاجئ.<\/li><li><b>HFS+<\/b> و <b>APFS<\/b>: لأنظمة Apple. <b>EXT<\/b>: لـ Linux. Windows لا يكتب عليها دون برامج إضافية.<\/li><\/ul><p>بنية قسم NTFS:<\/p><ul><li><b>Partition Boot Sector<\/b>: أول القسم، فيه موقع الـ MFT وكود الإقلاع.<\/li><li><b>MFT<\/b> (Master File Table): جدول فيه سجل لكل ملف: اسمه، موقعه، صلاحياته، وطوابعه الزمنية.<\/li><li><b>System files<\/b> ثم <b>File area<\/b> حيث البيانات.<\/li><\/ul><p>طوابع الـ MFT الزمنية (الإنشاء، التعديل، الوصول، تغيير السجل) دليل مهم في التحقيق الجنائي الرقمي.<\/p>", "q": {"k": "mc", "q": "لماذا يُفضَّل NTFS على FAT32 لقرص النظام؟", "e": "الصلاحيات والتشفير والـ Journaling ميزات أمن وموثوقية لا يملكها FAT32.", "o": ["لأنه يعمل على الكاميرات", "لأنه يدعم الصلاحيات والتشفير وسجل التغييرات", "لأنه أقدم"], "a": 1}}, {"t": "Alternate Data Streams", "b": "<p>في NTFS يتكون الملف من «تيارات» بيانات (Streams). المحتوى العادي يُحفظ في التيار الافتراضي. لكن NTFS يسمح بإلحاق تيارات إضافية بالملف نفسه تسمى <b>ADS<\/b> (Alternate Data Streams)، وتكتب بالصيغة <code dir=\"ltr\">filename:streamname<\/code>.<\/p><p>خصائصها:<\/p><ul><li>لا تظهر في File Explorer ولا في <code dir=\"ltr\">dir<\/code> العادي.<\/li><li>لا تغيّر حجم الملف الظاهر.<\/li><\/ul><p>لها استخدامات مشروعة: Windows يحفظ في تيار اسمه <code dir=\"ltr\">Zone.Identifier<\/code> أن الملف نُزّل من الإنترنت، فيحذرك عند فتحه.<\/p><p>الخطر: المهاجم يستطيع إخفاء بيانات أو كود داخل ADS ملحق بملف بريء.<\/p><p>الكشف: الأمر <code dir=\"ltr\">dir /r<\/code> يعرض التيارات، ومثله <code dir=\"ltr\">Get-Item -Stream *<\/code> في PowerShell.<\/p>", "q": {"k": "mc", "q": "أي أمر يكشف وجود Alternate Data Streams في مجلد؟", "e": "الخيار <code dir=\"ltr\">/r<\/code> يجعل <code dir=\"ltr\">dir<\/code> يعرض التيارات البديلة التي لا تظهر عادةً.", "o": ["dir", "dir /r", "cls"], "a": 1}}, {"t": "Windows Boot Process", "b": "<p>الإقلاع هو ما يجري من ضغط زر التشغيل حتى ظهور شاشة الدخول. نوعان من البرامج الثابتة (Firmware) يبدآنه:<\/p><ul><li><b>BIOS<\/b> (قديم): يفحص العتاد (<b>POST<\/b>)، ثم يقرأ <b>MBR<\/b> (Master Boot Record) من أول القرص، وفيه كود صغير يجد قسم النظام ويحمّل الـ <b>Boot Manager<\/b>.<\/li><li><b>UEFI<\/b> (حديث): يحمّل برامج إقلاع بصيغة EFI من قسم خاص اسمه <b>ESP<\/b> (EFI System Partition). يدعم <b>Secure Boot<\/b> الذي يتحقق من التوقيع الرقمي لكل ما يُحمَّل.<\/li><\/ul><p>بعدها في الحالتين:<\/p><ul><li><code dir=\"ltr\">bootmgr<\/code> يقرأ قاعدة إعدادات الإقلاع <b>BCD<\/b>.<\/li><li><code dir=\"ltr\">winload.exe<\/code> يحمّل الـ Kernel (<code dir=\"ltr\">ntoskrnl.exe<\/code>) والـ HAL والـ Drivers الأساسية.<\/li><li>الـ Kernel يشغّل مدير الجلسات <code dir=\"ltr\">smss.exe<\/code>، الذي يبدأ <code dir=\"ltr\">winlogon.exe<\/code> فتظهر شاشة الدخول.<\/li><\/ul><p>أمنياً: Malware يصيب مرحلة الإقلاع (<b>Bootkit<\/b>) يعمل قبل برامج الحماية. Secure Boot دفاع أساسي ضده.<\/p>", "q": {"k": "mc", "q": "ما الميزة الأمنية التي يضيفها UEFI على BIOS؟", "e": "Secure Boot يرفض تحميل كود إقلاع غير موقَّع، فيمنع الـ Bootkits.", "o": ["إقلاع أسرع فقط", "Secure Boot الذي يتحقق من توقيع برامج الإقلاع", "دعم لوحة المفاتيح"], "a": 1}}, {"t": "Windows Startup and Shutdown", "b": "<p><b>Startup<\/b>: بعد الإقلاع تُشغَّل البرامج والخدمات تلقائياً من مواضع محددة، أهمها مفاتيح الـ Registry:<\/p><pre dir=\"ltr\"><code>HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\nHKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce\nHKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run<\/code><\/pre><p>مفاتيح <code dir=\"ltr\">HKEY_LOCAL_MACHINE<\/code> تعمل لكل المستخدمين، و <code dir=\"ltr\">HKEY_CURRENT_USER<\/code> للمستخدم الحالي. ومعها الخدمات (Services) والمهام المجدولة (Scheduled Tasks) ومجلد Startup.<\/p><p>هذه المواضع أول ما يفحصه المحلل، لأن الـ Malware يسجّل نفسه فيها ليعمل بعد كل إعادة تشغيل. يسمى ذلك <b>Persistence<\/b>. الأدوات: تبويب Startup في Task Manager، وأداة <code dir=\"ltr\">msconfig<\/code>.<\/p><p><b>Shutdown<\/b>: الإغلاق السليم يغلق البرامج ثم الخدمات بالترتيب ويحفظ البيانات. الخيارات: <b>Shutdown<\/b>، <b>Restart<\/b>، <b>Sleep<\/b> (حفظ الحالة في الذاكرة)، <b>Hibernate<\/b> (حفظها على القرص). قطع الكهرباء المفاجئ قد يتلف ملفات مفتوحة.<\/p>", "q": {"k": "mc", "q": "وجدت في مفتاح <code dir=\"ltr\">Run<\/code> إدخالاً يشغّل ملفاً باسم عشوائي من مجلد مؤقت. ماذا يُحتمل أن يكون؟", "e": "تسجيل ملف مشبوه ليعمل عند كل إقلاع أسلوب شائع ليبقى الـ Malware بعد إعادة التشغيل.", "o": ["تحديث Windows عادي", "آلية Persistence لبرنامج خبيث", "إعداد لغة لوحة المفاتيح"], "a": 1}}, {"t": "Processes, Threads, and Services", "b": "<ul><li><b>Process<\/b>: برنامج في حالة تشغيل. له مساحة ذاكرة خاصة ورقم تعريف <b>PID<\/b>.<\/li><li><b>Thread<\/b>: مسار تنفيذ داخل الـ Process. الـ Process الواحد فيه Thread أو أكثر تتشارك ذاكرته وتعمل بالتوازي. المتصفح مثلاً يخصص Thread للعرض وآخر للتحميل.<\/li><li><b>Service<\/b>: برنامج يعمل في الخلفية دون واجهة، يبدأ غالباً مع النظام ولا يحتاج لدخول مستخدم. مثل خدمة الطباعة أو التحديث. تُدار من أداة <code dir=\"ltr\">services.msc<\/code>.<\/li><\/ul><p>علاقات مهمة: كل Process (ما عدا الأول) له <b>Parent process<\/b> أنشأه. هذه العلاقة دليل ثمين: <code dir=\"ltr\">winword.exe<\/code> الذي يشغّل <code dir=\"ltr\">powershell.exe<\/code> سلوك غير معتاد ويستحق التحقيق.<\/p><p>المشاهدة: Task Manager، أو الأمر <code dir=\"ltr\">tasklist<\/code>. والإنهاء: <code dir=\"ltr\">taskkill /PID 1234<\/code>.<\/p>", "q": {"k": "mc", "q": "ما الفرق بين Process و Thread؟", "e": "الـ Process هو الحاوية، والـ Threads وحدات التنفيذ داخلها.", "o": ["لا فرق", "الـ Process برنامج يعمل بذاكرته الخاصة، والـ Thread مسار تنفيذ داخله يشاركه الذاكرة", "الـ Thread أكبر من الـ Process"], "a": 1}}, {"t": "Memory Allocation and Handles", "b": "<ul><li><b>Virtual address space<\/b>: كل Process يرى مساحة عناوين افتراضية خاصة به، كأن الذاكرة كلها له. النظام يترجمها إلى الذاكرة الفعلية (RAM)، وما لا يتسع ينقله مؤقتاً إلى ملف على القرص (<b>Page file<\/b>). في نظام 32 بت هذه المساحة 4 GB لكل Process.<\/li><li>العزل: Process لا يقرأ ذاكرة Process آخر في User mode. هذا يحمي كلمات السر في ذاكرة برنامج من برنامج آخر.<\/li><li><b>Handle<\/b>: الـ Process في User mode لا يصل مباشرة لموارد النظام (ملف، مفتاح Registry، Process آخر). يطلب من الـ Kernel فيعطيه «مقبضاً»، أي رقماً يمثل المورد ويستخدمه في طلباته التالية.<\/li><\/ul><p>أداة <b>RAMMap<\/b> من حزمة Sysinternals تعرض توزيع الذاكرة. و Malware من نوع <b>Fileless<\/b> يعيش في الذاكرة فقط ولا يكتب ملفاً على القرص، فيصعب كشفه بفحص الملفات.<\/p>", "q": {"k": "tf", "q": "الـ Process في User mode يصل إلى ملفات النظام مباشرة دون وساطة الـ Kernel.", "e": "يطلب من الـ Kernel فيحصل على Handle يمثل المورد. هذه الوساطة تفرض الصلاحيات.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "The Windows Registry", "b": "<p><b>Registry<\/b> قاعدة بيانات هرمية تحفظ فيها Windows كل إعداداتها: العتاد، البرامج، المستخدمين، وخيارات النظام. بنيتها: <b>Hives<\/b> (خلايا) فيها <b>Keys<\/b> (مفاتيح كالمجلدات) و <b>Subkeys<\/b>، وفي المفاتيح <b>Values<\/b> (قيم).<\/p><p>الخلايا الخمس الرئيسية:<\/p><div class=\"tw\"><table><tr><th>Hive<\/th><th>ما فيها<\/th><\/tr><tr><td>HKEY_CURRENT_USER (HKCU)<\/td><td>إعدادات المستخدم الداخل حالياً<\/td><\/tr><tr><td>HKEY_USERS (HKU)<\/td><td>إعدادات كل حسابات المستخدمين على الجهاز<\/td><\/tr><tr><td>HKEY_CLASSES_ROOT (HKCR)<\/td><td>ارتباط امتدادات الملفات بالبرامج (OLE)<\/td><\/tr><tr><td>HKEY_LOCAL_MACHINE (HKLM)<\/td><td>إعدادات الجهاز والنظام لكل المستخدمين<\/td><\/tr><tr><td>HKEY_CURRENT_CONFIG (HKCC)<\/td><td>ملف تعريف العتاد الحالي<\/td><\/tr><\/table><\/div><p>التحرير بأداة <code dir=\"ltr\">regedit.exe<\/code>. تعديل خاطئ قد يمنع النظام من الإقلاع، فخذ نسخة قبل أي تغيير.<\/p><p>للمحلل: الـ Registry مخزن أدلة: البرامج المثبتة، وسائط USB التي وُصلت، برامج بدء التشغيل، وآخر الملفات المفتوحة.<\/p>", "q": {"k": "mc", "q": "في أي Hive تبحث عن برنامج يُشغَّل تلقائياً لكل المستخدمين عند الإقلاع؟", "e": "HKLM تحمل إعدادات الجهاز لكل المستخدمين، ومنها مفتاح Run العام.", "o": ["HKEY_CURRENT_USER", "HKEY_LOCAL_MACHINE", "HKEY_CLASSES_ROOT"], "a": 1}}, {"t": "تمرين: Exploring Processes, Threads, Handles, and Registry", "b": "<p>بديل Lab 7.2.11. الـ Lab الأصلي يستخدم أدوات <b>Sysinternals<\/b> المجانية من Microsoft: <b>Process Explorer<\/b> (Task Manager متقدم يعرض شجرة الأب والابن والـ Handles)، و <b>TCPView<\/b> (الاتصالات لكل Process).<\/p><p>دون تنزيل شيء، نفّذ في Command Prompt:<\/p><pre dir=\"ltr\"><code>tasklist /svc\ntasklist /fi &quot;imagename eq svchost.exe&quot;\nreg query HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\nreg query HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run<\/code><\/pre><p>الأمر الأول يعرض كل Process والخدمات التي يستضيفها. ستجد نسخاً كثيرة من <code dir=\"ltr\">svchost.exe<\/code>: هذا طبيعي، فهو حاوية تشغّل خدمات النظام. لكن <code dir=\"ltr\">svchost.exe<\/code> الشرعي يعمل من مجلد <code dir=\"ltr\">C:\\Windows\\System32<\/code> فقط.<\/p><p>الأمران الأخيران يعرضان برامج بدء التشغيل. اكتب ما تجده واسأل عن كل إدخال: هل أعرفه؟<\/p>", "q": {"k": "mc", "q": "وجدت Process اسمه <code dir=\"ltr\">svchost.exe<\/code> يعمل من <code dir=\"ltr\">C:\\Users\\Public\\Downloads<\/code>. ما تقييمك؟", "e": "انتحال أسماء ملفات النظام من مسار غير مساره حيلة شائعة. المسار الكامل أهم من الاسم.", "o": ["طبيعي، فهو ملف نظام", "مشبوه جداً: الشرعي يعمل من System32، وهذا على الأرجح Malware ينتحل الاسم", "يدل على نقص الذاكرة"], "a": 1}}], "test": [{"k": "mc", "q": "Malware يريد البقاء بعد إعادة التشغيل والاختباء من File Explorer. أي تقنيتين من هذا القسم قد يستخدم؟", "e": "مفتاح Run يمنحه Persistence، والـ ADS تخفي بياناته عن العرض العادي.", "o": ["مفتاح Run في الـ Registry، و Alternate Data Streams", "Hibernate و Sleep", "POST و HAL"], "a": 0}, {"k": "mc", "q": "ما الترتيب الصحيح في إقلاع Windows؟", "e": "الـ Firmware يسلّم لمدير الإقلاع، الذي يحمّل الـ Kernel عبر winload، ثم تبدأ جلسة الدخول.", "o": ["winlogon ثم bootmgr ثم ntoskrnl", "Firmware (BIOS/UEFI) ثم bootmgr ثم winload ثم ntoskrnl ثم winlogon", "ntoskrnl ثم Firmware ثم bootmgr"], "a": 1}, {"k": "sa", "q": "لماذا يُعد الفصل بين User mode و Kernel mode ميزة أمنية؟", "e": "لأن التطبيقات في User mode معزولة ومحدودة الوصول، فلا تلمس العتاد ولا ذاكرة النظام مباشرة. خطأ أو كود خبيث فيها لا يسيطر على النظام إلا إن وجد طريقاً إلى Kernel mode.", "kw": [["عزل", "حماي", "محدود", "منع", "يمنع", "isolat", "restrict"]]}]}, {"t": "7.3 Windows Configuration and Monitoring", "kind": "lesson", "cs": [{"t": "Run as Administrator", "b": "<p>حتى لو كان حسابك من مجموعة المديرين، Windows يشغّل برامجك بصلاحيات عادية. حين يحتاج برنامج صلاحيات أعلى يظهر مربع <b>UAC<\/b> (User Account Control) يطلب موافقتك أو كلمة سر مدير.<\/p><p>لتشغيل برنامج بصلاحيات المدير:<\/p><ul><li>انقر بالزر الأيمن واختر <b>Run as administrator<\/b>.<\/li><li>أو ابحث عن <code dir=\"ltr\">cmd<\/code> ثم اختر Run as administrator، فتُفتح نافذة أوامر مرفوعة الصلاحيات (<b>Elevated<\/b>).<\/li><\/ul><p>لماذا هذا التصميم؟ هو Least Privilege مطبقاً: الصلاحية العالية تُمنح للمهمة الواحدة ثم تزول. إن ظهر مربع UAC وأنت لم تطلب شيئاً يحتاج صلاحيات، فذلك إنذار: برنامج يحاول رفع صلاحياته.<\/p>", "q": {"k": "mc", "q": "ظهر مربع UAC فجأة وأنت تقرأ مستنداً فقط. ما التصرف الصحيح؟", "e": "طلب رفع صلاحيات لم تبدأه أنت قد يكون Malware. الرفض ثم التحقيق.", "o": ["الضغط على Yes ليختفي", "الضغط على No والتحقق من البرنامج الذي طلب الصلاحية", "إعادة تشغيل الشاشة"], "a": 1}}, {"t": "Local Users and Domains", "b": "<ul><li><b>Local user<\/b>: حساب محفوظ على الجهاز نفسه وصالح عليه فقط. يُدار من أداة <code dir=\"ltr\">lusrmgr.msc<\/code>. Windows ينشئ حسابين مبدئيين: <b>Administrator<\/b> و <b>Guest<\/b>، وكلاهما معطل افتراضياً. اتركهما معطلين.<\/li><li><b>Group<\/b>: مجموعة حسابات تُمنح الصلاحيات لها دفعة واحدة بدل كل حساب منفرداً، مثل Administrators و Users.<\/li><li><b>Domain<\/b>: في المؤسسات تُجمع الأجهزة والحسابات في نطاق تديره خوادم <b>Domain Controllers<\/b> عبر خدمة <b>Active Directory<\/b>. الحساب يُنشأ مرة واحدة مركزياً ويصلح على كل أجهزة النطاق، والسياسات (<b>Group Policy<\/b>) تُفرض على الجميع من مكان واحد.<\/li><\/ul><p>أمنياً: اختراق حساب <b>Domain Admin<\/b> يعني السيطرة على المؤسسة كلها، فهو أثمن ما يحميه المدافعون.<\/p>", "q": {"k": "mc", "q": "ما فائدة الـ Domain مقارنةً بالحسابات المحلية في شركة فيها 500 حاسوب؟", "e": "حساب واحد وسياسة واحدة تطبَّق على كل الأجهزة من الـ Domain Controller.", "o": ["لا فائدة", "إدارة مركزية للحسابات والسياسات بدل ضبط كل جهاز منفرداً", "تسريع المعالج"], "a": 1}}, {"t": "CLI and PowerShell", "b": "<p>Windows فيه واجهتا أوامر:<\/p><ul><li><b>Command Prompt<\/b> (<code dir=\"ltr\">cmd.exe<\/code>): القديمة، بأوامر DOS.<\/li><li><b>PowerShell<\/b>: الحديثة والأقوى. أنواع ما تنفذه:<\/li><li><b>Cmdlets<\/b>: أوامر بصيغة «فعل-اسم»، مثل <code dir=\"ltr\">Get-Process<\/code> و <code dir=\"ltr\">Stop-Service<\/code>.<\/li><li><b>PowerShell scripts<\/b>: ملفات بامتداد <code dir=\"ltr\">.ps1<\/code> فيها سلسلة أوامر.<\/li><li><b>PowerShell functions<\/b>: قطع كود يُشار إليها باسم.<\/li><\/ul><p>أوامر تستكشف بها:<\/p><pre dir=\"ltr\"><code>Get-Help Get-Process\nGet-Command *service*\nGet-Process | Sort-Object CPU -Descending | Select-Object -First 5\nGet-Service | Where-Object Status -eq &#x27;Running&#x27;<\/code><\/pre><p>الفرق الجوهري: PowerShell يمرر بين الأوامر <b>كائنات<\/b> (Objects) لها خصائص، وليس نصاً. لذلك تفرز وتفلتر بسهولة.<\/p><p>أمنياً: قوة PowerShell تجعله أداة مفضلة للمهاجمين أيضاً (هجمات <b>Living off the Land<\/b> تستخدم أدوات النظام نفسها). سجل تنفيذ PowerShell مصدر مهم للمحلل.<\/p>", "q": {"k": "mc", "q": "أي صيغة تتبعها الـ Cmdlets في PowerShell؟", "e": "Verb-Noun: الفعل أولاً (Get، Set، Stop، Start) ثم ما يقع عليه.", "o": ["اسم-فعل مثل Process-Get", "فعل-اسم مثل Get-Process", "أرقام فقط"], "a": 1}}, {"t": "Windows Management Instrumentation", "b": "<p><b>WMI<\/b> (Windows Management Instrumentation) بنية تتيح الاستعلام عن معلومات الحاسوب وإدارته، محلياً وعن بعد: العتاد، نظام التشغيل، الـ Processes، الخدمات، الأقراص، وإعدادات الأمن. تُفتح لوحتها بأداة <code dir=\"ltr\">wmimgmt.msc<\/code>.<\/p><p>الاستعلام اليوم يتم عبر PowerShell:<\/p><pre dir=\"ltr\"><code>Get-CimInstance Win32_OperatingSystem\nGet-CimInstance Win32_Process | Select-Object Name, ProcessId<\/code><\/pre><p>الأمر القديم <code dir=\"ltr\">wmic<\/code> مهمَل (Deprecated) وأُزيل من النسخ الحديثة، وبديله <code dir=\"ltr\">Get-CimInstance<\/code>.<\/p><p>أمنياً: لأن WMI يعمل عن بعد وينفذ أوامر، يستخدمه المهاجمون للتحرك بين الأجهزة (Lateral movement) ولزرع Persistence عبر «اشتراكات أحداث» لا تظهر في مواضع بدء التشغيل المعتادة. وصول WMI عن بعد يجب أن يُحصر في المديرين.<\/p>", "q": {"k": "mc", "q": "ما البديل الحديث للأمر <code dir=\"ltr\">wmic<\/code>؟", "e": "<code dir=\"ltr\">wmic<\/code> مهمَل، والاستعلام عن WMI يتم اليوم بـ Get-CimInstance.", "o": ["dir /r", "Get-CimInstance في PowerShell", "msconfig"], "a": 1}}, {"t": "The net Command", "b": "<p><code dir=\"ltr\">net<\/code> أمر قديم متعدد الوظائف لإدارة النظام وصيانته. يتبعه أمر فرعي:<\/p><div class=\"tw\"><table><tr><th>الأمر<\/th><th>وظيفته<\/th><\/tr><tr><td><code dir=\"ltr\">net user<\/code><\/td><td>عرض حسابات المستخدمين أو إنشاؤها أو تعديلها<\/td><\/tr><tr><td><code dir=\"ltr\">net localgroup<\/code><\/td><td>عرض المجموعات المحلية وأعضائها<\/td><\/tr><tr><td><code dir=\"ltr\">net accounts<\/code><\/td><td>سياسة كلمات السر والدخول<\/td><\/tr><tr><td><code dir=\"ltr\">net session<\/code><\/td><td>الجلسات المفتوحة مع أجهزة أخرى<\/td><\/tr><tr><td><code dir=\"ltr\">net share<\/code><\/td><td>المجلدات المشاركة على الشبكة<\/td><\/tr><tr><td><code dir=\"ltr\">net use<\/code><\/td><td>الاتصال بمجلد مشارك أو قطعه<\/td><\/tr><tr><td><code dir=\"ltr\">net start<\/code> / <code dir=\"ltr\">net stop<\/code><\/td><td>تشغيل خدمة / إيقافها<\/td><\/tr><tr><td><code dir=\"ltr\">net view<\/code><\/td><td>عرض الأجهزة والمشاركات على الشبكة<\/td><\/tr><\/table><\/div><p>اكتب <code dir=\"ltr\">net help<\/code> لرؤية القائمة كلها.<\/p><p>للمحلل: <code dir=\"ltr\">net user<\/code> و <code dir=\"ltr\">net localgroup administrators<\/code> يكشفان حساباً غريباً أُضيف للمديرين، وهذه علامة اختراق شائعة.<\/p>", "q": {"k": "mc", "q": "تريد التأكد من عدم وجود حساب غير معروف في مجموعة المديرين المحلية. أي أمر؟", "e": "يعرض أعضاء مجموعة Administrators المحلية. حساب لا تعرفه هناك يستدعي التحقيق فوراً.", "o": ["net share", "net localgroup administrators", "net stop"], "a": 1}}, {"t": "Task Manager and Resource Monitor", "b": "<p><b>Task Manager<\/b> (يُفتح بـ <code dir=\"ltr\">Ctrl+Shift+Esc<\/code>) يعرض ما يعمل الآن. تبويباته:<\/p><ul><li><b>Processes<\/b>: البرامج والعمليات واستهلاكها للمعالج والذاكرة والقرص والشبكة.<\/li><li><b>Performance<\/b>: رسوم الاستهلاك اللحظي.<\/li><li><b>App history<\/b>: استهلاك التطبيقات عبر الزمن.<\/li><li><b>Startup<\/b>: برامج بدء التشغيل وتعطيلها.<\/li><li><b>Users<\/b>: المستخدمون الداخلون وما يشغّلونه.<\/li><li><b>Details<\/b>: تفاصيل كل Process: الـ PID، الحالة، الحساب.<\/li><li><b>Services<\/b>: الخدمات وحالتها.<\/li><\/ul><p><b>Resource Monitor<\/b> (<code dir=\"ltr\">resmon<\/code>) أكثر تفصيلاً: يعرض لكل Process الملفات التي يفتحها، والـ Handles، والاتصالات الشبكية والعناوين التي يتصل بها.<\/p><p>للمحلل: Process يستهلك المعالج كله دون سبب، أو يرسل للشبكة باستمرار وأنت لا تستخدمه، يستحق الفحص.<\/p>", "q": {"k": "mc", "q": "أي أداة تعرض العناوين الشبكية التي يتصل بها كل Process؟", "e": "تبويب Network في Resource Monitor يربط كل اتصال بالـ Process صاحبه.", "o": ["Notepad", "Resource Monitor", "File Explorer"], "a": 1}}, {"t": "Networking في Windows", "b": "<p>إعدادات الشبكة تُدار من <b>Network and Sharing Center<\/b> أو من Settings. خصائص بطاقة الشبكة تحدد: عنوان IP، الـ Subnet mask، الـ Default gateway، وخادم DNS، يدوياً أو تلقائياً عبر DHCP.<\/p><p>أوامر التشخيص الأساسية:<\/p><pre dir=\"ltr\"><code>ipconfig /all\nping 8.8.8.8\nnslookup example.com\ntracert example.com<\/code><\/pre><ul><li><code dir=\"ltr\">ipconfig /all<\/code>: إعدادات كل البطاقات مع الـ MAC وخادم DHCP و DNS.<\/li><li><code dir=\"ltr\">ping<\/code>: هل الجهاز الآخر يرد؟<\/li><li><code dir=\"ltr\">nslookup<\/code>: هل يعمل DNS وماذا يعيد؟<\/li><li><code dir=\"ltr\">tracert<\/code>: المسار الذي تسلكه الـ Packets قفزة بقفزة.<\/li><\/ul><p>منهج التشخيص من الأقرب للأبعد: ping لعنوانك، ثم للـ Gateway، ثم لعنوان خارجي، ثم لاسم (لاختبار DNS).<\/p>", "q": {"k": "mc", "q": "<code dir=\"ltr\">ping 8.8.8.8<\/code> ينجح و <code dir=\"ltr\">ping example.com<\/code> يفشل برسالة تعذر إيجاد المضيف. أين الخلل؟", "e": "الوصول لعنوان خارجي يعمل، فالاتصال سليم. الفشل مع الاسم فقط يدل على DNS.", "o": ["كابل الشبكة مقطوع", "ترجمة الأسماء (DNS)", "الـ Default gateway معطل"], "a": 1}}, {"t": "Accessing Network Resources", "b": "<ul><li><b>SMB<\/b> (Server Message Block): بروتوكول Windows لمشاركة الملفات والطابعات، على TCP 445. المورد المشارك يُكتب بصيغة <b>UNC<\/b>: <code dir=\"ltr\">\\\\servername\\sharename\\file<\/code>.<\/li><li><b>Administrative shares<\/b>: مشاركات خفية ينشئها Windows تلقائياً للمديرين، يُختم اسمها بعلامة الدولار، مثل <code dir=\"ltr\">C$<\/code> و <code dir=\"ltr\">ADMIN$<\/code>. يستغلها المهاجم الذي سرق بيانات مدير للتحرك بين الأجهزة.<\/li><li><b>RDP<\/b> (Remote Desktop Protocol): التحكم الرسومي عن بعد، على TCP 3389.<\/li><\/ul><p>أمنياً:<\/p><ul><li>SMBv1 قديم وفيه ثغرات خطيرة استُغلت في أوبئة Ransomware. عطّله.<\/li><li>لا تعرض SMB ولا RDP على الإنترنت مباشرة. RDP المكشوف من أكثر مداخل الـ Ransomware شيوعاً. استخدم VPN و MFA.<\/li><\/ul>", "q": {"k": "mc", "q": "الـ Firewall يُظهر محاولات اتصال من الإنترنت إلى المنفذ 3389 على خادمك. ما الخدمة، وما التوصية؟", "e": "3389 هو RDP. عرضه على الإنترنت يجذب هجمات التخمين والاستغلال.", "o": ["DNS، ولا شيء", "RDP، ويجب حجبه عن الإنترنت وإتاحته عبر VPN مع MFA", "SMTP، وزيادة حجم البريد"], "a": 1}}, {"t": "Windows Server", "b": "<p>حواسيب المستخدمين تعمل بنسخ العميل (Windows 10/11). الخوادم تعمل بـ <b>Windows Server<\/b>، وتقدم خدمات مركزية:<\/p><ul><li><b>Network services<\/b>: DNS، DHCP، Terminal services، Network Controller، Hyper-V للـ Virtualization.<\/li><li><b>File services<\/b>: SMB، NFS، DFS.<\/li><li><b>Web services<\/b>: FTP، HTTP، HTTPS عبر خادم IIS.<\/li><li><b>Management<\/b>: Group Policy، وخدمات <b>Active Directory Domain Services<\/b> التي تدير الحسابات والمصادقة.<\/li><\/ul><p>الخادم يعمل دائماً ويخدم الكثيرين، فأثر اختراقه مضاعف. لذلك يُؤمَّن بصرامة أكبر: لا تصفح ولا بريد عليه، أقل قدر من البرامج والخدمات، تحديثات مجدولة، ومراقبة مستمرة لسجلاته.<\/p>", "q": {"k": "tf", "q": "يصح استخدام خادم Active Directory لتصفح الإنترنت وقراءة البريد لتوفير الأجهزة.", "e": "الخادم الحساس تُقلَّص وظائفه لأدنى حد. التصفح والبريد أكثر قنوات الإصابة، ولا مكان لهما عليه.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "تمارين: حسابات، PowerShell، Task Manager، مراقبة الموارد", "b": "<p>بدائل Labs 7.3.10 إلى 7.3.13. نفّذها في نافذة أوامر مرفوعة الصلاحيات، ويفضَّل داخل VM.<\/p><p>إنشاء حساب تجريبي ثم حذفه:<\/p><pre dir=\"ltr\"><code>net user labuser Str0ng-Pass-2026! /add\nnet localgroup Users\nnet user labuser /active:no\nnet user labuser /delete<\/code><\/pre><p>استكشاف بـ PowerShell:<\/p><pre dir=\"ltr\"><code>Get-Process | Sort-Object WorkingSet -Descending | Select-Object -First 5 Name, Id, WorkingSet\nGet-Service | Where-Object Status -eq &#x27;Stopped&#x27; | Select-Object -First 10\nGet-NetTCPConnection -State Listen | Select-Object LocalPort, OwningProcess<\/code><\/pre><p>ثم افتح Task Manager و Resource Monitor وأجب: أي Process الأكثر استهلاكاً للذاكرة؟ أي Processes تستمع على منافذ؟ هل تعرف كل برنامج في تبويب Startup؟<\/p>", "q": {"k": "mc", "q": "ما الذي يفعله <code dir=\"ltr\">Get-NetTCPConnection -State Listen<\/code>؟", "e": "المنافذ في حالة Listen هي الخدمات المفتوحة على الجهاز، وكل واحدة منها جزء من سطح الهجوم.", "o": ["يحذف الاتصالات", "يعرض المنافذ التي يستمع عليها الجهاز بانتظار اتصالات", "يغيّر عنوان IP"], "a": 1}}], "test": [{"k": "mc", "q": "موظف يشكو من بطء. وجدت Process غير معروف يستهلك 95% من المعالج ويتصل بعنوان خارجي باستمرار. ما أول خطوتين منطقيتين؟", "e": "المسار والأب يحددان هل هو شرعي. العزل يوقف الضرر ويحفظ الأدلة للتحقيق.", "o": ["تحديد المسار الكامل للملف والـ Parent process، وعزل الجهاز عن الشبكة إن ثبتت الشبهة", "حذف نظام التشغيل فوراً", "تجاهله لأن البطء عادي"], "a": 0}, {"k": "mc", "q": "أي زوج (أداة ← استخدام) صحيح؟", "e": "<code dir=\"ltr\">ipconfig /all<\/code> يعرض إعدادات البطاقات كاملة. <code dir=\"ltr\">net share<\/code> للمشاركات، و <code dir=\"ltr\">regedit<\/code> للـ Registry.", "o": ["net share ← عرض الـ Processes", "ipconfig /all ← عرض إعدادات الشبكة والـ MAC و DNS", "regedit ← اختبار الاتصال"], "a": 1}]}, {"t": "7.4 Windows Security", "kind": "lesson", "cs": [{"t": "The netstat Command", "b": "<p><code dir=\"ltr\">netstat<\/code> يعرض الاتصالات الشبكية القائمة والمنافذ المفتوحة على الجهاز. الصيغة الأنفع للمحلل (بصلاحيات مدير):<\/p><pre dir=\"ltr\"><code>netstat -abno<\/code><\/pre><ul><li><code dir=\"ltr\">-a<\/code>: كل الاتصالات والمنافذ المستمعة.<\/li><li><code dir=\"ltr\">-b<\/code>: اسم البرنامج صاحب كل اتصال.<\/li><li><code dir=\"ltr\">-n<\/code>: عناوين وأرقام بدل الأسماء.<\/li><li><code dir=\"ltr\">-o<\/code>: الـ PID صاحب الاتصال.<\/li><\/ul><p>مثال من المخرج:<\/p><pre dir=\"ltr\"><code>  Proto  Local Address      Foreign Address      State        PID\n  TCP    0.0.0.0:445        0.0.0.0:0            LISTENING    4\n  TCP    10.0.0.15:49722    203.0.113.50:4444    ESTABLISHED  6312<\/code><\/pre><p>السطر الأول: الجهاز يستمع على 445 (SMB) والـ PID هو 4 (النظام). طبيعي. السطر الثاني: اتصال قائم بعنوان خارجي على منفذ غير معتاد من PID 6312. تأخذ الرقم إلى Task Manager لتعرف البرنامج.<\/p>", "q": {"k": "mc", "q": "في مخرج <code dir=\"ltr\">netstat -abno<\/code>، ما الذي يربط الاتصال بالبرنامج الذي أنشأه؟", "e": "الـ PID يحدد الـ Process صاحب الاتصال، ومنه تعرف الملف ومساره.", "o": ["عمود Proto", "عمود PID (والخيار -b لاسم البرنامج)", "عمود State"], "a": 1}}, {"t": "Event Viewer", "b": "<p><b>Event Viewer<\/b> (<code dir=\"ltr\">eventvwr.msc<\/code>) يعرض سجلات Windows. نوعان من السجلات:<\/p><ul><li><b>Windows Logs<\/b>:<\/li><li><b>Application<\/b>: أحداث البرامج.<\/li><li><b>System<\/b>: أحداث النظام والخدمات والـ Drivers.<\/li><li><b>Security<\/b>: أحداث الأمن: الدخول والخروج، استخدام الصلاحيات، تغيير الحسابات.<\/li><li><b>Setup<\/b>: أحداث التثبيت.<\/li><li><b>Applications and Services Logs<\/b>: سجلات خاصة ببرامج وخدمات بعينها، ومنها PowerShell.<\/li><\/ul><p>كل حدث له رقم <b>Event ID<\/b>، ووقت، ومصدر، ومستوى (Information، Warning، Error، Critical).<\/p><p>أرقام يحفظها المحلل من سجل Security:<\/p><div class=\"tw\"><table><tr><th>Event ID<\/th><th>المعنى<\/th><\/tr><tr><td>4624<\/td><td>دخول ناجح<\/td><\/tr><tr><td>4625<\/td><td>دخول فاشل<\/td><\/tr><tr><td>4720<\/td><td>إنشاء حساب مستخدم<\/td><\/tr><tr><td>4732<\/td><td>إضافة عضو لمجموعة محلية<\/td><\/tr><tr><td>1102<\/td><td>مسح سجل الأمن<\/td><\/tr><\/table><\/div><p>استخدم <b>Custom Views<\/b> لتصفية ما يهمك.<\/p>", "q": {"k": "mc", "q": "مئات الأحداث برقم 4625 لحساب واحد خلال دقائق، ثم حدث 4624 لنفس الحساب. ما القراءة الأرجح؟", "e": "سيل دخول فاشل ثم دخول ناجح نمط تخمين نجح أخيراً. الحساب يُعامل كمخترق.", "o": ["المستخدم غيّر خلفية الشاشة", "هجوم تخمين كلمة السر (Brute force) انتهى بنجاح", "تحديث النظام"], "a": 1}}, {"t": "Windows Update Management", "b": "<p>لا يوجد برنامج بلا ثغرات. حين تُكتشف ثغرة يصدر الصانع <b>Patch<\/b> يسدها. الفترة بين صدور الـ Patch وتثبيته هي أخطر وقت، لأن المهاجمين يدرسون الـ Patch نفسه ليعرفوا الثغرة ويستغلوها عند من تأخر.<\/p><p><b>Windows Update<\/b> ينزّل التحديثات ويثبتها تلقائياً. أنواعها: تحديثات أمنية، تحديثات جودة (شهرية، وتصدر عادةً في ثاني ثلاثاء من الشهر ويسمى <b>Patch Tuesday<\/b>)، وتحديثات ميزات.<\/p><p>في المؤسسات لا يُترك كل جهاز لنفسه: خادم مركزي (مثل <b>WSUS<\/b> أو أدوات إدارة حديثة) يختبر التحديثات على مجموعة صغيرة ثم يعممها، ويعطي تقريراً بمن لم يحدّث.<\/p><p>القاعدة: فعّل التحديث التلقائي، ولا تؤجل التحديثات الأمنية.<\/p>", "q": {"k": "mc", "q": "لماذا يزداد الخطر بعد نشر Patch أمني وقبل تثبيته؟", "e": "المهاجمون يحللون التحديث ليصلوا للثغرة، فيصير غير المحدَّثين هدفاً سهلاً.", "o": ["لأن الـ Patch يبطئ الجهاز", "لأن نشره يكشف تفاصيل الثغرة فيستهدف المهاجمون من لم يحدّث", "لأنه يحذف الملفات"], "a": 1}}, {"t": "Local Security Policy", "b": "<p><b>Security policy<\/b> مجموعة قواعد تفرض مستوى أمان محدداً. على جهاز منفرد تُضبط من <b>Local Security Policy<\/b> (<code dir=\"ltr\">secpol.msc<\/code>). في الـ Domain تُفرض مركزياً بـ Group Policy وتتغلب على المحلية.<\/p><p>أهم ما تضبطه:<\/p><ul><li><b>Password Policy<\/b>:<\/li><li>الحد الأدنى للطول (14 حرفاً فأكثر توصية حديثة).<\/li><li>التعقيد: خليط من أنواع الأحرف.<\/li><li>تاريخ كلمات السر: منع إعادة استخدام القديمة.<\/li><li><b>Account Lockout Policy<\/b>: قفل الحساب بعد عدد من المحاولات الفاشلة، ومدة القفل.<\/li><li><b>Audit Policy<\/b>: أي الأحداث تُسجَّل في سجل Security (نجاح الدخول وفشله، تغيير الحسابات).<\/li><li><b>User Rights Assignment<\/b>: من يحق له ماذا (الدخول عن بعد، إطفاء النظام).<\/li><\/ul><p>السياسة يمكن تصديرها وتطبيقها على أجهزة أخرى لتوحيد الإعداد.<\/p>", "q": {"k": "mc", "q": "أي إعداد في Local Security Policy يحد من هجمات تخمين كلمة السر مباشرة؟", "e": "قفل الحساب بعد محاولات فاشلة يوقف التخمين. الـ Audit يسجل المحاولات ولا يمنعها.", "o": ["Audit Policy", "Account Lockout Policy", "User Rights Assignment"], "a": 1}}, {"t": "Windows Defender (Microsoft Defender)", "b": "<p>الحماية من Malware في Windows مدمجة، واسمها اليوم <b>Microsoft Defender Antivirus<\/b> ضمن تطبيق <b>Windows Security<\/b> (كان اسمها Windows Defender). ما تقدمه:<\/p><ul><li><b>Real-time protection<\/b>: فحص كل ملف عند فتحه أو تنزيله أو تشغيله.<\/li><li><b>Cloud-delivered protection<\/b>: الاستعانة بخدمة سحابية للحكم على الملفات الجديدة بسرعة.<\/li><li>فحوص عند الطلب: Quick scan، Full scan، Custom scan، و Offline scan (يفحص قبل إقلاع النظام فيكشف ما يختبئ أثناء عمله).<\/li><li>تحديث تلقائي للتعريفات.<\/li><\/ul><p>فئات ما يحمي منه: Antivirus، Adware، Phishing، Spyware، ومصادر غير موثوقة.<\/p><p>علامة خطر: إن وجدت الحماية اللحظية <b>معطلة<\/b> ولم تعطلها أنت، فكثير من الـ Malware يحاول تعطيلها أولاً. ميزة <b>Tamper Protection<\/b> تمنع ذلك.<\/p>", "q": {"k": "mc", "q": "أي نوع فحص يكشف Malware يخفي نفسه أثناء عمل النظام؟", "e": "الفحص قبل إقلاع Windows يجري والـ Malware غير نشط، فلا يستطيع الاختباء أو المقاومة.", "o": ["Quick scan", "Offline scan", "لا يوجد"], "a": 1}}, {"t": "Windows Defender Firewall", "b": "<p><b>Windows Defender Firewall<\/b> جدار ناري <b>Host-based<\/b> على الجهاز نفسه، يفلتر الحركة الداخلة إليه والخارجة منه.<\/p><p>يطبق إعدادات مختلفة بحسب نوع الشبكة (<b>Profile<\/b>):<\/p><ul><li><b>Domain<\/b>: الجهاز متصل بشبكة المؤسسة.<\/li><li><b>Private<\/b>: شبكة منزل أو عمل موثوقة.<\/li><li><b>Public<\/b>: مطار أو مقهى. الأشد صرامة.<\/li><\/ul><p>القاعدة الافتراضية: الحركة <b>الداخلة<\/b> غير المطلوبة تُمنع إلا ما سمحت به قاعدة، والحركة <b>الخارجة<\/b> مسموحة. حين يطلب برنامج الاستماع على منفذ يسألك Windows هل تسمح له.<\/p><p>الأداة المتقدمة <b>Windows Defender Firewall with Advanced Security<\/b> (<code dir=\"ltr\">wf.msc<\/code>) تكتب فيها قواعد Inbound و Outbound مفصلة بحسب البرنامج والمنفذ والعنوان.<\/p><p>لماذا نحتاجه مع وجود Firewall الشبكة؟ لأنه يحمي الجهاز من أجهزة أخرى <b>داخل<\/b> الشبكة نفسها، ويحميه خارج المؤسسة.<\/p>", "q": {"k": "mc", "q": "تتصل بـ Wi-Fi في مطار. أي Profile يجب أن يطبقه Windows Defender Firewall؟", "e": "الـ Public أشد الملفات تقييداً، ويخفي الجهاز عن بقية أجهزة شبكة لا تثق بها.", "o": ["Domain", "Private", "Public"], "a": 2}}], "test": [{"k": "mc", "q": "للتحقيق في محاولات دخول فاشلة على حاسوب، أي أداة Windows تستخدم؟", "e": "سجل Security يسجل أحداث الدخول الناجح والفاشل بأرقام مثل 4624 و 4625.", "o": ["Event Viewer (سجل Security)", "Paint", "Disk Cleanup"], "a": 0}, {"k": "mc", "q": "تمرين «Identify the Windows Tool»: أي تطابق صحيح؟", "e": "<code dir=\"ltr\">secpol.msc<\/code> يفتح Local Security Policy. <code dir=\"ltr\">wf.msc<\/code> للـ Firewall المتقدم، و <code dir=\"ltr\">eventvwr.msc<\/code> للسجلات.", "o": ["wf.msc ← إدارة الحسابات المحلية", "secpol.msc ← سياسة كلمات السر وقفل الحسابات", "eventvwr.msc ← قواعد الـ Firewall"], "a": 1}, {"k": "sa", "q": "وجدت في netstat اتصالاً قائماً بعنوان خارجي غريب. اذكر الخطوات التالية للتحقق.", "e": "خذ الـ PID من netstat، وحدد الـ Process صاحبه في Task Manager أو Resource Monitor، وتحقق من مسار الملف والـ Parent process وتوقيعه، وابحث عن العنوان في مصادر الـ Threat Intelligence. إن ثبتت الشبهة اعزل الجهاز وبلّغ.", "kw": [["pid", "process", "برنامج", "عملية", "مسار"]]}]}, {"t": "7.5 ملخص الوحدة 7 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li><b>التاريخ<\/b>: من MS-DOS إلى NT ثم Windows 11. النسخ المنتهية الدعم خطر قائم.<\/li><li><b>المعمارية<\/b>: HAL ثم Kernel. الفصل بين User mode و Kernel mode. NTFS (صلاحيات، MFT، ADS). الإقلاع: Firmware ثم bootmgr ثم winload ثم ntoskrnl. بدء التشغيل ومفاتيح Run. Process و Thread و Service و Handle. الـ Registry بخلاياه الخمس.<\/li><li><b>الإعداد والمراقبة<\/b>: UAC و Run as administrator، الحسابات المحلية والـ Domain، PowerShell، WMI، أمر <code dir=\"ltr\">net<\/code>، Task Manager و Resource Monitor، أوامر الشبكة، SMB و RDP، Windows Server.<\/li><li><b>الأمن<\/b>: <code dir=\"ltr\">netstat -abno<\/code>، Event Viewer وأرقام الأحداث، التحديثات، Local Security Policy، Microsoft Defender، والـ Firewall بملفاته الثلاثة.<\/li><\/ul>", "q": {"k": "mc", "q": "أي مجموعة أدوات تفحص بها حاسوب Windows مشتبهاً به؟", "e": "الاتصالات، الـ Processes، السجلات، وبرامج بدء التشغيل هي المحاور الأربعة للفحص الأولي.", "o": ["netstat، Task Manager/Resource Monitor، Event Viewer، وفحص مفاتيح Run", "Paint، Calculator، Notepad", "Sleep، Hibernate، Restart"], "a": 0}}], "test": []}, {"t": "اختبار الوحدة 7", "kind": "exam", "pool": [8], "n": 12}]}, {"n": "8", "t": "الوحدة 8: Linux Overview", "secs": [{"t": "8.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>معظم خوادم الإنترنت وأجهزة الشبكة وأدوات الأمن تعمل بـ Linux. محلل الـ SOC يستخدمه يومياً، سواء كان هو النظام الذي يحميه أو النظام الذي يعمل عليه.<\/p><p>ستتعلم:<\/p><ul><li>ما هو Linux ولماذا يُستخدم في الـ SOC.<\/li><li>العمل في الـ <b>Shell<\/b>: الأوامر الأساسية والملفات النصية.<\/li><li>الخوادم والعملاء والمنافذ.<\/li><li>إدارة الخادم: ملفات الإعداد، التقوية (Hardening)، والسجلات.<\/li><li>نظام الملفات والصلاحيات والروابط.<\/li><li>الواجهة الرسومية، وتثبيت البرامج والتحديث، والـ Processes، والـ Malware، والـ Piping.<\/li><\/ul><p>للتطبيق تحتاج بيئة Linux: VM فيها Ubuntu أو Kali، أو WSL على Windows.<\/p>", "q": {"k": "tf", "q": "محلل الـ SOC قد يعمل على Linux حتى لو كانت أجهزة المستخدمين كلها Windows.", "e": "أدوات التحليل والمراقبة والخوادم تعمل غالباً على Linux، فإتقانه لازم أياً كان نظام المستخدمين.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": []}, {"t": "8.1 Linux Basics", "kind": "lesson", "cs": [{"t": "What is Linux?", "b": "<p><b>Linux<\/b> نظام تشغيل أنشأه Linus Torvalds عام 1991. خصائصه:<\/p><ul><li><b>Open source<\/b>: الكود المصدري متاح للجميع قراءةً وتعديلاً وتوزيعاً.<\/li><li>مجاني، سريع، موثوق، ويعمل على عتاد متواضع.<\/li><\/ul><p>بدقة، Linux هو اسم الـ <b>Kernel<\/b> فقط. النظام الكامل الذي تستخدمه يسمى <b>Distribution<\/b> (توزيعة، أو Distro): الـ Kernel ومعه أدوات وبرامج ومدير حزم وواجهة، يجمعها فريق أو شركة.<\/p><p>توزيعات شائعة: <b>Debian<\/b> و <b>Ubuntu<\/b> (سهلة وواسعة الانتشار)، <b>Red Hat Enterprise Linux<\/b> و <b>Fedora<\/b> (للمؤسسات)، <b>Kali<\/b> (لاختبار الاختراق)، <b>Security Onion<\/b> (لمراقبة أمن الشبكة).<\/p>", "q": {"k": "mc", "q": "ما المقصود بـ Linux distribution؟", "e": "الـ Kernel واحد، والتوزيعات تختلف في ما يُجمع حوله من أدوات وإعدادات.", "o": ["نسخة مقرصنة من Linux", "حزمة تجمع Linux kernel مع أدوات وبرامج لتكوّن نظاماً كاملاً", "Driver لبطاقة الشبكة"], "a": 1}}, {"t": "The Value of Linux", "b": "<p>لماذا يُختار Linux في مراكز العمليات الأمنية؟<\/p><ul><li><b>Open source<\/b>: يمكن تعديل أي جزء ليناسب الحاجة، وفحص الكود للتأكد مما يفعله.<\/li><li><b>الـ CLI قوية جداً<\/b>: كل شيء يُنجز بالأوامر، محلياً وعن بعد عبر SSH، ويُؤتمت بـ Scripts.<\/li><li><b>تحكم أكبر للمستخدم<\/b>: حساب <b>root<\/b> (المدير الأعلى) يملك سلطة مطلقة على النظام، ويستطيع تعديل أي شيء حتى الـ Kernel.<\/li><li><b>تحكم أدق في الشبكة<\/b>: إعداد كل تفصيل في حزمة بروتوكولات الشبكة، وهذا ما تحتاجه أدوات التحليل.<\/li><\/ul><p>سلطة root المطلقة سيف ذو حدين: أمر خاطئ واحد قد يمسح النظام. لذلك يعمل المستخدم بحساب عادي ويرفع صلاحيته للأمر الواحد بـ <code dir=\"ltr\">sudo<\/code>.<\/p>", "q": {"k": "mc", "q": "ما وظيفة <code dir=\"ltr\">sudo<\/code>؟", "e": "<code dir=\"ltr\">sudo<\/code> يطبق Least Privilege: صلاحية عالية لأمر واحد ثم تعود لحسابك العادي.", "o": ["إطفاء الحاسوب", "تنفيذ أمر واحد بصلاحيات root دون الدخول الدائم بحسابه", "عرض الملفات المخفية"], "a": 1}}, {"t": "Linux in the SOC", "b": "<p>تجهيز SOC كاملاً ممكن ببرامج مفتوحة المصدر على Linux. أنواع الأدوات:<\/p><ul><li><b>Network packet capture<\/b>: التقاط الـ Packets وتحليلها. مثال: <b>Wireshark<\/b> و <b>tcpdump<\/b>.<\/li><li><b>Malware analysis tools<\/b>: تشغيل البرامج الخبيثة ومراقبتها في بيئة معزولة.<\/li><li><b>IDS<\/b>: مراقبة الحركة لحظياً والتنبيه. مثال: <b>Snort<\/b> و <b>Suricata<\/b> و <b>Zeek<\/b>.<\/li><li><b>Firewalls<\/b>: مثال <code dir=\"ltr\">iptables<\/code> و <code dir=\"ltr\">nftables<\/code>.<\/li><li><b>Log managers<\/b>: جمع السجلات الكثيرة والبحث فيها.<\/li><li><b>SIEM<\/b> (Security Information and Event Management): تحليل لحظي للتنبيهات والسجلات من كل أجهزة الشبكة.<\/li><li><b>Ticketing systems<\/b>: تسجيل كل تنبيه كتذكرة وتوزيعها ومتابعتها حتى الإغلاق.<\/li><\/ul><p>توزيعة <b>Security Onion<\/b> تجمع معظم هذه الأدوات جاهزة.<\/p>", "q": {"k": "mc", "q": "أي فئة أدوات تجمع السجلات والتنبيهات من أجهزة الشبكة كلها وتحللها لحظياً؟", "e": "الـ SIEM يربط الأحداث من المصادر المختلفة وينبّه. نظام التذاكر يدير سير العمل على التنبيهات.", "o": ["Ticketing system", "SIEM", "Packet capture"], "a": 1}}, {"t": "Linux Tools", "b": "<p>فوق أدوات الـ SOC، يستخدم المحترفون أدوات <b>Penetration testing<\/b>: البحث عن الثغرات في شبكة أو نظام بمهاجمته <b>بتصريح مكتوب<\/b> من مالكه، ليُصلح ما يُكتشف.<\/p><p><b>Kali Linux<\/b> توزيعة تجمع مئات هذه الأدوات مصنفة: جمع المعلومات، تحليل الثغرات، هجمات اللاسلكي، كلمات السر، التحليل الجنائي الرقمي، وغيرها.<\/p><p>لماذا يتعلمها المدافع؟ ليعرف كيف يرى المهاجم شبكته، وليتحقق أن دفاعاته تعمل.<\/p><p>قاعدة لا استثناء فيها: استخدام هذه الأدوات على أنظمة لا تملكها أو لم يُصرَّح لك كتابياً بفحصها جريمة في معظم دول العالم، حتى لو لم تسبب ضرراً. تدرّب على VM تملكها.<\/p>", "q": {"k": "mc", "q": "ما الشرط الذي يجعل اختبار الاختراق عملاً مشروعاً؟", "e": "التصريح هو الفارق بين مختبر اختراق ومهاجم. المهارة والنية لا تكفيان قانونياً.", "o": ["أن يكون المختبر ماهراً", "تصريح مكتوب مسبق من مالك النظام يحدد النطاق", "أن يُنفَّذ ليلاً"], "a": 1}}], "test": [{"k": "mc", "q": "مدير يسأل: لماذا يفضّل فريق الـ SOC نظام Linux؟ أي إجابة أدق؟", "e": "هذه مزاياه الفعلية. Linux يُصاب بـ Malware أيضاً كما سترى في آخر الوحدة.", "o": ["لأنه لا يُصاب بـ Malware أبداً", "لأنه مفتوح المصدر، قابل للتخصيص، وله CLI قوية وتحكم دقيق في الشبكة", "لأنه يشبه Windows تماماً"], "a": 1}, {"k": "tf", "q": "حساب root في Linux صلاحياته محدودة مثل المستخدم العادي.", "e": "root يملك سلطة مطلقة على النظام. لذلك يُتجنب العمل به مباشرة ويُستخدم sudo.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "8.2 Working in the Linux Shell", "kind": "lesson", "cs": [{"t": "The Linux Shell", "b": "<p><b>Shell<\/b> برنامج يقرأ أوامرك النصية وينفذها. هو واجهتك مع النظام. أشهرها <b>bash<\/b>. تصل إليه عبر <b>Terminal emulator<\/b>: نافذة داخل الواجهة الرسومية تعطيك سطر أوامر، مثل Terminator أو GNOME Terminal.<\/p><p>شكل سطر الأوامر (<b>Prompt<\/b>):<\/p><pre dir=\"ltr\"><code>analyst@secOps:~$<\/code><\/pre><ul><li><code dir=\"ltr\">analyst<\/code>: اسم المستخدم.<\/li><li><code dir=\"ltr\">secOps<\/code>: اسم الجهاز.<\/li><li><code dir=\"ltr\">~<\/code>: المجلد الحالي (العلامة ترمز لمجلد المستخدم الشخصي Home).<\/li><li>علامة الدولار في الآخر: مستخدم عادي. إن ظهرت علامة <code dir=\"ltr\">#<\/code> فأنت root.<\/li><\/ul><p>بنية أي أمر: اسم الأمر، ثم خيارات (<b>Options<\/b>) تبدأ بشرطة، ثم معطيات (<b>Arguments<\/b>). مثال: <code dir=\"ltr\">ls -l /etc<\/code>.<\/p><p>المساعدة: <code dir=\"ltr\">man ls<\/code> يعرض دليل الأمر، ومعظم الأوامر تقبل <code dir=\"ltr\">--help<\/code>.<\/p>", "q": {"k": "mc", "q": "الـ Prompt يظهر هكذا: <code dir=\"ltr\">root@server:/etc#<\/code>. ماذا تستنتج؟", "e": "علامة <code dir=\"ltr\">#<\/code> واسم root يدلان على صلاحيات المدير الأعلى، فكل أمر له أثر كامل. احذر.", "o": ["أنت مستخدم عادي في مجلد Home", "أنت تعمل بحساب root في مجلد /etc", "الجهاز مطفأ"], "a": 1}}, {"t": "Basic Commands", "b": "<div class=\"tw\"><table><tr><th>الأمر<\/th><th>وظيفته<\/th><\/tr><tr><td><code dir=\"ltr\">pwd<\/code><\/td><td>عرض مسار المجلد الحالي<\/td><\/tr><tr><td><code dir=\"ltr\">ls<\/code><\/td><td>عرض محتويات المجلد (<code dir=\"ltr\">-l<\/code> تفاصيل، <code dir=\"ltr\">-a<\/code> مع المخفي)<\/td><\/tr><tr><td><code dir=\"ltr\">cd<\/code><\/td><td>تغيير المجلد<\/td><\/tr><tr><td><code dir=\"ltr\">man<\/code><\/td><td>دليل استخدام أمر<\/td><\/tr><tr><td><code dir=\"ltr\">sudo<\/code><\/td><td>تنفيذ أمر بصلاحيات root<\/td><\/tr><tr><td><code dir=\"ltr\">su<\/code><\/td><td>التحول لحساب مستخدم آخر<\/td><\/tr><tr><td><code dir=\"ltr\">passwd<\/code><\/td><td>تغيير كلمة السر<\/td><\/tr><tr><td><code dir=\"ltr\">ps<\/code><\/td><td>عرض الـ Processes<\/td><\/tr><tr><td><code dir=\"ltr\">ifconfig<\/code> / <code dir=\"ltr\">ip addr<\/code><\/td><td>إعدادات بطاقات الشبكة (<code dir=\"ltr\">ip<\/code> هو الحديث)<\/td><\/tr><tr><td><code dir=\"ltr\">ping<\/code><\/td><td>اختبار الوصول لجهاز<\/td><\/tr><tr><td><code dir=\"ltr\">apt-get<\/code> / <code dir=\"ltr\">apt<\/code><\/td><td>تثبيت البرامج وتحديثها في Debian/Ubuntu<\/td><\/tr><tr><td><code dir=\"ltr\">shutdown<\/code><\/td><td>إطفاء أو إعادة تشغيل<\/td><\/tr><tr><td><code dir=\"ltr\">grep<\/code><\/td><td>البحث عن نص داخل ملفات أو مخرجات<\/td><\/tr><tr><td><code dir=\"ltr\">chmod<\/code> / <code dir=\"ltr\">chown<\/code><\/td><td>تغيير صلاحيات / مالك ملف<\/td><\/tr><\/table><\/div><p>ملاحظة: Linux <b>حساس لحالة الأحرف<\/b>. <code dir=\"ltr\">File.txt<\/code> و <code dir=\"ltr\">file.txt<\/code> ملفان مختلفان.<\/p>", "q": {"k": "mc", "q": "أي أمر يعرض المجلد الذي تقف فيه الآن؟", "e": "<code dir=\"ltr\">pwd<\/code> اختصار Print Working Directory. <code dir=\"ltr\">ls<\/code> يعرض المحتويات، و <code dir=\"ltr\">cd<\/code> ينقلك.", "o": ["ls", "pwd", "cd"], "a": 1}}, {"t": "File and Directory Commands", "b": "<div class=\"tw\"><table><tr><th>الأمر<\/th><th>وظيفته<\/th><\/tr><tr><td><code dir=\"ltr\">mkdir<\/code><\/td><td>إنشاء مجلد<\/td><\/tr><tr><td><code dir=\"ltr\">cp<\/code><\/td><td>نسخ ملف أو مجلد<\/td><\/tr><tr><td><code dir=\"ltr\">mv<\/code><\/td><td>نقل أو إعادة تسمية<\/td><\/tr><tr><td><code dir=\"ltr\">rm<\/code><\/td><td>حذف ملف (<code dir=\"ltr\">-r<\/code> لمجلد بمحتواه)<\/td><\/tr><tr><td><code dir=\"ltr\">cat<\/code><\/td><td>عرض محتوى ملف كاملاً<\/td><\/tr><tr><td><code dir=\"ltr\">head<\/code> / <code dir=\"ltr\">tail<\/code><\/td><td>عرض أول / آخر أسطر ملف<\/td><\/tr><tr><td><code dir=\"ltr\">less<\/code><\/td><td>تصفح ملف طويل صفحة صفحة<\/td><\/tr><tr><td><code dir=\"ltr\">touch<\/code><\/td><td>إنشاء ملف فارغ أو تحديث وقته<\/td><\/tr><tr><td><code dir=\"ltr\">find<\/code><\/td><td>البحث عن ملفات بالاسم أو الخصائص<\/td><\/tr><\/table><\/div><p>المسارات نوعان: <b>مطلق<\/b> يبدأ من الجذر <code dir=\"ltr\">/<\/code> مثل <code dir=\"ltr\">/home/analyst/notes.txt<\/code>، و<b>نسبي<\/b> من موقعك الحالي مثل <code dir=\"ltr\">notes.txt<\/code> أو <code dir=\"ltr\">../logs<\/code>. والرمز <code dir=\"ltr\">.<\/code> هو المجلد الحالي و <code dir=\"ltr\">..<\/code> هو المجلد الأب.<\/p><p>تنبيه: <code dir=\"ltr\">rm<\/code> يحذف نهائياً، لا سلة مهملات. والأمر <code dir=\"ltr\">rm -r<\/code> على مسار خاطئ بصلاحيات root كارثة.<\/p><p>للمحلل: <code dir=\"ltr\">tail -f /var/log/syslog<\/code> يعرض السجل حياً وهو يُكتب.<\/p>", "q": {"k": "mc", "q": "تريد مراقبة ما يُضاف لملف سجل لحظة بلحظة. أي أمر؟", "e": "الخيار <code dir=\"ltr\">-f<\/code> (follow) يُبقي <code dir=\"ltr\">tail<\/code> مفتوحاً ويعرض كل سطر جديد فور كتابته.", "o": ["cat file.log", "tail -f file.log", "rm file.log"], "a": 1}}, {"t": "Working with Text Files", "b": "<p>تحرير النصوص في Linux يتم بمحررات داخل الـ Terminal أو رسومية:<\/p><ul><li><b>nano<\/b>: محرر بسيط للمبتدئين. تفتح الملف بـ <code dir=\"ltr\">nano file.txt<\/code> وتكتب مباشرة. الاختصارات معروضة أسفل الشاشة: <code dir=\"ltr\">Ctrl+O<\/code> للحفظ و <code dir=\"ltr\">Ctrl+X<\/code> للخروج.<\/li><li><b>vi / vim<\/b>: محرر قوي وموجود على كل نظام تقريباً، لكنه يحتاج تعلماً. له أوضاع: وضع الأوامر (الافتراضي)، ووضع الإدراج (تدخله بـ <code dir=\"ltr\">i<\/code> وتخرج منه بـ <code dir=\"ltr\">Esc<\/code>). للحفظ والخروج تكتب <code dir=\"ltr\">:wq<\/code>، وللخروج دون حفظ <code dir=\"ltr\">:q!<\/code>.<\/li><li><b>gedit<\/b> وأمثاله: محررات رسومية كـ Notepad.<\/li><\/ul><p>لماذا تتعلم محرراً نصياً في الـ Terminal؟ لأن الخادم الذي تتصل به عن بعد عبر SSH ليس فيه واجهة رسومية غالباً، و vi قد يكون المحرر الوحيد المتاح.<\/p>", "q": {"k": "mc", "q": "أنت داخل vim وتريد الحفظ والخروج. ماذا تكتب بعد الضغط على Esc؟", "e": "<code dir=\"ltr\">:w<\/code> يحفظ و <code dir=\"ltr\">:q<\/code> يخرج، و <code dir=\"ltr\">:wq<\/code> يجمعهما. <code dir=\"ltr\">Ctrl+X<\/code> خاص بـ nano.", "o": ["Ctrl+X", ":wq", "exit"], "a": 1}}, {"t": "The Importance of Text Files in Linux", "b": "<p>في Linux <b>كل شيء تقريباً ملف<\/b>، ومعظم إعدادات النظام والخدمات ملفات نصية عادية. لا يوجد Registry مركزي كما في Windows.<\/p><p>معنى ذلك:<\/p><ul><li>أي تغيير في إعداد خدمة هو تعديل سطر في ملف نصي، ثم إعادة تشغيل الخدمة لتقرأه.<\/li><li>يمكن نسخ الإعدادات، مقارنتها، حفظ تاريخها، وأتمتة تعديلها بسهولة.<\/li><li>السجلات نصية أيضاً، فتُبحث بـ <code dir=\"ltr\">grep<\/code>.<\/li><\/ul><p>وجه الخطر: من يملك صلاحية الكتابة على ملف إعداد يتحكم في الخدمة. لذلك معظم ملفات <code dir=\"ltr\">/etc<\/code> لا يكتب عليها إلا root، وتعديلها يحتاج <code dir=\"ltr\">sudo nano /etc/...<\/code>. وتغيير غير متوقع في ملف إعداد حساس علامة اختراق.<\/p><div class=\"note\">تمرينان (بديلا Labs 8.2.6 و 8.2.7): أنشئ مجلداً باسم lab بـ <code dir=\"ltr\">mkdir<\/code>، وأنشئ فيه ملفاً بـ nano واكتب ثلاثة أسطر، اعرضه بـ <code dir=\"ltr\">cat<\/code>، انسخه بـ <code dir=\"ltr\">cp<\/code>، أعد تسمية النسخة بـ <code dir=\"ltr\">mv<\/code>، ثم ابحث فيه عن كلمة بـ <code dir=\"ltr\">grep<\/code>. بعدها نفّذ <code dir=\"ltr\">ls -la<\/code> وحاول تفسير كل عمود.<\/div>", "q": {"k": "mc", "q": "غيّرت سطراً في ملف إعداد خدمة SSH لكن السلوك لم يتغير. ما الخطوة الناقصة غالباً؟", "e": "الخدمة تقرأ ملف إعدادها عند البدء. بعد التعديل يلزم restart أو reload.", "o": ["إعادة تثبيت النظام", "إعادة تشغيل الخدمة (أو إعادة تحميل إعدادها) لتقرأ الملف الجديد", "حذف الملف"], "a": 1}}], "test": [{"k": "mc", "q": "أي أمر يبحث عن كل الأسطر التي فيها كلمة Failed في ملف سجل المصادقة؟", "e": "<code dir=\"ltr\">grep<\/code> يطبع الأسطر المطابقة للنص المطلوب من الملف.", "o": ["grep \"Failed\" /var/log/auth.log", "ls Failed /var/log/auth.log", "mkdir Failed"], "a": 0}, {"k": "tf", "q": "في Linux الملفان <code dir=\"ltr\">Report.txt<\/code> و <code dir=\"ltr\">report.txt<\/code> هما الملف نفسه.", "e": "Linux حساس لحالة الأحرف في أسماء الملفات والأوامر.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "8.3 Linux Servers and Clients", "kind": "lesson", "cs": [{"t": "An Introduction to Client-Server Communications", "b": "<p>في نموذج <b>Client-Server<\/b>:<\/p><ul><li><b>Server<\/b>: حاسوب يشغّل برنامجاً يقدم خدمة وينتظر الطلبات.<\/li><li><b>Client<\/b>: برنامج يطلب الخدمة ويعرض النتيجة.<\/li><\/ul><p>مثال: خادم ويب يخزن الصفحات، والمتصفح (العميل) يطلبها.<\/p><p>الخادم الواحد قد يقدم عدة خدمات معاً (ويب وبريد و SSH). كيف يعرف لأي خدمة يوجَّه كل طلب؟ عبر رقم الـ <b>Port<\/b>. كل خدمة «تستمع» على منفذ محدد.<\/p><p>كلمة «خادم» تطلق على البرنامج الذي يقدم الخدمة، وعلى الجهاز الذي يشغله. وأي حاسوب يصير خادماً إن شُغّل عليه برنامج خادم.<\/p>", "q": {"k": "mc", "q": "خادم واحد يشغّل موقع ويب وخدمة SSH. كيف يميز النظام بين الطلبين؟", "e": "رقم المنفذ يحدد أي خدمة تستلم الطلب على الجهاز نفسه.", "o": ["بحجم الـ Packet", "برقم الـ Port الوجهة: 443 أو 80 للويب و 22 لـ SSH", "بلون الكابل"], "a": 1}}, {"t": "Servers, Services, and Their Ports", "b": "<p><b>Port<\/b> مورد شبكي محجوز لخدمة. حين نقول «المنفذ مفتوح» نعني أن خدمة تستمع عليه وتقبل الاتصالات.<\/p><p>المنافذ من 0 إلى 1023 تسمى <b>Well-known ports<\/b>، ويحتاج حجزها صلاحيات root.<\/p><div class=\"tw\"><table><tr><th>Port<\/th><th>الخدمة<\/th><\/tr><tr><td>20/21<\/td><td>FTP<\/td><\/tr><tr><td>22<\/td><td>SSH<\/td><\/tr><tr><td>23<\/td><td>Telnet<\/td><\/tr><tr><td>25<\/td><td>SMTP<\/td><\/tr><tr><td>53<\/td><td>DNS<\/td><\/tr><tr><td>67/68<\/td><td>DHCP<\/td><\/tr><tr><td>69<\/td><td>TFTP<\/td><\/tr><tr><td>80<\/td><td>HTTP<\/td><\/tr><tr><td>110<\/td><td>POP3<\/td><\/tr><tr><td>123<\/td><td>NTP<\/td><\/tr><tr><td>143<\/td><td>IMAP<\/td><\/tr><tr><td>161/162<\/td><td>SNMP<\/td><\/tr><tr><td>443<\/td><td>HTTPS<\/td><\/tr><\/table><\/div><p>لرؤية ما يستمع على جهازك (والأمر <code dir=\"ltr\">netstat<\/code> القديم استُبدل بـ <code dir=\"ltr\">ss<\/code>):<\/p><pre dir=\"ltr\"><code>sudo ss -tulnp<\/code><\/pre><p>القاعدة الأمنية: كل منفذ مفتوح باب. أغلق ما لا تحتاجه.<\/p>", "q": {"k": "mc", "q": "<code dir=\"ltr\">ss -tulnp<\/code> أظهر خدمة تستمع على المنفذ 23. ما هي، وما التوصية؟", "e": "Telnet ينقل كلمات السر نصاً واضحاً. بديله المشفر SSH على المنفذ 22.", "o": ["SSH، وهي آمنة", "Telnet، ويجب إيقافها واستخدام SSH لأنها ترسل كل شيء مكشوفاً", "DNS، ولا شيء"], "a": 1}}, {"t": "Clients", "b": "<p><b>Client<\/b> برنامج يتواصل مع خادم ليحصل على خدمة. أمثلة: متصفح الويب عميل لخادم الويب، برنامج البريد عميل لخادم البريد، والأمر <code dir=\"ltr\">ssh<\/code> عميل لخادم SSH.<\/p><p>العميل يتكلم بروتوكول الخدمة: متصفح الويب يتكلم HTTP، وعميل FTP يتكلم FTP. ولذلك لا يصلح عميل خدمة لخدمة أخرى.<\/p><p>العميل أيضاً يستخدم منفذاً، لكنه مؤقت وعشوائي من المدى العالي (<b>Ephemeral port<\/b>)، يأخذه عند بدء الاتصال ويتركه عند انتهائه.<\/p><p>أمنياً: برامج العملاء (خصوصاً المتصفح وقارئ PDF وبرنامج البريد) تعالج محتوى يأتي من الإنترنت، فثغراتها مدخل رئيسي للهجوم. تحديثها بنفس أهمية تحديث الخوادم.<\/p>", "q": {"k": "tf", "q": "العميل يستخدم دائماً رقم المنفذ نفسه الذي يستمع عليه الخادم كمنفذ مصدر.", "e": "العميل يختار منفذ مصدر مؤقتاً عشوائياً (Ephemeral)، ويتصل بمنفذ الخادم المعروف كوجهة.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "تمرين: Use a Port Scanner to Detect Open Ports", "b": "<p><b>Port scanner<\/b> أداة تجرب الاتصال بمنافذ جهاز لتعرف أيها مفتوح وما الخدمة عليه. أشهرها <b>Nmap<\/b>. المدافع يستخدمها ليرى أجهزته كما يراها المهاجم، ويكتشف خدمات لم يكن يعلم بوجودها.<\/p><p>بديل Labs 8.3.4 و 8.3.5. افحص <b>جهازك أنت فقط<\/b> (العنوان <code dir=\"ltr\">127.0.0.1<\/code> أو <code dir=\"ltr\">localhost<\/code>):<\/p><pre dir=\"ltr\"><code>sudo apt install nmap\nnmap -sV localhost<\/code><\/pre><p>مثال للمخرج:<\/p><pre dir=\"ltr\"><code>PORT    STATE SERVICE VERSION\n22/tcp  open  ssh     OpenSSH 8.9p1\n631/tcp open  ipp     CUPS 2.4<\/code><\/pre><p>اقرأ: رقم المنفذ والبروتوكول، الحالة (<code dir=\"ltr\">open<\/code> مفتوح، <code dir=\"ltr\">closed<\/code> مغلق، <code dir=\"ltr\">filtered<\/code> يحجبه Firewall)، الخدمة، ونسختها. ثم قارن مع مخرج <code dir=\"ltr\">sudo ss -tulnp<\/code>: هل تتطابق القائمتان؟ لكل منفذ مفتوح اسأل: هل أحتاج هذه الخدمة؟<\/p><p>تذكير: فحص أجهزة لا تملكها دون تصريح غير مشروع.<\/p>", "q": {"k": "mc", "q": "Nmap أظهر حالة منفذ على أنها <code dir=\"ltr\">filtered<\/code>. ماذا تعني؟", "e": "filtered تعني أن Packets الفحص لم تلقَ رداً بسبب فلترة، فالحالة الحقيقية مجهولة.", "o": ["المنفذ مفتوح والخدمة تعمل", "جهاز فلترة (Firewall) يحجب الفحص فلا يُعرف هل المنفذ مفتوح", "الجهاز مطفأ"], "a": 1}}, {"t": "تمرين: Linux Servers", "b": "<p>بديل Lab 8.3.6. الخدمات في التوزيعات الحديثة يديرها <b>systemd<\/b> بالأمر <code dir=\"ltr\">systemctl<\/code>:<\/p><pre dir=\"ltr\"><code>systemctl status ssh\nsudo systemctl start ssh\nsudo systemctl stop ssh\nsudo systemctl enable ssh\nsudo systemctl disable ssh\nsystemctl list-units --type=service --state=running<\/code><\/pre><ul><li><code dir=\"ltr\">status<\/code>: هل تعمل؟ مع آخر أسطر سجلها.<\/li><li><code dir=\"ltr\">start<\/code> / <code dir=\"ltr\">stop<\/code>: تشغيل وإيقاف الآن.<\/li><li><code dir=\"ltr\">enable<\/code> / <code dir=\"ltr\">disable<\/code>: تشغيلها تلقائياً عند الإقلاع أو لا.<\/li><li>الأمر الأخير: كل الخدمات العاملة.<\/li><\/ul><p>التمرين: اعرض الخدمات العاملة. اختر خدمة لا تحتاجها (مثل خدمة الطباعة على خادم)، أوقفها بـ <code dir=\"ltr\">stop<\/code> وعطّلها بـ <code dir=\"ltr\">disable<\/code>، ثم تأكد بـ <code dir=\"ltr\">ss -tulnp<\/code> أن منفذها أُغلق.<\/p><p>خدمة تعمل في الخلفية تسمى <b>Daemon<\/b>، وأسماؤها تنتهي غالباً بحرف d مثل <code dir=\"ltr\">sshd<\/code> و <code dir=\"ltr\">httpd<\/code>.<\/p>", "q": {"k": "mc", "q": "أوقفت خدمة بـ <code dir=\"ltr\">systemctl stop<\/code> لكنها عادت للعمل بعد إعادة التشغيل. ما الأمر الناقص؟", "e": "<code dir=\"ltr\">stop<\/code> يوقفها الآن فقط. <code dir=\"ltr\">disable<\/code> يمنع تشغيلها التلقائي عند الإقلاع.", "o": ["systemctl status", "systemctl disable", "systemctl start"], "a": 1}}], "test": [{"k": "mc", "q": "على خادم ويب وجدت المنافذ 22 و 80 و 443 و 21 و 23 مفتوحة. أي منفذين تغلق أولاً ولماذا؟", "e": "خادم الويب يحتاج 80/443 و SSH للإدارة. FTP و Telnet يكشفان كلمات السر ويوسّعان سطح الهجوم.", "o": ["21 و 23، لأن FTP و Telnet غير مشفرين وغير لازمين لخادم ويب", "443 و 80، لأنهما للويب", "22، لأن SSH خطير"], "a": 0}, {"k": "sa", "q": "لماذا يستخدم المدافعون Port scanner على شبكتهم؟", "e": "ليروا أجهزتهم كما يراها المهاجم: أي المنافذ مفتوحة وأي خدمات ونسخ تعمل عليها، فيغلقون ما لا يلزم ويحدّثون القديم قبل أن يستغله غيرهم.", "kw": [["مفتوح", "open", "خدم", "service", "منافذ", "سطح", "surface", "ثغر"]]}]}, {"t": "8.4 Basic Server Administration", "kind": "lesson", "cs": [{"t": "Service Configuration Files", "b": "<p>إعدادات الخدمات في Linux تُحفظ في ملفات نصية، أغلبها تحت <code dir=\"ltr\">/etc<\/code>. تحدد: المنفذ الذي تستمع عليه الخدمة، من يُسمح له، أين تكتب سجلاتها، وغير ذلك.<\/p><p>أمثلة:<\/p><div class=\"tw\"><table><tr><th>الملف<\/th><th>الخدمة<\/th><\/tr><tr><td><code dir=\"ltr\">/etc/ssh/sshd_config<\/code><\/td><td>خادم SSH<\/td><\/tr><tr><td><code dir=\"ltr\">/etc/nginx/nginx.conf<\/code><\/td><td>خادم الويب Nginx<\/td><\/tr><tr><td><code dir=\"ltr\">/etc/ntp.conf<\/code> أو <code dir=\"ltr\">/etc/chrony.conf<\/code><\/td><td>مزامنة الوقت<\/td><\/tr><tr><td><code dir=\"ltr\">/etc/snort/snort.conf<\/code><\/td><td>نظام Snort<\/td><\/tr><tr><td><code dir=\"ltr\">/etc/passwd<\/code> و <code dir=\"ltr\">/etc/shadow<\/code><\/td><td>الحسابات، وكلمات السر مجزّأة (Hashed)<\/td><\/tr><tr><td><code dir=\"ltr\">/etc/hosts<\/code><\/td><td>ترجمة أسماء محلية<\/td><\/tr><\/table><\/div><p>لا توجد صيغة موحدة: كل برنامج له صيغته، والأسطر التي تبدأ بـ <code dir=\"ltr\">#<\/code> تعليقات.<\/p><p>سطران من إعداد SSH ولهما وزن أمني:<\/p><pre dir=\"ltr\"><code>PermitRootLogin no\nPasswordAuthentication no<\/code><\/pre><p>الأول يمنع دخول root مباشرة عن بعد، والثاني يفرض الدخول بمفاتيح بدل كلمات السر.<\/p>", "q": {"k": "mc", "q": "ما أثر السطر <code dir=\"ltr\">PermitRootLogin no<\/code> في إعداد SSH؟", "e": "يجبر المدير على الدخول بحساب عادي ثم استخدام sudo، فيُحرم المهاجم من تخمين كلمة سر الحساب الأقوى.", "o": ["يمنع كل المستخدمين من الدخول", "يمنع تسجيل الدخول عن بعد بحساب root مباشرة", "يحذف حساب root"], "a": 1}}, {"t": "Hardening Devices", "b": "<p><b>Hardening<\/b> (التقوية) هو تطبيق أساليب مجرَّبة لتأمين الجهاز وتقليل سطح الهجوم. أهم الممارسات:<\/p><ul><li><b>تأمين الوصول الفيزيائي<\/b> للجهاز.<\/li><li><b>تقليل البرامج المثبتة<\/b>: ما ليس موجوداً لا يُخترق.<\/li><li><b>تعطيل الخدمات غير المستخدمة<\/b>.<\/li><li><b>SSH بدل Telnet<\/b>، وتعطيل دخول root عبر SSH.<\/li><li><b>تحديث النظام<\/b> باستمرار.<\/li><li><b>تعطيل الاكتشاف التلقائي لوسائط USB<\/b>.<\/li><li><b>كلمات سر قوية<\/b> وتغييرها دورياً، ومنع إعادة استخدام القديمة.<\/li><li><b>مراجعة السجلات<\/b> بانتظام.<\/li><\/ul><p>هناك أدلة تقوية مرجعية لكل نظام، مثل <b>CIS Benchmarks<\/b>، تسرد الإعدادات الموصى بها بنداً بنداً. تطبيقها أفضل من الاجتهاد الشخصي.<\/p>", "q": {"k": "mc", "q": "أي بند من بنود الـ Hardening يقلل سطح الهجوم مباشرة؟", "e": "كل خدمة أو برنامج إضافي قد يحمل ثغرة. تقليلها يقلل ما يمكن مهاجمته.", "o": ["تغيير خلفية سطح المكتب", "إزالة البرامج وتعطيل الخدمات غير اللازمة", "زيادة حجم القرص"], "a": 1}}, {"t": "Monitoring Service Logs", "b": "<p><b>Log file<\/b> سجل زمني للأحداث المهمة على الجهاز: من دخل، ماذا تشغّل، وما الأخطاء. السجلات تُحفظ غالباً تحت <code dir=\"ltr\">/var/log<\/code>.<\/p><div class=\"tw\"><table><tr><th>الملف<\/th><th>ما فيه<\/th><\/tr><tr><td><code dir=\"ltr\">/var/log/messages<\/code> أو <code dir=\"ltr\">/var/log/syslog<\/code><\/td><td>رسائل النظام العامة غير الحرجة<\/td><\/tr><tr><td><code dir=\"ltr\">/var/log/auth.log<\/code> (في Debian/Ubuntu) أو <code dir=\"ltr\">/var/log/secure<\/code> (في Red Hat)<\/td><td>أحداث المصادقة: الدخول، <code dir=\"ltr\">sudo<\/code>، SSH<\/td><\/tr><tr><td><code dir=\"ltr\">/var/log/boot.log<\/code><\/td><td>أحداث الإقلاع<\/td><\/tr><tr><td><code dir=\"ltr\">/var/log/dmesg<\/code><\/td><td>رسائل الـ Kernel عن العتاد والـ Drivers<\/td><\/tr><tr><td><code dir=\"ltr\">/var/log/kern.log<\/code><\/td><td>رسائل الـ Kernel<\/td><\/tr><tr><td><code dir=\"ltr\">/var/log/cron<\/code><\/td><td>المهام المجدولة<\/td><\/tr><tr><td><code dir=\"ltr\">/var/log/mysqld.log<\/code> وأمثاله<\/td><td>سجل خدمة بعينها<\/td><\/tr><\/table><\/div><p>في الأنظمة الحديثة يجمع <b>systemd-journald<\/b> السجلات أيضاً، وتُقرأ بالأمر <code dir=\"ltr\">journalctl<\/code>، مثل <code dir=\"ltr\">journalctl -u ssh<\/code> لسجل خدمة SSH.<\/p><p>السجلات يجب أن تُرسل لخادم مركزي أيضاً (Syslog، وحدة 6)، فالمهاجم يحاول مسح المحلية.<\/p>", "q": {"k": "mc", "q": "أين تبحث على خادم Ubuntu عن محاولات دخول SSH الفاشلة؟", "e": "أحداث المصادقة، ومنها دخول SSH واستخدام sudo، تُسجَّل في auth.log (و secure على Red Hat).", "o": ["/var/log/boot.log", "/var/log/auth.log", "/etc/hosts"], "a": 1}}, {"t": "تمرين: Locating Log Files", "b": "<p>بديل Lab 8.4.4. هذه أسطر من <code dir=\"ltr\">/var/log/auth.log<\/code>:<\/p><pre dir=\"ltr\"><code>Mar 12 03:14:07 web01 sshd[2211]: Failed password for root from 198.51.100.23 port 51122 ssh2\nMar 12 03:14:09 web01 sshd[2211]: Failed password for root from 198.51.100.23 port 51122 ssh2\nMar 12 03:14:15 web01 sshd[2215]: Failed password for invalid user admin from 198.51.100.23 port 51130 ssh2\nMar 12 03:20:41 web01 sshd[2290]: Accepted password for deploy from 198.51.100.23 port 51502 ssh2\nMar 12 03:21:02 web01 sudo:   deploy : TTY=pts/0 ; PWD=/home/deploy ; USER=root ; COMMAND=/bin/bash<\/code><\/pre><p>بنية السطر: التاريخ والوقت، اسم الجهاز، الخدمة ورقم الـ Process بين قوسين، ثم الرسالة.<\/p><p>ما تحكيه الأسطر: عنوان واحد جرّب حسابات عدة (root، admin) وفشل، ثم <b>نجح<\/b> بحساب <code dir=\"ltr\">deploy<\/code>، وبعد ثوانٍ فتح Shell بصلاحيات root عبر sudo.<\/p><p>للعدّ على جهازك:<\/p><pre dir=\"ltr\"><code>sudo grep &quot;Failed password&quot; /var/log/auth.log | wc -l<\/code><\/pre>", "q": {"k": "mc", "q": "ما القراءة الصحيحة لأسطر السجل أعلاه؟", "e": "محاولات فاشلة من عنوان واحد على حسابات مختلفة، ثم نجاح، ثم رفع صلاحيات. الخادم مخترق ويجب عزله والتحقيق.", "o": ["نشاط إداري عادي", "هجوم تخمين نجح في اختراق حساب deploy ثم حصل المهاجم على صلاحيات root", "عطل في خدمة SSH"], "a": 1}}], "test": [{"k": "mc", "q": "أي إجراءين كانا سيمنعان الاختراق الظاهر في سجل التمرين السابق؟", "e": "المفاتيح تلغي تخمين كلمات السر، وحجب العنوان بعد محاولات فاشلة (أدوات مثل fail2ban) يوقف الهجوم مبكراً.", "o": ["منع المصادقة بكلمة السر في SSH (مفاتيح فقط) وقفل المحاولات المتكررة", "تكبير حجم ملف السجل", "تغيير اسم الجهاز"], "a": 0}, {"k": "tf", "q": "ملفات إعداد الخدمات في Linux تُحفظ أساساً في /var/log.", "e": "الإعدادات تحت /etc. المجلد /var/log للسجلات.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "8.5 The Linux File System", "kind": "lesson", "cs": [{"t": "The File System Types in Linux", "b": "<p>Linux يدعم أنظمة ملفات كثيرة:<\/p><ul><li><b>ext2<\/b>: قديم، بلا Journal. يناسب وسائط Flash لأنه يقلل الكتابة.<\/li><li><b>ext3<\/b>: يضيف <b>Journaling<\/b>: سجل للتغييرات قبل تنفيذها، يحمي من تلف البيانات عند انقطاع الكهرباء.<\/li><li><b>ext4<\/b>: الافتراضي في معظم التوزيعات. يدعم ملفات أكبر وأداء أفضل.<\/li><li><b>NFS<\/b> (Network File System): نظام شبكي: مجلد على خادم يظهر كأنه محلي.<\/li><li><b>CDFS<\/b>: لأقراص CD.<\/li><li><b>Swap<\/b>: مساحة على القرص يستخدمها النظام كامتداد للذاكرة حين تمتلئ الـ RAM.<\/li><li><b>HFS+<\/b> و <b>APFS<\/b>: لأنظمة Apple.<\/li><li><b>MBR<\/b>: ليس نظام ملفات؛ هو أول قطاع في القرص، فيه جدول الأقسام وكود الإقلاع.<\/li><\/ul><p><b>Mounting<\/b>: ربط قسم أو جهاز بمجلد في شجرة الملفات (<b>Mount point<\/b>) ليصير محتواه متاحاً. الأمر <code dir=\"ltr\">mount<\/code> يعرض المربوط حالياً، وكل شيء يتفرع من الجذر <code dir=\"ltr\">/<\/code>. لا توجد أحرف أقراص كما في Windows.<\/p>", "q": {"k": "mc", "q": "ما الميزة التي أضافها ext3 على ext2؟", "e": "الـ Journal يسجل التغيير قبل تنفيذه، فيمكن استكمال العمليات الناقصة أو التراجع عنها بعد عطل.", "o": ["التشفير الإلزامي", "Journaling الذي يحمي من تلف البيانات عند الانقطاع المفاجئ", "دعم Windows"], "a": 1}}, {"t": "Linux Roles and File Permissions", "b": "<p>لكل ملف <b>مالك<\/b> (User) و<b>مجموعة<\/b> (Group)، وثلاث فئات صلاحيات: للمالك، للمجموعة، وللآخرين (<b>Others<\/b>). ولكل فئة ثلاث صلاحيات:<\/p><ul><li><b>r<\/b> (Read): قراءة. قيمتها 4.<\/li><li><b>w<\/b> (Write): كتابة. قيمتها 2.<\/li><li><b>x<\/b> (Execute): تنفيذ (وللمجلد: الدخول إليه). قيمتها 1.<\/li><\/ul><p>مخرج <code dir=\"ltr\">ls -l<\/code>:<\/p><pre dir=\"ltr\"><code>-rwxr-x--- 1 analyst staff 2048 Mar 12 10:00 scan.sh<\/code><\/pre><p>الحرف الأول نوع العنصر (<code dir=\"ltr\">-<\/code> ملف، <code dir=\"ltr\">d<\/code> مجلد، <code dir=\"ltr\">l<\/code> رابط). ثم ثلاث ثلاثيات: <code dir=\"ltr\">rwx<\/code> للمالك، <code dir=\"ltr\">r-x<\/code> للمجموعة، <code dir=\"ltr\">---<\/code> للآخرين.<\/p><p>بالأرقام (<b>Octal<\/b>)، تُجمع قيم كل ثلاثية:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>r<\/mi><mi>w<\/mi><mi>x<\/mi><mo>=<\/mo><mn>4<\/mn><mo>+<\/mo><mn>2<\/mn><mo>+<\/mo><mn>1<\/mn><mo>=<\/mo><mn>7<\/mn><mspace width=\"0.4em\"/><mo>,<\/mo><mspace width=\"0.4em\"/><mi>r<\/mi><mtext>-<\/mtext><mi>x<\/mi><mo>=<\/mo><mn>4<\/mn><mo>+<\/mo><mn>0<\/mn><mo>+<\/mo><mn>1<\/mn><mo>=<\/mo><mn>5<\/mn><mspace width=\"0.4em\"/><mo>,<\/mo><mspace width=\"0.4em\"/><mtext>---<\/mtext><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math><\/p><p>فصلاحيات الملف أعلاه <b>750<\/b>. التغيير: <code dir=\"ltr\">chmod 640 file<\/code> و <code dir=\"ltr\">chown user:group file<\/code>.<\/p><p>حساب <b>root<\/b> يتجاوز كل الصلاحيات. والصلاحية 777 (الكل يقرأ ويكتب وينفذ) خطأ شائع وخطير.<\/p>", "q": {"k": "mc", "q": "ما الصلاحيات التي يمثلها <code dir=\"ltr\">chmod 640<\/code>؟", "e": "6 = 4+2 (rw-) للمالك، 4 (r--) للمجموعة، 0 (---) للآخرين.", "o": ["الكل يقرأ ويكتب", "المالك يقرأ ويكتب، المجموعة تقرأ، الآخرون بلا صلاحية", "المالك ينفذ فقط"], "a": 1}}, {"t": "Hard Links and Symbolic Links", "b": "<p><b>Link<\/b> طريقة للإشارة إلى ملف باسم آخر. نوعان:<\/p><ul><li><b>Hard link<\/b>: اسم ثانٍ يشير مباشرة إلى البيانات نفسها على القرص (إلى الـ <b>inode<\/b> نفسه). الاسمان متساويان تماماً. إن حُذف الأصلي بقيت البيانات متاحة عبر الآخر. لا يعبر حدود نظام الملفات، ولا يُنشأ لمجلد.<\/li><\/ul><pre dir=\"ltr\"><code>ln file.txt hard.txt<\/code><\/pre><ul><li><b>Symbolic link<\/b> (أو Soft link): ملف صغير يحوي <b>مسار<\/b> الملف الهدف، كالاختصار في Windows. إن حُذف الهدف صار الرابط معطوباً (<b>Broken<\/b>). يعبر أنظمة الملفات ويصلح للمجلدات.<\/li><\/ul><pre dir=\"ltr\"><code>ln -s file.txt soft.txt<\/code><\/pre><p>في <code dir=\"ltr\">ls -l<\/code> يظهر الرابط الرمزي بحرف <code dir=\"ltr\">l<\/code> في أوله وسهم يشير للهدف. والـ <b>inode<\/b> هو السجل الذي يحفظ فيه نظام الملفات بيانات الملف الوصفية وموقعه.<\/p><div class=\"note\">تمرين (بديل Lab 8.5.4): أنشئ ملفاً، ثم رابطاً من كل نوع، ونفّذ <code dir=\"ltr\">ls -li<\/code> (الخيار <code dir=\"ltr\">i<\/code> يعرض رقم الـ inode). لاحظ أن الـ Hard link يحمل الرقم نفسه. احذف الأصل واقرأ الرابطين: أيهما يعمل؟ ثم جرّب <code dir=\"ltr\">chmod 600<\/code> على ملف وحاول قراءته من حساب آخر.<\/div>", "q": {"k": "mc", "q": "حذفت الملف الأصلي. أي الرابطين ما زال يفتح المحتوى؟", "e": "الـ Hard link يشير للبيانات نفسها فتبقى. الـ Symbolic link يشير لمسار لم يعد موجوداً فينكسر.", "o": ["Hard link", "Symbolic link", "كلاهما"], "a": 0}}], "test": [{"k": "mc", "q": "ملف مفتاح SSH خاص صلاحياته <code dir=\"ltr\">-rw-rw-rw-<\/code>. ما المشكلة وما الإصلاح؟", "e": "المفتاح الخاص سر صاحبه وحده. 600 تعني قراءة وكتابة للمالك فقط. و 777 تزيد الأمر سوءاً.", "o": ["لا مشكلة", "الكل يستطيع قراءته وتعديله، والإصلاح chmod 600", "ينقصه x، والإصلاح chmod 777"], "a": 1}, {"k": "mc", "q": "ما القيمة الرقمية للصلاحيات <code dir=\"ltr\">rwxr-xr--<\/code>؟", "e": "rwx = 7، r-x = 5، r-- = 4.", "o": ["777", "754", "644"], "a": 1}]}, {"t": "8.6 Working with the Linux GUI", "kind": "lesson", "cs": [{"t": "X Window System", "b": "<p>الواجهة الرسومية في Linux ليست جزءاً من الـ Kernel؛ هي برامج تعمل فوقه، ويمكن الاستغناء عنها تماماً (معظم الخوادم بلا واجهة).<\/p><p><b>X Window System<\/b> (ويسمى X أو X11) هو الإطار الأساسي للواجهات الرسومية: يوفر وظائف رسم النوافذ وتحريكها والتعامل مع لوحة المفاتيح والفأرة. لا يحدد شكل الواجهة؛ ذلك عمل <b>Window manager<\/b> و <b>Desktop environment<\/b> فوقه.<\/p><p>خاصية مميزة: X يعمل بنموذج Client-Server، فالبرنامج قد يعمل على جهاز ويعرض نافذته على شاشة جهاز آخر عبر الشبكة.<\/p><p>التوزيعات الحديثة تنتقل إلى <b>Wayland<\/b>، بديل أحدث وأأمن: في X كل تطبيق يستطيع مراقبة مدخلات النوافذ الأخرى (ومنها ضغطات المفاتيح)، و Wayland يعزل التطبيقات عن بعضها.<\/p>", "q": {"k": "tf", "q": "الواجهة الرسومية جزء لا يتجزأ من Linux kernel ولا يعمل النظام دونها.", "e": "هي طبقة برامج اختيارية فوق الـ Kernel. الخوادم تعمل غالباً بسطر الأوامر فقط، وذلك يقلل سطح الهجوم.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "The Linux GUI", "b": "<p><b>Desktop environment<\/b> هو ما يحدد شكل الواجهة وأدواتها. أشهرها: <b>GNOME<\/b>، <b>KDE Plasma<\/b>، <b>Xfce<\/b>، <b>Cinnamon<\/b>. تختار منها ما تشاء، وكلها فوق النظام نفسه.<\/p><p>عناصر واجهة مثل GNOME:<\/p><ul><li><b>Top/Menu bar<\/b>: شريط علوي فيه قوائم التطبيق والساعة والإعدادات السريعة.<\/li><li><b>Dock / Launcher<\/b>: شريط جانبي للتطبيقات المفضلة والمفتوحة.<\/li><li><b>Apps menu / Dash<\/b>: قائمة كل التطبيقات مع بحث.<\/li><li><b>Status menu<\/b>: الشبكة والصوت والطاقة.<\/li><li><b>Workspaces<\/b>: أسطح مكتب افتراضية متعددة.<\/li><\/ul><p>للمحلل: الواجهة مريحة لأدوات مثل Wireshark، لكن على الخوادم يُفضَّل عدم تثبيتها: برامج أقل تعني ثغرات أقل وموارد أوفر.<\/p>", "q": {"k": "mc", "q": "لماذا تُترك الخوادم غالباً دون واجهة رسومية؟", "e": "الواجهة حزم كثيرة لا يحتاجها الخادم. إزالتها جزء من الـ Hardening.", "o": ["لأن Linux لا يدعمها", "لتقليل البرامج المثبتة (سطح الهجوم) وتوفير الموارد", "لأنها تمنع SSH"], "a": 1}}], "test": []}, {"t": "8.7 Working on a Linux Host", "kind": "lesson", "cs": [{"t": "Installing and Running Applications on a Linux Host", "b": "<p>البرامج في Linux تُوزَّع كـ <b>Packages<\/b> (حزم)، ويثبّتها <b>Package manager<\/b> يجلب الحزمة ومعها كل ما تعتمد عليه (<b>Dependencies<\/b>) من مستودعات موثوقة (<b>Repositories<\/b>) يديرها القائمون على التوزيعة.<\/p><div class=\"tw\"><table><tr><th>التوزيعات<\/th><th>مدير الحزم<\/th><th>صيغة الحزمة<\/th><\/tr><tr><td>Debian, Ubuntu, Kali<\/td><td><code dir=\"ltr\">apt<\/code> (و <code dir=\"ltr\">dpkg<\/code>)<\/td><td><code dir=\"ltr\">.deb<\/code><\/td><\/tr><tr><td>Red Hat, Fedora, CentOS<\/td><td><code dir=\"ltr\">dnf<\/code> (و <code dir=\"ltr\">yum<\/code> قديماً)<\/td><td><code dir=\"ltr\">.rpm<\/code><\/td><\/tr><tr><td>Arch<\/td><td><code dir=\"ltr\">pacman<\/code><\/td><td><\/td><\/tr><\/table><\/div><pre dir=\"ltr\"><code>sudo apt update\nsudo apt install wireshark\nsudo apt remove wireshark<\/code><\/pre><p><code dir=\"ltr\">apt update<\/code> يحدّث <b>قائمة<\/b> الحزم المتاحة فقط، ولا يثبّت شيئاً.<\/p><p>الميزة الأمنية: المستودعات الرسمية موقَّعة رقمياً، فمدير الحزم يتحقق أن الحزمة لم يُعبث بها. تثبيت برنامج من موقع مجهول أو نسخ أمر تثبيت من صفحة ويب وتشغيله بـ sudo يتجاوز هذه الحماية.<\/p>", "q": {"k": "mc", "q": "ما الفائدة الأمنية للتثبيت من المستودعات الرسمية عبر مدير الحزم؟", "e": "التوقيع الرقمي يضمن أن الحزمة هي ما نشره القائمون على التوزيعة دون تعديل.", "o": ["أنها أسرع فقط", "أن الحزم موقَّعة رقمياً فيُتحقق من مصدرها وسلامتها", "أنها لا تحتاج sudo"], "a": 1}}, {"t": "Keeping the System Up to Date", "b": "<p>التحديثات (<b>Patches<\/b>) تسد الثغرات المكتشفة. نظام غير محدّث هدف سهل، لأن استغلال الثغرات المعروفة متاح علناً.<\/p><p>في Debian/Ubuntu:<\/p><pre dir=\"ltr\"><code>sudo apt update\nsudo apt upgrade<\/code><\/pre><ul><li><code dir=\"ltr\">apt update<\/code>: يجلب أحدث قائمة حزم ونسخها من المستودعات.<\/li><li><code dir=\"ltr\">apt upgrade<\/code>: ينزّل ويثبّت النسخ الأحدث لكل ما هو مثبّت.<\/li><\/ul><p>وفي Red Hat/Fedora: <code dir=\"ltr\">sudo dnf upgrade<\/code>.<\/p><p>على الخوادم تُفعَّل التحديثات الأمنية التلقائية (مثل حزمة <code dir=\"ltr\">unattended-upgrades<\/code>)، مع اختبار التحديثات الكبيرة أولاً في بيئة تجريبية. بعض التحديثات (خصوصاً الـ Kernel) تحتاج إعادة تشغيل ليبدأ مفعولها.<\/p>", "q": {"k": "mc", "q": "ما الفرق بين <code dir=\"ltr\">apt update<\/code> و <code dir=\"ltr\">apt upgrade<\/code>؟", "e": "دون <code dir=\"ltr\">update<\/code> لا يعلم النظام بوجود نسخ جديدة، ودون <code dir=\"ltr\">upgrade<\/code> لا تُثبَّت.", "o": ["لا فرق", "الأول يحدّث قائمة الحزم المتاحة، والثاني يثبّت النسخ الأحدث فعلياً", "الأول يحذف البرامج والثاني يثبتها"], "a": 1}}, {"t": "Processes and Forks", "b": "<p><b>Process<\/b> نسخة عاملة من برنامج. Linux نظام <b>Multitasking<\/b>: يشغّل عدة Processes معاً بتوزيع وقت المعالج بينها.<\/p><p><b>Forking<\/b>: طريقة إنشاء Process جديد. الـ Process يستدعي <code dir=\"ltr\">fork<\/code> فينسخ نفسه؛ الأصل يسمى <b>Parent<\/b> والنسخة <b>Child<\/b>. الابن يستطيع بعدها تحميل برنامج آخر مكانه. خادم الويب مثلاً يتفرع لنسخ عدة تخدم الزوار بالتوازي.<\/p><p>كل Process له <b>PID<\/b>، ويعرف رقم أبيه <b>PPID<\/b>. الجد الأعلى لكل شيء هو PID 1 (برنامج <b>systemd<\/b> في الأنظمة الحديثة).<\/p><div class=\"tw\"><table><tr><th>الأمر<\/th><th>وظيفته<\/th><\/tr><tr><td><code dir=\"ltr\">ps -ef<\/code><\/td><td>كل الـ Processes مع الـ PID و PPID<\/td><\/tr><tr><td><code dir=\"ltr\">top<\/code><\/td><td>عرض حي مرتب بالاستهلاك<\/td><\/tr><tr><td><code dir=\"ltr\">kill PID<\/code><\/td><td>طلب إنهاء Process (<code dir=\"ltr\">kill -9<\/code> إنهاء قسري)<\/td><\/tr><tr><td><code dir=\"ltr\">pstree<\/code><\/td><td>شجرة الأب والأبناء<\/td><\/tr><\/table><\/div><p>شجرة الأبوة دليل للمحلل: خادم ويب يلد Shell سلوك يدل غالباً على اختراق.<\/p>", "q": {"k": "mc", "q": "في مخرج <code dir=\"ltr\">ps -ef<\/c
