ode>، ماذا يمثل عمود PPID؟", "e": "PPID = Parent PID. يتيح تتبع من شغّل ماذا.", "o": ["حجم الذاكرة", "رقم الـ Process الأب الذي أنشأ هذا الـ Process", "أولوية التنفيذ"], "a": 1}}, {"t": "Malware on a Linux Host", "b": "<p>Linux <b>ليس محصناً<\/b> من Malware. هو أقل استهدافاً على حواسيب المستخدمين، لكن خوادمه وأجهزة IoT العاملة به هدف دائم. كيف يُصاب:<\/p><ul><li><b>خدمة مكشوفة فيها ثغرة<\/b>: خادم ويب أو SSH غير محدّث يُستغل عن بعد.<\/li><li><b>كلمات سر ضعيفة<\/b> تُخمَّن عبر SSH.<\/li><li><b>عميل<\/b> يتصل بخادم خبيث، أو متصفح يزور صفحة خبيثة.<\/li><li><b>مستخدم يشغّل<\/b> سكربتاً أو حزمة من مصدر غير موثوق بصلاحيات root.<\/li><\/ul><p>ماذا يفعل بعد الإصابة: يضم الجهاز إلى Botnet، يعدّن عملات رقمية بموارده، يسرق بيانات، أو يتخذه منصة لمهاجمة غيره.<\/p><p>الوقاية هي ما مرّ كله: تحديث، تقليل الخدمات، كلمات سر قوية أو مفاتيح، وعدم تشغيل ما لا تثق بمصدره.<\/p>", "q": {"k": "tf", "q": "أنظمة Linux لا تصاب بـ Malware، فلا حاجة لتحديثها أو مراقبتها.", "e": "خوادم Linux وأجهزة IoT تُستهدف باستمرار عبر الخدمات المكشوفة وكلمات السر الضعيفة.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Rootkit Check", "b": "<p>تذكير: الـ <b>Rootkit<\/b> يمنح المهاجم وصولاً بصلاحيات عالية ويخفي نفسه بتعديل النظام، حتى أنه قد يستبدل أوامر مثل <code dir=\"ltr\">ps<\/code> و <code dir=\"ltr\">ls<\/code> بنسخ لا تُظهره.<\/p><p><b>chkrootkit<\/b> أداة تفحص النظام بحثاً عن علامات Rootkits معروفة:<\/p><pre dir=\"ltr\"><code>sudo apt install chkrootkit\nsudo chkrootkit<\/code><\/pre><p>المخرج قائمة فحوص، بجانب كل منها <code dir=\"ltr\">not infected<\/code> أو <code dir=\"ltr\">not found<\/code>، أو <code dir=\"ltr\">INFECTED<\/code> إن وُجدت علامة. وأداة مشابهة اسمها <b>rkhunter<\/b>.<\/p><p>حدودها: تكشف المعروف فقط، وقد تعطي إنذارات كاذبة. والأهم: أداة تعمل <b>من داخل<\/b> نظام مخترق لا يوثق بنتائجها كلياً، لأن الـ Rootkit يتحكم في ما تراه. الفحص الأوثق يجري من وسيط إقلاع خارجي نظيف. وإن تأكدت الإصابة فالعلاج الموثوق مسح الجهاز وإعادة تثبيته من مصدر سليم، ثم تغيير كل كلمات السر والمفاتيح.<\/p>", "q": {"k": "mc", "q": "لماذا لا يُوثق كلياً بنتيجة فحص Rootkit يُجرى من داخل النظام المصاب؟", "e": "الأداة تعتمد على النظام نفسه لترى الملفات والـ Processes، والـ Rootkit يزيّف ما يعرضه النظام.", "o": ["لأن الأداة بطيئة", "لأن الـ Rootkit يتحكم في النظام وقد يخفي نفسه عن الأداة", "لأن الفحص يحتاج إنترنت"], "a": 1}}, {"t": "Piping Commands", "b": "<p>معظم أوامر Linux صغيرة وتؤدي مهمة واحدة. قوتها في ربطها: الرمز <code dir=\"ltr\">|<\/code> (<b>Pipe<\/b>) يأخذ مخرج الأمر الأول ويجعله مدخل الثاني.<\/p><pre dir=\"ltr\"><code>ls -l /etc | grep ssh\nps -ef | grep nginx\ncat /var/log/auth.log | grep &quot;Failed password&quot; | wc -l\nsudo grep &quot;Failed password&quot; /var/log/auth.log | awk &#x27;{print $(NF-3)}&#x27; | sort | uniq -c | sort -nr | head<\/code><\/pre><ul><li>الأول: يعرض محتويات <code dir=\"ltr\">/etc<\/code> ويبقي الأسطر التي فيها ssh.<\/li><li>الثاني: يبحث عن Process باسم nginx.<\/li><li>الثالث: يعدّ محاولات الدخول الفاشلة (<code dir=\"ltr\">wc -l<\/code> يعدّ الأسطر).<\/li><li>الرابع: يستخرج عنوان المهاجم من كل سطر، ثم يعدّ تكرار كل عنوان ويرتبها تنازلياً. هكذا تعرف أكثر العناوين محاولةً في ثوانٍ.<\/li><\/ul><p>رموز قريبة: <code dir=\"ltr\">&gt;<\/code> يكتب المخرج في ملف (ويمسح ما فيه)، و <code dir=\"ltr\">&gt;&gt;<\/code> يضيف لآخر الملف.<\/p><div class=\"note\">تمرين (بديل Lab 8.7.8): على VM نفّذ <code dir=\"ltr\">sudo ss -tulnp<\/code>، وأوقف خدمة لا تحتاجها، وتأكد من صلاحيات <code dir=\"ltr\">/etc/shadow<\/code> بـ <code dir=\"ltr\">ls -l<\/code>، وشغّل <code dir=\"ltr\">chkrootkit<\/code>. ثم قارن بما فعلته في Windows: Defender والـ Firewall والتحديثات.<\/div>", "q": {"k": "mc", "q": "ماذا يفعل <code dir=\"ltr\">ps -ef | grep ssh<\/code>؟", "e": "الـ Pipe يمرر مخرج <code dir=\"ltr\">ps -ef<\/code> إلى <code dir=\"ltr\">grep<\/code> الذي يفلتره. الكتابة في ملف تتم بـ <code dir=\"ltr\">&gt;<\/code>.", "o": ["يحذف خدمة SSH", "يعرض من قائمة الـ Processes الأسطر التي تحتوي ssh فقط", "يكتب قائمة الـ Processes في ملف اسمه ssh"], "a": 1}}], "test": [{"k": "mc", "q": "على خادم Linux وجدت أن Process خادم الويب هو الأب لـ Process من نوع <code dir=\"ltr\">/bin/bash<\/code> يتصل بعنوان خارجي. ما تفسيرك؟", "e": "خادم الويب لا يشغّل Shell تفاعلياً في العمل العادي. هذه بصمة Remote Code Execution.", "o": ["سلوك طبيعي لخادم الويب", "دليل قوي على استغلال ثغرة في تطبيق الويب منحت المهاجم Shell", "تحديث تلقائي"], "a": 1}, {"k": "mc", "q": "أي تسلسل أوامر يحدّث نظام Ubuntu تحديثاً صحيحاً؟", "e": "تحديث القائمة أولاً ثم تثبيت النسخ الأحدث.", "o": ["sudo apt upgrade ثم sudo apt remove", "sudo apt update ثم sudo apt upgrade", "sudo apt install ثم sudo shutdown"], "a": 1}, {"k": "sa", "q": "اكتب أمراً واحداً بـ Pipe يعدّ عدد الأسطر التي فيها كلمة error في الملف <code dir=\"ltr\">/var/log/syslog<\/code>.", "e": "<code dir=\"ltr\">grep &quot;error&quot; /var/log/syslog | wc -l<\/code> (ويصح أيضاً <code dir=\"ltr\">grep -c &quot;error&quot; /var/log/syslog<\/code>). <code dir=\"ltr\">grep<\/code> يستخرج الأسطر المطابقة و <code dir=\"ltr\">wc -l<\/code> يعدّها.", "kw": [["grep"], ["wc", "-c"]]}]}, {"t": "8.8 ملخص الوحدة 8 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li>Linux نظام مفتوح المصدر؛ التوزيعات تجمع الـ Kernel مع الأدوات. Kali لاختبار الاختراق و Security Onion للمراقبة.<\/li><li>أدوات الـ SOC: Packet capture، IDS، Firewall، Log manager، SIEM، Ticketing.<\/li><li>الـ Shell: <code dir=\"ltr\">pwd<\/code> <code dir=\"ltr\">ls<\/code> <code dir=\"ltr\">cd<\/code> <code dir=\"ltr\">cp<\/code> <code dir=\"ltr\">mv<\/code> <code dir=\"ltr\">rm<\/code> <code dir=\"ltr\">cat<\/code> <code dir=\"ltr\">grep<\/code> <code dir=\"ltr\">sudo<\/code> <code dir=\"ltr\">man<\/code>. المحرران nano و vim. الإعدادات ملفات نصية.<\/li><li>الخدمات تستمع على Ports. <code dir=\"ltr\">ss -tulnp<\/code> و Nmap لمعرفة المفتوح. <code dir=\"ltr\">systemctl<\/code> لإدارة الخدمات.<\/li><li>الإعدادات في <code dir=\"ltr\">/etc<\/code> والسجلات في <code dir=\"ltr\">/var/log<\/code> (و <code dir=\"ltr\">journalctl<\/code>). الـ Hardening: تقليل، تعطيل، تحديث، SSH آمن.<\/li><li>ext4 بـ Journaling. الصلاحيات rwx للمالك والمجموعة والآخرين (4، 2، 1). Hard link و Symbolic link.<\/li><li>X/Wayland وبيئات سطح المكتب اختيارية.<\/li><li>مدير الحزم والتحديث. الـ Processes والـ fork. Linux يُصاب بـ Malware. <code dir=\"ltr\">chkrootkit<\/code>. الـ Pipe.<\/li><\/ul>", "q": {"k": "mc", "q": "أي ثلاثي أوامر يكشف لك ما يعمل وما يستمع وما سُجّل على خادم Linux؟", "e": "الـ Processes، والمنافذ المستمعة، والسجلات هي نقاط البدء في فحص أي خادم.", "o": ["ps -ef و ss -tulnp و journalctl أو قراءة /var/log", "pwd و cd و mkdir", "nano و vim و touch"], "a": 0}}], "test": []}, {"t": "اختبار الوحدة 8", "kind": "exam", "pool": [9], "n": 12}]}, {"n": "9", "t": "الوحدة 9: System and Endpoint Protection", "secs": [{"t": "9.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>الـ Endpoint هو المكان الذي تُفتح فيه الرسائل وتُشغَّل الملفات، فمعظم الهجمات تنتهي عنده أو تبدأ منه. حماية الشبكة وحدها لا تكفي: الـ Laptop يغادر المبنى، والحركة المشفرة تمر بأجهزة الشبكة دون أن تُفحص.<\/p><p>ستتعلم:<\/p><ul><li><b>الدفاع عن الأنظمة والأجهزة<\/b>: تأمين نظام التشغيل، التحديثات، التشفير، سلامة الإقلاع، والحماية الفيزيائية.<\/li><li><b>الحماية من Malware<\/b> على الجهاز وعلى الشبكة.<\/li><li><b>منع التسلل على الجهاز<\/b>: Host-based firewall و HIDS.<\/li><li><b>أمن التطبيقات<\/b>: سطح الهجوم، قوائم السماح والحظر، والـ Sandbox.<\/li><\/ul><p>هذه الوحدة تجمع ما تعلمته عن Windows و Linux في منهج حماية واحد.<\/p>", "q": {"k": "mc", "q": "لماذا لا تكفي حماية محيط الشبكة لتأمين الـ Endpoints؟", "e": "حماية المحيط تغطي ما يمر بها فقط. الجهاز خارج المبنى أو المصاب عبر USB لا تراه.", "o": ["لأن الـ Firewall لا يعمل ليلاً", "لأن الأجهزة تغادر الشبكة، والحركة المشفرة تمر دون فحص، والتهديد قد يبدأ من الداخل", "لأن الـ Endpoints لا تتصل بالشبكة"], "a": 1}}], "test": []}, {"t": "9.1 Defending Systems and Devices", "kind": "lesson", "cs": [{"t": "Operating System Security", "b": "<p>نظام التشغيل هو القاعدة التي يقوم عليها كل شيء في الجهاز، فتأمينه أول واجب. المدير يؤمّنه بـ:<\/p><ul><li><b>Good administration<\/b>: إدارة منضبطة: تغيير الإعدادات الافتراضية (خصوصاً كلمات السر)، وحذف الحسابات غير المستخدمة.<\/li><li><b>Systematic configuration<\/b>: إعداد منهجي موحد وفق معيار مكتوب، وليس اجتهاداً لكل جهاز.<\/li><li><b>Baseline<\/b>: توثيق الحالة الطبيعية للنظام وأدائه، ثم مقارنة الحالة الحالية بها دورياً. الانحراف يستدعي الفحص.<\/li><li><b>إزالة البرامج والخدمات غير اللازمة<\/b>.<\/li><li><b>تحديثات وترقيعات<\/b> منتظمة.<\/li><li><b>مراجعة السجلات<\/b>.<\/li><\/ul><p>هذا هو الـ <b>Hardening<\/b> الذي طبقته في Linux، وهو واحد في كل الأنظمة: قلّل ما يعمل، حدّث ما بقي، وراقب.<\/p><p>«Points to Remember» في الدورة الأصلية تلخصها: نظام غير محدّث، أو بإعداداته الافتراضية، أو يشغّل ما لا يلزم، هدف سهل.<\/p>", "q": {"k": "mc", "q": "ما فائدة توثيق Baseline لنظام التشغيل؟", "e": "الـ Baseline يجيب عن سؤال «ما الطبيعي؟»، فيظهر التغيير غير المتوقع عند المقارنة.", "o": ["تسريع الإقلاع", "توفير مرجع للحالة الطبيعية يُكشف الانحراف بمقارنته", "تشفير الملفات"], "a": 1}}, {"t": "Patch Management", "b": "<p><b>Patch<\/b> تحديث برمجي يصدره الصانع ليسد ثغرة أو يصلح خللاً. <b>Service pack<\/b> مجموعة شاملة من الترقيعات والتحديثات.<\/p><p><b>Patch management<\/b> عملية منظمة وليست ضغطة زر:<\/p><ul><li><b>جرد<\/b>: معرفة كل الأجهزة والبرامج ونسخها. لا ترقّع ما لا تعلم بوجوده.<\/li><li><b>متابعة<\/b>: رصد التحديثات والثغرات الجديدة.<\/li><li><b>اختبار<\/b>: تجربة الـ Patch على مجموعة صغيرة، فقد يعطل تطبيقاً.<\/li><li><b>نشر<\/b>: تعميمه، مع جدولة تتجنب تعطيل العمل.<\/li><li><b>تحقق<\/b>: التأكد أنه ثُبّت فعلاً على الجميع، ومعالجة المتخلفين.<\/li><\/ul><p>المؤسسات تستخدم خادماً مركزياً يفرض التحديث ويعطي تقريراً. المدير يستطيع الموافقة على تحديثات أو تأجيلها، وفرض التثبيت في موعد محدد.<\/p><p>الموازنة: التعجل قد يعطل عملاً، والتأخر يترك ثغرة معروفة مفتوحة. الثغرات المستغلة فعلياً تُرقَّع أولاً.<\/p>", "q": {"k": "mc", "q": "لماذا تُختبر الـ Patches قبل نشرها على كل الأجهزة؟", "e": "الـ Patch يغيّر النظام، وقد يكسر توافق تطبيق مهم. الاختبار على عينة يكشف ذلك قبل التعميم.", "o": ["لأنها تحمل Malware دائماً", "لأنها قد تتعارض مع تطبيقات المؤسسة وتعطلها", "لتأخير الحماية عمداً"], "a": 1}}, {"t": "Endpoint Security", "b": "<p>طبقات حماية تعمل على الجهاز نفسه:<\/p><ul><li><b>Host-based firewall<\/b>: يفلتر الحركة الداخلة إلى الجهاز والخارجة منه.<\/li><li><b>HIDS<\/b> (Host Intrusion Detection System): يراقب نشاط الجهاز (ملفات النظام، السجلات، الـ Processes) وينبّه عند الشبهة.<\/li><li><b>HIPS<\/b> (Host Intrusion Prevention System): كالـ HIDS ويمنع أيضاً.<\/li><li><b>EDR<\/b> (Endpoint Detection and Response): يسجل نشاط الجهاز باستمرار، يحلله لكشف التهديدات المتقدمة، ويتيح الاستجابة عن بعد: عزل الجهاز، إيقاف Process، والتحقيق في ما جرى. امتداده <b>XDR<\/b> يربط بيانات الأجهزة بالشبكة والبريد والسحابة.<\/li><li><b>DLP<\/b> (Data Loss Prevention): يمنع خروج البيانات الحساسة من الجهاز (نسخ إلى USB، رفع إلى موقع).<\/li><li><b>NGFW<\/b>: مرّ في الوحدة 6، ويكمّل الحماية من جهة الشبكة.<\/li><\/ul><p>الفرق بين Antivirus و EDR: الأول يمنع المعروف عند الباب، والثاني يراقب ما بعد الدخول ويجيب عن «ماذا حدث وكيف؟».<\/p>", "q": {"k": "mc", "q": "محلل يريد عزل Laptop مصاب عن الشبكة فوراً وهو في مدينة أخرى، ثم معرفة تسلسل ما جرى عليه. أي أداة تمنحه ذلك؟", "e": "الـ EDR يسجل نشاط الجهاز ويتيح الاستجابة عن بعد، ومنها العزل والتحقيق.", "o": ["Antivirus تقليدي", "EDR", "Screen saver"], "a": 1}}, {"t": "Host Encryption", "b": "<p>التشفير يحمي البيانات إن وقع الجهاز في يد غريب:<\/p><ul><li><b>EFS<\/b> (Encrypting File System): ميزة في NTFS تشفّر <b>ملفات ومجلدات<\/b> بعينها، مرتبطة بحساب المستخدم. من يدخل بحساب آخر لا يقرؤها.<\/li><li><b>FDE<\/b> (Full Disk Encryption): تشفير <b>القرص كله<\/b> بما فيه نظام التشغيل والملفات المؤقتة. <b>BitLocker<\/b> هو أداة Windows لذلك، ونظيراتها <b>FileVault<\/b> في macOS و <b>LUKS<\/b> في Linux.<\/li><li><b>TPM<\/b> (Trusted Platform Module): شريحة على اللوحة الأم تحفظ مفاتيح التشفير بأمان وتتحقق من سلامة الجهاز. BitLocker يعتمد عليها فلا يُفك القرص إن نُقل لجهاز آخر.<\/li><li><b>BitLocker To Go<\/b>: لتشفير وسائط USB.<\/li><li><b>SED<\/b> (Self-Encrypting Drive): قرص يشفّر نفسه عتادياً.<\/li><\/ul><p>لماذا FDE أشمل؟ EFS يحمي ما اخترته فقط، وتبقى نسخ مؤقتة وملفات أخرى مكشوفة. FDE لا يترك شيئاً.<\/p><p>تنبيه: FDE يحمي والجهاز <b>مطفأ<\/b>. إن كان يعمل والمستخدم داخل، فالبيانات مفتوحة له ولأي Malware يعمل بحسابه.<\/p>", "q": {"k": "mc", "q": "ما وظيفة شريحة TPM مع BitLocker؟", "e": "الـ TPM يخزن المفتاح عتادياً ويفرج عنه فقط إن لم يتغير شيء في سلسلة الإقلاع.", "o": ["تسريع المعالج", "حفظ مفاتيح التشفير بأمان وربطها بالجهاز نفسه", "تخزين النسخ الاحتياطية"], "a": 1}}, {"t": "Boot Integrity", "b": "<p>هدف المهاجم المتقدم أن يعمل كوده <b>قبل<\/b> نظام التشغيل وبرامج الحماية. <b>Boot integrity<\/b> تضمن أن ما يُحمَّل عند الإقلاع موثوق.<\/p><ul><li><b>BIOS<\/b> القديم لا يتحقق من شيء. <b>UEFI<\/b> يحدد معايير حديثة ويدعم:<\/li><li><b>Secure Boot<\/b>: كل برنامج في سلسلة الإقلاع (مدير الإقلاع، الـ Kernel، الـ Drivers) يجب أن يحمل توقيعاً رقمياً موثوقاً، وإلا رُفض تحميله.<\/li><li><b>Measured Boot<\/b>: يحسب Hash لكل مكوّن يُحمَّل ويسجله في الـ TPM. لا يمنع الإقلاع، لكنه يتيح لخادم خارجي التحقق لاحقاً أن الجهاز أقلع بمكونات سليمة (<b>Remote attestation<\/b>).<\/li><li><b>Boot attestation<\/b>: التحقق من تلك القياسات.<\/li><\/ul><p>أي: Secure Boot يمنع غير الموقَّع، و Measured Boot يوثّق ما حُمّل ليُراجع.<\/p>", "q": {"k": "mc", "q": "ما الفرق بين Secure Boot و Measured Boot؟", "e": "Secure Boot وقائي (يمنع)، و Measured Boot توثيقي (يقيس ويسجل في الـ TPM).", "o": ["لا فرق", "الأول يرفض تحميل الكود غير الموقَّع، والثاني يسجل Hashes ما حُمّل للتحقق اللاحق", "الأول للهواتف والثاني للطابعات"], "a": 1}}, {"t": "Apple System Security Features", "b": "<p>أنظمة Apple (macOS و iOS) فيها حمايات مدمجة:<\/p><ul><li><b>Security-focused hardware<\/b>: شريحة <b>Secure Enclave<\/b> معزولة تحفظ المفاتيح وبيانات البصمة والوجه.<\/li><li><b>Encrypted storage<\/b>: تشفير القرص بـ <b>FileVault<\/b>، والمفاتيح محمية بالعتاد.<\/li><li><b>Secure boot<\/b>: لا يُحمَّل إلا نظام موقَّع من Apple.<\/li><li><b>Secure biometric data<\/b>: بيانات Touch ID و Face ID لا تغادر الـ Secure Enclave.<\/li><li><b>Find My<\/b>: تحديد موقع الجهاز المفقود وقفله أو مسحه عن بعد.<\/li><li><b>Gatekeeper<\/b>: يسمح بتشغيل البرامج الموقَّعة من مطورين معروفين فقط.<\/li><li><b>XProtect<\/b>: فحص Malware مدمج بالتواقيع.<\/li><li><b>MRT<\/b> (Malware Removal Tool): يزيل ما يُكتشف.<\/li><\/ul><p>الدرس: لا يوجد نظام «لا يُصاب». أجهزة Apple تحتاج تحديثاً وحذراً كغيرها.<\/p>", "q": {"k": "mc", "q": "أي ميزة في macOS تمنع تشغيل برنامج غير موقَّع من مطور معروف؟", "e": "Gatekeeper يتحقق من توقيع البرنامج قبل تشغيله. FileVault للتشفير.", "o": ["FileVault", "Gatekeeper", "Find My"], "a": 1}}, {"t": "Managing Device Threats", "b": "<p>ضوابط عملية لإدارة تهديدات الأجهزة:<\/p><ul><li><b>Antimalware<\/b> محدّث مع فحوص مجدولة.<\/li><li><b>Patch management<\/b>.<\/li><li><b>Host-based firewall و HIDS<\/b>.<\/li><li><b>التحكم في المحتوى<\/b>: فلترة المواقع والبريد.<\/li><li><b>سياسات الوسائط<\/b>: منع أو تقييد USB.<\/li><li><b>قفل الشاشة التلقائي<\/b> وكلمات سر قوية و MFA.<\/li><li><b>Least Privilege<\/b>: لا صلاحيات مدير للعمل اليومي.<\/li><li><b>تعطيل ما لا يلزم<\/b>: خدمات، منافذ، Bluetooth.<\/li><li><b>نسخ احتياطي<\/b>.<\/li><li><b>إدارة مركزية<\/b> (MDM أو أدوات إدارة الأجهزة) تفرض كل ما سبق وتبلّغ عن المخالف.<\/li><li><b>إيقاف تشغيل تلقائي<\/b> للوسائط (AutoRun).<\/li><\/ul><p>كل بند يسد باباً، ولا يغني بند عن غيره.<\/p>", "q": {"k": "mc", "q": "موظف وصل USB مجهولاً فتشغّل منه برنامج تلقائياً. أي ضابطين كانا سيمنعان ذلك؟", "e": "منع التشغيل التلقائي ومنع الوسائط غير المصرح بها يغلقان هذا المدخل تماماً.", "o": ["تعطيل AutoRun وسياسة تقييد وسائط USB", "زيادة سطوع الشاشة وتغيير الخلفية", "تعطيل النسخ الاحتياطي"], "a": 0}}, {"t": "Physical Protection of Devices", "b": "<p>من يصل للجهاز بيده يتجاوز معظم الحمايات البرمجية. الحماية الفيزيائية:<\/p><ul><li><b>Computer equipment<\/b>: أقفال كابلات (<b>Cable locks<\/b>) تربط الـ Laptop بالمكتب، وغرف خوادم مقفلة.<\/li><li><b>Door locks<\/b>: أقفال بمفتاح، أو برمز، أو ببطاقة. الرمز المشترك يتسرب، والبطاقة تسجل من دخل ومتى.<\/li><li><b>RFID systems<\/b>: وسوم راديوية تُلصق بالأصول لتتبع موقعها وجردها.<\/li><li><b>Privacy screens<\/b>: تمنع الرؤية من الجوانب (ضد Shoulder surfing).<\/li><li><b>كاميرات مراقبة وحراس وسجل زوار<\/b>.<\/li><li><b>قفل الشاشة<\/b> عند مغادرة المكتب.<\/li><li><b>Faraday cage<\/b>: حاوية تحجب الموجات الكهرومغناطيسية، تُستخدم لحفظ الأدلة الرقمية أو حماية أجهزة حساسة من التنصت والتشويش.<\/li><li><b>إتلاف آمن<\/b> للأقراص القديمة قبل التخلص منها.<\/li><\/ul>", "q": {"k": "mc", "q": "ما ميزة قفل الباب بالبطاقة على القفل برمز مشترك؟", "e": "البطاقة فردية فتعطي مساءلة (Accountability) وإلغاءً فردياً. الرمز المشترك لا يميز بين الداخلين.", "o": ["أرخص ثمناً", "يسجل هوية كل داخل ووقته، ويمكن إلغاء بطاقة واحدة دون تغيير الباقي", "لا يحتاج كهرباء"], "a": 1}}, {"t": "تمرين: Harden a Linux System", "b": "<p>بديل Labs 9.1.13 و 9.1.14. الـ Lab الأصلي يستخدم أداة التدقيق <b>Lynis<\/b>، التي تفحص النظام وتعطي درجة وقائمة توصيات. على VM:<\/p><pre dir=\"ltr\"><code>sudo apt install lynis\nsudo lynis audit system<\/code><\/pre><p>اقرأ قسمي <code dir=\"ltr\">Warnings<\/code> و <code dir=\"ltr\">Suggestions<\/code> في آخر التقرير، ورقم <code dir=\"ltr\">Hardening index<\/code>.<\/p><p>ثم طبّق يدوياً قائمة قصيرة وأعد الفحص لترى ارتفاع الدرجة:<\/p><ul><li><code dir=\"ltr\">sudo apt update<\/code> ثم <code dir=\"ltr\">sudo apt upgrade<\/code>.<\/li><li><code dir=\"ltr\">sudo ss -tulnp<\/code> وتعطيل ما لا يلزم بـ <code dir=\"ltr\">systemctl disable --now<\/code>.<\/li><li>في <code dir=\"ltr\">/etc/ssh/sshd_config<\/code>: السطر <code dir=\"ltr\">PermitRootLogin no<\/code>.<\/li><li>تفعيل الـ Firewall: <code dir=\"ltr\">sudo ufw enable<\/code> ثم <code dir=\"ltr\">sudo ufw status<\/code>.<\/li><li><code dir=\"ltr\">ls -l /etc/shadow<\/code> والتأكد أن الآخرين لا يقرؤونه.<\/li><\/ul><p>إن لم تتوفر VM: اكتب القائمة كخطة ورتّبها بحسب الأثر.<\/p>", "q": {"k": "mc", "q": "ما الذي تقدمه أداة تدقيق مثل Lynis؟", "e": "هي أداة Audit: تقيس وتوصي ولا تغيّر. التطبيق عليك.", "o": ["تشفير القرص", "فحص إعدادات النظام مقابل ممارسات التقوية وإعطاء توصيات ودرجة", "إزالة Rootkits تلقائياً"], "a": 1}}, {"t": "تمرين: Recover Passwords (مفاهيمياً)", "b": "<p>Labs 9.1.15 و 9.1.16 توضح لماذا تسقط كلمات السر الضعيفة. الهدف أن تفهم الآلية لتضع سياسة جيدة.<\/p><p>كيف تُخزَّن كلمة السر: لا تُحفظ نصاً، وإنما يُحفظ الـ <b>Hash<\/b> الخاص بها (في Linux داخل <code dir=\"ltr\">/etc/shadow<\/code>). عند الدخول يُحسب Hash ما كتبته ويُقارن.<\/p><p>كيف تُكسر إن سُرّب ملف الـ Hashes: الـ Hash لا يُعكس، لكن المهاجم <b>يخمّن<\/b>: يحسب Hash لكل كلمة مرشحة ويقارن.<\/p><ul><li><b>Dictionary attack<\/b>: تجربة قائمة كلمات شائعة ومسرّبة.<\/li><li><b>Brute force<\/b>: تجربة كل التركيبات. عددها <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mi>N<\/mi><mrow><mi>L<\/mi><\/mrow><\/msup><\/mrow><\/math>، فالوقت يتضاعف أسياً مع الطول.<\/li><li><b>Rainbow tables<\/b>: جداول Hashes محسوبة مسبقاً.<\/li><\/ul><p>الدفاع:<\/p><ul><li><b>Salt<\/b>: قيمة عشوائية تضاف لكل كلمة قبل حساب الـ Hash، فتبطل الجداول الجاهزة وتجعل الكلمة الواحدة عند مستخدمين مختلفين بـ Hashes مختلفة.<\/li><li>خوارزميات Hash بطيئة عمداً (bcrypt، Argon2).<\/li><li>كلمات طويلة وغير شائعة، ومدير كلمات سر، و MFA.<\/li><\/ul>", "q": {"k": "mc", "q": "ما فائدة الـ Salt في تخزين كلمات السر؟", "e": "بإضافة قيمة عشوائية فريدة لكل حساب، لا تنفع الجداول المحسوبة مسبقاً، ولا يُكشف أن مستخدمين يتشاركان الكلمة.", "o": ["يجعل الكلمة أقصر", "يبطل جداول الـ Hashes الجاهزة ويجعل Hash الكلمة نفسها مختلفاً لكل مستخدم", "يشفّر القرص"], "a": 1}}], "test": [{"k": "mc", "q": "Laptop فيه BitLocker سُرق وهو مطفأ. وآخر سُرق وهو مفتوح والمستخدم داخل. أيهما بياناته في خطر أكبر؟", "e": "FDE يحمي البيانات والجهاز مطفأ أو مقفل قبل الإقلاع. الجهاز العامل بجلسة مفتوحة مكشوف.", "o": ["الأول", "الثاني، لأن القرص مفكوك التشفير والجلسة مفتوحة", "متساويان"], "a": 1}, {"k": "mc", "q": "أي ترتيب صحيح لعملية Patch management؟", "e": "تعرف ما لديك، ترصد التحديثات، تختبر، تعمّم، ثم تتأكد.", "o": ["نشر ثم اختبار ثم جرد", "جرد ثم متابعة ثم اختبار ثم نشر ثم تحقق", "تحقق ثم نشر ثم جرد"], "a": 1}, {"k": "sa", "q": "لماذا كلمة سر من 16 حرفاً أقوى بكثير من كلمة من 8 أحرف من الأبجدية نفسها؟", "e": "عدد التركيبات هو N أس L، فمضاعفة الطول تربّع عدد الاحتمالات. الوقت اللازم لـ Brute force ينمو أسياً مع الطول.", "kw": [["أس", "تركيب", "احتمال", "combin", "exponent", "n^l", "مضاعف", "عدد"]]}]}, {"t": "9.2 Antimalware Protection", "kind": "lesson", "cs": [{"t": "Endpoint Threats", "b": "<p><b>Endpoint<\/b> هو أي جهاز على الشبكة يستطيع الوصول إلى أجهزة أخرى أو تصل إليه: حواسيب، خوادم، هواتف، طابعات، كاميرات، وأجهزة IoT. كل واحد منها قد يُصاب ثم يُستخدم جسراً إلى غيره.<\/p><p>لماذا يتفاقم التهديد:<\/p><ul><li>عدد الأجهزة يتزايد، وكثير من أجهزة IoT بلا تحديثات وبكلمات سر افتراضية.<\/li><li>الأجهزة المتنقلة تتصل بشبكات غير موثوقة ثم تعود لشبكة المؤسسة.<\/li><li>الـ Malware يتطور أسرع من التواقيع. أنواع متحولة (<b>Polymorphic<\/b>) تغيّر شكلها مع كل نسخة.<\/li><li>معظم الحركة مشفرة، فلا تراها أجهزة الشبكة.<\/li><\/ul><p>النتيجة: لا تكفي حماية واحدة، ويجب الجمع بين حماية على الجهاز وحماية على الشبكة.<\/p>", "q": {"k": "tf", "q": "الطابعة الشبكية وكاميرا المراقبة لا تُعدّان Endpoints لأنهما ليستا حواسيب.", "e": "أي جهاز متصل بالشبكة Endpoint. أجهزة IoT من أضعف الحلقات لقلة تحديثها وكلمات سرها الافتراضية.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Endpoint Security (على مستوى المؤسسة)", "b": "<p>تاريخياً كانت الحماية «محيطاً قوياً وداخلاً موثوقاً». هذا النموذج سقط: المستخدمون والأجهزة والتطبيقات في كل مكان. المبدأ الحديث <b>Zero Trust<\/b>: لا يُمنح أي جهاز أو مستخدم الثقة لمجرد وجوده داخل الشبكة؛ يُتحقق من كل طلب.<\/p><p>بنية الحماية تجمع نوعين:<\/p><ul><li><b>Host-based<\/b>: على الجهاز: Antimalware، Host firewall، HIDS، EDR.<\/li><li><b>Network-based<\/b>: على الشبكة، تحمي كل الأجهزة حتى التي لا يمكن تثبيت شيء عليها:<\/li><li>بوابة أمن البريد وبوابة أمن الويب.<\/li><li><b>NAC<\/b> (Network Admission Control): لا يسمح للجهاز بالاتصال بالشبكة إلا إن أثبت هويته <b>واستوفى الشروط<\/b> (نظام محدّث، Antimalware يعمل). غير المستوفي يُعزل في شبكة حجر.<\/li><li>تحليل الـ Malware على الشبكة (مثل Cisco Secure Endpoint / AMP).<\/li><\/ul>", "q": {"k": "mc", "q": "Laptop زائر غير محدّث وبلا Antimalware وُصل بالشبكة فوُضع تلقائياً في شبكة معزولة. أي تقنية فعلت ذلك؟", "e": "الـ NAC يفحص هوية الجهاز وحالته قبل منحه الوصول، ويعزل ما لا يستوفي الشروط.", "o": ["NTP", "NAC", "NetFlow"], "a": 1}}, {"t": "Host-Based Malware Protection", "b": "<p>برامج <b>Antimalware / Antivirus<\/b> تكشف البرامج الخبيثة بثلاث طرق:<\/p><ul><li><b>Signature-based<\/b>: تبحث عن أنماط معروفة (تواقيع) في الملفات. سريعة ودقيقة للمعروف، وعمياء عن الجديد وعن المتحوّل.<\/li><li><b>Heuristics-based<\/b>: تبحث عن <b>خصائص عامة<\/b> مشتركة بين أنواع الـ Malware (بنية مريبة، تعليمات مشبوهة). تكشف بعض الجديد، مع إنذارات كاذبة أكثر.<\/li><li><b>Behavior-based<\/b>: تراقب <b>ما يفعله<\/b> البرنامج أثناء تشغيله: هل يشفّر ملفات كثيرة بسرعة؟ هل يحقن كوداً في Process آخر؟ تكشف غير المعروف، ومنه الـ Fileless.<\/li><\/ul><p>المنتجات الحديثة تجمع الثلاث، ومعها ذكاء سحابي. وكثير منها يتضمن Host firewall.<\/p><p><b>Agent-based<\/b> مقابل <b>Agentless<\/b>: الأول برنامج يثبَّت على كل جهاز. الثاني يفحص الأجهزة الافتراضية من منصة مركزية دون تثبيت شيء داخل كل منها.<\/p>", "q": {"k": "mc", "q": "برنامج فدية جديد تماماً لا توقيع له بدأ يشفّر مئات الملفات. أي أسلوب كشف يوقفه؟", "e": "لا توقيع له، لكن سلوكه (تشفير سريع لملفات كثيرة) يفضحه لمن يراقب السلوك.", "o": ["Signature-based", "Behavior-based", "لا يمكن كشفه"], "a": 1}}, {"t": "Network-Based Malware Protection", "b": "<p>حماية على الشبكة تكمّل حماية الجهاز، وتغطي ما لا يُثبَّت عليه شيء:<\/p><ul><li><b>Advanced Malware Protection<\/b>: تحليل الملفات المارة قبل الهجوم وأثناءه وبعده.<\/li><li><b>Email Security Appliance<\/b>: فلترة الـ Spam والتصيد والمرفقات الخبيثة.<\/li><li><b>Web Security Appliance<\/b>: فلترة المواقع وحظر الخبيث منها.<\/li><li><b>NAC<\/b>: السماح للأجهزة المصرح بها والمستوفية للشروط فقط.<\/li><\/ul><p>لماذا الاثنان معاً؟<\/p><div class=\"tw\"><table><tr><th><\/th><th>Host-based<\/th><th>Network-based<\/th><\/tr><tr><td>يرى الحركة المشفرة بعد فكها<\/td><td>نعم<\/td><td>لا غالباً<\/td><\/tr><tr><td>يحمي أجهزة IoT والطابعات<\/td><td>لا<\/td><td>نعم<\/td><\/tr><tr><td>يحمي الجهاز خارج المؤسسة<\/td><td>نعم<\/td><td>لا<\/td><\/tr><tr><td>نقطة إدارة واحدة لكل الشبكة<\/td><td>لا<\/td><td>نعم<\/td><\/tr><\/table><\/div><p>كل واحد يغطي نقاط عمى الآخر. هذا Defense in Depth.<\/p>", "q": {"k": "mc", "q": "أي نوع حماية يغطي كاميرات IoT التي لا يمكن تثبيت برنامج عليها؟", "e": "ما لا يقبل Agent يُحمى من الشبكة: عزل، فلترة، ومراقبة للحركة.", "o": ["Host-based antimalware", "Network-based protection", "BitLocker"], "a": 1}}], "test": [{"k": "mc", "q": "تمرين «Identify Antimalware Terms»: أي تطابق صحيح؟", "e": "التواقيع أنماط معروفة. الـ Heuristics خصائص عامة مريبة. والسلوكي يراقب الأفعال وقت التشغيل.", "o": ["Heuristics ← مطابقة Hash الملف مع قائمة معروفة", "Signature-based ← مطابقة أنماط معروفة في الملف", "Behavior-based ← فحص اسم الملف فقط"], "a": 1}, {"k": "sa", "q": "ما معنى Zero Trust في جملة واحدة؟", "e": "لا يُمنح أي مستخدم أو جهاز الثقة لمجرد وجوده داخل الشبكة؛ يُتحقق من هوية وحالة كل طلب وصول في كل مرة («Never trust, always verify»).", "kw": [["تحقق", "verify", "لا ثقة", "لا يثق", "لا تثق", "كل طلب", "never trust", "لا يُمنح"]]}]}, {"t": "9.3 Host-Based Intrusion Prevention", "kind": "lesson", "cs": [{"t": "Host-Based Firewalls", "b": "<p><b>Host-based (Personal) firewall<\/b> برنامج على الجهاز يتحكم في الحركة الداخلة إليه والخارجة منه. يسمح أو يمنع بحسب قواعد، وقد يعمل بقواعد جاهزة أو يسأل المستخدم عند أول اتصال لكل برنامج.<\/p><p>يتميز عن Firewall الشبكة بأنه يعرف <b>أي برنامج<\/b> أنشأ الاتصال، فيكتب قواعد لكل تطبيق.<\/p><p>أمثلة:<\/p><ul><li><b>Windows Defender Firewall<\/b>: بملفاته الثلاثة (وحدة 7).<\/li><li><b>iptables<\/b>: أداة Linux التقليدية لضبط قواعد الفلترة في الـ Kernel.<\/li><li><b>nftables<\/b>: خليفة iptables، بصيغة أبسط وأداء أفضل.<\/li><li><b>ufw<\/b> و <b>firewalld<\/b>: واجهات مبسطة فوقهما.<\/li><li><b>TCP Wrappers<\/b>: آلية قديمة في Linux تتحكم في الوصول للخدمات بحسب عنوان العميل عبر الملفين <code dir=\"ltr\">/etc/hosts.allow<\/code> و <code dir=\"ltr\">/etc/hosts.deny<\/code>.<\/li><\/ul><p>فائدته الكبرى: إيقاف الانتشار الأفقي. جهاز مصاب داخل الشبكة لا يصل لجاره إن كان جدار الجار يمنع الاتصالات الداخلة غير اللازمة.<\/p>", "q": {"k": "mc", "q": "ما الذي يعرفه الـ Host-based firewall ولا يعرفه Firewall الشبكة عادةً؟", "e": "لأنه يعمل داخل نظام التشغيل، يربط كل اتصال بالتطبيق صاحبه ويكتب قواعد بحسبه.", "o": ["عنوان IP الوجهة", "أي برنامج على الجهاز أنشأ الاتصال", "رقم المنفذ"], "a": 1}}, {"t": "Host-Based Intrusion Detection", "b": "<p><b>HIDS<\/b> برنامج على الجهاز يحميه من الهجمات المعروفة وغير المعروفة بمراقبة ما يجري <b>داخله<\/b>:<\/p><ul><li>تغييرات ملفات النظام والإعدادات.<\/li><li>مفاتيح الـ Registry.<\/li><li>السجلات.<\/li><li>الـ Processes وما تطلبه من النظام.<\/li><li>الحركة الشبكية للجهاز.<\/li><\/ul><p>يجمع بين وظيفة Antimalware ووظيفة Firewall، ويضيف مراقبة السلامة.<\/p><p>لأنه على الجهاز يرى ما لا تراه الشبكة: المحتوى بعد فك التشفير، وهل <b>نجح<\/b> الهجوم فعلاً (ملف تغيّر، حساب أُنشئ)، وليس مجرد أن محاولة مرّت.<\/p><p>عيبه: يحمي الجهاز المثبت عليه فقط ولا يرى الصورة الكاملة، فتُرسل تنبيهاته إلى منصة مركزية (SIEM) تجمع الجميع.<\/p>", "q": {"k": "mc", "q": "ما الذي يستطيع الـ HIDS تأكيده ولا يستطيعه الـ NIDS؟", "e": "الـ NIDS يرى المحاولة في الحركة. الـ HIDS يرى أثرها الفعلي على النظام.", "o": ["أن Packet مرّ في الشبكة", "أن الهجوم نجح فعلاً على الجهاز (تغيّر ملف أو أُنشئ حساب)", "سرعة الرابط"], "a": 1}}, {"t": "HIDS Operation", "b": "<p>كيف يقرر الـ HIDS أن شيئاً خبيث؟ بثلاث استراتيجيات:<\/p><ul><li><b>Anomaly-based<\/b>: يتعلم أولاً السلوك الطبيعي للجهاز (Baseline)، ثم ينبّه عند أي انحراف عنه. إن انحرف سلوك Process عن المعتاد أوقفه أو نبّه. يكشف الجديد، مع إنذارات كاذبة حين يتغير الاستخدام المشروع.<\/li><li><b>Policy-based<\/b>: قواعد محددة مسبقاً تصف المسموح. كل ما يخالفها يُمنع أو يُنبَّه عليه، مثل «لا يُعدَّل أي ملف في مجلد النظام» أو «هذا البرنامج لا يتصل بالشبكة».<\/li><li><b>Signature-based<\/b>: مطابقة أنماط هجمات معروفة.<\/li><\/ul><p>ومن أهم وظائفه <b>File Integrity Monitoring (FIM)<\/b>: يحسب Hash لكل ملف حساس ويخزنه، ثم يعيد الحساب دورياً. اختلاف الـ Hash يعني أن الملف تغيّر:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>H<\/mi><mo>(<\/mo><msub><mtext>file<\/mtext><mrow><mtext>now<\/mtext><\/mrow><\/msub><mo>)<\/mo><mo>≠<\/mo><mi>H<\/mi><mo>(<\/mo><msub><mtext>file<\/mtext><mrow><mtext>baseline<\/mtext><\/mrow><\/msub><mo>)<\/mo><mo>⇒<\/mo><mtext>تنبيه<\/mtext><\/mrow><\/math><\/p>", "q": {"k": "mc", "q": "HIDS ينبّه لأن Hash ملف نظام اختلف عن القيمة المخزنة. أي وظيفة هذه؟", "e": "مقارنة Hash الملف الحالي بالمرجع المخزن تكشف أي تعديل، وهذا هو FIM.", "o": ["Port mirroring", "File Integrity Monitoring", "DHCP snooping"], "a": 1}}, {"t": "HIDS Products", "b": "<p>أمثلة على منتجات HIDS:<\/p><ul><li><b>OSSEC<\/b>: مفتوح المصدر. بنيته: <b>Agents<\/b> على الأجهزة ترسل لـ <b>Manager<\/b> مركزي. يراقب السجلات وسلامة الملفات ويكشف Rootkits.<\/li><li><b>Wazuh<\/b>: مشتق حديث من OSSEC، وهو الأكثر استخداماً اليوم في العالم مفتوح المصدر. يجمع HIDS مع وظائف SIEM و XDR.<\/li><li><b>Tripwire<\/b>: متخصص في File Integrity Monitoring.<\/li><li><b>Cisco Secure Endpoint<\/b> (AMP for Endpoints سابقاً)، <b>Microsoft Defender for Endpoint<\/b>، <b>CrowdStrike<\/b>، <b>SentinelOne<\/b> وغيرها: منتجات تجارية من فئة EDR/XDR تشمل وظائف HIDS وتتجاوزها.<\/li><li><b>Security Onion<\/b> تتضمن Wazuh.<\/li><\/ul><p>عند الاختيار يُسأل: ما الأنظمة المدعومة؟ هل الإدارة مركزية؟ كم إنذاراً كاذباً ينتج؟ وهل يتكامل مع الـ SIEM الموجود؟<\/p>", "q": {"k": "mc", "q": "أي منتج مفتوح المصدر يعمل بـ Agents على الأجهزة و Manager مركزي ويراقب السجلات وسلامة الملفات؟", "e": "OSSEC/Wazuh هما HIDS. Wireshark لتحليل الـ Packets و Nmap لفحص المنافذ.", "o": ["Wireshark", "OSSEC (ومشتقه Wazuh)", "Nmap"], "a": 1}}, {"t": "تمرين: Recommend Endpoint Security Measures", "b": "<p>بديل Lab 9.3.6. شركة محاسبة فيها 25 موظفاً. المعطيات:<\/p><ul><li>حواسيب Windows 11، وثلاثة ما زالت على Windows 10.<\/li><li>الجميع يعمل بحساب مدير محلي.<\/li><li>Defender مفعّل، ولا إدارة مركزية.<\/li><li>ثلث الموظفين يعملون من المنزل بـ Laptops غير مشفرة.<\/li><li>طابعتان شبكيتان بالإعدادات الافتراضية.<\/li><li>يتبادلون ملفات العملاء على USB.<\/li><\/ul><p>اكتب توصياتك مرتبة بحسب الأولوية، ولكل توصية: ما الخطر الذي تعالجه؟ جرّب قبل قراءة الإجابة النموذجية في السؤال.<\/p>", "q": {"k": "sa", "q": "اذكر ثلاث توصيات على الأقل لهذه الشركة مع الخطر الذي تعالجه كل منها.", "e": "(1) تشفير الـ Laptops بـ BitLocker: خطر تسرب بيانات العملاء عند السرقة. (2) تحويل الحسابات إلى Standard user: يحد من ضرر الـ Malware. (3) ترقية أو عزل أجهزة Windows 10 المنتهية الدعم. (4) تغيير إعدادات الطابعات الافتراضية وتحديثها وعزلها. (5) تقييد USB وتوفير مشاركة ملفات آمنة. (6) إدارة مركزية للتحديثات والحماية، و MFA و VPN للعاملين من المنزل.", "kw": [["bitlocker", "تشفير", "encrypt", "fde"], ["standard", "صلاحي", "privilege", "مدير"]]}}], "test": [{"k": "mc", "q": "أي استراتيجية HIDS تكشف هجوماً جديداً تماماً لكنها تنتج إنذارات كاذبة حين يتغير نمط العمل المشروع؟", "e": "الكشف بالشذوذ لا يحتاج معرفة مسبقة بالهجوم، لكنه يعدّ كل خروج عن المعتاد مريباً.", "o": ["Anomaly-based", "Signature-based", "لا شيء مما سبق"], "a": 0}, {"k": "tf", "q": "الـ Host-based firewall يساعد في إيقاف انتشار Worm بين أجهزة الشبكة الداخلية نفسها.", "e": "Firewall المحيط لا يرى الحركة بين جهازين داخليين. جدار كل جهاز يمنع الاتصالات الداخلة غير اللازمة من جيرانه.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}]}, {"t": "9.4 Application Security", "kind": "lesson", "cs": [{"t": "Attack Surface", "b": "<p><b>Attack surface<\/b> هو مجموع الثغرات والنقاط التي يستطيع المهاجم الوصول منها إلى النظام. كلما كبر صعب الدفاع عنه. ثلاثة مكونات بحسب معهد SANS:<\/p><ul><li><b>Network attack surface<\/b>: ما يُستغل عبر الشبكة: المنافذ المفتوحة، البروتوكولات (سلكية ولاسلكية وBluetooth)، وأجهزة الشبكة نفسها.<\/li><li><b>Software attack surface<\/b>: ثغرات تطبيقات الويب والسحابة والبرامج المثبتة.<\/li><li><b>Human attack surface<\/b>: سلوك المستخدمين: Social Engineering، أخطاء، ومطّلعون ناقمون.<\/li><\/ul><p>تقليله:<\/p><ul><li>أغلق المنافذ والخدمات غير اللازمة.<\/li><li>أزل البرامج غير المستخدمة وحدّث الباقي.<\/li><li>قسّم الشبكة.<\/li><li>درّب الناس.<\/li><\/ul><p>توسّعه: IoT، العمل عن بعد، السحابة، وسياسة <b>BYOD<\/b> (استخدام الأجهزة الشخصية في العمل).<\/p>", "q": {"k": "mc", "q": "موظف ضغط رابط تصيد وأدخل كلمة سره. أي مكوّن من الـ Attack surface استُغل؟", "e": "الثغرة هنا في سلوك الإنسان، وعلاجها التوعية و MFA.", "o": ["Network attack surface", "Software attack surface", "Human attack surface"], "a": 2}}, {"t": "Application Block List and Allow List", "b": "<p>طريقتان للتحكم في ما يعمل على الجهاز أو ما يُتصل به (الاسمان القديمان Blacklist و Whitelist):<\/p><ul><li><b>Block list<\/b> (قائمة الحظر): كل شيء مسموح <b>إلا<\/b> المدرج فيها. سهلة الإدارة، لكنها تحمي من المعروف فقط؛ برنامج خبيث جديد ليس في القائمة يعمل.<\/li><li><b>Allow list<\/b> (قائمة السماح): كل شيء ممنوع <b>إلا<\/b> المدرج فيها. أشد أماناً بكثير، لأن المجهول ممنوع تلقائياً. ثمنها: جهد إداري، فكل برنامج جديد يحتاج موافقة.<\/li><\/ul><p>تُطبَّق على:<\/p><ul><li><b>التطبيقات<\/b>: أي البرامج يُسمح بتشغيلها (في Windows عبر AppLocker أو سياسات التحكم بالتطبيقات).<\/li><li><b>المواقع والعناوين<\/b>: أي النطاقات يُسمح بزيارتها. خدمات مثل <b>Spamhaus<\/b> تنشر قوائم حظر للعناوين المسيئة.<\/li><\/ul><p>الـ Allow list مثالية للأجهزة ثابتة الوظيفة: نقاط البيع، أجهزة التحكم الصناعي، والخوادم.<\/p>", "q": {"k": "mc", "q": "جهاز صراف آلي يجب ألا يشغّل إلا برنامج البنك. أي أسلوب أنسب؟", "e": "وظيفة الجهاز ثابتة، فقائمة سماح قصيرة تمنع أي برنامج آخر، معروفاً كان أو جديداً.", "o": ["Block list للبرامج الخبيثة المعروفة", "Allow list تسمح ببرنامج البنك فقط", "لا شيء"], "a": 1}}, {"t": "System-Based Sandboxing", "b": "<p><b>Sandbox<\/b> بيئة معزولة يُشغَّل فيها ملف مشبوه لمراقبة ما يفعله دون أن يصل ضرره للنظام الحقيقي. هي تحليل <b>ديناميكي<\/b> (بالتشغيل)، مقابل التحليل <b>الثابت<\/b> (فحص الملف دون تشغيله).<\/p><p>الـ Sandbox يسجل:<\/p><ul><li>الملفات التي أنشأها أو عدّلها أو حذفها.<\/li><li>مفاتيح الـ Registry التي لمسها.<\/li><li>الـ Processes التي شغّلها.<\/li><li>النطاقات والعناوين التي حاول الاتصال بها.<\/li><\/ul><p>ومن ذلك يخرج تقرير بالحكم وقائمة <b>IOCs<\/b> تُستخدم في الحظر والبحث في باقي الأجهزة.<\/p><p>أمثلة: <b>Cuckoo Sandbox<\/b> (مفتوح المصدر، محلي)، <b>ANY.RUN<\/b> و <b>Hybrid Analysis<\/b> و <b>Joe Sandbox<\/b> (خدمات على الإنترنت)، و <b>Cisco Secure Malware Analytics<\/b> (Threat Grid سابقاً).<\/p><p>حدودها: بعض الـ Malware يكتشف أنه في Sandbox فيتصرف ببراءة أو ينتظر طويلاً قبل النشاط.<\/p><p>فيديو 9.4.4 يعرض ذلك: ملف يُرفع، يُشغَّل، ثم يُقرأ التقرير.<\/p>", "q": {"k": "mc", "q": "ما الذي يقدمه تقرير الـ Sandbox ويفيد في حماية بقية الأجهزة؟", "e": "سلوك العينة في البيئة المعزولة يتحول إلى مؤشرات تُحظر على الشبكة وتُبحث عنها في الأجهزة الأخرى.", "o": ["كلمة سر المهاجم", "قائمة IOCs (ملفات، مفاتيح Registry، نطاقات وعناوين) للحظر والبحث", "نسخة احتياطية من الملف"], "a": 1}}, {"t": "تمرين: Online Malware Investigation Tools", "b": "<p>بديل Lab 9.4.5. أدوات يستخدمها المحلل (تحتاج اتصالاً بالإنترنت):<\/p><ul><li><b>VirusTotal<\/b>: ترفع ملفاً أو تبحث بالـ Hash أو بعنوان موقع، فتحصل على نتائج عشرات محركات الفحص وعلى معلومات السلوك والعلاقات.<\/li><li>خدمات Sandbox على الإنترنت: تشغيل العينة وقراءة تقرير السلوك.<\/li><\/ul><p>قاعدتان مهمتان:<\/p><ul><li><b>ابحث بالـ Hash أولاً ولا ترفع الملف<\/b>. ما يُرفع قد يصير متاحاً لمشتركي الخدمة، فرفع مستند داخلي تسريب بيانات. والمهاجم يراقب الخدمة ليعلم أن عينته اكتُشفت.<\/li><li>نتيجة «نظيف» لا تعني الأمان؛ قد تكون العينة جديدة.<\/li><\/ul><p>جرّب دون إنترنت حساب الـ Hash لأي ملف عندك:<\/p><pre dir=\"ltr\"><code>Get-FileHash .\\file.exe -Algorithm SHA256     (PowerShell)\nsha256sum file.bin                             (Linux)<\/code><\/pre><p>غيّر حرفاً واحداً في ملف نصي وأعد الحساب: ستتغير البصمة كلها.<\/p>", "q": {"k": "mc", "q": "وصلك مرفق مشبوه فيه بيانات عميل. ما الطريقة الأسلم لفحصه على خدمة عامة؟", "e": "البحث بالـ Hash يكشف هل العينة معروفة دون تسريب محتواها. الرفع يأتي لاحقاً وبقرار، وللملفات غير الحساسة فقط.", "o": ["رفع الملف مباشرة", "حساب الـ SHA-256 والبحث به أولاً دون رفع الملف", "فتحه للتأكد"], "a": 1}}], "test": [{"k": "mc", "q": "محرك Antivirus قال عن ملف إنه نظيف، لكن تقرير الـ Sandbox أظهر أنه ينشئ مفتاح Run ويتصل بنطاق عشوائي الاسم. ما حكمك؟", "e": "غياب التوقيع يعني فقط أنه غير معروف. السلوك في الـ Sandbox دليل أقوى.", "o": ["نظيف لأن الـ Antivirus قال ذلك", "خبيث على الأرجح: سلوكه (Persistence واتصال C2) أهم من غياب التوقيع", "يحتاج إعادة تسمية"], "a": 1}, {"k": "mc", "q": "أي إجراء يقلّص الـ Software attack surface؟", "e": "التدريب يعالج المكوّن البشري، والقفل يعالج الفيزيائي. البرامج تُقلَّص بالإزالة والتحديث.", "o": ["إزالة البرامج غير المستخدمة وتحديث الباقي", "تدريب الموظفين على التصيد", "قفل غرفة الخوادم"], "a": 0}]}, {"t": "9.5 ملخص الوحدة 9 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li><b>تأمين النظام<\/b>: إدارة منضبطة، إعداد منهجي، Baseline، إزالة غير اللازم، و Patch management منظم.<\/li><li><b>حماية الجهاز<\/b>: Host firewall، HIDS/HIPS، EDR/XDR، DLP.<\/li><li><b>التشفير<\/b>: EFS للملفات، و FDE (BitLocker) للقرص كله مع TPM.<\/li><li><b>سلامة الإقلاع<\/b>: Secure Boot يمنع، و Measured Boot يوثّق.<\/li><li><b>Apple<\/b>: Secure Enclave، FileVault، Gatekeeper، XProtect.<\/li><li><b>الحماية الفيزيائية<\/b>: أقفال، بطاقات، Privacy screens، RFID.<\/li><li><b>كلمات السر<\/b>: تُخزَّن Hashes مع Salt، وطولها أهم عامل.<\/li><li><b>Antimalware<\/b>: Signature، Heuristics، Behavior. وعلى الشبكة: بوابات البريد والويب و NAC. والمبدأ Zero Trust.<\/li><li><b>HIDS<\/b>: Anomaly، Policy، Signature، و FIM. المنتجات: OSSEC، Wazuh، Tripwire.<\/li><li><b>التطبيقات<\/b>: تقليص الـ Attack surface، Allow list أقوى من Block list، والـ Sandbox للتحليل الديناميكي.<\/li><\/ul>", "q": {"k": "mc", "q": "أي جملة تلخص منهج حماية الـ Endpoint؟", "e": "لا تغطي طبقة واحدة كل التهديدات. الحماية تراكم ضوابط يسد كل منها ثغرة غيره.", "o": ["برنامج Antivirus واحد يكفي", "طبقات: تقوية النظام، تحديث، تشفير، حماية على الجهاز وعلى الشبكة، ومراقبة", "الاعتماد على Firewall المحيط"], "a": 1}}], "test": []}, {"t": "اختبار الوحدة 9", "kind": "exam", "pool": [10], "n": 12}]}, {"n": "10", "t": "الوحدة 10: Cybersecurity Principles, Practices, and Processes", "secs": [{"t": "10.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>تعلمت حتى الآن هجمات وأدوات كثيرة. هذه الوحدة تعطيك <b>الإطار<\/b> الذي ينظمها كلها، فتعرف لكل ضابط حماية لماذا وُضع وأين موقعه.<\/p><p>ستتعلم:<\/p><ul><li><b>الأبعاد الثلاثة<\/b> للأمن السيبراني (Cybersecurity Cube): أهداف الأمن، حالات البيانات، وأنواع الضوابط.<\/li><li><b>الـ CIA Triad<\/b> بالتفصيل: كيف تتحقق السرية والسلامة والتوافر عملياً.<\/li><li><b>حالات البيانات الثلاث<\/b> وتحديات حماية كل حالة.<\/li><li><b>الضوابط<\/b>: التقنيات، وتوعية الناس، والسياسات والإجراءات.<\/li><\/ul><p>هذه الوحدة تجيب عن أول مخرجات الدورة: كيف تفرض أنواع البيانات تحديات مختلفة.<\/p>", "q": {"k": "tf", "q": "هذه الوحدة تقدم إطاراً ينظم ضوابط الأمن بحسب الهدف، وحالة البيانات، ونوع الضابط.", "e": "هذا هو مكعب الأمن السيبراني بأبعاده الثلاثة.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": []}, {"t": "10.1 The Three Dimensions", "kind": "lesson", "cs": [{"t": "The Cybersecurity Cube", "b": "<p><b>Cybersecurity Cube<\/b> (ويسمى McCumber Cube نسبةً لواضعه John McCumber) نموذج بثلاثة أبعاد، يذكّرك بكل ما يجب التفكير فيه عند حماية المعلومات:<\/p><div class=\"tw\"><table><tr><th>البعد<\/th><th>عناصره<\/th><th>السؤال الذي يجيب عنه<\/th><\/tr><tr><td>Security principles<\/td><td>Confidentiality, Integrity, Availability<\/td><td>ما الذي نريد تحقيقه؟<\/td><\/tr><tr><td>Data states<\/td><td>At rest (Storage), In transit (Transmission), In process (Processing)<\/td><td>أين البيانات الآن؟<\/td><\/tr><tr><td>Safeguards<\/td><td>Technology, Policies and practices, People (Education and awareness)<\/td><td>بماذا نحميها؟<\/td><\/tr><\/table><\/div><p>المكعب <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>3<\/mn><mo>×<\/mo><mn>3<\/mn><mo>×<\/mo><mn>3<\/mn><mo>=<\/mo><mn>27<\/mn><\/mrow><\/math> خانة. كل خانة سؤال، مثل: «كيف أحقق <b>السرية<\/b> للبيانات وهي <b>تنتقل<\/b> باستخدام <b>التقنية<\/b>؟» والجواب: التشفير بـ TLS أو VPN.<\/p><p>فائدته: يمنعك من نسيان زاوية. مؤسسة تشفّر أقراصها (At rest) وتنسى البيانات المنتقلة، أو تشتري أدوات وتنسى تدريب الناس، تترك خانات فارغة.<\/p>", "q": {"k": "mc", "q": "ما الأبعاد الثلاثة للـ Cybersecurity Cube؟", "e": "أهداف الأمن (CIA)، حالات البيانات الثلاث، وأنواع الضوابط الثلاثة.", "o": ["Hardware و Software و Network", "Security principles و Data states و Safeguards", "Threat و Vulnerability و Risk"], "a": 1}}, {"t": "CIA Triad: The Principle of Confidentiality", "b": "<p><b>Confidentiality<\/b> تعني منع كشف المعلومات لمن لا يحق له، من أشخاص أو أنظمة أو برامج. تسمى أيضاً Privacy.<\/p><p>وسائل تحقيقها:<\/p><ul><li><b>Encryption<\/b>: تحويل البيانات لصيغة لا يقرؤها إلا من يملك المفتاح.<\/li><li><b>Authentication<\/b>: التحقق من هوية المستخدم. عوامل الإثبات ثلاثة: شيء <b>تعرفه<\/b> (كلمة سر)، شيء <b>تملكه<\/b> (هاتف، بطاقة)، وشيء <b>أنت عليه<\/b> (بصمة). استخدام عاملين أو أكثر هو <b>MFA<\/b>.<\/li><li><b>Authorization<\/b>: تحديد ما يُسمح للمستخدم المصادَق عليه بالوصول إليه.<\/li><li><b>Access control<\/b>: مجموعة آليات التحكم بالوصول. وهي تعيدنا إلى <b>AAA<\/b>: Authentication ثم Authorization ثم Accounting.<\/li><\/ul><p>ومبادئ تدعمها: <b>Least Privilege<\/b>، و <b>Need to know<\/b>: لا يطّلع الشخص إلا على ما يحتاجه لعمله، حتى لو كانت درجته تسمح بأكثر.<\/p>", "q": {"k": "mc", "q": "الدخول بكلمة سر ثم برمز يصل إلى هاتفك يجمع أي عاملين؟", "e": "كلمة السر شيء تعرفه، والهاتف الذي يستقبل الرمز شيء تملكه. عاملان من نوعين مختلفين = MFA.", "o": ["شيء تعرفه وشيء أنت عليه", "شيء تعرفه وشيء تملكه", "شيئين تعرفهما"], "a": 1}}, {"t": "Protecting Data Privacy", "b": "<p>ليست كل البيانات بالحساسية نفسها. المؤسسة تجمع كثيراً، وعليها تحديد ما يستحق الحماية المشددة. <b>البيانات الحساسة<\/b> ثلاثة أنواع:<\/p><ul><li><b>Personal information (PII)<\/b>: معلومات تحدد هوية شخص: الاسم مع رقم الهوية، تاريخ الميلاد، العنوان، البيانات الطبية والمالية.<\/li><li><b>Business information<\/b>: معلومات يضر كشفها بالمؤسسة أو تمنح منافسيها أفضلية: أسرار تجارية، خطط استحواذ، بيانات مالية، قوائم عملاء.<\/li><li><b>Classified information<\/b>: معلومات تملكها جهة حكومية وتصنفها بدرجات: Top secret، Secret، Confidential، Restricted.<\/li><\/ul><p>الخصوصية أيضاً التزام <b>قانوني<\/b>: تشريعات مثل <b>GDPR<\/b> في أوروبا تفرض على من يجمع بيانات الأشخاص حمايتها، وجمع اللازم فقط، والتبليغ عن التسريب، وتعاقب المخالف بغرامات كبيرة.<\/p><p>لهذا تبدأ الحماية بـ <b>Data classification<\/b>: تصنيف البيانات بحسب حساسيتها ثم تحديد ضوابط كل فئة.<\/p>", "q": {"k": "mc", "q": "قائمة أسعار الموردين السرية لشركة هي أي نوع من البيانات الحساسة؟", "e": "معلومة يضر كشفها بالمؤسسة تنافسياً. الـ Classified خاص بتصنيفات الحكومات.", "o": ["Personal information", "Business information", "Classified information"], "a": 1}}, {"t": "Data Integrity", "b": "<p><b>Integrity<\/b> هي دقة البيانات واتساقها وموثوقيتها طوال دورة حياتها: إنشاءً وتخزيناً ونقلاً ومعالجة. البيانات يجب ألا تتغير إلا بيد مصرّح لها.<\/p><p>درجة الحاجة للسلامة تختلف:<\/p><ul><li><b>Critical<\/b>: سجلات طبية، معاملات بنكية. كل البيانات تُتحقق، فالخطأ قد يكلّف حياة أو ثروة.<\/li><li><b>High<\/b>: قواعد بيانات المؤسسات.<\/li><li><b>Mid<\/b>: محركات البحث والمبيعات عبر الإنترنت.<\/li><li><b>Low<\/b>: منشورات المدونات والتواصل الاجتماعي.<\/li><\/ul><p>وسائل ضمانها:<\/p><ul><li><b>Hashing<\/b>: حساب بصمة للبيانات ومقارنتها لاحقاً. إن اختلفت فقد تغيّرت البيانات.<\/li><li><b>Data validation checks<\/b>: التحقق من صحة المدخلات (النوع، المدى، الصيغة).<\/li><li><b>Data consistency checks<\/b>: التأكد من اتساق البيانات عبر الأنظمة والجداول.<\/li><li><b>Access controls<\/b>: لا يعدّل إلا المصرّح له.<\/li><li><b>Version control<\/b> و <b>Backups<\/b>: إمكان الرجوع لنسخة سليمة.<\/li><li><b>Digital signatures<\/b>: تثبت أن البيانات من مصدرها وأنها لم تتغير.<\/li><\/ul>", "q": {"k": "mc", "q": "مستشفى اكتشف أن فصيلة دم مريض تغيّرت في السجل دون إذن. أي مبدأ انتُهك، وما درجة أهميته هنا؟", "e": "تعديل غير مصرح به هو انتهاك للسلامة، والسجلات الطبية أعلى درجاتها لأن الخطأ يهدد الحياة.", "o": ["Availability، منخفضة", "Integrity، حرجة (Critical)", "Confidentiality، متوسطة"], "a": 1}}, {"t": "Availability", "b": "<p><b>Availability<\/b> تعني أن الأنظمة والخدمات والبيانات متاحة للمستخدمين المصرّح لهم حين يحتاجونها.<\/p><p>ما يهددها: هجمات DoS، أعطال العتاد، أخطاء البرمجيات، أخطاء البشر، انقطاع الكهرباء، والكوارث الطبيعية.<\/p><p>تُقاس بنسبة وقت العمل:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>Availability<\/mtext><mo>=<\/mo><mfrac><mrow><mtext>Uptime<\/mtext><\/mrow><mrow><mtext>Uptime<\/mtext><mo>+<\/mo><mtext>Downtime<\/mtext><\/mrow><\/mfrac><mo>×<\/mo><mn>100<\/mn><mo>%<\/mo><\/mrow><\/math><\/p><p>المعيار الذهبي <b>Five nines<\/b> أي 99.999%. كم يسمح ذلك من توقف في السنة؟ السنة نحو 525,960 دقيقة:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mn>525960<\/mn><mo>×<\/mo><mo>(<\/mo><mn>1<\/mn><mo>-<\/mo><mn>0.99999<\/mn><mo>)<\/mo><mo>≈<\/mo><mn>5.26<\/mn><mtext> min<\/mtext><\/mrow><\/math><\/p><p>أي نحو خمس دقائق وربع في السنة كلها.<\/p><div class=\"tw\"><table><tr><th>النسبة<\/th><th>التوقف المسموح سنوياً<\/th><\/tr><tr><td>99%<\/td><td>نحو 3.65 يوم<\/td><\/tr><tr><td>99.9%<\/td><td>نحو 8.77 ساعة<\/td><\/tr><tr><td>99.99%<\/td><td>نحو 52.6 دقيقة<\/td><\/tr><tr><td>99.999%<\/td><td>نحو 5.26 دقيقة<\/td><\/tr><\/table><\/div><p>كل «تسعة» إضافية تكلف أضعاف ما قبلها، فتُطلب الدرجة العالية حيث التوقف لا يُحتمل: الطوارئ، البنوك، المستشفيات.<\/p>", "q": {"k": "mc", "q": "خدمة توقفت 8 ساعات و46 دقيقة خلال سنة. أي مستوى توافر حققت تقريباً؟", "e": "99.9% تسمح بنحو 8.77 ساعة توقف سنوياً، وهو ما حدث تقريباً.", "o": ["99.999%", "99.9%", "90%"], "a": 1}}, {"t": "Ensuring Availability", "b": "<p>وسائل تحقيق التوافر العالي:<\/p><ul><li><b>Equipment maintenance<\/b>: صيانة دورية واستبدال القطع قبل تعطلها.<\/li><li><b>OS and system updates<\/b>: تحديثات تمنع الأعطال والاختراقات.<\/li><li><b>Backups<\/b>: نسخ احتياطية منتظمة، مع <b>اختبار الاسترجاع<\/b>. نسخة لم تُجرَّب لا يُعوَّل عليها. قاعدة شائعة <b>3-2-1<\/b>: ثلاث نسخ، على وسيطين مختلفين، واحدة منها خارج الموقع.<\/li><li><b>Redundancy<\/b>: مكوّن بديل لكل مكوّن حرج، لإزالة أي <b>Single point of failure<\/b>: خادمان، مصدرا كهرباء، رابطا إنترنت، و <b>RAID<\/b> للأقراص.<\/li><li><b>Fault tolerance / Failover<\/b>: تحوّل تلقائي للبديل عند العطل.<\/li><li><b>Disaster recovery plan<\/b>: خطة مكتوبة ومجرَّبة لاستعادة العمل بعد كارثة.<\/li><li><b>Monitoring<\/b>: رصد النشاط غير الطبيعي والأعطال مبكراً.<\/li><li><b>تجهيزات<\/b>: UPS ومولدات، وتبريد وإطفاء.<\/li><\/ul>", "q": {"k": "mc", "q": "ما المقصود بـ Single point of failure؟", "e": "هو أي عنصر بلا بديل يتوقف عليه كل شيء. الـ Redundancy يزيله.", "o": ["كلمة سر ضعيفة", "مكوّن واحد إن تعطل توقف النظام كله", "نقطة وصول لاسلكية"], "a": 1}}, {"t": "تمرين: The Cybersecurity Cube ومطابقة المفاهيم", "b": "<p>بديل Labs 10.1.10 و 10.1.11 (لعبة مطابقة مصطلحات المكعب). طابق كل ضابط بخانته: المبدأ، حالة البيانات، ونوع الضابط.<\/p><div class=\"tw\"><table><tr><th>الضابط<\/th><th>المبدأ<\/th><th>الحالة<\/th><th>النوع<\/th><\/tr><tr><td>BitLocker على Laptop<\/td><td>Confidentiality<\/td><td>At rest<\/td><td>Technology<\/td><\/tr><tr><td>HTTPS لموقع<\/td><td>Confidentiality و Integrity<\/td><td>In transit<\/td><td>Technology<\/td><\/tr><tr><td>نسخ احتياطي يومي<\/td><td>Availability<\/td><td>At rest<\/td><td>Technology<\/td><\/tr><tr><td>تدريب الموظفين على التصيد<\/td><td>الثلاثة<\/td><td>الكل<\/td><td>People<\/td><\/tr><tr><td>سياسة تمنع مشاركة كلمات السر<\/td><td>Confidentiality<\/td><td>الكل<\/td><td>Policies<\/td><\/tr><tr><td>Input validation في نموذج ويب<\/td><td>Integrity<\/td><td>In process<\/td><td>Technology<\/td><\/tr><\/table><\/div><p>الآن غطِّ الأعمدة الثلاثة الأخيرة وحاول ملأها من ذاكرتك، ثم أضف ثلاثة ضوابط من عندك.<\/p>", "q": {"k": "mc", "q": "«إجراء مكتوب يلزم بإتلاف الأقراص القديمة قبل التخلص منها». ما خانته في المكعب؟", "e": "يحمي سرية بيانات مخزنة، والضابط سياسة وإجراء.", "o": ["Confidentiality، At rest، Policies and practices", "Availability، In transit، Technology", "Integrity، In process، People"], "a": 0}}, {"t": "تمرين: File and Data Integrity Checks", "b": "<p>بديل Packet Tracer 10.1.12 و 10.1.13. الفكرة: ملف نُقل أو نُزّل، هل وصل كما هو؟<\/p><p>الخطوات:<\/p><ul><li>المصدر ينشر الـ Hash الخاص بالملف.<\/li><li>تحسب أنت الـ Hash لنسختك.<\/li><li>تقارن. تطابق تام يعني الملف سليم. أي اختلاف يعني تلفاً أو عبثاً.<\/li><\/ul><pre dir=\"ltr\"><code>sha256sum backup.zip                               (Linux)\nGet-FileHash backup.zip -Algorithm SHA256          (PowerShell)\ncertutil -hashfile backup.zip SHA256               (Command Prompt)<\/code><\/pre><p>نقطة دقيقة: الـ Hash وحده يكشف التغيير العرضي. لكن مهاجماً يعدّل الملف <b>ويعدّل الـ Hash المنشور معه<\/b> يخدعك. لذلك يُستخدم <b>HMAC<\/b> (Hash مع مفتاح سري مشترك) أو <b>توقيع رقمي<\/b>، فلا يستطيع تزوير البصمة من لا يملك المفتاح:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>HMAC<\/mtext><mo>=<\/mo><mi>H<\/mi><mo>(<\/mo><mtext>key<\/mtext><mo>,<\/mo><mtext>message<\/mtext><mo>)<\/mo><\/mrow><\/math><\/p><p>جرّب: احسب Hash لملف نصي، غيّر فيه حرفاً، وأعد الحساب.<\/p>", "q": {"k": "mc", "q": "لماذا يُفضَّل HMAC على Hash عادي عند نقل ملف عبر قناة غير موثوقة؟", "e": "الـ Hash العادي يحسبه أي أحد. الـ HMAC يحتاج المفتاح، فيثبت السلامة والمصدر معاً.", "o": ["لأنه أقصر", "لأن المهاجم لا يستطيع إعادة حساب البصمة بعد التعديل دون المفتاح السري", "لأنه يشفّر الملف"], "a": 1}}, {"t": "تمرين: Explore File and Data Encryption", "b": "<p>بديل Packet Tracer 10.1.14 و 10.1.15. نوعان من التشفير:<\/p><ul><li><b>Symmetric<\/b>: مفتاح واحد للتشفير وللفك. سريع، ويناسب البيانات الكبيرة. مشكلته: كيف توصل المفتاح للطرف الآخر بأمان؟ مثاله <b>AES<\/b> (والقديمان DES و 3DES مهجوران).<\/li><li><b>Asymmetric<\/b>: زوج مفاتيح: <b>Public key<\/b> يُنشر للجميع، و <b>Private key<\/b> يبقى سراً. ما يُشفَّر بأحدهما لا يفكه إلا الآخر. يحل مشكلة تبادل المفاتيح، لكنه أبطأ. مثاله <b>RSA<\/b> و <b>ECC<\/b>.<\/li><\/ul><p>في الواقع يُجمعان: TLS يستخدم اللامتماثل لتبادل مفتاح متماثل بأمان، ثم يشفّر البيانات به.<\/p><p>عدد المفاتيح الممكنة لمفتاح طوله <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>n<\/mi><\/mrow><\/math> بت هو <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>2<\/mn><mrow><mi>n<\/mi><\/mrow><\/msup><\/mrow><\/math>. فمفتاح AES-256 له <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>2<\/mn><mrow><mn>256<\/mn><\/mrow><\/msup><\/mrow><\/math> احتمالاً، وتجربتها كلها غير ممكنة عملياً.<\/p><p>جرّب على Linux تشفير ملف بكلمة سر ثم فكه:<\/p><pre dir=\"ltr\"><code>gpg -c notes.txt\ngpg notes.txt.gpg<\/code><\/pre><p>حاول فتح الملف المشفر بـ <code dir=\"ltr\">cat<\/code>: سترى بيانات غير مفهومة.<\/p>", "q": {"k": "mc", "q": "تريد أن يرسل لك أي شخص ملفاً مشفراً لا يفكه غيرك، دون تبادل سر مسبق. ماذا تنشر؟", "e": "المرسل يشفّر بمفتاحك العام، ولا يفك إلا مفتاحك الخاص الذي لا يغادر جهازك.", "o": ["الـ Private key", "الـ Public key", "كلمة سرك"], "a": 1}}], "test": [{"k": "mc", "q": "بنك يشفّر قواعد بياناته ويشفّر اتصالات عملائه، لكن موظفاً أُقنع بالهاتف بإعطاء كلمة سره. أي بعد من المكعب أُهمل؟", "e": "التقنية غطت حالتي البيانات، لكن ضابط «الناس» غاب. المكعب يذكّر بأن الأنواع الثلاثة لازمة.", "o": ["Data states", "Safeguards من نوع People (التوعية والتدريب)", "Security principles"], "a": 1}, {"k": "mc", "q": "أي تطابق (وسيلة ← مبدأ) صحيح؟", "e": "Redundancy تبقي الخدمة عاملة. الـ Hashing للسلامة والتشفير للسرية.", "o": ["Hashing ← Confidentiality", "Redundancy ← Availability", "Encryption ← Availability"], "a": 1}, {"k": "sa", "q": "اشرح الفرق بين Authentication و Authorization بمثال.", "e": "Authentication إثبات الهوية (من أنت؟)، مثل الدخول بكلمة سر ورمز. Authorization تحديد ما يُسمح لك به بعد ذلك، مثل أن موظف المبيعات يدخل النظام لكنه لا يفتح ملفات الرواتب.", "kw": [["هوي", "من أنت", "identity", "تحقق"], ["صلاحي", "يُسمح", "مسموح", "permission", "يحق"]]}]}, {"t": "10.2 States of Data", "kind": "lesson", "cs": [{"t": "Data at Rest", "b": "<p><b>Data at rest<\/b> هي البيانات المخزَّنة التي لا يستخدمها مستخدم أو Process الآن. وسائط التخزين:<\/p><ul><li><b>DAS<\/b> (Direct-Attached Storage): تخزين موصول مباشرة بالحاسوب: قرص صلب داخلي، USB.<\/li><li><b>RAID<\/b> (Redundant Array of Independent Disks): عدة أقراص تعمل كوحدة واحدة لتحسين الأداء أو تحمل تعطل قرص.<\/li><li><b>NAS<\/b> (Network-Attached Storage): جهاز تخزين موصول بالشبكة، يتيح الملفات للمصرّح لهم مركزياً.<\/li><li><b>SAN<\/b> (Storage Area Network): شبكة تخزين عالية السرعة تربط خوادم بمصفوفات أقراص. أسرع وأغلى.<\/li><li><b>Cloud storage<\/b>: تخزين عند مزوّد عن بعد.<\/li><\/ul><p>البيانات المخزنة تمكث طويلاً، وهي غالباً أكبر كمية، فتغري المهاجم: سرقة واحدة تعطيه كل شيء.<\/p>", "q": {"k": "mc", "q": "ما الفرق بين NAS و DAS؟", "e": "NAS تخزين مشترك عبر الشبكة. DAS تخزين محلي لجهاز واحد.", "o": ["لا فرق", "الـ NAS متاح عبر الشبكة لعدة مستخدمين، والـ DAS موصول مباشرة بحاسوب واحد", "الـ DAS أغلى دائماً"], "a": 1}}, {"t": "Challenges of Protecting Stored Data", "b": "<ul><li><b>التخزين المباشر (DAS)<\/b> أصعب الأنواع إدارةً وتحكماً: هو مبعثر على أجهزة الأفراد، عرضة للسرقة والضياع والهجوم على الجهاز المضيف، والبيانات عليه غالباً بلا نسخة احتياطية.<\/li><li><b>التخزين الشبكي (NAS, SAN, Cloud)<\/b> أأمن إدارةً لأنه مركزي: نسخ احتياطي وتحكم وصول موحد. لكنه هدف أكبر: اختراق واحد أو إعداد خاطئ يكشف كل شيء، وهو أعقد إعداداً.<\/li><\/ul><p>تحديات عامة:<\/p><ul><li>معرفة <b>أين<\/b> توجد البيانات الحساسة أصلاً.<\/li><li>النسخ القديمة والمنسية: نسخ احتياطية، أقراص مستبعدة، ملفات مؤقتة.<\/li><li>المطّلعون من الداخل بصلاحيات واسعة.<\/li><\/ul><p>الضوابط: التشفير (FDE، تشفير قواعد البيانات)، التحكم بالوصول، النسخ الاحتياطي المشفر، والإتلاف الآمن للوسائط.<\/p>", "q": {"k": "mc", "q": "لماذا يُعد التخزين المباشر على حواسيب الموظفين أصعب حماية؟", "e": "البيانات المتفرقة على أجهزة فردية لا تخضع لضوابط موحدة، وتضيع بضياع الجهاز.", "o": ["لأنه أسرع من اللازم", "لأنه مبعثر وغير مُدار مركزياً وعرضة للسرقة ودون نسخ احتياطي غالباً", "لأنه مشفر دائماً"], "a": 1}}, {"t": "Methods of Transmitting Data", "b": "<p><b>Data in transit<\/b> هي البيانات المنتقلة من جهاز لآخر. طرق النقل:<\/p><ul><li><b>Sneaker net<\/b>: نقل البيانات يدوياً على وسيط قابل للإزالة (USB، قرص خارجي) من حاسوب لآخر. الاسم دعابة: الشبكة هي حذاؤك الرياضي.<\/li><li><b>Wired networks<\/b>: كابلات نحاسية أو ألياف ضوئية. تخدم شبكة محلية أو مسافات بعيدة.<\/li><li><b>Wireless networks<\/b>: موجات راديو: Wi-Fi، شبكات الهاتف، Bluetooth. أسهل وأوسع، ومفتوحة لكل من في المدى.<\/li><\/ul><p>كل طريقة لها خطرها: الوسيط اليدوي يضيع أو يُسرق أو يحمل Malware، السلكي يُتنصت عليه بوصول فيزيائي، واللاسلكي يُلتقط من بعيد.<\/p>", "q": {"k": "mc", "q": "موظف نقل قاعدة العملاء من مكتب لآخر على USB. ما اسم طريقة النقل هذه؟", "e": "النقل اليدوي للبيانات على وسيط قابل للإزالة يسمى Sneaker net.", "o": ["Wireless network", "Sneaker net", "SAN"], "a": 1}}, {"t": "Challenges of Data in Transit", "b": "<p>حماية البيانات المنتقلة من أصعب مهام المحترف، وحجمها يتزايد مع الأجهزة المتنقلة. التحديات بحسب المبدأ:<\/p><ul><li><b>حماية السرية<\/b>: المهاجم يلتقط البيانات المارة وينسخها. العلاج: <b>VPN<\/b>، و <b>TLS/HTTPS<\/b>، و <b>IPsec<\/b>، وتشفير البيانات نفسها قبل إرسالها.<\/li><li><b>حماية السلامة<\/b>: المهاجم يعترض البيانات ويعدّلها في الطريق (MitM). العلاج: Hashing و HMAC والتوقيع الرقمي، وهي جزء من TLS و IPsec. ومصادقة الطرفين (<b>Mutual authentication<\/b>) تمنع انتحال أحدهما.<\/li><li><b>حماية التوافر<\/b>: أجهزة غير مصرح بها (Rogue AP) تخطف الحركة، أو هجمات تعطل الشبكة. العلاج: مصادقة الأجهزة، مراقبة الشبكة، وروابط احتياطية.<\/li><\/ul><p>الخلاصة: البيانات في الطريق خارج سيطرتك، فافترض أن القناة مراقَبة وشفّر دائماً.<\/p>", "q": {"k": "mc", "q": "مهاجم على Wi-Fi عام غيّر رقم الحساب في طلب تحويل وهو في الطريق. أي ضابط يكشف ذلك أو يمنعه؟", "e": "TLS يتضمن فحص سلامة لكل رسالة، فأي تعديل يُكتشف ويُرفض، والتشفير يمنع قراءتها أصلاً.", "o": ["زيادة سرعة الإنترنت", "TLS الذي يشفّر ويتحقق من سلامة الرسائل", "ضغط البيانات"], "a": 1}}, {"t": "Data in Process", "b": "<p><b>Data in process<\/b> هي البيانات أثناء الإدخال الأولي والتعديل والحساب والإخراج. ثلاث مراحل:<\/p><ul><li><b>Input<\/b>: إدخال البيانات: يدوياً، من ملفات، من حساسات، أو من أنظمة أخرى. مصادر الفساد: أخطاء الإدخال، ملفات مصدر تالفة، أعطال حساسات.<\/li><li><b>Modification<\/b>: أي تغيير على البيانات الأصلية: تعديل يدوي، معالجة برمجية، ترميز وفك، ضغط وفك، تشفير وفك. Malware أو خطأ برمجي هنا يفسدها.<\/li><li><b>Output<\/b>: إخراجها إلى شاشة أو طابعة أو نظام آخر. الخطر: إرسالها للوجهة الخطأ، إعدادات خاطئة، أو تلف الأجهزة.<\/li><\/ul><p>لماذا هي الأصعب؟ لتُعالَج البيانات يجب غالباً أن تكون <b>غير مشفرة<\/b> في الذاكرة، فهذه لحظة انكشافها. Malware يقرأ الذاكرة يلتقطها هناك.<\/p><p>الضوابط: Input validation، التحكم بالوصول، تحديث الأنظمة، اختبار البرامج، ومراجعة المخرجات.<\/p>", "q": {"k": "mc", "q": "لماذا تُعد حالة In process الأصعب حماية؟", "e": "التشفير يحمي المخزَّن والمنتقل، لكن المعالجة تحتاج البيانات مكشوفة، فتلك نافذة الخطر.", "o": ["لأن البيانات تكون على USB", "لأن البيانات تكون غالباً غير مشفرة في الذاكرة أثناء المعالجة", "لأنها لا تحتاج حماية"], "a": 1}}, {"t": "Oh No! A Security Breach… وتمرين Data Security Challenges", "b": "<p>حلّل هذا الحادث بالمكعب (بديل Lab 10.2.10):<\/p><p>شركة توظيف تحفظ سير المتقدمين في قاعدة بيانات على خادم داخلي. موظفة صدّرت القائمة إلى ملف Excel على Laptop غير مشفر لتعمل عليها في القطار، وأرسلتها لزميل عبر بريدها الشخصي من Wi-Fi المحطة. سُرق الـ Laptop في اليوم التالي.<\/p><p>أسئلة تجيب عنها كتابةً:<\/p><ul><li>ما نوع البيانات؟ (PII).<\/li><li>أين كانت في كل لحظة؟ At rest على الخادم ثم على الـ Laptop، In transit عبر البريد والـ Wi-Fi، In process أثناء التعديل.<\/li><li>أي مبدأ انتُهك في كل لحظة؟<\/li><li>أي ضابط من كل نوع (Technology، Policy، People) كان سيمنع الضرر؟<\/li><\/ul><p>هذا بالضبط أول مخرجات الدورة: البيانات نفسها تواجه تحديات مختلفة باختلاف حالتها.<\/p>", "q": {"k": "sa", "q": "في الحادث أعلاه، اذكر ضابطاً تقنياً واحداً وسياسة واحدة كانا سيمنعان التسريب.", "e": "تقنياً: تشفير القرص كاملاً (BitLocker) فلا تُقرأ البيانات بعد السرقة، أو DLP يمنع تصدير القائمة أو إرسالها لبريد خارجي. سياسةً: منع تخزين بيانات المتقدمين على الأجهزة المحمولة ومنع استخدام البريد الشخصي للعمل. وبشرياً: تدريب الموظفين على التعامل مع الـ PII.", "kw": [["تشفير", "encrypt", "bitlocker", "fde", "dlp", "vpn"], ["سياس", "policy", "منع", "يمنع", "حظر"]]}}], "test": [{"k": "mc", "q": "أي تطابق (حالة البيانات ← ضابط رئيسي) صحيح؟", "e": "النقل يُحمى بتشفير القناة. المخزَّن يُحمى بتشفير القرص والتحكم بالوصول.", "o": ["At rest ← TLS", "In transit ← VPN أو TLS", "In process ← Cable lock"], "a": 1}, {"k": "tf", "q": "الشبكات السلكية لا يمكن التنصت عليها إطلاقاً.", "e": "يمكن التنصت عليها بوصول فيزيائي للكابل أو لجهاز شبكة، أو بهجمات مثل ARP poisoning. هي فقط أصعب من اللاسلكية.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "10.3 Cybersecurity Countermeasures", "kind": "lesson", "cs": [{"t": "Hardware-Based and Software-Based Technologies", "b": "<p>البعد الثالث للمكعب: الضوابط. أولها <b>التقنية<\/b>، وهي أربعة أصناف:<\/p><ul><li><b>Software-based<\/b>: برامج تحمي الأنظمة: Software firewalls، ماسحات المنافذ والشبكة، محللات البروتوكولات (Wireshark)، ماسحات الثغرات (<b>Vulnerability scanners<\/b>)، و Host-based IDS.<\/li><li><b>Hardware-based<\/b>: أجهزة مخصصة: Firewall appliances، أجهزة IDS/IPS، وأنظمة فلترة المحتوى.<\/li><li><b>Network-based<\/b>: تقنيات تحمي على مستوى الشبكة: <b>VPN<\/b>، <b>NAC<\/b>، وأمن نقاط الوصول اللاسلكية.<\/li><li><b>Cloud-based<\/b>: الحماية كخدمة من مزوّد: SaaS و IaaS و PaaS، وأجهزة أمن افتراضية (<b>Virtual security appliances<\/b>) تعمل داخل بيئة افتراضية.<\/li><\/ul><p>التقنية أسهل الضوابط شراءً وأكثرها إغراءً، لكنها لا تعمل وحدها: Firewall بإعداد خاطئ، أو IDS لا يقرأ أحد تنبيهاته، لا يحميان شيئاً.<\/p>", "q": {"k": "mc", "q": "ما وظيفة الـ Vulnerability scanner؟", "e": "يقارن ما على الأجهزة من نسخ وإعدادات بقواعد ثغرات معروفة ويعطي تقريراً بما يجب إصلاحه.", "o": ["تشفير الملفات", "فحص الأنظمة بحثاً عن ثغرات معروفة وإعدادات ضعيفة", "إرسال البريد"], "a": 1}}, {"t": "Establishing a Culture of Cybersecurity Awareness", "b": "<p>الضابط الثاني: <b>الناس<\/b>. الاستثمار في التقنية يضيع إن ظل الموظف يفتح كل مرفق. التوعية ليست محاضرة سنوية؛ هي <b>ثقافة<\/b> مستمرة.<\/p><p>عناصر برنامج توعية ناجح:<\/p><ul><li>جعل التدريب الأمني جزءاً من <b>استقبال الموظف الجديد<\/b>.<\/li><li>ربط الوعي الأمني <b>بمتطلبات الوظيفة وتقييم الأداء<\/b>.<\/li><li>دورات حضورية وعبر الإنترنت، قصيرة ومتكررة.<\/li><li><b>محاكاة التصيد<\/b>: رسائل تجريبية لقياس من ينقر، وتدريب من وقع دون عقاب.<\/li><li>حملات وملصقات ونشرات تذكّر بالتهديدات الجارية.<\/li><li><b>قناة تبليغ سهلة<\/b>، وشكر من يبلّغ، وعدم لوم من يعترف بخطأ سريعاً.<\/li><\/ul><p>المؤشر الحقيقي للنجاح: أن يبلّغ الموظفون عن المشبوه من تلقاء أنفسهم. موظف يخفي خطأه خوفاً من العقاب يمنح المهاجم ساعات ثمينة.<\/p>", "q": {"k": "mc", "q": "موظف نقر رابط تصيد ثم أبلغ فريق الأمن خلال دقيقتين. ما رد الفعل الذي يبني ثقافة أمنية سليمة؟", "e": "العقاب يعلّم الناس إخفاء الأخطاء. التبليغ السريع أثمن ما في الاستجابة، فيُشجَّع.", "o": ["معاقبته علناً ليتعظ الآخرون", "شكره على التبليغ السريع ومعالجة الحادث ثم تدريبه", "تجاهل البلاغ"], "a": 1}}, {"t": "Policies", "b": "<p>الضابط الثالث: <b>السياسات والممارسات<\/b>. ولها أربعة مستويات، من العام للخاص: Policies ثم Standards ثم Guidelines ثم Procedures.<\/p><p><b>Security policy<\/b> وثيقة رسمية من الإدارة العليا تحدد أهداف الأمن، وقواعد سلوك المستخدمين والمديرين، ومتطلبات الأنظمة. تقول <b>ماذا<\/b> يجب، ولا تدخل في كيف. وهي <b>ملزمة<\/b>.<\/p><p>سياسات فرعية شائعة:<\/p><ul><li><b>Identification and authentication policy<\/b>: من يُسمح له بالوصول وكيف تُتحقق هويته.<\/li><li><b>Password policy<\/b>: متطلبات كلمات السر.<\/li><li><b>Acceptable Use Policy (AUP)<\/b>: ما يُسمح للموظف بفعله على أجهزة المؤسسة وشبكتها، وعواقب المخالفة. هي أكثر ما يراه الموظف.<\/li><li><b>Remote access policy<\/b>: كيف يتصل العاملون عن بعد.<\/li><li><b>Network maintenance policy<\/b>: إجراءات تحديث الأنظمة.<\/li><li><b>Incident handling policy<\/b>: كيف يُتعامل مع الحوادث.<\/li><\/ul><p>السياسة تمنح فريق الأمن سنداً من الإدارة، وتحدد العواقب القانونية للمخالفة.<\/p>", "q": {"k": "mc", "q": "أي سياسة تحدد ما يجوز للموظف فعله على حاسوب العمل وشبكة الشركة؟", "e": "الـ AUP تحدد الاستخدام المقبول للموارد والعواقب عند المخالفة.", "o": ["Incident handling policy", "Acceptable Use Policy", "Network maintenance policy"], "a": 1}}, {"t": "Standards", "b": "<p><b>Standards<\/b> (المعايير) تترجم السياسة إلى متطلبات <b>محددة وقابلة للقياس<\/b>، فتضمن الاتساق: كل الأجهزة والأشخاص يطبقون الشيء نفسه بالطريقة نفسها. وهي <b>ملزمة<\/b> كالسياسة.<\/p><p>مثال التدرج:<\/p><ul><li>السياسة: «يجب حماية الوصول للأنظمة بكلمات سر قوية».<\/li><li>المعيار: «كلمة السر 14 حرفاً على الأقل، وتُقفل الحسابات بعد 5 محاولات فاشلة، و MFA إلزامي للوصول عن بعد».<\/li><\/ul><p>معايير أخرى: أي نظام تشغيل ونسخة تُعتمد، أي خوارزمية تشفير (AES-256)، أي بروتوكول (TLS 1.2 فأعلى).<\/p><p>وهناك معايير خارجية تتبناها المؤسسات أو تُلزم بها: <b>ISO/IEC 27001<\/b> لإدارة أمن المعلومات، <b>NIST Cybersecurity Framework<\/b>، و <b>PCI DSS<\/b> لمن يعالج بطاقات الدفع.<\/p><p>الفائدة: التوحيد يسهّل الإدارة والتدقيق، ويجعل الانحراف ظاهراً.<\/p>", "q": {"k": "mc", "q": "«تُشفَّر كل الحواسيب المحمولة بخوارزمية AES-256». ما مستوى هذه الوثيقة؟", "e": "متطلب محدد وقابل للقياس وملزم هو معيار. السياسة أعم منه.", "o": ["Policy", "Standard", "Guideline"], "a": 1}}, {"t": "Guidelines", "b": "<p><b>Guidelines<\/b> (الإرشادات) قائمة اقتراحات لأداء العمل بكفاءة وأمان أكبر. تشبه المعايير، لكنها <b>غير ملزمة<\/b>: توصيات مرنة تترك مجالاً للتقدير.<\/p><p>تُستخدم حين لا يوجد معيار يغطي الحالة، أو لمساعدة الناس على تطبيق المعيار جيداً.<\/p><p>مثال: المعيار يلزم بكلمة سر من 14 حرفاً. الإرشاد يقترح: «استخدم عبارة من أربع كلمات غير مترابطة، واحفظ كلماتك في مدير كلمات سر».<\/p><p>مصادر إرشادات مرجعية:<\/p><ul><li><b>NIST<\/b> (المعهد الوطني الأمريكي للمعايير والتقنية) ومنشوراته.<\/li><li><b>NSA<\/b> وأدلة الإعداد الآمن.<\/li><li><b>CIS Benchmarks<\/b> لتقوية الأنظمة.<\/li><li><b>Common Criteria<\/b>.<\/li><\/ul><p>الفرق في كلمة: المعيار «يجب»، والإرشاد «يُستحسن».<\/p>", "q": {"k": "mc", "q": "ما الفرق الأساسي بين Standard و Guideline؟", "e": "Standard = يجب. Guideline = يُستحسن.", "o": ["المعيار أقصر", "المعيار ملزم، والإرشاد توصية غير ملزمة", "الإرشاد تكتبه الحكومة فقط"], "a": 1}}, {"t": "Procedures", "b": "<p><b>Procedures<\/b> (الإجراءات) أطول الوثائق وأكثرها تفصيلاً: تعليمات <b>خطوة بخطوة<\/b> لتنفيذ مهمة محددة. تجيب عن <b>كيف<\/b> بالضبط، وتتضمن غالباً لقطات شاشة وأوامر. وهي <b>ملزمة<\/b>.<\/p><p>مثال إجراء «تغيير كلمة السر في Windows»:<\/p><ul><li>اضغط <code dir=\"ltr\">Ctrl+Alt+Del<\/code>.<\/li><li>اختر Change a password.<\/li><li>أدخل الكلمة الحالية ثم الجديدة مرتين.<\/li><li>اضغط Enter.<\/li><\/ul><p>أمثلة أخرى: إجراء إنشاء حساب لموظف جديد، إجراء النسخ الاحتياطي والاسترجاع، إجراء الاستجابة لإصابة بـ Ransomware (ويسمى <b>Playbook<\/b> أو Runbook).<\/p><p>التدرج كاملاً:<\/p><div class=\"tw\"><table><tr><th>المستوى<\/th><th>يجيب عن<\/th><th>ملزم؟<\/th><th>مثال<\/th><\/tr><tr><td>Policy<\/td><td>ماذا ولماذا<\/td><td>نعم<\/td><td>تُحمى الأنظمة بكلمات سر قوية<\/td><\/tr><tr><td>Standard<\/td><td>ما المقياس<\/td><td>نعم<\/td><td>14 حرفاً و MFA<\/td><\/tr><tr><td>Guideline<\/td><td>ما الأفضل<\/td><td>لا<\/td><td>استخدم عبارة ومدير كلمات<\/td><\/tr><tr><td>Procedure<\/td><td>كيف بالخطوات<\/td><td>نعم<\/td><td>اضغط كذا ثم كذا<\/td><\/tr><\/table><\/div><p>فائدة الإجراء: أي موظف ينفذ المهمة بالطريقة نفسها، ولا تضيع المعرفة برحيل شخص.<\/p>", "q": {"k": "mc", "q": "وثيقة فيها عشر خطوات مرقمة مع أوامر لاسترجاع نسخة احتياطية. ما نوعها؟", "e": "التعليمات التفصيلية خطوة بخطوة لتنفيذ مهمة بعينها هي Procedure.", "o": ["Policy", "Guideline", "Procedure"], "a": 2}}], "test": [{"k": "mc", "q": "تمرين «Apply Your Knowledge»: رتّب من الأعم إلى الأخص.", "e": "السياسة تحدد الهدف، المعيار يحدد المقياس، الإرشاد يوصي، والإجراء يفصّل الخطوات.", "o": ["Procedure ثم Standard ثم Policy ثم Guideline", "Policy ثم Standard ثم Guideline ثم Procedure", "Guideline ثم Policy ثم Procedure ثم Standard"], "a": 1}, {"k": "mc", "q": "شركة اشترت أحدث Firewall و EDR، لكن لا توجد سياسة مكتوبة ولا تدريب. ما تقييمك وفق المكعب؟", "e": "الـ Safeguards ثلاثة أنواع تعمل معاً. التقنية دون سياسة تحكمها وناس يحسنون استخدامها ناقصة.", "o": ["حماية كاملة", "ضابط واحد من ثلاثة: التقنية حاضرة والسياسات والناس غائبان", "لا حماية إطلاقاً"], "a": 1}, {"k": "sa", "q": "أعطِ مثالاً واحداً من عندك يوضح تدرج Policy ثم Standard ثم Procedure لموضوع النسخ الاحتياطي.", "e": "Policy: «تُحفظ نسخ احتياطية لكل البيانات الحرجة». Standard: «نسخة يومية كاملة مشفرة، تُحفظ 30 يوماً، ونسخة خارج الموقع، واختبار استرجاع شهري». Procedure: خطوات مرقمة لتشغيل النسخ والتحقق منه واسترجاع ملف.", "kw": [["نسخ", "backup"], ["يوم", "أسبوع", "ساع", "daily", "خطو", "step"]]}]}, {"t": "10.4 ملخص الوحدة 10 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li><b>Cybersecurity Cube<\/b>: ثلاثة أبعاد: المبادئ (CIA)، حالات البيانات (At rest، In transit، In process)، والضوابط (Technology، Policies، People).<\/li><li><b>Confidentiality<\/b>: تشفير، مصادقة (ثلاثة عوامل و MFA)، تفويض، Least Privilege و Need to know. والبيانات الحساسة: PII، Business، Classified.<\/li><li><b>Integrity<\/b>: Hashing، HMAC، توقيع رقمي، Validation، تحكم بالوصول.<\/li><li><b>Availability<\/b>: Five nines (5.26 دقيقة سنوياً)، Redundancy، نسخ احتياطي مختبَر، خطة تعافٍ.<\/li><li><b>At rest<\/b>: DAS، RAID، NAS، SAN، Cloud. <b>In transit<\/b>: Sneaker net، سلكي، لاسلكي، ويُحمى بـ VPN و TLS. <b>In process<\/b>: Input، Modification، Output، وهي الأصعب.<\/li><li><b>الضوابط<\/b>: تقنيات برمجية وعتادية وشبكية وسحابية، ثقافة توعية، ثم Policy و Standard و Guideline و Procedure.<\/li><\/ul>", "q": {"k": "mc", "q": "أي سؤال يمثل خانة واحدة من المكعب؟", "e": "مبدأ (Integrity) × حالة (In transit) × ضابط (Technology) = خانة واحدة، وجوابها HMAC أو TLS.", "o": ["كيف أضمن سلامة البيانات أثناء النقل باستخدام التقنية؟", "كم سعر الـ Firewall؟", "من مدير الشركة؟"], "a": 0}}], "test": []}, {"t": "اختبار الوحدة 10", "kind": "exam", "pool": [11], "n": 12}]}, {"n": "C2", "t": "Checkpoint Exam: OS and Endpoint Security", "secs": [{"t": "Checkpoint Exam 2 (الوحدات 7 إلى 10)", "kind": "exam", "pool": [8, 9, 10, 11], "n": 25}]}, {"n": "F", "t": "Endpoint Security (ESec) Final Exam", "secs": [{"t": "Course Final Exam (كل الوحدات)", "kind": "exam", "pool": [0, 1, 2, 3, 4, 5, 6, 8, 9, 10, 11], "n": 40}]}], "proj": {"t": "المشروع النهائي: تقييم وتأمين شبكة «عيادات النخيل»", "b": "<p>أنت محلل أمن مبتدئ كُلِّفت بأول مهمة مستقلة. <b>عيادات النخيل<\/b> مجموعة طبية صغيرة طلبت تقييماً أمنياً بعد حادث مريب. ستعمل على سبع مهام متدرجة الصعوبة، تغطي مخرجات الدورة الخمسة.<\/p><p><b>وصف المؤسسة:<\/b><\/p><ul><li>مقر رئيسي فيه 30 موظفاً، وفرع فيه 8 موظفين يتصل بالمقر عبر الإنترنت دون تشفير.<\/li><li>خادم ملفات Windows Server فيه ملفات المرضى، وخادم Linux (Ubuntu) يشغّل موقع حجز المواعيد وقاعدة بياناته. الخادمان والحواسيب والطابعات على شبكة واحدة <code dir=\"ltr\">192.168.10.0/24<\/code>.<\/li><li>Wi-Fi واحد باسم <code dir=\"ltr\">Nakheel<\/code> بتشفير WPA2-Personal وكلمة سر لم تتغير منذ ثلاث سنوات، يستخدمه الموظفون والمرضى في قاعة الانتظار.<\/li><li>حواسيب Windows 11، وأربعة على Windows 10. الجميع مدير محلي. Defender مفعّل. لا إدارة مركزية للتحديثات.<\/li><li>الأطباء يحملون Laptops غير مشفرة للمنزل، وينقلون صور الأشعة على USB.<\/li><li>Router واحد من مزود الإنترنت يعمل كـ Firewall بإعداداته الافتراضية، والمنفذ 3389 مُحوَّل منه إلى خادم الملفات «ليدخل المدير من البيت».<\/li><li>لا سياسة أمن مكتوبة ولا تدريب.<\/li><\/ul><p><b>كيف تعمل:<\/b> اكتب حلّك في خانة كل مهمة أولاً. التلميحات اختيارية. الحل النموذجي لا يُفتح قبل أن تكتب محاولة حقيقية. بعد فتحه قيّم نفسك بصدق في نقاط التحقق. حلول هذه المهام ليست وحيدة؛ المهم منطقك وتغطيتك للنقاط الأساسية.<\/p>", "tasks": [{"t": "المهمة 1: جرد البيانات وتصنيفها بحسب حالتها", "b": "<p><b>الهدف:<\/b> أن تثبت قدرتك على شرح كيف تفرض أنواع البيانات وحالاتها تحديات مختلفة.<\/p><p><b>المطلوب:<\/b><\/p><ul><li>حدد ثلاثة أنواع بيانات على الأقل في العيادة وصنّف حساسية كل منها (PII، Business، عادية).<\/li><li>لملفات المرضى تحديداً: اذكر أين توجد في كل حالة من الحالات الثلاث (At rest، In transit، In process) داخل هذه المؤسسة.<\/li><li>لكل حالة: ما الخطر القائم الآن، وأي مبدأ من الـ CIA يهدده؟<\/li><\/ul>", "h": ["ابدأ من وصف المؤسسة وتتبّع رحلة ملف مريض واحد: أين يُخزَّن؟ كيف ينتقل بين المقر والفرع وإلى بيت الطبيب؟ ومتى يُفتح ويُعدَّل؟", "لا تنسَ الوسائط المنسية: USB، الـ Laptops، والنسخ الاحتياطية إن وُجدت.", "استخدم جدولاً بأعمدة: الحالة، المكان، الخطر، المبدأ المهدد."], "ck": ["حددت ثلاثة أنواع بيانات على الأقل وصنّفت ملفات المرضى على أنها PII عالية الحساسية.", "غطيت الحالات الثلاث كلها بأمثلة من هذه المؤسسة تحديداً.", "ربطت كل خطر بمبدأ CIA صحيح.", "لاحظت أن الـ Laptops والـ USB تخزين At rest غير مشفر، وأن رابط الفرع نقل In transit غير مشفر."], "s": "<p><b>أنواع البيانات:<\/b><\/p><div class=\"tw\"><table><tr><th>البيانات<\/th><th>التصنيف<\/th><th>الحساسية<\/th><\/tr><tr><td>ملفات المرضى وصور الأشعة<\/td><td>PII وبيانات صحية<\/td><td>حرجة، وتخضع غالباً لتشريعات<\/td><\/tr><tr><td>بيانات الحجز (أسماء، هواتف)<\/td><td>PII<\/td><td>عالية<\/td><\/tr><tr><td>الرواتب والعقود والأسعار<\/td><td>Business information<\/td><td>عالية<\/td><\/tr><tr><td>حسابات الدخول وكلمات السر<\/td><td>بيانات مصادقة<\/td><td>حرجة<\/td><\/tr><tr><td>محتوى الموقع العام<\/td><td>عامة<\/td><td>منخفضة سرية، مهمة سلامة وتوافراً<\/td><\/tr><\/table><\/div><p><b>ملفات المرضى عبر الحالات الثلاث:<\/b><\/p><div class=\"tw\"><table><tr><th>الحالة<\/th><th>أين<\/th><th>الخطر القائم<\/th><th>المبدأ المهدد<\/th><\/tr><tr><td>At rest<\/td><td>خادم الملفات<\/td><td>على شبكة مسطحة مع كل الأجهزة، و RDP مكشوف للإنترنت<\/td><td>Confidentiality و Availability (فدية)<\/td><\/tr><tr><td>At rest<\/td><td>Laptops الأطباء و USB<\/td><td>غير مشفرة، تُسرق أو تضيع<\/td><td>Confidentiality<\/td><\/tr><tr><td>In transit<\/td><td>بين الفرع والمقر<\/td><td>عبر الإنترنت دون تشفير، قابلة للتنصت والتعديل<\/td><td>Confidentiality و Integrity<\/td><\/tr><tr><td>In transit<\/td><td>عبر Wi-Fi مشترك مع المرضى<\/td><td>من يعرف كلمة السر يتنصت أو ينفذ MitM<\/td><td>Confidentiality و Integrity<\/td><\/tr><tr><td>In process<\/td><td>حواسيب الموظفين عند الفتح والتعديل<\/td><td>الكل مدير محلي، فأي Malware يقرأ ويعدّل<\/td><td>الثلاثة<\/td><\/tr><tr><td>In process<\/td><td>تطبيق الحجز على خادم Linux<\/td><td>مدخلات المستخدمين قد لا تُفحص<\/td><td>Integrity و Confidentiality<\/td><\/tr><\/table><\/div><p><b>الخلاصة:<\/b> البيانات نفسها تحتاج ضابطاً مختلفاً في كل حالة: تشفير القرص للمخزَّن، VPN/TLS للمنتقل، وصلاحيات محدودة مع Input validation أثناء المعالجة.<\/p>"}, {"t": "المهمة 2: قراءة الحادث وتصنيف الهجمات", "b": "<p><b>الهدف:<\/b> تمييز أنواع الهجمات من أوصافها وسجلاتها.<\/p><p>موظفة الاستقبال أبلغت عن الآتي خلال أسبوع. صنّف كل بند: ما نوع الهجوم أو التهديد؟ وما الدليل في النص؟<\/p><p><b>(أ)<\/b> رسالة بريد «من مدير العيادة» تطلب شراء بطاقات هدايا عاجلاً وإرسال أرقامها، والعنوان <code dir=\"ltr\">director@nakheel-cl1nic.com<\/code>.<\/p><p><b>(ب)<\/b> مريض في قاعة الانتظار شكا أن هاتفه يرى شبكتين باسم <code dir=\"ltr\">Nakheel<\/code>.<\/p><p><b>(ج)<\/b> سطر متكرر في سجل موقع الحجز:<\/p><pre dir=\"ltr\"><code>198.51.100.77 - - [03/May/2026:02:11:40] &quot;GET /booking?id=12&#x27; OR &#x27;1&#x27;=&#x27;1 HTTP/1.1&quot; 200 48211<\/code><\/pre><p><b>(د)<\/b> في Event Viewer على خادم الملفات: 2300 حدث برقم 4625 لحساب Administrator من عناوين خارجية خلال ليلة، ثم حدث 4624.<\/p><p><b>(هـ)<\/b> في الصباح وُجدت ملفات مجلد مشارك بامتداد غريب، وفي كل مجلد ملف نصي يطلب دفع مبلغ.<\/p>", "h": ["للبند (أ): دقق في اسم النطاق حرفاً حرفاً، ولاحظ أسلوب الاستعجال والسلطة.", "للبند (ج): حجم الرد 48211 بايت أكبر كثيراً من صفحة حجز واحدة. ماذا يعني ذلك مع الرمز 200؟", "البنود (د) و(هـ) قد تكون مرحلتين من هجوم واحد. اربطها بإعداد الـ Router في وصف المؤسسة."], "ck": ["صنّفت البنود الخمسة تصنيفاً صحيحاً.", "استخرجت دليلاً من النص نفسه لكل تصنيف.", "ربطت البندين (د) و(هـ) بمنفذ RDP المكشوف كسلسلة هجوم واحدة.", "لاحظت أن رد الخادم في (ج) يدل على نجاح محتمل وليس مجرد محاولة."], "s": "<div class=\"tw\"><table><tr><th>البند<\/th><th>التصنيف<\/th><th>الدليل<\/th><\/tr><tr><td>أ<\/td><td>Phishing موجَّه ينتحل المدير (Impersonation)، مع Typosquatting وتكتيكي Authority و Urgency<\/td><td>النطاق فيه الرقم 1 بدل الحرف i، وطلب مالي عاجل غير معتاد<\/td><\/tr><tr><td>ب<\/td><td>Evil twin محتمل (أو Rogue AP)<\/td><td>شبكتان بالـ SSID نفسه، والعيادة تملك نقطة واحدة<\/td><\/tr><tr><td>ج<\/td><td>SQL injection على تطبيق الحجز<\/td><td>رموز SQL في قيمة id، والخادم ردّ بـ 200 وبحجم كبير، ما يرجّح أن الاستعلام أعاد سجلات كثيرة: تسريب محتمل لبيانات الحجز<\/td><\/tr><tr><td>د<\/td><td>Brute force على RDP انتهى بنجاح<\/td><td>سيل 4625 ثم 4624 لحساب Administrator من الخارج<\/td><\/tr><tr><td>هـ<\/td><td>Ransomware<\/td><td>ملفات مشفرة بامتداد جديد ورسالة فدية<\/td><\/tr><\/table><\/div><p><b>سلسلة الهجوم المرجحة (د ثم هـ):<\/b> المنفذ 3389 محوَّل من الإنترنت إلى خادم الملفات. المهاجمون وجدوه بالمسح (Reconnaissance)، خمّنوا كلمة سر Administrator (Initial access)، ثم شغّلوا برنامج الفدية على المشاركات (Impact). غياب قفل الحساب و MFA جعل التخمين ممكناً.<\/p><p><b>أولوية الاستجابة:<\/b> عزل خادم الملفات عن الشبكة، إغلاق تحويل 3389 فوراً، تغيير كل كلمات السر، حفظ السجلات، وتبليغ الإدارة. والبند (ج) يُعامل كتسريب بيانات حتى يثبت العكس.<\/p>"}, {"t": "المهمة 3: توثيق إجراءات التخفيف وترتيبها بالأولوية", "b": "<p><b>الهدف:<\/b> توثيق واقتراح إجراءات Mitigation مناسبة لهذه المؤسسة بالذات.<\/p><p><b>المطلوب:<\/b> جدول من عشرة بنود على الأقل، بالأعمدة: التهديد أو الثغرة، الاحتمال (1 إلى 3)، الأثر (1 إلى 3)، درجة الخطر، إجراء التخفيف، نوع الضابط (Technology، Policy، People).<\/p><p>احسب درجة الخطر:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>Risk<\/mtext><mo>=<\/mo><mtext>Likelihood<\/mtext><mo>×<\/mo><mtext>Impact<\/mtext><\/mrow><\/math><\/p><p>ثم رتّب الجدول تنازلياً، وحدد أي ثلاثة إجراءات تُنفَّذ <b>اليوم<\/b>.<\/p>", "h": ["ارجع لوصف المؤسسة سطراً سطراً. كل سطر تقريباً يخفي ثغرة.", "ميزانية عيادة صغيرة محدودة. قدّم الإجراءات المجانية أو الرخيصة ذات الأثر الكبير: إغلاق منفذ، تفعيل ميزة موجودة، تغيير إعداد.", "لا تجعل كل الضوابط تقنية. المكعب يذكّرك بالسياسات والناس."], "ck": ["جدولي فيه عشرة بنود على الأقل، ولكل بند درجة خطر محسوبة.", "وضعت RDP المكشوف والنسخ الاحتياطي ضمن أعلى الأولويات.", "لكل تهديد إجراء محدد قابل للتنفيذ، وليس عبارة عامة مثل «تحسين الأمن».", "تضمّن الجدول ضوابط من الأنواع الثلاثة: Technology و Policy و People.", "راعيت واقع المؤسسة: حجمها وميزانيتها."], "s": "<div class=\"tw\"><table><tr><th>التهديد / الثغرة<\/th><th>L<\/th><th>I<\/th><th>Risk<\/th><th>التخفيف<\/th><th>النوع<\/th><\/tr><tr><td>RDP مكشوف للإنترنت<\/td><td>3<\/td><td>3<\/td><td>9<\/td><td>إلغاء تحويل 3389 فوراً، والوصول عبر VPN مع MFA<\/td><td>Technology<\/td><\/tr><tr><td>لا نسخ احتياطي معزول<\/td><td>3<\/td><td>3<\/td><td>9<\/td><td>نسخ يومي بقاعدة 3-2-1 مع نسخة Offline واختبار استرجاع شهري<\/td><td>Technology + Policy<\/td><\/tr><tr><td>الكل مدير محلي<\/td><td>3<\/td><td>3<\/td><td>9<\/td><td>حسابات Standard للعمل اليومي وحساب مدير منفصل<\/td><td>Technology<\/td><\/tr><tr><td>شبكة مسطحة تجمع الخوادم والضيوف<\/td><td>3<\/td><td>3<\/td><td>9<\/td><td>تقسيم الشبكة (المهمة 4)<\/td><td>Technology<\/td><\/tr><tr><td>ثغرة SQL injection في الحجز<\/td><td>3<\/td><td>3<\/td><td>9<\/td><td>إصلاح الكود بـ Parameterized queries، و WAF، وأقل صلاحيات لحساب قاعدة البيانات<\/td><td>Technology<\/td><\/tr><tr><td>Wi-Fi مشترك بكلمة قديمة<\/td><td>3<\/td><td>2<\/td><td>6<\/td><td>شبكة ضيوف معزولة، و WPA3 أو WPA2-Enterprise للموظفين<\/td><td>Technology<\/td><\/tr><tr><td>Laptops و USB غير مشفرة<\/td><td>2<\/td><td>3<\/td><td>6<\/td><td>BitLocker على كل الأجهزة، ومنع USB أو فرض BitLocker To Go<\/td><td>Technology + Policy<\/td><\/tr><tr><td>Phishing وانتحال المدير<\/td><td>3<\/td><td>2<\/td><td>6<\/td><td>تدريب ومحاكاة، قاعدة تحقق هاتفي لأي طلب مالي، و MFA على البريد<\/td><td>People + Policy<\/td><\/tr><tr><td>رابط الفرع غير مشفر<\/td><td>2<\/td><td>3<\/td><td>6<\/td><td>Site-to-site VPN<\/td><td>Technology<\/td><\/tr><tr><td>لا قفل حسابات ولا سياسة كلمات سر<\/td><td>3<\/td><td>2<\/td><td>6<\/td><td>Account Lockout و 14 حرفاً و MFA<\/td><td>Technology + Policy<\/td><\/tr><tr><td>أربعة أجهزة Windows 10 منتهية الدعم<\/td><td>2<\/td><td>2<\/td><td>4<\/td><td>ترقيتها أو استبدالها، وعزلها مؤقتاً<\/td><td>Technology<\/td><\/tr><tr><td>لا إدارة تحديثات<\/td><td>2<\/td><td>2<\/td><td>4<\/td><td>تحديث تلقائي مفروض وتقرير شهري<\/td><td>Technology + Policy<\/td><\/tr><tr><td>Router بإعدادات افتراضية<\/td><td>2<\/td><td>2<\/td><td>4<\/td><td>تغيير كلمة المدير، تحديث الـ Firmware، تعطيل الإدارة عن بعد و WPS<\/td><td>Technology<\/td><\/tr><tr><td>لا سياسة مكتوبة<\/td><td>3<\/td><td>1<\/td><td>3<\/td><td>AUP قصيرة وسياسة تعامل مع بيانات المرضى<\/td><td>Policy<\/td><\/tr><\/table><\/div><p><b>ما يُنفَّذ اليوم (مجاني وفوري):<\/b> إغلاق تحويل 3389، تغيير كل كلمات سر المديرين وتفعيل قفل الحسابات، وأخذ نسخة احتياطية تُفصل عن الشبكة.<\/p><p><b>هذا الأسبوع:<\/b> حسابات Standard، BitLocker، شبكة ضيوف، وإصلاح ثغرة الحجز.<\/p>"}, {"t": "المهمة 4: تصميم الشبكة وإعدادها وفق متطلبات المؤسسة", "b": "<p><b>الهدف:<\/b> إعداد شبكة (على الورق) تلبي متطلبات محددة: Zones و ACL و WLAN.<\/p><p><b>متطلبات الإدارة:<\/b><\/p><ul><li>المرضى يحصلون على إنترنت فقط.<\/li><li>موقع الحجز متاح للعامة عبر HTTPS فقط.<\/li><li>ملفات المرضى يصلها الموظفون فقط، ولا تُرى من الإنترنت.<\/li><li>المدير يدخل من منزله بأمان.<\/li><li>الفرع يعمل كأنه في المقر.<\/li><\/ul><p><b>المطلوب:<\/b><\/p><ul><li>قسّم الشبكة إلى مناطق (Zones / VLANs) وسمِّ ما في كل منطقة.<\/li><li>اكتب قواعد الفلترة بين المناطق بصيغة: من، إلى، الخدمة، القرار.<\/li><li>حدد إعدادات الـ WLAN للموظفين وللضيوف.<\/li><li>اذكر خدمتين من خدمات الرؤية (وحدة 6) تفعّلهما ولماذا.<\/li><\/ul>", "h"
