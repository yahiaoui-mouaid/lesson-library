<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دورة Endpoint Security التفاعلية</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#17202c;--mut:#5a6677;--ac:#0b7285;--ac2:#e3f3f5;--ok:#2b8a3e;--okb:#e6f5e9;--no:#c92a2a;--nob:#fbe9e9;--line:#dae1e9;--code:#eef1f5;--warn:#b7791f}
html[data-theme=dark]{--bg:#0e151e;--card:#16202c;--ink:#e4ebf3;--mut:#93a1b3;--ac:#3bc9db;--ac2:#11303a;--ok:#69db7c;--okb:#12301b;--no:#ff8787;--nob:#3a1a1a;--line:#273545;--code:#0f1822;--warn:#f0c36b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro","Arial",sans-serif;font-size:17px;line-height:1.9}
button{font:inherit;cursor:pointer;color:inherit}
header{position:fixed;top:0;right:0;left:0;height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:20}
.brand{font-weight:700;white-space:nowrap;font-size:16px}
.brand small{color:var(--ac);font-weight:600;margin-inline-start:6px}
.prog{flex:1;height:10px;background:var(--code);border-radius:6px;overflow:hidden;min-width:60px}
#bar{height:100%;width:0;background:var(--ac);transition:width .3s}
#pct{font-size:14px;color:var(--mut);min-width:44px;text-align:center}
.hb{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px}
.hb:hover{border-color:var(--ac)}
#resetBtn.arm{background:var(--no);color:#fff;border-color:var(--no)}
#menuBtn{display:none}
nav{position:fixed;top:58px;right:0;bottom:0;width:310px;background:var(--card);border-inline-start:1px solid var(--line);overflow-y:auto;padding:10px;z-index:15}
nav a{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.6}
nav a:hover{background:var(--ac2)}
nav a.cur{background:var(--ac2);color:var(--ac);font-weight:700}
nav a .tk{flex:none;width:17px;height:17px;border:1.5px solid var(--line);border-radius:50%;margin-top:4px;font-size:11px;line-height:14px;text-align:center}
nav a.done .tk{background:var(--ok);border-color:var(--ok);color:#fff}
nav a.done .tk::before{content:"✓"}
nav details{border-bottom:1px solid var(--line);padding:3px 0}
nav summary{cursor:pointer;padding:7px 6px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;list-style:none}
nav summary::-webkit-details-marker{display:none}
nav summary .cnt{font-weight:400;color:var(--mut);font-size:12.5px;white-space:nowrap;direction:ltr}
nav .top a{font-weight:700}
main{margin:58px 310px 0 0;padding:26px 22px 80px}
.wrap{max-width:860px;margin:0 auto}
.crumb{color:var(--ac);font-size:14px;font-weight:600}
h1{font-size:27px;margin:.1em 0 .5em;line-height:1.5}
h2{font-size:21px;margin:1.4em 0 .5em}
h3{font-size:18px;margin:1.2em 0 .4em}
p{margin:.55em 0}
ul{margin:.4em 0;padding-inline-start:1.4em}
li{margin:.2em 0}
code{background:var(--code);padding:1px 6px;border-radius:5px;font-family:Consolas,"Courier New",monospace;font-size:.9em;unicode-bidi:isolate}
pre{background:var(--code);border:1px solid var(--line);border-radius:9px;padding:12px 14px;overflow-x:auto;text-align:left;position:relative;line-height:1.55;font-size:14.5px}
pre code{background:none;padding:0}
pre .cp{position:absolute;top:6px;right:6px;font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
math{font-size:1.12em;unicode-bidi:isolate}
math[display=block]{margin:.7em auto;font-size:1.25em}
.tw{overflow-x:auto;margin:.6em 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
th{background:var(--ac2)}
.note{border-inline-start:4px solid var(--ac);background:var(--ac2);padding:8px 14px;border-radius:6px;margin:.7em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:14px 0}
details.concept{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0}
details.concept>summary{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;list-style:none}
details.concept>summary::-webkit-details-marker{display:none}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:14px}
.ct{flex:1}
.st{font-size:12.5px;font-weight:600;padding:1px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok);border-color:transparent}
.st.no{background:var(--nob);color:var(--no);border-color:transparent}
.cb{padding:2px 20px 18px;border-top:1px solid var(--line)}
.quiz{border:1px dashed var(--ac);border-radius:10px;padding:12px 16px;margin-top:14px;background:var(--bg)}
.qk{font-size:12.5px;color:var(--ac);font-weight:700}
.qq{font-weight:600;margin:2px 0 8px}
.qa{display:flex;flex-direction:column;gap:7px}
.opt{text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:7px 12px}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default;opacity:.85}
.opt.good{border-color:var(--ok);background:var(--okb);opacity:1}
.opt.bad{border-color:var(--no);background:var(--nob);opacity:1}
textarea{width:100%;min-height:74px;font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.fb{margin-top:10px;display:none;padding:9px 13px;border-radius:8px}
.fb.ok{display:block;background:var(--okb)}
.fb.no{display:block;background:var(--nob)}
.fb .hd{font-weight:700}
.fb.ok .hd{color:var(--ok)}.fb.no .hd{color:var(--no)}
.btn{background:var(--ac);color:#fff;border:none;border-radius:8px;padding:7px 18px;font-weight:600}
html[data-theme=dark] .btn{color:#06222a}
.btn.sec{background:none;color:var(--ac);border:1.5px solid var(--ac)}
.btn.sm{padding:2px 12px;font-size:14px;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.big{font-size:40px;font-weight:800;color:var(--ac);line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stats .card{margin:0;text-align:center}
.mut{color:var(--mut);font-size:14.5px}
.hint{border:1px solid var(--line);border-radius:8px;margin:6px 0;padding:0 12px;background:var(--bg)}
.hint summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--warn)}
label.ck{display:flex;gap:9px;align-items:flex-start;margin:5px 0}
label.ck input{margin-top:9px;width:17px;height:17px}
.sol{border:1px solid var(--ok);border-radius:10px;padding:6px 16px;margin-top:10px;background:var(--okb)}
@media(max-width:900px){
 nav{transform:translateX(100%);transition:transform .25s;width:min(330px,88vw);box-shadow:0 0 30px rgba(0,0,0,.3)}
 body.open nav{transform:none}
 main{margin-right:0;padding:18px 12px 70px}
 #menuBtn{display:block}
 .brand small{display:none}
 .brand{font-size:14px}
 #resetBtn:not(.arm) .lb{display:none}
 header{gap:8px;padding:0 8px}
 body{font-size:16px}
}
@media print{header,nav,.pn{display:none}main{margin:0}}
</style>
</head>
<body>
<header>
 <button class="hb" id="menuBtn" aria-label="القائمة">☰</button>
 <div class="brand">Endpoint Security<small>الدورة التفاعلية</small></div>
 <div class="prog" title="التقدم الكلي"><div id="bar"></div></div><span id="pct">0%</span>
 <button class="hb" id="themeBtn" title="الوضع الليلي/النهاري">◐</button>
 <button class="hb" id="resetBtn" title="إعادة ضبط التقدم">↺ <span class="lb">إعادة ضبط التقدم</span></button>
</header>
<nav id="side"></nav>
<main><div class="wrap" id="main"></div></main>
<script>
"use strict";
const D={"mods": [{"n": "0", "t": "تمهيد: مقدمة الدورة والأساسيات", "secs": [{"t": "0.1 مقدمة الدورة و Packet Tracer", "kind": "lesson", "cs": [{"t": "لماذا نحتاج Cybersecurity؟", "b": "<p><b>Cybersecurity<\/b> هو مجموعة الممارسات والتقنيات التي تحمي الأنظمة والشبكات والبيانات من الوصول غير المصرّح به ومن التخريب.<\/p><p>كل جهاز متصل بالشبكة (حاسوب، هاتف، كاميرا، طابعة) هو باب محتمل للمهاجم. ومع اتصال مليارات الأجهزة يومياً يزداد عدد الأبواب. المهاجم يكفيه باب واحد مفتوح، أما المدافع فعليه حراسة الأبواب كلها. لذلك تتوسع الحماية «حتى الحافة» (the edge)، أي حتى آخر جهاز يستخدمه الموظف.<\/p><ul><li><b>Endpoint<\/b>: أي جهاز طرفي يتصل بالشبكة ويستخدمه إنسان أو خدمة (Laptop، Server، هاتف، جهاز IoT).<\/li><li>تأمين الشبكة يشمل ثلاثة أشياء: <b>Hardware<\/b> (الأجهزة)، <b>Software<\/b> (البرامج)، <b>Media<\/b> (وسائط النقل: كابلات و Wi-Fi).<\/li><\/ul>", "q": {"k": "mc", "q": "أي العبارات تصف وضع المدافع مقارنةً بالمهاجم؟", "e": "الهجوم ينجح من أضعف نقطة. لهذا يُعامل كل Endpoint على أنه جزء من سطح الهجوم.", "o": ["المدافع يحتاج لحماية أهم جهاز فقط", "المهاجم يكفيه منفذ ضعيف واحد، والمدافع يجب أن يحمي كل المنافذ", "المهاجم يجب أن يخترق كل الأجهزة حتى ينجح"], "a": 1}}, {"t": "دور الـ Junior Cybersecurity Analyst", "b": "<p>المحلل المبتدئ يعمل غالباً في <b>SOC<\/b> (Security Operations Center)، وهو الفريق الذي يراقب المؤسسة على مدار الساعة.<\/p><p>مهامه اليومية:<\/p><ul><li>مراقبة التنبيهات (<b>Alerts<\/b>) القادمة من أدوات الحماية وتحديد الحقيقي منها والكاذب (<b>False Positive<\/b>).<\/li><li>قراءة السجلات (<b>Logs<\/b>) لمعرفة ما حدث فعلاً.<\/li><li>تصعيد الحوادث الحقيقية (<b>Escalation<\/b>) إلى محلل أعلى خبرة.<\/li><li>توثيق ما وجده واقتراح إجراءات تخفيف (<b>Mitigation<\/b>).<\/li><\/ul><p>لهذا تغطي الدورة ثلاثة ميادين: الشبكة، أنظمة التشغيل (Windows و Linux)، والـ Endpoints.<\/p>", "q": {"k": "tf", "q": "تنبيه يظهر في أداة الحماية ثم يتبين أن النشاط كان عادياً ومسموحاً يُسمى False Positive.", "e": "False Positive هو إنذار كاذب. تمييزه عن الحادث الحقيقي من أهم مهام المحلل المبتدئ.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}, {"t": "Cisco Packet Tracer: الوضعان Logical و Physical", "b": "<p><b>Packet Tracer<\/b> برنامج محاكاة من Cisco تبني فيه شبكات افتراضية وتجرب إعدادها دون أجهزة حقيقية. تنزيله مجاني من موقع Networking Academy (يحتاج حساباً واتصالاً بالإنترنت مرة واحدة). الدورة هنا لا تعتمد عليه؛ هو أداة اختيارية للتطبيق.<\/p><p>فيه وضعان للعرض:<\/p><ul><li><b>Logical Mode<\/b>: يعرض الشبكة كمخطط منطقي: أجهزة وروابط بينها، دون اعتبار للمكان. فيه تضيف الأجهزة وتضبطها.<\/li><li><b>Physical Mode<\/b>: يعرض الموقع الفعلي: مدينة، مبنى، غرفة، خزانة (Rack). فيه تظهر مسافات الكابلات ومدى تغطية الـ Wi-Fi.<\/li><\/ul><p>يسمى «أداة تعلم تكيفية» لأنه يصحح نشاطك آلياً ويعطيك نسبة إنجاز وتلميحات.<\/p>", "q": {"k": "mc", "q": "تريد معرفة هل تصل إشارة الـ Access Point إلى غرفة في الطابق الثاني. أي وضع تستخدم؟", "e": "الـ Physical Mode هو الذي يمثل المباني والمسافات ومدى التغطية. الـ Logical Mode يهتم بمن يتصل بمن فقط.", "o": ["Logical Mode", "Physical Mode", "لا فرق بينهما"], "a": 1}}], "test": []}, {"t": "0.2 أساسيات لا بد منها قبل البدء", "kind": "lesson", "cs": [{"t": "الـ CIA Triad باختصار", "b": "<p>كل ما في الأمن السيبراني يخدم ثلاثة أهداف، تُسمى <b>CIA Triad<\/b>:<\/p><ul><li><b>Confidentiality<\/b> (السرية): لا يطّلع على المعلومة إلا من يحق له. مثال: التشفير.<\/li><li><b>Integrity<\/b> (السلامة): المعلومة صحيحة ولم تُعدَّل دون إذن. مثال: الـ Hash.<\/li><li><b>Availability<\/b> (التوافر): النظام والمعلومة متاحان لمن يحق له وقت الحاجة. مثال: النسخ الاحتياطي.<\/li><\/ul><p>أي هجوم ستتعلمه يضرب واحداً أو أكثر من الثلاثة. سنعود للثلاثي بالتفصيل في الوحدة 10.<\/p>", "q": {"k": "mc", "q": "موقع متجر إلكتروني توقف عن العمل ساعتين بسبب سيل من الطلبات الوهمية. أي عنصر تضرر؟", "e": "لم تُسرق بيانات ولم تُعدَّل، لكن الخدمة لم تعد متاحة لأصحابها. هذا ضرب للـ Availability.", "o": ["Confidentiality", "Integrity", "Availability"], "a": 2}}, {"t": "Threat و Vulnerability و Risk و Exploit", "b": "<p>هذه أربعة مصطلحات يخلط بينها المبتدئون:<\/p><ul><li><b>Vulnerability<\/b> (ثغرة): نقطة ضعف في نظام أو إجراء أو إنسان. مثال: نافذة بلا قفل.<\/li><li><b>Threat<\/b> (تهديد): خطر محتمل قد يستغل الثغرة. مثال: وجود لصوص في الحي.<\/li><li><b>Exploit<\/b>: الوسيلة الفعلية التي تُستغل بها الثغرة. مثال: فتح النافذة والدخول.<\/li><li><b>Risk<\/b> (خطر): احتمال أن يستغل تهديدٌ ثغرةً، مضروباً في حجم الضرر.<\/li><\/ul><p>صيغة مبسطة شائعة:<\/p><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>Risk<\/mtext><mo>=<\/mo><mtext>Likelihood<\/mtext><mo>×<\/mo><mtext>Impact<\/mtext><\/mrow><\/math><\/p><p>والاحتمال نفسه يزيد بوجود تهديد وثغرة معاً. إن غاب أحدهما فلا خطر عملياً.<\/p><ul><li><b>Attack Surface<\/b>: مجموع كل النقاط التي يمكن مهاجمتها.<\/li><\/ul>", "q": {"k": "sa", "q": "نظام فيه ثغرة معروفة لكنه معزول تماماً ولا يستطيع أي مهاجم الوصول إليه. هل الـ Risk مرتفع؟ علّل بمصطلحين.", "e": "الـ Risk منخفض. الـ Vulnerability موجودة لكن لا يوجد Threat قادر على الوصول إليها، والخطر يحتاج اجتماع الاثنين (ثم يُضرب في حجم الضرر).", "kw": [["threat", "تهديد"], ["vulnerab", "ثغرة"]]}}, {"t": "نموذج TCP/IP والطبقات", "b": "<p>الشبكة تعمل على طبقات، كل طبقة لها وظيفة وتضيف «غلافاً» (<b>Header<\/b>) على البيانات. هذه العملية تسمى <b>Encapsulation<\/b>.<\/p><div class=\"tw\"><table><tr><th>الطبقة (TCP/IP)<\/th><th>وظيفتها<\/th><th>اسم الوحدة (PDU)<\/th><th>مثال<\/th><\/tr><tr><td>Application<\/td><td>ما يراه البرنامج<\/td><td>Data<\/td><td>HTTP, DNS<\/td><\/tr><tr><td>Transport<\/td><td>توصيل بين برنامجين<\/td><td>Segment (TCP) / Datagram (UDP)<\/td><td>TCP, UDP<\/td><\/tr><tr><td>Internet<\/td><td>توصيل بين شبكتين<\/td><td>Packet<\/td><td>IP, ICMP<\/td><\/tr><tr><td>Network Access<\/td><td>توصيل داخل الشبكة المحلية<\/td><td>Frame<\/td><td>Ethernet, Wi-Fi<\/td><\/tr><\/table><\/div><p>في نموذج <b>OSI<\/b> ذي السبع طبقات: Layer 2 هي Data Link (تقابل Network Access)، و Layer 3 هي Network، و Layer 4 هي Transport. عبارة «Layer 2 attack» تعني هجوماً داخل الشبكة المحلية.<\/p><p><b>PDU<\/b> (Protocol Data Unit) هو الاسم العام لوحدة البيانات في أي طبقة.<\/p>", "q": {"k": "mc", "q": "ما اسم الـ PDU في طبقة الـ Internet (Layer 3)؟", "e": "Frame للطبقة الثانية، Packet للثالثة، Segment لـ TCP في الرابعة.", "o": ["Frame", "Packet", "Segment"], "a": 1}}, {"t": "العناوين الثلاثة: MAC و IP و Port", "b": "<p>لتصل رسالة إلى برنامج بعينه نحتاج ثلاثة عناوين:<\/p><ul><li><b>MAC Address<\/b>: عنوان بطاقة الشبكة، 48 بت، يُستخدم داخل الشبكة المحلية فقط (Layer 2). مثال: <code dir=\"ltr\">00:1A:2B:3C:4D:5E<\/code>.<\/li><li><b>IP Address<\/b>: عنوان الجهاز عبر الشبكات (Layer 3). مثال: <code dir=\"ltr\">192.168.1.10<\/code>.<\/li><li><b>Port<\/b>: رقم يحدد الخدمة أو البرنامج داخل الجهاز (Layer 4)، من 0 إلى 65535.<\/li><\/ul><p>تشبيه: الـ IP عنوان العمارة، والـ Port رقم الشقة، والـ MAC هو وجه الساكن الذي يعرفه بوّاب العمارة.<\/p><div class=\"tw\"><table><tr><th>Port<\/th><th>Protocol<\/th><th>الاستخدام<\/th><\/tr><tr><td>20/21<\/td><td>FTP<\/td><td>نقل ملفات (غير مشفر)<\/td><\/tr><tr><td>22<\/td><td>SSH<\/td><td>تحكم عن بعد مشفر<\/td><\/tr><tr><td>23<\/td><td>Telnet<\/td><td>تحكم عن بعد غير مشفر (تجنبه)<\/td><\/tr><tr><td>25<\/td><td>SMTP<\/td><td>إرسال البريد<\/td><\/tr><tr><td>53<\/td><td>DNS<\/td><td>تحويل الأسماء إلى عناوين<\/td><\/tr><tr><td>67/68<\/td><td>DHCP<\/td><td>توزيع العناوين تلقائياً<\/td><\/tr><tr><td>80 / 443<\/td><td>HTTP / HTTPS<\/td><td>الويب<\/td><\/tr><tr><td>3389<\/td><td>RDP<\/td><td>سطح المكتب البعيد في Windows<\/td><\/tr><\/table><\/div>", "q": {"k": "mc", "q": "رأيت في السجل اتصالاً إلى <code dir=\"ltr\">10.0.0.5:22<\/code>. ما الخدمة المقصودة غالباً؟", "e": "الرقم بعد النقطتين هو الـ Port، و 22 هو المنفذ المعتاد لـ SSH.", "o": ["موقع ويب مشفر", "SSH للتحكم عن بعد", "DNS"], "a": 1}}, {"t": "Encryption و Hashing: الفرق الأساسي", "b": "<p>أداتان ستراهما في كل وحدة:<\/p><ul><li><b>Encryption<\/b> (التشفير): تحويل النص المقروء (<b>Plaintext<\/b>) إلى نص غير مفهوم (<b>Ciphertext<\/b>) باستخدام مفتاح (<b>Key<\/b>). العملية <b>عكسية<\/b>: من يملك المفتاح يسترجع الأصل. يخدم الـ Confidentiality.<\/li><\/ul><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>C<\/mi><mo>=<\/mo><msub><mi>E<\/mi><mi>k<\/mi><\/msub><mo>(<\/mo><mi>P<\/mi><mo>)<\/mo><mspace width=\"0.4em\"/><mo>,<\/mo><mspace width=\"0.4em\"/><mi>P<\/mi><mo>=<\/mo><msub><mi>D<\/mi><mi>k<\/mi><\/msub><mo>(<\/mo><mi>C<\/mi><mo>)<\/mo><\/mrow><\/math><\/p><ul><li><b>Hashing<\/b>: دالة تحوّل أي بيانات إلى بصمة ثابتة الطول. العملية <b>غير عكسية<\/b>، وأي تغيير ولو بحرف يغيّر البصمة كلياً. تخدم الـ Integrity. أمثلة: <b>SHA-256<\/b> (آمنة)، <b>MD5<\/b> و <b>SHA-1<\/b> (ضعيفتان اليوم).<\/li><\/ul><p><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>h<\/mi><mo>=<\/mo><mi>H<\/mi><mo>(<\/mo><mi>m<\/mi><mo>)<\/mo><\/mrow><\/math><\/p><p>قاعدة: التشفير لإخفاء المحتوى، والـ Hash للتأكد أنه لم يتغير.<\/p>", "q": {"k": "mc", "q": "نزّلت ملفاً وتريد التأكد أنه مطابق تماماً لما نشره صاحبه. ماذا تفعل؟", "e": "مقارنة الـ Hash هي طريقة التحقق من الـ Integrity. التشفير يخفي المحتوى ولا يثبت أنه لم يتغير.", "o": ["تشفّر الملف بمفتاحك", "تحسب الـ SHA-256 للملف وتقارنه بالقيمة المنشورة", "تغيّر امتداد الملف"], "a": 1}}], "test": [{"k": "mc", "q": "مهاجم اعترض رسالة وغيّر رقم الحساب البنكي فيها قبل وصولها. أي عنصر من الـ CIA تضرر أساساً؟", "e": "تعديل البيانات دون إذن هو انتهاك للـ Integrity، حتى لو وصلت الرسالة في وقتها.", "o": ["Availability", "Integrity", "لا شيء لأن الرسالة وصلت"], "a": 1}, {"k": "tf", "q": "الـ MAC Address يُستخدم لتوجيه الـ Packets بين شبكات مختلفة عبر الإنترنت.", "e": "الـ MAC يعمل داخل الشبكة المحلية فقط (Layer 2). التوجيه بين الشبكات يعتمد على الـ IP Address (Layer 3).", "o": ["صح", "خطأ"], "a": 1, "ns": 1}, {"k": "sa", "q": "عرّف الـ Exploit وفرّقه عن الـ Vulnerability في جملة.", "e": "الـ Vulnerability هي نقطة الضعف نفسها، والـ Exploit هو الوسيلة أو الكود الذي يُستخدم فعلياً لاستغلالها.", "kw": [["ثغرة", "vulnerab", "ضعف"], ["استغل", "وسيل", "أداة", "كود", "code"]]}]}]}, {"n": "1", "t": "الوحدة 1: Cybersecurity Threats, Vulnerabilities, and Attacks", "secs": [{"t": "1.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>لا تستطيع الدفاع ضد ما لا تعرفه. هذه الوحدة هي «كتالوج» الأخطار: تتعرف فيها على أنواع التهديدات، وأساليب الخداع، والهجمات على الشبكات والأجهزة اللاسلكية والتطبيقات.<\/p><p>بنهايتها ستستطيع:<\/p><ul><li>تصنيف أي حادث تقرأ عنه: هل هو Malware، أم Social Engineering، أم هجوم على تطبيق.<\/li><li>تحديد الـ Threat Domain الذي جاء منه الخطر.<\/li><li>اقتراح دفاع مناسب لكل فئة.<\/li><\/ul><p>كل هجوم يُدرَّس هنا مع دفاعه. الهدف أن تتعرف عليه وتمنعه.<\/p>", "q": {"k": "tf", "q": "الغرض من دراسة الهجمات في هذه الدورة هو التعرف عليها وتصنيفها واقتراح الدفاع المناسب.", "e": "المحلل يدرس الهجوم ليكشفه ويمنعه. لذلك ينتهي كل قسم بطرق الدفاع.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": []}, {"t": "1.1 Common Threats", "kind": "lesson", "cs": [{"t": "Threat Domains", "b": "<p><b>Threat Domain<\/b> هو منطقة يستطيع المهاجم من خلالها الوصول إلى النظام. فكّر فيه كـ«باب» من أبواب المؤسسة.<\/p><p>أمثلة على الأبواب:<\/p><ul><li>وصول مباشر للأجهزة (Physical access) أو عبر Bluetooth و NFC.<\/li><li>الشبكات اللاسلكية.<\/li><li>وسائط قابلة للإزالة مثل USB.<\/li><li>البريد الإلكتروني وتطبيقات المراسلة.<\/li><li>سلسلة التوريد (<b>Supply Chain<\/b>): مورّد برامج أو أجهزة مخترَق.<\/li><li>حسابات التواصل الاجتماعي والخدمات السحابية (Cloud).<\/li><\/ul><p>معرفة الأبواب أول خطوة لإغلاقها.<\/p>", "q": {"k": "mc", "q": "موظف وجد USB في موقف السيارات ووصله بحاسوب العمل. أي Threat Domain استُخدم؟", "e": "الـ USB وسيط قابل للإزالة، وهو باب معروف لإدخال Malware متجاوزاً حماية الشبكة.", "o": ["الشبكة اللاسلكية", "الوسائط القابلة للإزالة (Removable media)", "Supply Chain"], "a": 1}}, {"t": "Types of Cyber Threats", "b": "<p>التهديدات ليست كلها هجمات متعمدة. تُصنَّف هكذا:<\/p><ul><li><b>Software attacks<\/b>: برامج خبيثة وهجمات مثل DoS و Virus.<\/li><li><b>Software errors<\/b>: أخطاء برمجية (Bugs) تجعل التطبيق ينهار أو تفتح ثغرة.<\/li><li><b>Sabotage<\/b>: تخريب متعمد، كموظف يحذف قاعدة بيانات.<\/li><li><b>Human error<\/b>: خطأ غير مقصود، كإدخال بيانات خاطئة أو إعداد جدار ناري خطأ.<\/li><li><b>Theft<\/b>: سرقة جهاز أو بيانات.<\/li><li><b>Hardware failures<\/b>: تعطل قرص صلب.<\/li><li><b>Utility interruption<\/b>: انقطاع الكهرباء أو التبريد.<\/li><li><b>Natural disasters<\/b>: زلزال، فيضان، حريق.<\/li><\/ul><p>كلها تهدد الـ CIA، ولهذا تشمل خطة الحماية النسخ الاحتياطي ومولدات الكهرباء وليس برامج الحماية فقط.<\/p>", "q": {"k": "mc", "q": "مهندس حذف بالخطأ قاعدة توجيه (Routing rule) فانقطعت الشبكة. ما نوع التهديد؟", "e": "لا يوجد قصد إيذاء، فهو خطأ بشري. لو كان متعمداً لصار Sabotage.", "o": ["Sabotage", "Human error", "Software attack"], "a": 1}}, {"t": "Internal vs External Threats", "b": "<ul><li><b>Internal threat<\/b>: مصدره شخص داخل المؤسسة أو له صلاحية فيها: موظف، متعاقد، شريك. قد يكون متعمداً أو مهملاً.<\/li><li><b>External threat<\/b>: مصدره من الخارج: هاوٍ أو مجرم محترف، يحتاج أولاً لإيجاد طريق دخول.<\/li><\/ul><p>التهديد الداخلي غالباً <b>أخطر<\/b> لأن صاحبه يملك وصولاً مشروعاً، ويعرف أين البيانات الثمينة، ويعرف الدفاعات الموجودة.<\/p><p>الدفاع الأساسي ضده هو مبدأ <b>Least Privilege<\/b>: كل مستخدم يأخذ أقل صلاحيات تكفي لعمله فقط.<\/p>", "q": {"k": "mc", "q": "لماذا يُعد الـ Internal threat أخطر عادةً؟", "e": "الوصول المشروع والمعرفة الداخلية يختصران على المهاجم معظم مراحل الهجوم.", "o": ["لأن الموظفين أمهر تقنياً من المخترقين", "لأن صاحبه يملك وصولاً مشروعاً ومعرفة بالأنظمة والدفاعات", "لأن الـ Firewall لا يعمل داخل الشبكة إطلاقاً"], "a": 1}}, {"t": "User Threats and Vulnerabilities", "b": "<p>مجال المستخدم (<b>User Domain<\/b>) يوصف بأنه أضعف حلقة. أشهر مشاكله:<\/p><ul><li>غياب الوعي الأمني، أو تجاهل السياسات (Policies).<\/li><li>سرقة البيانات، أو تنزيل ملفات ووسائط غير مصرح بها.<\/li><li>استخدام <b>VPN<\/b> أو مواقع غير مصرح بها.<\/li><li>إتلاف أنظمة أو بيانات عمداً أو سهواً.<\/li><\/ul><p>لا يوجد حل تقني يمنع موظفاً من إعطاء كلمة سره لمحتال. لذلك يكون العلاج: تدريب دوري، سياسات واضحة، ومراقبة للسلوك غير المعتاد.<\/p>", "q": {"k": "tf", "q": "أفضل علاج لضعف مجال المستخدم هو شراء Firewall أقوى.", "e": "مشاكل المستخدم بشرية أساساً. علاجها التوعية والسياسات والمراقبة، والتقنية عامل مساعد فقط.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Threats to Devices", "b": "<p>الأجهزة نفسها تتعرض لتهديدات مثل:<\/p><ul><li>ترك الجهاز مفتوحاً بلا قفل شاشة.<\/li><li>تنزيل ملفات أو برامج من مصادر غير موثوقة.<\/li><li>برامج غير محدّثة فيها ثغرات معروفة (<b>Unpatched software<\/b>).<\/li><li>Malware جديد لم تتعرف عليه برامج الحماية بعد.<\/li><li>وسائط USB غير مصرح بها.<\/li><li>أجهزة أو برامج قديمة انتهى دعمها (<b>Legacy / End-of-Life<\/b>) ولم تعد تستقبل تحديثات.<\/li><\/ul><p>العلاج: قفل تلقائي للشاشة، تحديثات منتظمة، برنامج Antimalware، ومنع الوسائط غير المصرح بها.<\/p>", "q": {"k": "mc", "q": "أي مما يلي يمثل تهديداً من نوع End-of-Life؟", "e": "النظام المنتهي دعمه لا تُصلَح ثغراته الجديدة، فيبقى مكشوفاً دائماً.", "o": ["موظف ينسى كلمة السر", "حاسوب يعمل بنظام تشغيل توقف صانعه عن إصدار تحديثات أمنية له", "انقطاع الإنترنت"], "a": 1}}, {"t": "Threats to the Local Area Network", "b": "<p>الـ <b>LAN<\/b> هي الشبكة المحلية: مجموعة أجهزة متصلة عبر كابلات أو Wi-Fi في مكان واحد. تهديداتها:<\/p><ul><li>وصول غير مصرح به إلى غرف الأجهزة والـ Switches.<\/li><li>وصول غير مصرح به إلى الأنظمة والبيانات والشبكة اللاسلكية.<\/li><li>ثغرات في نظام تشغيل أجهزة الشبكة أو تأخر تحديثها.<\/li><li>فحص المنافذ واستطلاع الشبكة (<b>Port scanning / Probing<\/b>) من مهاجم بالداخل.<\/li><li>إعداد خاطئ للـ Firewall (<b>Misconfiguration<\/b>).<\/li><\/ul><p>العلاج: قفل الغرف، تعطيل المنافذ غير المستخدمة، تقسيم الشبكة، ومراجعة الإعدادات.<\/p>", "q": {"k": "mc", "q": "زائر وصل حاسوبه بمنفذ شبكة في قاعة الاجتماعات فحصل على وصول كامل للشبكة الداخلية. ما الإجراء الأنسب لمنع ذلك؟", "e": "منفذ شبكة مفتوح بلا رقابة هو وصول غير مصرح به للـ LAN. تعطيله أو فرض مصادقة (مثل 802.1X) يغلق الباب.", "o": ["زيادة سرعة الإنترنت", "تعطيل المنافذ غير المستخدمة وفرض مصادقة على الأجهزة المتصلة", "تغيير اسم شبكة الـ Wi-Fi"], "a": 1}}, {"t": "Threats to the Private Cloud", "b": "<p><b>Private Cloud<\/b> هي خوادم وشبكات تملكها المؤسسة وتديرها لنفسها، وتُتاح لموظفيها عن بعد. تهديداتها:<\/p><ul><li>استطلاع وفحص منافذ من الخارج.<\/li><li>وصول غير مصرح به إلى الموارد.<\/li><li>ثغرات في نظام تشغيل الـ Router أو الـ Firewall.<\/li><li>أخطاء إعداد في أجهزة الشبكة.<\/li><li>مستخدمون عن بعد يصلون للبنية الحساسة وينزّلون بيانات.<\/li><\/ul><p>لأن المؤسسة هي المالك، فمسؤولية الحماية كلها عليها.<\/p>", "q": {"k": "tf", "q": "في الـ Private Cloud تتحمل المؤسسة المالكة مسؤولية تأمين البنية كاملة.", "e": "لا يوجد مزوّد خارجي يتقاسم المسؤولية؛ الأجهزة والإعداد والتحديث كلها على المؤسسة.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}, {"t": "Threats to the Public Cloud", "b": "<p><b>Public Cloud<\/b> خدمات يملكها مزوّد (مثل AWS أو Azure) وتستأجرها المؤسسة. لها ثلاثة نماذج:<\/p><ul><li><b>SaaS<\/b> (Software as a Service): تستخدم برنامجاً جاهزاً عبر المتصفح، مثل البريد.<\/li><li><b>PaaS<\/b> (Platform as a Service): منصة تبني عليها تطبيقك.<\/li><li><b>IaaS<\/b> (Infrastructure as a Service): خوادم وشبكات افتراضية تديرها أنت.<\/li><\/ul><p>القاعدة هنا هي <b>Shared Responsibility<\/b>: المزوّد يحمي البنية التحتية، والعميل يحمي بياناته وحساباته وإعداداته. كلما نزلت من SaaS إلى IaaS زادت مسؤوليتك.<\/p><p>أشهر التهديدات: تسريب بيانات بسبب إعداد خاطئ، سرقة حسابات، وفقدان السيطرة على مكان البيانات.<\/p>", "q": {"k": "mc", "q": "شركة تركت مخزن ملفات سحابياً «عاماً» بالخطأ فتسربت بيانات عملائها. من المسؤول وفق Shared Responsibility؟", "e": "المزوّد يؤمّن البنية، والعميل مسؤول عن بياناته وصلاحيات الوصول إليها.", "o": ["المزوّد لأن الخوادم خوادمه", "الشركة العميلة لأن إعداد الوصول إلى بياناتها مسؤوليتها", "لا أحد"], "a": 1}}, {"t": "Threats to Applications", "b": "<p>مجال التطبيقات يضم الأنظمة والبيانات الحساسة للمؤسسة. تهديداته:<\/p><ul><li>وصول غير مصرح به إلى مراكز البيانات وغرف الخوادم.<\/li><li>تعطل الخوادم للصيانة أو لعطل (ضرب للـ Availability).<\/li><li>ثغرات في نظام تشغيل الخادم أو في التطبيق نفسه.<\/li><li>فقدان البيانات.<\/li><li>ثغرات في تطبيقات الويب وأخطاء في تطوير العميل والخادم.<\/li><\/ul><p>تمرين «Domain Checker» في الدورة الأصلية يطلب منك نسبة كل تهديد إلى مجاله: مستخدم، جهاز، LAN، Private Cloud، Public Cloud، أو Application.<\/p>", "q": {"k": "mc", "q": "«مستخدمون عن بعد ينزّلون بيانات حساسة من خوادم تملكها الشركة». إلى أي مجال ينتمي هذا التهديد؟", "e": "الوصول عن بعد إلى بنية تملكها المؤسسة هو من تهديدات الـ Private Cloud.", "o": ["User Domain", "Private Cloud", "Public Cloud"], "a": 1}}, {"t": "Threat Complexity: APT و Algorithm Attacks", "b": "<p>بعض الهجمات معقدة ومتعددة المراحل:<\/p><ul><li><b>APT<\/b> (Advanced Persistent Threat): هجوم متقدم وطويل الأمد، تنفذه مجموعة ممولة جيداً (غالباً مدعومة من دولة) ضد هدف محدد. يتسلل بهدوء ويبقى شهوراً يجمع البيانات.<\/li><li><b>Algorithm attacks<\/b>: تستغل الخوارزميات التي يعمل بها برنامج شرعي لإجباره على سلوك غير مقصود، مثل استنزاف الذاكرة أو المعالج.<\/li><\/ul><p>الكلمتان المهمتان في APT: <b>Advanced<\/b> (أدوات متطورة) و <b>Persistent<\/b> (بقاء طويل دون انكشاف).<\/p>", "q": {"k": "mc", "q": "ما الذي يميز الـ APT عن هجوم عشوائي عادي؟", "e": "APT يعني هدفاً محدداً، وموارد كبيرة، وبقاءً طويلاً بهدوء لجمع المعلومات.", "o": ["أنه سريع وصاخب ويستهدف الجميع", "أنه موجَّه لهدف محدد ويبقى متخفياً مدة طويلة", "أنه لا يستخدم Malware"], "a": 1}}, {"t": "Backdoors and Rootkits", "b": "<ul><li><b>Backdoor<\/b> (باب خلفي): طريقة وصول تتجاوز المصادقة العادية. يزرعها المهاجم بعد الاختراق ليعود متى شاء، وأشهر صورها برنامج <b>RAT<\/b> (Remote Access Trojan) يمنحه تحكماً عن بعد.<\/li><li><b>Rootkit<\/b>: برنامج خبيث يعدّل نظام التشغيل نفسه ليخفي وجوده ووجود المهاجم. يستغل ثغرات للحصول على أعلى صلاحية (<b>Privilege Escalation<\/b>) ثم يغيّر ملفات النظام وأدوات الفحص.<\/li><\/ul><p>لأن الـ Rootkit يخدع أدوات النظام، كشفه صعب، وعلاجه الموثوق غالباً هو مسح الجهاز وإعادة تثبيت النظام.<\/p>", "q": {"k": "mc", "q": "لماذا يصعب اكتشاف الـ Rootkit؟", "e": "الـ Rootkit يتحكم في ما يعرضه النظام، فتظهر النتائج «نظيفة» وهو موجود.", "o": ["لأنه لا يعمل إلا والجهاز مطفأ", "لأنه يعدّل نظام التشغيل وأدواته فيخفي نفسه عنها", "لأنه مجرد رسالة بريد مزعجة"], "a": 1}}, {"t": "Threat Intelligence and Research Sources", "b": "<p><b>Threat Intelligence<\/b> معلومات عن التهديدات الحالية تساعدك على الاستعداد. أهم مصادرها:<\/p><ul><li><b>CVE<\/b> (Common Vulnerabilities and Exposures): قاعدة عامة تعطي كل ثغرة معروفة رقماً موحداً مثل <code dir=\"ltr\">CVE-2021-44228<\/code>.<\/li><li><b>CVSS<\/b>: مقياس من 0 إلى 10 لشدة الثغرة.<\/li><li><b>Dark Web<\/b>: جزء مخفي من الإنترنت يراقبه الباحثون لرصد البيانات المسربة والأدوات المعروضة.<\/li><li><b>IOC<\/b> (Indicator of Compromise): دليل على وقوع اختراق، مثل Hash لملف خبيث أو IP لخادم المهاجم.<\/li><li><b>AIS<\/b> (Automated Indicator Sharing): خدمة من CISA الأمريكية لتبادل المؤشرات آلياً، بصيغتي <b>STIX<\/b> (شكل المعلومة) و <b>TAXII<\/b> (طريقة نقلها).<\/li><\/ul>", "q": {"k": "mc", "q": "وجدت في تقرير الرقم <code dir=\"ltr\">CVE-2023-12345<\/code>. ماذا يمثل؟", "e": "CVE نظام ترقيم عالمي للثغرات المعلنة، يسهّل على الجميع الإشارة إلى الثغرة نفسها.", "o": ["عنوان IP لمهاجم", "معرّفاً موحداً لثغرة أمنية معروفة علناً", "رقم ترخيص برنامج حماية"], "a": 1}}], "test": [{"k": "mc", "q": "شركة اكتشفت أن مهاجمين كانوا داخل شبكتها منذ ثمانية أشهر يسحبون تصاميم هندسية بهدوء. ما الوصف الأدق؟", "e": "هدف محدد، بقاء طويل، وتخفٍّ: هذه سمات Advanced Persistent Threat.", "o": ["Human error", "APT", "Utility interruption"], "a": 1}, {"k": "mc", "q": "أي إجراء يحد مباشرة من ضرر الـ Internal threat؟", "e": "إعطاء كل مستخدم أقل الصلاحيات اللازمة يصغّر ما يستطيع الوصول إليه أو إتلافه.", "o": ["تطبيق Least Privilege", "زيادة عرض النطاق (Bandwidth)", "إطفاء الـ Wi-Fi ليلاً"], "a": 0}, {"k": "sa", "q": "اذكر الفرق بين Backdoor و Rootkit.", "e": "الـ Backdoor طريقة وصول تتجاوز المصادقة ليعود المهاجم متى شاء. الـ Rootkit يعدّل نظام التشغيل ليخفي وجود المهاجم وبرامجه.", "kw": [["وصول", "دخول", "access", "مصادقة"], ["يخفي", "إخفاء", "hide", "يخبئ", "تخف"]]}]}, {"t": "1.2 Deception", "kind": "lesson", "cs": [{"t": "Social Engineering", "b": "<p><b>Social Engineering<\/b> هو التلاعب بالناس نفسياً ليفعلوا شيئاً أو يكشفوا معلومة. المهاجم هنا يخترق الإنسان وليس الجهاز.<\/p><p>أشهر أنواعه:<\/p><ul><li><b>Pretexting<\/b>: اختلاق قصة للحصول على بيانات. مثال: «أنا من البنك وأحتاج تأكيد رقم بطاقتك».<\/li><li><b>Quid pro quo<\/b> (شيء مقابل شيء): طلب معلومة مقابل هدية أو خدمة. مثال: «أجب عن استبيان واربح هاتفاً».<\/li><li><b>Identity fraud<\/b>: استخدام هوية شخص آخر مسروقة للحصول على خدمات أو مال.<\/li><\/ul>", "q": {"k": "mc", "q": "اتصل بك شخص يقول إنه من الدعم الفني وعرض «إصلاح بطء حاسوبك مجاناً» مقابل أن تعطيه كلمة السر. ما نوع الهجوم؟", "e": "عرض خدمة مقابل معلومة هو Quid pro quo. والقصة المختلقة حوله عنصر Pretexting مساعد.", "o": ["Identity fraud", "Quid pro quo", "Dumpster diving"], "a": 1}}, {"t": "Social Engineering Tactics", "b": "<p>المحتال يضغط على «أزرار» نفسية معروفة:<\/p><ul><li><b>Authority<\/b>: يدّعي أنه مدير أو جهة رسمية، والناس يطيعون السلطة.<\/li><li><b>Intimidation<\/b>: التهديد بعقوبة إن لم تنفذ.<\/li><li><b>Consensus / Social proof<\/b>: «كل زملائك فعلوا ذلك».<\/li><li><b>Scarcity<\/b>: «العرض لأول عشرة فقط».<\/li><li><b>Urgency<\/b>: «حسابك سيُغلق خلال ساعة».<\/li><li><b>Familiarity<\/b>: يبني علاقة ودّ معك أولاً.<\/li><li><b>Trust<\/b>: يبني ثقة على مدى أيام ثم يستغلها.<\/li><\/ul><p>علامة الخطر الأهم: أي رسالة تجمع بين الاستعجال وطلب شيء حساس.<\/p>", "q": {"k": "mc", "q": "رسالة تقول: «تم رصد دخول مشبوه. أكّد بياناتك خلال 30 دقيقة وإلا حُذف حسابك نهائياً». أي أسلوبين استُخدما؟", "e": "المهلة القصيرة هي Urgency، والتهديد بالحذف هو Intimidation.", "o": ["Familiarity و Trust", "Urgency و Intimidation", "Scarcity و Consensus"], "a": 1}}, {"t": "Shoulder Surfing and Dumpster Diving", "b": "<p>هجومان بلا أي تقنية:<\/p><ul><li><b>Shoulder surfing<\/b>: النظر من فوق كتفك وأنت تكتب كلمة السر أو الـ PIN، مباشرةً أو بكاميرا أو منظار.<\/li><li><b>Dumpster diving<\/b>: التنقيب في سلة المهملات عن أوراق فيها معلومات: فواتير، قوائم موظفين، كلمات سر مكتوبة.<\/li><\/ul><p>الدفاع: انتبه لمن حولك، استخدم <b>Privacy screen<\/b> على الشاشة، وأتلف الأوراق بآلة تقطيع (<b>Shredder<\/b>) قبل رميها.<\/p>", "q": {"k": "tf", "q": "إتلاف الوثائق بآلة تقطيع قبل رميها يحمي من Dumpster diving.", "e": "الهجوم يعتمد على أوراق سليمة في المهملات. تقطيعها يزيل قيمتها.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}, {"t": "Impersonation and Hoaxes", "b": "<ul><li><b>Impersonation<\/b> (انتحال الشخصية): التظاهر بأنك شخص آخر لكسب الثقة، كمن ينتحل صفة موظف ضرائب أو فني صيانة.<\/li><li><b>Hoax<\/b> (خدعة/إشاعة): خبر كاذب يُنشر لخداع الناس، مثل تحذير مزيف من «فيروس خطير» يطلب منك حذف ملف نظام مهم أو إعادة إرسال الرسالة للجميع. ضرره: ذعر، وقت ضائع، وأحياناً ضرر فعلي إن نفّذ الناس التعليمات.<\/li><\/ul><p>القاعدة: تحقق من هوية الطالب عبر قناة مستقلة تعرفها أنت، مثل رقم الهاتف الرسمي.<\/p>", "q": {"k": "mc", "q": "وصلتك رسالة متداولة: «احذف الملف system32 فوراً فهو فيروس، وأرسلها لكل معارفك». ما هذا؟", "e": "خبر كاذب يدفع الناس لإيذاء أنفسهم ونشر الذعر. لا يوجد برنامج خبيث في الرسالة نفسها.", "o": ["Ransomware", "Hoax", "Shoulder surfing"], "a": 1}}, {"t": "Piggybacking and Tailgating", "b": "<p>كلاهما دخول شخص غير مصرح له خلف شخص مصرح له إلى منطقة مؤمّنة. الفرق الشائع:<\/p><ul><li><b>Tailgating<\/b>: يتبعك خلسةً ويدخل قبل أن يُغلق الباب، <b>دون علمك<\/b>.<\/li><li><b>Piggybacking<\/b>: يدخل <b>بموافقتك<\/b>، كأن تمسك له الباب لأنه يحمل صناديق.<\/li><\/ul><p>الدفاع: باب <b>Mantrap<\/b> (حجرة ببابين لا يُفتح الثاني حتى يُغلق الأول)، وبوابات تسمح بشخص واحد لكل بطاقة، وتدريب الموظفين على ألا يمسكوا الباب لمن لا يعرفون.<\/p>", "q": {"k": "mc", "q": "شخص بزي عامل توصيل طلب منك إمساك باب المكتب المؤمَّن ففعلت. ما الذي حدث؟", "e": "دخل بعلمك وموافقتك، فهذا Piggybacking. لو تسلل خلفك دون أن تلاحظ لكان Tailgating.", "o": ["Piggybacking", "Tailgating", "Dumpster diving"], "a": 0}}, {"t": "Other Methods of Deception", "b": "<ul><li><b>Invoice scam<\/b>: فاتورة مزيفة تُرسل لقسم المالية طمعاً في دفعها.<\/li><li><b>Watering hole attack<\/b>: المهاجم يخترق موقعاً يرتاده موظفو المؤسسة المستهدفة ويزرع فيه Malware وينتظر، كصياد عند مورد ماء.<\/li><li><b>Typosquatting<\/b>: تسجيل نطاق يشبه نطاقاً مشهوراً بخطأ إملائي، مثل <code dir=\"ltr\">gooogle.com<\/code>.<\/li><li><b>Prepending<\/b>: حذف أو إضافة وسم في بداية الرسالة لتبدو موثوقة، مثل إزالة علامة <code dir=\"ltr\">[EXTERNAL]<\/code> أو إضافة <code dir=\"ltr\">RE:<\/code> ليظن القارئ أنها رد على مراسلة سابقة.<\/li><li><b>Influence campaigns<\/b>: حملات منسقة تنشر معلومات مضللة عبر قنوات متعددة لتغيير الرأي العام.<\/li><\/ul>", "q": {"k": "mc", "q": "مهاجم يريد اختراق مهندسي شركة طيران، فاخترق منتدى هندسياً يزورونه يومياً وزرع فيه كوداً خبيثاً. ما اسم هذا؟", "e": "استهداف موقع يرتاده الضحايا وانتظارهم فيه هو Watering hole.", "o": ["Typosquatting", "Watering hole attack", "Invoice scam"], "a": 1}}, {"t": "Defending Against Deception", "b": "<p>الدفاع ضد الخداع عادات يومية:<\/p><ul><li>لا تعطِ معلومات سرية أو بيانات دخول عبر البريد أو الهاتف أو الدردشة لمجهول.<\/li><li>قاوم النقر على روابط ومرفقات مغرية، وتحقق من العنوان الحقيقي للرابط.<\/li><li>احذر التنزيلات غير المطلوبة والتلقائية.<\/li><li>لا تستسلم لضغط الاستعجال؛ توقف وتحقق من قناة مستقلة.<\/li><li>اقفل حاسوبك حين تغادره، ولا تمسك الباب لغريب.<\/li><li>بلّغ فريق الأمن عن أي محاولة مشبوهة.<\/li><\/ul><p>على مستوى المؤسسة: سياسات واضحة، تدريب دوري، ومحاكاة هجمات Phishing لقياس الوعي.<\/p><div class=\"note\">تمرين عملي (بديل Lab 1.2.13): افتح بريدك واختر ثلاث رسائل دعائية أو مشبوهة. لكل رسالة اكتب: أي تكتيك نفسي تستخدم؟ ما الذي تطلبه منك؟ وما العلامة التي تكشفها؟<\/div>", "q": {"k": "mc", "q": "اتصل بك «مدير تقنية المعلومات» من رقم غريب يطلب كلمة سرك لحل مشكلة عاجلة. ما التصرف الصحيح؟", "e": "لا تُعطى كلمة السر لأحد. التحقق عبر قناة مستقلة والتبليغ هما الإجراء الصحيح.", "o": ["إعطاؤه الكلمة لأنه المدير", "رفض الطلب والتحقق عبر الرقم الرسمي المعروف ثم تبليغ فريق الأمن", "إرسالها بالبريد لأنه أكثر أماناً من الهاتف"], "a": 1}}], "test": [{"k": "mc", "q": "موقع <code dir=\"ltr\">paypa1.com<\/code> يطابق شكل الموقع الأصلي ويطلب تسجيل الدخول. أي تقنية خداع هذه؟", "e": "استبدال حرف l بالرقم 1 في اسم النطاق اعتماداً على أن الضحية لا يدقق هو Typosquatting.", "o": ["Watering hole", "Typosquatting", "Tailgating"], "a": 1}, {"k": "sa", "q": "ما القاسم المشترك بين كل هجمات الـ Social Engineering، ولماذا لا يوقفها Firewall؟", "e": "كلها تستهدف الإنسان وتستغل طباعه (الثقة، الخوف، الاستعجال)، والـ Firewall يفحص حركة الشبكة ولا يمنع شخصاً من تسليم معلومة طوعاً.", "kw": [["إنسان", "بشر", "الناس", "نفسي", "human", "ثقة"]]}]}, {"t": "1.3 Cyber Attacks", "kind": "lesson", "cs": [{"t": "Malware: الفرق بين Virus و Worm و Trojan", "b": "<p><b>Malware<\/b> (Malicious Software) هو أي برنامج صُمم للإضرار. أنواعه الثلاثة الأساسية تختلف في طريقة الانتشار:<\/p><ul><li><b>Virus<\/b>: كود يلتصق بملف أو برنامج شرعي، ويحتاج <b>فعلاً من المستخدم<\/b> (فتح الملف) لينشط ثم ينسخ نفسه إلى ملفات أخرى.<\/li><li><b>Worm<\/b>: برنامج مستقل ينتشر <b>ذاتياً<\/b> عبر الشبكة مستغلاً ثغرة، دون أي تدخل بشري. لذلك ينتشر بسرعة هائلة ويستهلك الشبكة.<\/li><li><b>Trojan horse<\/b>: برنامج يبدو مفيداً (لعبة، أداة) ويخفي وظيفة خبيثة. <b>لا ينسخ نفسه<\/b>؛ المستخدم هو من يثبّته بيده.<\/li><\/ul><div class=\"tw\"><table><tr><th><\/th><th>يحتاج ملفاً حاضناً؟<\/th><th>ينتشر وحده؟<\/th><\/tr><tr><td>Virus<\/td><td>نعم<\/td><td>لا، يحتاج المستخدم<\/td><\/tr><tr><td>Worm<\/td><td>لا<\/td><td>نعم<\/td><\/tr><tr><td>Trojan<\/td><td>لا<\/td><td>لا<\/td><\/tr><\/table><\/div>", "q": {"k": "mc", "q": "خلال دقائق أصيبت كل حواسيب الشركة ببرنامج خبيث دون أن يفتح أحد أي ملف. ما النوع الأرجح؟", "e": "الانتشار الذاتي السريع عبر الشبكة دون تدخل المستخدم هو السمة المميزة للـ Worm.", "o": ["Virus", "Worm", "Trojan horse"], "a": 1}}, {"t": "Logic Bombs", "b": "<p><b>Logic bomb<\/b> كود خبيث يبقى خامداً إلى أن يتحقق شرط محدد (<b>Trigger<\/b>)، ثم ينفّذ عمله التخريبي. الشرط قد يكون تاريخاً، أو عدد مرات تشغيل، أو حدثاً مثل حذف اسم موظف من كشف الرواتب.<\/p><p>مثال معروف: مبرمج ناقم يزرع كوداً يحذف قاعدة البيانات إن مرّ شهر دون تسجيل دخوله.<\/p><p>خطورتها أنها لا تُظهر أي نشاط قبل لحظة التفعيل، فيصعب كشفها. الدفاع: مراجعة الكود (Code review)، فصل المهام بين الموظفين، ومراقبة التغييرات على الأنظمة.<\/p>", "q": {"k": "tf", "q": "الـ Logic bomb تبدأ التخريب فور زرعها في النظام.", "e": "تبقى خامدة حتى يتحقق الشرط (Trigger) كتاريخ أو حدث معيّن، وهذا سر صعوبة اكتشافها.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Ransomware", "b": "<p><b>Ransomware<\/b> برنامج خبيث يشفّر ملفات الضحية (أو يقفل الجهاز) ويطلب فدية مقابل مفتاح فك التشفير، وتُطلب غالباً بعملة رقمية يصعب تتبعها. النسخ الحديثة تسرق البيانات أيضاً قبل تشفيرها وتهدد بنشرها (<b>Double extortion<\/b>).<\/p><p>ينتشر عادةً عبر مرفق بريد خبيث أو ثغرة غير مرقّعة.<\/p><p>الدفاع الأهم: <b>نسخ احتياطية منتظمة ومعزولة عن الشبكة<\/b> (Offline backups) تختبر استرجاعها. دفع الفدية لا يضمن استرجاع الملفات ويموّل المهاجمين.<\/p>", "q": {"k": "mc", "q": "ما أهم إجراء يجعل هجوم الـ Ransomware قابلاً للتعافي منه؟", "e": "إن كانت لديك نسخة سليمة لا يصلها المهاجم، تسترجع ملفاتك دون دفع فدية.", "o": ["شاشة أكبر", "نسخ احتياطية حديثة ومعزولة عن الشبكة", "تغيير خلفية سطح المكتب"], "a": 1}}, {"t": "Denial of Service (DoS / DDoS)", "b": "<p>هجوم <b>DoS<\/b> يهدف لجعل خدمة غير متاحة لمستخدميها، أي يضرب الـ Availability. له أسلوبان:<\/p><ul><li><b>Overwhelming quantity of traffic<\/b>: إغراق الهدف بكمية بيانات تفوق طاقته.<\/li><li><b>Maliciously formatted packets<\/b>: إرسال Packets مشوهة لا يعرف المستقبل كيف يعالجها فينهار.<\/li><\/ul><p><b>DDoS<\/b> (Distributed DoS) هو نفسه لكن من آلاف المصادر معاً. المهاجم يبني <b>Botnet<\/b>: شبكة أجهزة مخترقة تسمى <b>Zombies<\/b> أو Bots، يتحكم فيها عبر خادم <b>C2<\/b> (Command and Control) ويأمرها بالهجوم في لحظة واحدة.<\/p>", "q": {"k": "mc", "q": "ما الفرق الأساسي بين DoS و DDoS؟", "e": "حرف D الإضافي يعني Distributed: الهجوم من أجهزة كثيرة (Botnet)، فيصعب حظره بحجب عنوان واحد.", "o": ["DDoS يسرق البيانات و DoS لا يسرقها", "DDoS يأتي من مصادر كثيرة موزعة في الوقت نفسه", "DoS أقوى دائماً"], "a": 1}}, {"t": "الهجمات على Domain Name System", "b": "<p><b>DNS<\/b> هو «دليل الهاتف» للإنترنت: يحوّل اسماً مثل <code dir=\"ltr\">example.com<\/code> إلى IP. إن خُدع الـ DNS ذهب المستخدم إلى المكان الخطأ وهو يظن أنه في الموقع الصحيح.<\/p><ul><li><b>Domain reputation<\/b>: سمعة النطاق؛ النطاقات التي تُستخدم في الإساءة تُحظر، والمهاجم قد يلوّث سمعة نطاقك.<\/li><li><b>DNS spoofing / Cache poisoning<\/b>: إدخال سجل مزيف في ذاكرة الـ DNS المؤقتة، فيُحوَّل الزوار إلى خادم المهاجم.<\/li><li><b>Domain hijacking<\/b>: سرقة التحكم في النطاق نفسه بتغيير بيانات تسجيله.<\/li><li><b>URL redirection<\/b>: إعادة توجيه الزائر من عنوان شرعي إلى صفحة خبيثة.<\/li><\/ul>", "q": {"k": "mc", "q": "كتب موظف عنوان البنك الصحيح في المتصفح لكنه وصل إلى موقع مزيف مطابق له. ما السبب الأرجح؟", "e": "العنوان صحيح لكن الترجمة إلى IP كانت مزيفة. هذا تسميم لسجلات الـ DNS.", "o": ["Logic bomb", "DNS spoofing (Cache poisoning)", "Shoulder surfing"], "a": 1}}, {"t": "Layer 2 Attacks", "b": "<p>Layer 2 هي طبقة الشبكة المحلية حيث تعمل الـ Switches وعناوين الـ MAC. أشهر هجماتها:<\/p><ul><li><b>Spoofing<\/b> (انتحال): تزوير عنوان ليبدو المهاجم جهازاً موثوقاً. أنواعه: <b>MAC spoofing<\/b>، <b>IP spoofing<\/b>، و <b>ARP spoofing<\/b> (إرسال ردود ARP مزيفة تربط IP الـ Gateway بـ MAC المهاجم، فتمر الحركة عبره).<\/li><li><b>MAC flooding<\/b>: إغراق الـ Switch بآلاف عناوين MAC المزيفة حتى يمتلئ جدوله، فيبدأ بإرسال كل Frame إلى كل المنافذ كأنه Hub، فيستطيع المهاجم التنصت.<\/li><\/ul><div class=\"note\"><b>ARP<\/b> بروتوكول يسأل داخل الشبكة المحلية: «من صاحب هذا الـ IP؟ أعطني الـ MAC». سنفصّله في الوحدة 4.<\/div>", "q": {"k": "mc", "q": "بعد هجوم ما، صار الـ Switch يرسل كل Frame إلى جميع المنافذ. ما الهجوم؟", "e": "امتلاء جدول الـ MAC يجعل الـ Switch يعمّم الإرسال على كل المنافذ، فيرى المهاجم حركة غيره.", "o": ["MAC flooding", "DNS hijacking", "Ransomware"], "a": 0}}, {"t": "Man-in-the-Middle و Man-in-the-Mobile", "b": "<ul><li><b>Man-in-the-Middle (MitM)<\/b>، ويسمى اليوم أيضاً <b>On-Path attack<\/b>: المهاجم يضع نفسه بين طرفين يتراسلان، فيقرأ الرسائل وقد يعدّلها، وكل طرف يظن أنه يكلم الآخر مباشرةً. يضرب الـ Confidentiality والـ Integrity.<\/li><li><b>Man-in-the-Mobile (MitMo)<\/b>: نسخة تستهدف الهاتف. Malware على الهاتف يلتقط معلومات حساسة ويرسلها للمهاجم، وأشهر ما يسرقه رسائل SMS التي تحمل رموز التحقق (2FA).<\/li><\/ul><p>الدفاع: تشفير الاتصال (HTTPS، VPN)، والتحقق من الشهادات، وتجنب الشبكات العامة غير الموثوقة.<\/p>", "q": {"k": "mc", "q": "ما الذي يجعل الـ MitM خطراً حتى لو لم يعدّل المهاجم شيئاً؟", "e": "مجرد التنصت يكشف كلمات السر والبيانات. وإن عدّل الرسائل أضاف ضرراً للـ Integrity.", "o": ["يبطئ الإنترنت فقط", "يطّلع على البيانات المارة بين الطرفين دون علمهما", "يحذف نظام التشغيل"], "a": 1}}, {"t": "Zero-Day Attacks", "b": "<p><b>Zero-day attack<\/b> هجوم يستغل ثغرة <b>لا يعرفها صانع البرنامج بعد<\/b> أو لم يصدر لها تحديثاً. التسمية تعني أن أمام المدافعين «صفر يوم» للاستعداد.<\/p><p>لماذا هو خطير؟ برامج الحماية التي تعتمد على التواقيع (Signatures) لا تعرفه، ولا يوجد Patch لتثبيته.<\/p><p>الدفاع يكون بطبقات لا تعتمد على معرفة الثغرة: مراقبة السلوك غير الطبيعي، تقسيم الشبكة، Least Privilege، وخطة استجابة جاهزة.<\/p>", "q": {"k": "tf", "q": "تثبيت كل التحديثات المتوفرة يضمن الحماية الكاملة من هجمات Zero-day.", "e": "الـ Zero-day بالتعريف يستغل ثغرة لم يصدر لها تحديث بعد. التحديث ضروري لكنه لا يغطي هذه الحالة.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Keyboard Logging", "b": "<p><b>Keylogger<\/b> أداة تسجل كل ضغطة على لوحة المفاتيح، فتلتقط كلمات السر وأرقام البطاقات والمراسلات. نوعان:<\/p><ul><li><b>Software keylogger<\/b>: برنامج خبيث يعمل في الخلفية ويرسل ما سجله للمهاجم.<\/li><li><b>Hardware keylogger<\/b>: قطعة صغيرة توصل بين لوحة المفاتيح والحاسوب، تحتاج وصولاً فيزيائياً.<\/li><\/ul><p>له استخدامات مشروعة محدودة (مثل الرقابة الأبوية). كثير من هجمات «Confirm Your Details» تجمع بين صفحة مزيفة تطلب تأكيد البيانات و Keylogger يلتقطها.<\/p>", "q": {"k": "mc", "q": "فني النظافة وصل قطعة صغيرة بين كابل لوحة المفاتيح وحاسوب المحاسب. ما هي غالباً؟", "e": "قطعة توصل فيزيائياً لتسجيل الضغطات هي Hardware keylogger، ولا يكشفها برنامج Antimalware.", "o": ["Rootkit", "Hardware keylogger", "Botnet"], "a": 1}}, {"t": "Defending Against Attacks", "b": "<p>خطوات عملية تحمي من معظم ما سبق:<\/p><ul><li>إعداد الـ Firewalls لإسقاط الـ Packets القادمة من الخارج بعناوين مصدر داخلية (علامة Spoofing).<\/li><li>تثبيت التحديثات والـ Patches أولاً بأول.<\/li><li>توزيع الحمل (Load balancing) ووجود أنظمة احتياطية لتحمل DoS.<\/li><li>حجب رسائل ICMP غير الضرورية عند حدود الشبكة.<\/li><li>برنامج Antimalware محدّث، ونسخ احتياطية معزولة.<\/li><li>تشفير الاتصالات، وتوعية المستخدمين.<\/li><\/ul><p>المبدأ الجامع هو <b>Defense in Depth<\/b>: عدة طبقات حماية، فإن سقطت واحدة أوقفت الأخرى الهجوم.<\/p>", "q": {"k": "mc", "q": "Packet وصل من الإنترنت وعنوان مصدره <code dir=\"ltr\">192.168.1.20<\/code> (عنوان داخلي). ماذا يفعل الـ Firewall السليم الإعداد؟", "e": "هذه علامة IP spoofing واضحة، وإسقاطها عند الحدود قاعدة أساسية.", "o": ["يمرره لأنه من جهاز داخلي", "يسقطه لأن عنواناً داخلياً لا يأتي من الخارج إلا مزوّراً", "يحوّله إلى الطابعة"], "a": 1}}], "test": [{"k": "mc", "q": "ملف «مشغل فيديو مجاني» نزّله موظف فعمل طبيعياً، لكنه فتح للمهاجم تحكماً عن بعد. ما تصنيفه؟", "e": "برنامج يبدو مفيداً ويخفي وظيفة خبيثة ثبّته المستخدم بنفسه: Trojan. ولأنه يمنح تحكماً عن بعد فهو RAT.", "o": ["Worm", "Trojan horse (من نوع RAT)", "Logic bomb"], "a": 1}, {"k": "mc", "q": "أي زوج (هجوم ← عنصر CIA المتضرر أساساً) صحيح؟", "e": "الـ DDoS يمنع الوصول للخدمة. الـ Keylogger يضرب الـ Confidentiality، والـ Ransomware يضرب الـ Availability (وأحياناً السرية).", "o": ["Keylogger ← Availability", "DDoS ← Availability", "Ransomware ← لا شيء"], "a": 1}, {"k": "sa", "q": "ما معنى Defense in Depth ولماذا نحتاجه مع وجود هجمات Zero-day؟", "e": "هو بناء عدة طبقات حماية مستقلة. لأن الـ Zero-day قد يتجاوز طبقة لا تعرفه، تبقى طبقات أخرى (مراقبة السلوك، تقسيم الشبكة، Least Privilege) قادرة على إيقافه أو حصر ضرره.", "kw": [["طبق", "layer"]]}]}, {"t": "1.4 Wireless and Mobile Device Attacks", "kind": "lesson", "cs": [{"t": "Grayware and SMiShing", "b": "<ul><li><b>Grayware<\/b>: تطبيقات ليست خبيثة صريحاً لكن سلوكها مزعج أو غير مرغوب: تجمع موقعك، تعرض إعلانات، تتبع نشاطك. كثيراً ما تكون «مرخصة» لأن المستخدم وافق على الشروط دون قراءتها.<\/li><li><b>SMiShing<\/b> (SMS Phishing): رسالة نصية احتيالية تحمل رابطاً أو رقماً، مثل «طردك معلّق، ادفع الرسوم هنا». النقر قد ينزّل Malware أو يقود لصفحة تسرق بياناتك.<\/li><\/ul><p>الدفاع: ثبّت التطبيقات من المتجر الرسمي فقط، راجع الصلاحيات التي يطلبها التطبيق، ولا تنقر روابط الرسائل النصية غير المتوقعة.<\/p>", "q": {"k": "mc", "q": "تطبيق مصباح يدوي يطلب الوصول إلى جهات الاتصال والموقع ويرسلها لشركة إعلانات. ما تصنيفه؟", "e": "ليس خبيثاً بالمعنى الصريح، لكنه يجمع ما لا يحتاجه. هذا سلوك Grayware.", "o": ["Ransomware", "Grayware", "Worm"], "a": 1}}, {"t": "Rogue Access Points و Evil Twin", "b": "<p><b>Access Point (AP)<\/b> هو الجهاز الذي يبث شبكة الـ Wi-Fi ويربط الأجهزة اللاسلكية بالشبكة السلكية.<\/p><ul><li><b>Rogue AP<\/b>: نقطة وصول رُكّبت على شبكة المؤسسة <b>دون تصريح<\/b>. قد يركبها موظف حسن النية ليحسّن التغطية، أو مهاجم ليفتح باباً خلفياً يتجاوز الـ Firewall.<\/li><li><b>Evil twin<\/b>: نقطة وصول يشغلها المهاجم بالاسم نفسه (<b>SSID<\/b>) لشبكة شرعية وبإشارة أقوى، فتتصل بها الأجهزة تلقائياً، وتمر حركتها كلها عبره (MitM).<\/li><\/ul><p>سنعود للتفاصيل التقنية والكشف في الوحدة 5.<\/p>", "q": {"k": "mc", "q": "في مقهى توجد شبكتان بالاسم نفسه <code dir=\"ltr\">Cafe_Free<\/code>، إحداهما أقوى إشارة. ما الخطر المحتمل؟", "e": "شبكة مزيفة تنتحل اسم الشرعية لجذب الضحايا هي Evil twin.", "o": ["MAC flooding", "Evil twin يعترض حركة من يتصل به", "Logic bomb"], "a": 1}}, {"t": "Radio Frequency Jamming", "b": "<p>الـ Wi-Fi والـ Bluetooth يعملان بموجات راديو (RF). <b>Jamming<\/b> هو بث إشارة تشويش متعمدة على التردد نفسه فتغرق الإشارة الأصلية ويتعطل الاتصال. هو هجوم DoS على الطبقة الفيزيائية.<\/p><p>لينجح يحتاج المشوِّش أن يساوي الشبكة المستهدفة في التردد والتعديل (Modulation) وأن تكون قدرته كافية.<\/p><p>التداخل قد يكون غير متعمد أيضاً (فرن ميكروويف أو هاتف لاسلكي على 2.4 GHz). الدفاع: رصد الطيف (Spectrum analysis) لتحديد مصدر التشويش، واستخدام نطاق 5 GHz الأقل ازدحاماً.<\/p>", "q": {"k": "tf", "q": "الـ RF Jamming يهدف أساساً إلى سرقة كلمات السر.", "e": "هدفه تعطيل الاتصال اللاسلكي، أي ضرب الـ Availability، وليس سرقة البيانات.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Bluejacking and Bluesnarfing", "b": "<p><b>Bluetooth<\/b> تقنية لاسلكية قصيرة المدى (نحو 10 أمتار). هجومان عليها:<\/p><ul><li><b>Bluejacking<\/b>: إرسال رسائل أو صور غير مرغوبة إلى جهاز قريب. مزعج لكنه لا يسرق شيئاً.<\/li><li><b>Bluesnarfing<\/b>: <b>نسخ بيانات<\/b> من الجهاز (جهات اتصال، رسائل، صور) دون علم صاحبه. هذا هو الخطير.<\/li><\/ul><p>للتذكر: «jack» يدفع إليك شيئاً، و«snarf» يأخذ منك.<\/p><p>الدفاع: أطفئ الـ Bluetooth حين لا تستخدمه، واجعله غير قابل للاكتشاف (Non-discoverable)، وحدّث النظام.<\/p>", "q": {"k": "mc", "q": "أي الهجومين ينتهك الـ Confidentiality؟", "e": "الـ Bluesnarfing يسرق بيانات من الجهاز. الـ Bluejacking يرسل محتوى مزعجاً فقط.", "o": ["Bluejacking", "Bluesnarfing", "كلاهما بالقدر نفسه"], "a": 1}}, {"t": "Attacks Against Wi-Fi Protocols", "b": "<p>بروتوكولات تأمين الـ Wi-Fi تطورت لأن القديم منها كُسر:<\/p><ul><li><b>WEP<\/b> (Wired Equivalent Privacy): أول معيار. يستخدم مفتاحاً ثابتاً لا يتغير، ومتجه التهيئة (<b>IV<\/b>) فيه قصير (24 بت) ويتكرر، فيستطيع المهاجم استنتاج المفتاح بجمع عدد كافٍ من الـ Packets. <b>مكسور تماماً<\/b>.<\/li><li><b>WPA<\/b> ثم <b>WPA2<\/b>: جاءا لعلاجه. WPA2 يستخدم تشفير AES القوي، لكن إن كانت كلمة السر ضعيفة يستطيع المهاجم التقاط عملية المصافحة (Handshake) ثم تخمين الكلمة دون اتصال (Offline).<\/li><li><b>WPA3<\/b>: المعيار الحالي، ويعالج هذه الثغرة.<\/li><\/ul><p>عدد العناوين الممكنة للـ IV في WEP هو <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>2<\/mn><mrow><mn>24<\/mn><\/mrow><\/msup><mo>≈<\/mo><mn>16.7<\/mn><\/mrow><\/math> مليون فقط، وشبكة مزدحمة تستهلكها في ساعات.<\/p>", "q": {"k": "mc", "q": "لماذا يُعد WEP غير آمن إطلاقاً اليوم؟", "e": "ضعف تصميم الـ IV والمفتاح الثابت يسمحان باستخراج المفتاح من الحركة الملتقطة خلال وقت قصير.", "o": ["لأنه بطيء فقط", "لأن مفتاحه ثابت والـ IV قصير ومتكرر فيمكن استخراج المفتاح", "لأنه لا يعمل مع الهواتف"], "a": 1}}, {"t": "Wi-Fi and Mobile Defense", "b": "<ul><li>استخدم <b>WPA2<\/b> على الأقل، و <b>WPA3<\/b> إن دعمته الأجهزة، بكلمة سر طويلة.<\/li><li>غيّر الإعدادات الافتراضية للـ AP: اسم المدير وكلمة السر والـ SSID.<\/li><li>ضع الـ APs خلف الـ Firewall أو في منطقة معزولة، وافصل شبكة الضيوف.<\/li><li>استخدم <b>VPN<\/b> على الشبكات العامة.<\/li><li>على الهاتف: قفل شاشة، تحديثات، تطبيقات من المتجر الرسمي، وتعطيل Bluetooth و Wi-Fi عند عدم الحاجة.<\/li><li>في المؤسسات: نظام <b>MDM<\/b> (Mobile Device Management) يفرض السياسات ويمسح الجهاز المفقود عن بعد.<\/li><\/ul><p>تمرين «Risky Business»: لكل سلوك اسأل: ما البيانات المكشوفة، ولمن؟<\/p>", "q": {"k": "mc", "q": "أنت في مطار وتحتاج للدخول إلى بريد العمل عبر Wi-Fi عام. ما الأكثر أماناً؟", "e": "الـ VPN ينشئ نفقاً مشفراً، فلا يستطيع من يتنصت على الشبكة العامة قراءة حركتك.", "o": ["الاتصال مباشرة لأن البريد مهم", "تشغيل VPN قبل الدخول", "تعطيل قفل الشاشة لتسريع العمل"], "a": 1}}], "test": [{"k": "mc", "q": "موظف ركّب Router منزلياً في مكتبه ووصله بشبكة الشركة ليحصل على Wi-Fi أفضل. كيف يُصنَّف هذا الجهاز؟", "e": "جهاز غير مصرح به موصول بالشبكة الداخلية، حتى لو كانت نية صاحبه حسنة. يفتح مدخلاً يتجاوز ضوابط الشبكة.", "o": ["Rogue Access Point", "Evil twin", "Bluejacking"], "a": 0}, {"k": "tf", "q": "WPA2 مع كلمة سر قصيرة وشائعة آمن تماماً لأن التشفير AES.", "e": "قوة التشفير لا تعوّض كلمة سر ضعيفة؛ المهاجم يلتقط الـ Handshake ويخمّن الكلمة Offline.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "1.5 Application Attacks", "kind": "lesson", "cs": [{"t": "Cross-Site Scripting (XSS)", "b": "<p><b>XSS<\/b> ثغرة في تطبيقات الويب تسمح للمهاجم بحقن كود (<b>Script<\/b>، غالباً JavaScript) في صفحة يراها مستخدمون آخرون. المتصفح يثق بالصفحة فينفّذ الكود كأنه جزء منها.<\/p><p>كيف يحدث: الموقع يعرض ما يكتبه المستخدم (تعليق، اسم) كما هو دون تنظيف. المهاجم يكتب كوداً بدل النص، فيعمل في متصفح كل زائر.<\/p><p>ماذا يفعل الكود: يسرق <b>Cookies<\/b> الجلسة (فينتحل حساب الضحية)، أو يغيّر محتوى الصفحة، أو يحوّل الزائر إلى موقع خبيث.<\/p><p>الضحية المباشرة هنا <b>زائر الموقع<\/b> وليس الخادم.<\/p>", "q": {"k": "mc", "q": "في هجوم XSS، أين يُنفَّذ الكود الخبيث؟", "e": "XSS يجعل متصفح الضحية ينفّذ Script حقنه المهاجم في صفحة موثوقة.", "o": ["على خادم قاعدة البيانات", "في متصفح المستخدم الذي يزور الصفحة المصابة", "على الـ Router"], "a": 1}}, {"t": "Code Injection", "b": "<p><b>Injection<\/b> هو إدخال بيانات يفسّرها التطبيق على أنها أوامر. السبب دائماً واحد: التطبيق يدمج مدخلات المستخدم في أمر دون التحقق منها.<\/p><ul><li><b>SQL injection<\/b>: إدخال جزء من استعلام SQL في حقل (مثل حقل اسم المستخدم) فيتغير معنى الاستعلام الذي ينفذه الخادم على قاعدة البيانات، فيتجاوز المهاجم تسجيل الدخول أو يقرأ جداول كاملة.<\/li><li><b>XML injection<\/b>: التلاعب بمحتوى أو استعلام XML لإفساد البيانات أو الوصول لما لا يحق.<\/li><li><b>DLL injection<\/b>: خداع برنامج في Windows ليحمّل مكتبة (DLL) خبيثة فتعمل بصلاحياته.<\/li><li><b>LDAP injection<\/b>: التلاعب باستعلامات خدمة الدليل (LDAP) التي تُستخدم في المصادقة.<\/li><\/ul><p>العلاج الجذري: <b>Input validation<\/b> واستخدام <b>Parameterized queries<\/b> التي تفصل البيانات عن الأمر.<\/p>", "q": {"k": "mc", "q": "ما السبب الجذري المشترك لهجمات الـ Injection؟", "e": "حين يثق التطبيق بالمدخلات ويدمجها مباشرة، يستطيع المهاجم تحويل «بيانات» إلى «أوامر».", "o": ["ضعف سرعة الخادم", "عدم التحقق من مدخلات المستخدم قبل دمجها في أمر أو استعلام", "استخدام HTTPS"], "a": 1}}, {"t": "Buffer Overflow", "b": "<p><b>Buffer<\/b> منطقة في الذاكرة خُصصت لحفظ بيانات بحجم محدد. <b>Buffer overflow<\/b> يحدث حين يكتب البرنامج بيانات أكبر من حجم الـ Buffer، فتفيض على مناطق الذاكرة المجاورة.<\/p><p>تشبيه: كوب يتسع لـ 200 مل تصب فيه لتراً؛ الزائد يسيل على ما حوله.<\/p><p>النتيجة: انهيار البرنامج، أو تلف بيانات، أو في أسوأ الأحوال يكتب المهاجم فوق عنوان الرجوع في الذاكرة فيجعل البرنامج ينفّذ كوده هو، وقد يحصل على صلاحيات أعلى (Privilege escalation).<\/p><p>السبب: لغة أو كود لا يتحقق من طول المدخل. العلاج: فحص الحدود (Bounds checking) والتحديثات.<\/p>", "q": {"k": "tf", "q": "الـ Buffer overflow يحدث عندما تُكتب في منطقة ذاكرة بيانات أكبر من حجمها المخصص.", "e": "الفائض يكتب فوق ذاكرة مجاورة، ما قد يسبب انهياراً أو تنفيذ كود المهاجم.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}, {"t": "Remote Code Execution (RCE)", "b": "<p><b>RCE<\/b> هو أن يتمكن المهاجم من تنفيذ أوامر من اختياره على جهاز بعيد، بصلاحيات البرنامج المصاب، ودون وصول فيزيائي. هو من أخطر النتائج لأنه يعني سيطرة عملية على الجهاز.<\/p><p>يتحقق عادةً باستغلال ثغرة مثل Buffer overflow أو Injection في خدمة تستمع على الشبكة.<\/p><p>أدوات مثل <b>Metasploit<\/b> (إطار لاختبار الاختراق) و <b>Meterpreter<\/b> (وحدة تعمل في الذاكرة بعد الاستغلال) يستخدمها مختبرو الاختراق المصرح لهم لإثبات وجود مثل هذه الثغرات حتى تُصلح. استخدامها دون تصريح مكتوب جريمة.<\/p>", "q": {"k": "mc", "q": "لماذا تُصنَّف ثغرات RCE ضمن الأعلى خطورة؟", "e": "تنفيذ أوامر عن بعد يعني قدرة على سرقة البيانات، تثبيت Malware، أو التحرك داخل الشبكة.", "o": ["لأنها تبطئ الطباعة", "لأنها تمنح المهاجم تنفيذ أوامره على الجهاز عن بعد", "لأنها تظهر في الهواتف فقط"], "a": 1}}, {"t": "Other Application Attacks", "b": "<ul><li><b>CSRF<\/b> (Cross-Site Request Forgery): خداع متصفح مستخدم مسجَّل دخوله ليرسل طلباً لم يقصده (مثل تحويل مال) إلى موقع يثق به.<\/li><li><b>Race condition<\/b> (وتسمى TOCTOU): يستغل المهاجم الفاصل الزمني بين فحص شرط وتنفيذ العملية.<\/li><li><b>Improper input handling<\/b>: أي معالجة ناقصة للمدخلات، وهي أم ثغرات الـ Injection والـ Overflow.<\/li><li><b>Error handling attack<\/b>: رسائل خطأ مفصلة تكشف للمهاجم بنية النظام.<\/li><li><b>API attack<\/b>: إساءة استخدام واجهة برمجية ضعيفة المصادقة.<\/li><li><b>Replay attack<\/b>: التقاط رسالة صحيحة (مثل طلب مصادقة) وإعادة إرسالها لاحقاً.<\/li><li><b>Directory traversal<\/b>: استخدام <code dir=\"ltr\">../<\/code> في مسار للوصول لملفات خارج المجلد المسموح.<\/li><li><b>Resource exhaustion<\/b>: استنزاف ذاكرة أو معالج أو قرص حتى يتوقف التطبيق.<\/li><\/ul>", "q": {"k": "mc", "q": "التقط مهاجم طلب تسجيل دخول مشفراً صحيحاً ثم أعاد إرساله كما هو بعد ساعة ودخل. ما اسم الهجوم؟", "e": "لم يفك التشفير؛ اكتفى بإعادة إرسال رسالة صحيحة. يمنعه استخدام طوابع زمنية أو أرقام لا تتكرر (Nonce).", "o": ["CSRF", "Replay attack", "Directory traversal"], "a": 1}}, {"t": "Defending Against Application Attacks", "b": "<p>خط الدفاع الأول هو كتابة كود سليم:<\/p><ul><li>اعتبر <b>كل<\/b> مدخل من خارج الدالة غير موثوق، وتحقق منه (<b>Input validation<\/b>).<\/li><li>حدّث كل البرامج: نظام التشغيل، التطبيقات، والمكتبات.<\/li><li>لا تعرض رسائل خطأ مفصلة للمستخدم.<\/li><li>اختبر الكود قبل نشره: مراجعة، وفحص ثابت (SAST) وديناميكي (DAST).<\/li><li>طبّق Least Privilege على حسابات التطبيق وقاعدة البيانات.<\/li><li>ضع <b>WAF<\/b> (Web Application Firewall) أمام تطبيقات الويب.<\/li><\/ul><p>ليست كل البرامج متساوية في الأمان، والتحديث المنتظم هو أرخص وأنجع وقاية.<\/p>", "q": {"k": "mc", "q": "أي ممارسة تمنع أكبر عدد من هجمات التطبيقات؟", "e": "Injection و XSS و Buffer overflow و Directory traversal كلها تبدأ من مدخل لم يُفحص.", "o": ["التحقق من كل المدخلات قبل استخدامها", "إخفاء شعار الشركة", "زيادة ذاكرة الخادم"], "a": 0}}, {"t": "Spam", "b": "<p><b>Spam<\/b> (البريد المزعج، ويسمى Junk mail) رسائل غير مطلوبة تُرسل بكميات كبيرة. أغلبها إعلانات، لكنها وسيلة شائعة لنقل روابط خبيثة و Malware ومحتوى خادع.<\/p><p>علامات تدل عليه:<\/p><ul><li>لا يوجد عنوان (Subject) أو العنوان غريب.<\/li><li>يطلب منك «تحديث بيانات حسابك».<\/li><li>أخطاء إملائية وعلامات ترقيم غريبة.<\/li><li>روابط طويلة أو مبهمة.<\/li><li>يشبه رسالة من شركة معروفة مع اختلافات صغيرة.<\/li><li>يطلب فتح مرفق، خصوصاً ملفاً تنفيذياً.<\/li><\/ul><p>إن وصلتك رسالة كهذه: لا تفتحها ولا مرفقها، وبلّغ عنها. معظم مزودي البريد يفلترون الـ Spam، لكن بعضه يتسلل.<\/p>", "q": {"k": "tf", "q": "كل رسائل الـ Spam مجرد إعلانات مزعجة ولا خطر أمني منها.", "e": "كثير منها يحمل روابط أو مرفقات خبيثة. لذلك تُعامل كقناة هجوم وليس إزعاجاً فقط.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Phishing و Spear Phishing", "b": "<p><b>Phishing<\/b> (التصيد): رسالة تنتحل صفة جهة موثوقة (بنك، شركة شحن، قسم IT) لتخدعك فتكشف بيانات أو تثبّت Malware. تُرسل بالجملة لآلاف الناس على أمل أن يقع بعضهم.<\/p><p><b>Spear phishing<\/b>: تصيد <b>موجَّه<\/b> لشخص أو مجموعة بعينها. المهاجم يبحث عن الضحية أولاً (اسمه، وظيفته، اهتماماته) ثم يكتب رسالة مفصلة عليه، فتبدو مقنعة جداً.<\/p><p>مثال: مهاجم يعلم أنك تهتم بالسيارات فيرسل لك «عرضاً خاصاً» من وكالة تعاملت معها، والرابط يقود لصفحة تسرق بياناتك.<\/p>", "q": {"k": "mc", "q": "ما الفرق بين Phishing و Spear phishing؟", "e": "Spear = رمح: إصابة هدف واحد بدقة، بدل شبكة تُرمى على الجميع.", "o": ["الأول عبر الهاتف والثاني عبر البريد", "الأول عشوائي بالجملة والثاني مخصص لضحية محددة بعد جمع معلومات عنها", "لا فرق"], "a": 1}}, {"t": "Vishing و Pharming و Whaling", "b": "<ul><li><b>Vishing<\/b> (Voice phishing): التصيد عبر المكالمات الصوتية، وقد يزوّر المهاجم رقم المتصل ليظهر كرقم البنك.<\/li><li><b>Pharming<\/b>: توجيه المستخدم إلى نسخة مزيفة من موقع شرعي <b>دون أن ينقر رابطاً خبيثاً<\/b>، عبر تسميم الـ DNS أو تعديل ملف hosts في جهازه. يكتب العنوان الصحيح ويصل للمكان الخطأ.<\/li><li><b>Whaling<\/b> (صيد الحيتان): Spear phishing يستهدف كبار المسؤولين: مدير تنفيذي، مدير مالي، سياسي. الغنيمة أكبر لأن صلاحياتهم أوسع.<\/li><\/ul><p>ومعها <b>SMiShing<\/b> (عبر SMS) الذي مرّ في القسم السابق.<\/p>", "q": {"k": "mc", "q": "رسالة مصممة بعناية وصلت للمدير المالي تطلب تحويلاً عاجلاً «بتوقيع المدير التنفيذي». ما النوع؟", "e": "استهداف مسؤول رفيع برسالة مخصصة هو Whaling.", "o": ["Vishing", "Whaling", "Pharming"], "a": 1}}, {"t": "Defending Against Email and Browser Attacks", "b": "<p>تقنيات وعادات تعمل معاً:<\/p><ul><li><b>Spam filters<\/b> و Antimalware على خادم البريد وعلى الجهاز.<\/li><li>لا تفتح مرفقاً غير متوقع ولو من مرسل معروف؛ قد يكون حسابه مخترقاً.<\/li><li>مرّر المؤشر فوق الرابط لترى وجهته الحقيقية قبل النقر.<\/li><li>حدّث المتصفح والإضافات، وعطّل ما لا تحتاجه منها.<\/li><li><b>MFA<\/b> (Multi-Factor Authentication): حتى لو سُرقت كلمة السر، يحتاج المهاجم عاملاً ثانياً.<\/li><li>تدريب الموظفين، ومجموعات مثل <b>APWG<\/b> (Anti-Phishing Working Group) تجمع بلاغات التصيد.<\/li><li>بروتوكولات تحقق المرسل (SPF, DKIM, DMARC) تصعّب تزوير نطاق مؤسستك.<\/li><\/ul>", "q": {"k": "mc", "q": "سُرقت كلمة سر موظف عبر صفحة تصيد. أي إجراء كان سيمنع المهاجم من الدخول رغم ذلك؟", "e": "مع MFA لا تكفي كلمة السر وحدها؛ يلزم عامل ثانٍ لا يملكه المهاجم.", "o": ["خلفية بريد ملونة", "MFA", "تقصير كلمة السر"], "a": 1}}, {"t": "There's More: هجمات أخرى شائعة", "b": "<ul><li><b>Physical attacks<\/b>: هجوم على الأجهزة نفسها: كابل USB خبيث، نسخ بطاقة دخول (Card cloning)، أو Skimmer على صراف آلي.<\/li><li><b>Adversarial AI<\/b>: خداع أنظمة تعلم الآلة بتسميم بيانات تدريبها (<b>Tainted training data<\/b>) أو بمدخلات مصممة لتضليلها.<\/li><li><b>Supply chain attack<\/b>: اختراق مورّد موثوق (برنامج، تحديث، قطعة) للوصول إلى عملائه كلهم دفعة واحدة.<\/li><li><b>Cloud-based attacks<\/b>: استهداف خدمات سحابية وإعداداتها الخاطئة بدل الخوادم المحلية.<\/li><\/ul><p>الدرس: سطح الهجوم يتسع مع كل تقنية جديدة، والمبادئ نفسها (تحقق، حدّث، قلّل الصلاحيات) تبقى صالحة.<\/p>", "q": {"k": "mc", "q": "تحديث رسمي لبرنامج محاسبة موثوق وصل لآلاف الشركات وفيه كود خبيث زرعه مهاجم اخترق الشركة المصنّعة. ما نوع الهجوم؟", "e": "المهاجم اخترق المورّد ليصل لعملائه عبر قناة يثقون بها. هذا هجوم سلسلة توريد.", "o": ["Supply chain attack", "Bluesnarfing", "Whaling"], "a": 0}}], "test": [{"k": "mc", "q": "حقل «البحث» في موقع يعرض ما تكتبه كما هو، فكتب مهاجم فيه كوداً يسرق Cookies الزوار. ما الثغرة وما العلاج؟", "e": "عرض مدخلات المستخدم دون تنظيف يسمح بتنفيذ Script في متصفحات الآخرين. العلاج Input validation و Output encoding.", "o": ["Buffer overflow، والعلاج زيادة الذاكرة", "XSS، والعلاج تنظيف المدخلات وترميز المخرجات", "Pharming، والعلاج تغيير الـ DNS"], "a": 1}, {"k": "mc", "q": "موظف كتب عنوان بريد الشركة الصحيح في المتصفح، لكن ملف hosts في جهازه كان معدّلاً فوصل لصفحة مزيفة. ما هذا؟", "e": "توجيه إلى موقع مزيف دون نقر رابط، عبر العبث بترجمة الأسماء، هو Pharming.", "o": ["Whaling", "Pharming", "Spam"], "a": 1}, {"k": "sa", "q": "اذكر إجراءين تقنيين وإجراء بشرياً واحداً للدفاع ضد Phishing.", "e": "تقنياً: Spam filter و MFA (ومعها SPF/DKIM/DMARC). بشرياً: تدريب وتوعية الموظفين على فحص الروابط والتبليغ.", "kw": [["mfa", "filter", "فلتر", "تصفية", "dmarc", "spf", "antimalware"], ["تدريب", "توعية", "وعي", "training", "awareness"]]}]}, {"t": "1.6 ملخص الوحدة 1 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li><b>Common Threats<\/b>: التهديد يأتي من أبواب (Threat Domains) ومن الداخل والخارج. المجالات: User، Device، LAN، Private Cloud، Public Cloud، Application. التهديدات المعقدة: APT. المتخفية: Backdoor و Rootkit. مصادر المعلومات: CVE، Dark Web، IOC، AIS.<\/li><li><b>Deception<\/b>: الـ Social Engineering يستغل الإنسان: Pretexting، Quid pro quo، Tailgating، Hoax، Watering hole، Typosquatting.<\/li><li><b>Cyber Attacks<\/b>: Malware (Virus، Worm، Trojan)، Logic bomb، Ransomware، DoS/DDoS، هجمات DNS و Layer 2، MitM، Zero-day، Keylogger.<\/li><li><b>Wireless/Mobile<\/b>: Grayware، SMiShing، Rogue AP، Evil twin، Jamming، Bluejacking/Bluesnarfing، ضعف WEP.<\/li><li><b>Application Attacks<\/b>: XSS، Injection، Buffer overflow، RCE، CSRF، Replay، ثم Spam و Phishing وأقاربه.<\/li><li><b>الدفاع<\/b>: Defense in Depth، تحديثات، Input validation، MFA، توعية، نسخ احتياطية.<\/li><\/ul>", "q": {"k": "mc", "q": "أي عبارة تلخص منهج الدفاع في هذه الوحدة؟", "e": "لا توجد أداة واحدة تغطي Malware والخداع وثغرات التطبيقات معاً. Defense in Depth هو المنهج.", "o": ["أداة واحدة قوية تكفي", "طبقات متعددة من الضوابط التقنية والبشرية، لأن كل طبقة قد تفشل", "الأمن مسؤولية قسم IT وحده"], "a": 1}}], "test": []}, {"t": "اختبار الوحدة 1", "kind": "exam", "pool": [1], "n": 10}]}, {"n": "2", "t": "الوحدة 2: Securing Networks", "secs": [{"t": "2.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>في الوحدة السابقة عرفت أنواع الهجمات. هنا تجيب عن سؤالين: <b>لماذا<\/b> تُستهدف الشبكات، و<b>من<\/b> يهاجمها.<\/p><p>ستتعلم:<\/p><ul><li>الوضع الحالي لأمن الشبكات: لماذا الشبكة هدف، ومن أين تدخل الهجمات (Vectors)، وكيف تتسرب البيانات.<\/li><li>من هم المهاجمون (Threat actors)، ما دوافعهم، وكيف تطوروا.<\/li><li>كيف يتبادل المدافعون المعلومات عن التهديدات.<\/li><\/ul><p>فهم الخصم ودوافعه يساعدك على توقع ما سيستهدفه في مؤسستك.<\/p>", "q": {"k": "tf", "q": "تركز هذه الوحدة على دوافع المهاجمين ومسارات دخولهم وليس على تفاصيل بروتوكول معيّن.", "e": "الوحدة 2 تصف المشهد العام: لماذا ومن ومن أين. التفاصيل التقنية للبروتوكولات تأتي في الوحدتين 3 و4.", "o": ["صح", "خطأ"], "a": 0, "ns": 1}}], "test": []}, {"t": "2.1 Current State of Affairs", "kind": "lesson", "cs": [{"t": "Anatomy of an Attack: مراحل الهجوم", "b": "<p>الهجوم الحقيقي سلسلة مراحل، ومعرفتها تعطيك أكثر من فرصة لقطعه:<\/p><ul><li><b>Reconnaissance<\/b> (الاستطلاع): جمع معلومات عن الهدف.<\/li><li><b>Initial access<\/b>: الدخول الأول، غالباً عبر Phishing أو ثغرة أو جهاز ضعيف (كاميرا، طابعة).<\/li><li><b>Lateral movement<\/b>: التحرك من الجهاز الأول إلى أجهزة أهم داخل الشبكة.<\/li><li><b>Privilege escalation<\/b>: رفع الصلاحيات.<\/li><li><b>Exfiltration أو Impact<\/b>: تهريب البيانات أو التخريب.<\/li><\/ul><p>هذا التسلسل يُعرف في المراجع باسم <b>Cyber Kill Chain<\/b>. جهاز IoT مهمَل قد يكون أول حلقة تقود إلى خادم الرواتب.<\/p>", "q": {"k": "mc", "q": "مهاجم دخل عبر كاميرا مراقبة ضعيفة ثم انتقل منها إلى خادم الملفات. ماذا تسمى مرحلة الانتقال؟", "e": "التحرك أفقياً من جهاز مخترق إلى أجهزة أخرى داخل الشبكة هو Lateral movement. تقسيم الشبكة يصعّبه.", "o": ["Reconnaissance", "Lateral movement", "Exfiltration"], "a": 1}}, {"t": "Networks Are Targets و Reasons for Network Security", "b": "<p>الشبكات تتعرض للهجوم باستمرار، وخرائط مثل Kaspersky Cyberthreat Map تعرض الهجمات الجارية لحظياً.<\/p><p>لماذا يهم أمن الشبكة؟ لأن الاختراق قد يسبب:<\/p><ul><li>توقف العمل وخسارة الإيرادات.<\/li><li>سرقة ملكية فكرية وبيانات عملاء.<\/li><li>خسائر مالية مباشرة وغرامات قانونية.<\/li><li>ضرر بالسمعة وفقدان الثقة.<\/li><li>تهديد السلامة العامة حين تكون الشبكة لمستشفى أو محطة كهرباء.<\/li><\/ul><p>لذلك أمن الشبكة مرتبط مباشرة باستمرارية العمل (<b>Business continuity<\/b>). على المحلل متابعة مصادر مثل <b>Cisco Talos<\/b> لمعرفة التهديدات الجديدة.<\/p>", "q": {"k": "mc", "q": "أي مما يلي ليس نتيجة مباشرة محتملة لاختراق شبكة؟", "e": "الاختراق يجلب خسائر مالية وقانونية وسمعة. لا فائدة تشغيلية منه.", "o": ["غرامات قانونية", "فقدان ثقة العملاء", "زيادة تلقائية في سرعة الشبكة"], "a": 2}}, {"t": "Vectors of Network Attacks", "b": "<p><b>Attack vector<\/b> هو المسار الذي يسلكه المهاجم للوصول إلى خادم أو جهاز أو شبكة.<\/p><ul><li><b>External vectors<\/b>: من خارج المؤسسة عبر الإنترنت، مثل هجوم DoS على الخادم العام.<\/li><li><b>Internal vectors<\/b>: من الداخل: موظف يسرق بيانات، أو يوصل USB مصاباً، أو جهاز داخلي مخترق.<\/li><\/ul><p>التهديد الداخلي قد يسبب ضرراً أكبر لأن صاحبه يملك وصولاً مباشراً للمبنى والأجهزة ومعرفة بالشبكة.<\/p><p>الفرق عن Threat Domain: الـ Domain هو «المنطقة»، والـ Vector هو «الطريق» المحدد الذي استُخدم.<\/p>", "q": {"k": "mc", "q": "موظف نسخ قاعدة العملاء على قرص خارجي وأخذها معه. ما نوع الـ Vector؟", "e": "المسار بدأ من داخل المؤسسة بوصول مشروع، فهو Internal vector.", "o": ["External", "Internal", "لا يُعد Vector"], "a": 1}}, {"t": "Data Loss", "b": "<p><b>Data loss<\/b> أو <b>Data exfiltration<\/b>: فقدان البيانات أو سرقتها أو تسريبها إلى الخارج، عمداً أو سهواً. قنواته الشائعة:<\/p><ul><li><b>Email / Social networking<\/b>: رسالة أو مرفق يُعترض أو يُرسل للشخص الخطأ.<\/li><li><b>Unencrypted devices<\/b>: Laptop مسروق غير مشفر.<\/li><li><b>Cloud storage devices<\/b>: إعدادات وصول ضعيفة أو حساب مخترق.<\/li><li><b>Removable media<\/b>: نسخ غير مصرح به إلى USB، أو ضياع القرص.<\/li><li><b>Hard copy<\/b>: أوراق سرية لم تُتلف.<\/li><li><b>Improper access control<\/b>: كلمات سر ضعيفة أو مسروقة.<\/li><\/ul><p><b>DLP<\/b> (Data Loss Prevention) هي ضوابط تقنية وإدارية تراقب حركة البيانات الحساسة وتمنع خروجها.<\/p>", "q": {"k": "mc", "q": "سُرق Laptop مدير المبيعات من سيارته. أي ضابط كان سيمنع تحول السرقة إلى تسريب بيانات؟", "e": "القرص المشفر لا يُقرأ دون المفتاح، فتبقى الخسارة خسارة جهاز فقط.", "o": ["شاشة أكبر", "تشفير القرص كاملاً (Full disk encryption)", "خلفية بيضاء"], "a": 1}}, {"t": "تمرين: Investigate a Threat Landscape", "b": "<p>نشاط Packet Tracer الأصلي يعرض شبكة شركة ويطلب منك تحديد نقاط ضعفها. نفّذه هنا على الورق.<\/p><p>الشبكة: مقر رئيسي فيه خوادم ملفات وبريد، Wi-Fi للموظفين وآخر للضيوف على الشبكة نفسها، موظفون يعملون من المنزل عبر الإنترنت، كاميرات IoT بكلمة السر الافتراضية، وفرع يتصل بالمقر عبر الإنترنت دون تشفير.<\/p><p>اكتب لنفسك قبل الإجابة:<\/p><ul><li>ثلاث ثغرات على الأقل.<\/li><li>لكل ثغرة: هل الـ Vector داخلي أم خارجي؟<\/li><li>إجراء واحد يعالج كل ثغرة.<\/li><\/ul>", "q": {"k": "sa", "q": "اذكر ثغرتين في الشبكة الموصوفة أعلاه مع علاج لكل منهما.", "e": "أمثلة: (1) Wi-Fi الضيوف على الشبكة نفسها، والعلاج فصله في شبكة معزولة. (2) كاميرات IoT بكلمة السر الافتراضية، والعلاج تغييرها وعزل الكاميرات. (3) اتصال الفرع غير مشفر، والعلاج VPN. (4) العاملون من المنزل، والعلاج VPN و MFA.", "kw": [["ضيوف", "guest", "كاميرا", "iot", "افتراضي", "default", "تشفير", "vpn", "فرع"]]}}], "test": [{"k": "mc", "q": "أي قناة لتسرب البيانات تعالجها آلة تقطيع الورق؟", "e": "النسخ الورقية السرية يجب إتلافها حين تنتهي الحاجة إليها.", "o": ["Removable media", "Hard copy", "Cloud storage"], "a": 1}, {"k": "tf", "q": "الـ Attack vector الخارجي دائماً أخطر من الداخلي.", "e": "الداخلي قد يكون أخطر لأن صاحبه يملك وصولاً مشروعاً ومعرفة بالأنظمة.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}]}, {"t": "2.2 Who is Attacking Our Network?", "kind": "lesson", "cs": [{"t": "Threat, Vulnerability, and Risk (بتعمق)", "b": "<p>مرّت التعريفات في التمهيد. نضيف الآن كيف تتعامل المؤسسة مع الخطر (<b>Risk management<\/b>). أمامها أربعة خيارات:<\/p><ul><li><b>Risk acceptance<\/b>: قبول الخطر حين تكون كلفة العلاج أعلى من كلفة الضرر.<\/li><li><b>Risk avoidance<\/b>: تجنب النشاط الذي يولّد الخطر أصلاً.<\/li><li><b>Risk reduction<\/b>: تخفيض الاحتمال أو الأثر بضوابط (<b>Mitigation<\/b>). هذا أكثر الخيارات استخداماً.<\/li><li><b>Risk transfer<\/b>: نقل الخطر لطرف آخر، مثل شركة تأمين.<\/li><\/ul><p>ومصطلحان آخران:<\/p><ul><li><b>Asset<\/b>: أي شيء له قيمة للمؤسسة: بيانات، أجهزة، أشخاص.<\/li><li><b>Countermeasure<\/b>: الإجراء الذي يخفف التهديد أو الخطر.<\/li><\/ul>", "q": {"k": "mc", "q": "شركة اشترت بوليصة تأمين ضد الهجمات السيبرانية. أي استراتيجية هذه؟", "e": "التأمين ينقل جزءاً من الكلفة المالية للخطر إلى طرف آخر.", "o": ["Risk avoidance", "Risk transfer", "Risk acceptance"], "a": 1}}, {"t": "Hacker vs Threat Actor", "b": "<p>كلمة <b>Hacker<\/b> كانت تعني مبرمجاً بارعاً، ثم صارت تُستخدم لمن يخترق الأنظمة. يُصنَّفون بالقبعات:<\/p><ul><li><b>White hat<\/b>: مخترق أخلاقي يعمل <b>بتصريح<\/b> ليكتشف الثغرات ويبلّغ أصحاب النظام.<\/li><li><b>Gray hat<\/b>: يخترق دون تصريح ودون نية أذى أو ربح، وقد يبلّغ عن الثغرة بعد استغلالها. فعله يبقى غير قانوني.<\/li><li><b>Black hat<\/b>: يخترق لمكسب شخصي أو للإيذاء.<\/li><\/ul><p><b>Threat actor<\/b> مصطلح أوسع وأدق: أي فرد أو جماعة تنفذ هجوماً أو تمثل تهديداً، أياً كان مستواها ودافعها. الفارق بين القبعات هو <b>التصريح والنية<\/b> وليس المهارة.<\/p>", "q": {"k": "mc", "q": "باحث اكتشف ثغرة في موقع شركة باختراقه دون إذن، ثم راسلها ليخبرها ولم يسرق شيئاً. ما تصنيفه؟", "e": "نيته ليست خبيثة لكنه عمل دون تصريح، فهو Gray hat. الـ White hat يعمل دائماً بإذن مسبق.", "o": ["White hat", "Gray hat", "Black hat"], "a": 1}}, {"t": "Evolution of Threat Actors", "b": "<p>تطور المهاجمون من هواة إلى منظمات:<\/p><ul><li><b>Script kiddies<\/b>: مبتدئون يستخدمون أدوات جاهزة كتبها غيرهم، دون فهم عميق، غالباً للتسلية.<\/li><li><b>Vulnerability brokers<\/b>: يكتشفون ثغرات ويبيعونها أو يبلّغون عنها مقابل جوائز.<\/li><li><b>Hacktivists<\/b>: يهاجمون لدافع سياسي أو اجتماعي: تشويه مواقع، تسريب وثائق، DDoS احتجاجي.<\/li><li><b>Cybercriminals<\/b>: مجرمون محترفون دافعهم المال.<\/li><li><b>State-sponsored<\/b>: فرق تمولها دول للتجسس أو التخريب، وهي أصحاب الـ APT.<\/li><\/ul><p>كلما صعدت في القائمة زادت الموارد والصبر والخطورة.<\/p>", "q": {"k": "mc", "q": "مجموعة عطّلت موقع وزارة احتجاجاً على قرار سياسي. ما تصنيفها؟", "e": "الدافع سياسي/اجتماعي وليس مالياً، وهذا تعريف الـ Hacktivist.", "o": ["Script kiddies", "Hacktivists", "Vulnerability brokers"], "a": 1}}, {"t": "Cybercriminals", "b": "<p><b>Cybercriminals<\/b> هم Black hats يعملون لحسابهم أو ضمن منظمات إجرامية كبيرة، ودافعهم الوحيد <b>المال<\/b>. تُقدَّر خسائرهم للعالم بمبالغ هائلة سنوياً.<\/p><p>يعملون في اقتصاد سري منظم (<b>Underground economy<\/b>): يبيعون ويشترون أدوات الهجوم، بيانات البطاقات، الحسابات المسروقة، وحتى خدمات جاهزة مثل <b>Ransomware-as-a-Service<\/b>، حيث يؤجّر مطور البرنامج الخبيث أداته لمن ينفذ الهجوم ويتقاسمان الفدية.<\/p><p>النتيجة: لم يعد المهاجم يحتاج مهارة عالية؛ يكفيه المال لشراء الأدوات.<\/p>", "q": {"k": "tf", "q": "الدافع الأساسي للـ Cybercriminals هو نشر رسالة سياسية.", "e": "دافعهم مالي. الدافع السياسي يميز الـ Hacktivists والجهات المدعومة من دول.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "Cybersecurity Tasks", "b": "<p>الأمن مسؤولية مشتركة. على المؤسسة:<\/p><ul><li>اختيار مزوّد خدمات IT موثوق.<\/li><li>تحديث برامج الحماية باستمرار.<\/li><li>إجراء اختبارات اختراق دورية (<b>Penetration tests<\/b>).<\/li><li>نسخ احتياطي للسحابة ولقرص محلي.<\/li><li>تغيير كلمة سر الـ Wi-Fi دورياً.<\/li><li>تحديث سياسة الأمن.<\/li><li>فرض كلمات سر قوية و <b>Two-factor authentication<\/b>.<\/li><\/ul><p>وعلى الفرد: كلمات سر مختلفة لكل خدمة، حذر من الروابط، وتحديث أجهزته. محلل الـ SOC يراقب تطبيق هذه المهام ويرصد الإخلال بها.<\/p>", "q": {"k": "mc", "q": "أي نشاط يكشف الثغرات قبل أن يجدها المهاجمون؟", "e": "اختبار الاختراق المصرح به يحاكي المهاجم ليجد نقاط الضعف فتُصلح.", "o": ["Penetration test دوري بتصريح", "تغيير شعار الشركة", "إيقاف النسخ الاحتياطي"], "a": 0}}, {"t": "Cyber Threat Indicators: IOC و IOA", "b": "<ul><li><b>IOC<\/b> (Indicators of Compromise): أدلة على أن هجوماً <b>وقع<\/b>. هي آثار يتركها المهاجم: Hash لملف خبيث، اسم ملف، IP أو نطاق لخادم C2، تعديل في الـ Registry. تُستخدم للكشف بعد الحدث ولحظر تكراره.<\/li><li><b>IOA<\/b> (Indicators of Attack): تركز على <b>سلوك<\/b> المهاجم ودوافعه وأسلوبه أثناء الهجوم، مثل «برنامج Office يشغّل PowerShell ثم يتصل بخادم خارجي». تفيد في إيقاف هجوم جارٍ حتى لو استخدم أدوات جديدة.<\/li><\/ul><p>تشبيه: الـ IOC بصمات على مسرح الجريمة، والـ IOA طريقة عمل اللص. اللص يغيّر قفازاته بسهولة، لكن يصعب عليه تغيير أسلوبه.<\/p>", "q": {"k": "mc", "q": "تقرير يذكر: «الملف الخبيث له SHA-256 كذا ويتصل بالعنوان 203.0.113.50». ما نوع هذه المعلومات؟", "e": "بصمة ملف وعنوان خادم هي آثار محددة تدل على اختراق: Indicators of Compromise.", "o": ["IOC", "IOA", "Risk transfer"], "a": 0}}, {"t": "Threat Sharing and Building Cybersecurity Awareness", "b": "<p>لا تستطيع مؤسسة واحدة رؤية كل التهديدات، فتتبادلها:<\/p><ul><li><b>CISA<\/b> (وكالة الأمن السيبراني وأمن البنية التحتية الأمريكية) تشغّل <b>AIS<\/b> لتبادل المؤشرات آلياً بين الحكومة والقطاع الخاص فور التحقق منها.<\/li><li><b>ENISA<\/b> وكالة الاتحاد الأوروبي للأمن السيبراني، تقدم المشورة والحلول لدول الاتحاد.<\/li><li>حملات توعية مثل <b>Cybersecurity Awareness Month<\/b> في أكتوبر من كل عام.<\/li><\/ul><p>الفكرة: مؤشر يُكتشف في مؤسسة يحمي آلاف المؤسسات الأخرى خلال دقائق إن شورك.<\/p>", "q": {"k": "tf", "q": "تبادل مؤشرات التهديد بين المؤسسات يضعف أمنها لأنه يكشف أسرارها.", "e": "المتبادَل هو مؤشرات الهجوم (Hashes، عناوين) وليس بيانات المؤسسة. المشاركة تسرّع حماية الجميع.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}], "test": [{"k": "mc", "q": "طالب نزّل أداة جاهزة من الإنترنت وشغّلها على موقع مدرسته دون أن يفهم كيف تعمل. ما تصنيفه؟", "e": "استخدام أدوات جاهزة دون فهم عميق ولا تصريح هو تعريف الـ Script kiddie.", "o": ["Script kiddie", "State-sponsored actor", "White hat"], "a": 0}, {"k": "mc", "q": "مؤسسة قررت إلغاء خدمة الدفع عبر موقعها القديم لأن تأمينه مكلف جداً. أي استراتيجية؟", "e": "إيقاف النشاط المولّد للخطر نفسه هو Risk avoidance.", "o": ["Risk transfer", "Risk reduction", "Risk avoidance"], "a": 2}]}, {"t": "2.3 ملخص الوحدة 2 واختبارها", "kind": "lesson", "cs": [{"t": "What Did I Learn in this Module?", "b": "<ul><li>الشبكات هدف دائم، واختراقها يضر بالمال والسمعة واستمرارية العمل.<\/li><li>الهجوم سلسلة مراحل: Reconnaissance ثم Initial access ثم Lateral movement ثم Exfiltration.<\/li><li>الـ Attack vector داخلي أو خارجي، والداخلي قد يكون أخطر.<\/li><li>البيانات تتسرب عبر البريد، الأجهزة غير المشفرة، السحابة، USB، الورق، وضعف التحكم بالوصول. العلاج: DLP.<\/li><li>الخطر يُدار بأربع طرق: Accept، Avoid، Reduce، Transfer.<\/li><li>المهاجمون: White/Gray/Black hat، Script kiddies، Hacktivists، Cybercriminals، State-sponsored.<\/li><li>IOC = آثار ما وقع، IOA = سلوك الهجوم الجاري. والمشاركة عبر CISA/AIS و ENISA تحمي الجميع.<\/li><\/ul>", "q": {"k": "mc", "q": "أي ترتيب يمثل تسلسل هجوم منطقياً؟", "e": "يبدأ المهاجم بجمع المعلومات، ثم يدخل، ثم يتحرك داخلياً، ثم يهرّب البيانات.", "o": ["Exfiltration ثم Reconnaissance ثم Initial access", "Reconnaissance ثم Initial access ثم Lateral movement ثم Exfiltration", "Lateral movement ثم Reconnaissance ثم Initial access"], "a": 1}}], "test": []}, {"t": "اختبار الوحدة 2", "kind": "exam", "pool": [2], "n": 8}]}, {"n": "3", "t": "الوحدة 3: Attacking the Foundation", "secs": [{"t": "3.0 مقدمة الوحدة", "kind": "lesson", "cs": [{"t": "لماذا هذه الوحدة وماذا ستتعلم؟", "b": "<p>«الأساس» (Foundation) هنا هو البروتوكولات التي تنقل كل شيء على الإنترنت: <b>IP<\/b> و <b>TCP<\/b> و <b>UDP<\/b>. صُممت في زمن كان مستخدمو الشبكة يثقون ببعضهم، فلم تُبنَ فيها حماية. المهاجم يستغل هذه الثقة الأصلية.<\/p><p>ستتعلم:<\/p><ul><li>بنية الـ Header في IPv4 و IPv6: ما معنى كل حقل.<\/li><li>كيف تُستغل هذه الحقول: Spoofing، هجمات ICMP، Amplification.<\/li><li>بنية TCP و UDP وهجماتهما: SYN flood، Session hijacking، UDP flood.<\/li><\/ul><p>محلل الـ SOC يقرأ هذه الحقول يومياً في Wireshark، فمعرفة القيم الطبيعية شرط لملاحظة الشاذ منها.<\/p>", "q": {"k": "mc", "q": "لماذا تحتوي بروتوكولات IP و TCP و UDP على نقاط ضعف أمنية أصلية؟", "e": "هدف التصميم كان إيصال البيانات. التحقق من الهوية والتشفير أُضيفا لاحقاً ببروتوكولات أخرى.", "o": ["لأنها جديدة ولم تُختبر", "لأنها صُممت للتوصيل في بيئة موثوقة دون اعتبار للأمن", "لأنها مشفرة أكثر من اللازم"], "a": 1}}], "test": []}, {"t": "3.1 IP PDU Details", "kind": "lesson", "cs": [{"t": "IPv4 و IPv6", "b": "<p><b>IP<\/b> (Internet Protocol) بروتوكول الطبقة الثالثة، وظيفته إيصال الـ Packet من المصدر إلى الوجهة عبر الشبكات. خصائصه:<\/p><ul><li><b>Connectionless<\/b>: لا يُنشئ اتصالاً قبل الإرسال.<\/li><li><b>Best effort<\/b>: يبذل جهده لكنه لا يضمن الوصول ولا الترتيب ولا عدم التكرار. الضمان مسؤولية TCP فوقه.<\/li><li>لا يتحقق من أن عنوان المصدر المكتوب في الـ Packet صحيح.<\/li><\/ul><p>نسختان:<\/p><ul><li><b>IPv4<\/b>: عنوان من 32 بت، يكتب مثل <code dir=\"ltr\">192.168.1.10<\/code>. عدد العناوين <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>2<\/mn><mrow><mn>32<\/mn><\/mrow><\/msup><mo>≈<\/mo><mn>4.3<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mrow><mn>9<\/mn><\/mrow><\/msup><\/mrow><\/math>، وقد استُنفدت.<\/li><li><b>IPv6<\/b>: عنوان من 128 بت، يكتب بالست عشري مثل <code dir=\"ltr\">2001:db8::1<\/code>. عدد العناوين <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><msup><mn>2<\/mn><mrow><mn>128<\/mn><\/mrow><\/msup><mo>≈<\/mo><mn>3.4<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mrow><mn>38<\/mn><\/mrow><\/msup><\/mrow><\/math>.<\/li><\/ul>", "q": {"k": "tf", "q": "بروتوكول IP يتحقق من صحة عنوان المصدر في كل Packet قبل توجيهه.", "e": "IP لا يتحقق من المصدر، وهذا ما يجعل IP spoofing ممكناً.", "o": ["صح", "خطأ"], "a": 1, "ns": 1}}, {"t": "The IPv4 Packet Header", "b": "<p>الـ Header في IPv4 طوله 20 بايت على الأقل. أهم حقوله:<\/p><div class=\"tw\"><table><tr><th>الحقل<\/th><th>وظيفته<\/th><\/tr><tr><td>Version<\/td><td>رقم النسخة = 4<\/td><\/tr><tr><td>Internet Header Length (IHL)<\/td><td>طول الـ Header بوحدات من 4 بايت<\/td><\/tr><tr><td>Differentiated Services (DS)<\/td><td>أولوية الـ Packet (جودة الخدمة QoS)<\/td><\/tr><tr><td>Total Length<\/td><td>الطول الكلي للـ Packet بالبايت<\/td><\/tr><tr><td>Identification, Flags, Fragment Offset<\/td><td>لتقسيم الـ Packet الكبير (Fragmentation) وإعادة تجميعه<\/td><\/tr><tr><td>Time-to-Live (TTL)<\/td><td>ينقص 1 عند
