function renderCB(el) {
  const d = CODE[+el.dataset.cb]; if (!d) return;
  const needsIn = /\binput\s*\(/.test(d.code);
  const quiz = el.dataset.static === '1';
  el.innerHTML = `<div class="cb-head"><span class="cb-lang"><span class="dots"><i></i><i></i><i></i></span>python</span>${quiz ? '' : `<div class="cb-actions"><button class="cbtn" data-a="copy" title="Copy code">${ICON.copy}<span class="lbl">Copy</span></button><button class="cbtn" data-a="trace" title="Watch it run line by line">${ICON.step}<span class="lbl">Step through</span></button><button class="cbtn" data-a="open" title="Open in the Playground to edit">${ICON.edit}<span class="lbl">Playground</span></button><button class="cbtn run" data-a="run">${ICON.play}<span class="lbl">Run</span></button></div>`}</div><pre class="cb-code"><code>${hl(d.code)}</code></pre>${needsIn && !quiz ? `<div class="stdin"><label>INPUT: one value per line (read by input())</label><textarea rows="2" spellcheck="false">${esc(d.inp)}</textarea></div>` : ''}${quiz ? '' : `<div class="out" ${d.out == null ? 'hidden' : ''}><div class="out-label"><span>Expected output</span></div><pre>${d.out != null ? esc(d.out) : ''}</pre></div>`}`;
  if (quiz) return;
  const stdin = () => { const t = $('.stdin textarea', el); return t ? t.value : ''; };
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'copy') copyText(d.code, b);
    else if (a === 'open') openInPlayground(d.code, stdin());
    else if (a === 'trace') openTrace(d.code, stdin());
    else if (a === 'run') {
      b.classList.add('busy'); const o = b.innerHTML; b.innerHTML = `${ICON.play}<span class="lbl">${PY.ready ? 'Running…' : 'Loading…'}</span>`;
      const r = await PY.call('run', { code: d.code, stdin: stdin() });
      b.classList.remove('busy'); b.innerHTML = o;
      showOutput($('.out', el), r);
    }
  });
}
function staticCode(code) { CODE.push({ code, out: null, inp: '' }); return `<div class="cb" data-cb="${CODE.length - 1}" data-static="1"></div>`; }

/* ---------- trace visualizer ---------- */
const TR = { steps: [], i: 0, lines: [], err: null, timer: null };
async function openTrace(code, stdin) {
  const m = $('#traceModal'); m.classList.add('open'); document.body.style.overflow = 'hidden';
  TR.lines = code.split('\n'); TR.steps = []; stopPlay();
  $('#trCode').innerHTML = TR.lines.map((l, i) => `<div class="tr-line" data-l="${i + 1}"><span class="ln">${i + 1}</span><span class="lc">${hl(l) || ' '}</span></div>`).join('');
  $('#trMsg').className = 'tr-msg'; $('#trMsg').innerHTML = PY.ready ? 'Recording every step…' : 'Loading Python (first time only)…';
  $('#trVars').innerHTML = ''; $('#trOut').textContent = ''; $('#trStep').textContent = '';
  const r = await PY.call('trace', { code, stdin: stdin || '' });
  if (!m.classList.contains('open')) return;
  if (!r.steps) { $('#trMsg').className = 'tr-msg err'; $('#trMsg').textContent = r.err || 'Could not trace this code.'; return; }
  TR.steps = r.steps; TR.err = r.err; TR.truncated = r.truncated;
  $('#trRange').max = TR.steps.length - 1;
  trGo(0); $('#trNext').focus();
}
function varTable(vars, prevVars) {
  const keys = Object.keys(vars);
  if (!keys.length) return '<div class="tr-empty">No variables yet.</div>';
  return `<table class="tr-vars">${keys.map(k => { const [v, t] = vars[k]; const ch = prevVars && (!prevVars[k] || prevVars[k][0] !== v); return `<tr class="${ch ? 'changed' : ''}"><td>${esc(k)}</td><td>${esc(v)}</td><td>${esc(t)}</td></tr>`; }).join('')}</table>`;
}
function trGo(i) {
  if (!TR.steps.length) return;
  i = Math.max(0, Math.min(TR.steps.length - 1, i)); TR.i = i;
  const st = TR.steps[i], prev = TR.steps[i - 1];
  $$('#trCode .tr-line').forEach(el => el.classList.remove('cur', 'prev'));
  if (prev && prev.line) { const p = $(`#trCode .tr-line[data-l="${prev.line}"]`); if (p) p.classList.add('prev'); }
  const cur = st.line ? $(`#trCode .tr-line[data-l="${st.line}"]`) : null;
  if (cur) { cur.classList.add('cur'); cur.classList.remove('prev'); const box = $('#trCode'); const top = cur.offsetTop - box.clientHeight / 2; box.scrollTo({ top, behavior: 'smooth' }); }
  const samePrev = prev && prev.fn === st.fn ? prev.vars : null;
  $('#trVars').innerHTML = varTable(st.vars, i > 0 ? (samePrev || {}) : null);
  const gb = $('#trGlobalsBox');
  if (st.g && Object.keys(st.g).length) { gb.hidden = false; $('#trGlobals').innerHTML = varTable(st.g, null); } else gb.hidden = true;
  $('#trOut').textContent = st.out || '';
  $('#trFn').textContent = st.fn === '<module>' ? 'main program' : 'inside ' + st.fn + '()';
  const msg = $('#trMsg'); msg.className = 'tr-msg';
  if (st.ev === 'line') msg.innerHTML = `<b>➜ Line ${st.line}</b> is about to run${st.fn !== '<module>' ? ` inside <code>${esc(st.fn)}()</code>` : ''}. The previously run line is shaded blue.`;
  else if (st.ev === 'return') msg.innerHTML = `<code>${esc(st.fn)}()</code> finishes and returns <code>${esc(st.ret)}</code>.`;
  else {
    if (TR.err) { msg.className = 'tr-msg err'; msg.textContent = 'The program stopped with an error:\n\n' + TR.err.trim().split('\n').slice(-2).join('\n'); }
    else msg.innerHTML = '<b>✓ Program finished.</b> These are the final values of all variables.' + (TR.truncated ? ' (Recording stopped after 800 steps.)' : '');
  }
  $('#trRange').value = i;
  $('#trStep').textContent = `Step ${i + 1} / ${TR.steps.length}`;
}
function stopPlay() { clearInterval(TR.timer); TR.timer = null; const b = $('#trPlay'); if (b) b.textContent = '▶ Auto-play'; }
function closeTrace() { stopPlay(); $('#traceModal').classList.remove('open'); document.body.style.overflow = ''; }
function initTrace() {
  $('#trClose').onclick = closeTrace;
  $('#traceModal').addEventListener('click', e => { if (e.target.id === 'traceModal') closeTrace(); });
  $('#trNext').onclick = () => trGo(TR.i + 1); $('#trPrev').onclick = () => trGo(TR.i - 1);
  $('#trFirst').onclick = () => trGo(0); $('#trLast').onclick = () => trGo(TR.steps.length - 1);
  $('#trRange').oninput = e => trGo(+e.target.value);
  $('#trPlay').onclick = () => {
    if (TR.timer) return stopPlay();
    if (TR.i >= TR.steps.length - 1) trGo(0);
    $('#trPlay').textContent = '⏸ Pause';
    TR.timer = setInterval(() => { if (TR.i >= TR.steps.length - 1) return stopPlay(); trGo(TR.i + 1); }, 700);
  };
  document.addEventListener('keydown', e => {
    if (!$('#traceModal').classList.contains('open')) return;
    if (e.key === 'Escape') closeTrace();
    else if (e.key === 'ArrowRight') { e.preventDefault(); trGo(TR.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); trGo(TR.i - 1); }
  });
}

/* ---------- exercises ---------- */
const DIFF = ['', 'Warm-up', 'Practice', 'Challenge'];
function renderExercise(host, ex, id, num, onPass) {
  const hasIn = ex.in !== undefined || /\binput\s*\(/.test(ex.s);
  host.className = 'ex' + (S.ex[id] ? ' passed' : '');
  host.id = 'ex-' + id;
  host.innerHTML = `<div class="ex-head"><div class="ex-num">${S.ex[id] ? '✓' : num}</div><div class="ex-title">${esc(ex.t)}<small>${DIFF[ex.d]}</small></div><span class="diff d${ex.d}" title="Difficulty: ${DIFF[ex.d]}"><i></i><i></i><i></i></span><span class="badge-ok">✓ Passed</span></div>
  <div class="ex-prompt"><p>${ex.p}</p></div>
  <div class="ex-body"><div class="ed-host"></div>${hasIn ? `<div class="stdin"><label>INPUT for ▶ Run: one value per line (Check also tests other inputs)</label><textarea rows="2" spellcheck="false">${esc(ex.in || '')}</textarea></div>` : ''}<div class="out" hidden><div class="out-label"><span>Output</span></div><pre></pre></div></div>
  <div class="ex-tools"><button class="btn" data-a="run">${ICON.play} Run</button><button class="btn primary" data-a="check">✓ Check answer</button><button class="btn ghost" data-a="trace">${ICON.step} Step through</button><span class="spacer"></span><button class="btn ghost" data-a="hint">💡 Hint <span class="hc"></span></button><button class="btn ghost" data-a="reset" title="Restore the starter code">↺ Reset</button><button class="btn ghost" data-a="sol"></button></div>
  <div class="hints"></div><div class="results"></div><div class="sol-wrap"></div>`;
  const ed = makeEditor($('.ed-host', host), S.code[id] != null ? S.code[id] : ex.s + (ex.s.endsWith('\n') ? '' : '\n'), { onChange: v => { S.code[id] = v; save(); }, onRun: () => run(), minLines: 6 });
  const stdin = () => { const t = $('.stdin textarea', host); return t ? t.value : ''; };
  const out = $('.out', host), res = $('.results', host), hintsBox = $('.hints', host), solBtn = $('[data-a=sol]', host), hintBtn = $('[data-a=hint]', host);
  const unlocked = () => S.ex[id] || (S.fails[id] || 0) >= 2;
  function paintHints() {
    const n = S.hints[id] || 0;
    hintsBox.innerHTML = ex.h.slice(0, n).map((h, i) => `<div class="hint"><b>Hint ${i + 1}:</b> ${h}</div>`).join('');
    $('.hc', hintBtn).textContent = `${n}/${ex.h.length}`;
    hintBtn.disabled = n >= ex.h.length;
  }
  function paintSol() { solBtn.innerHTML = unlocked() ? '👁 Solution' : '🔒 Solution'; solBtn.title = unlocked() ? 'Show a model solution' : 'Unlocks after 2 checks: try the hints first!'; }
  paintHints(); paintSol();
  async function run() {
    const b = $('[data-a=run]', host); b.classList.add('busy');
    const r = await PY.call('run', { code: ed.get(), stdin: stdin() });
    b.classList.remove('busy'); showOutput(out, r);
  }
  async function check(btn) {
    btn.classList.add('busy'); const o = btn.innerHTML; btn.innerHTML = PY.ready ? 'Checking…' : 'Loading Python…';
    const r = await PY.call('check', { code: ed.get(), stdin: stdin(), tests: ex.tests }, 12000);
    btn.classList.remove('busy'); btn.innerHTML = o;
    showOutput(out, r);
    if (r.offline) { res.innerHTML = `<div class="res-box bad"><div class="res-title">Python isn't available</div><div>Connect to the internet to run and check code.</div></div>`; return; }
    if (r.err) {
      S.fails[id] = (S.fails[id] || 0) + 1; save(); paintSol();
      res.innerHTML = `<div class="res-box bad"><div class="res-title">✗ Your code raised an error</div><div style="font-size:14px;color:var(--text-2)">Read the error in the output above (bottom line first), fix it, and check again.</div></div>`;
      return;
    }
    const tests = r.tests || [], passed = tests.filter(t => t.ok).length, allOk = tests.length && passed === tests.length;
    res.innerHTML = `<div class="res-box ${allOk ? 'ok' : 'bad'}"><div class="res-title">${allOk ? '🎉 All tests passed!' : `✗ ${passed} of ${tests.length} tests passed`}</div><ul class="res-list">${tests.map(t => `<li class="${t.ok ? 'p' : 'f'}"><span class="m">${t.ok ? '✓' : '✗'}</span><span>${esc(t.msg)}</span></li>`).join('')}</ul>${allOk ? '' : '<div style="margin-top:8px;font-size:13.5px;color:var(--muted)">Tip: use <b>Step through</b> to watch your code run, or reveal a hint.</div>'}</div>`;

    } else { S.fails[id] = (S.fails[id] || 0) + 1; save(); paintSol(); }

    else if (a === 'hint') { S.hints[id] = Math.min(ex.h.length, (S.hints[id] || 0) + 1); save(); paintHints(); }

      const w = $('.sol-wrap', host);

function confirmReset(b) {

}

/* ---------- quiz ---------- */
function renderQuiz(host, qs, key, onDone) {
  const answers = S.quiz[key] || (S.quiz[key] = {});
  host.innerHTML = `<div class="quiz">${qs.map((q, i) => `<div class="q" data-i="${i}"><div class="q-top"><span class="q-n">Q${i + 1}</span><div class="q-text">${q.q}</div></div>${q.c ? staticCode(q.c) : ''}<div class="opts">${q.o.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="q-exp-wrap"></div></div>`).join('')}<div class="quiz-foot"><span class="score-pill"></span><button class="btn ghost" data-a="retry">↺ Retake quiz</button></div></div>`;
  $$('.cb', host).forEach(renderCB);
  function paint() {
    let ok = 0, ans = 0;
    qs.forEach((q, i) => {
      const box = $(`.q[data-i="${i}"]`, host), a = answers[i];
      $$('.opt', box).forEach((b, j) => {
        b.className = 'opt'; b.disabled = a !== undefined;
        if (a !== undefined) { if (j === q.a) b.classList.add('correct'); else if (j === a) b.classList.add('wrong'); else b.classList.add('dim'); }
      });
      const w = $('.q-exp-wrap', box);
      if (a !== undefined) { ans++; if (a === q.a) ok++; w.innerHTML = `<div class="q-exp">${a === q.a ? '<b class="v-ok">Correct!</b> ' : '<b class="v-bad">Not quite.</b> '}${q.e}</div>`; } else w.innerHTML = '';
    });
    $('.score-pill', host).textContent = ans ? `Score: ${ok} / ${qs.length}${ans < qs.length ? ` · ${qs.length - ans} left` : ''}` : `${qs.length} questions`;
    return ans === qs.length;
  }
  host.addEventListener('click', e => {
    const o = e.target.closest('.opt');
    if (o && !o.disabled) { const i = +o.closest('.q').dataset.i; answers[i] = +o.dataset.j; save(); if (paint()) onDone && onDone(); return; }
    if (e.target.closest('[data-a=retry]')) { for (const k in answers) delete answers[k]; save(); paint(); }
  });

}

function pageAssess(m) {
  const st = S.assess[m.id] || {}, qs = m.assess.q;

  const box = $('#aq');

  function draw() {
    box.innerHTML = `<div class="quiz">${qs.map((q, i) => `<div class="q" data-i="${i}"><div class="q-top"><span class="q-n">Q${i + 1}</span><div class="q-text">${q.q}</div></div>${q.c ? staticCode(q.c) : ''}<div class="opts">${q.o.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="q-exp-wrap"></div></div>`).join('')}</div><div id="aRes"></div><div class="quiz-foot" style="margin-top:14px"><button class="btn primary lg" id="aSubmit">Submit answers</button><button class="btn lg" id="aRetry" hidden>↺ Retake</button><span class="score-pill" id="aCount"></span></div>`;
    $$('.cb', box).forEach(renderCB); paint();
  }
  function paint() {
    let ok = 0;
    qs.forEach((q, i) => {
      const qb = $(`.q[data-i="${i}"]`, box);
      $$('.opt', qb).forEach((b, j) => {
        b.className = 'opt'; b.disabled = submitted;
        if (!submitted) { if (picks[i] === j) { b.style.borderColor = 'var(--accent)'; b.style.background = 'var(--accent-soft)'; } else { b.style.borderColor = ''; b.style.background = ''; } }
        else { b.style.borderColor = ''; b.style.background = ''; if (j === q.a) b.classList.add('correct'); else if (j === picks[i]) b.classList.add('wrong'); else b.classList.add('dim'); }
      });
      if (submitted) { if (picks[i] === q.a) ok++; $('.q-exp-wrap', qb).innerHTML = `<div class="q-exp">${picks[i] === q.a ? '<b class="v-ok">Correct!</b> ' : '<b class="v-bad">Incorrect.</b> '}${q.e}</div>`; }
    });
    $('#aCount').textContent = submitted ? '' : `${Object.keys(picks).length} / ${qs.length} answered`;
    return ok;
  }
  box.addEventListener('click', e => {
    const o = e.target.closest('.opt');
    if (o && !submitted) { picks[+o.closest('.q').dataset.i] = +o.dataset.j; paint(); return; }
    if (e.target.id === 'aSubmit') {
      if (Object.keys(picks).length < qs.length && !confirm('Some questions are unanswered. Submit anyway?')) return;
      submitted = true; const ok = paint(); const pct = Math.round(ok / qs.length * 100);
      const rec = S.assess[m.id] || {}; const firstPass = !(rec.best >= 70) && pct >= 70;
      rec.best = Math.max(rec.best || 0, pct); rec.last = pct; S.assess[m.id] = rec; save();
      $('#aRes').innerHTML = `<div class="result-card ${pct >= 70 ? 'pass' : 'fail'}"><div class="rs">${pct}%</div><div><b>${pct >= 70 ? 'Passed! 🎉' : 'Not passed yet'}</b><div style="color:var(--muted);font-size:14px">${ok} of ${qs.length} correct · best ${rec.best}%. ${pct >= 70 ? 'You\'re ready for the next module.' : 'Review the explanations below and the lessons, then retake.'}</div></div></div>`;
      $('#aSubmit').hidden = true; $('#aRetry').hidden = false;
      if (firstPass) { const r = $('#aRes').getBoundingClientRect(); confetti(r.left + 80, r.top); toast('Module assessment passed!', '🏆'); }

    }
    if (e.target.id === 'aRetry') { picks = {}; submitted = false; draw(); }
  });
  draw();
  const ch = document.createElement('div'); $('#ach').appendChild(ch);
  renderExercise(ch, m.assess.ch, m.id + '-ch', '★', () => renderSidebar(m));
  warmPython();
}

/* ---------- scrollspy ---------- */
let spy = null;
function scrollSpy() {
  if (spy) spy.disconnect();
  const links = $$('.toc a[data-sec]'); if (!links.length) return;
  spy = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { links.forEach(a => a.classList.toggle('active', a.dataset.sec === en.target.id)); } });
  }, { rootMargin: '-30% 0px -60% 0px' });
  $$('.section').forEach(s => spy.observe(s));
  links.forEach(a => a.addEventListener('click', e => { e.preventDefault(); document.getElementById(a.dataset.sec).scrollIntoView({ behavior: 'smooth' }); }));
}
let warmT = null;
function warmPython() { clearTimeout(warmT); warmT = setTimeout(() => PY.start(), 1200); }

/* ---------- router ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  if (/^(learn|real|mistakes|practice|quiz)$/.test(h)) return;
  const [page, arg] = h.split('/');
  let active = page || 'home';
  if (page === 'lesson' && lessonById(arg)) { const l = lessonById(arg); active = l; pageLesson(l); document.title = l.t + ' · PyPath'; }
  else if (page === 'assess' && modById(arg)) { const m = modById(arg); active = m; pageAssess(m); document.title = m.t + ' assessment · PyPath'; }
  else if (page === 'playground') { pagePlayground(); document.title = 'Playground · PyPath'; }
  else if (page === 'cheatsheet') { pageCheat(); document.title = 'Cheat sheet · PyPath'; }
  else { active = 'home'; pageHome(); document.title = 'PyPath: Learn Python Fundamentals & Problem Solving'; }
  renderSidebar(active);
  window.scrollTo(0, 0);
  document.body.classList.remove('nav-open');
  const a = $('#sidebar .les.active'); if (a) a.scrollIntoView({ block: 'nearest' });
}

/* ---------- search ---------- */
function initSearch() {
  const strip = s => s.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
  const index = LESSONS.map(l => ({ l, title: l.t.toLowerCase(), mod: l.mod.t.toLowerCase(), text: (strip(l.lead) + ' ' + strip(l.body) + ' ' + l.ex.map(e => e.t).join(' ')).toLowerCase() }));
  const inp = $('#search'), box = $('#searchResults');
  let sel = 0, items = [];
  function search() {
    const q = inp.value.trim().toLowerCase();
    if (!q) { box.classList.remove('open'); return; }
    const words = q.split(/\s+/);
    items = index.map(x => { let s = 0; for (const w of words) { if (x.title.includes(w)) s += 10; if (x.mod.includes(w)) s += 5; if (x.text.includes(w)) s += 1; else if (!x.title.includes(w) && !x.mod.includes(w)) return null; } return { x, s }; }).filter(Boolean).sort((a, b) => b.s - a.s).slice(0, 8);
    MODULES.forEach(m => { if (m.t.toLowerCase().includes(q) && items.length < 9) items.unshift({ assess: m }); });
    sel = 0;
    box.innerHTML = items.length ? items.map((it, i) => it.assess ? `<a class="sr-item ${i === sel ? 'active' : ''}" href="#/assess/${it.assess.id}"><span>📝</span><span>${esc(it.assess.t)} assessment<small>Module assessment</small></span></a>` : `<a class="sr-item ${i === sel ? 'active' : ''}" href="#/lesson/${it.x.l.id}"><span>${it.x.l.mod.icon}</span><span>${esc(it.x.l.t)}<small>${esc(it.x.l.mod.t)} · ${it.x.l.min} min</small></span></a>`).join('') : '<div class="sr-empty">No lessons match. Try "loop", "dict", "file" or "error".</div>';
    box.classList.add('open');
  }
  inp.addEventListener('input', search);
  inp.addEventListener('focus', () => inp.value && search());
  inp.addEventListener('keydown', e => {
    const links = $$('.sr-item', box);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!links.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length; links.forEach((a, i) => a.classList.toggle('active', i === sel)); }
    else if (e.key === 'Enter' && links[sel]) { location.hash = links[sel].getAttribute('href'); close(); }
    else if (e.key === 'Escape') close();
  });
  function close() { box.classList.remove('open'); inp.value = ''; inp.blur(); }
  box.addEventListener('click', e => { if (e.target.closest('a')) setTimeout(close, 0); });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) box.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); inp.focus(); } });
}

/* ---------- theme ---------- */
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); $('#themeBtn').innerHTML = t === 'dark' ? ICON.sun : ICON.moon; $('#themeBtn').title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'; }
function initTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  $('#themeBtn').onclick = () => { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; S.theme = t; save(); applyTheme(t); };
}

/* ---------- boot ---------- */
initTheme(); initSidebar(); initSearch(); initTrace(); setPyStatus('idle');
window.addEventListener('hashchange', route);
route();
})();

</script>
</body>
