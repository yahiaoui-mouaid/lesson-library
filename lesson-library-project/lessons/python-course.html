<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyPath: Learn Python Fundamentals & Problem Solving</title>
<meta name="description" content="An interactive Python course from absolute beginner to solid beginner, with a live Python editor, step-through visualizer, exercises and quizzes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%234f46e5%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27monospace%27 font-size=%2728%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3Epy%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('pypath.v1')||'{}');var t=s.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --radius:14px;--radius-sm:9px;
  --sidebar:300px;--top:62px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme=light]{
  --bg:#f5f6fa;--bg-2:#eef0f6;--surface:#ffffff;--surface-2:#f7f8fc;--surface-3:#eef1f8;
  --border:#e2e6ef;--border-2:#d3d9e6;
  --text:#141a2e;--text-2:#3b4459;--muted:#69728a;
  --accent:#4f46e5;--accent-2:#6366f1;--accent-soft:#eef0ff;--accent-ink:#3730a3;
  --py:#e6a800;--py-soft:#fff7db;
  --ok:#15803d;--ok-soft:#e8f7ee;--bad:#c2410c;--bad-soft:#fdeee6;--warn:#b45309;--warn-soft:#fff5e0;--info:#0369a1;--info-soft:#e6f3fb;
  --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 24px -8px rgba(20,26,46,.10);
  --shadow-lg:0 20px 60px -20px rgba(20,26,46,.35);
}
[data-theme=dark]{
  --bg:#0b0e17;--bg-2:#0f1320;--surface:#131826;--surface-2:#171d2d;--surface-3:#1d2436;
  --border:#232b3f;--border-2:#2e3850;
  --text:#e7eaf3;--text-2:#c3c9d8;--muted:#8d97ad;
  --accent:#8b8cf8;--accent-2:#a5a6ff;--accent-soft:#1d1f3d;--accent-ink:#c7c8ff;
  --py:#f5c542;--py-soft:#2a2410;
  --ok:#4ade80;--ok-soft:#10261a;--bad:#fb8a5b;--bad-soft:#2c1710;--warn:#fbbf24;--warn-soft:#2a210c;--info:#5ec2f2;--info-soft:#0e2230;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -10px rgba(0,0,0,.6);
  --shadow-lg:0 24px 70px -20px rgba(0,0,0,.8);
}
/* code palette (shared) */
:root{--code-bg:#0f1424;--code-bg-2:#141a2e;--code-border:#222a40;--code-text:#e3e8f4;--code-muted:#7d88a6;
  --t-k:#c792ea;--t-s:#b5e48c;--t-n:#f9a26c;--t-c:#6b7899;--t-b:#82aaff;--t-f:#ffcb6b;--t-fc:#89ddff;--t-o:#89ddff;}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
a{color:var(--accent)}
button{font-family:inherit;cursor:pointer}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;letter-spacing:-.02em;font-size:18px;white-space:nowrap}
.brand-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#f5c542 140%);color:#fff;font-family:var(--mono);font-size:15px;font-weight:700;box-shadow:0 6px 16px -6px rgba(79,70,229,.7)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:-4px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:grid;place-items:center;transition:.15s var(--ease)}
.icon-btn:hover{border-color:var(--border-2);color:var(--text);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
#menuBtn{display:none}
.search{position:relative;flex:1;max-width:440px;margin-left:auto}
.search input{width:100%;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:0 40px 0 38px;font:inherit;font-size:14px;transition:.15s}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.search>svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:9px;font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--surface)}
.search-results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;max-height:60vh;overflow:auto;display:none}
.search-results.open{display:block}
.sr-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-size:14px}
.sr-item:hover,.sr-item.active{background:var(--accent-soft)}
.sr-item small{color:var(--muted);display:block;font-size:12px}
.sr-empty{padding:14px;color:var(--muted);font-size:14px}
.py-status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--surface);white-space:nowrap}
.py-status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.py-status[data-s=loading] i{background:var(--py);animation:pulse 1s infinite}
.py-status[data-s=ready] i{background:var(--ok)}
.py-status[data-s=error] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.top-actions{display:flex;gap:8px;align-items:center}

/* ---------- layout ---------- */
.sidebar{position:fixed;top:var(--top);bottom:0;left:0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;z-index:40;padding:16px 12px 40px;transition:transform .25s var(--ease);scrollbar-width:thin}
.main{margin-left:var(--sidebar);padding-top:var(--top);min-height:100vh}
.scrim{display:none}
.side-progress{padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));border:1px solid var(--border);margin-bottom:14px}
.side-progress .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text-2);font-weight:600}
.side-progress .big{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.02em}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#a855f7);border-radius:99px;transition:width .6s var(--ease)}
.side-meta{display:flex;gap:12px;margin-top:9px;font-size:12px;color:var(--muted)}
.nav-top a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--text-2);font-size:14.5px;font-weight:500}
.nav-top a:hover{background:var(--surface-2);color:var(--text)}
.nav-top a.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-top svg{width:18px;height:18px;opacity:.8}
.stage-label{margin:18px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.stage-label::after{content:"";flex:1;height:1px;background:var(--border)}
.mod{border-radius:10px;margin-bottom:2px}
.mod-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;color:var(--text);text-align:left;border-radius:10px;font-size:14.5px;font-weight:600}
.mod-btn:hover{background:var(--surface-2)}
.mod-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);font-size:15px;flex:none}
.mod.complete .mod-ic{background:var(--ok-soft)}
.mod-btn .t{flex:1;line-height:1.25}
.mod-btn .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.mod.open .chev{transform:rotate(90deg)}
.mod-lessons{display:none;padding:2px 0 6px 22px;position:relative}
.mod.open .mod-lessons{display:block}
.mod-lessons::before{content:"";position:absolute;left:24px;top:4px;bottom:10px;width:2px;background:var(--border);border-radius:2px}
.les{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 0;text-decoration:none;color:var(--text-2);font-size:13.5px;border-radius:8px;position:relative}
.les:hover{color:var(--text);background:var(--surface-2)}
.les .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);flex:none;margin-left:-4px;position:relative;z-index:1;display:grid;place-items:center}
.les.done .dot{background:var(--ok);border-color:var(--ok)}
.les.done .dot::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(0,-1px)}
.les.active{color:var(--accent-ink);font-weight:600;background:var(--accent-soft)}
.les.active .dot{border-color:var(--accent)}
.les.assess .dot{border-radius:4px}
.les.assess{font-weight:600}

/* ---------- content ---------- */
.page{max-width:1240px;margin:0 auto;padding:34px 36px 80px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px}
.page.wide{grid-template-columns:minmax(0,1fr)}
.content{min-width:0;max-width:820px}
.toc{position:sticky;top:calc(var(--top) + 30px);align-self:start;font-size:13.5px}
.toc-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.toc a{display:block;padding:6px 0 6px 14px;color:var(--muted);text-decoration:none;border-left:2px solid var(--border);transition:.15s}
.toc a:hover{color:var(--text)}
.toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.toc-card{margin-top:22px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:13px;color:var(--text-2)}
.toc-card b{display:block;color:var(--text);margin-bottom:4px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.lesson-head h1{font-size:clamp(28px,3.4vw,40px);line-height:1.15;letter-spacing:-.03em;margin:0 0 12px;font-weight:800}
.lead{font-size:18.5px;color:var(--text-2);margin:0 0 18px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.section{margin-top:44px;scroll-margin-top:calc(var(--top) + 20px)}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.sec-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--accent-soft);flex:none}
.sec-head h2{margin:0;font-size:22px;letter-spacing:-.02em}
.sec-head p{margin:0;font-size:13.5px;color:var(--muted)}
.prose h3{font-size:20px;letter-spacing:-.015em;margin:34px 0 10px}
.prose h4{font-size:16px;margin:24px 0 8px;color:var(--text-2)}
.prose p,.prose li{color:var(--text-2)}
.prose b,.prose strong{color:var(--text)}
.prose ul{padding-left:22px}.prose li{margin:4px 0}
.prose :not(pre)>code,.mis-why code,.ex-prompt code,.q-text code,.q-exp code,.callout code,.tbl code,.cmp code,.pillar code,.steps code,.real-card code,.st code{font-size:.86em;padding:.12em .42em;border-radius:6px;background:var(--surface-3);color:var(--accent-ink);border:1px solid var(--border);white-space:nowrap}
.small{font-size:13.5px;color:var(--muted)!important}
pre.plain{background:var(--surface-3);padding:10px 14px;border-radius:8px;font-size:14px;margin:8px 0}

/* callouts */
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:12px;margin:18px 0;border:1px solid;font-size:15px}
.callout p{margin:4px 0;color:inherit!important}.callout ul{margin:6px 0;padding-left:20px}.callout li{color:inherit!important}
.callout-ic{font-size:18px;line-height:1.4}
.callout-t{font-weight:700;margin-bottom:2px}
.callout.tip{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 25%,transparent);color:var(--text-2)}.callout.tip .callout-t{color:var(--info)}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--text-2)}.callout.warn .callout-t{color:var(--warn)}
.callout.note{background:var(--surface-2);border-color:var(--border);color:var(--text-2)}.callout.note .callout-t{color:var(--text)}
.callout.think{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--text-2)}.callout.think .callout-t{color:var(--accent-ink)}
details.more{border:1px solid var(--border);border-radius:12px;margin:16px 0;background:var(--surface);overflow:hidden}
details.more summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;transition:transform .2s}
details.more[open] summary::before{content:"−"}
details.more summary:hover{background:var(--surface-2)}
.more-body{padding:4px 16px 14px}
.more-body .cb{margin:8px 0}

/* tables */
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:700;color:var(--text);background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--border);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}

/* diagrams */
.diagram{margin:22px 0;padding:22px 18px;border:1px dashed var(--border-2);border-radius:var(--radius);background:var(--surface);text-align:center}
.diagram figcaption{font-size:13.5px;color:var(--muted);margin-top:12px}
.diagram.idx figcaption{margin:0 0 12px;font-family:var(--mono);color:var(--text-2)}
.idx-row{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center}
.idx-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.idx-val{min-width:46px;height:46px;padding:0 8px;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--accent) 40%,transparent);font-family:var(--mono);font-weight:600;color:var(--accent-ink);font-size:15px}
.idx-pos{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.idx-neg{font-family:var(--mono);font-size:12px;color:var(--py);font-weight:600}
.idx-legend{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.idx-legend b.lp{color:var(--accent)!important}.idx-legend b.ln{color:var(--py)!important}
.vars-row{display:flex;flex-direction:column;gap:10px;align-items:center}
.vb{display:flex;align-items:center;gap:10px}
.vb-name{font-family:var(--mono);font-weight:600;padding:6px 12px;border-radius:8px;background:var(--surface-3);border:1px solid var(--border);min-width:84px;color:var(--text)}
.vb-arrow{width:40px;height:12px;fill:none;stroke:var(--muted);stroke-width:1.6}
.vb-val{display:flex;align-items:center;gap:10px;font-family:var(--mono);padding:6px 12px;border-radius:8px;border:1.5px solid;min-width:130px;justify-content:space-between}
.vb-val em{font-style:normal;font-size:11px;font-family:var(--font);font-weight:700;opacity:.8}
.ty-str{background:color-mix(in srgb,#22c55e 12%,var(--surface));border-color:color-mix(in srgb,#22c55e 45%,transparent);color:var(--text)}
.ty-int{background:color-mix(in srgb,#f97316 12%,var(--surface));border-color:color-mix(in srgb,#f97316 45%,transparent);color:var(--text)}
.ty-float{background:color-mix(in srgb,#3b82f6 12%,var(--surface));border-color:color-mix(in srgb,#3b82f6 45%,transparent);color:var(--text)}
.ty-bool{background:color-mix(in srgb,#a855f7 12%,var(--surface));border-color:color-mix(in srgb,#a855f7 45%,transparent);color:var(--text)}
.steps{display:flex;flex-direction:column;gap:10px;text-align:left}
.st{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--text-2);font-size:15px}
.st-n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
[data-theme=dark] .st-n{color:#0b0e17}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.pillar{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--border);transition:.2s var(--ease)}
.pillar:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-2)}
.pillar-i{font-size:24px}.pillar b{display:block;margin:6px 0 4px;color:var(--text)}.pillar p{margin:0;font-size:13.5px;color:var(--muted)!important;line-height:1.5}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.cmp{padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);min-width:0}
.cmp-t{font-weight:700;margin-bottom:4px;color:var(--text)}
.cmp p{margin:4px 0;font-size:14.5px}
.cmp .cb{margin:10px 0 0}
.flow svg{width:100%;max-width:520px;height:auto}
.flow text{font-family:var(--font);font-size:13px;fill:var(--text);text-anchor:middle;font-weight:600}
.fl-term{fill:var(--surface-3);stroke:var(--border-2);stroke-width:1.5}
.fl-box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.fl-dec{fill:var(--py-soft);stroke:var(--py);stroke-width:1.5}
.fl-line{fill:none;stroke:var(--muted);stroke-width:1.8}
.fl-head{fill:var(--muted)}
.flow text.fl-yes{fill:var(--ok);font-size:12px}.flow text.fl-no{fill:var(--bad);font-size:12px}.flow text.fl-mut{fill:var(--muted);font-size:12px;font-weight:500}
.venn svg{width:100%;max-width:340px}
.v-a{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:1.5}
.v-b{fill:color-mix(in srgb,var(--py) 22%,transparent);stroke:var(--py);stroke-width:1.5}
.venn text{font-size:12px;fill:var(--text);text-anchor:middle;font-weight:600}.venn .v-l{font-size:15px;font-weight:800}
.scope-g{border:2px solid var(--border-2);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.scope-f{border:2px dashed var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);margin-top:4px}
.scope-l{font-size:13px;font-weight:700;color:var(--text)}
.scope-g code{align-self:flex-start}
.scope-note{font-size:12.5px;color:var(--muted)}
.alias{display:grid;grid-template-columns:auto 60px auto;justify-content:center;align-items:center;gap:6px}
.alias figcaption{grid-column:1/-1}
.alias-names{display:flex;flex-direction:column;gap:18px}
.alias-names code{font-size:15px!important;padding:6px 14px!important}
.alias-arrows{width:60px;height:60px;fill:none;stroke:var(--muted);stroke-width:2}
.alias-obj{font-family:var(--mono);padding:12px 16px;border-radius:10px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.bsearch{display:flex;flex-direction:column;gap:6px;align-items:center}
.bs-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.bs-row span{width:40px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--surface-3);font-family:var(--mono);font-size:13.5px;border:1.5px solid var(--border);color:var(--text)}
.bs-row .mid{background:var(--py-soft);border-color:var(--py);font-weight:700}
.bs-row .off{opacity:.3}
.bs-row .hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.bs-cap{font-size:13px;color:var(--muted);margin-bottom:8px}
.sortvis{display:flex;flex-direction:column;gap:10px;align-items:center}
.sv-pass{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}
.sv-pass b{font-size:12.5px;width:56px;color:var(--muted)}
.sv-pass span{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--surface-3);border:1.5px solid var(--border);font-family:var(--mono);font-size:14px}
.sv-pass span.fix{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.sv-pass i{color:var(--muted);font-style:normal;margin:0 6px}
.pseudo{font-family:var(--mono);white-space:pre;font-size:14px;line-height:1.7;padding:16px 18px;border-radius:12px;background:var(--py-soft);border:1px solid color-mix(in srgb,var(--py) 35%,transparent);color:var(--text);overflow-x:auto;margin:14px 0}

/* ---------- code block ---------- */
.cb{margin:18px 0;border-radius:var(--radius);overflow:hidden;background:var(--code-bg);border:1px solid var(--code-border);box-shadow:var(--shadow)}
.cb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px 7px 14px;background:var(--code-bg-2);border-bottom:1px solid var(--code-border)}
.cb-lang{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--code-muted);font-weight:600;font-family:var(--mono)}
.cb-lang .dots{display:flex;gap:5px}.cb-lang .dots i{width:9px;height:9px;border-radius:50%;background:#323b55}
.cb-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:#aab4cf;font-size:12.5px;font-weight:600;transition:.15s}
.cbtn:hover{background:#1e2640;color:#fff}
.cbtn svg{width:14px;height:14px}
.cbtn.run{background:#4f46e5;color:#fff}
.cbtn.run:hover{background:#6056ff}
.cbtn.run.busy{opacity:.7;pointer-events:none}
.cb-code{margin:0;padding:14px 16px;overflow-x:auto;font-size:14px;line-height:1.65;color:var(--code-text);tab-size:4}
.cb-code code{font-family:var(--mono)}
.t-k{color:var(--t-k)}.t-s{color:var(--t-s)}.t-n{color:var(--t-n)}.t-c{color:var(--t-c);font-style:italic}.t-b{color:var(--t-b)}.t-f{color:var(--t-f)}.t-fc{color:var(--t-fc)}.t-o{color:var(--t-o)}
.stdin{padding:8px 14px 12px;border-top:1px solid var(--code-border);background:var(--code-bg-2)}
.stdin label{display:block;font-size:11.5px;color:var(--code-muted);font-weight:600;margin-bottom:5px;letter-spacing:.02em}
.stdin textarea{width:100%;min-height:44px;resize:vertical;background:#0a0e1a;border:1px solid var(--code-border);border-radius:8px;color:var(--code-text);font-family:var(--mono);font-size:13px;padding:7px 10px;line-height:1.5}
.stdin textarea:focus{outline:none;border-color:#6366f1}
.out{border-top:1px solid var(--code-border);background:#0a0d18}
.out-label{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--code-muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px 0}
.out-label span.live{color:#4ade80}
.out pre{margin:0;padding:6px 14px 12px;font-size:13.5px;color:#d7dcea;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;line-height:1.55}
.out pre .err{color:#ff9b7a}
.out pre .muted{color:var(--code-muted);font-style:italic}
.explain{margin:0 14px 12px;padding:10px 12px;border-radius:9px;background:#1b1f33;border:1px solid #2e3555;color:#cdd3e6;font-size:13.5px;font-family:var(--font);line-height:1.55}
.explain b{color:#ffcb6b}
.explain code{background:#262d48!important;color:#e3e8f4!important;border-color:#343c5e!important}

/* ---------- editor ---------- */
.editor{position:relative;display:flex;background:var(--code-bg);font-family:var(--mono);font-size:14px;line-height:22px}
.ed-gutter{flex:none;width:42px;padding:10px 0;text-align:right;color:#4a5474;user-select:none;overflow:hidden;background:#0c1120;border-right:1px solid var(--code-border)}
.ed-gutter div{padding-right:10px;height:22px}
.ed-main{position:relative;flex:1;min-width:0}
.ed-hl,.ed-ta{position:absolute;inset:0;margin:0;padding:10px 14px;font:inherit;line-height:inherit;white-space:pre;tab-size:4;letter-spacing:0;border:0;overflow:hidden}
.ed-hl{color:var(--code-text);pointer-events:none}
.ed-hl code{font:inherit}
.ed-ta{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;overflow:auto;-webkit-text-fill-color:transparent}
.ed-ta::selection{background:rgba(129,140,248,.35);-webkit-text-fill-color:transparent}
.editor:focus-within{box-shadow:inset 0 0 0 1px #4f46e5}

/* ---------- sections: real world / mistakes ---------- */
.real-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.real-card{padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);transition:.2s var(--ease)}
.real-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.real-card .ri{font-size:24px}.real-card b{display:block;margin:6px 0 4px}.real-card p{margin:0;font-size:14px;color:var(--text-2);line-height:1.55}
.mis{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;overflow:hidden}
.mis summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:12px;font-weight:600}
.mis summary::-webkit-details-marker{display:none}
.mis summary .mi{width:28px;height:28px;border-radius:8px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:14px;flex:none}
.mis summary .chev{margin-left:auto}
.mis[open] summary .chev{transform:rotate(90deg)}
.mis summary:hover{background:var(--surface-2)}
.mis-body{padding:0 16px 16px}
.mis-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mis-col{border-radius:10px;overflow:hidden;border:1px solid var(--code-border);background:var(--code-bg);min-width:0}
.mis-col .lbl{font-size:11.5px;font-weight:700;padding:6px 12px;letter-spacing:.04em}
.mis-col.bad .lbl{background:#3a1a14;color:#ff9b7a}.mis-col.good .lbl{background:#12301f;color:#6ee7a0}
.mis-col pre{margin:0;padding:10px 12px;font-size:13px;color:var(--code-text);overflow-x:auto}
.mis-why{margin-top:10px;font-size:14.5px;color:var(--text-2)}

/* ---------- exercises ---------- */
.ex{border:1px solid var(--border);border-radius:16px;background:var(--surface);margin-bottom:22px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .3s}
.ex.passed{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.ex-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.ex-num{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
[data-theme=dark] .ex-num{color:#0b0e17}
.ex.passed .ex-num{background:var(--ok)}
.ex-title{flex:1;font-weight:700;font-size:16px;line-height:1.3}
.ex-title small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.diff{display:inline-flex;gap:3px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.diff i{width:7px;height:14px;border-radius:2px;background:var(--border-2)}
.diff.d1 i:nth-child(-n+1),.diff.d2 i:nth-child(-n+2),.diff.d3 i:nth-child(-n+3){background:var(--py)}
.badge-ok{display:none;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:4px 10px;border-radius:999px}
.ex.passed .badge-ok{display:inline-block}
.ex-prompt{padding:14px 18px 6px;color:var(--text-2);font-size:15.5px}
.ex-prompt p{margin:0 0 8px}
.ex-body{margin:8px 18px 0;border-radius:12px;overflow:hidden;border:1px solid var(--code-border)}
.ex-tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;transition:.15s var(--ease);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--border-2);background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme=dark] .btn.primary{color:#0b0e17}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
[data-theme=dark] .btn.ok{color:#0b0e17}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.busy{opacity:.7;pointer-events:none}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:12px}
.spacer{flex:1}
.hints{padding:0 18px}
.hint{margin:0 0 10px;padding:10px 14px;border-radius:10px;background:var(--py-soft);border:1px solid color-mix(in srgb,var(--py) 35%,transparent);font-size:14.5px;color:var(--text-2);animation:fadeIn .3s}
.hint b{color:var(--text)}
.results{padding:0 18px 16px}
.res-box{border-radius:12px;padding:12px 14px;border:1px solid;animation:fadeIn .3s}
.res-box.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.res-box.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.res-title{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.res-box.ok .res-title{color:var(--ok)}.res-box.bad .res-title{color:var(--bad)}
.res-list{list-style:none;margin:0;padding:0;font-size:14px}
.res-list li{display:flex;gap:8px;padding:3px 0;color:var(--text-2)}
.res-list li .m{flex:none;font-weight:800}
.res-list li.p .m{color:var(--ok)}.res-list li.f .m{color:var(--bad)}
.sol{margin:0 18px 16px;border-radius:12px;overflow:hidden;border:1px solid var(--code-border)}
.sol-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--code-bg-2);color:var(--code-muted);font-size:12.5px;font-weight:600}
.sol pre{margin:0;padding:12px 14px;background:var(--code-bg);color:var(--code-text);font-size:13.5px;overflow-x:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- quiz ---------- */
.quiz{display:flex;flex-direction:column;gap:14px}
.q{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:18px}
.q-top{display:flex;gap:12px;align-items:flex-start}
.q-n{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 9px;flex:none}
.q-text{font-weight:600;font-size:15.5px;line-height:1.5}
.q .cb{margin:12px 0 4px}
.q .cb-code{font-size:13.5px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14.5px;transition:.15s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.q-exp{margin-top:12px;padding:12px 14px;border-radius:11px;font-size:14.5px;color:var(--text-2);background:var(--surface-2);border-left:3px solid var(--accent);animation:fadeIn .3s}
.q-exp b.v-ok{color:var(--ok)}.q-exp b.v-bad{color:var(--bad)}
.quiz-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.score-pill{font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}

/* ---------- complete bar / pager ---------- */
.complete{margin-top:44px;padding:22px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--border);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.complete .ct{flex:1;min-width:220px}
.complete .ct b{font-size:17px;display:block}
.complete .ct span{font-size:14px;color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pg{display:block;padding:14px 18px;border-radius:14px;border:1px solid var(--border);background:var(--surface);text-decoration:none;color:var(--text);transition:.15s var(--ease)}
.pg:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.pg small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.pg b{font-size:15px}
.pg.next{text-align:right;grid-column:2}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:44px 44px 40px;background:radial-gradient(1200px 400px at 100% 0%,color-mix(in srgb,#a855f7 22%,transparent),transparent 60%),radial-gradient(800px 400px at 0% 100%,color-mix(in srgb,var(--py) 18%,transparent),transparent 60%),var(--surface);border:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:30px;align-items:center}
.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.08;letter-spacing:-.035em;margin:12px 0 14px;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),#a855f7 60%,var(--py));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17.5px;color:var(--text-2);margin:0 0 22px;max-width:560px}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow);text-align:center}
.ring{width:150px;height:150px;margin:4px auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--surface-3)}.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-size:32px;letter-spacing:-.03em}.ring .val span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{padding:10px 6px;border-radius:12px;background:var(--surface-2)}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}.stat span{font-size:11.5px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0 8px}
.how-card{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
.how-card .hn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:10px}
.how-card>b{display:block;margin-bottom:4px}.how-card p{margin:0;font-size:14px;color:var(--muted)}
.h-sec{margin-top:44px}
.h-sec>h2{font-size:26px;letter-spacing:-.025em;margin:0 0 4px}
.h-sec>p{color:var(--muted);margin:0 0 20px}
.roadmap{position:relative;padding-left:34px}
.roadmap::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--accent),#a855f7,var(--py))}
.rm-stage{position:relative;margin-bottom:26px}
.rm-dot{position:absolute;left:-34px;top:2px;width:29px;height:29px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--accent)}
.rm-stage.done .rm-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.rm-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
.rm-title b{color:var(--text);letter-spacing:0;text-transform:none;font-size:18px;display:block}
.rm-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:.2s var(--ease);position:relative}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-2)}
.mcard-top{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.mcard .mi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-3);flex:none}
.mcard b{font-size:15.5px;line-height:1.3}
.mcard p{margin:0 0 12px;font-size:13.5px;color:var(--muted);line-height:1.5;flex:1}
.mcard-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.mcard .bar{height:6px;margin-top:8px}
.mcard .tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.continue-card{display:flex;align-items:center;gap:16px;padding:18px 20px;margin-top:18px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:.2s}
.continue-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.continue-card .ci{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.continue-card small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.continue-card b{font-size:16px}

/* ---------- playground ---------- */
.pg-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:18px}
.pg-panel{border:1px solid var(--code-border);border-radius:16px;overflow:hidden;background:var(--code-bg);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pg-panel .cb-head{flex:none}
.pg-panel .out{flex:1;border-top:0}
.pg-panel .out pre{max-height:none;min-height:220px}
.pg-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.pg-bar select{height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;padding:0 10px}

/* ---------- assessment ---------- */
.assess-hero{padding:26px;border-radius:20px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--border);margin-bottom:24px}
.result-card{padding:20px;border-radius:16px;border:1px solid var(--border);background:var(--surface);display:flex;gap:18px;align-items:center;margin:18px 0;animation:fadeIn .4s}
.result-card .rs{font-size:36px;font-weight:800;letter-spacing:-.03em}
.result-card.pass .rs{color:var(--ok)}.result-card.fail .rs{color:var(--bad)}

/* cheat sheet */
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.cs-card{border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden}
.cs-card h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--border);background:var(--surface-2);display:flex;gap:8px;align-items:center}
.cs-card pre{margin:0;padding:12px 16px;background:var(--code-bg);color:var(--code-text);font-size:13px;line-height:1.65;overflow-x:auto}

/* ---------- trace modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,8,18,.6);backdrop-filter:blur(4px)}
.modal.open{display:flex;animation:fadeIn .2s}
.modal-card{width:min(1100px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:17px;flex:1}
.tr-body{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);min-height:0;flex:1;overflow:hidden}
.tr-code{background:var(--code-bg);overflow:auto;padding:12px 0;font-family:var(--mono);font-size:14px;line-height:24px}
.tr-line{display:flex;padding-right:14px;position:relative;transition:background .15s}
.tr-line .ln{width:46px;flex:none;text-align:right;padding-right:12px;color:#4a5474;user-select:none}
.tr-line .lc{white-space:pre;color:var(--code-text)}
.tr-line.cur{background:rgba(245,197,66,.14)}
.tr-line.cur::before{content:"➜";position:absolute;left:4px;color:#f5c542;font-weight:700}
.tr-line.prev{background:rgba(99,102,241,.12)}
.tr-side{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:16px;gap:14px;background:var(--surface-2)}
.tr-box{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.tr-box h4{margin:0;padding:8px 12px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.tr-vars{width:100%;border-collapse:collapse;font-size:13.5px}
.tr-vars td{padding:6px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tr-vars tr:last-child td{border-bottom:0}
.tr-vars td:first-child{font-family:var(--mono);font-weight:600;color:var(--text);white-space:nowrap;width:1%}
.tr-vars td:nth-child(2){font-family:var(--mono);color:var(--accent-ink);word-break:break-word}
.tr-vars td:nth-child(3){font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.tr-vars tr.changed td{background:var(--py-soft)}
.tr-empty{padding:10px 12px;font-size:13px;color:var(--muted)}
.tr-out{margin:0;padding:10px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:var(--text);max-height:180px;overflow:auto;min-height:38px}
.tr-ctrl{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.tr-ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.tr-step{font-size:13px;font-weight:600;color:var(--muted);min-width:110px;text-align:center}
.tr-msg{font-size:13.5px;padding:10px 12px;color:var(--text-2)}
.tr-msg.err{color:var(--bad);font-family:var(--mono);white-space:pre-wrap;font-size:12.5px}

/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{padding:12px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .35s var(--ease);display:flex;gap:10px;align-items:center;max-width:360px}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.confetti{position:fixed;pointer-events:none;z-index:300;width:8px;height:12px;border-radius:2px;top:0;left:0}

.footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.danger{color:var(--bad)!important}

/* ---------- responsive ---------- */
@media (max-width:1180px){.page{grid-template-columns:minmax(0,1fr)}.toc{display:none}.content{max-width:860px;margin:0 auto;width:100%}}
@media (max-width:980px){
  #menuBtn{display:grid}
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(5,8,18,.45);z-index:35}
  .main{margin-left:0}
  .hero{grid-template-columns:1fr;padding:30px 24px}
  .how{grid-template-columns:repeat(2,1fr)}
  .pg-wrap{grid-template-columns:1fr}
  .tr-body{grid-template-columns:1fr;overflow:auto}
  .tr-code{max-height:40vh}
}
@media (max-width:640px){
  .page{padding:22px 16px 60px}
  .py-status span{display:none}
  .brand small{display:none}
  .search kbd{display:none}
  .compare,.mis-cols{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}.pg.next{grid-column:1}
  .cbtn .lbl{display:none}
  .lead{font-size:17px}
  .ex-head{padding:12px 14px}.ex-prompt,.ex-tools,.hints,.results{padding-left:14px;padding-right:14px}.ex-body,.sol{margin-left:14px;margin-right:14px}
  .topbar{gap:8px;padding:0 10px}
  .brand-text{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

  <div class="modal-card">
    <div class="modal-head"><span class="sec-ic">🔬</span><h3 id="trTitle">Step-through visualizer</h3><button class="icon-btn" id="trClose" aria-label="Close visualizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

      <div class="tr-code" id="trCode"></div>

        <div class="tr-box"><h4><span>Current step</span><span id="trFn"></span></h4><div class="tr-msg" id="trMsg"></div></div>
        <div class="tr-box"><h4><span>Variables</span><span>value · type</span></h4><div id="trVars"></div></div>
        <div class="tr-box" id="trGlobalsBox" hidden><h4><span>Global variables</span></h4><div id="trGlobals"></div></div>

      <button class="btn ghost" id="trPlay">▶ Auto-play</button>
      <input type="range" id="trRange" min="0" max="0" value="0" aria-label="Step slider">

    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ===== Content helpers ===== */
const CODE = [];
const MODULES = [];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const R = (s, ...v) => String.raw(s, ...v).replace(/^\n+/, '').replace(/\s+$/, '');
function C(s, ...v) {
  let src = R(s, ...v), out = null, inp = '';
  let i = src.indexOf('\n#OUT\n');
  if (i >= 0) { out = src.slice(i + 6); src = src.slice(0, i); }
  i = src.indexOf('\n#IN\n');
  if (i >= 0) { inp = src.slice(i + 5); src = src.slice(0, i); }
  CODE.push({ code: src, out, inp });
  return `<div class="cb" data-cb="${CODE.length - 1}"></div>`;
}
const box = (k, ic) => (title, html) => `<div class="callout ${k}"><div class="callout-ic">${ic}</div><div class="callout-b"><div class="callout-t">${title}</div>${html}</div></div>`;
const tip = box('tip', '💡'), warn = box('warn', '⚠️'), note = box('note', '📌'), think = box('think', '🧠');
const more = (t, h) => `<details class="more"><summary><span>${t}</span></summary><div class="more-body">${h}</div></details>`;
const tbl = (h, rows) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const ic = s => `<code>${esc(s)}</code>`;
function idx(items, label) {
  const arr = typeof items === 'string' ? [...items] : items, n = arr.length;
  return `<figure class="diagram idx">${label ? `<figcaption>${label}</figcaption>` : ''}<div class="idx-row">${arr.map((c, i) => `<div class="idx-cell"><span class="idx-pos">${i}</span><span class="idx-val">${esc(c)}</span><span class="idx-neg">${i - n}</span></div>`).join('')}</div><div class="idx-legend"><span><b class="lp">■</b> positive index (from the start)</span><span><b class="ln">■</b> negative index (from the end)</span></div></figure>`;
}
function vbox(list, cap) {
  return `<figure class="diagram vars"><div class="vars-row">${list.map(([n, v, t]) => `<div class="vb"><div class="vb-name">${n}</div><svg class="vb-arrow" viewBox="0 0 40 12"><path d="M0 6h34" /><path d="M28 1l7 5-7 5" /></svg><div class="vb-val ty-${t}"><span>${esc(v)}</span><em>${t}</em></div></div>`).join('')}</div>${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
}
const stepsD = (arr, cap) => `<figure class="diagram steps">${arr.map((s, i) => `<div class="st"><span class="st-n">${i + 1}</span><div>${s}</div></div>`).join('')}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
const pillars = arr => `<div class="pillars">${arr.map(([i, t, d]) => `<div class="pillar"><div class="pillar-i">${i}</div><b>${t}</b><p>${d}</p></div>`).join('')}</div>`;
const compare = (a, ah, b, bh) => `<div class="compare"><div class="cmp"><div class="cmp-t">${a}</div>${ah}</div><div class="cmp"><div class="cmp-t">${b}</div>${bh}</div></div>`;
const SVG_DEFS = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fl-head"/></marker></defs>`;
function flowIf() {
  return `<figure class="diagram flow"><svg viewBox="0 0 520 300" role="img" aria-label="Flowchart of an if/else statement">${SVG_DEFS}
  <rect x="190" y="8" width="140" height="36" rx="18" class="fl-term"/><text x="260" y="31">program runs</text>
  <path d="M260 44V68" class="fl-line" marker-end="url(#ah)"/>
  <polygon points="260,70 350,110 260,150 170,110" class="fl-dec"/><text x="260" y="114">condition?</text>
  <path d="M170 110H90V166" class="fl-line" marker-end="url(#ah)"/><text x="122" y="102" class="fl-yes">True</text>
  <path d="M350 110H430V166" class="fl-line" marker-end="url(#ah)"/><text x="398" y="102" class="fl-no">False</text>
  <rect x="20" y="168" width="140" height="44" rx="8" class="fl-box"/><text x="90" y="194">if-block runs</text>
  <rect x="360" y="168" width="140" height="44" rx="8" class="fl-box"/><text x="430" y="194">else-block runs</text>
  <path d="M90 212V244H258" class="fl-line"/><path d="M430 212V244H262" class="fl-line"/><path d="M260 244V258" class="fl-line" marker-end="url(#ah)"/>
  <rect x="180" y="260" width="160" height="34" rx="17" class="fl-term"/><text x="260" y="282">next line after if</text>
  </svg><figcaption>Exactly <b>one</b> branch runs. Then the program continues below the whole if/else.</figcaption></figure>`;
}
function flowWhile() {
  return `<figure class="diagram flow"><svg viewBox="0 0 520 300" role="img" aria-label="Flowchart of a while loop">${SVG_DEFS}
  <rect x="190" y="8" width="140" height="36" rx="18" class="fl-term"/><text x="260" y="31">before the loop</text>
  <path d="M260 44V62" class="fl-line" marker-end="url(#ah)"/>
  <polygon points="260,64 350,104 260,144 170,104" class="fl-dec"/><text x="260" y="108">condition?</text>
  <path d="M260 144V176" class="fl-line" marker-end="url(#ah)"/><text x="276" y="166" class="fl-yes">True</text>
  <rect x="180" y="178" width="160" height="44" rx="8" class="fl-box"/><text x="260" y="204">loop body runs</text>
  <path d="M180 200H70V104H166" class="fl-line" marker-end="url(#ah)"/><text x="100" y="94" class="fl-mut">check again</text>
  <path d="M350 104H450V246" class="fl-line" marker-end="url(#ah)"/><text x="400" y="94" class="fl-no">False</text>
  <rect x="380" y="248" width="130" height="36" rx="18" class="fl-term"/><text x="445" y="271">after the loop</text>
  </svg><figcaption>The condition is checked <b>before every repetition</b>. When it becomes False, Python skips to the code after the loop.</figcaption></figure>`;
}

/* ================= STAGE 1 — FOUNDATIONS ================= */
MODULES.push({
  id: 'start', stage: 1, icon: '🚀', t: 'Getting Started',
  d: 'What programming is, how programmers think, and your first Python programs.',
  lessons: [
    {
      id: 'intro', t: 'Programming & Computational Thinking', min: 12,
      lead: 'A program is a precise list of instructions. Before learning Python syntax, learn how programmers <em>think</em> about problems.',
      body: `
<h3>What is a program?</h3>
<p>A computer is incredibly fast but has <b>zero common sense</b>. It does exactly what you tell it, in exactly the order you tell it, and nothing more. A <b>program</b> is a list of instructions written in a language the computer can follow. <b>Python</b> is one such language, and it is famous for being readable, almost like English.</p>
<p>Think of a recipe. "Make tea" is too vague for a computer. A program needs every step: <em>fill the kettle, switch it on, wait until it boils, put a tea bag in a cup, pour water, wait 3 minutes, remove the bag.</em></p>
<h3>Computational thinking: the four pillars</h3>
<p>Computational thinking is the skill of turning a messy real-world problem into steps a computer can execute. It matters more than any single piece of syntax.</p>
${pillars([
  ['🧩', 'Decomposition', 'Break a big problem into smaller problems you can solve one at a time.'],
  ['🔍', 'Pattern recognition', 'Notice what repeats or what is similar to problems you have solved before.'],
  ['🎯', 'Abstraction', 'Ignore unimportant details and focus on what matters for the task.'],
  ['📝', 'Algorithms', 'Write an exact, ordered set of steps that always leads to the answer.']
])}
${think('Try it in your head', `<p>Problem: <em>"Find the tallest student in a class."</em></p><ul><li><b>Decompose:</b> get each height, compare them, remember the biggest.</li><li><b>Pattern:</b> it is the same as "find the most expensive item" or "the highest score".</li><li><b>Abstraction:</b> names, ages and hair colour don't matter, only heights.</li><li><b>Algorithm:</b> start with the first height as "tallest so far"; for every other height, if it is bigger, it becomes the new tallest.</li></ul><p>You will write exactly this algorithm in Python later in the course.</p>`)}
<h3>Your first Python program</h3>
<p>The <code>print()</code> function displays whatever you put inside its parentheses. Text must be wrapped in quotes. Press <b>▶ Run</b> to execute the code right here in your browser.</p>
${C`
print("Hello, World!")
#OUT
Hello, World!`}
<p>Let's break it down:</p>
<ul>
<li><code>print</code> is the <b>name of a function</b>, a ready-made command that does a job.</li>
<li><code>( )</code> parentheses hold the <b>input</b> you give the function.</li>
<li><code>"Hello, World!"</code> is a <b>string</b>, i.e. text. The quotes tell Python "this is text, not a command".</li>
</ul>
<h3>Python reads from top to bottom</h3>
<p>Python runs your code one line at a time, from the first line to the last. Click <b>Step through</b> to watch each line execute.</p>
${C`
print("Step 1: wake up")
print("Step 2: drink water")
print("Step 3: learn Python")
#OUT
Step 1: wake up
Step 2: drink water
Step 3: learn Python`}
${tip('How to use the code blocks', `<p><b>▶ Run</b> executes the code. <b>Step through</b> shows the program running line by line with every variable's value. <b>Playground</b> copies the code into a full editor so you can change it. Changing examples and seeing what breaks is one of the fastest ways to learn.</p>`)}
${more('What actually happens when you click Run?', `<p>Python is an <b>interpreted</b> language: a program called the <em>interpreter</em> reads your code and carries it out line by line. On this page, a complete Python interpreter (called Pyodide) runs inside your browser, so nothing is sent to a server. On your own computer, you would install Python from python.org and run files with <code>python my_program.py</code>.</p>`)}
`,
      real: [
        ['🤖', 'Automation', 'Scripts that rename 1,000 photos, send reminder emails, or tidy folders in seconds.'],
        ['📊', 'Data analysis', 'Python is the most popular language for statistics, data science and machine learning.'],
        ['🌐', 'Web backends', 'Sites like Instagram and many APIs run on Python (Django, Flask, FastAPI).'],
        ['🔬', 'Science', 'Researchers use Python to analyse experiments, model climate, and process images.']
      ],
      mis: [
        { t: 'Forgetting the quotes around text', bad: R`print(Hello)`, good: R`print("Hello")`, why: 'Without quotes, Python thinks <code>Hello</code> is the name of a variable and raises a <b>NameError</b>.' },
        { t: 'Capital letters where they don\'t belong', bad: R`Print("Hi")`, good: R`print("Hi")`, why: 'Python is <b>case-sensitive</b>: <code>Print</code> and <code>print</code> are completely different names.' },
        { t: 'Mismatched quotes or brackets', bad: R`print("Hi')`, good: R`print("Hi")`, why: 'A string must start and end with the same kind of quote, and every <code>(</code> needs a <code>)</code>.' }
      ],
      ex: [
        { t: 'Say hello', d: 1, p: 'Write a program that prints exactly: <code>Hello, Python!</code>', s: R`
# Write your code below
`, tests: R`
check('Hello, Python!' in _lines, 'Your output should contain a line that is exactly: Hello, Python!')`, h: ['Use the <code>print()</code> function.', 'Put the text inside quotes: <code>print("...")</code>'], sol: R`print("Hello, Python!")` },
        { t: 'Your learner card', d: 1, p: 'Print a 3-line card. Line 1 starts with <code>Name: </code> followed by your name. Line 2 is exactly <code>Language: Python</code>. Line 3 starts with <code>Goal: </code> followed by any goal.', s: R`
# Three print() calls, one for each line
`, tests: R`
check(len(_lines) == 3, 'Print exactly 3 lines')
check(len(_lines) > 0 and _lines[0].startswith('Name: ') and len(_lines[0]) > 6, 'Line 1 should start with "Name: " followed by a name')
check(len(_lines) > 1 and _lines[1] == 'Language: Python', 'Line 2 should be exactly "Language: Python"')
check(len(_lines) > 2 and _lines[2].startswith('Goal: ') and len(_lines[2]) > 6, 'Line 3 should start with "Goal: " followed by a goal')`, h: ['You need three separate <code>print()</code> lines.', 'Watch the space after the colon: <code>"Name: Ada"</code>.'], sol: R`
print("Name: Ada")
print("Language: Python")
print("Goal: Build useful tools")` }
      ],
      q: [
        { q: 'What does this code display?', c: R`print("5 + 3")`, o: ['8', '5 + 3', '"5 + 3"', 'An error'], a: 1, e: 'Anything inside quotes is text. Python prints it exactly as written and does not calculate it.' },
        { q: 'Which pillar of computational thinking means splitting a big problem into smaller ones?', o: ['Abstraction', 'Decomposition', 'Pattern recognition', 'Algorithms'], a: 1, e: '<b>Decomposition</b> = breaking a problem down. Abstraction is about ignoring unimportant details.' },
        { q: 'In what order does Python run the lines of a simple program?', o: ['Randomly', 'Bottom to top', 'Top to bottom, one line at a time', 'All lines at the same time'], a: 2, e: 'Python executes statements sequentially, from top to bottom (until you use loops, conditions or functions to change the flow).' }
      ]
    },
    {
      id: 'basics', t: 'Comments, Errors & Program Flow', min: 12,
      lead: 'Write notes for humans, do quick math, and learn to read error messages, the most underrated programming skill.',
      body: `
<h3>Comments: notes for humans</h3>
<p>Anything after a <code>#</code> on a line is a <b>comment</b>. Python ignores it completely. Comments explain <em>why</em> code exists, which helps your future self and your teammates.</p>
${C`
# This program prints a welcome message
print("Welcome!")  # comments can also go at the end of a line
# print("This line is switched off")
#OUT
Welcome!`}
${tip('Comment out code', '<p>Putting <code>#</code> before a line temporarily disables it. This is very handy when you are hunting for a bug.</p>')}
<h3>Printing several things at once</h3>
<p>Separate values with commas. <code>print</code> puts a space between them automatically. Numbers do <b>not</b> need quotes, and Python calculates them.</p>
${C`
print("Minutes in a day:", 24 * 60)
print("2 + 3")     # text: printed as-is
print(2 + 3)       # math: calculated first
print()            # an empty line
print("Done")
#OUT
Minutes in a day: 1440
2 + 3
5

Done`}
<h3>Errors are normal (and helpful!)</h3>
<p>Every programmer sees errors every day. An error message is Python telling you <em>exactly</em> where it got confused. Run this example: notice that line 1 runs, then the program stops at line 2.</p>
${C`
print("Start")
print(10 / 0)
print("End")`}
<p>A Python error message (called a <b>traceback</b>) is best read <b>from the bottom up</b>:</p>
${tbl(['Part', 'Example', 'Meaning'], [

])}
<p>There are three families of errors you will meet:</p>
${compare('Syntax errors', '<p>The code is not valid Python (missing bracket, bad indentation). <b>Nothing</b> runs.</p>', 'Runtime errors', '<p>The code is valid but something impossible happens while running (dividing by zero, using an unknown name).</p>')}

      body: `
<h3>Getting input from the user</h3>
<p><code>input()</code> pauses the program, shows a prompt, and waits for the user to type something. Whatever they type is returned <b>as a string</b>.</p>
${note('Input on this platform', '<p>Code blocks that use <code>input()</code> have an <b>Input</b> box. Put one value per line; each call to <code>input()</code> reads the next line. Try changing the name below and re-running.</p>')}
${C`
name = input("What is your name? ")
print("Nice to meet you,", name)
#IN
Lina
#OUT
What is your name? Lina
Nice to meet you, Lina`}
${warn('input() always returns text', '<p>Even if the user types <code>25</code>, you get the string <code>"25"</code>. Convert it before doing math:</p>')}
${C`
age = int(input("Your age: "))
print("In 10 years you will be", age + 10)
#IN
25
#OUT
Your age: 25
In 10 years you will be 35`}
<h3>Controlling print: sep and end</h3>
${C`
print("2026", "11", "15", sep="-")   # change the separator
print("Loading", end="...")          # change what goes at the end
print("done!")
#OUT
2026-11-15
Loading...done!`}
<h3>f-strings: the best way to format text</h3>
<p>Put an <code>f</code> before the quotes, then place any variable or expression inside <code>{ }</code>.</p>
${C`
item = "Coffee"
price = 3.5
qty = 4
print(f"{qty} x {item} = {price * qty}")
print(f"Total: {price * qty:.2f}")     # :.2f -> 2 decimal places

<h3>Bubble sort: swap neighbours</h3>
<p>Walk through the list comparing neighbours; swap them if they\'re in the wrong order. After each pass, the largest remaining value "bubbles" to the end.</p>
<figure class="diagram sortvis"><div class="sv-pass"><b>Pass 1</b><span>5</span><span>3</span><span>8</span><span>1</span><i>→</i><span>3</span><span>5</span><span>1</span><span class="fix">8</span></div><div class="sv-pass"><b>Pass 2</b><span>3</span><span>5</span><span>1</span><span class="fix">8</span><i>→</i><span>3</span><span>1</span><span class="fix">5</span><span class="fix">8</span></div><div class="sv-pass"><b>Pass 3</b><span>3</span><span>1</span><span class="fix">5</span><span class="fix">8</span><i>→</i><span class="fix">1</span><span class="fix">3</span><span class="fix">5</span><span class="fix">8</span></div><figcaption>Green values are in their final position.</figcaption></figure>
${C`
def bubble_sort(items):
    items = items.copy()            # don't modify the caller's list
    n = len(items)
    for p in range(n - 1):          # each pass...
        swapped = False
        for i in range(n - 1 - p):  # ...the sorted tail grows, so check less
            if items[i] > items[i + 1]:
                items[i], items[i + 1] = items[i + 1], items[i]   # swap
                swapped = True
        if not swapped:             # no swaps → already sorted, stop early
            break
    return items

<p>Find the smallest item in the unsorted part and swap it to the front. Repeat for the rest.</p>

def selection_sort(items):
    items = items.copy()
    for i in range(len(items)):
        smallest = i
        for j in range(i + 1, len(items)):
            if items[j] < items[smallest]:
                smallest = j

sults.append({'ok': False, 'msg': 'A test could not run: %s: %s' % (type(e).__name__, e)})\n    finally:\n        sys.stdout = old\n    return json.dumps({'out': out_s, 'err': None, 'tests': results})\n\ndef _safe_repr(v):\n    try:\n        if isinstance(v, types.FunctionType):\n            return 'function ' + v.__name__ + '()'\n        if isinstance(v, types.ModuleType):\n            return 'module ' + v.__name__\n        r = repr(v)\n    except Exception:\n        r = '<?>'\n    return r if len(r) <= 90 else r[:87] + '...'\n\ndef _snap(d):\n    res = {}\n    for k, v in list(d.items()):\n        if k.startswith('_') or k == 'input' or isinstance(v, types.ModuleType):\n            continue\n        res[k] = [_safe_repr(v), type(v).__name__]\n    return res\n\ndef __trace(code, stdin_text, _t=''):\n    out = _Out()\n    steps = []\n    LIMIT = 800\n    def local(frame, event, arg):\n        if event in ('line', 'return'):\n            if len(steps) >= LIMIT:\n                raise _TraceLimit()\n            st = {'line': frame.f_lineno, 'ev': event, 'fn': frame.f_code.co_name,\n                  'vars': _snap(frame.f_locals), 'out': out.getvalue()}\n            if frame.f_code.co_name != '<module>':\n                st['g'] = _snap(frame.f_globals)\n            if event == 'return':\n                st['ret'] = _safe_repr(arg)\n            steps.append(st)\n        return local\n    def glob(frame, event, arg):\n        if frame.f_code.co_filename == 'main.py':\n            return local\n        return None\n    g, err = _exec_user(code, stdin_text, out, glob)\n    truncated = err == '__TRACE_LIMIT__'\n    if truncated:\n        err = None\n    steps.append({'line': 0, 'ev': 'end', 'fn': '<module>', 'vars': _snap(g), 'out': out.getvalue()})\n    return json.dumps({'steps': steps, 'out': out.getvalue(), 'err': err, 'truncated': truncated})\n";
const WORKER_SRC = `
let py = null;
const ready = (async () => {
  try {
    importScripts('${PYODIDE}pyodide.js');
    py = await loadPyodide({ indexURL: '${PYODIDE}' });
    py.runPython(${JSON.stringify(PY_SETUP)});
    self.postMessage({ type: 'ready' });
  } catch (err) { self.postMessage({ type: 'fail', msg: String(err && err.message || err) }); }
})();
self.onmessage = async (e) => {
  await ready;
  const d = e.data; let r;
  if (!py) { self.postMessage({ id: d.id, result: { out: '', err: 'Python is not available.' } }); return; }
  try {
    const fn = py.globals.get(d.kind === 'trace' ? '__trace' : d.kind === 'check' ? '__check' : '__run_json');
    r = JSON.parse(fn(d.code, d.stdin || '', d.tests || ''));
  } catch (err) { r = { out: '', err: String(err && err.message || err) }; }
  self.postMessage({ id: d.id, result: r });
};`;
const PY = {
  w: null, ready: false, q: new Map(), id: 0, readyP: null, failed: null,
  start() {
    if (this.w) return;
    setPyStatus('loading');
    try { this.w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }))); }
    catch (e) { this.failed = 'Your browser blocked the Python worker: ' + e.message; setPyStatus('error'); this.readyP = Promise.reject(new Error(this.failed)); this.readyP.catch(() => {}); return; }
    this.readyP = new Promise((res, rej) => { this._res = res; this._rej = rej; });
    this.readyP.catch(() => {});
    this.w.onmessage = e => {
      const d = e.data;
      if (d.type === 'ready') { this.ready = true; this.failed = null; setPyStatus('ready'); this._res(); }
      else if (d.type === 'fail') { this.failed = d.msg; setPyStatus('error'); this._rej(new Error(d.msg)); this.w.terminate(); this.w = null; }
      else { const cb = this.q.get(d.id); if (cb) { this.q.delete(d.id); clearTimeout(cb.t); cb.res(d.result); } }
    };
    this.w.onerror = ev => { ev.preventDefault && ev.preventDefault(); if (!this.ready) { this.failed = 'Could not start Python.'; setPyStatus('error'); this._rej(new Error(this.failed)); this.w = null; } };
  },
  restart() { if (this.w) this.w.terminate(); this.w = null; this.ready = false; for (const [, cb] of this.q) { clearTimeout(cb.t); cb.res({ out: '', err: 'Python was restarted.' }); } this.q.clear(); this.start(); },
  async call(kind, payload, timeout = 10000) {
    if (!this.w) this.start();
    try { await this.readyP; } catch (e) {
      const r = { out: '', err: 'The Python engine could not be loaded.\n' + (this.failed || e.message) + '\n\nPyodide (a full Python 3 in the browser) is downloaded from cdn.jsdelivr.net the first time you run code. Check your internet connection and reload. You can still read the lessons and take the quizzes offline.', offline: true };
      this.w = null; return r;
    }
    const id = ++this.id;
    return new Promise(res => {
      const t = setTimeout(() => { this.q.delete(id); this.restart(); res({ out: '', err: '⏱ Your program ran for more than ' + (timeout / 1000) + ' seconds and was stopped.\nThis usually means an infinite loop: check that your loop condition eventually becomes False\n(or that input() isn\'t being called inside an endless loop).', timeout: true }); }, timeout);
      this.q.set(id, { res, t });
      this.w.postMessage({ id, kind, ...payload });
    });
  }
};
function setPyStatus(s) {
  const el = $('#pyStatus'); if (!el) return;
  el.dataset.s = s;
  $('span', el).textContent = { idle: 'Python: idle', loading: 'Loading Python…', ready: 'Python 3 ready', error: 'Python offline' }[s];
  el.title = { idle: 'Python loads when you first run code', loading: 'Downloading the Python engine (first time only, ~10 MB)', ready: 'Python 3.12 is running in your browser', error: 'Could not load Python. Check your connection.' }[s];
}

  IndentationError: 'The indentation (spaces at the start of lines) is inconsistent. Code inside <code>if</code>, <code>for</code>, <code>while</code> and <code>def</code> must be indented by the same amount (4 spaces).',
  NameError: 'You used a name Python doesn\'t know. Check spelling and capital letters, make sure the variable is created <b>before</b> this line, and put text inside quotes.',
  TypeError: 'An operation got the wrong type of value, e.g. adding text to a number, or calling a function with the wrong number of arguments. Convert with <code>int()</code>/<code>str()</code> or check the call.',
  ValueError: 'The type was right but the value wasn\'t usable, e.g. <code>int("abc")</code>. Validate the value first or handle it with try/except.',
  ZeroDivisionError: 'You divided by zero. Make sure the divisor can\'t be 0 (for example, the length of an empty list).',
  IndexError: 'You asked for a position that doesn\'t exist. Valid indexes go from <code>0</code> to <code>len(x) - 1</code>.',
  KeyError: 'That key isn\'t in the dictionary. Check with <code>if key in d</code> or use <code>d.get(key)</code>.',

  FileNotFoundError: 'There is no file with that name. The sample files available here are <code>notes.txt</code>, <code>scores.csv</code> and <code>poem.txt</code>.',
  EOFError: 'Your program called <code>input()</code> more times than there are lines in the Input box. Add more values, one per line.',
  UnboundLocalError: 'You assign to this variable inside a function, so Python treats it as local, but you read it before assigning. Pass the value in as a parameter and return the new value.',
  RecursionError: 'A function kept calling itself without ever stopping.',
  ModuleNotFoundError: 'Python can\'t find a module with that name. Check the spelling.',
  AssertionError: 'An <code>assert</code> condition was False: one of the assumptions in the code didn\'t hold.',
  RuntimeError: 'Something went wrong while the program was running. Read the message on the last line for details.'
};
const errType = err => { const m = String(err).match(/^(\w+(?:Error|Exception|Interrupt))\b/gm); return m ? m[m.length - 1] : null; };
function showOutput(panel, res, label = 'Output') {
  panel.hidden = false;
  $('.out-label', panel).innerHTML = `<span>${label}</span><span class="live">● live</span>`;
  const pre = $('pre', panel);
  let h = '';
  if (res.out) h += esc(res.out);
  if (res.err) h += `<span class="err">${esc(res.err)}</span>`;
  if (!res.out && !res.err) h = '<span class="muted">(Your program ran but printed nothing.)</span>';
  pre.innerHTML = h;
  $$('.explain', panel).forEach(e => e.remove());
  const t = res.err && !res.offline && !res.timeout ? errType(res.err) : null;
  if (t && ERR_HELP[t]) panel.insertAdjacentHTML('beforeend', `<div class="explain">💡 <b>What this means (${t}):</b> ${ERR_HELP[t]}</div>`);
}

/* ---------- editor ---------- */
function makeEditor(host, code, opts = {}) {
  const { onChange, onRun, minLines = 5, maxLines = 24 } = opts;
  host.classList.add('editor');
  host.innerHTML = `<div class="ed-gutter" aria-hidden="true"></div><div class="ed-main"><pre class="ed-hl" aria-hidden="true"><code></code></pre><textarea class="ed-ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Python code editor. Press Ctrl+Enter to run."></textarea></div>`;
  const ta = $('.ed-ta', host), pre = $('.ed-hl', host), codeEl = $('code', pre), gut = $('.ed-gutter', host);
  ta.value = code;
  let lastN = 0;
  function sync() { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; gut.scrollTop = ta.scrollTop; }
  function refresh() {
    const v = ta.value;
    codeEl.innerHTML = hl(v) + '\n\n';
    const n = v.split('\n').length;
    if (n !== lastN) {
      gut.innerHTML = Array.from({ length: n + 1 }, (_, i) => `<div>${i < n ? i + 1 : ''}</div>`).join('');
      const rows = Math.min(maxLines, Math.max(minLines, n + 1));
      host.style.height = (rows * 22 + 22) + 'px';
      lastN = n;
    }
    sync();
  }
  function insert(t) {
    ta.focus();
    let ok = false;
    try { ok = t === '' ? document.execCommand('delete') : document.execCommand('insertText', false, t); } catch (e) {}
    if (!ok) { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  }
  ta.addEventListener('input', () => { refresh(); onChange && onChange(ta.value); });
  ta.addEventListener('scroll', sync);
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === '/') {
      e.preventDefault();
      const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
      const ls = v.lastIndexOf('\n', s - 1) + 1; let le = v.indexOf('\n', en); if (le < 0) le = v.length;
      const lines = v.slice(ls, le).split('\n');
      const all = lines.every(l => !l.trim() || /^\s*#/.test(l));
      const nb = lines.map(l => !l.trim() ? l : all ? l.replace(/^(\s*)# ?/, '$1') : l.replace(/^(\s*)/, '$1# ')).join('\n');
      ta.setSelectionRange(ls, le); insert(nb); ta.setSelectionRange(ls, ls + nb.length); return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
      if (e.shiftKey || (s !== en && v.slice(s, en).includes('\n'))) {
        const ls = v.lastIndexOf('\n', s - 1) + 1;
        const lines = v.slice(ls, en).split('\n');
        const nb = e.shiftKey ? lines.map(l => l.replace(/^ {1,4}/, '')).join('\n') : lines.map(l => '    ' + l).join('\n');
        ta.setSelectionRange(ls, en); insert(nb); ta.setSelectionRange(ls, ls + nb.length);
      } else insert('    ');
    } else if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const v = ta.value, s = ta.selectionStart;
      const line = v.slice(v.lastIndexOf('\n', s - 1) + 1, s);
      let ind = line.match(/^\s*/)[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      else if (/^\s*(return|break|continue|pass|raise)\b/.test(line)) ind = ind.slice(0, Math.max(0, ind.length - 4));
      insert('\n' + ind);
    } else if (e.key === 'Backspace' && ta.selectionStart === ta.selectionEnd) {
      const v = ta.value, s = ta.selectionStart;
      const before = v.slice(v.lastIndexOf('\n', s - 1) + 1, s);
      if (before.length && /^ +$/.test(before)) { e.preventDefault(); const k = before.length % 4 || 4; ta.setSelectionRange(s - k, s); insert(''); }
    }
  });
  refresh();
  return { get: () => ta.value, set: v => { ta.value = v; refresh(); onChange && onChange(v); }, focus: () => ta.focus(), ta };
}

function toast(msg, icon = '✅') {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, 2600);
}
function confetti(x, y) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#6366f1', '#a855f7', '#f5c542', '#22c55e', '#38bdf8', '#f97316'];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('div'); c.className = 'confetti'; c.style.background = colors[i % colors.length];
    document.body.appendChild(c);
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
    const dx = Math.cos(a) * v, dy = Math.sin(a) * v - 120;
    c.animate([{ transform: `translate(${x}px,${y}px) rotate(0)`, opacity: 1 }, { transform: `translate(${x + dx}px,${y + dy + 260}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => c.remove();
  }
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  if (btn) { const o = btn.innerHTML; btn.innerHTML = '✓ <span class="lbl">Copied</span>'; setTimeout(() => btn.innerHTML = o, 1200); }
}
function openInPlayground(code, inp) { S.play = code; S.playIn = inp || ''; save(); location.hash = '#/playground'; }
