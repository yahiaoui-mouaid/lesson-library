, {"id": "k4", "title": "الـ Health checks وترتيب التشغيل والـ Migrations", "html": "<p><b>الهدف:<\/b> أن يعمل <code dir=\"ltr\">docker compose up -d<\/code> من الصفر بنجاح في كل مرة دون تدخل يدوي. (Stage 6)<\/p><p><b>المطلوب:<\/b><\/p><ol><li>health check لـ <code dir=\"ltr\">db<\/code>.<\/li><li>خدمة <code dir=\"ltr\">migrate<\/code> من نفس الـ image تنفّذ الـ migrations وتخرج، وتنتظر جاهزية قاعدة البيانات.<\/li><li><code dir=\"ltr\">web<\/code> لا يبدأ إلا بعد نجاح <code dir=\"ltr\">migrate<\/code>.<\/li><li>health check لـ <code dir=\"ltr\">web<\/code> يفحص <code dir=\"ltr\">/health/<\/code>.<\/li><li>اختبر من الصفر: <code dir=\"ltr\">docker compose down -v<\/code> ثم <code dir=\"ltr\">docker compose up -d<\/code>. يجب أن يعمل كل شيء دون أي أمر إضافي. (نحن في بيئة التطوير، فحذف الـ volume هنا مقبول).<\/li><\/ol>", "hints": ["<p>أداة فحص جاهزية PostgreSQL موجودة داخل الـ image: <code dir=\"ltr\">pg_isready<\/code>.<\/p>", "<p>يوجد ثلاثة شروط لـ <code dir=\"ltr\">depends_on<\/code>. أي منها يناسب خدمة تنفّذ مهمة ثم تخرج؟ راجع مفهوم <code dir=\"ltr\">depends_on<\/code> في Stage 6.<\/p>", "<p>الـ slim image ليس فيها <code dir=\"ltr\">curl<\/code>. استخدم Python نفسه في فحص <code dir=\"ltr\">web<\/code>: <code dir=\"ltr\">python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health/')\"<\/code>. وتأكد أن <code dir=\"ltr\">localhost<\/code> ضمن <code dir=\"ltr\">ALLOWED_HOSTS<\/code>.<\/p>"], "sol": "<p>عدّل <code dir=\"ltr\">compose.yaml<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  migrate:\n    build: ./backend\n    command: python manage.py migrate --noinput\n    environment: &amp;backend-env\n      DEBUG: \"true\"\n      SECRET_KEY: ${SECRET_KEY}\n      ALLOWED_HOSTS: localhost,web\n      DB_HOST: db\n      DB_NAME: ${DB_NAME}\n      DB_USER: ${DB_USER}\n      DB_PASSWORD: ${DB_PASSWORD}\n    depends_on:\n      db:\n        condition: service_healthy\n\n  web:\n    build: ./backend\n    command: python manage.py runserver 0.0.0.0:8000\n    ports:\n      - \"8000:8000\"\n    environment: *backend-env\n    depends_on:\n      migrate:\n        condition: service_completed_successfully\n    healthcheck:\n      test: [\"CMD\", \"python\", \"-c\", \"import urllib.request as u; u.urlopen('http://localhost:8000/health/', timeout=3)\"]\n      interval: 10s\n      timeout: 5s\n      retries: 3\n      start_period: 15s\n\n  db:\n    image: postgres:17\n    environment:\n      POSTGRES_DB: ${DB_NAME}\n      POSTGRES_USER: ${DB_USER}\n      POSTGRES_PASSWORD: ${DB_PASSWORD}\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U ${DB_USER} -d ${DB_NAME}\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n      start_period: 10s\n\nvolumes:\n  pgdata:<\/code><\/pre><p><code dir=\"ltr\">&amp;backend-env<\/code> و <code dir=\"ltr\">*backend-env<\/code> من YAML anchors: نعرّف قائمة المتغيرات مرة ونعيد استخدامها.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose down -v\ndocker compose up -d\ndocker compose ps -a<\/code><\/pre><p>يجب أن ترى <code dir=\"ltr\">db<\/code> و <code dir=\"ltr\">web<\/code> بالحالة <code dir=\"ltr\">healthy<\/code>، و <code dir=\"ltr\">migrate<\/code> بالحالة <code dir=\"ltr\">Exited (0)<\/code>.<\/p>", "checks": ["بعد <code dir=\"ltr\">down -v<\/code> ثم <code dir=\"ltr\">up -d<\/code> عمل كل شيء دون أي أمر يدوي.", "<code dir=\"ltr\">docker compose ps -a<\/code> يعرض <code dir=\"ltr\">migrate<\/code> بالحالة <code dir=\"ltr\">Exited (0)<\/code>.", "<code dir=\"ltr\">db<\/code> و <code dir=\"ltr\">web<\/code> يظهران بالحالة <code dir=\"ltr\">healthy<\/code>."], "q": {"t": "m", "q": "لماذا الخدمة <code dir=\"ltr\">migrate<\/code> بلا <code dir=\"ltr\">restart: always<\/code>؟", "e": "الخدمات ذات المهمة الواحدة تخرج بالكود <code dir=\"ltr\">0<\/code> ويجب أن تبقى متوقفة. <code dir=\"ltr\">always<\/code> يعيدها للعمل مراراً.", "o": [{"h": "لأن Compose يمنع ذلك", "c": 0}, {"h": "لأنها مهمة تنتهي بنجاح مرة واحدة، وإعادة تشغيلها دائماً تجعلها تتكرر بلا نهاية", "c": 1}, {"h": "لأنها لا تتصل بقاعدة البيانات", "c": 0}, {"h": "لأنها بلا image", "c": 0}]}}, {"id": "k5", "title": "إضافة Redis و Celery worker", "html": "<p><b>الهدف:<\/b> مهمة تُرسَل من Django وتُنفَّذ في container آخر. (Stage 5 و Stage 6)<\/p><p><b>المطلوب:<\/b><\/p><ol><li>خدمة <code dir=\"ltr\">redis<\/code> مع health check.<\/li><li>إعداد Celery في مشروع Django: ملف <code dir=\"ltr\">config/celery.py<\/code>، و <code dir=\"ltr\">CELERY_BROKER_URL<\/code> يُقرأ من environment variable.<\/li><li>خدمة <code dir=\"ltr\">worker<\/code> من <b>نفس<\/b> الـ image الخاصة بـ <code dir=\"ltr\">web<\/code>، بأمر تشغيل مختلف.<\/li><li>task بسيط يجمع رقمين.<\/li><li>أرسل الـ task من <code dir=\"ltr\">web<\/code> وشاهد تنفيذه في logs الـ <code dir=\"ltr\">worker<\/code>.<\/li><\/ol>", "hints": ["<p>ما عنوان Redis الذي يراه Django والـ worker؟ الصيغة: <code dir=\"ltr\">redis://HOST:6379/0<\/code>، و <code dir=\"ltr\">HOST<\/code> هو اسم الـ service.<\/p>", "<p>أمر تشغيل الـ worker: <code dir=\"ltr\">celery -A config worker --loglevel=info<\/code>. الخدمة لا تحتاج <code dir=\"ltr\">ports<\/code>.<\/p>", "<p>للإرسال: <code dir=\"ltr\">docker compose exec web python manage.py shell<\/code> ثم <code dir=\"ltr\">from app.tasks import add; add.delay(2, 3)<\/code>. وللمتابعة: <code dir=\"ltr\">docker compose logs -f worker<\/code>.<\/p>"], "sol": "<p>أضف إلى <code dir=\"ltr\">&amp;backend-env<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>      CELERY_BROKER_URL: redis://redis:6379/0<\/code><\/pre><p>وأضف الخدمتين:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>  redis:\n    image: redis:7\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n\n  worker:\n    build: ./backend\n    command: celery -A config worker --loglevel=info\n    environment: *backend-env\n    depends_on:\n      migrate:\n        condition: service_completed_successfully\n      redis:\n        condition: service_healthy<\/code><\/pre><p>وأضف لـ <code dir=\"ltr\">web<\/code> تحت <code dir=\"ltr\">depends_on<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>      redis:\n        condition: service_healthy<\/code><\/pre><p><code dir=\"ltr\">config/celery.py<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"python\"><code>import os\nfrom celery import Celery\n\nos.environ.setdefault(\"DJANGO_SETTINGS_MODULE\", \"config.settings\")\napp = Celery(\"config\")\napp.config_from_object(\"django.conf:settings\", namespace=\"CELERY\")\napp.autodiscover_tasks()<\/code><\/pre><p>في <code dir=\"ltr\">config/__init__.py<\/code>: <code dir=\"ltr\">from .celery import app as celery_app<\/code>. وفي <code dir=\"ltr\">settings.py<\/code>: <code dir=\"ltr\">CELERY_BROKER_URL = os.environ[\"CELERY_BROKER_URL\"]<\/code>.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose up -d --build\ndocker compose logs -f worker<\/code><\/pre><p>لاحظ: <code dir=\"ltr\">web<\/code> و <code dir=\"ltr\">worker<\/code> و <code dir=\"ltr\">migrate<\/code> ثلاث خدمات من image واحدة بأوامر مختلفة.<\/p>", "checks": ["logs الـ <code dir=\"ltr\">worker<\/code> تُظهر استلام الـ task ونتيجته.", "الخدمتان <code dir=\"ltr\">redis<\/code> و <code dir=\"ltr\">worker<\/code> بلا أي port منشور.", "إذا أوقفت <code dir=\"ltr\">worker<\/code> وأرسلت task ثم شغّلته، يُنفَّذ الـ task المنتظر في الطابور."], "q": {"t": "c", "q": "الـ worker يعمل لكن لا يستلم أي task، وفي logs الـ <code dir=\"ltr\">web<\/code> خطأ اتصال بـ <code dir=\"ltr\">127.0.0.1:6379<\/code>. ما الخطأ؟", "e": "<code dir=\"ltr\">127.0.0.1<\/code> داخل <code dir=\"ltr\">web<\/code> هو <code dir=\"ltr\">web<\/code> نفسه. العنوان الصحيح <code dir=\"ltr\">redis://redis:6379/0<\/code>.", "o": [{"h": "Redis لم يُنشر بـ <code dir=\"ltr\">ports<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">CELERY_BROKER_URL<\/code> يشير إلى <code dir=\"ltr\">localhost<\/code> بدل اسم الـ service <code dir=\"ltr\">redis<\/code>", "c": 1}, {"h": "الـ worker يحتاج image مختلفة", "c": 0}, {"h": "Celery لا يعمل مع Compose", "c": 0}]}}, {"id": "k6", "title": "بناء React بـ multi-stage", "html": "<p><b>الهدف:<\/b> image نهائية صغيرة فيها ملفات الـ frontend الثابتة و Caddy فقط، دون Node. (Stage 7)<\/p><p><b>المطلوب:<\/b> داخل <code dir=\"ltr\">frontend/<\/code> (مشروع React بـ Vite، يطلب الـ API من المسار النسبي <code dir=\"ltr\">/api/<\/code>):<\/p><ol><li><code dir=\"ltr\">Dockerfile<\/code> من مرحلتين: الأولى تبني المشروع بـ Node، والثانية مبنية على <code dir=\"ltr\">caddy:2-alpine<\/code> وتأخذ ناتج البناء فقط.<\/li><li>ترتيب يحمي الـ cache لخطوة <code dir=\"ltr\">npm ci<\/code>.<\/li><li><code dir=\"ltr\">.dockerignore<\/code> يستبعد <code dir=\"ltr\">node_modules<\/code> و <code dir=\"ltr\">dist<\/code>.<\/li><li>ابنِ الـ image باسم <code dir=\"ltr\">shop-proxy:dev<\/code> وتحقق من حجمها ومن خلوّها من Node.<\/li><\/ol>", "hints": ["<p>Vite يضع ناتج البناء في <code dir=\"ltr\">dist/<\/code>. Caddy يقدّم الملفات من أي مجلد تحدده، وسنستخدم <code dir=\"ltr\">/srv<\/code>.<\/p>", "<p>نفس قاعدة Python: انسخ <code dir=\"ltr\">package.json<\/code> و <code dir=\"ltr\">package-lock.json<\/code> وحدهما، ثم <code dir=\"ltr\">npm ci<\/code>، ثم بقية الكود.<\/p>", "<p>ملف الـ <code dir=\"ltr\">Caddyfile<\/code> تكتبه في المهمة التالية. الآن يكفي ملف مؤقت من سطرين: <code dir=\"ltr\">:80<\/code> ثم داخل قوسين <code dir=\"ltr\">root * /srv<\/code> و <code dir=\"ltr\">file_server<\/code>.<\/p>"], "sol": "<p><code dir=\"ltr\">frontend/Dockerfile<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM node:22-alpine AS build\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM caddy:2-alpine\nCOPY Caddyfile /etc/caddy/Caddyfile\nCOPY --from=build /app/dist /srv<\/code><\/pre><p><code dir=\"ltr\">frontend/.dockerignore<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>node_modules\ndist\n.git\n.env<\/code><\/pre><p><code dir=\"ltr\">frontend/Caddyfile<\/code> (مؤقت):<\/p><pre dir=\"ltr\" data-lang=\"\"><code>:80 {\n    root * /srv\n    file_server\n}<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>cd frontend\ndocker build -t shop-proxy:dev .\ndocker images shop-proxy\ndocker run --rm shop-proxy:dev sh -c \"which node || echo 'no node here'\"\ndocker run --rm -p 8080:80 shop-proxy:dev    # ثم افتح http://localhost:8080<\/code><\/pre>", "checks": ["<code dir=\"ltr\">docker images<\/code> يعرض حجماً بعشرات الـ MB.", "لا يوجد <code dir=\"ltr\">node<\/code> داخل الـ image النهائية.", "الصفحة الرئيسية لـ React ظهرت على <code dir=\"ltr\">http://localhost:8080<\/code>."], "q": {"t": "m", "q": "لماذا لا تحوي الـ image النهائية <code dir=\"ltr\">node_modules<\/code>؟", "e": "<code dir=\"ltr\">COPY --from=build /app/dist /srv<\/code> ينقل الناتج فقط. بقية مرحلة البناء لا تدخل الـ image النهائية.", "o": [{"h": "لأن <code dir=\"ltr\">.dockerignore<\/code> حذفها من المرحلة الأولى", "c": 0}, {"h": "لأن المرحلة الأخيرة نسخت مجلد <code dir=\"ltr\">dist<\/code> فقط من مرحلة البناء", "c": 1}, {"h": "لأن Caddy يحذفها عند التشغيل", "c": 0}, {"h": "لأن <code dir=\"ltr\">npm ci<\/code> لا ينشئها", "c": 0}]}}, {"id": "k7", "title": "Caddy كـ reverse proxy ونقطة دخول وحيدة", "html": "<p><b>الهدف:<\/b> كل الطلبات تدخل من Caddy: مسارات الـ API تذهب إلى Django، والباقي يُقدَّم من ملفات React. (Stage 5)<\/p><p><b>المطلوب:<\/b><\/p><ol><li><code dir=\"ltr\">Caddyfile<\/code> يوجّه <code dir=\"ltr\">/api/*<\/code> و <code dir=\"ltr\">/admin/*<\/code> و <code dir=\"ltr\">/static/*<\/code> إلى <code dir=\"ltr\">web:8000<\/code>، ويقدّم ملفات React لكل ما عدا ذلك، مع إرجاع <code dir=\"ltr\">index.html<\/code> للمسارات غير الموجودة (لأن React يتولى الـ routing في المتصفح).<\/li><li>عنوان الموقع يُقرأ من environment variable اسمه <code dir=\"ltr\">SITE_ADDRESS<\/code> وقيمته الافتراضية <code dir=\"ltr\">:80<\/code>.<\/li><li>خدمة <code dir=\"ltr\">proxy<\/code> في <code dir=\"ltr\">compose.yaml<\/code> تنشر 80 و 443، مع volumes لبيانات Caddy.<\/li><li>احذف <code dir=\"ltr\">ports<\/code> من <code dir=\"ltr\">web<\/code>. لم يعد يصل إليه أحد إلا عبر الـ proxy.<\/li><li>فعّل WhiteNoise في Django ليقدّم ملفات الـ static الخاصة بالـ admin، ونفّذ <code dir=\"ltr\">collectstatic<\/code> أثناء بناء الـ image.<\/li><\/ol>", "hints": ["<p>صيغة قراءة متغير مع قيمة افتراضية في Caddyfile هي <code dir=\"ltr\">{$NAME:default}<\/code>. وبما أن القيمة الافتراضية نفسها <code dir=\"ltr\">:80<\/code> تصبح <code dir=\"ltr\">{$SITE_ADDRESS::80}<\/code>.<\/p>", "<p>استخدم عدة بلوكات <code dir=\"ltr\">handle<\/code>. Caddy ينفّذ أول بلوك يطابق المسار، والبلوك الأخير بلا مسار يلتقط الباقي.<\/p>", "<p>Caddy يخزن الشهادات في <code dir=\"ltr\">/data<\/code> وإعداداته في <code dir=\"ltr\">/config<\/code>. كلاهما يحتاج named volume.<\/p>"], "sol": "<p><code dir=\"ltr\">frontend/Caddyfile<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>{$SITE_ADDRESS::80} {\n    encode gzip\n\n    @backend path /api/* /admin/* /static/*\n    handle @backend {\n        reverse_proxy web:8000\n    }\n\n    handle {\n        root * /srv\n        try_files {path} /index.html\n        file_server\n    }\n}<\/code><\/pre><p>في <code dir=\"ltr\">compose.yaml<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>  proxy:\n    build: ./frontend\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    environment:\n      SITE_ADDRESS: ${SITE_ADDRESS:-:80}\n    volumes:\n      - caddy_data:/data\n      - caddy_config:/config\n    depends_on:\n      web:\n        condition: service_healthy\n\nvolumes:\n  pgdata:\n  caddy_data:\n  caddy_config:<\/code><\/pre><p>احذف <code dir=\"ltr\">ports<\/code> من <code dir=\"ltr\">web<\/code>. وفي <code dir=\"ltr\">backend/Dockerfile<\/code> قبل <code dir=\"ltr\">USER app<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN SECRET_KEY=build-only python manage.py collectstatic --noinput<\/code><\/pre><p>وفي <code dir=\"ltr\">settings.py<\/code>: أضف <code dir=\"ltr\">whitenoise.middleware.WhiteNoiseMiddleware<\/code> بعد <code dir=\"ltr\">SecurityMiddleware<\/code> مباشرة، و <code dir=\"ltr\">STATIC_ROOT = BASE_DIR / \"staticfiles\"<\/code>.<\/p><p>هذا الأمر يعمل وقت البناء حيث لا توجد متغيرات قاعدة البيانات. لذلك اقرأ إعدادات <code dir=\"ltr\">DB_*<\/code> و <code dir=\"ltr\">CELERY_BROKER_URL<\/code> في <code dir=\"ltr\">settings.py<\/code> بـ <code dir=\"ltr\">os.environ.get<\/code> مع قيمة افتراضية، حتى لا يفشل البناء.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose up -d --build\ncurl -i http://localhost/api/        # رد من Django\ncurl -i http://localhost/            # صفحة React\ncurl -i http://localhost:8000/       # يفشل: لم يعد منشوراً<\/code><\/pre>", "checks": ["<code dir=\"ltr\">http://localhost/<\/code> يعرض React، و <code dir=\"ltr\">http://localhost/admin/<\/code> يعرض صفحة دخول Django بتنسيقها الكامل.", "<code dir=\"ltr\">http://localhost:8000<\/code> لم يعد يستجيب.", "<code dir=\"ltr\">docker compose ps<\/code> يعرض ports منشورة للخدمة <code dir=\"ltr\">proxy<\/code> فقط."], "q": {"t": "c", "q": "بعد النشر فتحت الموقع فظهر <code dir=\"ltr\">502 Bad Gateway<\/code> على <code dir=\"ltr\">/api/<\/code>، والصفحة الرئيسية تعمل. أين تبحث أولاً؟", "e": "<code dir=\"ltr\">502<\/code> يعني أن Caddy يعمل لكنه لم يحصل على رد من <code dir=\"ltr\">web:8000<\/code>. إما أن <code dir=\"ltr\">web<\/code> متوقف أو غير جاهز، أو أن الاسم أو الـ port خاطئ.", "o": [{"h": "في ملفات React", "c": 0}, {"h": "في حالة الخدمة <code dir=\"ltr\">web<\/code> وسجلاتها: <code dir=\"ltr\">docker compose ps<\/code> و <code dir=\"ltr\">docker compose logs web<\/code>", "c": 1}, {"h": "في إعدادات الـ DNS", "c": 0}, {"h": "في الـ volume الخاص بـ Caddy", "c": 0}]}}, {"id": "k8", "title": "تقسيم الشبكات وتثبيت التخزين", "html": "<p><b>الهدف:<\/b> لا يصل إلى قاعدة البيانات إلا من يحتاجها، وكل بيانات مهمة في named volume. (Stage 4 و Stage 5)<\/p><p><b>المطلوب:<\/b><\/p><ol><li>شبكتان: <code dir=\"ltr\">frontend<\/code> و <code dir=\"ltr\">backend<\/code>. الثانية <code dir=\"ltr\">internal<\/code>.<\/li><li><code dir=\"ltr\">proxy<\/code> على <code dir=\"ltr\">frontend<\/code> فقط. <code dir=\"ltr\">db<\/code> و <code dir=\"ltr\">redis<\/code> على <code dir=\"ltr\">backend<\/code> فقط. <code dir=\"ltr\">web<\/code> على الاثنتين.<\/li><li>قرّر أين يوضع <code dir=\"ltr\">worker<\/code> و <code dir=\"ltr\">migrate<\/code> وبرّر قرارك.<\/li><li>named volume لملفات الـ media المرفوعة، مربوط بـ <code dir=\"ltr\">web<\/code> و <code dir=\"ltr\">worker<\/code>.<\/li><li>أثبت العزل: <code dir=\"ltr\">proxy<\/code> لا يستطيع الوصول إلى <code dir=\"ltr\">db<\/code>، و <code dir=\"ltr\">web<\/code> يستطيع.<\/li><\/ol>", "hints": ["<p>إذا حددت <code dir=\"ltr\">networks<\/code> لخدمة فلن توصل بالشبكة الافتراضية. إذن كل خدمة يجب أن تُذكر شبكاتها صراحة.<\/p>", "<p>خدمة على شبكة <code dir=\"ltr\">internal<\/code> فقط لا تصل إلى الإنترنت. هل يحتاج الـ worker إرسال بريد أو طلب API خارجي؟ إن كان نعم فيجب أن يكون على <code dir=\"ltr\">frontend<\/code> أيضاً.<\/p>", "<p>للاختبار: <code dir=\"ltr\">docker compose exec proxy ping -c 1 db<\/code> يجب أن يفشل بـ <code dir=\"ltr\">bad address<\/code>. ومن <code dir=\"ltr\">web<\/code>: <code dir=\"ltr\">docker compose exec web python -c \"import socket; print(socket.gethostbyname('db'))\"<\/code>.<\/p>"], "sol": "<pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  proxy:\n    networks: [frontend]\n  web:\n    networks: [frontend, backend]\n    volumes:\n      - media:/app/media\n  worker:\n    networks: [frontend, backend]   # على frontend أيضاً لأنه قد يرسل بريداً أو يطلب APIs خارجية\n    volumes:\n      - media:/app/media\n  migrate:\n    networks: [backend]\n  db:\n    networks: [backend]\n  redis:\n    networks: [backend]\n\nnetworks:\n  frontend:\n  backend:\n    internal: true\n\nvolumes:\n  pgdata:\n  media:\n  caddy_data:\n  caddy_config:<\/code><\/pre><p>(أضف هذه الحقول إلى تعريفات الخدمات الموجودة ولا تستبدلها).<\/p><p>حتى يستطيع المستخدم <code dir=\"ltr\">app<\/code> الكتابة في volume الـ media، أضف في <code dir=\"ltr\">backend/Dockerfile<\/code> قبل <code dir=\"ltr\">USER app<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN mkdir -p /app/media &amp;&amp; chown app:app /app/media<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose up -d --build\ndocker compose exec proxy ping -c 1 db      # bad address\ndocker compose exec web python -c \"import socket; print(socket.gethostbyname('db'))\"\ndocker volume ls<\/code><\/pre>", "checks": ["<code dir=\"ltr\">proxy<\/code> لا يستطيع تحويل الاسم <code dir=\"ltr\">db<\/code>، و <code dir=\"ltr\">web<\/code> يستطيع.", "ملف رفعته عبر التطبيق بقي موجوداً بعد <code dir=\"ltr\">docker compose down<\/code> ثم <code dir=\"ltr\">up -d<\/code>.", "لا توجد anonymous volumes جديدة في <code dir=\"ltr\">docker volume ls<\/code> بعد التشغيل."], "q": {"t": "m", "q": "لماذا وُضع <code dir=\"ltr\">web<\/code> على الشبكتين معاً؟", "e": "<code dir=\"ltr\">web<\/code> هو الخدمة الوحيدة التي تحتاج التحدث إلى الطرفين، فهو الجسر بين المنطقتين.", "o": [{"h": "ليصبح أسرع", "c": 0}, {"h": "لأنه الوسيط: يستقبل الطلبات من <code dir=\"ltr\">proxy<\/code> على <code dir=\"ltr\">frontend<\/code>، ويصل إلى <code dir=\"ltr\">db<\/code> و <code dir=\"ltr\">redis<\/code> على <code dir=\"ltr\">backend<\/code>", "c": 1}, {"h": "لأن Compose يشترط شبكتين لكل خدمة", "c": 0}, {"h": "ليُنشر له port تلقائياً", "c": 0}]}}, {"id": "k9", "title": "فصل إعدادات التطوير عن Production", "html": "<p><b>الهدف:<\/b> أساس مشترك واحد، وملف لكل بيئة، دون نسخ ولصق. (Stage 6 و Stage 7)<\/p><p><b>المطلوب:<\/b><\/p><ol><li><code dir=\"ltr\">compose.yaml<\/code>: الأساس المشترك فقط. انقل منه كل ما يخص التطوير (<code dir=\"ltr\">runserver<\/code> و <code dir=\"ltr\">DEBUG: \"true\"<\/code>).<\/li><li><code dir=\"ltr\">compose.override.yaml<\/code> للتطوير: bind mount للكود، <code dir=\"ltr\">runserver<\/code>، <code dir=\"ltr\">DEBUG<\/code>، ونشر <code dir=\"ltr\">8000<\/code> للتشخيص.<\/li><li><code dir=\"ltr\">compose.prod.yaml<\/code>: الـ images بأسماء كاملة من registry و tag من <code dir=\"ltr\">${APP_VERSION}<\/code>، <code dir=\"ltr\">restart: unless-stopped<\/code>، <code dir=\"ltr\">DEBUG: \"false\"<\/code>، logging rotation، حدود موارد، وتقييد صلاحيات لـ <code dir=\"ltr\">web<\/code> و <code dir=\"ltr\">worker<\/code>.<\/li><li>تحقق من ناتج الدمج في الحالتين بـ <code dir=\"ltr\">docker compose config<\/code>.<\/li><li>شغّل نسخة Production محلياً وتأكد أنها تعمل بـ gunicorn وبـ <code dir=\"ltr\">DEBUG=False<\/code>.<\/li><\/ol>", "hints": ["<p>في الأساس المشترك لا تضع <code dir=\"ltr\">command<\/code> لـ <code dir=\"ltr\">web<\/code>، فيُستخدم <code dir=\"ltr\">CMD<\/code> من الـ Dockerfile، وهو gunicorn. ملف التطوير هو الذي يستبدله بـ <code dir=\"ltr\">runserver<\/code>.<\/p>", "<p>استخدم <code dir=\"ltr\">x-<\/code> مع YAML anchor لتعريف الـ logging مرة واحدة. راجع مفهوم «الـ Logging» في Stage 7.<\/p>", "<p>مع <code dir=\"ltr\">read_only: true<\/code> يحتاج التطبيق مكاناً للكتابة المؤقتة: <code dir=\"ltr\">tmpfs: [/tmp]<\/code>. وحدد <code dir=\"ltr\">ALLOWED_HOSTS<\/code> من متغير <code dir=\"ltr\">${DOMAIN}<\/code>.<\/p>"], "sol": "<p><code dir=\"ltr\">compose.override.yaml<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    command: python manage.py runserver 0.0.0.0:8000\n    ports:\n      - \"127.0.0.1:8000:8000\"\n    volumes:\n      - ./backend:/app\n    environment:\n      DEBUG: \"true\"\n  worker:\n    volumes:\n      - ./backend:/app\n    environment:\n      DEBUG: \"true\"<\/code><\/pre><p><code dir=\"ltr\">compose.prod.yaml<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>x-logging: &amp;default-logging\n  driver: json-file\n  options:\n    max-size: \"10m\"\n    max-file: \"3\"\n\nx-hardening: &amp;hardening\n  restart: unless-stopped\n  logging: *default-logging\n  cap_drop: [ALL]\n  security_opt: [\"no-new-privileges:true\"]\n  read_only: true\n  tmpfs: [/tmp]\n\nservices:\n  web:\n    &lt;&lt;: *hardening\n    image: ${REGISTRY}/shop-backend:${APP_VERSION}\n    environment:\n      DEBUG: \"false\"\n      ALLOWED_HOSTS: ${DOMAIN},localhost,web\n    deploy:\n      resources:\n        limits: { cpus: \"1.0\", memory: 512M }\n  worker:\n    &lt;&lt;: *hardening\n    image: ${REGISTRY}/shop-backend:${APP_VERSION}\n    environment:\n      DEBUG: \"false\"\n    deploy:\n      resources:\n        limits: { cpus: \"1.0\", memory: 512M }\n  migrate:\n    image: ${REGISTRY}/shop-backend:${APP_VERSION}\n    environment:\n      DEBUG: \"false\"\n  proxy:\n    image: ${REGISTRY}/shop-proxy:${APP_VERSION}\n    restart: unless-stopped\n    logging: *default-logging\n  db:\n    restart: unless-stopped\n    logging: *default-logging\n    deploy:\n      resources:\n        limits: { memory: 1G }\n  redis:\n    restart: unless-stopped\n    logging: *default-logging<\/code><\/pre><p><code dir=\"ltr\">&lt;&lt;: *hardening<\/code> يدمج محتوى القالب داخل الخدمة.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose config | less\ndocker compose -f compose.yaml -f compose.prod.yaml config | less\n\nexport REGISTRY=local APP_VERSION=test DOMAIN=localhost\ndocker compose -f compose.yaml -f compose.prod.yaml build\ndocker compose -f compose.yaml -f compose.prod.yaml up -d\ndocker compose -f compose.yaml -f compose.prod.yaml top web\ndocker compose -f compose.yaml -f compose.prod.yaml exec web sh -c 'echo $DEBUG'<\/code><\/pre><p>في الأساس تبقى <code dir=\"ltr\">build: ./backend<\/code> مع <code dir=\"ltr\">image:<\/code> من ملف Production، فيبني Compose الـ image ويسميها بالاسم الكامل، وتصبح جاهزة لـ <code dir=\"ltr\">docker compose push<\/code>.<\/p>", "checks": ["<code dir=\"ltr\">docker compose config<\/code> (التطوير) يُظهر <code dir=\"ltr\">runserver<\/code> والـ bind mount.", "ناتج <code dir=\"ltr\">config<\/code> مع ملف Production لا يحوي bind mount للكود ولا <code dir=\"ltr\">runserver<\/code>.", "نسخة Production تعمل محلياً بـ gunicorn وقيمة <code dir=\"ltr\">DEBUG<\/code> هي <code dir=\"ltr\">false<\/code>.", "<code dir=\"ltr\">docker inspect<\/code> على <code dir=\"ltr\">web<\/code> في وضع Production يُظهر <code dir=\"ltr\">ReadonlyRootfs: true<\/code>."], "q": {"t": "c", "q": "نفّذت <code dir=\"ltr\">docker compose -f compose.yaml -f compose.prod.yaml up -d<\/code> فوجدت أن <code dir=\"ltr\">web<\/code> ما زال يشغّل <code dir=\"ltr\">runserver<\/code>. ما التفسير الأرجح؟", "e": "مع <code dir=\"ltr\">-f<\/code> لا يُحمَّل الـ override تلقائياً. إذن <code dir=\"ltr\">runserver<\/code> آتٍ من الأساس، ويجب نقله إلى <code dir=\"ltr\">compose.override.yaml<\/code>.", "o": [{"h": "<code dir=\"ltr\">compose.override.yaml<\/code> يُحمَّل دائماً", "c": 0}, {"h": "الأمر <code dir=\"ltr\">runserver<\/code> ما زال مكتوباً في <code dir=\"ltr\">compose.yaml<\/code> الأساسي ولم يُنقل إلى ملف التطوير", "c": 1}, {"h": "gunicorn غير مثبت", "c": 0}, {"h": "الـ <code dir=\"ltr\">-f<\/code> لا يعمل مع <code dir=\"ltr\">up<\/code>", "c": 0}]}}, {"id": "k10", "title": "النشر على VPS والتحدي الأخير", "html": "<p><b>الهدف:<\/b> التطبيق يعمل على سيرفر حقيقي بـ HTTPS، وتثبت أن البيانات تنجو من تدمير الـ containers وإعادة إنشائها. (Stage 7)<\/p><div class=\"note\">إذا لم يتوفر لك VPS الآن: نفّذ نفس الخطوات على جهازك داخل مجلد منفصل (مثل <code dir=\"ltr\">~/deploy-sim/<\/code>) يحوي ملفات الـ Compose و <code dir=\"ltr\">.env<\/code> فقط دون الكود، واسحب الـ images من الـ registry. بهذا تحاكي السيرفر.<\/div><p><b>المطلوب:<\/b><\/p><ol><li>ارفع الـ images بـ tag محدد إلى registry خاص.<\/li><li>جهّز السيرفر: Docker Engine، مستخدم غير root، جدار حماية يسمح بـ 22 و 80 و 443 فقط.<\/li><li>ضع في <code dir=\"ltr\">/opt/shop<\/code> ملفات الـ Compose و <code dir=\"ltr\">.env<\/code> الخاص بـ Production (بأسرار قوية جديدة، و <code dir=\"ltr\">SITE_ADDRESS<\/code> يساوي نطاقك).<\/li><li>شغّل وتحقق من HTTPS.<\/li><li>اكتب سكربت backup يومي لقاعدة البيانات وجرّب استعادته في container مؤقت.<\/li><li><b>التحدي الأخير:<\/b> أدخل سجلات عبر التطبيق، ثم دمّر كل الـ containers وأعد إنشاءها، وأثبت أن السجلات باقية.<\/li><li>نفّذ تحديثاً: غيّر شيئاً في الكود، ابنِ <code dir=\"ltr\">APP_VERSION<\/code> جديداً، انشره، ثم نفّذ rollback للنسخة السابقة.<\/li><\/ol>", "hints": ["<p>للرفع: <code dir=\"ltr\">docker compose -f compose.yaml -f compose.prod.yaml build<\/code> ثم <code dir=\"ltr\">push<\/code>، بعد ضبط <code dir=\"ltr\">REGISTRY<\/code> و <code dir=\"ltr\">APP_VERSION<\/code> وتنفيذ <code dir=\"ltr\">docker login<\/code>.<\/p>", "<p>أي أمر يدمّر الـ containers والشبكات ويترك الـ volumes؟ وأي خيار واحد يجب ألا تضيفه أبداً؟<\/p>", "<p>ضع <code dir=\"ltr\">COMPOSE_FILE=compose.yaml:compose.prod.yaml<\/code> في <code dir=\"ltr\">.env<\/code> على السيرفر لتختصر الأوامر. وفي cron استخدم <code dir=\"ltr\">docker compose exec -T<\/code>.<\/p>"], "sol": "<p><b>على جهازك:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>export REGISTRY=ghcr.io/USERNAME APP_VERSION=1.0.0 DOMAIN=example.com\ndocker login ghcr.io\ndocker compose -f compose.yaml -f compose.prod.yaml build\ndocker compose -f compose.yaml -f compose.prod.yaml push<\/code><\/pre><p><b>على السيرفر<\/b> <code dir=\"ltr\">/opt/shop/.env<\/code> (ثم <code dir=\"ltr\">chmod 600 .env<\/code>):<\/p><pre dir=\"ltr\" data-lang=\"\"><code>COMPOSE_FILE=compose.yaml:compose.prod.yaml\nREGISTRY=ghcr.io/USERNAME\nAPP_VERSION=1.0.0\nDOMAIN=example.com\nSITE_ADDRESS=example.com\nDB_NAME=shop\nDB_USER=app\nDB_PASSWORD=&lt;long-random-value&gt;\nSECRET_KEY=&lt;long-random-value&gt;<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>cd /opt/shop\ndocker login ghcr.io\ndocker compose pull\ndocker compose up -d --no-build\ndocker compose ps\ncurl -I https://example.com<\/code><\/pre><p><b>الـ backup<\/b> في <code dir=\"ltr\">/opt/shop/backup.sh<\/code> مع <code dir=\"ltr\">chmod +x<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>#!/bin/sh\nset -e\ncd /opt/shop\n. ./.env\ndocker compose exec -T db pg_dump -U \"$DB_USER\" \"$DB_NAME\" | gzip &gt; /backups/shop_$(date +%F).sql.gz\nfind /backups -name 'shop_*.sql.gz' -mtime +14 -delete<\/code><\/pre><p>ثم في <code dir=\"ltr\">crontab -e<\/code>: <code dir=\"ltr\">0 3 * * * /opt/shop/backup.sh<\/code><\/p><p><b>اختبار الاستعادة:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name restore-test -e POSTGRES_PASSWORD=x -e POSTGRES_USER=app -e POSTGRES_DB=shop postgres:17\nsleep 10\ngunzip -c /backups/shop_$(date +%F).sql.gz | docker exec -i restore-test psql -U app -d shop\ndocker exec restore-test psql -U app -d shop -c \"\\dt\"\ndocker rm -f restore-test<\/code><\/pre><p><b>التحدي الأخير:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose down          # بدون -v\ndocker compose ps -a         # لا شيء\ndocker volume ls             # الـ volumes باقية\ndocker compose up -d<\/code><\/pre><p>افتح التطبيق: السجلات موجودة.<\/p><p><b>التحديث والـ rollback:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code># على جهازك: APP_VERSION=1.0.1 ثم build و push\n# على السيرفر:\n/opt/shop/backup.sh\nsed -i 's/^APP_VERSION=.*/APP_VERSION=1.0.1/' .env\ndocker compose pull &amp;&amp; docker compose up -d --no-build\n# rollback:\nsed -i 's/^APP_VERSION=.*/APP_VERSION=1.0.0/' .env\ndocker compose up -d --no-build<\/code><\/pre>", "checks": ["الموقع يعمل على HTTPS بشهادة سليمة (أو يعمل في المحاكاة المحلية من مجلد بلا كود).", "بعد <code dir=\"ltr\">docker compose down<\/code> ثم <code dir=\"ltr\">up -d<\/code> وجدت كل السجلات التي أدخلتها.", "استعدت ملف backup في container مؤقت ورأيت الجداول فيه.", "نشرت نسخة جديدة ثم رجعت للسابقة بتغيير <code dir=\"ltr\">APP_VERSION<\/code> فقط.", "من خارج السيرفر: الـ ports 5432 و 6379 و 8000 مغلقة."], "q": {"t": "c", "q": "أثناء التحدي الأخير نفّذ زميلك <code dir=\"ltr\">docker compose down -v<\/code> بالخطأ على السيرفر. ما الذي ينقذ البيانات؟", "e": "<code dir=\"ltr\">-v<\/code> يحذف الـ volumes نهائياً، ولا يوجد تراجع. لا ينقذ البيانات إلا نسخة احتياطية.", "o": [{"h": "إعادة <code dir=\"ltr\">docker compose up -d<\/code> فوراً", "c": 0}, {"h": "<code dir=\"ltr\">docker volume ls<\/code> لاسترجاع الـ volume", "c": 0}, {"h": "آخر b     m.test.forEach((q,i)=>wrap.append(el('div',{class:'tq'},el('div',{class:'qn'},'السؤال '+(i+1)+' من '+m.test.length),quiz(q,o=>{n++;if(o)ok++;if(n===m.test.length)fin()},false))));
    function fin(){const sc=ok/n,r=S.tests[m.id]||{best:0};r.last=sc;r.best=Math.max(r.best,sc);S.tests[m.id]=r;save();refresh();
      res.className='res '+(sc>=.7?'ok':'bad');res.textContent='نتيجتك: '+ok+' من '+n+' ('+Math.round(sc*100)+'%) — '+(sc>=.7?'نجحت في اختبار المرحلة.':'لم تصل إلى 70%. راجع المفاهيم التي أخطأت فيها ثم أعد الاختبار.');
      res.append(el('div',{},el('button',{class:'btn',type:'button',onclick:()=>{build();wrap.scrollIntoView()}},'إعادة الاختبار')));}
    wrap.append(res);enh(wrap);
  }
  build();return wrap;
}
function projPage(){
  const P=D.proj;
  main.append(el('div',{class:'crumb'},'التطبيق العملي'),el('h1',{},P.title),el('div',{class:'prose',html:P.intro}));
  P.tasks.forEach((t,j)=>{
    const st=el('span',{class:'st'}),d=el('details',{class:'task',id:t.id});
    const mark=()=>{const dn=taskDone(t);d.classList.toggle('done',dn);st.textContent=dn?'✓':(j+1)};
    const upd=()=>{save();mark();refresh()};
    d.append(el('summary',{},st,el('span',{class:'ct'},'المهمة '+(j+1)+': '+t.title)));
    const ta=el('textarea',{placeholder:'اكتب هنا محاولتك: الأوامر أو الملفات التي كتبتها وما لاحظته…',spellcheck:'false'});ta.value=S.att[t.id]||'';
    const solBtn=el('button',{class:'btn',type:'button'});const solBox=el('div',{class:'solbox prose',html:'<h4>الحل المرجعي</h4>'+t.sol,hidden:!S.sol[t.id]});
    const solState=()=>{const ready=ta.value.trim().length>=20;solBtn.disabled=!ready&&!S.sol[t.id];solBtn.textContent=S.sol[t.id]?'إخفاء / إظهار الحل المرجعي':(ready?'أظهر الحل المرجعي لأقارنه بمحاولتي':'اكتب محاولتك أولاً لفتح الحل المرجعي')};
    ta.oninput=()=>{S.att[t.id]=ta.value;save();solState()};
    solBtn.onclick=()=>{if(!S.sol[t.id]){S.sol[t.id]=1;save();solBox.hidden=false}else solBox.hidden=!solBox.hidden;solState()};
    solState();
    const body=el('div',{class:'cbody'},el('div',{class:'prose',html:t.html}),
      el('h4',{},'تلميحات اختيارية'),t.hints.map((h,i)=>el('details',{class:'hint'},el('summary',{},'تلميح '+(i+1)),el('div',{class:'prose',html:h}))),
      el('h4',{},'محاولتك'),ta,el('div',{class:'tools'},solBtn),solBox,
      el('h4',{class:'qh'},'Checkpoint: تحقق بنفسك'),t.checks.map((c,i)=>{const id=t.id+'_'+i,cb=el('input',{type:'checkbox',id:'x'+id});cb.checked=!!S.chk[id];cb.onchange=()=>{if(cb.checked)S.chk[id]=1;else delete S.chk[id];upd()};return el('div',{class:'chk'},cb,el('label',{for:'x'+id,html:c}))}),
      el('h4',{class:'qh'},'سؤال الـ Checkpoint'),quiz(t.q,ok=>{if(ok&&!S.done[t.id+'q']){S.done[t.id+'q']=1;upd()}},true));
    d.append(body);mark();main.append(d);
  });
  const ft=P.tasks.find(t=>!taskDone(t));if(ft)document.getElementById(ft.id).open=true;
  main.append(finalBox());
  main.append(pager([D.mods[D.mods.length-1].id,D.mods[D.mods.length-1].title],null));
}
function finalBox(){
  const F=D.proj.final,wrap=el('section',{class:'test',id:'final'});
  function build(){
    wrap.innerHTML='';
    wrap.append(el('h2',{},F.title),el('div',{class:'prose',html:F.intro}));
    const ver=el('div');
    const calc=()=>{
      const qa=Object.keys(S.fin.q).length,ra=F.rubric.filter((_,i)=>S.fin.r[i]!=null).length;
      if(qa<F.qs.length||ra<F.rubric.length){ver.className='mut';ver.textContent='أجب عن كل الأسئلة ('+qa+'/'+F.qs.length+') وقيّم كل بنود المهارات ('+ra+'/'+F.rubric.length+') لتظهر نتيجتك النهائية.';return}
      const qs=Object.values(S.fin.q).filter(Boolean).length/F.qs.length,rs=F.rubric.reduce((a,_,i)=>a+(+S.fin.r[i]),0)/(2*F.rubric.length);
      const tot=Math.round((qs*.5+rs*.5)*100);
      const lv=tot>=85?['جاهز لاستخدام Docker في Production','تستطيع بناء ونشر تطبيق متعدد الخدمات باستقلالية. الخطوة التالية: CI/CD أعمق ثم Kubernetes.']:tot>=65?['فهم عملي جيد','تتقن الأساسيات وتحتاج تثبيت بعض النقاط. راجع البنود التي قيّمتها بـ «جزئياً» أو «لا» وأعد تنفيذ مهامها.']:['تحتاج مراجعة','ارجع إلى المراحل المرتبطة بالأسئلة التي أخطأت فيها، ثم أعد تنفيذ المشروع من المهمة الأولى دون النظر للحلول.'];
      ver.className='verdict';ver.innerHTML='<div class="big">'+tot+'%</div><b>'+lv[0]+'</b><div>'+lv[1]+'</div><div class="mut">الأسئلة: '+Math.round(qs*100)+'% · التقييم الذاتي للمهارات: '+Math.round(rs*100)+'%</div>';
      if(!S.done.final){S.done.final=1;save();refresh()}
    };
    wrap.append(el('h3',{},'الجزء الأول: حالات عملية'));
    F.qs.forEach((q,i)=>wrap.append(el('div',{class:'tq'},el('div',{class:'qn'},'الحالة '+(i+1)+' من '+F.qs.length+(S.fin.q[i]!=null?' — أجبت عنها سابقاً ('+(S.fin.q[i]?'صحيحة':'خاطئة')+')':'')),quiz(q,o=>{if(S.fin.q[i]==null){S.fin.q[i]=o;save();calc()}},false))));
    wrap.append(el('h3',{},'الجزء الثاني: هل تستطيع فعل هذا وحدك؟'),el('p',{class:'mut'},'قيّم نفسك بصدق: «نعم» تعني أنك فعلتها دون النظر إلى الحل.'));
    F.rubric.forEach((r,i)=>{const s=el('select',{},el('option',{value:''},'اختر…'),el('option',{value:'2'},'نعم، وحدي'),el('option',{value:'1'},'جزئياً / بمساعدة'),el('option',{value:'0'},'لا'));s.value=S.fin.r[i]!=null?String(S.fin.r[i]):'';s.onchange=()=>{if(s.value==='')delete S.fin.r[i];else S.fin.r[i]=+s.value;save();calc()};wrap.append(el('div',{class:'rub'},el('span',{html:r}),s))});
    wrap.append(ver,el('div',{class:'tools'},el('button',{class:'btn',type:'button',onclick:()=>{S.fin={q:{},r:{}};delete S.done.final;save();refresh();build()}},'إعادة التقييم النهائي')));
    calc();enh(wrap);
  }
  build();return wrap;
}
function route(){
  const[pid,sub]=(location.hash.slice(1)||'home').split('/');
  const m=D.mods.find(x=>x.id===pid);cur=m?m.id:(pid==='project'?'project':'home');
  main.innerHTML='';document.body.classList.remove('nav');
  if(m)modPage(m);else if(cur==='project')projPage();else homePage();
  enh(main);refresh();
  const t=sub&&document.getElementById(sub);
  if(t){if(t.tagName==='DETAILS')t.open=true;t.scrollIntoView()}else window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
$('#menu').onclick=()=>document.body.classList.toggle('nav');
(()=>{const b=$('#reset');let tm;b.onclick=()=>{if(b.classList.contains('arm')){clearTimeout(tm);S=blank();try{localStorage.removeItem(KEY)}catch(e){}b.classList.remove('arm');b.textContent='إعادة ضبط التقدم';if(location.hash&&location.hash!=='#home')location.hash='#home';else route()}else{b.classList.add('arm');b.textContent='اضغط مرة أخرى للتأكيد';tm=setTimeout(()=>{b.classList.remove('arm');b.textContent='إعادة ضبط التقدم'},4000)}}})();
route();
</script>
