<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دورة Docker التفاعلية — من المبتدئ إلى Production</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#17212f;--mut:#5d6a7b;--line:#dde3ec;--acc:#1561c9;--acc2:#e7f0fc;--ok:#0f7a56;--okbg:#e3f5ec;--bad:#b83228;--badbg:#fcebe9;--warn:#8a5d00;--warnbg:#fff4d6;--code:#101b2c;--codeink:#e4ebf5;--side:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0d131b;--card:#151e2b;--ink:#e5eaf1;--mut:#98a5b6;--line:#283444;--acc:#63a6ff;--acc2:#15263c;--ok:#52c99d;--okbg:#10291f;--bad:#ff8a7e;--badbg:#33191a;--warn:#f0c15a;--warnbg:#2e2610;--code:#0a111b;--codeink:#dfe7f2;--side:#121a25}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,Arial,sans-serif;font-size:16.5px;line-height:1.9}
a{color:var(--acc);text-decoration:none}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px}
header .brand{font-weight:700;font-size:17px;white-space:nowrap}
header .brand span{color:var(--acc)}
.pbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.ptxt{font-size:14px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 14px;font-size:14.5px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.danger.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
#menu{display:none}
.wrap{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 56px)}
aside{background:var(--side);border-inline-end:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
aside a.top{display:block;padding:8px 12px;border-radius:8px;color:var(--ink);font-weight:600;font-size:15px}
aside a.top.on,aside details.on>summary{background:var(--acc2)}
aside details{margin:2px 0}
aside summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:15px}
aside summary::-webkit-details-marker{display:none}
aside summary::before{content:"‹";color:var(--mut);transition:transform .2s;font-size:18px;line-height:1}
aside details[open]>summary::before{transform:rotate(-90deg)}
aside summary a{color:var(--ink);font-weight:600;flex:1}
aside .cnt{font-size:12.5px;color:var(--mut);background:var(--bg);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
aside .cnt.full{background:var(--okbg);color:var(--ok)}
aside .sub{padding:2px 26px 8px 6px;display:flex;flex-direction:column}
aside .sub a{font-size:14px;color:var(--mut);padding:3px 8px;border-radius:6px;line-height:1.6}
aside .sub a:hover{background:var(--bg);color:var(--ink)}
aside .sub a.dn::before{content:"✓ ";color:var(--ok);font-weight:700}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:940px;width:100%;margin:0 auto;min-width:0;overflow-wrap:break-word}
h1{font-size:28px;line-height:1.5;margin:4px 0 10px}
h2{font-size:22px;margin:26px 0 8px}
h3{font-size:18.5px;margin:22px 0 6px}
h4{font-size:16.5px;margin:16px 0 4px}
.crumb{font-size:14px;color:var(--acc);font-weight:600}
.mut{color:var(--mut)}
.prose p{margin:8px 0}
.prose ul,.prose ol{margin:8px 0;padding-inline-start:24px}
.prose li{margin:3px 0}
code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:.88em;background:var(--acc2);color:var(--ink);padding:1px 6px;border-radius:5px;unicode-bidi:isolate;overflow-wrap:anywhere}
pre{position:relative;background:var(--code);color:var(--codeink);border-radius:10px;padding:14px 16px;overflow:auto;text-align:left;line-height:1.65;margin:12px 0;font-size:14px}
pre code{background:none;color:inherit;padding:0;white-space:pre;font-size:inherit}
pre .cp{position:absolute;top:6px;right:6px;font-size:12px;background:#ffffff1a;color:#cfd8e6;border:0;border-radius:6px;padding:2px 9px}
pre .cp:hover{background:#ffffff33}
math{font-size:1.12em;unicode-bidi:isolate}
.mblock{text-align:center;margin:12px 0;overflow-x:auto}
.mblock math{font-size:1.25em}
.note,.warn{border-radius:10px;padding:10px 14px;margin:12px 0;border-inline-start:4px solid var(--acc);background:var(--acc2)}
.warn{border-color:var(--warn);background:var(--warnbg)}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
th{background:var(--acc2)}
.tools{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
details.concept,details.task{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;scroll-margin-top:70px}
details.concept>summary,details.task>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;font-weight:600}
details.concept>summary::-webkit-details-marker,details.task>summary::-webkit-details-marker{display:none}
.st{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.done>summary .st{background:var(--ok);border-color:var(--ok);color:#fff}
.ct{flex:1}
details.concept>summary::after,details.task>summary::after{content:"＋";color:var(--mut)}
details[open].concept>summary::after,details[open].task>summary::after{content:"－"}
details[open].concept>summary,details[open].task>summary{border-bottom:1px solid var(--line)}
.cbody{padding:8px 18px 18px}
.qh{margin-top:20px;color:var(--acc)}
.quiz{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;background:var(--bg)}
.qtype{font-size:12.5px;color:var(--mut);font-weight:600}
.qtext{font-weight:600;margin:2px 0 8px}
.opts{display:grid;gap:7px}
.opt{text-align:start;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;line-height:1.7}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default;opacity:.85}
.opt.right{border-color:var(--ok);background:var(--okbg);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--badbg);opacity:1}
.tfrow{display:flex;gap:8px}
.tfrow .opt{flex:1;text-align:center}
.short{display:flex;gap:8px;flex-wrap:wrap}
.short input{flex:1;min-width:180px;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);direction:ltr;text-align:left}
.fb{margin-top:10px;border-radius:8px;padding:9px 12px;font-size:15.5px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb b{display:block}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb .btn{margin-top:8px;margin-inline-end:6px}
section.test{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:6px 18px 18px;margin-top:28px;scroll-margin-top:70px}
.tq{margin:14px 0}
.qn{font-size:13px;color:var(--acc);font-weight:700}
.res{margin-top:14px;border-radius:10px;padding:12px 14px;font-weight:600}
.res:empty{display:none}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px}
.pager .btn{white-space:normal}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:14px 0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.card:hover{border-color:var(--acc)}
.card small{color:var(--mut);display:block}
.card .pbar{margin-top:8px;height:6px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:14px;direction:ltr;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);line-height:1.6}
details.hint{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--bg)}
details.hint>summary{cursor:pointer;padding:6px 12px;font-weight:600;color:var(--warn)}
details.hint>div{padding:0 14px 10px}
.solbox{border:1px solid var(--ok);border-radius:10px;padding:4px 14px 10px;margin-top:10px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:9px;width:17px;height:17px;flex:none}
.rub{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
.rub select{font:inherit;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.verdict{border-radius:12px;padding:16px;margin-top:16px;background:var(--acc2);border:1px solid var(--acc)}
.verdict .big{font-size:30px;font-weight:700;color:var(--acc)}
@media(max-width:860px){
#menu{display:inline-block}
.wrap{display:block}
aside{position:fixed;top:56px;right:0;width:min(320px,88vw);transform:translateX(105%);transition:transform .25s;z-index:15;box-shadow:0 0 30px #0004}
body.nav aside{transform:none}
header{gap:8px;padding:8px 10px}
header .brand{font-size:15px}
header .brand .long,.ptxt{display:none}
.btn{padding:6px 10px;font-size:13.5px}
.pager{flex-direction:column}
.pager .btn{white-space:normal;text-align:center}
}
</style>
</head>
<body>
<header>
<button class="btn" id="menu" aria-label="القائمة">☰</button>
<div class="brand"><span>Docker</span><b class="long"> — الدورة التفاعلية</b></div>
<div class="pbar" title="التقدم الكلي"><i id="pb"></i></div>
<div class="ptxt" id="pt"></div>
<button class="btn danger" id="reset">إعادة ضبط التقدم</button>
</header>
<div class="wrap">
<aside><nav id="nav"></nav></aside>
<main id="main"></main>
</div>
<script>
const D={"home": "<h3>كيف تعمل هذه الدورة؟<\/h3><ul><li>كل مرحلة مقسّمة إلى مفاهيم صغيرة. افتح المفهوم، اقرأ الشرح، ثم أجب عن سؤاله. لا يُحتسب المفهوم منجزاً إلا بعد إجابة صحيحة.<\/li><li>في نهاية كل مرحلة اختبار أشمل، وتحتاج فيه إلى 70% للنجاح.<\/li><li>في النهاية مشروع عملي من 10 مهام متدرجة، ثم تقييم نهائي.<\/li><li>الإجابات والشروحات لا تظهر إلا بعد أن تحاول.<\/li><li>تقدّمك يُحفظ تلقائياً في هذا المتصفح ويبقى بعد تحديث الصفحة. زر «إعادة ضبط التقدم» في الأعلى يمسحه.<\/li><li>أهم نصيحة: نفّذ كل أمر بيدك في الـ Terminal. القراءة وحدها لا تعلّم Docker.<\/li><\/ul><h3>ما الذي صحّحته في الـ Roadmap قبل البدء؟<\/h3><p>الخطة الأصلية جيدة وترتيبها العام سليم، لذلك أبقيت على أهدافها ومراحلها السبع. هذه التعديلات فقط:<\/p><div class=\"tw\"><table><thead><tr><th>الموضع<\/th><th>المشكلة<\/th><th>التصحيح<\/th><\/tr><\/thead><tbody><tr><td>Prerequisites<\/td><td>ينقصها ما ستحتاجه لاحقاً: الـ users و<code dir=\"ltr\">sudo<\/code>، الـ signals، الـ pipes، و YAML<\/td><td>أضفتها، لأن <code dir=\"ltr\">USER<\/code> و <code dir=\"ltr\">docker stop<\/code> و <code dir=\"ltr\">compose.yaml<\/code> تعتمد عليها<\/td><\/tr><tr><td>Stage 1<\/td><td>«كيف يعمل Docker داخلياً» بلا تفاصيل، ولا يوجد تثبيت Docker<\/td><td>أضفت namespaces و cgroups و containerd بشكل مبسط، والتثبيت والتحقق منه<\/td><\/tr><tr><td>Stage 1<\/td><td>الـ image tags مؤجلة إلى Stage 3 مع أن <code dir=\"ltr\">docker pull<\/code> يحتاجها<\/td><td>قدّمت تسمية الـ images (<code dir=\"ltr\">name:tag<\/code>) إلى Stage 1<\/td><\/tr><tr><td>Stage 2<\/td><td>أوامر أساسية ناقصة<\/td><td>أضفت <code dir=\"ltr\">start<\/code> و <code dir=\"ltr\">restart<\/code> و <code dir=\"ltr\">--name<\/code> و <code dir=\"ltr\">--rm<\/code> و <code dir=\"ltr\">rmi<\/code> و <code dir=\"ltr\">cp<\/code> و <code dir=\"ltr\">prune<\/code> و exit codes<\/td><\/tr><tr><td>Stage 3<\/td><td>ينقصها الفرق بين exec form و shell form، و <code dir=\"ltr\">COPY<\/code> مقابل <code dir=\"ltr\">ADD<\/code><\/td><td>أضفتها لأنها سبب أخطاء شائعة في إيقاف الـ containers<\/td><\/tr><tr><td>Stage 5<\/td><td>لا تفرّق بين default bridge و user-defined bridge<\/td><td>أضفت الفرق، لأن الـ DNS بين الـ containers يعمل في الثاني فقط<\/td><\/tr><tr><td>Stage 6<\/td><td><code dir=\"ltr\">depends_on<\/code> وحده لا ينتظر جاهزية قاعدة البيانات<\/td><td>ربطته بـ <code dir=\"ltr\">condition: service_healthy<\/code><\/td><\/tr><tr><td>Stage 6<\/td><td>معلومات قديمة شائعة<\/td><td>الأمر الحالي هو <code dir=\"ltr\">docker compose<\/code> (بمسافة)، وحقل <code dir=\"ltr\">version:<\/code> لم يعد مطلوباً<\/td><\/tr><tr><td>Stage 6 و 7<\/td><td>Health checks و Restart policies مكررة في المرحلتين<\/td><td>تُشرح مرة في Stage 6، وفي Stage 7 نطبّقها بمنظور Production فقط<\/td><\/tr><tr><td>Stage 7<\/td><td>الأمان ينقصه إدارة الـ secrets عملياً، والـ firewall<\/td><td>أضفت build secrets وملاحظة أن الـ published ports تتجاوز <code dir=\"ltr\">ufw<\/code><\/td><\/tr><tr><td>Stage 7<\/td><td>الـ Registry يأتي بعد أن احتجنا <code dir=\"ltr\">docker push<\/code><\/td><td>رتّبت النشر: Registry ثم VPS ثم التحديث ثم CI/CD<\/td><\/tr><tr><td>المشروع<\/td><td>تشغيل 7 containers يدوياً ثم الانتقال إلى Compose في الخطوة 8 غير عملي<\/td><td>Compose يدخل من المهمة الثالثة، و React يُبنى بـ multi-stage ويُقدَّم عبر Caddy في Production<\/td><\/tr><\/tbody><\/table><\/div><h3>المدة الواقعية<\/h3><p>مجموع أيام المراحل السبع في الخطة الأصلية بين <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>5<\/mn><mo>&#x0002B;<\/mo><mn>7<\/mn><mo>&#x0003D;<\/mo><mn>27<\/mn><\/mrow><\/math> و <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>5<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>6<\/mn><mo>&#x0002B;<\/mo><mn>10<\/mn><mo>&#x0003D;<\/mo><mn>36<\/mn><\/mrow><\/math> يوماً. بإضافة الـ Prerequisites والمشروع النهائي تصبح المدة الواقعية من 6 إلى 8 أسابيع بمعدل 45–60 دقيقة يومياً.<\/p>", "mods": [{"id": "m1", "title": "المتطلبات (أ): Linux والـ Terminal", "badge": "Prerequisites", "dur": "2–3 أيام", "intro": "<p>كل تعاملك مع Docker سيكون عبر أوامر نصية، وداخل أي container ستجد نظام Linux مصغّراً. لا تحتاج إدارة أنظمة متقدمة، تحتاج فقط ما في هذه المرحلة.<\/p>", "cs": [{"id": "m1c1", "title": "الـ Terminal والـ Shell", "html": "<p>الـ <b>Terminal<\/b> نافذة نصية تكتب فيها الأوامر بدل الضغط على الأزرار. الـ <b>Shell<\/b> هو البرنامج الذي يعمل داخلها: يقرأ ما كتبته، يفهمه، ثم يطلب من نظام التشغيل تنفيذه. أشهر shell في Linux هو <code dir=\"ltr\">bash<\/code>، وفي الـ images الصغيرة تجد غالباً <code dir=\"ltr\">sh<\/code> فقط.<\/p><p>تشبيه: الـ Terminal هو شبّاك المطعم، والـ Shell هو النادل الذي ينقل طلبك إلى المطبخ (نظام التشغيل).<\/p><p>شكل أي أمر: اسم الأمر، ثم خيارات (options) تبدأ بـ <code dir=\"ltr\">-<\/code>، ثم المدخلات (arguments):<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>ls -l /home<\/code><\/pre><p>هنا <code dir=\"ltr\">ls<\/code> هو الأمر، و <code dir=\"ltr\">-l<\/code> خيار، و <code dir=\"ltr\">/home<\/code> هو الـ argument.<\/p>", "q": {"t": "m", "q": "ما وظيفة الـ Shell؟", "e": "الـ Shell مفسِّر أوامر. الـ Terminal هو النافذة فقط، والـ Shell هو البرنامج الذي يفهم الأمر وينفّذه.", "o": [{"h": "نافذة رسومية لعرض الملفات", "c": 0}, {"h": "برنامج يقرأ الأوامر التي تكتبها ويطلب من نظام التشغيل تنفيذها", "c": 1}, {"h": "اسم آخر لنظام التشغيل Linux", "c": 0}, {"h": "أداة لتثبيت Docker", "c": 0}]}}, {"id": "m1c2", "title": "الـ Directory والتنقل: pwd و ls و cd", "html": "<p>الـ <b>directory<\/b> هو المجلد: مكان يحوي ملفات ومجلدات أخرى. في Linux كل شيء يتفرع من مجلد واحد اسمه الجذر <code dir=\"ltr\">/<\/code>.<\/p><ul><li><code dir=\"ltr\">pwd<\/code> يطبع المجلد الذي تقف فيه الآن.<\/li><li><code dir=\"ltr\">ls<\/code> يعرض محتويات المجلد (<code dir=\"ltr\">ls -la<\/code> يعرض التفاصيل والملفات المخفية).<\/li><li><code dir=\"ltr\">cd<\/code> ينقلك إلى مجلد آخر.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>pwd          # /home/ali\nls -la\ncd /var/log  # absolute path: يبدأ من الجذر /\ncd ..        # المجلد الأب\ncd projects  # relative path: نسبةً لمكانك الحالي<\/code><\/pre><p>الـ <b>absolute path<\/b> يبدأ بـ <code dir=\"ltr\">/<\/code> ويعمل من أي مكان. الـ <b>relative path<\/b> يعتمد على مكانك الحالي. الرمز <code dir=\"ltr\">.<\/code> يعني المجلد الحالي و <code dir=\"ltr\">..<\/code> يعني المجلد الأب. ستحتاج هذا كثيراً، فالنقطة في <code dir=\"ltr\">docker build .<\/code> تعني «المجلد الحالي».<\/p>", "q": {"t": "s", "q": "اكتب الأمر الذي يطبع مسار المجلد الذي تقف فيه حالياً.", "e": "<code dir=\"ltr\">pwd<\/code> اختصار print working directory. أما <code dir=\"ltr\">ls<\/code> فيعرض المحتويات و <code dir=\"ltr\">cd<\/code> ينقلك.", "r": "^pwd$", "m": "<code dir=\"ltr\">pwd<\/code>"}}, {"id": "m1c3", "title": "إدارة الملفات: mkdir و rm و cp و mv", "html": "<ul><li><code dir=\"ltr\">mkdir name<\/code> ينشئ مجلداً (<code dir=\"ltr\">mkdir -p a/b/c<\/code> ينشئ السلسلة كلها).<\/li><li><code dir=\"ltr\">cp src dst<\/code> ينسخ ملفاً (<code dir=\"ltr\">cp -r<\/code> لنسخ مجلد بمحتوياته).<\/li><li><code dir=\"ltr\">mv src dst<\/code> ينقل أو يعيد التسمية.<\/li><li><code dir=\"ltr\">rm file<\/code> يحذف ملفاً (<code dir=\"ltr\">rm -r dir<\/code> يحذف مجلداً بمحتوياته).<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>mkdir -p app/static\ncp settings.py settings.backup.py\nmv old.txt new.txt\nrm -r app/static<\/code><\/pre><div class=\"warn\">في Linux لا توجد سلة مهملات مع <code dir=\"ltr\">rm<\/code>. ما يُحذف لا يعود، فتأكد من المسار قبل <code dir=\"ltr\">rm -r<\/code>.<\/div>", "q": {"t": "m", "q": "ماذا يفعل الأمر <code dir=\"ltr\">mv report.txt final.txt<\/code> داخل نفس المجلد؟", "e": "<code dir=\"ltr\">mv<\/code> ينقل، والنقل داخل نفس المجلد باسم مختلف هو إعادة تسمية. النسخ مع إبقاء الأصل هو عمل <code dir=\"ltr\">cp<\/code>.", "o": [{"h": "ينسخ الملف باسم جديد ويبقي الأصل", "c": 0}, {"h": "يعيد تسمية الملف إلى <code dir=\"ltr\">final.txt<\/code>", "c": 1}, {"h": "يحذف الملفين", "c": 0}, {"h": "يدمج محتوى الملفين", "c": 0}]}}, {"id": "m1c4", "title": "قراءة الملفات والبحث: cat و grep والـ pipe", "html": "<ul><li><code dir=\"ltr\">cat file<\/code> يطبع محتوى الملف على الشاشة.<\/li><li><code dir=\"ltr\">grep word file<\/code> يعرض فقط الأسطر التي تحوي الكلمة.<\/li><li>الـ <b>pipe<\/b> <code dir=\"ltr\">|<\/code> يأخذ ناتج الأمر الأول ويعطيه مدخلاً للأمر الثاني.<\/li><li>الـ <b>redirection<\/b> <code dir=\"ltr\">&gt;<\/code> يكتب الناتج في ملف بدل الشاشة.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>cat requirements.txt\ngrep ERROR app.log\ncat app.log | grep ERROR       # نفس النتيجة عبر pipe\nls -la &gt; files.txt             # احفظ الناتج في ملف<\/code><\/pre><p>ستستخدم هذا النمط مع Docker كثيراً، مثل <code dir=\"ltr\">docker logs web | grep ERROR<\/code>.<\/p>", "q": {"t": "m", "q": "ماذا يفعل الرمز <code dir=\"ltr\">|<\/code> بين أمرين؟", "e": "الـ pipe يربط ناتج أمر بمدخل الأمر التالي. الكتابة في ملف تكون بـ <code dir=\"ltr\">&gt;<\/code>.", "o": [{"h": "ينفّذ الأمرين في نفس اللحظة دون علاقة بينهما", "c": 0}, {"h": "يكتب ناتج الأمر الأول في ملف", "c": 0}, {"h": "يمرّر ناتج الأمر الأول كمدخل للأمر الثاني", "c": 1}, {"h": "يلغي الأمر الثاني إذا فشل الأول", "c": 0}]}}, {"id": "m1c5", "title": "الـ File permissions والأمر chmod", "html": "<p>كل ملف في Linux له ثلاث صلاحيات: <b>r<\/b> (قراءة)، <b>w<\/b> (كتابة)، <b>x<\/b> (تنفيذ)، وتُحدَّد لثلاث فئات: المالك (owner)، المجموعة (group)، والبقية (others).<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>ls -l run.sh\n# -rwxr-xr-- 1 ali dev 120 run.sh<\/code><\/pre><p>اقرأها ثلاثاً ثلاثاً: <code dir=\"ltr\">rwx<\/code> للمالك، <code dir=\"ltr\">r-x<\/code> للمجموعة، <code dir=\"ltr\">r--<\/code> للبقية.<\/p><p>لكل صلاحية رقم: <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>r<\/mtext><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>، <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>w<\/mtext><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>، <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>x<\/mtext><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>، ونجمعها لكل فئة. مثلاً <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>rwx<\/mtext><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>7<\/mn><\/mrow><\/math> و <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>r-x<\/mtext><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>. لذلك:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>chmod 755 run.sh   # المالك: كل شيء، الآخرون: قراءة وتنفيذ\nchmod +x run.sh    # أضف صلاحية التنفيذ<\/code><\/pre><p>لماذا يهم؟ من أشهر أخطاء Docker: <code dir=\"ltr\">permission denied<\/code> عند تشغيل <code dir=\"ltr\">entrypoint.sh<\/code> لأنه بلا صلاحية <code dir=\"ltr\">x<\/code>.<\/p>", "q": {"t": "s", "q": "ما الرقم الذي يمثل الصلاحيات <code dir=\"ltr\">rw-<\/code> لفئة واحدة؟ (اكتب رقماً واحداً)", "e": "<math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>r<\/mtext><mo>&#x0002B;<\/mo><mtext>w<\/mtext><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>. لا توجد صلاحية تنفيذ فلا نضيف 1.", "r": "^6$", "m": "6"}}, {"id": "m1c6", "title": "الـ Users: root و sudo", "html": "<p>Linux نظام متعدد المستخدمين. المستخدم <b>root<\/b> يملك كل الصلاحيات: يحذف أي ملف ويغيّر أي إعداد. المستخدم العادي مقيّد بملفاته.<\/p><ul><li><code dir=\"ltr\">whoami<\/code> يطبع اسم المستخدم الحالي.<\/li><li><code dir=\"ltr\">sudo command<\/code> ينفّذ أمراً واحداً بصلاحيات root.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>whoami\nsudo apt update<\/code><\/pre><p>لماذا يهم؟ داخل الـ container، البرنامج يعمل افتراضياً كـ root. إذا اختُرق تطبيقك فالمهاجم يصبح root داخل الـ container. لهذا سنتعلم لاحقاً التعليمة <code dir=\"ltr\">USER<\/code> لتشغيل التطبيق بمستخدم عادي.<\/p>", "q": {"t": "t", "q": "المستخدم root يخضع لنفس قيود الصلاحيات التي يخضع لها المستخدم العادي.", "e": "root يتجاوز قيود الصلاحيات كلها تقريباً. لذلك تشغيل التطبيقات به خطر، سواء على الجهاز أو داخل container.", "a": false}}, {"id": "m1c7", "title": "الـ Process والـ PID والـ Signals", "html": "<p><b>البرنامج<\/b> ملف ساكن على القرص. <b>الـ process<\/b> هو البرنامج وهو يعمل فعلاً في الذاكرة. لكل process رقم فريد اسمه <b>PID<\/b>.<\/p><ul><li><code dir=\"ltr\">ps aux<\/code> يعرض الـ processes العاملة.<\/li><li><code dir=\"ltr\">kill PID<\/code> يرسل للـ process إشارة (<b>signal<\/b>) تطلب منه التوقف.<\/li><\/ul><p>أهم إشارتين:<\/p><ul><li><b>SIGTERM<\/b>: طلب مهذب: «أنهِ عملك واخرج». البرنامج يستطيع حفظ بياناته أولاً.<\/li><li><b>SIGKILL<\/b>: إنهاء فوري بالقوة (<code dir=\"ltr\">kill -9 PID<\/code>)، دون فرصة للحفظ.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>ps aux | grep python\nkill 4312       # SIGTERM\nkill -9 4312    # SIGKILL<\/code><\/pre><p>لماذا يهم؟ الـ container في حقيقته process معزول. والأمر <code dir=\"ltr\">docker stop<\/code> يرسل SIGTERM ثم SIGKILL إن لم يستجب البرنامج.<\/p>", "q": {"t": "m", "q": "ما الفرق بين SIGTERM و SIGKILL؟", "e": "SIGTERM يعطي البرنامج فرصة لإغلاق الاتصالات وحفظ البيانات. SIGKILL لا يمكن للبرنامج اعتراضه فينتهي فوراً.", "o": [{"h": "SIGTERM طلب إنهاء يسمح للبرنامج بالتنظيف، و SIGKILL إنهاء فوري بالقوة", "c": 1}, {"h": "SIGTERM يعيد تشغيل البرنامج، و SIGKILL يوقفه مؤقتاً", "c": 0}, {"h": "لا فرق، هما اسمان لنفس الإشارة", "c": 0}, {"h": "SIGKILL أخف من SIGTERM", "c": 0}]}}, {"id": "m1c8", "title": "الـ Environment variables", "html": "<p><b>الـ environment variable<\/b> قيمة لها اسم، يخزّنها النظام ويقرؤها أي برنامج عند تشغيله. نستخدمها لتمرير الإعدادات (مثل كلمة سر قاعدة البيانات) دون كتابتها داخل الكود.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>export DB_HOST=localhost   # عرّف متغيراً\necho $DB_HOST              # اقرأ قيمته\nenv                        # اعرض كل المتغيرات<\/code><\/pre><p>وفي Python تقرؤه هكذا:<\/p><pre dir=\"ltr\" data-lang=\"python\"><code>import os\nhost = os.environ.get(\"DB_HOST\", \"localhost\")<\/code><\/pre><p>الفائدة: نفس الكود يعمل في التطوير وفي Production، والذي يتغير هو قيم المتغيرات فقط. هذا بالضبط أسلوب إعداد الـ containers (<code dir=\"ltr\">-e<\/code> في Docker و <code dir=\"ltr\">environment<\/code> في Compose).<\/p>", "q": {"t": "m", "q": "لماذا نضع إعدادات مثل <code dir=\"ltr\">DB_PASSWORD<\/code> في environment variables بدل كتابتها في الكود؟", "e": "فصل الإعدادات عن الكود يجعل نفس الكود صالحاً لكل البيئات، ويمنع تسرب الأسرار إلى Git.", "o": [{"h": "لأن الكود يصبح أسرع", "c": 0}, {"h": "لنغيّر الإعدادات من بيئة لأخرى دون تعديل الكود، ولئلا تُحفظ الأسرار داخله", "c": 1}, {"h": "لأن Python لا يقبل النصوص الطويلة", "c": 0}, {"h": "لأن Linux يمنع كتابة كلمات السر في الملفات", "c": 0}]}}, {"id": "m1c9", "title": "مسارات Linux مقابل مسارات Windows", "html": "<div class=\"tw\"><table><thead><tr><th><\/th><th>Linux<\/th><th>Windows<\/th><\/tr><\/thead><tbody><tr><td>الفاصل<\/td><td><code dir=\"ltr\">/<\/code><\/td><td><code dir=\"ltr\">\\<\/code><\/td><\/tr><tr><td>البداية<\/td><td>جذر واحد <code dir=\"ltr\">/<\/code><\/td><td>حرف القرص مثل <code dir=\"ltr\">C:\\<\/code><\/td><\/tr><tr><td>مثال<\/td><td><code dir=\"ltr\">/home/ali/app<\/code><\/td><td><code dir=\"ltr\">C:\\Users\\ali\\app<\/code><\/td><\/tr><tr><td>حالة الأحرف<\/td><td><code dir=\"ltr\">App<\/code> و <code dir=\"ltr\">app<\/code> مختلفان<\/td><td>لا فرق<\/td><\/tr><\/tbody><\/table><\/div><p>لماذا يهم؟ الـ containers تعمل بنظام Linux حتى لو كان جهازك Windows. لذلك المسارات داخل الـ Dockerfile وداخل الـ container تُكتب دائماً بأسلوب Linux، مثل <code dir=\"ltr\">/app<\/code>. والملف <code dir=\"ltr\">Settings.py<\/code> ليس <code dir=\"ltr\">settings.py<\/code> داخل الـ container حتى لو قبله Windows.<\/p>", "q": {"t": "t", "q": "داخل Dockerfile نكتب المسارات الداخلية للـ container بأسلوب Windows إذا كان جهازنا Windows.", "e": "الـ container نظام Linux، فمساراته الداخلية بأسلوب Linux دائماً (<code dir=\"ltr\">/app/data<\/code>) مهما كان نظام جهازك.", "a": false}}], "test": [{"t": "m", "q": "أي أمر يعرض الأسطر التي تحوي كلمة <code dir=\"ltr\">ERROR<\/code> فقط من ملف <code dir=\"ltr\">app.log<\/code>؟", "e": "<code dir=\"ltr\">grep<\/code> يبحث عن نص داخل ملف ويعرض الأسطر المطابقة.", "o": [{"h": "<code dir=\"ltr\">cat ERROR app.log<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">grep ERROR app.log<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">ls ERROR app.log<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">cd app.log ERROR<\/code>", "c": 0}]}, {"t": "s", "q": "اكتب أمر <code dir=\"ltr\">chmod<\/code> بالأرقام الذي يعطي المالك <code dir=\"ltr\">rwx<\/code> والمجموعة <code dir=\"ltr\">r-x<\/code> والبقية <code dir=\"ltr\">r-x<\/code> للملف <code dir=\"ltr\">run.sh<\/code>.", "e": "<math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>rwx<\/mtext><mo>&#x0003D;<\/mo><mn>7<\/mn><\/mrow><\/math> و <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>r-x<\/mtext><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> و <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>r-x<\/mtext><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>، فالنتيجة 755.", "r": "^chmod 755 run\\.sh$", "m": "<code dir=\"ltr\">chmod 755 run.sh<\/code>"}, {"t": "t", "q": "الـ process هو برنامج في حالة تشغيل وله رقم PID خاص به.", "e": "البرنامج ملف ساكن، وعندما يعمل يصبح process برقم PID فريد.", "a": true}, {"t": "c", "q": "تطبيقك يحتاج عنوان قاعدة البيانات، وهو مختلف بين جهازك والسيرفر. ما الأسلوب الصحيح؟", "e": "الـ environment variables وُجدت لهذا: نفس الكود، وإعدادات تختلف حسب البيئة.", "o": [{"h": "كتابة العنوانين في الكود والتبديل بينهما يدوياً قبل كل نشر", "c": 0}, {"h": "قراءة العنوان من environment variable وتحديد قيمته في كل بيئة", "c": 1}, {"h": "إنشاء نسختين من المشروع", "c": 0}, {"h": "وضع العنوان في اسم الملف", "c": 0}]}, {"t": "m", "q": "ما معنى المسار <code dir=\"ltr\">..<\/code>؟", "e": "<code dir=\"ltr\">.<\/code> المجلد الحالي، <code dir=\"ltr\">..<\/code> المجلد الأب، <code dir=\"ltr\">/<\/code> الجذر.", "o": [{"h": "المجلد الحالي", "c": 0}, {"h": "مجلد الجذر", "c": 0}, {"h": "المجلد الأب للمجلد الحالي", "c": 1}, {"h": "مجلد المستخدم", "c": 0}]}, {"t": "m", "q": "أي عبارة صحيحة عن <code dir=\"ltr\">kill -9<\/code>؟", "e": "الرقم 9 هو SIGKILL. يُنهي الـ process فقط ولا يحذف أي ملف.", "o": [{"h": "يطلب من البرنامج الخروج بهدوء", "c": 0}, {"h": "يرسل SIGKILL فينتهي البرنامج فوراً دون فرصة للتنظيف", "c": 1}, {"h": "يعيد تشغيل البرنامج", "c": 0}, {"h": "يحذف ملف البرنامج من القرص", "c": 0}]}]}, {"id": "m2", "title": "المتطلبات (ب): أساسيات الـ Networking", "badge": "Prerequisites", "dur": "2–3 أيام", "intro": "<p>الـ containers تتحدث مع بعضها ومع العالم عبر الشبكة. نصف مشاكل Docker عند المبتدئين مشاكل شبكة: port خاطئ أو <code dir=\"ltr\">localhost<\/code> في غير موضعه.<\/p>", "cs": [{"id": "m2c1", "title": "نموذج Client-Server", "html": "<p>في أغلب تطبيقات الويب يوجد طرفان:<\/p><ul><li><b>الـ server<\/b>: برنامج يعمل باستمرار وينتظر الطلبات.<\/li><li><b>الـ client<\/b>: برنامج يرسل طلباً (request) وينتظر الرد (response).<\/li><\/ul><p>المتصفح client وتطبيق Django server. لكن الدور نسبي: Django نفسه يصبح client عندما يرسل استعلاماً إلى PostgreSQL.<\/p><p>تشبيه: المطعم server ينتظر، والزبون client يطلب. والمطعم نفسه زبون عند مورّد الخضار.<\/p>", "q": {"t": "m", "q": "عندما يرسل Django استعلاماً إلى PostgreSQL، من هو الـ client؟", "e": "الـ client هو من يبدأ الطلب. هنا Django يطلب و PostgreSQL يرد، فـ Django هو الـ client.", "o": [{"h": "PostgreSQL", "c": 0}, {"h": "Django", "c": 1}, {"h": "المتصفح", "c": 0}, {"h": "لا يوجد client في هذه الحالة", "c": 0}]}}, {"id": "m2c2", "title": "الـ IP address", "html": "<p><b>الـ IP address<\/b> عنوان رقمي يميّز كل جهاز على الشبكة، مثل <code dir=\"ltr\">192.168.1.10<\/code>. بدونه لا تعرف البيانات إلى أين تذهب، كعنوان البيت للبريد.<\/p><ul><li><b>Public IP<\/b>: عنوان يمكن الوصول إليه من الإنترنت (مثل عنوان السيرفر).<\/li><li><b>Private IP<\/b>: عنوان داخل شبكة محلية فقط، مثل <code dir=\"ltr\">192.168.x.x<\/code> و <code dir=\"ltr\">10.x.x.x<\/code> و <code dir=\"ltr\">172.16.x.x<\/code>.<\/li><\/ul><p>Docker يعطي كل container عنوان private خاصاً به (غالباً يبدأ بـ <code dir=\"ltr\">172.<\/code>) داخل شبكة افتراضية ينشئها على جهازك.<\/p>", "q": {"t": "t", "q": "الـ Private IP مثل <code dir=\"ltr\">192.168.1.5<\/code> يمكن الوصول إليه مباشرة من أي مكان في الإنترنت.", "e": "العناوين الخاصة تعمل داخل شبكتها المحلية فقط. الوصول من الإنترنت يحتاج Public IP.", "a": false}}, {"id": "m2c3", "title": "الـ Port", "html": "<p>الجهاز الواحد يشغّل عدة برامج شبكية معاً. <b>الـ port<\/b> رقم يحدد أي برنامج على الجهاز يستلم البيانات. الـ IP يوصلك إلى العمارة، والـ port هو رقم الشقة.<\/p><p>عدد الـ ports هو <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mrow><mn>16<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>65536<\/mn><\/mrow><\/math>، أي من 0 إلى 65535. أرقام شائعة:<\/p><div class=\"tw\"><table><thead><tr><th>Port<\/th><th>الخدمة<\/th><\/tr><\/thead><tbody><tr><td>80<\/td><td>HTTP<\/td><\/tr><tr><td>443<\/td><td>HTTPS<\/td><\/tr><tr><td>5432<\/td><td>PostgreSQL<\/td><\/tr><tr><td>6379<\/td><td>Redis<\/td><\/tr><tr><td>8000<\/td><td>Django (التطوير)<\/td><\/tr><\/tbody><\/table><\/div><p>قاعدة مهمة: لا يستطيع برنامجان الاستماع على نفس الـ port في نفس الجهاز. إن حاولت فسترى <code dir=\"ltr\">address already in use<\/code>.<\/p>", "q": {"t": "m", "q": "لماذا نحتاج الـ port مع وجود الـ IP address؟", "e": "الـ IP يحدد الجهاز، والـ port يحدد البرنامج داخل ذلك الجهاز.", "o": [{"h": "لتشفير البيانات", "c": 0}, {"h": "لتحديد أي برنامج على الجهاز يستلم البيانات", "c": 1}, {"h": "لزيادة سرعة الاتصال", "c": 0}, {"h": "لتحويل الاسم إلى عنوان", "c": 0}]}}, {"id": "m2c4", "title": "localhost و 127.0.0.1 و 0.0.0.0", "html": "<p><b><code dir=\"ltr\">localhost<\/code><\/b> اسم يشير إلى «هذا الجهاز نفسه»، وعنوانه <code dir=\"ltr\">127.0.0.1<\/code>. الاتصال به لا يخرج إلى الشبكة أبداً.<\/p><p>وهناك فرق مهم عند تشغيل server:<\/p><ul><li>إذا استمع على <code dir=\"ltr\">127.0.0.1<\/code> فلن يقبل إلا اتصالات من داخل نفس الجهاز.<\/li><li>إذا استمع على <code dir=\"ltr\">0.0.0.0<\/code> فسيقبل الاتصالات من كل واجهات الشبكة.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>python manage.py runserver 127.0.0.1:8000  # من نفس الجهاز فقط\npython manage.py runserver 0.0.0.0:8000    # من أي مكان يصل للجهاز<\/code><\/pre><div class=\"warn\">هذه أهم فكرة في المرحلة: لكل container الـ <code dir=\"ltr\">localhost<\/code> الخاص به. فإذا استمع Django داخل container على <code dir=\"ltr\">127.0.0.1<\/code> فلن يصل إليه أحد من خارجه. داخل الـ containers نستمع دائماً على <code dir=\"ltr\">0.0.0.0<\/code>.<\/div>", "q": {"t": "c", "q": "شغّلت Django داخل container بالأمر <code dir=\"ltr\">runserver 127.0.0.1:8000<\/code> ونشرت الـ port، لكن المتصفح على جهازك لا يصل للتطبيق. ما السبب الأرجح؟", "e": "<code dir=\"ltr\">127.0.0.1<\/code> داخل الـ container يعني الـ container نفسه فقط. الحل: <code dir=\"ltr\">runserver 0.0.0.0:8000<\/code>.", "o": [{"h": "الـ port 8000 محجوز دائماً لـ Docker", "c": 0}, {"h": "التطبيق يستمع على <code dir=\"ltr\">127.0.0.1<\/code> الخاص بالـ container فلا يقبل اتصالات من خارجه", "c": 1}, {"h": "Django لا يعمل داخل containers", "c": 0}, {"h": "يجب استخدام HTTPS دائماً", "c": 0}]}}, {"id": "m2c5", "title": "الـ DNS", "html": "<p>البشر يحفظون الأسماء، والشبكة تعمل بالأرقام. <b>الـ DNS<\/b> هو النظام الذي يحوّل اسماً مثل <code dir=\"ltr\">example.com<\/code> إلى IP address، كدليل الهاتف.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>nslookup example.com<\/code><\/pre><p>لماذا يهم؟ Docker يملك DNS داخلياً: داخل شبكة Docker يستطيع Django الوصول لقاعدة البيانات بالاسم <code dir=\"ltr\">db<\/code> بدل حفظ الـ IP الذي قد يتغير عند كل إعادة إنشاء للـ container. لذلك سترى <code dir=\"ltr\">DB_HOST=db<\/code> في مشاريع Compose.<\/p>", "q": {"t": "m", "q": "ما وظيفة الـ DNS؟", "e": "الـ DNS يترجم الاسم إلى عنوان رقمي. التشفير مسؤولية TLS في HTTPS.", "o": [{"h": "تشفير الاتصال بين الـ client والـ server", "c": 0}, {"h": "توزيع الـ ports على البرامج", "c": 0}, {"h": "تحويل أسماء النطاقات إلى IP addresses", "c": 1}, {"h": "حجب المواقع الضارة", "c": 0}]}}, {"id": "m2c6", "title": "الـ TCP", "html": "<p><b>الـ TCP<\/b> بروتوكول نقل يضمن وصول البيانات كاملة وبالترتيب. قبل إرسال أي شيء يفتح الطرفان <b>اتصالاً<\/b> (connection)، ثم يؤكد المستقبل استلام كل جزء، وما يضيع يُعاد إرساله.<\/p><p>تشبيه: مكالمة هاتفية: تتصل، يرد الطرف الآخر، ثم تتحدثان، وإن لم يسمعك قال «أعد».<\/p><p>HTTP و PostgreSQL و Redis كلها تعمل فوق TCP. لذلك حين تنشر port في Docker فهو TCP افتراضياً. البديل الأسرع والأقل ضماناً هو UDP ويُستخدم في البث والألعاب.<\/p>", "q": {"t": "t", "q": "بروتوكول TCP يضمن وصول البيانات كاملة ومرتبة.", "e": "هذه ميزته الأساسية: تأكيد الاستلام وإعادة إرسال ما ضاع، عكس UDP.", "a": true}}, {"id": "m2c7", "title": "الـ HTTP والـ HTTPS", "html": "<p><b>الـ HTTP<\/b> هو لغة التخاطب بين المتصفح والـ server. الـ client يرسل <b>request<\/b> فيه method ومسار، والـ server يرد بـ <b>response<\/b> فيه status code ومحتوى.<\/p><ul><li>Methods شائعة: <code dir=\"ltr\">GET<\/code> (اجلب)، <code dir=\"ltr\">POST<\/code> (أنشئ)، <code dir=\"ltr\">PUT<\/code>/<code dir=\"ltr\">PATCH<\/code> (عدّل)، <code dir=\"ltr\">DELETE<\/code> (احذف).<\/li><li>Status codes: <code dir=\"ltr\">200<\/code> نجاح، <code dir=\"ltr\">404<\/code> غير موجود، <code dir=\"ltr\">500<\/code> خطأ في الـ server، <code dir=\"ltr\">502<\/code> الـ proxy لم يستطع الوصول للتطبيق الذي خلفه.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>curl -i http://localhost:8000/api/menu/<\/code><\/pre><p><code dir=\"ltr\">curl<\/code> يرسل HTTP request من الـ Terminal، وهو أداتك الأولى لفحص الـ containers.<\/p><p><b>الـ HTTPS<\/b> هو HTTP مع تشفير (TLS)، فلا يستطيع من يراقب الشبكة قراءة البيانات. يعمل على port 443 ويحتاج شهادة (certificate).<\/p>", "q": {"t": "m", "q": "ماذا يضيف HTTPS إلى HTTP؟", "e": "HTTPS هو HTTP فوق TLS: نفس البروتوكول مع تشفير وتحقق من هوية الـ server.", "o": [{"h": "سرعة أعلى في نقل الملفات", "c": 0}, {"h": "تشفير الاتصال بين الـ client والـ server", "c": 1}, {"h": "إمكانية استخدام <code dir=\"ltr\">POST<\/code>", "c": 0}, {"h": "الاستغناء عن الـ ports", "c": 0}]}}, {"id": "m2c8", "title": "الـ Port forwarding", "html": "<p><b>الـ port forwarding<\/b> هو توجيه ما يصل إلى port معيّن على جهاز نحو port على جهاز أو مكان آخر.<\/p><p>في Docker، الـ container له شبكته المعزولة. حتى تصل إليه من جهازك (الـ <b>host<\/b>) يجب ربط port على الـ host بـ port داخل الـ container:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>ports:\n  - \"8000:8000\"<\/code><\/pre><p>الصيغة دائماً <code dir=\"ltr\">HOST:CONTAINER<\/code>. الرقم الأول على جهازك، والثاني داخل الـ container. ولا يشترط تطابقهما:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>ports:\n  - \"8080:8000\"<\/code><\/pre><p>هنا تفتح <code dir=\"ltr\">http://localhost:8080<\/code> على جهازك فيصل الطلب إلى port 8000 داخل الـ container.<\/p>", "q": {"t": "s", "q": "في الإعداد <code dir=\"ltr\">\"3000:8000\"<\/code> ما رقم الـ port الذي تكتبه في متصفح جهازك؟", "e": "الصيغة <code dir=\"ltr\">HOST:CONTAINER<\/code>. الأول (3000) على جهازك، والثاني (8000) داخل الـ container.", "r": "^3000$", "m": "3000"}}], "test": [{"t": "m", "q": "تطبيق يستمع على <code dir=\"ltr\">0.0.0.0:8000<\/code>. ماذا يعني ذلك؟", "e": "<code dir=\"ltr\">0.0.0.0<\/code> يعني كل الواجهات. <code dir=\"ltr\">127.0.0.1<\/code> يعني الجهاز نفسه فقط.", "o": [{"h": "يقبل الاتصالات من نفس الجهاز فقط", "c": 0}, {"h": "يقبل الاتصالات القادمة من كل واجهات الشبكة على port 8000", "c": 1}, {"h": "التطبيق معطل", "c": 0}, {"h": "يستخدم كل الـ ports", "c": 0}]}, {"t": "t", "q": "يمكن لبرنامجين الاستماع على نفس الـ port في نفس الجهاز ونفس العنوان في الوقت نفسه.", "e": "الثاني سيفشل برسالة <code dir=\"ltr\">address already in use<\/code>.", "a": false}, {"t": "s", "q": "ما رقم الـ port الافتراضي لـ PostgreSQL؟", "e": "PostgreSQL على 5432 و Redis على 6379.", "r": "^5432$", "m": "5432"}, {"t": "c", "q": "فتحت <code dir=\"ltr\">http://localhost:8000<\/code> فحصلت على status code <code dir=\"ltr\">502<\/code> من الـ reverse proxy. ما المعنى الأرجح؟", "e": "<code dir=\"ltr\">502 Bad Gateway<\/code> يعني أن الوسيط لم يحصل على رد سليم من الخدمة الخلفية، غالباً لأنها متوقفة أو عنوانها خاطئ.", "o": [{"h": "الصفحة غير موجودة في التطبيق", "c": 0}, {"h": "المتصفح لا يدعم HTTP", "c": 0}, {"h": "الـ proxy يعمل لكنه لم يستطع الوصول إلى التطبيق الذي خلفه", "c": 1}, {"h": "كلمة السر خاطئة", "c": 0}]}, {"t": "m", "q": "في <code dir=\"ltr\">\"8080:80\"<\/code> أي عبارة صحيحة؟", "e": "الترتيب دائماً <code dir=\"ltr\">HOST:CONTAINER<\/code>.", "o": [{"h": "8080 على الـ host و 80 داخل الـ container", "c": 1}, {"h": "8080 داخل الـ container و 80 على الـ host", "c": 0}, {"h": "كلاهما على الـ host", "c": 0}, {"h": "كلاهما داخل الـ container", "c": 0}]}, {"t": "m", "q": "لماذا يستخدم Django الاسم <code dir=\"ltr\">db<\/code> بدل IP address للوصول لقاعدة البيانات في Docker؟", "e": "عناوين الـ containers قد تتغير عند إعادة إنشائها، والاسم يبقى ثابتاً.", "o": [{"h": "لأن الأسماء أسرع من الأرقام", "c": 0}, {"h": "لأن الـ DNS الداخلي لـ Docker يحوّل الاسم للعنوان الصحيح حتى لو تغيّر الـ IP", "c": 1}, {"h": "لأن PostgreSQL لا يقبل IP addresses", "c": 0}, {"h": "لأن الاسم يشفّر الاتصال", "c": 0}]}]}, {"id": "m3", "title": "المتطلبات (ج): النظام وبنية التطبيق و Git و YAML", "badge": "Prerequisites", "dur": "2 أيام", "intro": "<p>Docker لا يغيّر بنية تطبيقك، هو يحزمه ويشغّله. لذلك يجب أن تفهم أولاً مما يتكون التطبيق وكيف يعمل بدون Docker.<\/p>", "cs": [{"id": "m3c1", "title": "الـ Filesystem", "html": "<p><b>الـ filesystem<\/b> هو الطريقة التي ينظّم بها النظام الملفات في شجرة مجلدات. في Linux تبدأ الشجرة من <code dir=\"ltr\">/<\/code> ولكل فرع وظيفة:<\/p><div class=\"tw\"><table><thead><tr><th>المسار<\/th><th>المحتوى<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">/bin<\/code> و <code dir=\"ltr\">/usr/bin<\/code><\/td><td>البرامج والأوامر<\/td><\/tr><tr><td><code dir=\"ltr\">/etc<\/code><\/td><td>ملفات الإعدادات<\/td><\/tr><tr><td><code dir=\"ltr\">/home<\/code><\/td><td>ملفات المستخدمين<\/td><\/tr><tr><td><code dir=\"ltr\">/var<\/code><\/td><td>بيانات متغيرة: logs وقواعد بيانات<\/td><\/tr><tr><td><code dir=\"ltr\">/tmp<\/code><\/td><td>ملفات مؤقتة<\/td><\/tr><\/tbody><\/table><\/div><p>لماذا يهم؟ الـ Docker image في جوهرها filesystem كامل جاهز: فيه <code dir=\"ltr\">/bin<\/code> و <code dir=\"ltr\">/etc<\/code> ومكتبات Python وكود تطبيقك. وكل container يرى filesystem خاصاً به، معزولاً عن جهازك وعن بقية الـ containers.<\/p>", "q": {"t": "m", "q": "ما العلاقة بين الـ Docker image والـ filesystem؟", "e": "الـ image حزمة تحوي كل الملفات اللازمة للتشغيل، والـ container يستخدمها كـ filesystem خاص به.", "o": [{"h": "لا علاقة بينهما", "c": 0}, {"h": "الـ image تحوي filesystem كاملاً فيه النظام والمكتبات وكود التطبيق", "c": 1}, {"h": "الـ image ملف نصي فيه أوامر فقط", "c": 0}, {"h": "الـ image هي القرص الصلب للجهاز", "c": 0}]}}, {"id": "m3c2", "title": "بنية تطبيق الويب: Frontend و Backend و Database و API", "html": "<ul><li><b>الـ Frontend<\/b>: ما يراه المستخدم ويعمل في متصفحه (مثل React).<\/li><li><b>الـ Backend<\/b>: المنطق الذي يعمل على الـ server (مثل Django): يتحقق من الصلاحيات ويعالج البيانات.<\/li><li><b>الـ Database<\/b>: مكان تخزين البيانات بشكل دائم (مثل PostgreSQL).<\/li><li><b>الـ API<\/b>: الواجهة التي يتخاطب عبرها الـ frontend مع الـ backend، غالباً طلبات HTTP تعيد JSON.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"\"><code>Browser (React) --HTTP/JSON--&gt; Django API --SQL--&gt; PostgreSQL<\/code><\/pre><p>تشبيه: الـ frontend قاعة المطعم، الـ backend المطبخ، الـ database المخزن، والـ API قائمة الطعام التي تحدد ما يمكن طلبه وكيف.<\/p><p>في Docker كل جزء من هذه يصبح container مستقلاً.<\/p>", "q": {"t": "m", "q": "ما دور الـ API في تطبيق الويب؟", "e": "الـ API عقد للتواصل: ما الطلبات المتاحة وما شكل الرد. التخزين للـ database والعرض للـ frontend.", "o": [{"h": "تخزين البيانات بشكل دائم", "c": 0}, {"h": "رسم الواجهة في المتصفح", "c": 0}, {"h": "واجهة متفق عليها يتواصل عبرها الـ frontend مع الـ backend", "c": 1}, {"h": "تشفير كلمات السر", "c": 0}]}}, {"id": "m3c3", "title": "كيف يتصل Django بـ PostgreSQL و Redis", "html": "<p>Django لا يخزن البيانات بنفسه، هو يتصل بخدمات أخرى عبر الشبكة:<\/p><ul><li><b>PostgreSQL<\/b>: قاعدة البيانات الأساسية. Django يتصل بها عبر TCP على port 5432.<\/li><li><b>Redis<\/b>: مخزن سريع جداً في الذاكرة، يُستخدم كـ <b>cache<\/b> (حفظ نتائج جاهزة مؤقتاً) أو كـ <b>broker<\/b> (طابور مهام ينقل الأعمال إلى Celery worker).<\/li><\/ul><p>Django يعرف مكان كل خدمة من إعداداته:<\/p><pre dir=\"ltr\" data-lang=\"python\"><code>DATABASES = {\"default\": {\n    \"ENGINE\": \"django.db.backends.postgresql\",\n    \"HOST\": os.environ[\"DB_HOST\"],   # أين قاعدة البيانات؟\n    \"PORT\": \"5432\",\n    \"NAME\": os.environ[\"DB_NAME\"],\n    \"USER\": os.environ[\"DB_USER\"],\n    \"PASSWORD\": os.environ[\"DB_PASSWORD\"],\n}}<\/code><\/pre><p>بدون Docker تكون قيمة <code dir=\"ltr\">HOST<\/code> هي <code dir=\"ltr\">localhost<\/code>. مع Docker ستصبح اسم الـ container أو الـ service، وسنعرف السبب في Stage 5.<\/p>", "q": {"t": "m", "q": "ما دور Redis كـ broker مع Celery؟", "e": "الـ broker وسيط رسائل: Django يضع المهمة في الطابور، والـ Celery worker يسحبها وينفذها.", "o": [{"h": "تخزين جداول Django بشكل دائم", "c": 0}, {"h": "طابور يحمل المهام من Django إلى الـ worker الذي ينفذها في الخلفية", "c": 1}, {"h": "تقديم ملفات الـ frontend", "c": 0}, {"h": "إصدار شهادات HTTPS", "c": 0}]}}, {"id": "m3c4", "title": "الـ Dependencies ومشكلة «يعمل على جهازي»", "html": "<p>تطبيقك لا يعمل وحده. يحتاج <b>dependencies<\/b>: نسخة Python معينة، ومكتبات مثل Django و psycopg، وأحياناً مكتبات نظام.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>python -m venv venv\nsource venv/bin/activate\npip install -r requirements.txt\npython manage.py runserver<\/code><\/pre><p>المشكلة: جهازك فيه Python 3.13 والسيرفر فيه 3.9، أو مكتبة نظام ناقصة هناك. فيعمل التطبيق عندك ويفشل عند غيرك. هذه مشكلة «it works on my machine».<\/p><p>Docker يحلها بأن يحزم التطبيق مع كل ما يحتاجه (النظام، Python، المكتبات، الكود) في image واحدة. ما يعمل عندك يعمل في أي مكان بنفس الشكل.<\/p>", "q": {"t": "m", "q": "ما المشكلة الأساسية التي يحلها Docker؟", "e": "Docker يوحّد بيئة التشغيل: نفس الـ image تعطي نفس السلوك على أي جهاز.", "o": [{"h": "بطء لغة Python", "c": 0}, {"h": "اختلاف بيئة التشغيل بين الأجهزة، بحزم التطبيق مع كل dependencies في image واحدة", "c": 1}, {"h": "كتابة الكود تلقائياً", "c": 0}, {"h": "الاستغناء عن قاعدة البيانات", "c": 0}]}}, {"id": "m3c5", "title": "أساسيات Git: clone و commit و branches", "html": "<p><b>Git<\/b> نظام يحفظ تاريخ تغييرات الكود.<\/p><ul><li><code dir=\"ltr\">git clone URL<\/code> ينزّل نسخة كاملة من مشروع.<\/li><li><code dir=\"ltr\">git add<\/code> ثم <code dir=\"ltr\">git commit -m \"msg\"<\/code> يحفظان لقطة من التغييرات باسم ورسالة.<\/li><li>الـ <b>branch<\/b> خط عمل مستقل تجرّب فيه دون التأثير على الخط الرئيسي.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>git clone https://github.com/user/project.git\ngit checkout -b feature/docker\ngit add Dockerfile\ngit commit -m \"Add Dockerfile\"<\/code><\/pre><p>لماذا يهم؟ الـ <code dir=\"ltr\">Dockerfile<\/code> و <code dir=\"ltr\">compose.yaml<\/code> يُحفظان في Git مع الكود. وفي Production يُبنى الـ image من commit محدد، ويستخدم رقم الـ commit كثيراً كـ tag للـ image.<\/p><div class=\"warn\">لا تضع ملف <code dir=\"ltr\">.env<\/code> الذي فيه كلمات السر في Git. أضفه إلى <code dir=\"ltr\">.gitignore<\/code>.<\/div>", "q": {"t": "t", "q": "من الممارسات الجيدة حفظ ملف <code dir=\"ltr\">.env<\/code> الذي يحوي كلمات السر داخل Git ليصل إليه الفريق.", "e": "الأسرار لا توضع في Git أبداً. يوضع <code dir=\"ltr\">.env<\/code> في <code dir=\"ltr\">.gitignore<\/code> ويُرفع بدلاً منه ملف <code dir=\"ltr\">.env.example<\/code> بقيم وهمية.", "a": false}}, {"id": "m3c6", "title": "أساسيات YAML", "html": "<p><b>YAML<\/b> صيغة نصية لكتابة الإعدادات، وبها يُكتب <code dir=\"ltr\">compose.yaml<\/code>. قواعدها قليلة:<\/p><ul><li><code dir=\"ltr\">key: value<\/code> لتعريف قيمة.<\/li><li><b>المسافات البادئة (indentation)<\/b> تحدد التبعية. استخدم مسافتين، ولا تستخدم Tab أبداً.<\/li><li><code dir=\"ltr\">- item<\/code> لعناصر القائمة.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    image: nginx\n    ports:\n      - \"8080:80\"\n    environment:\n      DEBUG: \"false\"<\/code><\/pre><p>هنا <code dir=\"ltr\">web<\/code> تابعة لـ <code dir=\"ltr\">services<\/code>، و <code dir=\"ltr\">ports<\/code> قائمة فيها عنصر واحد.<\/p><div class=\"warn\">ضع الـ ports بين علامتي تنصيص. YAML قد يفسّر قيماً مثل <code dir=\"ltr\">22:22<\/code> كرقم بنظام غريب وليس كنص.<\/div><p>خطأ مسافة واحدة يغيّر المعنى أو يُفشل الملف، وهو أكثر أخطاء Compose شيوعاً.<\/p>", "q": {"t": "m", "q": "ما الذي يحدد أن <code dir=\"ltr\">image<\/code> تابعة لـ <code dir=\"ltr\">web<\/code> في ملف YAML؟", "e": "YAML يعتمد على المسافات البادئة لتحديد الهيكل، لذلك أي خطأ فيها يغيّر المعنى.", "o": [{"h": "الأقواس <code dir=\"ltr\">{}<\/code>", "c": 0}, {"h": "الفاصلة المنقوطة", "c": 0}, {"h": "المسافات البادئة (indentation)", "c": 1}, {"h": "ترتيب الأحرف الأبجدي", "c": 0}]}}], "test": [{"t": "m", "q": "أي جزء من التطبيق يعمل داخل متصفح المستخدم؟", "e": "الـ frontend (مثل React) يُنفَّذ في المتصفح، والباقي يعمل على الـ server.", "o": [{"h": "الـ Frontend", "c": 1}, {"h": "الـ Backend", "c": 0}, {"h": "الـ Database", "c": 0}, {"h": "الـ Broker", "c": 0}]}, {"t": "t", "q": "Docker يستبدل بنية تطبيقك، فلا تحتاج بعده إلى فهم كيف يتصل Django بقاعدة البيانات.", "e": "Docker يحزم ويشغّل فقط. الاتصالات بين الخدمات تبقى كما هي وعليك إعدادها.", "a": false}, {"t": "s", "q": "أي أمر Git ينزّل نسخة كاملة من مشروع موجود على GitHub؟ (اكتب الأمر دون الرابط)", "e": "<code dir=\"ltr\">git clone URL<\/code> ينسخ المشروع وتاريخه كاملاً إلى جهازك.", "r": "^git clone", "m": "<code dir=\"ltr\">git clone<\/code>"}, {"t": "c", "q": "زميلك شغّل مشروعك ففشل برسالة تقول إن مكتبة غير موجودة، مع أنه يعمل عندك. ما التفسير الأدق؟", "e": "هذه مشكلة اختلاف البيئات التي يحلها Docker بحزم كل الـ dependencies مع التطبيق.", "o": [{"h": "جهازه أبطأ", "c": 0}, {"h": "بيئته تختلف عن بيئتك: نسخة أو مكتبة ناقصة من الـ dependencies", "c": 1}, {"h": "Git أفسد الملفات", "c": 0}, {"h": "المتصفح قديم", "c": 0}]}, {"t": "m", "q": "في YAML، كيف نكتب قائمة؟", "e": "عناصر القائمة تبدأ بشرطة ومسافة. أما <code dir=\"ltr\">#<\/code> فللتعليقات.", "o": [{"h": "بين قوسين <code dir=\"ltr\">()<\/code>", "c": 0}, {"h": "كل عنصر في سطر يبدأ بـ <code dir=\"ltr\">- <\/code>", "c": 1}, {"h": "بفواصل منقوطة", "c": 0}, {"h": "بعلامة <code dir=\"ltr\">#<\/code>", "c": 0}]}]}, {"id": "m4", "title": "Stage 1: أساسيات Docker", "badge": "Beginner", "dur": "3–4 أيام", "intro": "<p>الهدف: أن تفهم ما يحدث فعلاً عندما تنفّذ <code dir=\"ltr\">docker run<\/code>، وألا تبقى الأوامر مجرد كلمات محفوظة.<\/p>", "cs": [{"id": "m4c1", "title": "ما هو Docker؟", "html": "<p><b>Docker<\/b> منصة تحزم التطبيق مع كل ما يحتاجه للعمل في وحدة واحدة قياسية، ثم تشغّل هذه الوحدة بشكل معزول على أي جهاز.<\/p><p>تشبيه حاويات الشحن: قبل اختراعها كان كل نوع بضاعة يحتاج طريقة تحميل خاصة. بعدها صار كل شيء يوضع في صندوق بمقاس موحّد تتعامل معه أي سفينة أو شاحنة دون أن تعرف ما بداخله. Docker فعل الشيء نفسه للبرامج.<\/p><p>ما تكسبه:<\/p><ul><li><b>التطابق<\/b>: نفس البيئة في التطوير والاختبار و Production.<\/li><li><b>العزل<\/b>: كل تطبيق له مكتباته، فلا تتعارض نسختان من Python على الجهاز نفسه.<\/li><li><b>السرعة<\/b>: التشغيل يستغرق ثواني.<\/li><li><b>سهولة النشر<\/b>: السيرفر يحتاج Docker فقط، لا Python ولا Node.<\/li><\/ul>", "q": {"t": "m", "q": "أي وصف هو الأدق لـ Docker؟", "e": "Docker أداة حزم وتشغيل. لا يكتب الكود ولا يستبدل نظام التشغيل، هو يستخدم ميزات Linux للعزل.", "o": [{"h": "لغة برمجة لبناء تطبيقات الويب", "c": 0}, {"h": "نظام تشغيل بديل عن Linux", "c": 0}, {"h": "منصة لحزم التطبيقات مع dependencies وتشغيلها معزولة بشكل متطابق على أي جهاز", "c": 1}, {"h": "قاعدة بيانات سريعة", "c": 0}]}}, {"id": "m4c2", "title": "ما هي الـ Image؟", "html": "<p><b>الـ image<\/b> قالب جاهز <b>للقراءة فقط<\/b> يحوي كل ما يلزم لتشغيل التطبيق: filesystem مصغّر، المكتبات، الكود، وإعداد يحدد الأمر الذي يُنفَّذ عند التشغيل.<\/p><p>تشبيهات: الـ image مثل الـ class في البرمجة، أو مثل وصفة الطبخ، أو ملف تثبيت جاهز.<\/p><p>خصائصها:<\/p><ul><li><b>ثابتة (immutable)<\/b>: لا تتغير بعد بنائها. إن أردت تعديلاً تبني image جديدة.<\/li><li><b>قابلة للمشاركة<\/b>: ترفعها وتنزّلها من مخازن اسمها registries.<\/li><li><b>مبنية من طبقات (layers)<\/b> فوق بعضها، وسنفصّلها في Stage 3.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>docker pull python:3.13-slim   # نزّل image جاهزة\ndocker images                  # اعرض الـ images الموجودة على جهازك<\/code><\/pre>", "q": {"t": "t", "q": "يمكن تعديل الملفات داخل الـ image نفسها بعد بنائها أثناء تشغيل التطبيق.", "e": "الـ image للقراءة فقط. أي تغيير أثناء التشغيل يحدث في طبقة الـ container وليس في الـ image.", "a": false}}, {"id": "m4c3", "title": "ما هو الـ Container؟", "html": "<p><b>الـ container<\/b> نسخة عاملة من image. هو في حقيقته process عادي (أو عدة processes) يعمل على جهازك، لكنه معزول: يرى filesystem خاصاً به (قادماً من الـ image)، وشبكة خاصة، وقائمة processes خاصة.<\/p><p>إذا كانت الـ image هي الـ class فالـ container هو الـ object. وإذا كانت الوصفة فالـ container هو الطبق.<\/p><ul><li>من image واحدة تشغّل عدداً غير محدود من الـ containers، وكل واحد مستقل.<\/li><li>الـ container <b>مؤقت بطبيعته<\/b>: تحذفه وتنشئ غيره في ثوانٍ. لذلك لا نخزن داخله شيئاً مهماً.<\/li><li>الـ container يعيش ما دام الـ process الرئيسي فيه يعمل. إذا انتهى الـ process توقف الـ container.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name web1 nginx\ndocker run -d --name web2 nginx   # container ثانٍ من نفس الـ image<\/code><\/pre>", "q": {"t": "m", "q": "ما العلاقة بين الـ image والـ container؟", "e": "الـ image قالب للقراءة فقط، ومنه ننشئ أي عدد من الـ containers العاملة.", "o": [{"h": "هما اسمان لنفس الشيء", "c": 0}, {"h": "الـ image قالب ثابت، والـ container نسخة عاملة منه", "c": 1}, {"h": "الـ container يُبنى أولاً ثم تُشغَّل منه الـ image", "c": 0}, {"h": "لكل image يوجد container واحد فقط", "c": 0}]}}, {"id": "m4c4", "title": "الـ Container مقابل الـ Virtual Machine", "html": "<p><b>الـ Virtual Machine (VM)<\/b> تحاكي جهازاً كاملاً: لها نظام تشغيل كامل و <b>kernel<\/b> خاص بها (الـ kernel هو قلب نظام التشغيل الذي يدير العتاد). <b>الـ container<\/b> لا يحمل kernel، هو يستخدم kernel الجهاز المضيف مباشرة ويعزل الـ process فقط.<\/p><div class=\"tw\"><table><thead><tr><th><\/th><th>Container<\/th><th>Virtual Machine<\/th><\/tr><\/thead><tbody><tr><td>ما يُعزل<\/td><td>الـ process<\/td><td>جهاز كامل<\/td><\/tr><tr><td>الـ kernel<\/td><td>مشترك مع الـ host<\/td><td>خاص بكل VM<\/td><\/tr><tr><td>الحجم<\/td><td>عشرات إلى مئات MB<\/td><td>عدة GB<\/td><\/tr><tr><td>زمن التشغيل<\/td><td>ثوانٍ أو أقل<\/td><td>دقيقة تقريباً<\/td><\/tr><tr><td>قوة العزل<\/td><td>جيدة<\/td><td>أقوى<\/td><\/tr><\/tbody><\/table><\/div><p>تشبيه: الـ VMs بيوت مستقلة، لكل بيت أساساته ومرافقه. الـ containers شقق في عمارة واحدة تتشارك الأساسات (الـ kernel) ولكل شقة بابها وجدرانها.<\/p><p>النتيجة: الـ containers أخف وأسرع بكثير، لكن عزلها أضعف من الـ VM لأن الـ kernel مشترك.<\/p>", "q": {"t": "m", "q": "ما الفرق الجوهري بين الـ container والـ VM؟", "e": "مشاركة الـ kernel هي سبب خفة الـ containers وسرعتها، وهي أيضاً سبب أن عزلها أقل من الـ VM.", "o": [{"h": "الـ container أكبر حجماً", "c": 0}, {"h": "الـ VM لا تستطيع تشغيل Linux", "c": 0}, {"h": "الـ container يشارك kernel الـ host، والـ VM لها kernel ونظام تشغيل كامل", "c": 1}, {"h": "الـ container لا يستطيع الاتصال بالشبكة", "c": 0}]}}, {"id": "m4c5", "title": "كيف يعزل Docker الـ process؟ Namespaces و cgroups", "html": "<p>Docker لم يخترع العزل. هو يستخدم ميزتين موجودتين في Linux kernel:<\/p><p><b>الـ Namespaces<\/b> تحدد ما <b>يراه<\/b> الـ process:<\/p><ul><li><code dir=\"ltr\">pid<\/code>: يرى processes خاصة به فقط، وبرنامجك يظهر داخله برقم PID 1.<\/li><li><code dir=\"ltr\">net<\/code>: شبكة و IP و ports خاصة.<\/li><li><code dir=\"ltr\">mnt<\/code>: filesystem خاص.<\/li><li><code dir=\"ltr\">uts<\/code>: اسم جهاز (hostname) خاص.<\/li><\/ul><p><b>الـ cgroups<\/b> تحدد ما <b>يستهلكه<\/b> الـ process: حد أقصى للذاكرة والـ CPU.<\/p><p>تشبيه: الـ namespaces هي الجدران التي تحجب الرؤية، والـ cgroups عدّاد الكهرباء والماء لكل شقة.<\/p><p>إذن الـ container ليس «جهازاً صغيراً». هو process عادي على الـ host وُضعت حوله جدران وحدود.<\/p><div class=\"note\">على macOS و Windows لا يوجد Linux kernel، لذلك يشغّل Docker Desktop آلة Linux افتراضية خفيفة في الخلفية وتعمل الـ containers داخلها.<\/div>", "q": {"t": "m", "q": "أي ميزة في Linux kernel تضع حداً أقصى للذاكرة التي يستهلكها container؟", "e": "الـ cgroups تحدّ الموارد (ذاكرة، CPU). الـ namespaces تعزل ما يراه الـ process.", "o": [{"h": "الـ namespaces", "c": 0}, {"h": "الـ cgroups", "c": 1}, {"h": "الـ DNS", "c": 0}, {"h": "الـ chmod", "c": 0}]}}, {"id": "m4c6", "title": "معمارية Docker: الـ CLI والـ Daemon والـ Engine", "html": "<p>Docker يعمل بنموذج client-server:<\/p><ul><li><b>Docker CLI<\/b>: الأمر <code dir=\"ltr\">docker<\/code> الذي تكتبه. هو client فقط: يحوّل أمرك إلى طلب ويرسله.<\/li><li><b>Docker Daemon<\/b> (واسمه <code dir=\"ltr\">dockerd<\/code>): server يعمل في الخلفية باستمرار. هو الذي يبني الـ images ويشغّل الـ containers ويدير الشبكات والـ volumes.<\/li><li><b>REST API<\/b>: واجهة التخاطب بينهما، عبر ملف خاص اسمه <code dir=\"ltr\">/var/run/docker.sock<\/code>.<\/li><li><b>Docker Engine<\/b>: الاسم الجامع لهذه الأجزاء الثلاثة.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"\"><code>docker run nginx  --&gt;  Docker CLI  --REST API--&gt;  dockerd  --&gt;  containerd  --&gt;  runc  --&gt;  container<\/code><\/pre><p>الـ daemon لا ينشئ الـ container بيده. هو يفوّض <b>containerd<\/b> لإدارة دورة حياة الـ containers، وهذا يستدعي <b>runc<\/b> الذي يطلب من الـ kernel إنشاء الـ namespaces والـ cgroups.<\/p><p>نتيجة عملية: إذا رأيت <code dir=\"ltr\">Cannot connect to the Docker daemon<\/code> فالـ CLI سليم، لكن الـ daemon متوقف أو لا تملك صلاحية الوصول إليه.<\/p>", "q": {"t": "c", "q": "نفّذت <code dir=\"ltr\">docker ps<\/code> فظهرت الرسالة <code dir=\"ltr\">Cannot connect to the Docker daemon<\/code>. ما المشكلة الأرجح؟", "e": "الرسالة صادرة من الـ CLI نفسه، فهو مثبت. المشكلة في الطرف الآخر: الـ daemon متوقف أو الوصول إليه ممنوع.", "o": [{"h": "لا توجد images على الجهاز", "c": 0}, {"h": "الـ Docker daemon لا يعمل، أو المستخدم لا يملك صلاحية الوصول إلى الـ socket", "c": 1}, {"h": "الـ CLI غير مثبت", "c": 0}, {"h": "الإنترنت مقطوع", "c": 0}]}}, {"id": "m4c7", "title": "تثبيت Docker والتحقق منه", "html": "<p>لديك خياران:<\/p><ul><li><b>Docker Desktop<\/b>: تطبيق لـ Windows و macOS و Linux، فيه الـ Engine والـ CLI و Compose وواجهة رسومية. الأنسب لجهاز التطوير.<\/li><li><b>Docker Engine<\/b>: يُثبَّت مباشرة على Linux دون واجهة. هذا ما تستخدمه على السيرفر.<\/li><\/ul><p>بعد التثبيت تحقق:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker version          # يعرض قسمين: Client و Server\ndocker info             # معلومات الـ daemon\ndocker compose version\ndocker run hello-world  # اختبار كامل للسلسلة<\/code><\/pre><p>إذا ظهر قسم <code dir=\"ltr\">Client<\/code> فقط في <code dir=\"ltr\">docker version<\/code> فالـ daemon لا يعمل.<\/p><p>على Linux يحتاج الأمر <code dir=\"ltr\">docker<\/code> إلى <code dir=\"ltr\">sudo<\/code> افتراضياً. يمكن إضافة مستخدمك إلى مجموعة <code dir=\"ltr\">docker<\/code> لتجنب ذلك.<\/p><div class=\"warn\">عضوية مجموعة <code dir=\"ltr\">docker<\/code> تعادل عملياً صلاحيات root على الجهاز. سنعرف السبب في Stage 7.<\/div>", "q": {"t": "m", "q": "أي أمر يختبر السلسلة كاملة: الـ CLI والـ daemon وتنزيل image وتشغيل container؟", "e": "<code dir=\"ltr\">docker run hello-world<\/code> ينزّل image صغيرة ويشغّلها ويطبع رسالة، فينجح فقط إذا كانت كل الأجزاء تعمل.", "o": [{"h": "<code dir=\"ltr\">docker version<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker info<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker run hello-world<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker images<\/code>", "c": 0}]}}, {"id": "m4c8", "title": "الـ Registries و Docker Hub وتسمية الـ Images", "html": "<p><b>الـ registry<\/b> مخزن على الشبكة للـ images: ترفع إليه وتنزّل منه. <b>Docker Hub<\/b> هو الـ registry الافتراضي والأشهر. توجد بدائل مثل GitHub Container Registry (<code dir=\"ltr\">ghcr.io<\/code>) والـ registries الخاصة.<\/p><p>الاسم الكامل لأي image:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>[registry/][namespace/]repository[:tag]\nghcr.io/ali/shop-api:1.4.2<\/code><\/pre><ul><li>إذا حذفت الـ registry فالمقصود Docker Hub.<\/li><li>الـ <b>repository<\/b> اسم الـ image، مثل <code dir=\"ltr\">postgres<\/code>.<\/li><li>الـ <b>tag<\/b> تسمية لنسخة محددة، مثل <code dir=\"ltr\">17<\/code> أو <code dir=\"ltr\">3.13-slim<\/code>.<\/li><li>إذا حذفت الـ tag فسيُستخدم <code dir=\"ltr\">latest<\/code>.<\/li><\/ul><div class=\"warn\"><code dir=\"ltr\">latest<\/code> ليس «أحدث نسخة» بالضرورة. هو مجرد tag افتراضي يتغير ما يشير إليه مع الوقت. في المشاريع الجادة حدد نسخة صريحة مثل <code dir=\"ltr\">postgres:17<\/code>، وإلا قد تحصل غداً على نسخة مختلفة عن اليوم.<\/div><p>على Docker Hub: الـ <b>Official Images<\/b> (مثل <code dir=\"ltr\">postgres<\/code> و <code dir=\"ltr\">python<\/code> و <code dir=\"ltr\">nginx<\/code>) تُراجَع وتُحدَّث بانتظام، وهي نقطة البداية الآمنة.<\/p><p>للتثبيت التام يوجد الـ <b>digest<\/b>: بصمة <code dir=\"ltr\">sha256<\/code> لمحتوى الـ image لا تتغير أبداً: <code dir=\"ltr\">postgres@sha256:...<\/code>.<\/p>", "q": {"t": "m", "q": "ماذا يحدث عند تنفيذ <code dir=\"ltr\">docker pull redis<\/code> دون تحديد tag؟", "e": "بدون registry يُستخدم Docker Hub، وبدون tag يُستخدم <code dir=\"ltr\">latest<\/code>.", "o": [{"h": "يفشل الأمر", "c": 0}, {"h": "ينزّل كل نسخ redis", "c": 0}, {"h": "ينزّل <code dir=\"ltr\">redis:latest<\/code> من Docker Hub", "c": 1}, {"h": "ينزّل أقدم نسخة", "c": 0}]}}, {"id": "m4c9", "title": "ماذا يحدث عند تنفيذ docker run؟", "html": "<p>لنتتبع <code dir=\"ltr\">docker run -d -p 8080:80 nginx<\/code> خطوة بخطوة:<\/p><ol><li>الـ <b>CLI<\/b> يحوّل الأمر إلى طلب REST API ويرسله إلى الـ daemon.<\/li><li>الـ <b>daemon<\/b> يبحث عن الـ image <code dir=\"ltr\">nginx:latest<\/code> محلياً.<\/li><li>إن لم يجدها ينزّلها من الـ registry، طبقة طبقة.<\/li><li>ينشئ container جديداً: يضيف فوق طبقات الـ image طبقة رقيقة قابلة للكتابة (writable layer).<\/li><li>ينشئ الـ namespaces والـ cgroups (عبر containerd و runc).<\/li><li>يوصل الـ container بشبكة ويعطيه IP، ويربط port 8080 على الـ host بـ port 80 داخله.<\/li><li>يشغّل الأمر الافتراضي المحدد في الـ image (هنا برنامج nginx) ويصبح PID 1 داخل الـ container.<\/li><li>بسبب <code dir=\"ltr\">-d<\/code> يعيد الـ CLI لك رقم الـ container ويتركه يعمل في الخلفية.<\/li><\/ol><p>إذن <code dir=\"ltr\">docker run<\/code> يساوي: <code dir=\"ltr\">pull<\/code> (عند الحاجة) ثم <code dir=\"ltr\">create<\/code> ثم <code dir=\"ltr\">start<\/code>.<\/p>", "q": {"t": "m", "q": "إذا لم تكن الـ image موجودة على جهازك، ماذا يفعل <code dir=\"ltr\">docker run<\/code>؟", "e": "<code dir=\"ltr\">docker run<\/code> يتكفل بالتنزيل تلقائياً إن لم يجد الـ image محلياً، ثم يكمل الإنشاء والتشغيل.", "o": [{"h": "يفشل ويطلب منك تنفيذ <code dir=\"ltr\">docker pull<\/code> أولاً", "c": 0}, {"h": "ينزّلها تلقائياً من الـ registry ثم ينشئ الـ container ويشغّله", "c": 1}, {"h": "يبني الـ image من Dockerfile", "c": 0}, {"h": "يشغّل container فارغاً", "c": 0}]}}], "test": [{"t": "m", "q": "من أي شيء ينشأ الـ container؟", "e": "التسلسل: Dockerfile يُبنى منه image، والـ image يُشغَّل منها container.", "o": [{"h": "من Dockerfile مباشرة", "c": 0}, {"h": "من image", "c": 1}, {"h": "من registry", "c": 0}, {"h": "من volume", "c": 0}]}, {"t": "t", "q": "الـ container يحوي kernel خاصاً به مثل الـ VM.", "e": "الـ container يستخدم kernel الـ host. هذا هو سبب خفته.", "a": false}, {"t": "m", "q": "أي جزء من Docker هو الذي يبني الـ images ويشغّل الـ containers فعلياً؟", "e": "الـ CLI يرسل الطلبات فقط، والـ daemon (<code dir=\"ltr\">dockerd<\/code>) هو المنفّذ.", "o": [{"h": "الـ Docker CLI", "c": 0}, {"h": "الـ Docker daemon", "c": 1}, {"h": "الـ Docker Hub", "c": 0}, {"h": "الـ Terminal", "c": 0}]}, {"t": "s", "q": "في الاسم <code dir=\"ltr\">ghcr.io/ali/shop-api:1.4.2<\/code> ما هو الـ tag؟", "e": "الـ tag هو ما بعد النقطتين. <code dir=\"ltr\">ghcr.io<\/code> هو الـ registry و <code dir=\"ltr\">ali/shop-api<\/code> هو الـ repository.", "r": "^1\\.4\\.2$", "m": "<code dir=\"ltr\">1.4.2<\/code>"}, {"t": "c", "q": "فريقك يستخدم <code dir=\"ltr\">postgres:latest<\/code> في المشروع. بعد شهر فشل التطبيق عند زميل جديد مع أنه يعمل عند الباقين. ما التفسير الأرجح؟", "e": "<code dir=\"ltr\">latest<\/code> متحرك. الحل تثبيت النسخة صراحة مثل <code dir=\"ltr\">postgres:17<\/code>.", "o": [{"h": "Docker Hub حذف الـ image", "c": 0}, {"h": "<code dir=\"ltr\">latest<\/code> صار يشير إلى نسخة أحدث مختلفة، فحصل الزميل على نسخة غير التي عند الباقين", "c": 1}, {"h": "جهاز الزميل لا يدعم الـ containers", "c": 0}, {"h": "الـ tag <code dir=\"ltr\">latest<\/code> لا يعمل إلا مرة واحدة", "c": 0}]}, {"t": "m", "q": "ما وظيفة الـ namespaces؟", "e": "الـ namespaces للعزل في الرؤية، والـ cgroups لتحديد الموارد.", "o": [{"h": "عزل ما يراه الـ process: الـ processes والشبكة والـ filesystem", "c": 1}, {"h": "تحديد الحد الأقصى للذاكرة", "c": 0}, {"h": "تنزيل الـ images", "c": 0}, {"h": "تشفير البيانات", "c": 0}]}]}, {"id": "m5", "title": "Stage 2: الـ Docker CLI وإدارة الـ Containers", "badge": "Beginner", "dur": "3–4 أيام", "intro": "<p>الهدف: أن تشغّل الـ containers وتفحصها وتصلح مشاكلها وتوقفها وتحذفها من الـ Terminal دون Compose. طبّق كل أمر وأنت تقرأ.<\/p>", "cs": [{"id": "m5c1", "title": "بنية أوامر Docker وطلب المساعدة", "html": "<p>أوامر Docker الحديثة تتبع النمط:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>docker &lt;object&gt; &lt;command&gt; [options]<\/code><\/pre><p>مثل <code dir=\"ltr\">docker container ls<\/code> و <code dir=\"ltr\">docker image ls<\/code> و <code dir=\"ltr\">docker volume ls<\/code> و <code dir=\"ltr\">docker network ls<\/code>. وتوجد اختصارات قديمة ما زالت تعمل وهي الأكثر استخداماً:<\/p><div class=\"tw\"><table><thead><tr><th>الاختصار<\/th><th>الصيغة الكاملة<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">docker ps<\/code><\/td><td><code dir=\"ltr\">docker container ls<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">docker images<\/code><\/td><td><code dir=\"ltr\">docker image ls<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">docker rm<\/code><\/td><td><code dir=\"ltr\">docker container rm<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">docker rmi<\/code><\/td><td><code dir=\"ltr\">docker image rm<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>أهم مهارة: لا تحفظ الخيارات، اطلبها:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker --help\ndocker run --help<\/code><\/pre><p>تستطيع الإشارة إلى أي container باسمه أو بأول أحرف من الـ ID الخاص به، ما دامت كافية لتمييزه.<\/p>", "q": {"t": "m", "q": "أي أمر يعادل <code dir=\"ltr\">docker ps<\/code>؟", "e": "<code dir=\"ltr\">docker ps<\/code> اختصار قديم لـ <code dir=\"ltr\">docker container ls<\/code>: عرض الـ containers العاملة.", "o": [{"h": "<code dir=\"ltr\">docker image ls<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker container ls<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker process list<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker run ls<\/code>", "c": 0}]}}, {"id": "m5c2", "title": "docker pull: تنزيل Image", "html": "<p><code dir=\"ltr\">docker pull<\/code> ينزّل image من الـ registry إلى جهازك دون تشغيلها.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker pull postgres:17\ndocker pull python:3.13-slim<\/code><\/pre><p>سترى أسطراً متعددة، كل سطر طبقة (layer) تُنزَّل منفردة. وإذا كانت طبقة موجودة عندك من image أخرى فستظهر <code dir=\"ltr\">Already exists<\/code> ولا تُنزَّل ثانية. لهذا تنزيل النسخ المتقاربة سريع.<\/p><p>متى تستخدمه مع أن <code dir=\"ltr\">docker run<\/code> ينزّل تلقائياً؟<\/p><ul><li>لتحديث tag موجود محلياً إلى آخر محتوى له في الـ registry.<\/li><li>لتجهيز الـ images مسبقاً قبل العمل دون إنترنت.<\/li><\/ul>", "q": {"t": "t", "q": "إذا كانت <code dir=\"ltr\">python:3.13-slim<\/code> موجودة محلياً فإن <code dir=\"ltr\">docker run python:3.13-slim<\/code> يتحقق من الـ registry وينزّل أي تحديث لها تلقائياً.", "e": "<code dir=\"ltr\">docker run<\/code> يستخدم النسخة المحلية إن وُجدت ولا يتحقق من التحديثات. لتحديثها نفّذ <code dir=\"ltr\">docker pull<\/code> صراحة.", "a": false}}, {"id": "m5c3", "title": "docker images و docker rmi", "html": "<p><code dir=\"ltr\">docker images<\/code> يعرض الـ images المخزنة على جهازك:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker images\n# REPOSITORY   TAG         IMAGE ID       CREATED       SIZE\n# postgres     17          a1b2c3d4e5f6   2 weeks ago   438MB\n# python       3.13-slim   f6e5d4c3b2a1   3 weeks ago   121MB<\/code><\/pre><ul><li><b>IMAGE ID<\/b> معرّف فريد للـ image.<\/li><li><b>SIZE<\/b> حجمها على القرص.<\/li><\/ul><p>لحذف image:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker rmi postgres:17\ndocker image prune        # احذف الـ images التي بلا اسم ولا يستخدمها أحد<\/code><\/pre><p>لا يمكن حذف image ما دام هناك container (ولو متوقف) أُنشئ منها. احذف الـ container أولاً.<\/p><p>الـ images التي تظهر باسم <code dir=\"ltr\">&lt;none&gt;<\/code> تسمى <b>dangling<\/b>: طبقات قديمة فقدت اسمها بعد إعادة بناء image بنفس الـ tag.<\/p>", "q": {"t": "c", "q": "نفّذت <code dir=\"ltr\">docker rmi nginx<\/code> ففشل برسالة تقول إن الـ image مستخدمة من container متوقف. ما الحل الصحيح؟", "e": "الـ container، ولو متوقفاً، يعتمد على طبقات الـ image. احذفه أولاً ثم احذف الـ image.", "o": [{"h": "إعادة تشغيل الـ Docker daemon", "c": 0}, {"h": "حذف ذلك الـ container بـ <code dir=\"ltr\">docker rm<\/code> ثم حذف الـ image", "c": 1}, {"h": "تنزيل الـ image من جديد", "c": 0}, {"h": "تغيير اسم الـ image", "c": 0}]}}, {"id": "m5c4", "title": "docker run: إنشاء وتشغيل Container", "html": "<pre dir=\"ltr\" data-lang=\"bash\"><code>docker run [options] IMAGE [command]<\/code><\/pre><p>أبسط مثال:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run nginx<\/code><\/pre><p>خيارات أساسية:<\/p><ul><li><code dir=\"ltr\">--name web<\/code> يعطي الـ container اسماً. بدونه يولّد Docker اسماً عشوائياً مثل <code dir=\"ltr\">sleepy_turing<\/code>.<\/li><li>بعد اسم الـ image يمكنك كتابة أمر يستبدل الأمر الافتراضي:<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run --name web nginx\ndocker run python:3.13-slim python --version<\/code><\/pre><p>السطر الثاني يشغّل container، ينفّذ <code dir=\"ltr\">python --version<\/code>، ثم يتوقف، لأن الـ process الرئيسي انتهى.<\/p><div class=\"warn\">كل <code dir=\"ltr\">docker run<\/code> ينشئ container <b>جديداً<\/b>. تكراره عشر مرات يعطيك عشرة containers. والاسم يجب أن يكون فريداً: إعادة <code dir=\"ltr\">docker run --name web ...<\/code> تفشل ما دام container بهذا الاسم موجوداً ولو كان متوقفاً. لتشغيل container موجود استخدم <code dir=\"ltr\">docker start<\/code>.<\/div>", "q": {"t": "m", "q": "ما نتيجة تنفيذ <code dir=\"ltr\">docker run nginx<\/code> ثلاث مرات متتالية؟", "e": "كل <code dir=\"ltr\">docker run<\/code> ينشئ container جديداً. إعادة تشغيل container موجود تكون بـ <code dir=\"ltr\">docker start<\/code>.", "o": [{"h": "container واحد يُعاد تشغيله ثلاث مرات", "c": 0}, {"h": "ثلاثة containers مستقلة من نفس الـ image", "c": 1}, {"h": "خطأ في المرة الثانية", "c": 0}, {"h": "ثلاث images جديدة", "c": 0}]}}, {"id": "m5c5", "title": "التشغيل في الواجهة وفي الخلفية: الخيار ‎-d", "html": "<p>افتراضياً يعمل الـ container في الـ <b>foreground<\/b>: الـ Terminal يبقى مرتبطاً به ويعرض مخرجاته، ولا تستطيع كتابة أوامر أخرى. <code dir=\"ltr\">Ctrl+C<\/code> يوقفه.<\/p><p>مع <code dir=\"ltr\">-d<\/code> (اختصار <b>detached<\/b>) يعمل في الـ <b>background<\/b>: يطبع Docker رقم الـ container ويعيد لك الـ Terminal فوراً.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run nginx          # foreground\ndocker run -d nginx       # background<\/code><\/pre><p>متى تستخدم كل وضع؟<\/p><ul><li>الـ foreground للتجربة السريعة ورؤية الأخطاء مباشرة.<\/li><li>الـ background للخدمات التي تبقى عاملة: web server أو قاعدة بيانات.<\/li><\/ul><p>في وضع <code dir=\"ltr\">-d<\/code> لا ترى المخرجات مباشرة، وتقرؤها بـ <code dir=\"ltr\">docker logs<\/code>.<\/p>", "q": {"t": "s", "q": "اكتب الأمر الذي يشغّل container من الـ image <code dir=\"ltr\">redis<\/code> في الخلفية (دون خيارات أخرى).", "e": "<code dir=\"ltr\">-d<\/code> يعني detached: الـ container يعمل في الخلفية ويعود لك الـ Terminal.", "r": "^docker (container )?run (-d|--detach) redis$", "m": "<code dir=\"ltr\">docker run -d redis<\/code>"}}, {"id": "m5c6", "title": "الوضع التفاعلي: ‎-it", "html": "<p>أحياناً تريد الدخول إلى الـ container وكتابة أوامر داخله. تحتاج خيارين معاً:<\/p><ul><li><code dir=\"ltr\">-i<\/code> (<b>interactive<\/b>): يبقي قناة الإدخال مفتوحة ليستقبل ما تكتبه.<\/li><li><code dir=\"ltr\">-t<\/code> (<b>tty<\/b>): يوفر terminal حقيقياً: سطر أوامر وألوان.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -it ubuntu bash\n# root@3f2a1b:/# ls\n# root@3f2a1b:/# exit<\/code><\/pre><p>أنت الآن داخل shell يعمل في الـ container. <code dir=\"ltr\">exit<\/code> يخرجك، وبما أن <code dir=\"ltr\">bash<\/code> كان الـ process الرئيسي فإن الـ container يتوقف.<\/p><p>مفيد للاستكشاف: «ما الموجود داخل هذه الـ image؟»<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -it --rm python:3.13-slim bash<\/code><\/pre><p><code dir=\"ltr\">--rm<\/code> يحذف الـ container تلقائياً عند خروجك، وهو مثالي للتجارب.<\/p>", "q": {"t": "m", "q": "لماذا يتوقف الـ container عند كتابة <code dir=\"ltr\">exit<\/code> بعد <code dir=\"ltr\">docker run -it ubuntu bash<\/code>؟", "e": "الـ container يعيش بحياة الـ process الرئيسي (PID 1). عند خروج <code dir=\"ltr\">bash<\/code> لا يبقى ما يعمل فيتوقف.", "o": [{"h": "لأن <code dir=\"ltr\">-it<\/code> يضع حداً زمنياً", "c": 0}, {"h": "لأن <code dir=\"ltr\">bash<\/code> هو الـ process الرئيسي، وبانتهائه ينتهي الـ container", "c": 1}, {"h": "لأن Ubuntu لا تعمل في الخلفية", "c": 0}, {"h": "لأن الـ image حُذفت", "c": 0}]}}, {"id": "m5c7", "title": "نشر الـ Ports: ‎-p", "html": "<p>الـ container له شبكة معزولة، فالخدمة التي داخله غير مرئية من جهازك حتى تنشر الـ port:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d -p 8080:80 nginx<\/code><\/pre><p>الصيغة <code dir=\"ltr\">-p HOST_PORT:CONTAINER_PORT<\/code>. الآن <code dir=\"ltr\">http://localhost:8080<\/code> على جهازك يصل إلى port 80 داخل الـ container.<\/p><ul><li>يمكن نشر عدة ports بتكرار <code dir=\"ltr\">-p<\/code>.<\/li><li>يمكن تشغيل عدة containers من نفس الـ image على ports مختلفة في الـ host:<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d -p 8081:80 nginx\ndocker run -d -p 8082:80 nginx<\/code><\/pre><p>كلاهما يستمع على 80 داخلياً بلا تعارض، لأن لكل container شبكته. التعارض يحدث فقط في port الـ host.<\/p><div class=\"warn\"><code dir=\"ltr\">-p 8080:80<\/code> ينشر الـ port على كل واجهات الجهاز، أي يمكن الوصول إليه من الشبكة. لحصره في جهازك فقط اكتب <code dir=\"ltr\">-p 127.0.0.1:8080:80<\/code>.<\/div>", "q": {"t": "c", "q": "تريد تشغيل نسختين من تطبيق يستمع داخلياً على port 8000 على نفس الجهاز. أي إعداد صحيح؟", "e": "port الـ host يجب أن يكون فريداً. الـ port الداخلي يبقى 8000 في الاثنين لأن لكل container شبكته.", "o": [{"h": "<code dir=\"ltr\">-p 8000:8000<\/code> للاثنين", "c": 0}, {"h": "<code dir=\"ltr\">-p 8000:8000<\/code> للأول و <code dir=\"ltr\">-p 8001:8000<\/code> للثاني", "c": 1}, {"h": "<code dir=\"ltr\">-p 8000:8000<\/code> للأول و <code dir=\"ltr\">-p 8000:8001<\/code> للثاني", "c": 0}, {"h": "لا يمكن تشغيل نسختين", "c": 0}]}}, {"id": "m5c8", "title": "الـ Environment variables: ‎-e", "html": "<p>تمرير الإعدادات إلى الـ container يكون عبر environment variables:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name db \\\n  -e POSTGRES_USER=app \\\n  -e POSTGRES_PASSWORD=secret123 \\\n  -e POSTGRES_DB=shop \\\n  postgres:17<\/code><\/pre><p>الـ image الرسمية لـ PostgreSQL تقرأ هذه المتغيرات عند أول تشغيل وتنشئ المستخدم وقاعدة البيانات. كل image توثّق في صفحتها المتغيرات التي تفهمها.<\/p><p>لقائمة طويلة استخدم ملفاً:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --env-file .env postgres:17<\/code><\/pre><p>حيث <code dir=\"ltr\">.env<\/code> يحوي أسطراً بصيغة <code dir=\"ltr\">KEY=value<\/code>.<\/p><p>بهذا تبقى الـ image واحدة، وتختلف الإعدادات بين التطوير و Production.<\/p>", "q": {"t": "m", "q": "ما فائدة تمرير الإعدادات بـ <code dir=\"ltr\">-e<\/code> بدل وضعها داخل الـ image؟", "e": "الـ image تبقى عامة وثابتة، والإعدادات تُحقن عند التشغيل حسب البيئة.", "o": [{"h": "تسريع تشغيل الـ container", "c": 0}, {"h": "استخدام نفس الـ image في بيئات مختلفة بإعدادات مختلفة، ودون تخزين الأسرار داخلها", "c": 1}, {"h": "تصغير حجم الـ image", "c": 0}, {"h": "إلغاء الحاجة إلى الـ ports", "c": 0}]}}, {"id": "m5c9", "title": "docker ps: عرض الـ Containers", "html": "<pre dir=\"ltr\" data-lang=\"bash\"><code>docker ps        # الـ containers العاملة فقط\ndocker ps -a     # كل الـ containers ومنها المتوقفة<\/code><\/pre><p>أعمدة الناتج:<\/p><ul><li><b>CONTAINER ID<\/b>: المعرّف.<\/li><li><b>IMAGE<\/b>: الـ image المصدر.<\/li><li><b>COMMAND<\/b>: الأمر الذي يعمل داخله.<\/li><li><b>STATUS<\/b>: الحالة، مثل <code dir=\"ltr\">Up 5 minutes<\/code> أو <code dir=\"ltr\">Exited (1) 2 minutes ago<\/code>.<\/li><li><b>PORTS<\/b>: الـ ports المنشورة، مثل <code dir=\"ltr\">0.0.0.0:8080-&gt;80/tcp<\/code>.<\/li><li><b>NAMES<\/b>: الاسم.<\/li><\/ul><div class=\"warn\">إذا شغّلت container ولم تجده في <code dir=\"ltr\">docker ps<\/code> فلا تفترض أنه لم يُنشأ. الأرجح أنه توقف فوراً بسبب خطأ. نفّذ <code dir=\"ltr\">docker ps -a<\/code> وانظر إلى <code dir=\"ltr\">STATUS<\/code> ثم اقرأ الـ logs.<\/div>", "q": {"t": "s", "q": "اكتب الأمر الذي يعرض كل الـ containers ومنها المتوقفة.", "e": "<code dir=\"ltr\">docker ps<\/code> وحده يعرض العاملة فقط. <code dir=\"ltr\">-a<\/code> يضيف المتوقفة.", "r": "^docker (ps|container ls) (-a|--all)$", "m": "<code dir=\"ltr\">docker ps -a<\/code>"}}, {"id": "m5c10", "title": "دورة حياة الـ Container", "html": "<p>الـ container يمر بحالات:<\/p><div class=\"tw\"><table><thead><tr><th>الحالة<\/th><th>المعنى<\/th><th>كيف يصل إليها<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">created<\/code><\/td><td>أُنشئ ولم يُشغَّل<\/td><td><code dir=\"ltr\">docker create<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">running<\/code><\/td><td>يعمل<\/td><td><code dir=\"ltr\">docker start<\/code> أو <code dir=\"ltr\">docker run<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">paused<\/code><\/td><td>مجمّد مؤقتاً<\/td><td><code dir=\"ltr\">docker pause<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">exited<\/code><\/td><td>توقف، وما زال موجوداً<\/td><td>انتهاء الـ process أو <code dir=\"ltr\">docker stop<\/code><\/td><\/tr><tr><td>محذوف<\/td><td>لم يعد موجوداً<\/td><td><code dir=\"ltr\">docker rm<\/code><\/td><\/tr><\/tbody><\/table><\/div><pre dir=\"ltr\" data-lang=\"bash\"><code>docker stop web      # أوقفه\ndocker start web     # شغّل نفس الـ container من جديد\ndocker restart web   # stop ثم start\ndocker kill web      # إيقاف فوري<\/code><\/pre><p>كيف يعمل <code dir=\"ltr\">docker stop<\/code>؟ يرسل SIGTERM إلى الـ process الرئيسي وينتظر 10 ثوانٍ. إن لم يخرج يرسل SIGKILL.<\/p><p><b>الـ exit code<\/b> رقم يتركه الـ process عند خروجه: <code dir=\"ltr\">0<\/code> يعني نجاحاً، وأي رقم آخر يعني خطأ. أكواد شائعة:<\/p><ul><li><code dir=\"ltr\">1<\/code>: خطأ في التطبيق.<\/li><li><code dir=\"ltr\">137<\/code>: قُتل بـ SIGKILL، لأن <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>137<\/mn><mo>&#x0003D;<\/mo><mn>128<\/mn><mo>&#x0002B;<\/mo><mn>9<\/mn><\/mrow><\/math>. السبب إما <code dir=\"ltr\">docker kill<\/code> أو تجاوز حد الذاكرة.<\/li><li><code dir=\"ltr\">143<\/code>: خرج بعد SIGTERM، لأن <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"i
