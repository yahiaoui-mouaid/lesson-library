مذكور في <code dir=\"ltr\">image<\/code>.<\/li><\/ul><p><code dir=\"ltr\">build<\/code> له صيغة مفصلة:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>build:\n  context: ./backend\n  dockerfile: Dockerfile.prod\n  args:\n    APP_VERSION: \"1.4.2\"<\/code><\/pre><p>خدمة واحدة يمكن أن تُشغَّل منها عدة نسخ: <code dir=\"ltr\">docker compose up -d --scale worker=3<\/code>.<\/p>", "q": {"t": "m", "q": "ماذا يقابل الحقل <code dir=\"ltr\">command<\/code> في service من أوامر Docker؟", "e": "<code dir=\"ltr\">command<\/code> يستبدل <code dir=\"ltr\">CMD<\/code> الافتراضي للـ image عند تشغيل الخدمة.", "o": [{"h": "<code dir=\"ltr\">ENTRYPOINT<\/code> في الـ Dockerfile", "c": 0}, {"h": "الأمر المكتوب بعد اسم الـ image في <code dir=\"ltr\">docker run<\/code>، أي أنه يستبدل <code dir=\"ltr\">CMD<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker exec<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">RUN<\/code> في الـ Dockerfile", "c": 0}]}}, {"id": "m9c4", "title": "الشبكات في Compose", "html": "<p>دون أي إعداد، ينشئ Compose شبكة user-defined واحدة اسمها <code dir=\"ltr\">&lt;project&gt;_default<\/code> ويوصل بها كل الخدمات. وكل خدمة تُعرف على الشبكة <b>باسم الـ service<\/b>.<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    environment:\n      DB_HOST: db        # اسم الـ service\n  db:\n    image: postgres:17<\/code><\/pre><p>لهذا يعمل <code dir=\"ltr\">DB_HOST=db<\/code> فوراً دون أن تنشئ شبكة.<\/p><p>للتقسيم إلى مناطق عرّف شبكاتك:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  proxy:\n    networks: [frontend]\n  web:\n    networks: [frontend, backend]\n  db:\n    networks: [backend]\n\nnetworks:\n  frontend:\n  backend:\n    internal: true<\/code><\/pre><p>إذا حددت <code dir=\"ltr\">networks<\/code> لخدمة فلن توصل بالشبكة الافتراضية. هنا <code dir=\"ltr\">proxy<\/code> لا يرى <code dir=\"ltr\">db<\/code>.<\/p><p>تذكير: <code dir=\"ltr\">ports<\/code> للوصول من الـ host فقط. الخدمات تتخاطب داخلياً دون <code dir=\"ltr\">ports<\/code>.<\/p>", "q": {"t": "t", "q": "في Compose يجب تعريف شبكة يدوياً ليتمكن service من الوصول إلى آخر بالاسم.", "e": "Compose ينشئ شبكة افتراضية تلقائياً ويوصل بها كل الخدمات، فتتخاطب بأسماء الـ services مباشرة.", "a": false}}, {"id": "m9c5", "title": "الـ Volumes في Compose", "html": "<pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  db:\n    image: postgres:17\n    volumes:\n      - pgdata:/var/lib/postgresql/data       # named volume\n  web:\n    build: .\n    volumes:\n      - .:/app                                # bind mount للتطوير\n      - ./config/app.ini:/etc/app.ini:ro      # ملف للقراءة فقط\n\nvolumes:\n  pgdata:<\/code><\/pre><ul><li>الـ named volume يجب أن يُصرَّح به في القسم <code dir=\"ltr\">volumes<\/code> في أعلى الملف، وإلا يفشل Compose.<\/li><li>الـ bind mount لا يحتاج تصريحاً. المسارات النسبية تُحسب من مكان ملف الـ Compose.<\/li><li>اسم الـ volume الفعلي يصبح <code dir=\"ltr\">&lt;project&gt;_pgdata<\/code>.<\/li><\/ul><p>سلوك <code dir=\"ltr\">down<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose down       # يحذف الـ containers والشبكات، ويُبقي الـ volumes\ndocker compose down -v    # يحذف الـ volumes أيضاً<\/code><\/pre><div class=\"warn\"><code dir=\"ltr\">down -v<\/code> يحذف قاعدة بياناتك. استخدمه في التطوير فقط عندما تريد البدء من الصفر.<\/div><p>لاستخدام volume أُنشئ خارج Compose:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>volumes:\n  pgdata:\n    external: true<\/code><\/pre>", "q": {"t": "m", "q": "بعد <code dir=\"ltr\">docker compose down<\/code> (دون <code dir=\"ltr\">-v<\/code>) ثم <code dir=\"ltr\">docker compose up -d<\/code>، ما حال بيانات PostgreSQL المخزنة في named volume؟", "e": "<code dir=\"ltr\">down<\/code> يحذف الـ containers والشبكات فقط. الـ named volumes تبقى إلا مع <code dir=\"ltr\">-v<\/code>.", "o": [{"h": "باقية كما هي", "c": 1}, {"h": "حُذفت", "c": 0}, {"h": "بقي نصفها", "c": 0}, {"h": "تحولت إلى bind mount", "c": 0}]}}, {"id": "m9c6", "title": "إعداد الـ Environment", "html": "<p>ثلاث آليات، يُخلط بينها كثيراً:<\/p><p><b>1. <code dir=\"ltr\">environment<\/code><\/b>: متغيرات تُكتب مباشرة في الملف.<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>environment:\n  DEBUG: \"true\"\n  DB_HOST: db<\/code><\/pre><p><b>2. <code dir=\"ltr\">env_file<\/code><\/b>: تُحمَّل من ملف <b>إلى داخل الـ container<\/b>.<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>env_file:\n  - .env.web<\/code><\/pre><p><b>3. ملف <code dir=\"ltr\">.env<\/code> بجانب <code dir=\"ltr\">compose.yaml<\/code><\/b>: يقرؤه Compose نفسه تلقائياً لتعويض <code dir=\"ltr\">${VAR}<\/code> <b>داخل ملف الـ Compose<\/b>. لا يدخل الـ containers تلقائياً.<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  db:\n    image: postgres:${POSTGRES_VERSION:-17}\n    environment:\n      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}<\/code><\/pre><ul><li><code dir=\"ltr\">${VAR:-default}<\/code>: قيمة افتراضية إن لم يُعرَّف.<\/li><li><code dir=\"ltr\">${VAR:?message}<\/code>: يفشل برسالة إن لم يُعرَّف. مفيد للأسرار.<\/li><\/ul><p>الأولوية عند التعارض: ما في <code dir=\"ltr\">environment<\/code> يغلب ما في <code dir=\"ltr\">env_file<\/code>.<\/p><p>عملياً: الأسرار في <code dir=\"ltr\">.env<\/code> (خارج Git)، والملف <code dir=\"ltr\">compose.yaml<\/code> يشير إليها بـ <code dir=\"ltr\">${...}<\/code>. و <code dir=\"ltr\">docker compose config<\/code> يريك الملف بعد التعويض لتتأكد.<\/p>", "q": {"t": "c", "q": "وضعت <code dir=\"ltr\">SECRET_KEY=abc<\/code> في <code dir=\"ltr\">.env<\/code> بجانب <code dir=\"ltr\">compose.yaml<\/code>، لكن Django داخل الـ container لا يجد المتغير. ما السبب؟", "e": "أضف <code dir=\"ltr\">env_file: .env<\/code> للخدمة، أو <code dir=\"ltr\">SECRET_KEY: ${SECRET_KEY}<\/code> تحت <code dir=\"ltr\">environment<\/code>.", "o": [{"h": "ملف <code dir=\"ltr\">.env<\/code> لا يعمل مع Compose", "c": 0}, {"h": "<code dir=\"ltr\">.env<\/code> يُستخدم لتعويض <code dir=\"ltr\">${...}<\/code> في ملف الـ Compose فقط، ولا يدخل الـ container إلا إذا مررته بـ <code dir=\"ltr\">environment<\/code> أو <code dir=\"ltr\">env_file<\/code>", "c": 1}, {"h": "يجب إعادة بناء الـ image", "c": 0}, {"h": "اسم المتغير محجوز", "c": 0}]}}, {"id": "m9c7", "title": "depends_on", "html": "<p><code dir=\"ltr\">depends_on<\/code> يحدد ترتيب التشغيل والإيقاف بين الخدمات:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    depends_on:\n      - db\n      - redis<\/code><\/pre><p>عند <code dir=\"ltr\">up<\/code>: يشغّل Compose <code dir=\"ltr\">db<\/code> و <code dir=\"ltr\">redis<\/code> أولاً ثم <code dir=\"ltr\">web<\/code>. وعند <code dir=\"ltr\">down<\/code>: العكس.<\/p><div class=\"warn\">بهذه الصيغة القصيرة ينتظر Compose حتى <b>يبدأ<\/b> container قاعدة البيانات فقط، ولا ينتظر حتى تصبح <b>جاهزة لقبول الاتصالات<\/b>. PostgreSQL يحتاج ثواني للتهيئة بعد بدء الـ container، وخلالها قد يحاول Django الاتصال فيفشل.<\/div><p>الصيغة الطويلة تحل المشكلة بتحديد شرط:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>depends_on:\n  db:\n    condition: service_healthy<\/code><\/pre><p>الشروط المتاحة:<\/p><ul><li><code dir=\"ltr\">service_started<\/code>: بدأ الـ container. هذا الافتراضي.<\/li><li><code dir=\"ltr\">service_healthy<\/code>: نجح الـ health check الخاص بالخدمة.<\/li><li><code dir=\"ltr\">service_completed_successfully<\/code>: انتهت الخدمة بنجاح. مفيد لخدمة تنفّذ الـ migrations ثم تخرج.<\/li><\/ul><p>لكن <code dir=\"ltr\">service_healthy<\/code> يتطلب أن يكون للخدمة health check، وهو المفهوم التالي.<\/p>", "q": {"t": "m", "q": "ماذا تضمن الصيغة القصيرة <code dir=\"ltr\">depends_on: [db]<\/code>؟", "e": "الصيغة القصيرة تضمن ترتيب البدء فقط. الجاهزية تحتاج <code dir=\"ltr\">condition: service_healthy<\/code> مع health check.", "o": [{"h": "أن قاعدة البيانات جاهزة لقبول الاتصالات قبل تشغيل <code dir=\"ltr\">web<\/code>", "c": 0}, {"h": "أن container الـ <code dir=\"ltr\">db<\/code> بدأ قبل <code dir=\"ltr\">web<\/code>، دون ضمان جاهزيته", "c": 1}, {"h": "أن <code dir=\"ltr\">web<\/code> يُعاد تشغيله إذا توقف <code dir=\"ltr\">db<\/code>", "c": 0}, {"h": "أن الخدمتين على نفس الشبكة", "c": 0}]}}, {"id": "m9c8", "title": "الـ Health checks", "html": "<p>الـ container قد يكون في حالة <code dir=\"ltr\">running<\/code> والتطبيق داخله لا يعمل فعلاً: قاعدة بيانات ما زالت تتهيأ، أو تطبيق عالق. <b>الـ health check<\/b> أمر ينفذه Docker دورياً داخل الـ container ليسأل: هل الخدمة سليمة فعلاً؟<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  db:\n    image: postgres:17\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U ${DB_USER} -d ${DB_NAME}\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n      start_period: 10s\n  redis:\n    image: redis:7\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n  web:\n    depends_on:\n      db:\n        condition: service_healthy\n      redis:\n        condition: service_healthy<\/code><\/pre><ul><li><code dir=\"ltr\">test<\/code>: الأمر. نجاحه (exit code <code dir=\"ltr\">0<\/code>) يعني سليم.<\/li><li><code dir=\"ltr\">interval<\/code>: الفاصل بين الفحوص.<\/li><li><code dir=\"ltr\">timeout<\/code>: أقصى مدة للفحص الواحد.<\/li><li><code dir=\"ltr\">retries<\/code>: عدد الفشل المتتالي قبل إعلان الحالة <code dir=\"ltr\">unhealthy<\/code>.<\/li><li><code dir=\"ltr\">start_period<\/code>: مهلة بدء لا يُحتسب الفشل خلالها.<\/li><\/ul><p>الحالات: <code dir=\"ltr\">starting<\/code> ثم <code dir=\"ltr\">healthy<\/code> أو <code dir=\"ltr\">unhealthy<\/code>، وتظهر في <code dir=\"ltr\">docker compose ps<\/code>.<\/p><p>بعد انتهاء مهلة البدء، أقصى زمن لاكتشاف العطل تقريباً:<\/p><div class=\"mblock\"><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>t<\/mi><mo>&#x02248;<\/mo><mtext>interval<\/mtext><mo>&#x000D7;<\/mo><mtext>retries<\/mtext><mo>&#x0003D;<\/mo><mn>5<\/mn><mo>&#x000D7;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>25<\/mn><mtext>&#x000A0;s<\/mtext><\/mrow><\/math><\/div><p>لتطبيق ويب يكون الفحص طلباً إلى endpoint خفيف مثل <code dir=\"ltr\">/health/<\/code>. تأكد أن أداة الفحص (<code dir=\"ltr\">curl<\/code> مثلاً) موجودة في الـ image، أو استخدم Python نفسه.<\/p><p>يمكن تعريف الفحص في الـ Dockerfile أيضاً بالتعليمة <code dir=\"ltr\">HEALTHCHECK<\/code>.<\/p>", "q": {"t": "c", "q": "Django يفشل أحياناً عند <code dir=\"ltr\">docker compose up<\/code> برسالة <code dir=\"ltr\">connection refused<\/code> من قاعدة البيانات، ثم يعمل إذا أعدت تشغيله يدوياً. ما الحل الصحيح؟", "e": "المشكلة سباق بين بدء Django وجاهزية PostgreSQL. الـ health check يجعل Compose ينتظر الجاهزية الفعلية. <code dir=\"ltr\">sleep<\/code> تخمين هش.", "o": [{"h": "إضافة <code dir=\"ltr\">sleep 30<\/code> قبل تشغيل Django", "c": 0}, {"h": "تعريف <code dir=\"ltr\">healthcheck<\/code> لقاعدة البيانات واستخدام <code dir=\"ltr\">depends_on<\/code> مع <code dir=\"ltr\">condition: service_healthy<\/code>", "c": 1}, {"h": "نشر port قاعدة البيانات", "c": 0}, {"h": "تغيير <code dir=\"ltr\">DB_HOST<\/code> إلى <code dir=\"ltr\">localhost<\/code>", "c": 0}]}}, {"id": "m9c9", "title": "الـ Restart policies", "html": "<p>ماذا يفعل Docker إذا توقف الـ container؟ يحدده الحقل <code dir=\"ltr\">restart<\/code>:<\/p><div class=\"tw\"><table><thead><tr><th>القيمة<\/th><th>السلوك<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">\"no\"<\/code><\/td><td>لا يعيد التشغيل. الافتراضي<\/td><\/tr><tr><td><code dir=\"ltr\">on-failure<\/code><\/td><td>يعيد إذا خرج بـ exit code غير الصفر<\/td><\/tr><tr><td><code dir=\"ltr\">always<\/code><\/td><td>يعيد دائماً، حتى بعد إعادة تشغيل الـ daemon<\/td><\/tr><tr><td><code dir=\"ltr\">unless-stopped<\/code><\/td><td>مثل <code dir=\"ltr\">always<\/code>، لكن إذا أوقفته يدوياً يبقى متوقفاً<\/td><\/tr><\/tbody><\/table><\/div><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    restart: unless-stopped<\/code><\/pre><p>ومع <code dir=\"ltr\">docker run<\/code>: <code dir=\"ltr\">--restart unless-stopped<\/code>.<\/p><p>الفوائد:<\/p><ul><li>التطبيق يعود تلقائياً بعد crash.<\/li><li>بعد إعادة تشغيل السيرفر تعود الخدمات دون تدخل منك.<\/li><\/ul><p><code dir=\"ltr\">unless-stopped<\/code> هو الاختيار الشائع لخدمات Production.<\/p><p>انتبه: إعادة التشغيل تعالج العَرَض. إذا رأيت الحالة <code dir=\"ltr\">Restarting<\/code> تتكرر في <code dir=\"ltr\">docker compose ps<\/code> فالتطبيق في <b>crash loop<\/b>، وعليك قراءة الـ logs وإصلاح السبب.<\/p><p>اكتب <code dir=\"ltr\">\"no\"<\/code> بين علامتي تنصيص، لأن YAML يفسّر <code dir=\"ltr\">no<\/code> دونها كقيمة منطقية <code dir=\"ltr\">false<\/code>.<\/p>", "q": {"t": "m", "q": "ما الفرق بين <code dir=\"ltr\">always<\/code> و <code dir=\"ltr\">unless-stopped<\/code>؟", "e": "كلاهما يعيد التشغيل تلقائياً، والفرق في احترام الإيقاف اليدوي.", "o": [{"h": "لا فرق", "c": 0}, {"h": "<code dir=\"ltr\">always<\/code> لا يعمل بعد إعادة تشغيل السيرفر", "c": 0}, {"h": "container أوقفته يدوياً يبقى متوقفاً بعد إعادة تشغيل الـ daemon مع <code dir=\"ltr\">unless-stopped<\/code>، ويعود للعمل مع <code dir=\"ltr\">always<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">unless-stopped<\/code> يعيد التشغيل عند الفشل فقط", "c": 0}]}}, {"id": "m9c10", "title": "أوامر التشغيل: up و down و build و restart", "html": "<pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose up            # شغّل في الـ foreground\ndocker compose up -d         # شغّل في الـ background\ndocker compose up -d --build # أعد البناء ثم شغّل\ndocker compose up -d web     # خدمة محددة مع ما تعتمد عليه\ndocker compose down          # أوقف واحذف الـ containers والشبكات\ndocker compose stop          # أوقف دون حذف\ndocker compose start         # شغّل ما أُوقف\ndocker compose build         # ابنِ الـ images فقط\ndocker compose build --no-cache web\ndocker compose restart web   # أعد تشغيل الخدمة\ndocker compose pull          # اسحب أحدث الـ images<\/code><\/pre><p>أهم ما يجب فهمه في <code dir=\"ltr\">up<\/code>: هو <b>يقارن<\/b> الحالة الحالية بالملف، ثم يغيّر ما يلزم فقط. إذا عدّلت إعدادات <code dir=\"ltr\">web<\/code> ونفّذت <code dir=\"ltr\">up -d<\/code> فسيعيد إنشاء <code dir=\"ltr\">web<\/code> وحده ويترك <code dir=\"ltr\">db<\/code> يعمل.<\/p><p>فروق تسبب أخطاء:<\/p><ul><li><b><code dir=\"ltr\">restart<\/code> لا يطبّق تغييرات <code dir=\"ltr\">compose.yaml<\/code><\/b> ولا يعيد البناء. هو يعيد تشغيل نفس الـ container. لتطبيق تعديل في الملف استخدم <code dir=\"ltr\">up -d<\/code>.<\/li><li><b><code dir=\"ltr\">up -d<\/code> لا يعيد بناء الـ image<\/b> إذا كانت موجودة. بعد تعديل الـ Dockerfile أو الكود المنسوخ داخل الـ image استخدم <code dir=\"ltr\">up -d --build<\/code>.<\/li><\/ul>", "q": {"t": "c", "q": "عدّلت قيمة environment variable في <code dir=\"ltr\">compose.yaml<\/code> ثم نفّذت <code dir=\"ltr\">docker compose restart web<\/code>، لكن التطبيق ما زال يرى القيمة القديمة. لماذا؟", "e": "إعدادات الـ container تُثبَّت عند إنشائه. <code dir=\"ltr\">up -d<\/code> يكتشف التغيير ويعيد إنشاء الـ container.", "o": [{"h": "المتغيرات لا تتغير بعد أول تشغيل", "c": 0}, {"h": "<code dir=\"ltr\">restart<\/code> يعيد تشغيل نفس الـ container بإعداداته القديمة. تطبيق التغيير يحتاج <code dir=\"ltr\">docker compose up -d<\/code>", "c": 1}, {"h": "يجب حذف الـ image", "c": 0}, {"h": "يجب تنفيذ <code dir=\"ltr\">down -v<\/code>", "c": 0}]}}, {"id": "m9c11", "title": "أوامر الفحص: ps و logs و exec و config", "html": "<pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose ps                 # حالة خدمات المشروع وصحتها\ndocker compose ps -a              # مع المتوقفة\ndocker compose logs               # logs كل الخدمات\ndocker compose logs -f web        # تابع خدمة واحدة\ndocker compose logs --tail 100 web db\ndocker compose exec web bash      # shell داخل خدمة تعمل\ndocker compose exec web python manage.py migrate\ndocker compose exec db psql -U app -d shop\ndocker compose run --rm web python manage.py createsuperuser\ndocker compose config             # اعرض الملف النهائي بعد الدمج والتعويض\ndocker compose top                # الـ processes في كل خدمة<\/code><\/pre><p>ملاحظات:<\/p><ul><li>تستخدم <b>اسم الـ service<\/b> وليس اسم الـ container.<\/li><li><code dir=\"ltr\">exec<\/code> يفترض الوضع التفاعلي افتراضياً، فلا تحتاج <code dir=\"ltr\">-it<\/code>.<\/li><li><b><code dir=\"ltr\">exec<\/code> مقابل <code dir=\"ltr\">run<\/code><\/b>: <code dir=\"ltr\">exec<\/code> ينفّذ داخل container يعمل. <code dir=\"ltr\">run<\/code> ينشئ container جديداً مؤقتاً من نفس الخدمة لتنفيذ أمر واحد، واستخدم معه <code dir=\"ltr\">--rm<\/code>.<\/li><li><b><code dir=\"ltr\">config<\/code><\/b> أداة تشخيص أساسية: يتحقق من صحة الملف ويريك القيم بعد تعويض <code dir=\"ltr\">${...}<\/code> ودمج الملفات. نفّذه عند أي سلوك غير مفهوم.<\/li><\/ul>", "q": {"t": "s", "q": "اكتب الأمر الذي يعرض ملف الـ Compose النهائي بعد تعويض المتغيرات ودمج الملفات.", "e": "<code dir=\"ltr\">docker compose config<\/code> يتحقق من الصيغة ويعرض الإعداد الفعلي الذي سيُنفَّذ.", "r": "^docker compose config$", "m": "<code dir=\"ltr\">docker compose config<\/code>"}}, {"id": "m9c12", "title": "الـ Multiple Compose files والـ Profiles", "html": "<p>تطبيق واحد يحتاج إعدادات مختلفة حسب البيئة. بدل نسخ الملف كاملاً، تكتب <b>ملفاً أساسياً<\/b> وملفات <b>تعدّل عليه<\/b>.<\/p><p><b>الدمج التلقائي:<\/b> إذا وُجد <code dir=\"ltr\">compose.override.yaml<\/code> بجانب <code dir=\"ltr\">compose.yaml<\/code> فإن Compose يدمجه تلقائياً. مناسب لإعدادات التطوير.<\/p><p><b>الدمج الصريح بـ <code dir=\"ltr\">-f<\/code>:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose -f compose.yaml -f compose.prod.yaml up -d<\/code><\/pre><p>الملف اللاحق يغلب السابق. قواعد الدمج:<\/p><ul><li>القيم المفردة (<code dir=\"ltr\">image<\/code> و <code dir=\"ltr\">command<\/code>) تُستبدل.<\/li><li>القوائم (<code dir=\"ltr\">ports<\/code> و <code dir=\"ltr\">volumes<\/code>) تُضاف إلى بعضها.<\/li><li>القواميس (<code dir=\"ltr\">environment<\/code>) تُدمج مفتاحاً بمفتاح.<\/li><\/ul><p>عند استخدام <code dir=\"ltr\">-f<\/code> لا يُحمَّل <code dir=\"ltr\">compose.override.yaml<\/code> تلقائياً.<\/p><p><b>الـ Profiles<\/b> لتشغيل خدمات اختيارية عند الطلب:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  pgadmin:\n    image: dpage/pgadmin4\n    profiles: [tools]<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose up -d                   # دون pgadmin\ndocker compose --profile tools up -d   # مع pgadmin<\/code><\/pre><p>وتحقق دائماً من النتيجة: <code dir=\"ltr\">docker compose -f compose.yaml -f compose.prod.yaml config<\/code>.<\/p>", "q": {"t": "m", "q": "ماذا يحدث إذا وُجد <code dir=\"ltr\">compose.override.yaml<\/code> بجانب <code dir=\"ltr\">compose.yaml<\/code> ونفّذت <code dir=\"ltr\">docker compose up -d<\/code> دون <code dir=\"ltr\">-f<\/code>؟", "e": "Compose يحمّل الملفين معاً بهذا الترتيب افتراضياً. مع <code dir=\"ltr\">-f<\/code> يُحمَّل ما تذكره فقط.", "o": [{"h": "يُتجاهل الـ override", "c": 0}, {"h": "يُدمج الملفان تلقائياً وتغلب قيم الـ override", "c": 1}, {"h": "يفشل الأمر بسبب وجود ملفين", "c": 0}, {"h": "يُستخدم الـ override وحده", "c": 0}]}}, {"id": "m9c13", "title": "إعدادات التطوير مقابل إعدادات Production", "html": "<p>نفس الخدمات، وأولويات مختلفة: في التطوير الراحة وسرعة التجربة، وفي Production الأمان والثبات.<\/p><div class=\"tw\"><table><thead><tr><th>الجانب<\/th><th>Development<\/th><th>Production<\/th><\/tr><\/thead><tbody><tr><td>الكود<\/td><td>bind mount للتعديل الفوري<\/td><td>منسوخ داخل الـ image<\/td><\/tr><tr><td>الخادم<\/td><td><code dir=\"ltr\">runserver<\/code><\/td><td><code dir=\"ltr\">gunicorn<\/code><\/td><\/tr><tr><td><code dir=\"ltr\">DEBUG<\/code><\/td><td><code dir=\"ltr\">true<\/code><\/td><td><code dir=\"ltr\">false<\/code><\/td><\/tr><tr><td>الـ image<\/td><td><code dir=\"ltr\">build: .<\/code><\/td><td>image بـ tag محدد من registry<\/td><\/tr><tr><td>الـ ports<\/td><td>كثيرة للتشخيص<\/td><td>الـ proxy فقط<\/td><\/tr><tr><td><code dir=\"ltr\">restart<\/code><\/td><td>بلا<\/td><td><code dir=\"ltr\">unless-stopped<\/code><\/td><\/tr><tr><td>الأسرار<\/td><td>قيم وهمية<\/td><td><code dir=\"ltr\">.env<\/code> خارج Git أو secrets<\/td><\/tr><tr><td>حدود الموارد والـ logging<\/td><td>بلا<\/td><td>مضبوطة<\/td><\/tr><\/tbody><\/table><\/div><p>التقسيم العملي:<\/p><p><code dir=\"ltr\">compose.yaml<\/code> الأساس المشترك:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    build: .\n    depends_on:\n      db:\n        condition: service_healthy\n  db:\n    image: postgres:17\n    volumes:\n      - pgdata:/var/lib/postgresql/data\nvolumes:\n  pgdata:<\/code><\/pre><p><code dir=\"ltr\">compose.override.yaml<\/code> للتطوير، ويُحمَّل تلقائياً:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    command: python manage.py runserver 0.0.0.0:8000\n    volumes:\n      - .:/app\n    ports:\n      - \"8000:8000\"\n    environment:\n      DEBUG: \"true\"<\/code><\/pre><p><code dir=\"ltr\">compose.prod.yaml<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    image: ghcr.io/ali/shop-api:1.4.2\n    restart: unless-stopped\n    environment:\n      DEBUG: \"false\"<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose up -d                                          # تطوير\ndocker compose -f compose.yaml -f compose.prod.yaml up -d     # Production<\/code><\/pre>", "q": {"t": "m", "q": "لماذا لا نستخدم bind mount للكود في Production؟", "e": "في Production الـ image هي وحدة النشر الكاملة. الـ bind mount يكسر ذلك ويجعل ما يعمل معتمداً على حالة ملفات السيرفر.", "o": [{"h": "لأنه أبطأ دائماً", "c": 0}, {"h": "لأن الـ container يجب أن يشغّل الكود المبني داخل الـ image بنسختها المحددة، دون اعتماد على ملفات موجودة على السيرفر", "c": 1}, {"h": "لأن Compose يمنعه", "c": 0}, {"h": "لأنه يحذف قاعدة البيانات", "c": 0}]}}], "test": [{"t": "m", "q": "ما الأمر الذي يطبّق تعديلاً أجريته في <code dir=\"ltr\">compose.yaml<\/code> على خدمة تعمل؟", "e": "<code dir=\"ltr\">up -d<\/code> يقارن الحالة بالملف ويعيد إنشاء ما تغيّر. <code dir=\"ltr\">restart<\/code> لا يقرأ التغييرات.", "o": [{"h": "<code dir=\"ltr\">docker compose restart<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker compose up -d<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker compose logs<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker compose ps<\/code>", "c": 0}]}, {"t": "t", "q": "الخدمات في نفس ملف الـ Compose تتخاطب باسم الـ service دون أي إعداد للشبكة.", "e": "Compose ينشئ شبكة افتراضية ويسجّل كل خدمة باسمها في الـ DNS الداخلي.", "a": true}, {"t": "s", "q": "اكتب الأمر الذي يوقف المشروع ويحذف الـ containers والشبكات ويحذف معها الـ volumes.", "e": "<code dir=\"ltr\">-v<\/code> يحذف الـ named volumes المعرّفة في الملف. خطير على البيانات.", "r": "^docker compose down (-v|--volumes)$", "m": "<code dir=\"ltr\">docker compose down -v<\/code>"}, {"t": "c", "q": "تريد أن ينتظر <code dir=\"ltr\">web<\/code> حتى تصبح PostgreSQL جاهزة فعلاً. ما المطلوب؟", "e": "الشرط <code dir=\"ltr\">service_healthy<\/code> ينتظر نجاح الـ health check، وهو ما يثبت الجاهزية.", "o": [{"h": "<code dir=\"ltr\">depends_on: [db]<\/code> فقط", "c": 0}, {"h": "<code dir=\"ltr\">healthcheck<\/code> على <code dir=\"ltr\">db<\/code> مع <code dir=\"ltr\">depends_on<\/code> بشرط <code dir=\"ltr\">condition: service_healthy<\/code> في <code dir=\"ltr\">web<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">restart: always<\/code> على <code dir=\"ltr\">db<\/code>", "c": 0}, {"h": "نشر port 5432", "c": 0}]}, {"t": "m", "q": "ما وظيفة ملف <code dir=\"ltr\">.env<\/code> الموجود بجانب <code dir=\"ltr\">compose.yaml<\/code>؟", "e": "لإدخال المتغيرات إلى container تستخدم <code dir=\"ltr\">environment<\/code> أو <code dir=\"ltr\">env_file<\/code>.", "o": [{"h": "يدخل كل متغيراته إلى كل الـ containers تلقائياً", "c": 0}, {"h": "يوفّر القيم لتعويض <code dir=\"ltr\">${VAR}<\/code> داخل ملف الـ Compose", "c": 1}, {"h": "يحدد ترتيب تشغيل الخدمات", "c": 0}, {"h": "يخزن الـ logs", "c": 0}]}, {"t": "m", "q": "أي restart policy هو الاختيار الشائع لخدمات Production؟", "e": "يعيد التشغيل بعد الأعطال وبعد إعادة تشغيل السيرفر، ويحترم الإيقاف اليدوي.", "o": [{"h": "<code dir=\"ltr\">\"no\"<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">on-failure:1<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">unless-stopped<\/code>", "c": 1}, {"h": "لا يوجد restart في Compose", "c": 0}]}, {"t": "t", "q": "الأمر <code dir=\"ltr\">docker compose up -d<\/code> يعيد بناء الـ image تلقائياً كلما تغيّر الكود.", "e": "إذا كانت الـ image موجودة فلن تُبنى ثانية. استخدم <code dir=\"ltr\">up -d --build<\/code>.", "a": false}, {"t": "c", "q": "عدّلت الـ Dockerfile وأضفت مكتبة جديدة، ثم نفّذت <code dir=\"ltr\">docker compose up -d<\/code> فلم تجد المكتبة داخل الـ container. ما الأمر الصحيح؟", "e": "تغيير الـ Dockerfile يتطلب إعادة بناء الـ image، و <code dir=\"ltr\">--build<\/code> يفعل ذلك قبل التشغيل.", "o": [{"h": "<code dir=\"ltr\">docker compose restart web<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker compose up -d --build<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker compose down -v<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker compose config<\/code>", "c": 0}]}]}, {"id": "m10", "title": "Stage 7: Docker في Production والتحسين", "badge": "Advanced", "dur": "7–10 أيام", "intro": "<p>هنا تنتقل من «أعرف Docker» إلى «أستخدمه باحتراف». أربعة محاور بالترتيب: تحسين الـ images، ثم الأمان، ثم الاعتمادية، ثم النشر.<\/p>", "cs": [{"id": "m10c1", "title": "الـ Multi-stage builds", "html": "<p>بناء التطبيق يحتاج أدوات (compilers، Node.js، ملفات مصدرية) لا يحتاجها التشغيل. <b>الـ multi-stage build<\/b> يقسم الـ Dockerfile إلى مراحل، كل مرحلة تبدأ بـ <code dir=\"ltr\">FROM<\/code>، وتنسخ المرحلة الأخيرة من سابقاتها <b>النتيجة فقط<\/b>. الـ image النهائية تحوي المرحلة الأخيرة وحدها.<\/p><p>مثال React: البناء يحتاج Node، والتشغيل يحتاج ملفات ثابتة فقط:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM caddy:2-alpine\nCOPY --from=build /app/dist /srv<\/code><\/pre><ul><li><code dir=\"ltr\">AS build<\/code> يسمّي المرحلة.<\/li><li><code dir=\"ltr\">COPY --from=build<\/code> ينسخ من تلك المرحلة.<\/li><\/ul><p>النتيجة: image نهائية بعشرات الـ MB بدل أكثر من 1GB مع <code dir=\"ltr\">node_modules<\/code>، ولا تحوي Node ولا الكود المصدري.<\/p><p>مثال Python عندما تحتاج المكتبات أدوات compile:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM python:3.13-slim AS builder\nRUN apt-get update &amp;&amp; apt-get install -y --no-install-recommends build-essential libpq-dev\nRUN python -m venv /venv\nENV PATH=\"/venv/bin:$PATH\"\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nFROM python:3.13-slim\nRUN apt-get update &amp;&amp; apt-get install -y --no-install-recommends libpq5 \\\n &amp;&amp; rm -rf /var/lib/apt/lists/*\nCOPY --from=builder /venv /venv\nENV PATH=\"/venv/bin:$PATH\"\nWORKDIR /app\nCOPY . .\nCMD [\"gunicorn\", \"config.wsgi:application\", \"--bind\", \"0.0.0.0:8000\"]<\/code><\/pre><p>أدوات البناء بقيت في <code dir=\"ltr\">builder<\/code> ولم تدخل الـ image النهائية. ولبناء مرحلة بعينها: <code dir=\"ltr\">docker build --target builder .<\/code><\/p>", "q": {"t": "m", "q": "ما الذي تحويه الـ image النهائية في multi-stage build؟", "e": "المراحل السابقة تُستخدم للبناء ثم تُترك. يدخل الـ image النهائية فقط ما تنسخه بـ <code dir=\"ltr\">COPY --from<\/code>.", "o": [{"h": "كل المراحل مجتمعة", "c": 0}, {"h": "المرحلة الأخيرة فقط، مع ما نُسخ إليها صراحة من المراحل السابقة", "c": 1}, {"h": "المرحلة الأولى فقط", "c": 0}, {"h": "أكبر المراحل حجماً", "c": 0}]}}, {"id": "m10c2", "title": "الـ Base images الصغيرة والموثوقة", "html": "<p>كل ما في الـ base image يصبح جزءاً من تطبيقك: حجمه وثغراته. لذلك الاختيار قرار أمني وليس شكلياً.<\/p><p><b>الصغر:<\/b> برامج أقل تعني ثغرات محتملة أقل (تصغير <b>attack surface<\/b>، أي مساحة الهجوم) وتنزيلاً أسرع.<\/p><ul><li><code dir=\"ltr\">-slim<\/code>: Debian مختصر. توازن جيد.<\/li><li><code dir=\"ltr\">-alpine<\/code>: أصغر، مع احتمال مشاكل توافق في Python.<\/li><li><b>distroless<\/b>: بلا shell ولا package manager. أكثر أماناً وأصعب في التشخيص.<\/li><\/ul><p><b>الثقة:<\/b><\/p><ul><li>استخدم <b>Docker Official Images<\/b> أو صور <b>Verified Publisher<\/b>.<\/li><li>لا تستخدم image من حساب مجهول لمجرد أنها تعمل. قد تحوي برمجيات خبيثة.<\/li><li>ثبّت النسخة: <code dir=\"ltr\">python:3.13-slim<\/code> وليس <code dir=\"ltr\">python:latest<\/code>.<\/li><li><b>حدّث بانتظام<\/b>: الـ base image تتلقى إصلاحات أمنية، وأنت تحصل عليها فقط إذا أعدت البناء بعد <code dir=\"ltr\">docker pull<\/code>.<\/li><\/ul>", "q": {"t": "m", "q": "لماذا تُعتبر الـ base image الأصغر أكثر أماناً غالباً؟", "e": "كل برنامج إضافي داخل الـ image مصدر محتمل لثغرة. قلة المحتوى تقلل المخاطر.", "o": [{"h": "لأنها مشفرة", "c": 0}, {"h": "لأنها تحوي برامج ومكتبات أقل، فمساحة الهجوم والثغرات المحتملة أقل", "c": 1}, {"h": "لأنها تعمل بمستخدم غير root تلقائياً", "c": 0}, {"h": "لأنها لا تتصل بالشبكة", "c": 0}]}}, {"id": "m10c3", "title": "الـ Layer caching المتقدم", "html": "<p>تعرف من Stage 3 قاعدة الترتيب: المستقر أولاً والمتغير أخيراً. توجد أدوات إضافية:<\/p><p><b>1. الـ Cache mounts:<\/b> مجلد cache يبقى بين عمليات البناء ولا يدخل الـ image.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN --mount=type=cache,target=/root/.cache/pip \\\n    pip install -r requirements.txt<\/code><\/pre><p>عند تغيير <code dir=\"ltr\">requirements.txt<\/code> تُعاد الطبقة، لكن <code dir=\"ltr\">pip<\/code> يجد الحزم التي نزّلها سابقاً في الـ cache فلا ينزّلها ثانية. لاحظ غياب <code dir=\"ltr\">--no-cache-dir<\/code> هنا، فنحن نريد الـ cache، وهو خارج الـ image.<\/p><p><b>2. نسخ ملفات الـ dependencies فقط أولاً:<\/b> <code dir=\"ltr\">package.json<\/code> و <code dir=\"ltr\">package-lock.json<\/code> ثم <code dir=\"ltr\">npm ci<\/code>، ثم بقية الكود.<\/p><p><b>3. الـ cache في CI:<\/b> خوادم الـ CI تبدأ كل مرة نظيفة بلا cache. الحل تخزينه واستعادته:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker buildx build \\\n  --cache-from type=registry,ref=ghcr.io/ali/shop-api:buildcache \\\n  --cache-to type=registry,ref=ghcr.io/ali/shop-api:buildcache,mode=max \\\n  -t ghcr.io/ali/shop-api:1.4.2 --push .<\/code><\/pre><p><b>4. انتبه لما يكسر الـ cache:<\/b> <code dir=\"ltr\">COPY . .<\/code> مبكراً، أو <code dir=\"ltr\">ARG<\/code> تتغير قيمته في كل بناء (مثل تاريخ البناء) قبل الخطوات الثقيلة.<\/p>", "q": {"t": "m", "q": "ما ميزة <code dir=\"ltr\">RUN --mount=type=cache,target=/root/.cache/pip<\/code>؟", "e": "الـ cache mount مساحة دائمة لأدوات البناء خارج الطبقات، فيسرّع إعادة التثبيت دون أثر على حجم الـ image.", "o": [{"h": "يصغّر الـ image النهائية إلى النصف", "c": 0}, {"h": "يبقي الحزم المنزّلة بين عمليات البناء دون إدخالها في الـ image", "c": 1}, {"h": "يشفّر المكتبات", "c": 0}, {"h": "يثبّت المكتبات وقت التشغيل", "c": 0}]}}, {"id": "m10c4", "title": "الـ BuildKit", "html": "<p><b>BuildKit<\/b> هو محرك البناء الحديث في Docker، وهو الافتراضي منذ Docker Engine 23. أنت تستخدمه مع كل <code dir=\"ltr\">docker build<\/code> دون أن تفعّل شيئاً.<\/p><p>ما يقدمه:<\/p><ul><li><b>بناء متوازٍ<\/b>: المراحل المستقلة في multi-stage تُبنى معاً.<\/li><li><b>تخطي غير المستخدم<\/b>: مرحلة لا تعتمد عليها النتيجة النهائية لا تُبنى.<\/li><li><b>الـ mounts في <code dir=\"ltr\">RUN<\/code><\/b>: <code dir=\"ltr\">type=cache<\/code> و <code dir=\"ltr\">type=secret<\/code> و <code dir=\"ltr\">type=ssh<\/code>.<\/li><li><b>cache قابل للتصدير والاستيراد<\/b> كما رأينا.<\/li><li><b>بناء لعدة معماريات<\/b>: <code dir=\"ltr\">--platform linux/amd64,linux/arm64<\/code>. مهم إذا كان جهازك Mac بمعالج ARM والسيرفر <code dir=\"ltr\">amd64<\/code>.<\/li><\/ul><p><code dir=\"ltr\">docker buildx<\/code> هو واجهة الأوامر الموسعة لـ BuildKit.<\/p><p>السطر الاختياري في أول الـ Dockerfile:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code># syntax=docker/dockerfile:1<\/code><\/pre><p>يطلب أحدث صيغة مستقرة من لغة الـ Dockerfile.<\/p><p>لرؤية المخرجات الكاملة لكل خطوة عند التشخيص:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker build --progress=plain .<\/code><\/pre>", "q": {"t": "c", "q": "بنيت image على Mac بمعالج Apple Silicon ورفعتها، فرفض سيرفر <code dir=\"ltr\">amd64<\/code> تشغيلها برسالة <code dir=\"ltr\">exec format error<\/code>. ما الحل؟", "e": "الـ image مبنية لمعمارية ARM والسيرفر <code dir=\"ltr\">amd64<\/code>. BuildKit يبني لمعمارية الهدف بالخيار <code dir=\"ltr\">--platform<\/code>.", "o": [{"h": "إعادة تشغيل السيرفر", "c": 0}, {"h": "بناء الـ image للمعمارية الصحيحة: <code dir=\"ltr\">docker buildx build --platform linux/amd64 ...<\/code>", "c": 1}, {"h": "تغيير الـ tag", "c": 0}, {"h": "حذف <code dir=\"ltr\">.dockerignore<\/code>", "c": 0}]}}, {"id": "m10c5", "title": "تشغيل الـ Containers بمستخدم غير root", "html": "<p>نراجع ما بدأناه في Stage 3 بمنظور Production. الـ root داخل الـ container هو نفسه root في الـ kernel مع قيود. إذا وُجدت ثغرة هروب من الـ container فالمهاجم يصل إلى الـ host بصلاحيات root.<\/p><p>في الـ Dockerfile:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN useradd --create-home --uid 1000 app\nCOPY --chown=app:app . .\nUSER app<\/code><\/pre><p>تحقق:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run --rm shop-api:1.4.2 whoami     # app\ndocker run --rm shop-api:1.4.2 id<\/code><\/pre><p>ويمكن فرض المستخدم عند التشغيل حتى لو لم تحدده الـ image:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    user: \"1000:1000\"<\/code><\/pre><p>مشاكل متوقعة وحلولها:<\/p><ul><li><b>الكتابة في volume<\/b>: الـ volume الجديد يملكه root. أنشئ المجلد وغيّر مالكه في الـ Dockerfile قبل <code dir=\"ltr\">USER<\/code>، فينسخ Docker الصلاحيات إلى الـ volume الفارغ عند أول ربط.<\/li><li><b>الـ ports تحت 1024<\/b>: استخدم 8000 داخلياً ودع الـ proxy يستمع على 80 و 443.<\/li><li>كثير من الـ Official Images (مثل <code dir=\"ltr\">postgres<\/code>) تبدأ كـ root للتهيئة ثم تتحول تلقائياً لمستخدم محدود.<\/li><\/ul>", "q": {"t": "m", "q": "كيف تتأكد أن تطبيقك لا يعمل كـ root داخل الـ container؟", "e": "<code dir=\"ltr\">docker exec web whoami<\/code> يعرض المستخدم الفعلي الذي يعمل به الـ container.", "o": [{"h": "بقراءة <code dir=\"ltr\">docker logs<\/code>", "c": 0}, {"h": "بتنفيذ <code dir=\"ltr\">whoami<\/code> أو <code dir=\"ltr\">id<\/code> داخل الـ container", "c": 1}, {"h": "بتنفيذ <code dir=\"ltr\">docker images<\/code>", "c": 0}, {"h": "لا يمكن معرفة ذلك", "c": 0}]}}, {"id": "m10c6", "title": "فحص ثغرات الـ Images", "html": "<p>الـ image تحوي مئات الحزم، وتُكتشف ثغرات جديدة فيها باستمرار. كل ثغرة معروفة لها رقم <b>CVE<\/b> في قاعدة بيانات عامة. <b>الـ vulnerability scanning<\/b> يقارن محتويات الـ image بهذه القواعد.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker scout quickview shop-api:1.4.2   # ملخص\ndocker scout cves shop-api:1.4.2        # تفاصيل الثغرات<\/code><\/pre><p>بديل مفتوح المصدر شائع:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>trivy image shop-api:1.4.2<\/code><\/pre><p>الناتج يصنّف الثغرات: <code dir=\"ltr\">CRITICAL<\/code> و <code dir=\"ltr\">HIGH<\/code> و <code dir=\"ltr\">MEDIUM<\/code> و <code dir=\"ltr\">LOW<\/code>، ويذكر النسخة التي أصلحت كل ثغرة إن وُجدت.<\/p><p>كيف تتعامل مع النتائج؟<\/p><ol><li>حدّث الـ base image وأعد البناء. هذا يحل أغلبها.<\/li><li>حدّث مكتبات التطبيق المصابة.<\/li><li>احذف ما لا تحتاجه، أو انتقل لـ base أصغر.<\/li><li>ركّز على <code dir=\"ltr\">CRITICAL<\/code> و <code dir=\"ltr\">HIGH<\/code> التي لها إصلاح متاح.<\/li><\/ol><p>اجعل الفحص خطوة في الـ CI تُفشل البناء عند ثغرة خطيرة. وتذكّر: image سليمة اليوم قد تظهر فيها ثغرة غداً دون أن يتغير فيها حرف، فافحص ما يعمل في Production دورياً.<\/p>", "q": {"t": "t", "q": "إذا لم يجد الفحص ثغرات في image اليوم فهي آمنة دائماً ما دامت لم تتغير.", "e": "تُكتشف ثغرات جديدة في الحزم القديمة باستمرار. لذلك يُعاد الفحص دورياً ويُعاد البناء على base محدّثة.", "a": false}}, {"id": "m10c7", "title": "عدم وضع الـ Secrets داخل الـ Images", "html": "<p><b>الـ secret<\/b> أي قيمة يضر تسربها: كلمات سر، API keys، مفاتيح خاصة. والـ image تُنسخ وتُرفع ويُحفظ تاريخ طبقاتها، فكل ما يدخلها يُعتبر مكشوفاً.<\/p><p>طرق تسرب شائعة:<\/p><ul><li><code dir=\"ltr\">ENV DB_PASSWORD=...<\/code> أو <code dir=\"ltr\">ARG TOKEN=...<\/code>: تظهر في <code dir=\"ltr\">docker history<\/code> و <code dir=\"ltr\">docker inspect<\/code>.<\/li><li><code dir=\"ltr\">COPY . .<\/code> مع وجود <code dir=\"ltr\">.env<\/code> دون <code dir=\"ltr\">.dockerignore<\/code>.<\/li><li><code dir=\"ltr\">COPY secret<\/code> ثم <code dir=\"ltr\">RUN rm secret<\/code>: يبقى في طبقة سابقة.<\/li><\/ul><p><b>الأسرار وقت التشغيل:<\/b> تُحقن عند تشغيل الـ container.<\/p><ul><li>environment variables من <code dir=\"ltr\">.env<\/code> على السيرفر (خارج Git، بصلاحيات <code dir=\"ltr\">chmod 600<\/code>). بسيط وشائع.<\/li><li><b>Compose secrets<\/b>: تُربط كملفات داخل <code dir=\"ltr\">/run/secrets/<\/code>، فلا تظهر في <code dir=\"ltr\">docker inspect<\/code> ولا في قائمة المتغيرات:<\/li><\/ul><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  db:\n    image: postgres:17\n    environment:\n      POSTGRES_PASSWORD_FILE: /run/secrets/db_password\n    secrets:\n      - db_password\nsecrets:\n  db_password:\n    file: ./secrets/db_password.txt<\/code><\/pre><p><b>الأسرار وقت البناء<\/b> (مثل token لمستودع حزم خاص): استخدم build secrets من BuildKit. السر متاح لتلك التعليمة فقط ولا يُحفظ في أي طبقة:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN --mount=type=secret,id=pip_token \\\n    PIP_INDEX_URL=\"https://user:$(cat /run/secrets/pip_token)@pypi.example.com/simple\" \\\n    pip install -r requirements.txt<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker build --secret id=pip_token,src=./pip_token.txt .<\/code><\/pre><p>وإذا تسرب سر: حذفه لا يكفي. يجب <b>تغييره<\/b> فوراً.<\/p>", "q": {"t": "c", "q": "تحتاج token أثناء <code dir=\"ltr\">docker build<\/code> لتنزيل مكتبة من مستودع خاص. ما الطريقة الآمنة؟", "e": "قيم <code dir=\"ltr\">ARG<\/code> و <code dir=\"ltr\">ENV<\/code> تبقى في تاريخ الـ image. الـ secret mount متاح أثناء التعليمة فقط ولا يُحفظ في أي طبقة.", "o": [{"h": "<code dir=\"ltr\">ARG TOKEN<\/code> مع <code dir=\"ltr\">--build-arg<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">ENV TOKEN=...<\/code> ثم حذفه في آخر الملف", "c": 0}, {"h": "<code dir=\"ltr\">RUN --mount=type=secret<\/code> مع <code dir=\"ltr\">docker build --secret<\/code>", "c": 1}, {"h": "كتابته في <code dir=\"ltr\">requirements.txt<\/code>", "c": 0}]}}, {"id": "m10c8", "title": "تقييد صلاحيات الـ Container", "html": "<p>الـ root داخل الـ container لا يملك كل قدرات root الحقيقي. Linux يقسم صلاحيات root إلى <b>capabilities<\/b>، و Docker يعطي الـ container مجموعة محدودة منها. يمكنك التضييق أكثر:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    cap_drop:\n      - ALL\n    security_opt:\n      - no-new-privileges:true\n    read_only: true\n    tmpfs:\n      - /tmp<\/code><\/pre><ul><li><code dir=\"ltr\">cap_drop: [ALL]<\/code>: اسحب كل الـ capabilities. أغلب تطبيقات الويب لا تحتاج أياً منها. إن احتاجت واحدة أضفها بـ <code dir=\"ltr\">cap_add<\/code>.<\/li><li><code dir=\"ltr\">no-new-privileges<\/code>: يمنع أي process داخل الـ container من رفع صلاحياته.<\/li><li><code dir=\"ltr\">read_only: true<\/code>: الـ filesystem للقراءة فقط، فلا يستطيع مهاجم زرع ملفات. أعطِ التطبيق مساحات كتابة محددة عبر <code dir=\"ltr\">tmpfs<\/code> أو volumes.<\/li><\/ul><p>ومع <code dir=\"ltr\">docker run<\/code>: <code dir=\"ltr\">--cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp<\/code>.<\/p><div class=\"warn\">لا تستخدم <code dir=\"ltr\">--privileged<\/code> أو <code dir=\"ltr\">privileged: true<\/code> في Production. هذا الخيار يعطي الـ container كل الـ capabilities ووصولاً لأجهزة الـ host، أي يلغي العزل عملياً.<\/div><p>طبّق هذه القيود تدريجياً واختبر بعد كل واحد، فبعض الـ images تحتاج الكتابة في مسارات معينة.<\/p>", "q": {"t": "m", "q": "ما أثر الخيار <code dir=\"ltr\">--privileged<\/code>؟", "e": "<code dir=\"ltr\">--privileged<\/code> يزيل قيود الـ capabilities والأجهزة. اختراق container كهذا يعادل اختراق الـ host.", "o": [{"h": "يشغّل الـ container بمستخدم غير root", "c": 0}, {"h": "يعطي الـ container صلاحيات شبه كاملة على الـ host ويلغي معظم العزل", "c": 1}, {"h": "يسرّع الـ container", "c": 0}, {"h": "يفعّل HTTPS", "c": 0}]}}, {"id": "m10c9", "title": "أمان الـ Docker socket", "html": "<p>الملف <code dir=\"ltr\">/var/run/docker.sock<\/code> هو قناة التخاطب مع الـ Docker daemon، والـ daemon يعمل كـ root. من يستطيع الكتابة في هذا الـ socket يستطيع أن يأمر الـ daemon بأي شيء، مثل:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -v /:/host -it alpine chroot /host<\/code><\/pre><p>هذا الأمر يعطي shell بصلاحيات root على filesystem الـ host كله. إذن:<\/p><p><b>الوصول إلى الـ Docker socket يعادل صلاحيات root على الـ host.<\/b><\/p><p>ما يترتب على ذلك:<\/p><ul><li><b>مجموعة <code dir=\"ltr\">docker<\/code><\/b>: إضافة مستخدم إليها تعطيه root فعلياً. أضف فقط من تثق به.<\/li><li><b>ربط الـ socket داخل container<\/b> (<code dir=\"ltr\">-v /var/run/docker.sock:/var/run/docker.sock<\/code>): بعض الأدوات تطلبه، مثل أدوات المراقبة وبعض الـ proxies. إذا اختُرق ذلك الـ container سقط الـ host كله. تجنبه، وإن اضطررت فاستخدم socket proxy يسمح بعمليات القراءة فقط.<\/li><li><b>لا تفتح الـ daemon على الشبكة عبر TCP<\/b> دون TLS وتحقق من الهوية. الـ daemons المكشوفة تُخترق خلال ساعات.<\/li><li>للتشغيل دون root أصلاً يوجد <b>rootless mode<\/b>: الـ daemon نفسه يعمل بمستخدم عادي.<\/li><\/ul>", "q": {"t": "c", "q": "أداة مراقبة تطلب منك ربط <code dir=\"ltr\">/var/run/docker.sock<\/code> داخل container الخاص بها. ما الخطر؟", "e": "الـ socket يعطي تحكماً كاملاً بالـ daemon. وحتى الربط بـ <code dir=\"ltr\">:ro<\/code> لا يحمي، لأنه يمنع تعديل ملف الـ socket ولا يمنع إرسال الأوامر عبره.", "o": [{"h": "تبطئ الـ containers الأخرى", "c": 0}, {"h": "إذا اختُرق ذلك الـ container يحصل المهاجم على تحكم كامل بالـ daemon، أي root على الـ host", "c": 1}, {"h": "تمنع إنشاء volumes", "c": 0}, {"h": "لا خطر ما دام الربط للقراءة", "c": 0}]}}, {"id": "m10c10", "title": "مصدر الـ Images وموثوقيتها", "html": "<p><b>الـ provenance<\/b> هو إجابة سؤالين: من أين جاءت هذه الـ image؟ وهل هي فعلاً ما أظنه؟ هجمات <b>supply chain<\/b> تستهدف هذه النقطة: يُحقن كود خبيث في image أو مكتبة تثق بها.<\/p><p>إجراءات عملية:<\/p><p><b>1. مصادر موثوقة:<\/b> Official Images وصور Verified Publisher، ومن registry تتحكم به لصورك الخاصة.<\/p><p><b>2. ثبّت بالـ digest للأساسيات الحساسة:<\/b> الـ tag يمكن أن يُعاد توجيهه إلى محتوى آخر، أما الـ digest فهو بصمة المحتوى نفسه:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM python:3.13-slim@sha256:&lt;digest&gt;<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker buildx imagetools inspect python:3.13-slim   # اعرض الـ digest<\/code><\/pre><p>الثمن: عليك تحديث الـ digest بنفسك للحصول على الإصلاحات. أدوات مثل Dependabot و Renovate تفعل ذلك تلقائياً.<\/p><p><b>3. الـ attestations:<\/b> BuildKit يستطيع إرفاق شهادتين بالـ image: <b>provenance<\/b> (كيف ومن أي مصدر بُنيت) و <b>SBOM<\/b> (قائمة بكل المكونات داخلها):<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker buildx build --provenance=true --sbom=true -t ghcr.io/ali/shop-api:1.4.2 --push .<\/code><\/pre><p><b>4. ابنِ في CI<\/b> من كود في Git. لا ترفع إلى Production صوراً بُنيت على جهاز شخصي.<\/p><p><b>5. افحص<\/b> صور الآخرين قبل اعتمادها.<\/p>", "q": {"t": "m", "q": "ما الفرق بين التثبيت بالـ tag والتثبيت بالـ digest؟", "e": "<code dir=\"ltr\">python:3.13-slim<\/code> قد يشير غداً إلى بناء جديد. <code dir=\"ltr\">@sha256:...<\/code> يشير دائماً إلى نفس البايتات بالضبط.", "o": [{"h": "لا فرق", "c": 0}, {"h": "الـ digest أقصر", "c": 0}, {"h": "الـ tag يمكن أن يُعاد توجيهه لمحتوى مختلف، والـ digest بصمة للمحتوى لا تتغير", "c": 1}, {"h": "الـ digest يعمل مع Docker Hub فقط", "c": 0}]}}, {"id": "m10c11", "title": "الـ Health checks والـ Restart policies في Production", "html": "<p>تعلمت الآليتين في Stage 6. هذه هي النقاط التي تخص Production:<\/p><p><b>1. health check لكل خدمة أساسية<\/b>، ومنها تطبيقك. أضف endpoint خفيفاً:<\/p><pre dir=\"ltr\" data-lang=\"python\"><code># urls.py\npath(\"health/\", lambda r: JsonResponse({\"status\": \"ok\"}))<\/code><\/pre><pre dir=\"ltr\" data-lang=\"yaml\"><code>web:\n  healthcheck:\n    test: [\"CMD\", \"python\", \"-c\", \"import urllib.request as u; u.urlopen('http://localhost:8000/health/', timeout=3)\"]\n    interval: 15s\n    timeout: 5s\n    retries: 3\n    start_period: 20s<\/code><\/pre><p>استخدمنا Python لأن <code dir=\"ltr\">curl<\/code> غير موجود في الـ slim images.<\/p><p><b>2. اجعل الفحص خفيفاً وصادقاً.<\/b> فحص ثقيل كل 5 ثوانٍ يصبح حملاً بحد ذاته.<\/p><div class=\"warn\"><b>3. Docker وحده لا يعيد تشغيل container حالته <code dir=\"ltr\">unhealthy<\/code>.<\/b> الـ restart policy تعمل فقط عندما <b>يخرج<\/b> الـ process. الحالة <code dir=\"ltr\">unhealthy<\/code> تظهر في <code dir=\"ltr\">docker ps<\/code> وتؤثر على <code dir=\"ltr\">depends_on<\/code>، ولا يحدث شيء آخر. لذلك صمّم تطبيقك ليخرج عند عطل لا يُصلَح، وراقب الحالة بنظام تنبيه. إعادة التشغيل التلقائي عند <code dir=\"ltr\">unhealthy<\/code> ميزة في Swarm و Kubernetes.<\/div><p><b>4. <code dir=\"ltr\">restart: unless-stopped<\/code> لكل الخدمات الدائمة<\/b>، وتأكد أن خدمة Docker نفسها تبدأ مع إقلاع السيرفر:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>sudo systemctl enable docker<\/code><\/pre><p><b>5. الخدمات ذات المهمة الواحدة<\/b> (مثل <code dir=\"ltr\">migrate<\/code>) تبقى بلا restart، وإلا تكررت بلا نهاية.<\/p>", "q": {"t": "t", "q": "في Docker Compose على سيرفر واحد، عندما تصبح حالة container هي <code dir=\"ltr\">unhealthy<\/code> يعيد Docker تشغيله تلقائياً بفضل <code dir=\"ltr\">restart: always<\/code>.", "e": "الـ restart policy تتفاعل مع خروج الـ process فقط. الحالة <code dir=\"ltr\">unhealthy<\/code> لا تسبب إعادة تشغيل في Docker Engine وحده.", "a": false}}, {"id": "m10c12", "title": "الـ Resource limits", "html": "<p>دون حدود، container واحد فيه memory leak يستهلك ذاكرة السيرفر كلها فيسقط كل شيء، ومنه قاعدة البيانات. الـ <b>resource limits<\/b> (وهي cgroups كما في Stage 1) تحصر الضرر في الـ container المسبب.<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    deploy:\n      resources:\n        limits:\n          cpus: \"1.5\"\n          memory: 512M\n        reservations:\n          memory: 256M<\/code><\/pre><p>ومع <code dir=\"ltr\">docker run<\/code>: <code dir=\"ltr\">--memory 512m --cpus 1.5<\/code>.<\/p><ul><li><b>حد الذاكرة صارم<\/b>: إذا تجاوزه الـ container يقتله الـ kernel (<b>OOM kill<\/b>) ويخرج بالكود 137. ومع restart policy يعود للعمل.<\/li><li><b>حد الـ CPU مرن<\/b>: الـ container يُبطَّأ ولا يُقتل. <code dir=\"ltr\">cpus: \"1.5\"<\/code> على سيرفر بأربعة أنوية تعني <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1.5<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>37.5<\/mn><mi>&#x00025;<\/mi><\/mrow><\/math> من قدرة المعالجة كحد أقصى.<\/li><\/ul><p>كيف تختار الأرقام؟<\/p><ol><li>راقب الاستهلاك الفعلي تحت حمل طبيعي: <code dir=\"ltr\">docker stats<\/code>.<\/li><li>ضع الحد أعلى من الذروة بهامش 30–50%.<\/li><li>تأكد أن مجموع الحدود لا يتجاوز ذاكرة السيرفر مع ترك حصة للنظام.<\/li><\/ol><p>مثال: سيرفر بـ 4GB. إذا أخذ <code dir=\"ltr\">db<\/code> حد 1GB، و <code dir=\"ltr\">web<\/code> 768MB، و <code dir=\"ltr\">worker<\/code> 512MB، و <code dir=\"ltr\">redis<\/code> 256MB، و <code dir=\"ltr\">proxy<\/code> 128MB، فالمجموع <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1024<\/mn><mo>&#x0002B;<\/mo><mn>768<\/mn><mo>&#x0002B;<\/mo><mn>512<\/mn><mo>&#x0002B;<\/mo><mn>256<\/mn><mo>&#x0002B;<\/mo><mn>128<\/mn><mo>&#x0003D;<\/mo><mn>2688<\/mn><\/mrow><\/math> MB، ويبقى نحو 1.3GB للنظام.<\/p><p>للتحقق: هل قُتل بسبب الذاكرة؟<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker inspect --format '{{.State.OOMKilled}}' web<\/code><\/pre>", "q": {"t": "c", "q": "الـ worker يتوقف كل بضع ساعات بالكود 137 ثم يعود، و <code dir=\"ltr\">docker inspect<\/code> يُظهر <code dir=\"ltr\">OOMKilled: true<\/code>. ما التشخيص؟", "e": "<code dir=\"ltr\">OOMKilled<\/code> مع الكود 137 يعني تجاوز حد الذاكرة. الحل: ابحث عن memory leak أو اضبط الحد وفق القياس.", "o": [{"h": "مشكلة في الشبكة", "c": 0}, {"h": "الـ worker يتجاوز حد الذاكرة فيقتله الـ kernel. يجب معالجة استهلاك الذاكرة أو رفع الحد بعد قياس", "c": 1}, {"h": "الـ image تالفة", "c": 0}, {"h": "الـ health check خاطئ", "c": 0}]}}, {"id": "m10c13", "title": "الـ Logging", "html": "<p>قاعدة الـ containers: التطبيق يكتب الـ logs إلى <b>stdout و stderr<\/b>، و Docker يتولى جمعها وتخزينها. لا تكتب logs في ملفات داخل الـ container.<\/p><p>الـ <b>logging driver<\/b> يحدد أين تذهب. الافتراضي <code dir=\"ltr\">json-file<\/code>: ملف JSON على الـ host لكل container.<\/p><div class=\"warn\">افتراضياً لا يوجد حد لحجم ملفات <code dir=\"ltr\">json-file<\/code>. خدمة كثيرة الكلام تملأ قرص السيرفر في أسابيع، وامتلاء القرص يوقف قاعدة البيانات. فعّل الـ <b>rotation<\/b> دائماً.<\/div><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    logging:\n      driver: json-file\n      options:\n        max-size: \"10m\"\n        max-file: \"3\"<\/code><\/pre><p>أقصى مساحة لـ logs هذه الخدمة: <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><mo>&#x000D7;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>30<\/mn><\/mrow><\/math> MB.<\/p><p>لتجنب التكرار في كل خدمة استخدم YAML anchor:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>x-logging: &amp;default-logging\n  driver: json-file\n  options:\n    max-size: \"10m\"\n    max-file: \"3\"\n\nservices:\n  web:\n    logging: *default-logging\n  worker:\n    logging: *default-logging<\/code><\/pre><p><code dir=\"ltr\">&amp;name<\/code> يعرّف قالباً و <code dir=\"ltr\">*name<\/code> يستخدمه. والمفاتيح التي تبدأ بـ <code dir=\"ltr\">x-<\/code> يتجاهلها Compose، فهي مكان مناسب للقوالب.<\/p><p>أو اضبطها لكل الـ containers الجديدة في <code dir=\"ltr\">/etc/docker/daemon.json<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"json\"><code>{ \"log-driver\": \"local\", \"log-opts\": { \"max-size\": \"10m\", \"max-file\": \"3\" } }<\/code><\/pre><p>وعندما يكبر النظام تُرسَل الـ logs إلى نظام مركزي (مثل Loki أو ELK) للبحث والتنبيه.<\/p><p>في Django: وجّه الـ logging إلى <code dir=\"ltr\">StreamHandler<\/code>، وشغّل gunicorn بـ <code dir=\"ltr\">--access-logfile -<\/code> لتذهب سجلات الطلبات إلى stdout.<\/p>", "q": {"t": "m", "q": "ما خطر ترك <code dir=\"ltr\">json-file<\/code> بإعداده الافتراضي في Production؟", "e": "لا يوجد rotation افتراضي مع <code dir=\"ltr\">json-file<\/code>. يجب ضبط <code dir=\"ltr\">max-size<\/code> و <code dir=\"ltr\">max-file<\/code>.", "o": [{"h": "ضياع الـ logs عند كل restart", "c": 0}, {"h": "تكبر ملفات الـ logs بلا حد حتى يمتلئ قرص السيرفر", "c": 1}, {"h": "تُرسَل الـ logs إلى الإنترنت", "c": 0}, {"h": "يتوقف <code dir=\"ltr\">docker logs<\/code> عن العمل", "c": 0}]}}, {"id": "m10c14", "title": "الـ Persistent storage في Production", "html": "<p>القاعدة: الـ containers <b>stateless<\/b> (بلا حالة) قدر الإمكان، وكل حالة مهمة تعيش في volume أو في خدمة خارجية. الاختبار: هل تستطيع حذف أي container وإنشاءه من جديد دون خسارة؟<\/p><p>صنّف بيانات تطبيقك:<\/p><div class=\"tw\"><table><thead><tr><th>البيانات<\/th><th>أين تعيش<\/th><th>السبب<\/th><\/tr><\/thead><tbody><tr><td>قاعدة بيانات PostgreSQL<\/td><td>named volume<\/td><td>أهم ما تملك<\/td><\/tr><tr><td>الملفات المرفوعة (media)<\/td><td>named volume أو object storage مثل S3<\/td><td>يكتبها المستخدمون وقت التشغيل<\/td><\/tr><tr><td>شهادات Caddy (<code dir=\"ltr\">/data<\/code>)<\/td><td>named volume<\/td><td>إعادة طلبها عند كل restart تصطدم بحدود مزوّد الشهادات<\/td><\/tr><tr><td>بيانات Redis<\/td><td>volume إذا كانت طابور مهام مهماً، ولا شيء إذا كانت cache فقط<\/td><td>حسب أهميتها<\/td><\/tr><tr><td>كود التطبيق<\/td><td>داخل الـ image<\/td><td>يتغير مع كل نشر<\/td><\/tr><tr><td>الملفات الثابتة (static)<\/td><td>داخل الـ image، تُجمع وقت البناء<\/td><td>ناتج بناء وليست بيانات<\/td><\/tr><tr><td>الـ logs<\/td><td>stdout<\/td><td>يجمعها Docker<\/td><\/tr><\/tbody><\/table><\/div><p>أخطاء شائعة:<\/p><ul><li>media بلا volume: تختفي صور المستخدمين مع أول نشر.<\/li><li>anonymous volumes للبيانات المهمة: يصعب تتبعها ويحذفها <code dir=\"ltr\">prune<\/code>.<\/li><li>bind mount لقاعدة البيانات على مسار عشوائي في السيرفر: يعمل، لكنه يربطك ببنية السيرفر وصلاحياته.<\/li><\/ul><p>راقب مساحة القرص: <code dir=\"ltr\">docker system df -v<\/code>. امتلاء القرص من أشهر أسباب توقف قواعد البيانات.<\/p>", "q": {"t": "m", "q": "أي من التالي يجب وضعه في named volume في Production؟", "e": "الـ media بيانات تُنشأ وقت التشغيل ولا يمكن إعادة توليدها. الكود والـ static جزء من الـ image.", "o": [{"h": "كود Django", "c": 0}, {"h": "ملفات الـ static المجمّعة وقت البناء", "c": 0}, {"h": "الملفات التي يرفعها المستخدمون (media)", "c": 1}, {"h": "الـ logs", "c": 0}]}}, {"id": "m10c15", "title": "الـ Backup والـ Recovery", "html": "<p>في Stage 4 تعلمت الآلية. في Production تتحول إلى نظام:<\/p><p><b>1. مؤتمت:<\/b> النسخ اليدوي يُنسى. استخدم <code dir=\"ltr\">cron<\/code> على السيرفر:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code># /opt/shop/backup.sh\n#!/bin/sh\nset -e\ncd /opt/shop\ndocker compose exec -T db pg_dump -U \"$DB_USER\" \"$DB_NAME\" \\\n  | gzip &gt; /backups/shop_$(date +%F).sql.gz\nfind /backups -name 'shop_*.sql.gz' -mtime +14 -delete<\/code><\/pre><pre dir=\"ltr\" data-lang=\"\"><code>0 3 * * * /opt/shop/backup.sh<\/code><\/pre><p><code dir=\"ltr\">-T<\/code> يلغي الـ TTY، وهذا لازم داخل cron وعند استخدام pipe.<\/p><p><b>2. خارج السيرفر:<\/b> نسخة على نفس القرص تضيع معه. انسخها إلى مكان آخر: object storage أو سيرفر ثانٍ. قاعدة <b>3-2-1<\/b>: ثلاث نسخ، على وسيطين مختلفين، واحدة منها خارج الموقع.<\/p><p><b>3. مُختبَر:<\/b> استعد النسخة دورياً في container مؤقت وتحقق من البيانات:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name restore-test -e POSTGRES_PASSWORD=x postgres:17\ngunzip -c shop_2026-11-14.sql.gz | docker exec -i restore-test psql -U postgres\ndocker exec restore-test psql -U postgres -c \"\\dt\"\ndocker rm -f restore-test<\/code><\/pre><p><b>4. قبل كل عملية خطرة:<\/b> ترقية نسخة PostgreSQL، أو migration تحذف أعمدة.<\/p><p>مصطلحان للتخطيط:<\/p><ul><li><b>RPO<\/b>: كم من البيانات تقبل خسارته؟ نسخة يومية تعني حتى 24 ساعة.<\/li><li><b>RTO<\/b>: كم يستغرق الرجوع للعمل؟<\/li><\/ul><p>ولا تنسَ بقية ما يلزم للاستعادة: الـ media، ملف <code dir=\"ltr\">.env<\/code>، وملفات الـ Compose (وهي في Git).<\/p>", "q": {"t": "c", "q": "عندك backup يومي يُحفظ في <code dir=\"ltr\">/backups<\/code> على نفس السيرفر. ما أضعف نقطة في هذه الخطة؟", "e": "النسخة الاحتياطية يجب ألا تشارك الأصل مصيره. انقلها إلى مكان آخر واختبر استعادتها.", "o": [{"h": "النسخ اليومي كثير", "c": 0}, {"h": "إذا تلف قرص السيرفر أو حُذف السيرفر تضيع البيانات والنسخ معاً. يجب حفظ نسخة خارجه", "c": 1}, {"h": "<code dir=\"ltr\">pg_dump<\/code> لا يعمل مع Docker", "c": 0}, {"h": "النسخ المضغوطة لا تُستعاد", "c": 0}]}}, {"id": "m10c16", "title": "الـ Docker Registry و Docker Hub: رفع الـ Images", "html": "<p>حتى تصل الـ image من مكان البناء إلى السيرفر تمر عبر <b>registry<\/b>.<\/p><p>الخطوات:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code># 1. سجّل الدخول\ndocker login                                  # Docker Hub\necho \"$GHCR_TOKEN\" | docker login ghcr.io -u ali --password-stdin\n\n# 2. سمِّ الـ image باسمها الكامل\ndocker tag shop-api:1.4.2 ghcr.io/ali/shop-api:1.4.2\n\n# 3. ارفع\ndocker push ghcr.io/ali/shop-api:1.4.2\n\n# 4. على السيرفر\ndocker pull ghcr.io/ali/shop-api:1.4.2<\/code><\/pre><p>الاسم الكامل يحدد الوجهة: <code dir=\"ltr\">ali/shop-api<\/code> يذهب إلى Docker Hub، و <code dir=\"ltr\">ghcr.io/ali/shop-api<\/code> إلى GitHub Container Registry. الرفع يرسل فقط الطبقات غير الموجودة في الـ registry.<\/p><p>الخيارات:<\/p><div class=\"tw\"><table><thead><tr><th>الـ registry<\/th><th>ملاحظات<\/th><\/tr><\/thead><tbody><tr><td><b>Docker Hub<\/b><\/td><td>الافتراضي والأشهر. الـ repositories العامة مجانية، والخاصة محدودة في الخطة المجانية، وتوجد حدود لعدد مرات السحب<\/td><\/tr><tr><td><b>GHCR<\/b> (<code dir=\"ltr\">ghcr.io<\/code>)<\/td><td>مرتبط بـ GitHub، مناسب إذا كان الكود هناك<\/td><\/tr><tr><td>registries مزوّدي السحابة<\/td><td>ECR و Artifact Registry وغيرها<\/td><\/tr><tr><td><b>self-hosted<\/b><\/td><td>الـ image الرسمية <code dir=\"ltr\">registry:2<\/code> أو Harbor، إذا أردت تحكماً كاملاً<\/td><\/tr><\/tbody><\/table><\/div><p>قواعد:<\/p><ul><li>صور تطبيقك في repository <b>خاص<\/b> إلا إذا كان المشروع مفتوح المصدر.<\/li><li>استخدم access token بصلاحيات محدودة بدل كلمة سر حسابك.<\/li><li>لا تدوّس على tag منشور. كل نسخة لها tag جديد.<\/li><\/ul>", "q": {"t": "s", "q": "اكتب الأمر الذي يرفع الـ image المسماة <code dir=\"ltr\">ghcr.io/ali/shop-api:1.4.2<\/code> إلى الـ registry.", "e": "<code dir=\"ltr\">docker push<\/code> يرفع الـ image إلى الـ registry المحدد في اسمها الكامل، بعد <code dir=\"ltr\">docker login<\/code>.", "r": "^docker (image )?push ghcr\\.io/ali/shop-api:1\\.4\\.2$", "m": "<code dir=\"ltr\">docker push ghcr.io/ali/shop-api:1.4.2<\/code>"}}, {"id": "m10c17", "title": "نشر الـ Containers على VPS", "html": "<p><b>الـ VPS<\/b> سيرفر افتراضي تستأجره وتتحكم به كاملاً عبر SSH. النشر عليه بـ Compose مناسب جداً للمشاريع الصغيرة والمتوسطة.<\/p><p><b>1. جهّز السيرفر مرة واحدة:<\/b><\/p><ul><li>أنشئ مستخدماً غير root، وفعّل الدخول بمفتاح SSH وعطّل الدخول بكلمة السر.<\/li><li>ثبّت <b>Docker Engine<\/b> (وليس Desktop) من المستودع الرسمي، ومعه إضافة Compose.<\/li><li>جدار الحماية: اسمح بـ 22 و 80 و 443 فقط. وتذكّر أن الـ ports المنشورة تتجاوز <code dir=\"ltr\">ufw<\/code>، فلا تنشر غير الـ proxy.<\/li><li><code dir=\"ltr\">sudo systemctl enable docker<\/code>.<\/li><\/ul><p><b>2. وجّه النطاق:<\/b> سجل DNS من نوع <code dir=\"ltr\">A<\/code> يشير إلى IP السيرفر، ليستطيع Caddy إصدار شهادة HTTPS.<\/p><p><b>3. ضع ملفات التشغيل:<\/b> السيرفر لا يحتاج الكود. يحتاج فقط:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>/opt/shop/\n  compose.yaml\n  compose.prod.yaml\n  .env              # الأسرار، chmod 600، ليس في Git<\/code><\/pre><p><b>4. شغّل:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>cd /opt/shop\ndocker login ghcr.io\ndocker compose -f compose.yaml -f compose.prod.yaml pull\ndocker compose -f compose.yaml -f compose.prod.yaml up -d\ndocker compose -f compose.yaml -f compose.prod.yaml ps<\/code><\/pre><p>لتقصير الأوامر ضع في <code dir=\"ltr\">.env<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>COMPOSE_FILE=compose.yaml:compose.prod.yaml<\/code><\/pre><p>فيصبح <code dir=\"ltr\">docker compose up -d<\/code> كافياً.<\/p><p><b>5. تحقق:<\/b> <code dir=\"ltr\">curl -I https://example.com<\/code>، ثم <code dir=\"ltr\">docker compose logs --tail 50<\/code>.<\/p><p>إعدادات Django اللازمة: <code dir=\"ltr\">DEBUG=False<\/code>، و <code dir=\"ltr\">ALLOWED_HOSTS<\/code> فيه نطاقك، و <code dir=\"ltr\">CSRF_TRUSTED_ORIGINS<\/code>، و <code dir=\"ltr\">SECURE_PROXY_SSL_HEADER<\/code> لأن التطبيق خلف proxy.<\/p><p>حدود هذا الأسلوب: سيرفر واحد يعني نقطة فشل واحدة. عند الحاجة لعدة سيرفرات وتوزيع حمل تلقائي تأتي أدوات مثل Docker Swarm و Kubernetes، وهي الخطوة التالية بعد هذه الدورة.<\/p>", "q": {"t": "m", "q": "ما الذي يحتاجه السيرفر لتشغيل تطبيقك بهذا الأسلوب؟", "e": "كل الـ dependencies داخل الـ images. السيرفر يحتاج Docker وتعريف التشغيل والأسرار فقط.", "o": [{"h": "Python و Node و PostgreSQL مثبتة عليه", "c": 0}, {"h": "الكود المصدري كاملاً", "c": 0}, {"h": "Docker Engine وملفات الـ Compose وملف <code dir=\"ltr\">.env<\/code>، والـ images تُسحب من الـ registry", "c": 1}, {"h": "Docker Desktop", "c": 0}]}}, {"id": "m10c18", "title": "تحديث الـ Containers دون فقدان بيانات قاعدة البيانات", "html": "<p>التحديث في عالم الـ containers لا يعني تعديل container يعمل. يعني <b>استبداله<\/b> بآخر من image جديدة. هذا آمن لأن البيانات في volumes.<\/p><p>التسلسل:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>cd /opt/shop\n\n# 1. نسخة احتياطية أولاً\ndocker compose exec -T db pg_dump -U app shop | gzip &gt; /backups/pre_1.5.0.sql.gz\n\n# 2. غيّر النسخة في .env:  APP_VERSION=1.5.0\n# 3. اسحب الـ images الجديدة\ndocker compose pull\n\n# 4. طبّق: يُعاد إنشاء الخدمات التي تغيّرت فقط\ndocker compose up -d\n\n# 5. تحقق\ndocker compose ps\ndocker compose logs --tail 50 web\n\n# 6. نظّف الـ images القديمة من حين لآخر\ndocker image prune -f<\/code><\/pre><p>لماذا لا تضيع البيانات؟<\/p><ul><li><code dir=\"ltr\">up -d<\/code> يعيد إنشاء <code dir=\"ltr\">web<\/code> و <code dir=\"ltr\">worker<\/code> فقط لأن الـ image الخاصة بهما تغيّرت. <code dir=\"ltr\">db<\/code> لم يتغير تعريفه فلا يُمَس.<\/li><li>وحتى لو أُعيد إنشاء <code dir=\"ltr\">db<\/code> فالـ volume <code dir=\"ltr\">pgdata<\/code> يُربط بالـ container الجديد.<\/li><\/ul><p>ما يهدد البيانات فعلاً:<\/p><ul><li><code dir=\"ltr\">docker compose down -v<\/code>.<\/li><li>تغيير اسم المشروع أو اسم الـ volume، فيُنشأ volume جديد فارغ والقديم باقٍ باسمه القديم.<\/li><li>ترقية النسخة الرئيسية لـ PostgreSQL (مثل 16 إلى 17) بتغيير الـ tag فقط. صيغة ملفات البيانات تختلف، وتحتاج <code dir=\"ltr\">pg_dump<\/code> ثم restore أو <code dir=\"ltr\">pg_upgrade<\/code>.<\/li><\/ul><p><b>الـ migrations:<\/b> تُنفَّذ مع كل نشر، عبر خدمة <code dir=\"ltr\">migrate<\/code> تعمل قبل <code dir=\"ltr\">web<\/code>. واجعل كل migration متوافقة مع الكود السابق ليبقى الرجوع ممكناً.<\/p><p><b>الـ rollback:<\/b> أعد <code dir=\"ltr\">APP_VERSION<\/code> إلى القيمة السابقة ثم <code dir=\"ltr\">docker compose up -d<\/code>. لهذا لا نعيد استخدام الـ tags.<\/p><p><b>الـ downtime:<\/b> Compose يوقف الـ container القديم ثم يشغّل الجديد، فيحدث انقطاع لثوانٍ. مقبول لأغلب المشاريع. النشر دون انقطاع يحتاج تشغيل نسختين وتحويل الـ proxy بينهما، أو orchestrator.<\/p>", "q": {"t": "c", "q": "سيرفر Production يعمل بـ Compose. أي إجراء يحدّث التطبيق مع الحفاظ على قاعدة البيانات؟", "e": "<code dir=\"ltr\">pull<\/code> ثم <code dir=\"ltr\">up -d<\/code> يستبدل الـ containers التي تغيّرت صورها ويبقي الـ volumes. <code dir=\"ltr\">-v<\/code> يحذف البيانات، والتعديل اليدوي يضيع مع أول إعادة إنشاء.", "o": [{"h": "<code dir=\"ltr\">docker compose down -v<\/code> ثم <code dir=\"ltr\">up -d<\/code>", "c": 0}, {"h": "تغيير الـ tag ثم <code dir=\"ltr\">docker compose pull<\/code> ثم <code dir=\"ltr\">docker compose up -d<\/code>", "c": 1}, {"h": "حذف كل الـ volumes ثم السحب من جديد", "c": 0}, {"h": "<code dir=\"ltr\">docker exec<\/code> وتعديل الكود داخل الـ container", "c": 0}]}}, {"id": "m10c19", "title": "الـ CI/CD", "html": "<p><b>الـ CI<\/b> (Continuous Integration): مع كل push يبني خادم آلي الكود ويختبره. <b>الـ CD<\/b> (Continuous Delivery/Deployment): إذا نجح كل شيء تُنشر النسخة آلياً. الهدف: نشر متكرر وموثوق دون خطوات يدوية تُنسى.<\/p><p>الـ pipeline المعتاد مع Docker:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>push --&gt; test --&gt; build image --&gt; scan --&gt; push to registry --&gt; deploy<\/code><\/pre><p>مثال مختصر بـ GitHub Actions في <code dir=\"ltr\">.github/workflows/deploy.yml<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>name: deploy\non:\n  push:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n      packages: write\n    steps:\n      - uses: actions/checkout@v4\n      - uses: docker/setup-buildx-action@v3\n      - uses: docker/login-action@v3\n        with:\n          registry: ghcr.io\n          username: ${{ github.actor }}\n          password: ${{ secrets.GITHUB_TOKEN }}\n      - uses: docker/build-push-action@v6\n        with:\n          context: ./backend\n          push: true\n          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}\n          cache-from: type=gha\n          cache-to: type=gha,mode=max\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    steps:\n      - uses: appleboy/ssh-action@v1\n        with:\n          host: ${{ secrets.VPS_HOST }}\n          username: deploy\n          key: ${{ secrets.VPS_SSH_KEY }}\n          script: |\n            cd /opt/shop\n            sed -i \"s/^APP_VERSION=.*/APP_VERSION=${{ github.sha }}/\" .env\n            docker compose pull\n            docker compose up -d<\/code><\/pre><div class=\"note\">أرقام نسخ الـ actions تتغير مع الوقت. راجع صفحة كل action وخذ أحدث نسخة رئيسية.<\/div><p>ما يجب ملاحظته:<\/p><ul><li><b>الـ tag هو الـ commit SHA<\/b>: كل نسخة منشورة مرتبطة بـ commit محدد، والـ rollback واضح.<\/li><li><b>الأسرار في secrets الخاصة بالـ CI<\/b>، وليست في الملف.<\/li><li><b>الـ cache<\/b> (<code dir=\"ltr\">type=gha<\/code>) يعوّض أن خادم الـ CI يبدأ نظيفاً.<\/li><li><b>الاختبارات قبل البناء<\/b>، والفحص الأمني قبل الرفع.<\/li><li><b>نفس الـ image<\/b> التي اختُبرت هي التي تُنشر. لا تُعاد بناؤها على السيرفر.<\/li><li>مفتاح SSH الخاص بالنشر يكون لمستخدم محدود الصلاحيات.<\/li><\/ul>", "q": {"t": "m", "q": "لماذا نستخدم الـ Git commit SHA كـ tag للـ image في الـ CI/CD؟", "e": "الـ SHA فريد لكل commit، فتعرف دائماً أي كود يعمل في Production وتعود لأي نسخة سابقة بتغيير الـ tag.", "o": [{"h": "لأنه أقصر من أرقام النسخ", "c": 0}, {"h": "لأنه يربط كل image بالكود الذي بُنيت منه بالضبط، فيسهل التتبع والـ rollback", "c": 1}, {"h": "لأن الـ registries ترفض غيره", "c": 0}, {"h": "لأنه يشفّر الـ image", "c": 0}]}}], "test": [{"t": "m", "q": "ما فائدة الـ multi-stage build؟", "e": "المرحلة النهائية تأخذ ناتج البناء فقط وتترك الأدوات.", "o": [{"h": "تشغيل عدة containers من Dockerfile واحد", "c": 0}, {"h": "فصل أدوات البناء عن الـ image النهائية فتصبح أصغر وأكثر أماناً", "c": 1}, {"h": "بناء الـ image على عدة سيرفرات", "c": 0}, {"h": "إلغاء الحاجة للـ base image", "c": 0}]}, {"t": "t", "q": "ربط الـ Docker socket داخل container بوضع القراءة فقط (<code dir=\"ltr\">:ro<\/code>) يجعله آمناً.", "e": "<code dir=\"ltr\">:ro<\/code> يخص ملف الـ socket نفسه، ولا يمنع إرسال أوامر عبره إلى الـ daemon.", "a": false}, {"t": "s", "q": "ما اسم الخيار الذي يعطي الـ container صلاحيات شبه كاملة على الـ host ويجب تجنبه في Production؟", "e": "<code dir=\"ltr\">--privileged<\/code> يلغي معظم العزل بين الـ container والـ host.", "r": "privileged", "m": "<code dir=\"ltr\">--privileged<\/code>"}, {"t": "c", "q": "سيرفر Production توقف فجأة، ووجدت القرص ممتلئاً بملفات تحت <code dir=\"ltr\">/var/lib/docker/containers<\/code>. ما السبب الأرجح والحل؟", "e": "هذا المسار يحوي ملفات <code dir=\"ltr\">json-file<\/code> لكل container، وهي تكبر بلا حد دون rotation.", "o": [{"h": "الـ volumes كبيرة، والحل حذفها", "c": 0}, {"h": "ملفات logs بلا rotation، والحل ضبط <code dir=\"ltr\">max-size<\/code> و <code dir=\"ltr\">max-file<\/code> للـ logging driver", "c": 1}, {"h": "الـ images كثيرة، والحل <code dir=\"ltr\">down -v<\/code>", "c": 0}, {"h": "الـ cache، والحل إعادة تشغيل السيرفر", "c": 0}]}, {"t": "m", "q": "أين توضع كلمة سر قاعدة البيانات في Production؟", "e": "الأسرار تُحقن وقت التشغيل من مصدر خارج الـ image وخارج Git.", "o": [{"h": "في <code dir=\"ltr\">ENV<\/code> داخل الـ Dockerfile", "c": 0}, {"h": "في <code dir=\"ltr\">compose.yaml<\/code> المحفوظ في Git", "c": 0}, {"h": "في <code dir=\"ltr\">.env<\/code> على السيرفر خارج Git، أو في Compose secrets", "c": 1}, {"h": "في اسم الـ image", "c": 0}]}, {"t": "t", "q": "حد الذاكرة في Docker حد صارم: تجاوزه يؤدي إلى قتل الـ container.", "e": "عند التجاوز يقتل الـ kernel الـ process (OOM kill) ويخرج بالكود 137. حد الـ CPU هو المرن.", "a": true}, {"t": "c", "q": "بعد النشر اكتشفت خللاً خطيراً في النسخة <code dir=\"ltr\">1.5.0<\/code>، والنسخة السابقة <code dir=\"ltr\">1.4.2<\/code> ما زالت في الـ registry. ما أسرع إجراء سليم؟", "e": "الـ rollback يكون بالرجوع إلى الـ tag السابق. لهذا كل نسخة لها tag فريد لا يُدوَّس عليه.", "o": [{"h": "تعديل الكود داخل الـ container بـ <code dir=\"ltr\">docker exec<\/code>", "c": 0}, {"h": "إعادة <code dir=\"ltr\">APP_VERSION<\/code> إلى <code dir=\"ltr\">1.4.2<\/code> ثم <code dir=\"ltr\">docker compose up -d<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker compose down -v<\/code>", "c": 0}, {"h": "حذف الـ image الجديدة من السيرفر فقط", "c": 0}]}, {"t": "m", "q": "أي عبارة صحيحة عن الـ backup؟", "e": "نسخة لم تُختبر استعادتها أو تشارك السيرفر مصيره لا يُعتمد عليها.", "o": [{"h": "الـ volume نفسه يُعتبر backup", "c": 0}, {"h": "يكفي حفظ النسخ على نفس السيرفر", "c": 0}, {"h": "يجب أن يكون مؤتمتاً، محفوظاً خارج السيرفر، ومجرَّب الاستعادة", "c": 1}, {"h": "يؤخذ مرة واحدة عند أول نشر", "c": 0}]}]}], "proj": {"title": "المشروع النهائي: تطبيق Django متعدد الخدمات من الصفر إلى Production", "intro": "<p>ستبني بنفسك التطبيق الذي اقترحته الـ roadmap: <b>Caddy<\/b> في الواجهة، <b>React<\/b> كـ frontend، <b>Django<\/b> كـ REST API، <b>PostgreSQL<\/b> مع volume، <b>Redis<\/b>، و <b>Celery worker<\/b>، ويدير الجميع <b>Docker Compose<\/b>.<\/p><pre dir=\"ltr\" data-lang=\"\"><code>Browser --&gt; Caddy (80/443) --+--&gt; React static files\n                             +--&gt; Django API --&gt; PostgreSQL (volume)\n                                      |\n                                      +--&gt; Redis &lt;-- Celery worker<\/code><\/pre><h3>قواعد العمل<\/h3><ul><li>استخدم مشروع Django موجوداً عندك، أو أنشئ مشروعاً صغيراً فيه model واحد و endpoint واحد. المهم هو الـ Docker وليس التطبيق.<\/li><li>في كل مهمة: اقرأ الهدف، <b>حاول وحدك<\/b>، واكتب ما فعلته في خانة المحاولة. الحل المرجعي يُفتح فقط بعد أن تكتب محاولتك.<\/li><li>التلميحات اختيارية ومتدرجة. افتح الأول فقط إن علقت.<\/li><li>لا تنتقل للمهمة التالية حتى تتحقق بنفسك من كل بنود الـ Checkpoint على جهازك.<\/li><\/ul><h3>البنية المقترحة للمجلدات<\/h3><pre dir=\"ltr\" data-lang=\"\"><code>shop/\n  backend/        # Django: manage.py, config/, requirements.txt, Dockerfile, .dockerignore\n  frontend/       # React (Vite): package.json, src/, Dockerfile, Caddyfile\n  compose.yaml\n  compose.override.yaml\n  compose.prod.yaml\n  .env            # ليس في Git\n  .env.example<\/code><\/pre><div class=\"note\">الترتيب هنا يختلف قليلاً عن الـ roadmap الأصلية: Compose يدخل من المهمة الثالثة بدل الثامنة، لأن إدارة عدة containers يدوياً ثم نقلها كلها دفعة واحدة مرهق ولا يضيف فهماً جديداً بعد Stage 5.<\/div>", "tasks": [{"id": "k1", "title": "تشغيل PostgreSQL وحده مع حفظ البيانات", "html": "<p><b>الهدف:<\/b> أن تثبت بنفسك أن البيانات تعيش بعد حذف الـ container. (المفاهيم: Stage 2 و Stage 4)<\/p><p><b>المطلوب:<\/b><\/p><ol><li>شغّل PostgreSQL 17 بأمر <code dir=\"ltr\">docker run<\/code> واحد: في الخلفية، باسم واضح، بقاعدة بيانات ومستخدم وكلمة سر تحددها، مع named volume.<\/li><li>انشر الـ port بحيث يصل إليه جهازك أنت فقط.<\/li><li>أنشئ جدولاً وأدخل فيه سجلاً.<\/li><li>احذف الـ container، أنشئ واحداً جديداً بنفس الـ volume، وتأكد أن السجل موجود.<\/li><li>نظّف: احذف الـ container في النهاية.<\/li><\/ol>", "hints": ["<p>أي ثلاثة environment variables تقرؤها الـ image الرسمية <code dir=\"ltr\">postgres<\/code>؟ وأين يخزن PostgreSQL بياناته داخل الـ container؟ راجع مفهوم «الـ Docker volumes» في Stage 4.<\/p>", "<p>«جهازك فقط» يعني تحديد عنوان الربط في <code dir=\"ltr\">-p<\/code>. راجع «الـ Port mapping بعمق» في Stage 5.<\/p>", "<p>لتنفيذ SQL دون دخول تفاعلي: <code dir=\"ltr\">docker exec -it NAME psql -U USER -d DB -c \"SQL\"<\/code>.<\/p>"], "sol": "<pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name shop-db \\\n  -e POSTGRES_DB=shop -e POSTGRES_USER=app -e POSTGRES_PASSWORD=devpass \\\n  -v shop_pgdata:/var/lib/postgresql/data \\\n  -p 127.0.0.1:5432:5432 \\\n  postgres:17\n\ndocker exec -it shop-db psql -U app -d shop \\\n  -c \"CREATE TABLE notes(id serial PRIMARY KEY, body text);\" \\\n  -c \"INSERT INTO notes(body) VALUES ('still here');\"\n\ndocker rm -f shop-db\n\ndocker run -d --name shop-db \\\n  -e POSTGRES_DB=shop -e POSTGRES_USER=app -e POSTGRES_PASSWORD=devpass \\\n  -v shop_pgdata:/var/lib/postgresql/data \\\n  -p 127.0.0.1:5432:5432 \\\n  postgres:17\n\ndocker exec -it shop-db psql -U app -d shop -c \"SELECT * FROM notes;\"\ndocker rm -f shop-db\ndocker volume rm shop_pgdata    # لأن Compose سينشئ volume خاصاً به لاحقاً<\/code><\/pre><p>قارن: هل استخدمت named volume أم anonymous؟ هل حددت <code dir=\"ltr\">127.0.0.1<\/code> في النشر؟<\/p>", "checks": ["ظهر السجل بعد حذف الـ container وإنشاء آخر جديد.", "<code dir=\"ltr\">docker volume ls<\/code> أظهر الـ volume بالاسم الذي اخترته وليس بمعرّف عشوائي.", "<code dir=\"ltr\">docker ps<\/code> أظهر الـ port مربوطاً بـ <code dir=\"ltr\">127.0.0.1<\/code> وليس <code dir=\"ltr\">0.0.0.0<\/code>."], "q": {"t": "c", "q": "أعدت التجربة لكنك نسيت <code dir=\"ltr\">-v<\/code> في الأمر الثاني. ماذا ترى عند <code dir=\"ltr\">SELECT * FROM notes<\/code>؟", "e": "بدون ربط الـ volume يبدأ PostgreSQL بمجلد بيانات فارغ. بياناتك ما زالت في الـ volume القديم، لكنه غير مربوط.", "o": [{"h": "السجل موجود لأن الـ image تحفظه", "c": 0}, {"h": "خطأ بأن الجدول غير موجود، لأن الـ container الجديد بدأ بقاعدة بيانات فارغة", "c": 1}, {"h": "السجل موجود لأن الاسم نفسه", "c": 0}, {"h": "يفشل الـ container في العمل", "c": 0}]}}, {"id": "k2", "title": "كتابة Dockerfile لتطبيق Django", "html": "<p><b>الهدف:<\/b> image صغيرة وآمنة لتطبيقك، تُبنى بسرعة عند تعديل الكود. (Stage 3)<\/p><p><b>المطلوب:<\/b> داخل <code dir=\"ltr\">backend/<\/code>:<\/p><ol><li><code dir=\"ltr\">requirements.txt<\/code> فيه على الأقل: <code dir=\"ltr\">django<\/code> و <code dir=\"ltr\">djangorestframework<\/code> و <code dir=\"ltr\">psycopg[binary]<\/code> و <code dir=\"ltr\">gunicorn<\/code> و <code dir=\"ltr\">celery<\/code> و <code dir=\"ltr\">redis<\/code> و <code dir=\"ltr\">whitenoise<\/code>.<\/li><li><code dir=\"ltr\">Dockerfile<\/code> يحقق: base image بنسخة محددة، ترتيباً يحمي الـ build cache، مستخدماً غير root، و <code dir=\"ltr\">CMD<\/code> بالـ exec form يشغّل gunicorn على كل الواجهات.<\/li><li><code dir=\"ltr\">.dockerignore<\/code> مناسب.<\/li><li>إعدادات Django تقرأ <code dir=\"ltr\">SECRET_KEY<\/code> و <code dir=\"ltr\">DEBUG<\/code> و <code dir=\"ltr\">ALLOWED_HOSTS<\/code> وبيانات قاعدة البيانات من environment variables.<\/li><li>endpoint بسيط على <code dir=\"ltr\">/health/<\/code> يعيد <code dir=\"ltr\">200<\/code>.<\/li><li>ابنِ الـ image باسم <code dir=\"ltr\">shop-backend:dev<\/code>.<\/li><\/ol>", "hints": ["<p>ابدأ من الـ Dockerfile الكامل في آخر Stage 3 واسأل عن كل سطر: لماذا هنا؟<\/p>", "<p>في <code dir=\"ltr\">settings.py<\/code>: <code dir=\"ltr\">DEBUG = os.environ.get(\"DEBUG\", \"false\").lower() == \"true\"<\/code> و <code dir=\"ltr\">ALLOWED_HOSTS = os.environ.get(\"ALLOWED_HOSTS\", \"localhost\").split(\",\")<\/code>.<\/p>", "<p>للتحقق من المستخدم والحجم: <code dir=\"ltr\">docker run --rm shop-backend:dev whoami<\/code> و <code dir=\"ltr\">docker images shop-backend<\/code>.<\/p>"], "sol": "<p><code dir=\"ltr\">backend/Dockerfile<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM python:3.13-slim\n\nENV PYTHONUNBUFFERED=1 \\\n    PYTHONDONTWRITEBYTECODE=1\n\nRUN useradd --create-home --uid 1000 app\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY --chown=app:app . .\n\nUSER app\nEXPOSE 8000\nCMD [\"gunicorn\", \"config.wsgi:application\", \"--bind\", \"0.0.0.0:8000\", \"--access-logfile\", \"-\"]<\/code><\/pre><p><code dir=\"ltr\">backend/.dockerignore<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>.git\n.env\nvenv/\n.venv/\n__pycache__/\n*.pyc\ndb.sqlite3\nmedia/\nDockerfile\n.dockerignore<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>cd backend\ndocker build -t shop-backend:dev .\ndocker run --rm shop-backend:dev whoami          # app\ndocker run --rm shop-backend:dev python -m django --version<\/code><\/pre><p>جرّب: عدّل ملف <code dir=\"ltr\">.py<\/code> وأعد البناء. يجب أن ترى <code dir=\"ltr\">CACHED<\/code> أمام خطوة <code dir=\"ltr\">pip install<\/code>.<\/p>", "checks": ["<code dir=\"ltr\">whoami<\/code> داخل الـ container يطبع اسم مستخدم غير root.", "عند إعادة البناء بعد تعديل ملف كود فقط، ظهرت خطوة <code dir=\"ltr\">pip install<\/code> كـ <code dir=\"ltr\">CACHED<\/code>.", "ملف <code dir=\"ltr\">.env<\/code> غير موجود داخل الـ image (تحقق بـ <code dir=\"ltr\">docker run --rm shop-backend:dev ls -a<\/code>).", "<code dir=\"ltr\">docker images<\/code> يعرض حجماً معقولاً (مئات قليلة من الـ MB وليس أكثر من 1GB)."], "q": {"t": "m", "q": "في الـ Dockerfile الخاص بك، أي ترتيب يحمي الـ cache؟", "e": "نسخ ملف الـ dependencies وحده أولاً يبقي طبقة التثبيت صالحة ما لم يتغير هذا الملف.", "o": [{"h": "<code dir=\"ltr\">COPY . .<\/code> ثم <code dir=\"ltr\">RUN pip install<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">COPY requirements.txt .<\/code> ثم <code dir=\"ltr\">RUN pip install<\/code> ثم <code dir=\"ltr\">COPY . .<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">RUN pip install<\/code> ثم <code dir=\"ltr\">COPY requirements.txt .<\/code>", "c": 0}, {"h": "الترتيب لا يؤثر", "c": 0}]}}, {"id": "k3", "title": "ربط Django بـ PostgreSQL عبر Compose", "html": "<p><b>الهدف:<\/b> خدمتان يديرهما ملف واحد، تتخاطبان بالاسم، والأسرار خارج الملف. (Stage 5 و Stage 6)<\/p><p><b>المطلوب:<\/b> في جذر المشروع:<\/p><ol><li><code dir=\"ltr\">compose.yaml<\/code> فيه خدمتان: <code dir=\"ltr\">web<\/code> (تُبنى من <code dir=\"ltr\">./backend<\/code>) و <code dir=\"ltr\">db<\/code> (PostgreSQL 17 مع named volume).<\/li><li><code dir=\"ltr\">.env<\/code> فيه <code dir=\"ltr\">DB_NAME<\/code> و <code dir=\"ltr\">DB_USER<\/code> و <code dir=\"ltr\">DB_PASSWORD<\/code> و <code dir=\"ltr\">SECRET_KEY<\/code>، و <code dir=\"ltr\">compose.yaml<\/code> يشير إليها بـ <code dir=\"ltr\">${...}<\/code>.<\/li><li><code dir=\"ltr\">web<\/code> يصل إلى قاعدة البيانات باسم الـ service.<\/li><li>شغّل، نفّذ الـ migrations، وأنشئ superuser.<\/li><li>افتح <code dir=\"ltr\">http://localhost:8000/admin/<\/code> وسجّل الدخول.<\/li><li>أضف <code dir=\"ltr\">.env<\/code> إلى <code dir=\"ltr\">.gitignore<\/code> وأنشئ <code dir=\"ltr\">.env.example<\/code> بقيم وهمية.<\/li><\/ol>", "hints": ["<p>ما قيمة <code dir=\"ltr\">DB_HOST<\/code> التي يجب أن يراها Django؟ هل هي <code dir=\"ltr\">localhost<\/code>؟ راجع «لماذا لا نستخدم localhost» في Stage 5.<\/p>", "<p>في هذه المرحلة استخدم <code dir=\"ltr\">command: python manage.py runserver 0.0.0.0:8000<\/code> و <code dir=\"ltr\">DEBUG: \"true\"<\/code> لتسهيل التجربة. سنفصل التطوير عن Production في المهمة 9.<\/p>", "<p>إذا فشل <code dir=\"ltr\">web<\/code> عند أول تشغيل بـ <code dir=\"ltr\">connection refused<\/code> ثم نجح بعد إعادة التشغيل فهذا سباق الجاهزية. اتركه الآن، فهو موضوع المهمة التالية.<\/p>"], "sol": "<p><code dir=\"ltr\">.env<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>DB_NAME=shop\nDB_USER=app\nDB_PASSWORD=devpass\nSECRET_KEY=dev-only-change-me<\/code><\/pre><p><code dir=\"ltr\">compose.yaml<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    build: ./backend\n    command: python manage.py runserver 0.0.0.0:8000\n    ports:\n      - \"8000:8000\"\n    environment:\n      DEBUG: \"true\"\n      SECRET_KEY: ${SECRET_KEY}\n      DB_HOST: db\n      DB_NAME: ${DB_NAME}\n      DB_USER: ${DB_USER}\n      DB_PASSWORD: ${DB_PASSWORD}\n    depends_on:\n      - db\n\n  db:\n    image: postgres:17\n    environment:\n      POSTGRES_DB: ${DB_NAME}\n      POSTGRES_USER: ${DB_USER}\n      POSTGRES_PASSWORD: ${DB_PASSWORD}\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n\nvolumes:\n  pgdata:<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose config            # تأكد من تعويض المتغيرات\ndocker compose up -d --build\ndocker compose exec web python manage.py migrate\ndocker compose exec web python manage.py createsuperuser\ndocker compose ps<\/code><\/pre><p>لاحظ: <code dir=\"ltr\">db<\/code> بلا <code dir=\"ltr\">ports<\/code>. <code dir=\"ltr\">web<\/code> يصل إليه عبر الشبكة الافتراضية للمشروع.<\/p>", "checks": ["سجّلت الدخول إلى <code dir=\"ltr\">/admin/<\/code> بالـ superuser الذي أنشأته.", "<code dir=\"ltr\">docker compose config<\/code> يعرض القيم الحقيقية مكان <code dir=\"ltr\">${...}<\/code>.", "الخدمة <code dir=\"ltr\">db<\/code> ليس لها أي port منشور في <code dir=\"ltr\">docker compose ps<\/code>.", "بعد <code dir=\"ltr\">docker compose down<\/code> ثم <code dir=\"ltr\">docker compose up -d<\/code> ما زال الـ superuser موجوداً."], "q": {"t": "c", "q": "زميلك نسخ مشروعك ونفّذ <code dir=\"ltr\">docker compose up -d<\/code> ففشل برسالة تقول إن المتغير <code dir=\"ltr\">DB_PASSWORD<\/code> غير معرّف. ما السبب؟", "e": "<code dir=\"ltr\">.env<\/code> مستبعد من Git عمداً. لذلك نوفّر <code dir=\"ltr\">.env.example<\/code> ليعرف الزميل المتغيرات المطلوبة ويضع قيمه.", "o": [{"h": "نسخة Compose عنده قديمة", "c": 0}, {"h": "ملف <code dir=\"ltr\">.env<\/code> ليس في Git كما يجب، وعليه إنشاؤه من <code dir=\"ltr\">.env.example<\/code>", "c": 1}, {"h": "الـ image لم تُبنَ", "c": 0}, {"h": "الـ port 8000 مشغول", "c": 0}]}}
