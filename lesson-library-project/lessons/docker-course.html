nline\"><mrow><mn>143<\/mn><mo>&#x0003D;<\/mo><mn>128<\/mn><mo>&#x0002B;<\/mo><mn>15<\/mn><\/mrow><\/math>.<\/li><\/ul><p>المهم: الـ container المتوقف (<code dir=\"ltr\">exited<\/code>) ما زال موجوداً بملفاته، ويمكن تشغيله ثانية بـ <code dir=\"ltr\">docker start<\/code>.<\/p>", "q": {"t": "m", "q": "container ظهر في <code dir=\"ltr\">docker ps -a<\/code> بالحالة <code dir=\"ltr\">Exited (137)<\/code>. ما التفسير الأرجح؟", "e": "<math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>137<\/mn><mo>&#x0003D;<\/mo><mn>128<\/mn><mo>&#x0002B;<\/mo><mn>9<\/mn><\/mrow><\/math> والإشارة 9 هي SIGKILL. النجاح يكون بالكود <code dir=\"ltr\">0<\/code>.", "o": [{"h": "انتهى عمله بنجاح", "c": 0}, {"h": "لم يجد الـ image", "c": 0}, {"h": "قُتل بـ SIGKILL، ربما لتجاوزه حد الذاكرة أو بعد انتهاء مهلة <code dir=\"ltr\">docker stop<\/code>", "c": 1}, {"h": "الـ port محجوز", "c": 0}]}}, {"id": "m5c11", "title": "الحذف والتنظيف: docker rm و ‎--rm و prune", "html": "<p>الـ containers المتوقفة تبقى على القرص حتى تحذفها:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker rm web           # احذف container متوقفاً\ndocker rm -f web        # أوقفه بالقوة واحذفه\ndocker container prune  # احذف كل الـ containers المتوقفة<\/code><\/pre><p>للتجارب استخدم <code dir=\"ltr\">--rm<\/code> ليُحذف الـ container تلقائياً عند توقفه:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run --rm -it python:3.13-slim python<\/code><\/pre><p>وللتنظيف الشامل:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker system df        # كم يستهلك Docker من القرص؟\ndocker system prune     # احذف المتوقف وغير المستخدم<\/code><\/pre><div class=\"warn\">حذف الـ container يحذف طبقته القابلة للكتابة، أي كل ملف أُنشئ داخله ولم يُحفظ في volume. قاعدة بيانات بلا volume تضيع بياناتها مع <code dir=\"ltr\">docker rm<\/code>. هذا موضوع Stage 4.<\/div>", "q": {"t": "t", "q": "الأمر <code dir=\"ltr\">docker stop<\/code> يحذف الـ container وملفاته من الجهاز.", "e": "<code dir=\"ltr\">docker stop<\/code> يوقفه فقط ويبقى في حالة <code dir=\"ltr\">exited<\/code>. الحذف يكون بـ <code dir=\"ltr\">docker rm<\/code>.", "a": false}}, {"id": "m5c12", "title": "docker logs: قراءة مخرجات الـ Container", "html": "<p>Docker يلتقط كل ما يطبعه الـ process الرئيسي على <b>stdout<\/b> و <b>stderr<\/b> (قناتا الإخراج العادي والأخطاء) ويحفظه. تقرؤه بـ:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker logs web              # كل المخرجات\ndocker logs -f web           # تابعها مباشرة (follow)\ndocker logs --tail 50 web    # آخر 50 سطراً\ndocker logs --since 10m web  # آخر 10 دقائق\ndocker logs -t web           # مع الوقت<\/code><\/pre><p>هذا أول أمر تنفذه عند أي مشكلة. ويعمل مع الـ containers المتوقفة أيضاً، فتعرف منه لماذا توقف.<\/p><p>لذلك القاعدة في تطبيقات الـ containers: اكتب الـ logs إلى stdout، لا إلى ملف داخل الـ container.<\/p>", "q": {"t": "c", "q": "شغّلت container بـ <code dir=\"ltr\">-d<\/code> فتوقف بعد ثانية. ما أول خطوة لمعرفة السبب؟", "e": "<code dir=\"ltr\">docker logs<\/code> يعمل حتى مع الـ containers المتوقفة ويعرض آخر ما طبعه التطبيق، وغالباً فيه سبب الفشل.", "o": [{"h": "حذف الـ image وتنزيلها من جديد", "c": 0}, {"h": "إعادة تشغيل الجهاز", "c": 0}, {"h": "تنفيذ <code dir=\"ltr\">docker logs<\/code> على الـ container لقراءة رسالة الخطأ", "c": 1}, {"h": "تغيير الـ port", "c": 0}]}}, {"id": "m5c13", "title": "docker exec: تنفيذ أمر داخل Container يعمل", "html": "<p><code dir=\"ltr\">docker exec<\/code> يشغّل process <b>إضافياً<\/b> داخل container يعمل حالياً:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker exec web ls /usr/share/nginx/html     # أمر واحد\ndocker exec -it web bash                     # shell تفاعلي\ndocker exec -it db psql -U app -d shop       # ادخل إلى PostgreSQL\ndocker exec -e DEBUG=1 web env               # مع متغير إضافي<\/code><\/pre><p>إذا لم تجد <code dir=\"ltr\">bash<\/code> في الـ image (كما في alpine) استخدم <code dir=\"ltr\">sh<\/code>.<\/p><p>الفرق عن <code dir=\"ltr\">docker run<\/code>:<\/p><div class=\"tw\"><table><thead><tr><th><\/th><th><code dir=\"ltr\">docker run<\/code><\/th><th><code dir=\"ltr\">docker exec<\/code><\/th><\/tr><\/thead><tbody><tr><td>ينشئ container جديداً؟<\/td><td>نعم<\/td><td>لا<\/td><\/tr><tr><td>يحتاج container يعمل؟<\/td><td>لا<\/td><td>نعم<\/td><\/tr><\/tbody><\/table><\/div><p>وعند <code dir=\"ltr\">exit<\/code> من shell فتحته بـ <code dir=\"ltr\">exec<\/code> لا يتوقف الـ container، لأن الـ process الرئيسي ما زال يعمل.<\/p><div class=\"warn\"><code dir=\"ltr\">exec<\/code> للفحص والتشخيص. أي تعديل تجريه يدوياً داخل الـ container يضيع عند إعادة إنشائه. التعديل الدائم مكانه الـ Dockerfile.<\/div>", "q": {"t": "m", "q": "ما الفرق بين <code dir=\"ltr\">docker run -it nginx bash<\/code> و <code dir=\"ltr\">docker exec -it web bash<\/code>؟", "e": "<code dir=\"ltr\">run<\/code> ينشئ دائماً container جديداً. <code dir=\"ltr\">exec<\/code> يدخل إلى container موجود ويعمل.", "o": [{"h": "لا فرق", "c": 0}, {"h": "الأول ينشئ container جديداً، والثاني يفتح shell داخل container يعمل", "c": 1}, {"h": "الأول للقراءة فقط", "c": 0}, {"h": "الثاني يعيد تشغيل الـ container", "c": 0}]}}, {"id": "m5c14", "title": "docker inspect: فحص الإعدادات", "html": "<p><code dir=\"ltr\">docker inspect<\/code> يعرض كل تفاصيل الـ container (أو image أو volume أو network) بصيغة JSON: الـ IP، الـ ports، الـ mounts، المتغيرات، الأمر، الحالة.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker inspect web<\/code><\/pre><p>الناتج طويل، فاستخرج ما تريد بـ <code dir=\"ltr\">--format<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker inspect --format '{{.State.Status}}' web\ndocker inspect --format '{{.State.ExitCode}}' web\ndocker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' web\ndocker inspect --format '{{json .Mounts}}' web<\/code><\/pre><p>متى تحتاجه؟ حين تسأل: «ما IP هذا الـ container؟»، «أي volume مربوط به؟»، «بأي متغيرات شُغِّل؟»، «لماذا توقف؟».<\/p>", "q": {"t": "m", "q": "أي أمر يعطيك IP address الخاص بـ container والـ volumes المربوطة به؟", "e": "<code dir=\"ltr\">docker inspect<\/code> يعرض الإعدادات الكاملة. <code dir=\"ltr\">logs<\/code> للمخرجات و <code dir=\"ltr\">stats<\/code> للاستهلاك اللحظي.", "o": [{"h": "<code dir=\"ltr\">docker logs<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker stats<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker inspect<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker images<\/code>", "c": 0}]}}, {"id": "m5c15", "title": "المراقبة ونسخ الملفات: docker stats و top و cp", "html": "<p><code dir=\"ltr\">docker stats<\/code> يعرض استهلاك الموارد لحظة بلحظة:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker stats\ndocker stats --no-stream   # لقطة واحدة ثم يخرج\n# NAME   CPU %   MEM USAGE / LIMIT    MEM %   NET I/O\n# web    0.15%   12.5MiB / 7.6GiB     0.16%   1.2kB / 0B<\/code><\/pre><p>إذا لم تضع حداً فسيكون <code dir=\"ltr\">LIMIT<\/code> هو ذاكرة الجهاز كلها، أي أن container واحداً قد يستهلكها. سنضع الحدود في Stage 7.<\/p><p><code dir=\"ltr\">docker top web<\/code> يعرض الـ processes العاملة داخل الـ container.<\/p><p><code dir=\"ltr\">docker cp<\/code> ينسخ ملفات بين الـ host والـ container:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker cp web:/etc/nginx/nginx.conf ./nginx.conf   # من الـ container\ndocker cp ./index.html web:/usr/share/nginx/html/  # إلى الـ container<\/code><\/pre><p>مفيد لاستخراج ملف إعدادات أو ملف dump دون إعداد volume.<\/p>", "q": {"t": "s", "q": "اكتب الأمر الذي يعرض استهلاك الـ CPU والذاكرة للـ containers العاملة لحظة بلحظة.", "e": "<code dir=\"ltr\">docker stats<\/code> يعرض CPU والذاكرة والشبكة لكل container بشكل حي.", "r": "^docker (container )?stats$", "m": "<code dir=\"ltr\">docker stats<\/code>"}}], "test": [{"t": "m", "q": "ما الأمر الذي يفتح shell تفاعلياً داخل container يعمل اسمه <code dir=\"ltr\">api<\/code>؟", "e": "<code dir=\"ltr\">exec<\/code> يعمل على container موجود. <code dir=\"ltr\">run<\/code> كان سيبحث عن image اسمها <code dir=\"ltr\">api<\/code> وينشئ container جديداً.", "o": [{"h": "<code dir=\"ltr\">docker run -it api bash<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker exec -it api bash<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker logs -it api<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker start -it api bash<\/code>", "c": 0}]}, {"t": "t", "q": "بعد <code dir=\"ltr\">docker stop web<\/code> يمكن إعادة تشغيل نفس الـ container بملفاته بالأمر <code dir=\"ltr\">docker start web<\/code>.", "e": "الـ container المتوقف باقٍ بطبقته القابلة للكتابة، و <code dir=\"ltr\">docker start<\/code> يعيده للعمل.", "a": true}, {"t": "s", "q": "اكتب أمراً يشغّل <code dir=\"ltr\">nginx<\/code> في الخلفية باسم <code dir=\"ltr\">web<\/code> وينشر port 80 الداخلي على port 8080 في الـ host.", "e": "<code dir=\"ltr\">-d<\/code> للخلفية، <code dir=\"ltr\">--name<\/code> للاسم، و <code dir=\"ltr\">-p HOST:CONTAINER<\/code> للنشر. ترتيب الخيارات لا يهم، واسم الـ image يأتي بعدها.", "r": "^docker (container )?run (?=.*(-d|--detach)\\b)(?=.*--name[ =]web\\b)(?=.*(-p|--publish)[ =]8080:80\\b).*nginx$", "m": "<code dir=\"ltr\">docker run -d --name web -p 8080:80 nginx<\/code>"}, {"t": "c", "q": "تطبيقك في container يعمل لكنه بطيء جداً، وتشك في أنه يستهلك الذاكرة كلها. أي أمر تبدأ به؟", "e": "<code dir=\"ltr\">docker stats<\/code> يعرض الاستهلاك الحي للذاكرة والـ CPU.", "o": [{"h": "<code dir=\"ltr\">docker inspect<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker stats<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker pull<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker rmi<\/code>", "c": 0}]}, {"t": "m", "q": "ماذا يفعل الخيار <code dir=\"ltr\">--rm<\/code> مع <code dir=\"ltr\">docker run<\/code>؟", "e": "<code dir=\"ltr\">--rm<\/code> مفيد للتجارب حتى لا تتراكم containers متوقفة.", "o": [{"h": "يحذف الـ image بعد التشغيل", "c": 0}, {"h": "يحذف الـ container تلقائياً عند توقفه", "c": 1}, {"h": "يعيد تشغيل الـ container عند الفشل", "c": 0}, {"h": "يمنع نشر الـ ports", "c": 0}]}, {"t": "m", "q": "كم ينتظر <code dir=\"ltr\">docker stop<\/code> افتراضياً بعد SIGTERM قبل إرسال SIGKILL؟", "e": "المهلة الافتراضية 10 ثوانٍ، وتُغيَّر بالخيار <code dir=\"ltr\">-t<\/code>.", "o": [{"h": "لا ينتظر", "c": 0}, {"h": "ثانية واحدة", "c": 0}, {"h": "10 ثوانٍ", "c": 1}, {"h": "دقيقة", "c": 0}]}, {"t": "t", "q": "الأمر <code dir=\"ltr\">docker logs<\/code> لا يعمل إلا مع الـ containers العاملة.", "e": "يعمل مع المتوقفة أيضاً، وهذا ما يجعله أداة التشخيص الأولى.", "a": false}]}, {"id": "m6", "title": "Stage 3: الـ Dockerfile وبناء الـ Images", "badge": "Intermediate", "dur": "4–5 أيام", "intro": "<p>حتى الآن استخدمت images جاهزة. في هذه المرحلة تبني image لتطبيقك أنت. هذه من أهم مراحل الدورة، فكل ما بعدها يعتمد عليها.<\/p>", "cs": [{"id": "m6c1", "title": "ما هو الـ Dockerfile وكيف نبني منه؟", "html": "<p><b>الـ Dockerfile<\/b> ملف نصي (اسمه <code dir=\"ltr\">Dockerfile<\/code> بلا امتداد) يحوي تعليمات مرتبة تصف كيف تُبنى الـ image. كل سطر يبدأ بتعليمة بأحرف كبيرة.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM python:3.13-slim\nWORKDIR /app\nCOPY . .\nCMD [\"python\", \"app.py\"]<\/code><\/pre><p>تبنيه بالأمر:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker build -t myapp:1.0 .<\/code><\/pre><ul><li><code dir=\"ltr\">-t myapp:1.0<\/code> يعطي الـ image اسماً و tag.<\/li><li>النقطة <code dir=\"ltr\">.<\/code> في النهاية هي الـ <b>build context<\/b>: المجلد الذي يُرسَل للبناء ويُبحث فيه عن الـ <code dir=\"ltr\">Dockerfile<\/code>.<\/li><\/ul><p>ثم تشغّل:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run --rm myapp:1.0<\/code><\/pre><p>الفائدة: طريقة بناء بيئتك صارت مكتوبة في ملف يُحفظ في Git، وأي شخص يعيد بناءها بنفس الشكل.<\/p>", "q": {"t": "m", "q": "ماذا تعني النقطة في آخر الأمر <code dir=\"ltr\">docker build -t myapp:1.0 .<\/code>؟", "e": "النقطة مسار المجلد الحالي، وهو الـ build context الذي تُنسخ منه الملفات ويُبحث فيه عن الـ Dockerfile.", "o": [{"h": "نهاية الأمر", "c": 0}, {"h": "اسم الـ image", "c": 0}, {"h": "الـ build context: المجلد الحالي الذي يُرسَل للبناء", "c": 1}, {"h": "تشغيل الـ image بعد البناء", "c": 0}]}}, {"id": "m6c2", "title": "التعليمة FROM", "html": "<p>كل Dockerfile يبدأ بـ <code dir=\"ltr\">FROM<\/code>. هي تحدد <b>الـ base image<\/b>: الـ image التي تبني فوقها.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM python:3.13-slim<\/code><\/pre><p>بهذا السطر تحصل على نظام Linux مصغّر وفوقه Python 3.13 جاهزاً.<\/p><p>اختيار الـ variant:<\/p><div class=\"tw\"><table><thead><tr><th>الـ tag<\/th><th>الوصف<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">python:3.13<\/code><\/td><td>كاملة، قرابة 1GB، فيها أدوات بناء كثيرة<\/td><\/tr><tr><td><code dir=\"ltr\">python:3.13-slim<\/code><\/td><td>مختصرة، قرابة 120MB. الخيار المناسب غالباً<\/td><\/tr><tr><td><code dir=\"ltr\">python:3.13-alpine<\/code><\/td><td>صغيرة جداً، لكن مبنية على مكتبة C مختلفة (musl) قد تسبب مشاكل وبطء بناء مع بعض مكتبات Python<\/td><\/tr><\/tbody><\/table><\/div><p>قواعد:<\/p><ul><li>حدد النسخة دائماً. لا تكتب <code dir=\"ltr\">FROM python<\/code> وحدها.<\/li><li>استخدم Official Images.<\/li><li><code dir=\"ltr\">slim<\/code> نقطة بداية جيدة لمشاريع Django.<\/li><\/ul>", "q": {"t": "m", "q": "لماذا نكتب <code dir=\"ltr\">FROM python:3.13-slim<\/code> بدل <code dir=\"ltr\">FROM python<\/code>؟", "e": "<code dir=\"ltr\">FROM python<\/code> تعني <code dir=\"ltr\">python:latest<\/code>، وهي متحركة وكبيرة الحجم. تحديد النسخة والـ variant يجعل البناء ثابتاً وخفيفاً.", "o": [{"h": "لأن <code dir=\"ltr\">FROM python<\/code> خطأ في الصيغة", "c": 0}, {"h": "لتثبيت النسخة حتى لا يتغير البناء مع الوقت، وللحصول على image أصغر", "c": 1}, {"h": "لأن <code dir=\"ltr\">slim<\/code> أسرع في تنفيذ الكود", "c": 0}, {"h": "لأن Docker Hub يفرض ذلك", "c": 0}]}}, {"id": "m6c3", "title": "التعليمة WORKDIR", "html": "<p><code dir=\"ltr\">WORKDIR<\/code> تحدد المجلد الذي تُنفَّذ فيه التعليمات التالية (<code dir=\"ltr\">RUN<\/code> و <code dir=\"ltr\">COPY<\/code> و <code dir=\"ltr\">CMD<\/code>) داخل الـ image، وتنشئه إن لم يكن موجوداً. هي تعادل <code dir=\"ltr\">mkdir -p<\/code> ثم <code dir=\"ltr\">cd<\/code>، وتأثيرها يستمر.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>WORKDIR /app\nCOPY . .          # تنسخ إلى /app\nRUN ls            # تُنفَّذ داخل /app<\/code><\/pre><p>لماذا لا نكتب <code dir=\"ltr\">RUN cd /app<\/code>؟ لأن كل <code dir=\"ltr\">RUN<\/code> تعمل في shell مستقل، فأثر <code dir=\"ltr\">cd<\/code> يزول بانتهاء سطرها.<\/p><p>استخدم دائماً absolute path مثل <code dir=\"ltr\">/app<\/code>. وبدون <code dir=\"ltr\">WORKDIR<\/code> ستتبعثر ملفاتك في جذر النظام <code dir=\"ltr\">/<\/code>.<\/p>", "q": {"t": "t", "q": "التعليمة <code dir=\"ltr\">RUN cd /app<\/code> تغيّر مجلد العمل لكل التعليمات التي بعدها في الـ Dockerfile.", "e": "أثر <code dir=\"ltr\">cd<\/code> ينتهي مع نهاية تعليمة <code dir=\"ltr\">RUN<\/code> نفسها. تغيير مجلد العمل بشكل دائم يكون بـ <code dir=\"ltr\">WORKDIR<\/code>.", "a": false}}, {"id": "m6c4", "title": "التعليمة COPY", "html": "<p><code dir=\"ltr\">COPY<\/code> تنسخ ملفات من الـ build context (جهازك) إلى داخل الـ image:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>COPY requirements.txt .          # ملف واحد إلى WORKDIR\nCOPY . .                         # كل الـ context إلى WORKDIR\nCOPY config/ /app/config/        # مجلد\nCOPY --chown=app:app . .         # مع تحديد المالك<\/code><\/pre><p>الصيغة: <code dir=\"ltr\">COPY &lt;source&gt; &lt;destination&gt;<\/code>. المصدر نسبةً للـ build context، والوجهة داخل الـ image.<\/p><p>قيد مهم: لا يمكن نسخ شيء من خارج الـ build context. <code dir=\"ltr\">COPY ../secret.txt .<\/code> يفشل.<\/p><p>توجد تعليمة شبيهة اسمها <code dir=\"ltr\">ADD<\/code> تضيف سلوكاً خفياً: تفك ملفات tar تلقائياً وتنزّل من روابط. القاعدة: استخدم <code dir=\"ltr\">COPY<\/code> دائماً، ولا تستخدم <code dir=\"ltr\">ADD<\/code> إلا إذا احتجت ميزتها تحديداً.<\/p>", "q": {"t": "m", "q": "أي تعليمة تُفضَّل لنسخ كود التطبيق إلى الـ image؟", "e": "<code dir=\"ltr\">COPY<\/code> تنسخ فقط دون مفاجآت. <code dir=\"ltr\">ADD<\/code> تفك الأرشيفات وتنزّل من روابط، فتُستخدم عند الحاجة لذلك فقط.", "o": [{"h": "<code dir=\"ltr\">ADD<\/code> لأنها أحدث", "c": 0}, {"h": "<code dir=\"ltr\">COPY<\/code> لأن سلوكها واضح: نسخ فقط", "c": 1}, {"h": "<code dir=\"ltr\">RUN cp<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">FROM<\/code>", "c": 0}]}}, {"id": "m6c5", "title": "التعليمة RUN", "html": "<p><code dir=\"ltr\">RUN<\/code> تنفّذ أمراً <b>أثناء البناء<\/b> وتحفظ نتيجته داخل الـ image. بها تثبّت المكتبات والأدوات.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN pip install --no-cache-dir -r requirements.txt<\/code><\/pre><p>لتثبيت حزم نظام:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN apt-get update \\\n &amp;&amp; apt-get install -y --no-install-recommends libpq5 \\\n &amp;&amp; rm -rf /var/lib/apt/lists/*<\/code><\/pre><p>لماذا كل ذلك في <code dir=\"ltr\">RUN<\/code> واحدة؟<\/p><ul><li><code dir=\"ltr\">&amp;&amp;<\/code> ينفذ الأمر التالي فقط إذا نجح السابق.<\/li><li>التنظيف (<code dir=\"ltr\">rm -rf ...<\/code>) يجب أن يكون في نفس التعليمة. لو وضعته في <code dir=\"ltr\">RUN<\/code> منفصلة لبقيت الملفات المحذوفة محفوظة في الطبقة السابقة ولن يصغر الحجم.<\/li><li>جمع <code dir=\"ltr\">apt-get update<\/code> مع <code dir=\"ltr\">install<\/code> يمنع استخدام فهرس حزم قديم من الـ cache.<\/li><\/ul><div class=\"warn\"><code dir=\"ltr\">RUN<\/code> تعمل وقت <b>البناء<\/b>، و <code dir=\"ltr\">CMD<\/code> تعمل وقت <b>التشغيل<\/b>. لا تضع <code dir=\"ltr\">RUN python manage.py migrate<\/code>، فقاعدة البيانات غير موجودة أثناء البناء.<\/div>", "q": {"t": "m", "q": "متى تُنفَّذ تعليمة <code dir=\"ltr\">RUN<\/code>؟", "e": "<code dir=\"ltr\">RUN<\/code> خطوة بناء. ما يعمل عند تشغيل الـ container يحدده <code dir=\"ltr\">CMD<\/code> أو <code dir=\"ltr\">ENTRYPOINT<\/code>.", "o": [{"h": "أثناء بناء الـ image، وتُحفظ نتيجتها فيها", "c": 1}, {"h": "عند كل تشغيل للـ container", "c": 0}, {"h": "عند تنفيذ <code dir=\"ltr\">docker pull<\/code>", "c": 0}, {"h": "عند إيقاف الـ container", "c": 0}]}}, {"id": "m6c6", "title": "الـ Image layers", "html": "<p>الـ image ليست ملفاً واحداً. هي <b>طبقات (layers)<\/b> مرصوصة، كل طبقة تحوي فقط <b>التغييرات<\/b> على ما تحتها.<\/p><p>التعليمات التي تغيّر الـ filesystem (<code dir=\"ltr\">FROM<\/code> و <code dir=\"ltr\">RUN<\/code> و <code dir=\"ltr\">COPY<\/code> و <code dir=\"ltr\">ADD<\/code>) تنتج كل واحدة منها طبقة. التعليمات الأخرى (<code dir=\"ltr\">ENV<\/code> و <code dir=\"ltr\">CMD<\/code> و <code dir=\"ltr\">EXPOSE<\/code>...) تضيف معلومات وصفية فقط (metadata) بلا حجم.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker history myapp:1.0<\/code><\/pre><p>يعرض الطبقات وحجم كل منها. والحجم الكلي مجموع الطبقات:<\/p><div class=\"mblock\"><math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>size<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mtext>image<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><munderover><mo>&#x02211;<\/mo><mrow><mi>i<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/munderover><mtext>size<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><msub><mtext>layer<\/mtext><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/div><p>خصائص الطبقات:<\/p><ul><li><b>للقراءة فقط<\/b> ولا تتغير.<\/li><li><b>مشتركة<\/b>: عشر images مبنية على <code dir=\"ltr\">python:3.13-slim<\/code> تخزن طبقاتها الأساسية مرة واحدة على القرص.<\/li><li><b>تراكمية<\/b>: حذف ملف في طبقة لاحقة يخفيه فقط، ويبقى حجمه في الطبقة التي أضافته.<\/li><\/ul><p>تشبيه: شرائح شفافة فوق بعضها. تنظر من الأعلى فترى الصورة النهائية، وكل شريحة تضيف أو تغطي.<\/p>", "q": {"t": "c", "q": "في Dockerfile: السطر الأول <code dir=\"ltr\">RUN<\/code> ينزّل ملفاً حجمه 500MB، والسطر الثاني <code dir=\"ltr\">RUN rm<\/code> يحذفه. ما أثر ذلك على حجم الـ image؟", "e": "الطبقات تراكمية وثابتة. الحذف في طبقة لاحقة يخفي الملف فقط. الحل: التنزيل والاستخدام والحذف في تعليمة <code dir=\"ltr\">RUN<\/code> واحدة.", "o": [{"h": "ينقص الحجم 500MB بعد الحذف", "c": 0}, {"h": "يبقى الحجم متضمناً الـ 500MB لأنها محفوظة في طبقة السطر الأول", "c": 1}, {"h": "تفشل عملية البناء", "c": 0}, {"h": "تُدمج الطبقتان تلقائياً", "c": 0}]}}, {"id": "m6c7", "title": "الـ Build cache وترتيب التعليمات", "html": "<p>عند كل بناء يفحص Docker كل تعليمة: إن لم تتغير هي ولا ما قبلها، يعيد استخدام طبقتها المحفوظة (سترى <code dir=\"ltr\">CACHED<\/code>) ولا ينفذها. هذا هو <b>الـ build cache<\/b>.<\/p><p>متى يُلغى الـ cache لتعليمة؟<\/p><ul><li>إذا تغيّر نصها.<\/li><li>في <code dir=\"ltr\">COPY<\/code>: إذا تغيّر محتوى أي ملف منسوخ.<\/li><li>إذا أُلغي cache أي تعليمة <b>قبلها<\/b>. أي أن الإلغاء يسري على كل ما بعده.<\/li><\/ul><p>لذلك الترتيب يصنع فرقاً كبيراً. ترتيب سيئ:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>COPY . .\nRUN pip install -r requirements.txt<\/code><\/pre><p>أي تعديل في أي ملف كود يلغي cache الـ <code dir=\"ltr\">COPY<\/code>، فيُعاد تثبيت كل المكتبات عند كل بناء.<\/p><p>ترتيب جيد:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>COPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY . .<\/code><\/pre><p>الآن يُعاد تثبيت المكتبات فقط إذا تغيّر <code dir=\"ltr\">requirements.txt<\/code>. تعديل الكود يعيد تنفيذ السطر الأخير فقط، والبناء يأخذ ثواني.<\/p><p>القاعدة: ضع ما يتغير نادراً في الأعلى، وما يتغير كثيراً في الأسفل.<\/p><p>لتجاهل الـ cache كلياً: <code dir=\"ltr\">docker build --no-cache .<\/code><\/p>", "q": {"t": "m", "q": "لماذا ننسخ <code dir=\"ltr\">requirements.txt<\/code> ونثبّت المكتبات قبل نسخ بقية الكود؟", "e": "تعديل الكود لا يغيّر <code dir=\"ltr\">requirements.txt<\/code>، فتبقى طبقة التثبيت من الـ cache ويُعاد تنفيذ نسخ الكود فقط.", "o": [{"h": "لأن Docker يشترط هذا الترتيب", "c": 0}, {"h": "لتصغير حجم الـ image", "c": 0}, {"h": "حتى لا يُعاد تثبيت المكتبات عند كل تعديل في الكود، فيبقى cache طبقة التثبيت صالحاً", "c": 1}, {"h": "لأن <code dir=\"ltr\">pip<\/code> لا يعمل بعد <code dir=\"ltr\">COPY . .<\/code>", "c": 0}]}}, {"id": "m6c8", "title": "الـ Build context", "html": "<p><b>الـ build context<\/b> هو مجموعة الملفات المتاحة لعملية البناء، وهو المجلد الذي تمرره لـ <code dir=\"ltr\">docker build<\/code> (النقطة غالباً).<\/p><p>ما يترتب على ذلك:<\/p><ul><li><code dir=\"ltr\">COPY<\/code> لا ترى إلا ما بداخله.<\/li><li>كلما كبر الـ context صار البناء أبطأ. مجلد فيه <code dir=\"ltr\">node_modules<\/code> أو <code dir=\"ltr\">.git<\/code> أو ملفات بيانات كبيرة يبطئ كل بناء.<\/li><li>أي ملف داخل الـ context قد يدخل الـ image مع <code dir=\"ltr\">COPY . .<\/code>، ومنه <code dir=\"ltr\">.env<\/code> بأسراره.<\/li><\/ul><p>يمكن وضع الـ Dockerfile في مكان آخر مع بقاء الـ context كما هو:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker build -f docker/Dockerfile.prod -t myapp .<\/code><\/pre><p><code dir=\"ltr\">-f<\/code> يحدد ملف الـ Dockerfile، والنقطة تبقى هي الـ context.<\/p>", "q": {"t": "t", "q": "التعليمة <code dir=\"ltr\">COPY<\/code> تستطيع نسخ أي ملف من جهازك حتى لو كان خارج الـ build context.", "e": "<code dir=\"ltr\">COPY<\/code> محصورة في الـ build context. ما هو خارجه غير مرئي لعملية البناء.", "a": false}}, {"id": "m6c9", "title": "الملف ‎.dockerignore", "html": "<p>ملف <code dir=\"ltr\">.dockerignore<\/code> يوضع في جذر الـ build context ويحدد ما يُستبعد منه، بنفس أسلوب <code dir=\"ltr\">.gitignore<\/code>.<\/p><pre dir=\"ltr\" data-lang=\"\"><code>.git\n.env\n*.pyc\n__pycache__/\nvenv/\n.venv/\nnode_modules/\ndb.sqlite3\nmedia/\n*.log\nDockerfile\ncompose*.yaml<\/code><\/pre><p>فوائده:<\/p><ul><li><b>الأمان<\/b>: <code dir=\"ltr\">.env<\/code> وأسراره لا تدخل الـ image.<\/li><li><b>السرعة<\/b>: context أصغر.<\/li><li><b>الحجم<\/b>: لا <code dir=\"ltr\">venv<\/code> ولا <code dir=\"ltr\">.git<\/code> داخل الـ image.<\/li><li><b>الـ cache<\/b>: تغيّر ملف مستبعد لا يلغي cache الـ <code dir=\"ltr\">COPY . .<\/code>.<\/li><\/ul><div class=\"warn\"><code dir=\"ltr\">venv<\/code> على جهازك مبني لنظامك، وإدخاله في الـ image خطأ شائع: يضخّم الحجم وقد يكسر التشغيل. المكتبات تُثبَّت داخل الـ image بـ <code dir=\"ltr\">RUN pip install<\/code>.<\/div>", "q": {"t": "c", "q": "بعد <code dir=\"ltr\">COPY . .<\/code> اكتشفت أن ملف <code dir=\"ltr\">.env<\/code> الذي فيه كلمة سر قاعدة البيانات موجود داخل الـ image المرفوعة إلى Docker Hub. ما الإجراء الوقائي الصحيح مستقبلاً؟", "e": "<code dir=\"ltr\">RUN rm<\/code> لا يكفي لأن الملف يبقى في طبقة سابقة ويمكن استخراجه. <code dir=\"ltr\">.dockerignore<\/code> يمنع دخوله من الأساس. وكلمة السر المسرّبة يجب تغييرها.", "o": [{"h": "إضافة <code dir=\"ltr\">RUN rm .env<\/code> في آخر الـ Dockerfile", "c": 0}, {"h": "إضافة <code dir=\"ltr\">.env<\/code> إلى <code dir=\"ltr\">.dockerignore<\/code> حتى لا يدخل الـ build context أصلاً", "c": 1}, {"h": "تغيير اسم الملف إلى <code dir=\"ltr\">env.txt<\/code>", "c": 0}, {"h": "استخدام <code dir=\"ltr\">ADD<\/code> بدل <code dir=\"ltr\">COPY<\/code>", "c": 0}]}}, {"id": "m6c10", "title": "التعليمة ENV", "html": "<p><code dir=\"ltr\">ENV<\/code> تعرّف environment variable يكون متاحاً أثناء بقية البناء <b>وداخل كل container<\/b> يُشغَّل من الـ image.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>ENV PYTHONUNBUFFERED=1 \\\n    PYTHONDONTWRITEBYTECODE=1 \\\n    DJANGO_SETTINGS_MODULE=config.settings<\/code><\/pre><ul><li><code dir=\"ltr\">PYTHONUNBUFFERED=1<\/code> يجعل Python يطبع مخرجاته فوراً فتظهر في <code dir=\"ltr\">docker logs<\/code> دون تأخير.<\/li><li><code dir=\"ltr\">PYTHONDONTWRITEBYTECODE=1<\/code> يمنع إنشاء ملفات <code dir=\"ltr\">.pyc<\/code>.<\/li><\/ul><p>القيمة هنا <b>افتراضية<\/b> ويمكن تغييرها عند التشغيل:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -e DJANGO_SETTINGS_MODULE=config.prod myapp<\/code><\/pre><div class=\"warn\">لا تضع الأسرار في <code dir=\"ltr\">ENV<\/code>. تبقى محفوظة في الـ image ويراها كل من ينفذ <code dir=\"ltr\">docker inspect<\/code> أو <code dir=\"ltr\">docker history<\/code>.<\/div>", "q": {"t": "m", "q": "ما مصير متغير عُرِّف بـ <code dir=\"ltr\">ENV<\/code> في الـ Dockerfile؟", "e": "<code dir=\"ltr\">ENV<\/code> يُحفظ في الـ image كقيمة افتراضية وتستطيع استبدالها وقت التشغيل.", "o": [{"h": "يتاح أثناء البناء فقط", "c": 0}, {"h": "يتاح أثناء البناء وداخل الـ containers، ويمكن تغييره بـ <code dir=\"ltr\">-e<\/code> عند التشغيل", "c": 1}, {"h": "لا يمكن تغييره أبداً", "c": 0}, {"h": "يتاح على الـ host فقط", "c": 0}]}}, {"id": "m6c11", "title": "التعليمة ARG", "html": "<p><code dir=\"ltr\">ARG<\/code> تعرّف متغيراً يتاح <b>أثناء البناء فقط<\/b>، وتُمرَّر قيمته من سطر الأوامر:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>ARG PYTHON_VERSION=3.13\nFROM python:${PYTHON_VERSION}-slim\n\nARG APP_VERSION=dev\nLABEL version=${APP_VERSION}<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker build --build-arg APP_VERSION=1.4.2 -t myapp:1.4.2 .<\/code><\/pre><div class=\"tw\"><table><thead><tr><th><\/th><th><code dir=\"ltr\">ARG<\/code><\/th><th><code dir=\"ltr\">ENV<\/code><\/th><\/tr><\/thead><tbody><tr><td>متاح وقت البناء<\/td><td>نعم<\/td><td>نعم<\/td><\/tr><tr><td>متاح داخل الـ container<\/td><td>لا<\/td><td>نعم<\/td><\/tr><tr><td>يُمرَّر عبر<\/td><td><code dir=\"ltr\">--build-arg<\/code><\/td><td><code dir=\"ltr\">-e<\/code> أو <code dir=\"ltr\">environment<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>ملاحظة: الـ <code dir=\"ltr\">ARG<\/code> المعرَّف قبل <code dir=\"ltr\">FROM<\/code> لا يُرى بعدها إلا إذا أعدت تعريفه.<\/p><div class=\"warn\"><code dir=\"ltr\">ARG<\/code> ليس مكاناً آمناً للأسرار أيضاً، فقيمه قد تظهر في <code dir=\"ltr\">docker history<\/code>. الطريقة الصحيحة هي build secrets وسنراها في Stage 7.<\/div>", "q": {"t": "m", "q": "تطبيقك يحتاج قراءة متغير أثناء <b>تشغيل<\/b> الـ container. أي تعليمة تعرّف له قيمة افتراضية في الـ Dockerfile؟", "e": "<code dir=\"ltr\">ARG<\/code> يختفي بعد البناء. <code dir=\"ltr\">ENV<\/code> هو الذي يبقى داخل الـ container.", "o": [{"h": "<code dir=\"ltr\">ARG<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">ENV<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">EXPOSE<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">WORKDIR<\/code>", "c": 0}]}}, {"id": "m6c12", "title": "التعليمة EXPOSE", "html": "<p><code dir=\"ltr\">EXPOSE<\/code> <b>توثّق<\/b> الـ port الذي يستمع عليه التطبيق داخل الـ container:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>EXPOSE 8000<\/code><\/pre><p>هي معلومة لمن يقرأ الـ Dockerfile وللأدوات، ولا شيء أكثر.<\/p><div class=\"warn\"><code dir=\"ltr\">EXPOSE<\/code> لا تنشر الـ port ولا تفتحه على الـ host. النشر الفعلي يكون عند التشغيل بـ <code dir=\"ltr\">-p 8000:8000<\/code> أو بـ <code dir=\"ltr\">ports<\/code> في Compose.<\/div><p>ومن دون <code dir=\"ltr\">EXPOSE<\/code> يعمل النشر بـ <code dir=\"ltr\">-p<\/code> بشكل طبيعي، وتبقى الـ containers على نفس الشبكة قادرة على الوصول إلى الـ port. اكتبها دائماً للتوثيق.<\/p>", "q": {"t": "t", "q": "كتابة <code dir=\"ltr\">EXPOSE 8000<\/code> في الـ Dockerfile تكفي لفتح <code dir=\"ltr\">http://localhost:8000<\/code> من متصفح جهازك.", "e": "<code dir=\"ltr\">EXPOSE<\/code> توثيق فقط. يجب نشر الـ port عند التشغيل بـ <code dir=\"ltr\">-p 8000:8000<\/code>.", "a": false}}, {"id": "m6c13", "title": "التعليمة CMD وصيغتا exec و shell", "html": "<p><code dir=\"ltr\">CMD<\/code> تحدد <b>الأمر الافتراضي<\/b> الذي يعمل عند تشغيل container. إذا تكررت فالعبرة بالأخيرة.<\/p><p>لها صيغتان:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code># exec form: مصفوفة JSON. الصيغة الموصى بها\nCMD [\"gunicorn\", \"config.wsgi:application\", \"--bind\", \"0.0.0.0:8000\"]\n\n# shell form: نص عادي\nCMD gunicorn config.wsgi:application --bind 0.0.0.0:8000<\/code><\/pre><p>الفرق مهم:<\/p><ul><li>في الـ <b>exec form<\/b> برنامجك هو PID 1 مباشرة، فتصله إشارة SIGTERM من <code dir=\"ltr\">docker stop<\/code> ويتوقف بهدوء.<\/li><li>في الـ <b>shell form<\/b> يشغّل Docker <code dir=\"ltr\">/bin/sh -c \"...\"<\/code> فيصبح الـ shell هو PID 1، ولا يمرر الإشارة لبرنامجك. النتيجة: <code dir=\"ltr\">docker stop<\/code> ينتظر 10 ثوانٍ ثم يقتل التطبيق بالقوة.<\/li><\/ul><p>الأمر الذي تكتبه بعد اسم الـ image في <code dir=\"ltr\">docker run<\/code> يستبدل <code dir=\"ltr\">CMD<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run myapp python manage.py shell<\/code><\/pre>", "q": {"t": "c", "q": "كل مرة تنفّذ <code dir=\"ltr\">docker stop<\/code> على تطبيقك ينتظر 10 ثوانٍ كاملة ثم يخرج بالكود 137. الـ Dockerfile ينتهي بـ <code dir=\"ltr\">CMD python app.py<\/code>. ما السبب الأرجح؟", "e": "الحل استخدام الـ exec form: <code dir=\"ltr\">CMD [\"python\", \"app.py\"]<\/code> ليستقبل التطبيق الإشارة مباشرة.", "o": [{"h": "التطبيق كبير الحجم", "c": 0}, {"h": "الـ shell form جعل <code dir=\"ltr\">sh<\/code> هو PID 1 فلم تصل SIGTERM إلى التطبيق، فقُتل بـ SIGKILL بعد المهلة", "c": 1}, {"h": "الـ port ما زال مشغولاً", "c": 0}, {"h": "الـ image تالفة", "c": 0}]}}, {"id": "m6c14", "title": "التعليمة ENTRYPOINT وعلاقتها بـ CMD", "html": "<p><code dir=\"ltr\">ENTRYPOINT<\/code> تحدد <b>البرنامج الرئيسي<\/b> للـ container. الفرق عن <code dir=\"ltr\">CMD<\/code>: ما تكتبه بعد اسم الـ image في <code dir=\"ltr\">docker run<\/code> لا يستبدله، بل يُضاف إليه كـ arguments.<\/p><p>عند اجتماعهما: <code dir=\"ltr\">ENTRYPOINT<\/code> هو البرنامج، و <code dir=\"ltr\">CMD<\/code> هو الـ arguments الافتراضية.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>ENTRYPOINT [\"python\", \"manage.py\"]\nCMD [\"runserver\", \"0.0.0.0:8000\"]<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run myapp                 # python manage.py runserver 0.0.0.0:8000\ndocker run myapp migrate         # python manage.py migrate\ndocker run myapp createsuperuser # python manage.py createsuperuser<\/code><\/pre><p>استخدام شائع آخر: سكربت تحضير يعمل قبل التطبيق:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>COPY entrypoint.sh /entrypoint.sh\nRUN chmod +x /entrypoint.sh\nENTRYPOINT [\"/entrypoint.sh\"]\nCMD [\"gunicorn\", \"config.wsgi:application\", \"--bind\", \"0.0.0.0:8000\"]<\/code><\/pre><pre dir=\"ltr\" data-lang=\"bash\"><code>#!/bin/sh\nset -e\npython manage.py migrate --noinput\nexec \"$@\"<\/code><\/pre><p><code dir=\"ltr\">exec \"$@\"<\/code> ينفّذ الـ <code dir=\"ltr\">CMD<\/code> ويجعله يحل محل السكربت كـ PID 1، فتصله الإشارات.<\/p><p>متى أختار؟ <code dir=\"ltr\">CMD<\/code> وحدها تكفي أغلب التطبيقات. استخدم <code dir=\"ltr\">ENTRYPOINT<\/code> إذا أردت الـ container أن يتصرف كأمر ثابت، أو احتجت تحضيراً قبل التشغيل.<\/p>", "q": {"t": "m", "q": "Dockerfile فيه <code dir=\"ltr\">ENTRYPOINT [\"python\", \"manage.py\"]<\/code> و <code dir=\"ltr\">CMD [\"runserver\"]<\/code>. ماذا ينفّذ <code dir=\"ltr\">docker run myapp migrate<\/code>؟", "e": "ما بعد اسم الـ image يستبدل <code dir=\"ltr\">CMD<\/code> فقط ويُلحق بـ <code dir=\"ltr\">ENTRYPOINT<\/code>.", "o": [{"h": "<code dir=\"ltr\">migrate<\/code> فقط", "c": 0}, {"h": "<code dir=\"ltr\">python manage.py runserver migrate<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">python manage.py migrate<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">python manage.py runserver<\/code>", "c": 0}]}}, {"id": "m6c15", "title": "التعليمة USER", "html": "<p>افتراضياً يعمل كل شيء داخل الـ container كـ <b>root<\/b>. <code dir=\"ltr\">USER<\/code> تغيّر المستخدم لما بعدها من تعليمات وللـ container عند التشغيل.<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>RUN useradd --create-home --uid 1000 app\nWORKDIR /app\nCOPY --chown=app:app . .\nUSER app\nCMD [\"gunicorn\", \"config.wsgi:application\", \"--bind\", \"0.0.0.0:8000\"]<\/code><\/pre><p>لماذا؟ إذا وُجدت ثغرة في تطبيقك، فمهاجم يعمل كـ root داخل الـ container يملك فرصاً أكبر بكثير للإضرار أو الخروج إلى الـ host من مهاجم بمستخدم محدود. هذا مبدأ <b>least privilege<\/b>: أعطِ البرنامج أقل صلاحيات يحتاجها.<\/p><p>انتبه للترتيب:<\/p><ul><li>التعليمات التي تحتاج root (مثل <code dir=\"ltr\">apt-get install<\/code>) تأتي <b>قبل<\/b> <code dir=\"ltr\">USER<\/code>.<\/li><li>المستخدم الجديد يجب أن يملك الملفات التي سيكتب فيها، ولهذا <code dir=\"ltr\">--chown<\/code>.<\/li><li>المستخدم غير الـ root لا يستطيع الاستماع على ports أقل من 1024. استخدم 8000 مثلاً.<\/li><\/ul>", "q": {"t": "m", "q": "أين توضع تعليمة <code dir=\"ltr\">USER app<\/code> في الـ Dockerfile؟", "e": "ما بعد <code dir=\"ltr\">USER<\/code> يُنفَّذ بالمستخدم الجديد، فتثبيت حزم النظام يجب أن يسبقها.", "o": [{"h": "في السطر الأول قبل <code dir=\"ltr\">FROM<\/code>", "c": 0}, {"h": "بعد التعليمات التي تحتاج صلاحيات root مثل تثبيت حزم النظام، وقبل <code dir=\"ltr\">CMD<\/code>", "c": 1}, {"h": "بعد <code dir=\"ltr\">CMD<\/code>", "c": 0}, {"h": "لا يهم مكانها", "c": 0}]}}, {"id": "m6c16", "title": "الـ Image tagging", "html": "<p><b>الـ tag<\/b> اسم مقروء يشير إلى image محددة. الـ image الواحدة يمكن أن تحمل عدة tags.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker build -t shop-api:1.4.2 .\ndocker tag shop-api:1.4.2 shop-api:1.4\ndocker tag shop-api:1.4.2 ali/shop-api:1.4.2   # تجهيز للرفع إلى Docker Hub<\/code><\/pre><p><code dir=\"ltr\">docker tag<\/code> لا ينسخ الـ image، هو يضيف اسماً جديداً لنفس الـ IMAGE ID.<\/p><p>استراتيجيات شائعة:<\/p><ul><li><b>Semantic versioning<\/b>: <code dir=\"ltr\">1.4.2<\/code> بصيغة <code dir=\"ltr\">MAJOR.MINOR.PATCH<\/code>.<\/li><li><b>Git commit SHA<\/b>: مثل <code dir=\"ltr\">shop-api:3f2a1bc<\/code>. تعرف منه بالضبط أي كود داخل الـ image.<\/li><li><code dir=\"ltr\">latest<\/code> للراحة في التطوير فقط.<\/li><\/ul><p>قاعدة Production: كل نسخة تُنشر لها tag فريد لا يُعاد استخدامه. بهذا تعرف ما الذي يعمل الآن، وتستطيع الرجوع (rollback) إلى النسخة السابقة بتغيير الـ tag.<\/p>", "q": {"t": "t", "q": "الأمر <code dir=\"ltr\">docker tag app:1.0 app:stable<\/code> ينشئ نسخة ثانية كاملة من الـ image ويضاعف المساحة المستهلكة.", "e": "<code dir=\"ltr\">docker tag<\/code> يضيف اسماً آخر لنفس الـ image دون نسخ بياناتها.", "a": false}}, {"id": "m6c17", "title": "تصغير حجم الـ Image", "html": "<p>الـ image الأصغر أسرع في الرفع والتنزيل والنشر، وفيها برامج أقل، إذن ثغرات محتملة أقل.<\/p><ol><li><b>base image صغيرة<\/b>: <code dir=\"ltr\">python:3.13-slim<\/code> بدل <code dir=\"ltr\">python:3.13<\/code>.<\/li><li><b>لا تترك مخلفات<\/b>: <code dir=\"ltr\">pip install --no-cache-dir<\/code>، وتنظيف apt في نفس الـ <code dir=\"ltr\">RUN<\/code>.<\/li><li><b><code dir=\"ltr\">--no-install-recommends<\/code><\/b> مع <code dir=\"ltr\">apt-get install<\/code>.<\/li><li><b><code dir=\"ltr\">.dockerignore<\/code><\/b> محكم.<\/li><li><b>اجمع الأوامر المترابطة<\/b> في <code dir=\"ltr\">RUN<\/code> واحدة حتى لا تبقى ملفات مؤقتة في طبقات وسيطة.<\/li><li><b>Multi-stage builds<\/b>: أدوات البناء في مرحلة، والنتيجة فقط في الـ image النهائية. نفصّلها في Stage 7.<\/li><\/ol><p>للقياس:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker images shop-api\ndocker history shop-api:1.4.2    # أي تعليمة أضافت كم؟<\/code><\/pre><p>مثال: الانتقال من <code dir=\"ltr\">python:3.13<\/code> بحجم 1000MB تقريباً إلى <code dir=\"ltr\">slim<\/code> بحجم 120MB تقريباً يوفر نحو <math dir=\"ltr\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1000<\/mn><mo>&#x02212;<\/mo><mn>120<\/mn><\/mrow><mrow><mn>1000<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>88<\/mn><mi>&#x00025;<\/mi><\/mrow><\/math> من حجم الأساس.<\/p>", "q": {"t": "m", "q": "أي إجراء يصغّر الـ image فعلاً؟", "e": "التنظيف في طبقة لاحقة لا يستعيد المساحة. يجب أن يحدث في نفس الطبقة التي أنشأت الملفات.", "o": [{"h": "إضافة <code dir=\"ltr\">RUN rm -rf /var/lib/apt/lists/*<\/code> في تعليمة منفصلة في آخر الملف", "c": 0}, {"h": "تنفيذ التثبيت والتنظيف داخل تعليمة <code dir=\"ltr\">RUN<\/code> واحدة", "c": 1}, {"h": "زيادة عدد تعليمات <code dir=\"ltr\">RUN<\/code>", "c": 0}, {"h": "إضافة <code dir=\"ltr\">EXPOSE<\/code>", "c": 0}]}}, {"id": "m6c18", "title": "التطبيق: Dockerfile كامل لتطبيق Django", "html": "<p>نجمع كل ما سبق:<\/p><pre dir=\"ltr\" data-lang=\"dockerfile\"><code>FROM python:3.13-slim\n\nENV PYTHONUNBUFFERED=1 \\\n    PYTHONDONTWRITEBYTECODE=1\n\nRUN apt-get update \\\n &amp;&amp; apt-get install -y --no-install-recommends libpq5 \\\n &amp;&amp; rm -rf /var/lib/apt/lists/*\n\nRUN useradd --create-home --uid 1000 app\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY --chown=app:app . .\n\nUSER app\nEXPOSE 8000\nCMD [\"gunicorn\", \"config.wsgi:application\", \"--bind\", \"0.0.0.0:8000\"]<\/code><\/pre><p>اقرأه سطراً سطراً واسأل «لماذا هنا؟»:<\/p><ul><li>حزم النظام والمستخدم في الأعلى لأنها تتغير نادراً.<\/li><li><code dir=\"ltr\">requirements.txt<\/code> قبل الكود لحماية الـ cache.<\/li><li><code dir=\"ltr\">USER<\/code> بعد كل ما يحتاج root.<\/li><li><code dir=\"ltr\">0.0.0.0<\/code> ليُقبل الاتصال من خارج الـ container.<\/li><li><b>gunicorn<\/b> بدل <code dir=\"ltr\">runserver<\/code>، لأن <code dir=\"ltr\">runserver<\/code> خادم تطوير غير مصمم لـ Production.<\/li><li>الـ exec form لتصل الإشارات إلى التطبيق.<\/li><\/ul><pre dir=\"ltr\" data-lang=\"bash\"><code>docker build -t shop-api:0.1 .\ndocker run --rm -p 8000:8000 --env-file .env shop-api:0.1<\/code><\/pre><div class=\"note\"><code dir=\"ltr\">libpq5<\/code> تلزم إذا استخدمت <code dir=\"ltr\">psycopg<\/code> دون النسخة binary. مع <code dir=\"ltr\">psycopg[binary]<\/code> لا تحتاجها.<\/div>", "q": {"t": "m", "q": "في الـ Dockerfile أعلاه، ماذا يحدث عند تعديل ملف <code dir=\"ltr\">views.py<\/code> ثم إعادة البناء؟", "e": "<code dir=\"ltr\">requirements.txt<\/code> لم يتغير، فطبقة <code dir=\"ltr\">pip install<\/code> تبقى من الـ cache. التغيير يبدأ من <code dir=\"ltr\">COPY . .<\/code>.", "o": [{"h": "يُعاد تنفيذ كل التعليمات من <code dir=\"ltr\">FROM<\/code>", "c": 0}, {"h": "يُعاد تثبيت المكتبات ثم نسخ الكود", "c": 0}, {"h": "تُستخدم الطبقات السابقة من الـ cache، ويُعاد تنفيذ <code dir=\"ltr\">COPY . .<\/code> وما بعدها فقط", "c": 1}, {"h": "لا يُعاد تنفيذ شيء", "c": 0}]}}], "test": [{"t": "m", "q": "أي تعليمة تحدد الـ base image؟", "e": "<code dir=\"ltr\">FROM<\/code> هي أول تعليمة وتحدد الـ image التي نبني فوقها.", "o": [{"h": "<code dir=\"ltr\">WORKDIR<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">FROM<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">ENTRYPOINT<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">ARG<\/code>", "c": 0}]}, {"t": "t", "q": "التعليمة <code dir=\"ltr\">ENV<\/code> تُنتج طبقة filesystem جديدة تزيد حجم الـ image.", "e": "<code dir=\"ltr\">ENV<\/code> تضيف metadata فقط. الطبقات ذات الحجم تأتي من <code dir=\"ltr\">RUN<\/code> و <code dir=\"ltr\">COPY<\/code> و <code dir=\"ltr\">ADD<\/code>.", "a": false}, {"t": "s", "q": "اكتب أمر بناء image باسم <code dir=\"ltr\">shop<\/code> و tag قيمته <code dir=\"ltr\">1.0<\/code> من الـ Dockerfile الموجود في المجلد الحالي.", "e": "<code dir=\"ltr\">-t<\/code> للاسم والـ tag، والنقطة هي الـ build context.", "r": "^docker (image |buildx )?build (-t|--tag)[ =]shop:1\\.0 \\.$", "m": "<code dir=\"ltr\">docker build -t shop:1.0 .<\/code>"}, {"t": "c", "q": "البناء عندك يأخذ 4 دقائق عند كل تعديل بسيط في الكود، وأغلب الوقت في <code dir=\"ltr\">pip install<\/code>. ما الإصلاح؟", "e": "بهذا الترتيب تبقى طبقة التثبيت في الـ cache ما لم يتغير <code dir=\"ltr\">requirements.txt<\/code>.", "o": [{"h": "استخدام <code dir=\"ltr\">--no-cache<\/code>", "c": 0}, {"h": "نسخ <code dir=\"ltr\">requirements.txt<\/code> وتثبيت المكتبات قبل <code dir=\"ltr\">COPY . .<\/code>", "c": 1}, {"h": "حذف <code dir=\"ltr\">.dockerignore<\/code>", "c": 0}, {"h": "استخدام <code dir=\"ltr\">ADD<\/code> بدل <code dir=\"ltr\">COPY<\/code>", "c": 0}]}, {"t": "m", "q": "ما الفرق بين <code dir=\"ltr\">ARG<\/code> و <code dir=\"ltr\">ENV<\/code>؟", "e": "<code dir=\"ltr\">ARG<\/code> لتخصيص البناء، و <code dir=\"ltr\">ENV<\/code> لإعدادات التشغيل.", "o": [{"h": "لا فرق", "c": 0}, {"h": "<code dir=\"ltr\">ARG<\/code> للأرقام و <code dir=\"ltr\">ENV<\/code> للنصوص", "c": 0}, {"h": "<code dir=\"ltr\">ARG<\/code> متاح وقت البناء فقط، و <code dir=\"ltr\">ENV<\/code> يبقى داخل الـ container", "c": 1}, {"h": "<code dir=\"ltr\">ENV<\/code> متاح وقت البناء فقط", "c": 0}]}, {"t": "m", "q": "لماذا تُفضَّل الـ exec form في <code dir=\"ltr\">CMD<\/code>؟", "e": "في الـ shell form يكون <code dir=\"ltr\">sh<\/code> هو PID 1 ولا يمرر SIGTERM للتطبيق.", "o": [{"h": "لأنها أقصر", "c": 0}, {"h": "لأن التطبيق يصبح PID 1 ويستقبل إشارات الإيقاف مباشرة", "c": 1}, {"h": "لأنها تدعم environment variables", "c": 0}, {"h": "لأنها تصغّر الـ image", "c": 0}]}, {"t": "t", "q": "ملف <code dir=\"ltr\">.dockerignore<\/code> يمنع الملفات المذكورة فيه من دخول الـ build context.", "e": "هذه وظيفته: استبعاد الملفات قبل إرسال الـ context، فلا تصل إلى <code dir=\"ltr\">COPY<\/code>.", "a": true}, {"t": "c", "q": "زميلك يريد تشغيل تطبيقه بمستخدم غير root، فوضع <code dir=\"ltr\">USER app<\/code> في السطر الثاني ثم <code dir=\"ltr\">RUN apt-get install -y curl<\/code>. ماذا سيحدث؟", "e": "ما بعد <code dir=\"ltr\">USER<\/code> يعمل بصلاحيات ذلك المستخدم. تثبيت حزم النظام يجب أن يسبق <code dir=\"ltr\">USER<\/code>.", "o": [{"h": "يفشل <code dir=\"ltr\">apt-get<\/code> لأن المستخدم <code dir=\"ltr\">app<\/code> لا يملك صلاحيات تثبيت حزم النظام", "c": 1}, {"h": "ينجح البناء دون مشاكل", "c": 0}, {"h": "يتجاهل Docker تعليمة <code dir=\"ltr\">USER<\/code>", "c": 0}, {"h": "يتحول المستخدم إلى root تلقائياً", "c": 0}]}]}, {"id": "m7", "title": "Stage 4: التخزين وحفظ البيانات", "badge": "Intermediate", "dur": "2–3 أيام", "intro": "<p>السؤال المركزي: ماذا يحدث لقاعدة بياناتك عندما يُحذف الـ container؟ في نهاية هذه المرحلة تعرف كيف تبقى البيانات مستقلة عن الـ containers.<\/p>", "cs": [{"id": "m7c1", "title": "الـ Container writable layer", "html": "<p>عند إنشاء container يضيف Docker فوق طبقات الـ image (وهي للقراءة فقط) طبقة رقيقة <b>قابلة للكتابة<\/b>. كل ملف ينشئه أو يعدّله التطبيق يُكتب فيها.<\/p><p>آلية <b>copy-on-write<\/b>: إذا عدّل الـ container ملفاً أصله في الـ image، يُنسخ الملف أولاً إلى الطبقة القابلة للكتابة ثم يُعدَّل هناك. الـ image لا تُمَس.<\/p><p>خصائص هذه الطبقة:<\/p><ul><li>خاصة بـ container واحد.<\/li><li>تبقى عند <code dir=\"ltr\">docker stop<\/code> و <code dir=\"ltr\">docker start<\/code>.<\/li><li><b>تُحذف نهائياً<\/b> مع <code dir=\"ltr\">docker rm<\/code>.<\/li><li>الكتابة فيها أبطأ من الكتابة في volume.<\/li><\/ul><p>جرّب:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name t1 nginx\ndocker exec t1 sh -c 'echo hello &gt; /note.txt'\ndocker rm -f t1\ndocker run -d --name t1 nginx\ndocker exec t1 cat /note.txt     # No such file or directory<\/code><\/pre><p>الخلاصة: الـ container مكان مؤقت. أي بيانات مهمة يجب أن تعيش خارجه.<\/p>", "q": {"t": "m", "q": "ماذا يحدث للملفات المكتوبة في الـ writable layer؟", "e": "الطبقة مرتبطة بحياة الـ container: تبقى ما دام موجوداً وتزول بحذفه.", "o": [{"h": "تُحفظ داخل الـ image", "c": 0}, {"h": "تبقى عند <code dir=\"ltr\">stop<\/code> و <code dir=\"ltr\">start<\/code>، وتُحذف نهائياً عند <code dir=\"ltr\">docker rm<\/code>", "c": 1}, {"h": "تُحذف عند كل <code dir=\"ltr\">docker stop<\/code>", "c": 0}, {"h": "تُنسخ تلقائياً إلى الـ host", "c": 0}]}}, {"id": "m7c2", "title": "الـ Docker volumes", "html": "<p><b>الـ volume<\/b> مساحة تخزين يديرها Docker، موجودة <b>خارج<\/b> الـ container، وتُربط بمسار داخله. دورة حياتها مستقلة: تحذف الـ container ويبقى الـ volume.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker volume create pgdata\ndocker run -d --name db \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v pgdata:/var/lib/postgresql/data \\\n  postgres:17<\/code><\/pre><p>الصيغة <code dir=\"ltr\">-v VOLUME_NAME:CONTAINER_PATH<\/code>. كل ما يكتبه PostgreSQL في <code dir=\"ltr\">/var/lib/postgresql/data<\/code> يُخزَّن فعلياً في الـ volume المسمى <code dir=\"ltr\">pgdata<\/code>.<\/p><p>نوعان:<\/p><ul><li><b>Named volume<\/b>: له اسم تختاره (<code dir=\"ltr\">pgdata<\/code>). تجده بسهولة وتعيد استخدامه. استخدمه دائماً للبيانات المهمة.<\/li><li><b>Anonymous volume<\/b>: بلا اسم (<code dir=\"ltr\">-v /path<\/code> فقط) فيأخذ معرّفاً عشوائياً طويلاً يصعب تتبعه.<\/li><\/ul><p>الصيغة الأطول والأوضح:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>--mount type=volume,source=pgdata,target=/var/lib/postgresql/data<\/code><\/pre><p>على Linux تُخزَّن الـ volumes في <code dir=\"ltr\">/var/lib/docker/volumes/<\/code>، لكن لا تتعامل مع هذا المسار مباشرة.<\/p><p>Docker يوصي بالـ volumes كخيار أول لحفظ بيانات الـ containers.<\/p><div class=\"note\">المسار <code dir=\"ltr\">/var/lib/postgresql/data<\/code> صحيح للـ image الرسمية حتى النسخة 17. من النسخة 18 تغيّر مكان الربط الموصى به، فراجع صفحة الـ image على Docker Hub قبل الترقية.<\/div>", "q": {"t": "m", "q": "ما الميزة الأساسية للـ named volume؟", "e": "الـ volume مستقل عن الـ container: تحذف الـ container وتنشئ غيره بنفس الـ volume فتجد بياناتك.", "o": [{"h": "يسرّع الشبكة", "c": 0}, {"h": "البيانات فيه تبقى بعد حذف الـ container ويمكن ربطه بـ container جديد", "c": 1}, {"h": "يصغّر حجم الـ image", "c": 0}, {"h": "يشفّر البيانات تلقائياً", "c": 0}]}}, {"id": "m7c3", "title": "الـ Bind mounts", "html": "<p><b>الـ bind mount<\/b> يربط مجلداً أو ملفاً محدداً <b>من جهازك<\/b> بمسار داخل الـ container. الطرفان يريان نفس الملفات مباشرة.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d -p 8000:8000 \\\n  -v \"$(pwd)\":/app \\\n  shop-api:0.1 python manage.py runserver 0.0.0.0:8000<\/code><\/pre><p>الصيغة <code dir=\"ltr\">-v HOST_PATH:CONTAINER_PATH<\/code>. Docker يميّزه عن الـ volume بأن الطرف الأول <b>مسار<\/b> (يبدأ بـ <code dir=\"ltr\">/<\/code> أو <code dir=\"ltr\">.<\/code>) وليس اسماً.<\/p><p>الاستخدام الأهم: <b>التطوير<\/b>. تعدّل الكود على جهازك بمحررك، فيرى الـ container التغيير فوراً دون إعادة بناء.<\/p><p>استخدام آخر: حقن ملف إعدادات للقراءة فقط بإضافة <code dir=\"ltr\">:ro<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>-v ./Caddyfile:/etc/caddy/Caddyfile:ro<\/code><\/pre><div class=\"tw\"><table><thead><tr><th><\/th><th>Volume<\/th><th>Bind mount<\/th><\/tr><\/thead><tbody><tr><td>من يدير المكان<\/td><td>Docker<\/td><td>أنت<\/td><\/tr><tr><td>يعتمد على مسارات الـ host<\/td><td>لا<\/td><td>نعم<\/td><\/tr><tr><td>الأنسب لـ<\/td><td>بيانات Production<\/td><td>الكود أثناء التطوير، وملفات الإعدادات<\/td><\/tr><\/tbody><\/table><\/div><div class=\"warn\">الـ bind mount <b>يغطي<\/b> ما كان في ذلك المسار داخل الـ image. إذا ربطت مجلد مشروعك على <code dir=\"ltr\">/app<\/code> فسيختفي كل ما وضعته الـ image هناك.<\/div>", "q": {"t": "c", "q": "أثناء التطوير تريد أن ينعكس كل تعديل في كود Django على الـ container فوراً دون <code dir=\"ltr\">docker build<\/code>. ما الأنسب؟", "e": "الـ bind mount يجعل الـ container يقرأ ملفاتك مباشرة، فيلتقط <code dir=\"ltr\">runserver<\/code> التغييرات فوراً.", "o": [{"h": "named volume للكود", "c": 0}, {"h": "bind mount يربط مجلد المشروع على جهازك بـ <code dir=\"ltr\">/app<\/code> داخل الـ container", "c": 1}, {"h": "tmpfs mount", "c": 0}, {"h": "<code dir=\"ltr\">docker cp<\/code> بعد كل تعديل", "c": 0}]}}, {"id": "m7c4", "title": "الـ tmpfs mounts", "html": "<p><b>الـ tmpfs mount<\/b> مساحة تخزين في <b>الذاكرة (RAM)<\/b> فقط. لا تُكتب على القرص أبداً، وتختفي عند توقف الـ container.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --tmpfs /tmp:size=64m myapp\n# أو\ndocker run -d --mount type=tmpfs,target=/tmp,tmpfs-size=64m myapp<\/code><\/pre><p>متى تستخدمه؟<\/p><ul><li>بيانات حساسة مؤقتة لا تريد لها أثراً على القرص.<\/li><li>ملفات مؤقتة تحتاج سرعة عالية.<\/li><li>مع الـ containers ذات الـ filesystem للقراءة فقط (<code dir=\"ltr\">--read-only<\/code>): تعطي التطبيق مكاناً صغيراً للكتابة في <code dir=\"ltr\">/tmp<\/code>.<\/li><\/ul><p>قيوده: يعمل على Linux فقط، لا يُشارَك بين containers، ويستهلك من الذاكرة.<\/p><p>ملخص الأنواع الثلاثة:<\/p><div class=\"tw\"><table><thead><tr><th>النوع<\/th><th>أين تُخزَّن البيانات<\/th><th>تبقى بعد حذف الـ container؟<\/th><\/tr><\/thead><tbody><tr><td>Volume<\/td><td>منطقة يديرها Docker<\/td><td>نعم<\/td><\/tr><tr><td>Bind mount<\/td><td>مسار تحدده على الـ host<\/td><td>نعم<\/td><\/tr><tr><td>tmpfs<\/td><td>الذاكرة<\/td><td>لا<\/td><\/tr><\/tbody><\/table><\/div>", "q": {"t": "t", "q": "البيانات في tmpfs mount تبقى محفوظة بعد إيقاف الـ container.", "e": "الـ tmpfs في الذاكرة فقط ويزول بتوقف الـ container.", "a": false}}, {"id": "m7c5", "title": "دورة حياة الـ Volume", "html": "<pre dir=\"ltr\" data-lang=\"bash\"><code>docker volume create pgdata    # إنشاء\ndocker volume ls               # عرض\ndocker volume inspect pgdata   # التفاصيل ومكان التخزين\ndocker volume rm pgdata        # حذف (يفشل إذا كان مستخدماً)\ndocker volume prune            # حذف الـ anonymous volumes غير المستخدمة\ndocker volume prune -a         # حذف كل الـ volumes غير المستخدمة، ومنها المسمّاة<\/code><\/pre><p>قواعد:<\/p><ul><li>الـ volume يُنشأ تلقائياً إذا ذكرت اسماً غير موجود في <code dir=\"ltr\">-v<\/code>.<\/li><li><code dir=\"ltr\">docker rm<\/code> <b>لا<\/b> يحذف الـ named volumes. يبقى الـ volume حتى تحذفه أنت صراحة.<\/li><li><code dir=\"ltr\">docker rm -v<\/code> يحذف الـ anonymous volumes التابعة للـ container فقط.<\/li><li>إذا رُبط volume <b>فارغ<\/b> بمسار فيه ملفات في الـ image، ينسخ Docker تلك الملفات إلى الـ volume في أول مرة.<\/li><\/ul><div class=\"warn\">أخطر أمرين على بياناتك: <code dir=\"ltr\">docker volume prune -a<\/code> و <code dir=\"ltr\">docker compose down -v<\/code>. كلاهما يحذف الـ volumes، ولا تراجع بعد الحذف. لا تنفّذهما على سيرفر Production دون نسخة احتياطية.<\/div>", "q": {"t": "m", "q": "نفّذت <code dir=\"ltr\">docker rm -f db<\/code> على container قاعدة بيانات مربوط بـ named volume اسمه <code dir=\"ltr\">pgdata<\/code>. ماذا حدث للـ volume؟", "e": "الـ named volumes لا تُحذف مع الـ container. تبقى حتى <code dir=\"ltr\">docker volume rm<\/code> أو <code dir=\"ltr\">prune -a<\/code>.", "o": [{"h": "حُذف مع الـ container", "c": 0}, {"h": "بقي كما هو ببياناته", "c": 1}, {"h": "أُفرغ من محتواه وبقي", "c": 0}, {"h": "تحوّل إلى anonymous volume", "c": 0}]}}, {"id": "m7c6", "title": "حفظ بيانات قاعدة البيانات: تجربة عملية", "html": "<p>نفّذ التجربة كاملة. هي أهم تمرين في المرحلة.<\/p><p><b>1. أنشئ PostgreSQL مع volume:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name db1 \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v pgdata:/var/lib/postgresql/data \\\n  postgres:17<\/code><\/pre><p><b>2. أدخل بيانات:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker exec -it db1 psql -U postgres -c \"CREATE TABLE notes(id serial, body text);\"\ndocker exec -it db1 psql -U postgres -c \"INSERT INTO notes(body) VALUES ('survive me');\"<\/code><\/pre><p><b>3. احذف الـ container:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker rm -f db1<\/code><\/pre><p><b>4. أنشئ container جديداً بنفس الـ volume:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run -d --name db2 \\\n  -e POSTGRES_PASSWORD=secret \\\n  -v pgdata:/var/lib/postgresql/data \\\n  postgres:17<\/code><\/pre><p><b>5. تحقق:<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker exec -it db2 psql -U postgres -c \"SELECT * FROM notes;\"<\/code><\/pre><p>السطر <code dir=\"ltr\">survive me<\/code> موجود. الـ container تغيّر والبيانات بقيت.<\/p><p>ملاحظة: متغيرات مثل <code dir=\"ltr\">POSTGRES_PASSWORD<\/code> و <code dir=\"ltr\">POSTGRES_DB<\/code> تُطبَّق <b>فقط عند أول تهيئة<\/b> لـ volume فارغ. إذا غيّرتها لاحقاً مع volume فيه بيانات فلن يتغير شيء. هذا مصدر حيرة شائع.<\/p><p>أعد التجربة بدون <code dir=\"ltr\">-v<\/code> لترى البيانات تضيع.<\/p>", "q": {"t": "c", "q": "غيّرت <code dir=\"ltr\">POSTGRES_PASSWORD<\/code> في أمر التشغيل وأعدت إنشاء الـ container بنفس الـ volume القديم، لكن كلمة السر القديمة ما زالت هي التي تعمل. لماذا؟", "e": "الـ image الرسمية تهيّئ القاعدة فقط إذا كان مجلد البيانات فارغاً. مع volume قديم تُستخدم الإعدادات المخزنة فيه.", "o": [{"h": "Docker يخزن كلمات السر في الـ image", "c": 0}, {"h": "متغيرات التهيئة تُطبَّق عند أول إنشاء لقاعدة البيانات فقط، والـ volume يحوي قاعدة مهيأة مسبقاً", "c": 1}, {"h": "يجب إعادة تشغيل الـ daemon", "c": 0}, {"h": "الـ volume تالف", "c": 0}]}}, {"id": "m7c7", "title": "النسخ الاحتياطي والاستعادة", "html": "<p>الـ volume يحمي من حذف الـ container. لا يحمي من تلف القرص، ولا من حذف خاطئ، ولا من <code dir=\"ltr\">DROP TABLE<\/code>. لذلك تحتاج <b>backup<\/b> خارج الـ volume.<\/p><p><b>الطريقة الموصى بها لقواعد البيانات: dump منطقي<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code># backup\ndocker exec db pg_dump -U app shop &gt; backup_2026-11-14.sql\n# restore\ndocker exec -i db psql -U app -d shop &lt; backup_2026-11-14.sql<\/code><\/pre><p><code dir=\"ltr\">pg_dump<\/code> يأخذ نسخة متسقة والقاعدة تعمل. لاحظ <code dir=\"ltr\">-i<\/code> دون <code dir=\"ltr\">-t<\/code> عند الاستعادة لأننا نمرر ملفاً كمدخل.<\/p><p><b>الطريقة العامة لأي volume: أرشيف tar عبر container مساعد<\/b><\/p><pre dir=\"ltr\" data-lang=\"bash\"><code># backup\ndocker run --rm \\\n  -v media:/data:ro \\\n  -v \"$(pwd)\":/backup \\\n  alpine tar czf /backup/media.tar.gz -C /data .\n# restore\ndocker run --rm \\\n  -v media:/data \\\n  -v \"$(pwd)\":/backup \\\n  alpine tar xzf /backup/media.tar.gz -C /data<\/code><\/pre><p>الفكرة: container مؤقت يربط الـ volume ومجلداً من جهازك معاً، ويضغط الأول في الثاني.<\/p><div class=\"warn\">لا تنسخ ملفات قاعدة بيانات تعمل بطريقة tar، فقد تحصل على نسخة غير متسقة. استخدم <code dir=\"ltr\">pg_dump<\/code> أو أوقف القاعدة أولاً.<\/div><p>والنسخة التي لم تجرّب استعادتها لا يُعتمد عليها. اختبر الـ restore.<\/p>", "q": {"t": "m", "q": "ما الطريقة الآمنة لأخذ backup من PostgreSQL يعمل داخل container؟", "e": "<code dir=\"ltr\">pg_dump<\/code> ينتج نسخة متسقة أثناء العمل. نسخ ملفات القاعدة الحية قد ينتج نسخة تالفة.", "o": [{"h": "نسخ مجلد الـ volume بـ <code dir=\"ltr\">cp<\/code> والقاعدة تعمل", "c": 0}, {"h": "تنفيذ <code dir=\"ltr\">pg_dump<\/code> عبر <code dir=\"ltr\">docker exec<\/code> وحفظ الناتج في ملف على الـ host", "c": 1}, {"h": "<code dir=\"ltr\">docker commit<\/code> للـ container", "c": 0}, {"h": "<code dir=\"ltr\">docker logs db &gt; backup.sql<\/code>", "c": 0}]}}], "test": [{"t": "m", "q": "أي نوع تخزين توصي به Docker لبيانات قاعدة بيانات Production؟", "e": "الـ volume يديره Docker، مستقل عن الـ container، ولا يعتمد على مسارات الـ host.", "o": [{"h": "الـ writable layer", "c": 0}, {"h": "الـ named volume", "c": 1}, {"h": "الـ tmpfs mount", "c": 0}, {"h": "لا حاجة لتخزين خاص", "c": 0}]}, {"t": "t", "q": "الأمر <code dir=\"ltr\">docker stop<\/code> ثم <code dir=\"ltr\">docker start<\/code> يحذف الملفات المكتوبة في الـ writable layer.", "e": "الطبقة تبقى ما دام الـ container موجوداً. الحذف يحدث مع <code dir=\"ltr\">docker rm<\/code>.", "a": false}, {"t": "s", "q": "أكمل خيار الربط: لربط volume اسمه <code dir=\"ltr\">pgdata<\/code> بالمسار <code dir=\"ltr\">/var/lib/postgresql/data<\/code> نكتب <code dir=\"ltr\">-v ...<\/code>. اكتب ما بعد <code dir=\"ltr\">-v<\/code>.", "e": "الصيغة <code dir=\"ltr\">VOLUME_NAME:CONTAINER_PATH<\/code>.", "r": "^(-v )?pgdata:/var/lib/postgresql/data/?$", "m": "<code dir=\"ltr\">pgdata:/var/lib/postgresql/data<\/code>"}, {"t": "c", "q": "كيف يميّز Docker بين volume و bind mount في <code dir=\"ltr\">-v X:/app<\/code>؟", "e": "<code dir=\"ltr\">-v ./src:/app<\/code> ربط لمجلد من جهازك، و <code dir=\"ltr\">-v src:/app<\/code> هو volume اسمه <code dir=\"ltr\">src<\/code>.", "o": [{"h": "حسب المسار الثاني", "c": 0}, {"h": "إذا كان <code dir=\"ltr\">X<\/code> مساراً (يبدأ بـ <code dir=\"ltr\">/<\/code> أو <code dir=\"ltr\">.<\/code>) فهو bind mount، وإذا كان اسماً فهو volume", "c": 1}, {"h": "حسب حجم الملفات", "c": 0}, {"h": "يسأل المستخدم", "c": 0}]}, {"t": "m", "q": "أي أمر خطير على بيانات Production؟", "e": "<code dir=\"ltr\">-v<\/code> مع <code dir=\"ltr\">down<\/code> يحذف الـ volumes وبياناتها.", "o": [{"h": "<code dir=\"ltr\">docker compose ps<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker volume ls<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">docker compose down -v<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">docker volume inspect<\/code>", "c": 0}]}, {"t": "t", "q": "وجود volume يغني عن أخذ نسخ احتياطية.", "e": "الـ volume يحمي من حذف الـ container فقط. تلف القرص أو الحذف الخاطئ يحتاجان backup في مكان آخر.", "a": false}]}, {"id": "m8", "title": "Stage 5: الـ Docker Networking", "badge": "Intermediate", "dur": "3–4 أيام", "intro": "<p>الهدف: أن تفهم كيف تتحدث الـ containers مع بعضها ومع الخارج، وأين تقع الحدود بين الشبكات.<\/p>", "cs": [{"id": "m8c1", "title": "الـ Docker networks وأنواعها", "html": "<p>Docker ينشئ شبكات افتراضية على جهازك ويوصل الـ containers بها. نوع الشبكة يحدده الـ <b>driver<\/b>:<\/p><div class=\"tw\"><table><thead><tr><th>الـ driver<\/th><th>الوصف<\/th><th>متى يُستخدم<\/th><\/tr><\/thead><tbody><tr><td><code dir=\"ltr\">bridge<\/code><\/td><td>شبكة خاصة معزولة على الـ host. الافتراضي<\/td><td>أغلب الحالات<\/td><\/tr><tr><td><code dir=\"ltr\">host<\/code><\/td><td>الـ container يستخدم شبكة الـ host مباشرة دون عزل<\/td><td>حالات أداء خاصة<\/td><\/tr><tr><td><code dir=\"ltr\">none<\/code><\/td><td>بلا شبكة إطلاقاً<\/td><td>مهام معزولة تماماً<\/td><\/tr><tr><td><code dir=\"ltr\">overlay<\/code><\/td><td>شبكة تمتد على عدة أجهزة<\/td><td>الـ clusters مثل Swarm<\/td><\/tr><\/tbody><\/table><\/div><pre dir=\"ltr\" data-lang=\"bash\"><code>docker network ls\ndocker network create shopnet\ndocker network inspect shopnet\ndocker network rm shopnet<\/code><\/pre><p>بعد التثبيت تجد ثلاث شبكات جاهزة: <code dir=\"ltr\">bridge<\/code> و <code dir=\"ltr\">host<\/code> و <code dir=\"ltr\">none<\/code>. أي container تشغّله دون تحديد شبكة يوصَل بالشبكة <code dir=\"ltr\">bridge<\/code> الافتراضية.<\/p>", "q": {"t": "m", "q": "ما الـ network driver الافتراضي في Docker؟", "e": "الـ bridge هو الافتراضي: شبكة خاصة على الـ host تتصل بها الـ containers.", "o": [{"h": "<code dir=\"ltr\">host<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">bridge<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">overlay<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">none<\/code>", "c": 0}]}}, {"id": "m8c2", "title": "الـ Bridge networks: الافتراضية والمعرَّفة من المستخدم", "html": "<p><b>الـ bridge network<\/b> تشبه switch افتراضياً داخل جهازك: كل container موصول بها يأخذ IP خاصاً ويستطيع مخاطبة الباقين عليها. وتخرج الـ containers منها إلى الإنترنت عبر الـ host.<\/p><p>لكن يوجد نوعان من الـ bridge، والفرق بينهما عملي جداً:<\/p><div class=\"tw\"><table><thead><tr><th><\/th><th>الـ default bridge<\/th><th>الـ user-defined bridge<\/th><\/tr><\/thead><tbody><tr><td>كيف تُنشأ<\/td><td>موجودة تلقائياً<\/td><td><code dir=\"ltr\">docker network create NAME<\/code><\/td><\/tr><tr><td>التخاطب بالاسم (DNS)<\/td><td><b>لا<\/b>، بالـ IP فقط<\/td><td><b>نعم<\/b>، باسم الـ container<\/td><\/tr><tr><td>العزل<\/td><td>كل الـ containers غير المحددة تجتمع فيها<\/td><td>فقط من توصله أنت<\/td><\/tr><\/tbody><\/table><\/div><pre dir=\"ltr\" data-lang=\"bash\"><code>docker network create shopnet\ndocker run -d --name db --network shopnet -e POSTGRES_PASSWORD=secret postgres:17\ndocker run --rm --network shopnet alpine ping -c 2 db<\/code><\/pre><p>الأمر الأخير ينجح لأن الاسم <code dir=\"ltr\">db<\/code> يُحوَّل إلى IP تلقائياً. على الـ default bridge كان سيفشل.<\/p><p>القاعدة: أنشئ دائماً شبكة خاصة لتطبيقك. Compose يفعل ذلك تلقائياً.<\/p>", "q": {"t": "c", "q": "شغّلت <code dir=\"ltr\">web<\/code> و <code dir=\"ltr\">db<\/code> دون تحديد شبكة، فلم يستطع <code dir=\"ltr\">web<\/code> الوصول إلى <code dir=\"ltr\">db<\/code> بالاسم مع أن الاثنين يعملان. ما السبب؟", "e": "تحويل الأسماء يعمل على الـ user-defined networks فقط. الحل: <code dir=\"ltr\">docker network create<\/code> ثم وصل الاثنين بها.", "o": [{"h": "PostgreSQL لا يقبل اتصالات الشبكة", "c": 0}, {"h": "كلاهما على الـ default bridge، وهي لا توفر تحويل الأسماء بين الـ containers", "c": 1}, {"h": "لم يُنشر port قاعدة البيانات على الـ host", "c": 0}, {"h": "الاسم <code dir=\"ltr\">db<\/code> محجوز", "c": 0}]}}, {"id": "m8c3", "title": "الـ Network isolation", "html": "<p>الشبكات في Docker <b>معزولة<\/b> عن بعضها: container على الشبكة <code dir=\"ltr\">A<\/code> لا يستطيع الوصول إلى container على الشبكة <code dir=\"ltr\">B<\/code>، حتى لو كانا على نفس الجهاز.<\/p><p>هذا العزل أداة أمان. تقسّم التطبيق إلى مناطق:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>[ frontend network ]  proxy &lt;--&gt; web\n[ backend network  ]            web &lt;--&gt; db, redis<\/code><\/pre><p>هنا <code dir=\"ltr\">web<\/code> موصول بالشبكتين، و <code dir=\"ltr\">proxy<\/code> لا يرى <code dir=\"ltr\">db<\/code> أبداً. لو اختُرق الـ proxy فلن يصل منه المهاجم إلى قاعدة البيانات مباشرة.<\/p><p>يمكن وصل container بأكثر من شبكة:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker network connect backend web\ndocker network disconnect frontend web<\/code><\/pre>", "q": {"t": "t", "q": "container على الشبكة <code dir=\"ltr\">frontend<\/code> يستطيع مخاطبة container على الشبكة <code dir=\"ltr\">backend<\/code> مباشرة إذا كانا على نفس الجهاز.", "e": "الشبكات معزولة. التخاطب يتطلب أن يشترك الـ containers في شبكة واحدة على الأقل.", "a": false}}, {"id": "m8c4", "title": "التخاطب بين الـ Containers", "html": "<p>عندما يكون اثنان من الـ containers على نفس الشبكة، يتخاطبان مباشرة عبر <b>الـ port الداخلي<\/b> للخدمة، دون أي نشر (<code dir=\"ltr\">-p<\/code>).<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker network create shopnet\ndocker run -d --name redis --network shopnet redis:7\ndocker run --rm --network shopnet redis:7 redis-cli -h redis -p 6379 ping\n# PONG<\/code><\/pre><p>لاحظ: لم ننشر port 6379 على الـ host، ومع ذلك وصل الـ container الثاني إلى Redis.<\/p><p>هذه نقطة يخلطها كثيرون:<\/p><ul><li><b><code dir=\"ltr\">-p<\/code> (النشر)<\/b> للوصول من <b>خارج<\/b> Docker: من متصفحك أو من الإنترنت.<\/li><li><b>التخاطب الداخلي<\/b> بين الـ containers لا يحتاج <code dir=\"ltr\">-p<\/code> إطلاقاً، ويستخدم دائماً الـ port الذي تستمع عليه الخدمة داخل الـ container.<\/li><\/ul><p>مثال: إذا نشرت قاعدة البيانات بـ <code dir=\"ltr\">-p 5433:5432<\/code> فإن Django داخل الشبكة يتصل بـ <code dir=\"ltr\">db:5432<\/code>، وليس <code dir=\"ltr\">db:5433<\/code>. الرقم 5433 يخص الـ host فقط.<\/p>", "q": {"t": "m", "q": "<code dir=\"ltr\">db<\/code> منشور بـ <code dir=\"ltr\">-p 5433:5432<\/code>. بأي عنوان يتصل به container آخر على نفس الشبكة؟", "e": "داخل الشبكة نستخدم اسم الـ container والـ port الداخلي. الرقم 5433 للوصول من الـ host فقط.", "o": [{"h": "<code dir=\"ltr\">localhost:5433<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">db:5433<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">db:5432<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">localhost:5432<\/code>", "c": 0}]}}, {"id": "m8c5", "title": "الـ DNS داخل Docker", "html": "<p>كيف يتحول الاسم <code dir=\"ltr\">db<\/code> إلى IP؟ في كل user-defined network يشغّل Docker <b>DNS server داخلياً<\/b> (عنوانه داخل الـ container هو <code dir=\"ltr\">127.0.0.11<\/code>). عندما يسأل container عن اسم، يرد عليه الـ DNS بعنوان الـ container صاحب الاسم.<\/p><p>ما الأسماء التي تُحوَّل؟<\/p><ul><li>اسم الـ container (<code dir=\"ltr\">--name db<\/code>).<\/li><li>أسماء إضافية تعطيها بـ <code dir=\"ltr\">--network-alias<\/code>.<\/li><li>في Compose: <b>اسم الـ service<\/b>.<\/li><\/ul><p>لماذا الاسم وليس الـ IP؟ لأن الـ IP يُعطى عند إنشاء الـ container وقد يتغير عند إعادة إنشائه. الاسم ثابت.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker run --rm --network shopnet alpine nslookup db<\/code><\/pre><p>والأسماء الخارجية مثل <code dir=\"ltr\">pypi.org<\/code> يحوّلها الـ DNS الداخلي إلى إعدادات DNS الخاصة بالـ host، فيعمل الإنترنت داخل الـ container كالمعتاد.<\/p>", "q": {"t": "m", "q": "في مشروع Compose، بأي اسم يصل Django إلى قاعدة البيانات المعرّفة كـ service اسمها <code dir=\"ltr\">postgres<\/code>؟", "e": "الـ DNS الداخلي يحوّل اسم الـ service إلى عنوانها الحالي، فتكون <code dir=\"ltr\">DB_HOST=postgres<\/code>.", "o": [{"h": "<code dir=\"ltr\">localhost<\/code>", "c": 0}, {"h": "الـ IP الذي يظهر في <code dir=\"ltr\">docker inspect<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">postgres<\/code>", "c": 1}, {"h": "اسم الـ image", "c": 0}]}}, {"id": "m8c6", "title": "لماذا لا نستخدم localhost بين الـ Containers؟", "html": "<p>لكل container <b>network namespace<\/b> خاص، أي واجهة loopback خاصة. فـ <code dir=\"ltr\">localhost<\/code> داخل container الـ Django يعني «container الـ Django نفسه»، ولا يعني جهازك ولا container قاعدة البيانات.<\/p><pre dir=\"ltr\" data-lang=\"python\"><code># خطأ: يبحث عن PostgreSQL داخل container الـ Django نفسه\n\"HOST\": \"localhost\"\n\n# صحيح: اسم الـ service أو الـ container\n\"HOST\": \"db\"<\/code><\/pre><p>الخطأ الذي ستراه: <code dir=\"ltr\">connection refused<\/code> على <code dir=\"ltr\">127.0.0.1:5432<\/code>.<\/p><p>لماذا كان <code dir=\"ltr\">localhost<\/code> يعمل قبل Docker؟ لأن Django و PostgreSQL كانا يعملان كـ processes على نفس الجهاز ويتشاركان نفس الشبكة. مع Docker كل منهما في «جهاز» شبكي مستقل.<\/p><p>حالة خاصة: إذا أراد container الوصول إلى خدمة تعمل على <b>الـ host<\/b> نفسه، يوفر Docker Desktop الاسم <code dir=\"ltr\">host.docker.internal<\/code>.<\/p>", "q": {"t": "c", "q": "Django في container و PostgreSQL في container آخر على نفس الشبكة. الإعداد <code dir=\"ltr\">DB_HOST=localhost<\/code> يعطي <code dir=\"ltr\">connection refused<\/code>. لماذا؟", "e": "لكل container الـ loopback الخاص به. العنوان الصحيح هو اسم container أو service قاعدة البيانات.", "o": [{"h": "PostgreSQL لم يُنشر بـ <code dir=\"ltr\">-p<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">localhost<\/code> داخل container الـ Django يشير إليه نفسه، ولا يوجد PostgreSQL هناك", "c": 1}, {"h": "كلمة السر خاطئة", "c": 0}, {"h": "الشبكة معطلة", "c": 0}]}}, {"id": "m8c7", "title": "الـ Port mapping بعمق", "html": "<p>الـ port mapping هو الجسر بين الـ host وشبكة الـ containers المعزولة. صيغه:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>-p 8000:8000              # كل واجهات الـ host\n-p 127.0.0.1:5432:5432    # من الـ host نفسه فقط\n-p 8000                   # port عشوائي على الـ host\n-p 53:53/udp              # بروتوكول UDP<\/code><\/pre><p><code dir=\"ltr\">docker port web<\/code> يعرض الـ mappings الفعلية لـ container.<\/p><p>قواعد Production:<\/p><ul><li>انشر <b>فقط<\/b> ما يجب أن يصل إليه الخارج: غالباً 80 و 443 للـ reverse proxy.<\/li><li>قاعدة البيانات و Redis لا يُنشران. الـ containers تصل إليهما عبر الشبكة الداخلية.<\/li><li>إذا احتجت الوصول لقاعدة البيانات من جهاز السيرفر للصيانة، اربطها بـ <code dir=\"ltr\">127.0.0.1<\/code> فقط.<\/li><\/ul><div class=\"warn\">على Linux، Docker يضيف قواعده مباشرة إلى iptables، فالـ ports المنشورة تتجاوز جدران حماية مثل <code dir=\"ltr\">ufw<\/code>. قد تمنع 5432 في <code dir=\"ltr\">ufw<\/code> ويبقى مفتوحاً للإنترنت لأنك كتبت <code dir=\"ltr\">-p 5432:5432<\/code>. الحماية الحقيقية: لا تنشره، أو اربطه بـ <code dir=\"ltr\">127.0.0.1<\/code>.<\/div>", "q": {"t": "m", "q": "أي صيغة تجعل PostgreSQL متاحاً من جهاز السيرفر نفسه فقط وليس من الإنترنت؟", "e": "تحديد <code dir=\"ltr\">127.0.0.1<\/code> كعنوان الربط يحصر الوصول في الـ host نفسه.", "o": [{"h": "<code dir=\"ltr\">-p 5432:5432<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">-p 0.0.0.0:5432:5432<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">-p 127.0.0.1:5432:5432<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">-p 5432<\/code>", "c": 0}]}}, {"id": "m8c8", "title": "الشبكات الداخلية والخارجية", "html": "<p>ثلاثة مستويات للوصول:<\/p><ol><li><b>منشور (published)<\/b>: port مربوط بالـ host، يصل إليه العالم الخارجي.<\/li><li><b>داخلي فقط<\/b>: container على شبكة دون نشر. تصل إليه الـ containers على نفس الشبكة، وهو يستطيع الخروج إلى الإنترنت.<\/li><li><b>شبكة <code dir=\"ltr\">internal<\/code><\/b>: شبكة معزولة تماماً، لا دخول إليها من الخارج ولا خروج منها إلى الإنترنت.<\/li><\/ol><pre dir=\"ltr\" data-lang=\"bash\"><code>docker network create --internal backend<\/code><\/pre><p>في Compose:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>networks:\n  frontend:\n  backend:\n    internal: true<\/code><\/pre><p>تصميم شائع: الـ reverse proxy على <code dir=\"ltr\">frontend<\/code> وله ports منشورة، الـ backend على الشبكتين، وقاعدة البيانات و Redis على <code dir=\"ltr\">backend<\/code> الداخلية فقط. بهذا لا يصل أي طلب من الإنترنت إلى قاعدة البيانات، ولا تستطيع هي الاتصال بالخارج.<\/p><p>ملاحظة عن مصطلح آخر في Compose: <code dir=\"ltr\">external: true<\/code> لشبكة أو volume يعني أنها أُنشئت <b>خارج<\/b> ملف Compose هذا، و Compose يستخدمها ولا ينشئها ولا يحذفها. هذا معنى مختلف عن «الوصول الخارجي».<\/p>", "q": {"t": "m", "q": "ما الذي يميز شبكة أُنشئت بالخيار <code dir=\"ltr\">--internal<\/code>؟", "e": "الشبكة الداخلية تعزل الخدمات الحساسة مثل قواعد البيانات عن أي اتصال خارجي.", "o": [{"h": "أسرع من غيرها", "c": 0}, {"h": "لا اتصال بينها وبين الخارج: لا نشر إليها ولا خروج منها إلى الإنترنت", "c": 1}, {"h": "لا تدعم DNS", "c": 0}, {"h": "تُحذف تلقائياً", "c": 0}]}}, {"id": "m8c9", "title": "الـ Reverse proxies", "html": "<p><b>الـ reverse proxy<\/b> خادم يقف في الواجهة، يستقبل كل الطلبات القادمة من الإنترنت، ثم يوزعها على الخدمات الداخلية حسب النطاق أو المسار.<\/p><pre dir=\"ltr\" data-lang=\"\"><code>Internet --&gt; :443 Caddy --+-- /api/*  --&gt; web:8000\n                          +-- /*      --&gt; React static files<\/code><\/pre><p>لماذا نحتاجه؟<\/p><ul><li><b>نقطة دخول واحدة<\/b>: تنشر 80 و 443 فقط، وكل شيء آخر يبقى داخلياً.<\/li><li><b>HTTPS<\/b>: يتولى الشهادات والتشفير، فلا ينشغل Django بذلك.<\/li><li><b>التوجيه<\/b>: عدة خدمات خلف نطاق واحد.<\/li><li><b>الملفات الثابتة<\/b>: يقدّمها بكفاءة أعلى من Django.<\/li><\/ul><p>أشهر الخيارات: <b>Nginx<\/b> و <b>Caddy<\/b> و <b>Traefik<\/b>. ميزة Caddy أنه يحصل على شهادات HTTPS ويجددها تلقائياً. مثال <code dir=\"ltr\">Caddyfile<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"\"><code>example.com {\n    handle /api/* {\n        reverse_proxy web:8000\n    }\n    handle {\n        root * /srv\n        try_files {path} /index.html\n        file_server\n    }\n}<\/code><\/pre><p>لاحظ <code dir=\"ltr\">web:8000<\/code>: Caddy يصل إلى Django باسم الـ service عبر الشبكة الداخلية.<\/p><p>اسمه «reverse» لأنه يمثّل الـ servers أمام الـ clients، عكس الـ proxy العادي الذي يمثّل الـ clients.<\/p>", "q": {"t": "m", "q": "في تطبيق خلف reverse proxy، أي الخدمات تُنشر ports لها على الـ host؟", "e": "الـ proxy هو نقطة الدخول الوحيدة، ويصل إلى البقية عبر الشبكة الداخلية.", "o": [{"h": "كل الخدمات", "c": 0}, {"h": "Django وقاعدة البيانات", "c": 0}, {"h": "الـ reverse proxy فقط (80 و 443)", "c": 1}, {"h": "لا شيء", "c": 0}]}}, {"id": "m8c10", "title": "التجربة العملية: Django و PostgreSQL و Redis على شبكة واحدة", "html": "<p>نفّذها يدوياً مرة واحدة لتقدّر ما يفعله Compose عنك لاحقاً.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker network create shopnet\n\ndocker run -d --name db --network shopnet \\\n  -e POSTGRES_DB=shop -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret \\\n  -v pgdata:/var/lib/postgresql/data \\\n  postgres:17\n\ndocker run -d --name redis --network shopnet redis:7\n\ndocker run -d --name web --network shopnet -p 8000:8000 \\\n  -e DB_HOST=db -e DB_NAME=shop -e DB_USER=app -e DB_PASSWORD=secret \\\n  -e REDIS_URL=redis://redis:6379/0 \\\n  shop-api:0.1<\/code><\/pre><p>تحقق:<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker network inspect shopnet        # الثلاثة موصولون؟\ndocker exec web python manage.py migrate\ncurl -i http://localhost:8000/\ndocker logs web<\/code><\/pre><p>راجع ما حدث:<\/p><ul><li><code dir=\"ltr\">web<\/code> فقط له port منشور.<\/li><li><code dir=\"ltr\">db<\/code> و <code dir=\"ltr\">redis<\/code> يُوصَل إليهما بالاسم عبر الشبكة.<\/li><li>بيانات PostgreSQL في volume.<\/li><\/ul><p>والآن عدّ: شبكة، volume، ثلاثة أوامر طويلة، وترتيب تشغيل يجب أن تتذكره. هذا ما يحله Compose.<\/p>", "q": {"t": "c", "q": "في التجربة أعلاه، لو غيّرت <code dir=\"ltr\">-e DB_HOST=db<\/code> إلى <code dir=\"ltr\">-e DB_HOST=127.0.0.1<\/code> ماذا يحدث؟", "e": "<code dir=\"ltr\">127.0.0.1<\/code> يشير إلى container الـ <code dir=\"ltr\">web<\/code> نفسه. الوصول إلى PostgreSQL يكون بالاسم <code dir=\"ltr\">db<\/code>.", "o": [{"h": "يعمل لأن الجميع على نفس الجهاز", "c": 0}, {"h": "يفشل الاتصال بقاعدة البيانات لأن <code dir=\"ltr\">127.0.0.1<\/code> داخل <code dir=\"ltr\">web<\/code> لا يوجد عليه PostgreSQL", "c": 1}, {"h": "يعمل لكن أبطأ", "c": 0}, {"h": "يتصل بقاعدة بيانات فارغة", "c": 0}]}}], "test": [{"t": "m", "q": "ما المطلوب ليتخاطب اثنان من الـ containers بالاسم؟", "e": "الـ DNS الداخلي يعمل داخل الـ user-defined networks.", "o": [{"h": "نشر ports الاثنين على الـ host", "c": 0}, {"h": "أن يكونا على نفس الـ user-defined network", "c": 1}, {"h": "أن يكونا من نفس الـ image", "c": 0}, {"h": "استخدام الـ driver <code dir=\"ltr\">host<\/code>", "c": 0}]}, {"t": "t", "q": "التخاطب بين containers على نفس الشبكة يتطلب نشر الـ port بـ <code dir=\"ltr\">-p<\/code>.", "e": "النشر للوصول من خارج Docker فقط. داخل الشبكة يكفي الاسم والـ port الداخلي.", "a": false}, {"t": "s", "q": "اكتب الأمر الذي ينشئ شبكة اسمها <code dir=\"ltr\">appnet<\/code>.", "e": "<code dir=\"ltr\">docker network create NAME<\/code> ينشئ user-defined bridge network.", "r": "^docker network create appnet$", "m": "<code dir=\"ltr\">docker network create appnet<\/code>"}, {"t": "c", "q": "سيرفر Production عليه <code dir=\"ltr\">ufw<\/code> يمنع port 6379، ومع ذلك وجدت Redis مكشوفاً للإنترنت. الـ container شُغِّل بـ <code dir=\"ltr\">-p 6379:6379<\/code>. ما التفسير؟", "e": "لهذا لا ننشر الخدمات الداخلية أصلاً، أو نربطها بـ <code dir=\"ltr\">127.0.0.1<\/code>.", "o": [{"h": "<code dir=\"ltr\">ufw<\/code> معطل دائماً مع Docker", "c": 0}, {"h": "Docker يضيف قواعد iptables مباشرة فتتجاوز الـ ports المنشورة قواعد <code dir=\"ltr\">ufw<\/code>", "c": 1}, {"h": "Redis يتجاهل جدران الحماية", "c": 0}, {"h": "الـ port الصحيح لـ Redis ليس 6379", "c": 0}]}, {"t": "m", "q": "ما وظيفة الـ reverse proxy؟", "e": "هو نقطة الدخول الموحدة للتطبيق.", "o": [{"h": "تخزين بيانات التطبيق", "c": 0}, {"h": "استقبال الطلبات الخارجية وتوزيعها على الخدمات الداخلية مع تولي HTTPS", "c": 1}, {"h": "بناء الـ images", "c": 0}, {"h": "مراقبة استهلاك الذاكرة", "c": 0}]}, {"t": "m", "q": "لماذا نفضّل الاسم على الـ IP عند ربط الخدمات؟", "e": "الـ DNS الداخلي يحدّث العنوان تلقائياً ويبقى الاسم كما هو.", "o": [{"h": "لأن الـ IP أبطأ", "c": 0}, {"h": "لأن IP الـ container قد يتغير عند إعادة إنشائه، والاسم ثابت", "c": 1}, {"h": "لأن Docker لا يعطي IP للـ containers", "c": 0}, {"h": "لأن الاسم يشفّر الاتصال", "c": 0}]}]}, {"id": "m9", "title": "Stage 6: الـ Docker Compose", "badge": "Intermediate", "dur": "5–6 أيام", "intro": "<p>سبق أن استخدمت Compose في مشاريعك. الهدف الآن أن تفهم كل سطر في <code dir=\"ltr\">compose.yaml<\/code>: ماذا يقابله من أوامر Docker التي تعلمتها، ولماذا يُكتب.<\/p>", "cs": [{"id": "m9c1", "title": "ما المشكلة التي يحلها Compose؟", "html": "<p>في نهاية Stage 5 شغّلت ثلاث خدمات بأوامر طويلة يجب أن تتذكرها وترتبها. <b>Docker Compose<\/b> يحل ذلك: تصف التطبيق كله (الخدمات والشبكات والـ volumes والإعدادات) في <b>ملف واحد<\/b>، ثم تديره بأمر واحد.<\/p><pre dir=\"ltr\" data-lang=\"bash\"><code>docker compose up -d     # شغّل كل شيء\ndocker compose down      # أوقف واحذف الـ containers والشبكة<\/code><\/pre><p>ما تكسبه:<\/p><ul><li><b>التصريح بدل الأوامر<\/b>: تكتب الحالة التي تريدها، و Compose يوصلك إليها.<\/li><li><b>قابلية التكرار<\/b>: الملف في Git، وأي زميل يشغّل المشروع بأمر واحد.<\/li><li><b>شبكة تلقائية<\/b>: كل الخدمات على شبكة خاصة تتخاطب فيها بالأسماء.<\/li><li><b>إدارة موحدة<\/b>: logs وحالة كل الخدمات معاً.<\/li><\/ul><p>معلومتان لتصحيح ما تجده في المصادر القديمة:<\/p><ul><li>الأمر الحالي <code dir=\"ltr\">docker compose<\/code> (بمسافة) وهو جزء من Docker CLI. الأمر القديم <code dir=\"ltr\">docker-compose<\/code> (بشرطة) هو النسخة الأولى المتوقفة.<\/li><li>حقل <code dir=\"ltr\">version: \"3.8\"<\/code> في أول الملف لم يعد مطلوباً، و Compose يتجاهله مع تحذير. لا تكتبه.<\/li><\/ul><p>Compose مصمم لجهاز واحد. إدارة containers على عدة أجهزة مهمة أدوات مثل Kubernetes.<\/p>", "q": {"t": "m", "q": "أي عبارة صحيحة عن Compose الحالي؟", "e": "Compose الحالي جزء من Docker CLI، وحقل <code dir=\"ltr\">version<\/code> متروك، وهو يعمل على host واحد.", "o": [{"h": "يجب أن يبدأ الملف بـ <code dir=\"ltr\">version: \"3.8\"<\/code>", "c": 0}, {"h": "الأمر الصحيح هو <code dir=\"ltr\">docker-compose<\/code> بشرطة", "c": 0}, {"h": "الأمر هو <code dir=\"ltr\">docker compose<\/code> وحقل <code dir=\"ltr\">version<\/code> لم يعد مطلوباً", "c": 1}, {"h": "Compose يوزع الـ containers على عدة سيرفرات تلقائياً", "c": 0}]}}, {"id": "m9c2", "title": "بنية الملف compose.yaml", "html": "<p>الاسم الموصى به <code dir=\"ltr\">compose.yaml<\/code> (ويُقبل <code dir=\"ltr\">docker-compose.yml<\/code> القديم). يتكون من أقسام رئيسية في أعلى مستوى:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>name: shop            # اسم المشروع (اختياري)\n\nservices:             # الـ containers التي تشكّل التطبيق\n  web:\n    build: .\n    ports:\n      - \"8000:8000\"\n  db:\n    image: postgres:17\n\nvolumes:              # الـ named volumes\n  pgdata:\n\nnetworks:             # الشبكات (اختياري)\n  backend:<\/code><\/pre><ul><li><code dir=\"ltr\">services<\/code>: القسم الإلزامي. كل مفتاح تحته خدمة.<\/li><li><code dir=\"ltr\">volumes<\/code>: تصريح بالـ named volumes المستخدمة.<\/li><li><code dir=\"ltr\">networks<\/code>: شبكات إضافية غير الافتراضية.<\/li><\/ul><p><b>اسم المشروع<\/b> يُستخدم بادئة لكل ما ينشئه Compose: الـ container يصبح <code dir=\"ltr\">shop-web-1<\/code>، والشبكة <code dir=\"ltr\">shop_default<\/code>، والـ volume <code dir=\"ltr\">shop_pgdata<\/code>. إذا لم تحدده فهو اسم المجلد الذي فيه الملف. لذلك مشروعان في مجلدين مختلفين لا يتصادمان.<\/p>", "q": {"t": "m", "q": "ما القسم الإلزامي في <code dir=\"ltr\">compose.yaml<\/code>؟", "e": "<code dir=\"ltr\">services<\/code> يعرّف الـ containers. بقية الأقسام اختيارية حسب الحاجة.", "o": [{"h": "<code dir=\"ltr\">volumes<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">networks<\/code>", "c": 0}, {"h": "<code dir=\"ltr\">services<\/code>", "c": 1}, {"h": "<code dir=\"ltr\">name<\/code>", "c": 0}]}}, {"id": "m9c3", "title": "الـ Services", "html": "<p><b>الـ service<\/b> وصف لـ container (أو لعدة نسخ منه): من أي image، وبأي إعدادات. كل خيار يقابل خياراً في <code dir=\"ltr\">docker run<\/code>:<\/p><pre dir=\"ltr\" data-lang=\"yaml\"><code>services:\n  web:\n    build: .                      # docker build\n    image: shop-api:dev           # اسم الـ image الناتجة\n    command: python manage.py runserver 0.0.0.0:8000   # يستبدل CMD\n    ports:\n      - \"8000:8000\"               # -p\n    environment:\n      DB_HOST: db                 # -e\n    volumes:\n      - .:/app                    # -v\n  db:\n    image: postgres:17            # image جاهزة<\/code><\/pre><p><code dir=\"ltr\">image<\/code> مقابل <code dir=\"ltr\">build<\/code>:<\/p><ul><li><code dir=\"ltr\">image<\/code> فقط: تُسحب image جاهزة.<\/li><li><code dir=\"ltr\">build<\/code> فقط: تُبنى من Dockerfile.<\/li><li>كلاهما: تُبنى ثم تُسمى بالاسم ال
