C("Replace Inheritance with Composition",R`
(يسمّيها Fowler: <b>Replace Superclass with Delegate</b>.) حين يرث class من آخر لإعادة استخدام كوده فقط، أو يخالف LSP، أو يكشف methods لا تناسبه: حوّل الأب إلى field وفوّض إليه.
@@
// before: Stack يرث 30 method من ArrayList، منها ما يكسر LIFO
class Stack<T> extends ArrayList<T> {
    void push(T x) { add(x); }
    T pop() { return remove(size() - 1); }
}
// after
class Stack<T> {
    private final List<T> items = new ArrayList<>();       // 1) field
    void push(T x) { items.add(x); }                        // 2) delegation
    T pop() { return items.remove(items.size() - 1); }
    boolean isEmpty() { return items.isEmpty(); }           // 3) اكشف ما يلزم فقط
}
@@
الخطوات: (1) أنشئ field من نوع الأب، (2) حوّل كل استخدام لـ method موروثة إلى استدعاء على الـ field، (3) أزل <code>extends</code>، (4) أضف methods تفويض لما يحتاجه المستخدمون فقط.

النتيجة: واجهة أضيق، encapsulation أقوى، وإمكان تبديل التنفيذ الداخلي.

C("Remove Duplicate Code و Replace Magic Numbers with Named Constants",R`
<b>Remove Duplicate Code</b> ليست تقنية واحدة بل هدف يُحقَّق بتقنيات حسب مكان التكرار:
- في class واحد ← <b>Extract Method</b>.
- في classين شقيقين ← Extract Method ثم <b>Pull Up Method</b> إلى الأب.
- هيكل متشابه بخطوات مختلفة ← <b>Form Template Method</b>.
- في classes غير مترابطة ← <b>Extract Class</b> أو دالة مشتركة.

تذكّر تنبيه DRY: أزل تكرار <b>المعرفة</b>، لا التشابه العَرَضي.

<b>Replace Magic Number with Named Constant</b> — <b>Magic number</b>: قيمة حرفية في الكود بلا تفسير.
@@
// before

if (status == 3) { }
// after
static final int MIN_PASSWORD_LENGTH = 8;
static final double VAT_RATE = 0.19;
if (password.length() < MIN_PASSWORD_LENGTH) { }
double total = subtotal * (1 + VAT_RATE);
if (status == OrderStatus.SHIPPED) { }           // enum بدل رقم
@@

يشمل ذلك <b>magic strings</b> أيضاً. استثناءات معقولة: 0 و 1 في سياقات بديهية.

خذ تطبيقاً قائماً ونفّذ:
- 1. <b>حدّد الـ code smells</b> وسمِّها بأسمائها القياسية.
- 2. <b>اشرح لماذا كل منها مشكلة</b>: ما التغيير الذي سيصبح مؤلماً؟
- 3. <b>حدّد المبادئ المخالَفة</b> (SRP؟ OCP؟ Demeter؟).
- 4. <b>اكتب اختبارات تثبّت السلوك الحالي</b> — <b>قبل</b> أي تعديل. تُسمّى <b>characterization tests</b>: لا تتحقق من أن السلوك «صحيح»، بل تسجّل ما يفعله الكود <b>الآن</b>.
- 5. <b>اختر تقنية الـ refactoring</b> المناسبة.
- 6. <b>طبّقها بخطوات صغيرة</b>، وشغّل الاختبارات بعد كل خطوة.
- 7. <b>حدّث رسوم UML</b> إن تغيّرت البنية.

C("Explore the Structure, Main Classes, and Responsibilities",R`
أول خطأ في إعادة التصميم: البدء بالتعديل قبل الفهم. ابدأ بالقراءة:

<b>Explore the project structure:</b> ما المجلدات والـ packages؟ هل تعكس طبقات (ui، domain، data) أم ميزات (orders، users)؟ أين نقطة الدخول؟ ما الـ dependencies الخارجية؟

<b>Identify the main classes:</b> لا تقرأ كل شيء. ابحث عن: الأكبر حجماً، الأكثر استيراداً من غيره، والأكثر تعديلاً في تاريخ git (<code>git log</code> يكشف «النقاط الساخنة»). هذه الثلاثة تتقاطع غالباً عند الـ classes المشكلة.

<b>Understand class responsibilities:</b> لكل class رئيسي اكتب <b>جملة واحدة</b>: «هذا الـ class مسؤول عن ...». أداة مفيدة: <b>CRC card</b> (Class – Responsibilities – Collaborators): بطاقة فيها اسم الـ class، ما يفعله، ومن يتعاون معهم.

إن لم تستطع كتابة الجملة دون «و... و...» فقد وجدت أول مشكلة تصميم.

<b>Identify object relationships:</b> لكل زوج من الـ classes الرئيسية: inheritance؟ composition؟ association؟ مجرد dependency؟ وهل العلاقة باتجاه واحد أم دائرية؟

C("Coupling, Responsibilities, and Conditional Logic",R`
ثلاثة فحوص أولى، كل منها يستخدم ما تعلّمته:

<b>Detect tightly coupled components:</b>
- <code>new ConcreteClass()</code> داخل منطق العمل.
- استدعاءات static و singletons.
- classes لا يمكن إنشاؤها في اختبار دون قاعدة بيانات أو شبكة.
- اعتمادات دائرية.
- اختبار ذهني: «إن غيّرت هذا الـ class، كم ملفاً سيتأثر؟»

<b>Find classes with multiple responsibilities:</b> الـ classes التي عجزت عن وصفها بجملة واحدة في 4.1. علاماتها: Large Class، Divergent Change، أسماء مثل Manager و Util.

<b>Identify complex conditional logic:</b>
- switch أو if/else على <b>النوع</b> مكرر ← مرشّح Strategy أو polymorphism.
- switch على <b>الحالة</b> في methods كثيرة ← مرشّح State.
- شروط متداخلة بعمق ← Extract Method و guard clauses (الخروج المبكر من الدالة بدل التداخل).

لكل مشكلة تجدها سجّل: <b>أين</b> (الملف والـ method)، <b>ما</b> (اسم الـ smell)، و<b>ما الضرر</b> (أي تغيير تجعله مؤلماً).

C("Duplicate Code, Inappropriate Inheritance, SOLID Violations, and Other Smells",R`
<b>Detect duplicate code:</b> ابحث يدوياً وبالأدوات (IDEs وأدوات مثل PMD-CPD و SonarQube تكشف المقاطع المتكررة). وانتبه للتكرار غير الحرفي: منطق واحد بصياغات مختلفة.

<b>Identify inappropriate inheritance:</b>
- وراثة لإعادة استخدام الكود فقط دون علاقة is-a.
- subclasses ترمي exceptions أو تترك methods فارغة (مخالفة LSP).
- هرم عميق (أكثر من 3 مستويات).
- subclass يستخدم جزءاً صغيراً من الأب (<b>Refused Bequest</b>).

<b>Identify violations of SOLID:</b> مرّ على الحروف الخمسة كقائمة فحص:
- <b>S</b>: كم سبباً للتغيير؟
- <b>O</b>: هل إضافة نوع جديد تتطلب تعديل كود قائم؟
- <b>L</b>: هل يصلح كل ابن بديلاً عن أبيه؟
- <b>I</b>: هل توجد methods مطبَّقة وهمياً؟
- <b>D</b>: هل يعتمد منطق العمل على تفاصيل ملموسة؟

C("Unit Testing and Testing Individual Components",R`
<b>Test</b> آلي: كود يشغّل كوداً آخر ويتحقق من نتيجته تلقائياً.

<b>Unit test</b>: يختبر <b>وحدة صغيرة</b> (method أو class) <b>بمعزل</b> عن قاعدة البيانات والشبكة والملفات. سريع (أجزاء من الثانية) فتشغّل المئات منه مع كل تعديل.

البنية القياسية <b>AAA</b>: Arrange (جهّز) ← Act (نفّذ) ← Assert (تحقق).
@@
@Test
void percentageDiscountReducesTotal() {
    Order order = new Order();                                   // Arrange
    order.addLine("book", 2, 5000);
    order.applyDiscount(new PercentageDiscount(10));

    long total = order.totalCents();                             // Act

    assertEquals(9000, total);                                   // Assert
}
@@
<b>Testing individual components</b> يتطلب أن تكون قابلة للعزل. وهنا يلتقي التصميم بالاختبار: الـ class الذي يستلم تبعياته (DI) ويعتمد على interfaces يُختبر بسهولة ببدائل وهمية؛ والـ class الذي ينشئ قاعدة بياناته بنفسه لا يُختبر كوحدة أصلاً.

صعوبة كتابة unit test لـ class هي <b>بحد ذاتها</b> مؤشر على مشكلة تصميم.
`,mc("ما الذي يميّز الـ unit test؟",["يختبر النظام كله من الواجهة","يختبر وحدة صغيرة بمعزل عن الأنظمة الخارجية ويعمل بسرعة","يتطلب قاعدة بيانات حقيقية","يُكتب مرة واحدة ولا يُشغَّل ثانية"],1,"العزل والسرعة هما السمتان؛ بهما يصلح للتشغيل المستمر أثناء الـ refactoring."));
C("Integration Testing and Testing Object Interactions",R`
<b>Integration test</b>: يتحقق من أن عدة مكوّنات <b>تعمل معاً</b> فعلاً: الـ service مع قاعدة بيانات حقيقية (أو نسخة اختبار)، الـ adapter مع الـ API الفعلي أو محاكٍ له. أبطأ من الـ unit test لكنه يكشف ما لا يكشفه: أخطاء الربط، الاستعلامات، التهيئة.

التوازن الشائع — <b>test pyramid</b>: قاعدة عريضة من unit tests، وسط أقل من integration tests، وقمة صغيرة من end-to-end tests.

<b>Testing object interactions</b> — نوعان من التحقق:
- <b>State verification</b>: نفّذ ثم افحص <b>النتيجة</b> أو الحالة. (المفضّل حين يمكن.)
- <b>Behavior verification</b>: تحقق من أن الكائن <b>استدعى</b> متعاونيه كما يجب — مهم للـ patterns السلوكية.
@@
@Test
void creatingOrderNotifiesObservers() {
    List<Order> received = new ArrayList<>();
    OrderService svc = new OrderService(new InMemoryOrderStore());
    svc.subscribe(received::add);                    // observer وهمي يسجّل ما وصله

    Order o = svc.createOrder("c1");

    assertEquals(List.of(o), received);              // تحقق من التفاعل
}
@@
لكل pattern اختباره الطبيعي: Strategy ← كل strategy وحدها؛ State ← كل انتقال مسموح وممنوع؛ Command ← execute ثم undo يعيد الحالة؛ Chain ← الترتيب والقطع.
`,tf("الـ integration tests تغني عن الـ unit tests لأنها تختبر أكثر.",false,"هي أبطأ وأصعب تشخيصاً عند الفشل. النوعان متكاملان: unit tests كثيرة سريعة للمنطق، و integration tests أقل للربط بين المكوّنات."));
C("Regression Testing and Validating Refactored Behavior",R`
<b>Regression</b>: ميزة كانت تعمل ثم انكسرت بعد تعديل. <b>Regression testing</b>: إعادة تشغيل الاختبارات القائمة بعد كل تغيير للتأكد أن شيئاً لم ينكسر. الأتمتة تجعل ذلك شبه مجاني.

في إعادة التصميم، السؤال: الكود القديم بلا اختبارات، فكيف نتأكد أن السلوك لم يتغير؟

<b>Characterization tests</b> (تُسمّى أيضاً golden master): اختبارات تسجّل ما يفعله الكود <b>الآن</b>، صحيحاً كان أم خاطئاً:
- 1. استدعِ الكود بمدخلات متنوعة.
- 2. سجّل المخرجات الفعلية.
- 3. اجعلها هي القيم المتوقعة في الاختبار.

الآن لديك شبكة أمان. دورة العمل:
@@t
 tests green -> small refactoring step -> run tests
       ^                                     |
       |            green: commit            |
       +-------------------------------------+
                    red: undo the step
@@
<b>Validating refactored behavior:</b> بعد الانتهاء، كل الـ characterization tests يجب أن تنجح <b>دون تعديلها</b>. إن اضطررت إلى تعديل اختبار فإما أنك غيّرت سلوكاً (ليس refactoring)، أو أن الاختبار كان مرتبطاً بالبنية الداخلية لا بالسلوك.

ومعضلة شائعة: الكود غير قابل للاختبار قبل تعديله! الحل: أصغر تعديل آمن ممكن لفتح «<b>seam</b>» (نقطة يمكن عندها تبديل سلوك دون تعديل الموضع نفسه)، مثل استخراج إنشاء التبعية إلى parameter.
`,mc("ما وظيفة الـ characterization test؟",["التحقق من أن الكود يطابق المواصفات المثالية","تسجيل السلوك الحالي الفعلي للكود ليكون مرجعاً أثناء إعادة الهيكلة","قياس الأداء","توليد التوثيق"],1,"يصف ما يفعله الكود الآن، فيكشف أي انحراف غير مقصود بعد التعديل."));

C("Implement the Command Pattern",R`
في الـ capstone الأصلي يُطلب Command لأن التطبيق فيه عمليات مستخدم يجب تسجيلها والتراجع عنها. المنهج العام لإدخاله في كود قائم:

- 1. <b>حدّد العمليات</b>: كل فعل يغيّر الحالة يبدؤه المستخدم (إضافة عنصر، حذف، تعديل).
- 2. <b>عرّف الواجهة</b>: <code>execute()</code>، و <code>undo()</code> إن لزم.
- 3. <b>استخرج عملية واحدة</b>: انقل كود الـ handler الحالي إلى ConcreteCommand. الـ receiver هو الـ model أو الـ service الذي كان يُستدعى.
- 4. <b>أدخل الـ Invoker</b>: كائن ينفّذ الأوامر ويحتفظ بالتاريخ.
- 5. <b>كرّر</b> لبقية العمليات واحدة واحدة، مع تشغيل الاختبارات.
@@
// before: المنطق داخل معالج الحدث
void onDeleteClicked(Item item) { items.remove(item); db.delete(item.id()); refresh(); }

// after
void onDeleteClicked(Item item) { invoker.run(new DeleteItemCommand(inventory, item)); }

class DeleteItemCommand implements Command {
    private final Inventory inventory; private final Item item;
    DeleteItemCommand(Inventory inv, Item item) { inventory = inv; this.item = item; }
    public void execute() { inventory.remove(item); }
    public void undo()    { inventory.add(item); }
}
@@
المكسب الجانبي: معالجات الأحداث صارت سطراً واحداً، والمنطق خرج من طبقة الواجهة.

C("Implement the MVC Pattern",R`
تحويل كود مخلوط إلى MVC يتم <b>من الداخل إلى الخارج</b>:

- 1. <b>استخرج الـ Model أولاً</b>: انقل البيانات وقواعد العمل من classes الواجهة إلى classes لا تستورد شيئاً من مكتبة الواجهة. هذه أهم خطوة؛ بعدها يمكن اختبار المنطق بـ unit tests.
- 2. <b>اجعل الـ Model قابلاً للمراقبة</b> (Observer) إن كانت الواجهة يجب أن تتحدث تلقائياً.
- 3. <b>استخرج الـ Controller</b>: انقل معالجة أفعال المستخدم (قراءة المدخلات، استدعاء الـ Model) من الـ View.
- 4. <b>بسّط الـ View</b>: يبقى فيه العرض وتحويل الأحداث إلى الـ Controller فقط.

اختبار النجاح: هل تستطيع حذف كل كود الواجهة واستبداله بواجهة سطر أوامر دون لمس الـ Model؟

لاحظ كيف يجتمع الـ patternان: الـ Controller ينشئ <b>Commands</b> تعمل على الـ <b>Model</b>، والـ Model يبلّغ الـ <b>View</b>.
`,mc("ما أول خطوة في تحويل كود مخلوط إلى MVC؟",["إعادة تصميم الواجهة","استخراج الـ Model (البيانات وقواعد العمل) بحيث لا يعتمد على كود الواجهة","كتابة الـ Controller","إضافة قاعدة بيانات"],1,"الـ Model المستقل هو الأساس: به يصبح المنطق قابلاً للاختبار، ومنه تُبنى بقية الأدوار."));

<b>Refactor existing classes:</b> ليست كل مشكلة تحتاج pattern. Extract Method و Extract Class و Rename تحلّ أغلبها.

C("Documenting Problems, Decisions, Responsibilities, and Trade-offs",R`
توثيق إعادة التصميم يجيب عن خمسة أسئلة:

<b>1. Explain the original design problems:</b> قائمة 4.2 بأدلتها: أي class، أي smell، وأي ضرر عملي.

<b>2. Explain why each pattern was selected:</b> لكل pattern: المشكلة ← البدائل التي فكّرت فيها ← لماذا هذا. صيغة مفيدة هي <b>ADR</b> (Architecture Decision Record): Context ← Decision ← Consequences.

<b>3. Document the new class responsibilities:</b> جملة واحدة لكل class جديد أو معدَّل (CRC cards محدّثة).

<b>4. Compare before and after:</b> الرسمان جنباً إلى جنب، مع أرقام حين تتوفر: حجم أكبر class، عدد الاعتمادات على concrete classes، عدد الملفات التي تُعدَّل لإضافة نوع جديد، نسبة الكود المغطّى باختبارات.

<b>5. Explain advantages and trade-offs:</b> ما تحسّن، <b>وما ساء</b>. كل تصميم له ثمن: classes أكثر، indirection، منحنى تعلّم. التوثيق الذي لا يذكر عيباً واحداً توثيق غير صادق.

في الـ code review لتنفيذ pattern، اسأل: هل الأدوار واضحة من الأسماء؟ هل يعتمد الـ client على التجريد فعلاً؟ هل إضافة تنويع جديد تتم دون تعديل القائم؟ هل هناك اختبار لكل تنويع؟

    def __init__(self, conn): self.conn = conn

<b>Repository</b>: كائن يبدو لمنطق العمل كأنه <b>مجموعة (collection) في الذاكرة</b> من كائنات المجال: <code>add</code>، <code>get</code>، <code>list_by_...</code>. يخفي كل تفاصيل التخزين والاستعلام.

<b>العيوب:</b> طبقة إضافية؛ وفوق ORM غني قد تحجب قدراته (lazy loading، تركيب الاستعلامات) أو تكررها.

قاعدة: repository لكل <b>aggregate</b> (كائن جذري وما يملكه، مثل Order وسطوره)، لا لكل جدول.

C("Unit of Work",R`
<b>Unit of Work</b>: كائن <b>يتتبّع</b> كل الكائنات التي تغيّرت خلال عملية عمل واحدة، ثم يكتبها إلى قاعدة البيانات <b>دفعة واحدة</b> ضمن transaction واحدة: الكل ينجح أو الكل يفشل.
@@
class UnitOfWork:
    def __enter__(self):
        self.session = session_factory()
        self.orders = SqlOrderRepository(self.session)
        self.stock = SqlStockRepository(self.session)
        return self
    def __exit__(self, exc_type, *args):
        if exc_type: self.session.rollback()        # أي خطأ يلغي كل شيء
        self.session.close()
    def commit(self): self.session.commit()

def place_order(uow, customer_id, items):
    with uow:
        order = Order.create(customer_id, items)
        uow.stock.reserve(items)
        uow.orders.add(order)
        uow.commit()                                # نقطة كتابة واحدة
@@
ما يقدّمه: <b>atomicity</b> (ذرّية: كل التغييرات أو لا شيء) عبر عدة repositories، كتابات مجمّعة أقل، ومكان واحد واضح لحدود الـ transaction.

أمثلة جاهزة: <code>Session</code> في SQLAlchemy هو Unit of Work. في Django لا يوجد تتبّع تغييرات تلقائي (تستدعي <code>save()</code> بنفسك)، لكن <code>transaction.atomic()</code> يعطيك جزء الذرّية.

C("Identity Map",R`
<b>Identity Map</b>: خريطة (cache) داخل الجلسة تضمن أن <b>كل صف يُحمَّل مرة واحدة فقط</b> ويمثّله <b>كائن واحد</b> في الذاكرة. قبل الجلب من قاعدة البيانات يُسأل: هل حمّلنا هذا الـ ID؟ إن نعم يُعاد الكائن نفسه.

المشكلة التي يمنعها:
@@

b = Order.objects.get(pk=7)      # Django: كائن ثانٍ مستقل! (a is b) == False

@@

SQLAlchemy Session فيها identity map. Django ORM <b>ليس فيه</b>؛ لذلك في Django: تجنّب حمل نسختين من الصف نفسه في العملية الواحدة، واستخدم <code>save(update_fields=[...])</code> و <code>select_for_update()</code> و <code>F()</code> عند التحديثات المتزامنة.

- <b>أمان</b>: لا يتسرب حقل داخلي (hash كلمة المرور، ملاحظات داخلية).

طريقتان لتنظيم منطق العمل:

<b>Transaction Script</b>: <b>دالة (procedure) لكل عملية عمل</b>، تنفّذ كل شيء من الأعلى إلى الأسفل: تحقق، حساب، كتابة.

def place_order(customer_id, items):
    customer = db.get_customer(customer_id)
    total = sum(i.price * i.qty for i in items)
    if customer.is_vip: total *= 0.9

<b>Domain Model</b>: شبكة <b>كائنات تجمع البيانات والسلوك</b> وتمثّل مفاهيم المجال، والقواعد تعيش في الكائن الذي يملك بياناتها.

<b>Service Layer</b>: طبقة تحدد <b>حدود التطبيق</b> — مجموعة العمليات (<b>use cases</b>) التي يقدّمها — وتنسّق تنفيذ كل منها. يستدعيها كل من يريد شيئاً من التطبيق: views، API، أوامر CLI، مهام مجدولة.

class OrderService:
    def __init__(self, orders, stock, payments, events):
        self.orders, self.stock, self.payments, self.events = orders, stock, payments, events

    def place_order(self, customer_id: int, items: list[ItemDTO]) -> int:
        with transaction.atomic():                     # حدود الـ transaction
            order = Order.create(customer_id, items)   # قواعد العمل في المجال
            self.stock.reserve(items)
            self.payments.charge(customer_id, order.total())
            self.orders.add(order)
        self.events.publish(OrderPlaced(order.id))     # آثار جانبية بعد النجاح
        return order.id
@@
مسؤولياته: تنسيق الخطوات، حدود الـ transaction، الصلاحيات على مستوى العملية، ونشر الأحداث. <b>ليس</b> فيه: قواعد المجال التفصيلية (في الـ models)، ولا تفاصيل HTTP (في الـ views).

يحلّ مشكلة MVC التي رأيناها: منطق يمسّ عدة models لم يجد مكاناً، فتكدّس في الـ controller أو في model واحد.

# bootstrap.py — الـ Composition Root
def build_order_service(settings) -> OrderService:

<b>DI Container</b> (أو IoC container): مكتبة تسجّل فيها «هذه الواجهة ← هذا التنفيذ بهذا الـ lifecycle» (transient، scoped، singleton كما في 1.3)، فتبني هي شجرة الكائنات تلقائياً. شائعة في Java (Spring) و C# (.NET). في Python أقلّ شيوعاً؛ FastAPI فيه نظام <code>Depends</code>، و Django لا يوفّر container.

بديل يجب تمييزه: <b>Service Locator</b> — الكائن <b>يسأل</b> سجلاً عاماً عن تبعياته (<code>locator.get(Mailer)</code>) بدل استلامها. يُعدّ غالباً anti-pattern: يخفي التبعيات كما يفعل Singleton.

القاعدة: الـ container (إن وُجد) يُستخدم في الـ Composition Root <b>فقط</b>. بقية الكود لا يعرف بوجوده ويستلم تبعياته بالـ constructor.

C("Specification Pattern",R`
<b>Specification</b>: تغليف <b>قاعدة عمل تجيب بنعم أو لا</b> في كائن مستقل، يمكن <b>تسميته</b> و<b>تركيبه</b> مع غيره بـ and و or و not.
@@
class Specification:
    def is_satisfied_by(self, candidate) -> bool: raise NotImplementedError
    def __and__(self, other): return AndSpec(self, other)
    def __invert__(self): return NotSpec(self)

class AndSpec(Specification):
    def __init__(self, a, b): self.a, self.b = a, b
    def is_satisfied_by(self, c): return self.a.is_satisfied_by(c) and self.b.is_satisfied_by(c)

class NotSpec(Specification):
    def __init__(self, a): self.a = a
    def is_satisfied_by(self, c): return not self.a.is_satisfied_by(c)

class IsVip(Specification):
    def is_satisfied_by(self, customer): return customer.yearly_spend >= 500_000

class TimingMiddleware:
    def __init__(self, get_response):          # get_response = بقية السلسلة
        self.get_response = get_response

    def __call__(self, request):
        start = time.perf_counter()            # قبل: في طريق الدخول
        response = self.get_response(request)  # تمرير إلى التالي
        ms = (time.perf_counter() - start) * 1000
        response["X-Elapsed-ms"] = f"{ms:.1f}" # بعد: في طريق الخروج
        return response

C("Database Transaction Management",R`
<b>Transaction</b>: مجموعة عمليات على قاعدة البيانات تُعامل كوحدة واحدة. خصائصها <b>ACID</b>:
- <b>Atomicity</b>: الكل أو لا شيء.
- <b>Consistency</b>: القيود تبقى محترمة قبلها وبعدها.
- <b>Isolation</b>: الـ transactions المتزامنة لا تفسد بعضها.
- <b>Durability</b>: ما أُكّد (commit) يبقى حتى لو انهار الخادم.

المثال الكلاسيكي: تحويل مالي = خصم من حساب + إضافة إلى آخر. انهيار بينهما دون transaction يُضيع المال.
@@
from django.db import transaction

def transfer(src_id, dst_id, cents):
    with transaction.atomic():                                           # الحدود
        src = Account.objects.select_for_update().get(pk=src_id)         # قفل الصف
        dst = Account.objects.select_for_update().get(pk=dst_id)
        if src.balance < cents: raise InsufficientFunds()                # exception يلغي الكل
        src.balance -= cents; dst.balance += cents
        src.save(update_fields=["balance"]); dst.save(update_fields=["balance"])
    transaction.on_commit(lambda: notify_transfer(src_id, dst_id, cents))  # بعد النجاح فقط
@@
قرارات التصميم:
- <b>أين الحدود؟</b> عند الـ <b>use case</b> (Service Layer)، لا في كل repository ولا في الـ view. transaction واحدة لكل عملية عمل.
- <b>قصيرة</b>: لا استدعاءات شبكة خارجية داخلها (تمسك الأقفال وتطيل الانتظار).
- <b>Race conditions</b>: «اقرأ ثم عدّل» يحتاج قفلاً (<code>select_for_update</code>) أو تحديثاً ذرّياً (<code>F("stock") - 1</code>).
- الآثار الخارجية بعد الـ commit.

هذه هي النسخة العملية من Unit of Work.

C("Refactoring Legacy Code Safely",R`
<b>Legacy code</b>: تعريف Michael Feathers العملي — «كود بلا اختبارات». لا يهم عمره؛ المهم أنك لا تستطيع تغييره بأمان.

المعضلة: لتغييره بأمان تحتاج اختبارات، ولكتابة اختبارات تحتاج تغييره. الخوارزمية:
- 1. <b>حدّد نقطة التغيير</b> المطلوبة فقط؛ لا تصلح كل شيء.
- 2. <b>جد seam</b>: موضع يمكن عنده تبديل سلوك دون تعديل الموضع (parameter، method يمكن override لها، دالة قابلة للحقن).
- 3. <b>اكسر التبعية</b> بأصغر تعديل آمن — ويُفضَّل تعديلاً آلياً من الـ IDE (Extract Method، Introduce Parameter).
- 4. <b>اكتب characterization tests</b> حول المنطقة.
- 5. <b>أعد الهيكلة</b> بخطوات صغيرة والاختبارات خضراء (<b>refactoring without breaking behavior</b>).
- 6. <b>أضف الميزة</b> أو الإصلاح.

<b>Refactoring with automated tests</b> يعني هذه الحلقة القصيرة: خطوة ← اختبارات ← commit. والقاعدة الصارمة: <b>لا تخلط</b> refactoring وتغيير سلوك في commit واحد («قبعتان» لا تُلبسان معاً).

للتغييرات الكبيرة:
- <b>Strangler Fig</b>: ابنِ الجديد بجانب القديم، حوّل المسارات إليه تدريجياً، ثم احذف القديم. لا إعادة كتابة شاملة («big bang rewrite» يفشل غالباً).
- <b>Branch by Abstraction</b>: أدخل واجهة أمام الجزء القديم، اكتب تنفيذاً جديداً خلفها، بدّل، ثم احذف القديم.
- <b>Boy Scout Rule</b>: اترك كل ملف تلمسه أنظف قليلاً مما وجدته.

الـ refactoring ليس دائماً إضافة بنية؛ أحياناً هو <b>إزالتها</b>.

<b>Identifying unnecessary abstractions</b> — علامات التجريد الزائد:
- interface بتنفيذ واحد، ولا fake له في الاختبارات.
- class يفوّض كل شيء ولا يضيف (Middle Man).
- طبقات تمرّر البيانات كما هي: controller ← service ← manager ← helper ← repository.
- factory تنشئ نوعاً واحداً دائماً.
- إعدادات وخيارات لا يغيّرها أحد.
- للوصول إلى الكود الفعلي تحتاج خمس قفزات «Go to definition».

التقنيات المعاكسة: <b>Inline Method</b>، <b>Inline Class</b>، <b>Collapse Hierarchy</b>، <b>Remove Middle Man</b>. والسؤال الحاكم: «ماذا سأخسر إن حذفت هذا؟». إن كان الجواب «لا شيء» فاحذفه.

<b>Simplifying complex dependencies:</b>
- <b>اكسر الدوائر</b> (A ← B ← A): استخرج الجزء المشترك إلى ثالث، أو اعكس أحد الاتجاهين بواجهة (DIP) أو بحدث (Observer).
- <b>قلّل عدد التبعيات</b>: constructor بثماني تبعيات يعني مسؤوليات كثيرة ← Extract Class، أو Facade لمجموعة تُستخدم معاً.
- <b>اعتمد على الأضيق</b>: مرّر القيمة التي تحتاجها لا الكائن الكبير (ISP).
- <b>اجعل الاتجاه واحداً</b>: الطبقات العليا تعرف السفلى لا العكس.

C("Strategy و Factory في Django",R`
<b>Strategy</b> — خوارزميات تسعير أو خصم أو دفع قابلة للتبديل. في Python الـ strategy قد تكون class أو مجرد دالة:
@@
class DiscountStrategy(Protocol):
    def apply(self, subtotal_cents: int) -> int: ...

class NoDiscount:
    def apply(self, subtotal_cents): return subtotal_cents

class PercentageDiscount:
    def __init__(self, percent): self.percent = percent
    def apply(self, subtotal_cents): return subtotal_cents * (100 - self.percent) // 100

class Order(models.Model):
    def total(self, discount: DiscountStrategy = NoDiscount()) -> int:
        return discount.apply(self.subtotal())
@@
<code>Protocol</code> (من typing) يعرّف الواجهة بـ structural typing: أي class فيه <code>apply</code> بالتوقيع نفسه يُقبل دون وراثة.

<b>Factory</b> — في جدول الـ roadmap تعني <b>Simple Factory</b>: اختيار مزوّد الإشعارات أو التخزين. الصيغة الـ Pythonic: <b>registry</b> (قاموس) بدل if/elif:
@@
NOTIFIERS = {"email": EmailNotifier, "sms": SmsNotifier, "push": PushNotifier}

def make_notifier(channel: str) -> Notifier:
    try:
        return NOTIFIERS[channel]()
    except KeyError:
        raise ValueError(f"unknown channel: {channel}")
@@

class PaymentGateway(Protocol):
    def charge(self, customer_ref: str, cents: int) -> str: ...

class StripeAdapter:
    def __init__(self, client): self._client = client
    def charge(self, customer_ref, cents):
        try:
            intent = self._client.payment_intents.create(amount=cents, currency="usd", customer=customer_ref)

<b>Decorator</b> — تنبيه مهم: <b>Python decorator</b> (صيغة <code>@</code>) و <b>GoF Decorator</b> ليسا الشيء نفسه، وإن تشابهت الفكرة:

<tr><td>يغلّف</td><td>كائناً</td><td>دالة أو class</td></tr>

def log_calls(func):                       # Python decorator: يغلّف دالة
    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        logger.info("calling %s", func.__name__)
        return func(*args, **kwargs)
    return wrapper

@login_required                            # صلاحيات
@log_calls                                 # سلوك إضافي
def dashboard(request): ...
@@

<b>State</b> — دورة حياة الطلب أو الشحنة. ابدأ بالأبسط: حقل <code>status</code> + <b>جدول انتقالات</b> + method واحدة تفرضه:

class Order(models.Model):
    class Status(models.TextChoices):
        PENDING = "pending"; CONFIRMED = "confirmed"; SHIPPED = "shipped"
        DELIVERED = "delivered"; CANCELLED = "cancelled"

    TRANSITIONS = {
        Status.PENDING:   {Status.CONFIRMED, Status.CANCELLED},
        Status.CONFIRMED: {Status.SHIPPED, Status.CANCELLED},
        Status.SHIPPED:   {Status.DELIVERED},
    }
    status = models.CharField(max_length=20, choices=Status.choices, default=Status.PENDING)

    def transition_to(self, new):
        if new not in self.TRANSITIONS.get(self.status, set()):
            raise InvalidTransition(f"{self.status} -> {new}")
        self.status = new

# orders/services.py
@transaction.atomic
def place_order(*, customer, items: list[OrderItemInput]) -> Order:
    order = Order.objects.create(customer=customer)
    for item in items:
        product = Product.objects.select_for_update().get(pk=item.product_id)
        product.reserve(item.quantity)                  # قاعدة العمل في الـ model
        product.save(update_fields=["stock"])
        order.lines.create(product=product, quantity=item.quantity, unit_price=product.price)
    transaction.on_commit(lambda: order_placed.send(sender=Order, order=order))
    return order

# orders/views.py — thin
def create(request):
    form = OrderForm(request.POST)
    if not form.is_valid(): return render(request, "orders/form.html", {"form": form})
    order = services.place_order(customer=request.user.customer, items=form.to_items())

PROJ.intro=R`
ورثتَ نظام طلبات لمتجر صغير اسمه QuickCart. الكود يعمل، لكن كل تعديل فيه يكسر شيئاً آخر. مهمتك تطبيق منهجية Module 4 كاملة عليه: <b>افهم ← شخّص ← احمِ بالاختبارات ← أعد التصميم ← وثّق</b>.

- نفّذ بـ Python (الكود المعطى) أو أعد كتابته بـ Java إن أردت التمرّن عليها. لا تحتاج Django؛ يكفي Python و sqlite3 و pytest (أو unittest).
- المهام متدرجة الصعوبة. لكل مهمة: هدف، تعليمات، تلميحات اختيارية، مساحة لمحاولتك، ونقاط تحقق.
- <b>الحل المرجعي مقفل</b> حتى تكتب محاولة حقيقية. الحلول المرجعية مخططات موجزة لا كود كامل: توجد حلول صحيحة كثيرة، والمهم أن تستطيع تبرير حلّك.
- لا تُدخل pattern بلا مشكلة يحلّها. إن رأيت أن مهمة ما تبالغ في البنية لحجم هذا النظام فاكتب ذلك في محاولتك وعلّله؛ هذا بالضبط الحكم المطلوب منك.

<b>الكود الموروث (legacy):</b>
@@
import smtplib, sqlite3, datetime, requests

class OrderManager:
    def __init__(self):
        self.db = sqlite3.connect("shop.db")

    def process(self, customer_id, items, pay_type, coupon, card=None, wallet_id=None):
        # validate
        if not items: return "ERR: empty"
        cur = self.db.cursor()
        c = cur.execute("SELECT id, email, type, phone FROM customers WHERE id=?", (customer_id,)).fetchone()
        if c is None: return "ERR: no customer"
        total = 0
        for it in items:                      # it = (sku, qty)
            p = cur.execute("SELECT price, stock FROM products WHERE sku=?", (it[0],)).fetchone()
            if p[1] < it[1]: return "ERR: stock " + it[0]
            total += p[0] * it[1]
        # discount
        if c[2] == "vip": total = total * 0.9
        elif c[2] == "staff": total = total * 0.7
        if coupon == "WELCOME10" and total > 50: total = total - 10
        if total > 200: ship = 0
        else: ship = 7.5
        total = total + ship
        # pay
        if pay_type == 1:
            r = requests.post("https://fastpay.example/api/charge", json={"card": card, "amt": total})
            if r.status_code != 200: return "ERR: payment"
        elif pay_type == 2:
            w = cur.execute("SELECT balance FROM wallets WHERE id=?", (wallet_id,)).fetchone()
            if w[0] < total: return "ERR: wallet"
            cur.execute("UPDATE wallets SET balance=balance-? WHERE id=?", (total, wallet_id))
        elif pay_type == 3:
            pass                              # cash on delivery
        # save
        cur.execute("INSERT INTO orders(customer_id,total,status,created) VALUES(?,?,?,?)",
                    (customer_id, total, 1, str(datetime.datetime.now())))
        oid = cur.lastrowid
        for it in items:
            cur.execute("UPDATE products SET stock=stock-? WHERE sku=?", (it[1], it[0]))
        self.db.commit()
        # notify
        s = smtplib.SMTP("localhost")
        s.sendmail("shop@x.com", c[1], "Order " + str(oid) + " total " + str(total)); s.quit()
        if c[2] == "vip":
            requests.post("https://sms.example/send", data={"to": c[3], "msg": "VIP order " + str(oid)})
        return "OK:" + str(oid)

    def change_status(self, oid, new):
        cur = self.db.cursor()
        st = cur.execute("SELECT status FROM orders WHERE id=?", (oid,)).fetchone()[0]
        if new == 2:
            if st != 1: return "ERR"
        elif new == 3:
            if st != 2: return "ERR"
        elif new == 4:
            if st != 3: return "ERR"
        elif new == 5:
            if st == 3 or st == 4: return "ERR"
        cur.execute("UPDATE orders SET status=? WHERE id=?", (new, oid))
        self.db.commit()
        return "OK"
@@
الحالات: 1 = pending، 2 = confirmed، 3 = shipped، 4 = delivered، 5 = cancelled. طرق الدفع: 1 = بطاقة عبر FastPay، 2 = محفظة، 3 = نقداً عند الاستلام.

@dataclass(frozen=True)
class OrderItem:
    sku: str; quantity: int; unit_price_cents: int
    def subtotal(self): return self.quantity * self.unit_price_cents

class DiscountPolicy(Protocol):
    def apply(self, cents: int) -> int: ...

class NoDiscount:
    def apply(self, cents): return cents

class PercentOff:
    def __init__(self, percent): self.percent = percent
    def apply(self, cents): return cents * (100 - self.percent) // 100

CUSTOMER_DISCOUNTS = {"vip": PercentOff(10), "staff": PercentOff(30)}      # registry
def discount_for(customer_type) -> DiscountPolicy:
    return CUSTOMER_DISCOUNTS.get(customer_type, NoDiscount())             # Null Object

FREE_SHIPPING_THRESHOLD = 200_00; SHIPPING_FEE = 7_50
WELCOME_COUPON = "WELCOME10"; COUPON_MIN = 50_00; COUPON_VALUE = 10_00

def price_order(items, customer_type, coupon) -> int:
    total = sum(i.subtotal() for i in items)
    total = discount_for(customer_type).apply(total)
    if coupon == WELCOME_COUPON and total > COUPON_MIN:
        total -= COUPON_VALUE
    return total + (0 if total > FREE_SHIPPING_THRESHOLD else SHIPPING_FEE)

class PaymentMethod(Protocol):                         # Strategy
    def pay(self, amount_cents: int) -> None: ...      # ترفع PaymentFailed عند الفشل

class CardGateway(Protocol):                           # Target للـ adapter
    def charge(self, card: str, amount_cents: int) -> None: ...

class FastPayAdapter:                                  # Adapter: المكان الوحيد الذي يعرف FastPay
    URL = "https://fastpay.example/api/charge"
    def __init__(self, http_post): self._post = http_post
    def charge(self, card, amount_cents):
        try:
            r = self._post(self.URL, json={"card": card, "amt": amount_cents / 100})
        except Exception as exc:
            raise PaymentFailed("gateway unreachable") from exc
        if r.status_code != 200:
            raise PaymentFailed("card declined")

class CardPayment:
    def __init__(self, gateway: CardGateway, card): self.gateway, self.card = gateway, card
    def pay(self, amount_cents): self.gateway.charge(self.card, amount_cents)

class WalletPayment:
    def __init__(self, wallets, wallet_id): self.wallets, self.wallet_id = wallets, wallet_id
    def pay(self, amount_cents): self.wallets.debit(self.wallet_id, amount_cents)   # ترفع InsufficientFunds

class CashOnDelivery:
    def pay(self, amount_cents): pass

class PaymentFactory:                                  # Simple Factory + registry
    def __init__(self, gateway, wallets): self.gateway, self.wallets = gateway, wallets
    def create(self, kind: str, **details) -> PaymentMethod:
        makers = {
            "card":   lambda: CardPayment(self.gateway, details["card"]),
            "wallet": lambda: WalletPayment(self.wallets, details["wallet_id"]),
            "cod":    lambda: CashOnDelivery(),
        }
        if kind not in makers: raise ValueError(f"unknown payment kind: {kind}")
        return makers[kind]()
@@

class Status(Enum):
    PENDING = 1; CONFIRMED = 2; SHIPPED = 3; DELIVERED = 4; CANCELLED = 5

TRANSITIONS = {
    Status.PENDING:   {Status.CONFIRMED, Status.CANCELLED},
    Status.CONFIRMED: {Status.SHIPPED, Status.CANCELLED},
    Status.SHIPPED:   {Status.DELIVERED},
    Status.DELIVERED: set(),
    Status.CANCELLED: set(),
}
class Order:
    def transition_to(self, new: Status):

            raise InvalidTransition(self.status, new)
        self.status = new

class OrderState(Protocol):
    def cancel(self, order) -> list: ...           # تعيد أحداثاً
    def ship(self, order) -> list: ...

class PendingState:
    def cancel(self, order):
        order._state = CancelledState(); return [OrderCancelled(order.id, refund=False)]
    def ship(self, order): raise InvalidTransition("confirm first")

class ConfirmedState:
    def cancel(self, order):
        order._state = CancelledState(); return [OrderCancelled(order.id, refund=True, restock=True)]
    def ship(self, order):
        order._state = ShippedState(); return [OrderShipped(order.id)]

class OrderService:
    def __init__(self, uow_factory, payments: PaymentFactory, events: EventBus):
        self.uow_factory, self.payments, self.events = uow_factory, payments, events

    def place_order(self, cmd: PlaceOrder) -> int:
        if not cmd.items: raise EmptyOrder()
        with self.uow_factory() as uow:                                   # transaction واحدة
            customer = uow.customers.get(cmd.customer_id)                 # ترفع CustomerNotFound
            items = [uow.products.reserve(sku, qty) for sku, qty in cmd.items]   # ذرّي؛ ترفع InsufficientStock
            total = price_order(items, customer.type, cmd.coupon)
            order = Order.place(customer.id, items, total)
            if cmd.payment_kind == "wallet":
                uow.wallets.debit(cmd.payment_details["wallet_id"], total)
            order_id = uow.orders.add(order)
            uow.commit()
        if cmd.payment_kind == "card":                                    # خارجي: بعد الـ commit
            self._charge_card_or_cancel(order_id, cmd, total)
        self.events.publish(OrderPlaced(order_id, customer.email, customer.phone, customer.type, total))
        return order_id

class AdminCommand(Protocol):
    def execute(self) -> None: ...
    def undo(self) -> None: ...
    reversible: bool

class ChangeAddress:
    reversible = True
    def __init__(self, orders, order_id, new_address):
        self.orders, self.order_id, self.new = orders, order_id, new_address
        self._old = None
    def execute(self):
        order = self.orders.get(self.order_id)
        self._old = order.address                       # حفظ الحالة السابقة (روح Memento)
        order.change_address(self.new); self.orders.save(order)
    def undo(self):
        order = self.orders.get(self.order_id)
        order.change_address(self._old); self.orders.save(order)

class ShipOrder:
    reversible = False                                   # أثر في العالم الحقيقي
    ...

class AdminHistory:                                      # Invoker
    def __init__(self, audit_log): self._done, self._log = [], audit_log
    def run(self, cmd):
        cmd.execute(); self._log.record(cmd)
        if cmd.reversible: self._done.append(cmd)
        else: self._done.clear()                         # لا تراجع عبر نقطة لا رجعة فيها
    def undo_last(self):
        if not self._done: raise NothingToUndo()
        self._done.pop().undo()

<b>ما رُفض:</b> Singleton للاتصال (حقن أوضح)، Abstract Factory (لا عائلات منتجات)، Chain of Responsibility للتحقق (ثلاثة فحوص ثابتة لا تبرره بعد)، Decorator للـ logging (لا حاجة قائمة)، State الكامل قبل متطلب الاسترداد.

<b>التمدد:</b> طريقة دفع = class + سطر في الـ factory. نوع عميل = سطر في registry. قناة إشعار = class + سطر اشتراك. في الأصل كان كل منها تعديلاً داخل <code>process</code> مع خطر كسر بقية المسؤوليات.

<b>العيوب الصادقة:</b> من class واحد إلى نحو عشرين؛ القادم الجديد يحتاج خريطة؛ ولمتجر بهذا الحجم قد يكون نصف هذه البنية كافياً. قيمتها تظهر مع تكرار التغيير، وهذا ما يجب قياسه قبل تعميمها.`}

/* ---------- mini LaTeX renderer (offline) ---------- */
const SYM={times:'×',cdot:'·',le:'≤',leq:'≤',ge:'≥',geq:'≥',neq:'≠',to:'→',rightarrow:'→',Rightarrow:'⇒',leftarrow:'←',in:'∈',dots:'…',ldots:'…',cdots:'⋯',approx:'≈',infty:'∞',alpha:'α',beta:'β',lambda:'λ',Delta:'Δ',pm:'±',subseteq:'⊆',cup:'∪',cap:'∩',forall:'∀',exists:'∃',land:'∧',lor:'∨',neg:'¬',quad:' ',',':' ',';':' ',' ':' ',lfloor:'⌊',rfloor:'⌋'};
const FN=['log','max','min','lim','size','deg'];
function texAtom(p){const s=p.s;while(s[p.i]===' ')p.i++;const c=s[p.i];
 if(c===undefined)return '';
 if(c==='{'){p.i++;return texSeq(p,'}')}
 if(c==='\\'){const m=/^\\([a-zA-Z]+|.)/.exec(s.slice(p.i));p.i+=m[0].length;const n=m[1];
  if(n==='frac'){const a=texAtom(p),b=texAtom(p);return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'}
  if(n==='text'||n==='mathrm'||n==='mathit'||n==='operatorname'){while(s[p.i]===' ')p.i++;let raw='';if(s[p.i]==='{'){p.i++;let d=1;while(p.i<s.length){const ch=s[p.i++];if(ch==='{')d++;else if(ch==='}'&&--d===0)break;raw+=ch}}return '<span class="tx">'+esc(raw)+'</span>'}
  if(n==='sqrt')return '√<span class="sq">'+texAtom(p)+'</span>';
  if(n==='sum')return '<span class="big">∑</span>';
  if(n==='prod')return '<span class="big">∏</span>';
  if(n==='left'||n==='right')return '';
  if(FN.includes(n))return '<span class="tx">'+n+'</span> ';
  if(n in SYM)return /^(times|cdot|le|leq|ge|geq|neq|to|rightarrow|Rightarrow|leftarrow|in|approx|pm|subseteq|cup|cap|land|lor)$/.test(n)?' '+SYM[n]+' ':SYM[n];
  return esc(n)}
 p.i++;
 if(/[a-zA-Z]/.test(c))return '<i>'+c+'</i>';
 if('+=<>'.includes(c))return ' '+esc(c)+' ';
 if(c==='-')return ' − ';
 return esc(c)}
function texSeq(p,end){let o='';while(p.i<p.s.length){const c=p.s[p.i];
 if(c===' '){p.i++;continue}
 if(end&&c===end){p.i++;break}
 if(c==='^'||c==='_'){p.i++;const a=texAtom(p);o+=c==='^'?'<sup>'+a+'</sup>':'<sub>'+a+'</sub>';continue}
 o+=texAtom(p)}return o}
function tex(src,d){return '<span class="tex" dir="ltr">'+texSeq({s:src,i:0},null)+'</span>'}
/* ---------- mini markup ---------- */
const inl=s=>String(s).replace(/\$([^$\n]+)\$/g,(m,x)=>tex(x));
const KW=/\b(class|interface|abstract|extends|implements|public|private|protected|static|final|void|new|return|if|else|for|while|switch|case|break|this|super|null|true|false|throws?|try|catch|import|enum|def|self|None|True|False|pass|from|not|raise|with|lambda|int|boolean|double|long|String|default|synchronized|volatile|instanceof|assert)\b/g;
function hl(s){return s.split('\n').map(l=>{const m=/(^|\s)(\/\/|#)/.exec(l);let a=l,b='';if(m){const k=m.index+m[1].length;a=l.slice(0,k);b=l.slice(k)}return a.replace(KW,'<span class="k">$1</span>')+(b?'<span class="cm">'+b+'</span>':'')}).join('\n')}
function md(b){if(!b)return '';const ls=b.replace(/^\n+|\s+$/g,'').split('\n');let h='',i=0,pa=[];
 const fl=()=>{if(pa.length){h+='<p>'+inl(pa.join(' '))+'</p>';pa=[]}};
 while(i<ls.length){const l=ls[i],t=l.trim();
  if(t==='@@'||t==='@@t'){fl();i++;const c=[];while(i<ls.length&&ls[i].trim()!=='@@'){c.push(ls[i]);i++}i++;const x=esc(c.join('\n'));h+='<pre dir="ltr"><code>'+(t==='@@'?hl(x):x)+'</code></pre>';continue}
  if(t.startsWith('- ')){fl();h+='<ul>';while(i<ls.length&&ls[i].trim().startsWith('- ')){h+='<li>'+inl(ls[i].trim().slice(2))+'</li>';i++}h+='</ul>';continue}
  if(t.length>4&&t.startsWith('$$')&&t.endsWith('$$')){fl();h+='<div class="texb">'+tex(t.slice(2,-2),1)+'</div>';i++;continue}

  if(t.startsWith('<')&&!/^<(b|code|i|em)\b/.test(t)){fl();h+=inl(l);i++;continue}
  if(t===''){fl();i++;continue}
  pa.push(t);i++}
 fl();return h}

/* deterministic shuffle so the correct option is not always in the same position, yet stable across reloads */
function shuf(q){let h=2166136261;for(const ch of q.id+q.q.length){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
 const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
 const ix=q.o.map((_,i)=>i);for(let i=ix.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ix[i],ix[j]]=[ix[j],ix[i]]}
 q.o=ix.map(i=>q.o[i]);q.a=ix.indexOf(q.a)}

 document.body.classList.remove('navopen');window.scrollTo(0,0)}
function upd(q){const b=document.querySelector('[data-b="'+q.con.id+'"]');if(b)b.className='badge'+bCls(q.con);
 const a=$('nav').querySelector('[data-n="'+q.les.id+'"]'),c=cnt(q.les.qs);if(a){a.querySelector('small').textContent=c.d+'/'+c.n;a.classList.toggle('fin',c.d===c.n)}prog()}
function boot(){load();index();if(ST.theme)document.documentElement.dataset.theme=ST.theme;
 $('nav').innerHTML=navHTML();prog();
 const main=$('main');
 main.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.act){main.querySelectorAll('details.con').forEach(d=>d.open=t.dataset.act==='open');return}
  if(t.dataset.rev){const i=t.dataset.rev;(ST.p[i]=ST.p[i]||{}).rev=true;save();const y=window.scrollY;main.innerHTML=vProject();main.querySelector('[data-task="'+i+'"]').open=true;window.scrollTo(0,y);return}
  const qe=t.closest('.q');if(!qe)return;const q=QM[qe.dataset.q];
  if(t.classList.contains('opt')){const i=+t.dataset.i;ST.q[q.id]={c:i,ok:i===q.a}}
  else if(t.classList.contains('retry'))delete ST.q[q.id];
  else if(t.classList.contains('chk')){const v=qe.querySelector('textarea').value.trim();if(v.length<3){qe.querySelector('.warn').textContent='اكتب إجابتك أولاً ثم اضغط «تحقّق».';return}ST.q[q.id]={c:v}}
  else if(t.dataset.sg)ST.q[q.id].ok=t.dataset.sg==='1';
  else return;
  save();qe.outerHTML=qHTML(q);upd(q)});
 main.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.ta!==undefined){const i=t.dataset.ta;(ST.p[i]=ST.p[i]||{}).a=t.value;save();const b=main.querySelector('[data-rev="'+i+'"]');if(b){const ok=t.value.trim().length>=60;b.disabled=!ok;b.nextElementSibling.textContent=ok?'':'يُفتح الحل بعد أن تكتب محاولة حقيقية (60 حرفاً على الأقل).'}}});
 main.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.ck){const [i,j]=t.dataset.ck.split('-');const s=ST.p[i]=ST.p[i]||{};(s.ck=s.ck||{})[j]=t.checked;save()}
  if(t.dataset.rb!==undefined){ST.r[t.dataset.rb]=+t.value;save();const y=window.scrollY;main.innerHTML=vFinal();window.scrollTo(0,y)}});
 $('mb').onclick=()=>document.body.classList.toggle('navopen');
 $('th').onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;ST.theme=d.dataset.theme=dark?'light':'dark';save()};
 let arm=0;$('rs').onclick=function(){if(!arm){arm=1;this.textContent='اضغط مجدداً لتأكيد المسح';setTimeout(()=>{arm=0;this.textContent='إعادة ضبط التقدّم'},4000);return}
  const th=ST.theme;ST={q:{},p:{},r:{},last:'',theme:th};save();arm=0;this.textContent='إعادة ضبط التقدّم';$('nav').innerHTML=navHTML();prog();if(location.hash&&location.hash!=='#home')location.hash='#home';else route()};
 if(!ST.theme&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';
 window.addEventListener('hashchange',route);route()}
if(typeof document!=='undefined')boot();
</script>
