HOME.intro=R`
هذه دورة كاملة تحوّل الـ roadmap الذي قدّمته إلى تجربة تعلّم تفاعلية: كل مفهوم يُشرح منفرداً بلغة بسيطة، يليه مباشرة اختبار قصير بتغذية راجعة فورية، وفي نهاية كل قسم اختبار أشمل، ثم مشروع عملي نهائي وتقييم ختامي.

- الشرح بالعربية، والمصطلحات التقنية تبقى بالإنجليزية كما ستجدها في المراجع وسوق العمل.
- أمثلة الكود في Modules 1–4 بلغة Java (لغة الدورة الأصلية) وهي قصيرة ومعلّق عليها؛ وفي المرحلة الإضافية تنتقل الأمثلة إلى Python و Django.
- تقدّمك يُحفظ تلقائياً في هذا المتصفح ويبقى بعد تحديث الصفحة. زر «إعادة ضبط التقدّم» في الأعلى يمسحه.
- لا تحفظ الـ patterns حفظاً؛ اسأل دائماً: ما المشكلة التي يحلّها هذا الـ pattern، وما ثمنه؟
`;
HOME.fixes=[
["إعادة ترتيب: Object Creation Techniques قبل Singleton و Factory Method",R`
في الـ roadmap الأصلي جاءت «تقنيات إنشاء الكائنات» بعد Factory Method مع أنها هي التي تشرح <b>لماذا</b> نحتاج Factory أصلاً. نُقلت لتصبح أول درس في Creational Patterns.`],

الـ roadmap يطلب مقارنة «Template Method vs. Strategy» في أول درس من Module 2، بينما Strategy نفسه مؤجّل إلى قسم الإضافات. لا يمكن مقارنة شيء لم يُدرس، لذلك صار Strategy أول pattern في Module 2 (وهو أيضاً الأبسط والأكثر استعمالاً).`],
["تصحيح ترتيب الاختبارات مع الـ Refactoring",R`
في 3.5 كان الترتيب: «طبّق الـ refactoring ثم اكتب tests للتأكد من أن السلوك لم يتغيّر». هذا معكوس: إن كتبت الاختبارات بعد التغيير فلن تعرف ما كان السلوك الأصلي. الصحيح كتابة <b>characterization tests</b> أولاً ثم إعادة الهيكلة. وللسبب نفسه قُدّم درس Testing في Module 4 ليأتي <b>قبل</b> تطبيق الـ patterns لا بعده.`],
["توضيح خلط شائع: Simple Factory ≠ Factory Method",R`
بند «Factory Classes» تحت Factory Method يخلط بين شيئين: <b>Simple Factory</b> (class فيه method تُنشئ كائنات حسب parameter — ليس من GoF) و<b>Factory Method</b> (method إنشاء تُعرَّف في Creator وتُنفَّذ في subclasses). الدورة تشرح الاثنين وتفصل بينهما، وتوضّح أن «Factory» في جدول Django تعني غالباً Simple Factory.`],
["إزالة التكرار: Dependency Injection و Composition و God Object",R`
Dependency Injection ورد أربع مرات (0.2، Object Creation، DIP، 5.2). يُشرح كاملاً مرة واحدة في 0.2، ثم يُبنى عليه لاحقاً (علاقته بـ DIP، ثم DI Container). كذلك Composition ورد مرتين في 0.1 فجُعل الأول تعريفاً لفكرة has-a والثاني مقارنة دقيقة مع Aggregation. و God Object ورد كـ code smell وكـ anti-pattern فشُرح في الموضعين من زاويتين مختلفتين مع ربط صريح.`],
["تدقيق تعريفات: SRP و LSP و MVC",R`
- SRP ليس «مسؤولية رئيسية واحدة» بمعنى فضفاض، بل «سبب واحد للتغيير» أي جهة واحدة (actor) تطلب تعديل الـ class.
- LSP أُضيفت له القواعد الدقيقة: preconditions لا تُشدَّد، postconditions لا تُرخى، invariants تُحفظ.
- MVC: أُضيفت خطوة ناقصة في الـ flow (في MVC الكلاسيكي يُبلَّغ الـ View بتغيّر الـ Model عبر Observer)، ووُضّح الفرق بين MVC الكلاسيكي و web MVC.`],
["تحديث مصطلحات ومعلومات",R`
- الـ smell «Switch Statements» اسمه في الطبعة الثانية من كتاب Refactoring هو <b>Repeated Switches</b>: المشكلة ليست وجود switch واحد بل تكراره.
- Singleton: أُضيفت الطرق الحديثة الآمنة (enum، holder idiom، و volatile مع double-checked locking) والتنبيه إلى أن كثيرين يعدّونه اليوم anti-pattern عند إساءة استخدامه.
- Python decorators (مثل <code>@login_required</code>) ليست مطابقة لـ GoF Decorator؛ وُضّح الفرق في درس Django.
- Django ORM مبني على Active Record، ولهذا فإن إضافة Repository فوقه ليست دائماً مفيدة.`],
["استبدال مشروع Android بمشروع backend مستقل",R`
الـ capstone الأصلي تطبيق Android بلغة Java لا يتوفر كوده هنا ولا يخدم هدفك (backend/Django). أبقيت Module 4 كمنهجية كاملة (فهم ← تشخيص ← شبكة أمان ← تطبيق ← توثيق) وصمّمت المشروع النهائي حول نظام طلبات backend بكود legacy حقيقي تعيد تصميمه.`],
["سدّ فجوات صغيرة",R`
أضيفت مفاهيم لا يكتمل الفهم بدونها: الفرق بين overriding و overloading في وقت الربط، Composition Root و DI Container، Null Object ضمن Replace Conditional with Polymorphism، Test Doubles بأنواعها، و Tell-Don't-Ask مع Law of Demeter. كما وُزّعت أهداف «1.6 Practical Work» و«2.7» و«3.5» كتمارين داخل دروسها بدل أن تبقى قوائم معزولة.`]

C("Software Architecture مقابل Software Design",R`
<b>Software Architecture</b> هي الصورة الكبيرة للنظام: ما مكوّناته الرئيسية (مثلاً: web server، database، message queue، خدمة الدفع) وكيف تتواصل. قراراتها مكلفة التغيير لاحقاً.

<b>Software Design</b> ينزل درجة: داخل المكوّن الواحد، ما الـ classes والـ objects الموجودة، ما مسؤولية كل منها، وكيف تتعاون؟

تشبيه: الـ architecture هي مخطط المدينة (أين الأحياء والطرق الرئيسية)، والـ design هو المخطط الداخلي لكل بناية (الغرف والأبواب).
`,mc("قرار «نفصل خدمة الإشعارات كـ service مستقل يتواصل مع بقية النظام عبر message queue» ينتمي إلى:",["Software Architecture","Software Design","Refactoring","Design Pattern سلوكي"],0,"القرار يخصّ مكوّنات النظام الكبرى وطريقة تواصلها، وهذا مستوى الـ architecture. أما كيف تُبنى الـ classes داخل خدمة الإشعارات فهو design."));
C("Design Patterns و Refactoring",R`
<b>Design Pattern</b>: حل مجرَّب ومُسمّى لمشكلة تصميم تتكرر. ليس كوداً جاهزاً تنسخه، بل «فكرة حل» تكيّفها مع حالتك.

<b>Refactoring</b>: تحسين البنية الداخلية لكود موجود <b>دون تغيير سلوكه الظاهر</b>. المستخدم لا يلاحظ فرقاً، لكن المطوّر يجد الكود أسهل قراءة وتعديلاً.

العلاقة بينهما: كثيراً ما نصل إلى pattern عبر refactoring؛ نرى كوداً متشابكاً فنعيد هيكلته خطوة خطوة حتى يأخذ شكل pattern معروف.

<b>Abstract Class</b>: class ناقص لا يمكن إنشاء object منه مباشرة. قد يحتوي fields و methods منفَّذة و methods مجرّدة (<code>abstract</code>) يكملها الأبناء. الـ class يرث من abstract class واحد فقط في Java.

C("Object Relationships: Aggregation و Composition",R`
كلاهما نوع خاص من الـ association يعبّر عن «كل وأجزاء» (whole–part)، والفرق في <b>دورة الحياة</b>:

<b>Aggregation</b>: الكل يضمّ أجزاء <b>تستطيع العيش بدونه</b>. القسم (Department) يضمّ أساتذة؛ إن أُلغي القسم بقي الأساتذة. الأجزاء تُنشأ خارج الكل وتُمرَّر إليه.

<b>Composition</b> (بالمعنى الدقيق): الكل <b>يملك</b> أجزاءه؛ تُنشأ معه وتزول بزواله ولا تُشارَك. الطلب (Order) يملك سطوره (OrderLine)؛ لا معنى لسطر طلب بلا طلب.
@@
class Department {                        // aggregation
    private List<Professor> staff;
    void add(Professor p) { staff.add(p); }      // أُنشئ في الخارج
}
class Order {                             // composition
    private final List<OrderLine> lines = new ArrayList<>();
    void addLine(String sku, int qty) {
        lines.add(new OrderLine(sku, qty));      // يُنشأ داخل الكل ولا يخرج
    }
}
@@
الترتيب من الأضعف إلى الأقوى:
$$\text{Dependency} < \text{Association} < \text{Aggregation} < \text{Composition} < \text{Inheritance}$$

C("High Cohesion",R`
<b>Cohesion</b> (التماسك) يقيس مدى ترابط الأشياء الموجودة <b>داخل</b> الـ class الواحد. التماسك العالي: كل الـ fields والـ methods تخدم غرضاً واحداً واضحاً.

مثال تماسك منخفض: class اسمه <code>Utils</code> فيه <code>sendEmail()</code> و <code>calculateTax()</code> و <code>resizeImage()</code>. لا رابط بينها سوى أنها «لم تجد مكاناً آخر».

علامة عملية: إن احتجت إلى «و» لوصف الـ class («يحسب الضريبة <b>و</b>يرسل البريد <b>و</b>...») فتماسكه ضعيف.

أحد المقاييس الرسمية هو LCOM (Lack of Cohesion of Methods)، وأبسط صيغه:
$$LCOM = P - Q$$
حيث $P$ عدد أزواج الـ methods التي لا تشترك في أي field، و $Q$ عدد الأزواج التي تشترك. كلما كبرت القيمة ضعف التماسك (وتُعدّ $0$ إن كانت سالبة).

C("Low Coupling",R`
<b>Coupling</b> (الاقتران) يقيس مدى اعتماد class على classes <b>أخرى</b>. الاقتران المنخفض: كل class يعرف أقل قدر ممكن عن غيره، فتغيير أحدهما لا يكسر الآخر.

تشبيه: الأجهزة المنزلية تتصل بالكهرباء عبر مقبس قياسي. المصباح لا يعرف شيئاً عن محطة التوليد؛ هذا اقتران منخفض.

أشكال اقتران عالٍ: استخدام <code>new ConcreteClass()</code> في كل مكان، الوصول إلى fields كائن آخر، الاعتماد على ترتيب استدعاءات داخلي.

مقياس مفيد للـ package أو الـ class هو <b>Instability</b>:
$$I = \frac{C_e}{C_a + C_e}$$
حيث $C_e$ (efferent) عدد ما يعتمد <b>هو</b> عليه، و $C_a$ (afferent) عدد من يعتمدون <b>عليه</b>. $I \to 0$ يعني مستقراً يعتمد عليه الكثير فتغييره خطر، و $I \to 1$ يعني سهل التغيير.

الهدف المزدوج دائماً: <b>High Cohesion + Low Coupling</b>.

C("Favor Composition Over Inheritance",R`
المبدأ: حين تريد إعادة استخدام سلوك أو تنويعه، <b>فضّل</b> أن يملك الـ class كائناً يقوم بالعمل (composition) على أن يرثه.

لماذا؟ تخيّل بطّاً: يطير أو لا يطير، يصدر صوتاً أو يصفّر أو يصمت. بالوراثة تحتاج class لكل تركيبة. إن كان عندك $m$ طريقة طيران و $n$ طريقة صوت:
$$\text{Inheritance: } m \times n \text{ classes} \qquad \text{Composition: } m + n \text{ classes}$$
مع $m=3$ و $n=4$: اثنا عشر class مقابل سبعة، والفارق يتسع مع كل بُعد جديد (هذا يُسمّى class explosion).

بالـ composition، البطة <b>تملك</b> <code>FlyBehavior</code> و <code>QuackBehavior</code> ويمكن تبديلهما وقت التشغيل.

! «Favor» تعني «فضّل» لا «امنع». الوراثة تبقى مناسبة حين توجد علاقة is-a حقيقية ومستقرة.

C("Dependency Injection",R`
<b>Dependency</b> هنا تعني: كائن يحتاجه الـ class ليعمل. السؤال: من يُنشئه؟

دون DI، الـ class ينشئ ما يحتاجه بنفسه فيرتبط به إلى الأبد:
@@
class OrderService {
    private EmailNotifier notifier = new EmailNotifier();   // مقفل على Email
}
@@
<b>Dependency Injection</b>: الـ class <b>يستلم</b> ما يحتاجه من الخارج بدل أن ينشئه.
@@
class OrderService {
    private final Notifier notifier;
    OrderService(Notifier notifier) { this.notifier = notifier; }   // constructor injection
}
// في مكان واحد أعلى التطبيق:
OrderService s = new OrderService(new SmsNotifier());
@@
أنواعها: <b>constructor injection</b> (الأفضل: التبعيات واضحة وإلزامية)، <b>setter injection</b> (لتبعيات اختيارية)، و <b>method injection</b> (تُمرَّر مع الاستدعاء).

الفائدة الكبرى: في الاختبار تمرّر <code>FakeNotifier</code> فلا يُرسل بريد حقيقي. ولا تحتاج framework لذلك؛ الـ DI مجرد تمرير parameters.

<b>Abstract class</b>: يُكتب اسمه بخط <i>مائل</i> أو يُضاف <code>{abstract}</code>، وكذلك الـ operations المجرّدة تُكتب مائلة. الأبناء يرتبطون به بسهم <b>متصل</b> بمثلث مجوّف (inheritance).

  +----------------+              | + amountDue() {abstract}   |

                                  +----------------------------+

                                  | + amountDue(): double      |
                                  +----------------------------+
@@
الرمز <code>&lt;|- - -</code> realization، والرمز <code>/_\</code> فوق خط متصل هو inheritance.

C("What Is a Design Pattern?",R`
<b>Design Pattern</b>: وصف لحل عام قابل لإعادة الاستخدام لمشكلة تصميم تتكرر في سياق معيّن. هو <b>قالب فكري</b> لا كود جاهز: يخبرك ما الأدوار المطلوبة وكيف تتعاون، وأنت تكتب الكود المناسب لمشروعك.

المصطلح اشتهر بكتاب «Design Patterns: Elements of Reusable Object-Oriented Software» (1994) لأربعة مؤلفين يُلقَّبون بـ <b>Gang of Four (GoF)</b>، وفيه 23 pattern.

تشبيه: «الدَّرَج الحلزوني» حل معماري معروف لمشكلة «ضيق المساحة». لا أحد ينسخ درجاً بعينه، لكن كل معماري يعرف الفكرة واسمها ومتى تصلح.
`,tf("الـ design pattern مكتبة جاهزة تستوردها في مشروعك وتستدعي دوالها.",false,"الـ pattern فكرة تصميم تُنفَّذ من جديد وتُكيَّف في كل مشروع، لا قطعة كود تُستورد. بعض المكتبات تطبّق patterns لكنها ليست هي الـ pattern."));
C("Why Design Patterns Are Needed",R`
ثلاث فوائد رئيسية:
- <b>حلول مجرَّبة</b>: بدل اختراع حل قد يفشل، تبدأ من حل اختبره آلاف المطورين وعُرفت عيوبه مسبقاً.
- <b>مفردات مشتركة</b>: جملة «نستخدم Observer هنا» تختصر عشر دقائق من الشرح بين أعضاء الفريق.
- <b>تصميم يتحمّل التغيير</b>: أغلب الـ patterns تعزل نقطة تغيّر متوقعة، فيصبح التعديل المستقبلي محلياً.

وهي أيضاً مفتاح لقراءة الـ frameworks: حين تعرف أن Django middleware تطبيق لـ Chain of Responsibility تفهمه فوراً.

C("The Relationship Between OOP and Design Patterns",R`
OOP يعطيك <b>الأدوات</b>: classes، interfaces، inheritance، polymorphism، composition. لكنه لا يخبرك <b>كيف تركّبها</b> لتحصل على تصميم مرن.

الـ design patterns هي «الخبرة المتراكمة» في استخدام تلك الأدوات. أغلب الـ patterns تتكوّن من مكوّنين درستهما:
- <b>Polymorphism عبر interface</b>: ليعتمد الـ client على تجريد.
- <b>Composition + delegation</b>: ليُبدَّل السلوك دون وراثة.

لذلك من أتقن Phase 0 سيجد أن كل pattern «تركيبة مألوفة باسم جديد».

C("Reusable Solutions vs. Reusable Code",R`
<b>Reusable code</b>: كود تستخدمه كما هو — دالة، مكتبة، package. تستورده وتستدعيه.

<b>Reusable solution</b>: <b>فكرة</b> حل تعيد تنفيذها كل مرة بتفاصيل مختلفة. الـ pattern من هذا النوع.

مثال: مكتبة <code>requests</code> في Python كود قابل لإعادة الاستخدام. أما «أغلّف الـ API الخارجي بـ class يوافق واجهتي» (Adapter) فحلّ تعيد كتابته لكل API بشكل مختلف.

لهذا لا يوجد «أفضل تنفيذ» لـ pattern؛ يوجد التنفيذ المناسب لسياقك ولغتك.

C("Design Patterns vs. Algorithms",R`
<b>Algorithm</b>: سلسلة خطوات محددة لحل مشكلة <b>حسابية</b> (ترتيب، بحث، أقصر مسار). تُقاس بالصحة والتعقيد مثل $O(n \log n)$.

<b>Design pattern</b>: طريقة <b>تنظيم</b> الكود — من يعرف من، ومن المسؤول عن ماذا. تُقاس بالمرونة وسهولة الصيانة.

تشبيه: الخوارزمية وصفة طبخ بخطوات دقيقة؛ الـ pattern هو طريقة ترتيب المطبخ.

يجتمعان: Strategy pattern ينظّم كيف تبدّل بين خوارزميتَي ترتيب، لكنه لا يخبرك كيف ترتّب.

C("Design Patterns vs. Architectural Patterns",R`
الفرق في <b>المستوى</b> (scope):

<b>Architectural pattern</b>: ينظّم النظام كله أو جزءاً كبيراً منه. أمثلة: Layered Architecture، MVC، Microservices، Client–Server.

<b>Design pattern</b>: ينظّم مجموعة صغيرة من الـ classes داخل مكوّن واحد. أمثلة: Singleton، Adapter، Observer.

تحت الاثنين مستوى ثالث يُسمّى <b>idiom</b>: أسلوب خاص بلغة معيّنة (مثل context manager بـ <code>with</code> في Python).

الحدود ليست صارمة دائماً: MVC يُعدّ architectural pattern لكنه مبني داخلياً من design patterns (Observer و Strategy و Composite) كما سنرى في Module 3.

C("When to Use and When Not to Use Design Patterns",R`
<b>استخدم pattern حين:</b>
- توجد مشكلة فعلية تراها في الكود الآن (تكرار، if/else على الأنواع، صعوبة اختبار).
- يوجد تغيّر متوقع <b>بدليل</b> (حدث مرتين، أو مطلوب في الخطة).
- يكون الكود بعد الـ pattern أوضح لقارئه.

<b>لا تستخدمه حين:</b>
- المشكلة بسيطة يحلّها <code>if</code> واحد أو دالة.
- الدافع «قد نحتاجه يوماً» دون دليل (هذا يخالف YAGNI).
- الدافع إظهار المعرفة. إقحام الـ patterns يُسمّى <b>overengineering</b> أو «pattern fever».

قاعدة «الثلاثة»: المرة الأولى اكتب الحل المباشر، الثانية تحمّل التكرار، الثالثة أعد الهيكلة نحو pattern.

كل pattern له ثمن: classes أكثر، قفزات أكثر لتتبّع الكود (indirection). السؤال دائماً: هل المنفعة تفوق الثمن؟

C("The Structure of a Design Pattern",R`
كل pattern يُوثَّق بالعناصر نفسها. تعلّم أن تسأل هذه الأسئلة الستة عن أي pattern:
<div class="tw"><table><tr><th>العنصر</th><th>السؤال</th><th>مثال: Adapter</th></tr>
<tr><td><b>Problem</b></td><td>ما المشكلة المتكررة؟</td><td>أريد استخدام class واجهته لا توافق ما يتوقعه كودي.</td></tr>
<tr><td><b>Context</b></td><td>في أي ظروف تظهر؟</td><td>مكتبة خارجية أو نظام قديم لا أستطيع تعديله.</td></tr>
<tr><td><b>Solution</b></td><td>كيف يحلّها؟</td><td>class وسيط يطبّق واجهتي ويترجم الاستدعاءات.</td></tr>
<tr><td><b>Participants</b></td><td>ما الـ classes المشاركة وأدوارها؟</td><td>Client، Target، Adapter، Adaptee.</td></tr>
<tr><td><b>Relationships</b></td><td>كيف تتواصل؟</td><td>Client يستدعي Target؛ Adapter يفوّض إلى Adaptee.</td></tr>
<tr><td><b>Consequences</b></td><td>ما المكاسب والأثمان؟</td><td>فصل وإعادة استخدام، مقابل class إضافي وطبقة indirection.</td></tr></table></div>
أهم عنصر يهمله المبتدئون هو <b>Consequences</b>: لا يوجد pattern بلا ثمن، ومعرفة الثمن هي ما يميّز المصمّم عن الحافظ.

سنتّبع هذا الترتيب في كل pattern قادم: المشكلة ← الحل والمشاركون ← مثال ← trade-offs.

C("Creational, Structural, Behavioral",R`
صنّف GoF الـ 23 pattern حسب <b>الغرض</b>:
<div class="tw"><table><tr><th>الفئة</th><th>السؤال الذي تجيب عنه</th><th>أمثلة</th></tr>
<tr><td><b>Creational</b></td><td>كيف تُنشأ الكائنات؟ من يقرر أي class يُنشأ؟</td><td>Singleton، Factory Method، Abstract Factory، Builder، Prototype</td></tr>
<tr><td><b>Structural</b></td><td>كيف تُركَّب الـ classes والـ objects في بنى أكبر؟</td><td>Adapter، Bridge، Composite، Decorator، Facade، Flyweight، Proxy</td></tr>
<tr><td><b>Behavioral</b></td><td>كيف تتواصل الكائنات وتتوزع المسؤوليات؟</td><td>Strategy، Observer، Command، State، Template Method...</td></tr></table></div>
العدد: $5 + 7 + 11 = 23$.

يوجد تصنيف ثانوي حسب <b>النطاق</b>: <b>class patterns</b> تعتمد الوراثة وتُحسم وقت الترجمة (مثل Template Method و Factory Method)، و <b>object patterns</b> تعتمد composition وتتبدّل وقت التشغيل (الأغلبية).

طريقة سريعة للتصنيف: هل المشكلة في <b>ولادة</b> الكائن (creational)، أم في <b>شكل</b> ارتباطه بغيره (structural)، أم في <b>حواره</b> مع غيره (behavioral)؟

@@
لا عيب فيها في الحالات البسيطة. المشكلة تظهر حين تنتشر: كل <code>new ConcreteClass()</code> يربط الكود المحيط به بذلك الـ class تحديداً. إن أردت لاحقاً <code>SmsNotifier</code> فعليك تعديل كل موضع فيه <code>new EmailNotifier()</code>.

القاعدة: <code>new</code> آمنة مع الكائنات البسيطة المستقرة (قيم، قوائم، نصوص)، ومصدر اقتران مع الكائنات التي لها <b>بدائل</b> أو تمثّل <b>خدمات خارجية</b>.

C("Constructor-Based Creation",R`
الـ <b>constructor</b> method خاصة تُنفَّذ عند الإنشاء لتضع الكائن في حالة صحيحة من أول لحظة.
@@
class Money {
    private final long cents; private final String currency;
    Money(long cents, String currency) {
        if (cents < 0) throw new IllegalArgumentException("negative");
        this.cents = cents; this.currency = currency;
    }
}
@@
حدودها:
- <b>لا اسم لها</b>: <code>new Color(255, 0, 0)</code> لا يوضّح هل الأرقام RGB أم HSL.
- <b>تعيد دائماً كائناً جديداً من هذا الـ class بالذات</b>: لا تستطيع إرجاع subclass أو كائن مخزَّن.
- مع parameters كثيرة تصبح غير مقروءة (<b>telescoping constructor</b>): <code>new Pizza(12, true, false, true, null, 2)</code>.

هذه الحدود الثلاثة هي ما تعالجه factory functions و Builder.
`,mc("أي مما يلي <b>لا</b> يستطيع الـ constructor فعله؟",["التحقق من صحة الـ parameters","إرجاع كائن من subclass مختلف حسب الـ parameter","تهيئة الـ fields","رمي exception عند قيمة خاطئة"],1,"الـ constructor ينتج دائماً instance من الـ class الذي عُرّف فيه. اختيار النوع المُرجَع يحتاج factory."));
C("Factory Functions",R`
<b>Factory function</b> (في Java: <b>static factory method</b>): دالة عادية مهمتها إنشاء كائن وإرجاعه. بخلاف الـ constructor: لها <b>اسم</b>، وتستطيع إرجاع <b>أي subtype</b>، أو كائناً <b>مخزَّناً</b> مسبقاً.
@@
class Color {
    private Color(int r, int g, int b) { /* ... */ }           // constructor مخفي
    static Color fromRgb(int r, int g, int b) { return new Color(r, g, b); }
    static Color fromHex(String hex) { /* parse then create */ return null; }
}
Color c = Color.fromHex("ff0000");      // الاسم يشرح المقصود
@@
وحين تختار النوع حسب parameter تُسمّى غالباً <b>Simple Factory</b>:
@@
class NotifierFactory {
    static Notifier create(String channel) {
        switch (channel) {
            case "email": return new EmailNotifier();
            case "sms":   return new SmsNotifier();
            default: throw new IllegalArgumentException(channel);
        }
    }
}
@@
الفائدة: قرار «أي class» صار في <b>مكان واحد</b>.

! Simple Factory ليست من الـ 23 GoF pattern، وهي ليست Factory Method. سنفرّق بينهما بدقة بعد قليل.

الجواب: في مكان واحد أعلى التطبيق يُسمّى <b>Composition Root</b> (مثل <code>main</code> أو ملف الإعدادات)، وهناك فقط تظهر أسماء الـ concrete classes. بقية الكود يستلم تبعياته جاهزة.

C("Object Lifecycle Management",R`
<b>Lifecycle</b> (دورة الحياة): متى يُنشأ الكائن، كم يعيش، ومن ينهيه ويحرّر موارده.

الأنماط الشائعة (تُسمّى scopes أو lifetimes في أدوات DI):
- <b>Transient</b>: كائن جديد في كل مرة يُطلب. للكائنات الخفيفة عديمة الحالة المشتركة.
- <b>Scoped</b>: كائن واحد ضمن نطاق محدد، مثل HTTP request واحد (مثال: database session).
- <b>Singleton scope</b>: كائن واحد طيلة عمر التطبيق (مثال: connection pool، إعدادات).

وللكائنات التي تمسك موارد (ملف، اتصال) يجب <b>إغلاق صريح</b>: <code>try-with-resources</code> في Java و <code>with</code> في Python.

أسئلة تطرحها على كل كائن مهم: هل يحمل حالة؟ هل تُشارَك بين مستخدمين أو threads؟ هل إنشاؤه مكلف؟ الإجابات تحدد الـ lifecycle، ومنها تفهم دوافع Singleton و Flyweight و Proxy و Prototype.

<b>الحل:</b> الـ class نفسه يمنع إنشاء أكثر من instance:
- constructor <b>خاص</b> (private) فلا يستطيع أحد كتابة <code>new</code>.
- field ساكن (static) يحمل النسخة الوحيدة.

C("Controlling Global Access to an Object",R`
Singleton يقدّم أمرين معاً، ومن المهم فصلهما ذهنياً:
- <b>نسخة واحدة</b> (single instance).
- <b>نقطة وصول عامة</b> (global access point): أي كود في أي مكان يستطيع استدعاء <code>AppConfig.getInstance()</code>.

الفرق عن متغيّر global عادي: الوصول يمرّ عبر method، فيستطيع الـ class التحكم (إنشاء مؤجل، قفل، تسجيل)، ولا يستطيع أحد استبدال الكائن بآخر.

لكن «الوصول العام» هو نفسه مصدر أكبر عيوب Singleton: حين يستطيع كل class الوصول إليه <b>تختفي التبعية</b> من توقيع الـ constructor، فلا تعرف من يعتمد عليه إلا بقراءة كل الكود.

! كثيراً ما تحتاج «نسخة واحدة» دون «وصول عام»: أنشئ كائناً واحداً في الـ Composition Root ومرّره بـ DI.

    }

C("Thread Safety",R`
<b>Thread</b>: مسار تنفيذ مستقل داخل البرنامج؛ الخوادم تشغّل عدة threads معاً. <b>Thread-safe</b> يعني أن الكود يبقى صحيحاً حين تنفّذه عدة threads في الوقت نفسه.

مشكلة النسخة lazy البسيطة (<b>race condition</b>): thread A يفحص <code>instance == null</code> فيجده صحيحاً، وقبل أن ينشئ يدخل thread B فيفحص ويجده صحيحاً أيضاً. النتيجة: نسختان!

الحلول من الأبسط:
@@
// 1) synchronized: صحيح لكن يقفل مع كل استدعاء
public static synchronized AppConfig getInstance() { /* ... */ }

// 2) Double-checked locking: القفل عند الإنشاء فقط. volatile ضرورية!
private static volatile AppConfig instance;
public static AppConfig getInstance() {
    if (instance == null) {
        synchronized (AppConfig.class) {
            if (instance == null) instance = new AppConfig();
        }
    }
    return instance;
}

// 3) Holder idiom: lazy وآمن دون أقفال، يعتمد على ضمانات تحميل الـ classes
private static class Holder { static final AppConfig I = new AppConfig(); }
public static AppConfig getInstance() { return Holder.I; }

// 4) enum: الأبسط والأكثر أماناً في Java
public enum AppConfig { INSTANCE; }
@@

<b>المزايا:</b>
- ضمان نسخة واحدة لمورد يجب ألا يتكرر.
- وصول سهل من أي مكان.
- إمكان التهيئة المؤجَّلة.

<b>العيوب:</b>
- يخالف Single Responsibility: الـ class يدير عمله <b>و</b>يدير عدد نسخه.
- <b>تبعيات مخفية</b>: لا تظهر في الـ constructors.
- اقتران عالٍ: كل مستخدميه مرتبطون بـ concrete class عبر استدعاء static.
- صعوبة الاختبار (الدرس التالي).
- تعقيد في البيئات متعددة الـ threads، و«واحد» يصبح غامضاً مع عدة processes أو servers.

لهذه الأسباب يصنّفه كثير من المطورين اليوم كـ anti-pattern <b>حين يُستخدم كمتغيّر global مقنّع</b>.

C("What Is Factory Method? Separating Object Creation from Object Usage",R`
<b>المشكلة:</b> class يحتوي منطقاً عاماً ثابتاً، لكنه في لحظة ما يحتاج إنشاء كائن لا يعرف نوعه المحدد مسبقاً.

<b>الحل (تعريف GoF):</b> عرّف method للإنشاء في الـ class الأب، واترك الـ <b>subclasses تقرر</b> أي class تُنشئ. تُسمّى هذه الـ method بـ <b>factory method</b>.

الفكرة الجوهرية فصل أمرين:
- <b>الاستخدام</b>: كود يتعامل مع الكائن عبر interface.
- <b>الإنشاء</b>: سطر <code>new ConcreteX()</code> الوحيد، معزول في method.
@@
abstract class NotificationService {                  // Creator
    protected abstract Notifier createNotifier();     // factory method

    public void notifyUser(String user, String text) {   // منطق ثابت يستخدم المنتج
        Notifier n = createNotifier();
        n.send(user, "[MyApp] " + text);
    }
}
class EmailNotificationService extends NotificationService {   // ConcreteCreator
    protected Notifier createNotifier() { return new EmailNotifier(); }
}
class SmsNotificationService extends NotificationService {
    protected Notifier createNotifier() { return new SmsNotifier(); }
}
@@
<code>notifyUser</code> لا تذكر Email ولا SMS إطلاقاً.

والثالث <b>Abstract Factory</b> (لاحقاً): كائن ينشئ <b>عائلة</b> منتجات مترابطة.

ملاحظة مهمة: الـ <b>Creator</b> في Factory Method ليست وظيفته الأساسية الإنشاء! وظيفته منطق عمل يحتاج منتجاً، والـ factory method مجرد «فتحة» يملؤها الأبناء.

عملياً: ابدأ بـ Simple Factory فهي تكفي أغلب الحالات. انتقل إلى Factory Method حين يكون لديك أصلاً هرم Creators، أو حين تبني framework يحدد مستخدموه أنواعهم.

المشاركون الأربعة في Factory Method:
- <b>Product</b>: الـ interface المشترك لكل ما تنتجه الـ factory. (<code>Notifier</code>)
- <b>ConcreteProduct</b>: تنفيذ محدد. (<code>EmailNotifier</code>، <code>SmsNotifier</code>، <code>PushNotifier</code>)
- <b>Creator</b>: يعلن الـ factory method ونوع إرجاعها هو Product.
- <b>ConcreteCreator</b>: ينفّذها ويعيد ConcreteProduct.

class PushNotifier  implements Notifier { public void send(String to, String t) { } }

C("Simplifying Complex Subsystems & Providing a Unified Interface",R`
<b>Subsystem</b>: مجموعة classes تتعاون لأداء وظيفة (مثل مكتبة ترميز فيديو فيها عشرات الـ classes).

<b>المشكلة:</b> لتنفيذ مهمة بسيطة على الـ client أن يعرف classes كثيرة، ترتيب استدعائها، وكيفية تهيئتها.

<b>الحل:</b> <b>Facade</b> — class واحد يقدّم methods بسيطة عالية المستوى، وينسّق داخلياً بين classes النظام الفرعي.

مثال الـ roadmap — خدمة دفع:
@@
class PaymentFacade {
    private final CardValidator validator;
    private final PaymentProcessor processor;
    private final ReceiptGenerator receipts;
    PaymentFacade(CardValidator v, PaymentProcessor p, ReceiptGenerator r) {
        validator = v; processor = p; receipts = r;
    }
    public Receipt pay(Card card, Money amount) {            // عملية واحدة للـ client
        if (!validator.isValid(card)) throw new PaymentException("invalid card");
        String txId = processor.charge(card, amount);
        return receipts.generate(txId, amount);
    }

interface FileSystemItem { long size(); String name(); }

class File implements FileSystemItem {                  // Leaf
    private final String name; private final long bytes;
    File(String n, long b) { name = n; bytes = b; }
    public long size() { return bytes; }
    public String name() { return name; }
}
class Directory implements FileSystemItem {             // Composite
    private final String name;
    private final List<FileSystemItem> children = new ArrayList<>();
    Directory(String n) { name = n; }
    void add(FileSystemItem item) { children.add(item); }
    public long size() {                                // recursion
        long total = 0;
        for (FileSystemItem c : children) total += c.size();
        return total;
    }
    public String name() { return name; }
}

interface ProductService { Product find(String id); }                  // Component

class DbProductService implements ProductService {                     // ConcreteComponent
    public Product find(String id) { /* SQL query */ return null; }
}
class LoggingProductService implements ProductService {                // Decorator
    private final ProductService inner;
    LoggingProductService(ProductService inner) { this.inner = inner; }
    public Product find(String id) {
        System.out.println("find " + id);          // قبل
        Product p = inner.find(id);                // تفويض
        System.out.println("done " + id);          // بعد
        return p;
    }
}
class CachingProductService implements ProductService {                // Decorator
    private final ProductService inner;
    private final Map<String, Product> cache = new HashMap<>();
    CachingProductService(ProductService inner) { this.inner = inner; }
    public Product find(String id) {
        return cache.computeIfAbsent(id, inner::find);   // لا يستدعي الداخل إن وُجدت النتيجة
    }
}
// التركيب: الطبقات تُبنى من الداخل إلى الخارج

                         new CachingProductService(

C("Decorator vs. Inheritance",R`
بالوراثة تحتاج subclass لكل <b>تركيبة</b>. إن كان عندك $n$ سلوكاً اختيارياً مستقلاً فعدد التركيبات الممكنة:
$$2^n$$
مع ثلاثة سلوكيات (logging، caching، auth): $2^3 = 8$ classes، ومع خمسة: $32$. بالـ Decorator تحتاج $n$ classes فقط وتركّبها كما تشاء.

<b>Consequences:</b>
- ✓ كل decorator مسؤولية واحدة (SRP)، وإضافة سلوك جديد لا تعدّل موجوداً (OCP).
- ✗ كائنات صغيرة كثيرة، وتتبّع الأخطاء عبر الطبقات أصعب.
- ✗ هوية الكائن تتغير: الـ decorator ليس هو الكائن الأصلي عند المقارنة بـ <code>==</code>.

<b>Decorator أم Proxy؟</b> البنية متطابقة تقريباً والفرق في <b>النيّة</b>: Decorator <b>يضيف مسؤوليات</b> ويُركَّب طبقات بيد الـ client؛ Proxy <b>يتحكم في الوصول</b> وغالباً يدير دورة حياة الأصل بنفسه.

<b>المشكلة:</b> كائن له parameters كثيرة، أغلبها اختياري، فيصبح الـ constructor طويلاً وغامضاً (telescoping constructor)، أو يتطلب بناؤه خطوات مرتبة.

<b>الحل:</b> <b>Builder</b> — كائن مساعد تضبط عليه القيم خطوة خطوة بـ methods مسمّاة، ثم تستدعي <code>build()</code> فيتحقق ويعيد الكائن النهائي.

class HttpRequest {
    private final String url, method; private final Map<String,String> headers; private final int timeoutMs;
    private HttpRequest(Builder b) { url = b.url; method = b.method; headers = b.headers; timeoutMs = b.timeoutMs; }

    static class Builder {
        private final String url;                        // إلزامي
        private String method = "GET";                   // قيم افتراضية
        private final Map<String,String> headers = new HashMap<>();
        private int timeoutMs = 5000;
        Builder(String url) { this.url = url; }
        Builder method(String m) { method = m; return this; }          // return this = fluent
        Builder header(String k, String v) { headers.put(k, v); return this; }
        Builder timeout(int ms) { timeoutMs = ms; return this; }
        HttpRequest build() {
            if (timeoutMs <= 0) throw new IllegalStateException("timeout");
            return new HttpRequest(this);                // الكائن الناتج immutable
        }
    }
}

        .method("POST").header("Accept", "application/json").timeout(2000).build();

interface Shape { Shape copy(); }
class Circle implements Shape {
    int x, y, radius; Style style;
    public Shape copy() {
        Circle c = new Circle();
        c.x = x; c.y = y; c.radius = radius;
        c.style = style.copy();          // deep copy للجزء القابل للتغيير
        return c;
    }
}
@@
المفهوم الحرج:
- <b>Shallow copy</b>: تُنسخ الحقول كما هي، فالنسخة والأصل <b>يتشاركان</b> الكائنات الداخلية.
- <b>Deep copy</b>: تُنسخ الكائنات الداخلية أيضاً، فيستقل الاثنان تماماً.

في Python: <code>copy.copy(obj)</code> و <code>copy.deepcopy(obj)</code>.

<b>المشكلة:</b> class يتنوع في <b>بُعدين مستقلين</b>، والوراثة تجبرك على class لكل تركيبة. مثال: إشعارات بأنواع (عادي، عاجل، تذكير) × قنوات (Email، SMS، Push).

<b>الحل:</b> <b>Bridge</b> — افصل البعدين إلى هرمين مستقلين يربطهما composition («الجسر»):
- <b>Abstraction</b>: البعد الظاهر للـ client (نوع الإشعار).
- <b>Implementation</b>: البعد التنفيذي (القناة).

interface Channel { void deliver(String to, String body); }           // Implementation
class EmailChannel implements Channel { public void deliver(String to, String b) { } }
class SmsChannel   implements Channel { public void deliver(String to, String b) { } }

abstract class Notification {                                          // Abstraction
    protected final Channel channel;                                   // الجسر
    Notification(Channel c) { channel = c; }
    abstract void send(String to, String text);
}
class UrgentNotification extends Notification {
    UrgentNotification(Channel c) { super(c); }
    void send(String to, String text) { channel.deliver(to, "URGENT: " + text); }
}

<b>المشكلة:</b> عدد هائل من الكائنات المتشابهة يستهلك الذاكرة. مثال: محرّر نصوص فيه مليون حرف، ولكل حرف خط ولون وحجم.

<b>الحل:</b> <b>Flyweight</b> — افصل حالة الكائن إلى:
- <b>Intrinsic state</b> (داخلية): مشتركة وثابتة (immutable) — مثل الخط واللون والحجم. تُخزَّن <b>مرة واحدة</b> في كائن مشترك.
- <b>Extrinsic state</b> (خارجية): خاصة بكل موضع — مثل موقع الحرف. تُمرَّر من الخارج عند الاستخدام.

و factory تحتفظ بالكائنات المشتركة وتعيد الموجود بدل إنشاء جديد.
@@
final class CharStyle {                                   // Flyweight: immutable
    final String font; final int size; final String color;
    CharStyle(String f, int s, String c) { font = f; size = s; color = c; }
}
class StyleFactory {
    private final Map<String, CharStyle> pool = new HashMap<>();
    CharStyle get(String f, int s, String c) {
        return pool.computeIfAbsent(f + s + c, k -> new CharStyle(f, s, c));
    }
}
@@
تقدير التوفير: إن كان عدد الكائنات $N$، وحجم الحالة الداخلية $s_i$ والخارجية $s_e$، وعدد التركيبات الفريدة $U$ حيث $U$ أصغر كثيراً من $N$:
$$\text{before} \approx N(s_i + s_e) \qquad \text{after} \approx N \cdot s_e + U \cdot s_i$$

- <b>Adapter</b>: يغيّر الواجهة.
- <b>Decorator</b>: نفس الواجهة + مسؤوليات إضافية.
- <b>Proxy</b>: نفس الواجهة + تحكم في الوصول.

C("Strategy: خوارزميات قابلة للتبديل",R`
<b>المشكلة:</b> عملية واحدة لها عدة طرق تنفيذ (خوارزميات)، والاختيار بينها يتغير حسب الحالة أو وقت التشغيل. الحل الساذج: <code>if/else</code> طويل داخل الـ class، يكبر مع كل طريقة جديدة.

<b>الحل:</b> <b>Strategy</b> — ضع كل خوارزمية في class مستقل خلف interface مشترك، واجعل الكائن الأصلي (<b>Context</b>) يحمل واحدة منها ويفوّض إليها.

مثال (تمرين 2.7): طرق الدفع.
@@
interface PaymentStrategy { void pay(long cents); }                      // Strategy

class CardPayment implements PaymentStrategy {                            // ConcreteStrategy
    public void pay(long cents) { /* charge card */ }
}
class WalletPayment implements PaymentStrategy {
    public void pay(long cents) { /* debit wallet */ }
}
class Checkout {                                                          // Context
    private PaymentStrategy payment;
    Checkout(PaymentStrategy p) { payment = p; }
    void setPayment(PaymentStrategy p) { payment = p; }                   // تبديل وقت التشغيل
    void complete(long total) { payment.pay(total); }                     // تفويض
}
@@
الـ <code>Checkout</code> لا يحتوي أي <code>if</code> على طريقة الدفع. إضافة <code>CryptoPayment</code> = class جديد فقط.

C("Defining the Skeleton of an Algorithm",R`
<b>المشكلة:</b> عدة classes تنفّذ العملية نفسها <b>بالخطوات نفسها وبالترتيب نفسه</b>، وتختلف في تفاصيل خطوة أو اثنتين. النتيجة كود مكرر في كل class.

<b>الحل:</b> <b>Template Method</b> — method في الـ class الأب تحدد <b>هيكل</b> (skeleton) الخوارزمية كسلسلة استدعاءات لخطوات، وتترك بعض الخطوات مجرّدة ينفّذها الأبناء.

مثال الـ roadmap — مستوردو ملفات:

    public final void importFile(String path) {      // template method: final لمنع تغيير الترتيب

        List<Record> records = parse(raw);            // خطوة متغيرة
        validate(records);
        save(records);
        afterImport(records.size());                  // hook
    }
    private String read(String path) { /* ثابت */ return ""; }
    protected abstract List<Record> parse(String raw);          // يجب أن ينفّذها الابن
    protected void validate(List<Record> r) { /* تنفيذ افتراضي */ }
    private void save(List<Record> r) { /* ثابت */ }
    protected void afterImport(int count) { }                   // hook: فارغ افتراضياً
}
class CsvImporter extends DataImporter {
    protected List<Record> parse(String raw) { /* split by commas */ return null; }
}
class JsonImporter extends DataImporter {
    protected List<Record> parse(String raw) { /* parse JSON */ return null; }
}

<b>المشكلة:</b> طلب يجب أن يمرّ بعدة فحوص أو معالجات متتالية، وعددها وترتيبها قد يتغير. الحل الساذج: دالة واحدة ضخمة فيها كل الفحوص متتابعة.

<b>الحل:</b> <b>Chain of Responsibility</b> — كل فحص في كائن مستقل (<b>handler</b>). الـ handlers مربوطة كسلسلة؛ كل واحد يقرر: أعالج الطلب؟ أوقفه؟ أمرّره إلى التالي؟

المرسل لا يعرف أي handler سيعالج طلبه؛ يعطيه لأول السلسلة فقط. هذا يفصل <b>المرسل</b> عن <b>المستقبل</b>.

تشبيه: الدعم الفني — موظف المستوى الأول، فإن لم يحلّ المشكلة حوّلها إلى الثاني، ثم إلى المهندس.

C("Handler Interface and Concrete Handlers",R`
الأدوار:
- <b>Handler</b>: الواجهة؛ فيها method المعالجة ووسيلة ربط التالي.
- <b>ConcreteHandler</b>: منطق فحص واحد.
- <b>Client</b>: يبني السلسلة ويرسل الطلب.

مثال الـ roadmap — طلب HTTP:
@@
abstract class Handler {
    private Handler next;
    public Handler linkWith(Handler next) { this.next = next; return next; }   // يسمح بالتسلسل
    public Response handle(Request req) {                                      // السلوك الافتراضي: مرّر
        return next != null ? next.handle(req) : Response.ok();
    }
}
class AuthHandler extends Handler {
    public Response handle(Request req) {
        if (req.token() == null) return Response.status(401);      // يوقف السلسلة
        return super.handle(req);                                   // يمرّر
    }
}
class PermissionHandler extends Handler {
    public Response handle(Request req) {
        if (!req.user().can(req.action())) return Response.status(403);
        return super.handle(req);
    }
}
class ValidationHandler extends Handler {
    public Response handle(Request req) {
        if (req.body().isEmpty()) return Response.status(400);
        return super.handle(req);
    }
}
class LoggingHandler extends Handler {
    public Response handle(Request req) {
        System.out.println(req.path());
        return super.handle(req);                                   // يعالج ويمرّر دائماً
    }
}

<b>الشكل الكلاسيكي (GoF):</b> handler <b>واحد</b> فقط يعالج الطلب، والبقية يمرّرون. مثال: الموافقة على مصروف — المشرف حتى حدّ معيّن، ثم المدير، ثم المدير المالي.

<b>شكل الـ pipeline:</b> <b>كل</b> handler يؤدي جزءاً من العمل ثم يمرّر، وأي واحد يستطيع قطع السلسلة (<b>short-circuit</b>). هذا شكل مثالنا وشكل الـ <b>middleware</b> في الـ web frameworks.

خيارات كل handler:
- يعالج ويوقف.
- يعالج ويمرّر.
- يمرّر دون معالجة.

خطر يجب الانتباه له: طلب يصل إلى نهاية السلسلة <b>دون أن يعالجه أحد</b>. ضع handler افتراضياً في النهاية أو قيمة إرجاع واضحة.

<b>State</b> (حالة) هنا تعني «وضعاً» يمرّ به الكائن ويحدد كيف يستجيب: طلب «Pending» يمكن إلغاؤه، وطلب «Shipped» لا يمكن.

<b>المشكلة:</b> كل method في الكائن تبدأ بـ <code>switch (status)</code>:
@@
void cancel() {
    if (status == PENDING) { status = CANCELLED; refund(); }
    else if (status == CONFIRMED) { status = CANCELLED; refund(); restock(); }
    else if (status == SHIPPED) { throw new IllegalStateException("already shipped"); }
    else if (status == DELIVERED) { /* ... */ }
    // ونفس السلسلة في ship() و confirm() و deliver()...
}
@@
مع $s$ حالات و $m$ عمليات، عدد الفروع التي تصونها يقارب $s \times m$ موزعة على كل الـ methods. إضافة حالة تعني تعديل <b>كل</b> method.

<b>الحل:</b> <b>State</b> — class لكل حالة يحتوي سلوك كل العمليات <b>في تلك الحالة</b>. الكائن الأصلي يحمل الحالة الحالية ويفوّض إليها.

interface OrderState {
    void confirm(Order o);
    void ship(Order o);
    void cancel(Order o);
    String name();
}
class Order {                                                   // Context
    private OrderState state = new PendingState();
    void setState(OrderState s) { state = s; }
    public void confirm() { state.confirm(this); }               // تفويض بلا شروط
    public void ship()    { state.ship(this); }
    public void cancel()  { state.cancel(this); }
    public String status() { return state.name(); }
}
class PendingState implements OrderState {
    public void confirm(Order o) { o.setState(new ConfirmedState()); }
    public void ship(Order o)    { throw new IllegalStateException("confirm first"); }
    public void cancel(Order o)  { o.setState(new CancelledState()); }
    public String name() { return "PENDING"; }
}
class ShippedState implements OrderState {
    public void confirm(Order o) { throw new IllegalStateException("already confirmed"); }
    public void ship(Order o)    { throw new IllegalStateException("already shipped"); }
    public void cancel(Order o)  { throw new IllegalStateException("cannot cancel shipped order"); }
    public String name() { return "SHIPPED"; }
}

C("Command Interface, Concrete Commands, Invoker and Receiver",R`
الأدوار الأربعة:
- <b>Command</b>: واجهة فيها <code>execute()</code> (وغالباً <code>undo()</code>).
- <b>ConcreteCommand</b>: يحمل الـ Receiver والـ parameters ويستدعي عليه العملية.
- <b>Receiver</b>: الكائن الذي يعرف <b>كيف</b> يُؤدّى العمل فعلاً.
- <b>Invoker</b>: يطلب التنفيذ <b>متى</b> أراد، ولا يعرف شيئاً عن الـ Receiver.
- (الـ <b>Client</b> ينشئ الـ commands ويربطها بالـ receivers.)

interface Command { void execute(); void undo(); }

class TextDocument {                                   // Receiver
    private final StringBuilder text = new StringBuilder();
    void insert(int pos, String s) { text.insert(pos, s); }
    void delete(int pos, int len) { text.delete(pos, pos + len); }
}
class InsertCommand implements Command {               // ConcreteCommand
    private final TextDocument doc; private final int pos; private final String s;
    InsertCommand(TextDocument d, int pos, String s) { doc = d; this.pos = pos; this.s = s; }
    public void execute() { doc.insert(pos, s); }
    public void undo()    { doc.delete(pos, s.length()); }     // العملية المعاكسة
}

الـ pattern يفصل ثلاثة أسئلة كانت ملتصقة في استدعاء الـ method العادي:

- <b>كيف</b> يُنفَّذ؟ ← يعرفه الـ Receiver.

النتيجة: الـ Invoker عام تماماً. زرّ في واجهة، بند في قائمة، اختصار لوحة مفاتيح، مهمة مجدولة — كلها invokers تستدعي <code>command.execute()</code> دون معرفة ما وراءه. ويمكن ربط الـ command نفسه بعدة invokers.

في اللغات الحديثة، command بلا undo قد يكون مجرد دالة أو lambda. تحتاج class كاملاً حين يحمل الـ command حالة أو يدعم التراجع.

C("Undo and Redo Operations",R`
<b>Undo</b>: التراجع عن آخر عملية. <b>Redo</b>: إعادة تنفيذ ما تراجعت عنه. يُبنيان بـ <b>stack</b>ين (stack: بنية «آخر داخل أول خارج»):
@@
class CommandHistory {                                // Invoker
    private final Deque<Command> undoStack = new ArrayDeque<>();
    private final Deque<Command> redoStack = new ArrayDeque<>();

    void run(Command c) {
        c.execute();
        undoStack.push(c);
        redoStack.clear();                 // عملية جديدة تلغي تاريخ الـ redo
    }
    void undo() {
        if (undoStack.isEmpty()) return;
        Command c = undoStack.pop();
        c.undo();
        redoStack.push(c);
    }
    void redo() {
        if (redoStack.isEmpty()) return;
        Command c = redoStack.pop();
        c.execute();
        undoStack.push(c);
    }
}
@@
طريقتان لتنفيذ <code>undo()</code> داخل الـ command:
- <b>العملية المعاكسة</b>: الإدراج يُعكس بالحذف. خفيفة، لكن ليست كل عملية قابلة للعكس.
- <b>حفظ الحالة السابقة</b>: الـ command يحتفظ بما كان قبل التنفيذ ويعيده (هذا يتقاطع مع Memento).

لماذا <code>redoStack.clear()</code>؟ إن تراجعت ثم نفّذت عملية جديدة، فإعادة العمليات القديمة ستُطبَّق على حالة لم تعد موجودة.

<b>الحل:</b> <b>Observer</b> — علاقة <b>one-to-many</b>:
- <b>Subject</b> (يُسمّى أيضاً Publisher أو Observable): الكائن الذي يحدث فيه التغيير. يحتفظ بقائمة مهتمين ولا يعرف عنهم إلا واجهة.

ثلاث عمليات على الـ Subject:
- <b>subscribe</b> (attach): تسجيل observer.
- <b>unsubscribe</b> (detach): إلغاء التسجيل.
- <b>notify</b>: المرور على القائمة واستدعاء كل observer.

مثال الـ roadmap:
@@
interface OrderObserver { void onOrderCreated(Order order); }          // Observer

class OrderService {                                                    // Subject
    private final List<OrderObserver> observers = new ArrayList<>();
    public void subscribe(OrderObserver o)   { observers.add(o); }
    public void unsubscribe(OrderObserver o) { observers.remove(o); }

    public void createOrder(Order order) {
        /* save order ... */
        for (OrderObserver o : observers) o.onOrderCreated(order);      // notify
    }
}
class InventoryUpdater implements OrderObserver {
    public void onOrderCreated(Order o) { /* decrease stock */ }
}
class EmailSender implements OrderObserver {
    public void onOrderCreated(Order o) { /* send confirmation */ }
}
class ActivityLogger implements OrderObserver {
    public void onOrderCreated(Order o) { /* record activity */ }
}
// الربط في الـ Composition Root
orderService.subscribe(new InventoryUpdater());
orderService.subscribe(new EmailSender());
orderService.subscribe(new ActivityLogger());
@@

<b>المشكلة:</b> مجموعة كائنات يتحدث كل منها مع كثير من الآخرين. مع $n$ كائناً، عدد الروابط المحتملة:
$$\frac{n(n-1)}{2}$$
عشرة كائنات تعني حتى 45 رابطاً، وكل كائن جديد يتطلب تعديل زملائه.

<b>الحل:</b> <b>Mediator</b> — كائن وسيط؛ كل كائن (<b>colleague</b>) يكلّم الوسيط فقط، والوسيط يقرر من يُبلَّغ. تصبح الروابط $n$ فقط.

تشبيه: برج المراقبة. الطائرات لا تنسّق فيما بينها؛ كلها تكلّم البرج.
@@
interface ChatMediator { void send(String msg, User from); }

class ChatRoom implements ChatMediator {                    // ConcreteMediator
    private final List<User> users = new ArrayList<>();
    void join(User u) { users.add(u); }
    public void send(String msg, User from) {
        for (User u : users) if (u != from) u.receive(from.name() + ": " + msg);
    }
}
class User {                                                // Colleague
    private final String name; private final ChatMediator room;
    User(String name, ChatMediator room) { this.name = name; this.room = room; }
    String name() { return name; }
    void say(String msg) { room.send(msg, this); }          // لا يعرف المستخدمين الآخرين
    void receive(String msg) { System.out.println(name + " got " + msg); }
}
@@

<b>الحل:</b> <b>Iterator</b> — كائن يعرف «أين وصلنا» ويعطي العنصر التالي بواجهة موحّدة: <code>hasNext()</code> و <code>next()</code>.
@@
class Playlist implements Iterable<Song> {
    private final Song[] songs; private int count;
    Playlist(int capacity) { songs = new Song[capacity]; }
    void add(Song s) { songs[count++] = s; }
    public Iterator<Song> iterator() {
        return new Iterator<Song>() {
            private int i = 0;                               // موضع التقدم
            public boolean hasNext() { return i < count; }
            public Song next() { return songs[i++]; }
        };
    }
}
for (Song s : playlist) { /* for-each تعمل مع أي Iterable */ }

C("Memento",R`
<b>المشكلة:</b> تريد حفظ حالة كائن لاسترجاعها لاحقاً (undo، نقاط حفظ، rollback) <b>دون كسر الـ encapsulation</b> — أي دون جعل حقوله الخاصة عامة.

<b>الحل:</b> <b>Memento</b> — الكائن نفسه ينتج «لقطة» مغلقة من حالته ويستطيع استرجاع نفسه منها.

الأدوار:
- <b>Originator</b>: صاحب الحالة؛ ينشئ الـ memento ويسترجع منه.
- <b>Memento</b>: اللقطة؛ immutable ولا يقرأ محتواها إلا الـ Originator.
- <b>Caretaker</b>: يحتفظ باللقطات (في stack مثلاً) ولا يفتحها.
@@
class Editor {                                              // Originator
    private String content = ""; private int cursor;
    void type(String s) { content += s; cursor = content.length(); }

    Snapshot save() { return new Snapshot(content, cursor); }
    void restore(Snapshot s) { content = s.content; cursor = s.cursor; }

    static final class Snapshot {                           // Memento
        private final String content; private final int cursor;   // private: مغلق على غير Editor
        private Snapshot(String c, int k) { content = c; cursor = k; }
    }
}
// Caretaker
Deque<Editor.Snapshot> history = new ArrayDeque<>();
history.push(editor.save());
editor.type("oops");
editor.restore(history.pop());

C("Visitor",R`
<b>المشكلة:</b> بنية كائنات <b>مستقرة الأنواع</b> (مثل شجرة عناصر مستند: Paragraph، Image، Table)، وتريد إضافة <b>عمليات</b> جديدة عليها باستمرار (تصدير HTML، عدّ الكلمات، تدقيق) دون تعديل تلك الـ classes كل مرة.

<b>الحل:</b> <b>Visitor</b> — ضع كل عملية في class مستقل فيه method لكل نوع عنصر. كل عنصر يملك method واحدة <code>accept(visitor)</code> تستدعي الـ method المناسبة لنوعه.
@@
interface DocVisitor { void visit(Paragraph p); void visit(Image i); }
interface DocElement { void accept(DocVisitor v); }

class Paragraph implements DocElement {
    String text;
    public void accept(DocVisitor v) { v.visit(this); }     // this نوعه Paragraph هنا
}
class Image implements DocElement {
    String url;
    public void accept(DocVisitor v) { v.visit(this); }
}
class HtmlExporter implements DocVisitor {                   // عملية جديدة = class جديد
    final StringBuilder out = new StringBuilder();
    public void visit(Paragraph p) { out.append("<p>").append(p.text).append("</p>"); }
    public void visit(Image i)     { out.append("<img src='").append(i.url).append("'>"); }
}
@@
الآلية تُسمّى <b>double dispatch</b>: الـ method المنفَّذة تتحدد بنوعين معاً — نوع العنصر (عبر <code>accept</code>) ونوع الزائر (عبر <code>visit</code>).

<b>الثمن الكبير:</b> إضافة <b>نوع عنصر</b> جديد (Table) تتطلب تعديل <b>كل</b> الـ visitors. فهو يناسب: أنواع ثابتة + عمليات متزايدة. والعكس يناسبه الـ polymorphism العادي.

للإحاطة: تجده في الـ compilers ومحلّلات الشجر (مثل <code>ast.NodeVisitor</code> في Python).

<b>المشكلة:</b> لديك <b>لغة صغيرة</b> تتكرر جملها وتريد تقييمها: تعابير حسابية، قواعد فلترة («السعر &gt; 100 و الفئة = كتب»)، صيغ بحث.

<b>الحل:</b> <b>Interpreter</b> — مثّل كل قاعدة من قواعد اللغة (<b>grammar</b>) بـ class، وابنِ من الجملة شجرة كائنات (<b>abstract syntax tree</b>)، ولكل عقدة method <code>interpret(context)</code>.
@@
interface Expr { boolean interpret(Map<String, Object> ctx); }

class GreaterThan implements Expr {                         // terminal expression
    final String field; final double value;
    GreaterThan(String f, double v) { field = f; value = v; }
    public boolean interpret(Map<String, Object> ctx) { return ((Number) ctx.get(field)).doubleValue() > value; }
}
class And implements Expr {                                 // non-terminal: يحتوي تعابير
    final Expr left, right;
    And(Expr l, Expr r) { left = l; right = r; }
    public boolean interpret(Map<String, Object> ctx) { return left.interpret(ctx) && right.interpret(ctx); }
}
Expr rule = new And(new GreaterThan("price", 100), new GreaterThan("stock", 0));

C("Model",R`
<b>MVC</b> يقسم التطبيق التفاعلي إلى ثلاثة أدوار. أولها <b>Model</b>: قلب التطبيق، وهو مستقل تماماً عن طريقة العرض.

مسؤولياته الأربع:
- <b>Application data</b>: يمثّل بيانات المجال (طلب، منتج، مستخدم).
- <b>Business rules / domain logic</b>: القواعد التي تجعل التطبيق ما هو عليه («لا يُشحن طلب غير مدفوع»).
- <b>Data validation</b>: رفض البيانات التي تخالف القواعد.
- <b>State management</b>: يحتفظ بالحالة الحالية ويغيّرها بطرق مضبوطة.

الاختبار الحاسم: هل تستطيع تشغيل الـ Model واختباره <b>دون أي واجهة</b> (لا HTML ولا أزرار)؟ إن كان يستورد شيئاً من كود العرض فالفصل مكسور.

! Model لا يعني «جدول قاعدة البيانات» فقط. هو كل منطق المجال، سواء حُفظ في قاعدة بيانات أم لا.

C("View",R`
<b>View</b>: الجزء الذي يراه المستخدم.

مسؤولياته:
- <b>Presenting information</b>: يحوّل بيانات الـ Model إلى شكل معروض (HTML، شاشة، JSON، PDF).
- <b>Displaying data</b>: يقرأ من الـ Model ولا يغيّره مباشرة.
- <b>User interface</b>: العناصر المرئية وتنسيقها.
- <b>Receiving user interaction</b>: يلتقط أفعال المستخدم (نقر، إدخال) <b>ويحوّلها</b> إلى الـ Controller. لا يقرر هو ما يحدث.

القاعدة: الـ View <b>لا يحتوي منطق عمل</b>. يجوز فيه منطق عرض فقط (حلقة لعرض قائمة، تنسيق تاريخ، إظهار عنصر أو إخفاؤه).

يمكن وجود <b>عدة Views للـ Model نفسه</b>: صفحة ويب، تطبيق هاتف، تقرير — وهذه من أهم فوائد الفصل.

C("Controller",R`
<b>Controller</b>: الوسيط بين المستخدم والنظام.

مسؤولياته:
- <b>Receives user requests</b>: يستقبل الفعل (نقرة، HTTP request).
- <b>Coordinates application operations</b>: يترجم الفعل إلى عمليات: يقرأ المدخلات، يقرر ماذا يُستدعى.
- <b>Communicates with the Model</b>: يطلب منه التنفيذ أو البيانات.
- <b>Selects the appropriate View</b>: يختار ما يُعرض كنتيجة (صفحة نجاح، نموذج بأخطاء، إعادة توجيه).

القاعدة الذهبية: <b>Thin controller, rich model</b>. الـ Controller ينسّق ولا يحتوي قواعد عمل. إن وجدت فيه حسابات وشروط عمل فهي في غير مكانها (<b>fat controller</b>).
@@
class OrderController {
    private final OrderService orders;                        // بوابة إلى الـ Model
    Response create(Request req) {
        OrderForm form = OrderForm.from(req);                  // قراءة المدخلات
        if (!form.isValid()) return view("order_form", form.errors());
        Order o = orders.place(form.customerId(), form.items());   // المنطق في الـ Model
        return redirect("/orders/" + o.id());                  // اختيار النتيجة
    }
}

C("MVC Interaction Flow",R`
التسلسل الأساسي (كما في الـ roadmap، مع خطوة مكمّلة):
- 1. المستخدم يتفاعل مع الـ <b>View</b>.
- 2. الـ <b>Controller</b> يستقبل الطلب.
- 3. الـ Controller ينسّق مع الـ <b>Model</b>.
- 4. الـ Model ينفّذ العمليات ويغيّر حالته.
- 5. الـ <b>View</b> يعرض النتيجة.

الخطوة 5 تتحقق بطريقتين حسب نوع MVC:

<b>Classic MVC</b> (تطبيقات سطح المكتب): الـ View <b>مشترك</b> (observer) في الـ Model، فحين يتغير الـ Model يُبلَّغ الـ View تلقائياً فيحدّث نفسه. هنا تجتمع ثلاثة design patterns: <b>Observer</b> (Model ← View)، <b>Strategy</b> (الـ Controller استراتيجية الـ View للتعامل مع المدخلات)، <b>Composite</b> (الـ View شجرة عناصر).

<b>Web MVC</b> (طلب/استجابة): لا اتصال دائم؛ الـ Controller يجلب البيانات من الـ Model و<b>يمرّرها</b> صراحة إلى الـ View لتوليد الرد، وينتهي كل شيء مع انتهاء الطلب.
@@t
 Web MVC:
 Browser --request--> Controller --call--> Model
                          |                  |
                          |<-----data--------+
                          +--data--> View --HTML--> Browser
@@
اتجاه الاعتماد هو الأهم: الـ View والـ Controller يعرفان الـ Model؛ <b>الـ Model لا يعرف أياً منهما</b>.

C("MVC vs. Traditional Monolithic Design — Separation of Concerns & Independent Components",R`
<b>Traditional monolithic design</b> هنا تعني: ملف أو class واحد يخلط كل شيء — قراءة المدخلات، SQL، قواعد العمل، وبناء HTML. (مثل صفحات PHP القديمة.)

ما يقدّمه MVC في المقابل هو <b>Separation of Concerns</b> مطبّقاً على ثلاثة شؤون، وينتج <b>مكوّنات مستقلة</b>:
- تغيير التصميم البصري لا يمسّ قواعد العمل.
- إضافة واجهة جديدة (REST API بجانب صفحات HTML) تعيد استخدام الـ Model نفسه.

<b>MVP</b> (Model–View–Presenter): الـ Presenter يحتوي كل منطق العرض ويتحكم بالـ View عبر interface، فيسهل اختباره بـ View وهمي.

<b>Advantages:</b>
- فصل واضح للمسؤوليات، وصيانة أسهل.

- قابلية اختبار عالية للـ Model.

<b>Limitations:</b>
- <b>تعقيد زائد</b> للتطبيقات الصغيرة جداً.
- <b>Fat controller</b> أو <b>fat model</b>: الـ pattern لا يحدد أين يذهب منطق التطبيق الذي يمسّ عدة models، فيتكدّس في أحد الطرفين. (الحل: Service Layer.)

C("Single Responsibility Principle (SRP)",R`
الصياغة الدقيقة: <b>يجب أن يكون للـ class سبب واحد فقط للتغيير</b>. و«سبب التغيير» يعني <b>جهة</b> (actor) تطلب التعديل: المحاسبة، التسويق، فريق قاعدة البيانات...

(الصياغة الشائعة «مسؤولية رئيسية واحدة» تقريبية وتقود إلى سوء فهم: SRP لا يعني أن الـ class يفعل شيئاً واحداً، بل أن جهة واحدة تملك أسباب تغييره.)
@@
class Employee {                       // ثلاث جهات = ثلاثة أسباب للتغيير
    double calculatePay() { return 0; }      // تطلبه المحاسبة
    String reportHours() { return ""; }      // تطلبه الموارد البشرية
    void save() { }                          // يطلبه فريق قاعدة البيانات
}
@@
الخطر العملي: تعديل طلبته المحاسبة يكسر تقرير الموارد البشرية لأنهما يتشاركان دالة مساعدة في الـ class نفسه.

الحل — <b>فصل المسؤوليات غير المترابطة</b>:
@@
class Employee { /* data only */ }
class PayCalculator      { double calculatePay(Employee e) { return 0; } }
class HoursReporter      { String report(Employee e) { return ""; } }
class EmployeeRepository { void save(Employee e) { } }
@@
هكذا نتجنب <b>الـ classes الكبيرة كثيرة المهام</b>. SRP هو High Cohesion بصياغة أدقّ.

! لا تبالغ: تفتيت كل شيء إلى classes بـ method واحدة يشتّت المنطق المترابط. ما يتغير معاً يبقى معاً.

C("Open/Closed Principle (OCP)",R`
الصياغة: الكيانات البرمجية (classes، modules، functions) يجب أن تكون <b>open for extension</b> و <b>closed for modification</b>.
- <b>مفتوحة للتمديد</b>: تستطيع إضافة سلوك جديد.
- <b>مغلقة للتعديل</b>: دون تغيير الكود الموجود المُختبَر.

كيف يجتمع الأمران؟ عبر <b>abstraction و polymorphism</b>: الكود الثابت يعتمد على تجريد، والسلوك الجديد يُضاف كتنفيذ جديد.
@@
// مخالف: كل شكل جديد = تعديل هذه الدالة
double area(Object s) {
    if (s instanceof Circle) { /* ... */ }
    else if (s instanceof Square) { /* ... */ }
    return 0;
}
// موافق: شكل جديد = class جديد فقط
interface Shape { double area(); }
double totalArea(List<Shape> shapes) {
    double sum = 0;
    for (Shape s : shapes) sum += s.area();
    return sum;
}
@@
كل الـ patterns التي تقول «أضف class جديداً دون تعديل الموجود» تطبيقات لـ OCP: Strategy، Decorator، Observer، Factory Method، State.

! OCP ليس «لا تعدّل الكود أبداً». لا يمكن إغلاق الكود أمام <b>كل</b> تغيير؛ اختر نقاط التمديد حيث أثبت التاريخ أن التغيير يتكرر. إصلاح bug تعديل مشروع دائماً.

C("Liskov Substitution Principle (LSP)",R`
الصياغة: <b>الـ subtypes يجب أن تكون قابلة للحلول محل الـ base types</b> دون أن ينكسر الكود الذي يستخدم النوع الأساسي. أي: كل ما يصحّ توقّعه من الأب يجب أن يصحّ من الابن.

الوراثة <b>الصحيحة</b> ليست «is-a» لغوياً، بل «<b>يتصرف مثل</b>». المثال الشهير:
@@
class Rectangle {
    protected int w, h;
    void setWidth(int w)  { this.w = w; }
    void setHeight(int h) { this.h = h; }
    int area() { return w * h; }
}
class Square extends Rectangle {                    // «المربع مستطيل» رياضياً...
    void setWidth(int w)  { this.w = w; this.h = w; }   // ...لكن يغيّر الارتفاع أيضاً!
    void setHeight(int h) { this.w = h; this.h = h; }
}
void resize(Rectangle r) {
    r.setWidth(5); r.setHeight(4);
    assert r.area() == 20;          // يفشل مع Square: 16
}
@@
قواعد <b>الحفاظ على السلوك المتوقع</b> عند الـ override (العقد):
- <b>Preconditions</b> (ما يشترطه الابن على المدخلات): لا تُشدَّد.
- <b>Postconditions</b> (ما يضمنه في النتيجة): لا تُرخى.
- <b>Invariants</b> (ما يبقى صحيحاً دائماً): تُحفظ.
- لا exceptions جديدة غير متوقعة.

علامات <b>override غير صالح</b>: method ترمي <code>UnsupportedOperationException</code>، method فارغة تُبطل سلوك الأب، أو كود مستخدِم يفحص <code>instanceof</code> ليعامل ابناً معاملة خاصة.

العلاج: لا تجعله subtype. استخدم composition أو واجهات أصغر.

C("Interface Segregation Principle (ISP)",R`
الصياغة: <b>لا يجب إجبار الـ client على الاعتماد على methods لا يستخدمها</b>. أي: <b>تجنّب الواجهات الكبيرة</b> (fat interfaces) وأنشئ <b>واجهات صغيرة مركّزة</b>.
@@
interface Machine {                       // واجهة سمينة
    void print(Document d);
    void scan(Document d);
    void fax(Document d);
}
class BasicPrinter implements Machine {
    public void print(Document d) { /* ok */ }
    public void scan(Document d) { throw new UnsupportedOperationException(); }   // مُجبَر!
    public void fax(Document d)  { throw new UnsupportedOperationException(); }
}
@@
الحل — واجهة لكل قدرة (<b>role interface</b>):
@@
interface Printer { void print(Document d); }
interface Scanner { void scan(Document d); }
interface Fax     { void fax(Document d); }
class BasicPrinter implements Printer { public void print(Document d) { } }
class OfficeMachine implements Printer, Scanner, Fax { /* ... */ }
@@
هكذا <b>نمنع الـ classes من تطبيق methods لا تحتاجها</b>.

الفائدة للطرفين: المطبِّق لا يكتب methods وهمية (وهي مخالفة LSP أيضاً)، والـ client يعتمد على أقل ما يلزمه، فلا يتأثر بتغيير method لا يستعملها.

قاعدة التصميم: صمّم الواجهة من منظور <b>من يستخدمها</b> لا من منظور من يطبّقها.

C("Dependency Inversion Principle (DIP)",R`
مصطلحان أولاً: <b>High-level module</b> هو كود السياسات وقواعد العمل (<code>OrderService</code>). <b>Low-level module</b> هو كود التفاصيل التقنية (قاعدة بيانات، بريد، ملفات).

الصياغة:
- الـ high-level modules <b>لا تعتمد مباشرة</b> على الـ low-level modules؛ <b>كلاهما يعتمد على abstractions</b>.
- الـ abstractions لا تعتمد على التفاصيل؛ التفاصيل تعتمد على الـ abstractions.
@@t
 Before:  OrderService ---------> MySqlOrderRepository

 After:   OrderService ---------> «interface» OrderRepository
                                         /_\
                                          :
                                  MySqlOrderRepository
@@
لماذا «<b>inversion</b>»؟ في التصميم التقليدي سهم الاعتماد يتجه من الأعلى إلى الأسفل. الآن الـ class السفلي هو من يشير <b>إلى أعلى</b> نحو واجهة <b>يملكها</b> المستوى الأعلى. انعكس اتجاه الاعتماد عكس اتجاه التنفيذ.

<b>Dependency Inversion ≠ Dependency Injection</b>:
- <b>DIP</b> مبدأ تصميم: <b>على ماذا</b> تعتمد؟ (على تجريد.)
- <b>DI</b> تقنية: <b>كيف يصلك</b> التنفيذ؟ (يُمرَّر من الخارج.)

يعملان معاً: DIP يعرّف الواجهة، و DI يوصل التنفيذ. النتيجة <b>تقليل الاعتمادات على concrete classes</b>، فتستطيع تبديل قاعدة البيانات أو اختبار قواعد العمل بتنفيذ في الذاكرة.

! لا تعرّف واجهة لكل class. طبّق DIP على <b>الحدود</b>: حيث يلتقي منطق العمل بتفاصيل متقلبة (I/O، خدمات خارجية).

C("Principle of Least Knowledge (Law of Demeter)",R`
المبدأ: <b>الكائن يجب أن يعرف أقل قدر ممكن عن الكائنات الأخرى</b>. يُلخَّص بـ «كلّم أصدقاءك المباشرين فقط، لا تكلّم الغرباء».

بدقة — الـ method تستدعي methods على:
- الكائن نفسه (<code>this</code>).
- الـ parameters التي استلمتها.
- الكائنات التي أنشأتها.
- الـ fields المباشرة لكائنها.

ولا تستدعي على <b>كائن أعاده استدعاء آخر</b>. المخالفة النموذجية — <b>سلسلة استدعاءات طويلة</b> (train wreck):
@@
// مخالف: هذا الكود يعرف أن Order فيه Customer فيه Address فيه City
String city = order.getCustomer().getAddress().getCity().getName();

// موافق: اسأل الصديق المباشر
String city = order.shippingCityName();
@@
لماذا هي مشكلة؟ الكود صار مقترناً بـ <b>بنية</b> أربعة classes. أي تغيير في أحدها يكسره.

المبدأ المكمّل: <b>Tell, Don't Ask</b> — لا تسحب بيانات كائن لتتخذ قراراً عنه؛ <b>اطلب منه</b> أن يتصرف.
@@
if (account.getBalance() >= amount) account.setBalance(account.getBalance() - amount);   // Ask
account.withdraw(amount);                                                                // Tell
@@

C("Least Knowledge: الاستثناءات والثمن",R`
تطبيق المبدأ يعطيك <b>اعتمادات غير ضرورية أقل</b> و<b>مكوّنات أكثر استقلالاً</b>. لكن له حدود:

<b>ليست كل سلسلة نقاط مخالفة.</b> المبدأ عن عبور <b>كائنات مختلفة ذات سلوك</b>، لا عن عدد النقاط:
- <b>Fluent APIs</b> و builders: <code>builder.method("POST").timeout(2000).build()</code> — كل استدعاء يعيد الكائن نفسه.
- عمليات المجموعات: <code>list.stream().filter(...).map(...)</code>.
- هياكل البيانات البسيطة (DTO) التي لا سلوك لها.

<b>الثمن:</b> التطبيق الحرفي يملأ الـ classes بـ methods تمرير صغيرة (wrapper methods) لا تفعل شيئاً سوى التفويض، وهذا بدوره code smell اسمه <b>Middle Man</b>.

الميزان: طبّقه بصرامة عند <b>حدود</b> الـ modules؛ تساهل داخل الـ module الواحد المتماسك.

C("Composition Over Inheritance",R`
درسنا الأساس في 0.2؛ الآن نرى <b>كيف</b> يُطبَّق.

<b>تجنّب الأهرام العميقة:</b> هرم من 5 مستويات يعني أن فهم class واحد يتطلب قراءة خمسة، وتغييراً في الأعلى يهزّ كل ما تحته (<b>fragile base class problem</b>).

<b>Runtime behavior composition:</b> السلوك كائن يُبدَّل أثناء التشغيل (Strategy، State، Decorator كلها تطبيقات).

<b>Interfaces + delegation</b> هي الصيغة العملية:
@@
// بدل: class LoggedArrayList extends ArrayList  (يرث 30 method لا تتحكم بها)
class AuditedList<T> implements Iterable<T> {            // interface للنوع
    private final List<T> items = new ArrayList<>();      // composition
    private final AuditLog log;
    AuditedList(AuditLog log) { this.log = log; }
    public void add(T item) { log.record("add"); items.add(item); }    // delegation
    public Iterator<T> iterator() { return items.iterator(); }
}
@@
تحصل على <b>اعتماد أقل على الوراثة</b>: الـ class يكشف فقط ما يريد، ولا ينكسر إن تغيّر تنفيذ <code>ArrayList</code> داخلياً.

متى تبقى الوراثة مناسبة؟ علاقة is-a حقيقية تحترم LSP، هرم قليل العمق، وأب صُمّم ليُورَّث (مثل Template Method).

الصياغة: <b>كل معلومة (knowledge) يجب أن يكون لها تمثيل واحد موثوق في النظام</b>.

DRY عن تكرار <b>المعرفة</b> لا تكرار <b>النص</b>. قاعدة «الخصم 10% لمن اشترى فوق 500» إن كُتبت في ثلاثة أماكن فستُعدَّل يوماً في اثنين وتُنسى في الثالث.

الفخ المعاكس: كودان <b>يتشابهان صدفة</b> لكنهما يمثّلان قاعدتين مختلفتين (تحقق من عمر المستخدم = 18، وحدّ أدنى لكمية الطلب = 18). دمجهما يربط شيئين سيتغيران باستقلال، وينتج تجريداً خاطئاً بـ flags كثيرة.

C("KISS (Keep It Simple, Stupid)",R`
المبدأ: <b>أبسط حل يؤدي المطلوب هو الأفضل</b>. الكود يُقرأ أكثر مما يُكتب بكثير، والتعقيد غير الضروري كلفة دائمة على كل قارئ.

علامات مخالفته: طبقات تجريد لا يبررها شيء، «حل ذكي» في سطر واحد لا يفهمه أحد، framework داخلي لمشكلة تحلّها دالة.

«بسيط» لا تعني «ساذج» ولا «أقل أسطراً»؛ تعني <b>سهل الفهم والتعديل</b>. أحياناً class إضافي يجعل الكود أبسط.

يمكن قياس التعقيد تقريبياً بـ <b>cyclomatic complexity</b> — عدد المسارات المستقلة في الدالة:
$$M = E - N + 2P$$
حيث $E$ عدد الأسهم و $N$ عدد العقد في مخطط تدفق الدالة و $P$ عدد المكوّنات المتصلة. عملياً لدالة واحدة: $M = \text{عدد نقاط التفرّع} + 1$. دالة بلا شروط لها $M = 1$، وكل <code>if</code> أو <code>for</code> أو <code>case</code> يضيف واحداً. فوق $10$ تقريباً تصبح الدالة صعبة الاختبار.

C("YAGNI (You Aren't Gonna Need It)",R`
المبدأ: <b>لا تبنِ شيئاً حتى تحتاجه فعلاً</b>، لا حين تتوقع أنك «قد» تحتاجه.

لماذا؟ الميزة التخمينية لها أربع كلف: كلفة بنائها، كلفة ما لم تبنه بدلها، كلفة حملها (تعقيد دائم في كل تعديل لاحق)، وكلفة إصلاحها حين يتبيّن أن التخمين كان خاطئاً — وهو غالباً خاطئ.

أمثلة: دعم «عدة قواعد بيانات» ولا خطة لتغيير الحالية؛ نظام plugins لميزة واحدة؛ حقول «للمستقبل».

YAGNI <b>لا يعني</b> إهمال جودة التصميم. يعني: حافظ على الكود <b>نظيفاً وسهل التغيير</b> اليوم، فتستطيع إضافة ما تحتاجه غداً بسهولة. الـ tests والـ refactoring هما ما يجعل YAGNI آمناً.

C("What Are Code Smells? — Code Smells vs. Bugs",R`
<b>Code smell</b>: علامة ظاهرة في الكود <b>توحي</b> بمشكلة أعمق في التصميم. المصطلح من Kent Beck واشتهر في كتاب «Refactoring» لـ Martin Fowler.

كلمة «توحي» مهمة: الـ smell <b>مؤشر</b> يستدعي الفحص، لا حكم نهائي. مثل رائحة غريبة في المطبخ: قد تكون غازاً متسرباً وقد تكون جبناً فاخراً.

<b>Smell مقابل Bug:</b>

<tr><td>من يتضرر؟</td><td>المستخدم الآن</td><td>المطوّر لاحقاً</td></tr>
<tr><td>العلاج</td><td>تصحيح السلوك</td><td>Refactoring (السلوك لا يتغير)</td></tr></table></div>
لكنهما مرتبطان: الكود ذو الـ smells الكثيرة تتكاثر فيه الـ bugs لأن كل تعديل فيه مخاطرة.

C("Code Smells vs. Anti-Patterns — Maintainability — Code Review",R`
<b>Smell مقابل Anti-pattern:</b>
- <b>Code smell</b>: عَرَض <b>محلي</b> صغير تراه في class أو method.
- <b>Anti-pattern</b>: <b>حل</b> شائع لمشكلة متكررة يبدو جذاباً لكنه يعطي نتائج سيئة، وغالباً على مستوى أوسع (تصميم، معمار، طريقة عمل). الـ anti-pattern «pattern سيئ» له اسم ووصف وعلاج معروف.

<b>كيف يؤثر التصميم الضعيف على الـ maintainability</b> (قابلية الصيانة): كل اختصار سيئ يشبه دَيناً بفائدة — يُسمّى <b>technical debt</b>. تدفع الفائدة في كل تعديل لاحق: وقت أطول للفهم، تغييرات تنتشر، أخطاء جانبية، وخوف من لمس الكود.

<b>كشف مشاكل التصميم في الـ code review:</b> المراجعة ليست بحثاً عن الأخطاء الإملائية. أسئلة المراجع:
- هل أفهم ما يفعله هذا الكود دون شرح صاحبه؟
- إن تغيّر المطلب X، كم ملفاً سأعدّل؟
- هل لكل class ودالة غرض واحد واضح؟
- هل أستطيع اختبار هذا بسهولة؟

تسمية الـ smells بأسمائها القياسية تجعل الملاحظة موضوعية: «هذه Feature Envy» أدقّ من «لا يعجبني هذا».

C("Bloaters: Long Method، Large Class، Long Parameter List",R`
<b>Bloaters</b>: كود «انتفخ» حتى صعب التعامل معه. يتكوّن تدريجياً: سطر هنا وحقل هناك.

<b>Long Method</b> — method تؤدي عمليات كثيرة. العلامات: تحتاج تمريراً لقراءتها، فيها تعليقات تفصل «أقساماً»، مستويات تداخل عميقة. القاعدة: إن احتجت تعليقاً لشرح مقطع، فذلك المقطع يستحق method باسمه.
<br>العلاج: Extract Method.

<b>Large Class</b> — class له مسؤوليات كثيرة (مخالفة SRP). العلامات: عشرات الـ fields والـ methods، مجموعات fields لا تُستخدم معاً، اسم غامض مثل Manager أو Processor أو Helper.
<br>العلاج: Extract Class.

<b>Long Parameter List</b> — method تتطلب parameters كثيرة (أكثر من ثلاثة أو أربعة علامة تحذير). صعبة القراءة وسهلة الخطأ في الترتيب، خصوصاً مع عدة parameters من النوع نفسه أو boolean flags.
@@
createUser("Sara", "Ali", "sara@x.com", "0555", true, false, null, 3);   // ما معنى true false null 3؟
@@
العلاج: Introduce Parameter Object، أو Builder، أو تمرير الكائن كله بدل حقوله.

C("Bloaters: Data Clumps و Primitive Obsession",R`
<b>Data Clumps</b> — المجموعة نفسها من البيانات تظهر معاً مراراً: كـ parameters في دوال كثيرة أو كـ fields في عدة classes.
@@
void schedule(Date start, Date end) { }
boolean overlaps(Date start, Date end) { return false; }
int days(Date start, Date end) { return 0; }       // start و end دائماً معاً
@@
الاختبار: احذف واحداً منها؛ هل يفقد الباقي معناه؟ إن نعم فهي كائن ينتظر أن يولد (<code>DateRange</code>). العلاج: Extract Class / Introduce Parameter Object. والمكسب: السلوك المتعلق بها (<code>overlaps</code>، <code>days</code>) يجد بيتاً.

<b>Primitive Obsession</b> — استخدام أنواع بدائية (<code>String</code>، <code>int</code>، <code>double</code>) لمفاهيم لها معنى وقواعد في المجال: بريد إلكتروني كـ String، مبلغ مالي كـ double، رقم هاتف، حالة كرقم.

المشاكل: لا تحقق مركزي (كل مكان يتحقق أو ينسى)، لا حماية من الخلط (تمرير <code>userId</code> مكان <code>orderId</code> وكلاهما <code>int</code>)، والسلوك مبعثر.
@@
double price = 19.99;                 // أي عملة؟ وأخطاء تقريب floating point
Money price = Money.of(1999, "USD");  // value object: تحقق + سلوك + معنى
@@
العلاج: <b>value object</b> صغير immutable (Replace Primitive with Object).

C("Change Preventers: Divergent Change و Shotgun Surgery",R`
<b>Change Preventers</b>: بنية تجعل التغيير مؤلماً. الاثنان وجهان متعاكسان:

<b>Divergent Change</b> — <b>class واحد يتغير لأسباب كثيرة غير مترابطة</b>. تعدّل <code>Product</code> حين يتغير التسعير، وحين يتغير العرض، وحين تتغير قاعدة البيانات. (هذا عَرَض مخالفة SRP.)
<br>العلاج: Extract Class — افصل كل سبب تغيير.

<b>Shotgun Surgery</b> — <b>تغيير واحد يتطلب تعديلات صغيرة في classes كثيرة</b>. إضافة عملة جديدة تمسّ 15 ملفاً. خطورته أنك ستنسى موضعاً.
<br>العلاج: Move Method / Move Field — اجمع ما يتغير معاً في مكان واحد.

C("Dispensables: Duplicate Code و Speculative Generality",R`
<b>Dispensables</b>: أشياء لو أُزيلت صار الكود أنظف.

<b>Duplicate Code</b> — منطق متشابه مكرر دون داعٍ (مخالفة DRY). أشكاله:
- المقطع نفسه في methodين في class واحد ← Extract Method.
- في classين شقيقين ← Extract Method ثم Pull Up Method إلى الأب (أو Template Method إن تشابه الهيكل واختلفت خطوات).
- في classes غير مترابطة ← Extract Class يستخدمه الاثنان.

الأخطر هو التكرار <b>غير الحرفي</b>: كودان يفعلان الشيء نفسه بصياغتين مختلفتين.

<b>Speculative Generality</b> — تجريدات أُنشئت لحاجات مستقبلية افتراضية (مخالفة YAGNI). العلامات:
- abstract class له ابن واحد.
- interface بتنفيذ واحد لا يُستبدل ولا يُختبر بمعزل.
- parameters و hooks لا يستخدمها أحد.
- classes لا تُستدعى إلا من الاختبارات.

العلاج: Collapse Hierarchy، Inline Class، Remove Parameter — احذف التجريد وأعده حين تثبت الحاجة.

C("Couplers: Feature Envy و Inappropriate Intimacy",R`
<b>Couplers</b>: smells تدل على اقتران زائد بين classes.

<b>Feature Envy</b> — method «تحسد» class آخر: تستخدم بيانات ذلك الـ class أكثر مما تستخدم بيانات class-ها.
@@
class InvoicePrinter {
    double total(Order o) {                    // كل ما تستخدمه من Order
        double sum = 0;
        for (Line l : o.getLines()) sum += l.getPrice() * l.getQty();
        return sum - o.getDiscount() + o.getShipping();
    }
}
@@
العلاج: Move Method — انقلها إلى حيث البيانات (<code>order.total()</code>). القاعدة: <b>ضع السلوك مع البيانات التي يعمل عليها</b>.

(استثناء مقصود: patterns مثل Strategy و Visitor تفصل السلوك عن البيانات عمداً.)

<b>Inappropriate Intimacy</b> — classان يعتمد كل منهما <b>على التفاصيل الداخلية</b> للآخر: يقرأ حقوله الخاصة، يعتمد على ترتيب استدعاءاته الداخلي، أو بينهما اعتماد دائري (<b>bidirectional dependency</b>). لا يمكن فهم أو تغيير أحدهما دون الآخر.
<br>العلاج: Move Method/Field لتقليل التشابك، Extract Class للجزء المشترك، Hide Delegate، أو تحويل العلاقة إلى اتجاه واحد. (سُمّي في الطبعة الثانية من Refactoring: Insider Trading.)

<b>Message Chains</b> — كائن يطلب كائناً، ومنه كائناً، ومنه كائناً...

هذا هو خرق Law of Demeter: الـ client مقترن ببنية التنقل كلها.
<br>العلاج: <b>Hide Delegate</b> — أضف method على الكائن الأول تخفي ما وراءه (<code>order.shippingZip()</code>)، أو انقل السلوك الذي يحتاج تلك البيانات إلى صاحبها.

<b>Middle Man</b> — class <b>لا يفعل شيئاً سوى تمرير الاستدعاءات</b> إلى class آخر دون إضافة قيمة.

    private final OrderService svc;
    void create(Order o) { svc.create(o); }
    void cancel(Order o) { svc.cancel(o); }
    Order find(int id)   { return svc.find(id); }     // تمرير فقط
}
@@
العلاج: <b>Remove Middle Man</b> — دع الـ client يكلّم الكائن الحقيقي.

<b>Switch Statements</b> (الاسم الأحدث: <b>Repeated Switches</b>) — منطق شرطي <b>متكرر</b> على النوع نفسه يوحي بأن السلوك يجب أن يعيش في classes متعددة الأشكال.
@@

    return 0;
}

    switch (s.type) { case CIRCLE: return 0; case SQUARE: return 0; }   // نفس الـ switch مرة أخرى

@@
المشكلة ليست وجود <code>switch</code>! switch واحد في factory مقبول تماماً. المشكلة <b>تكراره</b>: كل نوع جديد يتطلب إيجاد وتعديل كل نسخة (Shotgun Surgery).

<b>God Object</b> (God Class) — كائن واحد <b>يتحكم في جزء كبير جداً من التطبيق</b>: يعرف كل شيء ويفعل كل شيء، وبقية الـ classes مجرد حاملات بيانات حوله. هو Large Class في أقصى صوره مع مركزية تحكم.

<br>العلاج: تفكيك تدريجي بـ Extract Class و Move Method، مسؤولية بعد مسؤولية — لا إعادة كتابة شاملة.

C("God Object، Spaghetti Code، Big Ball of Mud",R`
ثلاثة anti-patterns عن <b>غياب البنية</b>، بمستويات مختلفة:

<b>God Object</b> — رأيناه كـ smell؛ يُعدّ anti-pattern حين يكون <b>أسلوب تصميم</b>: «نضع كل المنطق في class مركزي واحد». جذره التفكير الإجرائي بثوب OOP.

<b>Spaghetti Code</b> — كود <b>تدفّق التحكم</b> فيه متشابك كالمعكرونة: قفزات، شروط متداخلة بعمق، متغيرات global، دوال طويلة تستدعي بعضها بلا نظام. لا تستطيع تتبّع ما يحدث من البداية إلى النهاية. المستوى: الدوال والملفات.

<b>Big Ball of Mud</b> — نظام كامل <b>بلا معمار يمكن تمييزه</b>: كل شيء يعتمد على كل شيء، لا طبقات ولا حدود بين الـ modules. المستوى: النظام كله. ينشأ عادة من ضغط المواعيد وتراكم الترقيعات دون refactoring.

ثلاثة anti-patterns عن <b>عادات المطورين</b>:

<b>Golden Hammer</b> — «من لا يملك إلا مطرقة يرى كل شيء مسماراً». استخدام الأداة أو التقنية أو الـ pattern <b>المفضّل</b> لكل مشكلة سواء ناسبها أم لا: قاعدة بيانات علائقية لكل شيء، microservices لتطبيق صغير، أو Singleton و Factory في كل class.
<br>العلاج: ابدأ من المشكلة، وقارن بديلين على الأقل.

<b>Lava Flow</b> — كود ميت أو غامض بقي في النظام <b>لأن أحداً لا يجرؤ على حذفه</b>: «لا نعرف ماذا يفعل، لكن ربما يعتمد عليه شيء». كالحمم التي تجمّدت في مكانها. ينشأ من كود تجريبي دخل الإنتاج ومن غياب الاختبارات والتوثيق.
<br>العلاج: اختبارات، أدوات كشف الكود غير المستخدم، والثقة في version control (الحذف ليس نهائياً).

<b>Copy-Paste Programming</b> — إنتاج الكود بنسخ مقاطع موجودة وتعديلها قليلاً بدل استخراج تجريد مشترك. يولّد Duplicate Code بالجملة، وكل bug في الأصل يتكاثر في النسخ.
<br>العلاج: Extract Method/Class عند التكرار الثالث؛ وافهم الكود قبل نسخه.

C("Premature Optimization و Overengineering",R`
anti-patternان عن <b>بذل الجهد في المكان أو الوقت الخطأ</b>:

<b>Premature Optimization</b> — تحسين الأداء <b>قبل معرفة</b> أين المشكلة فعلاً، على حساب وضوح الكود. قول Donald Knuth المشهور: «التحسين السابق لأوانه أصل كل شر» — في نحو 97% من الحالات.

لماذا؟ توقعات المطورين عن مواضع البطء خاطئة غالباً. قانون تقريبي: معظم زمن التنفيذ يُصرف في جزء صغير من الكود. فتحسين الباقي كلفة تعقيد بلا مكسب.

المنهج الصحيح: اجعله يعمل ← اجعله نظيفاً ← <b>قِس</b> (profiling) ← حسّن ما أثبت القياس أنه عنق الزجاجة.

! هذا لا يبرر الإهمال: اختيار بنية بيانات مناسبة وتجنب الاستعلامات داخل الحلقات (N+1) تصميم سليم لا تحسين سابق لأوانه.

<b>Overengineering</b> — بناء حل <b>أعقد أو أعمّ مما تتطلبه المشكلة</b>: طبقات تجريد زائدة، patterns بلا مشكلة، قابلية إعداد لا يستخدمها أحد. هو مخالفة KISS و YAGNI معاً، و Speculative Generality أحد أعراضه في الكود.

العلامة: شرح «كيف يعمل» يستغرق أطول من شرح «ماذا يفعل».

التوازن: العكس (<b>underengineering</b>) خطأ أيضاً. الهدف تعقيد <b>متناسب</b> مع المشكلة الحالية، مع إبقاء الكود سهل التغيير.

C("Extract Method و Rename Method",R`
<b>القاعدة الأولى للـ refactoring:</b> خطوات <b>صغيرة</b>، وتشغيل الاختبارات بعد كل خطوة. إن فشل اختبار فالسبب آخر تغيير صغير.

<b>Extract Method</b> — خذ مقطعاً من method طويلة وضعه في method جديدة <b>اسمها يشرح الغرض</b>. أكثر التقنيات استخداماً.
@@
// before
void printInvoice(Order o) {
    double total = 0;
    for (Line l : o.lines()) total += l.price() * l.qty();
    total = total * 1.19;
    System.out.println("Customer: " + o.customer());
    System.out.println("Total: " + total);
}
// after
void printInvoice(Order o) {
    double total = totalWithTax(o);
    printDetails(o, total);
}
private double totalWithTax(Order o) {
    double subtotal = 0;
    for (Line l : o.lines()) subtotal += l.price() * l.qty();
    return subtotal * TAX_MULTIPLIER;
}
private void printDetails(Order o, double total) {
    System.out.println("Customer: " + o.customer());
    System.out.println("Total: " + total);
}
@@
الـ method الأصلية صارت تُقرأ كفهرس. المتغيرات المحلية التي يحتاجها المقطع تصبح parameters، وما ينتجه يصبح قيمة مُرجعة.

<b>Rename Method</b> (ومثلها Rename Variable/Class) — غيّر الاسم ليقول ما يفعله الكود. <code>calc()</code> ← <code>calculateMonthlyInterest()</code>. تبدو تافهة لكنها من أعلى التقنيات عائداً: الاسم الجيد يغني عن التعليق. استخدم أداة الـ IDE لتتغير كل المواضع معاً.

C("Extract Class، Move Method، Move Field",R`
ثلاث تقنيات لإعادة <b>توزيع المسؤوليات</b>:

<b>Extract Class</b> — class يؤدي عمل اثنين؟ أنشئ class جديداً وانقل إليه الـ fields والـ methods المترابطة. علاج Large Class و Divergent Change و Data Clumps.
@@
// before: Person يحمل تفاصيل الهاتف
class Person { String name; String areaCode; String number; String formattedPhone() { return ""; } }
// after
class PhoneNumber { String areaCode; String number; String formatted() { return ""; } }
class Person { String name; PhoneNumber phone; }
@@
<b>Move Method</b> — method تستخدم بيانات class آخر أكثر من class-ها؟ انقلها إليه. علاج Feature Envy و Shotgun Surgery.

<b>Move Field</b> — field يُستخدم في class آخر أكثر من class-ه؟ انقله.

الخطوات الآمنة للنقل:
- 1. انسخ الـ method إلى الـ class الهدف وعدّلها لتعمل هناك.
- 2. اجعل القديمة تفوّض إلى الجديدة. (شغّل الاختبارات.)
- 3. حوّل المستدعين واحداً واحداً. (شغّل الاختبارات.)
- 4. احذف القديمة.

المبدأ الموجِّه لثلاثتها: <b>اجمع ما يتغير معاً، وضع السلوك بجوار بياناته</b>.

// before
double pay(Employee e) {
    switch (e.type) {
        case SALARIED:   return e.monthlySalary;
        case HOURLY:     return e.hours * e.rate;
        case COMMISSION: return e.base + e.sales * 0.1;
    }
    throw new IllegalStateException();
}
// after
interface PayPolicy { double pay(); }
class Salaried   implements PayPolicy { double monthly;       public double pay() { return monthly; } }
class Hourly     implements PayPolicy { double hours, rate;   public double pay() { return hours * rate; } }
class Commission implements PayPolicy { double base, sales;   public double pay() { return base + sales * 0.1; } }
@@
يبقى شرط واحد فقط: عند <b>الإنشاء</b> (داخل factory). كل ما بعده polymorphism.

هذه التقنية هي الجسر بين الـ refactoring والـ patterns: نتيجتها Strategy أو State. وحالة خاصة مفيدة: <b>Null Object</b> — بدل تكرار <code>if (x == null)</code>، كائن «فارغ» يطبّق الواجهة ولا يفعل شيئاً (<code>NoDiscount</code>، <code>NullLogger</code>).

متى لا تُستخدم؟ شرط واحد غير مكرر، أو شرط على <b>قيم</b> لا على أنواع (<code>if (age &gt; 18)</code>).

C("Introduce Parameter Object و Encapsulate Field",R`
<b>Introduce Parameter Object</b> — مجموعة parameters تسافر معاً؟ اجمعها في كائن واحد. علاج Long Parameter List و Data Clumps.
@@
// before
List<Sale> find(Date from, Date to, String region, int minAmount) { return null; }
// after
class SalesQuery { DateRange period; String region; int minAmount; }

@@
المكسب الخفي: الكائن الجديد يجذب سلوكاً كان مبعثراً (<code>period.contains(date)</code>).

<b>Encapsulate Field</b> — field عام؟ اجعله private ووفّر وصولاً مضبوطاً.
@@
// before
class Account { public double balance; }
// after
class Account {
    private double balance;
    public double balance() { return balance; }
    public void deposit(double amount) {
        if (amount <= 0) throw new IllegalArgumentException();
        balance += amount;
    }
}
@@
الأفضل ألا تكتفي بـ getter/setter، بل تقدّم <b>عمليات ذات معنى</b> (<code>deposit</code> لا <code>setBalance</code>). ومع المجموعات: لا تُرجع القائمة الداخلية نفسها (<b>Encapsulate Collection</b>)؛ أرجع نسخة للقراءة ووفّر <code>add/remove</code>.
